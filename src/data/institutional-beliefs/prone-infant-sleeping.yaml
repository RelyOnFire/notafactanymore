schemaVersion: 2
title: Prone infant sleeping
entryId: babies-should-sleep-face-down
proposition:
  summary: Healthy infants were advised to sleep prone, or on their stomachs, because the position was treated as safe or preferable, including from concern that babies sleeping on their backs might aspirate vomit.
correction:
  summary: For healthy infants, prone sleep substantially increases the risk of sudden infant death syndrome and other sleep-related infant deaths. Supine sleep is recommended for routine infant sleep; placing healthy infants on their backs does not produce the feared increase in fatal aspiration.
category: Pediatrics and public health
reviewedAt: 2026-08-22
episodes:
  - id: australia-1970-1991
    polity: Australia
    region: Oceania
    startYear: 1970
    endYear: 1991
    strength: institutionally-influential
    institutionTypes: [medical, professional, education]
    institutions:
      - Pediatric and maternal-child health professionals
      - Hospitals and infant-care services
      - Health-education advice to parents
    consequences:
      - Widespread prone sleeping among healthy infants
      - Increased exposure to SIDS risk
      - Delayed reversal of infant-sleep advice
    summary: During the 1970s and 1980s, prone sleeping became increasingly common among healthy Australian infants as health professionals and infant-care literature repeated advice that had not been scientifically tested. Evidence linking prone sleep to SIDS accumulated, but sleeping position was not initially accepted by the medical community as a causal risk factor. Australian research prompted a national reversal in 1991, when health campaigns and the NHMRC advised that healthy babies generally should not sleep prone.
    mechanism:
      kind: education
      summary: >-
        Health professionals, hospitals, infant-care services and parent-education materials repeated prone-sleep advice,
        making an untested recommendation part of routine infant-care guidance.
    institutionalCorrection:
      status: corrected
      periodLabel: '1991'
      action: National health campaigns and the NHMRC advised that healthy babies generally should not sleep prone.
      summary: >-
        Australian research prompted a national reversal in 1991, when health campaigns and the NHMRC advised against
        routine prone sleep for healthy infants.
  - id: east-germany-1971-1972
    polity: East Germany
    region: Eastern Europe
    startYear: 1971
    endYear: 1972
    strength: officially-endorsed
    institutionTypes: [government, medical, education]
    institutions:
      - Pediatric services of the German Democratic Republic
      - State day-care health system
      - Ministry of Health
    consequences:
      - Prone placement of infants in state day care
      - Preventable infant deaths
      - Rapid reversal of official child-care guidance
    summary: Pediatricians in East Germany followed the international recommendation that infants sleep prone, and the practice was used in the state day-care system. After seven infants died while sleeping prone in day care in 1971, the Ministry of Health reviewed the deaths and in June 1972 issued guidelines sharply restricting prone positioning during sleep and limiting it to supervised exercise while awake.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Pediatric services and the state day-care system adopted prone positioning as routine infant-care practice under
        official health administration.
    institutionalCorrection:
      status: corrected
      periodLabel: June 1972
      action: Ministry of Health guidelines sharply restricted prone positioning during sleep and limited it to supervised exercise while awake.
      summary: >-
        After reviewing seven 1971 day-care deaths, the East German Ministry of Health rapidly reversed official guidance
        and sharply restricted prone sleeping.
