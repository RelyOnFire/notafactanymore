    relation: supports
    target: {scope: episode, episodeId: bolivia-2020-2023, aspect: consequences}
    locator: Table 1 and discussion, pp. 448–449
    note: >-
      Provides empirical toxicity context for the exposure risk created when institutions normalize chlorine-dioxide use;
      it does not estimate how many Bolivians used the product under Law 1351.
  - id: chlorine-rct-episode-context
    sourceId: chlorine-mouthwash-rct
    relation: contextualizes
    target: {scope: episode, episodeId: bolivia-2020-2023, aspect: context}
    locator: Abstract and trial registration jRCTs031230566
    note: >-
      Later randomized evidence on a dilute mouth rinse found no viral-titer benefit over water and cannot be generalized
      into support for the oral or parenteral administration contemplated by pandemic cure claims.
  - id: chlorine-tcp-2023-limitation
    sourceId: chlorine-tcp-2023
    relation: documents
    target: {scope: episode, episodeId: bolivia-2020-2023, aspect: institutional-correction}
    locator: Sections III.4 and Por Tanto
    note: >-
      In a separate case, the Tribunal confirmed denial of relief because the claimant did not prove a timely refusal or
      causation. The ruling limited the requested remedy on the record before it; it did not invalidate the statute or
      scientifically validate chlorine dioxide.
