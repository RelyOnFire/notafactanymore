schemaVersion: 2
locale: de
entryId: molotov-ribbentrop-secret-protocol-denial
sourceReviewedAt: '2026-08-25'
title: Das geheime Zusatzprotokoll zum Molotow-Ribbentrop-Pakt als westliche Fälschung
proposition:
  summary: >-
    Sowjetische Institutionen hielten nach dem Krieg an einer offiziellen Geschichtsdarstellung fest, in der die im
    Westen veröffentlichten Belege für ein geheimes Zusatzprotokoll zum deutsch-sowjetischen Nichtangriffspakt von 1939
    als gefälscht oder nicht authentisch behandelt wurden. Damit wurde ein tatsächlich bestehendes Abkommen bestritten,
    das Osteuropa in deutsche und sowjetische Interessensphären aufteilte.
correction:
  summary: >-
    Die Sowjetunion und NS-Deutschland unterzeichneten am 23. August 1939 neben dem öffentlichen Nichtangriffsvertrag ein
    geheimes Zusatzprotokoll. Darin wurden Gebiete vom Baltikum bis zum Schwarzen Meer deutschen und sowjetischen
    Interessensphären zugeordnet. Am 24. Dezember 1989 bestätigte der Kongress der Volksdeputierten der UdSSR förmlich,
    dass das Protokoll unterzeichnet worden war und existierte, verurteilte die geheimen Absprachen und erklärte sie vom
    Zeitpunkt ihrer Unterzeichnung an für rechtlich unwirksam. Das sowjetische Original wurde später aufgefunden.
impact:
  summary: >-
    Nachdem deutsche Diplomatenakten im Westen veröffentlicht worden waren, entstand eine langjährige sowjetische
    staatliche Gegendarstellung. 1948 beantwortete das Sowjetische Informationsbüro die US-Dokumentensammlung
    „Nazi-Soviet Relations“ mit den „Geschichtsfälschern“ und stellte die Veröffentlichung als Fälschungskampagne dar.
    Unter Glasnost brach diese Linie auf: Im August 1988 erklärte APN-Vorsitzender Walentin Falin öffentlich, es gebe
    keinen Grund, die geheimen Protokolle für Fälschungen zu halten. Im Dezember 1989 erkannte der Kongress der
    Volksdeputierten ihre Existenz förmlich an und verurteilte ihre Unterzeichnung.
  highlights:
    - value: 41 Jahre
      label: von der sowjetischen staatlichen Gegenschrift 1948 bis zur förmlichen Anerkennung des geheimen Protokolls 1989
    - value: 23. August 1939
      label: Unterzeichnung des geheimen Zusatzprotokolls zusammen mit dem öffentlichen Nichtangriffsvertrag
    - value: 24. Dezember 1989
      label: förmliche Bestätigung und Verurteilung des geheimen Protokolls durch den Kongress der Volksdeputierten der UdSSR
  context:
    - >-
      Die Schrift „Geschichtsfälscher“ von 1948 griff die westliche Dokumentenveröffentlichung als Fälschung an, behandelte
      das geheime Zusatzprotokoll aber nicht ausdrücklich beim Namen. Sie belegt daher keinen wörtlichen Satz, der dessen Existenz explizit bestreitet.
    - >-
      Die offizielle sowjetische Linie begann sich bereits vor Dezember 1989 zu verändern. Am 16. August 1988 erklärte
      APN-Vorsitzender Walentin Falin, es gebe keinen Grund, die geheimen Protokolle für eine Fälschung zu halten.
    - >-
      Der Kongress stützte sich 1989 auf Kopien, Karten und weitere Dokumente, weil das sowjetische Original damals noch
      nicht gefunden war. Es wurde später im Archivbestand aufgefunden.
episodes:
  - id: soviet-union-1948-1989
    polity: Sowjetunion
    institutions:
      - Sowjetisches Informationsbüro
      - Kommunistische Partei der Sowjetunion
    institutionalContext: >-
      Im Januar 1948 veröffentlichte das US-Außenministerium erbeutete deutsche Diplomatenakten. Das Sowjetische
      Informationsbüro antwortete mit „Geschichtsfälscher“ und stellte die westliche Veröffentlichung als
      Fälschungskampagne dar. In den folgenden Jahrzehnten wurde ein authentisches geheimes Protokoll zur Abgrenzung von
      Interessensphären in der öffentlichen sowjetischen Geschichtsdarstellung bestritten oder ausgeblendet. Im August
      1988 durchbrach Falin diese Linie öffentlich; am 24. Dezember 1989 bestätigte der Kongress der Volksdeputierten
      förmlich, dass das geheime Zusatzprotokoll unterzeichnet worden war und existierte.
    consequences:
      - Jahrzehntelange staatliche Geschichtsdarstellung ohne ein authentisches geheimes Abkommen als Bestandteil der Diplomatie von 1939
      - Fortgesetzte archivische Geheimhaltung des sowjetischen Dokumentenbestands zum Protokoll
      - Verzerrung der öffentlich autorisierten Erklärung sowjetischer Politik gegenüber Polen, den baltischen Staaten, Finnland und Bessarabien
      - Große spät-sowjetische Geschichtskontroverse mit Verbindung zur politischen Mobilisierung in den baltischen Republiken
      - Förmliche Feststellung des Kongresses 1989, dass die geheimen Absprachen der Souveränität und Unabhängigkeit dritter Staaten widersprachen
    summary: >-
      Die sowjetische Reaktion auf die westliche Veröffentlichung deutscher Diplomatenakten trug zu einer offiziellen
      Geschichtsdarstellung bei, in der das geheime Protokoll bestritten oder als westliche Fälschung behandelt wurde.
      Im Dezember 1989 vollzog der Kongress der Volksdeputierten die förmliche Kehrtwende.
    mechanism:
      summary: >-
        Amtliche sowjetische Informations- und Geschichtsdarstellung begegnete dem westlichen Dokumentenbestand mit einer
        Gegenerzählung, die das authentische Geheimprotokoll ausblendete oder bestritt, während der sowjetische Archivbestand geheim blieb.
    institutionalCorrection:
      periodLabel: 24. Dezember 1989
      action: Der Kongress der Volksdeputierten bestätigte die Existenz des Geheimprotokolls, verurteilte seine Unterzeichnung und erklärte die Absprachen rückwirkend für unwirksam.
      summary: >-
        Das sowjetische Parlament kehrte die überlieferte amtliche Linie ausdrücklich um und erkannte das authentische Geheimabkommen an.
evidence:
  - id: protocol-falsifiers-proposition
    note: >-
      Die offizielle sowjetische Gegenschrift von 1948 greift die westliche Veröffentlichung erbeuteter deutscher Diplomatenakten als Fälschung an, während das Geheimprotokoll außerhalb der autorisierten Darstellung blieb.
  - id: protocol-resolution-correction
    note: >-
      Der Beschluss Nr. 979-I bestätigt die Unterzeichnung eines geheimen Zusatzprotokolls, beschreibt die Interessensphären, verurteilt die Unterzeichnung und erklärt das Protokoll rückwirkend für unwirksam.
