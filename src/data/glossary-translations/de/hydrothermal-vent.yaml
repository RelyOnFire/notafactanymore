entryId: hydrothermal-vent
sourceReviewedAt: '2026-08-21'
term: Hydrothermale Quelle
aliases:
- hydrothermale Quellen
- Tiefseequelle
shortDefinition: Eine Öffnung im Meeresboden, aus der geothermisch erhitztes, mineralreiches Wasser ins Meer strömt.
longDefinition: Hydrothermale Quellen entstehen, wenn Meerwasser durch heißen Ozeanboden zirkuliert, dabei erhitzt
  und chemisch verändert wird und anschließend durch Öffnungen im Meeresboden wieder austritt. Manche Ökosysteme
  an solchen Quellen beruhen auf chemosynthetischen Mikroorganismen statt auf Sonnenlicht.
