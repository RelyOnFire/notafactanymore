schemaVersion: 2
title: Immigration as biological improvement
proposition:
  summary: >-
    The Colombian state treated immigrants' supposed racial, ethnic, organic and national-origin traits as signs of
    whether they would improve or endanger the country's physical and moral “ethnic conditions,” racial development
    and biological patrimony.
correction:
  summary: >-
    Race and ethnicity are social classifications, and neither they nor nationality are reliable proxies for genetic
    ancestry. Human genetic variation does not form discrete, stable populations ranked from inferior to superior, and
    national origin does not determine intellectual, moral or hereditary worth. Selecting immigrants through those
    labels therefore cannot biologically improve a nation.
category: Eugenics and immigration
reviewedAt: '2026-09-28'
impact:
  summary: >-
    Law 114 of 1922 converted the eugenic premise into both recruitment and exclusion. Article 1 directed the executive
    to foster immigrants judged racially suitable for improving Colombia's physical and moral “ethnic conditions,”
    while Article 11 barred people deemed inconvenient to the nationality or the “better development of the race.” Its
    open-ended language gave consuls, immigration agents and port or border authorities wide discretion. Diplomatic
    records document its use to deny landing to Black Caribbean travelers in 1923; in the late 1930s the Foreign
    Ministry used the same framework, reinforced by Decree 1723, to obstruct Jewish refugees fleeing Nazi persecution.
  highlights:
    - value: '1922'
      label: year racial and “ethnic” improvement became an express object of Colombian immigration law
    - value: '27'
      label: Martinican passengers denied landing in one documented 1923 application of Law 114
    - value: 1938–40
      label: period in which Foreign Ministry records tied barriers for Jewish refugees to the older selection law
  context:
    - >-
      Law 114 did not name Afro-Caribbean people or Jews. The affected groups are identified from documented
      applications of its broad terms in consular correspondence, executive measures and a Foreign Ministry report.
    - >-
      Jewish identity is not a biological race or nationality. Officials racialized Jewish refugees and treated their
      presumed ability to assimilate as a biological and national concern; this card describes that official logic
      without accepting its categories.
    - >-
      The 1922–1940 range marks the enforcement period documented by the principal historical study. It is not a claim
      that the statute was repealed or that exclusionary thinking ended in 1940; the study records similar rhetoric in 1945.
    - >-
      Colombia's current official compilation of Law 114 says that it provides no overall analysis of the law's
      validity. It marks Article 10 as repealed in 1927 but does not identify a direct repeal of the racial language in
      Articles 1 and 11. The later anti-discrimination framework is therefore treated as a substantial but formally
      incomplete correction, without offering a legal opinion on the clauses' present enforceability.
episodes:
  - id: colombia-1922-1940
    polity: Colombia
    region: Latin America
    startYear: 1922
    endYear: 1940
    periodLabel: 1922–1940 documented
    strength: policy-basis
    institutionTypes:
      - government
    institutions:
      - Congreso de Colombia
      - Oficina de Información y Propaganda del Ministerio de Agricultura y Comercio
      - Juntas de Inmigración
      - Ministerio de Relaciones Exteriores
    institutionalContext: >-
      Law 114 assigned immigration administration to the Oficina de Información y Propaganda in the Ministry of
      Agriculture and Commerce, working with immigration agents abroad and local immigration boards. Colombian consuls
      acted as immigration agents, while port and border authorities enforced exclusions. By the late 1930s, the
      Ministry of Foreign Affairs and the consular network controlled a more restrictive visa system. Decree 1723 of
      1938 required specific ministry authorization for stateless people, people whose return rights had been limited,
      and anyone treated as a special concern under Article 11 of Law 114.
    consequences:
      - Visa and landing decisions based on racialized judgments about immigrants' origin and presumed heredity
      - Denial of entry to Afro-Caribbean travelers, including 27 Martinican passengers in a documented 1923 case
      - Quotas, higher financial barriers and special-authorization requirements applied to disfavored origins
      - Restrictions on Jewish refugees seeking safety from Nazi persecution in Europe
      - Administrative normalization of immigrants as biological assets or threats to the nation
    summary: >-
      Colombia's 1922 immigration law made improvement of the nation's physical and moral “ethnic conditions” a state
      objective and empowered officials to exclude people considered harmful to the country's nationality or racial
      development. Officials applied that discretion against Black Caribbean migrants and later folded the statute into
      the restrictive visa machinery used against Jewish refugees. The episode ends in 1940 as a documented research
      window, not as a proven date of statutory repeal.
    mechanism:
      kind: enforcement
      summary: >-
        Congress encoded racial selection in law; a ministry office, immigration boards, consular agents and port or
        border authorities translated it into passport, visa and landing decisions. The Foreign Ministry later added
        case-by-case authorization and financial barriers through the 1938 decree.
    institutionalCorrection:
      status: partial
      periodLabel: 1981 and 2021
      action: >-
        Congress approved the international convention against racial discrimination in 1981 and enacted a national
        migration-policy law in 2021 that requires the prevention of racism and xenophobia and bars discrimination by
        race, color, nationality or national ancestry.
      summary: >-
        These later statutes reject the racial-selection premise and bind current migration policy to human rights and
        non-discrimination. The correction is classified as partial because the official compilation supplies no
        overall validity analysis for Law 114 and this audit found no source documenting a direct repeal or annulment of
        its Articles 1 and 11.
