schemaVersion: 2
locale: de
entryId: lysenkoist-heredity
sourceReviewedAt: '2026-11-27'
title: Lyssenkistische Vererbungslehre
proposition:
  summary: >-
    Umweltbehandlungen können die Vererbung über Generationen gezielt umformen und die mendelsche Genetik damit überflüssig
    oder falsch machen.
correction:
  summary: Pflanzen erben DNA und können auch manche Veränderungen der Genaktivität erben. Winterweizen behält die
    Wirkung eines Kältereizes lange genug, um zu blühen. Bei den Nachkommen wird diese Kälteerinnerung zurückgesetzt.
    Die neue Generation braucht gewöhnlich erneut Kälte. Bei der Ackerschmalwand (Arabidopsis) zeigte eine Studie,
    dass eine Stressreaktion vor allem über die mütterliche Linie weitergegeben werden konnte und ohne weiteren
    Stress wieder nachließ. So kann eine Umweltwirkung fortbestehen, während die für die Züchtung erhoffte dauerhafte
    Veränderung ausbleibt.
impact:
  summary: In der Sowjetunion verloren Genetiker ihre Stellen. Den Hochschulen fehlten Lehrkräfte und Versuchsmaterial,
    und eine Generation von Studierenden hatte kaum Zugang zu einer Ausbildung in klassischer Genetik. In China
    unterbrach die Kampagne auch die Arbeit an Kreuzungszüchtungen, die bereits Ergebnisse geliefert hatten.
  context:
    - In der Ukraine fiel der Holodomor 1932–1933 in die Zeit, als sich die 1931 angeordnete Vernalisationskampagne
      ausweitete. Zur Sterblichkeit trugen nachweislich die Benachteiligung bei staatlichen Getreideablieferungen
      und Beschränkungen der Freizügigkeit bei. Nach der Hungersnot wies der Volkskommissar für Landwirtschaft Wawilow
      an, Lyssenko zu unterstützen. Die zeitliche Abfolge belegt die staatliche Förderung des Programms. Welchen
      Anteil es an der Sterblichkeit hatte, lässt sich daraus nicht ermitteln.
    - Die chinesische Hungersnot von 1959 bis 1961 folgte auf die Genetiktagung in Qingdao. Li und Yang untersuchen,
      wie Arbeitskräfte von den Feldern abgezogen und auf der Grundlage übertriebener Erntemeldungen zu hohe Getreideabgaben
      gefordert wurden. Kasahara und Li untersuchen auf Kreisebene den Produktionsrückgang, die Exporte und die
      starren Ablieferungsvorgaben. Chen und Zhou nennen für die gesamte Hungersnot 15 bis 30 Millionen zusätzliche
      Todesfälle. Keine dieser Arbeiten beziffert einen gesonderten Anteil für lyssenkistische Anbaumethoden.
  highlights:
    - value: '127'
      label: Im Herbst 1948 entlassene Hochschullehrkräfte in einer historischen Aufstellung
      note: Darunter waren 66 Professoren; spätere Entlassungen, Degradierungen und Entzüge von Leitungsfunktionen
        gingen deutlich darüber hinaus.
    - value: Mehrere Tausend
      label: Nach 1948 entlassene, degradierte oder aus Leitungsfunktionen entfernte Wissenschaftler und Lehrkräfte
        laut historischer Forschung
      note: Rückblickende Schätzung für die gesamte Kampagne nach der Tagung. Sie umfasst neben Entlassungen auch
        andere personelle Maßnahmen.
sections:
  - id: winter-wheat
    title: Das Versprechen der Frühjahrssaat
    paragraphs:
      - Winterweizen braucht gewöhnlich eine Kälteperiode, bevor er blühen kann. Wer die Aussaat im Herbst versäumt
        hatte, konnte das angefeuchtete Saatgut vor der Frühjahrssaat kühlen und so den Kältebedarf decken. Landwirte
        und Pflanzenphysiologen hatten diesen Effekt bereits untersucht, als der sowjetische Agronom Trofim Lyssenko
        das Verfahren Ende der 1920er-Jahre unter dem Namen Vernalisation bekannt machte. Lyssenko versprach darüber
        hinaus höhere Erträge. Er behauptete auch, Züchter könnten gezielt verändern, welche Eigenschaften die nächste
        Generation erbt. Ein Feld mit reifenden Ähren zeigte, dass der Weizen nach der Kältebehandlung zur Blüte
        gekommen war. Für die beiden weitergehenden Behauptungen brauchte es eigene Versuche.
      - Einen solchen Ertragsvergleich legte der sowjetische Züchter P. N. Konstantinow 1937 vor. Nach seinen Angaben
        brauchte er für das Verfahren rund doppelt so viel Saatgut. Das Getreide war anfälliger für Brandpilze,
        und der Mehrertrag betrug in seinem Vergleich höchstens 0,4 Prozent. Für einen Betrieb, der das zusätzliche
        Saatgut bezahlen musste, war diese Größenordnung entscheidend. Die sowjetischen Behörden hatten die breite
        Einführung des Verfahrens bereits 1931 angeordnet.
  - id: heredity-in-dispute
    title: Worin der Streit um die Vererbung bestand
    paragraphs:
      - Lyssenko und der Philosoph Isaak Present nannten ihr Programm Mitschurinismus. Sie beriefen sich auf den
        russischen Obstzüchter Iwan Mitschurin, der durch Kreuzungen neue Apfel- und Kirschsorten gewonnen hatte.
        Lyssenko behauptete, lebendes Gewebe erwerbe unter dem Einfluss seiner Umwelt erbliche Eigenschaften, und
        Züchter könnten diesen Vorgang lenken. Er erkannte die Existenz der Chromosomen und ihre Rolle bei der geschlechtlichen
        Fortpflanzung an. Er verwarf die Vorstellung, dass einzelne, auf den Chromosomen liegende Erbanlagen die
        Weitergabe von Merkmalen erklären.
      - Was zählte ein Züchter, der nach den mendelschen Regeln arbeitete? In Brünn kreuzte Gregor Mendel Erbsen
        mit unterschiedlicher Samenfarbe. Die Samen der ersten Kreuzung waren gelb. Als sich die daraus gezogenen
        Pflanzen selbst bestäubten, trat die grüne Farbe wieder auf. Mendel zählte 6.022 gelbe und 2.001 grüne Samen,
        annähernd drei zu eins. Ein Merkmal konnte also über eine Generation weitergegeben werden, in der es unsichtbar
        blieb.
      - Bis 1948 hatte die Chromosomentheorie längst überprüfbare Vorhersagen geliefert. Thomas Hunt Morgan kreuzte
        1910 ein weißäugiges Fruchtfliegenweibchen mit einem rotäugigen Männchen. Die Töchter hatten rote, die Söhne
        weiße Augen. Die Augenfarben folgten dem Erbgang des X-Chromosoms. Ein Sohn erhielt sein einziges X von
        der Mutter, eine Tochter je eines von beiden Eltern. Auf Versuche wie diesen bezog sich der Ausdruck „Morganismus“,
        den Lyssenko immer wieder angriff.
  - id: grafted-tomatoes
    title: Konnten zwei gepfropfte Tomatenpflanzen einen Hybriden hervorbringen?
    paragraphs:
      - Beim Pfropfen verwächst ein Trieb der einen Pflanze mit der bewurzelten Unterlage einer anderen. Auf der
        Tagung von 1948 beschrieb Lyssenko die Pfropfung zweier Tomatensorten, die sich in Blattform und Fruchtfarbe
        unterschieden. Die meisten Sämlinge aus den Samen der Unterlage hätten dieser geglichen. Sechs hätten Blätter
        von der Form der anderen Sorte entwickelt, einige davon gelbe Früchte getragen. Der Botaniker Pjotr Schukowski
        hielt eine unbeabsichtigte Fremdbestäubung für möglich. Lyssenko erwiderte, bei einer solchen Kreuzung hätte
        die erste Tochtergeneration rote Früchte tragen müssen. Damit standen zwei Erklärungen für ein und dieselbe
        berichtete Beobachtung im Raum.
      - Helmut Böhme ging in Gatersleben in der DDR zunächst davon aus, die sowjetischen Befunde bestätigen zu können.
        In seinen Tomatenversuchen von 1951 bis 1957 fand er ungewöhnliche Nachkommen. Manche Veränderungen konnte
        er auf Mutationen in Körperzellen der Elternpflanze zurückführen. Auch nach einer Wiederholung mit verbesserter
        Versuchsmethodik blieben die vorhergesagten Merkmalsübertragungen zwischen den Pfropfpartnern und ihren
        Nachkommen aus. Ein ungewöhnlicher Sämling war damit zwar gefunden, die Herkunft seines Merkmals musste
        aber eigens geklärt werden.
  - id: winter-memory
    title: Woran sich Weizen erinnert und was seine Nachkommen erben
    paragraphs:
      - Hans Stubbe prüfte von 1949 bis 1952, ob sich Winterweizen durch wiederholten Anbau im Gewächshaus ohne
        Kälteperiode erblich in Sommerweizen umwandeln ließ. In seinen Versuchen gelang das nicht. Jahrzehnte später
        ließ sich die Wirkung der Kälte im heranwachsenden Samen verfolgen. Eine Forschungsgruppe um De Niu zeigte
        2024 an Winterformen des Brotweizens, dass ein durch Kälte aktiviertes Gen für die Blütenbildung im frühen
        Embryo noch aktiv blieb. Im weiteren Verlauf der Embryonalentwicklung wurde dieser Zustand zurückgesetzt.
        Ein zweiter Regulator wurde bei der Keimung wieder aktiv. Zusammen bewirkten diese Vorgänge, dass auch die
        nächste Generation wieder Kälte brauchte, um später zu blühen.
      - Auch bei Pfropfungen lässt sich heute genauer bestimmen, was übertragen wird. Sandra Stegemann und Ralph
        Bock wiesen 2009 in Zellen an der Verwachsungsstelle zweier Tabakpflanzen Erbmaterial beider Pfropfpartner
        nach. Damit waren Ort und Weg eines Austauschs erkennbar. Lyssenko hatte behauptet, grundsätzlich könne
        über eine Pfropfung jedes Merkmal ebenso an Nachkommen gelangen wie bei einer geschlechtlichen Kreuzung.
        Um das zu zeigen, müsste man das betreffende Merkmal an den aus Samen gezogenen Nachkommen nachweisen.
  - id: vavilov-and-the-academy
    title: Wawilow und die Akademietagung, die er nicht mehr erlebte
    paragraphs:
      - Der Genetiker Nikolai Wawilow, von 1929 bis 1935 Präsident der Landwirtschaftsakademie, förderte Lyssenko
        anfangs. Wawilow sammelte weltweit Saatgut, um Herkunft und Vielfalt der Kulturpflanzen zu untersuchen.
        Spätestens 1939 kam es zum öffentlichen Bruch zwischen den beiden. Sowjetische Behörden verhafteten Wawilow
        1940 während einer Sammelreise in die Westukraine. Sein Todesurteil wurde in eine Haftstrafe umgewandelt.
        Im Januar 1943 starb er im Gefängnis von Saratow an den Folgen von Unterernährung, fünf Jahre vor der Akademietagung.
      - Stalin prüfte Lyssenkos Bericht persönlich, bevor die Landwirtschaftsakademie vom 31. Juli bis zum 7. August
        1948 zusammentrat. Einige Redner verteidigten weiterhin die Genetik. Der Physiologe Boris Sawadowski erinnerte
        die Delegierten daran, dass Landwirte bereits auf Millionen Hektar Weizen- und Roggensorten anbauten, die
        Genetiker gezüchtet hatten. In seinem Schlusswort gab Lyssenko bekannt, das Zentralkomitee der Partei habe
        seinen Bericht gebilligt. Am 23. August verfügte der Hochschulminister Änderungen bei der Besetzung von
        Hochschulstellen und in der Lehre. Aus der Debatte am Rednerpult war eine Entscheidung darüber geworden,
        wer die nächste Generation ausbilden durfte.
  - id: routes-back
    title: Wie die Genetik das Verbot überdauerte
    paragraphs:
      - Physiker ermöglichten genetische Forschung an Instituten, deren Arbeit zur Strahlung staatlich gefördert
        wurde. 1955 verfassten Leningrader Biologen den „Brief der Dreihundert“, in dem sie die Parteiführung aufforderten,
        Lyssenko die Unterstützung zu entziehen. Auch Mathematiker wandten sich an die Partei und kritisierten besonders
        die Ablehnung statistischer Methoden durch seine Anhänger. Noch 1961 sagte das Hochschulministerium eine
        Leningrader Genetikkonferenz per Telegramm ab, einen Tag vor Beginn. Chruschtschows Sturz 1964 ermöglichte
        es der Akademie der Wissenschaften, sich 1965 offiziell von den Beschlüssen von 1948 zu distanzieren. Der
        Wiederaufbau von Lehre und Laboren hatte schon früher begonnen und setzte sich danach fort.
  - id: research-and-schooling
    title: Was kam in Schulen und Forschung an?
    paragraphs:
      - Polnische Schüler mussten die neue Biologie lernen. Wie stark prägte sie die botanische Fachliteratur? Piotr
        Köhler fand für die Jahre 1948–1958 rund 140 lyssenkistische Veröffentlichungen unter 3.410 botanischen
        Arbeiten (4,1 Prozent). Die Zählung erfasst, was im Druck erschien. Was einzelne Botaniker glaubten oder
        in einer Vorlesung zu sagen wagten, lässt sich daraus nicht ablesen.
      - In der DDR verlief die Trennlinie zwischen Schule und Forschung. Während Schulbücher Lyssenko als Autorität
        darstellten, erreichte Hans Stubbe bei Walter Ulbricht, dass sein Gaterslebener Institut für Kulturpflanzenforschung
        weiterarbeiten konnte. Stubbe konnte Lyssenkos Thesen prüfen und ihnen widersprechen, obwohl er von 1951
        bis 1967 der Deutschen Akademie der Landwirtschaftswissenschaften zu Berlin vorstand. Wer die sowjetische
        Lehre übernahm, erscheint also je nach Quelle in anderem Licht. Ein Lehrplan erzählt eine andere Geschichte
        als die Forschungsarbeiten einer Akademie.
  - id: international-debate
    title: Wie sich der Streit international ausbreitete
    paragraphs:
      - Am 30. November 1948 sendete das Third Programme der BBC getrennt aufgezeichnete Beiträge von R. A. Fisher,
        Cyril Darlington, Sydney Harland und J. B. S. Haldane. Die ersten drei kritisierten Lyssenko. Der Genetiker
        und Kommunist Haldane hatte einem Briefpartner geschrieben, Lyssenko sei mit seinen Angriffen auf sowjetische
        Genetiker zu weit gegangen. Er lehnte auch die Bitte von Sympathisanten ab, eine gemeinsame Verteidigung
        Lyssenkos zu organisieren. Nach der Sendung erhielt Haldane zustimmende Hörerbriefe.
      - Wie die Debatte weiterging, lässt sich an einer Broschüre aus Oxford nachvollziehen. Die Society for Freedom
        in Science veröffentlichte 1949 eine erweiterte Fassung von Fishers Rundfunkbeitrag zusammen mit dem Brief,
        in dem der britische Physiologe Henry Dale seinen Austritt aus der sowjetischen Akademie der Wissenschaften
        erklärte. Fisher wandte sich an ein Radiopublikum. Dale löste mit seinem Schreiben eine institutionelle
        Bindung.
      - Auch in Kontinentaleuropa waren sich Wissenschaftler mit ähnlichen politischen Überzeugungen uneins. Der
        französische marxistische Biologe Marcel Prenant äußerte Zweifel, während viele andere französische Kommunisten
        die Lehre unterstützten. In der Kommunistischen Partei Italiens stritten verschiedene Gruppen darüber, ob
        die Partei Lyssenko unterstützen sollte. Ab 1951 äußerte sie sich dazu kaum noch öffentlich.
      - Im Japan der amerikanischen Besatzungszeit interessierten sich manche Genetiker für die Berichte, weil sie
        bereits die Vererbung über das Zytoplasma untersuchten, also über den Zellinhalt außerhalb des Zellkerns.
        Die Historikerin Kaori Iida beschreibt, wie sich die Kritik an Lyssenko mit der Verschärfung des Kalten
        Krieges zuspitzte. Eine Behauptung untersuchen zu wollen hatte institutionell eine andere Bedeutung, als
        sie im Unterricht verbindlich vorzuschreiben.
  - id: historical-interpretations
    title: Warum Historiker Lyssenkos Aufstieg unterschiedlich erklären
    paragraphs:
      - David Joravsky betonte die Krise der kollektivierten Landwirtschaft und eine politische Kultur, die Entscheidungen
        im Alleingang begünstigte. Nikolai Krementsov untersuchte die Folgen der Konkurrenz von Wissenschaftlern,
        die bei der Beschaffung von Mitteln auf denselben Parteistaat angewiesen waren. Nils Roll-Hansen ging zu
        den frühen Versuchen zurück und fragte, aus welchen praktischen Gründen Züchtern die Vernalisation plausibel
        erschien. Wie der Historiker Michael Gordin erläutert, verlangen zwei Vorgänge nach einer Erklärung. Wie
        fand ein Agronom Gehör für seine Versuche? Und warum erhielt er später von der Regierung Entscheidungsgewalt
        über ein ganzes Fach?
      - 2014 und 2015 erschienen in Russland Bücher mit der These, die moderne Biologie habe Lyssenko recht gegeben.
        Der Historiker Loren Graham führte das erneute Interesse unter anderem auf die Epigenetik zurück. Bei der
        Winterweizenstudie war entscheidend, welche Gene die Forschenden untersuchten, wie lange sie im Embryo aktiv
        blieben und wann die Wirkung nachließ. So lässt sich genau bestimmen, was vom Kältereiz der Elternpflanze
        im Keimling ankommt. Die Messungen zeigen auch, wo Lyssenkos Vorhersage einer dauerhaft veränderten Sorte
        scheitert.
      - Zwei Quellen laden zur vertiefenden Lektüre ein. Der Tagungsband von 1948 enthält neben Lyssenkos Vortrag die
        Redebeiträge der Delegierten. Wer die internationale Geschichte weiterverfolgen möchte, findet im zweiten Band
        von The Lysenko Controversy as a Global Phenomenon eigene Studien zu Ungarn, Italien und Japan.
episodes:
  - id: ussr-1948-1964
    polity: Sowjetunion
    institutions:
      - Lenin-Allunionsakademie der Landwirtschaftswissenschaften (VASKhNIL)
      - Ministerium für Hochschulbildung der UdSSR
      - Akademie der Wissenschaften der UdSSR
      - Moskauer Staatliche Universität
      - Staatliche Universität Leningrad
    institutionalContext: Die VASKhNIL-Tagung von 1948 verlieh Lyssenkos Position staatlich gestützte Autorität. Hochschulminister
      Sergei Kaftanows Anordnung vom 23. August verlangte Entlassungen und die Neuordnung von Lehre und Forschung. Die
      Akademie der Wissenschaften der UdSSR beschloss anschließend eigene Maßnahmen gegen die Genetik. An den Universitäten
      Moskau und Leningrad wurden Lehrstühle umorganisiert und Gegner entlassen oder ersetzt. Dabei handelte es sich
      um Maßnahmen institutioneller Leitungen; einzelne Wissenschaftler derselben Einrichtungen leisteten Widerstand
      und halfen später beim Wiederaufbau der Genetik.
    summary: >-
      Nach der VASKhNIL-Tagung von 1948 erhielt Lyssenkos anti-mendelsche Biologie staatliche Rückendeckung. Genetiker
      verloren Stellen, Labore wurden geschlossen und Lehre sowie Forschung zur klassischen Genetik eingeschränkt.
      In geschützten Arbeitsbereichen begann der Wiederaufbau bereits in den 1950er-Jahren. Chruschtschows Sturz 1964
      ermöglichte es der Akademie der Wissenschaften, die Beschlüsse von 1948 im Jahr 1965 ausdrücklich zu verwerfen
      und neue Vorhaben für Forschung und Lehre der Genetik anzukündigen. Lyssenkisten behielten jedoch Stellen und
      Einfluss in landwirtschaftlichen Einrichtungen.
    consequences:
      - Genetiker wurden entlassen, degradiert oder aus wissenschaftlichen Leitungsfunktionen entfernt
      - Genetische Labore und Lehrstühle wurden geschlossen oder umorganisiert
      - Mendelsche Genetik wurde aus Lehre und Lehrbüchern entfernt
      - Agrar- und Biowissenschaften verloren normale Mechanismen wissenschaftlicher Korrektur
    mechanism:
      summary: >-
        Staatlich gestützte Akademie- und Bildungsbehörden setzten mitschurinsche Biologie über Personal-, Lehrplan-
        und Forschungssteuerung durch und unterdrückten zugleich die mendelsche Genetik und ihre Verteidiger.
    institutionalCorrection:
      periodLabel: 1964–1966
      action: >-
        1965 verwarf die Akademie der Wissenschaften der UdSSR die Beschlüsse von 1948, wählte Lyssenko nicht erneut
        zum Direktor ihres Instituts für Genetik und kündigte neue Einrichtungen und Lehrvorhaben für die Genetik
        an.
      summary: >-
        Die Akademie rehabilitierte die Genetik offiziell innerhalb ihres wissenschaftlichen Rahmens. Im Januar und
        Februar 1965 verwarf sie die aufgezwungene Doktrin und sah erneuerte Forschung und Lehrpläne vor; das Institut
        für Allgemeine Genetik folgte. Die Umsetzung verlief schrittweise. Weil Lyssenkisten in VASKhNIL und der landwirtschaftlichen
        Ausbildung weiterhin Einfluss hatten, bezeichnet 1964 kein allgemeines Ende für jede Institution oder Laufbahn.
  - id: china-1949-1956
    polity: Volksrepublik China
    institutions:
      - Chinesische Akademie der Wissenschaften, Planungsbüro
      - >-
        Referat für Wissenschaft und Gesundheit im Planungsbüro des Ausschusses für Kultur und Bildung des Regierungsverwaltungsrats
    summary: >-
      In der frühen Volksrepublik wurde die sowjetische Wissenschaftsorganisation übernommen und die klassische Genetik
      zugunsten lyssenkistischer Biologie zurückgedrängt. Die Kampagne von 1952 erfasste Lehrveranstaltungen, Forschung
      und Publikationen. Auf der von der Chinesischen Akademie der Wissenschaften und dem Hochschulministerium veranstalteten
      Genetiktagung in Qingdao vom 10. bis 25. August 1956 konnten beide Schulen ihre Auffassungen vertreten. Anschließend
      öffneten Regelungen für Lehre, Forschung und Publikationen wieder Raum für die klassische Genetik. Damit wurde
      die einseitige Unterdrückung erheblich zurückgenommen; die Schulen durften nebeneinander bestehen, ohne dass
      der Lyssenkoismus pauschal verworfen wurde.
    consequences:
      - Klassische Genetik wurde aus Forschung und Hochschullehre verdrängt
      - Wissenschaftliche Laufbahnen und Lehrpläne wurden durch politische Orthodoxie geprägt
      - Erfolgreiche Kreuzungszüchtung wurde unterbrochen, weil sie als morganistisch eingestuft wurde
    mechanism:
      summary: >-
        Staatliche und akademische Planungsstellen gaben über Beratungen und die Parteipresse eine mitschurinsche
        Richtung vor; anschließend wurde die klassische Genetik aus Lehrveranstaltungen, Forschungsprojekten und wissenschaftlichen
        Publikationen verdrängt.
    institutionalCorrection:
      periodLabel: ab August 1956
      action: >-
        Akademie und Hochschulministerium veranstalteten die Genetiktagung in Qingdao; Forschungs-, Bildungs- und
        Publikationsstellen änderten anschließend die Regelungen, die eine Schule unterstützt und die andere unterdrückt
        hatten.
      summary: >-
        Die offizielle Chronik beschreibt den Verzicht auf politische Etikettierungen klassischer Genetiker und die
        schrittweise Rückkehr ihrer Lehrveranstaltungen und Forschungen. Beide Schulen durften ihre Positionen vertreten.
        Die Reaktion korrigierte Ausgrenzung und stellte wissenschaftliche Diskussion wieder her, belegt aber keine
        allgemeine institutionelle Zurückweisung sämtlicher lyssenkistischer Vererbungsbehauptungen.
    institutionalContext: Das Planungsbüro der Akademie und das staatliche Referat für Wissenschaft und Gesundheit hielten
      im Frühjahr 1952 drei Sitzungen ab. Am 29. Juni veröffentlichte die Volkszeitung ihre Schlussfolgerungen. Die
      Autoren kritisierten, mit welchen Mitteln Le Tianyu die mitschurinsche Biologie durchgesetzt hatte. Zugleich forderten
      sie eine breitere Kampagne gegen die Genetik in der Tradition Morgans. Die Akademie beschrieb später die Folgen
      für Hochschulen und Zeitschriften. Lehrveranstaltungen fielen weg, erfolgreiche Kreuzungsversuche wurden abgebrochen,
      und einige Genetiker mussten Stellungnahmen veröffentlichen, die ihrer eigenen Überzeugung widersprachen.
  - id: poland-1949-1956
    polity: Polen
    institutions:
      - Koło Przyrodników Marksistów / Zrzeszenie Przyrodników-Marksistów (1950 umbenannt; 1952 verschmolzen)
      - Polska Akademia Nauk, Abteilung II und Kommission für Evolutionismus (ab 1952)
      - Polnisches Ministerium für Hochschulbildung
      - Polskie Towarzystwo Przyrodników im. Kopernika (ab 1952)
    summary: >-
      Eine Warschauer Konferenz erklärte die lyssenkistische „Neue Biologie“ im März 1949 zum offiziellen Paradigma
      der polnischen Wissenschaft. Genetik und Kritik an der Doktrin wurden aktiv bekämpft, Genetikkurse verschwanden
      aus den Universitäten, Lehrpläne wurden umgeschrieben und Wissenschaftler konnten wegen politisch unerwünschter
      Begriffe zum Schweigen gebracht oder öffentlich stigmatisiert werden. Auf der Vollversammlung der Akademie vom
      11. bis 12. Juni 1956 wurde ihre Durchsetzung des Lyssenkoismus offen kritisiert. Im Schul- und Studienjahr
      1957–1958 kehrte die Genetik in die Lehrpläne zurück. Das Episodenende 1956 bezeichnet die politische und institutionelle
      Wende, nicht den Abschluss jeder Lehrplanreform.
    consequences:
      - Entfernung der Genetik aus dem Unterricht
      - Unterdrückung konkurrierender biologischer Forschung
      - Politischer Druck auf Wissenschaftler
      - Druck, die botanische Forschung auf landwirtschaftliche Anwendungen auszurichten
    mechanism:
      summary: >-
        Wissenschafts- und Bildungsinstitutionen machten die „Neue Biologie“ zum offiziellen Paradigma, schrieben
        Lehrpläne um und marginalisierten oder unterdrückten Genetik und Forschende mit politisch unerwünschten Begriffen.
    institutionalCorrection:
      periodLabel: 1956–1958
      action: >-
        Die Vollversammlung der Polnischen Akademie kritisierte im Juni 1956 die aufgezwungene Doktrin; 1957–1958
        kehrte die Genetik in die Lehrpläne von Schulen und Hochschulen zurück.
      summary: >-
        Die Genetik erhielt ihren Platz in der offiziellen Lehre zurück, und die aufgezwungene Doktrin verlor ihre
        geschützte Stellung. Auf die institutionelle Wende der Akademie 1956 folgte 1957–1958 die Wiederaufnahme in
        die Lehrpläne. Belegt ist diese Kehrtwende in Bildung und Wissenschaftsverwaltung; ein Widerruf durch jeden
        früheren Befürworter oder eine vollständige Wiedergutmachung aller Schäden ist damit nicht nachgewiesen.
    institutionalContext: >-
      Die Vereinigung marxistischer Naturforscher verbreitete die neue Doktrin zunächst als Koło Przyrodników
      Marksistów und nach ihrer Umbenennung 1950 als Zrzeszenie Przyrodników-Marksistów. 1952 verschmolz sie mit
      der Kopernikus-Gesellschaft polnischer Naturforscher. Die durch Gesetz vom 30. Oktober 1951 geschaffene
      Polnische Akademie der Wissenschaften übertrug ihrer biologischen Abteilung eine Rolle bei der Verbreitung
      des Lyssenkoismus. Ihre Kommission für Evolutionismus und das Hochschulministerium veranstalteten 1952
      einen einmonatigen Lehrgang in Dziwnów. Die Kopernikus-Gesellschaft wurde zu einer wichtigen öffentlichen
      Fürsprecherin. Verwaltungsdruck, Publikationskontrolle und Lehrvorgaben schränkten konkurrierende Biologie
      ein. Ein großer Teil der botanischen Fachgemeinschaft leistete dennoch Widerstand oder mied die Doktrin;
      institutionelle Durchsetzung bedeutete keine einhellige wissenschaftliche Zustimmung.
  - id: czechoslovakia-1948-1965
    polity: Tschechoslowakei
    institutions:
      - Landwirtschaftliche Hochschule Brünn (Vysoká škola zemědělská), Aktionsausschuss
      - Tschechoslowakische Akademie der Landwirtschaft (ČSAZ)
    institutionalContext: Ende der 1950er-Jahre konnten Kritiker bereits wieder öffentlich zu Wort kommen. Dennoch
      ernannte die Landwirtschaftsakademie Lyssenko im Juni 1959 zum Ehrenmitglied. Im April 1960 nahm er die Auszeichnung
      in Prag persönlich entgegen und hielt einen Vortrag über mitschurinsche Agrobiologie. Die Ehrung inmitten erneuter
      fachlicher Kritik erklärt, warum die Doktrin kein eindeutiges Enddatum hat.
    consequences:
      - Die Brünner Hochschule untersagte dem Genetiker Jaroslav Kříženecký den Zutritt zur Fakultät und entließ ihn.
        Später wurde er inhaftiert.
      - Die Pläne für ein Mendel-Institut in Brünn scheiterten nach der Machtübernahme 1948. Erst 1962 übernahm Kříženecký
        eine Abteilung für die Geschichte der Genetik am Mährischen Landesmuseum.
    summary: Nach der kommunistischen Machtübernahme 1948 stuften die Behörden die klassische Genetik als reaktionär
      ein. Jaroslav Kříženecký verlor deshalb seine Stelle an der Landwirtschaftlichen Hochschule Brünn. Die Landwirtschaftsakademie
      in Prag förderte die mitschurinsche Biologie noch, als Kritik bereits wieder öffentlich möglich war. Im Frühjahr
      1965 konnten Studierende an der heutigen Brünner Masaryk-Universität wieder offizielle Genetikvorlesungen besuchen.
    mechanism:
      summary: Der Aktionsausschuss der Brünner Hochschule konnte einen Dozenten entlassen, der für die mendelsche
        Genetik eintrat. An der Tschechoslowakischen Akademie der Landwirtschaft förderte Präsident Antonín Klečka
        nach seinem Amtsantritt 1949 das sowjetische Vorbild.
    institutionalCorrection:
      periodLabel: 1962–1966
      action: An der heutigen Masaryk-Universität fanden im Frühjahr 1965 wieder offizielle Genetikvorlesungen statt.
        Die tschechoslowakische Regierung beschloss 1966, die Genetik zu fördern. Die landwirtschaftlichen Hochschulen
        sollten Praktika und Lehrbücher erarbeiten.
      summary: Das Mährische Landesmuseum berief Kříženecký 1962. Er starb 1964 und erlebte die Eröffnung des Mendelianums
        durch seinen früheren Schüler Vítězslav Orel am 4. August 1965 während des internationalen Mendel-Symposiums
        nicht mehr. Mit dieser öffentlichen Rehabilitierung in Brünn endet die Episode. Im Folgejahr erhielt auch
        der Aufbau von Genetiklaboren auf staatlicher Ebene Vorrang.
  - id: east-germany-1951-1965
    polity: Deutsche Demokratische Republik (DDR)
    institutions:
      - Ministerium für Volksbildung der DDR, Lehrpläne für den schulischen Biologieunterricht
    institutionalContext: Das Ministerium schrieb die Lernziele für einzelne Jahrgänge vor. 1951 verlangte es für
      die achte und zehnte Klasse, Mitschurin und Lyssenko im Biologieunterricht zu behandeln. Die Oberschullehrpläne
      von 1953 und 1954 forderten für die zwölfte Klasse Kritik an der klassischen Genetik. Georg Schneider, ein Jenaer
      Verfechter der Lehre, wirkte am Biologiebuch von 1952 für die zwölfte Klasse mit.
    consequences:
      - In den Klassen 8, 10 und 12 nahmen Mitschurin und Lyssenko bei den Themen Evolution und Züchtung einen wichtigen
        Platz ein.
      - Sowjetische Genetiker wie Nikolai Wawilow blieben in den Unterrichtsmaterialien zunächst unerwähnt. Spätere
        Schulbücher für die zwölfte Klasse behandelten seine Arbeit.
    summary: Das Volksbildungsministerium der DDR verankerte die mitschurinsche Biologie in den 1950er-Jahren im Schulunterricht.
      Es bestimmte Lernziele und Lehrbücher. In Gatersleben konnten Genetiker in denselben Jahren weiterhin auf der
      Grundlage der mendelschen Genetik forschen und diese vertreten.
    mechanism:
      summary: Über landesweite Lehrpläne und Schulbücher gab das Ministerium vor, dass Schüler Lyssenkos Vererbungslehre
        behandeln und die konkurrierende Gen- und Chromosomentheorie kritisieren sollten.
    institutionalCorrection:
      periodLabel: 1959–1966
      action: Ein Lehrplan der zehnten Klasse schrieb 1959 die mendelschen Regeln vor. Für die zwölfte Klasse verlangte
        der ab 1963 gültige Lehrplan weiterhin eine kritische Behandlung der klassischen Genetik. Eine Aufgabensammlung
        von 1966 ließ die Schüler selbst Kreuzungen durchführen und die Merkmalsverhältnisse der Nachkommen bestimmen.
      summary: Das Endjahr bezeichnet die Wende im Schulunterricht Mitte der 1960er-Jahre. Wann sie einsetzte, hing
        von Klassenstufe und Schultyp ab. Nach 1965 verschwand Lyssenko aus den untersuchten Lehrmaterialien. Zuvor
        übergangene Wissenschaftler fanden wieder Eingang in die Darstellung von Vererbung und Evolution.
evidence:
  - id: lysenko-history-proposition
    note: >-
      Untersucht die institutionelle Übernahme von 1948 und kommt zu dem Schluss, dass der Lyssenkoismus erhebliche
      Verluste in sowjetischer Landwirtschaft, Genetik, Evolutionstheorie, Molekularbiologie und wissenschaftlicher
      Kontinuität zwischen Generationen verursachte. Die Darstellung benennt außerdem die Lehre von der Vererbung
      erworbener Merkmale, die Ablehnung einer Erbsubstanz und die offizielle Billigung von Lyssenkos Rede.
    locator: Abschnitt „The August 1948 VASKhNIL Session and its Aftermath“, insbesondere die Absätze mit den Anfangsworten
      „In his speech, Lysenko rejected“ und „In Lysenko’s closing statement“.
  - id: lysenko-pushback-correction
    note: >-
      Historischer Überblick über staatliche Unterstützung des Lyssenkoismus, die Unterdrückung der Genetik und ihre
      Rehabilitierung nach der Chruschtschow-Ära. Die Darstellung der Doktrin unterscheidet die Ablehnung der DNA-
      und Chromosomenvererbung von der späteren institutionellen Rehabilitierung; moderne genetische und epigenetische
      Evidenz wird gesondert belegt.
    locator: „The arrival of Lysenkoism“, nummerierte Liste der Lehrsätze zur Vererbung erworbener Merkmale und zur
      Ablehnung der Chromosomentheorie. Anschließend die Absätze zu landwirtschaftlichen Behauptungen und zur Unterdrückung
      der Genetik.
  - id: lysenko-pushback-impact
    note: >-
      Dokumentiert Unterdrückung und den schwierigen Wiederaufbau biologischer Forschung und Lehre, einschließlich
      geschützter Arbeit vor 1964.
    locator: Abstract sowie die Abschnitte „Revival of a full-fledged biological education“, „The attempts of nationwide
      rehabilitation of genetics“ und „Conclusions“. Sie behandeln die geschützte Forschung der 1950er-Jahre und die
      spätere offizielle Rehabilitierung.
  - id: lysenko-holodomor-impact
    note: >-
      Quantitative Studie zum Holodomor, die zeigt, dass Wanderungsbeschränkungen und eine antiukrainische Verzerrung
      der sowjetischen Getreidebeschaffungs- und Rückhaltungspolitik zur hohen ukrainischen Sterblichkeit beitrugen;
      hier zur Abgrenzung dieser belegten Mechanismen von Lyssenkos gleichzeitigem Agrarprogramm verwendet.
    locator: Das Abstract des Verlags behandelt die regional unterschiedliche Sterblichkeit, die Benachteiligung der
      Ukraine bei der Getreideablieferung und beim Verbleib von Vorräten sowie die Beschränkung der Freizügigkeit. Grundlage
      ist das Abstract.
  - id: lysenko-china-famine-impact
    note: >-
      Gibt eine Schätzung von etwa 15–30 Millionen zusätzlichen Todesfällen während der Großen Chinesischen Hungersnot
      und betont, dass die Hungersnot aus mehreren zusammenwirkenden Faktoren entstand.
    locator: Die Einleitung nennt auf S. 659 im ersten Absatz und in Fußnote 1 die Spanne von 15 bis 30 Millionen. Die
      ersten beiden Absätze von „The 1959–1961 famine in China“ (Abschnitt 2) behandeln das Zusammenwirken mehrerer
      Ursachen. Geprüft wurden die genannten Passagen.
  - id: lysenko-great-leap-impact
    note: >-
      Modelliert, wie optimistische Produktivitätserwartungen, die Verlagerung landwirtschaftlicher Arbeitskräfte
      und erhöhte Getreidebeschaffung mit sinkender Produktion zusammenwirkten und den Nahrungsmittelkonsum einbrechen
      ließen.
    locator: Abstract (S. 840), Einleitung (S. 841–844) und Abschnitt II „Development Strategy and Rural Institutions“
      (S. 844–845). Die Autoren behandeln Ertragserwartungen, Kollektivierung, überhöhte Erntemeldungen, den Abzug von
      Arbeitskräften und zu hohe Getreideabgaben.
  - id: lysenko-grain-exports-impact
    note: >-
      Zeigt, dass sinkende Agrarproduktion, höhere Beschaffung, Getreideexporte und zunehmend starre Beschaffung gemeinsam
      die Übersterblichkeit erhöhten; kein einzelner Faktor erklärt die Hungersnot insgesamt.
    locator: Grundlage sind das Abstract des Verlags, die „Highlights“ und der frei zugängliche Teil der Einleitung.
      Sie beschreiben die Analyse auf Kreisebene und die Modellrechnungen zu Erntemengen, Getreideablieferungen, Exporten
      und starren Ablieferungsquoten.
  - id: lysenko-nature-ussr-carrier
    note: >-
      Zeitgenössischer Bericht von 1948 über Entlassungen, Laborschließungen und die Entfernung orthodoxer Genetiker
