schemaVersion: 2
title: Visual fire patterns as indicators of accelerant use
proposition:
  summary: >-
    Particular post-fire visual patterns, including shiny “alligator” char, crazed glass, narrow V-patterns, and unusually deep or low burning, were treated as signs that a fire had burned unusually hot or fast because a liquid accelerant had been used.
correction:
  summary: >-
    Fire damage patterns can help reconstruct origin and fire development, but many once-traditional “arson indicators” are not specific to ignitable liquids or deliberate fire-setting. Flashover, ventilation, suppression water, fuel geometry, and ordinary fire dynamics can produce patterns once attributed to accelerants. Modern fire investigation therefore requires hypothesis testing, scene context, and corroborating physical or chemical evidence rather than treating a single visual pattern as proof of arson.
category: Forensic science and fire investigation
reviewedAt: 2026-08-24
