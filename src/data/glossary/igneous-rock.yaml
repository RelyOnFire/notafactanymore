term: Igneous rock
aliases:
- igneous rocks
shortDefinition: Rock formed when molten rock—magma or lava—cools and solidifies.
longDefinition: Igneous rocks form by the cooling and solidification of molten rock. Magma that cools underground can
  form intrusive rocks such as granite, while lava that cools at or near the surface forms volcanic rocks such as basalt.
  Crystal size and texture depend strongly on composition and cooling history.
relatedTerms:
- sedimentary-rock
- metamorphic-rock
- neptunism
reviewedAt: '2026-08-21'
sources:
