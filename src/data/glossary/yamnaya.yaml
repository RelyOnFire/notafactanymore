term: Yamnaya
aliases:
- Yamnaya culture
- Yamna
shortDefinition: Mobile pastoralist communities of the Pontic-Caspian steppe whose ancestry spread widely into Europe
  during the third millennium BCE.
longDefinition: Yamnaya refers to an archaeological horizon of pastoralist communities centered on the Pontic-Caspian
  steppe around the late fourth and early third millennia BCE. Ancient human DNA shows a major spread of steppe-related
  ancestry into large parts of Europe during this period. Archaeological evidence also includes distinctive burial mounds,
  pastoral economies, and wheeled transport.
relatedTerms:
- ancient-dna
reviewedAt: '2026-08-21'
sources:
- title: The origins and spread of domestic horses from the Western Eurasian steppes
  url: https://doi.org/10.1038/s41586-021-04018-9
  publisher: Nature
  note: Discusses the Yamnaya expansion and tests its proposed association with widespread horse-based mobility.
