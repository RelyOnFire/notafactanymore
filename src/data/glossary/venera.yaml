term: Venera
aliases:
- Venera program
- Venera landers
shortDefinition: The Soviet series of Venus probes that achieved the first successful atmospheric entry, landing, surface
  measurements, and images from another planet.
longDefinition: Venera was the Soviet Union's long-running Venus exploration program. Successive missions measured the
  planet's dense carbon-dioxide atmosphere, enormous surface pressure, and extreme temperature. Venera 7 made the first
  successful soft landing on another planet in 1970, and later Venera landers returned surface images and increasingly
  detailed measurements.
relatedTerms:
