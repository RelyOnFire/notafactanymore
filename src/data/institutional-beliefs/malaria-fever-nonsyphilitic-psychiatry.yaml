schemaVersion: 2
title: Malaria fever therapy for non-syphilitic psychiatric disease
proposition:
  summary: >-
    Deliberately infecting psychiatric patients with Plasmodium vivax and provoking repeated high fevers was treated as
    a therapeutic method for schizophrenia, intellectual disability, affective disorders, psychopathic disorders and
    other conditions without neurosyphilis. At Vienna's university psychiatric clinic, fever was expected to produce a
    nonspecific change of psychological state or stimulate development even when there was no syphilitic infection for
    the heat to act against.
correction:
  summary: >-
    The historical benefit of malaria fever therapy in general paresis was tied to a specific infectious cause:
    neurosyphilis. It did not establish P. vivax infection as a treatment for schizophrenia or other nonsyphilitic
    psychiatric conditions. The Vienna archival review found no detailed contemporary discussion of the indication for
    its four principal nonsyphilitic diagnosis groups, and the broader historical literature describes results in such
    disorders as mixed and less successful. Modern care treats malaria as a serious infection and neurosyphilis with
    antibiotics; deliberately induced malaria has no established psychiatric indication. The correction is therefore
    confined to the nonsyphilitic extension and does not erase the distinct pre-penicillin history of treatment for
    general paresis.
category: Medicine and public health
reviewedAt: '2026-09-30'
impact:
  summary: >-
    Vienna's university psychiatric clinic maintained a blood-transmitted P. vivax strain and recorded 869
    malaria-fever therapy cases across diagnoses from 1951 to 1968. Within five focal adult diagnosis groups, 609 of 772
    treatment cases—nearly 79%—were for diagnoses other than neurosyphilis. The archive identifies 158 people whose main
    diagnosis was schizophrenia among those intentionally infected. Patients typically received infected blood, passed
    through repeated fever attacks around or above 40 °C, and were then given antimalarial drugs. The last recorded use
    was in December 1968, long after penicillin and psychiatric medicines had changed the available alternatives.
  highlights:
    - value: '869'
      label: malaria-fever therapy cases recorded across diagnoses at the Vienna clinic
    - value: 609 / 772
      label: cases in five focal adult diagnosis groups that involved diagnoses other than neurosyphilis
    - value: '158'
      label: people with a main schizophrenia diagnosis identified among the iatrogenic P. vivax infections
  context:
    - >-
      The 772 figure counts treatment cases or admissions in the five diagnosis groups, not necessarily 772 unique
      people. The historical study says repeat malaria therapy was rare, so case and patient totals were close. The 869
      total also includes 97 cases with other diagnoses; a separate child-ward review found 35 malaria-therapy cases.
    - >-
      The 1927 Nobel Prize was expressly awarded for malaria inoculation in dementia paralytica, the neuropsychiatric
      manifestation of late syphilis. It supplied prestige to malaria fever therapy but did not endorse its extension to
      schizophrenia, intellectual disability, affective disorders or psychopathic diagnoses.
    - >-
      Records called some transferred patients “strain carriers,” showing that they helped keep the human-to-human
      malaria chain alive. The investigators could not determine that any individual was infected solely for that
      purpose, because the same diagnoses were also treated therapeutically. The record supports concern and uncertainty,
      not a categorical claim of nontherapeutic experimentation.
    - >-
      One person in the schizophrenia cohort died during the hospital stay after P. vivax inoculation and subsequent
      antimalarial treatment. The file did not establish a cause of death, so this record does not attribute that death
      to malaria therapy.
episodes:
  - id: austria-vienna-1951-1968
    polity: Austria — Vienna
    region: Europe
    startYear: 1951
    endYear: 1968
    periodLabel: 1951–1968
    strength: policy-basis
    institutionTypes:
      - university
      - medical
    institutions:
      - Psychiatric-Neurological University Clinic, Vienna
      - Faculty of Medicine, University of Vienna
      - Vienna General Hospital
    institutionalContext: >-
      Under director Hans Hoff, Vienna's university psychiatric clinic retained malaria fever therapy as an established
      treatment option throughout the transition to neuroleptics and antidepressants. Physicians selected patients by
      symptoms as well as diagnosis and used the procedure for schizophrenia, intellectual disability, affective and
      psychopathic disorders and other nonsyphilitic conditions. A retrospective database found 869 malaria-therapy
      cases overall, including 772 in five focal adult diagnosis groups; 609 of those 772 were nonsyphilitic. Most people
      in those diagnostic groups did not receive malaria therapy, so this was an institutionalized but selective practice
      rather than a universal clinic rule.
    consequences:
      - Deliberate infection of psychiatric patients with blood-stage Plasmodium vivax
      - Repeated fever attacks, often around or above 40 °C, before antimalarial treatment ended the blood-stage infection
      - Use for schizophrenia, intellectual disability, affective and psychopathic diagnoses without a neurosyphilis rationale
      - Combination in some cases with electroshock, insulin shock or typhoid provocation therapy
      - Continued exposure to an infectious disease after noninfectious psychiatric treatments and penicillin were available
      - Use of some transferred patients as carriers in the chain that preserved the clinic's malaria strain
    summary: >-
      From 1951 through December 1968, Vienna's university psychiatric clinic deliberately transmitted P. vivax in a
      broad range of psychiatric cases. In complete schizophrenia records, inoculation was usually intravenous, the dose
      was 4–8 mL of infected blood and patients averaged 5.4 documented fever attacks before antimalarial treatment. The
      clinic described the aim outside neurosyphilis as a nonspecific change of psychological state or developmental
      stimulus. Yet the archival project found no detailed contemporary indication discussion for its four main
      nonsyphilitic diagnosis groups, and Vienna persisted after comparable German-speaking clinics had sharply reduced
      or ended the practice.
    mechanism:
      kind: administrative-adoption
      summary: >-
        The clinic maintained a transmissible P. vivax strain, selected psychiatric inpatients for inoculation, passed
        infected blood from one person to the next, monitored repeated fever attacks and then administered antimalarial
        drugs. This clinical infrastructure made malaria fever therapy a repeatable institutional treatment outside its
        original neurosyphilis indication.
    institutionalCorrection:
      status: partial
      periodLabel: 1968; institutional review 2012–2015 and later publication
      action: >-
        The clinic ended the practice after its last recorded treatment in December 1968. In 2012 the Medical University
        of Vienna commissioned an external historical investigation and presented its findings publicly in 2015; the
        archival findings later appeared in peer-reviewed publications.
      summary: >-
        The review documented the exceptional breadth of use, the weak published justification for nonsyphilitic
        indications and the possibility that strain preservation influenced individual cases. A director of a successor
        clinic explicitly rejected and regretted any use primarily to maintain the strain. The official presentation also
        judged the broader practice permissible by contemporary standards and found no evidence that it was used for
        punishment or testing. This is a substantive but qualified institutional reckoning; the reviewed sources do not
        document a categorical repudiation, apology to all affected patients or compensation program.
