  - id: neonatal-trial-correction
    sourceId: neonatal-fentanyl-trial
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: PubMed abstract, treatment allocation, hormonal and metabolic results, and concluding sentence
    note: >-
      Randomized trial of 16 preterm infants showing much larger hormonal and metabolic responses without fentanyl and
      postoperative circulatory and metabolic complications in the non-fentanyl group. The abstract's conclusion treats
      improved postoperative outcome as a possibility.
  - id: neonatal-aap-correction
    sourceId: neonatal-aap-policy
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: >-
      Pediatrics 80(3), p. 446, recommendation; checked in the contemporary excerpt in Journal of Dentistry for Children
      54(6), November–December 1987, p. 444 (PDF p. 49):
      https://www.aapd.org/globalassets/media/publications/jdc-archives/asdc-nov-dec-1987-v54no6.pdf#page=49
    note: >-
      1987 policy statement from the AAP's fetus/newborn, drugs, anesthesiology and surgery groups concluding that
      available pharmacologic agents permitted relatively safe neonatal anesthesia or analgesia and that it was indicated for surgical procedures.
      The recommendation uses the usual clinical criteria for high-risk, potentially unstable patients, allowing drug
      reduction or discontinuation for physiological instability. Decisions should use the same medical criteria as
      for older patients, without relying solely on age or presumed cortical immaturity.
