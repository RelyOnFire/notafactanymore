schemaVersion: 2
title: Polygraph screening as reliable detection of deception and personnel risk
proposition:
  summary: >-
    Polygraph screening was treated as accurate enough to infer deception, concealed misconduct, or personnel risk from
    physiological responses, justifying mandatory personnel screening and consequential security, integrity, hiring, or
    appointment decisions.
correction:
  summary: >-
    Polygraph responses measure physiological arousal, not deception, integrity, or corruption propensity itself.
    Specific-incident testing can perform above chance under some conditions, but it is far from infallible, and evidence
    for broad personnel-screening accuracy is much weaker. Screening and high-stakes appointment decisions amplify
    false-positive and false-negative risks, especially when the targeted misconduct is rare. Polygraphs may still have
    investigative, deterrent or admission-eliciting utility, but those functions are distinct from reliable individual
    truthfulness, integrity or future-misconduct determination.
category: Security screening and behavioral detection
reviewedAt: '2026-09-07'
impact:
  summary: >-
    The documented footprint includes restrictions on polygraph screening and its continuing use in consequential
    personnel systems. The U.S. Department of Energy
    restricted routine polygraph screening after a National Academies review; Moldova removed a dispositive
    positive-result gate after constitutional review. Kyrgyzstan, Kazakhstan and Uzbekistan, however, continue
    to embed polygraph results in public-service, law-enforcement or judicial personnel systems. The
    institutional error is not the use of physiological data itself, but treating those responses as
    sufficiently diagnostic of truthfulness, concealed misconduct or integrity risk to influence consequential
    personnel decisions.
  highlights:
    - value: '2002'
      label: National Academies found screening accuracy insufficient to justify reliance on polygraphs for detecting security violators
    - value: 2010–present
      label: Kyrgyzstan retains polygraph testing in its state-service personnel framework, including corruption-risk posts
    - value: 2014–present
      label: Kazakhstan requires polygraph conclusions on answer truthfulness in law-enforcement screening and later extended testing to judge candidates
    - value: 2023–present
      label: Uzbekistan made polygraph examination part of Interior Ministry recruitment and trains specialists to assess corruption and misconduct risk
  context:
    - >-
      The correction is narrower than “polygraphs never work.” The strongest evidentiary problem concerns broad screening
      and consequential personnel decisions, where physiological arousal is treated as if it uniquely identified deception,
      concealed misconduct or future institutional risk.
    - >-
      Several current systems formally describe polygraph conclusions as advisory, probabilistic or one component of a wider
      assessment. They still qualify here when the test is institutionally required and its inferred truthfulness or risk
      findings are expressly fed into hiring, appointment, attestation or internal-investigation decisions.
episodes:
  - id: united-states-doe-1999-2006
    polity: United States
    region: North America
    startYear: 1999
    endYear: 2006
    periodLabel: 1999–2006
    strength: policy-basis
    institutionTypes:
      - government
    institutions:
      - United States Department of Energy (DOE)
      - National Nuclear Security Administration (NNSA)
      - DOE Office of Counterintelligence
    institutionalContext: >-
      DOE’s 1999 rule made counterintelligence polygraph screening part of the access regime for categories of
      federal and contractor personnel handling highly sensitive nuclear and classified information. The rule
      already barred adverse personnel action solely on an adverse or inconclusive polygraph result and required
      further investigation of unresolved issues. DOE commissioned a National Academy of Sciences review in
      November 2000; Congress subsequently required DOE to take its findings into account. After the report was
      released in October 2002, DOE initially proposed continuing the existing program in 2003. The 2006
      replacement rule removed polygraph testing as an automatic component of routine counterintelligence
      evaluations, while retaining examinations in specified circumstances, including random selection. It
      retained the existing safeguards against adverse personnel or access decisions based solely on test
      results.
    consequences:
      - >-
        The rule required counterintelligence polygraph screening for covered employees and contractor
        personnel, with specified waivers
      - >-
        Refusal could bar appointment to covered positions or end access to the sensitive information and
        activities concerned
      - >-
        Unresolved results required follow-up interviews, possible retesting and, if still unresolved, a
        comprehensive investigation
      - >-
        Screening created predictable risks of false suspicion and false reassurance in a very low-base-rate
        security population
    summary: >-
      In 1999 the U.S. Department of Energy created a formal counterintelligence polygraph screening program for
      employees, contractors and applicants with access to especially sensitive classified information and
      nuclear-security programs. Its December 1999 final rule took effect on 18 January 2000. DOE then
      commissioned the National Academies to review the science. The review released in 2002 concluded that
      screening for rare spies and saboteurs creates an unacceptable tradeoff between false suspicion of
      innocent employees and missed security threats. DOE’s 2006 replacement rule restricted routine polygraph
      screening, retained testing in specified circumstances and kept safeguards already present in the earlier
      system.
    mechanism:
      kind: administrative-adoption
      summary: >-
        DOE made polygraph examination a formal personnel-access screening requirement and used results to trigger further
        counterintelligence evaluation for employees, contractors and applicants in sensitive positions.
    institutionalCorrection:
      status: partial
      periodLabel: '2006'
      action: >-
        DOE ended automatic polygraph testing in routine counterintelligence evaluations, retained testing in
        specified circumstances including random selection, and kept existing safeguards against adverse
        decisions based solely on test results.
      summary: >-
        The replacement rule restricted routine screening without abandoning polygraphs. The prohibition on
        adverse personnel action based solely on an adverse or inconclusive test was already present in the 1999
        rule; the 2006 rule retained that protection and the existing safeguard for access decisions.
  - id: moldova-2016-2018
    polity: Moldova
    region: Eastern Europe
    startYear: 2016
    endYear: 2018
    periodLabel: 2016–2018
    strength: policy-basis
    institutionTypes:
      - government
    institutions:
      - National Integrity Authority (Autoritatea Națională de Integritate)
      - Integrity Council (Consiliul de Integritate)
    institutionalContext: >-
      Moldova’s 2016 integrity-law framework made a positive polygraph result a practical condition for
      appointment to senior leadership of the National Integrity Authority. In 2017 candidate Teodor Cârnaț
      passed the written examination and interview but was excluded by the Integrity Council because his
      polygraph was not positive. In 2018 the Constitutional Court emphasized that polygraph results are
      presumptive and orientative, reviewed the test’s low scientific certainty, and invalidated the requirement
      that a candidate obtain a positive result.
    consequences:
      - >-
        A candidate for a senior public integrity office was excluded solely because he did not obtain a
        positive polygraph result
      - A physiologically based test became an eliminatory gate for public appointment
      - The system risked treating uncertain deception inference as a definitive integrity judgment
      - >-
        A constitutional challenge resulted in removal of the positive-result gate while mandatory testing
        remained in place
    summary: >-
      Moldova’s 2016 National Integrity Authority framework required leadership candidates to undergo polygraph testing in
      a way that made a positive result eliminatory. In 2017 Teodor Cârnaț was excluded after passing the written and
      interview stages because he did not obtain a positive polygraph result. The Constitutional Court held in 2018 that the
      test has low scientific certainty and is presumptive and orientative rather than exact; it removed the positive-result
      requirement as an unjustified dispositive barrier.
    mechanism:
      kind: administrative-adoption
      summary: >-
        The Integrity Council applied the integrity-law appointment framework as an eliminatory gate for senior
        public appointment, allowing a non-positive polygraph result to override otherwise successful selection
        stages.
    institutionalCorrection:
      status: partial
      periodLabel: 10 April 2018
      action: Moldova's Constitutional Court struck down the requirement that a candidate obtain a positive polygraph result and characterized the test as presumptive and orientative rather than exact.
      summary: >-
        The court upheld mandatory testing for leadership candidates but removed a positive result as a
        condition for winning the competition. It allowed conclusions to be considered alongside other
        substantiated evidence, limiting the test’s authority without abolishing its use.
  - id: kyrgyzstan-2010-2026
    polity: Kyrgyzstan
    region: Central Asia
    startYear: 2010
    endYear: 2026
    endOpen: true
    periodLabel: 2010–present
    strength: policy-basis
    institutionTypes:
      - government
    institutions:
      - State Personnel Service of the Kyrgyz Republic
      - State Agency for Civil Service and Local Government under the Cabinet of Ministers of the Kyrgyz Republic
    institutionalContext: >-
      A 2010 presidential decree introduced polygraph testing into Kyrgyzstan’s state-service personnel system
      and assigned centralized implementation to the State Personnel Service. The implementing regulation
      revised in 2011 defined testing as an assessment of the reliability of information supplied by the
      examinee and set goals including detecting official abuse, identifying commitment or susceptibility to
      corrupt conduct, verifying education and qualifications, and assessing suitability for a post. It defined
      the examinee as a person who gives voluntary written consent. Amendments in 2018 expressly included
      government positions most exposed to corruption risk and removed attestation references. The present State
      Agency for Civil Service and Local Government still lists the decree in its normative legal base, and its
      governing regulation assigns it responsibility for organizing polygraph testing where legislation
      provides.
    consequences:
      - State-service applicants in covered posts can be subjected to polygraph screening
      - Physiological responses are used to assess the reliability of information supplied by candidates and officials
      - Testing is directed at corruption susceptibility, official misconduct and suitability for public service
      - Polygraph information can enter recruitment, rotation and internal-investigation processes
    summary: >-
      Kyrgyzstan formally introduced polygraph testing into state-service personnel policy in 2010 as an
      anti-corruption and integrity-screening tool. The implementing framework revised in 2011 treats the
      examination as capable of assessing whether information supplied by an applicant or official is reliable
      and uses it to probe corruption-related risk, hidden misconduct, qualifications and job suitability, with
      voluntary written consent. The regime was amended in 2018 to include posts considered particularly exposed
      to corruption and to remove attestation references. The current civil-service agency still lists the
      decree among its legal foundations and retains a statutory function to organize polygraph testing.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Within covered state-service procedures and with written consent, the personnel framework uses polygraph
        testing to judge the reliability of supplied information, corruption susceptibility, hidden misconduct,
        qualifications and suitability for public office.
    institutionalCorrection:
      status: undocumented
      summary: >-
        An institutional correction of the claimed screening capability is not documented. The civil-service
        agency continues to list the decree and retains responsibility for polygraph testing in legally
        specified cases; those provisions establish continuing institutional use rather than a response to the
        scientific criticism.
  - id: kazakhstan-2014-2026
    polity: Kazakhstan
    region: Central Asia
    startYear: 2014
    endYear: 2026
    endOpen: true
    periodLabel: 2014–present
    strength: policy-basis
    institutionTypes:
      - government
    institutions:
      - Government of the Republic of Kazakhstan
      - Ministry of Internal Affairs of the Republic of Kazakhstan
      - High Judicial Council of the Republic of Kazakhstan
      - National Security Committee of the Republic of Kazakhstan
    institutionalContext: >-
      Government rules originally adopted in 2014 and expanded subsequently require polygraph examinations for
      defined applicants and personnel in law-enforcement, civil-protection and state courier bodies. Their
      stated purpose is to obtain additional information and check the reliability of information supplied by
      the examinee; the polygraphist issues a formal conclusion about the truthfulness of answers. The rules
      expressly say the result is probabilistic, advisory and auxiliary, yet direct personnel, attestation,
      competition, admissions and internal-security bodies to use it in hiring, attestation, competition and
      service-investigation decisions. Testing during a service investigation requires the employee’s consent.
      The Interior Ministry’s 2023 recruitment order expressly directs its personnel bodies to refer candidates
      for testing. Separate rules adopted in 2016 require successful judicial-exam candidates to undergo testing
      at the National Security Committee on referral from the High Judicial Council, producing an advisory
      conclusion on answer truthfulness. Both frameworks remain current, with law-enforcement rules amended in
      May 2025 and judge-candidate declaration forms amended in July 2026.
    consequences:
      - >-
        Rules require polygraph screening for defined applicants and personnel procedures in covered
        law-enforcement, civil-protection and state courier bodies
      - Formal conclusions classify the truthfulness of answers given during the examination
      - >-
        Results feed hiring, attestation, promotion competition, education admission and service-investigation
        processes
      - >-
        Judge candidates who pass the qualification examination undergo polygraph testing before further
        consideration
      - Information suggesting involvement in offences is forwarded for further official verification
    summary: >-
      Kazakhstan has embedded polygraph screening in consequential public-personnel decisions since 2014.
      Current rules require a polygraphist to issue a conclusion on the truthfulness of an examinee’s answers
      and direct personnel and internal-security bodies to use the resulting information in recruitment,
      attestation, competitions and service investigations, while formally describing it as probabilistic and
      advisory. A parallel system has applied to judge candidates since 2016. The regime is still active: the
      law-enforcement rules were amended in 2025 and the judge-candidate polygraph forms again in July 2026.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Government personnel rules require polygraph examinations in defined procedures and formal truthfulness
        conclusions. Results enter recruitment, attestation, competitions and service investigations; separate
        judicial rules send advisory conclusions to the High Judicial Council after testing at the National
        Security Committee.
    institutionalCorrection:
      status: undocumented
      summary: >-
        An institutional correction of the claimed screening capability is not documented. The law-enforcement
        and judicial frameworks continue to require truthfulness assessments while describing results as
        advisory; the 2025 and July 2026 amendments do not establish a corrective response to the scientific
        limitations.
  - id: uzbekistan-2023-2026
    polity: Uzbekistan
    region: Central Asia
    startYear: 2023
    endYear: 2026
    endOpen: true
    periodLabel: 2023–present
    strength: policy-basis
    institutionTypes:
      - government
    institutions:
      - Ministry of Internal Affairs of the Republic of Uzbekistan
      - Academy of the Ministry of Internal Affairs of the Republic of Uzbekistan
    institutionalContext: >-
      Uzbekistan’s current Interior Ministry service rules make a psychophysiological polygraph examination part
      of the investigative stage for candidates entering the internal-affairs bodies from 1 September 2023,
      specifically to identify negative factors that can prevent service. The results of the selection and
      investigation stages feed an official conclusion on the candidate’s moral-professional and health
      suitability. The institutional interpretation is explicit in current practice: in August 2026 the Interior
      Ministry Academy trained ministry and partner-law-enforcement psychologists to use polygraph testing to
      assess applicant risk factors and identify an employee’s propensity toward corruption and other
      misconduct, including analysis of recorded psychophysiological reactions.
    consequences:
      - Police-service candidates undergo polygraph examination as part of the formal recruitment investigation stage
      - Polygraph-derived risk findings contribute to assessment of suitability for service
      - Personnel specialists are trained to infer propensity toward corruption and other misconduct from psychophysiological testing
      - The method is being institutionalized through certified specialist training inside the Interior Ministry system
    summary: >-
      Since September 2023, Uzbekistan has required a psychophysiological polygraph examination within the
      selection process for candidates entering the internal-affairs service, with the stated purpose of
      identifying negative factors that may bar service. This remains an active personnel practice. In August
      2026 the Interior Ministry Academy trained specialists to use polygraph examinations to evaluate candidate
      risk factors and to identify corruption and other misconduct propensity when making personnel decisions.
      The policy therefore goes beyond possession of a “lie detector”: physiological responses are formally used
      as information about hidden personnel risk in consequential state employment screening.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Interior Ministry service rules made polygraph testing part of recruitment screening, while the ministry academy
        trains specialists to infer applicant risk and propensity toward corruption or misconduct from psychophysiological responses.
    institutionalCorrection:
      status: undocumented
      summary: >-
        An institutional correction of the claimed screening capability is not documented. The recruitment rule
        and August 2026 Academy training document continuing use of polygraphs for personnel-risk judgments,
        without a documented retreat from those claims.
