title: Marrist linguistics
claim: Languages were treated as products of universal class-driven stages rather than primarily as members of historically descended language families, making conventional comparative linguistics “bourgeois” or scientifically obsolete.
currentUnderstanding: Languages change through historically traceable descent, contact, borrowing, innovation, and social use. Comparative linguistics can reconstruct genealogical relationships among language families; languages do not pass through a universal sequence of class-defined developmental stages.
category: Linguistics
reviewedAt: 2026-08-23
episodes:
  - id: soviet-union-1930-1950
    polity: Soviet Union
    region: Eurasia
    startYear: 1930
    endYear: 1950
    strength: enforced-doctrine
    institutionTypes: [government, academy, university, education]
    institutions:
      - Institute of Language and Thought of the Academy of Sciences of the USSR
      - Academy of Sciences of the USSR
      - Section of Materialist Linguistics of the Communist Academy
    institutionalContext: The Institute of Language and Thought was the principal institutional centre of Marrism. The doctrine's authority extended far beyond that institute through Academy structures, universities, journals, publishing and education; those distributed channels are described here rather than collapsed into labels such as “Soviet linguistic institutes.”
    consequences:
      - Competing comparative-historical linguistic schools were suppressed or marginalized
      - Research and teaching were reorganized around Marrist categories
      - Academic careers became vulnerable to accusations of “bourgeois” or anti-Marxist linguistics
    summary: From about 1930, Nikolai Marr's “New Theory of Language” became the officially recognized framework dominating Soviet linguistics. Traditional comparative and Indo-European linguistics were attacked as bourgeois, and substantial deviations from Marrist foundations were severely suppressed. In 1950 Stalin abruptly repudiated Marrism, after which the Institute of Language and Thought was dissolved and the doctrine was dismantled just as administratively as it had been elevated.
    sources:
      - title: Some Notes on the Marr School
        url: https://www.cambridge.org/core/journals/american-slavic-and-east-european-review/article/abs/some-notes-on-the-marr-school/37CCB9E1D9C61BBE175F953491E46BB7
        publisher: American Slavic and East European Review
        note: Contemporary scholarly review stating that Soviet linguistics was dominated from about 1930 to 1950 by officially recognized Marrist theory and that substantial deviations were severely suppressed.
      - title: Politics and the Theory of Language in the USSR 1917–1938
        url: https://www.cambridge.org/core/books/politics-and-the-theory-of-language-in-the-ussr-19171938/19FE73FCCDCA006737B8BEBD5A52AB85/listing
