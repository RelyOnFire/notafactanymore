term: Parity
aliases:
- parity symmetry
- parity conservation
- mirror symmetry
shortDefinition: A symmetry principle asking whether the laws governing a process remain the same when every spatial
  direction is reflected as in a mirror.
longDefinition: In particle physics, parity transforms a physical system into its spatial mirror image. If an interaction
  conserves parity, the mirrored process is governed in the same way as the original. Electromagnetic and strong interactions
  conserve parity to very high precision, but the weak interaction can violate it, meaning nature can distinguish left
  from right in weak processes.
relatedTerms:
- weak-interaction
reviewedAt: '2026-08-21'
sources:
- title: 'December 27, 1956: Fall of Parity Conservation'
  url: https://www.aps.org/apsnews/2001/12/fall-parity-conservation-1956
  publisher: American Physical Society
  note: Reviews parity conservation as a mirror-symmetry principle and the experiments showing its violation in weak
    beta decay.
