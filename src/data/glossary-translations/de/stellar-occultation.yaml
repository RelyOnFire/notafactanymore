entryId: stellar-occultation
sourceReviewedAt: '2026-08-21'
term: Sternbedeckung
aliases:
- Sternbedeckungen
- Bedeckung
shortDefinition: Ein Ereignis, bei dem ein Vordergrundobjekt vor einem Stern vorbeizieht und dessen Licht vorübergehend
  teilweise oder vollständig blockiert.
longDefinition: Bei einer Sternbedeckung messen Astronomen, wie sich die Helligkeit eines Hintergrundsterns verändert,
  während ein Vordergrundobjekt die Sichtlinie kreuzt. Zeitpunkt und Verlauf der Verdunkelung können Größe, Atmosphäre,
  Ringe oder Material in der Umgebung eines Objekts verraten, auch wenn diese Strukturen auf Bildern nicht direkt aufgelöst
  werden können.
