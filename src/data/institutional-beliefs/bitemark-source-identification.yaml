evidence:
  - id: bitemark-abfo-proposition
    sourceId: abfo-bitemark-guidelines
    relation: contextualizes
    target: {scope: belief, aspect: proposition}
    locator: "PubMed PMID 3457076, abstract (1986); full article not inspected."
    note: >-
      The inspected abstract of the 1986 ABFO guidelines records use of bitemark evidence in courts and military
      justice and describes methods for collecting it. The full article was not inspected; this abstract does
      not establish the scientific validity of source identification.
  - id: bitemark-nist-correction
    sourceId: nist-bitemark-final
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: "Linked final report NIST IR 8352 (March 2023), Executive Summary p. 2 and Introduction p. 4, Key Takeaway #1.1 (printed pagination)."
    note: >-
      Final NIST publication reviewing the scientific foundations of forensic bitemark analysis and the evidence
      needed to support source-comparison claims. Its finding of insufficient data extends to accurate exclusion
      and non-exclusion from skin-bitemark comparisons.
  - id: bitemark-nist-premises
    sourceId: nist-bitemark-draft-news
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: "October 2022 draft-review news release, paragraphs listing the three premises and discussing ABFO conclusion categories."
    note: >-
      Explains the review's three unsupported premises: individual uniqueness of anterior dental patterns,
      consistent transfer of those patterns to skin, and reliable examiner analysis of the resulting injury
      pattern.
