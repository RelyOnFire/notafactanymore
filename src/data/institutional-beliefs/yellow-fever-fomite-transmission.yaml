  institutionalContext: When U.S. forces entered Cuba in 1898, Army medical doctrine treated contaminated places and
    effects as important sources of yellow-fever infection. Official recommendations included burning buildings used
    by inhabitants, destroying refugees' and convalescents' clothing and moving camps away from supposedly infected
    sites. In Havana, cleaning, quarantine and disinfection improved general health but failed to control yellow fever.
    Surgeon General George Sternberg therefore created the Yellow Fever Commission in May 1900. Reed, Carroll, Lazear
    and Agramonte then combined mosquito experiments with a deliberately severe fomite test at Camp Lazear. Volunteers
    remained healthy after prolonged exposure to contaminated clothing and bedding. Army sanitary policy shifted toward
    screening patients, killing adult mosquitoes and eliminating breeding sites, while laborious disinfection of baggage
    and exposed effects was dropped as a yellow-fever measure.
  consequences:
  - Destruction by fire of buildings and clothing believed capable of carrying yellow-fever infection
  - Time-consuming disinfection and quarantine procedures directed at supposedly contaminated personal effects
  - Persistence of yellow fever despite extensive city cleaning and fomite-focused sanitary measures
  - Use of controlled human experiments by the Army commission to discriminate between fomite and mosquito transmission
  - Rapid replacement of the old mechanism with mosquito exclusion, fumigation and breeding-site control
  - Major reduction and eventual elimination of urban yellow fever in Havana under the vector-control programme
  summary: 'The U.S. Army''s Cuba experience is a compact institutional correction. In 1898 its medical system acted
    on the widely held belief that infected rooms, clothing and bedding could carry yellow fever. The same military
    medical apparatus then tested that proposition directly: nonimmune volunteers remained healthy despite prolonged
    contact with contaminated fomites, while infected mosquitoes transmitted the disease. The military government
    rewrote sanitary practice around the mosquito mechanism, making the disconfirmed causal belief immediately consequential
    for policy.'
