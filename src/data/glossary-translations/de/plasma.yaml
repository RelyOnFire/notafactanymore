term: Plasma
aliases:
- ionisiertes Gas
shortDefinition: Ein Gas, in dem so viele Atome oder Moleküle elektrisch geladen sind, dass sich das Material kollektiv
  als System geladener Teilchen verhält.
longDefinition: Plasma entsteht, wenn ein Gas viele freie Elektronen und Ionen enthält. Da diese geladenen Teilchen
  stark auf elektrische und magnetische Felder reagieren, kann sich Plasma anders verhalten als ein gewöhnliches
  neutrales Gas. Ein großer Teil des dünnen Materials im Weltraum liegt als Plasma vor.
