  - id: yenish-federal-council-institutional-correction
    sourceId: yenish-federal-council-2025
    relation: documents
    target: {scope: episode, episodeId: switzerland-1926-1973, aspect: institutional-correction}
    locator: Published 20 February 2025
  - id: yenish-pro-juventute-institutional-correction
    sourceId: yenish-pro-juventute-2025
    relation: documents
    target: {scope: episode, episodeId: switzerland-1926-1973, aspect: institutional-correction}
    locator: Paragraphs 1–6
    note: >-
      The program's institutional carrier acknowledges that the removals rested on discriminatory assumptions, accepts
      the crimes-against-humanity classification and renews its apology to those affected and their families.
  - id: yenish-ekr-statement-partial-correction
    sourceId: yenish-ekr-statement-2025
    relation: contextualizes
    target: {scope: episode, episodeId: switzerland-1926-1973, aspect: institutional-correction}
    locator: Statement of 15 May 2025
    note: >-
      The federal anti-racism commission welcomed the legal opinion but criticized the Federal Council for reaffirming a
      general 2013 apology without explicitly naming and apologizing for the specifically racist persecution of Yenish and Sinti.
  - id: yenish-dialogue-report-partial-correction
    sourceId: yenish-dialogue-report-2026
    relation: contextualizes
    target: {scope: episode, episodeId: switzerland-1926-1973, aspect: institutional-correction}
    locator: Executive summary and sections 1–3, pp. 1–5
    note: >-
      External preparatory report from the 2025 federal dialogue recommends an independent commission, public hearings
      and further research. The document says its views are the authors' and presents a proposal rather than an adopted commission.
