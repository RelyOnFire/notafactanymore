schemaVersion: 2
title: Microscopic hair similarity as source attribution
proposition:
  summary: >-
    A questioned hair that appeared microscopically indistinguishable from a suspect's hair was treated as evidence
    that could strongly attribute the hair to that person, sometimes with numerical or near-individualizing claims
    about how unlikely another source would be.
correction:
  summary: >-
    Microscopic hair comparison can describe morphology, distinguish some samples, exclude dissimilar hairs, and in
    context support a limited association. It cannot uniquely identify a person, however, and historical examiners
    lacked validated population-frequency data that could turn microscopic similarity into an individual-source
    probability. Mitochondrial or nuclear DNA testing can provide more meaningful source information when suitable
    biological material is available.
category: Forensic science and criminal evidence
reviewedAt: 2026-09-18
impact:
  summary: >-
    The FBI's later review identified a systemic problem in how microscopic similarities were communicated, not a
    finding that microscopy itself was scientifically meaningless. Unsupported probability and individualizing
    language made a limited association sound far more source-specific than the underlying method allowed.
  highlights:
    - value: '96%'
      label: "257 of 268 cases with reviewed inculpatory trial testimony contained erroneous statements, in the March 2015 interim results"
    - value: Nearly 3,000
      label: Cases identified by the government for potential FBI review
    - value: '41'
      label: States in which the reviewed FBI examiners had testified
  context:
    - >-
      These are interim review figures reported in April 2015 for the review’s progress as of March 2015. They
      measure flawed examiner statements or reports, not a count of wrongful convictions. The review covered FBI
      examinations used in federal and state courts, but excluded examinations performed by state and local
      laboratories. It distinguished microscopic comparison as a descriptive technique from unsupported claims
      about the significance of a similarity.
    - >-
      The FBI also trained hundreds of state and local hair examiners. Its later root-cause analysis found no evidence
      of malicious intent and identified insufficiently specific guidance for reports and testimony as the most
      important cause of the errors.
episodes:
  - id: united-states-1973-1999
    polity: United States
    region: North America
    startYear: 1973
    endYear: 1999
    periodLabel: 1973–1999
    strength: policy-basis
    institutionTypes:
      - government
      - professional
      - court
      - education
    institutions:
      - Federal Bureau of Investigation Laboratory
      - FBI Academy
    institutionalContext: >-
      FBI hair microscopy predated 1973, but that year marks the documented beginning of FBI training for state
      and local hair examiners, extending the Bureau’s role in disseminating the practice. The FBI later limited
      its formal retrospective review to analyses before 31 December 1999; mitochondrial-DNA analysis had been
      introduced in 1996 as a more meaningful complementary source test. The episode’s end year marks that
      review boundary, not the end of microscopic hair comparison.
    consequences:
      - Hair evidence was used to associate defendants with crime scenes, victims, weapons, or other objects
      - Laboratory reports and sworn testimony sometimes overstated the source significance of microscopic similarity
      - FBI training propagated hair-comparison practice to hundreds of state and local examiners
      - A large federal and state notification and case-review effort followed the discovery of systematic testimony errors
    summary: >-
      The FBI Laboratory used microscopic hair comparison to evaluate whether questioned and known hairs shared
      the same observable characteristics, and beginning in 1973 the FBI trained state and local analysts in the
      method. Similarity could legitimately support a limited association, but examiners sometimes went much
      further by using probabilities or individualizing language that had no validated population-frequency
      basis. In the March 2015 interim results of the FBI/DOJ review of pre-2000 cases, erroneous statements
      appeared in 257 of 268 cases with reviewed inculpatory trial testimony. The FBI later stressed that
      microscopy itself remained a valid comparative technique while acknowledging that historical reports and
      testimony had overstated what a match could mean.
    mechanism:
      kind: education
      summary: >-
        The FBI disseminated microscopic hair comparison through laboratory casework, technical manuals and
        courses for hundreds of state and local examiners. Its 1977 manual expressly limited individual
        identification, but the 2015 joint statement documented that training courses also incorporated
        scientifically flawed language used in reports and testimony.
    institutionalCorrection:
      status: corrected
      periodLabel: "2012–2019"
      action: "FBI/DOJ reviewed historical testimony, acknowledged errors, notified affected parties and investigated their causes; the FBI reported reforms and concluded its review in 2019."
      summary: >-
        The review began in 2012. In 2015 the FBI acknowledged widespread overstatement, said it no longer made
        the faulty claims and committed to independent investigation. It commissioned the root-cause study in
        2017; the study was completed in 2018. In 2019 the FBI reported changes to training, supervision and
        testimony monitoring and announced that its review had concluded, while retaining provision for later
        qualifying transcripts. These actions document a change in the FBI’s reporting position and the
        completion of its defined review project; they do not establish that every affected conviction or state
        and local laboratory practice was corrected.
