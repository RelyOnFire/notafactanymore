locale: de
entryId: slansky-anti-state-conspiracy
sourceReviewedAt: '2026-08-25'
title: Die Slánský-Gruppe als staatsfeindliches Verschwörungszentrum
claim: >-
  Kommunistische Partei, Staatssicherheit und Justiz der Tschechoslowakei behaupteten, Rudolf Slánský führe ein
  staatsfeindliches Verschwörungszentrum, das im Auftrag westlicher Nachrichtendienste und verwandter ideologischer
  Feinde Spionage, Sabotage und Verrat betreibe. Erzwungene Geständnisse und ein inszenierter öffentlicher Prozess
  machten die konstruierte Verschwörung zur scheinbaren Tatsache.
currentUnderstanding: >-
  Tschechische staatliche Geschichtsinstitutionen beschreiben den Slánský-Fall heute als konstruierten politischen
  Prozess. Die Angeklagten wurden körperlichem Druck, langen Verhören und einstudierten Geständnissen unterworfen; die
  Anklage verband sie mit westlichen Nachrichtendiensten und einem angeblichen staatsfeindlichen Zentrum. Im November
  1952 standen 14 Menschen vor Gericht, elf wurden zum Tode und drei zu lebenslanger Haft verurteilt. 1963 wurden die
  Verurteilten sowohl gerichtlich als auch parteiintern rehabilitiert.
impact:
  summary: >-
    Der Slánský-Prozess wurde als nationales Propagandaereignis und Warnsignal für die Eliten des kommunistischen Blocks
    inszeniert. Die Anklage konstruierte um hochrangige Partei- und Staatsfunktionäre ein „staatsfeindliches
    Verschwörungszentrum“ und zwang die Angeklagten, von Ermittlern verfasste Geständnisse auswendig zu lernen. Der
    Prozess wurde intensiv propagandistisch begleitet; mehr als 8.500 Petitionen unterstützten die Urteile, die Mehrheit
    verlangte Todesstrafen für alle Angeklagten. Elf der 14 Angeklagten wurden am 3. Dezember 1952 hingerichtet, die
    übrigen drei erhielten lebenslange Haft. 1963 erfolgte ihre geheime gerichtliche und parteiinterne Rehabilitation.
  highlights:
  - value: '14'
    label: Angeklagte im Slánský-Prozess vom November 1952
  - value: '11'
    label: zum Tode verurteilte und hingerichtete Angeklagte
  - value: '3'
    label: zu lebenslanger Haft verurteilte Angeklagte
  context:
  - >-
    Elf der 14 Angeklagten wurden in der Kampagne als Menschen jüdischer Herkunft bezeichnet; der Prozess hatte eine
    ausgeprägte antisemitische und antizionistische Dimension. Die Karte behauptet nicht, sämtliche Angeklagten seien
    jüdisch gewesen.
  - >-
    Die Verhaftungen begannen vor dem öffentlichen Prozess im November 1952. Slánský selbst wurde im November 1951
    festgenommen, einige spätere Mitangeklagte bereits früher. Die Episode beginnt 1951, weil sich die
    Verschwörungskonstruktion damals um Slánský als angeblichen Führer verdichtete, nicht weil jede Ermittlungsaktivität
    erst in diesem Jahr eingesetzt hätte.
  - >-
    Die Rehabilitation von 1963 war eine gerichtliche und parteiinterne Rehabilitierung, wurde aber geheim vollzogen.
    Die Karte beschreibt 1963 deshalb nicht als offene öffentliche Aufarbeitung, wie sie erst viel später möglich wurde.
episodes:
- id: czechoslovakia-1951-1963
  polity: Tschechoslowakei
  institutions:
  - Kommunistische Partei der Tschechoslowakei
  - Staatssicherheit StB
  - staatlicher Anklage- und Gerichtsapparat der Tschechoslowakei
  institutionalContext: >-
    Unter dem Druck des stalinistischen Säuberungsmodells billigte die tschechoslowakische Führung im November 1951
    Slánskýs Verhaftung; Ermittler fassten anschließend sehr unterschiedliche hochrangige Funktionäre zu einem angeblichen
    staatsfeindlichen Verschwörungszentrum zusammen. Sowjetische Berater und die tschechoslowakische Staatssicherheit
    setzten körperlichen Zwang und lange Verhöre ein; die Angeklagten mussten von ihren Ermittlern geschriebene Aussagen
    für den öffentlichen Prozess vom 20. bis 27. November 1952 auswendig lernen. Die Anklage warf Spionage, Sabotage,
    Titoismus und Verschwörung gegen die Republik vor und verband die Angeklagten mit westlichen Nachrichtendiensten.
    Staatliche Medien verbreiteten den Fall als Beweis eines verborgenen feindlichen Netzes. Elf Angeklagte wurden am
    3. Dezember hingerichtet. Spätere Entstalinisierungsprüfungen führten 1963 zur geheimen parteiinternen und
    gerichtlichen Rehabilitation.
  consequences:
  - Hinrichtung von elf hochrangigen Funktionären nach einem konstruierten politischen Verfahren
  - Lebenslange Haft für die drei übrigen Hauptangeklagten
  - Institutionalisierter Einsatz von Folter, Zwangsverhören und einstudierten Geständnissen zur Herstellung scheinbarer Beweissicherheit
  - Großangelegte Propaganda, die das angebliche Verschwörungszentrum als existentielle Bedrohung im Inneren darstellte
  - Verstärkung antisemitischer und antizionistischer politischer Narrative durch Auswahl und Sprache des Prozesses
  - Warnwirkung auf die kommunistische politische Elite gegen Abweichungen von der stalinistischen Linie
  summary: >-
    Der Slánský-Fall machte eine konstruierte Verschwörung zu einem minutiös einstudierten öffentlichen Justizereignis.
    Hochrangige Funktionäre wurden zu einem angeblichen staatsfeindlichen Zentrum zusammengefügt, zu vorgegebenen
    Geständnissen gezwungen und vor einem öffentlichen Publikum angeklagt, während staatliche Propaganda Unterstützung
    für die Urteile mobilisierte. Elf von 14 Angeklagten wurden hingerichtet, drei erhielten lebenslange Haft. Die
    spätere Rehabilitationspraxis des Staates kehrte 1963 die rechtliche und parteipolitische Bewertung um und markierte
    den Zusammenbruch der Verschwörungserzählung, mit der der Prozess gerechtfertigt worden war.
