term: Bone histology
aliases:
- histology
- osteohistology
- bone-growth histology
shortDefinition: The microscopic study of bone tissue, including growth marks and tissue structure that can provide evidence
  about an animal's age and growth rate.
longDefinition: Bone histology examines thin sections of fossil or living bone under a microscope. Features such as vascularization,
  growth lines, remodeling, and changes in tissue organization can help researchers reconstruct growth history and assess
  whether an individual was still growing or approaching skeletal maturity. In paleontology, these signals are useful
  but must be interpreted alongside anatomy and specimen preservation.
relatedTerms:
- holotype
reviewedAt: '2026-08-21'
sources:
- title: A diminutive tyrannosaur lived alongside Tyrannosaurus rex
  url: https://doi.org/10.1126/science.adx8706
  publisher: Science
  note: Uses histological evidence from the Nanotyrannus holotype to assess skeletal maturity.
