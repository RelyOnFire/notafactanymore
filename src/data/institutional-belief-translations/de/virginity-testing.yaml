    2018–2019; einige zitierte Fälle stammen aus 2020. Er beschreibt, wie Ermittler und Staatsanwälte aus Hymenbefunden
    auf vaginale Penetration schließen wollten, einschließlich wiederholter Untersuchungen ohne entsprechende
    Schilderung des Kindes. Die Mitteilung des Forensikbüros vom 26. Oktober 2021 dokumentiert eine Fortbildung
    mit Ombudsstelle und Europarat zu gerichtsmedizinischer Untersuchung und Vermeidung sekundärer Viktimisierung.
    Georgiens GREVIO-Bericht von 2025 beschreibt einen späteren Verfahrensrahmen nach Regierungsbeschluss Nr.
    14 vom 16. Januar 2023: Hymenintegrität, Verletzungsmerkmale und Fragen innerhalb der sachverständigen Zuständigkeit.
    Er beschreibt auch die Einwilligung Erwachsener und zusätzliche Schutzvorkehrungen für Minderjährige. Diese
    Verfahrensbeschreibung allein belegt keine fortgesetzte ungültige Schlussfolgerung auf die Sexualgeschichte.
  consequences:
  - Gerichtsmedizinische Genitaluntersuchungen von Betroffenen sexueller Gewalt, darunter Kinder
  - Wissenschaftlich ungültige Schlussfolgerungen auf Penetration aus dem Hymenzustand in untersuchten Fällen
  - Medizinische Gutachten in strafrechtlichen Ermittlungen und Gerichtsverfahren
  - Risiko sekundärer Viktimisierung und verzerrter Glaubwürdigkeits- oder Penetrationsbewertungen
  summary: >-
