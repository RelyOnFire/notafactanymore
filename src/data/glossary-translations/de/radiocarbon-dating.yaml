entryId: radiocarbon-dating
sourceReviewedAt: '2026-08-21'
term: Radiokarbondatierung
aliases: []
shortDefinition: Eine Methode zur Datierung ehemals lebenden Materials anhand der noch vorhandenen Menge des radioaktiven Kohlenstoffisotops C-14.
longDefinition: Lebende Organismen tauschen fortlaufend Kohlenstoff mit ihrer Umwelt aus. Nach dem Tod endet dieser Austausch, und C-14 zerfällt mit bekannter Rate. Dadurch lassen sich organische Überreste über archäologische Zeiträume datieren.
