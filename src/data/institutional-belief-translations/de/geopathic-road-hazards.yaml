locale: de
entryId: geopathic-road-hazards
sourceReviewedAt: 2026-08-23
title: Geopathische Kraftfelder als Verkehrssicherheitsrisiko
claim: Unsichtbare „Erdstrahlen“ oder radiästhetische Kraftfelder an bestimmten Straßenabschnitten galten als mögliche Ursache
  für Beeinträchtigungen von Autofahrern und Unfallhäufungen; energetische Eingriffe sollten diese Gefahr neutralisieren
  können.
currentUnderstanding: Es gibt keine reproduzierbaren Belege für die bei diesen Maßnahmen behaupteten örtlichen radiästhetischen
  Kraftfelder, für eine Wünschelruten- oder Pendelmethode zu ihrer zuverlässigen Erkennung oder für eine energetische Behandlung,
  die sie neutralisiert. Sinkende Unfallzahlen nach einem Eingriff belegen für sich allein keine Ursache, insbesondere wenn
  gleichzeitig konventionelle Verkehrssicherheitsmaßnahmen umgesetzt werden und normale statistische Schwankungen eine Rolle
  spielen.
episodes:
- id: austria-2003-2008
  polity: Österreich
  summary: In den 2000er-Jahren setzte der staatliche Autobahnbetreiber ASFINAG an mehreren Unfallhäufungsstellen Wünschelrutengänger
    und andere „energetische“ Maßnahmen ein. 2003 berichtete ein ASFINAG-Sprecher von seit Jahren angewandten Maßnahmen
    zur Ableitung angeblicher Erdstrahlen und kündigte einen Rutengänger für die S16 Arlberg Schnellstraße an; Rückgänge
    bei Unfallzahlen an anderen Strecken wurden dabei mit solchen Eingriffen in Verbindung gebracht. Später stellte die
    ASFINAG auf ihrer Website „esoterische Maßnahmen bei Unfallhäufungsstellen“ mit positiven Vorher-nachher-Zahlen dar.
    Zeitgenössische Berichte dokumentierten zugleich konventionelle Sicherheitsmaßnahmen und abweichende Polizeizahlen,
    sodass aus dem zeitlichen Rückgang keine Wirksamkeit der energetischen Eingriffe abgeleitet werden konnte.
  consequences:
  - Wünschelrutengänger und Pendelpraktiker wurden an unfallträchtigen Autobahn- und Schnellstraßenabschnitten eingesetzt
  - Quarzsteine, Magnetfeldscheiben und andere angeblich energetische Vorrichtungen sollten schädliche Felder ableiten oder
    neutralisieren
  - Die ASFINAG präsentierte sinkende Unfallzahlen nach einzelnen Eingriffen öffentlich als positive Erfahrung mit den Maßnahmen
  institutions:
  - ASFINAG
