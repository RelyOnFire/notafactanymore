  institutionalContext: In March 1938 the Soviet state staged a public trial of 21 defendants around the alleged anti-Soviet
    Right-Trotskyist Bloc. Prosecutor Andrei Vyshinsky accused the group of espionage for foreign powers, wrecking and sabotage,
    terrorist murders, preparation of further assassinations and plans to assist foreign intervention and partition Soviet
    territory. Eighteen defendants were sentenced to death; three received long prison terms. The proceedings were published
    and amplified as proof that former leaders of the Bolshevik opposition had become agents of fascist and other foreign
    powers. During later rehabilitation reviews most defendants were cleared in separate stages. On 4 February 1988 the Plenum
    of the USSR Supreme Court cancelled the convictions of Bukharin, Rykov and other remaining principal defendants and terminated
    their cases for lack of a criminal offense.
  consequences:
  - Execution of 18 defendants after a politically constructed public prosecution
  - Long prison sentences for the remaining three defendants, who were later caught in further Stalin-era repression
  - State propaganda presenting former senior Soviet officials as a coordinated network of foreign spies, terrorists and saboteurs
  - Use of confessions and judicial theater to legitimize the wider Great Terror and suspicion of hidden enemy networks
  - Decades of official historical treatment of the convictions as proof of treason before rehabilitation dismantled the case
  - Posthumous rehabilitation of 20 of the 21 defendants, exposing the collapse of the trial's central conspiracy narrative
  summary: The Third Moscow Trial made an alleged foreign-backed conspiracy into an authoritative court judgment and propaganda
    event. Bukharin, Rykov and others were accused of belonging to a Right-Trotskyist Bloc responsible for espionage, sabotage,
    terrorism and plans to destroy the Soviet state. Eighteen defendants were condemned to death. Later Soviet review found
    core allegations against the rehabilitated defendants unsupported, including supposed foreign-intelligence links and sabotage
    activities. By 1988, 20 of the trial's 21 defendants had been rehabilitated; Yagoda remained the exception.
  sources:
  - title: The Bukharin Trial, 1938 — documentary collection
    url: https://docs.historyrussia.org/ru/nodes/473265-protsess-buharina-1938-g
    publisher: Electronic Library of Historical Documents
    note: Documentary collection based on RGASPI, GARF and the FSB Central Archive. It includes the indictment, complete trial
      transcript with Stalin's editorial corrections, verdict, clemency petitions and contemporary NKVD reports about public
      reactions to the trial.
  - title: Judicial report in the case of the anti-Soviet Right-Trotskyist Bloc
    url: https://www.prlib.ru/item/1417253
    publisher: Boris Yeltsin Presidential Library
    note: Russian state-library catalog and digitized Soviet Supreme Court report for the March 1938 proceedings, identifying
      the 21 defendants and the criminal articles under which the alleged bloc was prosecuted.
  - title: Nikolai Ivanovich Bukharin
    url: https://bigenc.ru/c/bukharin-nikolai-ivanovich-550ce1
    publisher: Great Russian Encyclopedia
    note: Current Russian scholarly reference describing Bukharin's 1938 conviction for participation in a counterrevolutionary
      espionage-terrorist organization and his rehabilitation by the Plenum of the USSR Supreme Court on 4 February 1988.
  - title: USSR Supreme Court Plenum resolution of 4 February 1988
    url: https://www.ussrdoc.narod.ru/ussrdoc_narod/usr_14575.htm
    publisher: USSR legislation database
    note: Transcription of the Supreme Court resolution reviewing the 1938 case. It states that no information supported links
      to foreign intelligence, that alleged criminal groups and sabotage were unsubstantiated, and cancels the convictions
      of the remaining rehabilitated defendants for lack of a criminal offense.
