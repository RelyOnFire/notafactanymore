locale: de
entryId: race-based-pulmonary-function-reference-values
sourceReviewedAt: '2026-08-26'
title: „Rassen“-basierte Referenzwerte der Lungenfunktion
claim: „Rasse“ oder Ethnizität wurden als Patientenmerkmale behandelt, die bestimmen sollten, welche Referenzgleichungen oder Korrekturfaktoren für die erwarteten Normalwerte der Lungenfunktion verwendet werden.
currentUnderstanding: „Rasse“ und Ethnizität sind soziale Klassifikationen und keine festen biologischen Variablen, die sich für pauschale physiologische Korrekturen eignen. Die aktuelle ATS-Empfehlung, die von der ERS unterstützt wird, sieht für die Interpretation von Lungenfunktionstests rassenunabhängige durchschnittliche Referenzgleichungen vor und fordert zugleich weitere Forschung zu den Folgen der Umstellung.
episodes:
- id: ats-ers-2005-2023
  polity: Vereinigte Staaten und Europa
  institutionalContext: Der gemeinsame ATS/ERS-Standard von 2005 wies darauf hin, dass Patienten ihre „Rasse“ beziehungsweise ethnische Zugehörigkeit angeben sollten, und empfahl nach Möglichkeit gruppenspezifische Referenzgleichungen; Korrekturfaktoren dienten als Ersatzlösung. Diese Referenzwerte beeinflussten, ob gemessene Lungenfunktionswerte als normal oder auffällig eingestuft wurden. Die rassenbezogene Interpretation blieb bis in die frühen 2020er-Jahre Teil fachlicher Standards. 2023 empfahl eine offizielle ATS-Stellungnahme, die von der ERS unterstützt wurde, rassen- und ethniespezifische Gleichungen durch rassenunabhängige durchschnittliche Referenzgleichungen zu ersetzen und zugleich die Verwendung von PFT-Schwellenwerten bei klinischen, arbeitsmedizinischen und versicherungsbezogenen Entscheidungen grundlegend zu überprüfen.
  summary: ATS/ERS-Standards beschrieben Bevölkerungsunterschiede nicht nur, sondern machten „Rasse“ und Ethnizität zu operativen Variablen der Referenzwerte, anhand derer Lungenfunktionstests interpretiert wurden. Der Standard von 2005 bevorzugte ausdrücklich rassen- beziehungsweise ethniespezifische Gleichungen und erlaubte numerische Korrekturfaktoren, wenn solche Gleichungen fehlten. 2023 kehrte die ATS diesen Ansatz mit Unterstützung der ERS um und empfahl rassenunabhängige Durchschnittsgleichungen, weil neuere Evidenz den angenommenen klinischen Nutzen der rassenbezogenen Interpretation nicht bestätigte und auf mögliche Ungleichbehandlungen hinwies.
  consequences:
  - Rassenabhängige Schwellenwerte für die Einstufung von Lungenfunktionswerten als normal oder auffällig
  - Mögliche verzögerte Erkennung oder geringer eingeschätzte Schwere von Atemwegserkrankungen bei Personen, deren Gruppe niedrigere Referenzwerte erhielt
  - Rassenabhängige Auswirkungen auf Entscheidungen zu Behandlung, Erwerbsunfähigkeit, Beschäftigung, Versicherung und Transplantationspriorisierung
  - Notwendige Umstellung von Laborberichten und klinischer Interpretation nach der Empfehlung von 2023
