term: KREEP
aliases:
- KREEP-rich
shortDefinition: A geochemical component of lunar material enriched in potassium (K), rare-earth elements (REE), phosphorus
  (P), and several heat-producing radioactive elements.
longDefinition: KREEP is the conventional name for lunar material enriched in potassium, rare-earth elements, and phosphorus.
  It is also associated with incompatible elements including uranium and thorium, whose radioactive decay produces heat.
  KREEP therefore matters to models of the Moon's chemical differentiation and thermal history, although Chang'e-5 showed
  that the youngest sampled mare basalts did not require a KREEP-rich mantle source.
relatedTerms:
