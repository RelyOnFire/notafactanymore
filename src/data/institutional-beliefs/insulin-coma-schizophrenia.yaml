    locator: "PubMed PMID 13407078, bibliographic record; Lancet 1957, 272(6969):607–611. Results reported in Freudenthal and Moncrieff, PDF p. 7, and Jones, p. 148."
    note: >-
      Primary 1957 controlled study by Ackner, Harris and Oldham, widely treated as a pivotal experimental test
      of whether insulin coma itself conferred a specific benefit in schizophrenia. PubMed supplies
      bibliographic metadata, not the results text. The outcome was checked through Freudenthal and Moncrieff
      (PDF p. 7) and Jones (p. 148); the original results were not directly reviewed.
