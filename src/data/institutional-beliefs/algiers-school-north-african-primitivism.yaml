title: North Africans as biologically primitive in psychiatric practice
claim: The French colonial psychiatric School of Algiers taught that North African Muslims possessed a biologically
  grounded 'primitivism' marked by underdeveloped higher mental functions, weak abstract or moral capacities and
  innate impulsivity, and used that racialised model in psychiatric teaching and interpretation of patients.
currentUnderstanding: There is no biological North African psychiatric type defined by primitive brain organisation,
  deficient higher mental function or innate racial impulsivity. Historians of psychiatry describe the School of
  Algiers' evolutionist theory as a pseudoscientific racial ideology that converted colonial stereotypes into purported
  neuropsychiatric facts. Frantz Fanon and later psychiatry instead emphasised the effects of social context, culture,
  colonial violence and individual clinical circumstances.
category: Colonial psychiatry, race and medical education
reviewedAt: '2026-08-25'
impact:
  summary: 'The theory had institutional reach because Antoine Porot was not merely a polemicist: he taught neuropsychiatry
    at the Faculty of Medicine in Algiers, helped establish the School of Algiers and shaped the colonial psychiatric
    system that included Blida-Joinville hospital. His 1918 article became a founding text, and the 1939 Porot-Sutter
    paper made ''primitivism'' an explicit explanatory model for North African psychopathology. Students and colleagues
    reproduced the framework in clinical and forensic writing. Fanon''s work at Blida in the 1950s became an important
    institutional and intellectual challenge to this racialised psychiatry.'
  highlights:
  - value: '1918'
    label: year of Porot's foundational Notes de psychiatrie musulmane
  - value: '1939'
    label: year Porot and Sutter published their explicit theory of North African 'primitivism'
  - value: 44 years
    label: from the 1918 founding text to the end of French colonial rule in Algeria in 1962
  context:
  - The card does not imply that every aspect of Porot's clinical work was scientifically worthless. Later historical
    review notes genuine innovations in service organisation and treatment. The correction is specifically to the
    racial-evolutionist theory that treated a colonised population as innately primitive.
  - The terms 'Muslim' and 'North African native' reproduce the population categories used by the historical authors;
    they are not presented as valid biological classifications.
  - The 1962 endpoint marks the end of the French colonial institutional episode in Algeria, not the instant disappearance
    of the theory. Elements of the School's vocabulary persisted in metropolitan psychiatric literature after Algerian
    independence.
episodes:
- id: french-algeria-1918-1962
  polity: French Algeria
  region: North Africa
  startYear: 1918
  endYear: 1962
  strength: institutionally-influential
  institutionTypes:
  - medical
