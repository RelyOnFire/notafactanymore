term: Astrometry
aliases:
- astrometric
shortDefinition: The precise measurement of the positions and motions of objects in the sky.
longDefinition: Astrometry measures where celestial objects are and how those positions change over time. It underlies
  measurements of stellar proper motion and parallax and is central to missions such as ESA's Gaia.
relatedTerms: []
reviewedAt: '2026-08-21'
sources:
