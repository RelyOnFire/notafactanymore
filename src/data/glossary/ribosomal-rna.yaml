term: Ribosomal RNA
aliases:
- rRNA
shortDefinition: RNA that forms a central part of ribosomes, the cellular machinery that builds proteins.
longDefinition: Ribosomal RNA, or rRNA, is a structural and catalytic component of ribosomes. Because some rRNA
  sequences change slowly over evolutionary time and occur across cellular life, comparisons of them can reveal
  very deep evolutionary relationships.
relatedTerms:
- eukaryote
reviewedAt: '2026-08-21'
sources:
- title: 'Towards a natural system of organisms: proposal for the domains Archaea, Bacteria, and Eucarya'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC54159/
  publisher: Proceedings of the National Academy of Sciences via PubMed Central
  note: Uses ribosomal RNA sequence comparisons to establish deep evolutionary relationships among the three domains.
