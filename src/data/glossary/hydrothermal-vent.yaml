term: Hydrothermal vent
aliases:
- hydrothermal vents
- deep-sea hydrothermal vent
shortDefinition: An opening in the seafloor where geothermally heated, mineral-rich water flows into the ocean.
longDefinition: Hydrothermal vents form where seawater circulates through hot oceanic crust, is heated and chemically
  altered, then returns through openings in the seafloor. Some vent ecosystems are supported by chemosynthetic microorganisms
  rather than sunlight.
relatedTerms: []
reviewedAt: '2026-08-21'
