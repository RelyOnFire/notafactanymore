term: Hominin
aliases:
- hominins
shortDefinition: A member of the human evolutionary lineage after its split from the lineage leading to chimpanzees and
  bonobos.
longDefinition: Hominin is the standard term for humans and extinct species more closely related to humans than to chimpanzees
  and bonobos. The group includes the genus Homo as well as earlier lineages such as Australopithecus and other candidates
  near the human–chimpanzee divergence.
relatedTerms:
- bipedalism
reviewedAt: '2026-08-21'
sources:
- title: Introduction to Human Evolution
  url: https://humanorigins.si.edu/education/introduction-human-evolution
  publisher: Smithsonian Human Origins Program
  note: Provides the evolutionary framework for the human lineage and major traits such as bipedalism and brain expansion.
