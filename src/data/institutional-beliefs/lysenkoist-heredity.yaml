evidence:
  - id: lysenko-history-proposition
    sourceId: lysenko-1948-history
    relation: supports
    target:
      scope: belief
      aspect: proposition
    note: >-
      Reviews the 1948 institutional takeover and concludes that Lysenkoism caused substantial losses in Soviet agriculture,
      genetics, evolutionary theory, molecular biology, and intergenerational scientific continuity. The account also
      identifies the inherited-trait doctrine, rejection of a hereditary substance and official approval of Lysenko’s
      address.
    locator: >-
      The August 1948 VASKhNIL Session and its Aftermath: discussion of Lysenko’s address and closing statement; paragraphs
      beginning “In his speech, Lysenko rejected” and “In Lysenko’s closing statement”.
  - id: lysenko-pushback-correction
    sourceId: lysenko-pushback-review
    relation: supports
    target:
      scope: belief
      aspect: correction
    note: >-
      Historical review of state support for Lysenkoism, suppression of genetics, and rehabilitation after the Khrushchev
      era. Its account of the doctrine distinguishes rejection of chromosome-based heredity from later institutional rehabilitation;
      modern genetic and epigenetic evidence is cited separately.
    locator: >-
      The arrival of Lysenkoism: numbered list of theoretical ideas, especially acquired-trait inheritance and rejection
      of chromosome-based genetics; paragraphs on agricultural claims and suppression.
  - id: lysenko-pushback-impact
    sourceId: lysenko-pushback-review
    relation: supports
    target:
      scope: belief
      aspect: impact
    locator: >-
      Abstract; Revival of a full-fledged biological education; The attempts of nationwide rehabilitation of genetics;
      Conclusions. These distinguish protected 1950s work from later official rehabilitation.
    note: >-
      Documents suppression and the difficult recovery of biological research and teaching, including protected work
      before 1964.
  - id: lysenko-holodomor-impact
    sourceId: lysenko-holodomor-study
    relation: contextualizes
    target:
      scope: belief
      aspect: impact
    note: >-
      Quantitative study of the Holodomor finding that migration restrictions and anti-Ukrainian bias in Soviet grain
      procurement and retention policy contributed to high Ukrainian famine mortality; used here to distinguish the
      famine’s documented policy mechanisms from Lysenko’s contemporaneous agricultural program.
    locator: >-
      Publisher abstract: mortality differences, anti-Ukrainian bias in grain procurement/retention and restrictions
      on migration. Full article not inspected.
  - id: lysenko-china-famine-impact
    sourceId: lysenko-china-famine
    relation: contextualizes
    target:
      scope: belief
      aspect: impact
