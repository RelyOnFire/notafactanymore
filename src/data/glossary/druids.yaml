term: Druids
aliases: []
shortDefinition: Religious and learned specialists described by Greek and Roman writers among Iron Age societies in Gaul and Britain.
longDefinition: The historically documented Druids belong to Iron Age societies known through classical written sources. Stonehenge’s principal stone settings are thousands of years older, so this historical group cannot be identified as the monument’s builders.
reviewedAt: '2026-08-21'
sources:
- title: 'Prehistory: Religion'
  url: https://www.english-heritage.org.uk/learn/story-of-england/prehistory/religion/
  publisher: English Heritage
  note: Provides historical context for Druids and prehistoric religious practice in Britain.
