evidence:
  - id: caste-guha-proposition
    sourceId: caste-guha-history
    relation: supports
    target: {scope: belief, aspect: proposition}
    note: >-
      Page 16 explains how Risley used the nasal index to claim measurable racial differences corresponding to caste
      hierarchy and observes that contradictory head forms could be assigned different origins so the theory resisted
      disproof.
  - id: caste-guha-episode-context
    sourceId: caste-guha-history
    relation: contextualizes
    target: {scope: episode, episodeId: british-india-1901-1903, aspect: context}
    note: >-
      Page 16 links the Government of India's claimed policy value for ethnography, the ethnographic direction of the
      1901 census and the resulting status claims made by groups within Indian society.
  - id: caste-appendices-mechanism
    sourceId: caste-1901-appendices
    relation: documents
    target: {scope: episode, episodeId: british-india-1901-1903, aspect: mechanism}
    note: >-
      Official 1903 volume explicitly titled as the ethnographic data on which the census report's caste chapter was
      based; its contents include summaries of measurements, nasal indices and maps of proposed racial types.
  - id: caste-home-carrier
    sourceId: caste-home-proceedings
    relation: documents
    target: {scope: episode, episodeId: british-india-1901-1903, aspect: carrier}
    note: >-
      Catalogue metadata identifies a nine-page Government of India, Home Department (Public) proceeding, Nos. 3219–3232,
      dated 23 May 1901 and titled for the Ethnographic Survey in connection with the census. The record establishes the
      proceeding's identity and provenance; it is not a scan of its text.
  - id: caste-rai-carrier
    sourceId: caste-rai-risley
    relation: documents
    target: {scope: episode, episodeId: british-india-1901-1903, aspect: carrier}
    note: >-
      The institutional obituary records Risley's earlier Bengal assignment, Curzon's support for a countrywide survey,
      his honorary directorship of that survey and his selection to conduct the 1901 census with E. A. Gait.
  - id: caste-report-proposition
    sourceId: caste-1901-report
    relation: documents
    target: {scope: belief, aspect: proposition}
    note: >-
      Chapter XI, pp. 489–557, opens by promising to show that racial sentiment supplied the motive principle of caste
      and that scientific methods confirmed it; the following pages privilege physical measurements as tests of race.
  - id: caste-report-mechanism
    sourceId: caste-1901-report
    relation: documents
    target: {scope: episode, episodeId: british-india-1901-1903, aspect: mechanism}
    note: >-
      The official all-India report joins anthropometry, proposed racial types and classification by social precedence in
      the government chapter titled Caste, Tribe, and Race.
  - id: caste-lee-impact
    sourceId: caste-lee-census
    relation: supports
    target: {scope: belief, aspect: impact}
    note: >-
      The modern scholarly chapter explains that Risley organized returns by hierarchical caste status to support his
      racial-origin theory and that the census became a forum in which caste activists advanced status claims.
  - id: caste-lee-consequences
    sourceId: caste-lee-census
    relation: supports
    target: {scope: episode, episodeId: british-india-1901-1903, aspect: consequences}
    note: >-
      Pages 83–110 describe petitions for higher status or different caste names and explain how simplified census
      categories could make caste more salient while overriding ambiguous identities; the author also stresses variation
      in how activists used them.
  - id: caste-1911-correction
    sourceId: caste-1911-gwalior
    relation: documents
    target: {scope: episode, episodeId: british-india-1901-1903, aspect: institutional-correction}
    note: >-
      Printed page 75 says the 1911 Gwalior series used traditional occupation instead of the unsatisfactory 1901
      classification by social precedence, which had discouraged accurate schedule returns.
  - id: caste-census1961-belief-correction
    sourceId: caste-census1961-monograph
    relation: supports
    target: {scope: belief, aspect: correction}
    note: >-
      Page 25 calls Risley's racial classification procedurally unsatisfactory and questionable, notes its confusion of
      language and race, and rejects both pure races in India and broad provincial racial classification.
  - id: caste-census1961-episode-correction
    sourceId: caste-census1961-monograph
    relation: documents
    target: {scope: episode, episodeId: british-india-1901-1903, aspect: institutional-correction}
    note: >-
      The correction appears in an official Census of India monograph issued by the post-independence Office of the
      Registrar General, providing an explicit successor-institution assessment rather than only an outside critique.
  - id: caste-aaba-belief-correction
    sourceId: caste-aaba-race
    relation: supports
    target: {scope: belief, aspect: correction}
    note: >-
      The biological-anthropology association's 2019 statement explains that human variation does not form discrete,
      pure or fixed racial groups and that visible traits do not follow socially defined racial boundaries.
  - id: caste-aaba-episode-context
    sourceId: caste-aaba-race
    relation: contextualizes
    target: {scope: episode, episodeId: british-india-1901-1903, aspect: context}
    note: >-
      Provides the modern disciplinary basis for distinguishing measurable human variation from the discrete racial
      taxonomy and superiority claims imposed by the census interpretation.
  - id: caste-reich-belief-correction
    sourceId: caste-reich-genetics
    relation: supports
    target: {scope: belief, aspect: correction}
    note: >-
      Genome-wide analysis found mixed ancestry and extensive population structure; it also found, in its samples, a
      significant correlation between traditional caste level and ANI ancestry after controlling for language.
  - id: caste-reich-episode-context
    sourceId: caste-reich-genetics
    relation: contextualizes
    target: {scope: episode, episodeId: british-india-1901-1903, aspect: context}
    note: >-
      Shows why correcting Risley's typology must not erase real ancestry variation: correlation in sampled groups is
      compatible with complex population history, but it is not evidence that nasal measurements define pure races or
      biologically validate rank.
  - id: caste-moorjani-belief-correction
    sourceId: caste-moorjani-genetics
    relation: supports
    target: {scope: belief, aspect: correction}
    note: >-
      Analysis of 73 groups estimates major mixture about 1,900–4,200 years ago followed by a shift toward endogamy, with
      all sampled mainland groups described as admixed rather than surviving unmixed racial types.
  - id: caste-moorjani-episode-context
    sourceId: caste-moorjani-genetics
    relation: contextualizes
    target: {scope: episode, episodeId: british-india-1901-1903, aspect: context}
    note: >-
      Supplies the population-history explanation for genetic structure that the colonial report instead forced into a
      small set of fixed racial categories ordered by social status.
