- id: virginity-pakistan-lhc-carrier
  sourceId: virginity-pakistan-lhc-judgment
  relation: documents
  target:
    scope: episode
    episodeId: pakistan-2015-2021
    aspect: carrier
  locator: >-
    Sadaf Aziz and connected petition, WP 13537/2020 and WP 27421/2020: paragraphs 6–7 on the 2015 instructions;
    paragraphs 27–33 on validity, rights and relief, particularly 32–33.
  note: >-
    The primary judgment identifies Punjab health and medico-legal instructions, including the Surgeon Medico
    Legal’s 2015 directions, as the operational basis for testing supposed virginity. It distinguishes the Punjab
    Forensic Science Agency’s non-use and the court’s corrective role. Its concluding paragraphs invalidate the
    relevant instructions and distinguish necessary medical assessment from the discredited inference.
