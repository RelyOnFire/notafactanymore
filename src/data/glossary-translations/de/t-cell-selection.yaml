locale: de
entryId: t-cell-selection
sourceReviewedAt: '2026-08-21'
term: T-Zell-Selektion
aliases:
- thymische Selektion
- positive Selektion
- negative Selektion
shortDefinition: Der Entwicklungs-Auswahlprozess unreifer T-Zellen im Thymus, der geeignete Zellen erhält und viele Zellen
  entfernt oder bremst, die gefährlich stark gegen körpereigenes Gewebe reagieren könnten.
longDefinition: Während der T-Zell-Entwicklung im Thymus werden unreife Zellen in mehreren Schritten geprüft. Positive
  Selektion begünstigt Zellen, deren Rezeptoren passend mit der körpereigenen Antigenpräsentation interagieren können.
  Negative Selektion entfernt viele Zellen, die körpereigene Moleküle zu stark binden; zusätzliche Mechanismen erzeugen
  regulatorische T-Zellen. Zusammen helfen diese Prozesse, ein funktionsfähiges T-Zell-Repertoire und zentrale Immuntoleranz
  aufzubauen.
