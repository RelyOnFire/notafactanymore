shortDefinition: Eine Person, die Pilze wissenschaftlich untersucht.
longDefinition: Die Mykologie ist das Teilgebiet der Biologie, das Pilze untersucht; Forschende in diesem Gebiet werden als Mykologen beziehungsweise Mykologinnen bezeichnet.
