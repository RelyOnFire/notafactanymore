    summary: A Warsaw conference in March 1949 proclaimed the Lysenkoist “New Biology” an official paradigm in Polish science. Genetics and criticism of the doctrine were actively confronted, genetics courses disappeared from universities, school curricula were rewritten, and scientists who used politically unacceptable concepts could be silenced or publicly stigmatized. The system unraveled with the political thaw of 1956.
    sources:
