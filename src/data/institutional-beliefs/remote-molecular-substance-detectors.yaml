title: Remote “molecular” detectors for explosives and drugs
claim: >-
  Hand-held passive-antenna devices such as the GT200 and ADE 651 were treated as able to remotely identify hidden
  explosives, drugs, weapons, or other substances through claimed molecular or electrostatic mechanisms, reliably
  enough to guide searches, checkpoints, arrests, and other security decisions.
currentUnderstanding: >-
  These devices had no validated mechanism capable of remotely identifying the claimed substances. Controlled
  testing of the GT200 found performance compatible with chance, while a British criminal court found the ADE
  devices useless and their explosive-detection capability no better than random chance. Reliable explosive or drug
  detection requires validated physical, chemical, biological, canine, or imaging methods rather than the movement
  of an unpowered passive antenna.
category: Security technology and substance detection
reviewedAt: 2026-08-23
impact:
  summary: >-
    The institutional failure was not merely wasteful procurement. Unvalidated detector indications were converted
    into operational security signals: they influenced searches, home entries, detentions, checkpoint screening, and
    judgments about whether people or vehicles were dangerous, while creating confidence in devices that controlled
    testing and later criminal proceedings showed did not work as claimed.
  highlights:
    - value: '742'
      label: GT200 units acquired by Mexico's SEDENA according to congressional records
    - value: 17 of 20
      label: Failed GT200 attempts in a double-blind test using certified operators
    - value: 7,000+
      label: ADE devices sold to the Iraqi government and other international agencies by James McCormick's company
  context:
    - >-
      Procurement totals and flawed detector results do not provide a defensible count of wrongful arrests, injuries,
      or deaths. In sentencing the ADE 651 seller, the English court explicitly said that a specific death or injury
      could not be proved to have resulted from a device, while finding that the false sense of security had in all
      probability materially contributed to death and injury.
    - >-
      Federal operation and institutional defense of the GT200 remained active parliamentary issues through 2014.
      That evidence does not establish that every GT200 disappeared from every Mexican state or municipal agency on a
      single date.
episodes:
  - id: mexico-2008-2014
    polity: Mexico
    region: Latin America
    startYear: 2008
    endYear: 2014
    periodLabel: 2008–at least 2014
    strength: policy-basis
    institutionTypes: [government, military]
    institutions:
      - Secretaría de la Defensa Nacional (SEDENA)
      - Secretaría de Marina (SEMAR)
      - Procuraduría General de la República (PGR)
      - Petróleos Mexicanos (PEMEX)
    institutionalContext: >-
      Mexico's federal government purchased GT200 devices for military, security, prosecutorial, and infrastructure
      use. SEDENA publicly described operational deployments, while the National Human Rights Commission documented
      armed-forces reliance on detector indications during organized-crime operations and home entries. By 2011–2014
      scientists, courts, the CNDH, and legislators were challenging the device's validity, yet congressional records
      still described federal operation and the absence of a uniform executive suspension.
    consequences:
      - GT200 indications were used during military and organized-crime operations
      - Detector signals contributed to searches, home entries, detentions, and criminal proceedings
      - Federal agencies spent public funds on more than a thousand devices across the Mexican government
      - Courts and human-rights bodies later confronted the scientific and constitutional consequences of relying on the device
    summary: >-
      Beginning in 2008, Mexican federal agencies acquired GT200 “molecular detectors” for drugs, explosives, weapons,
      and related security work; congressional records attribute 742 units to SEDENA, 102 to SEMAR, 54 to PEMEX, and
      seven to the PGR. SEDENA press releases document operational use, while the CNDH reported that armed forces used
      GT200 indications in organized-crime investigations and sometimes entered homes on that basis. A double-blind
      test with certified operators later failed in 17 of 20 attempts, a result compatible with chance. Judicial,
      scientific, human-rights, and parliamentary challenges accumulated through 2014, when federal purchase and
      operation of the devices remained the subject of congressional investigation and criticism.
    sources:
      - title: Recomendación General No. 19 — Sobre la práctica de cateos ilegales
        url: https://dof.gob.mx/nota_detalle_popup.php?codigo=5204643
        publisher: Comisión Nacional de los Derechos Humanos — Diario Oficial de la Federación
        note: >-
          Official CNDH recommendation states that Mexican armed forces used the GT200 on numerous occasions in
          organized-crime operations and warns that device indications were being used to justify warrantless home entries.
      - title: Personal militar asegura armamento, droga, vehículos y artículos diversos en Michoacán
        url: https://www.gob.mx/defensa/prensa/personal-militar-asegura-armamento-droga-vehiculos-y-articulos-diversos-en-michoacan
        publisher: Secretaría de la Defensa Nacional
        note: >-
          Official 2009 SEDENA communiqué explicitly records military operational use of a GT200 detector during a
          counter-narcotics action, illustrating that the device was used as an active security tool rather than merely procured.
      - title: Compra y operación del detector molecular GT200 en territorio nacional
        url: https://cronica.diputados.gob.mx/DDebates/62/2do/1P/Ord/oct/01L62A2P128-IV.html
        publisher: Cámara de Diputados — Diario de los Debates
        note: >-
          Congressional record lists 742 GT200 units acquired by SEDENA, 102 by SEMAR, 54 by PEMEX, and seven by PGR,
          and documents concern over searches, detentions, prosecutions, and continued federal operation of the devices.
      - title: How a Drug and Explosives Detector Proved Useless — Military Use of the GT200
        url: https://produccion.siia.unam.mx/Publicaciones/ProdCientif/PublicacionFrw.aspx?id=456200&scopus=0
        publisher: IEEE Technology and Society Magazine — indexed by Universidad Nacional Autónoma de México
        note: >-
          Peer-reviewed study reports a double-blind test in which certified operators failed in 17 of 20 attempts to
          locate amphetamine pills and bullets hidden in one of eight identical boxes, a result compatible with chance.
  - id: iraq-2007-2016
    polity: Iraq
    region: Middle East
    startYear: 2007
    endYear: 2016
    periodLabel: 2007–2016
    strength: policy-basis
    institutionTypes: [government]
    institutions:
      - Ministry of Interior of Iraq
      - General Directorate for Combating Explosives, Ministry of Interior
      - Iraqi Police Service
    institutionalContext: >-
      Ministry of Interior procurement began with contract 2/2007 after a request tied to the directorate responsible
      for combating explosives. ADE-family devices were subsequently used at Iraqi checkpoints and remained in police
      use despite international warnings, corruption investigations, and the British seller's 2013 fraud conviction.
      Prime Minister Haider al-Abadi finally ordered security services to stop using the fake detectors in July 2016.
    consequences:
      - ADE devices were used to screen vehicles and people at security checkpoints
      - Security personnel trusted detector indications when assessing explosive risk
      - Large public expenditures were committed to devices later found to be useless
      - Operational use continued for years after serious doubts, investigations, and foreign restrictions had emerged
      - The false sense of security created a continuing danger at high-risk checkpoints
    summary: >-
      Iraq's Ministry of Interior began procuring ADE-family bomb detectors in 2007 for its counter-explosives work,
      and the devices became a familiar part of police and security checkpoints. In 2013 the Central Criminal Court in
      London found seller James McCormick guilty of fraud; the sentencing judge described the ADE devices as useless,
      with explosive-detection capability no better than random chance, and found that the false sense of security had
      in all probability materially contributed to death and injury, while cautioning that no specific casualty could
      be attributed to a device. The detectors nevertheless remained in Iraqi police use until July 2016, when Prime
      Minister Haider al-Abadi ordered security services to stop using them.
    sources:
      - title: وثيقة — نحو 4 مليارات دينار قيمة أول 60 قطعة من أجهزة كشف المتفجرات
        url: https://www.alsumaria.tv/news/security/75704/
        publisher: Alsumaria News
        note: >-
          Reports from the underlying procurement document that Iraqi contract 2/2007 covered 60 ADE devices, was based
          on a stated need from the explosives-combating directorate, passed ministry review, and was approved by the Interior Minister.
      - title: R v James McCormick — Sentencing Remarks
        url: https://www.judiciary.uk/wp-content/uploads/JCO/Documents/Judgments/r-v-mccormack-sentencing-remarks-20130502.pdf
        publisher: Judiciary of England and Wales — Central Criminal Court
        note: >-
          The sentencing court states that more than 7,000 ADE devices were sold to the Iraqi government and other
          international agencies, calls the device useless and no better than random chance for explosive detection,
          and describes the false security created by its operational use.
      - title: Iraq PM Abadi orders police to stop using fake bomb detectors
        url: https://news.trust.org/item/20160703200315-ghmqs
        publisher: Reuters
        note: >-
          Reports Prime Minister Haider al-Abadi's July 2016 order for security services to stop using the fake bomb
          detectors and confirms that Iraqi police were still using them five years after the sales scandal emerged.
