sourceReviewedAt: 2026-08-22
title: Röntgenbehandlung von Kopfpilz
claim: Die Bestrahlung der Kopfhaut mit Röntgenstrahlen wurde als ausreichend sichere Massenbehandlung für Tinea capitis bei Kindern eingesetzt, bevor die langfristigen Strahlenrisiken erkannt waren.
currentUnderstanding: Röntgenbestrahlung kann Tinea capitis beseitigen, setzt dabei aber gesundes Gewebe ionisierender Strahlung aus und erhöht das spätere Risiko für Tumoren und andere strahlenbedingte Erkrankungen. Wirksame Antimykotika machen eine routinemäßige Bestrahlung gegen Kopfpilz unnötig.
episodes:
  - id: israel-1949-1960
    polity: Israel
    summary: Israel organisierte eine landesweite Kampagne, in der Zehntausende Kinder mit Tinea capitis an der Kopfhaut geröntgt wurden – damals eine Standardbehandlung, deren spätere Krebsrisiken noch nicht verstanden waren. Ab 1952 wurde die Behandlung staatlich finanziert und im öffentlichen Gesundheitsprogramm verlangt, unter anderem als Voraussetzung für die Rückkehr erkrankter Kinder in die Schule. 1960 endete die Bestrahlung, als Griseofulvin sie ersetzte; langfristige israelische Kohortenstudien zeigten später ein erhöhtes Tumorrisiko nach der Strahlenexposition im Kindesalter.
    consequences:
      - Massenhafte Bestrahlung von Kindern
      - Behandlung teilweise Voraussetzung für die Rückkehr in die Schule
      - Erhöhtes langfristiges Risiko für Hirn- und Nervensystemtumoren
