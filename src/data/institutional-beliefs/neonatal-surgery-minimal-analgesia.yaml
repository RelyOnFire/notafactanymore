schemaVersion: 2
title: Minimal analgesia for major neonatal surgery
entryId: newborns-do-not-feel-pain
proposition:
  summary: >-
    Newborns, especially premature infants, could undergo major surgery with little or no potent analgesia because
    their immature nervous systems were thought unable to process pain in the same meaningful way as older patients
    and anesthetic drugs were considered unusually hazardous.
correction:
  summary: >-
    Newborns have functional nociceptive pathways and mount organized physiological, hormonal, behavioral and neurological
    responses to painful surgery. Adequate anesthesia and analgesia are indicated for neonatal surgical procedures,
    with drug choice and dosing adapted to the infant's considerable physiological vulnerability.
category: Neonatal medicine and anesthesia
reviewedAt: '2026-09-19'
impact:
  summary: >-
    The belief was not confined to theory. It shaped neonatal anesthesia regimens in which paralysis and nitrous oxide
    could be used without potent analgesia during major surgery. Controlled work in the 1980s showed markedly greater
    hormonal and metabolic stress responses without fentanyl. In the 16-infant trial, several postoperative circulatory
    and metabolic complications were more frequent in the non-fentanyl group, providing tentative evidence of better
    postoperative outcomes with fentanyl.
  highlights:
    - value: '1987'
      label: Randomized fentanyl trial showed that deeper analgesia reduced the neonatal surgical stress response
    - value: 8 + 8 infants
      label: Preterm infants in the pivotal randomized comparison with and without fentanyl
    - value: '1987'
      label: American Academy of Pediatrics policy stated that anesthesia or analgesia was indicated for neonatal surgery
  context:
    - >-
      The historical correction is not that neonatal anesthesia had never been used. Clinicians were balancing genuine
      anesthetic risks in tiny, unstable patients against an incorrect or underestimated model of neonatal pain.
    - >-
      The John Radcliffe episode is a documented institutional practice rather than a claim that every hospital used an identical regimen.
episodes:
  - id: united-kingdom-john-radcliffe-1982-1987
    polity: United Kingdom
    region: Northern Europe
    startYear: 1982
    endYear: 1982
    periodLabel: Practice attested in October 1982
    strength: institutionally-influential
    institutionTypes:
      - medical
    institutions:
      - John Radcliffe Hospital, Oxford
    institutionalContext: >-
      Kanwaljeet Anand later described nitrous oxide plus curare, without potent analgesia, as the state-of-the-art
      neonatal anesthetic practice at John Radcliffe Hospital when he arrived in 1982. The rationale reflected both
      long-standing doubts that newborns perceived pain normally and legitimate fears about anesthetic toxicity and
      physiological instability. The hospital then became the setting for the randomized work that directly tested
      whether adding fentanyl changed the biological response to surgery. The October 1982 date identifies an attested
      practice, without establishing when the hospital adopted or discontinued it.
    consequences:
      - Preterm infants undergoing patent ductus arteriosus ligation could receive nitrous oxide and neuromuscular paralysis without a potent opioid analgesic
      - In the randomized comparison, infants without fentanyl showed significantly larger hormonal and metabolic stress responses
      - Several postoperative circulatory and metabolic complications were more frequent without fentanyl, but the small trial provided only tentative evidence of improved postoperative outcomes
      - The trial findings became part of a wider debate about neonatal pain; in 1987 the American Academy of Pediatrics recommended anesthesia or analgesia for neonatal surgery according to clinical risk
    summary: >-
      At Oxford's John Radcliffe Hospital in the early 1980s, a neonatal anesthetic regimen using nitrous oxide and
      curare without potent analgesia represented accepted practice for major surgery. Anand and colleagues tested
      that practice in preterm infants undergoing ductus arteriosus ligation. The trial, published in 1987, found that
      adding fentanyl sharply reduced the hormonal and metabolic stress response. Several postoperative circulatory
      and metabolic complications were more frequent without fentanyl, but the comparison of eight infants per group
      suggested only a possible postoperative benefit. In 1987, the American Academy of Pediatrics also stated that
      available local or systemic agents allowed relatively safe anesthesia or analgesia and that such treatment was
      indicated for neonatal surgery under the usual criteria for high-risk, potentially unstable patients. It allowed
      reducing or discontinuing drugs when physiological instability required it, using the same medical criteria as
      for older patients rather than withholding treatment solely because of age or presumed cortical immaturity.
    mechanism:
      kind: administrative-adoption
      summary: >-
        A hospital anesthesia regimen combined nitrous oxide and neuromuscular paralysis for major neonatal surgery
        without potent opioid analgesia, operationalizing contemporary assumptions about neonatal pain and anesthetic risk.
    institutionalCorrection:
      status: undocumented
      summary: >-
        Research conducted at the hospital directly challenged the regimen. The 1987 American Academy of Pediatrics
        statement documents a US professional response, but the existing record does not identify a dated John Radcliffe
        institutional act formally withdrawing or repudiating the earlier practice.
