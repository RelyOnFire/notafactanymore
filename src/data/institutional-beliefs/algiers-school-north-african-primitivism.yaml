schemaVersion: 2
title: North Africans as biologically primitive in psychiatric practice
proposition:
  summary: >-
    The French colonial psychiatric School of Algiers taught that North African Muslims possessed a biologically
    grounded 'primitivism' marked by underdeveloped higher mental functions, weak abstract or moral capacities and
    innate impulsivity, and used that racialised model in psychiatric teaching and interpretation of patients.
correction:
  summary: >-
    There is no biological North African psychiatric type defined by primitive brain organisation, deficient higher
    mental function or innate racial impulsivity. Historians of psychiatry describe the School of Algiers' evolutionist
    theory as a pseudoscientific racial ideology that converted colonial stereotypes into purported neuropsychiatric
    facts. Frantz Fanon and later psychiatry instead emphasised the effects of social context, culture, colonial violence
    and individual clinical circumstances.
category: Colonial psychiatry, race and medical education
reviewedAt: '2026-09-19'
impact:
  summary: >-
    The theory had institutional reach because Antoine Porot was not merely a polemicist: he taught neuropsychiatry at
    the Faculty of Medicine in Algiers from 1925, trained students who developed the School of Algiers and helped shape
    the colonial psychiatric network that included Blida-Joinville hospital from 1933. His 1918 article was an early
    programmatic text, and the 1939 Porot-Sutter publication explicitly joined North African 'primitivism' to mental
    pathology. Students and colleagues reproduced the framework in clinical and forensic writing. Fanon's work at Blida
    in the 1950s became an important clinical and intellectual challenge within the same hospital system.
  highlights:
    - value: '1918'
      label: year of Porot's foundational Notes de psychiatrie musulmane
    - value: '1939'
      label: year Porot and Sutter published their explicit theory of North African 'primitivism'
    - value: '1933'
      label: year Blida-Joinville began receiving patients within the colonial psychiatric network
  context:
    - >-
      Not every aspect of Porot's clinical work was scientifically worthless. Later historical review notes genuine
      innovations in service organisation and treatment. The correction concerns the racial-evolutionist theory that
      treated a colonised population as innately primitive.
    - >-
      The terms 'Muslim' and 'North African native' reproduce the population categories used by the historical authors;
      they are not presented as valid biological classifications.
    - >-
      French colonial rule in Algeria ended in 1962. That date closes this institutional episode; it is not evidence that
      the named carriers formally repudiated the doctrine.
    - >-
      The 1918–1962 span describes a developing institutional sequence, not three carriers operating unchanged for 44
      years: the precursor article appeared in 1918, Porot took the Algiers chair in 1925 and Blida opened in 1933.
episodes:
  - id: french-algeria-1918-1962
    polity: French Algeria
    region: North Africa
    startYear: 1918
    endYear: 1962
    periodLabel: '1918–1962; institutional network developed in stages from 1925'
    strength: institutionally-influential
    institutionTypes:
      - medical
      - university
    institutions:
      - Faculty of Medicine of Algiers
      - School of Algiers psychiatry
      - Blida-Joinville psychiatric hospital
    institutionalContext: >-
      Porot's 1918 Notes de psychiatrie musulmane, written from his wartime neuropsychiatric post in Algiers, portrayed
      the colonised Muslim population through a hierarchy of supposedly primitive mental development. After Porot took
      the psychiatry chair at the Algiers medical faculty in 1925, his students helped develop the School of Algiers.
      Blida-Joinville began receiving patients in 1933, extending that network into a major psychiatric hospital. Porot
      and Jean Sutter's 1939 publication explicitly linked the supposed 'primitivism' of North Africans to mental
      pathology. The framework circulated through education, professional writing, clinical interpretation and
      medico-legal accounts until French colonial institutions were transformed by Algerian independence in 1962.
    consequences:
      - Medical teaching that presented racial and colonial stereotypes as characteristics of North African psychology
      - Clinical interpretation of patients through assumptions of primitive mentality and innate impulsivity
      - Medico-legal writing that racialised explanations of violence and criminal behaviour
      - Scientific legitimation for a colonial hierarchy that treated the colonised population as developmentally inferior
    summary: >-
      The School of Algiers made colonial hierarchy part of psychiatric explanation. A population-level stereotype of
      biological and psychological 'primitivism' was taught and applied through a medical faculty and psychiatric
      institutions rather than remaining a casual prejudice. Fanon's critique and subsequent historical psychiatry
      rejected the supposed racial neuropsychology as pseudoscientific and redirected attention toward social, cultural
      and individual determinants of mental illness.
    mechanism:
      kind: education
      summary: >-
        A medical faculty and affiliated colonial psychiatric network taught and applied a racial-evolutionist model of
        North African mentality through professional education, clinical interpretation and medico-legal practice.
    institutionalCorrection:
      status: undocumented
      summary: >-
        Fanon's published critique and clinical work at Blida challenged the doctrine, and the French colonial network
        ended with Algerian independence, but the existing record does not identify a dated School of Algiers or French
        institutional act formally repudiating the racial-evolutionist theory.
