title: Manacovid as an established effective COVID-19 treatment
claim: >-
  The Democratic Republic of the Congo authorized and promoted Manacovid as an effective and safe COVID-19 treatment on the basis of preliminary clinical results presented as 100% recovery, before robust randomized evidence had established that therapeutic effect.
currentUnderstanding: >-
  Authorization and uncontrolled or insufficiently documented clinical results do not establish treatment efficacy. In 2022, a joint WHO, Africa CDC and African Union expert mission reviewing Congolese traditional COVID-19 therapeutics including Manacovid concluded that the way the available data had been analysed and presented had not generated the evidence needed to establish efficacy and recommended stronger observational and randomized clinical-trial designs. That finding does not prove that every component of Manacovid is pharmacologically inactive; it means the claimed COVID-19 benefit had been treated as established before adequate evidence supported it.
category: Medicine and public health
reviewedAt: 2026-08-24
impact:
  summary: >-
    The Democratic Republic of the Congo moved Manacovid beyond experimental investigation into authorized and publicly legitimized treatment. The product received market authorization in November 2020, state reporting publicized claims of 100% recovery among 300 treated patients, and the health minister described the reported results as conclusive and significant while promising ministry support so patients could obtain an effective and safe remedy. Yet in September 2021 the Council of Ministers was still calling for randomization of Manacovid, and a 2022 joint WHO/Africa CDC/African Union mission concluded that the existing data analysis had not generated evidence of efficacy.
  highlights:
    - value: "24 Nov 2020"
      label: Manacovid received authorization for market release as a COVID-19 treatment
    - value: "300 patients"
      label: Preliminary results were publicly presented as 100% recovery after treatment
    - value: "2022"
      label: WHO, Africa CDC and African Union experts said the analysed data had not generated evidence of efficacy
  context:
    - >-
      The evidentiary problem is the leap from promising or preliminary observations to an authorized treatment presented as effective. Medicinal plants can yield useful drugs, and the available evidence did not conclusively prove every component of Manacovid ineffective; it did show that efficacy had not been established at the level claimed.
    - >-
      The 2022 joint expert review provided a high-authority external scientific correction to the efficacy claim. It did not document a formal withdrawal of Manacovid's Congolese market authorization.
episodes:
  - id: drc-2020-2022
    polity: Democratic Republic of the Congo
    region: Central Africa
    startYear: 2020
    endYear: 2022
    periodLabel: 2020–2022
    strength: policy-basis
    institutionTypes: [government, medical]
    institutions:
      - Ministry of Public Health, Hygiene and Prevention
      - Direction de la Pharmacie et du Médicament
      - Council of Ministers of the Democratic Republic of the Congo
    institutionalContext: >-
      Manacovid received authorization for market release on 24 November 2020 after clinical work on 300 symptomatic SARS-CoV-2-positive patients was presented as yielding 100% recovery. In January 2021 the health minister, through the medicines directorate, characterized the reported results as conclusive and significant and promised support so COVID-19 patients could obtain an effective and safe remedy. The treatment nevertheless remained evidentially unsettled: in September 2021 the Council of Ministers called for continued randomization of Manacovid to support recognition as a COVID-19 treatment, and in March 2022 a joint WHO/Africa CDC/African Union expert mission found that the available analyses had not generated evidence of efficacy.
    consequences:
      - Market authorization for Manacovid as a COVID-19 treatment before randomized efficacy evidence was established
      - State amplification of a 100% recovery claim from preliminary clinical results
      - Health-ministry support that publicly framed the product as an effective and safe remedy
      - Continued government pursuit of randomization after authorization and public promotion
    summary: >-
      In late 2020 the Democratic Republic of the Congo authorized Manacovid for the market as a COVID-19 treatment after preliminary results involving 300 patients were presented as showing 100% recovery. The health minister subsequently described the findings as conclusive and significant and pledged institutional support. The government's own September 2021 cabinet minutes, however, still called for randomization of Manacovid. In March 2022 a joint WHO, Africa CDC and African Union expert mission reviewing Manacovid and other Congolese traditional therapeutics concluded that the data as analysed and presented had not generated evidence of efficacy and recommended stronger randomized-trial methods.
