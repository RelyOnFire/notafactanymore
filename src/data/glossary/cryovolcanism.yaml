term: Cryovolcanism
aliases:
- cryovolcanic
- ice volcanism
shortDefinition: Volcanic-like activity on cold worlds in which water, water vapor, ice particles, or other volatile
  materials erupt instead of molten silicate rock.
longDefinition: Cryovolcanism is a broad term for eruption-like geological activity involving volatile materials on icy
  worlds. Instead of hot silicate lava, the erupted material may include water, vapor, ice grains, ammonia, methane,
  or mixtures of these. Enceladus's south-polar jets are a prominent example of active volatile release from an icy moon,
  though researchers distinguish among specific eruption mechanisms.
relatedTerms:
- tidal-heating
reviewedAt: '2026-08-21'
sources:
- title: 'Enceladus: Facts'
  url: https://science.nasa.gov/saturn/moons/enceladus/facts/
  publisher: NASA Science
  note: Documents active water-rich plumes erupting from fractures near Enceladus's south pole and its subsurface ocean.
