  - id: sign-spoken-correction
    sourceId: sign-language-spoken-study
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: abstract; Participants, Results, and Conclusions and Recommendations sections
    note: >-
      In a cross-sectional sample of 56 ASL–English bilingual deaf and hard-of-hearing children aged 8–60 months with
      hearing parents, ASL and spoken-English vocabulary were positively associated. The authors explicitly state that
      the retrospective, correlational design cannot establish causality.
  - id: sign-asha-language-correction
    sourceId: asha-asl-position
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Position Statement and “Equivalence of Signed and Spoken Languages”
    note: >-
      ASHA's official position identifies ASL as a distinct, rule-governed language with phonology, morphology,
      semantics, syntax and pragmatics, and summarizes linguistic, developmental and neurobiological equivalence.
  - id: sign-systematic-review-correction
    sourceId: sign-oral-systematic-review
    relation: contextualizes
    target: {scope: belief, aspect: correction}
    locator: abstract, Results and Conclusions
    note: >-
      The review found eleven cohort studies and judged the high-quality comparative evidence insufficient to determine
      whether sign-plus-oral intervention is more effective for spoken-language outcomes than oral-only intervention.
  - id: sign-access-correction
