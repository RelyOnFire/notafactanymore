schemaVersion: 2
title: Anthropometric and degenerative traits as a scientific basis for prisoner classification
proposition:
  summary: >-
    Belgian prison anthropology treated body measurements, morphology, hereditary and acquired 'degeneration', mental
    traits and family history as scientifically meaningful inputs for diagnosing and classifying offenders, and
    institutionalised them in standardised dossiers intended to guide individualised prison classification and treatment.
correction:
  summary: >-
    Body measurements, morphology and hereditary 'degeneration' markers do not provide a scientifically valid diagnosis
    of criminality; the State Archives of Belgium describes the period's concepts as scientifically obsolete. Change
    inside the prison system was gradual: psychological and sociological factors gained priority after the Second World
    War, and Étienne De Greeff's 1952 report judged anthropometric measurements minimally useful and biological,
    temperament and hormonal classifications superfluous, but anthropological dossiers and services continued in revised form.
category: Criminology, prisons and medical classification
reviewedAt: '2026-09-20'
impact:
  summary: >-
    Louis Vervaeck opened Belgium's first prison anthropology laboratory in Brussels with ministerial approval in 1907.
    In 1920 the Ministry-backed Penitentiary Anthropology Service established laboratories in ten prisons and introduced
    standardised files recording bodily measurements, family and hereditary history, health, education, social faculties,
    mental resistance and a final diagnosis. More than 9,000 Saint-Gilles files survive from 1920–1957, but only 3–7% of
    the prison's registered prisoners were actually examined. After the war the service gave greater weight to psychological
    and sociological factors. De Greeff's proposed medico-psychological dossier was not implemented uniformly, a revised
    anthropological dossier appeared in the early 1960s, and local anthropological services were replaced in 1997.
  highlights:
    - value: '1907'
      label: year Vervaeck opened the first Belgian prison anthropology laboratory with ministerial approval
    - value: '10'
      label: prisons in which the Penitentiary Anthropology Service established laboratories in 1920
    - value: 9,000+
      label: surviving Saint-Gilles anthropological files from 1920–1957
    - value: 3–7%
      label: share of registered Saint-Gilles prisoners actually examined
  context:
    - >-
      Vervaeck was not a simple follower of Cesare Lombroso. His classification combined hereditary, biological,
      psychological and environmental factors, and he rejected a crude single-cause determinism. The institutional error
      was the scientific weight assigned to anthropometry and hereditary-degeneration categories, not every element of
      early Belgian rehabilitative criminology.
    - >-
      Vervaeck's 1907 tattoo study illustrates the breadth of the data collected, but it does not establish the later
      national classification system. In that study he found no apparent relationship between tattooing and heredity,
      degeneration, insanity or criminality and warned against inferring moral or psychological character from tattoos.
    - >-
      The 1952 report documents an internal methodological critique, not a completed service-wide repudiation. Uniform
      adoption of De Greeff's replacement dossier proved impossible; revised anthropological dossiers remained in use,
      and the local services retained that name until their replacement by a psychosocial service in 1997.
episodes:
  - id: belgium-1907-1952
    polity: Belgium
    region: Western Europe
    startYear: 1907
    endYear: 1952
    periodLabel: '1907 first laboratory–1952 documented internal critique; transition continued to 1997'
    strength: policy-basis
    institutionTypes:
      - government
      - medical
      - professional
    institutions:
      - Belgian Ministry of Justice
      - Penitentiary Anthropology Service
      - Anthropological laboratories of Belgian prisons
    institutionalContext: >-
      After ministerial approval, Vervaeck opened an anthropological laboratory in a Brussels prison in 1907. His model
      classified offenders through a broad medical and psychiatric examination, anthropometry, and questions about
      hereditary, social and criminological background. In 1920 the Ministry-backed Penitentiary Anthropology Service
      established laboratories in ten prisons and introduced standardised dossiers. The programme was designed to make
      prison classification and treatment individual to the diagnosed prisoner. After the war, practitioners increasingly
      prioritised psychological and sociological factors; De Greeff's 1952 report called anthropometric measures minimally
      useful and biological, temperament and hormonal classifications superfluous.
    consequences:
      - Detailed bodily, hereditary, social and psychological data were collected from prisoners who received an examination
      - Offenders were classified through categories that combined heredity, environment and scientifically obsolete degeneration concepts
      - Dossiers were intended to support individualised classification and treatment, and later reports were sent to prison management
      - Medical diagnosis acquired a larger role in Belgian prison administration and social-defence proposals
      - More than 9,000 Saint-Gilles dossiers survive from 1920–1957, although only 3–7% of registered prisoners there were examined
    summary: >-
      Belgium made criminal anthropology part of prison administration. The Ministry-backed service created standardised
      diagnostic dossiers and classified examined prisoners through bodily, hereditary, psychological and social observations.
      Its programme intended those diagnoses to guide individualised classification and treatment. Actual coverage was
      limited at Saint-Gilles, where only 3–7% of registered prisoners were examined despite the survival of more than
      9,000 dossiers. The postwar shift away from anthropometry was gradual and remained institutionally incomplete in 1952.
    mechanism:
      kind: classification
      summary: >-
        Ministry-backed prison laboratories recorded bodily, hereditary, psychological and social observations in
        standardised anthropological dossiers, classified examined prisoners, and intended the diagnoses to guide
        individualised institutional placement and treatment.
    institutionalCorrection:
      status: partial
      periodLabel: '1952–1997'
      action: >-
        De Greeff's 1952 internal report reduced anthropometry to minimal utility and rejected biological, temperament and
        hormonal classifications as superfluous; the service then changed its dossiers gradually, and local anthropological
        services were replaced by a psychosocial service in 1997.
      summary: >-
        The report was a specific internal methodological rejection, but it did not produce a uniform or immediate
        institutional replacement. A new anthropological dossier appeared in the early 1960s, and anthropological dossiers
        and local services continued until 1997. The surviving sources do not document a single formal repudiation of the
        older theory by the Ministry or service.
