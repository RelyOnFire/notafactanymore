locale: de
entryId: biological-absorption-aboriginal-people
sourceReviewedAt: 2026-08-23
title: Biologische „Absorption“ der Aborigines
claim: Menschen mit teilweise indigener Abstammung wurden als Bevölkerung behandelt, die durch gelenkte Eheschließungen und Assimilation in die weiße australische Gesellschaft zum Verschwinden gebracht werden könne.
currentUnderstanding: Aboriginal und Torres Strait Islander Peoples sind keine biologisch minderwertigen Bevölkerungen, die in einer angeblich überlegenen „Rasse“ aufgehen müssten. Indigene Identität, Verwandtschaft, Kultur und politische Zugehörigkeit lassen sich nicht auf Hautfarbe oder Abstammungsanteile reduzieren; staatliche Eingriffe in Ehe, Kinder und Familienleben verursachten tiefgreifende und langfristige Schäden.
episodes:
  - id: australia-1933-1939
    polity: Australien
    institutions:
      - Commonwealth Department of the Interior
      - Office of the Chief Protector of Aborigines, Western Australia
      - Office of the Commissioner of Native Affairs, Western Australia
      - Office of the Chief Protector of Aboriginals, Northern Territory
      - Commonwealth–State Aboriginal Welfare Conference
    institutionalContext: Eine einheitliche „Native Affairs administration“ gab es nicht. In Western Australia bekleidete A. O. Neville bis 1936 das gesetzlich definierte Amt des Chief Protector of Aborigines und anschließend das des Commissioner of Native Affairs; im Northern Territory handelte der Chief Protector innerhalb der Commonwealth-Verwaltung. Vertreter dieser Systeme trafen sich 1937 auf der Commonwealth–State-Konferenz, auf der „Absorption“ ausdrücklich als gemeinsames politisches Ziel formuliert wurde.
    summary: "In den 1930er-Jahren propagierten führende Vertreter des Commonwealth und einzelner Bundesstaaten eine „biologische Absorption“: Menschen, die als teilweise indigener Abstammung eingestuft wurden, sollten durch Eheschließungen in der weißen Bevölkerung aufgehen, bis indigene Eigenständigkeit verschwände. Die Commonwealth–State-Konferenz von 1937 beschloss ausdrücklich, dass das Schicksal der als nicht „full blood“ klassifizierten Menschen in ihrer endgültigen Absorption liege und staatliche Anstrengungen darauf ausgerichtet werden sollten."
    consequences:
      - Staatliche Kontrolle über Ehe und Familienleben
      - Entfernung und Institutionalisierung indigener Kinder
      - Administrative Verfolgung biologischer und kultureller Assimilation
      - Langfristige Zerstörung von Verwandtschaft, Identität und gemeinschaftlicher Kontinuität
