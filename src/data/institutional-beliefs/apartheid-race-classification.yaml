title: Every South African as assignable to a definite racial group
claim: South Africa's apartheid state treated every person's race or population group as a determinate personal
  fact that officials could classify and record using appearance, descent, social acceptance and reputation, and
  then used that official classification to allocate legal rights, restrictions and life opportunities.
currentUnderstanding: The apartheid categories were legal and social constructions, not discrete biological divisions
  of humanity. The statutory criteria were themselves ambiguous and changed over time; appearance, descent and social
  acceptance could conflict, classifications could be challenged or altered, and members of the same family could
  receive different classifications. Biological anthropology likewise finds that socially recognised races do not
  map onto discrete, fixed human biological groups. Race remains a powerful social reality because institutions
  and racism give categories real consequences, not because apartheid classifications discovered natural biological
  boundaries.
category: Apartheid, racial classification and state administration
reviewedAt: '2026-08-25'
impact:
  summary: The Population Registration Act of 1950 made racial classification the administrative foundation of apartheid.
    Every person entered in the population register had to receive an official classification, supported by identity
    documents and a bureaucracy of officials, classification boards and courts. The Truth and Reconciliation Commission
    later called the Act the bedrock of apartheid and described its racial definitions as crude and hopelessly imprecise.
    Classification determined where people could live, study and work, which facilities they could use, whom they
    could marry or have sexual relations with under related laws, and sometimes divided families. Parliament repealed
    the system in 1991.
  highlights:
  - value: 41 years
    label: from the Population Registration Act in 1950 to its repeal in 1991
  - value: '3'
    label: 'primary racial categories in the original 1950 Act: white, coloured and native'
  - value: 28 June 1991
    label: date the repeal took effect and statutory population-race registration was abolished
  context:
  - 'The statute did not rely only on genetics or a single physical test. Its instability is part of the historical
    record: the law mixed appearance with social acceptance and later increasingly with descent, while providing
    objections, appeals and reclassification procedures.'
  - The correction is not that race became socially irrelevant after 1991. Racial categories created through colonialism
    and apartheid continue to structure inequality and identity. The corrected proposition is that the apartheid
    bureaucracy was identifying fixed natural kinds when it assigned every person to a race.
  - Repeal in 1991 ended the population-registration machinery before the 1994 democratic transition. The later
    Constitution's commitment to non-racial equality deepened the political repudiation after the legal classification
    regime itself had already been abolished.
episodes:
- id: south-africa-1950-1991
  polity: South Africa
  region: Southern Africa
  startYear: 1950
  endYear: 1991
  strength: enforced-doctrine
  institutionTypes:
  - government
  - court
  institutions:
  - Department of the Interior and population-registration administration
  - Race-classification boards
  - South African courts administering classification appeals
  institutionalContext: Act No. 30 of 1950 required the state to compile a population register and classify every
    person in it. The original statute defined a white person principally through obvious appearance or general
    social acceptance, defined a native through membership or accepted membership in an African race or tribe, and
    made 'coloured' a residual category. Amendments added and reshaped tests involving descent, family classifications
    and social acceptance. Officials recorded the result in the population register and identity system, while boards
    and courts heard objections. The classification then served as the key used by the wider apartheid legal order.
  consequences:
  - Official racial classification of the population from birth or registration into legally consequential groups
  - Use of classification to govern residence, schooling, university access, employment and public facilities
  - Interaction with marriage, sexual, voting, mobility and homeland laws built around the same racial categories
  - Humiliation, uncertainty and litigation for people whose appearance, descent and social acceptance did not yield
    the same answer
  - Different classifications within families, sometimes producing legal and social separation
  - A large bureaucracy devoted to maintaining, contesting and revising racial identity as an official state fact
  summary: The Population Registration Act made a disputed social classification look like an administratively ascertainable
    fact. The state required every person to be sorted, recorded and governed through a racial category even though
    its own criteria were unstable enough to generate objections, reclassifications and family divisions. South
    Africa's Truth and Reconciliation Commission later described the definitions as bizarre and hopelessly imprecise,
    while modern biological anthropology rejects the idea that socially recognised races are discrete biological
    groups.
  sources:
