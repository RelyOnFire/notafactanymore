term: Transmutation
aliases:
- Elementumwandlung
- Metalltransmutation
shortDefinition: Die Umwandlung eines chemischen Elements in ein anderes; nach moderner Physik erfordert sie eine Veränderung
  des Atomkerns.
longDefinition: Transmutation bezeichnet die Umwandlung eines Elements in ein anderes. In der Alchemie wurde sie unter
  anderem als Umwandlung unedler Metalle in Gold durch gewöhnliche Laborverfahren gedacht. Die moderne Chemie zeigt dagegen,
  dass chemische Reaktionen nur Elektronen und Bindungen neu anordnen; für einen Elementwechsel muss die Protonenzahl
  des Atomkerns durch einen Kernprozess verändert werden.
