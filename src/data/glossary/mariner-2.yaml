term: Mariner 2
aliases: []
shortDefinition: A NASA spacecraft that flew past Venus in 1962 and returned the first successful close-range measurements
  of another planet.
longDefinition: Mariner 2 became the first successful interplanetary spacecraft when it flew past Venus on 14 December
  1962. Its microwave and infrared measurements supported the conclusion that Venus has an extremely hot surface, sharply
  weakening earlier expectations of a mild Earth-like world beneath the clouds.
