entryId: perineum
sourceReviewedAt: '2026-08-21'
term: Damm
aliases:
- Perineum
- perineal
shortDefinition: Die Geweberegion am unteren Becken; im Zusammenhang mit Geburten ist meist das Gewebe zwischen Scheidenöffnung
  und After gemeint.
longDefinition: Anatomisch bezeichnet das Perineum die rautenförmige Region unterhalb des Beckenbodens zwischen den Oberschenkeln.
  In der Geburtshilfe wird mit Damm oder Perineum häufig enger das Gewebe zwischen Scheidenöffnung und After bezeichnet,
  das sich bei einer vaginalen Geburt dehnt und reißen oder bei einer Episiotomie eingeschnitten werden kann.
