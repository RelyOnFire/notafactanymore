schemaVersion: 2
locale: de
entryId: chlorella-algolization
sourceReviewedAt: '2026-09-27'
title: Chlorella-„Algolisierung“ zur Sanierung von Gewässern
proposition:
  summary: >-
    Russische nationale Normen behandelten das Beimpfen von Gewässern mit kultivierten planktonischen
    Chlorella-Stämmen – die sogenannte Algolisierung – als Methode, um Cyanobakterienblüten zu unterdrücken und
    weitreichende chemische, mikrobiologische und ökologische Verbesserungen zu bewirken.
correction:
  summary: >-
    Die von russischen Gewässerforschern ausgewertete Feldevidenz belegt nicht, dass ausgewählte Chlorella-Stämme in
    offenen Stauseen Cyanobakterienblüten zuverlässig unterdrücken oder die der Algolisierung zugeschriebenen breiten
    Verbesserungen bewirken. Ein föderaler Versuch blieb uneindeutig, wiederholten Einsätzen fehlten geeignete Kontrollen
    oder konsistente Wirkungen, und spätere Experimente bestätigten den behaupteten Konkurrenzmechanismus nicht. Forschung
    zu Mikroalgen in technischen Abwassersystemen belegt diese Freiwassermethode nicht: Die Leistung hängt von Organismus,
    Kulturverfahren, Reaktorauslegung, Abwasser und Betriebsbedingungen ab.
impact:
  summary: >-
    Russische Normungsinstitutionen gaben einem wissenschaftlich umstrittenen Verfahren eine amtliche technische Form,
    nachdem föderale Wasserbehörden und eine nationale hydrobiologische Fachgesellschaft seine Evidenzgrundlage verworfen
    hatten. Die Normen legen Stämme, Dosierungen, wiederholte Beimpfung und Überwachung fest und schreiben dem Verfahren
    Wirkungen von der Blütenunterdrückung und mehr gelöstem Sauerstoff bis zu weniger Krankheitserregern und klarerem
    Wasser zu. Die eigene Norm von 2025 erfasst Trinkwasserquellen, Freizeitgewässer, Fischereigewässer und Gewässer der
    biologischen Reinigung. Das ist eine folgenreiche amtliche Billigung, obwohl nationale Normen nach russischem Recht
    grundsätzlich freiwillig sind, sofern Gesetzgebung oder eine öffentliche Konformitätserklärung sie nicht verbindlich
    machen.
  highlights:
    - value: '2009'
      label: föderaler Wissenschaftsrat erklärte den Vorschlag zur Blütenunterdrückung für unbelegt und praktisch unbestätigt
    - value: '2014'
      label: Kongress der Hydrobiologischen Gesellschaft nannte die Methode falsch und schädlich für die russische Hydrobiologie
    - value: '2022'
      label: erste russische nationale Norm schrieb Algolisierung als Gewässersanierung fest
    - value: 1. Juni 2025
      label: eigene nationale Norm für Chlorella-Algolisierung trat in Kraft
  context:
    - >-
      Der Beitrag in Water Resources von 2023 zitiert ein Schreiben der Föderalen Agentur für Wasserressourcen von 2014.
      Danach lieferte ihr Versuch am Zimljansker Stausee 2007 uneindeutige Ergebnisse und konnte keine Wirksamkeit
      nachweisen. Dem Schreiben zufolge befand ihr wissenschaftlich-technischer Rat 2009 den Einsatz von Chlorella gegen
      Blüten für wissenschaftlich unbegründet und praktisch unbestätigt; weitere Forschung und Entwicklung in diese
      Richtung seien nicht zweckmäßig.
    - >-
      Der XI. Kongress der Hydrobiologischen Gesellschaft bei der Russischen Akademie der Wissenschaften beschloss 2014,
      die sogenannte Algolisierung als falsche und für die russische Hydrobiologie schädliche Methode zu bezeichnen. Die
      Untersuchung von 2023 fand zudem keine regelmäßige Wirkung wiederholter Stausee-Einsätze, kritisierte fehlende
      Vergleichsgewässer und berichtete von späteren Arbeiten, die den behaupteten Mechanismus nicht bestätigten.
    - >-
      GOST R 59977-2022 schrieb Algolisierung dennoch in einem Abschnitt zur Gewässersanierung fest und führte zahlreiche
      erwartete Wirkungen auf. GOST R 71946-2025 schuf anschließend eine eigene 16-seitige Norm. Ihre Einleitung räumt ein,
      dass der erste große Versuch am Pensa-Stausee 1998 wirkungslos blieb; Abschnitt 4 behauptet dennoch, die Beimpfung
      senke Cyanobakterien, erhöhe den Sauerstoffgehalt, beseitige Gerüche, steigere die Sichttiefe und bewirke weitere
      Verbesserungen.
    - >-
      Die Korrektur gilt für diese konkrete Methode. Chlorella und andere Mikroalgen werden in technischen
      Abwassersystemen wie Teichen und Photobioreaktoren erforscht, deren Leistung je nach Verfahrensauslegung und
      Betriebsbedingungen variiert. Diese Systeme belegen nicht, dass geringe Einbringungsmengen sich in komplexen
      natürlichen Stauseen etablieren, Cyanobakterien verdrängen oder sämtliche von den Normen behaupteten Wirkungen
      erzielen.
episodes:
  - id: russia-2022-2026
    polity: Russland
    institutions:
      - Rosstandart (Föderale Agentur für technische Regulierung und Metrologie)
      - Russisches Institut für Standardisierung
      - Technisches Komitee 409 „Umweltschutz“
    institutionalContext: >-
      Die amtliche Billigung erfolgte durch nationale technische Normung. Rosstandart genehmigte GOST R 59977-2022, deren
      Abschnitt 5 Algolisierung als Gewässersanierung festschrieb. Der private „Innovative Umweltfonds“ (INEKO) entwickelte
      die eigene GOST R 71946-2025; das Technische Komitee 409 brachte sie ein, und Rosstandart genehmigte sie mit Erlass
      59-st. Das Russische Institut für Standardisierung veröffentlichte und katalogisierte die Norm als gültig. Nach
      Artikel 26 des Föderalen Gesetzes 162-FZ verpflichtet dieser Status allein nicht alle Gewässerbetreiber zur Anwendung.
    consequences:
      - Eine nationale Norm definierte Algolisierung formal als Gewässersanierung und Blütenprävention
      - Die Norm von 2022 legte Chlorella-Stamm, Einsatzmengen, wiederholte saisonale Beimpfung und Überwachung fest
      - Die Normen schrieben dem Verfahren breite chemische, mikrobiologische und ökologische Wirkungen zu
      - Die eigene Norm von 2025 erfasste Trinkwasser-, Freizeit-, Fischerei- und biologische Reinigungsgewässer
      - Das Normungssystem behielt die Methode trotz dokumentierter wissenschaftlicher und behördlicher Ablehnung bei und baute sie aus
    summary: >-
      Russland verlieh der Chlorella-basierten Algolisierung mit GOST R 59977-2022 nationalen Normstatus und erließ danach
      die eigene GOST R 71946-2025. Die Dokumente legen die Einbringung kultivierter Stämme fest und beschreiben das
      Verfahren als Unterdrückung von Cyanobakterien und Verbesserung zahlreicher Wasserqualitätswerte. Diese Billigung
      folgte auf einen uneindeutigen föderalen Versuch, eine negative Bewertung des föderalen Wissenschaftsrats und die
      ausdrückliche Ablehnung der Hydrobiologischen Gesellschaft. Die Norm von 2025 war bei der Prüfung weiterhin gültig;
      nationale Normen sind jedoch grundsätzlich freiwillig, solange kein anderer Rechts- oder Konformitätsmechanismus
      ihre Anwendung verbindlich macht.
    mechanism:
      summary: >-
        Rosstandarts Normungsverfahren überführte eine umstrittene kommerzielle und technische Praxis in nationale
        Spezifikationen: zugelassene Organismen, Herstellungs- und Sicherheitsanforderungen, Anwendungspläne, Dosierungen,
        Überwachung und behauptete Wirkungen.
    institutionalCorrection:
      periodLabel: 2022–2026
      summary: >-
        Eine Rücknahme oder wissenschaftliche Korrektur durch das ausstellende Normungssystem ist nicht dokumentiert.
        Stattdessen bestätigte und erweiterte die eigene Norm von 2025 das Verfahren nach den früheren negativen
        Bewertungen; der amtliche Katalog führte sie bei der Prüfung weiterhin als gültig. Die Ablehnung durch föderale
        Wasserforscher und die Hydrobiologische Gesellschaft belegt institutionellen Widerspruch, aber keine Korrektur
        durch die normsetzenden Institutionen dieser Episode.
evidence:
  - id: chlorella-review-belief-correction
    note: >-
      Die Untersuchung findet keine regelmäßige Wirkung bei wiederholten Einsätzen, benennt fehlende Vergleichsgewässer
      und weitere methodische Mängel, verwirft mehrere behauptete Mechanismen und kommt zu dem Schluss, dass spätere
      Forschung Chlorella nicht als Biomanipulation gegen Blüten in natürlichen Gewässern bestätigt habe.
  - id: chlorella-review-impact
    note: >-
      Sie gibt die negative wissenschaftliche Bewertung von 2008, den Beschluss der Fachgesellschaft von 2014 und das
      Schreiben der Föderalen Wasseragentur mit dem uneindeutigen Versuch von 2007 und dem negativen Ratsbeschluss von
      2009 wieder.
  - id: chlorella-review-episode-context
    note: >-
      Die begutachtete Untersuchung dokumentiert, dass maßgebliche russische wissenschaftliche und wasserwirtschaftliche
      Einwände den Normen von 2022 und 2025 vorausgingen, und belegt damit den zentralen Widerspruch der Episode.
  - id: chlorella-congress-episode-context
    note: >-
      Der Kongressbeschluss nennt die sogenannte Algolisierung falsch und schädlich für die russische Hydrobiologie und
      fordert moderne wissenschaftliche Verfahren gegen Eutrophierung. Die aktuelle Institutsseite identifiziert und
      verlinkt den Beschluss, obwohl der alte PDF-Link bei der jüngsten Prüfung nicht erreichbar war.
  - id: chlorella-gost59977-proposition
    note: >-
      Die nationale Norm von 2022 definiert Algolisierung als Blütenprävention und Gewässersanierung und verlangt
      Verbesserungen bei Sauerstoff, Sauerstoffbedarfswerten, Krankheitserregern, Erdölprodukten, Metallen, Nährstoffen
      und organoleptischen Eigenschaften.
  - id: chlorella-gost59977-mechanism
    note: >-
      Sie legt Voruntersuchung, Stammeignungstest, Sanierungsplan, Kultivierung, mindestens drei Beimpfungen je
      Vegetationsperiode, Überwachung und ein Mindestvolumen je Einzeldosis des benannten Chlorella-Stamms fest.
  - id: chlorella-gost71946-catalog-carrier
    note: >-
      Der amtliche Katalog führt die 16-seitige Norm seit 1. Juni 2025 als gültig, nennt das Technische Komitee 409, INEKO
      als Entwickler und Erlass 59-st sowie den Geltungsbereich für Trinkwasser-, Freizeit-, Fischerei- und biologische
      Reinigungsgewässer.
  - id: chlorella-gost71946-catalog-consequences
    note: >-
      Der Katalog bestätigt, dass die Algolisierung für mehrere folgenreiche Kategorien der Gewässernutzung eine eigene,
      derzeit gültige nationale Norm erhielt.
  - id: chlorella-notification-carrier
    note: >-
      Die Mitteilung des Normungsinstituts dokumentiert Rosstandarts Registrierung von GOST R 71946-2025 und bestätigt den
      formalen Genehmigungsweg unabhängig von der Katalogbeschreibung.
  - id: chlorella-law-episode-context
    note: >-
      Artikel 26 erklärt nationale Normungsdokumente grundsätzlich für freiwillig, sofern die Gesetzgebung nichts anderes
      bestimmt; für Hersteller oder Leistungserbringer wird eine Norm bei einer öffentlichen Konformitätserklärung bindend.
  - id: chlorella-gbo-index-context
    note: >-
      Die amtliche, vom Institut betriebene Seite der Fachgesellschaft nennt den Beschluss des XI. Kongresses vom
      22.–26. September 2014 und belegt die institutionelle Herkunft der separat aufgeführten Resolution.
  - id: chlorella-gost71946-text-proposition
    note: >-
      Die Norm räumt ein, dass der erste Versuch am Pensa-Stausee 1998 wirkungslos war, schreibt dem Verfahren danach aber
      Blütenunterdrückung, mehr Sauerstoff, Geruchsbeseitigung, höhere Sichttiefe, ökologische Stabilität und weitere
      Vorteile zu.
  - id: chlorella-gost71946-text-mechanism
    note: >-
      Der veröffentlichte Text nennt INEKO, das Technische Komitee 409 und Rosstandarts Erlass 59-st und normiert Stämme,
      Herstellung der Suspension, Verpackung, Lagerung, Transport, Anwendung und Überwachung.
  - id: chlorella-gost71946-text-correction
    note: >-
      Die nach den dokumentierten negativen Bewertungen erlassene eigene Norm hält an den umstrittenen Wirkungen fest;
      das Eingeständnis eines frühen Fehlschlags nimmt diese allgemeinen Behauptungen weder zurück noch schränkt es sie ein.
  - id: chlorella-wastewater-belief-correction
    note: >-
      Die Übersicht dokumentiert legitime Forschung zu Mikroalgen und Chlorella in geplanten Abwasserbehandlungssystemen
      und betont zugleich, wie stark die Ergebnisse von Kulturverfahren, Beckengröße, Abwasser, Stamm und technischen
      Bedingungen abhängen.
  - id: chlorella-wastewater-episode-context
    note: >-
      Ihre technischen Teiche, Suspensionskulturen, immobilisierten Systeme und Photobioreaktoren bilden eine wichtige
      Grenze: Evidenz aus geplanten Behandlungssystemen lässt sich nicht einfach auf niedrig dosierte Beimpfung natürlicher
      Stauseen übertragen.
