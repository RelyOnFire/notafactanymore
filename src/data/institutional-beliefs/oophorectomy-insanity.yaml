  institutionalContext: >-
    Alice Bennett, physician-in-chief of the women's department at the State Hospital for the Insane at Norristown,
    and surgeon Joseph Price pursued removal of ovaries and related reproductive surgery in women whose psychiatric
    illness was attributed to pelvic or reproductive pathology. The hospital's trustees authorized the program rather
    than the operations occurring solely as a private experiment. By late 1892 four women had undergone ovariectomy,
    while additional patients were being considered for operation. Pennsylvania's Board of Public Charities and its
    Committee on Lunacy investigated the practice in 1893 and rejected its continuation.
  consequences:
  - Institutionalized women underwent irreversible reproductive surgery as psychiatric treatment
  - The operations caused permanent loss of fertility and, where both ovaries were removed, surgical menopause
  - Approximately fifty additional women were reported as marked or proposed for surgery before the program was stopped
  - State oversight intervened after questioning the medical, legal and ethical basis of the operations
  summary: >-
    In 1892 the women's department of Pennsylvania's Norristown state hospital began using ovariectomy as a treatment
    for insanity attributed to reproductive disease. The program had trustee approval and was therefore an institutional
    treatment policy rather than merely an individual physician's theory. Four women had undergone the operation
    when the practice became the subject of state scrutiny, and contemporary accounts reported that roughly fifty
    additional patients had been selected or proposed. In 1893 the Pennsylvania Committee on Lunacy condemned the
    practice and the program was discontinued.
