    publisher: Swiss Federal Office of Culture
    note: Federal historical account of the program, the removal of roughly 600 children, wider removals, official
      cooperation, the 1973 closure and the Federal Council's later recognition and apology.
  - title: Problematic treatment of the non-sedentary population
    url: https://www.bar.admin.ch/de/problematischer-umgang-mit-der-nicht-sesshaften-bevoelkerung
    publisher: Swiss Federal Archives
    note: Federal archival account describing systematic removal and re-education of Yenish children, support by
      federal, cantonal and municipal bodies and the 1986 federal apology.
  - title: Rassismus gegen Jenische, Sinti/Manouches oder Roma
    url: https://www.ekr.admin.ch/publikationen/d958.html
    publisher: Swiss Federal Commission against Racism
    note: Federal anti-racism dossier explaining the racial-biological ideology, the targeting of families regardless
      of actual lifestyle and the program's goal of separating children to dissolve Yenish culture.
