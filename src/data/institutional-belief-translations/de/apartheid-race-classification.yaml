schemaVersion: 2
locale: de
entryId: apartheid-race-classification
sourceReviewedAt: '2026-09-20'
title: Jeder Mensch in Südafrika als eindeutig einer „Rasse“ zuordenbar
proposition:
  summary: >-
    Der Apartheidstaat behandelte die „Rasse“ oder Bevölkerungsgruppe jedes Menschen als feststellbare persönliche
    Tatsache, die Behörden anhand von Aussehen, Abstammung, gesellschaftlicher Akzeptanz und Ruf bestimmen und registrieren
    könnten. Diese amtliche Einstufung entschied anschließend über Rechte, Verbote und Lebenschancen.
correction:
  summary: >-
    Die Apartheidkategorien waren rechtliche und gesellschaftliche Konstruktionen, keine diskreten biologischen
    Unterteilungen der Menschheit. Die gesetzlichen Kriterien waren mehrdeutig und veränderten sich: Aussehen, Abstammung
    und soziale Akzeptanz konnten einander widersprechen, Einstufungen konnten angefochten oder geändert und Angehörige
    derselben Familie unterschiedlich klassifiziert werden. Auch die biologische Anthropologie zeigt, dass gesellschaftlich
    anerkannte „Rassen“ keinen diskreten, festen oder homogenen biologischen Gruppen entsprechen. Gesetz 114 von 1991 hob
    den Population Registration Act und festgelegte verbundene Bestimmungen auf und beendete damit diesen verpflichtenden
    Klassifikationsapparat, ließ das bestehende Register nach dem Identification Act aber vorübergehend fortbestehen.
    „Rasse“ bleibt gesellschaftlich folgenreich, weil Institutionen und Rassismus den Kategorien reale Wirkung verleihen
    und nicht, weil Apartheidbeamte natürliche biologische Grenzen entdeckt hätten.
impact:
  summary: >-
    Der Population Registration Act von 1950 machte die Rassenklassifikation zu einem Verwaltungsfundament der Apartheid.
    Sein ursprünglicher Text verpflichtete den Zensusdirektor, jeden Menschen im Register als white, coloured oder native
    einzustufen; das spätere Verwaltungssystem trennte Indian von Coloured und verwendete vier Grundkategorien.
    Identitätsnummern, Ausweise und eine Bürokratie aus Zensus- und Innenministeriumsbeamten machten diese Einstufungen im
    Staatsapparat verfügbar. Die Wahrheits- und Versöhnungskommission bezeichnete die Bevölkerungsregistrierung als
    Grundpfeiler der Apartheid und verknüpfte die Einstufung mit Wohn- und Arbeitsort sowie Trennungen innerhalb von
    Familien. Die historische Forschung dokumentiert demütigende Untersuchungen, umstrittene Einstufungen und eine spätere
    Verlagerung hin zu einer aus amtlichen Akten abgeleiteten Abstammung. Gesetz 114 hob das Klassifikationsgesetz am
    28. Juni 1991 auf, vorbehaltlich einer Übergangsregel für das bestehende Register.
  highlights:
    - value: 41 Jahre
      label: vom Population Registration Act 1950 bis zu seiner Aufhebung 1991
    - value: '3'
      label: 'Haupteinstufungen im ursprünglichen Gesetz von 1950: white, coloured und native'
    - value: '4'
      label: 'Grundkategorien im späteren Verwaltungssystem: Coloured, Indian, White und Black'
    - value: 28. Juni 1991
      label: Inkrafttreten von Gesetz 114; das bestehende Register nach dem Identification Act blieb vorübergehend erhalten
  context:
    - >-
      Die drei Haupteinstufungen des ursprünglichen Gesetzes und die vier Grundkategorien der späteren Verwaltung gehören
      zu unterschiedlichen Entwicklungsstufen. Das spätere System behandelte Indian als eigene Kategorie neben Coloured;
      keine der beiden Zahlen darf unverändert auf den gesamten Zeitraum 1950–1991 übertragen werden.
    - >-
      Das Gesetz stützte sich nicht ausschließlich auf Genetik oder einen einzigen Körpertest. Es verband Aussehen und
      soziale Akzeptanz, spätere Änderungen und die Verwaltungspraxis gewichteten Abstammung stärker, und Einsprüche sowie
      Berufungen legten die Mehrdeutigkeit der Kriterien wiederholt offen.
    - >-
      Gesetz 114 hob den Population Registration Act auf und änderte die in seinen beiden Anhängen aufgeführten Gesetze.
      Es behauptete nicht, an diesem Tag jede Rassenunterscheidung aus dem südafrikanischen Recht zu entfernen; zudem ließ
      Abschnitt 1(3) das bestehende Bevölkerungsregister nach dem Identification Act vorübergehend in Kraft.
episodes:
  - id: south-africa-1950-1991
    polity: Südafrika
    periodLabel: 'Population Registration Act 1950–Aufhebung 1991'
    institutions:
      - Zensusdirektor und Beamte der Bevölkerungsregistrierung
      - Innenministerium und Zensusbüro
      - vom Minister eingesetzte Klassifikationsausschüsse, später als Race Classification Appeal Board belegt
      - Provinz- und Lokalabteilungen sowie Berufungsabteilung des Obersten Gerichts Südafrikas
    institutionalContext: >-
      Die Abschnitte 2, 4 und 5 des Gesetzes 30 von 1950 schufen ein Bevölkerungsregister, bestimmten den erfassten
      Personenkreis und wiesen den Zensusdirektor an, jeden registrierten Menschen einzustufen. Die Abschnitte 6, 7 und 13
      verknüpften die Einstufungen mit Identitätsnummern, Registereinträgen und Ausweisen. Nach Abschnitt 11 gingen
      schriftliche Einsprüche an einen vom Minister eingesetzten Ausschuss aus mindestens drei Personen. Wer dessen
      Entscheidung über die eigene Einstufung anfocht, konnte sich an eine Provinz- oder Lokalabteilung des Obersten
      Gerichts und anschließend an dessen Berufungsabteilung wenden. Später verwendeten Innenministerium und Zensusbüro
      Zensusformulare, Fotos, Untersuchungen und bestehende Familienakten; ab 1967 behandelte das System die in Staatsakten
      verzeichnete Abstammung zunehmend als ausschlaggebend.
    consequences:
      - Rasseneinstufungen wurden im Bevölkerungsregister vermerkt und mit Identitätsnummern und Ausweisdokumenten verknüpft
      - Die Bevölkerungsregistrierung lieferte Einstufungen für Wohn-, Arbeits- und Passkontrollen
      - Beamte unterzogen viele Menschen mit umstrittener Einstufung demütigenden Untersuchungen und folgenreichen Entscheidungen
      - Schriftliche Einsprüche, Ausschussanhörungen, Gerichtsberufungen und amtliche Änderungen konnten eine Einstufung revidieren
      - Angehörige derselben Familie konnten unterschiedlich klassifiziert werden, was rechtliche und soziale Trennung bewirkte
      - Zensus- und Innenministerialbürokratien pflegten, überprüften und änderten „Rasse“ als amtlichen Datensatz
    summary: >-
      Der Population Registration Act ließ eine umstrittene soziale Einteilung administrativ feststellbar erscheinen. Der
      Staat verlangte, Menschen in Rassenkategorien einzuordnen und zu dokumentieren, obwohl die Kriterien wechselten und
      Untersuchungen, Einsprüche, Berufungen, Umklassifizierungen und Familientrennungen hervorriefen. Aus den ursprünglich
      drei Haupteinstufungen wurden vier operative Grundkategorien. Die Wahrheitskommission bezeichnete die Definitionen
      später als bizarr, grob und hoffnungslos unpräzise; die biologische Anthropologie verwirft gesellschaftlich anerkannte
      „Rassen“ als diskrete biologische Gruppen.
    mechanism:
      summary: >-
        Zensus- und Innenministeriumsbeamte wiesen Rassenidentitäten zu und trugen sie in Bevölkerungsregister,
        Identitätsnummern und Ausweisdokumente ein. Vom Minister eingesetzte Ausschüsse und aufeinanderfolgende Instanzen
        des Obersten Gerichts entschieden anhand von Aussehen, Abstammung und sozialer Akzeptanz über Einsprüche und
        Berufungen. Andere Apartheidkontrollen nutzten anschließend die registrierte Einstufung, darunter die Wohn-,
        Arbeits- und Passverwaltung.
    institutionalCorrection:
      periodLabel: '28. Juni 1991, mit Übergangsregel'
      action: >-
        Gesetz 114 von 1991 hob den Population Registration Act und die aufgeführten Änderungsgesetze auf und änderte oder
        strich Bestimmungen in seinen Anhängen, um deren festgelegte Rassenunterscheidungen zu beseitigen. Abschnitt 1(3)
        ließ das bestehende Bevölkerungsregister nach dem Identification Act bis zur Aufhebung des Verfassungsgesetzes von
        1983 vorübergehend fortbestehen.
      summary: >-
        Das Parlament beseitigte den verpflichtenden Rechtsapparat, der jedem Menschen eine Einstufung nach
        Bevölkerungsgruppe und „Rasse“ zuwies. Die Übergangsregel bedeutet, dass nicht sämtliche vorhandenen Registereinträge
        augenblicklich gelöscht wurden; die Anhänge tragen zudem nicht die Behauptung, jede Rassenunterscheidung im
        südafrikanischen Recht sei am 28. Juni 1991 beendet worden.
evidence:
  - id: apartheid-act-proposition
    note: >-
      Das Primärgesetz definiert seine ursprünglichen Kategorien, schafft und befüllt das Register, verpflichtet den
      Direktor zur Einstufung jedes registrierten Menschen und vermerkt Einstufungen im Register sowie in Ausweisen. Es
      dokumentiert die staatliche Behauptung, Behörden könnten die Kategorie jedes Menschen feststellen und registrieren.
  - id: apartheid-reclassification-proposition
    note: >-
      Die Studie benennt Aussehen, Abstammung und Akzeptanz als drei gesetzliche Kriterien in 69 Fällen des Obersten
      Gerichts und zeigt, wie Beamte, der Race Classification Appeal Board und Gerichte sie praktisch anwandten.
  - id: apartheid-aaba-correction
    note: >-
      Die fachwissenschaftliche Erklärung zeigt, dass gesellschaftlich anerkannte Rassenkategorien keine diskreten,
      isolierten, festen oder homogenen biologischen Gruppen beschreiben, während Rassismus und Institutionen „Rasse“
      gesellschaftlich und biologisch folgenreich machen.
  - id: apartheid-reclassification-correction
    note: >-
      Die Analyse beurteilt alle drei Kriterien als mehrdeutig, komplex und umstritten, dokumentiert widersprüchliche
      Deutungen von Ausschuss und Gerichten und folgert, dass im System keine einheitliche konkrete Arbeitsdefinition von
      „Rasse“ bestand.
  - id: apartheid-repeal-belief-correction
    note: >-
      Das Gesetz hebt den Population Registration Act und festgelegte verbundene Bestimmungen auf. Seine Übergangsregel
      erhält das bestehende Register nach dem Identification Act vorübergehend; die Korrektur wird deshalb als Abbau des
      verpflichtenden Klassifikationsapparats und nicht als sofortige Löschung aller Einträge oder Unterscheidungen beschrieben.
  - id: apartheid-trc-impact
    note: >-
      Die Kommission bezeichnet die Bevölkerungsregistrierung als Grundpfeiler der Apartheid, nennt die operativen
      Definitionen für vier Kategorien bizarr, grob und hoffnungslos unpräzise und verknüpft die Einstufung mit Wohnort,
      Arbeit und Familientrennung.
  - id: apartheid-kronos-impact
    note: >-
      Breckenridge beschreibt das Register als bürokratischen Grundpfeiler der Apartheid, unterscheidet vier spätere
      operative Kategorien, dokumentiert Ausweise und Untersuchungen und zeichnet die Verlagerung von Akzeptanz und
      Aussehen hin zu einer bürokratisch verzeichneten Abstammung nach.
  - id: apartheid-act-carrier
    note: >-
      Das Gesetz überträgt Aufbau und Klassifikation dem Zensusdirektor, stellt die gesetzlichen Ausschüsse unter den
      Minister und weist Provinz- oder Lokalabteilungen des Obersten Gerichts sowie dessen Berufungsabteilung die
      Zuständigkeit für Berufungen zu.
  - id: apartheid-reclassification-carrier
    note: >-
      Die Studie liefert den später belegten Namen Race Classification Appeal Board und unterscheidet dieses erste
      Berufungsgremium von der anschließenden Prüfung durch das Oberste Gericht. Das ursprüngliche Gesetz von 1950 nennt
      das vom Minister eingesetzte Gremium lediglich „board“.
  - id: apartheid-act-mechanism
    note: >-
      Das Gesetz dokumentiert Einstufung und Änderung durch den Direktor, Felder in Register und Ausweisdokumenten,
      schriftliche Einsprüche, Ausschussanhörungen, Gerichtsberufungen und neue Ausweise nach einer geänderten Einstufung.
  - id: apartheid-kronos-mechanism
    note: >-
      Die Verwaltungsgeschichte dokumentiert Zensusbüro und Innenministerium, aus Zensusdaten abgeleitete Akten, Fotos,
      Ausweise, Tests zu Aussehen und Akzeptanz sowie den Übergang von 1967 zu einer aus Akten hergeleiteten Abstammung.
  - id: apartheid-act-registration-consequences
    note: >-
      Belegt die Folgen zur Einstufung in Registern und Ausweisdokumenten sowie den förmlichen Weg über Einsprüche,
      Ausschussentscheidungen, Gerichtsberufungen, amtliche Änderungen und ersetzte Dokumente.
  - id: apartheid-trc-consequences
    note: >-
      Belegt die Folge zu Wohnort und Arbeit sowie die Folge zur Familientrennung. Dieser kurze Unterabschnitt dient nicht
      als Beleg für Einzelwirkungen in jedem Rechtsgebiet der umfassenderen Apartheidordnung.
  - id: apartheid-kronos-consequences
    note: >-
      Belegt die Verknüpfung mit Group Areas und Passverwaltung, das Identitätsdatensystem, demütigende Untersuchungen,
      folgenreiche Entscheidungen von Beamten und die Zensus- und Innenministerialbürokratie, die Rassenakten verwaltete.
  - id: apartheid-reclassification-consequences
    note: >-
      Belegt die Folge zu Einsprüchen und Berufungen anhand von 69 veröffentlichten Fällen des Obersten Gerichts und
      dokumentiert die Mehrdeutigkeit, die Menschen wechselnden Ausschuss- und Gerichtsdeutungen aussetzte.
  - id: apartheid-reclassification-context
    note: >-
      Belegt die drei gesetzlichen Kriterien und ihre Mehrdeutigkeit. Die Studie unterscheidet zudem die drei Hauptgruppen
      des ursprünglichen Gesetzes von späteren Untergliederungen; Breckenridge liefert die spätere operative Viererkategorie.
  - id: apartheid-aaba-context
    note: >-
      Liefert die wissenschaftliche Abgrenzung für die Episodenzusammenfassung: Gesellschaftlich anerkannte „Rassen“ sind
      keine diskreten biologischen Gruppen, bleiben durch soziale, politische und rechtliche Konstruktion sowie Rassismus
      aber folgenreich.
  - id: apartheid-repeal-correction
    note: >-
      Die Aufhebung trat am 28. Juni 1991 in Kraft. Sie hebt Gesetz 30 von 1950 und aufgeführte Änderungsgesetze auf,
      ändert festgelegte Gesetze in ihren Anhängen und lässt das bestehende Register nach dem Identification Act
      vorübergehend fortbestehen. Der Beleg trägt nicht die Behauptung, jede gesetzliche Rassenunterscheidung sei sofort verschwunden.
