locale: de
entryId: women-low-cerebral-capacity-university
sourceReviewedAt: '2026-08-25'
title: Frauen als aufgrund geringer „zerebraler Kapazität“ ungeeignet für ein Universitätsstudium
claim: Die österreichische Hochschulpolitik schloss Frauen von der regulären Immatrikulation aus, während akademische
  Gegner eine angeblich geringere „zerebrale Kapazität“, kleinere Gehirne und die weibliche „Natur“ als wissenschaftliche
  Gründe dafür anführten, dass Frauen als Gruppe für ein ernsthaftes Universitätsstudium ungeeignet seien.
currentUnderstanding: Es gibt keine geschlechtsweite zerebrale Unfähigkeit, die Frauen an einem erfolgreichen Universitätsstudium
  hindert. Die Behauptung wurde bereits durch Frauen widerlegt, die anspruchsvolle Abschlüsse im Ausland erwarben,
  und nach dem Abbau der österreichischen Barrieren durch Studentinnen an der Universität Wien selbst. 1897 ließ
  das Ministerium Frauen als ordentliche oder außerordentliche Hörerinnen an philosophischen Fakultäten zu; 1900
  folgte die Medizin. Frauen schlossen später Studien in sämtlichen zuvor verschlossenen Fachbereichen erfolgreich
  ab.
impact:
  summary: Im Mai 1878 untersagte das Ministerium für Cultus und Unterricht Frauen ausdrücklich die Immatrikulation
    an Universitäten. Nur ausnahmsweise durften sie mit Zustimmung von Dozent, Fakultät und Ministerium als Hospitantinnen
    Vorlesungen besuchen, ohne dadurch einen Studienabschluss erwerben zu können. Die Universitätsgeschichte dokumentiert,
    dass noch in den 1880er-Jahren eine angebliche „zerebrale Unterkapazität“ als wissenschaftlich ausgewiesenes
    Argument gegen die Zulassung verwendet wurde, neben Behauptungen über kleinere Gehirne, weibliche Natur und
    Familienrollen. 1897 öffnete eine Ministerialverordnung die philosophischen Fakultäten; im ersten Semester immatrikulierten
    in Wien drei Frauen.
  highlights:
  - value: 19 Jahre
    label: vom ausdrücklichen Immatrikulationsverbot 1878 bis zur Öffnung der philosophischen Fakultäten 1897
  - value: '3'
    label: Studentinnen im ersten Wiener Semester 1897/98
  - value: 1:183
    label: anfängliches Verhältnis von Frauen zu Männern nach Beginn der regulären Zulassung
  context:
  - Das Ministerialverbot von 1878 beruhte nicht auf einer einzigen wissenschaftlichen Begründung. Biologische Behauptungen
    verbanden sich mit traditionellen Geschlechterrollen und Angst vor Konkurrenz in akademischen Berufen. Die Episode
    wird deshalb als „institutionell einflussreich“ eingestuft und nicht so dargestellt, als sei die „zerebrale
    Unterkapazität“ der alleinige Gesetzesgrund gewesen.
  - '1897 bezeichnet den ersten entscheidenden Bruch mit dem allgemeinen Ausschluss, als Frauen regulär an philosophischen
    Fakultäten studieren durften. Vollständige Gleichstellung entstand nicht sofort: Medizin folgte 1900, Rechts-
    und Staatswissenschaften 1919, evangelische Theologie 1928 und katholische Theologie 1945.'
  - Die historische Philosophische Fakultät umfasste Fächer, die heute auf Geistes- und Naturwissenschaften verteilt
    wären. „Universitätsstudium“ wird hier im historischen institutionellen Sinn verwendet.
episodes:
- id: austria-1878-1897
  polity: Österreich
  institutions:
  - k. k. Ministerium für Cultus und Unterricht
  - Universität Wien
  - Philosophische Fakultät der Universität Wien
  institutionalContext: Ein Ministerialerlass vom 6. Mai 1878 machte den zuvor weitgehend stillschweigenden Ausschluss
    ausdrücklich und untersagte Frauen die Immatrikulation. Nur unter besonderen Umständen konnten sie als Hospitantinnen
    zugelassen werden; dafür waren Zustimmungen von Dozent, Fakultät und Ministerium nötig, ein Abschluss war nicht
    möglich. In der folgenden Debatte dokumentiert die Universität Wien biologistisch argumentierende Gutachten,
    die Frauen wegen angeblicher weiblicher Natur, kleinerer Gehirne oder „zerebraler Unterkapazität“ für akademisch
    ungeeignet erklärten. Am 23. März 1897 erließ das Ministerium die Verordnung zur Zulassung von Frauen als ordentliche
    oder außerordentliche Hörerinnen an den philosophischen Fakultäten der k. k. Universitäten.
  summary: Der österreichische Hochschulausschluss zeigt, wie eine gesellschaftliche Barriere mit vermeintlicher
    Wissenschaft legitimiert werden konnte. 1878 wurde Frauen die Immatrikulation förmlich verweigert; zugleich
    präsentierten Gegner angebliche zerebrale Grenzen als Beweis dafür, dass erfolgreiche Einzelne keine allgemeine
    Studierfähigkeit zeigten. Die Zulassung von Frauen zu philosophischen Fakultäten 1897 widerlegte diese institutionelle
    Prämisse praktisch; weitere Fakultätsbarrieren fielen schrittweise.
  consequences:
  - Ausschluss von Frauen von regulärer Immatrikulation und Studienabschluss an österreichischen Universitäten
  - Hospitation nur in Ausnahmefällen mit Zustimmung von Dozent, Fakultät und Ministerium
  - Zwang für studienwillige Frauen, häufig im Ausland zu studieren und ausländische Qualifikationen später anerkennen
    zu lassen
  - Verzögerter Zugang zu akademischen Berufen, deren Berechtigung an Universitätsabschlüsse gebunden war
  - Wissenschaftliche Sprache über Gehirnkapazität und Geschlecht als institutionelle Legitimation eines zugleich
    sozial und berufspolitisch motivierten Ausschlusses
