term: Fomit
aliases: []
shortDefinition: Ein unbelebter Gegenstand, der infektiöses Material tragen und zur Übertragung beitragen kann.
longDefinition: Ein Fomit ist ein kontaminierter Gegenstand oder eine Oberfläche, die an indirekter Übertragung beteiligt ist. Wie wichtig Fomiten sind, hängt stark vom jeweiligen Erreger ab; bei urbanem Gelbfieber erwiesen sie sich nicht als Hauptübertragungsweg.
