title: Narcoanalysis as a reliable means of extracting concealed truth
claim: Drug-induced disinhibition with sodium pentothal was treated as making lying difficult and enabling investigators
  to extract concealed truthful information from suspects and witnesses.
currentUnderstanding: Sedative drugs can lower inhibition, but they do not create a physiological state in which
  a person must tell the truth. Statements under narcoanalysis can be inaccurate, suggestible, confused or confabulated.
  The technique therefore cannot function as a reliable “truth serum,” even though voluntarily obtained information
  may still generate investigative leads.
category: Forensic science and criminal investigation
reviewedAt: '2026-08-24'
impact:
  summary: India institutionalized narcoanalysis through forensic laboratories and an official procedure manual
    that explicitly said the drugged state made lying difficult. The Supreme Court later reviewed the scientific
    literature, emphasized that narcoanalysis does not reliably induce truthful statements, and in 2010 prohibited
    involuntary administration.
  highlights:
  - value: '2005'
    label: The national forensic procedure manual described narcoanalysis as making it difficult for a subject to
      lie
  - value: Operational use
    label: Police and state forensic laboratories used the technique on suspects and witnesses in criminal investigations
  - value: '2010'
    label: The Supreme Court prohibited involuntary narcoanalysis and emphasized its reliability and suggestibility
      problems
  context:
  - The 2010 constitutional holding concerned involuntary administration and bodily/mental autonomy as well as reliability.
    It did not transform every voluntary examination into an illegal act, nor does legal permissibility establish
    scientific validity.
episodes:
- id: india-2005-2010
  polity: India
  region: South Asia
  startYear: 2005
  endYear: 2010
  strength: policy-basis
  institutionTypes:
  - government
