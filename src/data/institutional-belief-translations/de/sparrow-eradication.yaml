locale: de
entryId: sparrow-eradication
sourceReviewedAt: 2026-08-22
title: Ausrottung der Spatzen
claim: Spatzen wurden als insgesamt schädliche Agrarfeinde behandelt, deren massenhafte Ausrottung die Getreideproduktion erhöhen würde.
currentUnderstanding: Spatzen fressen zwar Getreide, ernähren sich aber auch von Insekten und sind Teil von Nahrungsnetzen. Die großflächige Entfernung von Fressfeinden kann ökologische Kettenreaktionen auslösen, an denen die einfache Gleichung „Schädling gleich Nettoschaden“ scheitert.
episodes:
  - id: china-1958-1959
    polity: Volksrepublik China
    summary: Während der Vier-Schädlinge-Kampagne wurden Spatzen landesweit als Getreideschädlinge bekämpft. Die Massentötung reduzierte ihre Population stark; historische und ökologische Untersuchungen beschreiben anschließend Insektenausbrüche, ökologische Störungen und negative Ernteeffekte. Der Eintrag führt die Große Hungersnot ausdrücklich nicht allein auf die Spatzenkampagne zurück.
    consequences: [Wildtierausrottung, Agrarpolitik, Ökologische Störung]
