evidence:
  - id: yellowstone-history-proposition
    sourceId: yellowstone-fire-history
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: Main text and History timeline; last updated September 9, 2025
    note: >-
      The official park history dates suppression to the Army's arrival in 1886 and states that managers believed
      fires had to be extinguished to preserve park resources.
  - id: yellowstone-admin-policy-correction
    sourceId: nps-natural-area-policy-1970
    relation: documents
    target: {scope: belief, aspect: correction}
    locator: Resource Management Policy, pp. 17–18
    note: >-
      The revised policy recognizes the presence or absence of natural fire as an ecological factor, permits some
      naturally caused fires within predetermined units, authorizes prescribed burning and specifies when fire must
      still be controlled.
  - id: yellowstone-redbook-correction
    sourceId: federal-fire-standards-2026
    relation: documents
    target: {scope: belief, aspect: correction}
    locator: Chapter 1, pp. 1–3; Chapter 2, p. 8
    note: >-
      The May 2026 standards retain federal principles that describe fire as an essential ecological process and
      preserve prescribed burning, while adding a full-suppression presumption for unplanned wildfires under
      Interior management.
