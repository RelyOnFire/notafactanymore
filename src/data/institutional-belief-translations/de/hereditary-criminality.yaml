locale: de
entryId: hereditary-criminality
sourceReviewedAt: 2026-08-22
title: Erbliche Kriminalität
claim: Die Zugehörigkeit zu bestimmten Kasten oder „Stämmen“ wurde als Hinweis auf eine erbliche Neigung zu Kriminalität behandelt.
currentUnderstanding: Kriminelles Verhalten ist keine erbliche Eigenschaft einer Kaste, eines „Stammes“ oder einer ethnischen Gemeinschaft. Es wird von individuellen Umständen, Institutionen, Gelegenheiten, sozialen Bedingungen und vielen weiteren Faktoren geprägt; Abstammung begründet keine kollektive kriminelle Veranlagung.
episodes:
  - id: british-india-1871-1947
    polity: Britisch-Indien
    summary: Die Criminal Tribes Acts ermöglichten es den Kolonialbehörden, ganze Gemeinschaften als Gruppen einzustufen, deren Kriminalität als erblich galt. Menschen konnten aufgrund ihrer Gruppenzugehörigkeit registriert, überwacht, in ihrer Bewegungsfreiheit eingeschränkt und in Siedlungen gezwungen werden – unabhängig von einer individuellen strafrechtlichen Verurteilung.
    consequences:
      - Kollektive Registrierung und Überwachung
      - Einschränkung der Bewegungsfreiheit
      - Zwangsansiedlung und „Reform“
