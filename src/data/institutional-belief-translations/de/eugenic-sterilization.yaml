locale: de
entryId: eugenic-sterilization
sourceReviewedAt: 2026-08-22
title: Eugenische Sterilisation
claim: Behinderung, psychische Erkrankungen und soziale „Untauglichkeit“ wurden häufig als so stark erblich betrachtet, dass die Verhinderung der Fortpflanzung ausgewählter Menschen die Bevölkerung verbessern sollte.
currentUnderstanding: Menschliche Eigenschaften entstehen aus komplexen Wechselwirkungen zwischen vielen Genen, Entwicklung, Umwelt, Kultur und sozialen Bedingungen. Viele von Eugenikprogrammen erfasste Kategorien waren überhaupt keine einfachen Erbmerkmale; Zwangssterilisation verletzte zudem körperliche Selbstbestimmung und Menschenrechte.
episodes:
  - id: united-states-1907-1974
    polity: Vereinigte Staaten
    summary: Ab Indiana 1907 erließen 32 Bundesstaaten eugenische Sterilisationsgesetze. Staatliche Einrichtungen sterilisierten Zehntausende als „untauglich“ eingestufte Menschen; 1927 bestätigte der Supreme Court Virginias Gesetz im Fall Buck v. Bell.
    consequences: [Zwangssterilisation, Behindertenpolitik, Reproduktive Rechte]
  - id: germany-1933-1945
    polity: NS-Deutschland
    summary: Das Gesetz zur Verhütung erbkranken Nachwuchses von 1933 machte eugenische Bewertungen zum Bestandteil staatlichen Rechts. Erbgesundheitsgerichte genehmigten Hunderttausende Zwangssterilisationen und verankerten rassenhygienische Vorstellungen in Medizin und Verwaltung.
    consequences: [Zwangssterilisation, Rassenpolitik, Verfolgung behinderter Menschen]
  - id: sweden-1935-1975
    polity: Schweden
    summary: Schwedische Sterilisationsgesetze galten von 1935 bis 1975. Eine spätere historische Untersuchung schätzte, dass in diesem Zeitraum ungefähr 32.000 Sterilisationen unfreiwillig waren und eugenische sowie sozialpolitische Urteile darüber widerspiegelten, wer Kinder bekommen sollte.
    consequences: [Unfreiwillige Sterilisation, Behindertenpolitik, Sozialpolitik]
  - id: japan-1948-1996
    polity: Japan
    summary: Japans Eugenic Protection Act von 1948 zielte ausdrücklich darauf, als eugenisch unerwünscht eingestufte Geburten zu verhindern und erlaubte bei bestimmten Diagnosen Zwangssterilisation. Die eugenischen Bestimmungen blieben bis zur Gesetzesänderung 1996 bestehen.
    consequences: [Zwangssterilisation, Behindertenpolitik, Reproduktive Rechte]
