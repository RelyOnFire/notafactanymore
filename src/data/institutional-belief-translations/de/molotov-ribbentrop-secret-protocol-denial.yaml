schemaVersion: 2
locale: de
entryId: molotov-ribbentrop-secret-protocol-denial
sourceReviewedAt: '2026-09-24'
title: Das geheime Zusatzprotokoll zum Molotow-Ribbentrop-Pakt als nichtexistent oder gefälscht
proposition:
  summary: >-
    Nach der westlichen Veröffentlichung erbeuteter deutscher Akten 1948 hielten sowjetische Institutionen an einer
    öffentlichen Geschichtsdarstellung fest, die das authentische geheime Zusatzprotokoll zum deutsch-sowjetischen
    Nichtangriffsvertrag von 1939 ausblendete oder bestritt. Die amtliche Gegenschrift griff die westliche
    Dokumentensammlung als Fälschung an, ohne das Protokoll zu nennen; spätere sowjetische Vertreter bestritten
    weiterhin seine Existenz oder Echtheit.
correction:
  summary: >-
    Deutschland und die Sowjetunion unterzeichneten am 23. August 1939 neben ihrem öffentlichen Nichtangriffsvertrag ein
    geheimes Zusatzprotokoll. Es legte deutsche und sowjetische Interessensphären in den baltischen Staaten und Polen
    fest und hielt das sowjetische Interesse an Bessarabien fest. Am 24. Dezember 1989 bestätigte der Kongress der
    Volksdeputierten der UdSSR, dass das Protokoll
    unterzeichnet worden war und existierte, verurteilte die geheimen Absprachen und erklärte sie vom Zeitpunkt der
    Unterzeichnung an für rechtlich unhaltbar und ungültig. Das sowjetische Original wurde später aufgefunden und ist
    heute im russischen außenpolitischen Archiv katalogisiert.
impact:
  summary: >-
    Die 1948 veröffentlichte Schrift „Geschichtsfälscher“ des Sowjetischen Informationsbüros lieferte den Rahmen für
    eine amtliche Darstellung des Pakts von 1939, die fast bis zum Ende der Sowjetunion fortbestand. Der Text
    verteidigte den Pakt und die späteren sowjetischen Gebietsverschiebungen, blendete das Geheimprotokoll jedoch aus;
    die sowjetische Geschichtsschreibung behandelte Stalins Darstellung anschließend als amtliches Dogma. Die Echtheit
    des Protokolls wurde bis in die Glasnost-Zeit weiterhin öffentlich infrage gestellt: Auf einer Pressekonferenz der
    Agentur Nowosti im August 1988 räumte Walentin Falin eine gewisse Abgrenzung von Interessensphären ein, betonte
    jedoch, es seien nur Kopien von Kopien veröffentlicht worden, und hielt das Protokoll für möglicherweise gefälscht.
    Eine vom Kongress eingesetzte Kommission nahm 1989 eine Neubewertung vor, die in der förmlichen Anerkennung des
    Protokolls und der Verurteilung seiner Unterzeichnung mündete.
  highlights:
    - value: 41 Jahre
      label: von der staatlichen Gegenschrift 1948 bis zur förmlichen sowjetischen Anerkennung 1989
    - value: 23. August 1939
      label: Datum des Vertrags und des geheimen Zusatzprotokolls
    - value: 24. Dezember 1989
      label: förmliche Anerkennung und Verurteilung der geheimen Absprachen durch den Kongress der UdSSR
  context:
    - >-
      „Geschichtsfälscher“ bezeichnete die US-Dokumentenveröffentlichung als Fälschungskampagne, nannte und erörterte
      das geheime Zusatzprotokoll vom 23. August 1939 aber nicht direkt. Die Schrift belegt die staatliche
      Gegenerzählung und Ausblendung, jedoch keine wörtliche sowjetische Leugnung des Protokolls.
    - >-
      Die Nowosti-Pressekonferenz vom 16. August 1988 war eine begrenzte Öffnung, aber keine Bestätigung der Echtheit.
      Eine auf zeitgenössischen Presse- und Agenturmeldungen beruhende Untersuchung zeigt, dass Falin eine gewisse
      Abgrenzung von Interessensphären einräumte, das Protokoll jedoch für möglicherweise gefälscht hielt und betonte,
      niemand habe ein Original gesehen. Eine von Beteiligten verfasste Kommissionsgeschichte bezeichnet diese Position
      als Leugnung und berichtet von seinem späteren Wandel während der Kommissionsarbeit 1989.
    - >-
      Im Dezember 1989 waren die sowjetischen Originale noch nicht gefunden. Der Kongress stützte sich auf Kopien,
      Karten, weitere Dokumente, Sachverständigenprüfungen und die Übereinstimmung mit späteren Ereignissen. Das
      sowjetische Original wurde später aufgefunden und ist heute mit einer Archivsignatur verzeichnet.
    - >-
      Der Beschluss von 1989 unterschied den öffentlichen Nichtangriffsvertrag von den geheimen Absprachen: Er wertete
      den öffentlichen Vertrag selbst nicht als Abweichung von der üblichen internationalen Praxis, verurteilte die
      Geheimprotokolle aber als Verstoß gegen Souveränität und Unabhängigkeit dritter Staaten.
episodes:
  - id: soviet-union-1948-1989
    polity: Sowjetunion
    periodLabel: Februar 1948 – 24. Dezember 1989
    institutions:
      - Sowjetisches Informationsbüro
      - Kommunistische Partei der Sowjetunion
      - Presseagentur Nowosti (APN)
    institutionalContext: >-
      Im Januar 1948 veröffentlichte das US-Außenministerium „Nazi-Soviet Relations“ und darin eine Übersetzung des
      Geheimprotokolls aus erbeuteten deutschen Akten. Stalin überwachte die Antwort des Sowjetischen Informationsbüros,
      „Geschichtsfälscher“, die über eine Pressekonferenz, Fortsetzungen in der „Prawda“ und eine umfangreiche
      Veröffentlichungskampagne verbreitet wurde. Ihre Thesen bildeten die Grundlage der amtlichen sowjetischen
      Geschichtsschreibung über den Pakt, während das Protokoll selbst aus der autorisierten Darstellung ausgeschlossen
      blieb. Institutionelle Vertreter zogen das Protokoll bis 1989 weiterhin in Zweifel, bevor der Kongress der
      Volksdeputierten eine Kommission einsetzte und die Linie im Dezember desselben Jahres förmlich umkehrte.
    consequences:
      - Ein authentisches Geheimabkommen wurde aus der autorisierten sowjetischen Darstellung der Diplomatie von 1939 ausgeschlossen
      - Westliche Dokumentenbelege wurden öffentlich als Teil einer Fälschungskampagne dargestellt
      - Die amtliche Geschichtsschreibung lieferte andere Erklärungen für sowjetische Maßnahmen gegenüber Polen, den baltischen Staaten, Finnland und Bessarabien
      - Das sowjetische Archivexemplar blieb unzugänglich, während Historiker und Öffentlichkeit über Kopien aus ausländischen Archiven stritten
      - Der Streit wurde Teil der spät-sowjetischen politischen Mobilisierung in den baltischen Republiken
      - Kommission und Kongress mussten die Echtheit 1989 feststellen, bevor das sowjetische Original aufgefunden war
    summary: >-
      Die sowjetische Reaktion von 1948 auf die westliche Aktenveröffentlichung schuf einen dauerhaften amtlichen Rahmen,
      der den Pakt verteidigte und sein Geheimprotokoll ausblendete. Spätere öffentliche Leugnungen behandelten das
      Protokoll als nichtexistent oder unecht, obwohl im Ausland Kopien und bestätigende Unterlagen vorlagen. Im Dezember
      1989 bestätigte der sowjetische Kongress seine Existenz, verurteilte die geheimen Absprachen und erklärte sie von
      Anfang an für ungültig.
    mechanism:
      summary: >-
        Der Staat beantwortete die Aktenveröffentlichung mit einer zentral gelenkten Broschüre, einer Fortsetzungsserie
        in der Presse und internationaler Verbreitung. Ihre Deutung wurde zur amtlichen Geschichtsschreibung und durch
        fortgesetzte öffentliche Leugnung sowie die Unzugänglichkeit des sowjetischen Archivexemplars gestützt.
    institutionalCorrection:
      periodLabel: 24. Dezember 1989
      action: Der Kongress der Volksdeputierten der UdSSR bestätigte Unterzeichnung und Existenz des Geheimprotokolls, verurteilte seine Unterzeichnung und erklärte die geheimen Absprachen von Anfang an für ungültig.
      summary: >-
        Der Beschluss Nr. 979-I ersetzte die überlieferte öffentliche Linie förmlich, nachdem eine Kongresskommission
        Kopien, Karten, weitere Unterlagen und Sachverständigenprüfungen ausgewertet hatte.
evidence:
  - id: protocol-grigoryan-proposition
    note: >-
      Die auf zeitgenössischer sowjetischer Presse, Associated Press, TASS und Archivunterlagen von Radio Liberty
      beruhende Untersuchung beschreibt die langjährige Leugnung und die eingeschränkte, aber fortdauernde
      Infragestellung auf der Pressekonferenz vom August 1988.
  - id: protocol-lindpere-proposition
    note: >-
      Die von Kommissionsbeteiligten verfasste und vom estnischen Foreign Policy Institute veröffentlichte Darstellung
      beschreibt die amtliche sowjetische Leugnung, kennzeichnet späte öffentliche Aussagen als Leugnungen und schildert
      den Positionswechsel während der Kongresskommission. Ihre Beteiligtenperspektive wird zusammen mit zeitgenössischer
      Berichterstattung und sowjetischen Primärquellen verwendet.
  - id: protocol-resolution-correction
    note: >-
      Der amtliche Beschluss bestätigt Unterzeichnung und Existenz des Protokolls, erläutert die Beweislage ohne
      Originale, verurteilt die geheimen Absprachen und erklärt sie vom Zeitpunkt der Unterzeichnung an für ungültig.
  - id: protocol-us-document-correction
    note: >-
      Die Dokumentensammlung des US-Außenministeriums von 1948 druckt den erbeuteten deutschen Text mit den Klauseln zu
      Baltikum, Polen und Bessarabien, dem Geheimhaltungsgebot, dem Datum und den Unterschriften Ribbentrops und Molotows.
  - id: protocol-ipn-impact
    note: >-
      Die Archivstudie zeichnet Stalins persönliche Redaktion, die koordinierte Presse- und Verbreitungskampagne sowie
      die Funktion der Schrift als Grundlage der amtlichen sowjetischen Geschichtsschreibung bis zum Ende der UdSSR nach.
  - id: protocol-falsifiers-carrier
    note: >-
      Der Katalog der Staatsbibliothek weist die Veröffentlichung des Sowjetischen Informationsbüros nach. Die Schrift
      gibt sich als amtliche Antwort auf die US-Dokumentensammlung aus und verteidigt den deutsch-sowjetischen Pakt,
      ohne das Protokoll von 1939 zu nennen.
  - id: protocol-ipn-mechanism
    note: >-
      Dokumentiert werden die Pressekonferenz, die Fortsetzungsveröffentlichung in der „Prawda“, die umfangreiche
      mehrsprachige Kampagne und die Übernahme der Thesen als amtliche Geschichtsschreibung und kommunistisches Dogma.
  - id: protocol-lindpere-consequences
    note: >-
      Die Darstellung verbindet die langjährige amtliche Leugnung mit autorisierten Erklärungen sowjetischer Politik,
      der politischen Mobilisierung im Baltikum und der umstrittenen Arbeit der Kommission von 1989; der Band weist die
      Perspektive estnischer Beteiligter offen aus.
  - id: protocol-resolution-institutional-correction
    note: >-
      Primärer Rechtstext der Anerkennung und Verurteilung durch den Kongress sowie der Erklärung, dass die geheimen
      Protokolle von Anfang an ungültig waren.
  - id: protocol-falin-context
    note: >-
      Veröffentlicht Dokumente aus Falins persönlichem Nachlass und ordnet seine Rolle in die breitere spät-sowjetische
      Debatte über das Baltikum ein. Die Quelle dient nicht allein als Beleg für den Wortlaut seiner Position auf der
      Pressekonferenz vom 16. August 1988.
  - id: protocol-grigoryan-context
    note: >-
      Rekonstruiert die Pressekonferenz aus zeitgenössischen Meldungen: Falin räumte eine gewisse Abgrenzung von
      Interessensphären ein, betonte jedoch, nur Kopien von Kopien seien öffentlich, und hielt das Geheimprotokoll für
      möglicherweise gefälscht.
  - id: protocol-us-document-context
    note: >-
      Zeigt genau, was die westliche Sammlung im Januar 1948 öffentlich machte: auf den Vertrag folgte das geheime Zusatzprotokoll.
  - id: protocol-presidential-library-context
    note: >-
      Katalogisiert das Original vom 23. August 1939 im Archiv für Außenpolitik der Russischen Föderation unter AVP RF,
      Fonds 3a, Findbuch 1, Mappe 18, Akte 243, Blätter 3–6 und 10–11.
  - id: protocol-statearchive-context
    note: >-
      Die russische staatliche Archivausstellung bezeichnet den Originalvertrag und das originale geheime
      Zusatzprotokoll als zentrale Ausstellungsstücke.
