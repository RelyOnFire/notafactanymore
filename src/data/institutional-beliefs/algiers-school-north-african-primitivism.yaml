  - title: 'La théorie évolutionniste de l''École d''Alger : une idéologie scientifique exemplaire'
    url: https://stm.cairn.info/revue-l-information-psychiatrique-2015-2-page-163
    publisher: L'Information psychiatrique
    note: Peer-reviewed history of psychiatry characterising the School's evolutionism as a pseudoscientific racial
      ideology that gave scientific cover to colonial hierarchy and discussing Fanon's critique.
  - title: Alcohol, psychiatry and society — Colonial Algeria chapter
    url: https://uplopen.com/books/694/files/d080ebe3-c877-4458-8945-d6e716d411af.pdf
    publisher: Manchester University Press
    note: Modern scholarly history placing the 1918 text within the later institutional formation of the School
      of Algiers and the psychiatric institutions built in North Africa in the 1930s.
