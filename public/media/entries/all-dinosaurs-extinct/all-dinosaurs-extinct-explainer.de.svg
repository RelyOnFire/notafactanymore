<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1490" viewBox="0 0 760 1490" role="img" aria-labelledby="title desc">
<title id="title">Nicht alle Dinosaurier starben aus</title><desc id="desc">Vertical explanatory diagram contrasting an older classification that separates birds from dinosaurs with a modern evolutionary tree that nests birds within theropod dinosaurs.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}</style>
<rect width="760" height="1490" fill="#f5f0e6"/>
<rect x="30" y="30" width="700" height="390" rx="20" fill="#fbf8f1" stroke="#d6cec0" stroke-width="2"/><rect x="30" y="445" width="700" height="670" rx="20" fill="#fbf8f1" stroke="#d6cec0" stroke-width="2"/><rect x="30" y="1140" width="700" height="320" rx="20" fill="#fbf8f1" stroke="#d6cec0" stroke-width="2"/><text x="58" y="78" font-size="18" font-weight="700" fill="#4f776e" text-anchor="start" letter-spacing="2">ÄLTERE EINORDNUNG</text><text x="58" y="124" font-size="38" font-weight="700" fill="#2f302d" text-anchor="start">Nicht alle Dinosaurier starben aus</text><rect x="70" y="205" width="280" height="125" rx="16" fill="#eee7da" stroke="#b9ae9d" stroke-width="2"/><rect x="410" y="205" width="280" height="125" rx="16" fill="#e4ece8" stroke="#8aa49b" stroke-width="2"/><text x="210" y="255" font-size="23" font-weight="800" fill="#665b4f" text-anchor="middle">DINOSAURIER</text><text x="210" y="295" font-size="24" font-weight="600" fill="#8d625b" text-anchor="middle">ausgestorben</text><text x="550" y="255" font-size="23" font-weight="800" fill="#4f776e" text-anchor="middle">VÖGEL</text><text x="550" y="295" font-size="21" font-weight="600" fill="#4f776e" text-anchor="middle">eigene lebende Gruppe</text><text x="58" y="375" font-size="21" font-weight="500" fill="#6d6b64" text-anchor="start"><tspan x="58" dy="0">Dinosaurier · ausgestorben · Vögel · eigene lebende Gruppe</tspan></text><text x="58" y="493" font-size="18" font-weight="700" fill="#4f776e" text-anchor="start" letter-spacing="2">EVOLUTIONÄRE EINORDNUNG</text><text x="58" y="539" font-size="36" font-weight="700" fill="#2f302d" text-anchor="start">Evolutionäre Einordnung</text><line x1="135" y1="1010" x2="135" y2="650" stroke="#665f55" stroke-width="5" stroke-linecap="round"/><line x1="135" y1="930" x2="330" y2="850" stroke="#665f55" stroke-width="4" stroke-linecap="round"/><text x="342" y="857" font-size="20" font-weight="600" fill="#2f302d" text-anchor="start">Andere Dinosaurier</text><line x1="135" y1="850" x2="400" y2="770" stroke="#665f55" stroke-width="4" stroke-linecap="round"/><text x="412" y="777" font-size="20" font-weight="600" fill="#2f302d" text-anchor="start">Andere Theropoden</text><line x1="135" y1="770" x2="480" y2="690" stroke="#665f55" stroke-width="4" stroke-linecap="round"/><text x="492" y="697" font-size="20" font-weight="600" fill="#2f302d" text-anchor="start">Maniraptore Theropoden</text><line x1="135" y1="690" x2="625" y2="610" stroke="#665f55" stroke-width="4" stroke-linecap="round"/><text x="637" y="617" font-size="20" font-weight="600" fill="#2f302d" text-anchor="start">Vogellinie</text><line x1="135" y1="690" x2="625" y2="610" stroke="#4f776e" stroke-width="7" stroke-linecap="round"/><circle cx="625" cy="610" r="11" fill="#4f776e"/><text x="625" y="580" font-size="24" font-weight="800" fill="#4f776e" text-anchor="middle">Vögel</text><path d="M95 835 L80 835 L80 595 L95 595" fill="none" stroke="#4f776e" stroke-width="3"/><text x="82" y="635" font-size="18" font-weight="700" fill="#4f776e" text-anchor="start">THEROPODEN</text><line x1="70" y1="1005" x2="690" y2="1005" stroke="#a96f5e" stroke-width="3" stroke-dasharray="10 8"/><text x="675" y="990" font-size="18" font-weight="700" fill="#a96f5e" text-anchor="end">vor 66 Millionen Jahren</text><line x1="323" y1="843" x2="337" y2="857" stroke="#a96f5e" stroke-width="3"/><line x1="337" y1="843" x2="323" y2="857" stroke="#a96f5e" stroke-width="3"/><line x1="393" y1="763" x2="407" y2="777" stroke="#a96f5e" stroke-width="3"/><line x1="407" y1="763" x2="393" y2="777" stroke="#a96f5e" stroke-width="3"/><line x1="473" y1="683" x2="487" y2="697" stroke="#a96f5e" stroke-width="3"/><line x1="487" y1="683" x2="473" y2="697" stroke="#a96f5e" stroke-width="3"/><text x="500" y="1080" font-size="20" font-weight="700" fill="#4f776e" text-anchor="middle">Die Vogellinie besteht fort</text><text x="58" y="1190" font-size="18" font-weight="700" fill="#4f776e" text-anchor="start" letter-spacing="2">WAS SICH ÄNDERTE</text><text x="58" y="1236" font-size="32" font-weight="700" fill="#2f302d" text-anchor="start">Vögel gehören innerhalb der Dinosauria</text><rect x="54" y="1295" width="652" height="118" rx="13" fill="#ece7db"/><text x="72" y="1332" font-size="20" font-weight="500" fill="#6d6b64" text-anchor="start"><tspan x="72" dy="0">Vögel sind lebende Dinosaurier; die Nicht-Vogel-Dinosaurier</tspan><tspan x="72" dy="28">starben aus.</tspan></text></svg>