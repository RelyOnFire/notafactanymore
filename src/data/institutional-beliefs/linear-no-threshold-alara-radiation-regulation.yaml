title: Linear no-threshold radiation risk and ALARA regulation
claim: U.S. nuclear regulation treated stochastic radiation risk as extending linearly with dose without a safe threshold and required licensed exposures below legal dose limits to be reduced as low as reasonably achievable (ALARA).
currentUnderstanding: High doses of ionizing radiation are established causes of cancer, but the exact cancer dose-response at very low doses cannot be measured precisely with current epidemiology. The linear no-threshold model remains a plausible and widely used protection model, and no consensus-supported, regulation-ready universal threshold or hormesis model has replaced it. The NRC now distinguishes that precautionary model from directly demonstrated low-dose harm; in 2026 it proposed retiring ALARA terminology and strict no-threshold implementation while retaining a linear dose-response model, dose limits, and graded dose-management requirements. The proposal was not yet final as of this review.
category: Radiation protection and nuclear regulation
reviewedAt: 2026-08-26
