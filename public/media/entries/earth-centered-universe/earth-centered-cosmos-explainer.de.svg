<svg xmlns="http://www.w3.org/2000/svg" width="760" height="2490" viewBox="0 0 760 2490" role="img" aria-labelledby="title desc">
<title id="title">Vom erdzentrierten Kosmos zur bewegten Erde</title><desc id="desc">Dreiteilige Erklärungsgrafik zum geozentrischen Modell, zu Beobachtungen und Geometrie, die das Kräfteverhältnis verschoben, und zum späteren heliozentrischen Planetensystem.</desc>
<style>text{font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;} .kicker{font-variant:small-caps;}</style>
<rect width="760" height="2490" fill="#f5f0e6"/>
<rect x="30" y="30" width="700" height="760" rx="20" fill="#fbf8f1" stroke="#d6cec0" stroke-width="2"/>
<rect x="30" y="820" width="700" height="800" rx="20" fill="#fbf8f1" stroke="#d6cec0" stroke-width="2"/>
<rect x="30" y="1650" width="700" height="810" rx="20" fill="#fbf8f1" stroke="#d6cec0" stroke-width="2"/>
<text x="58" y="72" font-size="18" font-weight="700" fill="#4f776e" text-anchor="start" letter-spacing="2.2">ÄLTERES MODELL</text><text x="58" y="116" font-size="40" font-weight="700" fill="#2f302d" text-anchor="start">Die Erde im Zentrum</text><circle cx="270" cy="330" r="54" fill="none" stroke="#9d9487" stroke-width="2"/><circle cx="270" cy="330" r="74" fill="none" stroke="#9d9487" stroke-width="2"/><circle cx="270" cy="330" r="94" fill="none" stroke="#9d9487" stroke-width="2"/><circle cx="270" cy="330" r="114" fill="none" stroke="#9d9487" stroke-width="2"/><circle cx="270" cy="330" r="134" fill="none" stroke="#9d9487" stroke-width="2"/><circle cx="270" cy="330" r="154" fill="none" stroke="#9d9487" stroke-width="2"/><circle cx="270" cy="330" r="174" fill="none" stroke="#9d9487" stroke-width="2"/><circle cx="270" cy="330" r="194" fill="none" stroke="#9d9487" stroke-width="2"/><circle cx="464.0" cy="330.0" r="3" fill="#716859" stroke="#716859" stroke-width="0"/><circle cx="447.2" cy="408.9" r="3" fill="#716859" stroke="#716859" stroke-width="0"/><circle cx="399.8" cy="474.2" r="3" fill="#716859" stroke="#716859" stroke-width="0"/><circle cx="329.9" cy="514.5" r="3" fill="#716859" stroke="#716859" stroke-width="0"/><circle cx="249.7" cy="522.9" r="3" fill="#716859" stroke="#716859" stroke-width="0"/><circle cx="173.0" cy="498.0" r="3" fill="#716859" stroke="#716859" stroke-width="0"/><circle cx="113.1" cy="444.0" r="3" fill="#716859" stroke="#716859" stroke-width="0"/><circle cx="80.2" cy="370.3" r="3" fill="#716859" stroke="#716859" stroke-width="0"/><circle cx="80.2" cy="289.7" r="3" fill="#716859" stroke="#716859" stroke-width="0"/><circle cx="113.1" cy="216.0" r="3" fill="#716859" stroke="#716859" stroke-width="0"/><circle cx="173.0" cy="162.0" r="3" fill="#716859" stroke="#716859" stroke-width="0"/><circle cx="249.7" cy="137.1" r="3" fill="#716859" stroke="#716859" stroke-width="0"/><circle cx="329.9" cy="145.5" r="3" fill="#716859" stroke="#716859" stroke-width="0"/><circle cx="399.8" cy="185.8" r="3" fill="#716859" stroke="#716859" stroke-width="0"/><circle cx="447.2" cy="251.1" r="3" fill="#716859" stroke="#716859" stroke-width="0"/><circle cx="270" cy="330" r="31" fill="#557786" stroke="#557786" stroke-width="2"/><path d="M 255 323 C 262 313, 272 313, 277 322 C 284 326, 283 337, 275 338 C 268 339, 266 348, 258 344" fill="none" stroke="#d9e3df" stroke-width="3" stroke-linecap="round"/><text x="270" y="336" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Erde</text><circle cx="297.0" cy="283.2" r="8" fill="#b7b2aa" stroke="#b7b2aa" stroke-width="1"/><circle cx="337.1" cy="298.7" r="8" fill="#a7a397" stroke="#a7a397" stroke-width="1"/><circle cx="359.4" cy="359.0" r="8" fill="#c9bcaa" stroke="#c9bcaa" stroke-width="1"/><circle cx="335.4" cy="423.4" r="21" fill="none" stroke="#ead18a" stroke-width="2" opacity="0.55"/><circle cx="335.4" cy="423.4" r="16" fill="#c7a24d" stroke="#c7a24d" stroke-width="1"/><line x1="359.4" y1="423.4" x2="366.4" y2="423.4" stroke="#c7a24d" stroke-width="2"/><line x1="352.4" y1="440.4" x2="357.4" y2="445.4" stroke="#c7a24d" stroke-width="2"/><line x1="335.4" y1="447.4" x2="335.4" y2="454.4" stroke="#c7a24d" stroke-width="2"/><line x1="318.4" y1="440.4" x2="313.4" y2="445.4" stroke="#c7a24d" stroke-width="2"/><line x1="311.4" y1="423.4" x2="304.4" y2="423.4" stroke="#c7a24d" stroke-width="2"/><line x1="318.4" y1="406.4" x2="313.4" y2="401.4" stroke="#c7a24d" stroke-width="2"/><line x1="335.4" y1="399.4" x2="335.4" y2="392.4" stroke="#c7a24d" stroke-width="2"/><line x1="352.4" y1="406.4" x2="357.4" y2="401.4" stroke="#c7a24d" stroke-width="2"/><circle cx="235.3" cy="459.4" r="8" fill="#9f7a71" stroke="#9f7a71" stroke-width="1"/><circle cx="143.9" cy="418.3" r="8" fill="#a38f75" stroke="#a38f75" stroke-width="1"/><circle cx="98.6" cy="299.8" r="8" fill="#888274" stroke="#888274" stroke-width="1"/><line x1="500" y1="200" x2="526" y2="200" stroke="#9d9487" stroke-width="3"/><text x="540" y="206" font-size="22" font-weight="500" fill="#2f302d" text-anchor="start">Mond</text><line x1="500" y1="237" x2="526" y2="237" stroke="#9d9487" stroke-width="3"/><text x="540" y="243" font-size="22" font-weight="500" fill="#2f302d" text-anchor="start">Merkur</text><line x1="500" y1="274" x2="526" y2="274" stroke="#9d9487" stroke-width="3"/><text x="540" y="280" font-size="22" font-weight="500" fill="#2f302d" text-anchor="start">Venus</text><line x1="500" y1="311" x2="526" y2="311" stroke="#c7a24d" stroke-width="3"/><circle cx="513" cy="311" r="10" fill="#c7a24d" stroke="#c7a24d" stroke-width="0"/><line x1="526" y1="311" x2="531" y2="311" stroke="#c7a24d" stroke-width="1.8"/><line x1="513" y1="298" x2="513" y2="293" stroke="#c7a24d" stroke-width="1.8"/><line x1="500" y1="311" x2="495" y2="311" stroke="#c7a24d" stroke-width="1.8"/><line x1="513" y1="324" x2="513" y2="329" stroke="#c7a24d" stroke-width="1.8"/><text x="540" y="317" font-size="22" font-weight="700" fill="#2f302d" text-anchor="start">Sonne</text><line x1="500" y1="348" x2="526" y2="348" stroke="#9d9487" stroke-width="3"/><text x="540" y="354" font-size="22" font-weight="500" fill="#2f302d" text-anchor="start">Mars</text><line x1="500" y1="385" x2="526" y2="385" stroke="#9d9487" stroke-width="3"/><text x="540" y="391" font-size="22" font-weight="500" fill="#2f302d" text-anchor="start">Jupiter</text><line x1="500" y1="422" x2="526" y2="422" stroke="#9d9487" stroke-width="3"/><text x="540" y="428" font-size="22" font-weight="500" fill="#2f302d" text-anchor="start">Saturn</text><line x1="500" y1="459" x2="526" y2="459" stroke="#716859" stroke-width="3"/><text x="540" y="465" font-size="22" font-weight="500" fill="#2f302d" text-anchor="start">Fixsterne</text><text x="555" y="500" font-size="17" font-weight="400" fill="#6d6b64" text-anchor="middle"><tspan x="555" dy="0">Vereinfacht</tspan><tspan x="555" dy="23">nicht maßstabsgetreu</tspan></text><text x="58" y="560" font-size="25" font-weight="700" fill="#4f776e" text-anchor="start">Warum das plausibel war</text><circle cx="68" cy="590" r="5" fill="#4f776e" stroke="#4f776e" stroke-width="0"/><text x="88" y="598" font-size="24" font-weight="400" fill="#2f302d" text-anchor="start"><tspan x="88" dy="0">Der Himmel scheint sich um eine</tspan><tspan x="88" dy="31">ruhende Erde zu drehen.</tspan></text><circle cx="68" cy="660" r="5" fill="#4f776e" stroke="#4f776e" stroke-width="0"/><text x="88" y="668" font-size="24" font-weight="400" fill="#2f302d" text-anchor="start"><tspan x="88" dy="0">Im Alltag gibt es keinen unmittelbaren Eindruck</tspan><tspan x="88" dy="31">davon, dass sich die Erde bewegt.</tspan></text><circle cx="68" cy="730" r="5" fill="#4f776e" stroke="#4f776e" stroke-width="0"/><text x="88" y="738" font-size="24" font-weight="400" fill="#2f302d" text-anchor="start"><tspan x="88" dy="0">Die erwartete Sternparallaxe durch die Bewegung</tspan><tspan x="88" dy="31">der Erde war damals nicht messbar.</tspan></text><text x="58" y="865" font-size="18" font-weight="700" fill="#4f776e" text-anchor="start" letter-spacing="2.0">WAS DAS BILD VERÄNDERTE</text><text x="58" y="910" font-size="38" font-weight="700" fill="#2f302d" text-anchor="start">Neue Befunde, bessere Geometrie</text><text x="58" y="950" font-size="23" font-weight="400" fill="#6d6b64" text-anchor="start"><tspan x="58" dy="0">Neue Beobachtungen stellten zentrale Annahmen infrage,</tspan><tspan x="58" dy="31">während die heliozentrische Geometrie manche</tspan><tspan x="58" dy="31">Planetenbewegungen natürlicher erklärte.</tspan></text><rect x="54" y="1050" width="652" height="165" rx="15" fill="#fdfbf6" stroke="#d6cec0" stroke-width="2"/><rect x="54" y="1050" width="8" height="165" rx="4" fill="#4f776e"/><circle cx="78" cy="1132" r="15" fill="#2f302d" stroke="#2f302d" stroke-width="1"/><circle cx="112" cy="1132" r="15" fill="#2f302d" stroke="#2f302d" stroke-width="1"/><circle cx="146" cy="1132" r="15" fill="#2f302d" stroke="#2f302d" stroke-width="1"/><circle cx="180" cy="1132" r="15" fill="#2f302d" stroke="#2f302d" stroke-width="1"/><circle cx="85" cy="1132" r="15" fill="#fdfbf6" stroke="#fdfbf6" stroke-width="0"/><path d="M 112 1117 A 15 15 0 0 1 112 1147 L 112 1117 Z" fill="#fdfbf6"/><path d="M 146 1117 A 15 15 0 0 1 146 1147 A 8 15 0 0 0 146 1117 Z" fill="#fdfbf6"/><circle cx="180" cy="1132" r="15" fill="#fdfbf6" stroke="#2f302d" stroke-width="2"/><text x="235" y="1093" font-size="26" font-weight="700" fill="#2f302d" text-anchor="start">Phasen der Venus</text><text x="235" y="1122" font-size="21" font-weight="400" fill="#6d6b64" text-anchor="start"><tspan x="235" dy="0">Die Venus zeigt alle Phasen. Das widersprach</tspan><tspan x="235" dy="24">ihrer traditionellen ptolemäischen Bahn,</tspan><tspan x="235" dy="24">blieb aber mit mehreren neueren Modellen</tspan><tspan x="235" dy="24">vereinbar.</tspan></text><rect x="54" y="1235" width="652" height="165" rx="15" fill="#fdfbf6" stroke="#d6cec0" stroke-width="2"/><rect x="54" y="1235" width="8" height="165" rx="4" fill="#4f776e"/><circle cx="132" cy="1317" r="26" fill="#b99873" stroke="#826f59" stroke-width="2"/><line x1="111" y1="1309" x2="153" y2="1309" stroke="#826f59" stroke-width="2"/><line x1="109" y1="1324" x2="155" y2="1324" stroke="#826f59" stroke-width="2"/><circle cx="73" cy="1317" r="5" fill="#2f302d" stroke="#2f302d" stroke-width="0"/><circle cx="96" cy="1317" r="4" fill="#2f302d" stroke="#2f302d" stroke-width="0"/><circle cx="177" cy="1317" r="4" fill="#2f302d" stroke="#2f302d" stroke-width="0"/><circle cx="202" cy="1317" r="5" fill="#2f302d" stroke="#2f302d" stroke-width="0"/><text x="235" y="1278" font-size="26" font-weight="700" fill="#2f302d" text-anchor="start">Jupiters Monde</text><text x="235" y="1307" font-size="21" font-weight="400" fill="#6d6b64" text-anchor="start"><tspan x="235" dy="0">Die Monde des Jupiter zeigten, dass sich</tspan><tspan x="235" dy="24">nicht alle Himmelskörper um die Erde</tspan><tspan x="235" dy="24">bewegen.</tspan></text><rect x="54" y="1420" width="652" height="165" rx="15" fill="#fdfbf6" stroke="#d6cec0" stroke-width="2"/><rect x="54" y="1420" width="8" height="165" rx="4" fill="#4f776e"/><path d="M 68 1514 C 100 1478, 132 1478, 146 1501 C 160 1524, 128 1540, 116 1518 C 105 1497, 145 1482, 202 1490" fill="none" stroke="#4f776e" stroke-width="5" stroke-linecap="round"/><path d="M 193 1482 L 207 1490 L 194 1498" fill="none" stroke="#4f776e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="235" y="1463" font-size="26" font-weight="700" fill="#2f302d" text-anchor="start">Rückläufige Bewegung</text><text x="235" y="1492" font-size="21" font-weight="400" fill="#6d6b64" text-anchor="start"><tspan x="235" dy="0">Im heliozentrischen Modell ergeben sich</tspan><tspan x="235" dy="24">die scheinbaren Rückwärtsschleifen</tspan><tspan x="235" dy="24">natürlich aus den unterschiedlichen</tspan><tspan x="235" dy="24">Umlaufgeschwindigkeiten.</tspan></text><text x="58" y="1695" font-size="18" font-weight="700" fill="#4f776e" text-anchor="start" letter-spacing="2.0">WAS ES ERSETZTE</text><text x="58" y="1740" font-size="40" font-weight="700" fill="#2f302d" text-anchor="start">Die Erde als Planet</text><circle cx="380" cy="1970" r="62" fill="none" stroke="#9d9487" stroke-width="2"/><circle cx="380" cy="1970" r="96" fill="none" stroke="#9d9487" stroke-width="2"/><circle cx="380" cy="1970" r="132" fill="none" stroke="#9d9487" stroke-width="2"/><circle cx="380" cy="1970" r="170" fill="none" stroke="#9d9487" stroke-width="2"/><circle cx="380" cy="1970" r="205" fill="none" stroke="#9d9487" stroke-width="2"/><circle cx="380" cy="1970" r="27" fill="#c7a24d" stroke="#c7a24d" stroke-width="2"/><line x1="413.0" y1="1970.0" x2="422.0" y2="1970.0" stroke="#c7a24d" stroke-width="2"/><line x1="403.3" y1="1993.3" x2="409.7" y2="1999.7" stroke="#c7a24d" stroke-width="2"/><line x1="380.0" y1="2003.0" x2="380.0" y2="2012.0" stroke="#c7a24d" stroke-width="2"/><line x1="356.7" y1="1993.3" x2="350.3" y2="1999.7" stroke="#c7a24d" stroke-width="2"/><line x1="347.0" y1="1970.0" x2="338.0" y2="1970.0" stroke="#c7a24d" stroke-width="2"/><line x1="356.7" y1="1946.7" x2="350.3" y2="1940.3" stroke="#c7a24d" stroke-width="2"/><line x1="380.0" y1="1937.0" x2="380.0" y2="1928.0" stroke="#c7a24d" stroke-width="2"/><line x1="403.3" y1="1946.7" x2="409.7" y2="1940.3" stroke="#c7a24d" stroke-width="2"/><text x="380" y="2025" font-size="21" font-weight="700" fill="#c7a24d" text-anchor="middle">Sonne</text><circle cx="430.8" cy="1934.4" r="7" fill="#9a9387" stroke="#9a9387" stroke-width="1"/><circle cx="435.1" cy="2048.6" r="9" fill="#c0a47e" stroke="#c0a47e" stroke-width="1"/><circle cx="271.9" cy="2045.7" r="13" fill="#557786" stroke="#557786" stroke-width="1"/><circle cx="240.7" cy="1872.5" r="9" fill="#a96f5e" stroke="#a96f5e" stroke-width="1"/><circle cx="482.5" cy="1792.5" r="12" fill="#b99873" stroke="#b99873" stroke-width="1"/><circle cx="293.9" cy="2041.7" r="4" fill="#b9b4aa" stroke="#b9b4aa" stroke-width="0"/><text x="267.9" y="2083.7" font-size="20" font-weight="700" fill="#557786" text-anchor="middle">Erde</text><text x="323.9" y="2035.7" font-size="17" font-weight="500" fill="#6d6b64" text-anchor="middle">Mond</text><text x="380" y="2197" font-size="18" font-weight="400" fill="#6d6b64" text-anchor="middle">Vereinfacht · nicht maßstabsgetreu</text><text x="58" y="2240" font-size="22" font-weight="400" fill="#2f302d" text-anchor="start"><tspan x="58" dy="0">Die Erde wurde als ein Planet verstanden, der die Sonne umkreist.</tspan><tspan x="58" dy="30">Präzisere Beobachtungen, Keplers Bahnen und später die Physik</tspan><tspan x="58" dy="30">machten das heliozentrische Modell zunehmend erfolgreicher.</tspan></text><rect x="54" y="2328" width="652" height="118" rx="12" fill="#ece7db"/><text x="72" y="2358" font-size="21" font-weight="700" fill="#4f776e" text-anchor="start">Ein allmählicher Wandel</text><text x="72" y="2387" font-size="17" font-weight="400" fill="#6d6b64" text-anchor="start"><tspan x="72" dy="0">Das ältere Modell verschwand nicht über Nacht.</tspan><tspan x="72" dy="23">Verschiedene Systeme blieben plausibel, während sich</tspan><tspan x="72" dy="23">über Generationen neue Beobachtungen und Theorien ansammelten.</tspan></text></svg>