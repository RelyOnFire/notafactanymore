title: Turkish History Thesis
claim: Turks were treated as an ancient white or “Alpine” race whose ancestors carried civilization outward from Central Asia and founded or strongly shaped many of the world's early civilizations.
currentUnderstanding: Modern populations are products of complex migration and mixture, not discrete civilizational races. The obsolete “Alpine,” “Caucasoid,” and similar racial taxonomies do not describe natural human divisions, and the origins of ancient civilizations cannot be assigned to a single modern ethnic or racial people.
category: Race, anthropology and historiography
reviewedAt: 2026-08-23
episodes:
