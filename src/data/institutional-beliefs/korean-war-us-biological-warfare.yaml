    note: >-
      The archival reconstruction quotes and cites the 2 May 1953 Presidium resolution from the Archive of the President
      of the Russian Federation. It calls the published information false and the accusations fictitious and says Soviet
      personnel responsible for fabricating supposed proof would be severely punished.
