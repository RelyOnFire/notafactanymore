episodes:
  - id: ussr-1948-1964
    polity: Soviet Union
    region: Eurasia
    startYear: 1948
    endYear: 1964
    strength: enforced-doctrine
    institutionTypes:
      - government
      - academy
      - education
    institutions:
      - Lenin All-Union Academy of Agricultural Sciences (VASKhNIL)
      - USSR Ministry of Higher Education
      - USSR Academy of Sciences
      - Moscow State University
      - Leningrad State University
    institutionalContext: The 1948 VASKhNIL session gave Lysenko's position state-backed authority. Higher education
      minister Sergei Kaftanov's order of 23 August directed dismissals and the restructuring of teaching and research.
      The USSR Academy of Sciences then adopted its own measures against genetics. At Moscow and Leningrad State Universities,
      departments were reorganized and opponents were dismissed or replaced. These were actions of institutional authorities;
      individual scientists within the same institutions resisted, and some later helped genetics recover.
    consequences:
      - Geneticists were dismissed, demoted, or removed from scientific leadership
      - Genetics laboratories and departments were closed or reorganized
      - Mendelian genetics was removed from teaching and textbooks
      - Agricultural and biological research lost normal mechanisms of scientific correction
    summary: >-
      After the 1948 VASKhNIL session, Lysenko's anti-Mendelian biology received state backing while orthodox geneticists
      were dismissed, laboratories were closed, and genetics teaching and research were restricted. Recovery began
      in protected settings during the 1950s. Khrushchev's removal in 1964 opened the way to the Academy of Sciences'
      explicit repudiation of the 1948 decisions in 1965 and new plans for genetics research and teaching. Lysenkoists
      nevertheless retained posts and influence in agricultural institutions.
    mechanism:
      kind: suppression
      summary: >-
        State-backed academy and education authorities imposed Michurinist biology through staffing, curriculum and
        research controls while suppressing Mendelian genetics and scientists who defended it.
    institutionalCorrection:
      status: corrected
      periodLabel: 1964–1966
      action: >-
        In 1965 the USSR Academy of Sciences rejected the 1948 decisions, declined to reelect Lysenko as director
        of its Institute of Genetics, and announced new genetics institutions and teaching plans.
      summary: >-
        The Academy officially rehabilitated genetics within its scientific framework. In January–February 1965 it
        repudiated the imposed doctrine and planned renewed research and curricula; the Institute of General Genetics
        followed. Implementation was gradual, and the continued influence of Lysenkoists in VASKhNIL and agricultural
        education prevents treating 1964 as a universal endpoint for every institution or career.
  - id: china-1949-1956
    polity: People's Republic of China
    region: East Asia
    startYear: 1949
    endYear: 1956
    strength: officially-endorsed
    institutionTypes:
      - government
      - academy
    institutions:
      - Chinese Academy of Sciences, Planning Bureau
      - >-
        Science and Health Office of the Planning Bureau, Cultural and Educational Affairs Committee of the Government
        Administration Council
    consequences:
      - Classical genetics was displaced in research and higher education
      - Scientific careers and curricula were shaped by political orthodoxy
      - Successful hybrid-breeding research was interrupted when classified as Morganist
    summary: >-
      In the early People's Republic, Soviet scientific organization was copied and classical genetics was displaced
      by Lysenkoist biology. The 1952 campaign reached courses, research and publishing. At the Qingdao genetics meeting
      of 10–25 August 1956, organized by the Chinese Academy of Sciences and the Ministry of Higher Education, both
      schools could present their views. Teaching, research and publishing rules subsequently reopened space for classical
      genetics. This was a substantial retreat from one-sided suppression, with coexistence of schools rather than
      a blanket repudiation of Lysenkoism.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Government and Academy bureaus promoted a prescribed Michurinist direction through meetings and party-press
        publication; university courses, research projects and academic publishing then excluded classical genetics.
    institutionalCorrection:
      status: partial
      periodLabel: August 1956 onward
      action: >-
        The Academy and Ministry of Higher Education convened the Qingdao genetics meeting; research, education and
        publishing authorities subsequently changed the rules that had supported one school and suppressed the other.
      summary: >-
        The official chronology records removal of political labels from classical geneticists and a gradual return
        of their courses and research. Both schools were allowed to argue their positions. The response corrected
        exclusion and restored scientific discussion, but does not establish a general institutional rejection of
        every Lysenkoist heredity claim.
    institutionalContext: The Academy’s Planning Bureau and the government’s Science and Health Office convened three
      meetings in spring 1952. On 29 June, People’s Daily printed their conclusions. The authors rebuked Le Tianyu,
      a prominent advocate, for the way he imposed Michurinist biology, even as they called for a broader campaign against
      Morganist genetics. The Academy later recorded what happened in universities and journals. Courses stopped, successful
      hybrid-breeding projects were interrupted, and some geneticists had to publish statements they privately rejected.
  - id: poland-1949-1956
    polity: Poland
    region: Eastern Europe
    startYear: 1949
    endYear: 1956
    strength: enforced-doctrine
    institutionTypes:
      - government
      - academy
      - education
    institutions:
      - Koło Przyrodników Marksistów / Zrzeszenie Przyrodników-Marksistów (renamed 1950; merged in 1952)
      - Polska Akademia Nauk, Division II and Commission of Evolutionism (from 1952)
      - Polish Ministry of Higher Education
      - Polskie Towarzystwo Przyrodników im. Kopernika (from 1952)
    consequences:
      - Removal of genetics from teaching
      - Suppression of competing biological research
      - Political pressure on scientists
      - Pressure to redirect botanical research toward agricultural applications
    summary: >-
      A Warsaw conference in March 1949 proclaimed the Lysenkoist “New Biology” an official paradigm in Polish science.
      Genetics and criticism of the doctrine were actively confronted, genetics courses disappeared from universities,
      school curricula were rewritten, and scientists who used politically unacceptable concepts could be silenced
      or publicly stigmatized. During the Academy's General Assembly of 11–12 June 1956, its imposition of Lysenkoism
      came under open criticism. Genetics returned to school and university curricula in 1957–1958. The 1956 episode
      endpoint marks the political and institutional turn, not the completion of every teaching reform.
    mechanism:
      kind: education
      summary: >-
        Scientific and educational institutions made the “New Biology” an official paradigm, rewrote curricula and
        marginalized or suppressed genetics and researchers who used politically unacceptable concepts.
    institutionalCorrection:
      status: corrected
      periodLabel: 1956–1958
      action: >-
        The Polish Academy's June 1956 General Assembly criticized the imposed doctrine; genetics returned to school
        and university curricula in 1957–1958.
      summary: >-
        Genetics regained its place in official teaching, and the imposed doctrine lost its protected position. The
        Academy's institutional turn in 1956 was followed by curricular restoration in 1957–1958. The sources establish
        this reversal in education and scientific administration; they do not establish that every earlier advocate
        recanted or that all the damage was repaired.
    institutionalContext: >-
      The Association of Marxist Naturalists promoted the new doctrine as Koło Przyrodników Marksistów and,
      after its 1950 renaming, as Zrzeszenie Przyrodników-Marksistów. It merged with the Copernican Society of
      Polish Naturalists in 1952. The Polish Academy of Sciences, created by an Act of 30 October 1951, gave its
      biological division a role in promoting Lysenkoism. Its Commission of Evolutionism and the Ministry of
      Higher Education organized a month-long training course at Dziwnów in 1952. The Copernican Society became
      a major public advocate. Administrative pressure, publishing controls and teaching requirements restricted
      competing biology. Much of the botanical community nevertheless resisted or avoided the doctrine, so
      institutional enforcement should not be read as unanimous scientific acceptance.
  - id: czechoslovakia-1948-1965
    polity: Czechoslovakia
    region: Central Europe
    startYear: 1948
    endYear: 1965
    strength: enforced-doctrine
    institutionTypes:
      - academy
      - education
    institutions:
      - Brno Agricultural College (Vysoká škola zemědělská), action committee
      - Czechoslovak Academy of Agriculture (ČSAZ)
    institutionalContext: Public criticism was already returning in the late 1950s when the agricultural academy elected
      Lysenko an honorary member in June 1959. He came to Prague in April 1960 to accept the honour and lecture on
      Michurinist agrobiology. The gap between the academy ceremony and contemporary criticism shows why it is difficult
      to give the doctrine a single end date.
    consequences:
      - The Brno college barred geneticist Jaroslav Kříženecký from the faculty and dismissed him. He was subsequently
        imprisoned.
      - Plans for a Mendel institute in Brno foundered after the 1948 takeover. Kříženecký finally led a genetics-history
        department at the Moravian Museum in 1962.
    summary: After the Communist takeover in 1948, the authorities branded classical genetics reactionary. At Brno
      Agricultural College this cost Jaroslav Kříženecký his post. The agricultural academy in Prague promoted Michurinist
      biology even as critics recovered a public voice. By spring 1965 students could again attend official genetics
      lectures at what is now Masaryk University in Brno.
    mechanism:
      kind: suppression
      summary: The Brno college’s action committee could remove a teacher who defended Mendelian genetics. At the
        Czechoslovak Academy of Agriculture, president Antonín Klečka promoted the Soviet approach after taking office
        in 1949.
    institutionalCorrection:
      status: corrected
      periodLabel: 1962–1966
      action: Official genetics lectures resumed at what is now Masaryk University by spring 1965. In 1966 the Czechoslovak
        government adopted a resolution supporting genetics. Agricultural colleges were directed to prepare practical
        courses and textbooks.
      summary: The Moravian Museum appointed Kříženecký in 1962. He died in 1964, before his former student Vítězslav
        Orel opened the Mendelianum on 4 August 1965 during the international Mendel centenary symposium. The episode
        ends at this public restoration in Brno. The following year’s national measures also gave priority to genetics
        laboratories.
  - id: east-germany-1951-1965
    polity: East Germany (GDR)
    region: Central Europe
    startYear: 1951
    endYear: 1965
    strength: enforced-doctrine
    institutionTypes:
      - government
      - education
    institutions:
      - GDR Ministry of People’s Education (Ministerium für Volksbildung), school biology curricula
    institutionalContext: The ministry specified what pupils should learn at different ages. In 1951 it prescribed
      Michurin and Lysenko in eighth- and tenth-grade biology. The 1953 and 1954 upper-school syllabuses called for
      criticism of classical genetics in the twelfth grade. Georg Schneider, an advocate at Jena, helped write the
      1952 twelfth-grade textbook.
    consequences:
      - Evolution and breeding lessons in grades 8, 10 and 12 gave Michurin and Lysenko a prominent place.
      - School materials passed over Soviet geneticists including Nikolai Vavilov. Later twelfth-grade materials included
        his work.
    summary: East Germany’s education ministry made Michurinist biology part of the school curriculum in the 1950s.
      Its authority extended to classroom objectives and textbooks. Geneticists at Gatersleben retained room to pursue
      and defend Mendelian research during those same years.
    mechanism:
      kind: education
      summary: Through national syllabuses and schoolbooks, the ministry required pupils to study Lysenko’s approach
        to heredity and to criticize the competing approach based on genes and chromosomes.
    institutionalCorrection:
      status: corrected
      periodLabel: 1959–1966
      action: A 1959 tenth-grade syllabus specified Mendel’s laws. A twelfth-grade syllabus effective in 1963 still
        prescribed a critical treatment of classical genetics. By 1966 a published exercise book asked pupils to perform
        Mendelian crosses and record the ratios in their offspring.
      summary: The end year marks the mid-1960s shift in school teaching. The pace differed by grade and school type.
        Post-1965 materials dropped Lysenko and gave previously omitted scientists a place in accounts of heredity
        and evolution.
