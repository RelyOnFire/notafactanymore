schemaVersion: 2
title: Insulin coma therapy as a treatment for schizophrenia
entryId: insulin-coma-therapy-treats-schizophrenia
proposition:
  summary: >-
    Repeated insulin-induced hypoglycaemic coma was treated as a specific or basic therapy capable of producing
    remission or cure in schizophrenia.
correction:
  summary: >-
    Controlled comparisons did not establish a specific therapeutic benefit from insulin coma itself in schizophrenia.
    Apparent improvement in early uncontrolled series could reflect patient selection, the natural course of illness,
    intensive nursing and social care, concurrent treatments, and other non-specific effects. Deliberately inducing
    profound hypoglycaemia also carried substantial risks, including convulsions, prolonged coma, neurological injury,
    and death. The historical correction is therefore not that no patient ever improved during an insulin-coma course,
    but that the insulin-induced coma was not shown to be the effective antischizophrenic mechanism institutions claimed.
category: Medicine and public health
reviewedAt: '2026-09-19'
impact:
  summary: >-
    Insulin coma therapy deliberately pushed psychiatric patients into profound hypoglycaemia, often repeatedly over
    weeks. It spread rapidly from Vienna into psychiatric hospitals internationally and became a highly staffed,
    institutional treatment for schizophrenia. Vienna continued using it until about 1970 even after controlled studies
    had undermined the claim of a specific therapeutic effect.
  highlights:
    - value: '965'
      label: insulin-treatment cases recorded at Vienna's university psychiatric clinic from 1951–1969, mostly coma therapy
      note: >-
        Count from the study's selected records across five diagnostic groups, not exclusively schizophrenia and
        not a count of individual coma inductions or injuries.
    - value: 31 hospitals
      label: were using deep insulin coma therapy in England and Wales by 1938
    - value: 0.5–4.5%
      label: range of mortality estimates reported in contemporary insulin-coma literature
      note: >-
        Estimates from different historical reports, not a measured mortality rate for the Vienna clinic or The Retreat.
  context:
    - >-
      Insulin coma therapy for schizophrenia was distinct from ordinary insulin treatment for diabetes. Patients were
      intentionally made severely hypoglycaemic and unconscious, then revived with glucose or, later in Vienna, glucagon.
    - >-
      Its decline had more than one cause. Scientific criticism and controlled trials challenged efficacy, while new
      antipsychotic drugs were also easier to administer. The disappearance of a treatment does not by
      itself prove why institutions abandoned it.
episodes:
  - id: austria-vienna-1935-1970
    polity: Austria — Vienna
    region: Europe
    startYear: 1935
    endYear: 1970
    periodLabel: Mid-1930s–c.1970
    strength: policy-basis
    institutionTypes:
      - university
      - medical
    institutions:
      - Psychiatric-Neurological University Clinic, Vienna
    institutionalContext: >-
      Manfred Sakel reported early results in Vienna in 1933; the historical clinic study places the development of
      insulin coma therapy there in the mid-1930s. The treatment became embedded in the university psychiatric clinic's
      practice and survived the arrival of neuroleptic drugs. During Hans Hoff's directorship, Ottokar H. Arnold still
      described correctly indicated full insulin shock treatment in 1960 as the basic treatment for schizophrenia.
      A modern review of the clinic's records found 965
      insulin-treatment cases from 1951–1969, the great majority involving insulin coma therapy, and records continued
      into 1968; the historical study places final discontinuation at about 1970.
    consequences:
      - Repeated deliberate induction of profound hypoglycaemia and coma in psychiatric patients
      - Courses commonly involving dozens of coma inductions over several weeks
      - Risk of convulsions, prolonged coma, neurological injury and death
      - Continuation of an invasive treatment after its specific efficacy had become seriously disputed
    summary: >-
      Insulin coma therapy was developed in Vienna in the 1930s and became an established treatment for schizophrenia
      at the university psychiatric clinic. Clinicians expected early cases to be curable and prescribed repeated comas
      as a central treatment. Its use declined after neuroleptics appeared and efficacy was increasingly challenged,
      but Vienna persisted unusually long: a 2025/26 historical study found 965 insulin-treatment cases between 1951
      and 1969, mostly coma therapy, and concluded that insulin coma treatment continued there until about 1970.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Vienna's university psychiatric clinic embedded repeated insulin-induced coma in routine schizophrenia treatment,
        prescribing courses of repeated coma inductions and retaining the basic-treatment rationale even after
        neuroleptic drugs became available.
    institutionalCorrection:
      status: undocumented
      summary: >-
        The treatment was discontinued around 1970 after prolonged scientific criticism and therapeutic change, but
        the existing record does not identify a dated Vienna institutional act formally repudiating insulin coma therapy.
  - id: england-wales-1936-1960
    polity: England and Wales
    region: Europe
    startYear: 1936
    endYear: 1960
    periodLabel: 1936–c.1960
    strength: policy-basis
    institutionTypes:
      - government
      - medical
      - professional
    institutions:
      - Board of Control for England and Wales
      - The Retreat, York
      - Royal Medico-Psychological Association
    institutionalContext: >-
      The Board of Control, which inspected and supervised mental hospitals, sent a medical commissioner to Vienna in
      1936 and then published guidance on hypoglycaemic shock treatment. Institutional adoption was rapid: by 1938 deep
      insulin coma therapy was established in 31 hospitals in England and Wales. The Retreat introduced it in October
      1938 after favourable reports at the Medico-Psychological Association's July meeting. Professional support
      continued through the 1940s and 1950s despite scientific criticism, and a leading textbook still endorsed the
      treatment in 1960. A 1957 randomized comparison found no significant advantage of insulin-induced over
      barbiturate-induced coma; it could not establish the value of the coma regimen itself. Use declined as
      antipsychotic drugs displaced the procedure. The approximate end date describes this transition, not a shared
      cessation date for all the institutions named here.
    consequences:
      - Government-supported diffusion of insulin coma units through the mental-hospital system
      - Repeated invasive treatment of people diagnosed with schizophrenia
      - High staffing requirements and treatment courses extending over several weeks
      - Exposure to severe hypoglycaemia, convulsions, neurological complications and mortality risk
    summary: >-
      England and Wales rapidly institutionalized insulin coma treatment after the Board of Control investigated the
      Vienna method in 1936. By 1938 it was established in 31 hospitals and had strong professional support.
      The Retreat began using it in October that year. Criticism
      intensified in the 1950s, and a 1957 controlled trial found no significant difference between insulin coma and
      a comparison coma treatment, undermining the claim that insulin itself was a specific treatment for schizophrenia.
      Use declined around the end of the decade and into the 1960s, while some clinicians continued to defend it.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Board of Control investigation and guidance helped diffuse dedicated insulin-coma treatment units through the
        mental-hospital system, reinforced by RMPA meetings and publications. The Retreat's archive describes its
        adoption following favourable reports at the Association's 1938 meeting.
    institutionalCorrection:
      status: undocumented
      summary: >-
        Clinical use declined as controlled comparisons challenged a specific insulin effect and antipsychotic drugs
        displaced the procedure. The available sources do not identify a dated Board of Control or RMPA withdrawal,
        or establish when The Retreat stopped using it. Clinical decline is not evidence of a formal institutional repudiation.
