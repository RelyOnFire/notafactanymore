        note: Historical study of the political and institutional rise of Marr's supposedly Marxian linguistics against traditional comparative linguistics.
      - title: Institute of Language and Thought of the Academy of Sciences of the USSR
        url: https://www.encspb.ru/object/2804011211?lc=en
        publisher: Saint Petersburg Encyclopaedia
