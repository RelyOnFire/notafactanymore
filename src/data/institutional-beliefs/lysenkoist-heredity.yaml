      Gives an estimated range of about 15–30 million excess deaths for the Great Chinese Famine and emphasizes that
      the famine arose from multiple interacting factors.
    locator: >-
      Introduction, opening paragraph and footnote 1 (p. 659): the 15–30 million range; section 2, The 1959–1961
      famine in China, opening two paragraphs: interacting causes. Relevant introduction and background passages
      inspected; no full-article review.
  - id: lysenko-great-leap-impact
