title: Hereditary criminality
claim: Membership in certain castes or tribes was treated as evidence of a hereditary disposition to crime.
currentUnderstanding: Criminal behavior is not an inherited property of a caste, tribe, or ethnic community. Crime is shaped by individual circumstances, institutions, opportunity, social conditions, and many other factors; collective ancestry does not establish criminal propensity.
category: Criminology and anthropology
reviewedAt: 2026-08-22
episodes:
  - id: british-india-1871-1947
    polity: British India
    region: South Asia
    startYear: 1871
    endYear: 1947
    periodLabel: 1871–1947
    strength: enforced-doctrine
    institutionTypes: [government, court]
    institutions:
      - Government of India
      - Provincial administrations and police
      - Criminal Tribes settlements
    consequences:
      - Collective registration and surveillance
      - Restrictions on movement
      - Forced settlement and “reclamation”
    summary: The Criminal Tribes Acts allowed colonial authorities to notify entire communities as groups whose criminality was treated as hereditary. People could be registered, watched, restricted in their movement, and confined or resettled because of group membership rather than an individual criminal conviction.
    sources:
      - title: State and Criminal Tribes in Colonial Punjab — Surveillance, Control and Reclamation of the “Dangerous Classes”
        url: https://www.cambridge.org/core/journals/modern-asian-studies/article/abs/state-and-criminal-tribes-in-colonial-punjab-surveillance-control-and-reclamation-of-the-dangerous-classes/5156F74993B1B1BDE0187A004B445AAD
        publisher: Modern Asian Studies
        note: Describes roughly 150,000 Punjabis notified under the Criminal Tribes Act as members of tribes and castes whose hereditary occupation was deemed to be crime.
      - title: The Moghia Menace, or the Watch Over Watchmen In British India
        url: https://www.cambridge.org/core/journals/modern-asian-studies/article/abs/moghia-menace-or-the-watch-over-watchmen-in-british-india/6725830A5EAF6DD17E566627E020FF19
        publisher: Modern Asian Studies
        note: Examines the colonial classification of Moghias as hereditary professional robbers and its connection to the first Criminal Tribes Act of 1871.
