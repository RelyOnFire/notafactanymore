title: Sluggish schizophrenia and political dissent
claim: Persistent political reformism or opposition could be treated as evidence of a mild form of schizophrenia
  even when a person showed no overt psychosis.
currentUnderstanding: Political dissent is not a symptom of schizophrenia. Psychiatric diagnosis requires clinically
  valid evidence of mental disorder and cannot be inferred from opposition to a government, advocacy of reform,
  or persistence in political beliefs.
category: Psychiatry
reviewedAt: '2026-08-23'
episodes:
