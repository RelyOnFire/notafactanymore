title: Inherited intelligence and differential fertility
claim: Educational attainment was treated as a proxy for inherited intelligence, so better-educated women should have more children and less-educated women fewer in order to protect the population's future “quality.”
currentUnderstanding: Intelligence and educational attainment are complex traits shaped by many genetic, developmental, familial, educational, economic, and social influences. A parent's educational credentials do not establish hereditary human worth, and they provide no scientific basis for assigning different reproductive incentives or disincentives to social classes.
category: Eugenics and population policy
reviewedAt: 2026-08-22
