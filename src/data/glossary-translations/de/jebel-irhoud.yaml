term: Jebel Irhoud
aliases: []
shortDefinition: Ein Fossilfundort in Marokko mit frühen Homo-sapiens-Fossilien, die auf ungefähr 315.000 Jahre datiert
  wurden.
longDefinition: Jebel Irhoud in Marokko enthält menschliche Fossilien und Werkzeuge des Middle Stone Age aus der Zeit
  vor etwa 315.000 Jahren. Die Fossilien verbinden relativ moderne Gesichts- und Zahnmerkmale mit einem archaischeren
  Hirnschädel. Ihr Alter und ihre Anatomie verschoben die bekannten Wurzeln von Homo sapiens näher an 300.000 Jahre und
  erweiterten den geografischen Rahmen der frühen Menschheitsentwicklung über Ostafrika hinaus.
