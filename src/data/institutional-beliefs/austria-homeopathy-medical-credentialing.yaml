  institutionalContext: 'The Austrian Medical Chamber introduced a special diploma in homeopathy in 1994 and continues
    to maintain it within its formal physician continuing-education system. The current curriculum calls homeopathy
    a medical therapy using remedies tested on healthy people, potentiation and the similarity principle; it states
    that graduates may treat acute and chronic illnesses according to homeopathic rules. The Austrian Academy of
    Physicians administers the diploma on behalf of the Medical Chamber. This is professional credentialing rather
    than national insurance coverage: Austrian social-insurance authorities have separately stated that homeopathy
    is not a scientifically established healing method and that homeopathic medicines generally lack the evidence
    required for reimbursement.'
  consequences:
  - Formal physician credential in homeopathic diagnosis and treatment
  - Three-year, 350-unit postgraduate training pathway recognized by the Austrian Medical Chamber
  - Professional legitimacy for treating acute and chronic disease according to homeopathic principles
  - Hundreds of currently credentialed physicians despite lack of robust evidence for specific therapeutic efficacy
  summary: 'Austria''s Medical Chamber has formally credentialed physicians in homeopathy since 1994. Its current
    ÖÄK diploma curriculum defines homeopathy as a medical therapy, teaches potentiation and the similarity principle,
    and says qualified physicians can use the method to treat acute and chronic illnesses. The credential remains
    active: the Chamber''s 2025 training report counted 675 diploma holders at the end of 2024. This endorsement
    coexists with an explicitly different Austrian health-policy judgment: social-insurance authorities have stated
    that homeopathy is not scientifically established and that homeopathic medicines generally do not meet the evidentiary
    threshold for reimbursement.'
