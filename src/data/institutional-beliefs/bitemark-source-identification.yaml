schemaVersion: 2
title: Bitemarks as individual source identification
proposition:
  summary: >-
    Patterns left by teeth on human skin were treated as preserving sufficiently distinctive dental features to identify
    or strongly associate a particular person as the biter.
correction:
  summary: >-
    The scientific premises required for individual bitemark attribution have not been established. Human
    anterior dentition has not been shown to be unique at the individual level for this purpose, skin does not
    consistently preserve dental patterns without distortion, and examiners have not been shown to analyze
    injury patterns reliably enough to identify a source. NIST’s 2023 review also found insufficient data to
    establish accurate exclusion or non-exclusion of a person from a skin-bitemark comparison. Restricting
    conclusions to those terms does not establish the method’s validity.
category: Forensic medicine and identification
reviewedAt: 2026-09-18
impact:
  summary: >-
    Bitemark analysis acquired professional guidelines and courtroom influence before its core
    source-identification assumptions had been validated. Later professional restrictions and scientific reviews
    progressively narrowed what an examiner could responsibly claim from a patterned injury on skin.
  highlights:
    - value: '1984'
      label: ABFO promulgated guidelines and a uniform scoring system for bitemark analysis
    - value: '2015'
      label: ABFO manual no longer supported an unconditional “The Biter” conclusion in open-population cases
    - value: '2023'
      label: NIST published its final scientific-foundation review of bitemark analysis
  context:
    - >-
      The disputed source-attribution claim concerns matching a skin injury to a living person's teeth. Forensic
      identification of human remains from dental records and radiographs is a separate, well-established practice.
    - >-
      Professional practice did not disappear in 2015. That date marks a significant narrowing of the strongest
      source conclusion within ABFO guidance. Its 2018 standards limited linkage conclusions to excluded, not
      excluded, or inconclusive; NIST’s subsequent review did not establish the scientific reliability of those
      conclusions.
episodes:
  - id: united-states-1984-2015
    polity: United States
    region: North America
    startYear: 1984
    endYear: 2015
    periodLabel: 1984–2015
    strength: institutionally-influential
    institutionTypes:
      - professional
      - court
      - medical
    institutions:
      - American Board of Forensic Odontology (ABFO)
    institutionalContext: >-
      ABFO, the principal U.S. professional organization for forensic odontologists, promulgated standardized bitemark
      guidelines and a scoring system beginning in 1984. Practitioners operating within this professional framework
      supplied expert evidence in criminal courts and military justice. Courts varied in how they assessed admissibility,
      but published decisions repeatedly treated bitemark comparison as an accepted means of identification.
    consequences:
      - Bitemark comparison testimony was admitted and used in criminal courts
      - "Examiners claimed to include or identify suspects from patterned injuries on skin"
      - Source opinions could materially strengthen otherwise circumstantial prosecutions
      - Professional conclusion language was later restricted as the scientific foundation came under sustained review
    summary: >-
      In 1984 the American Board of Forensic Odontology promulgated guidelines intended to standardize bitemark analysis,
      including a uniform scoring system that its drafting committee initially described as a step toward a scientific
      approach. The published ABFO guidelines noted that bitemark evidence was already used in many courts and in the
      military justice system. Yet the ultimate source opinion remained subjective, with no accepted minimum number of
      matching features for a positive identification. By 2015 ABFO's reference manual no longer supported an
      unconditional conclusion of “The Biter” in an open-population case. Subsequent NIST review found that the three
      essential premises for source attribution—individual dental uniqueness, faithful transfer to skin, and reliable
      examiner interpretation—were not supported by sufficient data.
    mechanism:
      kind: standard-setting
      summary: >-
        ABFO issued collection guidelines and a scoring system intended to standardize bitemark comparison. Its
        drafting committee warned in 1988 against relying on precise point counts, while source judgments
        continued to depend on examiner interpretation.
    institutionalCorrection:
      status: partial
      periodLabel: "2015–2018"
      action: "ABFO restricted open-population identification in its 2015 manual and limited linkage conclusions to three categories in its 2018 standards."
      summary: >-
        The 2015 manual did not support an unconditional “The Biter” conclusion in an open-population case. The
        2018 standards prohibited unconditional linkage and permitted excluded, not excluded, or inconclusive
        conclusions. These documented restrictions changed professional conclusion language without abandoning
        skin-bitemark comparison. NIST’s later scientific review found insufficient data to establish accurate
        exclusion or non-exclusion.
