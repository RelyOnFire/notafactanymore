schemaVersion: 2
title: Masturbation as a cause or aggravating factor in insanity
proposition:
  summary: >-
    At Ontario's London Asylum for the Insane in 1877, medical superintendent R. M. Bucke treated masturbation as
    capable, in selected patients, of helping to bring on an attack of insanity or aggravating an illness caused by
    something else. Although he classified other cases as symptoms only and doubted that masturbation was ever the
    sole cause, he acted on the causal category through genital wiring and circumcision.
correction:
  summary: >-
    Contemporary clinical standards recognize masturbation as normal sexual activity and do not classify it as a
    cause of mental disorder. ICD-11 defines compulsive sexual behaviour disorder by persistent failure to control
    repetitive sexual impulses or behaviour that causes marked distress or impairment; high sexual interest or
    distress based only on moral disapproval does not qualify. Sexual behaviour that occurs with another condition
    is not evidence that it caused that condition.
category: Psychiatry and sexuality
reviewedAt: '2026-09-24'
impact:
  summary: >-
    Bucke's 1877 official report documented genital wiring in 15 male patients. In several cases, inflammation and
    swelling forced removal and later replacement of the wire; some patients received more than one wire and had
    their hands restrained in a muff. Four patients were also circumcised in an attempt to arrest or reduce
    masturbation. All four resumed after healing, and none showed even temporary mental improvement. A later
    historical review found that wiring failed to arrest the behaviour in 7 of the 15 cases and was not continued.
  highlights:
    - value: '15'
      label: male patients subjected to genital wiring
    - value: '4'
      label: patients circumcised; all resumed masturbation after healing
    - value: 7 of 15
      label: cases in which wiring did not arrest the behaviour
  context:
    - >-
      Bucke did not claim that every instance of masturbation caused insanity. He distinguished three possibilities:
      it could contribute to an attack in a predisposed person, aggravate an illness with another cause, or be only a
      symptom. The interventions were directed at patients whom he placed in the first two categories.
    - >-
      Bucke selected the cases himself and interpreted changes recorded after treatment as evidence of a connection.
      The resulting uncontrolled table cannot determine whether masturbation caused mental illness or whether any
      mental change resulted from suppressing it.
    - >-
      “Insanity” is retained here as the historical term used in the report. It covered varied conditions and does not
      map to a single modern diagnosis.
episodes:
  - id: canada-ontario-1877
    polity: Canada — Ontario
    region: North America
    startYear: 1877
    endYear: 1877
    periodLabel: 1877 intervention and report
    strength: policy-basis
    institutionTypes:
      - government
      - medical
    institutions:
      - London Asylum for the Insane
    institutionalContext: >-
      The London Asylum was a provincial public institution, and Bucke introduced the interventions during his first
      year as its medical superintendent. In the asylum's official report he separated patients whose masturbation he
      regarded as causal or aggravating from those for whom he regarded it as a symptom, then presented a selected
      15-patient treatment table. The belief therefore functioned as a basis for medical practice under institutional
      authority, rather than remaining a private opinion.
    consequences:
      - Fifteen male patients underwent genital wiring intended to prevent masturbation
      - Several developed inflammation and swelling that required removal and later replacement of the wire
      - Some received multiple wires and had their hands restrained in a muff to stop the behaviour
      - Four patients were circumcised; all resumed masturbation after healing and none showed even temporary mental improvement
      - Seven of the 15 wiring cases were recorded as non-preventive, and the procedure was not continued
    summary: >-
      In 1877 Bucke converted a qualified causal theory into physical interventions at a provincial asylum. His report
      recorded complications, repeated wiring, hand restraint and four circumcisions. The results did not establish
      the theory: wiring failed to arrest masturbation in 7 of 15 cases, and all four circumcised patients resumed it
      without mental improvement.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Acting as medical superintendent, Bucke classified selected patients' masturbation as causal or aggravating
        and used that classification to authorize wiring, restraint and circumcision as psychiatric treatment.
    institutionalCorrection:
      status: partial
      periodLabel: After 1877; broader shift by the 1890s
      action: The asylum did not continue genital wiring, and Ontario asylum reporting later treated masturbation as a symptom rather than a cause.
      summary: >-
        The failed wiring programme was abandoned. Historical research finds that by the 1890s Ontario asylums
        described masturbation as a symptom rather than a cause, but no formal London Asylum repudiation of the
        broader causal theory has been identified.
