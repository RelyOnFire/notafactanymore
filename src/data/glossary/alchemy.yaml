term: Alchemy
aliases:
- alchemical
- alchemist
shortDefinition: A diverse premodern tradition combining practical work with matter, medicine, metallurgy, and theories
  of transformation, including attempts to transmute metals.
longDefinition: Alchemy was not a single doctrine but a family of traditions practiced across different cultures and
  periods. It combined hands-on techniques such as distillation, heating, alloying, and purification with theories about
  the composition and transformation of matter. In European and Islamic traditions, one prominent goal was metallic transmutation,
  although alchemical practice also included medicines, pigments, salts, and other materials.
relatedTerms:
- transmutation
reviewedAt: '2026-08-21'
sources:
