title: Moriori as an inferior pre-Māori race that became extinct
claim: New Zealand's Department of Education taught schoolchildren that Moriori were a racially inferior people
  who had occupied mainland New Zealand before Māori, were displaced to the Chatham Islands by later Māori arrivals,
  and had become extinct.
currentUnderstanding: Moriori are a living Polynesian people whose homeland is Rēkohu and nearby islands. They are
  not a pre-Polynesian or Melanesian race that occupied mainland New Zealand before Māori, and they did not become
  extinct. The pre-Māori race theory was challenged by New Zealand scholars from the 1920s onward. In 2010 the School
  Journal published special issues developed with Moriori specifically to correct earlier misinformation; the Crown
  later formally acknowledged and apologised for its role in spreading the myth.
category: Education, race and Indigenous history
reviewedAt: '2026-08-25'
impact:
  summary: The false account entered state education through the School Journal, a Department of Education publication
    circulated to state schools. Editions in 1916 and 1946 taught racial inferiority, pre-Māori occupation and extinction.
    The Crown's later settlement legislation acknowledged that generations of schoolchildren learned these claims
    and that the resulting stigma damaged Moriori identity and knowledge of ancestry. In 2010, 94 years after the
    first cited issue, the School Journal published a set of corrective issues developed in collaboration with Moriori.
  highlights:
  - value: '1916'
    label: first School Journal issue specifically acknowledged by the Crown as spreading the myth
  - value: '1946'
    label: later School Journal edition that again taught the false racial history
  - value: 94 years
    label: from the 1916 misinformation to corrective School Journal special issues in 2010
  context:
  - Moriori and Māori are distinct peoples with distinct histories. Correcting the myth does not mean describing
    Moriori simply as Māori or denying the 1835 invasion of Rēkohu by Ngāti Mutunga and Ngāti Tama.
  - 'The false story had several linked parts: supposed pre-Māori occupation of mainland New Zealand by a racially
    different people, racial inferiority, displacement by Māori and extinction. The Department of Education propagated
    these ideas together, so the card treats them as one educational racial narrative.'
  - Scholars had challenged important parts of the myth decades before the state educational correction. The long
    endpoint to 2010 reflects the School Journal's own explicit corrective publication, not the date at which historians
    first had evidence against the story.
