title: Sluggish schizophrenia and political dissent
claim: Persistent political reformism or opposition could be treated as evidence of a mild form of schizophrenia even when a person showed no overt psychosis.
currentUnderstanding: Political dissent is not a symptom of schizophrenia. Psychiatric diagnosis requires clinically valid evidence of mental disorder and cannot be inferred from opposition to a government, advocacy of reform, or persistence in political beliefs.
category: Psychiatry
reviewedAt: 2026-08-22
episodes:
  - id: soviet-union-1969-1989
    polity: Soviet Union
    region: Eurasia
    startYear: 1969
    endYear: 1989
    periodLabel: 1969–1989
    strength: enforced-doctrine
    institutionTypes: [government, medical]
    institutions:
      - Moscow School of Psychiatry
      - Serbsky Institute
      - Soviet forensic-psychiatric system
    consequences:
      - Psychiatric incarceration of dissidents
      - Forced psychiatric treatment
      - Suppression of political and religious dissent
    summary: The unusually broad Soviet category of “sluggish schizophrenia” allowed schizophrenia to be diagnosed in people who functioned normally and lacked overt psychosis. During the Brezhnev era it was repeatedly applied to dissidents, with reformist or oppositional behavior interpreted as pathology and psychiatric detention used as a mechanism of political repression.
    sources:
      - title: Political Abuse of Psychiatry — An Historical Overview
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2800147/
        publisher: Schizophrenia Bulletin
        note: Reviews systematic Soviet political abuse of psychiatry and explains how the broad concept of sluggish schizophrenia could incorporate reformist and truth-seeking behavior.
      - title: Cold War Psychiatry, Extremism, and Expertise
        url: https://academic.oup.com/ips/article/16/1/olab034/6459960
        publisher: International Political Sociology
        note: Describes systematic cooperation between state security and psychiatric institutions and the diagnosis and detention of Soviet reformers under sluggish schizophrenia.
