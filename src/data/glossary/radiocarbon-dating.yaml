term: Radiocarbon dating
aliases: []
shortDefinition: A method for dating once-living material by measuring how much radioactive carbon-14 remains in it.
longDefinition: Living organisms continually exchange carbon with the environment. After death that exchange stops, and carbon-14 decays at a known rate, allowing organic remains to be dated over archaeological timescales.
reviewedAt: '2026-08-21'
sources:
- title: Research on Stonehenge
  url: https://www.english-heritage.org.uk/visit/places/stonehenge/history-and-stories/history/research/
  publisher: English Heritage
  note: Describes archaeological research and scientific dating that established Stonehenge chronology.
