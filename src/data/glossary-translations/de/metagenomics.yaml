term: Metagenomik
aliases: []
shortDefinition: Die Untersuchung von Erbmaterial direkt aus einer gemischten Probe, ohne zunächst jeden Mikroorganismus einzeln im Labor zu kultivieren.
longDefinition: Die Metagenomik untersucht DNA ganzer Gemeinschaften direkt aus Proben wie Meerwasser, Boden oder dem menschlichen Darm. Dadurch werden auch Organismen und Gene sichtbar, die gewöhnliche Laborkulturen verfehlen.
