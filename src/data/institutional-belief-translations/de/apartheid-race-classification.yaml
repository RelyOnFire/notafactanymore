locale: de
entryId: apartheid-race-classification
sourceReviewedAt: '2026-08-25'
title: Jeder Mensch in Südafrika als eindeutig einer „Rasse“ zuordenbar
claim: Der Apartheidstaat behandelte die „Rasse“ oder Bevölkerungsgruppe jedes Menschen als feststellbare persönliche
  Tatsache, die Behörden anhand von Aussehen, Abstammung, gesellschaftlicher Akzeptanz und Ruf bestimmen und registrieren
  könnten. Diese amtliche Einstufung entschied anschließend über Rechte, Verbote und Lebenschancen.
currentUnderstanding: 'Die Apartheidkategorien waren rechtliche und gesellschaftliche Konstruktionen, keine diskreten
  biologischen Unterteilungen der Menschheit. Schon die gesetzlichen Kriterien waren mehrdeutig und veränderten
  sich: Aussehen, Abstammung und soziale Akzeptanz konnten zu unterschiedlichen Ergebnissen führen, Einstufungen
  konnten angefochten oder geändert werden und Mitglieder derselben Familie konnten verschieden klassifiziert sein.
  Auch die biologische Anthropologie zeigt, dass gesellschaftlich anerkannte „Rassen“ keinen festen, getrennten
  biologischen Gruppen entsprechen. „Rasse“ bleibt als gesellschaftliche Realität folgenreich, weil Institutionen
  und Rassismus den Kategorien Wirkung verleihen – nicht weil die Apartheid natürliche biologische Grenzen entdeckt
  hätte.'
impact:
  summary: Der Population Registration Act von 1950 machte die Rassenklassifikation zum Verwaltungsfundament der
    Apartheid. Jeder im Bevölkerungsregister erfasste Mensch musste eine amtliche Einstufung erhalten, getragen
    von Identitätsdokumenten, Verwaltungsbeamten, Klassifikationsausschüssen und Gerichten. Die Wahrheits- und Versöhnungskommission
    bezeichnete das Gesetz später als Grundpfeiler der Apartheid und seine Definitionen als grob und hoffnungslos
    unpräzise. Die Einstufung bestimmte Wohnort, Bildung, Arbeit, Zugang zu Einrichtungen und über verbundene Gesetze
    auch Ehe und Sexualbeziehungen; sie konnte selbst Familien auseinanderreißen. 1991 hob das Parlament das System
    auf.
  highlights:
  - value: 41 Jahre
    label: vom Population Registration Act 1950 bis zu seiner Aufhebung 1991
  - value: '3'
    label: 'primäre Kategorien im ursprünglichen Gesetz: white, coloured und native'
  - value: 28. Juni 1991
    label: Inkrafttreten der Aufhebung der gesetzlichen Rassenregistrierung
  context:
  - 'Die Karte behauptet nicht, das Gesetz habe ausschließlich Genetik oder einen einzigen Körpertest benutzt. Gerade
    seine Instabilität ist Teil des Befunds: Es mischte Aussehen mit sozialer Akzeptanz und später stärker mit Abstammung
    und sah Einsprüche, Berufungen und Umklassifizierungen vor.'
  - Die Korrektur bedeutet nicht, dass „Rasse“ nach 1991 gesellschaftlich bedeutungslos wurde. Durch Kolonialismus
    und Apartheid geschaffene Kategorien prägen Ungleichheit und Identität bis heute. Korrigiert wird die Vorstellung,
    die Bürokratie habe bei der Einstufung natürliche, feste Menschengruppen festgestellt.
  - Die Aufhebung 1991 beendete die Bevölkerungsregistrierung noch vor dem demokratischen Übergang 1994. Die spätere
    Verfassung vertiefte die politische Abkehr; der institutionelle Endpunkt dieser Karte ist jedoch die Abschaffung
    des Klassifikationsgesetzes selbst.
episodes:
- id: south-africa-1950-1991
  polity: Südafrika
  institutions:
  - Innenministerium und Verwaltung des Bevölkerungsregisters
  - Ausschüsse für Rassenklassifikation
  - südafrikanische Gerichte für Klassifikationsberufungen
  institutionalContext: Gesetz Nr. 30 von 1950 verpflichtete den Staat, ein Bevölkerungsregister anzulegen und jeden
    darin erfassten Menschen zu klassifizieren. Das ursprüngliche Gesetz definierte „white“ vor allem über offensichtliches
    Aussehen oder allgemeine gesellschaftliche Akzeptanz, „native“ über tatsächliche oder anerkannte Zugehörigkeit
    zu einer afrikanischen „Rasse“ oder einem Stamm und „coloured“ als Restkategorie. Spätere Änderungen bauten
    Abstammung, Familieneinstufungen und soziale Akzeptanz weiter aus. Verwaltung, Ausschüsse und Gerichte verwandelten
    das Ergebnis in eine amtliche Identität, die im übrigen Apartheidrecht als Schlüssel diente.
  summary: Der Population Registration Act machte aus einer umstrittenen sozialen Einteilung eine scheinbar administrativ
    feststellbare Tatsache. Der Staat verlangte, jeden Menschen einer Kategorie zuzuordnen und über diese Einstufung
    zu regieren, obwohl die eigenen Kriterien so instabil waren, dass Einsprüche, Umklassifizierungen und unterschiedliche
    Einstufungen innerhalb von Familien entstanden. Die Wahrheitskommission bezeichnete die Definitionen später
    als hoffnungslos unpräzise; die moderne biologische Anthropologie verwirft gesellschaftliche „Rassen“ als diskrete
    biologische Gruppen.
  consequences:
  - Amtliche Rassenklassifikation der Bevölkerung von Geburt oder Registrierung an
  - Nutzung der Einstufung für Wohnort, Schule, Universität, Arbeit und öffentliche Einrichtungen
  - Verknüpfung mit Ehe-, Sexual-, Wahl-, Bewegungs- und Homeland-Gesetzen derselben Rassenordnung
  - Demütigung, Unsicherheit und Rechtsstreit für Menschen, bei denen Aussehen, Abstammung und soziale Akzeptanz
    nicht übereinstimmten
  - Unterschiedliche Klassifikation von Angehörigen derselben Familie mit rechtlichen und sozialen Trennungsfolgen
  - Große Bürokratie zur Pflege, Anfechtung und Änderung von „Rasse“ als amtlicher persönlicher Tatsache
