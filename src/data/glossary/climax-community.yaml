term: Climax community
aliases:
- climax
- climatic climax
shortDefinition: In classical succession theory, the mature, relatively stable community expected to form at the endpoint
  of ecological succession.
longDefinition: The climax community was central to Frederic Clements's influential model of succession. Vegetation was
  expected to develop through ordered stages toward a mature community determined chiefly by regional climate. Ecologists
  still use climax terminology in some contexts, but the idea of one inevitable permanent endpoint has been superseded
  by models incorporating disturbance, multiple trajectories, and alternative states.
relatedTerms:
- ecological-succession
reviewedAt: '2026-08-21'
sources:
- title: Succession in wetlands
  url: https://www.usgs.gov/publications/succession-wetlands
  publisher: U.S. Geological Survey
  note: Describes the historical Clementsian view of linear succession toward a climax state and its later deemphasis.
