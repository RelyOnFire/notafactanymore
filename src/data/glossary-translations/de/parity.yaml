entryId: parity
sourceReviewedAt: '2026-08-21'
term: Parität
aliases:
- Paritätssymmetrie
- Paritätserhaltung
- Spiegelsymmetrie
shortDefinition: Ein Symmetrieprinzip, das fragt, ob die Naturgesetze für einen räumlich gespiegelten Vorgang dieselben
  bleiben.
longDefinition: In der Teilchenphysik bildet die Parität ein physikalisches System auf sein räumliches Spiegelbild ab.
  Erhält eine Wechselwirkung die Parität, gelten für den gespiegelten Vorgang dieselben Regeln wie für das Original.
  Elektromagnetische und starke Wechselwirkungen erhalten die Parität mit sehr hoher Genauigkeit; die schwache Wechselwirkung
  kann sie dagegen verletzen und damit links und rechts unterscheiden.
