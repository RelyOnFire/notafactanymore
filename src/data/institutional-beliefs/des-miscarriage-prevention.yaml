schemaVersion: 2
title: DES for preventing miscarriage
entryId: des-safely-prevents-miscarriage
proposition:
  summary: Diethylstilbestrol (DES) was treated as an effective preventive treatment for miscarriage, premature labor and related adverse pregnancy outcomes.
correction:
  summary: Controlled trials found no benefit from DES for preventing miscarriage or other adverse pregnancy outcomes, and prenatal exposure can cause serious long-term harms in offspring, including an increased risk of clear-cell adenocarcinoma and reproductive abnormalities. DES should not be used during pregnancy.
category: Obstetrics and drug regulation
reviewedAt: '2026-08-26'
episodes:
  - id: united-states-1947-1971
    polity: United States
    region: North America
    startYear: 1947
    endYear: 1971
    periodLabel: 1947–1971
    strength: policy-basis
    institutionTypes:
      - government
      - medical
    institutions:
      - U.S. Food and Drug Administration
    institutionalContext: DES had already been approved for other indications when the FDA approved new drug applications in 1947 allowing it to be marketed to prevent miscarriage. Controlled studies in the 1950s found that DES did not improve pregnancy outcomes, yet the drug continued to be prescribed during pregnancy for roughly two more decades. In 1971, after researchers linked in-utero DES exposure to a rare clear-cell adenocarcinoma in young women, the FDA notified physicians and required pregnancy to be listed as a contraindication.
    consequences:
      - Continued exposure of pregnant women and fetuses after controlled trials had failed to show the intended benefit
      - Increased risk of clear-cell adenocarcinoma of the vagina and cervix among women exposed in utero
      - Long-term reproductive and other health abnormalities among DES-exposed offspring
      - A multigenerational drug-safety legacy requiring decades of follow-up and surveillance
    summary: In 1947 the FDA approved DES for marketing as a miscarriage preventive, institutionalizing a treatment rationale that had been built largely on uncontrolled evidence. Better trials in the 1950s showed that the treatment did not prevent the pregnancy complications for which it was being prescribed, but use persisted. The decisive regulatory reversal came in 1971, when evidence linked prenatal DES exposure to a rare cancer in young women and the FDA warned clinicians not to prescribe DES during pregnancy.
    mechanism:
      kind: administrative-adoption
      summary: >-
        FDA approval of new drug applications in 1947 allowed DES to be marketed for miscarriage prevention, giving the
        treatment rationale a formal regulatory pathway into obstetric use even though later controlled trials found no benefit.
    institutionalCorrection:
      status: corrected
      periodLabel: '1971'
      action: Required pregnancy to be listed as a contraindication and warned physicians not to prescribe DES during pregnancy.
      summary: >-
        In 1971 the FDA reversed the pregnancy indication after prenatal DES exposure was linked to clear-cell
        adenocarcinoma, notified physicians and required pregnancy to be listed as a contraindication.
