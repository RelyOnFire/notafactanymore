term: Gray
aliases:
  - Gy
  - nGy
  - Nanogray
shortDefinition: SI-Einheit der absorbierten Dosis ionisierender Strahlung. Ein Gray (Gy) entspricht einem Joule Strahlungsenergie, das von einem Kilogramm Materie aufgenommen wird; ein Nanogray (nGy) ist ein Milliardstel Gray.
longDefinition: Gray misst, wie viel Energie ionisierende Strahlung in Materie deponiert. Es ist eine Einheit der absorbierten Dosis und für sich allein kein Maß der biologischen Wirkung; für Strahlungsgrößen mit biologischer Gewichtung werden Sievert (Sv) verwendet. Im Eintrag zur Hintergrundstrahlung bedeutet 214 nGy pro Stunde eine absorbierte Dosisleistung von 214 Milliardstel Joule pro Kilogramm und Stunde. Populäre Vergleiche mit einer „Bananenäquivalentdosis“ werden üblicherweise in Sievert angegeben und lassen sich daher nicht direkt in Gray umrechnen.
