schemaVersion: 2
title: Pure acupuncture as sufficient surgical anesthesia
proposition:
  summary: >-
    From 1966 through the technique's broad retreat in the 1990s, Chinese science and health authorities treated
    acupuncture stimulation—sometimes alone and sometimes with only small amounts of auxiliary medication—as sufficiently
    reliable anesthesia for a wide range of major operations. Official promotion presented it as usable for chest,
    abdominal, cranial, and other surgery and as a substitute where anesthetic drugs or equipment were scarce.
correction:
  summary: >-
    Acupuncture can produce analgesia, but it does not by itself provide true general anesthesia or reliably supply the
    unconsciousness, complete pain control, muscle relaxation, and suppression of visceral and autonomic responses needed
    across major surgery. Conventional anesthetic techniques therefore remain necessary. Trials of acupuncture used
    alongside general anesthesia suggest that some methods may reduce anesthetic-drug requirements, but heterogeneous,
    low- to moderate-certainty adjunct evidence does not validate pure acupuncture as a broad replacement for anesthesia.
category: Anesthesiology and integrative medicine
reviewedAt: '2026-08-24'
impact:
  summary: >-
    This was a national medical program rather than a collection of isolated demonstrations. State science and health
    authorities organized research, hospitals and People's Liberation Army units carried it into practice, and state
    media promoted it for major surgery and austere settings. Later Chinese medical accounts describe indiscriminate
    expansion beyond suitable cases, followed by a gradual hospital retreat and a narrower turn toward selected
    indications and acupuncture-drug combinations.
  highlights:
    - value: '1966'
      label: State Science Commission and Ministry of Health established a national research plan
    - value: '400,000+'
      label: Patients reported by People's Daily as having undergone acupuncture-anesthesia operations by July 1971
    - value: '1990s'
      label: Most hospitals had stopped the old pure-acupuncture operations as their limitations became clearer
  context:
    - >-
      The disputed overreach is pure or near-pure acupuncture as the principal anesthetic for a broad range of major
      operations. It is not a denial that acupuncture can affect pain or that it may have a useful adjunctive perioperative
      role.
    - >-
      “Pure acupuncture” is a retrospective boundary rather than a uniform historical protocol. Contemporary accounts
      acknowledged pain and visceral discomfort, and some procedures used local or auxiliary drugs; a 1971 Guangdong
      operation, for example, required lidocaine when acupuncture analgesia was incomplete.
    - >-
      The figures of more than 400,000 operations and approximately 90 percent success were claims published by People's
      Daily during the national campaign. They document official scale and confidence, but they are not controlled outcome
      evidence and the source did not define a modern, procedure-specific success measure.
    - >-
      James Reston's widely publicized 1971 appendectomy did not use acupuncture as the surgical anesthetic. He received
      conventional anesthesia for the operation and acupuncture afterward for abdominal distension; the episode helped
      stimulate foreign interest but did not demonstrate acupuncture-only major surgery.
episodes:
  - id: china-1966-1999
    polity: People's Republic of China
    region: East Asia
    startYear: 1966
    endYear: 1999
    periodLabel: 1966–1990s
    strength: policy-basis
    institutionTypes:
      - government
      - medical
      - military
      - education
    institutions:
      - State Science and Technology Commission (国家科学技术委员会)
      - Ministry of Health of the People's Republic of China (卫生部)
      - Military Control Commission of the Ministry of Health (卫生部军管会)
      - Chinese People's Liberation Army General Hospital (中国人民解放军总医院)
    institutionalContext: >-
      On 28 February 1966 the State Science Commission and Ministry of Health convened a national research meeting in
      Shanghai and established a 1966–1968 acupuncture-anesthesia research plan, accelerating nationwide expansion. In
      September 1969 the Ministry of Health's Military Control Commission made the method an important wartime-health
      task. Hospitals, local health systems, research institutes, and PLA medical units then used it at large scale.
      Doubts and narrower case selection grew during the 1980s, and retrospective Chinese accounts say most hospitals
      stopped the old pure-acupuncture operations during the 1990s. The end year 1999 represents that gradual decade-long
      retreat; it is not the date of a national rescission.
    consequences:
      - National research planning and large-scale clinical rollout
      - Use of pure or near-pure acupuncture anesthesia in major chest, abdominal, cranial, and other operations
      - Promotion for rural, mountain, and wartime settings as an alternative where drugs or equipment were constrained
      - Training and diffusion through hospitals, local health services, research institutes, and PLA medical units
    summary: >-
      National science and health authorities turned acupuncture anesthesia into an organized research and clinical
      program in 1966. In 1971 People's Daily reported more than 400,000 operated patients, claimed approximately 90
      percent success, and promoted the method across major operations and resource-constrained settings. Practice was
      heterogeneous and sometimes included auxiliary medication, but the official message treated acupuncture as capable
      of replacing drug anesthesia far beyond carefully selected cases. As limitations became harder to ignore, hospitals
      gradually abandoned the old awake, pure-acupuncture model and later programs retained acupuncture chiefly in
      combination with conventional drugs.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Central science and health bodies set a national research plan and wartime-health task, while state media,
        civilian hospitals, local health systems, research institutes, and military medical units supplied publicity,
        training, research, and clinical adoption.
    institutionalCorrection:
      status: partial
      periodLabel: 1980s–2001 onward
      action: >-
        Hospitals gradually discontinued broad pure-acupuncture surgery, and from 2001 a Shanghai clinical program
        replaced the old awake technique with shallow-sleep, spontaneous-breathing acupuncture-drug combined anesthesia,
        selected narrower indications, and developed clinical guidance.
      summary: >-
        The professional retreat and explicit redesign corrected the claim in practice by treating acupuncture as an
        adjunct for selected cases rather than a universal substitute. The evidence reviewed does not identify a dated
        nationwide retraction by the State Science Commission or Ministry of Health, and the label “acupuncture anesthesia”
        remains in use for combined techniques, so the institutional correction is partial and distributed.
