    note: >-
      Czech state military-historical account describing brutal torture used to force confessions, the espionage,
      sabotage and conspiracy allegations, the heavy propaganda surrounding the trial, the 11 death sentences and three
      life sentences, and judicial rehabilitation in 1963.
  - title: The rise and fall of Bedřich Reicin
    url: https://www.vhu.cz/en/vzestup-a-pad-bedricha-reicina/
    publisher: Military History Institute Prague
