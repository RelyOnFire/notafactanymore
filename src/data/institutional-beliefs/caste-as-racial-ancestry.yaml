  institutionalContext: Risley’s earlier anthropometric work in Bengal supplied the intellectual framework, but the all-India
    institutional episode is dated from 1901. The Government of India’s Home Department formally sanctioned an Ethnographic
    Survey in connection with the census, while Census Commissioner Herbert Risley directed the census and served as honorary
    director of the ethnographic survey. Provincial superintendents and survey staff gathered and standardized caste and anthropometric
    material; those distributed field operations are described as machinery rather than listed as a single institution.
  consequences:
  - Racial classification of caste groups
  - Anthropometric data collection
  - Official ethnographic categories
  summary: Herbert Risley’s earlier anthropometric work classified Indian populations into racial types using measurements
    including the nasal index. In 1901 the Government of India formally sanctioned an all-India Ethnographic Survey in connection
    with the census, with Risley serving as Census Commissioner and directing the ethnographic work. The resulting 1901 Census
    report and 1903 ethnographic appendices treated physical measurements as evidence about race and caste hierarchy.
