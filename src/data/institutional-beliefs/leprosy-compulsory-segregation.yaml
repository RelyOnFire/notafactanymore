schemaVersion: 2
title: Leprosy as requiring prolonged compulsory segregation
proposition:
  summary: >-
    People with leprosy were treated as dangerous enough to require prolonged compulsory segregation even after
    effective chemotherapy had made a blanket isolation policy medically unnecessary.
correction:
  summary: >-
    Leprosy is transmissible, but transmission generally requires prolonged close contact with an untreated case.
    Effective treatment ends infectiousness, so medical care and follow-up may be necessary without prolonged blanket
    segregation of treated patients. Modern WHO guidance states that a patient stops transmitting the disease once treatment begins.
category: Medicine, infectious disease and public health
reviewedAt: '2026-09-19'
impact:
  summary: >-
    Hawaiʻi, the Philippines and Japan retained or did not fully dismantle compulsory-segregation frameworks after
    effective chemotherapy had undermined blanket isolation. Hawaiʻi introduced routine sulfone therapy in 1946;
    1949 reforms ended new admissions to Kalaupapa and limited quarantine to the infectious stage, while statutory
    segregation provisions remained until 1969. In the Philippines, a 1952 law still required isolation and segregation
    of bacteriologically positive people in the same year that DDS became generalized in the leprosaria; Congress
    reversed that default in 1964. In Japan, the Kumamoto District Court later held that the segregation law was clearly
    unconstitutional by 1960 at the latest, but the law remained until 1996.
  highlights:
    - value: '1946'
      label: routine sulfone therapy began in Hawaiʻi, starting a phased retreat from blanket isolation
    - value: 1952–1964
      label: Philippine law mandated segregation of bacteriologically positive people before Congress reversed the default
    - value: '1969'
      label: Hawaiʻi repealed the remaining statutory segregation provisions
    - value: 36 years
      label: selected Japanese accountability span from the court's latest 1960 threshold to repeal in 1996
  context:
    - >-
      Untreated leprosy can transmit. The claim being corrected is not “leprosy is contagious,” but that prolonged
      compulsory segregation remained necessary after effective treatment had made routine blanket isolation medically unjustified.
    - >-
      Hawaiʻi's 1946–1969 episode does not mean every patient remained continuously confined for those 23 years. Later
      legislative history dates the end of forced isolation to 1949; the archival record documents new admissions ending,
      quarantine narrowing to the infectious stage and increasing travel freedom still subject to health-department controls.
      The remaining statutory segregation provisions were repealed in 1969.
    - >-
      Philippine sulfones did not suddenly become universally available in 1952. Rodríguez reported that Promin had been
      introduced in 1946 but initially had to be bought by patients, that Diasone reached only a limited number, and that
      DDS became generalized in the leprosaria in 1952. This treatment chronology is not evidence that it caused Republic Act No. 753.
    - >-
      The Philippine 1952 law did not require every person with leprosy to be sent specifically to Culion. It assigned
      bacteriologically positive people to the Director of Hospitals for isolation and segregation within a system of
      hospitals, sanitaria and other institutions. The 1964 reform retained institutional treatment when medically required.
    - >-
      Republic Act No. 4073 made the Philippine reversal explicit in 1964. A 1966 rehabilitation law then stated that
      sulfone treatment had made prolonged confinement unnecessary for most patients and acknowledged the family,
      employment and emotional damage associated with that confinement.
    - >-
      Japan's 1960 date is a selected accountability threshold, not the beginning of segregation. The later verification
      report quotes the Kumamoto District Court's holding about the law and ministerial knowledge, then separately analyzes
      why the 1953 law remained in force until 1996.
episodes:
  - id: japan-1960-1996
    polity: Japan
    region: East Asia
    startYear: 1960
    endYear: 1996
    periodLabel: 1960 accountability anchor–1996 repeal
    strength: enforced-doctrine
    institutionTypes:
      - government
      - medical
    institutions:
      - Ministry of Health and Welfare of Japan
    institutionalContext: >-
      Japan's compulsory-segregation policy and the 1953 Leprosy Prevention Law predated this selected interval. The
      official Summary Version quotes the Kumamoto District Court's later holding that the law was clearly unconstitutional
      by 1960 at the latest and that the Minister of Health and Welfare then possessed, or could readily obtain, the medical
      information needed to assess segregation. The verification committee separately examined why the law was not
      repealed until 1996.
    consequences:
      - Continuation of a legal and administrative segregation regime after the selected 1960 accountability threshold
      - Restrictions on leaving sanatoria, family life, residence and social participation documented under the policy
      - Official reinforcement of fear and stigma that treated patients and former patients as continuing dangers
      - Cumulative human-rights injuries during the decades before the law's repeal
    summary: >-
      Japan maintained the 1953 segregation law after chemotherapy had undermined blanket isolation. The later Kumamoto
      District Court decision identified 1960 as the latest point by which the law's unconstitutionality was clear and
      the responsible minister had, or could readily obtain, the relevant medical knowledge. The verification committee
      later documented the policy's institutional persistence and accumulated harms. The law was not repealed until 1996.
    mechanism:
      kind: enforcement
      summary: >-
        National law, ministry administration and the sanatorium system continued to authorize and implement segregation.
        The selected interval tracks delayed institutional change after the court's accountability threshold; it does not
        imply that every affected person experienced identical confinement throughout those years.
    institutionalCorrection:
      status: corrected
      periodLabel: '1996'
      action: Japan repealed the 1953 Leprosy Prevention Law and ended its statutory segregation framework.
      summary: >-
        Repeal removed the compulsory legal framework. It did not erase the accumulated injuries or mean that prejudice
        and exclusion ended on the repeal date.
  - id: united-states-hawaii-1946-1969
    polity: United States — Hawaiʻi
    region: North America
    startYear: 1946
    endYear: 1969
    periodLabel: 1946 treatment transition–1969 repeal
    strength: policy-basis
    institutionTypes:
      - government
      - medical
    institutions:
      - Board of Hospitals and Settlement, Territory of Hawaiʻi
      - Board of Health, Territory of Hawaiʻi
      - Hawaiʻi Department of Health
    institutionalContext: >-
      Routine sulfone therapy began at Kalaupapa in May 1946, and by mid-1948 about 85 percent of patients were receiving
      one of the drugs voluntarily. On 1 July 1949, the legislature abolished the Board of Hospitals and Settlement and
      returned administration to the territorial Board of Health. The new policy ended new admissions to Kalaupapa,
      shifted new cases toward local hospital care and limited quarantine to the infectious stage. Later legislative
      history calls 1949 the end of forced isolation. Statutory segregation provisions nevertheless remained until 1969,
      and health-department controls continued during that interval.
    consequences:
      - Continued forced isolation during the initial transition from treatment availability to the 1949 reforms
      - Legal segregation provisions and health-department controls after blanket quarantine had been narrowed
      - Continuing effects of family separation, restricted movement and institutional stigma, with experiences varying among residents
      - Delayed statutory restoration of freedom to leave until 1969, despite increasing travel freedom before repeal
    summary: >-
      Hawaiʻi's retreat from compulsory isolation occurred in stages. Sulfone therapy began in 1946. The 1949
      administrative transfer brought no new Kalaupapa admissions, local treatment arrangements and quarantine limited
      to the infectious stage; later legislative history identifies that year as the end of forced isolation. Patients
      nevertheless remained subject to legal and administrative controls, including controlled travel, until the
      legislature repealed the segregation provisions in 1969.
    mechanism:
      kind: enforcement
      summary: >-
        The Board of Hospitals and Settlement administered the program until July 1949, after which the territorial Board
        of Health and later state health authorities controlled admission, quarantine and movement. Those rules narrowed
        before the compulsory statutory framework was finally repealed.
    institutionalCorrection:
      status: corrected
      periodLabel: 1949 operational reform; 1969 statutory repeal
      action: >-
        Hawaiʻi ended new admissions to Kalaupapa and limited quarantine to the infectious stage in 1949, then repealed
        the remaining statutory segregation provisions in 1969.
      summary: >-
        The 1949 reforms changed practice without granting unrestricted mobility to every resident. The 1969 repeal ended
        the compulsory legal framework while preserving care and residence guarantees for people who chose to remain.
  - id: philippines-1952-1964
    polity: Philippines
    region: Southeast Asia
    startYear: 1952
    endYear: 1964
    periodLabel: 18 June 1952–18 June 1964
    strength: enforced-doctrine
    institutionTypes:
      - government
      - medical
    institutions:
      - Philippine Department of Health — Director of Health
      - Bureau and Director of Hospitals
    institutionalContext: >-
      Republic Act No. 753, approved on 18 June 1952, empowered the Director of Health to order diagnostic procedures and
      required bacteriologically positive people to be turned over to the Director of Hospitals for isolation and
      segregation. It also imposed broad reporting duties, prohibited concealment or harboring intended to evade delivery,
      and authorized the Director of Hospitals to establish hospitals, sanitaria and other institutions. Rodríguez later
      reported that Promin had arrived in 1946 but was initially bought by patients, Diasone reached a limited number, and
      DDS became generalized in the leprosaria in 1952. On 18 June 1964, Republic Act No. 4073 reversed the statutory default.
    consequences:
      - Mandatory isolation and segregation of bacteriologically positive people under section 1058 of the 1952 statute
      - Reporting and delivery machinery involving health authorities, police and peace officers, and other people with reason to suspect a case
      - Statutory prohibition on concealing, harboring or supporting a person in concealment to prevent delivery to health authorities
      - Loss of connections with homes and families, employment and emotional security during prolonged confinement, as acknowledged by Congress in 1966
      - A 1964 transition to government clinics, rural health units or licensed physicians as the default, with institutional care retained when medically required
    summary: >-
      The Philippines retained a compulsory segregation rule in 1952, the same year that DDS became generalized in the
      leprosaria. Republic Act No. 753 converted a positive bacteriological finding into mandatory isolation and
      segregation through two named health offices. Twelve years later Congress explicitly reversed that default.
      Republic Act No. 4829 then acknowledged in 1966 that prolonged confinement had damaged family ties, employment
      and emotional security.
    mechanism:
      kind: enforcement
      summary: >-
        Republic Act No. 753 assigned diagnostic authority to the Director of Health and required transfer of
        bacteriologically positive people to the Director of Hospitals for isolation and segregation. Reporting duties,
        anti-concealment provisions and authority to establish institutions supported that statutory system.
    institutionalCorrection:
      status: corrected
      periodLabel: 18 June 1964
      action: >-
        Republic Act No. 4073 stated that people with leprosy were not to be confined in a leprosarium unless the disease
        required institutional treatment, and repealed the former control provisions.
      summary: >-
        Congress replaced compulsory segregation as the default with treatment through government skin clinics, rural
        health units or licensed physicians, while retaining institutional care when medically required.
