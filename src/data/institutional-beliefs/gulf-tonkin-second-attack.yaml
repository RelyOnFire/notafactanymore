evidence:
  - id: tonkin-nara-proposition
    sourceId: tonkin-nara-resolution
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: transcript, first whereas clause
    note: >-
      The primary statutory text says North Vietnamese naval units had deliberately and repeatedly attacked U.S. vessels,
      placing the disputed second incident inside Congress's factual premise.
  - id: tonkin-hanyok-correction
    sourceId: tonkin-hanyok
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: pp. 1–3, 40 and 47–49
    note: >-
      NSA historical reconstruction states that the agency had officially maintained the second incident occurred, but
      its expanded review of 122 relevant SIGINT products and other records concluded that no attack happened on 4 August
      and that the North Vietnamese navy was salvaging boats damaged on 2 August.
  - id: tonkin-nara-impact
    sourceId: tonkin-nara-resolution
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: historical note, paras. 1–9; transcript, §§1–3
    note: >-
      Provides the primary text of Public Law 88-408 and explains the real 2 August attack, disputed second incident,
      presidential reliance on the resolution as a legal basis and its January 1971 repeal.
  - id: tonkin-senate-impact
    sourceId: tonkin-senate-history
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: paras. 23–27 and 61–101
    note: >-
      Official Senate history documents rapid congressional consideration, the 416–0 House and 88–2 Senate votes, later
      investigation, Fulbright's regret and the resolution's role in the 1965 escalation.
  - id: tonkin-nara-consequences
    sourceId: tonkin-nara-resolution
    relation: documents
    target: {scope: episode, episodeId: united-states-1964-1971, aspect: consequences}
    locator: transcript, preamble and §§1–3
    note: >-
      The enacted resolution records the repeated-attack premise and grants the president authority to take all necessary
      measures against attacks and all necessary steps, including armed force, in defense of covered Southeast Asian states.
  - id: tonkin-hanyok-mechanism
    sourceId: tonkin-hanyok
    relation: supports
    target: {scope: episode, episodeId: united-states-1964-1971, aspect: mechanism}
    locator: pp. 2–3 and 47–49
    note: >-
      Finds that contrary SIGINT was omitted, fragments were removed from context and analytic or translation errors were
      used in summaries and the official chronology to sustain the attack interpretation.
  - id: tonkin-hanyok-context
    sourceId: tonkin-hanyok
    relation: contextualizes
    target: {scope: episode, episodeId: united-states-1964-1971, aspect: context}
    locator: pp. 4–12 and 47–49
    note: >-
      Distinguishes the real 2 August engagement from 4 August, explains the overlap between DESOTO and OPLAN 34A
      operations, and says the skewed reporting cannot be attributed to demonstrated White House pressure or a broad conspiracy.
  - id: tonkin-senate-carrier
    sourceId: tonkin-senate-history
    relation: documents
    target: {scope: episode, episodeId: united-states-1964-1971, aspect: carrier}
    locator: paras. 23–27 and 48–78
    note: >-
