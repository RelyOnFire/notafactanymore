title: Australia as terra nullius with no Indigenous land rights
claim: Australian common law treated the continent as if Indigenous peoples possessed no land rights recognizable
  by the common law at British acquisition of sovereignty, allowing the Crown's title to be treated as complete
  ownership rather than as a radical title burdened by surviving native title.
currentUnderstanding: In Mabo v Queensland (No 2) in 1992, the High Court of Australia rejected the legal assumptions
  associated with terra nullius. The Court held that Aboriginal and Torres Strait Islander peoples had their own
  laws and customs and that native title could survive the Crown's acquisition of sovereignty. The Crown acquired
  radical title, not automatic full beneficial ownership of every parcel of land. Native title could nevertheless
  be extinguished by valid governmental acts inconsistent with its continued existence.
category: Law, Indigenous land rights and colonial doctrine
reviewedAt: '2026-08-25'
impact:
  summary: The doctrine was embedded in Australian land law rather than remaining an abstract historical claim.
    In Cooper v Stuart in 1889, the Privy Council described New South Wales as practically unoccupied and without
    settled inhabitants or settled law when annexed. Australian courts later treated Indigenous customary land rights
    as legally unrecognised, including in the 1971 Gove land-rights case. Mabo reversed that foundation in 1992,
    and Parliament enacted the Native Title Act in 1993 to provide a statutory framework for recognition and protection
    of surviving native title.
  highlights:
  - value: 103 years
    label: from Cooper v Stuart in 1889 to the High Court's Mabo reversal in 1992
  - value: 6–1
    label: High Court majority recognising native title in Mabo (No 2)
  - value: '1993'
    label: year Parliament enacted the Native Title Act after Mabo
  context:
  - The phrase terra nullius is commonly used to describe the doctrine, but the card does not claim that British
    officials in 1788 formally proclaimed Australia under that Latin label. The legal assumption developed through
    colonial practice and later judicial doctrine.
  - 'Mabo did not invalidate British sovereignty over Australia. It distinguished sovereignty from ownership: the
    Crown''s acquisition of sovereignty gave it radical title and power to extinguish rights, but did not automatically
    erase all pre-existing Indigenous proprietary rights.'
  - The card does not attribute every act of Indigenous dispossession solely to terra nullius. Violence, legislation,
    pastoral expansion, reserves, removals and many other institutions also drove dispossession. The doctrine mattered
    because it denied a common-law starting point for Indigenous ownership.
