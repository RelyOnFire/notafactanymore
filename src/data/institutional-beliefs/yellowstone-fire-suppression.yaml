    locator: Resource Management Policy, pp. 17–18
    note: >-
      Primary policy text implementing the late-1960s shift: natural fire could run within predetermined management
      units when it served approved objectives, prescribed burning could substitute, and threatening or otherwise
      unauthorized fires remained subject to control.
