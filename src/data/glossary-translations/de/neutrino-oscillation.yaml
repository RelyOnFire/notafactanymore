entryId: neutrino-oscillation
sourceReviewedAt: '2026-08-21'
term: Neutrinooszillation
aliases:
- Neutrinooszillationen
shortDefinition: Der quantenmechanische Wechsel eines Neutrinos von einem Flavour zu einem anderen während seiner Ausbreitung.
longDefinition: Neutrinooszillation entsteht, weil Flavour-Zustände Mischungen von Zuständen mit unterschiedlichen Massen
  sind. Diese Massenzustände entwickeln während der Reise unterschiedliche quantenmechanische Phasen, sodass sich die
  Wahrscheinlichkeit für einen bestimmten gemessenen Flavour mit Entfernung und Energie verändert. Beobachtete Oszillationen
  zeigen daher, dass die beteiligten Massenzustände nicht alle dieselbe Masse haben können.
