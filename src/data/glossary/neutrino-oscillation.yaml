term: Neutrino oscillation
aliases:
- neutrino oscillations
- oscillation
shortDefinition: The quantum-mechanical change of a neutrino from one flavor to another as it travels.
longDefinition: Neutrino oscillation occurs because neutrino flavor states are mixtures of states with different masses.
  Those mass states evolve with different quantum phases during travel, so the probability of detecting a particular
  flavor changes with distance and energy. Observing oscillations therefore proves that the relevant neutrino mass states
  cannot all have identical mass.
relatedTerms:
- neutrino-flavor
- super-kamiokande
reviewedAt: '2026-08-21'
