term: Freies Radikal
aliases:
- freie Radikale
- Radikal
- Radikale
shortDefinition: Ein Atom, Molekül oder Molekülfragment mit mindestens einem ungepaarten Elektron.
longDefinition: 'Ein freies Radikal besitzt mindestens ein ungepaartes Elektron und ist deshalb häufig chemisch reaktiv.
  Die Lebensdauer von Radikalen variiert stark: Viele existieren nur extrem kurz, andere können beständig sein, wenn
  das ungepaarte Elektron delokalisiert ist oder große Molekülgruppen das reaktive Zentrum abschirmen. Stabile und persistente
  Radikale spielen in organischer Chemie, Materialwissenschaft, Biologie und Atmosphärenchemie wichtige Rollen.'
