  summary: After the 1948 VASKhNIL session, Lysenko's anti-Mendelian biology received state backing while orthodox
    geneticists were dismissed, laboratories were closed, and genetics teaching and research were restricted. The
    national prohibition unraveled only after Khrushchev's removal in 1964.
  sources:
  - title: Genetics in the Soviet Union
    url: https://www.nature.com/articles/162912a0
    publisher: Nature
    note: Contemporary 1948 account describing dismissals, laboratory closures, and removal of orthodox geneticists
      after the Academy decree.
  - title: 'The pushback against state interference in science: how Lysenkoism tried to suppress Genetics and how
      it was eventually defeated'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8664584/
    publisher: Genetics
    note: Historical review of state support for Lysenkoism, suppression of genetics, and rehabilitation after the
      Khrushchev era.
  - title: 'Lysenkoism Against Genetics: The Meeting of the Lenin All-Union Academy of Agricultural Sciences of
      August 1948, Its Background, Causes, and Aftermath'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6499510/
    publisher: Genetics
    note: Reviews the 1948 institutional takeover and concludes that Lysenkoism caused substantial losses in Soviet
      agriculture, genetics, evolutionary theory, molecular biology, and intergenerational scientific continuity.
  - title: Causes of Ukrainian Famine Mortality, 1932–33
    url: https://academic.oup.com/restud/article/92/5/3276/7754909
    publisher: The Review of Economic Studies
    note: Quantitative study of the Holodomor finding that migration restrictions and anti-Ukrainian bias in Soviet
      grain procurement and retention policy contributed to high Ukrainian famine mortality; used here to distinguish
      the famine’s documented policy mechanisms from Lysenko’s contemporaneous agricultural program.
- id: china-1949-1956
  polity: People's Republic of China
  region: East Asia
