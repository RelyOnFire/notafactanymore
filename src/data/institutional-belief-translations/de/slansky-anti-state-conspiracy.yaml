schemaVersion: 2
locale: de
entryId: slansky-anti-state-conspiracy
sourceReviewedAt: '2026-09-25'
title: Die Slánský-Gruppe als staatsfeindliches Verschwörungszentrum
proposition:
  summary: >-
    Die Führung der Kommunistischen Partei, die Staatssicherheit, die Staatsanwaltschaft und das Staatsgericht der
    Tschechoslowakei behaupteten, Rudolf Slánský leite ein staatsfeindliches Verschwörungszentrum, das für westliche
    Nachrichtendienste und verwandte ideologische Feinde Spionage, Sabotage und Verrat betreibe und dem Titoismus sowie
    Trotzkismus anzulasten seien. Erzwungene, einstudierte Geständnisse und ein staatlich gelenkter öffentlicher Prozess
    stellten die konstruierte Verschwörung als erwiesene Tatsache dar.
correction:
  summary: >-
    Tschechische Staatsarchive und Geschichtsinstitutionen beschreiben den Fall als konstruierten politischen Prozess.
    Ermittler erzwangen mit körperlicher und psychischer Gewalt vorbestimmte Geständnisse; die Angeklagten übten
    Antworten ein, die einem detaillierten Drehbuch entsprachen. Die rechtliche Korrektur erfolgte in Etappen: Die
    Urteile gegen Artur London und Vavro Hajdů wurden 1956 aufgehoben; Evžen Löbl kam 1960 durch eine Amnestie frei und
    wurde 1963 rehabilitiert; bis 1963 wurden auch die übrigen Prozessurteile einschließlich des Urteils gegen Slánský
    gerichtlich aufgehoben. Das bedeutete keine gemeinsame parteiinterne Rehabilitation. Die KSČ bestätigte 1963
    weiterhin den Ausschluss Slánskýs und mehrerer Mitangeklagter; Slánský wurde erst 1968 von der Partei rehabilitiert.
impact:
  summary: >-
    Vom 20. bis 27. November 1952 standen 14 Angeklagte vor dem Staatsgericht in Prag. Elf wurden zum Tode verurteilt
    und am 3. Dezember im Gefängnis Pankrác gehängt; Artur London, Vavro Hajdů und Evžen Löbl erhielten lebenslange
    Haftstrafen. Mehr als 8.500 Petitionen unterstützten die Urteile, die meisten verlangten den Tod aller Angeklagten.
    Der Staat zeichnete das Verfahren für Propagandazwecke auf, der Tschechoslowakische Rundfunk sendete ausgewählte
    Tonaufnahmen. Der Staatsanwalt ordnete elf Angeklagte ausdrücklich als Menschen „jüdischer Herkunft“ ein; Zionismus
    und eine angeblich jüdisch verbundene ausländische Verschwörung wurden zu zentralen Anklagemotiven. Die gerichtliche
    Korrektur war 1963 abgeschlossen, die parteiinterne blieb selektiv und folgte später. Am 22. August 1963 erschien in
    Rudé právo eine amtliche Darstellung, obwohl die vollständige Überprüfung innerhalb des Parteiapparats kontrolliert blieb.
  highlights:
    - value: '14'
      label: Angeklagte im Prozess vom 20. bis 27. November 1952
    - value: '11'
      label: zum Tode verurteilte und am 3. Dezember 1952 hingerichtete Angeklagte
    - value: mehr als 8.500
      label: Petitionen zur Unterstützung der Urteile; die meisten verlangten den Tod aller Angeklagten
  context:
    - >-
      „Jüdische Herkunft“ war eine von der Anklage aufgezwungene Einordnung: Elf der 14 Angeklagten wurden so bezeichnet.
      Die Prozesssprache verband jüdische Abstammung und „Zionismus“ mit westlichem Imperialismus und gab der Anklage
      unabhängig von der tatsächlichen Religionsausübung oder Haltung der Angeklagten zum Zionismus eine ausgeprägt
      antisemitische Dimension.
    - >-
      Sowjetische Berater beaufsichtigten die Ermittlungen und prüften Verhörpläne. Neuere Archivforschung warnt jedoch
      davor, Prag nur als Vollstrecker eines vollständig sowjetischen Plans zu betrachten. Denunziationen, Rivalitäten
      und Entscheidungen innerhalb der tschechoslowakischen Kommunistischen Partei waren für Slánskýs Sturz und die
      antisemitische Wendung zentral.
    - >-
      Die Aufhebung des konstruierten Verfahrens erklärte nicht jedes sonstige politische Handeln aller Angeklagten für
      rechtmäßig. Slánský, Reicin und einige Mitangeklagte hatten an früherer kommunistischer Repression mitgewirkt. Das
      Militärhistorische Institut unterscheidet etwa die erfundenen Vorwürfe gegen Reicin von belegten Übergriffen in
      seinen früheren Ämtern.
    - >-
      Die drei lebenslangen Haftstrafen zeigen, warum „1963 rehabilitiert“ zu stark verkürzt. London und Hajdů erreichten
      1956 die Aufhebung ihrer Urteile und ihre Freilassung; Löbl blieb bis zur Amnestie von 1960 in Haft und wurde 1963
      rehabilitiert.
    - >-
      Die Korrektur von 1963 war öffentlich, aber begrenzt. Rudé právo berichtete über die gerichtlichen Ergebnisse,
      während die KSČ die Rechtsbrüche vor allem Sicherheitsfunktionären anlastete, ihre volle institutionelle
      Verantwortung nicht offenlegte und Slánskýs Parteiausschluss ausdrücklich bis 1968 aufrechterhielt.
episodes:
  - id: czechoslovakia-1949-1968
    polity: Tschechoslowakei
    institutions:
      - Führung der Kommunistischen Partei der Tschechoslowakei (KSČ)
      - Ministerium für Nationale Sicherheit und Staatssicherheit (StB)
      - Staatsanwaltschaft — Chefankläger Josef Urválek
      - Staatsgericht in Prag — Senat unter dem Vorsitz von Jaroslav Novák
      - Tschechoslowakischer Rundfunk und parteistaatliche Presse
    institutionalContext: >-
      Evžen Löbl, der erste der späteren Angeklagten, wurde im Herbst 1949 festgenommen; Slánský folgte am 23. November
      1951. KSČ-Führung, Ermittler der Staatssicherheit, Staatsanwälte und Richter konstruierten aus Funktionären mit
      unterschiedlichen Lebensläufen ein einziges „staatsfeindliches Verschwörungszentrum“. Sowjetische Berater prüften
      die Verhörpläne; die Ermittler erzwangen in langen Verhören mit körperlichem und psychischem Druck vorbestimmte,
      einstudierte Geständnisse. In der öffentlichen Verhandlung vom 20. bis 27. November 1952 erhob Chefankläger Josef
      Urválek vor dem von Jaroslav Novák geleiteten Senat des Staatsgerichts Vorwürfe der Spionage, Sabotage, des Verrats,
      Titoismus und Zionismus. Das Gericht verurteilte alle 14 Angeklagten; elf wurden sechs Tage später hingerichtet.
      Film und Ton wurden für Propagandazwecke produziert, ausgewählte Tonaufnahmen noch während des Prozesses gesendet.
      Gerichte beseitigten die Urteile 1956 und 1963, während die Parteirehabilitierung bis zur politischen Öffnung von
      1968 selektiv blieb.
    consequences:
      - Hinrichtung von elf Angeklagten nach einem konstruierten politischen Verfahren
      - Lebenslange Haft für Artur London, Vavro Hajdů und Evžen Löbl mit später gestaffelter Freilassung und gerichtlicher Rehabilitation
      - Institutioneller Einsatz körperlicher und psychischer Gewalt, langer Verhöre und einstudierter Geständnisse
      - Landesweite Presse- und Rundfunkkampagne, die das angebliche Verschwörungszentrum als existenziellen inneren Feind darstellte
      - Mobilisierung von mehr als 8.500 unterstützenden Petitionen, von denen die meisten den Tod aller Angeklagten verlangten
      - Amtliche Verstärkung antisemitischer und antizionistischer Narrative durch Auswahl und Kennzeichnung der Angeklagten
      - Schrittweise gerichtliche Korrektur bis 1963 und begrenzte parteiinterne Aufarbeitung ohne Wiederherstellung von Slánskýs Stellung vor 1968
    summary: >-
      Partei, Staatssicherheit, Staatsanwaltschaft, Justiz und Medien verwandelten eine konstruierte Verschwörung in
      Strafurteile, Hinrichtungen und eine landesweite Propagandakampagne. Die Gerichte hoben die Verfahren zwischen 1956
      und 1963 schrittweise auf. Die Partei räumte 1963 öffentlich schwere Rechtsbrüche ein, hielt jedoch Ausschlüsse
      aufrecht und lenkte Verantwortung von ihrer Führung weg; innerhalb der KSČ wurde Slánský erst 1968 rehabilitiert.
    mechanism:
      summary: >-
        KSČ-Führung und Staatssicherheit stellten die Angeklagtengruppe zusammen, Zwang erzeugte vorbestimmte
        Geständnisse, Staatsanwaltschaft und Staatsgericht überführten das Drehbuch in Strafurteile, Rundfunk und Presse
        machten diese Urteile zur amtlichen öffentlichen Darstellung.
    institutionalCorrection:
      periodLabel: 1956–1968
      action: >-
        Tschechoslowakische Gerichte hoben die Prozessurteile schrittweise auf; die KSČ stellte Slánskýs Parteistellung
        1968 wieder her, nachdem sie dies 1963 abgelehnt hatte.
      summary: >-
        London und Hajdů wurden 1956 gerichtlich entlastet; Löbl und die übrigen Prozessfälle waren bis 1963 gerichtlich
        rehabilitiert. Die KSČ-Überprüfung von 1963 erkannte konstruierte Anklagen an, hielt jedoch ausgewählte
        Parteiausschlüsse aufrecht und verschleierte die Verantwortung der Parteiführung. Slánskýs Parteirehabilitierung
        im Jahr 1968 schloss die hier erfasste institutionelle Umkehr ab.
evidence:
  - id: slansky-vhu-proposition
    note: >-
      Die staatliche militärhistorische Darstellung benennt die Spionage-, Sabotage- und Verschwörungsvorwürfe, Josef
      Urváleks Rolle als Ankläger, die Kennzeichnung von elf Angeklagten als Menschen jüdischer Herkunft und den
      sechsseitigen Abdruck der Anklage in der Armeezeitung Obrana lidu.
  - id: slansky-vhu-correction
    note: >-
      Dokumentiert die Aufhebung von Reicins Urteil durch das Militärkollegium am 17. Mai 1963 und unterscheidet das
      konstruierte, manipulierte Slánský-Verfahren von gesonderten Übergriffen, für die Reicin verantwortlich war.
  - id: slansky-archive-correction
    note: >-
      Das Nationalarchiv bezeichnet den Prozess als konstruiert und dokumentiert Verhörpläne, die Prüfung durch
      sowjetische Berater, grausame körperliche und psychische Gewalt, vorbestimmte Geständnisse und einstudierte Antworten vor Gericht.
  - id: slansky-ustr-correction
    note: >-
      Beschreibt das Ergebnis der Kolder-Kommission von 1963, wonach die kommunistischen Prozesse konstruiert und
      rechtswidrig waren, die rechtliche Rehabilitierung der Slánský-Gruppe sowie den Versuch, die Verantwortung der
      KSČ-Führung in der Überprüfung kleinzureden.
  - id: slansky-vhu-impact
    note: >-
      Verzeichnet die 14 Angeklagten, einstudierte Aussagen, mehr als 8.500 unterstützende Petitionen, elf Todesurteile,
      drei lebenslange Haftstrafen, Gottwalds Ablehnung einer Begnadigung und die Hinrichtungen in der Nacht zum 3. Dezember 1952.
  - id: slansky-archive-impact
    note: >-
      Dokumentiert sämtliche Strafen, die Anfertigung von Film- und Tonaufnahmen für Propagandazwecke, ausgewählte
      Rundfunksendungen, die Forderung des Staatsanwalts nach Todesurteilen für alle und gefilmte Erklärungen zur Annahme der Urteile.
  - id: slansky-vhu-carrier
    note: >-
      Benennt die KSČ-Führung, sowjetische Berater, die StB und Chefankläger Josef Urválek und verfolgt die Festnahmen von
      Löbl 1949 über Slánský 1951 bis zum Prozess im November 1952.
  - id: slansky-archive-carrier
    note: >-
      Benennt die tschechoslowakischen Sicherheits-, Partei- und Justizorgane, den von Jaroslav Novák geleiteten Senat des
      Staatsgerichts, Chefankläger Josef Urválek sowie die weiteren Staatsanwälte und Richter.
  - id: slansky-vhu-mechanism
    note: >-
      Beschreibt körperlichen Druck, lange Verhöre und wiederholtes Einüben der von Ermittlern verfassten Aussagen,
      gefolgt von Anklagen wegen Spionage, Trotzkismus, Titoismus, Verschwörung und Sabotage.
  - id: slansky-archive-mechanism
    note: >-
      Verbindet die Zwangsermittlungen und die inszenierte Verhandlung mit dem Urteil des Staatsgerichts sowie der
      gezielten Aufzeichnung und selektiven Rundfunkausstrahlung des Verfahrens zu Propagandazwecken.
  - id: slansky-audio-mechanism
    note: >-
      Der Archivführer zu den Originalaufnahmen benennt Staatsgericht, Richter Novák und Staatsanwalt Urválek, erschließt
      die Aussagen zum Zionismus und die Schlussvorträge und verzeichnet Urteile sowie Rechtsmittelverzicht der Angeklagten.
  - id: slansky-jmh-mechanism
    note: >-
      Neuere Archivforschung berücksichtigt das sowjetisch-tschechoslowakische Zusammenwirken, bewertet jedoch lokale
      Denunziationen und politische Dynamiken innerhalb der KSČ als ausschlaggebend und korrigiert damit ein einseitiges Bild sowjetischer Steuerung.
  - id: slansky-vhu-consequences
    note: >-
      Verbindet erzwungene Geständnisse, die Auswahl von elf als jüdisch bezeichneten Angeklagten, die propagandistische
      Verbreitung, öffentliche Petitionen, elf Hinrichtungen und drei lebenslange Haftstrafen.
  - id: slansky-archive-consequences
    note: >-
      Bestätigt die Verurteilung aller 14 Angeklagten, benennt die elf Todes- und drei lebenslangen Haftstrafen und
      dokumentiert die Ausstrahlung ausgewählter Prozessaufnahmen durch den Tschechoslowakischen Rundfunk.
  - id: slansky-jmh-consequences
    note: >-
      Die begutachtete Studie hält fest, dass der Staatsanwalt elf von 14 Angeklagten als Menschen jüdischer Herkunft
      bezeichnete, und untersucht, wie der Fall das frühere Tabu antisemitischer Rhetorik innerhalb der Partei brach.
  - id: slansky-abs-correction
    note: >-
      Der amtliche Archivführer definiert die Sammlung der Rehabilitierungsakten als Unterlagen zu Personen, die in
      Verfahren von 1949 bis 1954 verurteilt und vom Obersten Gericht vollständig rehabilitiert wurden. Er belegt die
      Herkunft der Sammlung, kein fallspezifisches Slánský-Urteil.
  - id: slansky-london-correction
    note: >-
      Verzeichnet, dass ein neues Gerichtsurteil Anfang Februar 1956 Londons Verurteilung und Anklage aufhob und er nach
      einer früheren Herabsetzung der lebenslangen Strafe freikam.
  - id: slansky-hajdu-correction
    note: >-
      Verzeichnet Hajdůs vollständige Rehabilitierung und Freilassung im Mai 1956 nach Überprüfung seiner lebenslangen Haftstrafe.
  - id: slansky-lobl-correction
    note: >-
      Unterscheidet Löbls Freilassung aufgrund der Präsidentenamnestie von 1960 von seiner gerichtlichen Rehabilitierung im Jahr 1963.
  - id: slansky-icj-correction
    note: >-
      Gibt den Inhalt der amtlichen Darstellung in Rudé právo vom 22. August 1963 wieder: die Rehabilitierung Slánskýs
      durch das Oberste Gericht, die Wiederaufnahme mancher Mitglieder und die ausdrückliche Bestätigung des
      Parteiausschlusses von Slánský und mehreren Mitangeklagten.
  - id: slansky-ustr-institutional-correction
    note: >-
      Zeigt, dass die Kolder-Kommission die Verfahren als konstruiert und rechtswidrig bezeichnete, die Schuld aber vor
      allem der Staatssicherheit, weniger der Justiz und nicht der Parteiführung zuschrieb, und verdeutlicht damit die Grenzen der Aufarbeitung von 1963.
  - id: slansky-party-correction
    note: >-
      Das gemeinsame Projekt von Nationalarchiv und ÚSTR unterscheidet Slánskýs gerichtliche Rehabilitierung 1963 von
      seiner Rehabilitierung durch die Partei 1968.
