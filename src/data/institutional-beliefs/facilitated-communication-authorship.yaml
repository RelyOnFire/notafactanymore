    sourceId: syracuse-soe-history
    relation: documents
    target: {scope: belief, aspect: proposition}
    note: >-
      Syracuse's institutional history records that the Facilitated Communication Institute opened in 1992 to study and
      promote communication by people with autism and other developmental disabilities and was later renamed.
  - id: fc-experiment-correction
    sourceId: fc-experimental-1993
    relation: supports
    target: {scope: belief, aspect: correction}
    note: >-
      A 1993 controlled study found that when participants and facilitators saw different pictures, typed answers matched
      the pictures shown to facilitators, demonstrating that facilitators were unknowingly determining the output.
  - id: fc-asha-correction
    sourceId: asha-fc-2018
    relation: supports
    target: {scope: belief, aspect: correction}
    note: >-
      ASHA's 2018 position statement calls facilitated communication discredited, says extensive evidence shows facilitator
      authorship, and states that FC output should not be considered the disabled person's communication.
  - id: fc-systematic-correction
    sourceId: fc-authorship-systematic-review
    relation: supports
    target: {scope: belief, aspect: correction}
    note: >-
      Systematic review finding unequivocal experimental evidence of facilitator control over messages produced through facilitated communication.
