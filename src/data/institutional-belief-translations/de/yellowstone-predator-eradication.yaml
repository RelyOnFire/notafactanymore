locale: de
entryId: yellowstone-predator-eradication
sourceReviewedAt: '2026-08-27'
title: Ausrottung großer Beutegreifer im Yellowstone
claim: Wölfe und andere große Beutegreifer im Yellowstone wurden als schädliche Konkurrenten behandelt, deren Entfernung erwünschte Wildarten wie Hirsche und Wapitis schützen und das Wildtiermanagement verbessern sollte.
currentUnderstanding: Beutegreifer können Beutebestände verringern und mit Viehhaltung oder menschlichen Zielen in Konflikt geraten. Einheimische Spitzenprädatoren sind jedoch zugleich Bestandteile funktionierender Ökosysteme. Ihre Entfernung kann Räuber-Beute-Beziehungen, das Nahrungsangebot für Aasfresser, Zahl und Verhalten von Pflanzenfressern sowie die Vegetation verändern. Yellowstone behandelt Wölfe heute als wiederhergestellte einheimische Art und wichtigen Bestandteil des Nahrungsnetzes.
impact:
  summary: Die Raubtierbekämpfung im Yellowstone setzte eine vereinfachte Managementannahme unmittelbar in Ausrottung um. Parkbehörden töteten Wölfe und andere Karnivoren, um als wertvoller betrachtete Arten zu schützen. Wölfe verschwanden als reproduzierende Population; ihre spätere Rückkehr erforderte bundesrechtlichen Schutz, jahrzehntelange Planung und aktive Wiederansiedlung.
  highlights:
  - value: 136+
    label: Von 1914 bis 1926 im Yellowstone getötete Wölfe laut National Park Service
  - value: '1926'
    label: Das letzte bekannte Wolfsrudel im Yellowstone wurde getötet
  - value: '1995'
    label: Nach fast sieben Jahrzehnten ohne ansässiges Rudel begann die staatliche Wiederansiedlung
  context:
  - Die populäre Erzählung, Wölfe allein hätten Flüsse und Vegetation des Yellowstone grundlegend verändert, ist zu simpel. Über Stärke und Ursache trophischer Kaskaden wird weiter geforscht, weil gleichzeitig Klima, Jagd, Bären, Pumas, Grundwasser und andere Faktoren wirkten.
  - "Die belastbare Korrektur ist enger: Wer große Beutegreifer nur als schädliche Konkurrenten betrachtete, übersah wichtige ökologische Funktionen und machte ihre gezielte Entfernung selbst zu einem tiefen Eingriff in das Ökosystem."
episodes:
- id: united-states-yellowstone-1886-1926
  polity: Vereinigte Staaten
  institutions:
  - Verwaltung des Yellowstone-Nationalparks durch die US-Armee
  - U.S. National Park Service
  institutionalContext: Im späten 19. und frühen 20. Jahrhundert beteiligte sich die Yellowstone-Verwaltung an der nordamerikanischen Bekämpfung großer Beutegreifer. Nach eigener Darstellung des National Park Service betrachteten frühe Parkmanager Wölfe mangels eines modernen Ökosystemverständnisses als schädlich und gingen gegen Wölfe, Bären, Pumas und Kojoten vor, um Vieh und „erwünschte“ Wildtiere wie Hirsche und Wapitis zu schützen. Diese Logik setzte sich nach der Gründung des National Park Service 1916 fort.
  consequences:
  - Zwischen 1914 und 1926 wurden im Yellowstone mindestens 136 Wölfe getötet
  - 1926 wurde das letzte bekannte Wolfsrudel des Parks getötet; spätere Untersuchungen fanden keine ansässige reproduzierende Population mehr
  - Mit den Wölfen verschwanden ökologische Wechselwirkungen eines einheimischen Spitzenprädators aus dem Räuber-Beute-System des Parks
  - Die Wiederherstellung erforderte später Schutz nach dem Endangered Species Act, ein Umweltprüfungsverfahren und aktive Umsiedlungen ab 1995
  summary: Die frühe Raubtierpolitik des Yellowstone teilte Wildtiere in schützenswerte Arten und Räuber ein, die mit ihnen konkurrierten. Wölfe wurden deshalb nicht nur in kleiner Zahl geduldet, sondern gezielt entfernt. Von 1914 bis 1926 wurden mindestens 136 im Park getötet; 1926 verschwand das letzte bekannte Rudel. In den 1960er-Jahren verschob sich die Denkweise des National Park Service hin zum Erhalt natürlicher Prozesse, später unterstützte das bundesweite Artenschutzrecht die Erholung. Von 1995 bis 1997 wurden Wölfe wiederangesiedelt. Wie stark sie jede spätere Vegetationsveränderung verursachten, bleibt Gegenstand wissenschaftlicher Debatte; die alte Vorstellung, ihre ökologische Rolle bestehe lediglich im Töten erwünschter Beute, hielt jedoch nicht stand.
