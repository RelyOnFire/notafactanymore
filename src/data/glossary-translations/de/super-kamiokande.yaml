term: Super-Kamiokande
aliases:
- Super-K
shortDefinition: Ein großer unterirdischer Neutrinodetektor in Japan, der einen riesigen Tank mit hochreinem Wasser und
  Lichtsensoren nutzt, um Neutrinowechselwirkungen nachzuweisen.
longDefinition: Super-Kamiokande ist ein Wasser-Cherenkov-Detektor rund einen Kilometer unter der Erde in Japan. Geladene
  Teilchen, die bei Neutrinowechselwirkungen im Wasser entstehen, können schwaches Cherenkov-Licht aussenden, das von
  Tausenden Photomultipliern registriert wird. Die Ergebnisse zu atmosphärischen Neutrinos von 1998 lieferten überzeugende
  Belege für Neutrinooszillation und damit für eine von null verschiedene Neutrinomasse.
