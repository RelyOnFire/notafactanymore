schemaVersion: 2
locale: de
entryId: geopathic-road-hazards
sourceReviewedAt: 2026-08-23
title: Geopathische Kraftfelder als Verkehrssicherheitsrisiko
proposition:
  summary: >-
    Unsichtbare „Erdstrahlen“ oder radiästhetische Kraftfelder an bestimmten Straßenabschnitten galten als mögliche Ursache
    für Beeinträchtigungen von Autofahrern und Unfallhäufungen; energetische Eingriffe sollten diese Gefahr neutralisieren können.
correction:
  summary: >-
    Es gibt keine reproduzierbaren Belege für die bei diesen Maßnahmen behaupteten örtlichen radiästhetischen Kraftfelder,
    für eine Wünschelruten- oder Pendelmethode zu ihrer zuverlässigen Erkennung oder für eine energetische Behandlung,
    die sie neutralisiert. Sinkende Unfallzahlen nach einem Eingriff belegen für sich allein keine Ursache, insbesondere wenn
    gleichzeitig konventionelle Verkehrssicherheitsmaßnahmen umgesetzt werden und normale statistische Schwankungen eine Rolle spielen.
episodes:
  - id: austria-2003-2008
    polity: Österreich
    institutionalContext: >-
      Die ASFINAG setzte die radiästhetischen Maßnahmen neben gewöhnlichen Verkehrssicherheitsmaßnahmen ein und nicht als
      vollständigen Ersatz konventioneller Technik. Zeitgenössische Berichte dokumentierten gleichzeitige Änderungen wie
      neue Straßenbeläge und abweichende Unfallzahlen der Polizei; ein ASFINAG-Sprecher räumte zudem ein, dass konventionelle
      Maßnahmen scheinbare Verbesserungen erklären könnten, die den esoterischen Eingriffen zugeschrieben wurden.
    summary: >-
      In den 2000er-Jahren setzte der staatliche Autobahnbetreiber ASFINAG an mehreren Unfallhäufungsstellen Wünschelrutengänger
      und andere „energetische“ Maßnahmen ein. 2003 berichtete ein ASFINAG-Sprecher von seit Jahren angewandten Maßnahmen
      zur Ableitung angeblicher Erdstrahlen und kündigte einen Rutengänger für die S16 Arlberg Schnellstraße an; Rückgänge
      bei Unfallzahlen an anderen Strecken wurden dabei mit solchen Eingriffen in Verbindung gebracht. Später stellte die
      ASFINAG auf ihrer Website „esoterische Maßnahmen bei Unfallhäufungsstellen“ mit positiven Vorher-nachher-Zahlen dar.
      Zeitgenössische Berichte dokumentierten zugleich konventionelle Sicherheitsmaßnahmen und abweichende Polizeizahlen,
      sodass aus dem zeitlichen Rückgang keine Wirksamkeit der energetischen Eingriffe abgeleitet werden konnte.
    consequences:
      - Wünschelrutengänger und Pendelpraktiker wurden an unfallträchtigen Autobahn- und Schnellstraßenabschnitten eingesetzt
      - Quarzsteine, Magnetfeldscheiben und andere angeblich energetische Vorrichtungen sollten schädliche Felder ableiten oder neutralisieren
      - Die ASFINAG präsentierte sinkende Unfallzahlen nach einzelnen Eingriffen öffentlich als positive Erfahrung mit den Maßnahmen
    institutions:
      - ASFINAG
    mechanism:
      summary: >-
        Die ASFINAG beauftragte Wünschelrutengänger und installierte angeblich energetische Vorrichtungen an Unfallhäufungsstellen,
        wodurch radiästhetische Erklärungen und Eingriffe neben konventionellen Maßnahmen in das Verkehrssicherheitsmanagement gelangten.
    institutionalCorrection:
      summary: >-
        Zeitgenössische Berichte dokumentierten wissenschaftliche und interne Zurückhaltung bei der Zuschreibung sinkender
        Unfallzahlen an energetische Eingriffe; ein datierter ASFINAG-Beschluss zur formellen Abkehr ist jedoch nicht belegt.
evidence:
  - id: geopathic-standard-proposition
    note: >-
      Zeitgenössischer Bericht von 2003, der einen ASFINAG-Sprecher zur bisherigen Nutzung von Wünschelrutengängern,
      Quarzsteinen und Magnetfeldscheiben, zum behaupteten Wirkmechanismus auf Fahrer und zu Plänen für die S16 zitiert.
  - id: geopathic-usgs-correction
    note: >-
      Fasst das Scheitern von Wünschelrutenbehauptungen bei wissenschaftlicher Prüfung zusammen und verweist auf gewöhnliche
      geologische und hydrologische Verfahren statt radiästhetischer Schlussfolgerungen.
  - id: geopathic-standard-carrier
  - id: geopathic-zeit-mechanism
    note: >-
      Dokumentiert den Eingriff an der S16, zitiert die damalige ASFINAG-Webseite mit positiven Unfallzahlen, hält die
      Entscheidung zur Fortsetzung fest und weist auf abweichende Polizeizahlen sowie gleichzeitige konventionelle Sicherheitsmaßnahmen hin.
  - id: geopathic-zeit-consequences
  - id: geopathic-diepresse-context
    note: >-
      Rückblick von 2008 über ASFINAG-Ausgaben für Wünschelrutengänger; ein eigener Sprecher räumt ein, dass konventionelle
      Änderungen wie ein neuer Straßenbelag scheinbare Verbesserungen erklären könnten, die den esoterischen Maßnahmen zugeschrieben wurden.
