term: Ribozym
aliases:
- Ribozyme
- katalytische RNA
shortDefinition: Ein RNA-Molekül, das eine chemische Reaktion katalysieren kann.
longDefinition: Ribozyme sind RNA-Moleküle mit katalytischer Aktivität. Ihre Entdeckung Anfang der 1980er-Jahre widerlegte
  die Annahme, biologische Katalyse sei ausschließlich Proteinen vorbehalten. Bekannte Ribozyme katalysieren unter anderem
  RNA-Spaltung, Verknüpfung und Verarbeitung; auch das peptidbindungsbildende Zentrum des Ribosoms beruht wesentlich
  auf RNA.
