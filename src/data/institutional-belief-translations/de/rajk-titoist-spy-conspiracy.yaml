schemaVersion: 2
locale: de
entryId: rajk-titoist-spy-conspiracy
sourceReviewedAt: '2026-08-25'
title: Die Rajk-Gruppe als titoistisches Spionagenetz
proposition:
  summary: >-
    Ungarns kommunistische Partei, Staatssicherheit und Justiz stellten László Rajk und ein immer weiter ausgedehntes
    Netzwerk von Funktionären als Mitglieder einer imperialistischen und titoistischen Spionageverschwörung gegen den
    ungarischen Staat dar. Konstruierte Beschuldigungen und erzwungene Aussagen machten die angebliche Verschwörung zur
    öffentlichen Tatsache und zur Grundlage weiterer Säuberungen.
correction:
  summary: >-
    Ungarische Archive ordnen die Rajk-Verfahren heute als konstruierte politische Schauprozesse ein und bezeichnen die
    Vorwürfe gegen Rajk als erfunden. Die ursprünglichen Spionagebeschuldigungen wurden während der Ermittlungen umgebaut,
    unter anderem zu angeblichen Verbindungen zu Titos Jugoslawien. Rajk und weitere Angeklagte wurden hingerichtet oder
    inhaftiert; zahlreiche verbundene Verfahren, Verurteilungen und Internierungen folgten. Rajk wurde 1956 rehabilitiert.
impact:
  summary: >-
    Der Rajk-Fall wurde zu einem Säuberungsmechanismus, der weit über den Hauptprozess vom September 1949 hinausging.
    Eine Aufstellung des ungarischen Innenministeriums von 1964 ergab, dass im weiteren Rajk-Komplex gegen 155 Menschen
    Verfahren eingeleitet worden waren: 97 wurden verurteilt, 50 interniert und 15 hingerichtet. Während der
    Entstalinisierung wurde der Fall überprüft; Rajk wurde 1956 rehabilitiert, und seine öffentliche Wiederbestattung im
    Oktober wurde zu einer Massendemonstration gegen das Rákosi-System.
  highlights:
    - value: '155'
      label: Menschen, gegen die laut einer Aufstellung des Innenministeriums von 1964 im weiteren Rajk-Komplex Verfahren eingeleitet wurden
    - value: '97'
      label: Verurteilungen in diesen mit dem Rajk-Komplex verbundenen Verfahren
    - value: '15'
      label: Hinrichtungen im weiteren Rajk-Komplex laut derselben amtlichen Überprüfung
  context:
    - >-
      Die Zahlen 155, 97 und 15 beziehen sich auf den weiteren Komplex von Verfahren, den das Innenministerium später
      dem Rajk-Fall zuordnete, nicht auf den öffentlichen Hauptprozess allein.
    - >-
      Die politische Erzählung veränderte sich während der Untersuchung: Zu frühen erfundenen Spionagevorwürfen traten
      zunehmend angebliche Verbindungen zu Titos Jugoslawien.
    - >-
      Der Rajk-Prozess war ein Mechanismus innerhalb des umfassenderen Systems politischer Verfolgung der Rákosi-Zeit;
      die genannten Zahlen beschränken sich auf den später amtlich dem Rajk-Komplex zugerechneten Personenkreis.
episodes:
  - id: hungary-1949-1956
    polity: Ungarn
    institutions:
      - Ungarische Partei der Werktätigen
      - Staatsschutzbehörde ÁVH
      - politischer Anklage- und Volksgerichtsapparat
    institutionalContext: >-
      Rajk wurde am 30. Mai 1949 aufgrund erfundener Spionagevorwürfe festgenommen. Parteiführung und Staatssicherheit
      konstruierten daraus einen Fall, der zunehmend um ein angebliches imperialistisch-titoistisches Netzwerk kreiste.
      Geständnisse und Prozessdarstellung wurden der politischen Konzeption angepasst. Rajk, Tibor Szőnyi und András
      Szalai wurden zum Tode verurteilt und im Oktober 1949 hingerichtet, während sich weitere Verfahren um das angebliche
      Netz ausbreiteten. 1955–1956 begannen förmliche Überprüfungen; die ungarischen Archivunterlagen führen Rajk als 1956 rehabilitiert.
    consequences:
      - Hinrichtungen und Haftstrafen aufgrund konstruierter politischer Beschuldigungen
      - Ausdehnung der angeblichen Verschwörung auf zahlreiche verbundene Strafverfahren und Internierungen
      - Nutzung des Prozesses zur Legitimation antititoistischer und antiimperialistischer Säuberungen
      - Propaganda, die einstudierte Geständnisse und Vorwürfe als Beweis eines verborgenen feindlichen Netzes präsentierte
      - Zerstörung von Biografien und Familien, einschließlich Haft und Überwachung von Menschen aus dem Umfeld der Angeklagten
      - Politisch explosive Rehabilitation und Wiederbestattung 1956
    summary: >-
      Partei und Staatssicherheit machten aus konstruierten Spionagevorwürfen einen öffentlichen Schauprozess und dehnten
      das angebliche Netz auf zahlreiche weitere Verfahren aus. Eine spätere Überprüfung des Innenministeriums zählte
      155 verfolgte Personen im Rajk-Komplex. Die Entstalinisierung kehrte das amtliche Urteil um und Rajk wurde 1956 rehabilitiert.
    mechanism:
      summary: >-
        Parteiführung, Staatssicherheit und Gerichte konstruierten und verfolgten ein angebliches Spionagenetz, nutzten
        erzwungene und einstudierte Geständnisse und erweiterten die Verschwörung auf verbundene Säuberungsverfahren.
    institutionalCorrection:
      periodLabel: '1956'
      action: Ungarische Partei- und Justizprüfungen rehabilitierten László Rajk und kehrten das dem Schauprozess zugrunde liegende Urteil um.
      summary: >-
        Entstalinisierungsprüfungen rehabilitierten Rajk förmlich und beseitigten das amtliche Strafurteil, das die konstruierte Verschwörung als Tatsache behandelt hatte.
