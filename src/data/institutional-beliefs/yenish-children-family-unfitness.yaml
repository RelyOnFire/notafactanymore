schemaVersion: 2
title: Yenish identity as a presumption of child endangerment
proposition:
  summary: >-
    Pro Juventute's Kinder der Landstrasse program and cooperating Swiss authorities treated perceived Yenish descent
    or an attributed itinerant way of life as a marker of presumed child endangerment. The program identified entire
    families, then gathered and selected case material to support guardianship orders, child removal and re-education
    away from relatives and Yenish culture.
correction:
  summary: >-
    Yenish identity, a family name or an itinerant livelihood does not establish parental unfitness or danger to a
    child. Protection decisions require evidence about the individual child's circumstances and respect for family and
    cultural ties. Historical research shows that Kinder der Landstrasse reversed that logic: group classification
    determined who was investigated, and casework was directed toward justifying separation and assimilation. In 2025
    the Federal Council recognized the persecution within the program as crimes against humanity under current
    international law; the commissioned legal opinion did not classify it as genocide.
category: Child welfare, racialization and forced assimilation
reviewedAt: '2026-09-27'
impact:
  summary: >-
    Kinder der Landstrasse operated from 1926 until its dissolution in 1973. Current federal accounts summarize its
    direct removals as around 600 children; a detailed later file study counted 586, while the earlier federal historical
    study counted 619. The Federal Office of Culture estimates that comparable removals by other authorities, churches
    and organizations may have brought the total number of children taken from Yenish families to as many as 2,000.
    Children were dispersed among foster families, homes, work and educational institutions, psychiatric clinics and
    sometimes prisons, while contact with relatives was obstructed.
  highlights:
    - value: about 600
      label: children removed through the central Pro Juventute program
    - value: up to 2,000
      label: estimated wider total including removals by other organizations and authorities
    - value: 47 years
      label: from the program's founding in 1926 to its dissolution in 1973
  context:
    - >-
      Group identity drove selection, surveillance and interpretation, but did not by itself satisfy the formal legal
      process for every removal. The 2024 legal opinion says officials sought purported proof of child endangerment and
      guardianship authorities issued individual orders; historical research shows that the search and selection of
      evidence were structured by the prior assumption that the targeted families were unfit.
    - >-
      The figures around 600 and up to 2,000 are not two counts of the same register. The first concerns the documented
      Pro Juventute program and varies slightly by archival method; the second is an estimate that includes similar
      removals initiated by other public, private and church actors.
    - >-
      Pro Juventute was a private foundation and municipal or cantonal authorities held the operative child-protection
      powers. Federal, cantonal and municipal bodies nevertheless financed, legitimized, supplied information to and
      routinely cooperated with the program. The 2024 opinion describes the state as an indispensable co-actor under
      present-day attribution standards.
    - >-
      The 2025 classification is expressly under current international law. The legal opinion says the contemporaneous
      crimes-against-humanity rule required a connection to war that was absent, and it found no proven intent to destroy
      the group physically or biologically as required for genocide; coercive assimilation and cultural destruction were
      nevertheless central aims.
    - >-
      Federal redress and recognition developed over decades and remain incomplete. A 2026 external report produced
      through the federal dialogue process recommends an independent commission; the report is preparatory and does not
      itself establish that the Federal Council or Parliament has created one.
episodes:
  - id: switzerland-1926-1973
    polity: Switzerland
    region: Western Europe
    startYear: 1926
    endYear: 1973
    strength: policy-basis
    institutionTypes:
      - government
      - professional
    institutions:
      - Pro Juventute — Hilfswerk für die Kinder der Landstrasse
      - Cantonal and municipal guardianship, welfare, police and judicial authorities
      - Swiss Confederation — financial and institutional support
      - Foster homes, children's and educational homes, work institutions and psychiatric clinics
    institutionalContext: >-
      Pro Juventute created Kinder der Landstrasse in 1926 and systematically searched for families it classified as
      Yenish or as so-called itinerants. Staff compiled family files and genealogies, recruited municipal officials,
      teachers, clergy, police and courts as information sources, and pursued evidence for child-protection applications.
      Municipal and cantonal guardianship authorities supplied the legal orders, sometimes withdrawing parental
      authority and appointing program staff as guardians. The Confederation lacked primary child-welfare competence but
      subsidized the program and maintained close institutional and personnel ties to Pro Juventute. Operational activity
      ended in 1972; public exposure led to the program's formal dissolution in 1973.
    consequences:
      - Removal of around 600 children through Kinder der Landstrasse and an estimated wider total of up to 2,000 Yenish children across similar practices
      - Dispersal among foster families, children's homes, educational and work institutions, psychiatric clinics and sometimes prisons
      - Systematic obstruction of contact among children, parents, siblings and other relatives
      - Physical and psychological abuse, disrupted schooling and use of many children and adolescents as low-paid or unpaid labor
      - Loss of language, family knowledge and cultural identity, with effects extending across generations
      - Long-running struggles by survivors and Yenish organizations for records, redress, recognition and guarantees against repetition
    summary: >-
      The program turned a racialized group classification into a child-welfare presumption. A Yenish surname or ancestry
      could place a settled family under scrutiny; staff then sought and selectively presented material to make removal
      appear individually justified. Public authorities converted those files and applications into guardianship orders,
      while a network of institutions carried out placements and restricted family contact. The aim was not simply to
      address particular unsafe homes but to break family associations, suppress an itinerant way of life and assimilate
      the children. Around 600 removals are documented within the central program, and the broader total is estimated at
      up to 2,000.
    mechanism:
      kind: enforcement
      summary: >-
        Program staff identified and monitored targeted families, assembled selective case files and pressed for
        guardianship action; public authorities then used child-protection and guardianship powers to authorize removal,
        appoint guardians and place children away from relatives, while institutions enforced separation and re-education.
    institutionalCorrection:
      status: partial
      periodLabel: 1973–2026 and continuing
      action: The program was dissolved in 1973; federal measures later included apology, access to records, compensation, historical research and the 2025 recognition under current international law, followed by an ongoing dialogue about further redress.
      summary: >-
        Federal President Alphons Egli apologized in 1986 for Confederation support, and later measures addressed records,
        compensation, research and the wider system of coercive welfare placements. In 2025 the Federal Council recognized
        the program's persecution as crimes against humanity under current law and reaffirmed the general 2013 apology;
        Pro Juventute separately renewed its own apology. The Federal Commission against Racism criticized the absence of
        an explicit recognition and apology for the specifically racist persecution. A 2025 dialogue produced a 2026
        external proposal for an independent commission, so institutional correction remains an active, contested process.
