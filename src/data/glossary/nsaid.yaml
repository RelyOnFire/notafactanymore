term: NSAID
aliases:
- NSAIDs
- nonsteroidal anti-inflammatory drug
- nonsteroidal anti-inflammatory drugs
shortDefinition: A common class of pain-relieving and anti-inflammatory medicines that includes drugs such as aspirin,
  ibuprofen, and naproxen.
longDefinition: Nonsteroidal anti-inflammatory drugs, or NSAIDs, reduce pain, fever, and inflammation by inhibiting cyclooxygenase
  enzymes and lowering prostaglandin production. The same mechanism can weaken protective processes in the stomach and
  duodenum, so repeated or high-risk use can contribute to ulcers and gastrointestinal bleeding.
relatedTerms:
- helicobacter-pylori
reviewedAt: '2026-08-21'
sources:
- title: Symptoms & Causes of Peptic Ulcers (Stomach or Duodenal Ulcers)
  url: https://www.niddk.nih.gov/health-information/digestive-diseases/peptic-ulcers-stomach-ulcers/symptoms-causes
  publisher: U.S. National Institute of Diabetes and Digestive and Kidney Diseases
  note: Identifies NSAIDs including aspirin, ibuprofen, and naproxen as a common cause of peptic ulcers.
