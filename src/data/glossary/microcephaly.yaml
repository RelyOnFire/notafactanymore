term: Microcephaly
aliases:
- microcephalic
shortDefinition: A condition in which the head and usually the brain are substantially smaller than expected for age
  and sex because brain growth was reduced or disrupted.
longDefinition: Microcephaly is a clinical finding in which head size is markedly below the expected range, usually reflecting
  reduced brain growth. It can result from many genetic, developmental, infectious, or environmental causes. In the debate
  over Homo floresiensis, microcephaly was proposed as one possible explanation for the very small brain of the LB1 skeleton.
