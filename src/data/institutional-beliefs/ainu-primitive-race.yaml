evidence:
  - id: ainu-colonial-proposition
    sourceId: ainu-colonial-translation
    relation: supports
    target: {scope: belief, aspect: proposition}
    locator: Reader PDF, printed pp. 86–87; Hokkaido Government histories cited in notes 2–3 on p. 105
    note: >-
      Explains how depictions of Ainu as primitive were institutionalized to justify colonial rule and how the 1899
      Protection Act attempted to turn Ainu into farmers while land and subsistence rights were curtailed.
  - id: ainu-colonial-correction
    sourceId: ainu-colonial-translation
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Reader PDF, printed pp. 90–92 and 103–104
    note: >-
      Explains the colonial construction of racial inferiority and the “vanishing” narrative through dispossession and
      the treatment of cultural difference as backwardness; also discusses Ainu criticism and resistance.
  - id: ainu-law-carrier
    sourceId: ainu-protection-act
    relation: documents
    target: {scope: episode, episodeId: japan-1899-1937, aspect: carrier}
    locator: Articles 1–3, 10–11 and 13; archive images 3–7 of 8
    note: >-
      Primary 1899 law. It grants land to Ainu who engage or wish to engage in agriculture, assigns land and
      communal-property powers to the Hokkaido Government’s governor, and gives the Home Minister authority to issue
      implementing regulations.
  - id: ainu-law-mechanism
    sourceId: ainu-protection-act
    relation: documents
    target: {scope: episode, episodeId: japan-1899-1937, aspect: mechanism}
    locator: Articles 1–3, 7–10 and 13; archive images 3–7 of 8
    note: >-
      Links agricultural grants and the fifteen-year cultivation condition to restrictions on land disposal, educational
      assistance and school funding. Article 13 authorizes the Home Minister’s implementing regulations.
  - id: ainu-colonial-consequences
    sourceId: ainu-colonial-translation
    relation: supports
    target: {scope: episode, episodeId: japan-1899-1937, aspect: consequences}
    locator: Reader PDF, printed p. 86, pp. 90–92 and p. 96
    note: >-
      Explains how depictions of Ainu as primitive were institutionalized to justify colonial rule and how the 1899
      Protection Act attempted to turn Ainu into farmers while land and subsistence rights were curtailed. The discussion
      of Japanese-language schooling supports cultural assimilation; some land and fishing restrictions predated the Act.
  - id: ainu-anthropology-context
    sourceId: ainu-physical-anthropology
    relation: contextualizes
    target: {scope: episode, episodeId: japan-1899-1937, aspect: context}
    locator: “Ainu Studies” and the preceding discussion of Tsuboi, Tokyo Imperial University and the Anthropological Society of Tokyo
    note: >-
      Documents Tokyo Imperial University and the Anthropological Society of Tokyo as major institutional centers of early
      Japanese anthropology and extensive physical-anthropological research on the Ainu; used here as broader intellectual
      context rather than as evidence that either body carried the exact administrative proposition.
  - id: ainu-colonial-carrier
    sourceId: ainu-colonial-translation
    relation: supports
    target: {scope: episode, episodeId: japan-1899-1937, aspect: carrier}
    locator: Reader PDF, printed p. 87; notes 2–3 on p. 105 (Hokkaidoshi, 1918, pp. 3–5; Shinsen Hokkaidoshi, 1937, p. 47)
    note: >-
      Quotes histories published by the Hokkaido Government in 1918 and 1937 that rank Ainu society as backward and justify
      assimilation. This supplies evidence of the administration’s framing in addition to its legal powers.
  - id: ainu-debate-carrier
    sourceId: ainu-home-affairs-debate-1937
    relation: documents
    target: {scope: episode, episodeId: japan-1899-1937, aspect: carrier}
    locator: 6 March 1937, statements 002 (Shinohara Eitarō) and 005 (Ikeda Kiyoshi)
    note: >-
      Vice-Minister of Home Affairs Shinohara explains the agricultural and assimilationist aims of the 1899 law; government
      representative Ikeda reaffirms assimilation as the direction of policy. The debate documents continued advocacy in
      1937, not a repudiation of the underlying proposition.
  - id: ainu-debate-mechanism
    sourceId: ainu-home-affairs-debate-1937
    relation: documents
    target: {scope: episode, episodeId: japan-1899-1937, aspect: mechanism}
    locator: 6 March 1937, statement 002, explanation of the original law and proposed changes to Articles 4, 7 and 9
    note: >-
      Connects the move from hunting and fishing to agriculture with schooling and assimilation. The proposed broadening
      of livelihood assistance and removal of separate schooling are defended within that continuing policy.
  - id: ainu-law-consequences
    sourceId: ainu-protection-act
    relation: supports
    target: {scope: episode, episodeId: japan-1899-1937, aspect: consequences}
    locator: Articles 1–3; archive images 3–6 of 8
    note: >-
      The agricultural eligibility requirement, land restrictions and forfeiture of uncultivated portions support the
      description of pressure toward farming. The law offers conditional grants; it does not require every Ainu person to farm.
  - id: ainu-amendment-context
    sourceId: ainu-protection-act-amendment-1937
    relation: documents
    target: {scope: episode, episodeId: japan-1899-1937, aspect: context}
    locator: Act No. 21 of 31 March 1937, amendments to Articles 4 and 9 and supplementary provisions
    note: >-
      Broadens agricultural assistance to assistance for livelihoods and deletes Article 9 on separate schools, while
      permitting existing schools to continue temporarily where necessary. This dates a revision of the framework, not
      the end of assimilation or the repeal of the law.
  - id: ainu-relocation-correction
    sourceId: ainu-relocation-history
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: 2018 article, pp. 8–9; note 34 on p. 15
    note: >-
      Describes the forced resettlement at Tsuishikari of Sakhalin Ainu moved to Japan in 1875 and deaths from epidemics
      aggravated by crowded, unfamiliar living conditions. It supports the historical role of relocation and disease.
  - id: ainu-relocation-context
    sourceId: ainu-relocation-history
    relation: contextualizes
    target: {scope: episode, episodeId: japan-1899-1937, aspect: context}
    locator: 2018 article, pp. 8–9; note 34 on p. 15
    note: >-
      Describes colonial displacement, restrictions on hunting and fishing, and the forced resettlement and epidemic
      deaths of Sakhalin Ainu at Tsuishikari. The relocation history predates the 1899 law and supplies wider historical context.
  - id: ainu-cabinet-historical-correction
    sourceId: ainu-cabinet-answer-2008
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Cabinet answer No. 138, 14 March 2008, section 4 (四について)
    note: >-
      Endorses the historical finding that restrictions on hunting, fishing, customs and language caused severe harm and
      poverty, and that measures including the 1899 law failed to improve conditions sufficiently.
  - id: ainu-cabinet-consequences
    sourceId: ainu-cabinet-answer-2008
    relation: supports
    target: {scope: episode, episodeId: japan-1899-1937, aspect: consequences}
    locator: Cabinet answer No. 138, 14 March 2008, section 4 (四について)
    note: >-
      The Cabinet acknowledges damage from restrictions on traditional livelihoods, customs and language and the
      inadequacy of the 1899 framework. This supports suppression and impoverishment under the broader policies, without
      attributing every restriction to the text of the 1899 law.
  - id: ainu-culture-law-institutional-correction
    sourceId: ainu-culture-promotion-act-1997
    relation: documents
    target: {scope: episode, episodeId: japan-1899-1937, aspect: institutional-correction}
    locator: Act No. 52 of 14 May 1997, Articles 1–4 and supplementary Article 2(1)
    note: >-
      Establishes cultural promotion and respect for Ainu people’s voluntary intent, and expressly repeals the 1899 law.
      This is a change in the national statutory framework; repeal alone does not demonstrate redress for historical losses.
  - id: ainu-cabinet-institutional-correction
    sourceId: ainu-cabinet-answer-2008
    relation: documents
    target: {scope: episode, episodeId: japan-1899-1937, aspect: institutional-correction}
    locator: Cabinet answer No. 138, 14 March 2008, section 4 (四について)
    note: >-
      Records a dated government acknowledgment of harm caused by earlier policies. This March answer documents that
      acknowledgment; Indigenous recognition was affirmed separately in June 2008.
  - id: ainu-recognition-institutional-correction
    sourceId: ainu-recognition-proceedings-2008
    relation: documents
    target: {scope: episode, episodeId: japan-1899-1937, aspect: institutional-correction}
    locator: 6 June 2008 plenary, Ainu resolution, Kōno Yōhei’s announcement of adoption and Machimura Nobutaka’s government response
    note: >-
      Records adoption of the House of Representatives’ resolution and the government’s recognition of the Ainu as an
      Indigenous people with distinctive language, religion and culture. Machimura also acknowledges historical
      discrimination and impoverishment.
  - id: ainu-policy-law-institutional-correction
    sourceId: ainu-policy-act-2019
    relation: documents
    target: {scope: episode, episodeId: japan-1899-1937, aspect: institutional-correction}
    locator: Act No. 16 of 2019, Articles 1, 3(2), 4 and 5 (English translation of the consolidated law)
    note: >-
      Provides statutory Indigenous recognition, respect for Ainu people’s voluntary intent, a prohibition on
      discrimination, and duties for national and local authorities. This supports correction of the official policy
      framing, without establishing that all historical dispossession or discrimination has been remedied.
