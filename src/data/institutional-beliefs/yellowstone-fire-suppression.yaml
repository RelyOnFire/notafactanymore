  strength: policy-basis
  institutionTypes:
  - government
  institutions:
  - U.S. Army administration of Yellowstone National Park
  - U.S. National Park Service
  institutionalContext: Fire suppression began when the U.S. Army took responsibility for Yellowstone in 1886 and continued after the National Park Service was created in 1916. NPS historical material states that for roughly the park's first century managers believed fires had to be extinguished to preserve park resources. By the 1940s ecologists increasingly recognized fire as a natural change agent, and in 1968 the National Park Service changed national policy to accept a more natural role for fire. Yellowstone implemented its own natural-fire program in 1972, initially allowing lightning-caused fires to burn in designated backcountry zones.
  consequences:
  - Natural fires were routinely suppressed as a resource-protection measure rather than evaluated for their ecological role
  - Records indicate that fire was almost completely excluded from Douglas-fir, sagebrush-steppe and aspen communities on Yellowstone's accessible northern range from 1886 until 1987
  - Long-term fire exclusion altered natural landscape processes and, according to the National Park Service, could diminish ecological diversity
  - Managers later had to reintroduce fire deliberately through prescribed burning and managed natural fire while retaining suppression where human safety and protected resources required it
  summary: "Yellowstone's early managers treated fire exclusion as conservation. Beginning under U.S. Army administration in 1886 and continuing under the National Park Service, crews extinguished fires because burning was expected to damage forests, forage, soils and wildlife habitat. Ecological research gradually showed that this policy was also an intervention: many Yellowstone communities had evolved with recurring fire. National Park Service policy changed in 1968, and Yellowstone began a natural-fire program in 1972. The modern replacement is not a policy of letting every fire burn, but one that recognizes fire as both a hazard and an ecological process."
  sources:
  - title: History of Fire Management
    url: https://www.nps.gov/yell/learn/historyculture/fire-management.htm
    publisher: U.S. National Park Service
    note: Yellowstone's official history states that suppression began with U.S. Army management in 1886, that managers believed fires had to be extinguished to preserve park resources, and that subsequent research showed fire to be a natural ecosystem process.
  - title: Wildland Fire History — The History of National Park Service Fire Policy
    url: https://home.nps.gov/articles/the-history-of-national-park-service-fire-policy.htm
    publisher: U.S. National Park Service
    note: NPS historical review describes the assumptions used to justify total suppression and the 1968 national policy change that allowed natural and prescribed fire under specified conditions.
  - title: Forest Fires in Yellowstone — the Science of Burning and Regrowth
    url: https://www.nps.gov/articles/fires-yell.htm
    publisher: U.S. National Park Service
    note: Explains that Yellowstone managers extinguished all fires until the early 1970s because suppression was believed to protect people and wildlife, then adopted a natural-fire program after recognizing fire's ecological role.
  - title: Fire Management
    url: https://www.nps.gov/yell/learn/management/fire.htm
    publisher: U.S. National Park Service
    note: Current Yellowstone policy manages wildfire for multiple objectives, protecting people and structures while allowing fire to perform ecological functions where conditions permit.
