  - id: belgian-anthropology-external-institutional-correction
    sourceId: belgian-anthropology-external-services
    relation: documents
    target: {scope: episode, episodeId: belgium-1907-1952, aspect: institutional-correction}
    locator: 'PDF pp. 15–16, “B. Dossiers anthropologiques”'
    note: >-
      Documents De Greeff's 1952 methodological criticism, failed uniform adoption of his proposed dossier, the revised
      dossier of the early 1960s, and replacement of local anthropological services by a psychosocial service in 1997.
      These facts support a partial, gradual correction rather than a completed 1952 institutional repudiation.
