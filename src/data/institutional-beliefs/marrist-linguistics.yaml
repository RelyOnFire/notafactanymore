schemaVersion: 2
title: Marrist linguistics
proposition:
  summary: >-
    Languages were treated as products of universal class-driven stages rather than primarily as members of historically
    descended language families, making conventional comparative linguistics “bourgeois” or scientifically obsolete.
correction:
  summary: >-
    Marr’s universal class-stage theory was abandoned in 1950, and comparative-historical linguistics was restored rather
    than rendered obsolete. The historical record does not support a universal sequence of class-defined linguistic stages.
category: Linguistics
reviewedAt: '2026-08-23'
episodes:
  - id: soviet-union-1930-1950
    polity: Soviet Union
    region: Eurasia
    startYear: 1930
    endYear: 1950
    strength: enforced-doctrine
    institutionTypes:
      - government
      - academy
      - university
      - education
    institutions:
      - Institute of Language and Thought of the Academy of Sciences of the USSR
      - Academy of Sciences of the USSR
    institutionalContext: >-
      The Institute of Language and Thought was the principal institutional centre of Marrism. The doctrine's authority
      extended beyond that institute through Academy structures, universities, journals, publishing and education,
      creating a distributed institutional network rather than a single body that could accurately be called “Soviet
      linguistic institutes.” The current evidence does not independently establish the Section of Materialist Linguistics
      of the Communist Academy as a carrier of this exact proposition, so it is not listed as one here.
    consequences:
      - Competing comparative-historical linguistic schools were suppressed or marginalized
      - Research and teaching were reorganized around Marrist categories
      - Scholars who departed substantially from Marrist foundations could be institutionally marginalized or suppressed
    summary: >-
      From about 1930, Nikolai Marr's “New Theory of Language” became the officially recognized framework dominating
      Soviet linguistics. Traditional comparative and Indo-European linguistics were attacked as bourgeois, and substantial
      deviations from Marrist foundations were severely suppressed. In 1950 Stalin abruptly repudiated Marrism, after
      which the Institute of Language and Thought was dissolved and the doctrine was dismantled just as administratively
      as it had been elevated.
    mechanism:
      kind: suppression
      summary: >-
        Academy structures elevated Marrism as the officially recognized framework while marginalizing competing
        comparative-historical linguistics through research, teaching and publication controls.
    institutionalCorrection:
      status: corrected
      periodLabel: '1950'
      action: Stalin publicly repudiated Marrism, after which the Academy structure dismantled the doctrine and dissolved the Institute of Language and Thought into a reorganized linguistics institute.
      summary: >-
        The same Soviet institutional system that had elevated Marrism reversed course in 1950: the doctrine lost official
        authority and its principal institutional centre was dissolved in the ensuing reorganization.
