evidence:
  - id: kidney-kdoqi-proposition
    sourceId: kdoqi-gfr-guideline
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: Guideline 4; Rationale — Prediction Equations Based on Serum Creatinine
    note: >-
      The 2002 guideline says GFR equations should account for variables including race, recommends the MDRD equation for
      adults and explains higher mean creatinine generation in Black than White people through asserted muscle-mass differences.
  - id: kidney-interim-proposition
    sourceId: nkf-asn-interim-2021
    relation: supports
    target: {scope: belief, aspect: proposition}
    locator: Race in Estimated GFR Assessment in the United States
    note: >-
      Reconstructs the empirical derivation of the self-identified African American term and reports multipliers of 1.20
      relative to White people in MDRD and 1.16 relative to non-Black people in the 2009 CKD-EPI equation.
  - id: kidney-inker-correction
    sourceId: ckd-epi-2021-race-free
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Methods — Development and Validation of New Equations; Results — Description of Current and New Equations
    note: >-
      The 2021 equation-development study separately tested simple omission of the old race coefficient and refitting all
      coefficients without race; the recommended creatinine equation is the refitted model, not the old equation with one term deleted.
  - id: kidney-kdigo-correction
    sourceId: kdigo-2024-ckd-guideline
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Chapter 1, Practice Points 1.2.2.1 and 1.2.4.2
    note: >-
      Current international guidance says race should be avoided in eGFR computation, favors creatinine-cystatin C estimates
      when greater accuracy is needed and directs clinicians to measured GFR when an even more accurate assessment would affect care.
  - id: kidney-task-force-correction
    sourceId: nkf-asn-task-force-2021
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Recommendations 1–3 and Implementation
    note: >-
      The final joint task-force report recommends immediate U.S. implementation of the refitted race-free creatinine equation
      and greater routine, timely use of cystatin C, especially for confirmation in clinical decision-making.
  - id: kidney-optn-impact
    sourceId: optn-egfr-remediation-results
    relation: documents
    target: {scope: belief, aspect: impact}
    locator: First-year implementation results, data through 4 January 2024
    note: >-
      Reports 14,701 processed waiting-time modifications, a median 1.7 years restored to modified registrations and attestations
      from all 230 active kidney programs; these figures document remediation outcomes rather than every person ever affected.
  - id: kidney-adoption-impact
    sourceId: us-lab-adoption-2023
    relation: documents
    target: {scope: belief, aspect: impact}
    locator: Results; Table 1
    note: >-
      In the March 2023 CAP questionnaire, 65.8% of 3,542 U.S. respondent laboratories reported adoption, 19.0% reported no
      adoption and 15.1% were unsure, showing substantial but incomplete conversion in this surveyed laboratory population.
  - id: kidney-kdoqi-carrier
    sourceId: kdoqi-gfr-guideline
    relation: documents
    target: {scope: episode, episodeId: united-states-2002-2021, aspect: carrier}
    locator: Guideline 4 — Estimation of GFR
    note: >-
      Direct National Kidney Foundation guideline showing KDOQI as the recommending institution and the MDRD equation as its
      preferred adult estimation method.
  - id: kidney-interim-carrier
    sourceId: nkf-asn-interim-2021
    relation: contextualizes
    target: {scope: episode, episodeId: united-states-2002-2021, aspect: carrier}
    locator: Evolution of Kidney Function Estimating Equations; Race in Estimated GFR Assessment in the United States
    note: >-
      Traces MDRD, CKD-EPI, clinical guidelines and near-universal U.S. laboratory eGFR reporting as the linked research,
      professional and technical carriers of the race-inclusive calculation.
  - id: kidney-kdoqi-context
    sourceId: kdoqi-gfr-guideline
    relation: documents
    target: {scope: episode, episodeId: united-states-2002-2021, aspect: context}
    locator: Rationale — Creatinine Metabolism; Prediction Equations Based on Serum Creatinine
    note: >-
      Records the contemporary rationale that mean creatinine generation varied by race and its acknowledgement that
      creatinine equations were estimates with limited precision and exceptions requiring clearance measurement.
  - id: kidney-interim-context
    sourceId: nkf-asn-interim-2021
    relation: contextualizes
    target: {scope: episode, episodeId: united-states-2002-2021, aspect: context}
    locator: Probing the Rationale for a Race Coefficient; Disparities in Health and Health Care
    note: >-
      Calls the biological rationale for the race coefficient questionable, describes race as social rather than biological
      and cautions that broad kidney-care disparities predated the coefficients and had not been conclusively attributed to them.
  - id: kidney-kdoqi-mechanism
    sourceId: kdoqi-gfr-guideline
    relation: documents
    target: {scope: episode, episodeId: united-states-2002-2021, aspect: mechanism}
    locator: Guideline 4 — Estimation of GFR
    note: >-
      Recommends routine equation-based estimation and laboratory reporting, the standard-setting step that placed a
      race-inclusive research equation into ordinary clinical workflows.
  - id: kidney-lab-mechanism
    sourceId: nkf-lab-implementation-race-free
    relation: supports
    target: {scope: episode, episodeId: united-states-2002-2021, aspect: mechanism}
    locator: Introduction; Recommendations for Implementation
    note: >-
      Describes the laboratory information-system changes, reporting conventions and coordination required to replace the
      older MDRD and 2009 CKD-EPI equations, documenting how the equations were operationalized at scale.
  - id: kidney-interim-consequences
    sourceId: nkf-asn-interim-2021
    relation: supports
    target: {scope: episode, episodeId: united-states-2002-2021, aspect: consequences}
    locator: Introduction; Probing the Rationale for a Race Coefficient
    note: >-
      Identifies eGFR-dependent decisions including medication use and dosing, contrast procedures, nephrology referral and
      transplant referral while presenting competing concerns about harms from retaining or removing the coefficient.
  - id: kidney-task-force-consequences
    sourceId: nkf-asn-task-force-2021
    relation: contextualizes
    target: {scope: episode, episodeId: united-states-2002-2021, aspect: consequences}
    locator: Potential Consequences; Tables 3–5
    note: >-
      Explains that most available estimates of threshold effects were simulations rather than observations of clinical
      practice after implementation and that consequences for care, medications and trial eligibility were complex.
  - id: kidney-inker-context
    sourceId: ckd-epi-2021-race-free
    relation: supports
    target: {scope: episode, episodeId: united-states-2002-2021, aspect: context}
    locator: Results — Description of Current and New Equations; Table 3; Discussion
    note: >-
      Shows that refitting changes estimates for Black and non-Black groups, reports remaining individual-level error and
      finds the combined creatinine-cystatin C equation more accurate than the creatinine-only alternatives.
  - id: kidney-task-force-institutional-correction
    sourceId: nkf-asn-task-force-2021
    relation: documents
    target: {scope: episode, episodeId: united-states-2002-2021, aspect: institutional-correction}
    locator: Recommendations 1–3 and Implementation
    note: >-
      Documents the 2021 professional reversal: immediate use of the refitted equation without race and a national effort
      to increase access to cystatin C for confirmation.
  - id: kidney-lab-institutional-correction
    sourceId: nkf-lab-implementation-race-free
    relation: documents
    target: {scope: episode, episodeId: united-states-2002-2021, aspect: institutional-correction}
    locator: Recommendations for Implementing the CKD-EPI 2021 Race-Free Equations
    note: >-
      Converts the task-force recommendation into detailed guidance for clinical laboratories, including simultaneous
      equation replacement, equation identification and coordination with clinicians and information-system teams.
  - id: kidney-kdigo-institutional-correction
    sourceId: kdigo-2024-ckd-guideline
    relation: documents
    target: {scope: episode, episodeId: united-states-2002-2021, aspect: institutional-correction}
    locator: Chapter 1, Practice Point 1.2.4.2
    note: >-
      Extends the correction beyond the U.S. task force through a current international practice point that says use of
      race in eGFR computation should be avoided.
  - id: kidney-adoption-institutional-correction
    sourceId: us-lab-adoption-2023
    relation: documents
    target: {scope: episode, episodeId: united-states-2002-2021, aspect: institutional-correction}
    locator: March 2023 CAP questionnaire; Table 1
    note: >-
      Provides the basis for rating correction partial: about two-thirds of U.S. respondent laboratories reported adoption,
      while the remainder reported non-adoption or uncertainty in this survey.
  - id: kidney-optn-policy-consequences
    sourceId: optn-egfr-wait-time-remediation
    relation: documents
    target: {scope: episode, episodeId: united-states-2002-2021, aspect: consequences}
    locator: Background
    note: >-
      OPTN states that race-inclusive calculations made kidney function appear better for some Black candidates and could
      delay listing or the date on which transplant waiting time began to accrue.
  - id: kidney-optn-policy-institutional-correction
    sourceId: optn-egfr-wait-time-remediation
    relation: documents
    target: {scope: episode, episodeId: united-states-2002-2021, aspect: institutional-correction}
    locator: Background; Policy
    note: >-
      Documents the 27 July 2022 race-neutral eGFR requirement and the policy effective 5 January 2023 requiring hospitals
      to review eligible Black candidates and request retrospective waiting-time modifications.
  - id: kidney-optn-results-consequences
    sourceId: optn-egfr-remediation-results
    relation: supports
    target: {scope: episode, episodeId: united-states-2002-2021, aspect: consequences}
    locator: First-year implementation results, data through 4 January 2024
    note: >-
      The number and size of completed modifications provide observed evidence that the earlier equation affected a concrete
      transplant threshold for qualifying registrations, without establishing the coefficient as the cause of every wider disparity.
  - id: kidney-optn-results-institutional-correction
    sourceId: optn-egfr-remediation-results
    relation: documents
    target: {scope: episode, episodeId: united-states-2002-2021, aspect: institutional-correction}
    locator: First-year implementation results, data through 4 January 2024
    note: >-
      Reports that all 230 active kidney programs attested to reviewing their lists and that 14,701 waiting-time modifications
      had been processed, while the remediation pathway remained available for later documentation.
