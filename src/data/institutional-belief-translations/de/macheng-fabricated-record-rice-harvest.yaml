entryId: "macheng-fabricated-record-rice-harvest"
sourceReviewedAt: "2026-11-13"
title: "Der erfundene Rekordertrag auf einem Reisfeld in Macheng (1958)"
proposition:
  summary: >-
    Im August 1958 soll ein Feld der Landwirtschaftsgenossenschaft Jianguo im chinesischen Macheng
    tatsächlich 36.956 Jin (rund 18,5 Tonnen) trockenen Reis je Mu (etwa 667 Quadratmeter) geliefert
    haben. Eine Prüfung auf Provinz-, Bezirks- und Kreisebene bestätigte angeblich den außergewöhnlichen
    Ertrag.
correction:
  summary: >-
    Der gemeldete Ertrag stammte nicht aus dem einen Feld. Eine später von der politischen
    Konsultativkonferenz der Provinz Hubei veröffentlichte Untersuchung schildert, wie reife Pflanzen von
    sieben bis acht Mu auf eine Fläche von 1,016 Mu gebracht, zusätzliches Getreide hinzugefügt und
    einzelne Körbe mehrfach gezählt wurden. So entstand eine künstlich überhöhte Zahl, die als echte Ernte
    amtlich bestätigt und verbreitet wurde.
impact:
  summary: >-
    Eine amtliche Prüfung, eine Xinhua-Meldung auf der Titelseite und ein zustimmender Leitartikel der
    People's Daily machten aus dem falschen Ertrag ein gefeiertes Vorbild. Spätere lokale Berichte
    beschreiben Auszeichnungen, Druck auf Zweifler und überhöhte Getreideablieferungen auf Grundlage der
    falschen Angaben, gefolgt von schwerer Lebensmittelknappheit. Landesweit trugen verfälschte
    Erntezahlen und starre Ablieferungsregeln zur Großen Chinesischen Hungersnot bei. Eine landesweite
    Opferzahl oder ein bestimmter örtlicher Todesanteil lässt sich diesem einen Rekord nicht belastbar
    zuordnen.
  highlights:
    -
      value: "36.956 Jin/Mu"
      label: "behaupteter Ertrag an trockenem Reis auf der Titelseite der People's Daily vom 13. August 1958"
    -
      value: "1,016 Mu"
      label: "Größe des angeblichen Rekordfeldes, rund 677 Quadratmeter"
    -
      value: "7–8 Mu"
      label: "Fläche, aus der laut späterer Untersuchung reife Reispflanzen auf das Schau-Feld gebracht wurden"
  context:
    - >-
      Die Behauptung von 1958 war als gemessener Ernteertrag formuliert, nicht bloß als optimistische
      Zielvorgabe. Die Zeitung berief sich ausdrücklich auf eine amtliche Prüfung und würdigte sie in einem
      Leitartikel.
    - >-
      Der 2014 auf dem Hubei-CPPCC-Portal veröffentlichte Text ist eine aus den „Historischen Materialien
      Hubeis“ übernommene spätere Untersuchung, keine zeitgenössische Laborprüfung. Die beschriebenen
      Betrugsmethoden werden dieser Untersuchung zugeschrieben und durch weitere chinesische historische
      Studien sowie Zeitzeugenberichte eingeordnet.
    - >-
      Jianguo war im August 1958 eine landwirtschaftliche Genossenschaft und noch keine spätere
      Volkskommune. Ein Jin entspricht 500 Gramm; ein Mu umfasst ungefähr 667 Quadratmeter.
    - >-
      Die Hungersnot hatte mehrere Ursachen. Keine der Quellen liefert eine belastbare Zahl der Menschen,
      deren Tod allein dieser einzelnen falschen Erntemeldung zugerechnet werden könnte.
episodes:
  -
    id: "china-macheng-1958-1960"
    polity: "Volksrepublik China"
    periodLabel: "August 1958–1960"
    institutions:
      - "Ernteprüfung auf Provinzebene Hubei, Bezirksebene Huanggang und Kreisebene Macheng"
      - "Parteikomitees des Kreises Macheng und des Bezirks Huanggang"
      - "Nachrichtenagentur Xinhua"
      - "People's Daily"
    institutionalContext: >-
      Die Landwirtschaftsgenossenschaft Jianguo meldete im August 1958 eine außergewöhnliche Frühreisernte.
      Die ursprüngliche Xinhua-Meldung nannte an der Prüfung beteiligte Funktionäre und Agrarfachleute aus
      Provinz, Bezirk und Kreis. Die landesweite Parteizeitung veröffentlichte den Rekord auf der Titelseite
      und lobte ihn in einem Leitartikel; die Provinzführung würdigte das Feld als Vorbild. Damit ist die
      offizielle Bestätigung belegt, nicht jedoch, dass alle Beteiligten die Fälschung kannten.
    consequences:
      - "Eine erfundene Erntezahl wurde als amtlich geprüfter Produktionsrekord landesweit verbreitet."
      - >-
        Funktionäre lobten und ehrten die Genossenschaft; Besuchergruppen sollten ihre angeblichen Methoden
        kennenlernen.
      - >-
        Spätere örtliche Berichte schildern überhöhte Getreideablieferungen und zunehmenden
        Lebensmittelmangel.
      - >-
        Funktionäre und Dorfbewohner standen unter Druck, fragliche Erntemeldungen zu wiederholen oder nicht
        zu kritisieren.
      - >-
        Teil einer landesweiten Praxis verfälschter Produktionsmeldungen im Zusammenhang mit
        Pflichtablieferungen; diesem Feld wird keine bestimmte Zahl von Hungertoten zugeschrieben.
    summary: >-
      Während des Großen Sprungs nach vorn bestätigten Behörden auf mehreren Ebenen scheinbar eine
      außergewöhnliche Reisernte der Genossenschaft Jianguo. Xinhua und People's Daily verbreiteten die Zahl
      als geprüften Rekord und feierten die angeblichen Anbaumethoden. Eine später von der politischen
      Konsultativkonferenz Hubeis veröffentlichte Untersuchung kam zu dem Ergebnis, dass Pflanzen und
      Getreide aus anderen Feldern stammten und beim Zählen getrickst wurde. Spätere Berichte beschreiben
      die amtlichen Anreize und Folgen für die Getreideablieferung.
    mechanism:
      summary: >-
        Ein manipuliertes Vorzeigefeld, die Abnahme durch Funktionäre und Agrarfachleute, Auszeichnungen und
        die landesweite Berichterstattung machten aus einer künstlich zusammengesetzten Ernte einen
        maßgeblichen „Rekord“, der örtliche Erwartungen und Ablieferungen beeinflusste.
    institutionalCorrection:
      periodLabel: "Rückblicke von 2006–2014"
      action: >-
        Chinesische historische Veröffentlichungen, darunter ein Historiker der Zentralen Parteischule und
        eine Publikation des Hubei-CPPCC, bezeichneten den vermeintlichen Rekord als Fälschung.
      summary: >-
        Chinesische historische und institutionelle Veröffentlichungen haben die Erntemeldung nachträglich als
        gefälscht eingeordnet. Die auf der Hubei-CPPCC-Seite veröffentlichte Untersuchung erläutert den Ablauf
        und die Folgen. Die geprüften Quellen belegen weder eine formelle zeitgenössische Richtigstellung der
        People's Daily noch eine vollständige Wiedergutmachung der Schäden.
evidence:
  -
    id: "macheng-original-announcement"
    note: >-
      Die Titelseite vom 13. August 1958 nennt 37.547 Jin aus 1,016 Mu und damit 36.956 Jin je Mu. Sie
      stellt die Zahl ausdrücklich als Ergebnis einer Prüfung auf Provinz-, Bezirks- und Kreisebene dar.
  -
    id: "macheng-editorial"
    note: >-
      Der begleitende Leitartikel feiert die Rekordmeldung als außergewöhnlichen Erfolg des Großen Sprungs
      nach vorn, nicht als ungeprüfte Behauptung.
  -
    id: "macheng-zhang-mechanism"
    note: >-
      Die auf Gesprächen mit ehemaligen Funktionären und Dorfbewohnern beruhende spätere Untersuchung
      beschreibt umgesetzte reife Reispflanzen von sieben bis acht Mu, zusätzliches Getreide und mehrfach
      gezählte Körbe beim Wiegen.
  -
    id: "macheng-luo-correction"
    note: >-
      Ein Historiker der Zentralen Parteischule ordnet die damaligen Rekordmeldungen als gefälschte
      Beispiele ein und beschreibt ihre Entstehung.
  -
    id: "macheng-villagers-correction"
    note: >-
      Ein Einwohner erinnert sich, dass der Rekord zunächst gefeiert und später als problematisch erkannt
      wurde. Das Interview liefert keine neue Messung der damaligen Ernte.
  -
    id: "macheng-agri-history-context"
    note: >-
      Eine chinesische historische Fachanalyse nennt die Meldung aus Macheng unter den übertriebenen
      Erntezahlen und beschreibt das Umsetzen von Pflanzen sowie wiederholtes Wiegen als Methoden solcher
      Täuschungen.
  -
    id: "macheng-local-overdelivery"
    note: >-
      Laut der historischen Untersuchung musste die Genossenschaft aufgrund überhöhter Produktionsmeldungen
      übermäßig viel Getreide abliefern und litt später unter Lebensmittelknappheit. Die dort genannte
      örtliche Zahl von Todesfällen wird hier nicht als unabhängig verifiziert behandelt.
  -
    id: "macheng-local-witnesses"
    note: >-
      Der Bericht hält Aussagen von Überlebenden zu überhöhten Ablieferungen, Kosten für Besucher, Hunger
      und Todesfällen fest. Er ermöglicht keine genaue ursächliche Zuordnung einer Todeszahl zu dieser
      einzelnen Meldung.
  -
    id: "macheng-macro-economics"
    note: >-
      Die wirtschaftswissenschaftliche Studie führt den Rückgang der Agrarproduktion auch auf die Umleitung
      von Ressourcen und überhöhte staatliche Getreideablieferungen zurück. Sie weist dieser Meldung keine
      nationale Opferzahl zu.
  -
    id: "macheng-targets-analysis"
    note: >-
      Eine empirische Untersuchung auf Kreisebene verbindet unrealistische Ertragsvorgaben mit überhöhter
      Getreidebeschaffung und erhöhter Sterblichkeit. Sie liefert keine Kausalschätzung für dieses einzelne
      Feld.
  -
    id: "macheng-announcement-carrier"
    note: >-
      Der Zeitungsbericht nennt beteiligte Funktionäre und Agrarfachleute der Prüfung auf drei
      Verwaltungsebenen und dokumentiert die offizielle Bestätigung.
  -
    id: "macheng-fraud-carrier"
    note: >-
      Die Rückschau zeichnet die Rolle der Kreisführung, der provinziellen Prüfer, der öffentlich
      ausgesprochenen Glückwünsche und der anschließenden Ehrungen nach.
  -
    id: "macheng-inspection-and-press"
    note: >-
      Die angebliche amtliche Prüfung und die landesweite Berichterstattung machten aus einem örtlichen
      Rekordanspruch ein offiziell befürwortetes Vorbild.
  -
    id: "macheng-inspection-failure"
    note: >-
      Die spätere Rekonstruktion beschreibt das Umsetzen von Reispflanzen und die manipulierten Zählungen,
      die bei der vermeintlichen Prüfung akzeptiert wurden.
  -
    id: "macheng-sanctions"
    note: >-
      Beschreibt Besichtigungen, Druck auf Zweifler, Auszeichnungen, überhöhte Ablieferungen und späteren
      Mangel. Es handelt sich um eine spätere Untersuchung, nicht um ein zeitgenössisches
      Ablieferungsregister.
  -
    id: "macheng-local-official-memoir"
    note: >-
      Ein ehemaliger lokaler Funktionär schildert gefälschte Erntewettbewerbe im Kreis Macheng. Das belegt
      den örtlichen Hintergrund, jedoch nicht unabhängig jedes Detail des einzelnen Rekordfeldes.
  -
    id: "macheng-harvest-overestimate"
    note: >-
      Die Wirtschaftsgeschichte dokumentiert weit überhöhte nationale Ernteerwartungen und daraus folgende
      Fehlentscheidungen, ohne Naturereignisse als möglichen Einfluss auszuschließen.
  -
    id: "macheng-later-recognition"
    note: >-
      Die vom Hubei-CPPCC-Portal veröffentlichte Rückschau bezeichnet den Ertrag ausdrücklich als Täuschung.
      Damit ist keine formelle Richtigstellung des ursprünglichen Zeitungsartikels nachgewiesen.
  -
    id: "macheng-party-historian-recognition"
    note: >-
      Ein Historiker der Zentralen Parteischule bezeichnet die Ernte-„Satelliten“ öffentlich als
      Fälschungen; das ist eine spätere Anerkennung, keine belegte formelle Rücknahme von 1958.
