locale: de
entryId: simultaneity
sourceReviewedAt: '2026-08-21'
term: Gleichzeitigkeit
aliases:
- Relativität der Gleichzeitigkeit
- gleichzeitig
shortDefinition: Die Beziehung von Ereignissen, die zur selben Zeit stattfinden; in der speziellen Relativität müssen
  räumlich getrennte Ereignisse, die in einem Inertialsystem gleichzeitig sind, in einem anderen nicht gleichzeitig sein.
longDefinition: Die spezielle Relativität beseitigt eine universelle Gleichzeitigkeit für räumlich getrennte Ereignisse.
  Relativ zueinander bewegte Beobachter verwenden unterschiedliche, aber jeweils in sich konsistente Zuordnungen dafür,
  welche entfernten Ereignisse gleichzeitig stattfinden. Diese Relativität der Gleichzeitigkeit folgt aus der Invarianz
  der Lichtgeschwindigkeit und den Lorentz-Transformationen; sie ist kein bloßer Uhren- oder Signallaufzeitfehler.
