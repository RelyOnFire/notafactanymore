term: Mariner 2
aliases: []
shortDefinition: Eine NASA-Raumsonde, die 1962 an der Venus vorbeiflog und erstmals erfolgreich Messungen aus unmittelbarer
  Nähe eines anderen Planeten übermittelte.
longDefinition: Mariner 2 wurde beim Vorbeiflug an der Venus am 14. Dezember 1962 zur ersten erfolgreichen interplanetaren
  Raumsonde. Ihre Mikrowellen- und Infrarotmessungen stützten die Schlussfolgerung, dass die Venus eine extrem heiße
  Oberfläche besitzt, und schwächten damit frühere Erwartungen einer milden erdähnlichen Welt unter den Wolken deutlich.
