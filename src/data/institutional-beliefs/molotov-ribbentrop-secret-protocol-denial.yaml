      the original and source of the electronic copy.
  - title: 1939 — The Beginning of the Second World War archival exhibition
    url: https://statearchive.ru/1233
    publisher: State Archive of the Russian Federation
    note: >-
      Official Russian archival exhibition description identifying the original Soviet-German non-aggression treaty and
      original secret additional protocol dividing spheres of interest among the principal documents displayed in 2019.
