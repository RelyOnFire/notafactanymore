      programme, the intended link between diagnosis and individualised treatment, and increased medical authority.
  - id: belgian-anthropology-saint-gilles-consequences
    sourceId: belgian-anthropology-saint-gilles
    relation: supports
    target: {scope: episode, episodeId: belgium-1907-1952, aspect: consequences}
    locator: '“Bevoegdheden en activiteiten”, paragraphs on anthropological dossiers'
    note: >-
      Supports the Saint-Gilles record volume and coverage consequence: more than 9,000 dossiers survive from 1920–1957,
