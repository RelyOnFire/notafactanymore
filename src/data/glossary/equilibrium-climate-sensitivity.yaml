term: Equilibrium climate sensitivity
aliases:
- ECS
- climate sensitivity
shortDefinition: The long-term global warming expected after atmospheric carbon dioxide is doubled and the climate system
  has largely adjusted.
longDefinition: Equilibrium climate sensitivity, or ECS, is the change in global mean surface temperature after a sustained
  doubling of atmospheric CO₂ once the climate approaches equilibrium. It includes fast climate feedbacks such as changes
  in water vapor, clouds, sea ice, and lapse rate, while very slow responses such as major ice-sheet changes are usually
  treated separately.
relatedTerms:
- climate-feedback
reviewedAt: '2026-08-21'
sources:
- title: 'Chapter 7: The Earth''s Energy Budget, Climate Feedbacks, and Climate Sensitivity'
  url: https://www.ipcc.ch/report/ar6/wg1/chapter/chapter-7/
  publisher: IPCC
  note: Defines and assesses equilibrium climate sensitivity using multiple independent lines of evidence.
