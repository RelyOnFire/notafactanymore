title: Beriberi as an infectious disease rather than a nutritional deficiency
claim: The Imperial Japanese Army’s medical leadership treated beriberi as principally infectious rather than diet-related
  and resisted ration reform even after the Navy had nearly eliminated the disease through dietary change.
currentUnderstanding: Beriberi is caused by thiamine (vitamin B1) deficiency. Diets dominated by highly polished
  rice can produce deficiency because milling removes thiamine-rich outer layers. Infectious-disease theories did
  not explain the Navy’s dietary experiment, the effect of rice bran, or the later biochemical evidence identifying
  thiamine deficiency.
category: Medicine, nutrition and military health
reviewedAt: '2026-08-24'
impact:
  summary: Japan produced an unusually sharp same-state contrast. The Navy changed sailors’ diets after Kanehiro
    Takaki’s shipboard observations and virtually eliminated beriberi, while Army medical leaders continued to favor
    an infectious explanation and maintained polished-rice rations. During later wars the Army experienced enormous
    beriberi morbidity while the Navy’s experience supplied contradictory evidence.
  highlights:
  - value: 1884–85
    label: Navy dietary experiments and ration reform were followed by the disappearance of beriberi from the Navy
  - value: Army doctrine
    label: Army medical leaders continued to favor an infectious origin and rejected Takaki’s dietary explanation
  - value: 1904–05
    label: Beriberi deaths in the Army were comparable in scale to direct war deaths while Navy deaths were absent
      in the cited review
  context:
  - The early cause of beriberi was genuinely uncertain. The institutional error here is the Army’s persistence
    after strong within-state dietary evidence accumulated, not the mere fact that nineteenth-century physicians
    initially lacked vitamin theory.
