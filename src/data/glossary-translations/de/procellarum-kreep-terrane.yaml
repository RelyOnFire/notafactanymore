term: Procellarum KREEP Terrane
aliases:
- PKT
shortDefinition: Eine große Region auf der erdzugewandten Mondseite mit ungewöhnlich hohen Konzentrationen KREEP-assoziierter
  Elemente, darunter Thorium.
longDefinition: Das Procellarum KREEP Terrane ist eine geochemisch auffällige Region, die einen großen Teil der westlichen
  erdzugewandten Mondseite umfasst. Fernerkundungsdaten zeigen dort hohe Konzentrationen von Thorium und anderen KREEP-assoziierten
  Elementen; zugleich liegen viele junge Mare-Basalte in dieser Region. Diese räumliche Verbindung trug zur Hypothese
  bei, dass KREEP-bezogene Wärme lang anhaltenden Mondvulkanismus begünstigte.
