title: Pure acupuncture as sufficient surgical anesthesia
claim: >-
  Acupuncture stimulation alone was treated as sufficiently reliable anesthesia for a broad range of major operations, including chest and abdominal surgery, and as capable of replacing drug anesthesia in settings where anesthetic medicines or equipment were limited.
currentUnderstanding: >-
  Acupuncture can contribute analgesic effects and may reduce anesthetic-drug requirements in selected perioperative settings, but conscious "pure acupuncture anesthesia" does not reliably provide the complete analgesia, sedation, muscle relaxation, and physiological control required across major surgery. Modern Chinese acupuncture-anesthesia practice uses selected indications and commonly combines acupuncture with anesthetic or analgesic drugs rather than treating acupuncture alone as a universal substitute.
category: Anesthesiology and integrative medicine
reviewedAt: 2026-08-24
impact:
  summary: >-
    China did not merely investigate acupuncture anesthesia in isolated experiments. National science and health authorities organized a research program and broad rollout, while hospitals and the People's Liberation Army used it clinically on a large scale. Later Chinese medical accounts describe the indiscriminate expansion of pure acupuncture anesthesia as an overreach and modern practice as a narrower acupuncture-drug combination.
  highlights:
    - value: "1966"
      label: State Science Commission and Ministry of Health established a national research plan
    - value: "400,000+"
      label: Patients reported by People's Daily as having undergone acupuncture-anesthesia operations by July 1971
    - value: "1990s"
      label: Most hospitals had stopped the old pure-acupuncture operations as limitations became clearer
  context:
    - >-
      This card is deliberately about pure or near-pure acupuncture as the principal anesthetic for broad major surgery, not about acupuncture having no analgesic effect. Modern Chinese teams continue to study and use acupuncture as an adjunct that can reduce anesthetic-drug doses.
    - >-
      Contemporary and retrospective Chinese sources also show that practice was heterogeneous: some teams used small amounts of local or auxiliary medication, and the technique itself acknowledged incomplete analgesia and visceral discomfort. The institutional overreach was the broad promotion of acupuncture as sufficient anesthesia across poorly selected operations and austere settings, not every individual acupuncture-assisted procedure.
episodes:
  - id: china-1966-1989
    polity: People's Republic of China
    region: East Asia
    startYear: 1966
    endYear: 1989
    periodLabel: 1966–1980s
    strength: policy-basis
    institutionTypes: [government, medical, military, education]
    institutions:
      - State Science and Technology Commission (国家科学技术委员会)
      - Ministry of Health of the People's Republic of China (卫生部)
      - Military Control Commission of the Ministry of Health (卫生部军管会)
      - Chinese People's Liberation Army General Hospital (中国人民解放军总医院)
    institutionalContext: >-
      In February 1966 the State Science Commission and Ministry of Health convened a national acupuncture-anesthesia research meeting in Shanghai and formulated a 1966–1968 research plan, after which the technique expanded nationally. In September 1969 the Ministry of Health's military control commission made acupuncture anesthesia an important national wartime-health task. Hospitals, local health systems, research institutes, and PLA medical units then carried out the practice at large scale. The 1989 endpoint is used as the representative end of the broad 1960s–1980s pure-acupuncture model: doubts grew from the 1980s and Chinese retrospective accounts say most hospitals stopped these operations during the 1990s.
    consequences:
      - National research planning and large-scale clinical rollout
      - Use of pure acupuncture anesthesia in major chest, abdominal, cranial, and other operations
      - Promotion for rural, mountain, and wartime settings as an alternative where drug anesthesia was constrained
      - Training and diffusion through hospitals, local health services, and People's Liberation Army medical units
    summary: >-
      Beginning with a national research plan in 1966, Chinese science and health authorities promoted acupuncture anesthesia across hospitals and military medicine. In 1971 People's Daily reported that more than 400,000 patients had undergone operations under acupuncture anesthesia, claimed a success rate around 90 percent, and highlighted its usefulness where anesthetic drugs or equipment were scarce. The technique was subsequently applied across a very wide range of operations. Chinese retrospective accounts now describe that period as one in which acupuncture anesthesia was promoted too indiscriminately: pure acupuncture could not provide complete analgesia, sedation, or muscle relaxation for many procedures, and most hospitals abandoned the old model during the 1990s. Modern Chinese practice instead emphasizes selected indications and acupuncture-drug combined anesthesia.
