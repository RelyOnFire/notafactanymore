schemaVersion: 2
locale: de
entryId: hiv-aids-fort-detrick-bioweapon
sourceReviewedAt: '2026-08-25'
title: HIV/AIDS als US-Biowaffe aus Fort Detrick
proposition:
  summary: >-
    Sowjetische und ostdeutsche Staatssicherheitsorgane verbreiteten die Behauptung, HIV/AIDS sei aus militärischen
    US-Biowaffenexperimenten in Fort Detrick hervorgegangen, und ließen einen künstlichen amerikanischen Ursprung durch
    koordinierte internationale aktive Maßnahmen als Tatsache erscheinen.
correction:
  summary: >-
    HIV-1 der Gruppe M, die Hauptursache der weltweiten AIDS-Pandemie, entstand durch einen natürlichen Artensprung eines
    Affen-Immundefizienzvirus von Schimpansen auf Menschen in Zentralafrika und diversifizierte sich bereits zu Beginn des
    20. Jahrhunderts in der menschlichen Bevölkerung. Virengenetische Befunde und Proben aus Kinshasa aus der Zeit lange
    vor der erkannten AIDS-Epidemie sind mit der Behauptung unvereinbar, HIV sei in Fort Detrick konstruiert worden.
impact:
  summary: >-
    Aus der Fort-Detrick-Erzählung wurde eine koordinierte internationale Desinformationskampagne. Ein Artikel der
    indischen Zeitung Patriot von 1983 lieferte eine frühe Fassung; spätestens im September 1985 beschrieb eine Mitteilung
    der I. Hauptverwaltung des KGB ausdrücklich Maßnahmen, die im Ausland den Glauben erzeugen sollten, AIDS sei das
    Ergebnis geheimer amerikanischer Biowaffenexperimente. Die DDR-Auslandsaufklärung beteiligte sich mit OVO „Denver“.
    Ende 1986 registrierte die US-Diplomatie die Behauptung in mehr als 50 Ländern und Sendungen des Ostblocks in mehr als 20 Sprachen.
  highlights:
    - value: 50+
      label: Länder, in denen die Fort-Detrick-Behauptung bis Ende 1986 aufgetaucht war
    - value: 20+
      label: Sprachen, in denen Ostblocksender AIDS-bezogene Behauptungen verbreiteten
    - value: '1987'
      label: Jahr, in dem ein hoher sowjetischer Diplomat die AIDS-Propaganda intern als töricht bezeichnete und Moskau sie zurückfuhr
  context:
    - >-
      In späterer Literatur wird die Kampagne häufig „Operation INFEKTION“ genannt. Eine Archivstudie des Bundesarchivs
      kommt jedoch zu dem Ergebnis, dass „Infektion“ nicht der dokumentierte Deckname der AIDS-Kampagne war; die
      DDR-Auslandsaufklärung führte OVO „Denver“.
    - >-
      Der Patriot-Artikel von 1983 war ein wichtiger Ausgangstext; der eindeutigste direkte institutionelle Beleg setzt
      1985 mit der KGB-Information Nr. 2955 an die bulgarische Staatssicherheit ein.
    - >-
      Die Aktenlage rechtfertigt nicht die Behauptung, Jakob Segal habe wissentlich als KGB-Agent gehandelt oder der KGB
      habe sämtliche seiner wissenschaftlichen Argumente heimlich verfasst.
episodes:
  - id: soviet-union-1983-1987
    polity: Sowjetunion
    institutions:
      - I. Hauptverwaltung des KGB
      - sowjetischer Auslandspropaganda- und Medienapparat
    institutionalContext: >-
      Der Patriot-Artikel vom 17. Juli 1983 wurde zum Ausgangsmaterial späterer sowjetischer Verstärkung. Spätestens am
      7. September 1985 ist die institutionelle Absicht direkt belegt: Die KGB-Information Nr. 2955 erklärte der
      bulgarischen Staatssicherheit, die UdSSR führe Maßnahmen durch, um im Ausland die Auffassung zu erzeugen, AIDS sei
      das Ergebnis geheimer Experimente amerikanischer Nachrichtendienste und des Pentagons mit neuen biologischen Waffen.
      Im Juli 1987 erklärte der sowjetische Vizeaußenminister Anatoli Adamischin gegenüber einem US-Vertreter, die
      sowjetische AIDS-Propaganda sei „töricht“ gewesen und entsprechende Beiträge nähmen ab.
    consequences:
      - Koordinierte internationale Verbreitung einer falschen US-militärischen Herkunft von HIV/AIDS
      - Einbindung verbündeter Nachrichtendienste und Propagandaapparate zur Verstärkung der Fort-Detrick-Erzählung
      - Verbreitung der Behauptung in mehr als 50 Ländern und über Ostblocksender in mehr als 20 Sprachen
      - Beeinträchtigung korrekter Gesundheitsaufklärung durch die Darstellung eines erfundenen Laborursprungs als wissenschaftliche Tatsache
      - Diplomatische Spannungen und wiederholte Gegenmaßnahmen der US-Regierung gegen die Kampagne
    summary: >-
      Sowjetische Institutionen machten aus einer AIDS-Verschwörungstheorie eine organisierte Kampagne aktiver Maßnahmen.
      1987 begann Moskau davon abzurücken; 1992 räumte der russische Auslandsgeheimdienstchef Jewgeni Primakow öffentlich
      ein, dass der KGB hinter der internationalen Desinformationskampagne gestanden hatte.
    mechanism:
      summary: >-
        Der KGB koordinierte aktive Maßnahmen mit Partnerdiensten, während sowjetische Medien- und Propagandakanäle einen
        fabrizierten Ursprung in Fort Detrick als scheinbar wissenschaftliche Tatsache verbreiteten.
    institutionalCorrection:
      periodLabel: '1987'
      action: Sowjetische Stellen fuhren die Kampagne zurück; ein Vizeaußenminister bezeichnete die AIDS-Propaganda intern als töricht.
      summary: >-
        Moskau verringerte die Kampagne deutlich und ein hoher sowjetischer Diplomat räumte ihren Propagandacharakter ein.
        Eine förmliche öffentliche sowjetische Rücknahme vor dem Ende der UdSSR ist jedoch nicht belegt; 1992 bestätigte
        Russlands Auslandsgeheimdienstchef öffentlich die Verantwortung des KGB.
  - id: east-germany-1986-1989
    polity: DDR
    institutions:
      - Ministerium für Staatssicherheit
      - Hauptverwaltung A, Abteilung X
    institutionalContext: >-
      Die DDR-Auslandsaufklärung eröffnete am 17. Juli 1986 den Objekt-Vorgang OVO „Denver“, gab Partnerdiensten Material
      weiter, das AIDS als Produkt amerikanischer Biowaffenforschung darstellte, und nutzte die Segal-These in aktiven
      Maßnahmen. Die HV A/X setzte AIDS-bezogene Aktivitäten fort, nachdem der KGB bereits zur Zurückhaltung riet.
    consequences:
      - Einrichtung des OVO „Denver“ als aktive Maßnahme der DDR-Auslandsaufklärung
      - Weitergabe von Material an Partnerdienste, das AIDS als Produkt amerikanischer Biowaffenforschung darstellte
      - Internationale Nutzung der Segal-These als scheinbar wissenschaftliche Stütze der Fort-Detrick-Erzählung
      - Fortsetzung AIDS-bezogener aktiver Maßnahmen, nachdem der sowjetische KGB bereits von der Kampagne abrückte
    summary: >-
      Das Ministerium für Staatssicherheit führte mit OVO „Denver“ eine eigene aktive Maßnahme, tauschte Material mit
      Partnerdiensten aus und setzte die Segal-These zur Verstärkung antiamerikanischer Einstellungen ein. Die Kampagne
      reichte bis in das letzte volle Jahr des DDR-Regimes.
    mechanism:
      summary: >-
        Die DDR-Auslandsaufklärung organisierte OVO „Denver“, verbreitete Material über Partnerdienste und förderte die Fort-Detrick-Erzählung international.
    institutionalCorrection:
      summary: >-
        Die dokumentierte DDR-Operation endete mit dem Zusammenbruch des Regimes. Ein datierter Akt des Ministeriums für
        Staatssicherheit, der die Fort-Detrick-Erzählung zurücknahm oder verwarf, ist nicht belegt.
evidence:
  - id: aids-bundesarchiv-proposition
    note: >-
      Die Archivstudie reproduziert die KGB-Information Nr. 2955 und dokumentiert die koordinierte sowjetische und ostdeutsche Kampagne.
  - id: aids-origin-correction
    note: >-
      Die wissenschaftliche Übersicht führt HIV-1 Gruppe M auf eine Schimpansen-SIV-Linie in Zentralafrika zurück und datiert die frühe menschliche Diversifizierung in das frühe 20. Jahrhundert.
  - id: aids-state-impact
    note: >-
      Die zeitgenössische Analyse berichtet von mehr als 50 Ländern und mehr als 20 Sendesprachen des Ostblocks.
