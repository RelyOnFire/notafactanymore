evidence:
  - id: virgin-lands-sixty-years-proposition
    sourceId: virgin-lands-sixty-years
    relation: supports
    target: {scope: belief, aspect: proposition}
    note: >-
      Contrasts Khrushchev's “broadening” strategy of rapid acreage expansion with the rejected alternative of increasing
      yields on existing farmland and records a projected 35–40 percent production increase through up to 30, later 40,
      million hectares of new cultivation.
  - id: virgin-lands-land-cover-correction
    sourceId: virgin-lands-kazakhstan-land-cover
    relation: supports
    target: {scope: belief, aspect: correction}
    note: >-
      Remote-sensing and archival study finding limited production potential on currently uncultivated marginal land and
      recommending yield gains on established cropland, with grazing, ecosystem services and biodiversity prioritized on
      less suitable land.
  - id: virgin-lands-fao-correction
    sourceId: virgin-lands-fao-conservation
    relation: supports
    target: {scope: belief, aspect: correction}
    note: >-
      Describes how zero tillage, retained crop residues and rotation improve moisture retention and reduce erosion under
      northern Kazakhstan's low-rainfall conditions, while also noting adoption costs and early herbicide use.
  - id: virgin-lands-sixty-years-impact
    sourceId: virgin-lands-sixty-years
    relation: supports
    target: {scope: belief, aspect: impact}
    note: >-
      Provides the campaign-wide conversion estimate, harvest series, 1963 drought context and cereal purchases, as well
      as evidence on settlement, later yield gains, habitat loss and soil degradation.
  - id: virgin-lands-land-cover-impact
    sourceId: virgin-lands-kazakhstan-land-cover
    relation: supports
    target: {scope: belief, aspect: impact}
    note: >-
      Estimates that about 23 million hectares of steppe grassland were converted in northern Kazakhstan from 1954 to
      1963 and records Kazakhstan's resulting role as an important Soviet grain region.
  - id: virgin-lands-march-carrier
    sourceId: virgin-lands-march-1954-resolution
    relation: documents
    target: {scope: episode, episodeId: soviet-union-1954-1964, aspect: carrier}
    note: Catalogue and full-access record for the foundational 2 March 1954 CPSU Central Committee Plenum resolution on increasing grain production and developing virgin and fallow lands; the record identifies the issuing Central Committee Plenum and preserves multiple RSL shelfmarks.
  - id: virgin-lands-august-carrier
    sourceId: virgin-lands-august-1954-resolution
    relation: documents
    target: {scope: episode, episodeId: soviet-union-1954-1964, aspect: carrier}
    note: Historical-document record identifying the 13 August 1954 measure as a joint resolution of the CPSU Central Committee and Council of Ministers of the USSR to further expand Virgin Lands grain production.
  - id: virgin-lands-march-mechanism
    sourceId: virgin-lands-march-1954-resolution
    relation: documents
    target: {scope: episode, episodeId: soviet-union-1954-1964, aspect: mechanism}
    note: >-
      The primary resolution set new sowing targets of 2.3 million hectares in 1954 and at least another 10.7 million in
      1955 and assigned implementation to USSR ministries, republican governments, regional party-state bodies, machine-
      tractor stations and state and collective farms across Kazakhstan and multiple Russian regions.
  - id: virgin-lands-sixty-years-mechanism
    sourceId: virgin-lands-sixty-years
    relation: supports
    target: {scope: episode, episodeId: soviet-union-1954-1964, aspect: mechanism}
    note: >-
      Describes Central Committee direction, Komsomol-led recruitment, mass resettlement and the movement of machinery and
      investment needed to create farms and settlements where little infrastructure existed.
  - id: virgin-lands-building-authority-consequences
    sourceId: virgin-lands-building-authority
    relation: supports
    target: {scope: episode, episodeId: soviet-union-1954-1964, aspect: consequences}
    note: Historical analysis of the Virgin Lands policy describing political pressure to expand plowing, declining fallow, soil-fertility loss, dust storms, and the 1963 failure.
  - id: virgin-lands-fate-earth-consequences
    sourceId: virgin-lands-fate-earth
    relation: supports
    target: {scope: episode, episodeId: soviet-union-1954-1964, aspect: consequences}
    note: Environmental-history account describing the Virgin Lands campaign’s conversion of semi-arid grassland and the erosion risks created by extensive plowing.
  - id: virgin-lands-sixty-years-consequences
    sourceId: virgin-lands-sixty-years
    relation: supports
    target: {scope: episode, episodeId: soviet-union-1954-1964, aspect: consequences}
    note: >-
      Documents early production gains alongside later weather-sensitive harvests, erosion, salinization, habitat
      fragmentation and the long-lived settlements and infrastructure created by the campaign.
  - id: virgin-lands-building-authority-correction
    sourceId: virgin-lands-building-authority
    relation: supports
    target: {scope: episode, episodeId: soviet-union-1954-1964, aspect: institutional-correction}
