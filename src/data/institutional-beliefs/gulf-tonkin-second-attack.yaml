title: A second attack in the Gulf of Tonkin
claim: >-
  U.S. executive, military and intelligence institutions treated reports that North Vietnamese naval forces had
  launched a second deliberate attack on USS Maddox and USS Turner Joy on 4 August 1964 as confirmed fact, and
  Congress incorporated the premise of repeated attacks into the Gulf of Tonkin Resolution.
currentUnderstanding: >-
  North Vietnamese torpedo boats did attack USS Maddox on 2 August 1964, but the alleged second attack on 4 August
  did not occur. Contemporary radar, sonar and eyewitness reporting was confused, while signals intelligence was
  misinterpreted in ways that reinforced the attack narrative. A later NSA historical reconstruction concluded that
  Hanoi's navy was salvaging boats damaged on 2 August and that no attack took place on the night of 4 August.
category: War, intelligence and executive power
reviewedAt: '2026-08-25'
impact:
  summary: >-
    The alleged second attack moved rapidly from uncertain operational reporting into consequential state action.
    President Lyndon Johnson ordered retaliatory air strikes against North Vietnamese targets and asked Congress for
    broad authority in Southeast Asia. The resulting Gulf of Tonkin Resolution stated that North Vietnamese naval units
    had deliberately and repeatedly attacked U.S. vessels and authorized the president to take all necessary measures
    to repel attacks and prevent further aggression. Johnson and later Nixon relied on the resolution as a legal basis
    for military policy until Congress repealed it in January 1971.
  highlights:
  - value: 88–2
    label: U.S. Senate vote approving the Gulf of Tonkin Resolution
  - value: 416–0
    label: U.S. House vote approving the Gulf of Tonkin Resolution
  - value: '1971'
    label: year Congress repealed the resolution that had provided broad authority for U.S. military policy in Vietnam
  context:
  - >-
    The 2 August 1964 attack was real. This card concerns only the alleged second attack on 4 August and should not be
    summarized as though the entire Gulf of Tonkin episode had been invented.
  - >-
    The evidence does not require a claim that President Johnson personally fabricated an attack he knew had not
    occurred. Operational reporting was genuinely confused in real time. The institutional failure was the elevation of
    uncertain and misread evidence into an asserted second attack, followed by military and legislative action.
  - >-
    The policy-basis episode ends with repeal of the Gulf of Tonkin Resolution in 1971. NSA's institutional account of
    the second incident persisted longer: Robert Hanyok's later NSA historical study noted that the agency had officially
    maintained the 4 August attack occurred before concluding from a much larger SIGINT record that no attack happened.
