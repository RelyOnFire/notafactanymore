  consequences:
  - National standards prescribed algolization as a method for rehabilitating water bodies
  - The standardized method specified Chlorella strains, application quantities, repeated inoculation, and monitoring requirements
  - A dedicated 2025 national standard extended requirements to drinking-water sources, recreational waters, fisheries waters,
    and biological-treatment water bodies
  summary: Russia standardized Chlorella-based algolization as a water-body rehabilitation technology in GOST R 59977-2022,
    which prescribes repeated inoculation and attributes broad water-quality improvements to the method. This occurred after
    a 2007 Federal Water Resources Agency trial produced results too ambiguous to establish efficacy and after the agency's
    scientific-technical council concluded in 2009 that using Chlorella to suppress blooms was not scientifically substantiated
    or confirmed by practice. In 2025 Rosstandart approved a dedicated national standard governing algolization with planktonic
    Chlorella strains; that standard remains in force in 2026.
