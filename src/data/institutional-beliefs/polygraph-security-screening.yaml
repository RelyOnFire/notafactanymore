    target: {scope: belief, aspect: proposition}
    note: >-
      Primary federal rule establishing DOE counterintelligence polygraph screening for specified employees, contractors,
      applicants and other personnel with access to sensitive information and programs.
  - id: polygraph-nas-correction
    sourceId: polygraph-nas
    relation: supports
    target: {scope: belief, aspect: correction}
    note: >-
      Scientific review finding that physiological responses measured by polygraphs are not unique to deception, evidence
      for screening accuracy is extremely limited, and employee screening creates serious false-positive and false-negative
      problems; it distinguishes these limitations from above-chance performance sometimes seen in specific-incident testing.
