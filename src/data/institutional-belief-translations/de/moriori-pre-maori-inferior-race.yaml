schemaVersion: 2
locale: de
entryId: moriori-pre-maori-inferior-race
sourceReviewedAt: '2026-09-24'
title: Moriori als minderwertige vormāorische Rasse, die ausgestorben sei
proposition:
  summary: >-
    In drei Beiträgen von 1916 fügte der vom neuseeländischen Department of Education herausgegebene School Journal eine
    rassistische Ursprungserzählung zusammen: Angeblich minderwertige vormāorische Bewohner des neuseeländischen Festlands
    seien von später eingetroffenen Māori besiegt worden, ihre Überlebenden zu den Moriori der Chathaminseln geworden und
    die Moriori schließlich „als Rasse ausgestorben“. Ein Beitrag vom April 1946 bezeichnete die angeblich vormāorischen
    Moriori erneut als faul, träge und in den Fertigkeiten des Lebens weniger kundig als Māori.
correction:
  summary: >-
    Moriori sind ein lebendes indigenes polynesisches Volk und die tchakat henu (tangata whenua) von Rēkohu und den
    umliegenden Inseln. Sie teilen ostpolynesische Vorfahren mit Māori und entwickelten über Jahrhunderte auf Rēkohu ihre
    eigene Sprache, Kultur und Identität. Es gibt keinen Beleg für ein eigenständiges, minderwertiges melanesisches Volk
    namens Moriori, das vor Māori das neuseeländische Festland bewohnt hätte und von dort auf die Chathaminseln vertrieben
    worden wäre. Auch starben Moriori nicht aus. Die Invasion Rēkohus durch Ngāti Mutunga und Ngāti Tama im Jahr 1835 mit
    Tötungen und Versklavung fand tatsächlich statt, war aber ein anderes Ereignis als die erfundene prähistorische Vertreibung.
impact:
  summary: >-
    Der School Journal war eine Unterrichtspublikation des Department of Education und wurde an sämtliche staatlichen
    Schulen verteilt. Die Beiträge vom Februar, März und Juli 1916 bauten die falsche Erzählung schrittweise auf; 1946
    wiederholte ein weiterer Beitrag ihre Rassenhierarchie, obwohl H. D. Skinner die Festland-Moriori-Theorie bereits in
    den 1920er-Jahren angegriffen hatte. Die von Moriori und Krone vereinbarte historische Darstellung hält fest, dass die
    Ideen während eines Großteils des 20. Jahrhunderts im Unterricht vermittelt wurden, in Medien und politische Debatten
    gelangten und bei Moriori-Nachkommen Scham, Verwirrung, das Verbergen ihrer Identität und den Verlust von Wissen über
    hokopapa verursachten. 2010 entwickelte das Bildungsministerium mit Moriori korrigierendes School-Journal-Material.
    Im Vergleich von 2020 erkannte die Krone den Schaden formell an und entschuldigte sich; das Vergleichsgesetz von 2021
    schrieb diese Entschuldigung gesetzlich fest.
  highlights:
    - value: 3 Beiträge
      label: School-Journal-Beiträge vom Februar, März und Juli 1916, die die falsche Erzählung zusammensetzten
    - value: '1946'
      label: Jahr, in dem der School Journal die angeblich vormāorischen Moriori erneut als minderwertig beschrieb
    - value: 3 Ausgaben
      label: gemeinsam mit Moriori entwickelte korrigierende School Journals von 2010
  context:
    - >-
      Die Erzählung von 1916 entstand schrittweise. Der Februar-Beitrag führte angeblich nicht-māorische „faule, dumme
      Menschen“ ein; der März-Beitrag verband deren Nachkommen mit den Moriori der Chathaminseln; der Juli-Beitrag nannte
      sie eine minderwertige melanesische Rasse, die auf die Chathams verdrängt und „als Rasse ausgestorben“ sei. Nicht jede
      einzelne Ausgabe enthielt sämtliche Behauptungen.
    - >-
      Gemeinsame polynesische Vorfahren heben die Identität der Moriori nicht auf. Moriori sind als eigenständiges lebendes
      Volk und als tchakat henu von Rēkohu anerkannt, mit eigener hokopapa, Sprache, Kultur und Geschichte.
    - >-
      Moriori-Traditionen und archäologische Rekonstruktionen beantworten nicht jedes Detail der ersten Besiedlungsroute
      gleich. Für die Korrektur muss zwischen ihnen nicht entschieden werden: Keine stützt die Rassenhierarchie, die
      Festland-Vertreibungserzählung oder die Aussterbensbehauptung des School Journal.
    - >-
      Die Korrektur leugnet die Invasion Rēkohus von 1835 nicht. Ngāti Mutunga und Ngāti Tama töteten und versklavten
      Moriori, nachdem sie mit einem europäischen Schiff angekommen waren; diese dokumentierte Invasion des 19. Jahrhunderts
      war keine prähistorische Vertreibung eines rassisch eigenständigen Volkes vom neuseeländischen Festland.
    - >-
      Die Episode endet mit den korrigierenden Ausgaben des Ministeriums von 2010. Bildungsministerin Anne Tolley stellte
      das Material im März 2011 im Kopinga Marae vor; die umfassendere Entschuldigung der Krone folgte im Vergleich von
      2020 und im Vergleichsgesetz von 2021.
episodes:
  - id: new-zealand-1916-2010
    polity: Neuseeland
    periodLabel: Februar 1916 – 2010
    institutions:
      - neuseeländisches Department of Education
      - The School Journal
      - neuseeländisches Ministry of Education
    institutionalContext: >-
      Das Department of Education produzierte den School Journal als Grundschullektüre und verteilte ihn an sämtliche
      staatlichen Schulen. Beiträge vom Februar, März und Juli 1916 führten nacheinander eine angeblich vormāorische
      Bevölkerung ein, verbanden sie mit Moriori und beschrieben Moriori als minderwertige melanesische Rasse, die auf die
      Chathams vertrieben worden und ausgestorben sei. Im April 1946 stellte der Journal die angeblichen Moriori-Vorgänger
      erneut als faul und minderwertig dar. Laut vereinbarter Vergleichsgeschichte blieben die Mythen während eines Großteils
      des 20. Jahrhunderts Teil der Unterrichtsvermittlung. 2010 nutzte das Ministry of Education dieselbe Publikationsreihe
      für gemeinsam mit Moriori entwickeltes Material zur Korrektur der Darstellung.
    consequences:
      - Vermittlung einer falschen Rassengeschichte an Generationen neuseeländischer Schulkinder
      - Stigmatisierung der Moriori als minderwertig, primitiv oder ausgestorben
      - Scham, Verwirrung und Verbergen der Moriori-Identität bei manchen Nachkommen
      - Ablehnung oder Verlust von Wissen über Moriori-hokopapa und verringerte Moriori-Autorität über die eigene Identität
      - Verbreitung in Medien und Politik, darunter Argumente zur Rechtfertigung der Pākehā-Kolonisierung
      - Fortbestehen des Mythos trotz veröffentlichter wissenschaftlicher Gegenpositionen
    summary: >-
      Eine staatliche Unterrichtspublikation machte aus einer spekulativen Rassentheorie Schulgeschichte. Ihre Beiträge
      vermengten eine angebliche Festlandsbevölkerung mit den Moriori der Chathaminseln, ordneten sie den Māori unter und
      behandelten Moriori als ausgestorben. Heute erkennt die Krone an, dass diese Lehre Generationen von Moriori schadete.
      2010 veröffentlichte das Ministerium gemeinsam mit Moriori entwickeltes School-Journal-Material, das ausdrücklich
      auch die frühere Fehldarstellung berichtigen sollte.
    mechanism:
      summary: >-
        Das Department verteilte den School Journal als Unterrichtslektüre an sämtliche staatlichen Schulen. Die
        Wiederholung 1916 und 1946 sowie die weitere Verwendung im Unterricht verliehen der Rassenerzählung amtliche
        Reichweite und Langlebigkeit, obwohl Wissenschaftler sie bereits angegriffen hatten.
    institutionalCorrection:
      periodLabel: '2010'
      action: Das Ministry of Education veröffentlichte drei gemeinsam mit Moriori entwickelte School-Journal-Sonderausgaben über Rēkohu und Moriori, ausdrücklich auch zur Berichtigung der Fehldarstellung von 1916.
      summary: >-
        Die korrigierenden Ausgaben gaben Moriori im School Journal eine authentische Stimme und vermittelten Geschichte,
        Kultur und Identität der Moriori. Es folgten die ministerielle Vorstellung 2011 und 2020–2021 die formelle
        Anerkennung und Entschuldigung der Krone für ihre frühere Rolle.
evidence:
  - id: moriori-deed-proposition
    note: >-
      Die zwischen Moriori und der Krone vereinbarte historische Darstellung benennt die Rassentheorie, die Verteilung des
      Journal an sämtliche staatlichen Schulen, die Lehre von 1916 und 1946, ihre Vermittlung im Unterricht und die
      konkreten Formulierungen zu Minderwertigkeit und Aussterben.
  - id: moriori-blank-proposition
    note: >-
      Die historische Studie rekonstruiert getrennt die Beiträge vom Februar, März und Juli 1916 sowie vom April 1946,
      gibt ihre Behauptungen wieder und nennt die genauen Seiten im School Journal.
  - id: moriori-origins-correction
    note: >-
      Die staatliche Enzyklopädie erläutert die Gegenpositionen von Skinner und Duff, die polynesische Erstbesiedlung,
      gemeinsame Vorfahren und die Entwicklung einer eigenständigen Moriori-Kultur auf den Chathaminseln.
  - id: moriori-ta-re-correction
    note: >-
      Die heutige Darstellung der Moriori dokumentiert die Kontinuität von Familien, hokopapa, Kultur und Identität und
      bezeichnet Moriori als lebendes indigenes Volk von Rēkohu.
  - id: moriori-settlement-impact
    note: >-
      Das Vergleichsgesetz hält die Schullehre, das daraus folgende Stigma und den Verlust von Abstammungswissen, den
      Verstoß gegen Te Tiriti sowie die vorbehaltlose Entschuldigung der Krone für die Verbreitung des Mythos fest.
  - id: moriori-deed-impact
    note: >-
      Die ausführliche vereinbarte Darstellung verfolgt die Verbreitung in Schule und Öffentlichkeit und dokumentiert
      Scham, Verwirrung, verborgene Identität, verlorenes hokopapa-Wissen und anhaltendes Stigma bei Moriori-Nachkommen.
  - id: moriori-school-carrier
    note: >-
      Die staatliche Enzyklopädie identifiziert die Ausgabe vom Juli 1916, nennt ihr Moriori-Material schwer fehlerhaft und
      verweist auf den Einfluss des School Journal auf mehrere Generationen. Das Titelblatt belegt die Publikation, nicht den Artikeltext.
  - id: moriori-blank-carrier
    note: >-
      Beschreibt den Journal als Grundschullektüre des Department mit fester Unterrichtsnutzung und zeigt, wie die Serie
      von 1916 und die Wiederholung 1946 die Rassentheorie von Smith und Best in das Bildungswesen trugen.
  - id: moriori-school-mechanism
    note: >-
      Gesetzliche Anerkennung der Krone, dass der School Journal den Mythos Generationen von Schulkindern vermittelte und
      zur Stigmatisierung der Moriori beitrug.
  - id: moriori-settlement-consequences
    note: >-
      Dokumentiert anhaltendes Leid, verringerte Moriori-Autorität über die eigene Identität und die Ablehnung oder den
      Verlust von hokopapa-Wissen, darunter Schäden bei Kindern mit Moriori-Abstammung.
  - id: moriori-deed-consequences
    note: >-
      Dokumentiert die Verbreitung über Schulen hinaus in Medien und Politik, die Nutzung des Mythos zur Rechtfertigung der
      Kolonisierung und unterschiedliche Folgen für Moriori-Nachkommen, einschließlich Widerstand, Scham und Verbergen.
  - id: moriori-origins-context
    note: >-
      Ordnet die School-Journal-Erzählung in Percy Smiths Great-Fleet-Synthese, Elsdon Bests rassistische Erweiterung und
      die wissenschaftlichen Gegenpositionen von H. D. Skinner seit den 1920er- und Roger Duff seit den 1940er-Jahren ein.
  - id: moriori-deed-origins-context
    note: >-
      Dokumentiert Moriori-Traditionen zu Rongomaiwhenua und direkten ost- oder zentralpolynesischen Ursprüngen neben
      späteren Waka-Verbindungen mit Aotearoa und zeigt, weshalb die Korrektur die Moriori-Geschichte nicht auf ein einziges
      Migrationsmodell reduzieren muss.
  - id: moriori-ta-re-context
    note: >-
      Der Moriori-eigene Kontext unterscheidet die falsche prähistorische Vertreibungserzählung von der dokumentierten
      Invasion 1835 und erläutert das Fortleben und die kulturelle Revitalisierung der Moriori.
  - id: moriori-school-2010-correction
    note: >-
      Die Ressource des Ministeriums benennt die drei Sonderausgaben von 2010, ihre Entwicklung mit Moriori und den Zweck,
      ausdrücklich auch die Fehldarstellung des School Journal von 1916 zu berichtigen.
  - id: moriori-minister-correction
    note: >-
      Die Bildungsministerin stellte die neuen Publikationen im Kopinga Marae vor, bezeichnete sie als erste authentische
      Moriori-Stimme im School Journal und erkannte die frühere Fehldarstellung des 20. Jahrhunderts ausdrücklich an.
