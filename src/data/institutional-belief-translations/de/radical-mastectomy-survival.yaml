locale: de
entryId: radical-mastectomy-survival
sourceReviewedAt: '2026-08-27'
title: Radikale Mastektomie als bester Weg zu längerem Überleben bei Brustkrebs
claim: Die möglichst ausgedehnte routinemäßige Entfernung von Brust, Achsellymphknoten und Brustmuskulatur galt bei operablem Brustkrebs als beste Chance auf längeres Überleben, weil man eine schrittweise Ausbreitung der Erkrankung vom lokalen Tumor in die umliegenden Gewebe und Lymphbahnen erwartete.
currentUnderstanding: Bei vielen Patientinnen mit frühem Brustkrebs verbessert eine ausgedehntere lokale Operation das Gesamtüberleben nicht. Randomisierte Studien zeigten keinen Überlebensvorteil der radikalen Mastektomie nach Halsted gegenüber weniger umfangreichen Eingriffen; bei geeigneten Patientinnen kann eine brusterhaltende Operation mit anschließender Strahlentherapie ein mit der Mastektomie vergleichbares Überleben erzielen.
impact:
  summary: Die radikale Mastektomie nach Halsted wurde über weite Teile des 20. Jahrhunderts zur dominierenden Brustkrebsoperation in den USA. Die Logik maximaler lokaler Kontrolle setzte Generationen von Frauen der Entfernung von Brustmuskulatur und umfangreichem Lymphgewebe aus, mit erheblicher Entstellung, Armschwellung und Funktionseinbußen, bevor randomisierte Studien zeigten, dass ein größerer Operationsumfang das Überleben nicht verbesserte.
  context:
  - Die radikale Mastektomie war gegenüber älteren Operationen ein wichtiger Fortschritt bei der lokalen Tumorkontrolle, zu einer Zeit, in der sich Anästhesie, Antisepsis und Krebschirurgie rasch entwickelten.
  - Die Korrektur bedeutet nicht, dass die Mastektomie selbst überholt ist. Sie bleibt in vielen Situationen richtig; verworfen wurde die Regel, dass routinemäßig mehr lokales Gewebe zu entfernen zwangsläufig das Überleben verbessert.
episodes:
- id: united-states-1894-1977
  polity: Vereinigte Staaten
  institutions:
  - The Johns Hopkins Hospital
  - Amerikanische chirurgische Fachwelt
  institutionalContext: William Halsted entwickelte und veröffentlichte seine radikale Mastektomie als Chefchirurg des Johns Hopkins Hospital. Der Eingriff entfernte Brust, Achsellymphknoten und Brustmuskeln en bloc und folgte dem Modell, Brustkrebs breite sich schrittweise durch angrenzendes Gewebe und regionale Lymphbahnen aus. Das Verfahren wurde über Jahrzehnte zum vorherrschenden US-Standard; noch in den 1970er-Jahren konnten Chirurgen, die weniger ausgedehnte Eingriffe vorschlugen, dem Vorwurf einer unzureichenden Behandlung begegnen.
  consequences:
  - Die radikale Mastektomie wurde über weite Teile des 20. Jahrhunderts zur vorherrschenden Brustkrebsoperation in den Vereinigten Staaten
  - Frauen verloren routinemäßig Brust, Achsellymphknoten und Brustmuskulatur, obwohl sich später für viele Fälle gleich wirksame weniger ausgedehnte Operationen zeigten
  - Der Eingriff konnte erhebliche Entstellung, Lymphödeme, Schmerzen, Kraftverlust und eingeschränkte Armbeweglichkeit hinterlassen
  - Randomisierte Studien ab den 1970er-Jahren zeigten, dass weniger umfangreiche Operationen das Überleben nicht verschlechterten, und erzwangen einen grundlegenden Wandel der chirurgischen Standards
  summary: Halsteds Operation am Johns Hopkins Hospital machte aus einem schlüssigen Modell geordneter Tumorausbreitung einen langlebigen chirurgischen Standard. Wenn Brustkrebs sich nach außen durch angrenzende Gewebe und Lymphknoten ausbreitete, schien die möglichst weite Entfernung in einem Block die sicherste Behandlung. Trotz ihrer erheblichen körperlichen Folgen dominierte die radikale Mastektomie jahrzehntelang die US-Therapie. Die 1971 begonnene und 1977 veröffentlichte NSABP-Studie B-04 zeigte, dass Frauen nach der radikalen Operation nicht länger lebten als nach weniger ausgedehnten Eingriffen. Europäische Studien zur Brusterhaltung und spätere US-Studien bestätigten diese Lehre und ersetzten routinemäßige Maximalchirurgie durch eine Behandlung, die Ausdehnung und Biologie der Erkrankung berücksichtigt.
