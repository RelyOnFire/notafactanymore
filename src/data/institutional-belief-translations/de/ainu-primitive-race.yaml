schemaVersion: 2
locale: de
entryId: ainu-primitive-race
sourceReviewedAt: '2026-08-23'
title: Ainu als „primitive Rasse“
proposition:
  summary: >-
    Ainu wurden als „primitives“, rückständiges oder verschwindendes Volk behandelt, dessen Überleben und Modernisierung
    die Assimilation an eine sesshafte japanische Agrargesellschaft erfordere.
correction:
  summary: >-
    Die Ainu sind ein indigenes Volk mit eigenen Geschichten, Sprachen, kulturellen Traditionen und politischen
    Gemeinschaften. Unterschiede zwischen Ainu und japanischen Lebensweisen waren kein Beleg biologischer Rückständigkeit;
    koloniale Enteignung, Einschränkungen von Land- und Subsistenzrechten sowie Assimilationspolitik trugen selbst
    wesentlich zu Verarmung und Bevölkerungsrückgang bei.
episodes:
  - id: japan-1899-1939
    polity: Japan
    periodLabel: belegt 1899–späte 1930er-Jahre
    institutions:
      - 内務省 (Innenministerium)
      - 北海道庁 (Hokkaidō-Verwaltung)
    institutionalContext: >-
      Das Hokkaidō Former Aborigines Protection Act von 1899 übertrug dem Innenminister Durchführungskompetenzen und dem
      Gouverneur der Hokkaidō-Verwaltung unmittelbare Befugnisse über Land, Gemeinschaftsvermögen und Polizeiverordnungen,
      während Landwirtschaft und staatliche Schulbildung gefördert wurden. Im breiteren kolonialen intellektuellen Umfeld
      wurde die Kaiserliche Universität Tokio zu einem Zentrum der physischen Anthropologie, und die Anthropologische
      Gesellschaft Tokio veröffentlichte umfangreiche Ainu-Forschung. Die derzeitige Beleglage weist diese Einrichtungen
      als wichtige Zentren anthropologischer Forschung aus, aber nicht eigenständig als Träger dieser konkreten
      administrativen Behauptung.
    summary: >-
      Die japanische Kolonialverwaltung behandelte Lebensweisen der Ainu wiederholt als etwas, das durch Landwirtschaft und
      Assimilation umgeformt werden müsse. Das Hokkaidō Former Aborigines Protection Act von 1899 förderte agrarische
      Ansiedlung, während Einschränkungen von Land- und Subsistenzrechten auf die Eingliederung in eine vermeintlich
      fortgeschrittenere japanische Gesellschaft hinwirkten. Die physisch-anthropologische Erforschung der Ainu an der
      Kaiserlichen Universität Tokio und durch die Anthropologische Gesellschaft Tokio bleibt hier als breiterer
      intellektueller Kontext erhalten, nicht als eigenständig belegte Trägerschaft dieser konkreten Verwaltungsannahme.
    consequences:
      - Erzwungene Agrarisierung
      - Unterdrückung indigener Lebensweisen
      - Enteignung von Land und Ressourcen
      - Kulturelle Assimilation
    mechanism:
      summary: >-
        Die Kolonialverwaltung nutzte Land-, Landwirtschafts- und Schulbefugnisse zur Assimilation und zur Umgestaltung der
        Lebensgrundlagen der Ainu in Richtung sesshafter Landwirtschaft.
    institutionalCorrection:
      summary: >-
        Die derzeitige Beleglage dokumentiert die spätere historische Zurückweisung der Vorstellung einer „primitiven
        Rasse“, weist aber keinen datierten Akt der aufgeführten japanischen Verwaltungsträger nach, der diese
        institutionelle Behauptung ausdrücklich verworfen hätte.
evidence:
  - id: ainu-colonial-proposition
    note: >-
      Erläutert, wie Darstellungen der Ainu als „primitiv“ zur Rechtfertigung kolonialer Herrschaft institutionalisiert
      wurden und wie das Schutzgesetz von 1899 Ainu zu Bauern machen sollte, während Land- und Subsistenzrechte beschnitten
      wurden.
  - id: ainu-colonial-correction
  - id: ainu-law-carrier
    note: >-
      Primärgesetz von 1899. Es weist Ainu, die Landwirtschaft betreiben oder betreiben wollen, Land zu, überträgt dem
      Gouverneur der Hokkaidō-Verwaltung Befugnisse über Land und Gemeinschaftsvermögen und ermächtigt den Innenminister zu
      Durchführungsvorschriften.
  - id: ainu-law-mechanism
  - id: ainu-colonial-consequences
  - id: ainu-anthropology-context
    note: >-
      Dokumentiert die Kaiserliche Universität Tokio und die Anthropologische Gesellschaft Tokio als bedeutende
      institutionelle Zentren der frühen japanischen Anthropologie und umfangreicher physisch-anthropologischer Forschung
      an den Ainu; hier als breiterer intellektueller Kontext verwendet, nicht als Beleg für die Trägerschaft der konkreten
      administrativen Behauptung.
