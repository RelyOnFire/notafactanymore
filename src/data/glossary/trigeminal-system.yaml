term: Trigeminal system
aliases:
- trigeminal nerve system
- trigeminal pathway
shortDefinition: The sensory nerve system centered on the trigeminal nerve, which carries signals from much of the
  face, head, and tissues around the brain.
longDefinition: The trigeminal system includes the trigeminal nerve and connected brain pathways that process sensation
  from the face, scalp, cranial blood vessels, and the protective coverings of the brain. It is a major part of
  the pain-signaling network involved in migraine.
