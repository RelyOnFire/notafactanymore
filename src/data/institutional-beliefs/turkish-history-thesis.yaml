    institutionalContext: >-
      The Türk Tarihi Tetkik Cemiyeti, renamed Türk Tarih Kurumu in the mid-1930s, developed the thesis and prepared the four-volume secondary-school history series published by the Maarif Vekâleti. The 1937 nationwide anthropometric survey was organized through the health ministry, with the İstatistik Umum Müdürlüğü processing the resulting records. Congresses and individual researchers were important parts of this machinery, but they are not substituted for the formal institutions that carried the programme.
    consequences:
      - National history curriculum
      - State-sponsored racial anthropology
      - Reinterpretation of ancient civilizations
    summary: The Turkish History Thesis became an official framework of early Republican historiography and school history. The Türk Tarihi Tetkik Cemiyeti prepared a four-volume school history series published by the Ministry of Education, while state-sponsored history congresses promoted the thesis. In 1937 the health ministry organized a nationwide anthropometric survey of roughly 64,000 people, with the statistics administration processing the data; Afet İnan used the results to support the thesis's claim that Turks belonged to the white “Alpine” race and had carried civilization outward from Central Asia.
