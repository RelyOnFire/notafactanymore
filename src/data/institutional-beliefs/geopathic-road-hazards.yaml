schemaVersion: 2
title: Geopathic force fields as road-safety hazards
proposition:
  summary: >-
    Invisible “earth radiation” or radiesthetic force fields at particular road locations were treated as capable of
    impairing drivers and contributing to accident blackspots, with energetic interventions able to neutralize the hazard.
correction:
  summary: >-
    No reproducible evidence establishes the localized radiesthetic force fields invoked in these interventions,
    a dowsing or pendulum method that reliably detects them, or an energetic treatment that neutralizes them. A fall in crashes
    after an intervention does not by itself establish that the intervention caused the change, particularly when conventional
    road-safety measures and normal statistical variation are also present.
category: Transport and infrastructure
reviewedAt: 2026-08-23
episodes:
  - id: austria-2003-2008
    polity: Austria
    region: Europe
    startYear: 2003
    endYear: 2008
    strength: policy-basis
    institutionTypes:
      - government
    institutions:
      - ASFINAG
    consequences:
      - Dowsers and pendulum practitioners were commissioned at accident-prone motorway and expressway sections
      - Quartz stones, magnetic-field discs, and other purported energetic devices were installed to divert or neutralize alleged harmful fields
      - ASFINAG publicly presented reductions in crash counts after some interventions as positive experience with the measures
    summary: >-
      In the 2000s Austria's state-owned motorway operator ASFINAG used dowsers and related “energetic” interventions
      at several accident blackspots. In 2003 an ASFINAG spokesperson described years of measures intended to divert alleged
      earth radiation and announced a dowser for the S16 Arlberg expressway, while attributing some earlier reductions in
      crashes to such interventions. ASFINAG later published a page on “esoteric measures at accident accumulation sites”
      presenting post-intervention crash reductions as positive experience. Contemporary reporting also documented conventional
      safety changes and differing police crash counts, undercutting the causal inference that the energetic treatment itself
      improved safety.
    mechanism:
      kind: administrative-adoption
      summary: >-
        ASFINAG commissioned dowsers and installed purported energetic devices at accident blackspots, incorporating
        radiesthetic explanations and interventions into road-safety management alongside conventional measures.
    institutionalCorrection:
      status: undocumented
      summary: >-
        Contemporary reporting documented scientific and internal caution about attributing crash reductions to the
        energetic interventions, but the available record does not identify a dated ASFINAG act formally repudiating them.
