evidence:
  - id: algiers-porot-proposition
    sourceId: algiers-porot-1918
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: Printed pp. 377–384
    note: >-
      The primary article describes North African Muslim soldiers as a population of “primitives” and attributes mental
      debility, elementary instincts, credulity, suggestibility and impulsive reactions to them. It establishes the 1918
      precursor, not the later cortical theory or the full institutional network.
  - id: algiers-evolutionism-correction
    sourceId: algiers-evolutionism
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Abstract; article pp. 163–168
    note: >-
      The author characterises the School's evolutionism as pseudoscientific ideology that legitimated colonial
      hierarchy, while distinguishing that doctrine from Porot's service innovations and identifying Fanon's critique.
  - id: algiers-mup-impact
    sourceId: algiers-mup-history
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: Chapter 8, pp. 248–263
    note: >-
      This scholarly chapter places the early text within the later School, Blida-Joinville and the publications of its
      hospital psychiatrists, and documents the School's durable use of North African “primitivism.”
  - id: algiers-mup-carrier
    sourceId: algiers-mup-history
    relation: documents
    target: {scope: episode, episodeId: french-algeria-1918-1962, aspect: carrier}
    locator: Chapter 8, pp. 251–253
    note: >-
      The chapter identifies the École d'Alger as an influential school from the 1920s and connects its psychiatrists to
      Blida-Joinville, which received patients from 1933 and officially opened in 1938. The faculty chair is documented separately.
  - id: algiers-porot-sutter-mechanism
    sourceId: algiers-porot-sutter-1939
    relation: contextualizes
    target: {scope: episode, episodeId: french-algeria-1918-1962, aspect: mechanism}
    locator: Catalogue description; publication note
    note: >-
      The national-library record establishes the authors, 1939 date, eighteen-page extent and title explicitly linking
      North African “primitivism” to mental pathology. It is bibliographic evidence and is not used as proof of the work's detailed contents.
  - id: algiers-evolutionism-consequences
    sourceId: algiers-evolutionism
    relation: supports
    target: {scope: episode, episodeId: french-algeria-1918-1962, aspect: consequences}
    locator: Abstract; article pp. 163–168
    note: >-
      The abstract supports the consequence concerning scientific legitimation of colonial hierarchy. Separate sources
      document teaching, clinical interpretation and criminal or medico-legal framing.
  - id: algiers-history-context
    sourceId: algiers-history-psychiatry
    relation: contextualizes
    target: {scope: episode, episodeId: french-algeria-1918-1962, aspect: context}
