  - title: 'Adolphe Vorderman''s 1897 study on beriberi: an example of scrupulous efforts to avoid bias'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3595404/
    publisher: Journal of the Royal Society of Medicine
    note: Peer-reviewed reconstruction of Vorderman's official prison investigation, including his use of government
      prison medical records, blinded rice classification and the strong association between polished rice and beriberi.
  - title: 'Christiaan Eijkman: First bacteriologist at Utrecht University, Nobel laureate for his work on vitamins'
