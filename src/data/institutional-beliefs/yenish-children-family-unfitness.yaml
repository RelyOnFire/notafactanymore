evidence:
  - id: yenish-galle-proposition
    sourceId: yenish-galle-2016
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: pp. 417–433 and 644–645
    note: >-
      The archival study distinguishes targeting from formal proof: ancestry and surnames identified families, even when
      settled, while program staff monitored them, sought purported evidence and selectively transmitted information to
      obtain individual removal orders.
  - id: yenish-federal-council-correction
    sourceId: yenish-federal-council-2025
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Opening two paragraphs and section on Kinder der Landstrasse
    note: >-
      Official 2025 recognition that persecution within the program qualifies as crimes against humanity under current
      international law, accompanied by a reaffirmation of the 2013 apology and a mandate for further dialogue.
  - id: yenish-bak-impact
    sourceId: yenish-bak
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: Sections “Pro Juventute und ihre Aktion” and “Etappen auf dem Weg der Aufarbeitung”
    note: >-
      Current federal overview giving around 600 direct program removals, an estimated total of up to 2,000 children from
      Yenish families across similar practices, the placements and blocked family contact, and the 1973 closure.
  - id: yenish-federal-archives-carrier
    sourceId: yenish-federal-archives
    relation: documents
    target: {scope: episode, episodeId: switzerland-1926-1973, aspect: carrier}
    locator: Section “Die «Kinder der Landstrasse»”
    note: >-
      Federal archival account identifying Pro Juventute as the private operator and describing support by the
      Confederation, cantons, municipalities, welfare institutions, homes and private individuals.
  - id: yenish-galle-carrier
    sourceId: yenish-galle-2016
    relation: documents
    target: {scope: episode, episodeId: switzerland-1926-1973, aspect: carrier}
    locator: pp. 93–100, 417–433 and 644–647
    note: >-
      Detailed study of the division of labor between Pro Juventute and public authorities, including the foundation's
      applications, official guardianship decisions and the information network that made the program operate.
  - id: yenish-galle-mechanism
    sourceId: yenish-galle-2016
    relation: documents
    target: {scope: episode, episodeId: switzerland-1926-1973, aspect: mechanism}
    locator: pp. 417–433 and 644–645
    note: >-
      Shows how surname and ancestry drove family registration, how investigation was directed toward producing removal
      evidence, and how favorable information could be withheld from authorities.
  - id: yenish-ekr-dossier-mechanism
    sourceId: yenish-ekr-dossier-2024
    relation: documents
    target: {scope: episode, episodeId: switzerland-1926-1973, aspect: mechanism}
    locator: p. 5
    note: >-
      Federal anti-racism dossier stating that families were targeted regardless of actual lifestyle, a Yenish surname
      could be enough for targeting, racial-biological theories underpinned the project, and separation served cultural dissolution.
  - id: yenish-diggelmann-state-role
    sourceId: yenish-diggelmann-2024
    relation: supports
    target: {scope: episode, episodeId: switzerland-1926-1973, aspect: carrier}
    locator: pp. 20–38 and 52–58
    note: >-
      Reconstructs the private-public division of labor and finds very strong grounds under current attribution standards
      to treat the state as an indispensable co-actor in the persecution.
  - id: yenish-bak-consequences
    sourceId: yenish-bak
    relation: supports
    target: {scope: episode, episodeId: switzerland-1926-1973, aspect: consequences}
    locator: Sections “Pro Juventute und ihre Aktion” and “Proteste der Jenischen und Aktenzugang”
  - id: yenish-galle-consequences
    sourceId: yenish-galle-2016
    relation: supports
    target: {scope: episode, episodeId: switzerland-1926-1973, aspect: consequences}
    locator: pp. 15 and 482–483
    note: >-
      Counts 586 program children in the later full file study and documents institutional placements, psychiatric
      assessment, disrupted schooling, labor placements and long-term estrangement from parents and siblings.
  - id: yenish-inherited-ekr-context
    sourceId: yenish-ekr
    relation: contextualizes
    target: {scope: episode, episodeId: switzerland-1926-1973, aspect: context}
    locator: Current page at the inherited URL, TANGRAM 49 essay “Rassismus und Würde”
    note: >-
      This inherited URL now resolves to Isabella Huser's survivor-authored TANGRAM essay rather than the 2024 dossier
      named by the retained source label. It is used here only for contemporary Yenish criticism of the 2025 federal
      response; the correct dossier PDF is linked separately.
  - id: yenish-diggelmann-legal-context
    sourceId: yenish-diggelmann-2024
