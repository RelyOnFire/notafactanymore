term: Astrometrie
aliases:
- astrometrisch
shortDefinition: Die präzise Messung der Positionen und Bewegungen von Objekten am Himmel.
longDefinition: Astrometrie misst, wo sich Himmelsobjekte befinden und wie sich ihre Positionen mit der Zeit verändern.
  Sie ermöglicht unter anderem Messungen von Eigenbewegung und Parallaxe und ist zentral für Missionen wie Gaia
  der ESA.
