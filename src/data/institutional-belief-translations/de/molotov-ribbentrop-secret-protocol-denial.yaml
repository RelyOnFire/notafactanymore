  - id: protocol-falsifiers-carrier
  - id: protocol-falsifiers-mechanism
  - id: protocol-falin-consequences
  - id: protocol-resolution-institutional-correction
  - id: protocol-presidential-library-context
    note: >-
      Der heutige russische Katalog weist das Original des Geheimprotokolls vom 23. August 1939 und sein Archivdepot aus.
  - id: protocol-statearchive-context
