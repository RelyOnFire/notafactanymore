entryId: electron-diffraction
sourceReviewedAt: '2026-08-21'
term: Elektronenbeugung
aliases:
- Elektronenbeugungsmuster
shortDefinition: Eine Methode, die atomare Strukturen aus dem Muster erschließt, das entsteht, wenn ein Elektronenstrahl
  an einem Material gestreut wird.
longDefinition: Elektronen besitzen Welleneigenschaften. Beim Durchgang durch oder bei der Reflexion an einem geordneten
  Material können sie daher interferieren und ein Beugungsmuster erzeugen. Position und Symmetrie der Punkte oder Ringe
  liefern Informationen über die Anordnung der Atome und die Kristallstruktur. Bei der Entdeckung der Quasikristalle
  war entscheidend, dass das scharfe Muster starke Ordnung zeigte, aber eine Symmetrie besaß, die mit gewöhnlichen periodischen
  Kristallen unvereinbar war.
