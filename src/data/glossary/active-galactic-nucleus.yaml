term: Active galactic nucleus
aliases:
- active galactic nuclei
- AGN
shortDefinition: An unusually luminous compact region at the center of a galaxy, powered by matter falling toward a supermassive
  black hole.
longDefinition: An active galactic nucleus, or AGN, is the energetic central region of a galaxy in which gas and dust
  accreting onto a supermassive black hole produce intense radiation. Quasars are among the most luminous forms of AGN.
  The black hole itself does not emit the observed light; most of the radiation comes from surrounding material heated
  as gravitational energy is converted into heat and motion.
relatedTerms:
- accretion
- redshift
reviewedAt: '2026-08-21'
sources:
- title: Hubble Quasars
  url: https://science.nasa.gov/mission/hubble/science/science-behind-the-discoveries/hubble-quasars/
  publisher: NASA
  note: Explains quasars as the brilliant active centers of distant galaxies associated with supermassive black holes.
