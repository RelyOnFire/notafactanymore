title: Homosexuality as a mental disorder
claim: Homosexuality was treated as a diagnosable mental or sexual disorder within the official medical classification system.
currentUnderstanding: Homosexuality is not a disease, mental disorder, sexual disorder, or perversion. Same-sex attraction is part of normal variation in human sexuality, and attempts to pathologize sexual orientation have no valid medical basis.
category: Psychiatry and sexuality
reviewedAt: 2026-08-22
episodes:
  - id: brazil-1979-1985
    polity: Brazil
    region: Latin America
    startYear: 1979
    endYear: 1985
    periodLabel: 1979–1985
    strength: policy-basis
    institutionTypes: [government, medical, professional]
    institutions:
      - INAMPS health classification system
      - Federal Council of Medicine
      - Brazilian medical services using ICD-9
    consequences:
      - Diagnostic coding as a mental or sexual disorder
      - Medical pathologization of homosexuality
      - Institutional stigma in health care
    summary: Brazil's health system used ICD-9 code 302.0, which placed homosexuality under “sexual deviations and disorders” in the mental-disorders chapter. In 1985, after a formal review requested through the Ministry of Health, the Federal Council of Medicine directed doctors not to use that pathological classification and moved homosexuality out of the disorder code.
    sources:
      - title: Parecer CFM nº 05/1985
        url: https://sistemas.cfm.org.br/normas/visualizar/pareceres/BR/1985/5
        publisher: Conselho Federal de Medicina
        note: Primary 1985 opinion describing the then-current ICD-9 classification of homosexuality as code 302.0 and directing Brazilian physicians to stop coding it as a sexual disorder.
      - title: Histórico — Resolução nº 01/1999
        url: https://site.cfp.org.br/resolucao-01-99/historico/
        publisher: Conselho Federal de Psicologia
        note: Historical overview noting that Brazil's Federal Council of Medicine removed the pathological classification of homosexuality in 1985.
