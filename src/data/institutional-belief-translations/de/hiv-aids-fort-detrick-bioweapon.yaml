  - id: aids-soviet-mechanism
  - id: aids-soviet-consequences
  - id: aids-soviet-partial-correction
    note: >-
      Das zeitgenössische Telegramm hält Adamischins Aussage fest, die sowjetische AIDS-Propaganda sei töricht gewesen und entsprechende Beiträge nähmen ab.
  - id: aids-east-germany-carrier
  - id: aids-east-germany-mechanism
  - id: aids-east-germany-consequences
