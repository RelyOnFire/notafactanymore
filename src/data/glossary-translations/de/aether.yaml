entryId: aether
sourceReviewedAt: '2026-08-21'
term: Äther
aliases:
- aristotelischer Äther
shortDefinition: In der aristotelischen Kosmologie das unvergängliche fünfte Element des Himmels, unterschieden von den
  irdischen Elementen Erde, Wasser, Luft und Feuer.
longDefinition: Aristoteles' Äther war der Stoff des himmlischen Bereichs. Anders als die vier irdischen Elemente, die
  mit Veränderung und geradlinigen natürlichen Bewegungen verbunden waren, sollte Äther ungezeugt, unvergänglich und
  von Natur aus zu ewiger Kreisbewegung fähig sein. Dadurch konnten Sterne und Planeten als physisch grundsätzlich andere
  Materie als irdische Stoffe verstanden werden.
