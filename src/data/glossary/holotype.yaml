term: Holotype
aliases:
- holotypes
- type specimen
shortDefinition: The single specimen designated as the name-bearing reference when a new species or subspecies is formally
  described.
longDefinition: In zoological nomenclature, a holotype is the single specimen fixed as the name-bearing type of a new
  nominal species or subspecies when it is established. It anchors the application of the scientific name; it is not
  necessarily the most complete, typical, or best-preserved specimen known.
relatedTerms:
- bone-histology
reviewedAt: '2026-08-21'
sources:
- title: 'International Code of Zoological Nomenclature: Glossary'
  url: https://code.iczn.org/glossary-2/
  publisher: International Commission on Zoological Nomenclature
  note: Defines a holotype as the single specimen designated or otherwise fixed as the name-bearing type of a nominal
    species or subspecies.
