      craft using only the craft's own resources.
  - id: nps-wright-correction
    sourceId: nps-wright-flyer
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: opening paragraph and “Wilbur and Orville Wright” section
    note: >-
      Identifies the 1903 Flyer as the first successful powered heavier-than-air aircraft and explains that it lifted
      from a launch rail on 17 December, with four flights completed that day.
  - id: loc-photo-correction
    sourceId: loc-first-flight
    relation: documents
    target: {scope: belief, aspect: correction}
    locator: item summary and photograph
    note: >-
      The contemporary photograph records Orville Wright airborne on 17 December 1903 and identifies the event as a
      powered, controlled and sustained flight; the launch rail is visible behind the aircraft.
  - id: loc-timeline-correction
    sourceId: loc-flight-timeline
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: entries for 1903 and 1906
    note: >-
      Distinguishes the Wrights' first powered, sustained and controlled heavier-than-air flight in 1903 from
      Santos-Dumont's first successful powered flight in Europe in 1906.
  - id: fai-santos-dumont-correction
    sourceId: fai-santos-dumont-1906
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: article introduction and flight description
    note: >-
      Defines Santos-Dumont's record precisely as the first officially observed flight in Europe exceeding 25 metres and
      records the later 220-metre flight of 12 November 1906.
  - id: icao-santos-dumont-correction
    sourceId: icao-early-flight-europe
    relation: contextualizes
    target: {scope: belief, aspect: correction}
    locator: section on Santos-Dumont and the 14-bis
    note: >-
      Identifies the October 1906 event as the first sustained flight in Europe and the first certified by the Aéro-Club
      de France and FAI, preserving the 14-bis achievement without assigning it global first-flight priority.
