term: Adipose tissue
aliases:
- fat tissue
- white adipose tissue
shortDefinition: Body tissue specialized for storing fat that also produces hormones and other signaling molecules.
longDefinition: Adipose tissue contains fat-storing adipocytes along with blood vessels, immune cells, connective
  tissue, and other cell types. It stores and releases energy, but also acts as an endocrine and immune organ by
  sending signals to the brain, liver, muscle, and other tissues.
