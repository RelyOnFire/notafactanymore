evidence:
  - id: primitive-fanon-proposition
    sourceId: primitive-fanon-beyond-diversity
    relation: documents
    target: {scope: belief, aspect: proposition}
    note: Describes the Algiers School as dominant in colonial psychiatry and summarizes Porot's claim that North Africans had primitive brain development and lacked higher brain functions.
  - id: primitive-cultural-proposition
    sourceId: primitive-cultural-psychiatry-history
    relation: documents
    target: {scope: belief, aspect: proposition}
    note: Reviews racial essentialism in colonial psychiatry and Porot's theory that the native Algerian mind was structurally different from that of the European.
  - id: primitive-aaba-correction
    sourceId: primitive-aaba-race
    relation: supports
    target: {scope: belief, aspect: correction}
    note: >-
      The professional association's 2019 scientific statement explains that continental races are not discrete biological
      types, do not map human genetic or phenotypic variation, and arose with colonial systems of hierarchy.
  - id: primitive-cultural-correction
    sourceId: primitive-cultural-psychiatry-history
    relation: supports
    target: {scope: belief, aspect: correction}
    note: >-
      Historical review contrasts colonial racial typology with cultural psychiatry's attention to social, cultural, and
      political context and describes later epidemiological evidence that refuted a Carothers psychiatric generalization.
  - id: primitive-lonsdale-impact
    sourceId: primitive-lonsdale-mau-mind
    relation: supports
    target: {scope: belief, aspect: impact}
    note: >-
      Traces how colonial stereotypes, psychiatric expertise, and administrative practice converged in the official
      construction of Mau Mau and in the detention rehabilitation program.
  - id: primitive-porot-primary
