evidence:
  - id: sverdlovsk-reply-proposition
    sourceId: sverdlovsk-soviet-reply
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: paragraphs 2–3 and official statement, paragraphs 1–4
    note: >-
      The 20 March 1980 diplomatic record reproduces the Soviet Foreign Ministry's claim that a natural animal outbreak
      caused intestinal human anthrax through cattle meat sold outside veterinary controls, and its denial of any
      Biological Weapons Convention relevance.
  - id: sverdlovsk-journal-proposition
    sourceId: sverdlovsk-soviet-epidemiology
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: bibliographic record, May 1980, pp. 111–113; PMID 7415678
    note: >-
      Records the contemporary Soviet epidemiology publication that institutionalized the Sverdlovsk explanation in a
      medical journal; the bibliographic indexing includes food contamination, meat, cattle and veterinary transmission.
  - id: sverdlovsk-pathology-correction
    sourceId: sverdlovsk-pathology
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: abstract; pp. 2291 and 2293–2294
    note: >-
      All 42 necropsies showed hemorrhagic thoracic lymphadenitis and mediastinitis diagnostic of inhalational anthrax.
      The authors explained that most gastrointestinal lesions resulted from blood-borne spread and concluded that the
      patients died after inhaling B. anthracis aerosols.
  - id: sverdlovsk-science-correction
    sourceId: sverdlovsk-science
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: abstract and pp. 1205–1206; PMID 7973702
    note: >-
      The field reconstruction found a narrow human-case zone beginning at the military facility, animal deaths along
      its extended axis and the matching northerly wind on 2 April. It concluded that a windborne aerosol escaped from
      the facility while leaving the precise activity and release mechanism unresolved.
  - id: sverdlovsk-academies-correction
    sourceId: sverdlovsk-national-academies
    relation: contextualizes
    target: {scope: belief, aspect: correction}
    locator: 'section “Sverdlovsk, Russia 1979: Accidental Release,” paragraphs 1–18'
    note: >-
      The National Academies review treats 2 April as the best-supported release date but explicitly records uncertainty
      about exact timing and possible multiple or prolonged release. It distinguishes the 42-case autopsy series from
      larger reconstructed datasets whose cases were not all confirmed pathologically or microbiologically.
  - id: sverdlovsk-science-impact
    sourceId: sverdlovsk-science
    relation: documents
    target: {scope: belief, aspect: impact}
    locator: pp. 1203–1205, “Sources of Information,” “Case Data,” and local response paragraphs
    note: >-
      Reports the official count of 96 cases and 64 deaths, the later 77-patient series with 66 fatalities, public meat
      warnings and control measures, and the confiscation of hospital and public-health records. These are distinct and
      incomplete datasets, not interchangeable final totals.
  - id: sverdlovsk-three-overtures-impact
    sourceId: sverdlovsk-three-overtures
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: attached paper, paragraphs 1–10, especially paragraphs 7–10
    note: >-
      The July 1980 paper records the March, late-March and June approaches, the repeated Soviet natural-outbreak answer
      and refusal of expert consultation, and the U.S. assessment that the evidence warranted Article V scrutiny.
  - id: sverdlovsk-academies-impact
    sourceId: sverdlovsk-national-academies
    relation: contextualizes
    target: {scope: belief, aspect: impact}
    locator: 'section “Sverdlovsk, Russia 1979: Accidental Release,” paragraphs 2–18'
    note: >-
      Explains why precise comprehensive clinical and epidemiological data remain unverifiable and warns that only the
      preserved autopsy cases in the larger reconstruction had microbiological or histopathological confirmation.
  - id: sverdlovsk-reply-carrier
    sourceId: sverdlovsk-soviet-reply
    relation: documents
    target: {scope: episode, episodeId: soviet-union-1979-1992, aspect: carrier}
    locator: heading and paragraphs 2–3; official statement, paragraphs 1–4
    note: >-
      Identifies the USSR Foreign Ministry and its USA Department chief Viktor Komplektov as the institution and official
      delivering the foodborne explanation as a formal Soviet response.
  - id: sverdlovsk-journal-carrier
    sourceId: sverdlovsk-soviet-epidemiology
    relation: documents
    target: {scope: episode, episodeId: soviet-union-1979-1992, aspect: carrier}
    locator: title, authors, journal, publication date and indexed subjects; PMID 7415678
    note: >-
      Shows that the explanation also entered a Soviet epidemiology and microbiology journal under named medical authors,
      rather than remaining only an anonymous diplomatic assertion.
  - id: sverdlovsk-science-context
    sourceId: sverdlovsk-science
    relation: documents
    target: {scope: episode, episodeId: soviet-union-1979-1992, aspect: context}
    locator: pp. 1203–1206, especially local response, geographic distribution and discussion
    note: >-
      Reconstructs both sides of the episode: local posters, meat controls, household disinfection, antibiotics and
      vaccination, followed by the victim, animal and wind mapping that showed why infected livestock did not establish
      a foodborne origin for the lethal human cases.
  - id: sverdlovsk-pathology-context
    sourceId: sverdlovsk-pathology
    relation: supports
    target: {scope: episode, episodeId: soviet-union-1979-1992, aspect: context}
    locator: pp. 2291 and 2293–2294
    note: >-
      Resolves an important source of confusion in the official account: intestinal hemorrhages were common, but their
      submucosal distribution showed dissemination through blood after a pulmonary portal of entry rather than primary
      gastrointestinal infection from food.
  - id: sverdlovsk-rejection-mechanism
    sourceId: sverdlovsk-consultation-rejection
    relation: documents
    target: {scope: episode, episodeId: soviet-union-1979-1992, aspect: mechanism}
    locator: paragraphs 2–5
    note: >-
      Documents the Foreign Ministry's 24 April repetition of the natural-epizootic account and its use as the stated
      reason to reject expert consultations under Article V.
  - id: sverdlovsk-archive-mechanism
    sourceId: sverdlovsk-national-security-archive
    relation: contextualizes
    target: {scope: episode, episodeId: soviet-union-1979-1992, aspect: mechanism}
    locator: introduction, paragraphs 8–18, and Documents 27–31 discussion
    note: >-
      The declassified-document chronology shows how restricted access, official scientific presentations and incomplete
      evidence kept the foodborne account plausible to some outside specialists until glasnost-era reporting and field
      access made the competing explanation testable.
  - id: sverdlovsk-three-overtures-consequences
    sourceId: sverdlovsk-three-overtures
    relation: supports
    target: {scope: episode, episodeId: soviet-union-1979-1992, aspect: consequences}
    locator: attached paper, paragraphs 7–10
    note: >-
      Records three formal U.S. approaches by June 1980 and the resulting failure to conduct treaty consultations. The
      document presents the contemporary U.S. assessment, not by itself final proof of the later aerosol reconstruction.
  - id: sverdlovsk-pathology-consequences
    sourceId: sverdlovsk-pathology
    relation: documents
    target: {scope: episode, episodeId: soviet-union-1979-1992, aspect: consequences}
    locator: p. 2291, introduction; p. 2293, final discussion
    note: >-
      Reports that hospital records and autopsy reports were removed while two pathologists privately retained notes and
      specimens. The authors state that secrecy impeded facts useful for diagnosis, treatment and clinicopathological comparison.
  - id: sverdlovsk-academies-consequences
    sourceId: sverdlovsk-national-academies
    relation: contextualizes
    target: {scope: episode, episodeId: soviet-union-1979-1992, aspect: consequences}
    locator: 'section “Sverdlovsk, Russia 1979: Accidental Release,” paragraphs 3–18'
    note: >-
      Confirms the lasting evidentiary cost of confiscated records and explains why later case, fatality and incubation
      estimates depend on partially overlapping reconstructed series.
  - id: sverdlovsk-yeltsin-correction
    sourceId: sverdlovsk-yeltsin
    relation: documents
    target: {scope: episode, episodeId: soviet-union-1979-1992, aspect: institutional-correction}
    locator: 27 May 1992 chronology entry reproducing the Komsomolskaya Pravda exchange
    note: >-
      Reproduces Yeltsin's statement that the KGB admitted Soviet military development caused the outbreak, that weapons
      development continued after laboratories were moved and that he had signed a decree banning the program.
  - id: sverdlovsk-archive-correction
    sourceId: sverdlovsk-national-security-archive
    relation: documents
    target: {scope: episode, episodeId: soviet-union-1979-1992, aspect: institutional-correction}
    locator: introduction, paragraphs 19–27 and 1992–1998 chronology
    note: >-
      Places the interview beside Yeltsin's April 1992 decrees and the later site visits, while documenting renewed
      natural-source denial by a senior Russian defense official in 1998. This supports classifying the correction as partial.
