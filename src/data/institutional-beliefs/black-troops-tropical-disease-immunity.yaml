    publisher: U.S. Army Center of Military History
    note: >-
      Official Army history recounting the 1898 belief that Black soldiers were naturally more immune to tropical
      disease, the 24th Infantry's assignment to Siboney hospital duty, and the finding that 50 percent of 471 men
      there contracted malaria or yellow fever.
