term: Fullerene
aliases:
- fullerenes
- C60
shortDefinition: A carbon molecule whose atoms form a closed hollow cage, such as the roughly spherical C60 molecule.
longDefinition: Fullerenes are molecular allotropes made entirely of carbon atoms arranged in closed cages. The
  1985 discovery of C60 showed that carbon could form stable structures beyond the long-known diamond and graphite
  forms.
relatedTerms:
- carbon-nanotube
reviewedAt: '2026-08-21'
sources:
- title: Broad Family of Carbon Nanoallotropes
  url: https://pubs.acs.org/doi/10.1021/cr500304f
  publisher: American Chemical Society
  note: Reviews the discovery of C60 fullerene and the expansion of known carbon allotropes.
