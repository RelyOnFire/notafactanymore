    relation: documents
    target: {scope: episode, episodeId: united-kingdom-1948-2017, aspect: consequences}
    locator: '§2, ''The policy'', paragraphs 12–15'
    note: >-
      Documents funded hospital services, prescribing expenditure and referrals, including the Tunbridge Wells
      closure after falling referrals and a commissioning review. These passages support all three consequences;
      they do not establish identical provision throughout the UK or until a common closing date.
