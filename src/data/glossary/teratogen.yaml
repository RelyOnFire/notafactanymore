term: Teratogen
aliases:
- teratogenic
- teratogenicity
shortDefinition: An exposure that can disturb embryonic or fetal development and cause congenital abnormalities.
longDefinition: A teratogen is a drug, chemical, infection, physical exposure, or other factor capable of disrupting
  prenatal development. The effect often depends strongly on dose and on the stage of pregnancy at which exposure
  occurs.
