schemaVersion: 2
locale: de
entryId: presidential-herbal-hiv-cure
sourceReviewedAt: '2026-10-03'
title: Präsidentielle Kräuterbehandlung als Heilung von HIV/AIDS
proposition:
  summary: >-
    Die Kräuterzubereitungen von Präsident Yahya Jammeh wurden im staatlichen gambischen President’s Alternative
    Treatment Programme als Mittel behandelt, die HIV binnen weniger Tage aus dem Körper entfernen könnten. Damit
    begründete das Programm das Absetzen der antiretroviralen Therapie und amtliche Erklärungen, Teilnehmer seien geheilt.
correction:
  summary: >-
    Keine klinischen Studien, keine behördliche Prüfung und keine verlässliche Diagnostik belegten, dass Jammehs
    Zubereitungen HIV beseitigten. Ein Anstieg der CD4-Zellzahl oder eine niedrige beziehungsweise nicht nachweisbare
    Viruslast weist keine Eradikation nach. Die heutige antiretrovirale Therapie unterdrückt die HIV-Vermehrung, heilt
    die Infektion aber nicht; eine Unterbrechung kann zu erneutem Virusanstieg, Immunschwäche und klinischer
    Verschlechterung führen. Die WHO warnte bereits im Februar 2007, pflanzliche Mittel dürften weder eine umfassende
    HIV-Versorgung ersetzen noch zum Absetzen der antiretroviralen Therapie führen.
impact:
  summary: >-
    Gambia machte aus der persönlichen Heilungsbehauptung eines Präsidenten ein staatliches Zwangsprogramm. Das
    Präsidialamt, Gesundheitsverantwortliche, öffentliche Krankenhäuser und Labore, Sicherheitskräfte und der staatliche
    Rundfunk trugen Betrieb oder Legitimation des PATP. Die erste Gruppe wurde ohne Einwilligung aufgenommen; später
    freiwillig eingetretene Teilnehmer wurden nicht ausreichend über die Risiken aufgeklärt. Teilnehmer mussten ihre
    antiretrovirale Therapie absetzen, manche wurden bewacht festgehalten und identifizierende Gesundheitsdaten ohne
    Einwilligung ausgestrahlt. Die spätere Wahrheitskommission stellte Verschlechterungen, Todesfälle und zahlreiche
    Menschenrechtsverletzungen fest. Ihr Bericht von 2021 und das Regierungsweißbuch von 2022 bildeten eine formelle
    institutionelle Zurückweisung.
  highlights:
    - value: '2007'
      label: Jahr von Jammehs Verkündung einer raschen HIV/AIDS-Heilung und der Einrichtung des PATP
    - value: 3 Tage
      label: zunächst versprochene Dauer bis zur Beseitigung von HIV bei Teilnehmern
    - value: 25. Mai 2022
      label: Datum der Annahme zentraler PATP-Empfehlungen zu Verantwortung und Gesundheitssystem im Regierungsweißbuch
  context:
    - >-
      Umstritten sind Jammehs nicht offengelegte Zubereitungen und die staatliche Behauptung einer HIV-Heilung. Daraus
      folgt nicht, dass jede traditionelle oder pflanzlich gewonnene Arznei unwirksam ist; jedes einzelne Mittel benötigt
      Belege für Sicherheit, Qualität und Wirksamkeit bei der jeweils behaupteten Anwendung.
    - >-
      Der Zwang war nicht bei allen Teilnehmern gleich. Die Wahrheitskommission stellte fest, dass die erste Gruppe ohne
      Einwilligung in das PATP gezwungen wurde. Spätere Gruppen umfassten Menschen, die freiwillig beitraten, aber nicht
      angemessen über die Risiken aufgeklärt wurden und anschließend Zwangsbehandlung, Isolation und Beschränkungen beim
      Verlassen der Einrichtung ausgesetzt sein konnten.
    - >-
      Das Programm endete im Zuge von Jammehs Wahlniederlage im Dezember 2016. Auf diesen politischen Endpunkt folgten
      nationale ART-Leitlinien und später die ausdrückliche Korrektur durch Wahrheitskommission und Regierung; er
      bezeichnet nicht den Zeitpunkt eines neuen Experiments, das die Präparate widerlegt hätte.
episodes:
  - id: gambia-2007-2016
    polity: Gambia
    institutions:
      - Präsidialamt von Gambia
      - President’s Alternative Treatment Programme (PATP)
      - Ministerium für Gesundheit und Sozialfürsorge
      - Gambia Radio and Television Services (GRTS)
    institutionalContext: >-
      Jammeh verkündete die Heilung als Staatspräsident und schuf das beim Präsidialamt angesiedelte PATP. Das Programm
      nutzte öffentliche Krankenhäuser sowie ärztliches, pflegerisches und labormedizinisches Personal; Dr. Tamsir Mbowe
      leitete seine klinische Arbeit und bestätigte die Heilungsbehauptung. Staatliche Sicherheitskräfte bewachten die
      Teilnehmer, während GRTS Werbesendungen und Teilnehmeraussagen im Fernsehen und Radio ausstrahlte. Das Programm
      bestand von 2007 bis zu Jammehs Wahlniederlage im Dezember 2016.
    consequences:
      - Zwangsaufnahme der ersten Teilnehmergruppe und unzureichende informierte Einwilligung bei späteren Gruppen
      - Absetzen der lebenswichtigen antiretroviralen Therapie mit von der Wahrheitskommission dokumentierten Verschlechterungen und Todesfällen
      - Bewachte Unterbringung, Einschränkung der Bewegungsfreiheit und Trennung von Familie und Freunden
      - Ausstrahlung von Identität, HIV-Status und Testergebnissen der Teilnehmer im nationalen Fernsehen ohne Einwilligung
      - Grausame und erniedrigende Behandlung einschließlich des sexuellen Missbrauchs einiger Teilnehmender, Zwangsarbeit und Aufnahme von Kindern
      - Umleitung öffentlicher Gesundheitsressourcen und Einsatz von Krankenhäusern, Laboren und medizinischer Autorität zur Bestätigung einer ungeprüften Behandlung
    summary: >-
      Von 2007 bis 2016 machte Jammeh mit präsidentieller Macht aus ungeprüften und nicht offengelegten
      Kräuterzubereitungen ein staatliches HIV-Programm. Das PATP setzte die ART der Teilnehmer ab, nutzte reguläre
      medizinische Einrichtungen und Fachpersonal zur Erzeugung von Glaubwürdigkeit, beschränkte die Freiheit der
      Teilnehmer und verbreitete Heilerklärungen über staatliche Medien. Die TRRC stellte später fest, dass weder
      klinische Studien noch Zulassungen die Drei-, Fünf- oder Zehn-Tage-Behauptungen stützten, und dokumentierte schwere
      gesundheitliche und menschenrechtliche Schäden.
    mechanism:
      summary: >-
        Das Präsidialamt schuf ein Behandlungsprogramm, band Gesundheitskräfte und Labore ein, setzte seine Regeln mithilfe
        von Staatsbediensteten und Sicherheitskräften durch und nutzte den nationalen Rundfunk, um die Heilung als medizinisch
        bestätigte staatliche Leistung darzustellen.
    institutionalCorrection:
      periodLabel: 2021–2022
      action: >-
        Die TRRC stufte die Heilungsbehauptung formell als betrügerisch und das Programm als missbräuchlich ein; das
        Weißbuch der Regierung nahm die zentralen Empfehlungen zu strafrechtlicher Verantwortung, Berufsaufsicht,
        Regulierung pflanzlicher Arzneimittel und Zugang zur HIV-Versorgung an.
      summary: >-
        Bereits vor der formellen Aufarbeitung war evidenzbasierte ART wieder der erklärte nationale Standard. 2021
        dokumentierte die TRRC die falsche Behauptung, den staatlichen Apparat und die Schäden in einem eigenen Bericht.
        2022 übernahm die Regierung diese Darstellung und nahm die wesentlichen PATP-Empfehlungen an; für die von der
        Kommission empfohlene Mordanklage verlangte sie weitere Ermittlungen. Umsetzung und individuelle Strafverfahren
        sind von der abgeschlossenen institutionellen Korrektur der Heilungsbehauptung zu unterscheiden.
evidence:
  - id: patp-trrc-proposition
    note: >-
      Amtlicher Bericht der gambischen Wahrheitskommission über Jammehs HIV/AIDS-Heilungsverkündung, Einrichtung und
      Betrieb des PATP, Beteiligung staatlichen Personals, Entzug der Standardbehandlung, Teilnehmeraussagen und daraus
      entstandene Schäden.
  - id: patp-who-2007-proposition
    note: >-
      Die zeitgenössische WHO-Erklärung vom Februar 2007 verneint eine Heilung von HIV/AIDS, bezeichnet kontinuierliche
      antiretrovirale Therapie als wirksame Behandlung und warnt davor, umfassende HIV-Versorgung durch pflanzliche Mittel
      zu ersetzen oder die antiretrovirale Therapie ihretwegen abzusetzen.
  - id: patp-who-current-correction
    note: >-
      Die WHO erklärt, dass heutige ART die Vermehrung von HIV stoppt und ein langes, gesundes Leben ermöglicht, die
      Infektion jedoch nicht heilt.
  - id: patp-nih-interruption-correction
    note: >-
      Die NIH-Leitlinie verbindet eine ART-Unterbrechung mit erneutem Virusanstieg, erhöhtem Übertragungsrisiko,
      Immunschwäche und klinischer Verschlechterung und rät außerhalb klinischer Studien vom Absetzen ab.
  - id: patp-trrc-impact
    note: >-
      Die Kommission führte geschützte und öffentliche Aussagen, klinische und labordiagnostische Befunde sowie
      institutionelle Zeugenaussagen zusammen und dokumentierte Betrieb, Zwang, Gesundheitsverschlechterung, Todesfälle
      und Rechtsverletzungen des Programms.
  - id: patp-trrc-carrier
    note: >-
      Der Bericht identifiziert Präsidialamt und PATP, beteiligte Minister und Ärzte, öffentliche Krankenhäuser und
      Labore, staatliche Sicherheitskräfte und GRTS als operative oder propagierende Träger.
  - id: patp-trrc-mechanism
    note: >-
      Der Bericht zeichnet nach, wie präsidentielle Weisungen in Aufnahme, erzwungenes Absetzen der ART, bewachte
      Behandlung, klinische Überwachung, Laborbehauptungen und im Staatsrundfunk ausgestrahlte Heilerklärungen übergingen.
  - id: patp-trrc-consequences
    note: >-
      Die Feststellungen behandeln Freiheitsentzug, Verletzungen der Privatsphäre, erniedrigenden und sexuellen Missbrauch,
      Zwangsarbeit, ART-Absetzung, Gesundheitsverschlechterung, Todesfälle und die Aufnahme von Kindern.
  - id: patp-trrc-context
    note: >-
      Die Kommission unterschied die erste Gruppe, deren Teilnahme erzwungen wurde und ohne Einwilligung erfolgte, von
      späteren Teilnehmern, die freiwillig eintreten konnten, aber keine angemessene Risikoaufklärung erhielten.
  - id: patp-trrc-institutional-correction
    note: >-
      Die TRRC bezeichnete die Behandlung formell als ungeprüft, betrügerisch und nicht zugelassen und empfahl
      Verantwortungszuweisung, Berufsaufsicht, Regulierung sowie umfassende HIV-Versorgung.
  - id: patp-white-paper-institutional-correction
    note: >-
      Die Regierung übernahm die PATP-Darstellung der TRRC und nahm Empfehlungen zu Strafverfahren wegen Fahrlässigkeit
      und erniedrigender Behandlung, Kindern, Berufsaufsicht, Regulierung pflanzlicher Mittel, HIV-Versorgung,
      Vertraulichkeit und Berufsethik an; vor einer Mordanklage verlangte sie weitere Beweise.
  - id: patp-gambia-guidelines-institutional-correction
    note: >-
      Die nationale Leitlinie nach Jammeh verpflichtet die Regierung zur kostenlosen Abgabe antiretroviraler Mittel in
      öffentlichen Einrichtungen und definiert ART als virusunterdrückende, gewöhnlich lebenslange Behandlung.
