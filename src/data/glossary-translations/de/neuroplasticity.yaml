locale: de
entryId: neuroplasticity
sourceReviewedAt: '2026-08-21'
term: Neuroplastizität
aliases:
- neuronale Plastizität
- Hirnplastizität
shortDefinition: Die Fähigkeit des Nervensystems, Struktur, Verbindungen oder Funktion durch Erfahrung, Lernen,
  Verletzungen oder andere Bedingungen zu verändern.
longDefinition: Neuroplastizität bezeichnet die Fähigkeit des Nervensystems zur Reorganisation. Dazu können Veränderungen
  der synaptischen Stärke, der Vernetzung, kortikaler Repräsentationen und messbarer Aspekte der Hirnstruktur gehören.
  Diese Plastizität besteht auch im Erwachsenenalter fort, ist aber unter anderem von Alter, Hirnregion, Erfahrung,
  Verletzung, Erkrankung und Training abhängig.
