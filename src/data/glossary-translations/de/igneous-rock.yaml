term: Magmatisches Gestein
aliases:
- magmatische Gesteine
- Magmatit
- Magmatite
shortDefinition: Gestein, das entsteht, wenn geschmolzenes Gestein – Magma oder Lava – abkühlt und erstarrt.
longDefinition: Magmatische Gesteine entstehen durch Abkühlung und Erstarrung geschmolzenen Gesteins. Unterirdisch abkühlendes
  Magma kann Tiefengesteine wie Granit bilden; Lava, die an oder nahe der Oberfläche erstarrt, bildet vulkanische Gesteine
  wie Basalt. Korngröße und Gefüge hängen stark von Zusammensetzung und Abkühlungsgeschichte ab.
