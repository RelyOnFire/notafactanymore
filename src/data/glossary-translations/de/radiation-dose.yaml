entryId: radiation-dose
sourceReviewedAt: '2026-08-21'
term: Strahlendosis
aliases:
- Dosis
- Energiedosis
- effektive Dosis
shortDefinition: Eine Messgröße dafür, wie viel Energie ionisierender Strahlung in Materie deponiert wird oder, im Strahlenschutz,
  welche biologische Bedeutung eine Exposition hat.
longDefinition: Strahlendosis umfasst mehrere verwandte Messgrößen. Die Energiedosis beschreibt die deponierte Energie
  pro Masse und wird in Gray angegeben. Im Strahlenschutz werden zusätzlich Äquivalent- und effektive Dosis in Sievert
  verwendet, um Strahlungsart und unterschiedliche Empfindlichkeit von Geweben zu berücksichtigen. Wiederholte Expositionen
  tragen zur kumulativen Strahlenbelastung bei, auch wenn das biologische Risiko nicht allein von der Dosis bestimmt
  wird.
