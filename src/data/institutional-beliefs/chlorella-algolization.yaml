evidence:
  - id: chlorella-review-belief-correction
    sourceId: chlorella-water-resources-2023
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: pp. 329–333, especially pp. 331–332
    note: >-
      The review finds no regular effect across repeated applications, identifies missing comparison waters and other
      methodological defects, rejects several proposed mechanisms, and concludes that later research did not support
      Chlorella as a natural-water bloom-control biomanipulation.
  - id: chlorella-review-impact
    sourceId: chlorella-water-resources-2023
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: pp. 331–332
    note: >-
      It reproduces the adverse 2008 scientific assessment, the 2014 society resolution and the Federal Water Resources
      Agency letter reporting the inconclusive 2007 trial and negative 2009 council conclusion.
  - id: chlorella-review-episode-context
    sourceId: chlorella-water-resources-2023
    relation: contextualizes
    target: {scope: episode, episodeId: russia-2022-2026, aspect: context}
    locator: pp. 331–333
    note: >-
      The peer-reviewed review documents that major Russian scientific and water-management objections predated the 2022
      and 2025 standards, establishing the contradiction central to the episode.
  - id: chlorella-congress-episode-context
    sourceId: chlorella-congress-2014
    relation: documents
    target: {scope: episode, episodeId: russia-2022-2026, aspect: context}
    locator: p. 2
    note: >-
      The congress decision calls the so-called algolization method false and damaging to Russian hydrobiology and calls
      for modern scientific methods against eutrophication. The institute's live society page identifies and links this
      decision, although the legacy PDF link was unavailable at the latest review.
  - id: chlorella-gost59977-proposition
    sourceId: chlorella-gost-59977
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: §§5.1.1–5.1.5
    note: >-
      The 2022 national standard defines algolization as bloom prevention and water-body rehabilitation and says the
      technology should improve oxygen, oxygen-demand measures, pathogens, petroleum products, metals, nutrients and
      organoleptic properties.
  - id: chlorella-gost59977-mechanism
    sourceId: chlorella-gost-59977
    relation: documents
    target: {scope: episode, episodeId: russia-2022-2026, aspect: mechanism}
    locator: §§5.1.6–5.2.3
    note: >-
      It specifies preliminary study, strain testing, a rehabilitation plan, cultivation, at least three inoculations per
      growing season, monitoring and a minimum single-dose volume for the named Chlorella strain.
  - id: chlorella-gost71946-catalog-carrier
    sourceId: chlorella-gost-71946-catalog
    relation: documents
    target: {scope: episode, episodeId: russia-2022-2026, aspect: carrier}
    locator: official catalogue record, status and scope fields
    note: >-
      The official catalogue lists the 16-page standard as active from 1 June 2025, identifies Technical Committee 409,
      INEKO as developer and Order 59-st, and states its coverage of drinking, recreational, fisheries and biological-
      treatment waters.
  - id: chlorella-gost71946-catalog-consequences
    sourceId: chlorella-gost-71946-catalog
    relation: documents
    target: {scope: episode, episodeId: russia-2022-2026, aspect: consequences}
    locator: scope abstract and status fields
    note: >-
      The catalogue confirms that algolization received a dedicated, currently active national standard across several
      consequential water-use categories.
  - id: chlorella-notification-carrier
    sourceId: chlorella-gost-71946-notification
    relation: documents
    target: {scope: episode, episodeId: russia-2022-2026, aspect: carrier}
    locator: approval-notification record 179826
    note: >-
      The standards institute's notification records Rosstandart registration of GOST R 71946-2025, corroborating the
      formal approval route independently of the catalogue description.
  - id: chlorella-law-episode-context
    sourceId: chlorella-law-162
