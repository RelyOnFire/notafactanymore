term: Pre-Clovis
aliases:
- pre-Clovis
- pre-Clovis sites
shortDefinition: A broad archaeological label for human presence in the Americas that predates the Clovis culture.
longDefinition: Pre-Clovis is not the name of a single people or culture. It is a chronological label for archaeological
  evidence older than Clovis. Sites such as Monte Verde helped establish that humans were present in the Americas before
  the Clovis horizon, while the exact timing and routes of the earliest migrations remain debated.
relatedTerms:
- clovis
reviewedAt: '2026-08-21'
sources:
- title: Peopling of the Americas
  url: https://www.nps.gov/subjects/archaeology/peopling-of-the-americas.htm
  publisher: U.S. National Park Service
  note: States that most scholars accept a human presence before Clovis while the timing and migration routes remain
    unresolved.
