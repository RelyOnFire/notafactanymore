title: Lobotomy as an effective psychiatric treatment
entryId: lobotomy-is-safe-and-effective
claim: Severing or destroying connections in the frontal lobes was treated as therapeutically beneficial enough
  to justify lobotomy as a routine or institutional treatment for schizophrenia and other severe psychiatric or
  behavioral conditions.
currentUnderstanding: The broad prefrontal and transorbital lobotomies of the mid-twentieth century were not supported
  by evidence strong enough to justify their widespread, irreversible use. Early claims relied heavily on uncontrolled
  case series and on outcomes such as reduced agitation or easier institutional management, while results were inconsistent
  and serious harms included personality and cognitive changes, apathy or disinhibition, seizures, neurological
  injury, and death. Some patients were reported to improve, but improvement did not establish that large destructive
  frontal lesions were a specific or proportionate treatment. Modern psychiatric neurosurgery uses much more targeted
  techniques for rare, highly selected refractory conditions and should not be conflated with historical lobotomy.
category: Medicine and public health
reviewedAt: '2026-08-24'
impact:
  summary: Lobotomy moved from an experimental operation into government hospitals and national psychiatric systems
    despite uncertain efficacy and irreversible neurological harm. The institutional endorsement reached from state
    mental hospitals and the U.S. Veterans Administration to the 1949 Nobel Prize for the claimed therapeutic value
    of leucotomy. In several systems the procedure was used partly because it made severely disturbed institutional
    patients easier to manage.
  highlights:
  - value: '1949'
    label: Nobel Prize awarded for the claimed therapeutic value of leucotomy in certain psychoses
  - value: 47 VA hospitals
    label: authorized to conduct lobotomy programs in the United States by June 1950
  - value: ≈4,500
    label: people lobotomized in Sweden during its mid-century psychosurgery era
  context:
  - The historical error concerns the broad destructive lobotomy procedures of the 1930s–1970s. Modern stereotactic
    and neuromodulatory psychiatric neurosurgery uses different techniques, indications and evidence and is not
    scientifically equivalent to historical lobotomy.
  - Reports that some lobotomized patients improved do not establish broad efficacy. Institutions often counted
    reduced agitation, reduced aggression, discharge, or easier ward management as therapeutic success. Those outcomes
    must be weighed against irreversible changes in cognition, motivation and personality and against the weak controls
    in much of the original evidence.
episodes:
- id: united-states-va-1944-1960
  polity: United States — Veterans Administration
  region: North America
  startYear: 1944
  endYear: 1960
  strength: policy-basis
  institutionTypes:
  - government
  - medical
  institutions:
  - United States Veterans Administration
  - Veterans Administration neuropsychiatric hospitals
  institutionalContext: The Veterans Administration institutionalized frontal lobotomy in its postwar psychiatric
    system. Its 1944 annual report recorded special physician training and introduction of prefrontal lobotomy at
    several hospitals. By June 1950, 47 VA hospitals were authorized to operate lobotomy programs and more than
    1,400 VA psychiatric patients had undergone the operation, most of them people diagnosed with chronic schizophrenia.
    The VA described lobotomy as an established appropriate treatment in selected cases while simultaneously launching
    a cooperative study because the evidence remained uncertain. The multi-hospital research program continued through
    the 1950s as psychotropic drugs began displacing lobotomy; the 1960 endpoint marks the end of the mass-program
    era rather than a single national ban.
  consequences:
  - Irreversible brain surgery on hospitalized veterans with psychiatric disorders
  - Large-scale institutional exposure across dozens of federal hospitals
  - Personality and behavioral changes treated partly as therapeutic success
  - Risk of seizures, neurological injury, dependency and death
  - Continued clinical use while the federal system was still trying to determine which patients, if any, benefited
  summary: The U.S. Veterans Administration adopted prefrontal lobotomy as a treatment for severe psychiatric illness
    during and after World War II. By 1950 it had authorized programs at 47 hospitals and treated more than 1,400
    veterans, while describing the operation as appropriate for selected patients. Yet the VA's own researchers
    had already found that supposed benefits were not clearly reflected in discharge or independent functioning,
    prompting a six-hospital comparative study. Lobotomy remained in the VA treatment and research system through
    the 1950s before the mass program gave way to psychopharmacology and tighter controls.
  sources:
  - title: Annual Report of the Administrator of Veterans Affairs for Fiscal Year 1950
    url: https://www.va.gov/vetdata/docs/FY1950.pdf
    publisher: United States Veterans Administration
    note: Primary federal annual report stating that 47 hospitals were authorized to conduct lobotomy programs,
      more than 1,400 VA patients had been operated on by 30 June 1950, and lobotomy had established itself as an
      appropriate treatment in selected psychiatric cases while a controlled multi-hospital evaluation was being
      organized.
  - title: The Veterans Administration study of prefrontal lobotomy
    url: https://pubmed.ncbi.nlm.nih.gov/13796225/
    publisher: Journal of Clinical and Experimental Psychopathology / PubMed
    note: Primary 1959 publication of the Veterans Administration cooperative study, documenting the federal system's
      formal evaluation of prefrontal lobotomy in veterans.
  - title: 'Psychosurgery, ethics, and media: a history of Walter Freeman and the lobotomy'
    url: https://pubmed.ncbi.nlm.nih.gov/28859561/
    publisher: Neurosurgical Focus / PubMed
    note: Peer-reviewed historical review of the U.S. lobotomy movement, its widespread clinical adoption, poor
      outcomes, ethical problems, and decline with regulatory scrutiny and antipsychotic medication.
- id: sweden-1944-1964
  polity: Sweden
  region: Europe
  startYear: 1944
  endYear: 1964
  strength: policy-basis
  institutionTypes:
  - government
  - medical
  - academy
  institutions:
  - Swedish National Board of Health (Medicinalstyrelsen)
  - Umedalen State Mental Hospital
  - Sidsjön State Mental Hospital
  - Swedish state mental-hospital system
  institutionalContext: Swedish neurosurgeons and psychiatrists began prefrontal lobotomy in 1944. Umedalen and
    Sidsjön state mental hospitals adopted it on a large scale in 1946–1947, and the practice spread nationally
    with medical superintendents given broad autonomy by the state mental-health administration. Historical research
    estimates roughly 4,500 Swedish lobotomies, with women forming a majority and schizophrenia the dominant diagnosis.
    At Umedalen, 771 lobotomies were performed from 1947–1958 with 7.4% postoperative mortality. The international
    professional endorsement was reinforced in 1949 when the Nobel Prize in Physiology or Medicine was awarded to
    Egas Moniz for the claimed therapeutic value of leucotomy.
  consequences:
  - Thousands of people underwent irreversible psychosurgery in psychiatric institutions
  - Women were disproportionately represented among operated patients
  - Some state hospitals experienced substantial postoperative mortality
  - General surgeons performed lobotomies at institutions without specialist neurosurgical facilities
  - Personality alteration and behavioral quieting could be counted as treatment success
  summary: Sweden adopted lobotomy rapidly after its introduction in 1944, including large programs at the state
    mental hospitals Umedalen and Sidsjön. Approximately 4,500 people were ultimately lobotomized, most commonly
    for schizophrenia, and the state health authority largely left implementation to individual hospital superintendents
    even where mortality was high. Umedalen alone performed 771 operations with 7.4% postoperative mortality. Use
    declined during the 1950s but continued into the early 1960s.
  sources:
  - title: 'Psychosurgery in Sweden 1944–1958: the practice, the professional and media discourse'
    url: https://swepub.kb.se/bib/swepub%3Aoai%3ADiVA.org%3Aumu-1084
    publisher: Umeå University / SwePub, National Library of Sweden
    note: Doctoral research documenting rapid state-hospital implementation, approximately 4,500 Swedish lobotomies,
      771 operations and 7.4% mortality at Umedalen, the predominance of women and schizophrenia, and the limited
      restraining role of the Swedish National Board of Health.
  - title: Lobotomi — Motion 2006/07:So394
    url: https://www.riksdagen.se/sv/dokument-och-lagar/dokument/motion/lobotomi_gu02so394/
    publisher: Sveriges riksdag
    note: 'Parliamentary record summarizing the Swedish historical evidence: around 4,500 people lobotomized, 61%
      women, schizophrenia as the most common diagnosis, high mortality, and regular lobotomy continuing as late
      as 1963.'
  - title: The Nobel Prize in Physiology or Medicine 1949
    url: https://www.nobelprize.org/prizes/medicine/1949/summary/
    publisher: Nobel Prize Outreach
    note: Official Nobel record showing that Egas Moniz received half of the 1949 medicine prize for the 'therapeutic
      value of leucotomy in certain psychoses,' an unusually prominent institutional endorsement during the procedure's
      expansion.
- id: norway-1941-1974
  polity: Norway
  region: Europe
  startYear: 1941
  endYear: 1974
  strength: policy-basis
  institutionTypes:
  - government
  - medical
  institutions:
  - Norwegian psychiatric hospitals
  - Gaustad Hospital
  - Norwegian health authorities
  institutionalContext: 'Norwegian psychiatric hospitals began lobotomy at Gaustad in 1941 and the procedure spread
    to most hospitals over the following years. Government retrospectives describe a system in which the practice
    continued into the 1970s. Historical compensation records also make the autonomy and consent framework unusually
    clear: explicit consent from the patient, guardian, or relatives was not necessarily required under the rules
    then used. In the 1990s Norway investigated the practice nationally and established a general compensation scheme
    covering everyone documented as having been lobotomized from 1941 through 1974.'
  consequences:
  - Irreversible psychosurgery performed on psychiatric patients without a modern consent standard
  - Personality changes and cognitive or functional impairment
  - Elevated risk of epilepsy and other neurological sequelae
  - Deaths associated with the operation
  - Later nationwide state compensation for surviving people who had undergone lobotomy
  summary: Norway used lobotomy in psychiatric hospitals from 1941 until 1974. Later government reviews concluded
    that the intervention had been regarded by the profession as acceptable at the time, even though it produced
    irreversible outcomes, personality changes, epilepsy and deaths and could be performed without the consent standards
    expected today. After a national inquiry, the government created a general compensation scheme for people who
    had undergone the procedure.
  sources:
  - title: NOU 2011:9 — Økt selvbestemmelse og rettssikkerhet
    url: https://www.regjeringen.no/no/dokumenter/nou-2011-9/id647625/?ch=5
    publisher: Norwegian Government
    note: Official government historical review stating that lobotomy began at Gaustad in 1941, spread to most hospitals,
      declined after antipsychotic medication was introduced, and ceased in the 1970s.
  - title: St.meld. nr. 44 (2003–2004) — compensation schemes, section on lobotomized patients
    url: https://www.regjeringen.no/no/dokumenter/stmeld-nr-44-2003-2004-/id198295/?ch=7
    publisher: Norwegian Government
    note: Official account of the national lobotomy inquiry and compensation scheme. It emphasizes the irreversibility
      of the operation, general personality changes, epilepsy and other sequelae, deaths, and compensation for everyone
      documented as lobotomized during 1941–1974.
  - title: St.prp. nr. 29 (1996–97) — compensation cases for people subjected to lobotomy
    url: https://www.regjeringen.no/no/dokumenter/stprp-nr-29-1996-97-/id201205/?ch=3
    publisher: Norwegian Government
    note: Official compensation record reproducing the historical evaluation criteria and stating that patient consent
      or explicit consent from a guardian or relatives was not required under the contemporary framework; it also
      documents disputed indications, young patients and later sequelae.
