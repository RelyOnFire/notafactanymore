entryId: nucleon
sourceReviewedAt: '2026-08-21'
term: Nukleon
aliases:
- Nukleonen
shortDefinition: 'Sammelbegriff für die beiden Teilchen, aus denen gewöhnliche Atomkerne bestehen: Protonen und Neutronen.'
longDefinition: Protonen und Neutronen werden gemeinsam als Nukleonen bezeichnet, weil beide den Atomkern bilden und
  an der starken Wechselwirkung beteiligt sind. Sie sind keine fundamentalen Teilchen, sondern zusammengesetzte Hadronen,
  deren innere Struktur durch Quarks und Gluonen beschrieben wird.
