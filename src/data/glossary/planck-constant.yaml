term: Planck constant
aliases:
- Planck's constant
- h
shortDefinition: A fundamental constant of quantum physics that sets the proportionality between a photon's energy
  and its frequency.
longDefinition: The Planck constant, symbol h, connects energy and frequency through the relation E = hν. Since
  the 2019 SI redefinition, its numerical value is fixed exactly, allowing the kilogram to be realized through precision
  measurements rather than defined by a physical artifact.
relatedTerms: []
reviewedAt: '2026-08-21'
sources:
- title: 'Kilogram: The Present'
  url: https://www.nist.gov/si-redefinition/kilogram-present
  publisher: National Institute of Standards and Technology
  note: Explains the kilogram's current definition through the fixed numerical value of the Planck constant.
