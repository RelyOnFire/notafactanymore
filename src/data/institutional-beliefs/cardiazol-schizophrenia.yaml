schemaVersion: 2
title: Cardiazol-induced seizures as a treatment for schizophrenia
proposition:
  summary: >-
    Cardiazol (pentylenetetrazol/Metrazol) was promoted as a means of inducing remission in schizophrenia by provoking
    epileptiform seizures. Ladislas Meduna's founding explanation was a biological antagonism between epilepsy and schizophrenia;
    British adopters could endorse the treatment while doubting that explanation.
correction:
  summary: >-
    Schizophrenia and epilepsy are not biologically opposing disease states whose coexistence can be therapeutically
    reversed by provoking seizures. Early Cardiazol results were distorted by uncontrolled comparisons, changing diagnostic
    definitions and outcome measures that sometimes equated quieter or more manageable behavior with recovery. Convulsive
    treatment itself should not be dismissed wholesale: NICE recommends considering modern ECT for severe depression
    in specified circumstances, including a need for rapid response or unsuccessful other treatments, and for catatonia
    after adequate trials of other treatments have failed and/or the condition is potentially life-threatening. NICE
    does not recommend ECT for the general management of schizophrenia. These indications do not validate Meduna's
    antagonism theory or the routine use of an intensely distressing, poorly controlled chemical convulsant for schizophrenia.
category: Medicine and public health
reviewedAt: '2026-09-19'
impact:
  summary: >-
    Cardiazol therapy spread through British public mental hospitals within roughly two years of its introduction.
    Patients received intravenous convulsant injections that could produce overwhelming pre-seizure terror and violent
    generalized convulsions. The Board of Control investigated and reported on the method as hospitals adopted it;
    clinical enthusiasm could persist despite doubts about its original theory.
  highlights:
    - value: 89 / 92
      label: Institutions using Cardiazol among 92 using shock treatments in the Board's late-1938 survey
      note: The survey was published in 1939; 92 is not the total number of British mental hospitals.
    - value: '1938'
      label: Board of Control for England and Wales published its report on Cardiazol treatment
    - value: '1941'
      label: Hemphill and Walter described the original schizophrenia-specific conception as abandoned
      note: >-
        McCrae attributes this assessment to their 1941 paper; it was not a national withdrawal of Cardiazol.
  context:
    - >-
      Cardiazol is also known as pentylenetetrazol or Metrazol. Chemical Cardiazol convulsions for schizophrenia are
      distinct from modern ECT. ECT replaced Cardiazol partly because an electrical stimulus allowed a more controllable
      seizure with less pre-convulsive terror and fewer traumatic injuries.
    - >-
      Some later evidence suggested convulsive treatment could benefit affective illness. That does not rescue Meduna's
      original claim that schizophrenia could be treated because epilepsy and schizophrenia were biologically antagonistic.
    - >-
      Replacement by ECT was uneven. McCrae documents continued Cardiazol use at Graylingwell and Runwell in the 1940s
      and at Netherne in 1950; the 1941 statement does not date the end of treatment.
episodes:
  - id: england-wales-1937-1941
    polity: England and Wales
    region: Europe
    startYear: 1937
    endYear: 1939
    periodLabel: 1937–1939 (documented adoption)
    strength: institutionally-influential
    institutionTypes:
      - government
      - medical
    institutions:
      - Board of Control for England and Wales
      - Bexley Hospital
    institutionalContext: >-
      Bexley Hospital began Cardiazol treatment in June 1937 and established a dedicated ward after London County
      Council supported Leslie Cook's visit to Budapest. In 1938 Cook described Bexley's experience and confidence
      in the treatment, while explicitly calling Meduna's antagonism hypothesis debatable. The Board of Control sent
      officials to Hungary in autumn 1937. Its annual report for 1937, published in 1938, noted use at several institutions.
      It also published a dedicated report in 1938 and surveyed shock treatments late that year: 89 of 92 institutions
      using shock treatments used Cardiazol. In its report published in 1939, the
      Board justified continuing the available shock methods pending better treatments. These acts establish clinical
      adoption and administrative encouragement, not uniform acceptance of Meduna's biological explanation. Discussion
      at the Royal Medico-Psychological Association (RMPA) in 1938 included dissent; the Maudsley barred Cardiazol
      trials because of patients' fear and distress. The episode dates cover this adoption sequence, not cessation.
      Later evidence that epilepsy and schizophrenia can coexist, and current guidance on selected ECT indications,
      require separate evaluation from the historical treatment claims.
    consequences:
      - Large-scale chemical induction of generalized seizures in psychiatric patients
      - Extreme anticipatory fear and distress immediately before convulsions
      - >-
        Reported risks of vertebral and other fractures and memory disturbance, sometimes persisting for months
      - Behavioral quieting or ward manageability could be misclassified as therapeutic improvement
      - >-
        Rapid diffusion through surveyed institutions before the underlying schizophrenia theory had been established
    summary: >-
      Cardiazol entered English mental hospitals in 1937 as a treatment intended to induce remission in schizophrenia.
      At Bexley, Cook promoted its clinical value despite doubts about Meduna's biological-antagonism explanation.
      The Board of Control investigated the method, found it in use at 89 surveyed institutions in late 1938, and
      subsequently justified continuing the available shock treatments. Experience exposed unstable remission claims,
      severe distress and injuries, and problems in judging improvement. Hemphill and Walter's 1941 statement about
      the original conception, reported by McCrae, does not establish withdrawal by the Board or Bexley; Cardiazol
      continued in some other hospitals after ECT became available.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Bexley organized a dedicated treatment ward and repeated courses of induced seizures, which Cook presented
        as clinically valuable. The Board of Control investigated and circulated findings, surveyed use and justified
        continuing available shock methods. These clinical and administrative channels sustained treatment claims
        without requiring agreement on Meduna's proposed mechanism.
    institutionalCorrection:
      status: undocumented
      summary: >-
        The checked sources do not establish a dated withdrawal or repudiation by the Board of Control or Bexley Hospital.
        Clinical criticism of the original rationale and gradual replacement by ECT are documented, but cannot supply
        that missing institutional act. McCrae attributes the 1941 assessment to Hemphill and Walter and documents
        continuing Cardiazol use elsewhere in the 1940s and later.
