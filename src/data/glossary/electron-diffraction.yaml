term: Electron diffraction
aliases:
- electron-diffraction
- electron diffraction pattern
- electron-diffraction pattern
shortDefinition: A technique that infers atomic-scale structure from the pattern produced when a beam of electrons scatters
  from a material.
longDefinition: Electrons have wave-like behavior, so a beam passing through or reflecting from an ordered material can
  interfere to form a diffraction pattern. The positions and symmetries of the resulting spots or rings reveal information
  about atomic arrangement and crystal structure. Electron diffraction was central to the discovery of quasicrystals
  because their sharp pattern showed strong order together with symmetry incompatible with ordinary periodic crystals.
