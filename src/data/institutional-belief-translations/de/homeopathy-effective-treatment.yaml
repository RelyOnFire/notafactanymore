locale: de
entryId: homeopathy-effective-treatment
sourceReviewedAt: 2026-08-22
title: Homöopathie als wirksame Behandlung
claim: Homöopathische Präparate wurden als therapeutisch wirksam genug behandelt, um ihre Bereitstellung oder Erstattung in öffentlichen Gesundheitssystemen zu rechtfertigen.
currentUnderstanding: Für Homöopathie sind bei keiner bekannten Krankheit robuste und reproduzierbare therapeutische Wirkungen über den Placeboeffekt hinaus belegt. Zentrale Annahmen der Homöopathie – darunter Wirkungen extremer Verdünnungen, die kein Molekül des Ausgangsstoffs mehr enthalten können – sind mit etablierter Chemie und Pharmakologie nicht vereinbar. Zuwendung und Placeboeffekte können das subjektive Befinden beeinflussen, belegen aber keine spezifische Wirkung des homöopathischen Präparats.
episodes:
  - id: united-kingdom-1948-2017
    polity: Vereinigtes Königreich
    summary: Homöopathie wurde seit der Gründung des NHS 1948 öffentlich finanziert und angeboten, unter anderem über spezialisierte homöopathische Krankenhäuser und Verordnungen in der Primärversorgung. Eine Untersuchung des britischen Unterhauses kam 2010 zu dem Schluss, dass die Evidenz keine Wirksamkeit über Placebo hinaus stützte und empfahl ein Ende der NHS-Finanzierung. 2017 führte NHS England nationale Leitlinien ein, nach denen Homöopathie wegen fehlender klarer und belastbarer Wirksamkeitsnachweise nicht mehr routinemäßig verordnet werden sollte.
    consequences:
      - Öffentliche Finanzierung homöopathischer Behandlung
      - Verordnungen und Überweisungen im NHS
      - Spezialisierte homöopathische Krankenhausangebote
  - id: france-1984-2020
    polity: Frankreich
    summary: Homöopathische Arzneimittel waren in Frankreich auf Grundlage einer Regelung von 1984 durch die gesetzliche Krankenversicherung erstattungsfähig. 2019 führte die Haute Autorité de Santé erstmals eine wissenschaftliche Bewertung speziell zur Erstattungsfähigkeit durch und kam zu dem Ergebnis, dass die Wirksamkeit für eine öffentliche Finanzierung nicht ausreichend belegt war. 2020 wurde die Erstattung reduziert und zum 1. Januar 2021 vollständig beendet.
    consequences:
      - Öffentliche Erstattung homöopathischer Arzneimittel
      - Routinemäßige Verordnung im versicherten Gesundheitssystem
      - Institutionelle medizinische Legitimität ohne vorherige Wirksamkeitsbewertung
  - id: brazil-2006-2026
    polity: Brasilien
    summary: Brasiliens Nationale Politik für Integrative und Komplementäre Praktiken nahm Homöopathie 2006 ausdrücklich in das öffentliche SUS-System auf und wies staatliche Stellen an, homöopathische Konsultationen, Arzneimittel, Fortbildung und Versorgungsangebote auszubauen. Die Politik schrieb der Homöopathie Beiträge zu Prävention und Genesung sowie zu einer Verringerung konventioneller Interventionen zu. Homöopathie ist 2026 weiterhin Bestandteil des nationalen PNPIC-Rahmens.
    consequences:
      - Öffentliche Bereitstellung homöopathischer Versorgung
      - Einbindung in Primär- und Spezialversorgung
      - Öffentliche Bereitstellung homöopathischer Arzneimittel
      - Ausbildung und Verbreitung im Gesundheitssystem
