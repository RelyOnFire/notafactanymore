title: Liutiaohu railway bombing as Chinese sabotage
claim: >-
  The Kwantung Army and Japanese government presented the 18 September 1931 explosion on the South Manchuria Railway
  near Mukden as sabotage by Chinese troops followed by an attack on Japanese railway guards, using the alleged Chinese
  aggression to justify rapid Japanese military action in Manchuria.
currentUnderstanding: >-
  The railway explosion at Liutiaohu was staged by the Japanese Kwantung Army and then attributed to the Chinese side.
  Japan's own archival service now states that the Kwantung Army caused the incident by blowing up the South Manchuria
  Railway and made it appear to be China's doing in order to launch military action into the three northeastern
  provinces. The central Wakatsuki government did not originate the plot and initially called for non-expansion, but it
  soon adopted the false Chinese-sabotage account in official statements.
category: War, military deception and state propaganda
reviewedAt: '2026-08-25'
impact:
  summary: >-
    The fabricated sabotage claim became the immediate self-defense rationale for the Kwantung Army's offensive and was
    then adopted by the Japanese government in international diplomacy. Within days Japanese forces expanded far beyond
    the railway explosion site. Japan's archival service describes the operation as an attempt to use the incident,
    falsely attributed to China, to launch military action into Fengtian, Jilin and Heilongjiang. The Manchurian
    Incident culminated in the establishment of Manchukuo in March 1932 and its recognition by Japan that September.
  highlights:
  - value: 18 September 1931
    label: date the Kwantung Army staged the Liutiaohu railway explosion
  - value: '3'
    label: northeastern provinces into which JACAR says the Kwantung Army sought to expand military action using the incident
  - value: March 1932
    label: establishment of Manchukuo after the Japanese occupation of Manchuria
  context:
  - >-
    The Kwantung Army and Japan's civilian cabinet were distinct actors. The Wakatsuki government initially adopted
    a policy of non-expansion and did not plan the staged explosion. The false account gained broader state adoption when the
    Japanese government itself publicly repeated the assertion that Chinese troops had destroyed the railway and
    attacked Japanese guards.
  - >-
    “Mukden Incident” commonly refers to the broader crisis and military expansion beginning on 18 September 1931.
    Liutiaohu, near Mukden, identifies the railway explosion itself and is more precise for the specific false attribution of the blast to Chinese forces.
  - >-
    The staged explosion served as a pretext and policy basis for the Kwantung Army's military action. It was not,
    by itself, the cause of the entire Second Sino-Japanese War or the Second World War, and later war casualty totals
    cannot be attributed to this false sabotage claim alone.
episodes:
- id: japan-1931-1932
  polity: Japan
  region: East Asia
  startYear: 1931
  endYear: 1932
  strength: policy-basis
  institutionTypes:
  - government
  - military
  institutions:
  - Kwantung Army
  - Japanese government
  institutionalContext: >-
    On the night of 18 September 1931 the Kwantung Army staged an explosion on the South Manchuria Railway at Liutiaohu
    and blamed Chinese forces. The claim immediately supported attacks around Mukden and expansion into Manchuria.
    Although the Wakatsuki Cabinet initially instructed the military not to expand the conflict, an official Japanese
    government statement issued after an extraordinary cabinet meeting on 24 September asserted that a detachment of
    Chinese troops had destroyed the railway tracks near Mukden and attacked Japanese railway guards, forcing the army
    to act swiftly. Japan transmitted the same account internationally, including to the League of Nations. Military
    expansion continued, and Manchukuo was established in March 1932 and formally recognized by Japan in September.
  consequences:
  - Immediate Japanese military attacks and occupation around Mukden under a claimed self-defense rationale
  - Expansion of Kwantung Army operations into the three northeastern provinces of Fengtian, Jilin and Heilongjiang
  - Official Japanese diplomatic presentation of the staged incident as Chinese aggression
  - Japanese occupation of Manchuria and establishment of Manchukuo in March 1932
  - Transformation of a military false flag into an international dispute over Japanese expansion in China
  summary: >-
    Liutiaohu is a particularly clear institutional false-incident episode because the fabricated proposition was built
    into action almost immediately. The Kwantung Army created the railway explosion, blamed Chinese troops and used the
    alleged attack to expand military operations. Tokyo did not originate the plot and at first tried to limit the
    fighting, but within days the Japanese government itself officially repeated the false Chinese-sabotage story as
    justification for Japanese military conduct. Japan's present-day historical archive explicitly identifies the
    explosion as a Kwantung Army act made to appear Chinese.
  sources:
  - title: Chapter 6 — Manchuria
    url: https://www.jacar.go.jp/exhibition/shusen80/chapter6/
    publisher: Japan Center for Asian Historical Records, National Archives of Japan
    note: >-
      Current official Japanese archival account stating that on 18 September 1931 the Kwantung Army caused the
      Liutiaohu Incident by blowing up the South Manchuria Railway, made it appear to be the Chinese side's doing and
      used the incident to attempt military action into Fengtian, Jilin and Heilongjiang, ultimately occupying Manchuria.
  - title: Japanese Government statement issued after the extraordinary cabinet meeting of 24 September 1931
    url: https://history.state.gov/historicaldocuments/frus1931-41v01/d10
    publisher: U.S. Department of State, Office of the Historian
    note: >-
      Contemporary reproduction of the official Japanese cabinet statement delivered by the Japanese Embassy. It
      asserts that Chinese troops destroyed the South Manchuria Railway near Mukden and attacked Japanese railway guards,
      and says the Japanese Army had to act swiftly in response.
  - title: League of Nations Official Journal — December 1931, Manchurian Incident records
    url: https://www.jacar.archives.go.jp/das/image-en/B02030375100
    publisher: Japan Center for Asian Historical Records, National Archives of Japan
    note: >-
      Digitized League of Nations proceedings preserved in Japan's Diplomatic Archives. They include the Japanese
      government's September 24 statement identifying Chinese soldiers as the perpetrators of the railway destruction
      and show the false account being carried into international diplomacy.
  - title: Manchurian Incident — Asia Historical Learning
    url: https://www.jacar.go.jp/learning/term.html?uid=Y50C300071
    publisher: Japan Center for Asian Historical Records, National Archives of Japan
    note: >-
      Official educational archival resource describing the Liutiaohu explosion as planned by Kwantung Army officers,
      the attempt to make the incident appear to be China's doing, the civilian cabinet's initial non-expansion policy
      and the subsequent expansion of military operations.
