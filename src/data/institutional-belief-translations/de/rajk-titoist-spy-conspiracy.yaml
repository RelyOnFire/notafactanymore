schemaVersion: 2
locale: de
entryId: rajk-titoist-spy-conspiracy
sourceReviewedAt: '2026-09-25'
title: Die Rajk-Gruppe als titoistisches Spionagenetz
proposition:
  summary: >-
    Ungarns kommunistische Parteiführung, Staatssicherheit, Staatsanwaltschaft und Volksgericht stellten László Rajk
    und eine wachsende Gruppe von Funktionären als imperialistisches und titoistisches Spionage- und Terrornetz dar.
    Erzwungene Geständnisse, eine staatliche Anklage, ein im Rundfunk übertragener öffentlicher Prozess, ein Strafurteil
    und eine amtliche Publikation machten die konstruierte Behauptung zur autoritativen Tatsache und zur Grundlage
    verbundener Säuberungsverfahren.
correction:
  summary: >-
    Ungarische Archiv- und Geschichtsinstitutionen ordnen den Fall als politischen Schauprozess auf Grundlage
    fabrizierter Vorwürfe ein. Rajk widersetzte sich zunächst Anschuldigungen über imperialistische Spionage und die
    politische Polizei der Horthy-Zeit; nach Folter und dem Eingreifen sowjetischer Berater wurde das Drehbuch auf Titos
    Jugoslawien ausgerichtet. 1954 begann eine Überprüfung. Am 25. November 1955 sprach der Oberste Gerichtshof Rajk,
    Szőnyi und Szalai frei, doch der Beschluss blieb geheim. Im März 1956 räumte Mátyás Rákosi ein, der
    Prozess habe auf einer Provokation beruht; die Partei genehmigte die öffentliche Wiederbestattung Rajks und dreier
    weiterer Opfer am 6. Oktober 1956.
impact:
  summary: >-
    Der Hauptprozess vom September 1949 war nur ein Teil eines größeren Säuberungskomplexes. Eine Aufstellung des
    ungarischen Innenministeriums, die im Juni 1964 dem Zentralkomitee der Partei übergeben wurde, ordnete dem Rajk-Fall
    Verfahren gegen 155 Menschen zu: 97 wurden verurteilt und 50 interniert; 15 der Verurteilten wurden hingerichtet.
    Das Volksgericht verurteilte Rajk, Tibor Szőnyi und András Szalai zum Tode, anschließend wurde das angebliche Netz
    in ungefähr 30 verbundenen Prozessen ausgeweitet. Der Freispruch blieb geheim, während die Wiederbestattung im
    Oktober 1956 zu einer Massendemonstration gegen das Rákosi-System wurde.
  highlights:
    - value: '155'
      label: Menschen in Verfahren des weiteren Rajk-Komplexes laut Innenministeriumsaufstellung von 1964
    - value: '97'
      label: in diesen Verfahren verurteilte Menschen
    - value: '15'
      label: hingerichtete Menschen; diese Zahl ist in den 97 Verurteilungen enthalten
  context:
    - >-
      Die rückblickende Aufstellung von 1964 fasste zahlreiche verbundene Verfahren unter dem Rajk-Fall zusammen. Die
      97 Verurteilungen und 50 Internierungen sind getrennte Verfahrensausgänge; die 15 Hinrichtungen gehören zu den
      Verurteilungen. Eine inhaftierte Person starb während der Untersuchung, eine durch Suizid; gegen sechs Menschen
      wurde das Verfahren eingestellt.
    - >-
      Die Zahlen des weiteren Komplexes sind weder die Zahl der Angeklagten noch die Zahl der Todesurteile im öffentlichen
      Hauptprozess. Dieser begann mit acht Angeklagten; Rajk, Szőnyi und Szalai erhielten seine drei Todesurteile, während
      die Verfahren gegen zwei militärische Angeklagte an die Militärjustiz abgegeben wurden.
    - >-
      Die Beschuldigung veränderte sich während der Untersuchung. Die erste Konstruktion betonte angebliche imperialistische
      Spionage und Zusammenarbeit mit der politischen Polizei der Horthy-Zeit. Nach dem sowjetisch-jugoslawischen Bruch
      von 1948 rückten sowjetische Berater Tito und Jugoslawien in den Mittelpunkt des Drehbuchs.
    - >-
      Die Korrektur verlief in getrennten Schritten: geheime Überprüfung ab 1954, nicht veröffentlichter Freispruch des
      Obersten Gerichtshofs im November 1955, Rákosis Eingeständnis im März 1956 und eine von der Partei genehmigte
      öffentliche Wiederbestattung im Oktober. Die antistalinistische Demonstration der Menge war eine öffentliche
      Folge dieses Prozesses und kein gerichtlicher Beschluss.
episodes:
  - id: hungary-1949-1956
    polity: Ungarn
    institutions:
      - Ungarische Partei der Werktätigen (MDP)
      - Staatsschutzbehörde (ÁVH)
      - Budapester Staatsanwaltschaft
      - Budapester Volksgericht
    institutionalContext: >-
      Parteiführer billigten Rajks Festnahme und steuerten den entstehenden Fall; ÁVH-Vernehmer und sowjetische Berater
      erzwangen und koordinierten Geständnisse; die Budapester Staatsanwaltschaft erhob Anklage; und das Budapester
      Volksgericht verwandelte das Drehbuch in Verurteilungen. Der öffentliche Prozess lief vom 16. bis 24. September
      1949 und wurde im Rundfunk übertragen; ein amtliches Prozessbuch verbreitete Anklage, Aussagen,
      Plädoyer der Staatsanwaltschaft und Urteil. Das Verschwörungsetikett ordnete anschließend Dutzende verbundener
      Strafverfahren und Internierungen. Die Überprüfung begann 1954, am 25. November 1955 folgte heimlich der
      Freispruch, und amtliches Eingeständnis sowie Wiederbestattung machten die Umkehr 1956 sichtbar.
    consequences:
      - Hinrichtung von Rajk, Szőnyi und Szalai nach dem öffentlichen Hauptprozess sowie weitere Hinrichtungen in verbundenen Verfahren
      - Haft und Internierung von Menschen, die dem wachsenden angeblichen Netz zugerechnet wurden
      - Nutzung des Prozesses für ein antititoistisches und antiimperialistisches Feindbild im ungarischen Parteistaat
      - Rundfunkübertragung und staatliche Veröffentlichung koordinierter Geständnisse und Vorwürfe als gerichtlicher Beweis
      - Fünfjährige Haftstrafe für Júlia Rajk und Unterbringung des gemeinsamen Säuglings unter einem anderen Namen in einem Heim
      - Auf einen geheimen Freispruch folgende öffentliche Wiederbestattung, die zum Massenprotest gegen stalinistische Repression wurde
    summary: >-
      Partei, Staatssicherheit, Staatsanwaltschaft und Justiz verwandelten ein wechselndes politisches Drehbuch in ein
      öffentliches Strafurteil und nutzten das angebliche Netz anschließend in verbundenen Fällen weiter. Eine spätere
      Innenministeriumsprüfung zählte im weiteren Komplex 155 Menschen, gegen die Verfahren geführt wurden. Derselbe
      Staat kehrte den Fall zwischen 1954 und 1956 schrittweise um: Überprüfung, geheimer Freispruch, amtliches
      Eingeständnis und öffentliche Wiederbestattung.
    mechanism:
      summary: >-
        Parteisteuerung, Zwangsverhöre, abgestimmte Geständnisse, Anklage, eine im Rundfunk übertragene Gerichtsinszenierung
        und amtliche Veröffentlichung machten die angebliche Verschwörung als Strafurteil und Propaganda durchsetzbar;
        weitere Beschuldigte konnten anschließend demselben konstruierten Netz zugerechnet werden.
    institutionalCorrection:
      periodLabel: 1954–6. Oktober 1956
      action: >-
        Ungarische Behörden überprüften den Fall, der Oberste Gerichtshof sprach Rajk, Szőnyi und Szalai frei, Rákosi
        gestand die Provokation ein und die Partei genehmigte eine öffentliche Wiederbestattung.
      summary: >-
        Der Staat verwarf schließlich den zentralen Verschwörungsvorwurf und rehabilitierte Rajk, Szőnyi und Szalai. Weil
        der Freispruch vom November 1955 geheim blieb, bildeten das Eingeständnis im März und die Wiederbestattung im
        Oktober 1956 eigene institutionelle Schritte, welche die Umkehr öffentlich sichtbar machten.
evidence:
  - id: rajk-blue-book-proposition
    note: >-
      Die zeitgenössische staatliche Publikation überliefert amtliche Anschuldigungen, Anklageerzählung und Urteil. Sie
      dokumentiert die institutionelle Behauptung der Verschwörung; sie belegt nicht die Wahrheit der Vorwürfe.
  - id: rajk-study-correction
    note: >-
      Die Archivstudie bezeichnet die ersten Vorwürfe als fabriziert und verfolgt Folter, sowjetische Beratung, die
      titoistische Umarbeitung, Steuerung des Gerichts, Urteile und Ausweitung der Säuberungen.
  - id: rajk-research-correction
    note: >-
      Dokumentiert den Freispruch vom 25. November 1955, seine Geheimhaltung, Rákosis Eingeständnis im März 1956 sowie
      Parteibeschluss und Exhumierung vor der Wiederbestattung im Oktober.
  - id: rajk-retrial-correction
    note: >-
      Die Fachstudie datiert das geschlossene Wiederaufnahmeverfahren auf den 23. bis 25. November 1955, verzeichnet die
      Anhörung von 27 Zeugen und den Freispruch von Rajk, Szőnyi und Szalai am 25. November.
  - id: rajk-1964-impact
    note: >-
      Gibt die Innenministeriumsaufstellung vom Juni 1964 wieder: Verfahren gegen 155 Menschen, 97 Verurteilungen, 50
      Internierungen, ein Tod während der Untersuchung, ein Suizid, sechs Einstellungen und 15 Hinrichtungen.
  - id: rajk-research-impact
    note: >-
      Unterscheidet Hauptprozess und Urteile von ungefähr 30 Nebenprozessen und dokumentiert die Folgen für Rajks Frau
      und Säugling sowie die späteren Korrekturschritte.
  - id: rajk-chronology-carrier
    note: >-
      Der Archivführer verzeichnet aufeinanderfolgende Maßnahmen von Sekretariat, Politbüro und Zentralkomitee zu
      Festnahme, angeblicher Spionagegruppe, Prozess und Propaganda.
  - id: rajk-prison-carrier
    note: >-
      Belegt anhand von Parteiakten Rákosis Entscheidung, sowjetische Berater, MDP-Sekretariat und Zentralkomitee sowie
      die Rolle der Staatssicherheit bei Konstruktion und Durchführung des Falls.
  - id: rajk-blue-book-carrier
    note: >-
      Identifiziert die Budapester Staatsanwaltschaft und das Volksgericht und überliefert ihre Anklage und ihr Urteil.
  - id: rajk-study-carrier
    note: >-
      Verbindet Parteiführung, Staatssicherheit und Volksgericht mit Festnahme, Zwangsuntersuchung, gesteuertem Prozess,
      Urteil und Hinrichtung.
  - id: rajk-chronology-mechanism
    note: >-
      Die verzeichneten Akten umfassen die Sitzung des Zentralkomitees zur angeblichen Spionagegruppe und einen
      Sekretariatsvorschlag zur Prozesspropaganda; die Parteisteuerung ging dem öffentlichen Urteil voraus.
  - id: rajk-study-mechanism
    note: >-
      Beschreibt psychischen Druck, Folter, die Umarbeitung durch sowjetische Berater, Rákosis Echtzeitsteuerung des
      Prozesses, Rundfunkübertragung und die daraus folgenden Todesurteile.
  - id: rajk-blue-book-mechanism
    note: >-
      Die amtliche Publikation zeigt die abgestimmte Struktur, in der Geständnisse, Anklage und Urteil das angebliche
      Netz als bewiesene Tatsache darstellten.
  - id: rajk-1964-consequences
    note: >-
      Liefert die spätere amtliche Bilanz von Verfahren, Verurteilungen, Internierungen, Todesfällen und Strafmaßen im
      weiteren Rajk-Komplex.
  - id: rajk-study-consequences
    note: >-
      Dokumentiert die drei Todesurteile des Hauptprozesses, Rajks Hinrichtung, die Bestrafung seiner Frau, die
      Wegnahme des Sohnes und die Rolle des Prozesses zu Beginn einer Säuberungswelle in der Parteiführung.
  - id: rajk-chronology-correction
    note: >-
      Der Archivführer datiert Überprüfungsbeschluss und wiederholte Untersuchungsberichte ab Juli 1954, spätere
      Rehabilitierungsarbeit, den Bestattungsvorschlag vom März 1956 und die Beisetzungsvorbereitungen der Partei im Oktober.
  - id: rajk-research-institutional-correction
    note: >-
      Trennt geheimen Freispruch des Obersten Gerichtshofs, politisches Eingeständnis, Parteigenehmigung, Exhumierung
      und öffentliche Wiederbestattung, statt die Rehabilitierung als einen undatierten Akt darzustellen.
  - id: rajk-retrial-institutional-correction
    note: >-
      Bestätigt, dass die gerichtliche Korrektur ein geschlossenes Wiederaufnahmeverfahren war, das am 25. November
      1955 endete, bevor politische und zeremonielle Schritte die Umkehr 1956 öffentlich machten.
  - id: rajk-un-institutional-correction
    note: >-
      Der zeitgenössische UN-Bericht verzeichnet Rákosis Erklärung vom 27. März 1956, der Oberste Gerichtshof habe die
      Rajk-Verfahren auf fabrizierte Vorwürfe zurückgeführt, sowie Wiederbestattung und Demonstrationen vom 6. Oktober.
  - id: rajk-1956-context
    note: >-
      Die amtliche Archivübersicht beschreibt die Wiederbestattung vom 6. Oktober als Massendemonstration von
      Zehntausenden und als unmittelbaren Vorläufer der politischen Mobilisierung später im Monat.
