evidence:
  - id: beos-dfsl-proposition
    sourceId: beos-dfsl-current
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: Sections “Techniques Available in This Department” and “Legal & Ethical Considerations”
    note: >-
      The current official page calls BEOS an EEG-based method designed to detect experiential knowledge gained by
      participating in a crime and lists it among techniques available in the department.
  - id: beos-murphy-rissman-correction
    sourceId: beos-murphy-rissman-2020
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: §§ II.A, III.A.2 and V.C.2
    note: >-
      Peer-reviewed analysis explains source confusion, false or distorted memory, innocent-but-informed false
      positives and the gap between detecting a memory and proving the truth or origin of that memory.
  - id: beos-rissman-murphy-correction
    sourceId: beos-rissman-murphy-2024
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Chapter 81, pp. 2338–2339 and 2346–2348
    note: >-
      The updated scholarly review says BEOS methods have not undergone rigorous peer review and cannot be critically
      evaluated without disclosure of the precise methods and validation conditions; it also reviews broader limits on
      translating memory detection to individual forensic conclusions.
  - id: beos-murphy-rissman-impact
    sourceId: beos-murphy-rissman-2020
    relation: supports
