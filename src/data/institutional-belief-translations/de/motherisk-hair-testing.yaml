schemaVersion: 2
locale: de
entryId: motherisk-hair-testing
sourceReviewedAt: 2026-08-23
title: Motherisk-Haaranalysen als forensischer Beweis
proposition:
  summary: Haarstrangtests des Motherisk-Labors galten als zuverlässig genug, um Drogen- oder Alkoholkonsum beziehungsweise entsprechende Expositionen in Kinderschutz- und Strafverfahren festzustellen.
correction:
  summary: Haaranalysen können in der Toxikologie aussagekräftig sein, wenn validierte forensische Verfahren, Bestätigungstests, Kontaminationskontrollen und eine entsprechend vorsichtige Interpretation eingesetzt werden. Die Methoden und Auswertungen des Motherisk Drug Testing Laboratory zwischen 2005 und 2015 erfüllten jedoch international anerkannte forensische Standards nicht und wurden für die Verwendung als Beweismittel als unzureichend und unzuverlässig beurteilt.
impact:
  summary: Motherisk war kein isolierter Laborfehler. Zwischen 2005 und 2015 untersuchte das Labor für Kinderschutzzwecke mehr als 24.000 Haarproben von über 16.000 Personen. Nachdem die Tests als Beweismittel für unzureichend und unzuverlässig beurteilt worden waren, richtete Ontario eine Kommission ein, die 1.271 Fälle von Kinderschutzorganisationen prüfte, um möglicherweise Betroffene zu identifizieren.
  highlights:
    - value: Mehr als 24.000
      label: Für Kinderschutzzwecke untersuchte Haarproben, 2005–2015
    - value: Mehr als 16.000
      label: In diesen Tests erfasste Personen
    - value: '1.271'
      label: Von der Motherisk-Kommission geprüfte Kinderschutzfälle
      note: Ein geprüfter Fall ist nicht gleichbedeutend mit einem Fall, in dem der Test das Ergebnis bestimmt hat.
  context:
    - Das Problem war nicht, dass Haaranalytik als toxikologisches Verfahren grundsätzlich bedeutungslos wäre. Entscheidend war vielmehr, dass sich ein Krankenhauslabor von klinischer Diagnostik zu Untersuchungen entwickelte, die für rechtliche Tatsachenfeststellungen verwendet wurden, ohne die Validierung, Bestätigungstests, Qualitätskontrollen, Ringversuche und zurückhaltende Interpretation, die von einem forensischen Labor erwartet werden.
    - Sobald ein Laborbefund in ein Kinderschutzverfahren einging, konnte er beeinflussen, wie Behörden und Gerichte Drogen- oder Alkoholkonsum von Eltern bewerteten. Ein technischer Messwert erhielt dadurch institutionelle Folgen weit außerhalb des Labors. Ontario musste deshalb nicht nur die Analytik, sondern auch nachgelagerte Entscheidungen überprüfen, die sich auf diese Ergebnisse gestützt haben könnten.
episodes:
  - id: ontario-2005-2015
    polity: Ontario, Kanada
    institutions:
      - Motherisk Drug Testing Laboratory am Hospital for Sick Children (SickKids)
      - Ontario Ministry of Children and Youth Services
    institutionalContext: >-
      Motherisk-Ergebnisse liefen durch das gesamte Kinderschutzsystem Ontarios: Children’s Aid Societies beauftragten oder nutzten die Tests, und Ergebnisse gelangten in Verfahren vor Gerichten in Ontario. Die zahlreichen nachgelagerten Stellen bildeten einen verteilten institutionellen Apparat aus Kinderschutzorganisationen und Gerichten in Ontario, nicht eine einzelne Institution.
    summary: Zwischen 2005 und 2015 untersuchte das Motherisk Drug Testing Laboratory am Hospital for Sick Children in Toronto Tausende Haarproben auf Drogen- und Alkoholkonsum oder entsprechende Expositionen. Die Ergebnisse wurden vor allem in Kinderschutzverfahren und in einzelnen Strafverfahren verwendet. Eine unabhängige Untersuchung der Provinz kam zu dem Schluss, dass die Haarstrangtests dieses Zeitraums als Beweismittel unzureichend und unzuverlässig waren und der Laborbetrieb international anerkannte forensische Standards nicht erfüllte. Ontario wies die Kinderschutzbehörden daraufhin an, die Tests nicht mehr zu verwenden, und richtete ein weiteres Verfahren zur Überprüfung möglicherweise betroffener Kinderschutzfälle ein.
    consequences:
      - Haaranalysen wurden in Kinderschutzverfahren in ganz Ontario verwendet
      - Laborbefunde galten als Beleg für Drogen- oder Alkoholkonsum beziehungsweise entsprechende Expositionen
      - Ontario wies die Kinderschutzbehörden an, Motherisk-Haaranalysen nicht mehr zu verwenden oder sich darauf zu stützen
      - Eine unabhängige Untersuchung und anschließend eine Kommission sollten die Folgen der Tests aufarbeiten
    mechanism:
      summary: >-
        Ergebnisse eines Krankenhauslabors wurden in Kinderschutzermittlungen und Gerichtsverfahren Ontarios übernommen, sodass klinisch geprägte Tests als forensische Beweismittel in einem verteilten öffentlichen System wirkten.
    institutionalCorrection:
      periodLabel: '2015'
      action: Ontario wies Kinderschutzorganisationen an, Motherisk-Haaranalysen nicht mehr zu verwenden oder sich darauf zu stützen, und richtete unabhängige Überprüfungsverfahren ein.
      summary: >-
        Ontario erklärte die Motherisk-Tests von 2005 bis 2015 für als Beweismittel unzureichend und unzuverlässig, beendete die institutionelle Nutzung und schuf Verfahren zur Überprüfung möglicherweise betroffener Fälle.
evidence:
  - id: motherisk-ppsc-proposition
    note: >-
      Fasst die Lang-Untersuchung zusammen, einschließlich der Entwicklung des Labors von klinischen zu forensisch genutzten
      Tests, seiner Verwendung bei Tausenden Proben von 2005 bis 2015 und der Feststellung, dass die Tests für Kinderschutz-
      und Strafverfahren unzureichend und unzuverlässig waren.
  - id: motherisk-ppsc-correction
  - id: motherisk-impact
    note: >-
      Dokumentiert mehr als 24.000 Haarproben von über 16.000 Personen, die zwischen 2005 und 2015 für Kinderschutzzwecke
      untersucht wurden, und hält fest, dass die spätere Motherisk-Kommission 1.271 Fälle von Children’s Aid Societies überprüfte.
  - id: motherisk-order-carrier
    note: >-
      Dokumentiert die amtliche Feststellung, dass die Motherisk-Haarstrangtests von 2005 bis 2015 als Beweismittel in
      Kinderschutz- und Strafverfahren unzureichend und unzuverlässig waren.
  - id: motherisk-ppsc-mechanism
  - id: motherisk-impact-consequences
  - id: motherisk-ontario-correction
    note: >-
      Dokumentiert die Überprüfung der Motherisk-Methoden anhand international anerkannter forensischer Standards und die
      Anweisung der Provinz, dass Children’s Aid Societies die Haaranalysen unverzüglich nicht mehr verwenden oder sich darauf stützen sollten.
  - id: motherisk-sickkids-context
    note: >-
      Bestätigt, dass SickKids das Motherisk Drug Testing Laboratory im April 2015 nach aufgekommenen Bedenken dauerhaft schloss.
