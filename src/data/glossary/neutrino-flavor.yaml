term: Neutrino flavor
aliases:
- neutrino flavors
- flavor
- flavour
shortDefinition: 'One of the three interaction types of neutrino: electron, muon, or tau.'
longDefinition: 'Neutrinos are observed in three flavors—electron, muon, and tau—named for the charged leptons with which
  they participate in weak interactions. A flavor state is not the same thing as a mass state: each flavor is a quantum
  mixture of mass states. That mismatch makes neutrino oscillation possible.'
relatedTerms:
- neutrino-oscillation
reviewedAt: '2026-08-21'
sources:
- title: The Nobel Prize in Physics 2015 – Popular information
  url: https://www.nobelprize.org/prizes/physics/2015/popular-information/
  publisher: The Nobel Prize
  note: Explains electron, muon, and tau neutrinos and the flavor changes observed in oscillation experiments.
