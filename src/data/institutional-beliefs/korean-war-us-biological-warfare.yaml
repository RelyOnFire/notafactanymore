schemaVersion: 2
title: U.S. biological warfare in the Korean War
proposition:
  summary: >-
    The Soviet government officially endorsed and propagated the allegation that United States forces were conducting
    bacteriological warfare in Korea and China, carried the accusation into international diplomacy and opposed outside
    investigation. Soviet internal records later reported that personnel in its military and advisory mission in North
    Korea had also helped stage purported evidence.
correction:
  summary: >-
    Soviet records reviewed after Stalin's death describe the published information as false and the accusations as
    fictitious. They report that Soviet advisers helped simulate two areas of infection and document decisions in
    April–May 1953 to stop promoting the issue at the United Nations, recommend that Beijing and Pyongyang end publication
    and tactically remove the issue from international bodies, and punish responsible Soviet personnel. This was an
    internal reversal and diplomatic withdrawal, not a public Soviet admission. The United States maintained a
    biological-weapons research program during the period, but that fact does not establish that it used biological
    weapons in the Korean War.
category: War, biological weapons and state propaganda
reviewedAt: '2026-09-24'
impact:
  summary: >-
    The bacteriological-warfare allegation became a formal Soviet international position. In February 1952 Stalin told
    Mao Zedong that the Soviet government would actively support the proposed measures; Soviet representatives repeated
    the charge at the United Nations. The USSR then vetoed a draft authorizing an impartial Red Cross investigation and a
    second draft condemning the fabrication and dissemination of the charges. Internal files published later reported
    that Soviet advisers in North Korea helped prepare false infection areas. After Stalin's death, the Soviet leadership
    privately classified the accusations as fictitious and curtailed the campaign without publicly acknowledging that its
    earlier position was false.
  highlights:
    - value: '2'
      label: false areas of infection that a 1953 Soviet memorandum said had been simulated to accuse the United States
    - value: 10–1 / 9–1–1
      label: Security Council votes on the two July 1952 drafts, each defeated by the Soviet veto
    - value: 2 May 1953
      label: date of the internal Soviet resolution calling the accusations fictitious and recommending that the campaign end
  context:
    - >-
      The twelve-document Soviet collection published in 1998 had been copied by hand and retyped from files in the
      Russian Presidential Archive; researchers had neither the originals nor photocopies bearing stamps, signatures or
      archival citations. The records also emerged from a post-Stalin leadership struggle and security investigation in
      which coerced testimony was a recognized risk. The editors and authors judged the files credible on textual and
      contextual grounds, while preserving those limitations.
    - >-
      Russian archival publication of related Soviet messages in 2010 and later archival scholarship strengthened the
      broader account of official Soviet support and its post-Stalin curtailment. The 1953 files remain fragmentary: they
      directly document two staged sites and the Soviet institutional response, not every incident alleged by Chinese or
      North Korean authorities.
    - >-
      The existence of a U.S. biological-weapons research program is a separate question from whether U.S. forces actually
      carried out the alleged biological attacks in Korea and China. The later Soviet records address the latter allegation.
    - >-
      Chinese and North Korean authorities were also central to the wider allegation. Their institutional records and later
      positions have separate documentary histories. This episode is limited to the USSR's official propagation of the
      claim, Soviet personnel's participation in fabricating purported evidence and the Soviet leadership's internal response.
episodes:
  - id: soviet-union-1952-1953
    polity: Soviet Union
    region: Eurasia
    startYear: 1952
    endYear: 1953
    strength: officially-endorsed
    institutionTypes:
      - government
      - military
    institutions:
      - Presidium of the USSR Council of Ministers
      - Presidium of the CPSU Central Committee
      - Soviet Ministry of Foreign Affairs
      - Soviet delegation to the United Nations
      - Soviet military and advisory mission in North Korea
    institutionalContext: >-
      On 23 February 1952 Stalin told Mao Zedong that the Soviet government would actively support the proposed campaign.
      Soviet diplomacy repeated the allegation and opposed outside investigation. On 3 July the USSR cast the sole vote
      against draft S/2671, which would have requested an impartial investigation by the International Committee of the Red
      Cross; on 9 July it vetoed S/2688, a different draft condemning the fabrication and dissemination of the charges.
      Internal files reviewed after Stalin's death reported that Soviet advisers, including ambassador and chief military
      adviser General Vladimir Razuvaev, had helped create two false infection areas. Beria's 21 April 1953 memorandum also
      reported that two condemned Koreans had been infected and one later poisoned. That day Molotov proposed instructing
      the Soviet UN representative not to promote the issue. On 2 May the Presidium of the Council of Ministers called the
      accusations fictitious and approved recommendations that China and
      North Korea stop publication and tactically remove the issue from international bodies. Moscow curtailed the campaign
      but did not publicly acknowledge the falsity of its earlier claims.
    consequences:
      - Official Soviet endorsement and amplification of biological-warfare accusations against the United States
      - Use of the allegation in formal United Nations diplomacy
      - A Soviet veto of an impartial-investigation draft and a second veto of a draft condemning fabrication and dissemination
      - Participation by Soviet personnel in staging two supposed infection areas in North Korea
      - A Soviet memorandum's report that two condemned Koreans were infected for the fabrication and one was later poisoned
      - Post-Stalin instructions to stop promoting the issue, recommend its international withdrawal and punish Soviet participants
      - Diplomatic curtailment without a public Soviet retraction of the allegation
    summary: >-
      The Soviet Union turned disputed wartime accusations into an official diplomatic campaign and blocked an impartial
      investigation, while internal files later reported that personnel in its own advisory apparatus helped manufacture
      purported evidence. The post-Stalin leadership called the claims fictitious in an internal resolution, told its UN
      representative not to promote them, recommended that Beijing and Pyongyang wind down the campaign and promised
      punishment for Soviet participants. Because Moscow never publicly admitted that its earlier position was false, the
      institutional correction remained partial.
    mechanism:
      kind: publication
      summary: >-
        Soviet state and diplomatic institutions endorsed and amplified the allegation through official communication,
        publication and United Nations diplomacy. The Soviet delegation opposed outside investigation, while personnel in
        the Soviet military-advisory apparatus helped stage purported evidence.
    institutionalCorrection:
      status: partial
      periodLabel: April–July 1953
      action: The leadership told its UN representative not to promote the issue, recommended that its allies end publication and withdraw it from international bodies, and promised punishment for Soviet participants in the fabrication.
      summary: >-
        The Soviet leadership formally reversed course inside the government and curtailed diplomatic support for the
        allegation. It transmitted the reversal privately and avoided a public acknowledgment that its earlier claims had
        been false, so the institutional correction was incomplete.
