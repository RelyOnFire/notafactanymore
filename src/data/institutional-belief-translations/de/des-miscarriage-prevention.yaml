locale: de
entryId: des-miscarriage-prevention
sourceReviewedAt: '2026-08-26'
title: DES zur Vorbeugung von Fehlgeburten
claim: Diethylstilbestrol (DES) wurde als wirksame vorbeugende Behandlung gegen Fehlgeburten, Frühgeburten und andere ungünstige Schwangerschaftsverläufe eingesetzt.
currentUnderstanding: Kontrollierte Studien zeigten keinen Nutzen von DES zur Verhinderung von Fehlgeburten oder anderer ungünstiger Schwangerschaftsverläufe. Eine vorgeburtliche Exposition kann zudem schwere Langzeitfolgen bei den Nachkommen verursachen, darunter ein erhöhtes Risiko für klarzellige Adenokarzinome und Störungen der Fortpflanzungsorgane. DES darf in der Schwangerschaft nicht eingesetzt werden.
episodes:
- id: united-states-1947-1971
  polity: Vereinigte Staaten
  institutionalContext: DES war bereits für andere Anwendungsgebiete zugelassen, als die FDA 1947 neue Arzneimittelzulassungen genehmigte, die eine Vermarktung zur Vorbeugung von Fehlgeburten erlaubten. Kontrollierte Studien in den 1950er-Jahren zeigten, dass DES die Schwangerschaftsergebnisse nicht verbesserte; dennoch wurde das Medikament noch ungefähr zwei Jahrzehnte lang während der Schwangerschaft verschrieben. 1971, nachdem Forschende einen Zusammenhang zwischen einer DES-Exposition im Mutterleib und einem seltenen klarzelligen Adenokarzinom bei jungen Frauen festgestellt hatten, warnte die FDA Ärzte und schrieb Schwangerschaft als Kontraindikation vor.
  summary: 1947 ließ die FDA DES zur Vermarktung als Mittel zur Vorbeugung von Fehlgeburten zu und institutionalisierte damit eine Behandlungsannahme, die weitgehend auf unkontrollierten Befunden beruhte. Aussagekräftigere Studien in den 1950er-Jahren zeigten, dass DES die Schwangerschaftskomplikationen, gegen die es verschrieben wurde, nicht verhinderte; die Anwendung setzte sich jedoch fort. Die entscheidende regulatorische Kehrtwende erfolgte 1971, als pränatale DES-Exposition mit einem seltenen Krebs bei jungen Frauen in Verbindung gebracht wurde und die FDA vor der Anwendung von DES in der Schwangerschaft warnte.
  consequences:
  - Weitere Exposition schwangerer Frauen und Föten, nachdem kontrollierte Studien keinen vorgesehenen Nutzen gezeigt hatten
  - Erhöhtes Risiko für klarzellige Adenokarzinome von Vagina und Gebärmutterhals bei im Mutterleib exponierten Frauen
  - Langfristige reproduktive und andere gesundheitliche Störungen bei DES-exponierten Nachkommen
  - Über Generationen reichende Arzneimittelfolgen, die jahrzehntelange Nachbeobachtung und Überwachung erforderten
