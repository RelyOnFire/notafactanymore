term: Dark matter
aliases: []
shortDefinition: Matter inferred from its gravitational effects that does not emit, absorb, or reflect enough light to
  be seen directly.
longDefinition: Dark matter is the name for matter whose presence is inferred mainly from gravity rather than emitted
  light. Evidence includes galaxy rotation, motions in galaxy clusters, gravitational lensing, the cosmic microwave background,
  and large-scale structure. Its microscopic nature remains unknown, and it is distinct from dark energy.
relatedTerms:
