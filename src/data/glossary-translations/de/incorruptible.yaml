locale: de
entryId: incorruptible
sourceReviewedAt: '2026-08-21'
term: Unvergänglich
aliases:
- Unvergänglichkeit
- unvergänglicher Himmel
shortDefinition: In der aristotelischen Naturphilosophie unfähig zu Verfall, Entstehung oder grundlegender physischer
  Veränderung.
longDefinition: Unvergänglich bedeutete im aristotelischen Weltbild mehr als bloß langlebig. Der himmlische Bereich sollte
  von Entstehung und Vergehen, wie sie irdische Materie kennzeichnen, grundsätzlich ausgenommen sein. Beobachtungen von
  Novae, Kometen, Sonnenflecken und Mondbergen untergruben diese Vorstellung eines physisch unveränderlichen Himmels.
