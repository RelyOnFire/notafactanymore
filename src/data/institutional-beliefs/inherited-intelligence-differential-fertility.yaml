      - Reproductive discrimination by education and income
    summary: After the 1980 census showed lower fertility among graduate women, Prime Minister Lee Kuan Yew argued that intelligence was largely inherited and that unequal fertility threatened Singapore's future talent pool. In 1984 the government introduced advantages for better-educated mothers while offering a S$10,000 grant to certain low-income women without O-level qualifications who chose sterilization after one or two children. The most explicitly eugenic measures were withdrawn or substantially modified by 1985.
