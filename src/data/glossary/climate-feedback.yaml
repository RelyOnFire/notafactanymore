term: Climate feedback
aliases:
- climate feedbacks
- feedback
- feedback loop
shortDefinition: A process triggered by climate change that then amplifies or reduces the original temperature response.
longDefinition: A climate feedback is a response within the climate system that changes the size of an initial warming
  or cooling. Positive feedbacks amplify the original change, while negative feedbacks oppose it. Important examples
  for climate sensitivity include water-vapor, lapse-rate, cloud, and surface-albedo feedbacks.
relatedTerms:
- equilibrium-climate-sensitivity
reviewedAt: '2026-08-21'
sources:
