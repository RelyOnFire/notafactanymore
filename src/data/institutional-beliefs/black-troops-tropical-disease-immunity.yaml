title: Black troops as naturally resistant to tropical disease
claim: >-
  U.S. military authorities treated Black soldiers as naturally more resistant to yellow fever and other tropical
  disease, influencing recruitment and assignments for service in Cuba during the Spanish-American War.
currentUnderstanding: >-
  Yellow fever is a viral disease transmitted by infected mosquitoes, and immunity follows vaccination or recovery
  from prior infection rather than racial ancestry. Malaria is caused by Plasmodium parasites transmitted by
  Anopheles mosquitoes; population differences in particular inherited traits do not make Black people generally
  immune to malaria or tropical disease. Black U.S. soldiers in Cuba contracted malaria and yellow fever in large
  numbers, directly contradicting the assumption of broad natural racial protection.
category: Race, military medicine and public health
reviewedAt: '2026-08-24'
impact:
  summary: >-
    During the Spanish-American War, U.S. military planning drew on the racial belief that Black soldiers were better
    adapted or naturally more resistant to tropical disease. The assumption affected both the organization of Black
    “Immune” volunteer regiments and assignments of Black regular troops to disease-stricken areas and hospital work
    in Cuba. Army experience quickly contradicted the theory: an official Army history records that half of 471 men
    of the 24th Infantry reporting for duty at Siboney contracted malaria or yellow fever.
  highlights:
  - value: '4'
    label: Black U.S. Volunteer Infantry regiments organized among the 1898 “Immune” regiments
  - value: 50% of 471
    label: men of the 24th Infantry at Siboney who contracted malaria or yellow fever according to official Army history
  - value: '1898'
    label: racial disease-resistance assumptions shaped U.S. tropical-service decisions during the war
  context:
  - >-
    The federal authorization for “Immune” troops did not itself state that Black people were racially immune to
    yellow fever. The racial proposition is documented in War Department and Army thinking and in how Black troops
    were recruited and assigned. The card therefore does not attribute racial language to the statute itself.
  - >-
    The 50-percent figure combines malaria and yellow fever and must not be described as a yellow-fever-only infection rate.
  - >-
    Prior yellow-fever infection can create genuine lifelong immunity, and military planners also sought men thought
    to possess acquired immunity. That valid concept became entangled with the false assumption of broad innate
    racial resistance.
