      - Wind erosion and dust storms
      - Volatile grain production
    summary: Khrushchev's Virgin Lands campaign rapidly converted enormous areas of Kazakhstan's steppe to grain production. Early harvests encouraged continued expansion, but political pressure to maximize acreage reduced fallow and imported farming practices poorly suited to dry, fragile soils. By the early 1960s fertility was declining, erosion was severe, and the 1963 crop failure exposed the limits of the strategy.
