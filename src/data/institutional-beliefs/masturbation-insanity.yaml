evidence:
  - id: masturbation-report-proposition
    sourceId: masturbation-ontario-report
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: 'Ontario Sessional Papers (1878), no. 4, pp. 279–280, “Treatment” section'
    note: >-
      Bucke distinguishes masturbation as a contributing cause, an aggravating factor or a symptom only, doubts that
      it is ever the sole cause, and says only a small proportion of patients could benefit from stopping it.
  - id: masturbation-wjm-correction
    sourceId: masturbation-wjm-review
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: 'Western Journal of Medicine 175(1) (2001), pp. 66–68'
    note: >-
      Medical-historical review identifies the claimed causal link between masturbation and mental illness as a
      superstition and traces its rise and decline.
  - id: masturbation-who-correction
    sourceId: masturbation-who-icd11-cddr
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: 'ICD-11 CDDR, code 6C72, printed pp. 526–531, especially pp. 527–530'
    note: >-
      WHO criteria require persistent impaired control plus marked distress or functional impairment, exclude distress
      based entirely on moral disapproval, and require differentiation from mania, dementia, medical conditions and substances.
  - id: masturbation-report-impact
    sourceId: masturbation-ontario-report
    relation: documents
    target: {scope: belief, aspect: impact}
    locator: 'Ontario Sessional Papers (1878), no. 4, p. 280, patient table and paragraphs below it'
    note: >-
      The official report records 15 wired patients, complications requiring removal and rewiring, additional restraint
      and four circumcisions, followed by resumption of masturbation and no mental improvement in the four cases.
