    consequences:
      - Counterinsurgency interpretation
      - Detention and “rehabilitation” policy
      - Racialized psychiatric explanation of dissent
    summary: In 1954 the Kenya government commissioned psychiatrist J. C. Carothers to explain Mau Mau psychologically. His account depicted the Gikuyu as caught between “primitive” forms of thought and disruptive modernization; colonial officials later cited this ethnopsychiatric framework while designing detention and rehabilitation policy.
    sources:
      - title: Mau Mau Psychology — Investigation
        url: https://hansard.parliament.uk/Commons/1954-05-19/debates/c20401a7-68c8-4710-b627-3dff78e9f0d7/MauMauPsychology%28Investigation%29
        publisher: UK Parliament
        note: Records that the Kenya Government invited J. C. Carothers in February 1954 to conduct a special investigation into the psychology of Mau Mau.
      - title: “The Dregs of the Mau Mau Barrel” — Permanent Exile and the Remaking of Late Colonial Kenya, 1954–61
        url: https://academic.oup.com/jsh/article/57/1/128/7180937
        publisher: Journal of Social History
        note: Shows that Carothers' account of the “African mind” was cited by officials involved in the detention and rehabilitation system during the Emergency.
