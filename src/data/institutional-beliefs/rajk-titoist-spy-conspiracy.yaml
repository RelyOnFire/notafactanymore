schemaVersion: 2
title: Rajk group as a Titoist spy conspiracy
proposition:
  summary: >-
    Hungary's communist-party leadership, state-security service, prosecution and people's court presented László
    Rajk and an expanding group of officials as an imperialist and Titoist espionage and terror network. Coerced
    confessions, a state indictment, a broadcast public trial, a criminal judgment and official publication converted
    the constructed allegation into an authoritative fact and a basis for connected purge cases.
correction:
  summary: >-
    Hungarian archival and historical institutions identify the case as a political show trial built on fabricated
    charges. Rajk initially resisted accusations concerning imperialist espionage and the Horthy-era political police;
    after torture and the intervention of Soviet advisers, the script was recast around Tito's Yugoslavia. A review
    began in 1954, and the Supreme Court acquitted Rajk, Szőnyi and Szalai on 25 November 1955, but the
    ruling was kept secret. In March 1956 Mátyás Rákosi acknowledged that the trial had rested on a provocation, and the
    party authorized the public reburial of Rajk and three fellow victims on 6 October 1956.
category: Political repression, show trials and state security
reviewedAt: '2026-09-25'
impact:
  summary: >-
    The principal September 1949 trial was one part of a wider purge complex. A Hungarian Interior Ministry table
    delivered to the party's Central Committee in June 1964 classified proceedings against 155 people as part of the
    Rajk affair: 97 people were convicted and 50 were interned; 15 of the convicted were executed. The People's Court
    sentenced Rajk, Tibor Szőnyi and András Szalai to death, and the alleged network was then extended through roughly
    30 related trials. The legal acquittal remained secret, while the October 1956 reburial became a mass demonstration
    against the Rákosi system.
  highlights:
    - value: '155'
      label: people subjected to proceedings in the wider Rajk affair according to the Interior Ministry's 1964 table
    - value: '97'
      label: people convicted in those proceedings
    - value: '15'
      label: people executed; this figure is a subset of the 97 convictions
  context:
    - >-
      The 1964 retrospective accounting grouped many connected proceedings under the Rajk affair. Its 97 convictions
      and 50 internments are separate dispositions, while the 15 executions form part of the conviction total. One
      detainee died during investigation, one died by suicide and proceedings against six people were discontinued.
    - >-
      The figures for the wider affair are not the number of defendants or death sentences in the principal public
      trial. That proceeding opened with eight defendants; Rajk, Szőnyi and Szalai received its three death sentences,
      while cases against two military defendants were transferred to military jurisdiction.
    - >-
      The accusation changed during the investigation. The initial construction emphasized alleged imperialist
      espionage and collaboration with the Horthy-era political police. Soviet advisers then helped move Tito and
      Yugoslavia to the center of the script after the 1948 Soviet-Yugoslav split.
    - >-
      Correction occurred in distinct stages: a secret review from 1954, a non-public Supreme Court acquittal in
      November 1955, Rákosi's March 1956 acknowledgment, and a party-authorized public reburial in October. The crowd's
      anti-Stalinist demonstration was a public consequence of that process, not itself a judicial ruling.
episodes:
  - id: hungary-1949-1956
    polity: Hungary
    region: Europe
    startYear: 1949
    endYear: 1956
    strength: officially-endorsed
    institutionTypes:
      - government
      - court
    institutions:
      - Hungarian Working People's Party (MDP)
      - State Protection Authority (ÁVH)
      - Budapest State Prosecutor's Office
      - Budapest People's Court
    institutionalContext: >-
      Party leaders approved Rajk's arrest and managed the developing case; ÁVH interrogators and Soviet advisers
      extracted and coordinated confessions; the Budapest State Prosecutor's Office issued the indictment; and the
      Budapest People's Court turned the script into convictions. The public proceedings ran from 16 to 24 September
      1949 and were broadcast by radio, while an official trial book circulated the indictment, testimony, prosecution
      speech and verdict. The conspiracy label then organized dozens of connected prosecutions and internments. Review
      started in 1954, legal acquittal followed secretly on 25 November 1955, and official acknowledgment and reburial
      made the reversal visible in 1956.
    consequences:
      - Execution of Rajk, Szőnyi and Szalai after the principal public trial, with further executions in connected cases
      - Imprisonment and internment of people assigned to the widening alleged network
      - Use of the trial to promote an anti-Tito and anti-imperialist enemy narrative inside the Hungarian party-state
      - Radio transmission and state publication of coordinated confessions and accusations as judicial proof
      - Five-year prison sentence for Júlia Rajk and removal of the couple's infant son to an institution under another name
      - A secret legal acquittal followed by a public reburial that became a mass protest against Stalinist repression
    summary: >-
      Party, security, prosecutorial and judicial bodies converted a changing political script into a public criminal
      judgment and then reused the supposed network in connected cases. A later Interior Ministry review counted 155
      people subjected to proceedings in the wider affair. The same state reversed the case in stages from 1954 to
      1956: review, secret acquittal, official acknowledgment and public reburial.
    mechanism:
      kind: enforcement
      summary: >-
        Party direction, coercive investigation, coordinated confessions, prosecution, a radio-broadcast court
        performance and official publication made the alleged conspiracy enforceable as both criminal judgment and
        propaganda, then allowed investigators to attach further defendants to the same constructed network.
    institutionalCorrection:
      status: corrected
      periodLabel: 1954–6 October 1956
      action: >-
        Hungarian authorities reviewed the case, the Supreme Court acquitted Rajk, Szőnyi and Szalai, Rákosi
        acknowledged the provocation, and the party authorized a public reburial.
      summary: >-
        The state ultimately rejected the central conspiracy allegation and rehabilitated Rajk, Szőnyi and Szalai.
        Because the November 1955 acquittal was concealed, the March acknowledgment and October 1956 reburial were
        separate institutional steps that made the reversal publicly visible.
