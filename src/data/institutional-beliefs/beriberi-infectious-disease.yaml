- id: dutch-east-indies-1886-1897
  polity: Dutch East Indies
  region: Southeast Asia
  startYear: 1886
  endYear: 1897
  strength: officially-endorsed
  institutionTypes:
  - government
  - medical
  institutions:
  - Dutch government Commission for Beriberi Research
  - Medical Laboratory at Weltevreden
  - Civil Medical Service and prison health administration of the Dutch East Indies
  institutionalContext: In 1886 the Dutch government sent Cornelis Pekelharing and Cornelis Winkler to investigate
    the severe beriberi problem in the East Indies, with Christiaan Eijkman attached to the commission for bacteriological
    research. Pekelharing and Winkler concluded that beriberi was a peripheral-nerve disease caused by bacteria
    producing a specific toxin and returned to the Netherlands convinced that it was a tropical infectious disease.
    Eijkman remained at the government laboratory and gradually obtained evidence linking the disease to diet. Government
    physician and prison inspector Adolphe Vorderman then used prison records and blinded rice assessment across
    Java and Madura to test the association in people. His 1897 report showed beriberi to be overwhelmingly associated
    with polished rather than unpolished rice, helping move colonial prison practice toward dietary prevention.
  consequences:
  - A formal colonial research programme initially organised around a bacterial and toxin explanation
  - Continued bacteriological investigation while a dietary cause remained institutionally marginal
  - Delayed use of rice-based prevention in institutions where polished rice was routinely supplied
  - Large-scale government prison investigation once dietary evidence became compelling
  - Adoption of unpolished rice in prison diets as the colonial health service translated the new evidence into
    prevention
  summary: 'The Dutch East Indies episode shows an institution correcting itself. A government commission initially
    returned an infectious verdict consistent with the new bacteriology of the 1880s. Research left behind in the
    colonial medical laboratory then undermined that conclusion: Eijkman''s experiments implicated polished rice,
    and Vorderman''s government prison survey demonstrated a striking human association between rice type and beriberi.
    The evidence redirected institutional practice toward diet years before thiamine itself was isolated.'
  sources:
