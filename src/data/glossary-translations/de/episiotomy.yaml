term: Episiotomie
aliases:
- Dammschnitt
shortDefinition: Ein chirurgischer Schnitt in den Damm, der während der Geburt die Scheidenöffnung erweitert.
longDefinition: Eine Episiotomie ist ein chirurgischer Schnitt durch das Dammgewebe während der Austreibungsphase, um
  die Scheidenöffnung zu erweitern. In vielen Kliniken wurde der Eingriff früher routinemäßig durchgeführt, weil man
  glaubte, ein kontrollierter Schnitt könne schwerere Risse verhindern und den Beckenboden schützen. Die Evidenz spricht
  bei spontanen vaginalen Geburten für einen zurückhaltenden statt routinemäßigen Einsatz.
