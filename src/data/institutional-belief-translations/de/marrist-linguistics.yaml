entryId: marrist-linguistics
sourceReviewedAt: 2026-08-23
title: Marristische Linguistik
claim: Sprachen wurden als Produkte universeller, klassenbedingter Entwicklungsstufen behandelt und nicht in erster Linie als historisch entstandene Sprachfamilien; die traditionelle vergleichende Sprachwissenschaft galt damit als „bürgerlich“ oder wissenschaftlich überholt.
currentUnderstanding: Sprachen verändern sich durch historisch nachvollziehbare Abstammung, Sprachkontakt, Entlehnung, Innovation und gesellschaftlichen Gebrauch. Die vergleichende Linguistik kann genealogische Beziehungen zwischen Sprachfamilien rekonstruieren; Sprachen durchlaufen keine universelle Abfolge klassenbestimmter Entwicklungsstufen.
episodes:
  - id: soviet-union-1930-1950
    polity: Sowjetunion
    institutions:
      - Institut für Sprache und Denken der Akademie der Wissenschaften der UdSSR
      - Akademie der Wissenschaften der UdSSR
      - Sektion für materialistische Linguistik der Kommunistischen Akademie
    institutionalContext: Das Institut für Sprache und Denken war das wichtigste institutionelle Zentrum des Marrismus. Seine Autorität reichte jedoch über Akademiestrukturen, Universitäten, Fachzeitschriften, Verlage und das Bildungswesen weit über dieses Institut hinaus und bildete ein verteiltes institutionelles Netz statt einer einzigen Körperschaft, die sich treffend als „sowjetische sprachwissenschaftliche Institute“ bezeichnen ließe.
    summary: Ab etwa 1930 wurde Nikolai Marrs „Neue Lehre von der Sprache“ zum offiziell anerkannten Rahmen, der die sowjetische Linguistik dominierte. Traditionelle vergleichende und indogermanische Sprachwissenschaft wurde als „bürgerlich“ angegriffen; erhebliche Abweichungen von den marristischen Grundlagen wurden stark unterdrückt. 1950 verwarf Stalin den Marrismus abrupt; anschließend wurde das Institut für Sprache und Denken aufgelöst und die Doktrin ebenso administrativ abgebaut, wie sie zuvor erhoben worden war.
    consequences:
      - Konkurrierende historisch-vergleichende Schulen wurden unterdrückt oder marginalisiert
      - Forschung und Lehre wurden nach marristischen Kategorien umorganisiert
      - Wissenschaftliche Laufbahnen wurden durch Vorwürfe „bürgerlicher“ oder antimarxistischer Linguistik gefährdet
