        publisher: Water Resources / Russian Academy of Sciences journal platform
        note: >-
          Reviews Russian field and laboratory evidence, reproduces the Federal Water Resources Agency record that its 2007
          trial did not establish efficacy and its 2009 scientific council found the bloom-suppression proposal scientifically
          unsubstantiated and unconfirmed in practice, quotes the 2014 Hydrobiological Society congress decision rejecting the
          method, and summarizes later research that did not support the claimed mechanism.
      - title: Decision of the XI Congress of the Hydrobiological Society — 22–26 September 2014
        url: https://ibiw.ru/gbo/upload/Congress_GBO_Resheniye_XI.pdf
        publisher: Hydrobiological Society at the Russian Academy of Sciences / I.D. Papanin Institute for Biology of Inland Waters RAS
        note: >-
          Official congress decision hosted by an institute of the Russian Academy of Sciences. The institute's Hydrobiological
          Society page links this document; the 2023 Water Resources review above reproduces its finding that the so-called
          algolization method should be regarded as false and damaging to Russian hydrobiology.
      - title: GOST R 59977-2022 — Biological safety. Neutralization and disposal of biological and organic materials
        url: https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/9/gost_r_59977-2022_natsionalnyy_standart_rossiyskoy.html
        publisher: GOST R 59977-2022 text — publication source identified as the Russian Institute for Standardization
        note: >-
          Searchable reproduction of the published 2022 national standard. Section 5 codifies algolization within water-body
