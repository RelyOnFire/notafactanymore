evidence:
  - id: belgian-anthropology-debont-proposition
    sourceId: belgian-anthropology-debont
    relation: supports
    target: {scope: belief, aspect: proposition}
    locator: Printed pp. 75, 77 and 79
    note: >-
      The institutional history documents ministerial approval for the 1907 laboratory, Vervaeck's classification by
      heredity and environment, the combined medical, psychiatric, anthropometric and background examination, and the
      Ministry-backed 1920 service with laboratories in ten prisons. It supports the institutional system rather than
      every later dossier field.
  - id: belgian-anthropology-external-dossier
    sourceId: belgian-anthropology-external-services
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: 'PDF pp. 15–16, “B. Dossiers anthropologiques”'
    note: >-
      The official archival survey describes the standardised 1920 dossier, including criminal and family history,
      education, health, hereditary conditions, malformations, social faculties, mental resistance and a final diagnosis.
  - id: belgian-anthropology-vervaeck-proposition
    sourceId: belgian-anthropology-vervaeck-1907
    relation: contextualizes
    target: {scope: episode, episodeId: belgium-1907-1952, aspect: context}
    locator: Printed pp. 333–344
    note: >-
      This primary study illustrates an early prison questionnaire that recorded heredity, degeneration, mental state,
      criminality, recidivism and bodily or social information. It is not evidence for the later national service: the
      study also reports no apparent association between tattooing and heredity, degeneration, insanity or criminality
      and cautions against inferring moral or psychological character from tattoos.
  - id: belgian-anthropology-external-correction
    sourceId: belgian-anthropology-external-services
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: 'PDF pp. 15–16, “B. Dossiers anthropologiques”'
    note: >-
      The survey records the postwar shift and De Greeff's 1952 criticism, but also says his medico-psychological dossier
      could not be implemented uniformly, a new anthropological dossier appeared in the early 1960s, and anthropological
      dossiers and local services continued until 1997.
  - id: belgian-anthropology-saint-gilles-impact
    sourceId: belgian-anthropology-saint-gilles
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: >-
      “Bevoegdheden en activiteiten”, paragraphs beginning “In het interbellum” and “De antropologische dossiers”
    note: >-
      The official inventory dates the first laboratory to 1907 and expansion to 1920, describes the period's concepts as
      scientifically obsolete, and records more than 9,000 Saint-Gilles dossiers from 1920–1957. It also limits the volume
      claim: only 3–7% of registered prisoners there were actually examined.
  - id: belgian-anthropology-saint-gilles-carrier
    sourceId: belgian-anthropology-saint-gilles
    relation: documents
    target: {scope: episode, episodeId: belgium-1907-1952, aspect: carrier}
    locator: '“Geschiedenis” and “Bevoegdheden en activiteiten”, prison-anthropology paragraphs'
    note: >-
