schemaVersion: 2
title: Radical mastectomy as the best route to breast-cancer survival
entryId: radical-mastectomy-best-survival
proposition:
  summary: >-
    Routine radical mastectomy, removing the breast, axillary lymph nodes and chest-muscle tissue, was treated as giving
    women with operable breast cancer the best chance of survival. Its rationale emphasized local and regional spread
    and the removal of suspected tissue in one piece.
correction:
  summary: >-
    For many patients with early breast cancer, more extensive local surgery does not improve overall survival. Randomized
    trials showed no survival advantage for Halsted radical mastectomy over less extensive surgery, and breast-conserving
    surgery followed by radiation can provide survival comparable to mastectomy for appropriately selected patients.
category: Cancer surgery and treatment standards
reviewedAt: '2026-09-19'
impact:
  summary: >-
    Halsted radical mastectomy became the dominant U.S. breast-cancer operation for much of the twentieth century. Its
    routine use exposed generations of women to removal of chest-muscle and extensive lymphatic tissue, with substantial
    disfigurement, arm swelling and functional impairment, before randomized trials showed that greater surgical extent
    did not improve survival.
  context:
    - >-
      Radical mastectomy was an important advance over earlier surgery because it greatly improved local control at a
      time when anesthesia, antisepsis and cancer surgery were rapidly developing.
    - >-
      The correction does not mean mastectomy itself is obsolete. Mastectomy remains appropriate in many circumstances;
      what failed was the rule that routinely removing more local tissue necessarily improved survival.
episodes:
  - id: united-states-1894-1977
    polity: United States
    region: North America
    startYear: 1889
    endYear: 1972
    periodLabel: Johns Hopkins, 1889–1972 (documented practice)
    strength: institutionally-influential
    institutionTypes:
      - medical
    institutions:
      - The Johns Hopkins Hospital
    institutionalContext: >-
      William Halsted's 1894 report described radical operations performed at The Johns Hopkins Hospital from June 1889
      through January 1894. It prescribed wide one-piece removal of the breast, axillary tissue and most of the pectoralis
      major, combining a local-regional account of cancer spread with concern that divided or residual tissue could leave
      disease behind. A later Johns Hopkins study of patients treated from 1969 through 1972 documented both radical and
      modified radical operations, chosen according to the treating surgeon's conviction. The displayed interval follows
      those two documented practice cohorts; 1972 is not a claimed withdrawal date. Beyond Hopkins, the radical operation
      became a prevailing U.S. standard, and proposals for less extensive surgery still met strong resistance in the 1970s.
    consequences:
      - Radical mastectomy became the prevailing operation for breast cancer in the United States for much of the twentieth century
      - Women undergoing the radical operation lost the breast, axillary nodes and chest-muscle tissue; in the later Hopkins comparison, this greater extent produced no five-year survival advantage over modified radical mastectomy at any clinical stage
      - The operation could leave major disfigurement, lymphedema, pain, weakness and restricted arm movement
      - Randomized trials beginning in the 1970s found no survival loss with less extensive approaches and contributed to a gradual change in surgical standards
    summary: >-
      Halsted's Johns Hopkins operation joined a local-regional account of cancer spread to a published expectation of
      wide one-piece removal. Institutional authority and surgical training helped make radical mastectomy a durable U.S.
      standard despite its physical costs. Johns Hopkins records show radical and modified radical operations coexisting
      in a 1969–1972 patient cohort; the authors' 1979 retrospective comparison recommended the modified operation for
      stages I and II. Separately, the NSABP B-04 trial, begun in 1971 and reported in 1977, found no survival advantage
      for the radical operation. European breast-conservation trials and later U.S. trials extended the evidence, and
      recommendations and practice moved gradually toward surgery matched to disease extent and biology.
    mechanism:
      kind: standard-setting
      summary: >-
        Halsted's published technique set expectations for wide en-bloc excision and urged surgeons to train for the
        demanding operation. The authority of Johns Hopkins and its surgical tradition helped stabilize those expectations
        as a broader professional standard alongside the operation's local-control rationale.
    institutionalCorrection:
      status: corrected
      periodLabel: 1979 recommendations; current Johns Hopkins guidance
      action: >-
        Johns Hopkins surgeons recommended modified radical mastectomy for stages I and II in 1979; an NIH panel named a
        muscle-preserving operation the current standard, and Johns Hopkins now describes radical mastectomy as rarely used.
      summary: >-
        The 1979 Johns Hopkins comparison recommended modified radical mastectomy for stages I and II while retaining a
        local-control role for radical surgery in selected stage III cases. That year an NIH consensus panel recommended
        muscle-preserving total mastectomy with axillary dissection for localized disease. Johns Hopkins now describes
        radical mastectomy as rare and reserves it for possible chest-muscle involvement. These sources document a change
        in institutional recommendations and present guidance, but not a precise date when Hopkins ended routine use.
