entryId: tidal-heating
sourceReviewedAt: '2026-08-21'
term: Gezeitenheizung
aliases:
- Gezeitenerwärmung
- Gezeitenverformung
shortDefinition: Innere Erwärmung, die entsteht, wenn wechselnde Gezeitenkräfte einen Mond, Planeten oder anderen Körper
  wiederholt verformen.
longDefinition: Gezeitenheizung wandelt durch wiederholte Verformung Bahn- und Rotationsenergie in innere Wärme um. Ein
  Mond auf einer leicht elliptischen Bahn erlebt wechselnde Gezeitenkräfte, weil sich Abstand und Orientierung zu seinem
  Planeten verändern. Innere Reibung setzt einen Teil dieser mechanischen Energie als Wärme frei. Der Effekt treibt Ios
  extremen Vulkanismus an und trägt dazu bei, unterirdische Ozeane auf Monden wie Europa und Enceladus flüssig zu halten.
