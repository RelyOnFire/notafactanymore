term: Bacillus
aliases:
- bacilli
shortDefinition: A rod-shaped bacterium; historically the word was often used descriptively in names such as 'tubercle
  bacillus.'
longDefinition: In its descriptive microbiological sense, bacillus means a rod-shaped bacterium. The word also appears
  in historical disease terminology, including 'tubercle bacillus' for Mycobacterium tuberculosis. It should not
  be confused with Bacillus, the formal genus name.
relatedTerms: []
reviewedAt: '2026-08-21'
sources:
- title: The history of tuberculosis
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5432783/
  publisher: PubMed Central
  note: Reviews Koch's identification of the tubercle bacillus and the historical shift toward an infectious explanation
    of tuberculosis.
