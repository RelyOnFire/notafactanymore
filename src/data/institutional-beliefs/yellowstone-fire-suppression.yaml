    note: >-
      Explains the former extinguishment policy, the 1972 natural-fire program, the exceptional drought and wind
      of 1988, and the postfire mosaic of severely burned, lightly burned and unburned patches.
  - id: yellowstone-policy-correction
    sourceId: nps-fire-policy-history
