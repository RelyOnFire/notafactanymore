entryId: weak-interaction
sourceReviewedAt: '2026-08-21'
term: Schwache Wechselwirkung
aliases:
- schwache Kraft
- schwache Kernkraft
shortDefinition: Eine der vier fundamentalen Wechselwirkungen, verantwortlich unter anderem für Betazerfall und Neutrinowechselwirkungen.
longDefinition: Die schwache Wechselwirkung ist eine fundamentale Wechselwirkung des Standardmodells und wird durch W-
  und Z-Bosonen vermittelt. Sie kann Teilchenarten in Prozessen wie dem radioaktiven Betazerfall umwandeln und bestimmt
  viele Neutrinoreaktionen. Anders als Elektromagnetismus und starke Wechselwirkung kann sie die Paritätssymmetrie verletzen.
