    strength: policy-basis
    institutionTypes: [government, medical, education]
    institutions:
      - Ministry of Health
      - Hadassah medical system
      - General Sick Fund
      - Public hospitals and school-health services
    consequences:
      - Mass irradiation of children
      - Treatment required for return to school in parts of the programme
      - Increased long-term risk of brain and nervous-system tumors
    summary: Israel organized a national campaign in which tens of thousands of children with tinea capitis received scalp X-ray irradiation, then a standard treatment whose delayed cancer risks were not yet understood. By 1952 treatment was state-funded and required in the public-health programme, including as a condition for returning infected children to school. Irradiation ended in 1960 as griseofulvin replaced it; long-term Israeli cohort studies later demonstrated increased tumor risk after childhood exposure.
    sources:
      - title: Healing the children and the nation — The campaign to eradicate ringworm in Israel, 1925–1960
        url: https://academic.oup.com/book/38561/chapter/334246679
        publisher: Oxford University Press
        note: Reconstructs the national treatment machinery, Ministry of Health directives, compulsory aspects of treatment, and the estimated 26,000–27,000 children irradiated in Israel from 1948 to 1960.
      - title: Tumors of the Brain and Nervous System after Radiotherapy in Childhood
        url: https://www.nejm.org/doi/full/10.1056/NEJM198810203191601
        publisher: New England Journal of Medicine
        note: Long-term cohort study of 10,834 Israeli children irradiated for tinea capitis between 1948 and 1960, documenting increased risk of brain and nervous-system tumors.
