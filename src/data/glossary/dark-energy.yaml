term: Dark energy
aliases: []
shortDefinition: The name for whatever is causing the observed accelerated expansion of the universe in the standard
  cosmological model.
longDefinition: Dark energy is the label for the component of the standard cosmological model associated with the universe's
  accelerated expansion. In the simplest model it behaves like a cosmological constant with nearly uniform energy density
  throughout space. Its physical origin is unknown, and the term does not imply that it is a form of dark matter.
relatedTerms:
- dark-matter
- cosmic-microwave-background
reviewedAt: '2026-08-21'
sources:
- title: Dark Energy, Dark Matter
  url: https://science.nasa.gov/universe/dark-energy-dark-matter/
  publisher: NASA
  note: Summarizes dark energy as the dominant component associated with the accelerated expansion of the universe.
