entryId: ribosomal-rna
sourceReviewedAt: '2026-08-21'
term: Ribosomale RNA
aliases:
- rRNA
shortDefinition: RNA, die einen zentralen Bestandteil der Ribosomen bildet, also der zellulären Maschinerie zur
  Herstellung von Proteinen.
longDefinition: Ribosomale RNA oder rRNA ist ein struktureller und katalytischer Bestandteil der Ribosomen. Da sich
  manche rRNA-Sequenzen im Laufe der Evolution nur langsam verändern und bei zellulärem Leben weit verbreitet sind,
  lassen sich mit ihrem Vergleich sehr alte Verwandtschaftsbeziehungen untersuchen.
