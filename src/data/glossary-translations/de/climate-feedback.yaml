sourceReviewedAt: '2026-08-21'
term: Klimarückkopplung
aliases:
- Klimarückkopplungen
- Rückkopplung
shortDefinition: Ein durch eine Klimaänderung ausgelöster Prozess, der die ursprüngliche Temperaturänderung anschließend
  verstärkt oder abschwächt.
longDefinition: Eine Klimarückkopplung ist eine Reaktion innerhalb des Klimasystems, die die Stärke einer anfänglichen
  Erwärmung oder Abkühlung verändert. Positive Rückkopplungen verstärken die ursprüngliche Änderung, negative wirken
  ihr entgegen. Für die Klimasensitivität sind unter anderem Rückkopplungen durch Wasserdampf, den vertikalen Temperaturverlauf,
  Wolken und die Oberflächenalbedo wichtig.
