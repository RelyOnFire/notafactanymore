  - title: The Politics of Colonial Translation — On the Narrative of the Ainu as a “Vanishing Ethnicity”
    url: https://www.cambridge.org/core/journals/asia-pacific-journal/article/politics-of-colonial-translation-on-the-narrative-of-the-ainu-as-a-vanishing-ethnicity/3A810C9ACC686D632DA4E3F073C07A8E
    publisher: Asia-Pacific Journal
    note: Explains how depictions of Ainu as primitive were institutionalized to justify colonial rule and how the 1899 Protection
      Act attempted to turn Ainu into farmers while land and subsistence rights were curtailed.
