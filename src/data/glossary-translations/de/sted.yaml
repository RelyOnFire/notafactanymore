entryId: sted
sourceReviewedAt: '2026-08-21'
term: STED
aliases:
- Stimulated Emission Depletion Microscopy
shortDefinition: Ein Superauflösungsverfahren, das Fluoreszenz mithilfe stimulierter Emission um einen kleinen zentralen
  Bereich unterdrückt und so die effektiv leuchtende Fläche verkleinert.
longDefinition: Bei der Stimulated Emission Depletion Microscopy oder STED werden Fluoreszenzmoleküle zunächst angeregt.
  Ein zweiter, meist ringförmiger Lichtstrahl zwingt Moleküle am Rand anschließend durch stimulierte Emission zurück
  in einen nichtleuchtenden Zustand. Nur ein deutlich kleinerer zentraler Bereich bleibt fluoreszent. Durch Abtasten
  dieser verkleinerten Leuchtzone entsteht eine feinere Auflösung als bei konventioneller beugungsbegrenzter Bildgebung.
