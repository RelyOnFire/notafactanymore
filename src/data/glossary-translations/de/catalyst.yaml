entryId: catalyst
sourceReviewedAt: '2026-08-21'
term: Katalysator
aliases:
- Katalysatoren
- Katalyse
- katalytisch
shortDefinition: Ein Stoff, der eine chemische Reaktion beschleunigt, ohne durch die Reaktion insgesamt verbraucht zu
  werden.
longDefinition: Ein Katalysator eröffnet einen Reaktionsweg mit geringerer Aktivierungsbarriere und lässt eine Reaktion
  unter gegebenen Bedingungen schneller ablaufen. Er nimmt an Zwischenschritten teil, wird insgesamt aber wiederhergestellt.
  In Lebewesen sind die meisten Katalysatoren Protein-Enzyme, doch auch manche RNA-Moleküle besitzen katalytische Aktivität.
