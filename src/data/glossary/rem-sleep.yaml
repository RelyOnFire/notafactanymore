term: REM sleep
aliases:
- REM
- rapid eye movement sleep
shortDefinition: A sleep stage marked by rapid eye movements, characteristic brain activity, and usually reduced skeletal-muscle
  tone.
longDefinition: REM sleep is a recurring stage of sleep characterized by rapid eye movements, a distinctive pattern of
  brain activity, and strong suppression of most voluntary muscle activity. Vivid dream reports are especially common
  after REM awakenings, but dreaming is not exclusive to REM sleep.
relatedTerms:
- non-rem-sleep
reviewedAt: '2026-08-21'
sources:
- title: What happens during sleep?
  url: https://www.nichd.nih.gov/health/topics/sleep/conditioninfo/Pages/what-happens.aspx
  publisher: Eunice Kennedy Shriver National Institute of Child Health and Human Development
  note: Explains REM and non-REM sleep and notes that dreams can occur in both.
