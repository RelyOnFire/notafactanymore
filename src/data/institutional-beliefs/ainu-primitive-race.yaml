  institutionalContext: 'The 1899 Hokkaido Former Aborigines Protection Act gave the Home Minister rule-making authority and
    the Hokkaido Government’s governor direct powers over Ainu land, communal property and policing while promoting settlement
    through agriculture and state schooling. The racial-anthropological side had its own identifiable carriers: Tokyo Imperial
    University became a major center for physical anthropology, and the Anthropological Society of Tokyo published extensive
    Ainu research. The wider colonial, educational and scientific network is therefore described here rather than collapsed
    into labels such as “imperial Japanese state” or “anthropological establishment.”'
  consequences:
  - Forced agriculturalization
  - Suppression of Indigenous lifeways
  - Land and resource dispossession
  - Cultural assimilation
  summary: Japanese colonial administration and physical anthropology repeatedly represented Ainu as a primitive or dying
    race. The 1899 Hokkaido Former Aborigines Protection Act sought to transform Ainu livelihoods through agriculture and
    assimilation, while restrictions on hunting, fishing, landholding, language, and custom worked to absorb Ainu into a supposedly
    more advanced Japanese society. At the same time, Tokyo Imperial University and the Anthropological Society of Tokyo helped
    institutionalize physical-anthropological study of the Ainu.
  sources:
