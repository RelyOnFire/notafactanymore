term: Ereignishorizont
aliases: []
shortDefinition: Eine Grenze um ein Schwarzes Loch, hinter der Licht und andere Signale nicht mehr zu weit entfernten Beobachtern entkommen können.
longDefinition: Ein Ereignishorizont ist eine kausale Grenze in der Raumzeit und keine materielle Oberfläche. Nach dem Überschreiten kann kein in die Zukunft gerichtetes Signal mehr das weit entfernte äußere Universum erreichen.
