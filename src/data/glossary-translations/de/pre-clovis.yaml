term: Prä-Clovis
aliases:
- prä-Clovis-zeitlich
shortDefinition: Eine breite archäologische Bezeichnung für menschliche Präsenz in Amerika vor der Clovis-Kultur.
longDefinition: Prä-Clovis bezeichnet keine einzelne Kultur oder Bevölkerungsgruppe, sondern archäologische Belege, die
  älter als der Clovis-Horizont sind. Fundorte wie Monte Verde trugen entscheidend dazu bei, eine menschliche Präsenz
  vor Clovis zu etablieren; der genaue Zeitpunkt und die Routen der frühesten Migrationen bleiben jedoch umstritten.
