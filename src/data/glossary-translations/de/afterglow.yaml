locale: de
entryId: afterglow
sourceReviewedAt: '2026-08-21'
term: Nachglühen
aliases:
- GRB-Nachglühen
shortDefinition: Allmählich schwächer werdende Strahlung, die nach dem ersten Blitz eines vorübergehenden Ereignisses
  wie eines Gammastrahlenausbruchs beobachtet wird.
longDefinition: Das Nachglühen eines Gammastrahlenausbruchs ist länger anhaltende Strahlung nach dem kurzen Gammastrahlenblitz
  und kann unter anderem im Röntgen-, sichtbaren und Radiobereich beobachtet werden. Weil es viel länger anhält als der
  eigentliche Ausbruch, lässt sich das Ereignis genauer lokalisieren, einer Wirtsgalaxie zuordnen und spektroskopisch
  untersuchen.
