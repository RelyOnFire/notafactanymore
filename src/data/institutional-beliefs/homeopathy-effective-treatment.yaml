schemaVersion: 2
title: Homeopathy as effective treatment
proposition:
  summary: >-
    Homeopathy was treated as a medically effective therapy strongly enough to justify public provision, reimbursement,
    formal incorporation into health systems, or professional physician credentialing.
correction:
  summary: >-
    Homeopathy has not shown robust, reproducible therapeutic effects beyond placebo for any known disease. Its central
    claims, including effects from extreme dilutions that may contain none of the starting substance, are not compatible
    with established chemistry and pharmacology. Clinical attention and placebo effects can still influence how patients
    feel, but they do not establish a specific effect of the homeopathic preparation.
category: Medicine and public health
reviewedAt: '2026-08-24'
episodes:
  - id: united-kingdom-1948-2017
    polity: United Kingdom
    region: Europe
    startYear: 1948
    endYear: 2017
    strength: policy-basis
    institutionTypes:
      - government
      - medical
      - professional
    institutions:
      - National Health Service
      - Royal London Homoeopathic Hospital
      - Bristol Homeopathic Hospital
      - Liverpool Homeopathic Hospital
      - Glasgow Homoeopathic Hospital
    institutionalContext: >-
      Homeopathy was embedded in the NHS through a mixture of specialist hospitals, general-practice prescribing and local
      commissioning rather than through a single national homeopathy agency. The named hospitals provided specialist NHS
      services, while local Primary Care Trusts and later commissioning bodies determined much of the referral and funding
      machinery. NHS England supplied the national 2017 reversal in prescribing guidance.
    consequences:
      - Public funding of homeopathic treatment
      - NHS prescribing and referrals
      - Dedicated homeopathic hospital services
    summary: >-
      Homeopathy was funded and provided within the NHS from its creation in 1948, including through specialist homeopathic
      hospitals and primary-care prescribing. A 2010 House of Commons evidence review concluded that the evidence did not
      support efficacy beyond placebo and recommended that the NHS stop funding homeopathy. NHS England adopted national
      guidance in 2017 stating that homeopathy should no longer be routinely prescribed because there was no clear or
      robust evidence of clinical effectiveness.
    mechanism:
      kind: administrative-adoption
      summary: >-
        NHS institutions funded specialist homeopathic services, prescribing and referrals through hospital, primary-care
        and commissioning structures, giving the therapy a place within publicly provided health care.
    institutionalCorrection:
      status: partial
      periodLabel: '2017'
      action: NHS England recommended that homeopathy no longer be routinely initiated or prescribed and that existing prescribing be deprescribed where appropriate.
      summary: >-
        NHS England explicitly reduced institutional support because robust clinical-effectiveness evidence was lacking,
        but the current evidence record supports a prescribing and funding retreat rather than a categorical claim that
        every NHS-linked homeopathic service or use ceased immediately.
  - id: france-1984-2021
    polity: France
    region: Europe
    startYear: 1984
    endYear: 2021
    strength: policy-basis
    institutionTypes:
      - government
      - medical
    institutions:
      - Assurance Maladie
      - Ministère des Affaires sociales et de la Solidarité nationale
    institutionalContext: >-
      The 1984 reimbursement list was issued by the Ministère des Affaires sociales et de la Solidarité nationale and
      operated through compulsory health insurance, prescribing physicians and pharmacies. These distributed professional
      channels formed the reimbursement machinery rather than a single national prescribing and pharmacy system. In 2019
      the Haute Autorité de Santé performed the scientific reassessment that led to withdrawal of reimbursement.
    consequences:
      - Public reimbursement of homeopathic medicines
      - Routine prescribing within insured health care
      - Institutional medical legitimacy without prior efficacy assessment
    summary: >-
      Homeopathic medicines were reimbursable through France's compulsory health-insurance system under a framework dating
      from 1984. In 2019, the Haute Autorité de Santé carried out France's first scientific assessment specifically for
      reimbursement and found that efficacy had not been demonstrated sufficiently to justify public coverage.
      Reimbursement was reduced in 2020 and ended on 1 January 2021.
    mechanism:
      kind: administrative-adoption
      summary: >-
        A ministerial reimbursement list and compulsory health insurance made homeopathic medicines publicly reimbursable
        through ordinary prescribing and pharmacy channels.
    institutionalCorrection:
      status: corrected
      periodLabel: 2019–1 January 2021
      action: France's health authorities found efficacy insufficient for reimbursement, reduced reimbursement in 2020, and ended compulsory-insurance reimbursement on 1 January 2021.
      summary: >-
        The French public reimbursement system directly reversed its earlier support after a formal scientific assessment
        found the evidence of efficacy insufficient to justify continued coverage.
  - id: brazil-2006-2026
    polity: Brazil
    region: Latin America
    startYear: 2006
    endYear: 2026
    endOpen: true
    strength: policy-basis
    institutionTypes:
      - government
      - medical
      - education
    institutions:
      - Ministério da Saúde
      - Sistema Único de Saúde (SUS)
    institutionalContext: >-
      PNPIC is a federal Ministry of Health policy implemented through Brazil's decentralized SUS. State and municipal
      health secretariats and services provide much of the actual care. These bodies vary by jurisdiction and together form
      decentralized implementation machinery rather than a single institution.
    consequences:
      - Public provision of homeopathic care
      - Incorporation into primary and specialist care
      - Public provision of homeopathic medicines
      - Training and dissemination within the health system
    summary: >-
      Brazil's 2006 National Policy on Integrative and Complementary Practices formally incorporated homeopathy into the
      public SUS system and directed governments to expand homeopathic consultations, medicines, professional training, and
      services. The policy described homeopathy as contributing to prevention and recovery and to reduced demand for
      conventional interventions. Homeopathy remains listed within the national PNPIC framework as of 2026.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Federal health policy incorporated homeopathy into SUS and directed decentralized public-health institutions to
        expand consultations, medicines, training and service provision.
    institutionalCorrection:
      status: ongoing
      periodLabel: 2006–present
      action: No institutional correction is documented in the current evidence record; current Ministry of Health materials continue to list homeopathy within the PNPIC framework.
      summary: >-
        The same federal policy framework continues to include homeopathy in the public health system, so the institutional
        endorsement remains current despite external evidence reviews rejecting specific efficacy beyond placebo.
  - id: austria-1994-2026
    polity: Austria
    region: Europe
    startYear: 1994
    endYear: 2026
    endOpen: true
    strength: officially-endorsed
    institutionTypes:
      - professional
      - medical
    institutions:
      - Österreichische Ärztekammer (Austrian Medical Chamber)
      - Österreichische Akademie der Ärzte
    institutionalContext: >-
      The Austrian Medical Chamber introduced a special diploma in homeopathy in 1994 and continues to maintain it within
      its formal physician continuing-education system. The current curriculum calls homeopathy a medical therapy using
      remedies tested on healthy people, potentiation and the similarity principle; it states that graduates may treat
      acute and chronic illnesses according to homeopathic rules. The Austrian Academy of Physicians administers the
      diploma on behalf of the Medical Chamber. This is professional credentialing rather than national insurance coverage:
      Austrian social-insurance authorities have separately stated that homeopathy is not a scientifically established
      healing method and that homeopathic medicines generally lack the evidence required for reimbursement.
    consequences:
      - Formal physician credential in homeopathic diagnosis and treatment
      - Three-year, 350-unit postgraduate training pathway recognized by the Austrian Medical Chamber
      - Professional legitimacy for treating acute and chronic disease according to homeopathic principles
      - Hundreds of currently credentialed physicians despite lack of robust evidence for specific therapeutic efficacy
    summary: >-
      Austria's Medical Chamber has formally credentialed physicians in homeopathy since 1994. Its current ÖÄK diploma
      curriculum defines homeopathy as a medical therapy, teaches potentiation and the similarity principle, and says
      qualified physicians can use the method to treat acute and chronic illnesses. The credential remains active: the
      Chamber's 2025 training report counted 675 diploma holders at the end of 2024. This endorsement coexists with an
      explicitly different Austrian health-policy judgment: social-insurance authorities have stated that homeopathy is
      not scientifically established and that homeopathic medicines generally do not meet the evidentiary threshold for reimbursement.
    mechanism:
      kind: credentialing
      summary: >-
        The Medical Chamber and Academy of Physicians maintain a formal postgraduate diploma that trains and credentials
        physicians to diagnose and treat acute and chronic illnesses according to homeopathic principles.
    institutionalCorrection:
      status: ongoing
      periodLabel: 1994–present
      action: No correction by the credentialing carriers is documented; the ÖÄK homeopathy diploma and curriculum remain active.
      summary: >-
        The Austrian Medical Chamber continues to recognize homeopathic treatment through a formal physician diploma even
        though other Austrian health institutions have separately rejected homeopathy as scientifically established for reimbursement.
