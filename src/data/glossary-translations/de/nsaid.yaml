entryId: nsaid
sourceReviewedAt: '2026-08-21'
term: NSAR
aliases:
- nichtsteroidales Antirheumatikum
- nichtsteroidale Antirheumatika
- NSAID
- NSAIDs
shortDefinition: Eine häufig verwendete Gruppe schmerz- und entzündungshemmender Medikamente, zu der etwa Aspirin, Ibuprofen
  und Naproxen gehören.
longDefinition: Nichtsteroidale Antirheumatika oder NSAR lindern Schmerzen, Fieber und Entzündung, indem sie Cyclooxygenase-Enzyme
  hemmen und dadurch die Prostaglandinbildung senken. Derselbe Mechanismus kann Schutzfunktionen von Magen und Zwölffingerdarm
  schwächen, weshalb längere oder risikoreiche Einnahme zu Geschwüren und gastrointestinalen Blutungen beitragen kann.
