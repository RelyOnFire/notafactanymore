entryId: element-concept
sourceReviewedAt: '2026-08-21'
term: Element
aliases:
- chemisches Element
- klassisches Element
- elementar
shortDefinition: 'Ein Begriff mit veränderter wissenschaftlicher Bedeutung: Klassische „Elemente“ waren grundlegende
  Stoffarten oder Prinzipien, moderne chemische Elemente werden durch die Protonenzahl ihrer Atome definiert.'
longDefinition: 'In antiker und mittelalterlicher Naturphilosophie konnte Element eine kleine Gruppe grundlegender Stoffprinzipien
  wie Erde, Wasser, Luft und Feuer bezeichnen. Die moderne Chemie verwendet dasselbe Wort enger: Ein chemisches Element
  ist ein Stoff, dessen Atome dieselbe Ordnungszahl und damit dieselbe Protonenzahl besitzen. Luft ist deshalb kein modernes
  Element, sondern ein Gemisch verschiedener Gase, darunter elementarer Stickstoff und Sauerstoff.'
