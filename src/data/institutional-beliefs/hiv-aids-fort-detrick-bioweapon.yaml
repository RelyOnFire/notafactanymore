title: HIV/AIDS as a U.S. biological weapon from Fort Detrick
claim: >-
  Soviet and East German state-security institutions propagated the claim that HIV/AIDS originated from U.S. military
  biological-weapons experiments at Fort Detrick, presenting an artificial American origin as fact through coordinated
  international active measures.
currentUnderstanding: >-
  HIV-1 group M, the principal cause of the global AIDS pandemic, arose through natural cross-species transmission from
  simian immunodeficiency virus in chimpanzees in central Africa and was already diversifying in humans in the early
  twentieth century. Viral genetic evidence and samples from Kinshasa predating the recognized AIDS epidemic are
  incompatible with the claim that HIV was engineered at Fort Detrick.
category: Public health, intelligence and state disinformation
reviewedAt: '2026-08-25'
impact:
  summary: >-
    The Fort Detrick story became a coordinated international disinformation campaign rather than a stray conspiracy
    theory. A 1983 article in the Indian newspaper Patriot supplied an early Fort Detrick formulation; by September 1985
    a KGB First Chief Directorate communication explicitly described measures intended to create the belief abroad that
    AIDS resulted from secret U.S. and Pentagon biological-weapons experiments. East German foreign intelligence joined
    the effort through OVO “Denver.” By late 1986 U.S. diplomatic reporting recorded the allegation in more than 50
    countries and Soviet-bloc radio broadcasts in more than 20 languages.
  highlights:
  - value: 50+
    label: countries in which the Fort Detrick AIDS allegation had appeared by late 1986
  - value: 20+
    label: languages used by Soviet-bloc radio broadcasts spreading AIDS-related allegations
  - value: '1987'
    label: year a senior Soviet diplomat privately acknowledged that Soviet AIDS propaganda had been foolish as Moscow curtailed it
  context:
  - >-
    The campaign is often called “Operation INFEKTION” in later secondary literature. Archival research published by
    Germany's federal archive authority found that “Infektion” was not the documented codename of the AIDS campaign.
    East German foreign intelligence used the object-operation name OVO “Denver”; a separate coordinated action called
    “Infektion” concerned Radio Free Europe and Radio Liberty.
  - >-
    The 1983 Patriot article is an important seed publication and archival research identifies multiple indications of
    KGB inspiration, but the cleanest direct institutional evidence begins in 1985 with KGB Information No. 2955 to
    Bulgarian state security describing the campaign's purpose and requesting allied participation.
  - >-
    The available archive does not justify claiming that Jakob Segal knowingly acted as a KGB agent or that the KGB
    secretly authored all of his scientific arguments. East German intelligence used and promoted the Segal thesis, but
    the card does not turn that institutional exploitation into an unsupported claim about his personal intent.
episodes:
- id: soviet-union-1983-1987
  polity: Soviet Union
  region: Eurasia
  startYear: 1983
  endYear: 1987
  strength: officially-endorsed
  institutionTypes:
  - government
  institutions:
  - KGB First Chief Directorate
  - Soviet foreign-propaganda and media apparatus
  institutionalContext: >-
    The 17 July 1983 Patriot article in India was the first identifiable publication to name Fort Detrick as the alleged
    origin of AIDS and became a seed text for later Soviet amplification. Direct archival evidence is unambiguous by
    7 September 1985: KGB Information No. 2955 told Bulgarian state security that the USSR was conducting measures to
    create a favorable foreign opinion that AIDS resulted from uncontrolled secret experiments by U.S. intelligence
    services and the Pentagon with new biological weapons. Soviet media and allied services amplified the theme
    internationally. By July 1987 Soviet Deputy Foreign Minister Anatoly Adamishin told a U.S. counterpart that Soviet
    AIDS propaganda had been “foolish” and said fewer such items were appearing; archival research indicates Moscow
    substantially curtailed the campaign in the second half of that year.
  consequences:
  - Coordinated dissemination of a false U.S.-military origin for HIV/AIDS through international active measures
  - Mobilization of allied intelligence and propaganda services to amplify the Fort Detrick narrative
  - Spread of the allegation across more than 50 countries and through Soviet-bloc radio in more than 20 languages
  - Undermining of accurate public-health understanding by presenting a fabricated laboratory origin as scientific fact
  - Diplomatic friction requiring repeated U.S. government efforts to counter the campaign
  summary: >-
    Soviet institutions converted an AIDS conspiracy theory into an organized active-measures campaign. A Fort Detrick
    allegation seeded in 1983 was followed by explicit KGB instructions in 1985 to manufacture international belief in
    a U.S. biological-weapons origin and to enlist allied services in spreading it. The campaign reached a global
    audience before Soviet officials began retreating from it in 1987. In 1992 Russian foreign-intelligence chief
    Yevgeny Primakov publicly acknowledged that the KGB had been behind the international disinformation campaign.
  sources:
  - title: Die AIDS-Verschwörung — Das Ministerium für Staatssicherheit und die AIDS-Desinformationskampagne des KGB
    url: https://www.bundesarchiv.de/assets/bundesarchiv/de/Publikationen/BFi_33_Selvage_Nehring_AIDS_Auflage-02.pdf
    publisher: Bundesarchiv / Stasi Records Archive
    note: >-
      Archival study reproducing and citing KGB Information No. 2955 of 7 September 1985, documenting the campaign's
      purpose and cooperation with allied services; identifies OVO “Denver” as the East German operation and explains
      that “Infektion” was not the AIDS campaign's documented codename. It also records Primakov's 1992 admission.
  - title: Soviet Disinformation on AIDS — global spread assessment, 1986
    url: https://history.state.gov/historicaldocuments/frus1981-88v41/d21
    publisher: U.S. Department of State, Office of the Historian
    note: >-
      Contemporary diplomatic assessment reporting that the Fort Detrick allegation had appeared in more than 50
      countries and that Soviet-bloc radio had disseminated AIDS-related claims in more than 20 languages.
  - title: Countering Soviet Disinformation on AIDS — 18 July 1987
    url: https://history.state.gov/historicaldocuments/frus1981-88v41/d30
    publisher: U.S. Department of State, Office of the Historian
    note: >-
      Contemporary telegram recording Soviet Deputy Foreign Minister Anatoly Adamishin's private statement that Soviet
      AIDS propaganda had been “foolish” and that fewer such items were appearing.
  - title: The evolution of HIV-1 and the origin of AIDS
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2935100/
    publisher: Philosophical Transactions of the Royal Society B
    note: >-
      Scientific review tracing pandemic HIV-1 group M to a chimpanzee simian immunodeficiency virus lineage in central
      Africa and placing its early human diversification around Kinshasa in the early twentieth century.
- id: east-germany-1986-1989
  polity: East Germany
  region: Europe
  startYear: 1986
  endYear: 1989
  strength: officially-endorsed
  institutionTypes:
  - government
  institutions:
  - Ministry for State Security
  - Hauptverwaltung A, Division X
  institutionalContext: >-
    East German foreign intelligence participated in the Soviet-bloc AIDS campaign and formalized its own object
    operation, OVO “Denver,” on 17 July 1986. HV A/X shared material with Bulgarian intelligence asserting that AIDS
    originated in the United States and was a product of U.S. biological-weapons research, and officials described the
    Segal study as material used in active measures worldwide. Archival research shows that HV A/X continued AIDS-related
    measures even after the KGB began advising restraint, including support for international distribution of material
    and later work around the 1989 film AIDS — die Afrikalegende.
  consequences:
  - Creation of OVO “Denver” as an East German foreign-intelligence active-measures operation
  - Distribution to allied services of material claiming AIDS was a product of U.S. biological-weapons research
  - International use of the Segal thesis as ostensibly scientific support for the Fort Detrick narrative
  - Continuation of AIDS-related active measures after the Soviet KGB began backing away from the campaign
  summary: >-
    The East German Ministry for State Security did not merely repeat Soviet media claims. Its foreign-intelligence
    service created OVO “Denver,” exchanged materials with allied services and used the Segal thesis in active measures
    intended to strengthen anti-American attitudes. The documented East German campaign continued after Moscow began
    restricting its own AIDS disinformation, lasting into the final full year of the East German regime.
  sources:
  - title: Die AIDS-Verschwörung — Das Ministerium für Staatssicherheit und die AIDS-Desinformationskampagne des KGB
    url: https://www.bundesarchiv.de/assets/bundesarchiv/de/Publikationen/BFi_33_Selvage_Nehring_AIDS_Auflage-02.pdf
    publisher: Bundesarchiv / Stasi Records Archive
    note: >-
      Archival reconstruction of OVO “Denver,” HV A/X coordination with Bulgarian intelligence, use of the Segal thesis
      in active measures and continued East German activity after the KGB began calling for restraint.
