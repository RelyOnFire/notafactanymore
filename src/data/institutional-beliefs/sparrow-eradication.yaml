evidence:
  - id: sparrow-directive-proposition
    sourceId: sparrow-1958-directive
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: single substantive paragraph beginning “1958年2月12日”
    note: >-
      The official retrospective identifies the 12 February 1958 joint Central Committee–State Council directive and
      reproduces its classification of rats and sparrows as major enemies that damaged grain and obstructed production.
  - id: sparrow-outline-proposition
    sourceId: sparrow-outline-1957
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: Article 27, “除四害”
    note: >-
      The October 1957 revised national agricultural outline retained the goal of basically eliminating sparrows wherever
      possible, while adding that killing was for crop protection and sparrows in cities and forests need not be killed.
  - id: sparrow-policy-proposition
    sourceId: sparrow-policy-science-1
    relation: supports
    target: {scope: belief, aspect: proposition}
    locator: section I, paragraphs beginning “1955年11月” and “1955年底至1956年初”
    note: >-
      Archival policy history traces the target from Mao's November 1955 agricultural proposals to Article 27 of the
      January 1956 outline draft, after Politburo and Supreme State Conference consideration.
  - id: sparrow-cornell-correction
    sourceId: sparrow-cornell-diet
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: “Food” section
    note: >-
      The species account records a mixed diet of grain, seeds, fruit, flowers and invertebrates and notes that Eurasian
      tree sparrows eat large quantities of insects and other arthropods in spring, especially when feeding young.
  - id: sparrow-policy-correction
    sourceId: sparrow-policy-science-2
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: section III, paragraphs on the September and 27 November 1959 Academy reports
    note: >-
      The archival reconstruction records scientists' conclusion that benefits and harms varied by place and season and
      that policy should control specific sparrow damage rather than eliminate the species.
  - id: sparrow-nber-correction
    sourceId: sparrow-nber-2025
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: abstract; pp. 2–5 and 27–40
    note: >-
      The working paper combines habitat-suitability models with historical county production and demographic records to
      estimate that eradication reduced natural pest control, lowered rice and wheat output and raised famine mortality.
      Its title page states that NBER working papers are circulated for discussion and have not been peer reviewed.
  - id: sparrow-biodiversity-impact
    sourceId: sparrow-biodiversity-review
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: >-
      section “Unintended Consequences of Centralized Conservation Planning,” subsection “Internal Risks,” first two
      paragraphs and Fig. 2
    note: >-
      Reviews the top-down campaign, mass participation, severe sparrow depletion and the 1959 insect outbreak as an
      example of ecological harm from a one-size-fits-all policy. Its numerical kill estimate is not adopted here because
      national totals conflict across sources.
  - id: sparrow-guangzhou-impact
    sourceId: sparrow-guangzhou-history
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: abstract; PMID 31137157
    note: >-
      The historical review distinguishes public-health gains from the wider Guangzhou sanitation campaign from the
      serious ecological and harvest damage associated with excessive measures such as sparrow eradication.
  - id: sparrow-nber-impact
    sourceId: sparrow-nber-2025
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: abstract; pp. 27–40 and 45–49
    note: >-
      Reports the authors' estimates of 5.3% larger rice and 8.7% larger wheat declines per standard-deviation increase in
      sparrow suitability, a 9.6% mortality increase in high-suitability counties and nearly two million excess deaths.
