term: Antiperistasis
aliases: []
shortDefinition: Eine historische aristotelische Erklärung, nach der die von einem Projektil verdrängte Luft hinter ihm
  herumströmt und seine Bewegung weiter antreibt.
longDefinition: Antiperistasis war eine mittelalterliche Bezeichnung für einen aristotelischen Versuch, Projektilbewegung
  nach dem Ende des Kontakts mit dem Werfer zu erklären. Das verdrängte Medium sollte um das Projektil herumströmen und
  es von hinten weiter bewegen. Spätere Kritiker beanstandeten unter anderem, dass dasselbe Medium zugleich Widerstand
  leisten und als fortwirkender Beweger dienen sollte.
