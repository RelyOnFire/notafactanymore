evidence:
  - id: women-certified-proposition
    sourceId: women-vienna-certified
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: section “Scientifically certified,” especially the paragraph beginning “Up to the 1880s”
    note: >-
      The university's institutional history expressly records the supposed “low cerebral capacity” of women as a
      scientific argument against admission and explains how successful women were dismissed as exceptions.
  - id: women-seebacher-proposition
    sourceId: women-seebacher-2018
    relation: supports
    target: {scope: belief, aspect: proposition}
    locator: pp. 183–189, especially pp. 183–188
    note: >-
      Reconstructs the “brain proof”: anatomists, gynaecologists and psychiatrists converted average measurements and
      physiological theories into claims of biological inferiority and inability to complete medical study.
  - id: women-eliot-correction
    sourceId: women-eliot-2021
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: abstract and highlights; pp. 667–697
    note: >-
      Synthesises three decades of MRI and postmortem research. After overall brain size is accounted for, few reliable
      sex differences remain, sex usually explains about 1% of variance, and the evidence does not support two dimorphic
      kinds of human brain.
  - id: women-voyer-correction
    sourceId: women-voyer-2014
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: abstract; Psychological Bulletin 140(4), pp. 1174–1204
    note: >-
      Meta-analysis of 502 effect sizes from 369 samples, including undergraduate and graduate study, finds a small
      overall female advantage in course marks across subject areas, directly contradicting general academic incapacity.
  - id: women-vienna-correction
    sourceId: women-vienna-history
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: sections “Die umstrittenen Anfänge” and “Die ersten Abschlüsse,” especially paragraphs 2–5
    note: >-
      Records the biological arguments, Gabriele Possanner's Zurich training, the 21 examinations she repeated in Vienna,
      her doctorate and practice, and the staged opening of Vienna's faculties.
