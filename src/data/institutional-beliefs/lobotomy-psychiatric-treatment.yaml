schemaVersion: 2
title: Lobotomy as an effective psychiatric treatment
proposition:
  summary: >-
    Broad prefrontal or transorbital operations that severed frontal-lobe connections were treated as capable of
    producing enough therapeutic improvement to justify institutional use for schizophrenia, severe psychosis and
    difficult behavior in psychiatric hospitals. Government health systems authorized and performed the operations,
    while the 1949 Nobel Prize gave the claimed therapeutic value of leucotomy unusually prominent professional
    endorsement.
correction:
  summary: >-
    The evidence does not support classical prefrontal or transorbital lobotomy as a broadly effective and acceptably
    safe routine psychiatric treatment. Historical evaluations relied heavily on case reports and uncontrolled series,
    used outcomes such as reduced agitation or easier ward management, and did not consistently distinguish symptom
    relief, discharge and independent functioning. The Veterans Administration's unusually systematic comparison found
    some average improvement and higher discharge rates at three and four years, but assignment was not strictly
    randomized, operations varied, later drug treatment confounded follow-up and group differences had diminished by
    five years. Such limited findings could not establish a favorable benefit-harm balance for large irreversible brain
    lesions associated with apathy, disinhibition, cognitive and personality change, seizures, hemorrhage, dependency
    and death. Modern psychiatric neurosurgery uses small stereotactic lesions or neuromodulation only for rare,
    carefully selected refractory conditions under consent and specialist oversight; it is not equivalent to classical
    lobotomy, and the evidence differs by diagnosis and procedure.
category: Medicine and public health
entryId: lobotomy-is-safe-and-effective
reviewedAt: '2026-09-29'
impact:
  summary: >-
    Lobotomy moved from an experimental operation into federal and state hospital systems while its real benefits were
    still uncertain. By June 1950, 47 U.S. Veterans Administration hospitals were authorized to conduct lobotomy
    programs and more than 1,400 VA patients had undergone an operation. Swedish records indicate roughly 4,500
    operations nationwide; Umedalen State Mental Hospital alone performed 771, with 57 postoperative deaths. Norway
    later documented irreversible personality changes, epilepsy and deaths when it created a general compensation
    scheme. The Nobel award amplified the treatment's scientific prestige during this expansion.
  highlights:
    - value: '1949'
      label: Nobel Prize awarded for the claimed therapeutic value of leucotomy in certain psychoses
    - value: 47 VA hospitals
      label: authorized to conduct lobotomy programs by 30 June 1950
    - value: ≈4,500
      label: lobotomies documented in Sweden during the mid-century psychosurgery era
  context:
    - >-
      This correction concerns the broad destructive operations commonly called prefrontal or transorbital lobotomy.
      Contemporary stereotactic ablation and deep-brain stimulation use different targets, techniques, selection rules
      and oversight. Their limited modern indications should neither rehabilitate classical lobotomy nor be dismissed
      merely by association with it.
    - >-
      Some patients were reported to improve, and the VA comparison found a temporary average advantage. The historical
      error was treating such findings as enough to justify wide irreversible use despite weak allocation methods,
      heterogeneous operations, inconsistent outcomes and serious harms. Reduced disturbance or easier institutional
      care was not necessarily recovery for the patient.
    - >-
      Severe mental illness was disabling, hospitals were overcrowded and effective alternatives were scarce when
      lobotomy spread. Those conditions explain why clinicians sought drastic treatments; they do not by themselves
      demonstrate efficacy, proportionate risk or valid consent.
    - >-
      The Swedish figure of 61.2% women in the Umeå thesis refers to the 771 people operated on through Umedalen, while
      the national estimate is approximately 4,500 operations. A 2006 private members' motion repeated broader sex and
      diagnosis percentages, but all three of its requests for inquiry, evaluation and compensation were rejected by
      Parliament and are not treated here as adopted parliamentary findings.
episodes:
  - id: united-states-va-1944-1960
    polity: United States — Veterans Administration
    region: North America
    startYear: 1944
    endYear: 1960
    periodLabel: World War II–c. 1960
    strength: policy-basis
    institutionTypes:
      - government
      - medical
    institutions:
      - United States Veterans Administration
      - Veterans Administration neuropsychiatric hospitals
    institutionalContext: >-
      The Veterans Administration incorporated frontal lobotomy into its wartime and postwar psychiatric system. Its
      fiscal-year 1950 report described the operation as an appropriate treatment in selected cases, recorded more than
      1,400 operated patients—mostly people diagnosed with chronic schizophrenia—and listed 47 hospitals authorized to
      run programs. Yet a 1949 internal review of roughly 1,500 cases found that perceived benefits were not equally clear
      in discharge or social and economic independence. The VA therefore organized a six-hospital comparison of 188
      operated patients and 185 controls. Families' refusal of surgery supplied many controls, surgeons chose among four
      operations and increasing use of psychotropic drugs complicated later follow-up.
    consequences:
      - Irreversible frontal brain surgery on hospitalized veterans with psychiatric diagnoses
      - Program authorization across 47 federal hospitals and more than 1,400 operations by June 1950
      - Behavioral quieting and institutional manageability counted among perceived benefits
      - Exposure to hemorrhage, seizures, cognitive and personality changes, dependency and death
      - Continued operations while the federal system was still trying to determine who benefited
    summary: >-
      The VA gave lobotomy an administrative home across dozens of federal hospitals before reliable comparative
      evidence was available. Its own researchers then built one of the era's more systematic studies. That study found
      some average improvement and a discharge-rate advantage at intermediate follow-up, but its non-strict allocation,
      mixed procedures and increasing drug use limited the inference; the VA's later history calls the conclusions
      unimpressive. The program receded as antipsychotic drugs and stronger evaluation methods entered psychiatric care,
      without a single documented VA ban or formal retraction.
    mechanism:
      kind: administrative-adoption
      summary: >-
        The federal system authorized hospital programs, selected patients for surgery, trained and coordinated staff,
        and treated lobotomy as appropriate in selected cases while conducting a multi-hospital outcome study.
    institutionalCorrection:
      status: partial
      periodLabel: 1949–1960s
      action: >-
        The VA subjected its program to a six-hospital comparison and shifted toward evaluated psychopharmacology as the
        lobotomy findings proved limited and difficult to interpret.
      summary: >-
        The VA generated a critical internal evidence record and later described the results as unimpressive and the
        operation as less effective than once believed. Clinical use then receded, but the reviewed sources do not show a
        formal VA repudiation, apology or compensation program for operated veterans.
  - id: sweden-1944-1964
    polity: Sweden
    region: Europe
    startYear: 1944
    endYear: 1964
    periodLabel: 1944–1964
    strength: policy-basis
    institutionTypes:
      - government
      - medical
    institutions:
      - Swedish National Board of Health (Medicinalstyrelsen)
      - Umedalen State Mental Hospital
      - Sidsjön State Mental Hospital
      - Swedish state mental-hospital system
    institutionalContext: >-
      Swedish neurosurgeons and psychiatrists began prefrontal lobotomy in 1944. Sidsjön and Umedalen state mental
      hospitals introduced it on a large scale in 1946 and 1947, after which the practice spread through the hospital
      system. The National Board of Health supervised mental care and received annual reports, but medical
      superintendents retained broad autonomy and the historical review found no significant central intervention to
      restrict lobotomy. Many hospitals employed general surgeons rather than neurosurgeons. More than 4,000 operations
      were recorded through 1964; the nationwide estimate for 1944–1960 is about 4,500.
    consequences:
      - Thousands of people subjected to irreversible psychosurgery in psychiatric institutions
      - At Umedalen, 771 operations from 1947 to 1958 and 57 postoperative deaths, an overall mortality of about 7.4%
      - Women constituted 61.2% of Umedalen's operated patients, with schizophrenia the dominant diagnosis
      - Operations by general surgeons in hospitals without specialist neurosurgical facilities
      - Weak patient autonomy, with no consent forms found for most cases in the detailed Umedalen sample
    summary: >-
      Sweden's state hospital system adopted lobotomy rapidly and allowed local superintendents to determine practice
      even where specialist resources were weak and early mortality was high. Umedalen and Sidsjön accounted for 28% of
      the national total. The procedure was already being phased out before 1950 as more targeted techniques emerged,
      but prefrontal operations persisted at peripheral hospitals and psychosurgery continued into the 1960s.
    mechanism:
      kind: administrative-adoption
      summary: >-
        State-hospital superintendents used delegated clinical autonomy to refer patients for lobotomy and engage local
        general surgeons, while the national supervisory authority monitored hospitals without materially restraining
        the program.
    institutionalCorrection:
      status: partial
      periodLabel: 1950s–1964; parliamentary motion rejected in 2007
      action: >-
        Classical prefrontal lobotomy was phased out and ceased, but Parliament later rejected a private members' motion
        seeking a national mapping, consequences review and compensation inquiry.
      summary: >-
        Abandonment of the operation corrected clinical practice, and university research later documented its scale,
        mortality, consent failures and weak oversight. The reviewed record does not show a national institutional
        repudiation or compensation program comparable to Norway's; all three requests in the 2006/07 motion were
        rejected by both committee and chamber.
  - id: karolinska-nobel-1949-2026
    polity: Sweden — Karolinska Institutet and the Nobel Prize
    region: Global
    startYear: 1949
    endYear: 2026
    endOpen: true
    periodLabel: 1949–present
    strength: officially-endorsed
    institutionTypes:
      - academy
      - medical
      - professional
    institutions:
      - Karolinska Institutet professorial staff (1949 prize-awarding body)
      - Nobel Committee for Physiology or Medicine
      - Nobel Assembly at Karolinska Institutet (since 1977)
      - Nobel Prize in Physiology or Medicine
    institutionalContext: >-
      In 1949 Karolinska Institutet's professorial body awarded Egas Moniz half of the Nobel Prize in Physiology or
      Medicine for what the prize motivation called the “therapeutic value of leucotomy in certain psychoses.” The Nobel
      Committee handled the selection work; the separate Nobel Assembly was not instituted until 1977. The award did not
      create hospital policy, but it conferred exceptional scientific prestige on the efficacy claim while lobotomy was
      spreading through psychiatric systems. The official prize record continues to reproduce that motivation. Present
      Nobel historical material also calls the Moniz award an example raised in discussions of mistakes, describes
      lobotomy as obsolete and seemingly unethical today, and acknowledges serious personality changes.
    consequences:
      - International scientific prestige for the claimed therapeutic value of leucotomy
      - Reinforcement of professional confidence during the procedure's period of rapid expansion
      - A durable official award record that still reproduces the original efficacy wording
      - Later need to contextualize the award against serious harms and changed clinical evidence
    summary: >-
      The Nobel Prize was a distinct professional endorsement by Karolinska Institutet rather than part of Sweden's
      hospital administration. Its 1949 motivation stated the disputed therapeutic proposition directly and gave it
      global authority. Current Nobel pages now acknowledge that lobotomy caused serious personality changes, became
      obsolete and is viewed very differently, while retaining the historical award and its original motivation.
    mechanism:
      kind: endorsement
      summary: >-
        The prize formally honored Moniz for the claimed therapeutic value of leucotomy, attaching the authority and
        visibility of the Nobel institution to the efficacy claim.
    institutionalCorrection:
      status: partial
      periodLabel: 2000–present
      action: >-
        Official Nobel historical and biographical pages now identify the award as controversial, acknowledge serious
        personality changes and describe lobotomy as obsolete and seemingly unethical today.
      summary: >-
        Nobel's current educational record supplies explicit critical context, but the prize page still records the award
        and repeats the original “therapeutic value” motivation. The institutional correction is therefore contextual
        rather than a withdrawal of the endorsement.
  - id: norway-1941-1974
    polity: Norway
    region: Europe
    startYear: 1941
    endYear: 1974
    periodLabel: 1941–1974
    strength: policy-basis
    institutionTypes:
      - government
      - medical
    institutions:
      - Norwegian psychiatric hospitals
      - Gaustad Hospital
      - Norwegian health authorities
    institutionalContext: >-
      Lobotomy began at Gaustad Hospital in 1941 and spread to most Norwegian psychiatric hospitals over the following
      years. Use declined after antipsychotic drugs arrived and ended in the 1970s; the later compensation framework used
      1941–1974 as the operative period. Government case records also state that neither patient consent nor express
      consent from a guardian or relative was necessarily required under the contemporary framework. A national inquiry
      established in 1991 reviewed the practice, after which the government and Parliament created both individualized
      redress routes and a general payment for documented survivors.
    consequences:
      - Irreversible psychosurgery performed without a modern informed-consent standard
      - General personality changes and cognitive or functional impairment
      - Elevated risk of epilepsy and other neurological sequelae
      - Deaths associated with the operation
      - General compensation of NOK 100,000 paid to 447 documented survivors by the end of 1997
    summary: >-
      Norway used lobotomy throughout its psychiatric hospital system from 1941 into the 1970s. The 1992 inquiry initially
      concluded that the profession had regarded the method as acceptable by the standards of the time and did not find a
      general legal basis for damages. Parliament nevertheless directed a broader response. In 1996 it approved a
      standardized payment to every documented surviving recipient because of the intervention's irreversibility,
      personality changes, high risk of sequelae and deaths, in addition to case-specific redress.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Psychiatric hospitals incorporated lobotomy into treatment practice under contemporary professional standards
        that permitted the operation without the patient's or family's express consent in every case.
    institutionalCorrection:
      status: corrected
      periodLabel: 1991–1997
      action: >-
        Norway conducted a national inquiry, developed case-specific redress criteria and approved a general NOK 100,000
        payment for every documented surviving person who had been lobotomized.
      summary: >-
        The state formally investigated the practice and compensated survivors while documenting irreversible outcomes,
        personality changes, epilepsy and deaths. The scheme was based on fairness rather than an admission of general
        legal liability, and it did not compensate heirs, but it constituted a nationwide institutional response.
