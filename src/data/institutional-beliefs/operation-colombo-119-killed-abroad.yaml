    relation: supports
    target: {scope: belief, aspect: impact}
    locator: 'Article paragraphs 2–5, 24 Jul 2023'
    note: >-
      Documents international pressure, the domestic campaign, its use of two specially created foreign publications and
      the later judicial proceedings involving victims from the list.
  - id: colombo-rettig-impact
    sourceId: rettig-operation-colombo
    relation: supports
    target: {scope: belief, aspect: impact}
