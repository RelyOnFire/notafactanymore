locale: de
entryId: yellow-fever-fomite-transmission
sourceReviewedAt: '2026-08-25'
title: Kontaminierte Kleidung, Bettzeug und Räume als Überträger von Gelbfieber
claim: Gesundheitsbehörden der US-Armee und der Militärregierung in Kuba behandelten Kleidung, Bettzeug, Gebäude und
  andere Gegenstände aus der Umgebung von Gelbfieberkranken als mögliche Krankheitsträger und machten Verbrennung,
  Desinfektion und auf Fomiten ausgerichtete Quarantäne zu Bestandteilen der Gelbfieberbekämpfung.
currentUnderstanding: 'Gelbfieber wird vor allem übertragen, wenn infizierte Stechmücken – insbesondere Aedes aegypti
  – empfängliche Menschen stechen; kontaminiertes Bettzeug, Kleidung und gewöhnliche persönliche Gegenstände übertragen
  die Krankheit nicht. Die Yellow Fever Commission der US-Armee zeigte dies 1900–1901 direkt: Freiwillige schliefen
  wiederholt in engem Kontakt mit stark kontaminierter Kleidung und Bettzeug, ohne zu erkranken, während kontrollierte
  Exposition gegenüber infizierten Mücken Gelbfieber auslöste. Damit wurde der von dem kubanischen Arzt Carlos Finlay
  seit langem vertretene Mückenmechanismus experimentell bestätigt und die Prävention auf die Unterbrechung der Mückenübertragung
  ausgerichtet.'
impact:
  summary: Das Fomitenmodell prägte konkrete Maßnahmen der US-Armee während der Besetzung Kubas ab 1898. Medizinische
    Empfehlungen sahen vor, von Einwohnern genutzte Gebäude und die Kleidung von Flüchtlingen zu verbrennen, Kleidung
    von Rekonvaleszenten zu vernichten und betroffene Räume und Gegenstände zu desinfizieren. Trotzdem bestand Gelbfieber
    trotz umfangreicher Reinigung und Desinfektion fort. In Camp Lazear setzte die Army Commission daraufhin nichtimmune
    Freiwillige absichtlich Bettzeug und Kleidung aus, die stark mit Material von Gelbfieberpatienten verunreinigt
    waren; niemand erkrankte. Die Militärregierung ersetzte die alten Maßnahmen schrittweise durch Mückenschutz, mückenabtötende
    Begasung und Beseitigung von Brutstätten. Die gemeldeten Gelbfieberfälle in Havanna fielen im neuen Kontrollsystem
    von rund 1.400 im Jahr 1900 auf 37 im Jahr 1901 und auf null im Jahr 1902.
  highlights:
  - value: '1898'
    label: Heeresmedizinische Empfehlungen verlangten in Kuba die Verbrennung von Gebäuden und Flüchtlingskleidung
  - value: '0'
    label: Gelbfieberfälle unter Freiwilligen in wiederholten Fomitenexperimenten von Camp Lazear
    note: Die Freiwilligen waren bewusst stark kontaminiertem Bettzeug und Kleidung von Gelbfieberpatienten ausgesetzt.
  - value: 1.400 → 37 → 0
    label: gemeldete Gelbfieberfälle in Havanna 1900, 1901 und 1902 beim Übergang zur Mückenbekämpfung
    note: Der Rückgang folgte einem breiteren Vektorkontrollprogramm und wird nicht einer einzelnen Maßnahme zugeschrieben.
  context:
  - Die Korrektur betrifft gezielt die Übertragung von Gelbfieber durch kontaminierte Gegenstände. Straßenreinigung,
    sauberes Wasser, Kanalisation, Isolation und Desinfektion können bei anderen Krankheiten sehr wirksam sein; das
    breitere Hygieneprogramm der Armee verbesserte die Gesundheit, obwohl es Gelbfieber nicht stoppte.
  - Auch Quarantäne wurde durch die Mückenentdeckung nicht bedeutungslos. Wird verhindert, dass Mücken einen virämischen
    Patienten stechen, kann die Übertragung unterbrochen werden. Unnötig war die Vorstellung, Bettzeug, Kleidung oder
    Gepäck selbst seien infektiöse Fomiten, die aufwendig desinfiziert werden müssten.
  - Die Army Commission erfand die Mückenhypothese nicht. Der kubanische Arzt Carlos Finlay hatte Aedes bereits fast
    zwei Jahrzehnte als Überträger vorgeschlagen und der Kommission Mückeneier zur Verfügung gestellt. Die institutionelle
    Leistung der Armee bestand in der kontrollierten experimentellen Bestätigung und der raschen Umsetzung in Sanitätspolitik.
  - 1901 markiert den Abschluss und die Veröffentlichung der entscheidenden Fomiten- und Mückenversuche sowie den
    damit verbundenen Politikwechsel. Einzelne Einsatzbefehle änderten sich bereits Ende 1900 und im Laufe von 1901.
