    locator: 'Foreword, printed pp. 7–9; Endel Lippmaa recollection, pp. 69–70; Anneli Reigas recollection, pp. 101–105'
    note: >-
      The institutional history, written by commission participants and published by Estonia's Foreign Policy
      Institute, describes the official Soviet denial, identifies late public statements that it characterizes as
      denials and recounts the change of position during the congressional commission. Its participant perspective is
      used alongside contemporary reporting and Soviet primary records.
  - id: protocol-resolution-correction
    sourceId: protocol-1989-resolution
    relation: documents
