locale: de
entryId: black-troops-tropical-disease-immunity
sourceReviewedAt: '2026-08-24'
title: Schwarze Soldaten als von Natur aus resistent gegen Tropenkrankheiten
claim: >-
  US-Militärbehörden behandelten Schwarze Soldaten als von Natur aus widerstandsfähiger gegen Gelbfieber und andere
  Tropenkrankheiten; diese Annahme beeinflusste Rekrutierung und Einsatzentscheidungen für den Dienst auf Kuba im
  Spanisch-Amerikanischen Krieg.
currentUnderstanding: >-
  Gelbfieber ist eine durch infizierte Mücken übertragene Viruserkrankung; Immunität entsteht durch Impfung oder nach
  überstandener Infektion und nicht durch rassische Abstammung. Malaria wird durch Plasmodium-Parasiten verursacht,
  die von Anopheles-Mücken übertragen werden; populationsabhängige Unterschiede einzelner erblicher Merkmale machen
  Schwarze Menschen nicht generell immun gegen Malaria oder Tropenkrankheiten. Schwarze US-Soldaten erkrankten auf
  Kuba in großer Zahl an Malaria und Gelbfieber und widerlegten damit unmittelbar die Annahme eines allgemeinen
  angeborenen rassischen Schutzes.
impact:
  summary: >-
    Im Spanisch-Amerikanischen Krieg griff die US-Militärplanung auf die rassistische Annahme zurück, Schwarze Soldaten
    seien an Tropenkrankheiten besser angepasst oder von Natur aus widerstandsfähiger. Die Vorstellung beeinflusste
    sowohl die Organisation Schwarzer „Immune“-Freiwilligenregimenter als auch den Einsatz Schwarzer regulärer Truppen
    in krankheitsbelasteten Gebieten und im Lazarettdienst auf Kuba. Die Erfahrung der Armee widersprach der Theorie
    rasch: Eine amtliche Armeegeschichte berichtet, dass die Hälfte von 471 Männern des 24th Infantry, die in Siboney
    Dienst antraten, an Malaria oder Gelbfieber erkrankte.
  highlights:
  - value: '4'
    label: Schwarze US Volunteer Infantry Regiments unter den 1898 aufgestellten „Immune“-Regimentern
  - value: 50 % von 471
    label: Männer des 24th Infantry in Siboney, die laut amtlicher Armeegeschichte an Malaria oder Gelbfieber erkrankten
  - value: '1898'
    label: Rassistische Annahmen über Krankheitsresistenz beeinflussten US-Entscheidungen zum Tropendienst
  context:
  - >-
    Die bundesgesetzliche Ermächtigung für „Immune“-Truppen erklärte Schwarze Menschen nicht selbst für rassisch
    immun gegen Gelbfieber. Die rassistische Behauptung ist vielmehr in Denken und Einsatzentscheidungen von War
    Department und Army sowie bei der Rekrutierung Schwarzer Truppen dokumentiert; das Gesetz selbst enthielt diese
    rassistische Aussage nicht.
  - >-
    Die berichtete 50-Prozent-Zahl fasst Malaria und Gelbfieber zusammen; sie ist keine reine Gelbfieber-Infektionsrate.
  - >-
    Eine frühere Gelbfieberinfektion kann tatsächlich lebenslange Immunität erzeugen, und Militärplaner suchten auch
    Männer mit vermuteter erworbener Immunität. Dieses richtige Konzept wurde mit der falschen Annahme einer
    allgemeinen angeborenen rassischen Widerstandsfähigkeit vermischt.
episodes:
- id: united-states-1898
  polity: Vereinigte Staaten
  institutions:
  - United States War Department
  - United States Army
  institutionalContext: >-
    War Department und Army agierten in einer medizinischen Kultur, die Schwarzer Abstammung häufig eine natürliche
    Widerstandsfähigkeit gegen Gelbfieber und andere Tropenkrankheiten zuschrieb. Vier der Freiwilligen-„Immune“-
    Regimenter wurden als Schwarze Einheiten organisiert; bereits auf Kuba eingesetzte Schwarze reguläre Soldaten
    erhielten ebenfalls Aufgaben unter der Annahme, sie könnten Tropenkrankheiten besser standhalten als weiße Soldaten.
    Das 24th Infantry wurde beispielsweise während der Ausbreitung des Gelbfiebers zum Lazarettdienst in Siboney
    eingesetzt. Die Erkrankungsraten der Soldaten selbst widerlegten den angenommenen rassischen Schutz.
  consequences:
  - Rassistische Annahmen beeinflussten Rekrutierung und Organisation Schwarzer „Immune“-Freiwilligenregimenter
  - Schwarze reguläre Truppen wurden auch wegen ihrer vermeintlichen natürlichen Widerstandsfähigkeit zu krankheitsbelasteten Aufgaben eingesetzt
  - Soldaten wurden Tropenkrankheiten ausgesetzt, ohne den Schutz, den die rassistische Theorie unterstellte
  - Hohe Malaria- und Gelbfiebererkrankungsraten unter Schwarzen Soldaten widersprachen der institutionellen Annahme
  summary: >-
    1898 behandelten US-Militärbehörden Schwarze Soldaten als besonders für den Tropendienst geeignet, weil ihnen
    größere natürliche Widerstandsfähigkeit gegen Gelbfieber und verwandte Krankheiten zugeschrieben wurde. Die
    Annahme beeinflusste die Organisation Schwarzer „Immune“-Regimenter und den Einsatz Schwarzer regulärer Soldaten
    im Krankendienst auf Kuba. Eine amtliche Armeegeschichte berichtet dennoch, dass 50 Prozent von 471 Männern des
    24th Infantry in Siboney an Malaria oder Gelbfieber erkrankten und damit die vermeintliche rassische Immunität
    unmittelbar infrage stellten.
