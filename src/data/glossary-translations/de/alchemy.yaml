term: Alchemie
aliases:
- alchemistisch
- Alchemist
shortDefinition: Eine vielfältige vormoderne Tradition aus praktischer Stoffarbeit, Medizin, Metallurgie und Transformationstheorien,
  darunter Versuche zur Umwandlung von Metallen.
longDefinition: Alchemie war keine einzelne Lehre, sondern eine Familie von Traditionen in verschiedenen Kulturen und
  Epochen. Sie verband praktische Verfahren wie Destillation, Erhitzen, Legieren und Reinigung mit Theorien über Zusammensetzung
  und Veränderung von Materie. In europäischen und islamischen Traditionen war Metalltransmutation ein bekanntes Ziel,
  daneben beschäftigte sich Alchemie aber auch mit Arzneien, Pigmenten, Salzen und anderen Stoffen.
