  institutionalContext: >-
    Als Berichte über die Hungersnot ins Ausland gelangten, beschränkten Außenpolitik und Presseapparat den Zugang zu
    betroffenen Regionen und wiesen ausländische Darstellungen zurück. Direkt überlieferte sowjetische Korrespondenz von
    Anfang 1934 zeigt, wie Außenkommissar Maxim Litwinow eine ukrainische Broschüre zur Hungersnot als voller Lügen
    bezeichnete und Botschaftsrat Boris Skwirski mit einer Darstellung der angeblich wirklichen Lage beauftragte.
    Skwirski erklärte Behauptungen über massenhaftes Sterben für grotesk und berief sich auf Presseberichte, nach denen
    es keine Hungersnot gegeben habe. Die Leugnung überdauerte die Stalinzeit. Noch am 28. April 1983 sprach eine
    Pressemitteilung der sowjetischen Botschaft in Kanada von der „sogenannten Hungersnot“, verharmloste deren Schwere
    und erklärte Dürre zum Hauptgrund. Unter Glasnost brach das Tabu schließlich zusammen. Am 26. Januar 1990
    verabschiedete das ZK der KP der Ukraine einen Beschluss, der die Hungersnot offen anerkannte, das mehr als
    fünfzigjährige Verschweigen einräumte und die Veröffentlichung neu freigegebener Parteiakten anordnete.
  consequences:
  - Amtliche diplomatische Leugnung und Verharmlosung von Berichten über massenhaftes Verhungern in der Sowjetukraine
  - Einschränkungen, die unabhängige Berichterstattung ausländischer Korrespondenten aus den Hungergebieten behinderten
  - Langjährige Zensur und Ausschluss der Hungersnot aus der autorisierten sowjetischen Geschichtsdarstellung
  - Archivgeheimhaltung, die interne Dokumentation des Verhungerns von der öffentlichen Darstellung trennte
  - Fortgesetzte sowjetische diplomatische Propaganda zur Verharmlosung der Hungersnot bis in die 1980er Jahre
  - Verzögerter öffentlicher und wissenschaftlicher Zugang in der Sowjetukraine zu den dokumentarischen Belegen der Katastrophe
  summary: >-
    Der sowjetische Staat wusste intern von schwerem Hunger und hoher Sterblichkeit, während seine öffentlichen
    Institutionen eine katastrophale Hungersnot bestritten oder verharmlosten. Außenpolitische Stellen wiesen Berichte
    als falsch zurück, die Bewegungsfreiheit von Journalisten wurde eingeschränkt und das Thema wurde zu einem
    geschichtspolitischen Tabu. Selbst 1983 bestritt sowjetische Botschaftspropaganda noch Ausmaß und politikbedingten
    Charakter der Katastrophe. Im Januar 1990 brach die Kommunistische Partei der Ukraine förmlich mit dieser ererbten
    Doktrin, erkannte die Hungersnot an und räumte ein, dass die sowjetische Historiografie sie mehr als ein halbes
    Jahrhundert verschwiegen hatte.
