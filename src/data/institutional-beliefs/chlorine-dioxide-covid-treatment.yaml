schemaVersion: 2
title: Chlorine dioxide as COVID-19 prevention and treatment
proposition:
  summary: >-
    Chlorine dioxide solution was treated as a medically usable alternative for preventing or treating COVID-19, making
    statutory pharmacy access, public-health supply, official information campaigns and judicially enforceable patient
    access appropriate.
correction:
  summary: >-
    Chlorine dioxide is a reactive oxidizing chemical used for disinfection and industrial purposes. Activity against
    microbes outside the body does not establish a safe or effective systemic treatment. A 2020 systematic review found
    no human studies supporting inhaled, oral or parenteral use against COVID-19, and a later randomized trial of the much
    narrower practice of dilute chlorine-dioxide mouth rinsing found no reduction in salivary SARS-CoV-2 viral titer versus
    water. PAHO advised against oral or parenteral use because efficacy was unproved and serious adverse effects were
    possible; poison-centre data document acute gastrointestinal, electrolyte and other harms after exposure.
category: Medicine and public health
reviewedAt: 2026-09-27
impact:
  summary: >-
    Bolivia's national institutions took conflicting positions. AGEMED and the Ministry of Health said chlorine dioxide
    was not an authorized medicine, lacked evidence against COVID-19 and could cause serious harm. The legislature
    nevertheless promulgated Law 1351, which authorized non-prescription sale and assigned public bodies supply,
    acquisition, free-distribution and information duties. In 2022 the Constitutional Tribunal upheld relief allowing
    outside medical personnel to assess and provide the requested treatment in one hospital case; in 2023 a different
    chamber denied relief in another case on proof and causation grounds. Neither judgment independently validated efficacy.
  highlights:
    - value: Jun–Jul 2020
      label: AGEMED and the Health Ministry rejected the claimed treatment basis before the law was promulgated
    - value: 14 Oct 2020
      label: Law 1351 made chlorine dioxide a legally recognized COVID-19 prevention and alternative-treatment option
    - value: 2022–2023
      label: Constitutional rulings produced different case-specific access outcomes without resolving scientific efficacy
  context:
    - >-
      The Ministry of Health and AGEMED were dissenting public-health institutions in this episode, rather than carriers
      of the disputed medical proposition. Law 1351 nevertheless assigned implementation duties to the ministry and to
      departmental and municipal governments.
    - >-
      Bolivia ended its national COVID-19 health emergency on 31 July 2023. That administrative endpoint did not itself
      repeal Law 1351. No formal legislative repeal was located in the reviewed official record, and a Bolivian legal
      database still labelled the statute in force at the review date.
episodes:
  - id: bolivia-2020-2023
    polity: Bolivia
    region: Latin America
    startYear: 2020
    endYear: 2023
    periodLabel: 2020–2023 COVID-19 emergency period
    strength: policy-basis
    institutionTypes:
      - government
      - court
    institutions:
      - Asamblea Legislativa Plurinacional
      - Tribunal Constitucional Plurinacional
    institutionalContext: >-
      Law 1351 was passed by the legislature and promulgated by its acting president on 14 October 2020 after AGEMED and
      the Health Ministry had already rejected the medical premise. Articles 4 through 10 allowed pharmacy sale without
      prescription, required departmental and municipal governments to guarantee supply in the public-health subsector,
      permitted consented use as prevention or alternative treatment, and assigned information, acquisition and
      free-distribution duties. In SCP 0052/2022-S2, the Constitutional Tribunal reasoned from Articles 5 and 6 when it upheld
      relief requiring a hospital to admit outside specialized medical personnel to assess and provide the requested
      treatment; it did not order the hospital's own clinicians to administer chlorine dioxide or conduct a scientific
      efficacy review. SCP 0052/2023-S4 later denied relief in a different hospital case because the claimant had not
      proved a timely refusal or that the hospital caused the patient's deterioration and death. The second judgment did
      not invalidate Law 1351 or decide that chlorine dioxide was effective.
    consequences:
      - Legal recognition of chlorine dioxide as an alternative COVID-19 prevention and treatment option
      - Statutory duties for public-sector supply, acquisition, free distribution and information campaigns
      - Pharmacy sale without a prescription under the statutory framework
      - Conflict between the statute and the evidence-based position of the national medicines regulator and Health Ministry
      - Constitutional litigation that granted access in one hospital case and denied relief on proof grounds in another
    summary: >-
      Bolivia's medicines regulator and Health Ministry warned in June and July 2020 that chlorine dioxide was not an
      authorized medicine, had no scientific basis as a COVID-19 treatment and posed serious risks. The Asamblea
      Legislativa Plurinacional nevertheless made the proposition operational through Law 1351 in October 2020. The law
      created access and public-supply duties that a 2022 Constitutional Tribunal judgment applied in a hospital case by
      requiring access for outside medical personnel. A 2023 judgment denied a different claim because the alleged refusal
      and causal harm had not been proved, illustrating that the 2022 outcome was case-specific rather than a general
      scientific endorsement. The national health emergency ended in July 2023, but no formal repeal of Law 1351 was
      identified in the reviewed official material.
    mechanism:
      kind: administrative-adoption
      summary: >-
        The legislature converted an unsupported therapeutic proposition into a national statutory framework for sale,
        supply, distribution and public communication; constitutional litigation then made the access provisions
        enforceable in one hospital case.
    institutionalCorrection:
      status: partial
      periodLabel: 2020–2023
      action: >-
        Health agencies rejected the medical premise, a later constitutional judgment denied a separate access claim on
        proof grounds, and the national COVID-19 emergency ended; the legislature did not document a repeal or retraction.
      summary: >-
        Correction was institutionally split rather than a clean reversal. AGEMED and the Health Ministry rejected the
        proposition from the outset, and the 2023 judgment did not repeat the 2022 access result in a factually different
        case. Ending the emergency closed the operational period used for this episode, but it did not expressly repeal the
        statute. The reviewed record therefore supports only a partial correction, not a legislative repudiation of Law 1351.
