term: Double bind
aliases:
- double-bind hypothesis
- double-bind theory
shortDefinition: A historical communication theory proposing that repeated contradictory messages in close relationships
  could contribute causally to schizophrenia.
longDefinition: The double-bind hypothesis proposed that a person, especially a child, could be trapped by recurring
  incompatible messages in which responding to one level of communication violated another and the contradiction could
  not safely be addressed. The idea became influential in family theories of schizophrenia but did not survive as a supported
  causal explanation of the disorder.
relatedTerms:
- schizophrenogenic-mother
reviewedAt: '2026-08-21'
sources:
- title: Family therapy for persons with schizophrenia
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10238333/
  publisher: PubMed Central
  note: Lists double-bind theory among influential historical family-etiology explanations of schizophrenia.
