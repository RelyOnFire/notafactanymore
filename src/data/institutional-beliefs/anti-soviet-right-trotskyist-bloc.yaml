schemaVersion: 2
title: The anti-Soviet Right-Trotskyist Bloc as an espionage-terror conspiracy
proposition:
  summary: >-
    Soviet party, security, prosecutorial and judicial institutions asserted in the 1938 Third Moscow Trial that Nikolai
    Bukharin, Alexei Rykov and their co-defendants formed an anti-Soviet Right-Trotskyist Bloc that committed espionage,
    sabotage, terrorism and treason in concert with foreign intelligence services and sought the overthrow and
    dismemberment of the Soviet state.
correction:
  summary: >-
    Later Soviet reviews found the central conspiracy case against the rehabilitated defendants unsupported. A 1956 KGB
    review called the alleged bloc and organised anti-Soviet activity fabricated. In 1988 the Procurator General and USSR
    Supreme Court found no reliable evidence for foreign-intelligence links, a network of criminal groups, sabotage or
    terrorism in the cases then reviewed. Twenty of the 21 trial defendants were rehabilitated in stages from 1957 through
    1988. The documentary edition identifies Genrikh Yagoda as the exception and states only that no protest against his
    judgment was submitted; it does not establish that his exclusion resulted from separate NKVD crimes.
category: Political repression, show trials and state security
reviewedAt: '2026-09-20'
impact:
  summary: >-
    The Third Moscow Trial turned an alleged political conspiracy into a public judgment during the Great Terror.
    Twenty-one defendants were tried before the Military Collegium of the USSR Supreme Court in March 1938. Eighteen
    received death sentences; Dmitry Pletnev received 25 years, Christian Rakovsky 20 years and Sergei Bessonov 15 years.
    The proceedings were published, press coverage and organised meetings amplified the accusations, and the mandatory
    1938 Short Course incorporated the Moscow-trial narrative into official party history. Ten defendants were rehabilitated
    in separate stages before 1988; the Supreme Court rehabilitated ten more on 4 February 1988.
  highlights:
    - value: '21'
      label: defendants in the Third Moscow Trial
    - value: '18'
      label: defendants sentenced to death on 13 March 1938
    - value: 20 of 21
      label: defendants rehabilitated in stages from 1957 through 1988
  context:
    - >-
      The conspiracy prosecuted in the Third Moscow Trial was distinct from the allegations in the earlier
      Zinoviev-Kamenev and Pyatakov-Radek trials, which involved different defendant groups.
    - >-
      Yagoda's verdict was not part of the 1988 Procurator General's protest. The 2013 documentary edition says this was
      why he remained the sole unrehabilitated trial defendant, but it does not give a reason for the decision not to file
      a protest. His exclusion therefore cannot be presented as a judicial finding about separate NKVD crimes.
    - >-
      The documentary edition is based on RGASPI, GARF and FSB Central Archive holdings. It includes the complete trial
      transcript submitted to the party leadership for editing before publication; the editors identify final, mainly
      substantive corrections made by Stalin.
episodes:
  - id: soviet-union-1938-1988
    polity: Soviet Union
    region: Eurasia
    startYear: 1938
    endYear: 1988
    periodLabel: '1938 trial–1957–1988 staged rehabilitation'
    strength: officially-endorsed
    institutionTypes:
      - government
      - court
    institutions:
      - All-Union Communist Party (Bolsheviks)
      - People's Commissariat for Internal Affairs
      - Procuracy of the USSR
      - Military Collegium of the Supreme Court of the USSR
    institutionalContext: >-
      In March 1938 the Soviet state tried 21 defendants for belonging to an alleged anti-Soviet Right-Trotskyist Bloc.
      Procurator Andrei Vyshinsky and the Military Collegium attributed espionage for foreign powers, wrecking and
      sabotage, terrorist murders and preparations, and plans to assist foreign intervention and partition Soviet territory
      to the group. The Collegium sentenced 18 defendants to death and three to long prison terms. The party-supervised
      publication process and subsequent official history presented the accusations as established fact. Rehabilitation
      proceeded defendant by defendant from 1957 until the Supreme Court cleared ten remaining defendants in 1988.
    consequences:
      - Eighteen defendants were sentenced to death after the public prosecution
      - Pletnev received 25 years' imprisonment, Rakovsky 20 years and Bessonov 15 years
      - Press coverage, workplace readings and meetings circulated the trial's portrait of former leaders as foreign spies, terrorists and saboteurs
      - The 1988 review found that records had been falsified and that threats, deception and violence had produced false statements in the cases it examined
      - The 1938 Short Course made the Moscow-trial narrative part of a mandatory official party history that remained unrevised into the mid-1950s
      - >-
        Twenty defendants were rehabilitated in stages: ten before 1988 and ten by the Supreme Court on 4 February 1988
    summary: >-
      Party, security, prosecutorial and judicial institutions made the alleged foreign-backed bloc an authoritative
      judgment and public narrative. The death sentences and long prison terms rested on a case that later Soviet reviews
      found unsupported and procedurally falsified for the defendants they examined. The correction was also institutional:
      Soviet bodies rehabilitated 20 defendants in separate stages from 1957 through 1988.
    mechanism:
      kind: enforcement
      summary: >-
        The NKVD investigation, Procuracy and Military Collegium converted allegations and self-incriminating statements
        into convictions, while party supervision of the publication and official history disseminated them as fact. The
        1988 protest, which concerned ten defendants, documented missing corroboration, suppressed denials, falsified
        records and statements obtained through threats, deception and violence in the investigation record.
    institutionalCorrection:
      status: corrected
      periodLabel: '1957–1988'
      action: >-
        Soviet judicial bodies rehabilitated ten defendants in individual stages before 1988; on 4 February 1988 the
        Plenum of the USSR Supreme Court vacated the convictions of Bukharin, Rykov and eight others and terminated the
        proceedings against them for absence of a criminal offence.
      summary: >-
        The central bloc case was formally dismantled for 20 defendants over three decades. The 1988 ruling covered ten
        named defendants, not all 20 at once. Yagoda's judgment was outside that protest, and the reviewed sources do not
        establish why no protest was filed for him.
