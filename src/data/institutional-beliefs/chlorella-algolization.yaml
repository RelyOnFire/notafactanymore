      suspension production, packaging, storage, transport, application and monitoring.
  - id: chlorella-gost71946-text-correction
    sourceId: chlorella-gost-71946-text
    relation: documents
    target: {scope: episode, episodeId: russia-2022-2026, aspect: institutional-correction}
    locator: preface, introduction and §4
    note: >-
      Issued after the documented adverse assessments, the dedicated standard continues to state the disputed benefits;
      its acknowledgment of one failed early attempt does not withdraw or qualify those general claims.
  - id: chlorella-wastewater-belief-correction
    sourceId: chlorella-wastewater-review
    relation: contextualizes
    target: {scope: belief, aspect: correction}
    locator: §§1 and 4.1
    note: >-
      The review documents legitimate microalgae and Chlorella research in designed wastewater-treatment systems while
      stressing that results vary widely with culture mode, tank size, wastewater, strain and technical conditions.
  - id: chlorella-wastewater-episode-context
    sourceId: chlorella-wastewater-review
    relation: contextualizes
    target: {scope: episode, episodeId: russia-2022-2026, aspect: context}
    locator: §4, especially §4.1
    note: >-
      Its engineered ponds, suspended cultures, immobilized systems and photobioreactors provide a boundary condition:
      evidence from designed treatment systems cannot simply be transferred to low-dose inoculation of natural reservoirs.
