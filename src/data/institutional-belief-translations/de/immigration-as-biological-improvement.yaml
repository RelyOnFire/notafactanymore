locale: de
entryId: immigration-as-biological-improvement
sourceReviewedAt: '2026-08-23'
title: Einwanderung als biologische Verbesserung
claim: Einwanderer wurden anhand rassischer, erblicher und nationaler Merkmale danach eingestuft, ob sie den biologischen
  und „ethnischen“ Zustand der Nation verbessern oder gefährden würden.
currentUnderstanding: Nationale Herkunft, Ethnizität und gesellschaftlich definierte „Rasse“ bestimmen weder den
  erblichen Wert eines Menschen noch, ob seine Nachkommen ein Land biologisch „verbessern“. Genetische Variation
  teilt Bevölkerungen nicht in höher- und minderwertige nationale Bestände ein; soziale, intellektuelle oder moralische
  Eigenschaften lassen sich nicht mit den eugenischen Kategorien solcher Einwanderungspolitik bewerten.
episodes:
- id: colombia-1922-1940
  polity: Kolumbien
  institutions:
  - Congreso de Colombia
  - Oficina de Información y Propaganda del Ministerio de Agricultura y Comercio
  - Juntas de Inmigración
  - Ministerio de Relaciones Exteriores
  institutionalContext: Die Ley 114 von 1922 übertrug die Einwanderungsverwaltung der Oficina de Información y Propaganda
    im Landwirtschafts- und Handelsministerium, die mit Einwanderungsagenten im Ausland sowie Juntas de Inmigración
    in Häfen, Grenzorten und größeren Städten zusammenarbeitete. Ende der 1930er-Jahre wurden das Außenministerium
    und das kolumbianische Konsularnetz zu zentralen Trägern einer zunehmend restriktiven Visapolitik, die auch
    gegen jüdische Flüchtlinge angewandt wurde.
  summary: Das kolumbianische Einwanderungsgesetz von 1922 verknüpfte Einwanderung ausdrücklich mit der Verbesserung
    der körperlichen und moralischen „ethnischen Bedingungen“ des Landes und schuf einen Verwaltungsapparat zur
    Auswahl und zum Ausschluss von Migranten. In den 1920er- und 1930er-Jahren nutzten Behörden diesen eugenischen
    und rassistischen Rahmen unter anderem gegen afrokaribische Migranten und – im Rahmen einer zunehmend restriktiven
    Visapolitik des Außenministeriums – gegen jüdische Flüchtlinge.
  consequences:
  - Rassische Auswahl von Einwanderern
  - Ausschluss afrokaribischer Migranten
  - Beschränkung jüdischer Flüchtlinge
