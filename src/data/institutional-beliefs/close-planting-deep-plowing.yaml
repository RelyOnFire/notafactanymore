title: Close planting and deep plowing
claim: Very dense planting and unusually deep plowing were treated as broadly applicable techniques that would sharply increase
  agricultural yields.
currentUnderstanding: Planting density and tillage have crop-, soil-, and climate-specific optima. More plants per area or
  deeper tillage do not automatically produce higher yields; excessive density increases competition for light, water, and
  nutrients, while overly deep or poorly matched tillage can damage soil structure and waste labor.
category: Agriculture
reviewedAt: '2026-08-23'
