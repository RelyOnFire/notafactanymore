title: Contaminated clothing, bedding and rooms as carriers of yellow fever
entryId: yellow-fever-spreads-by-contaminated-objects
claim: U.S. Army and military-government health authorities in Cuba treated clothing, bedding, buildings and other
  objects exposed to yellow-fever patients as capable of carrying the disease, making destruction, disinfection and
  fomite-focused quarantine part of yellow-fever control.
currentUnderstanding: 'Yellow fever is transmitted primarily when infected mosquitoes, especially Aedes aegypti, bite
  susceptible people; contaminated bedding, clothing and ordinary personal effects do not transmit the disease. The
  U.S. Army Yellow Fever Commission demonstrated this directly in 1900–1901: volunteers repeatedly slept in close
  contact with heavily contaminated bedding and clothing without contracting yellow fever, while controlled exposure
  to infected mosquitoes transmitted it. The findings validated the mosquito mechanism long advocated by Cuban physician
  Carlos Finlay and redirected control toward preventing mosquito transmission.'
category: Public health, military medicine and infectious disease
reviewedAt: '2026-08-25'
impact:
  summary: The fomite model shaped concrete Army measures during the 1898 occupation of Cuba. Medical recommendations
    called for buildings used by inhabitants and refugees' clothing to be burned, for convalescents' clothing to be
    destroyed, and for infected quarters and effects to be disinfected. Yet yellow fever persisted despite extensive
    cleaning and disinfection. At Camp Lazear, the Army commission then deliberately exposed nonimmune volunteers
    to bedding and clothing thoroughly soiled by yellow-fever patients; none developed the disease. The military government
    progressively replaced the old controls with mosquito exclusion, fumigation aimed at killing mosquitoes and destruction
    of breeding sites. Havana's reported yellow-fever burden fell from about 1,400 cases in 1900 to 37 in 1901 and
    none in 1902 under the new vector-control programme.
  highlights:
  - value: '1898'
    label: Army medical recommendations called for burning buildings and refugees' clothing in Cuba
  - value: '0'
    label: yellow-fever cases among volunteers in repeated Camp Lazear fomite-exposure experiments
    note: The volunteers were deliberately exposed to heavily contaminated bedding and clothing from yellow-fever
      patients.
  - value: 1,400 → 37 → 0
    label: reported Havana yellow-fever cases in 1900, 1901 and 1902 as mosquito-focused control replaced the old
      model
    note: The decline followed a broader mosquito-control programme and should not be attributed to one intervention
      alone.
  context:
  - The correction is specific to yellow-fever transmission by contaminated objects. Cleaning streets, improving water
    and sewerage, isolating infectious patients and disinfecting materials can be valuable for other diseases; the
    Army's broader sanitation programme improved health even though it failed to stop yellow fever.
  - Quarantine was not rendered meaningless by the mosquito discovery. Preventing mosquitoes from biting a viremic
    patient can interrupt transmission. What became unnecessary was treating the patient's bedding, clothing or baggage
    themselves as infectious fomites requiring elaborate disinfection.
  - The Army commission did not originate the mosquito hypothesis. Cuban physician Carlos Finlay had argued for Aedes
    transmission for nearly two decades and supplied mosquito eggs to the commission. The Army's institutional contribution
    was controlled experimental confirmation and rapid translation into sanitary policy.
  - By 1901 the decisive fomite and mosquito experiments had been completed and published, alongside the associated
    policy shift. Operational orders changed during late 1900 and 1901 rather than on a single day.
