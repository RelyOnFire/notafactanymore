evidence:
  - id: close-planting-directive-proposition
    sourceId: close-planting-ccp-1958
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: §§1–2 and 5
    note: >-
      The directive calls deep plowing the central yield-increasing technique and the basis for close planting, prescribes
      repeated national depth targets, and orders a mass campaign to carry them out.
  - id: close-planting-density-correction
    sourceId: close-planting-density-review
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Abstract; §§3.1–3.2 and 8; pp. 1072–1094
    note: >-
      Meta-analysis of 334 experiments across 163 species finds that rising density reduces individual growth and seed
      number; reproductive output per area often has an optimum, and the highest tested density was supra-optimal in 60%
      of experiments reporting generative biomass.
  - id: close-planting-tillage-correction
    sourceId: close-planting-tillage-meta
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Abstract, p. 105; Results, pp. 111–112; Conclusions, p. 115
    note: >-
      Global meta-analysis finds yield responses rose and then fell as tillage became deeper; the optimum varied with
      climate, soil texture, bulk density and management, and the data showed yield reduction beyond 40 cm.
  - id: close-planting-riskin-impact
    sourceId: close-planting-riskin
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: §1.4, p. 29
    note: >-
      Identifies centrally promoted deep plowing and close planting pushed beyond rational limits as output-reducing
      policies, while placing them among numerous natural, political and economic causes of the famine crisis.
  - id: close-planting-history-impact
    sourceId: close-planting-deep-plowing-history
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: Abstract; chapter pp. 74–100
    note: >-
      Historical study describes nationwide mobilization, special implements and scientific advocacy, and concludes that
      overextension or improper execution sometimes reduced soil fertility and failed to meet the movement's objectives.
  - id: close-planting-directive-carrier
    sourceId: close-planting-ccp-1958
    relation: documents
    target: {scope: episode, episodeId: china-1958-1961, aspect: carrier}
    locator: Heading and §§1–2
  - id: close-planting-directive-mechanism
    sourceId: close-planting-ccp-1958
    relation: documents
    target: {scope: episode, episodeId: china-1958-1961, aspect: mechanism}
    locator: §5
    note: >-
      Orders political leadership, mobilization of the whole Party and population, a campaign peak before autumn sowing
      and through winter and spring, unified labor allocation, and improvement of tools.
  - id: close-planting-chan-carrier
    sourceId: close-planting-chan
    relation: supports
    target: {scope: episode, episodeId: china-1958-1961, aspect: carrier}
    locator: Abstract; chapter pp. 109–157
    note: >-
      Institutional history explains the Ministry of Agriculture's enlarged responsibilities and transformation into a
      mobilization agent required to improvise under the center's changing initiatives and production goals in 1958.
  - id: close-planting-history-consequences
    sourceId: close-planting-deep-plowing-history
    relation: supports
    target: {scope: episode, episodeId: china-1958-1961, aspect: consequences}
    locator: Abstract; chapter pp. 74–100
  - id: close-planting-riskin-consequences
    sourceId: close-planting-riskin
    relation: supports
    target: {scope: episode, episodeId: china-1958-1961, aspect: consequences}
    locator: §1.4, p. 29
    note: >-
      Supports a contribution to reduced output while expressly situating the techniques among several other causes; it
      does not provide a technique-specific death toll or national loss estimate.
  - id: close-planting-mao-correction
    sourceId: close-planting-mao-letter
    relation: documents
    target: {scope: episode, episodeId: china-1958-1961, aspect: institutional-correction}
    locator: Second question, paragraphs 1–2
    note: >-
      The 29 April 1959 letter says planting should be neither too sparse nor too close, rejects “the closer the better,”
      prohibits rigid orders from above, and makes suitable density conditional on local agronomic factors.
  - id: close-planting-party-history-correction
    sourceId: close-planting-party-history
    relation: contextualizes
    target: {scope: episode, episodeId: china-1958-1961, aspect: institutional-correction}
    locator: §§3 and conclusion
    note: >-
      Official historical analysis identifies the April letter as an attempt to correct mistaken agricultural practices,
      but says the broader correction campaign was bounded by continuing support for the Great Leap and stopped abruptly
      after the Lushan Conference.
  - id: close-planting-density-context
    sourceId: close-planting-density-review
    relation: contextualizes
    target: {scope: episode, episodeId: china-1958-1961, aspect: context}
    locator: Abstract; §§3.1–3.2 and 8
    note: >-
      Modern evidence explains why a universal density escalation was unsound without implying that all increases in
      planting density are harmful.
  - id: close-planting-tillage-context
    sourceId: close-planting-tillage-meta
    relation: contextualizes
    target: {scope: episode, episodeId: china-1958-1961, aspect: context}
    locator: Abstract, p. 105; Conclusions, p. 115
    note: >-
      Modern evidence supports condition-specific deep tillage for compaction while rejecting a universal rule that
      progressively deeper tillage produces progressively higher yields.
