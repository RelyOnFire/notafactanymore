schemaVersion: 2
title: Hamitic racial hierarchy
proposition:
  summary: >-
    Tutsi were treated as a foreign “Hamitic” race naturally superior to Hutu in intelligence, political ability, and civilization.
correction:
  summary: >-
    The colonial Hamitic hierarchy was scientific racism, not a valid account of human populations. Hutu and Tutsi
    share language, culture, and a deeply intertwined regional history; neither group constitutes a biologically
    superior or inferior race.
category: Race and anthropology
reviewedAt: '2026-08-23'
episodes:
  - id: belgian-rwanda-1920-1959
    polity: Belgian Rwanda
    region: Africa
    startYear: 1920
    endYear: 1959
    strength: policy-basis
    institutionTypes:
      - government
      - education
    institutions:
      - Résidence du Ruanda
      - Vice-Gouvernement général du Ruanda-Urundi
      - Groupe Scolaire d'Astrida
      - Vicariat apostolique du Rwanda
    institutionalContext: >-
      Belgian rule operated Rwanda through the Ruanda residency within the Vice-Government-General of Ruanda-Urundi.
      Catholic missions supplied much of the formal education; the Groupe Scolaire d'Astrida trained future administrative
      elites, while Vicar Apostolic Léon Classe publicly defended the Hamitic hierarchy and influenced colonial
      appointments. The wider identity-card, chiefly, schooling, and administrative system was therefore a network of
      named colonial and church institutions rather than a single generic “colonial administration.”
    consequences:
      - Ethnic classification fixed on official identity cards
      - Preferential access to elite education and administrative office for Tutsi
      - Administrative reorganization around a racialized Hutu–Tutsi hierarchy
    summary: >-
      Belgian rule reinforced a racialized hierarchy portraying Tutsi as foreign, more intelligent, and naturally suited
      to rule. The belief was embedded through the Ruanda residency, the Ruanda-Urundi colonial administration, Catholic
      educational institutions, and elite training at Astrida; official identity documents and administrative practice
      made Hutu, Tutsi, and Twa categories increasingly rigid.
    mechanism:
      kind: classification
      summary: >-
        Colonial and church institutions embedded the Hamitic hierarchy through identity classification, preferential
        education and administrative selection, converting a racial theory into routine governance and elite formation.
    institutionalCorrection:
      status: undocumented
      summary: >-
        Belgian political alignments and the colonial order changed sharply from 1959 onward, but the existing record
        does not identify a dated colonial or church institutional act formally repudiating the Hamitic racial theory itself.
