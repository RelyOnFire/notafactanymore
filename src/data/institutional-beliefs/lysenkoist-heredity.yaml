  - university
  institutions:
  - Chinese Academy of Sciences
  - Ministry of Higher Education of the People’s Republic of China
  consequences:
  - Classical genetics was displaced in research and higher education
  - Scientific careers and curricula were shaped by political orthodoxy
  - Lysenko-influenced agronomic ideas later entered Great Leap Forward agricultural campaigns
  summary: In the early People's Republic, Soviet scientific organization was copied and classical genetics was
    displaced by Lysenkoist biology. The 1956 Qingdao genetics meeting marked official rehabilitation of Mendelian
    genetics, although political pressure on scientists did not disappear.
  sources:
  - title: China's Long History of Biotechnology
    url: https://www.ncbi.nlm.nih.gov/books/NBK236111/
    publisher: National Academies / NCBI Bookshelf
    note: Describes China's post-1949 Soviet scientific model and the abandonment of classical genetics in favor
      of Lysenkoism.
  - title: Lysenkoism Against Genetics
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6499510/
    publisher: Genetics
    note: Reviews the international spread of Lysenkoism and states that genetics was officially rehabilitated in
      China in 1956.
  - title: Biology and Revolution in Twentieth-Century China
    url: https://www.bloomsbury.com/uk/biology-and-revolution-in-twentiethcentury-china-9780742553064/
    publisher: Rowman & Littlefield / Bloomsbury
    note: Historical monograph based on archival material and interviews that traces state-sponsored Lysenkoism
      in China and connects its history to the Great Leap Forward.
  - title: The long-term health and economic consequences of the 1959–1961 famine in China
    url: https://www.sciencedirect.com/science/article/pii/S016762960600141X
    publisher: Journal of Health Economics
    note: Gives an estimated range of about 15–30 million excess deaths for the Great Chinese Famine and emphasizes
      that the famine arose from multiple interacting factors.
  - title: The Great Leap Forward — Anatomy of a Central Planning Disaster
    url: https://www3.nd.edu/~nmark/ChinaCourse/TheWeeks/Li_Yang_GLF_JPE.pdf
    publisher: Journal of Political Economy
    note: Models how optimistic productivity expectations, diversion of agricultural labor, and increased grain
      procurement interacted with falling output to produce a collapse in food consumption.
  - title: Grain exports and the causes of China's Great Famine, 1959–1961 — County-level evidence
    url: https://www.sciencedirect.com/science/article/pii/S0304387820300882
    publisher: Journal of Development Economics
    note: Finds that falling agricultural production, increased procurement, grain exports, and increasingly rigid
      procurement jointly raised excess mortality; no single factor explains the famine as a whole.
