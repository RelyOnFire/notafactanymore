schemaVersion: 2
title: Liu Shaoqi as a “renegade, traitor and scab”
proposition:
  summary: >-
    On 31 October 1968 the enlarged Twelfth Plenum of the Chinese Communist Party's Eighth Central Committee formally
    approved a Central Case Examination Group report that labelled Liu Shaoqi a “renegade, traitor and scab,” expelled
    him from the Party permanently and resolved to dismiss him from every post inside and outside the Party. The political
    report to the Party's Ninth National Congress in April 1969 repeated the accusations and portrayed Liu as the head of
    an underground bourgeois headquarters whose supposed agents held important party and government posts.
correction:
  summary: >-
    On 29 February 1980 the Party's Eleventh Central Committee formally reversed the case. Its Fifth Plenum called the
    alleged counterrevolutionary line and bourgeois headquarters an entirely wrong and groundless inference, said false
    evidence had been concocted and many party, government and military leaders falsely branded Liu's agents, removed the
    three labels, cancelled the 1968 resolution and investigation report, restored Liu's name and ordered related cases
    redressed. The Party's 1981 historical resolution added that the alleged headquarters did not exist and that both the
    1968 political conclusion and disciplinary measure were utterly wrong.
category: Political repression, Cultural Revolution and party-state propaganda
reviewedAt: '2026-09-24'
impact:
  summary: >-
    The accusations became an authoritative Party judgment, not merely a slogan used by one faction. The October 1968
    plenum approved the case report against Liu, then chairman of the People's Republic of China, and announced his
    permanent expulsion and dismissal. The April 1969 Ninth Congress report carried the alleged conspiracy into the
    Party's next national congress. Liu remained confined, was transferred while seriously ill to Kaifeng in October 1969
    and died there on 12 November. In 1980 the Fifth Plenum cancelled the case and directed departments to redress the
    false and wrongful cases that had arisen from it.
  highlights:
    - value: 31 Oct 1968
      label: date the Central Committee plenum adopted the case report and announced Liu's expulsion
    - value: 12 Nov 1969
      label: date Liu died while confined in Kaifeng
    - value: 29 Feb 1980
      label: date the same ruling party formally rehabilitated Liu and cancelled the 1968 case
  context:
    - >-
      The Chinese labels were 叛徒、内奸、工贼. The Party's official English editions rendered them “renegade, traitor
      and scab” in 1980 and “renegade, hidden traitor and scab” in 1981. They are reproduced here as historical
      accusations, not descriptions accepted as fact.
    - >-
      The Fifth Plenum called the case the biggest frame-up in the Party's history. That is the correcting institution's
      own characterization, not a comparative ranking independently established by the academic sources.
    - >-
      The 1980 communiqué placed principal blame on Lin Biao, the Gang of Four and their associates. The 1981 historical
      resolution also said Mao initiated and led the Cultural Revolution and expressly acknowledged that the Central
      Committee plenum itself had reached the wrongful conclusion.
    - >-
      Rehabilitation was a Party re-examination and resolution rather than a court acquittal. It reversed the alleged
      treachery, secret-agent network and fabricated biographical case; it did not declare every policy or action in Liu's
      career beyond historical criticism.
episodes:
  - id: china-1968-1980
    polity: People's Republic of China
    region: East Asia
    startYear: 1968
    endYear: 1980
    periodLabel: 1968 formal condemnation–1980 rehabilitation
    strength: enforced-doctrine
    institutionTypes:
      - government
    institutions:
      - Chinese Communist Party Central Committee
      - Central Case Examination Group
      - Ninth National Congress of the Chinese Communist Party
    institutionalContext: >-
      Liu had been a CCP vice-chairman and chairman of the People's Republic of China. On 31 October 1968 the enlarged
      Twelfth Plenum approved the Central Case Examination Group report, imposed the three labels and announced permanent
      expulsion and dismissal from all posts. The Ninth Congress political report repeated the conspiracy account in
      April 1969. After an almost year-long Central Commission for Discipline Inspection review, the Fifth Plenum on 29
      February 1980 unanimously adopted a rehabilitation resolution, cancelled the charges, disciplinary resolution and
      original report, and assigned related cases to the responsible departments for redress.
    consequences:
      - Permanent expulsion from the Communist Party and a Central Committee resolution dismissing Liu from every post inside and outside the Party
      - Reaffirmation at the April 1969 Ninth Party Congress of the alleged gang and underground bourgeois headquarters
      - Overthrow and persecution of many leading party, government and military cadres falsely labelled as Liu's agents
      - Confinement and physical persecution of Liu, followed by his death while confined in Kaifeng on 12 November 1969
      - Post-1980 review and redress of false and wrongful cases arising from association with Liu's case
    summary: >-
      A case group assembled the accusation, the Central Committee converted it into a formal Party judgment and the
      Ninth Congress repeated it as established history. The Party's 1980 and 1981 resolutions later rejected the alleged
      headquarters and treachery case, cancelled the sanction and ordered associated cases corrected.
    mechanism:
      kind: enforcement
      summary: >-
        The case group turned coerced statements, fabricated evidence and selectively withheld testimony into an
        investigation report. The Central Committee ratified that report and imposed organizational sanctions; the Ninth
        Congress then renewed the story in its political report. These acts joined investigation, discipline and national
        Party propaganda in a single institutional process.
    institutionalCorrection:
      status: corrected
      periodLabel: 29 February 1980; reaffirmed in June 1981
      action: >-
        The Fifth Plenum removed the three labels, cancelled the 1968 disciplinary resolution and investigation report,
        restored Liu's reputation and directed departments to redress related cases.
      summary: >-
        The same ruling party formally repudiated its earlier factual and disciplinary conclusions. Its 1981 historical
        resolution reaffirmed that the alleged bourgeois headquarters did not exist and that the 1968 conclusion and
        sanction were utterly wrong.
