    strength: officially-endorsed
    institutionTypes: [government, education]
    institutions:
      - National Bureau of Standards (NBS)
      - National Fire Academy
    institutionalContext: >-
      NBS Handbook 134 was a federal reference work for beginning and experienced fire investigators, and National Fire Academy personnel advised its preparation. The handbook did not create a binding nationwide investigative rule, but its federal imprimatur helped circulate pattern interpretations through fire-investigation texts and training. The first edition of NFPA 921 in 1992 marked the major consensus correction by explicitly challenging unsupported pattern interpretations and anchoring fire investigation more firmly in the scientific method.
    consequences:
      - Visual burn patterns were used to infer unusually rapid or hot fires and possible accelerant use
      - Fire-origin and cause determinations could classify accidental fires as incendiary on weak pattern evidence
      - Pattern interpretations entered investigative reports and expert testimony in criminal and insurance proceedings
    summary: >-
      The 1980 National Bureau of Standards Fire Investigation Handbook presented visual features such as shiny alligatoring, crazed glass, and narrow V-patterns as indicators of unusually rapid or hot fire development. In professional practice these descriptions were often interpreted as evidence of flammable-liquid acceleration, even though an earlier federal survey had warned that many traditional “burn indicators” lacked scientific validation. During the following decade the interpretations spread through training and textbooks. NFPA 921, first issued in 1992, rejected many of these supposed indicators as unsupported misconceptions and promoted a systematic scientific-method approach to origin-and-cause investigation.
    mechanism:
      kind: publication
      summary: >-
        The National Bureau of Standards published Handbook 134 as a federal reference, with National Fire Academy personnel advising its preparation, and the resulting institutional authority circulated visual-pattern interpretations through investigative references and training.
    institutionalCorrection:
      status: corrected
      periodLabel: From 1992
      summary: >-
        NFPA 921 established scientific-method and hypothesis-testing guidance for fire investigation and rejected unsupported reliance on isolated visual patterns as proof of accelerant use or arson.
