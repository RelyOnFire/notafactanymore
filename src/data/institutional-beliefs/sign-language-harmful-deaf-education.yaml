title: Sign language as harmful to deaf education
claim: >-
  Sign language was treated as harmful to deaf children's speech, lip-reading and intellectual development, making
  pure oral instruction the institutionally preferred method of deaf education.
currentUnderstanding: >-
  Natural sign languages are full human languages and can provide deaf children with fully accessible linguistic input.
  When accessible from infancy, they are acquired on the same broad developmental timetable as spoken languages.
  Evidence does not support the claim that exposure to a sign language inherently damages spoken-language acquisition;
  delaying access to an accessible first language can instead produce language deprivation. Educational and
  communication approaches should be matched to the individual child rather than imposing a single modality.
category: Education and language
reviewedAt: '2026-08-24'
impact:
  summary: >-
    The 1880 Milan Congress gave international professional authority to pure oral education by declaring articulation
    superior to signs and simultaneous signing harmful to speech, lip-reading and precision of ideas. The resolutions
    were influential across deaf-education systems and contributed to the exclusion and devaluation of sign languages
    and deaf teachers. In 2010 the International Congress on the Education of the Deaf formally rejected the Milan resolutions.
  highlights:
  - value: 160–4
    label: Vote for the 1880 resolution declaring articulation superior to signs
  - value: 150–16
    label: Vote for the resolution preferring pure oralism over simultaneous speech and signs
  - value: 130 years
    label: Time between the Milan resolutions and their formal ICED repudiation in 2010
  context:
  - >-
    The Milan Congress did not itself enact a worldwide legal ban on sign language. Its importance was professional
    and institutional: its resolutions supplied international authority for oralist policies subsequently adopted
    across many deaf-education systems.
  - >-
    The 2010 endpoint marks ICED's formal repudiation of its nineteenth-century resolutions, not the date oralism
    disappeared from every school or the date sign language became universally available.
  - >-
    The correction is not that speech, hearing technology or oral instruction are inherently harmful. The rejected
    proposition is that sign language itself impedes deaf children's linguistic or intellectual development and
    should therefore be systematically excluded.
episodes:
- id: international-1880-2010
  polity: International — International Congress on the Education of the Deaf
  region: Global
  startYear: 1880
  endYear: 2010
  strength: officially-endorsed
  institutionTypes:
  - professional
  - education
  institutions:
  - International Congress on the Education of the Deaf (ICED)
  institutionalContext: >-
    At Milan in September 1880, an international congress of educators adopted resolutions declaring the
    “incontestable superiority” of articulation over signs and arguing that simultaneous speech and signs injured
    articulation, lip-reading and precision of ideas. The congress therefore preferred the pure oral method.
    Those resolutions did not possess legislative force by themselves, but they became an influential professional
    reference point for deaf-education institutions internationally. At the 2010 ICED in Vancouver, the congress
    formally rejected the Milan resolutions and acknowledged their detrimental effects.
  consequences:
  - International professional endorsement of pure oral instruction
  - Exclusion or devaluation of sign languages in many deaf-education programs
  - Exclusion or marginalization of deaf teachers in systems organized around oralism
  - Reduced access to fully accessible language for children who could not adequately access spoken instruction
  summary: >-
    In September 1880 the Milan Congress declared articulation superior to signs and said combining speech with signs
    injured articulation, lip-reading and precision of ideas. Its resolutions gave international professional
    authority to pure oral education and were subsequently influential across deaf-education systems. In 2010 the
    21st International Congress on the Education of the Deaf formally rejected the Milan resolutions, acknowledged
    their detrimental effects and called for respect for all languages and forms of communication.
