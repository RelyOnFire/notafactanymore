evidence:
  - id: steam-april-speech-proposition
    sourceId: steam-magufuli-speech
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: full one-page transcript and English translation
    note: >-
      Records Magufuli's 22 April 2020 statement that steam above 100°C would break apart coronavirus because it was
      fatty, his description of steaming as a scientific treatment and his request that the Health Ministry emphasize
      and explain it to Tanzanians.
  - id: steam-presidency-proposition
    sourceId: steam-tanzania-presidency
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: 17 May 2020 release, paragraph beginning “Hata mimi mtoto wangu”
    note: >-
      The official State House release quotes Magufuli saying his son had COVID-19 and recovered while using lemon,
      ginger and steam inhalation. It documents presidential endorsement, not which part of a combined regimen caused
      recovery.
  - id: steam-health-proposition
    sourceId: steam-tanzania-health-2020
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: 31 August 2020 item, paragraphs quoting Dr Grace Magembe
    note: >-
      The ministry's Director of Medical Services said traditional remedies had substantially carried Tanzania through
      the coronavirus outbreak and described major success among users including people who practised nyungu.
  - id: steam-minister-2021-proposition
    sourceId: steam-health-minister-2021
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: paragraphs reporting Health Minister Dorothy Gwajima's 1 February 2021 press conference
    note: >-
      Reports the Health Minister listing herbal steaming and traditional medicines among ways citizens should protect
      themselves from coronavirus while saying the ministry had no current plan to procure COVID-19 vaccine.
  - id: steam-review-correction
    sourceId: steam-review-2022
    relation: contextualizes
    target: {scope: belief, aspect: correction}
    locator: abstract; sections 3.4, 4, 6 and 8
    note: >-
      This favorably framed narrative review still says no study had established the in-vivo temperature, humidity and
      exposure needed to deactivate SARS-CoV-2 and calls the intervention theoretical pending large randomized trials.
      Its clinical section relies on small uncontrolled studies, while its safety section records scald and airway risks.
  - id: steam-systematic-review-correction
    sourceId: steam-covid-systematic-review
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: abstract and conclusion; PMID 37426512
    note: >-
      The review found only three eligible studies and concluded that there was too little evidence to determine a role
      in COVID-19 treatment and insufficient evidence for prevention, despite reports of symptom relief.
  - id: steam-cochrane-correction
    sourceId: steam-cochrane-common-cold
    relation: contextualizes
    target: {scope: belief, aspect: correction}
    locator: abstract, main results and authors' conclusions; PMID 28849871
    note: >-
      Six trials involving 387 participants with common colds produced inconsistent low-quality symptom findings and no
      significant reduction in viral shedding. Even evidence for a different, milder viral illness did not validate an
      antiviral effect, and the review did not study COVID-19.
  - id: steam-burns-correction
    sourceId: steam-burns-lancet
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: full correspondence, Lancet 395 (2020), p. 1690; PMID 32422125
    note: >-
      The Birmingham Children's Hospital burns centre reported a 30-fold increase in scalds directly caused by steam
      inhalation after lockdown began. This is a one-centre hazard signal, not an estimate of Tanzanian injuries.
  - id: steam-health-impact
    sourceId: steam-tanzania-health-2020
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: 31 August 2020 item, final paragraphs before the acting registrar's statement
    note: >-
      The ministry article gives the awkward approximate figure “more than 100,018” for traditional-remedy users and
      includes nyungu among the methods. It supplies no case definition, denominator, comparison group or measured
      endpoint, so it documents reach and an official success claim rather than effectiveness.
  - id: steam-campaign-impact
    sourceId: steam-nyungu-week
    relation: documents
    target: {scope: belief, aspect: impact}
    locator: entire 30 January 2021 report and embedded statement by TAMISEMI minister Selemani Jafo
    note: >-
      Documents the minister's announcement that a third “season” of nyungu, fruit consumption and prayer would run from
      1 to 7 February, with Tanzanians expected to keep working rather than isolate.
  - id: steam-access-impact
    sourceId: steam-tanzania-health-2021
    relation: documents
    target: {scope: belief, aspect: impact}
    locator: paragraphs 1–14 of the 6 February 2021 item
    note: >-
      Describes plans to make accepted traditional medicines available through health facilities and pharmacies. The
      cited checks concerned safety and human-use criteria; the article reports no controlled proof of COVID-19 efficacy.
  - id: steam-vaccine-impact
    sourceId: steam-vaccine-arrival
    relation: documents
    target: {scope: belief, aspect: impact}
    locator: opening text and captions for the 24 July 2021 shipment
    note: >-
      Records arrival of 1,058,450 Janssen doses through COVAX and the planned priority groups, supplying concrete
      evidence that the succeeding government's vaccine policy moved beyond committee recommendations.
  - id: steam-presidency-carrier
    sourceId: steam-tanzania-presidency
    relation: documents
    target: {scope: episode, episodeId: tanzania-2020-2021, aspect: carrier}
    locator: heading, signature block and paragraph beginning “Hata mimi mtoto wangu”
    note: >-
      Identifies the Office of Presidential Communications as publisher of Magufuli's recovery anecdote and therefore as
      an institutional carrier rather than merely a venue reporting an unofficial remark.
  - id: steam-speech-carrier
    sourceId: steam-magufuli-speech
    relation: documents
    target: {scope: episode, episodeId: tanzania-2020-2021, aspect: carrier}
    locator: full one-page transcript and English translation
    note: >-
      The nationally delivered presidential statement expressly tasked the Health Ministry with emphasizing and
      explaining steam inhalation, linking the head of state to subsequent administrative messaging.
  - id: steam-health-carrier
    sourceId: steam-tanzania-health-2020
    relation: documents
    target: {scope: episode, episodeId: tanzania-2020-2021, aspect: carrier}
    locator: heading and statements attributed to ministry officials on 31 August 2020
    note: >-
      Names the ministry's permanent secretary, Director of Medical Services and Traditional and Alternative Health
      Practice Council as officials promoting registration, research and use of traditional remedies.
  - id: steam-campaign-carrier
    sourceId: steam-nyungu-week
    relation: documents
    target: {scope: episode, episodeId: tanzania-2020-2021, aspect: carrier}
    locator: opening paragraph and quoted statement
    note: >-
      Identifies TAMISEMI minister Selemani Jafo as the official announcing the February 2021 national campaign week in
