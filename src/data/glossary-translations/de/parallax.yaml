entryId: parallax
sourceReviewedAt: '2026-08-21'
term: Parallaxe
aliases:
- Parallaxenmessung
- parallaktische Verschiebung
shortDefinition: Die scheinbare Verschiebung eines Objekts vor einem weiter entfernten Hintergrund, wenn es von verschiedenen
  Orten aus betrachtet wird.
longDefinition: Parallaxe ist ein geometrischer Effekt durch einen Wechsel des Beobachtungsstandorts. Nahe Objekte scheinen
  sich gegenüber einem fernen Hintergrund stärker zu verschieben als weit entfernte. Deshalb kann Parallaxe zur Entfernungsbestimmung
  dienen. Dass Tycho Brahe beim Großen Kometen von 1577 nicht die für ein nahes atmosphärisches Objekt erwartete große
  Parallaxe fand, half, den Kometen jenseits des Mondes einzuordnen.
