term: Graphene
aliases: []
shortDefinition: A two-dimensional material consisting of a single atomic layer of carbon arranged in a hexagonal lattice.
longDefinition: Graphene is a one-atom-thick sheet of carbon atoms bonded in a honeycomb-like hexagonal lattice. It is
  the structural building block underlying graphite and can exist as a free-standing or supported two-dimensional crystal.
  Its unusual electronic, mechanical, and thermal properties helped launch the modern field of atomically thin materials.
