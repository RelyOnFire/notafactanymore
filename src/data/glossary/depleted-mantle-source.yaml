term: Depleted mantle source
aliases:
- depleted mantle
- chemically depleted mantle source
shortDefinition: A mantle reservoir that has lost some elements during earlier melting and crust formation, leaving it
  relatively poor in those easily extracted components.
longDefinition: In geochemistry, a depleted mantle source is a mantle reservoir from which previous melting removed part
  of the elements that preferentially enter melts. Its later magmas therefore carry characteristic elemental and isotopic
  signatures. Chang'e-5 basalts were traced to a depleted lunar mantle source with little evidence for a KREEP component.
relatedTerms:
- kreep
- procellarum-kreep-terrane
reviewedAt: '2026-08-21'
sources:
- title: A dry lunar mantle reservoir for young mare basalts of Chang’e-5
  url: https://doi.org/10.1038/s41586-021-04107-9
  publisher: Nature
  note: Characterizes the Chang'e-5 basalt source as a depleted lunar mantle reservoir without a substantial KREEP contribution.
