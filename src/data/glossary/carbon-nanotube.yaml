term: Carbon nanotube
aliases:
- carbon nanotubes
- nanotube
- nanotubes
shortDefinition: A nanoscale cylindrical structure made from a sheet-like network of carbon atoms.
longDefinition: Carbon nanotubes are tube-shaped carbon allotropes with walls built from a graphene-like hexagonal
  carbon network. Their geometry gives them mechanical, electrical, and thermal properties very different from bulk
  graphite or diamond.
relatedTerms:
- fullerene
reviewedAt: '2026-08-21'
sources:
- title: Broad Family of Carbon Nanoallotropes
  url: https://pubs.acs.org/doi/10.1021/cr500304f
  publisher: American Chemical Society
  note: Reviews carbon nanotubes alongside fullerenes, graphene, and other carbon nanoallotropes.
