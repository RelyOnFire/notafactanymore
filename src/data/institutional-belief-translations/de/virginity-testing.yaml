- id: virginity-georgia-mechanism
  note: >-
    Georgiens Staatsbericht von 2025 beschreibt den Leistungsrahmen nach Beschluss 14 vom 16. Januar 2023 einschließlich
    Hymenintegrität, Verletzungsalter und Fragen innerhalb der Sachverständigenkompetenz. Er beschreibt auch Einwilligung
    und Schutzvorkehrungen. Das ist späterer Verfahrenskontext; die aufgeführte Verletzungsuntersuchung belegt
    für sich allein keine Methode zum Nachweis früheren Geschlechtsverkehrs oder fortgesetzte Jungfräulichkeitstests.
- id: virginity-georgia-consequences
  note: >-
    Die Abschnitte 3.5–3.6 beschreiben eingreifende oder wiederholte Untersuchungen, auf den Hymenzustand beschränkte
    Fragen, die Verwendung vermeintlicher Penetrationszeichen sowie Risiken sekundärer Viktimisierung oder verzerrter
    Fallbewertung. Diese Feststellungen betreffen die geprüften Fälle und sind nicht auf jede gerichtsmedizinische
    Verletzungsuntersuchung zu verallgemeinern.
- id: virginity-georgia-context
  note: >-
    Die Mitteilung des Büros vom 26. Oktober 2021 beschreibt eine Fortbildung vom 21.–26. Oktober mit Ombudsstelle
    und Europarat zur gerichtsmedizinischen Untersuchung Betroffener sexueller Gewalt, zu Rechten, psychischen
    Bedürfnissen und zur Vermeidung sekundärer Viktimisierung. Sie belegt institutionelle Teilnahme an Fortbildung.
    Ein Verbot von Jungfräulichkeitstests oder eine ausdrückliche Aufgabe der Schlussfolgerung auf die Sexualgeschichte
    wird nicht verkündet.
- id: virginity-georgia-ongoing
  note: >-
    Die Verfahrensbeschreibung von 2025 belegt keine laufende Korrektur. Dass sie Hymen- oder Verletzungsbewertungen
    enthält, beweist für sich genommen ebenso wenig die fortgesetzte Verwendung der ungültigen Schlussfolgerung.
    Sie bleibt als späterer Kontext neben den früheren Fallbelegen und der Fortbildungsmitteilung des Büros erhalten.
- id: virginity-tajikistan-carrier
  note: >-
    Die UN-Länderanalyse beschreibt verpflichtende voreheliche medizinische Untersuchungen nach Änderungen des
    Familiengesetzbuchs von 2016 und berichtet, dass manche für Jungfräulichkeitstests genutzt wurden. Sie wiederholt
    ältere Berichte über jährlich rund 600 Untersuchungen im National Centre of forensic examination; die zugrunde
    liegenden Verweise stehen in den Anmerkungen 292–294. Das ist eine zugeschriebene historische Zahl, keine
    neue Zählung für 2024 oder 2026. Die medizinische Untersuchungspflicht belegt für sich allein keine gesetzliche
    Pflicht zum Jungfräulichkeitstest.
- id: virginity-tajikistan-mechanism
  note: >-
    Beschreibt berichtete Jungfräulichkeitstests bei vorehelichen Untersuchungen und Untersuchungstätigkeit im
    staatlichen Forensikzentrum. Die medizinische Untersuchungspflicht wird von berichteten Tests unterschieden.
    Das gesonderte CEDAW-Protokoll liefert die ausdrückliche Erklärung von 2024 zur fortbestehenden Befugnis in
    Strafverfahren.
- id: virginity-tajikistan-consequences
  note: >-
    Die Analyse stützt berichtete Untersuchungen und den sozial folgenreichen Kontext vorehelicher Tests; ihre
    Jahreszahl wird älteren Berichten zugeschrieben. Sie liefert keine einzelnen rechtlichen Verfahrensausgänge
    und misst nicht jeden psychischen oder familiären Schaden. Allgemeine Schadensrisiken erläutert gesondert
    die WHO; sie werden hier als mögliche Folgen bezeichnet.
- id: virginity-tajikistan-partial-correction
  note: >-
    Im amtlichen Kurzprotokoll der Sitzung vom 31. Januar 2024 erklärt Tadschikistans Delegation, Jungfräulichkeitstests
    seien in medizinischen Einrichtungen verboten; Behörden wie das National Centre of Forensic Medicine dürften
    solche Untersuchungen jedoch in Strafverfahren durchführen. Die Erklärung stützt eine berichtete Einschränkung
    bei fortbestehender forensischer Ausnahme. Sie nennt weder das ursprüngliche Erlassdatum des Verbots noch
    belegt sie eine landesweite Durchsetzung.
- id: virginity-turkey-who-context
  note: >-
