locale: de
entryId: iraq-active-wmd-programs
sourceReviewedAt: '2026-08-25'
title: Irak als Staat mit aktiven Massenvernichtungswaffen und -programmen
claim: US-Nachrichtendienste kamen 2002 zu dem Schluss, der Irak verfüge über chemische und biologische Waffen und
  baue sein Kernwaffenprogramm wieder auf. Exekutive und Kongress behandelten diese Einschätzungen als Teil der
  Tatsachengrundlage für erzwungene Abrüstung und die Ermächtigung zum Einsatz militärischer Gewalt gegen den Irak.
currentUnderstanding: 'Die Untersuchungen nach dem Krieg ergaben, dass die zentralen WMD-Einschätzungen von 2002
  falsch waren. Die Iraq Survey Group fand keine Belege dafür, dass der Irak nach 1991 eine Fähigkeit zur Herstellung
  von Kernwaffen wieder aufgebaut hatte, keine Bestände biologischer Kampfstoffe oder mobilen Produktionsanlagen
  dafür und weder erhebliche Chemiewaffenbestände noch glaubhafte Hinweise auf eine wiederaufgenommene Chemiewaffenproduktion.
  Der Irak hatte früher tatsächlich Chemiewaffen besessen und eingesetzt, verfügte weiterhin über einschlägiges
  Fachwissen und Absichten und verletzte einzelne Raketenbeschränkungen. Amtliche Nachprüfungen unterschieden zugleich
  zwischen der Erstellung der Nachrichtendienstanalyse und ihrer politischen Darstellung: Sie fanden nicht, dass
  die Intelligence Community ihre WMD-Urteile insgesamt auf politischen Druck hin wissentlich erfunden hatte; eine
  spätere Senatsuntersuchung stellte jedoch fest, dass führende Regierungsvertreter manche Aussagen kategorischer
  darstellten als es die Nachrichtendienstlage rechtfertigte und teils Behauptungen äußerten, die nicht gestützt
  oder sogar durch vorliegende Erkenntnisse widersprochen wurden.'
impact:
  summary: 'Die WMD-Einschätzungen durchliefen die gesamte Maschinerie der nationalen Sicherheitspolitik. Das National
    Intelligence Estimate vom Oktober 2002 urteilte, der Irak besitze chemische und biologische Waffen und habe
    nach Auffassung der meisten Behörden sein Kernwaffenprogramm wieder aufgenommen. Der Kongress verabschiedete
    anschließend Public Law 107-243, dessen Feststellungen dem Irak weiterhin erhebliche chemische und biologische
    Fähigkeiten sowie das aktive Streben nach einer nuklearen Fähigkeit zuschrieben. Die Resolution ermächtigte
    den Präsidenten zum Einsatz der US-Streitkräfte gegen den Irak. Nach der Invasion bestätigte die Iraq Survey
    Group die zentralen Bestands- und Programmaussagen nicht. Amtliche Untersuchungen identifizierten sowohl ein
    schweres Versagen der Nachrichtendienste als auch ein davon getrenntes Problem der öffentlichen Darstellung:
    Manche Äußerungen führender Regierungsvertreter übertrieben die Gewissheit oder gingen über das hinaus, was
    die vorhandenen Erkenntnisse stützten.'
  highlights:
  - value: 100–500 Tonnen
    label: im NIE von 2002 geschätzter Bestand chemischer Kampfstoffe; die Nachkriegsuntersuchung fand keinen solchen
      aktiven Bestand
    note: Später wurden einzelne alte und stark degradierte chemische Kampfmittel aus früheren irakischen Programmen
      geborgen. Sie entsprachen nicht dem vor dem Krieg angenommenen aktiven Bestand von 100–500 Tonnen.
  - value: 77–23
    label: Abstimmung im US-Senat für die Ermächtigung zum Einsatz militärischer Gewalt gegen den Irak
  - value: 296–133
    label: Abstimmung im US-Repräsentantenhaus für die Ermächtigung zum Einsatz militärischer Gewalt gegen den Irak
  context:
  - Die frühere irakische Waffengeschichte war real. Der Irak hatte Chemiewaffen hergestellt und eingesetzt, ein
    offensives Biowaffenprogramm betrieben und vor 1991 Kernwaffen angestrebt. Hinzu kamen irakische Verschleierung
    und unvollständige Erklärungen. Der institutionelle Irrtum betraf die für 2002 angenommenen aktiven Bestände
    und neu aufgebauten Programme, nicht die gesamte historische WMD-Bilanz des Irak.
  - Die Nachkriegsuntersuchungen unterschieden zwischen der Entstehung der Nachrichtendiensturteile und ihrer politischen
    Darstellung. Der Geheimdienstausschuss des Senats 2004 und die WMD-Kommission 2005 fanden keinen Beleg dafür,
    dass politische Entscheidungsträger Analysten dazu gedrängt hatten, ihre WMD-Urteile zu verändern; die Fachleute
    berichteten im Wesentlichen Schlussfolgerungen, die sie selbst für richtig hielten. Zugleich dokumentierten
    diese Untersuchungen schwere Fehler bei Quellenprüfung, Analyse, Führung und Umgang mit abweichenden Einschätzungen,
    darunter die Nutzung erfundener oder unzuverlässiger Quellenberichte. Eine gesonderte Senatsuntersuchung von
    2008 stellte fest, dass führende Regierungsvertreter manche Behauptungen kategorischer präsentierten als es
    die Nachrichtendienstlage rechtfertigte und mehrere öffentliche Aussagen nicht gestützt oder durch vorhandene
    Erkenntnisse sogar widersprochen wurden. Die Belege tragen daher weder die Darstellung eines insgesamt wissentlich
    erfundenen Produkts der Intelligence Community noch die Vorstellung, die öffentliche Argumentation der Regierung
    habe lediglich neutral die Nachrichtendienstlage wiedergegeben.
  - Massenvernichtungswaffen waren weder in Public Law 107-243 noch in der umfassenderen Kriegsbegründung das einzige
    Argument. Falsche WMD-Einschätzungen wurden dennoch ausdrücklich Teil der gesetzlichen und exekutiven Politikgrundlage
    für die Invasion.
episodes:
- id: united-states-2002-2005
  polity: Vereinigte Staaten
  institutions:
