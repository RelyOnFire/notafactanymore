schemaVersion: 2
title: Anthropometric measurements as reliable criminal identification
proposition:
  summary: >-
    Police systems treated standardized adult body measurements as stable and discriminating enough to serve as a
    primary method for indexing and identifying habitual offenders.
correction:
  summary: >-
    Body measurements can contribute descriptive information, but a small manually measured set of dimensions is not
    sufficiently stable or reproducible for reliable stand-alone criminal identification. Measurement technique,
    instrument calibration, bodily change and overlap between individuals introduce error. In British India, officials
    replaced the anthropometric indexing system with fingerprint classification after concluding that fingerprints
    offered a more efficient and reliable system for criminal records.
category: Forensic medicine and identification
reviewedAt: '2026-08-24'
impact:
  summary: >-
    British India formally adopted Bertillon-style anthropometry for habitual-offender identification in 1892.
    Police record systems then depended on officers reproducing standardized body measurements closely enough to
    retrieve a person's prior file. Within five years an official review recommended fingerprint classification
    instead, and the Government of India adopted fingerprints throughout the system in June 1897.
  highlights:
    - value: '1892'
      label: Government of India formally introduced Bertillon-style anthropometry for habitual offenders
    - value: 5 years
      label: Time from formal introduction to government adoption of fingerprint classification
    - value: 12 June 1897
      label: Government of India resolution adopted fingerprint identification in place of anthropometry
  context:
    - >-
      Bertillonage was not simply a claim that measurements were descriptive. Its institutional value depended on
      standardized measurements being reproducible and discriminating enough to retrieve and verify a previous criminal
      record. Operator and instrument error undermined that function.
    - >-
      The replacement of anthropometry by fingerprints was the historical correction for this administrative system.
      It did not establish that all fingerprint comparisons are infallible or that body measurements have no legitimate
      descriptive uses.
episodes:
  - id: british-india-1892-1897
    polity: British India
    region: South Asia
    startYear: 1892
    endYear: 1897
    strength: policy-basis
    institutionTypes:
      - government
    institutions:
      - Government of India
      - Bengal Police
    institutionalContext: >-
      Bengal police began using anthropometric roll cards in 1892, and a Government of India instruction of 10 May 1892
      extended the Bertillon system for habitual-offender identification. The system classified adult prisoners by
      standardized body measurements so that a suspected repeat offender's prior record could be located and compared.
      The method required careful instruments and highly reproducible technique. In 1897 an official committee judged
      fingerprint classification superior for the same record-identification task, and the Government of India adopted
      the fingerprint system by resolution on 12 June.
    consequences:
      - Habitual offenders were measured and indexed through anthropometric criminal records
      - Police training and record retrieval were organized around standardized body measurements
      - Identification depended on measurements vulnerable to operator, instrument and classification error
      - The government replaced the system with fingerprint classification after official review
    summary: >-
      Beginning in 1892, British India institutionalized Bertillon-style anthropometry for habitual-offender
      identification, with the Bengal Police among its key implementing bodies. The system required trained officers
      to reproduce standardized body measurements closely enough to retrieve prior records. By 1897 an official
      committee recommended fingerprints as superior for the purpose, and the Government of India adopted fingerprint
      classification on 12 June 1897.
    mechanism:
      kind: classification
      summary: >-
        Government instructions and police record systems classified adult prisoners through standardized body
        measurements so that suspected repeat offenders could be indexed, retrieved and compared against prior records.
    institutionalCorrection:
      status: corrected
      periodLabel: 12 June 1897
      action: Government of India adopted fingerprint classification in place of anthropometric identification.
      summary: >-
        After an official committee judged fingerprints superior for the same record-identification task, the Government
        of India replaced the anthropometric indexing system with fingerprint classification.
