title: Phrenology
claim: Mental faculties and character can be inferred from the shape of the skull because different brain “organs” enlarge the overlying cranium.
currentUnderstanding: Brain functions depend on neural tissue and distributed networks, and skull bumps do not provide a valid map of personality, intelligence, morality, or mental faculties.
category: Neuroscience and psychology
