term: Ribozyme
aliases:
- ribozymes
- catalytic RNA
shortDefinition: An RNA molecule that can catalyze a chemical reaction.
longDefinition: Ribozymes are RNA molecules with catalytic activity. Their discovery in the early 1980s overturned the
  assumption that biological catalysis was exclusive to proteins. Known ribozymes can catalyze reactions such as RNA
  cleavage, ligation, and processing, and the ribosome's peptide-bond-forming center is itself fundamentally RNA-based.
relatedTerms:
- catalyst
- rna-splicing
reviewedAt: '2026-08-21'
sources:
