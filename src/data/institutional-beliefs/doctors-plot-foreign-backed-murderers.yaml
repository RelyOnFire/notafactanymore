evidence:
  - id: doctors-plot-publication-proposition
    sourceId: doctors-plot-publication-decision
    relation: documents
    target:
      scope: belief
      aspect: proposition
    locator: 'Document no. 4-169, printed pp. 464–465, especially the decision text on p. 464'
    note: >-
      The Bureau decision approves the arrest announcement and orders it published with a Pravda article. It documents
      official adoption and publication of the accusation, not the truth of the allegation.
  - id: doctors-plot-tass-proposition
    sourceId: doctors-plot-tass-draft
    relation: documents
    target:
      scope: belief
      aspect: proposition
    locator: 'Document no. 298, printed pp. 396–397; RGASPI f. 558, op. 11, d. 157, ll. 29–33'
    note: >-
      The archival TASS draft preserves the allegations of deliberate harmful treatment, murder and terrorism and the
      supposed connections to foreign intelligence and the Joint. The draft names ten physicians; an editorial note says
      Iakov Temkin was omitted from the version published in the newspapers.
  - id: doctors-plot-pravda-proposition
    sourceId: doctors-plot-pravda-announcement
    relation: documents
    target:
      scope: belief
      aspect: proposition
    locator: 'Document no. 262, printed pp. 651–652 (Pravda, 13 January 1953)'
    note: >-
      The published TASS notice names nine physicians and presents the alleged group as murderers, terrorists and agents
      of foreign intelligence. It attributes the deaths of Zhdanov and Shcherbakov to harmful treatment and links several
      of the accused to the Joint. This evidence records the public accusation; it does not validate it.
  - id: doctors-plot-publication-carrier
    sourceId: doctors-plot-publication-decision
    relation: documents
    target:
      scope: episode
      episodeId: soviet-union-1953
      aspect: carrier
    locator: 'Document no. 4-169, printed pp. 464–465; decision text and editorial note 3'
    note: >-
      The decision identifies the Bureau of the Presidium as the body that approved publication. Its attachment and
      editorial note identify the TASS notice, the accompanying Pravda article and Stalin's direction of publication.
  - id: doctors-plot-publication-mechanism
    sourceId: doctors-plot-publication-decision
    relation: documents
    target:
      scope: episode
      episodeId: soviet-union-1953
      aspect: mechanism
    locator: 'Document no. 4-169, printed p. 464'
    note: >-
      The operative text orders approval of the draft announcement and its publication together with a Pravda article,
      documenting the institutional path from a security case to an authorized press accusation.
  - id: doctors-plot-tass-consequences
    sourceId: doctors-plot-tass-draft
    relation: documents
    target:
      scope: episode
      episodeId: soviet-union-1953
      aspect: consequences
    locator: 'Document no. 298, printed pp. 396–397; RGASPI f. 558, op. 11, d. 157, ll. 29–33'
    note: >-
      The draft displays the stigmatizing narrative prepared for publication: doctors as deliberate killers, terrorists,
      foreign agents and participants in a Jewish organization falsely described as an American intelligence instrument.
  - id: doctors-plot-pravda-impact
    sourceId: doctors-plot-pravda-announcement
    relation: documents
    target:
      scope: belief
      aspect: impact
    locator: 'Document no. 262, printed pp. 651–654, especially pp. 651–652 and editorial note 2 on p. 654'
    note: >-
      The published notice supports the count of nine publicly named physicians and documents Pravda's dissemination of
      the TASS accusation. The edition's accompanying pages place it within the continuing campaign against cosmopolitanism
      and reproduce the public April retraction.
  - id: doctors-plot-pravda-consequences
    sourceId: doctors-plot-pravda-announcement
    relation: documents
    target:
      scope: episode
      episodeId: soviet-union-1953
      aspect: consequences
    locator: 'Document no. 262, printed pp. 651–653'
    note: >-
      The published text portrays the named physicians as killers, saboteurs, spies and foreign-directed terrorists,
      explicitly associating several Jewish defendants and the Joint with American intelligence. Editorial context on
      p. 653 describes the case as intensifying the campaign against cosmopolitanism.
  - id: doctors-plot-resolution-correction
    sourceId: doctors-plot-rehabilitation-resolution
    relation: documents
    target:
      scope: belief
      aspect: correction
    locator: 'Document no. 6, printed pp. 23–25, especially pp. 24–25; AP RF f. 3, op. 58, d. 423, ll. 1–4'
    note: >-
      The resolution and attached public statement say the arrests lacked legal grounds, the accusations and documentary
      basis were false, and supposed supporting testimony was obtained through methods prohibited by Soviet law. They
      record rehabilitation and release and action against investigators.
  - id: doctors-plot-resolution-impact
    sourceId: doctors-plot-rehabilitation-resolution
    relation: documents
    target:
      scope: belief
      aspect: impact
    locator: 'Document no. 6, printed pp. 23–25, especially resolution point 1(a) on p. 23'
    note: >-
      Point 1(a) gives one combined total of 37 people: doctors and members of their families arrested in the case. It does
      not say that 37 doctors, plus an additional number of relatives, were released.
  - id: doctors-plot-resolution-consequences
    sourceId: doctors-plot-rehabilitation-resolution
    relation: documents
    target:
      scope: episode
      episodeId: soviet-union-1953
      aspect: consequences
    locator: 'Document no. 6, printed pp. 23–25, especially the public statement on pp. 24–25'
    note: >-
      The statement documents unlawful arrests, false accusations and documentary material, testimony obtained by
      impermissible methods, release of the detainees and criminal proceedings against those responsible for the inquiry.
  - id: doctors-plot-resolution-institutional-correction
    sourceId: doctors-plot-rehabilitation-resolution
    relation: documents
    target:
      scope: episode
      episodeId: soviet-union-1953
      aspect: institutional-correction
    locator: 'Document no. 6, printed pp. 23–25, especially resolution points 1–3 on pp. 23–24'
    note: >-
      The Presidium accepts the MVD proposal, orders rehabilitation and release of 37 people, authorizes criminal
      proceedings against former MGB personnel and approves a public statement. This directly documents the institutional
      reversal on 3 April 1953.
  - id: doctors-plot-yivo-context
    sourceId: doctors-plot-yivo
    relation: contextualizes
    target:
      scope: episode
      episodeId: soviet-union-1953
      aspect: context
    locator: 'Paragraphs beginning “Antisemitic campaign,” “The plot assumed a Jewish character,” and “The core group”'
    note: >-
      Jonathan Brent's scholarly overview places the case within Stalin's antisemitic campaign while stressing its wider
      political purposes. It reports that only 17 people in the core arrested group were Jewish and describes torture aimed
      at constructing a Jewish, American and internal-security conspiracy. The resolution, rather than YIVO's differently
      phrased group description, is the source used for the 37-person release total.
  - id: doctors-plot-yivo-disputed-next-steps
    sourceId: doctors-plot-yivo
    relation: contextualizes
    target:
      scope: belief
      aspect: impact
    locator: 'Opening paragraph and paragraph beginning “Although some new evidence supports”'
    note: >-
      The overview treats Stalin's intended final stage as a matter of speculation. It says the mass-deportation question
      remains open and that no available evidence supports the legendary fixed “Day X,” so those disputed scenarios are
      not used as proof of the documented Doctors' Plot or its impact.
