title: Leaded gasoline as an acceptable public-health risk
entryId: low-level-lead-exposure-is-harmless
claim: Retail use of tetraethyl-lead gasoline was treated as posing no sufficient public-health hazard to prohibit at the concentrations then contemplated, provided that manufacture, distribution and use were properly controlled.
currentUnderstanding: Lead is a cumulative toxicant, and dispersing it through automobile exhaust created a major population-exposure pathway. No safe blood lead level in children has been identified, and U.S. regulators ultimately required the lead content of gasoline to be reduced on public-health grounds.
category: Public health and environmental regulation
reviewedAt: '2026-08-26'
