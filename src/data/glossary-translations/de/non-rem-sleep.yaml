locale: de
entryId: non-rem-sleep
sourceReviewedAt: '2026-08-21'
term: Non-REM-Schlaf
aliases:
- NREM
- Non-REM
shortDefinition: Die Schlafphasen außerhalb des REM-Schlafs, von leichtem Schlaf bis zum tiefen Slow-Wave-Schlaf.
longDefinition: Non-REM-Schlaf umfasst mehrere Schlafstadien mit unterschiedlicher Hirnaktivität, Muskelspannung und
  Weckbarkeit. Tiefer Non-REM-Schlaf ist durch langsame Hirnwellen gekennzeichnet. Traumerleben kann sowohl im Non-REM-
  als auch im REM-Schlaf auftreten, auch wenn Häufigkeit und typische Eigenschaften der Berichte unterschiedlich sind.
