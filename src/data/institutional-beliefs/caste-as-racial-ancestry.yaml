    summary: Herbert Risley's anthropometric work classified Indian populations into racial types using measurements including the nasal index. As Census Commissioner, Risley carried this framework into the 1901 Census of India, whose caste chapter and ethnographic appendices treated physical measurements as evidence about race and caste hierarchy.
    sources:
      - title: Environment and Ethnicity in India, 1200–1991
        url: https://assets.cambridge.org/97805216/40787/sample/9780521640787ws.pdf
        publisher: Cambridge University Press
        note: Describes Risley's use of the nasal index to argue that caste hierarchy corresponded to measurable racial difference and identifies upper castes as Aryan within that scheme.
      - title: Census of India, 1901 — Ethnographic Appendices
        url: https://books.google.com/books?id=8MsiAQAAMAAJ
        publisher: Government of India
        note: Official 1903 ethnographic appendices containing the anthropometric data used in the caste and race analysis of the 1901 census.
