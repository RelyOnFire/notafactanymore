  locator: >-
    Sadaf Aziz and connected petition, WP 13537/2020 and WP 27421/2020: paragraphs 6–7 on the 2015 instructions;
    paragraphs 27–33 on validity, rights and relief, particularly 32–33.
  note: >-
    The judgment discusses the invasive tests, sexual-history opinions and their incompatibility with dignity,
    privacy and bodily integrity. It supports the documented procedure and evidentiary risk; it does not provide
    a measured count of verdicts or other legal outcomes caused by those tests.
- id: virginity-pakistan-lhc-correction
  sourceId: virginity-pakistan-lhc-judgment
  relation: documents
  target:
    scope: episode
    episodeId: pakistan-2015-2021
    aspect: institutional-correction
  locator: >-
    Sadaf Aziz and connected petition, WP 13537/2020 and WP 27421/2020: paragraphs 6–7 on the 2015 instructions;
    paragraphs 27–33 on validity, rights and relief, particularly 32–33.
  note: >-
    The concluding paragraphs, particularly 32–33, declare virginity testing by two-finger or hymenal examination
    unlawful and unconstitutional and invalidate the relevant portions of the medico-legal instructions and guidelines.
    The relief concerns testing supposed virginity; the judgment does not prohibit medically necessary assessment.
- id: virginity-pakistan-act-correction
  sourceId: virginity-pakistan-act-2021
  relation: documents
  target:
    scope: episode
    episodeId: pakistan-2015-2021
    aspect: institutional-correction
  locator: >-
    Anti-Rape (Investigation and Trial) Act 2021: sections 1(2)–(3) (territorial extent and commencement) and
    13(1), printed page 8, on testing and probative value.
  note: >-
    Section 13(1) prohibits two-finger virginity testing in medico-legal examinations of victims of scheduled
    offences and denies it probative value. Section 1 provides nationwide territorial extent and a separate commencement
    mechanism. The Act supplies the exact statutory rule; no unverified commencement date or blanket claim of
    subsequent compliance is inferred.
