schemaVersion: 2
locale: de
entryId: women-low-cerebral-capacity-university
sourceReviewedAt: '2026-09-27'
title: Frauen als wegen angeblich geringer „zerebraler Kapazität“ ungeeignet für ein Universitätsstudium
proposition:
  summary: >-
    Österreichische Universitätsbehörden schlossen Frauen von der regulären Inskription aus. In der begleitenden
    institutionellen Debatte deuteten medizinische und akademische Gegner kleinere durchschnittliche Gehirne, eine
    angeblich geringe „zerebrale Kapazität“, menstruationsbedingte Instabilität und eine natürliche Bestimmung für das
    häusliche Leben als Belege dafür, dass Frauen als Gruppe einem ernsthaften Universitätsstudium nicht gewachsen seien.
correction:
  summary: >-
    Es gibt keine geschlechtsweite zerebrale Unfähigkeit, die Frauen an einem erfolgreichen Universitätsstudium hindert.
    Die durchschnittliche Gehirngröße bildet keine Rangordnung geistiger Eignung: Eine moderne Forschungssynthese findet
    nach der Größenkorrektur nur wenige verlässliche Unterschiede zwischen männlichen und weiblichen Gehirnen und keine
    zwei dimorphen Gehirntypen. Eine Metaanalyse von Noten bis zum Bachelor- und Graduiertenstudium zeigt statt eines
    weiblichen Defizits einen kleinen durchschnittlichen Vorteil. Historisch widersprachen bereits Frauen wie Gabriele
    Possanner der Behauptung: Sie schloss ihr Medizinstudium im Ausland ab und wiederholte für das Wiener Doktorat 21
    Prüfungen. Österreich begann 1897, den rechtlichen Ausschluss Fakultät für Fakultät abzubauen.
impact:
  summary: >-
    Der Akademische Senat der Universität Wien lehnte 1873 die Inskription von Frauen als ordentliche wie
    außerordentliche Hörerinnen ab. Ein Ministerialerlass vom 6. Mai 1878 erklärte sodann eine allgemeine Zulassung nach
    den bestehenden Normen für ausgeschlossen und die Trennung der Geschlechter zum leitenden Grundsatz; selbst der
    Vorlesungsbesuch blieb auf Ausnahmefälle beschränkt. Gehirnanatomie führte der Erlass nicht an. Biologistische
    Expertise wurde dennoch Teil der institutionellen Abwehr: 1895 diente ein von der Wiener Ärztekammer beauftragtes
    antifeministisches Gutachten als Vorlage für eine Stellungnahme der Akademischen Senate österreichischer
    Universitäten. 1897 öffnete das Ministerium die philosophischen Fakultäten; 1897/98 traten die ersten drei Frauen als
    ordentliche Studentinnen in die Universität Wien ein.
  highlights:
    - value: 24 Jahre
      label: von der Ablehnung durch den Wiener Akademischen Senat 1873 bis zur Öffnung der philosophischen Fakultäten 1897
    - value: '3'
      label: erste ordentlich inskribierte Frauen an der Universität Wien 1897/98
    - value: 1:183
      label: von der Universität Wien dokumentiertes anfängliches Verhältnis ordentlich inskribierter Frauen zu Männern
    - value: '21'
      label: Prüfungen, die Gabriele Possanner nach ihrem Zürcher Medizinstudium in Wien wiederholen musste
  context:
    - >-
      Formeller Ausschluss und wissenschaftliche Legitimation sind auseinanderzuhalten. Der Erlass von 1878 berief sich
      auf geltende Normen und die Geschlechtertrennung im höheren Unterricht, nicht auf Gehirnkapazität. Er trennte zudem
      zwei Ausnahmen: Eigene Vorlesungen für Frauen bedurften der Genehmigung des Ministeriums; für die Teilnahme an einer
      regulären Vorlesung mussten Lehrperson und Fakultät übereinstimmen, und der Akademische Senat konnte Frauen weiterhin
      universitätsweit ausschließen. Argumente über Gehirngröße, Physiologie, Familienrollen und berufliche Konkurrenz
      zirkulierten um diese Regel und gingen in universitäre Beratungen ein. Die Episode gilt deshalb als „institutionell
      einflussreich“; die Gehirnbehauptung wird weder zum Wortlaut noch zur alleinigen Grundlage des Rechts erklärt.
    - >-
      Die Verordnung von 1897 war eine administrative Korrektur und kein wissenschaftliches Experiment. Gegen die
      behauptete allgemeine Unfähigkeit sprechen erfolgreiche Studentinnen und spätere Forschung. Institutionell
      bedeutsam ist die Verordnung, weil das Geschlecht an den geöffneten Fakultäten nicht länger als hinreichender
      Ausschlussgrund galt.
    - >-
      Die Zulassung blieb ungleich. 1897 galt sie zunächst für philosophische Fakultäten, verlangte die österreichische
      Staatsbürgerschaft und eine reguläre Matura und trat in Kraft, bevor Mädchen einen gleichwertigen schulischen Zugang
      zu dieser Prüfung hatten. Medizin und Pharmazie folgten 1900, Rechts- und Staatswissenschaften 1919, evangelische
      Theologie 1928 und katholische Theologie erst nach dem Zweiten Weltkrieg.
    - >-
      Die historische Philosophische Fakultät umfasste Geistes- und Naturwissenschaften, die heute auf mehrere Fakultäten
      verteilt sind. „Universitätsstudium“ bezeichnet hier die institutionelle Behauptung; es bedeutet weder, dass 1897
      alle heutigen Fächer geöffnet wurden, noch dass Frauen und Männer in jedem gemessenen Merkmal identisch sind.
episodes:
  - id: austria-1873-1897
    polity: Österreich
    institutions:
      - k. k. Ministerium für Cultus und Unterricht
      - Akademischer Senat der Universität Wien
      - Akademische Senate der österreichischen Universitäten
      - Wiener Ärztekammer
      - Philosophische Fakultät der Universität Wien
    institutionalContext: >-
      1873 erklärte sich der Akademische Senat der Universität Wien entschieden gegen die Inskription von Frauen als
      ordentliche oder außerordentliche Hörerinnen. Der Ministerialerlass vom 6. Mai 1878 formulierte die allgemeine Regel:
      Frauen waren vom regulären Studium ausgeschlossen. Eigene Vorlesungen für Frauen bedurften der Genehmigung des
      Ministeriums; die seltene Teilnahme an einer regulären Vorlesung verlangte die Übereinstimmung von Lehrperson und
      Fakultät und blieb einem allgemeinen Verbot durch den Senat unterworfen. Die Teilnehmerinnen blieben Hospitantinnen
      ohne Prüfungs- und Abschlussrecht. In der anschließenden Debatte präsentierten Anatomen, Gynäkologen und Psychiater
      einen „Gehirnbeweis“ und weitere biologische Behauptungen als
      Expertenwissen über die Studierfähigkeit von Frauen. 1895 wurde ein von der Wiener Ärztekammer beauftragtes Gutachten
      zur Vorlage für die ablehnende Stellungnahme der Akademischen Senate. Am 23. März 1897 kehrte das Ministerium einen
      Teil der Regel um und ließ qualifizierte Frauen an den philosophischen Fakultäten der k. k. Universitäten als
      ordentliche oder außerordentliche Hörerinnen zu.
    summary: >-
      Österreichische Behörden behandelten Frauen zunächst als für die reguläre Mitgliedschaft in der Universität
      ungeeignet und beschränkten später selbst den ausnahmsweisen Vorlesungsbesuch. Akademische Gegner ergänzten den
      Ausschluss durch vermeintlich wissenschaftliche Erklärungen über weibliche Gehirne, Körper und gesellschaftliche
      Aufgaben. Diese Behauptungen wurden schon damals bestritten, durch die tatsächlichen Leistungen von Frauen
      widerlegt und von moderner Gehirn- und Bildungsforschung nicht bestätigt. Die Verordnung von 1897 brach die
      allgemeine Regel für philosophische Fakultäten; gleichberechtigter Zugang erforderte weitere Reformen.
    consequences:
      - Ausschluss von Frauen von regulärer Inskription, Prüfungen und österreichischen Universitätsabschlüssen
      - Vorlesungsbesuch nur im Ausnahmefall als Hospitantin unter der Kontrolle von Lehrperson, Fakultät, Senat und Ministerium
      - Ungleicher Zugang zur Matura, die die Zulassungsverordnung von 1897 voraussetzte
      - Zwang für Frauen wie Gabriele Possanner, im Ausland zu studieren und Prüfungen für die Anerkennung in Österreich zu wiederholen
      - Medizinische und anatomische Sprache als Naturalisierung einer auch durch Geschlechterrollen und Konkurrenzangst getragenen Barriere
      - Fakultätsweiser Abbau, durch den Medizin und andere Studien nach der ersten Öffnung von 1897 geschlossen blieben
    mechanism:
      summary: >-
        Das Ministerium setzte die Ausschlussregel und genehmigte eigene Vorlesungen für Frauen; über seltene Teilnahmen an
        regulären Vorlesungen entschieden Lehrperson und Fakultät, während Senate ein vollständiges Verbot verhängen
        konnten. Medizinische Autoritäten verstärkten diese Schranken durch umstrittene anatomische und physiologische
        Behauptungen als Expertenbelege für eine allgemeine Ungeeignetheit von Frauen.
    institutionalCorrection:
      periodLabel: ab 23. März 1897
      action: Das Ministerium für Cultus und Unterricht ließ qualifizierte Frauen an philosophischen Fakultäten als ordentliche oder außerordentliche Hörerinnen zu; spätere Maßnahmen öffneten die übrigen Fakultäten und verringerten die schulischen Barrieren.
      summary: >-
        Die Verordnung von 1897 hob das Geschlecht an philosophischen Fakultäten als automatischen Ausschlussgrund auf und
        eröffnete einen Weg zum Abschluss. Ihre Staatsbürgerschafts- und Maturabedingungen wirkten jedoch in einem
        ungleichen Schulsystem, während andere Fakultäten geschlossen blieben.
evidence:
  - id: women-certified-proposition
    note: >-
      Die Universitätsgeschichte dokumentiert ausdrücklich die angeblich geringe „zerebrale Kapazität“ als
      wissenschaftliches Argument gegen die Zulassung und erklärt, wie erfolgreiche Frauen zu Ausnahmen erklärt wurden.
  - id: women-seebacher-proposition
    note: >-
      Rekonstruiert den „Gehirnbeweis“: Anatomen, Gynäkologen und Psychiater verwandelten Durchschnittsmessungen und
      physiologische Theorien in Behauptungen biologischer Minderwertigkeit und mangelnder Eignung für das Medizinstudium.
  - id: women-eliot-correction
    note: >-
      Die Synthese umfasst drei Jahrzehnte MRT- und Post-mortem-Forschung. Nach Berücksichtigung der Gesamtgröße bleiben
      wenige verlässliche Geschlechtsunterschiede; das Geschlecht erklärt meist rund ein Prozent der Varianz, und die
      Befunde tragen keine Einteilung in zwei dimorphe menschliche Gehirntypen.
  - id: women-voyer-correction
    note: >-
      Die Metaanalyse von 502 Effektstärken aus 369 Stichproben, einschließlich Bachelor- und Graduiertenstudium, findet
      fachübergreifend einen kleinen durchschnittlichen Notenvorteil von Frauen und widerspricht damit einer allgemeinen
      akademischen Unfähigkeit.
  - id: women-vienna-correction
    note: >-
      Dokumentiert die biologischen Argumente, Gabriele Possanners Zürcher Ausbildung, ihre 21 in Wien wiederholten
      Prüfungen, Doktorat und Praxis sowie die schrittweise Öffnung der Wiener Fakultäten.
  - id: women-1878-impact
    note: >-
      Erläutert, dass die Matura kein Recht auf ein Studium verlieh, und fasst die mehreren institutionellen Erlaubnisse
      rund um die ausnahmsweise Hospitation zusammen, die keinen Weg zum Abschluss eröffnete.
  - id: women-federal-impact
    note: >-
      Der Bundesbericht verfolgt die Ablehnung des Senats von 1873, zitiert den Erlass von 1878 und trennt drei
      Widerstandsgründe: behauptete biologische Minderwertigkeit, Angst vor dem Zerfall der Familie und vor beruflicher
      Konkurrenz durch Frauen.
  - id: women-ministry-carrier
    note: >-
      Das ministerielle Verordnungsblatt benennt ausstellende Behörde und Adressaten und hält fest, dass Frauen nach der
      geltenden Regel weder als ordentliche noch als außerordentliche Hörerinnen zuzulassen waren.
  - id: women-federal-carrier
    note: >-
      Belegt den Akademischen Senat der Universität Wien schon vor der ministeriellen Regelung des Vorlesungsbesuchs als
      institutionellen Träger. Die Jahreszahlen stammen aus dem Scanbild; die automatische Texterkennung liest mehrere
      Siebener fälschlich als Einsen.
  - id: women-1878-carrier
    note: >-
      Die Universität Wien benennt Ministerium, Lehrperson und Fakultät als die Stellen, die über jeden Ausnahmefall
      entschieden.
  - id: women-ministry-mechanism
    note: >-
      Zeigt den Mechanismus im Primärtext: Eigene Vorlesungen für Frauen bedurften ministerieller Genehmigung; die Teilnahme
      an einer regulären Vorlesung verlangte das Einvernehmen von Lehrperson und Fakultät; der Senat konnte Frauen ganz
      ausschließen; Gründe waren für die ministerielle Aufsicht zu protokollieren; Teilnehmerinnen blieben nicht
      inskribierte Hospitantinnen ohne Prüfungen oder Bestätigungen.
  - id: women-1878-mechanism
    note: >-
      Liefert die zugängliche Zusammenfassung der Universität zum System der Ausnahmegenehmigungen und bestätigt, dass der
      Status als Hospitantin nicht zu einem Abschluss führen konnte; die Primärquelle unterscheidet die beiden
      Genehmigungswege.
  - id: women-seebacher-mechanism
    note: >-
      Zeigt den konkreten institutionellen Weg der wissenschaftlichen Rhetorik: Die Wiener Ärztekammer beauftragte Wilhelm
      Svetlins biologistisch formuliertes Gutachten, das 1895 zur Vorlage für die Stellungnahme der österreichischen
      Akademischen Senate wurde.
  - id: women-certified-consequences
    note: >-
      Dokumentiert den äußerst kleinen ersten Jahrgang — drei ordentlich inskribierte Frauen bei einem Verhältnis von
      1:183 — und den Fortbestand weiterer Fakultätsausschlüsse nach 1897.
  - id: women-vienna-consequences
    note: >-
      Belegt zwei konkrete Umwege: Auslandsstudium mit belastenden Anerkennungsprüfungen und die verzögerte,
      fakultätsweise Öffnung österreichischer Studienberechtigungen.
  - id: women-vienna-context
    note: >-
      Stellt Behauptungen über kleinere Gehirne und weibliche „Natur“ neben Polemik, berufliche Konkurrenz sowie Gegner
      und Befürworter in der Professorenschaft und vermeidet damit eine monokausale Erklärung.
  - id: women-federal-context
    note: >-
      Unterscheidet das Handeln universitärer Gremien von jenem des Ministeriums und dokumentiert Familienrollen und
      arbeitsmarktbezogene Motive neben Behauptungen biologischer Minderwertigkeit.
  - id: women-seebacher-context
    note: >-
      Erklärt, wie medizinische Autorität soziale Rollen naturalisierte, dokumentiert aber auch zeitgenössische
      Widerlegungen durch Rosa Kerschbaumer und Carl Bernhard Brühl sowie die Mischung aus wissenschaftlichen, moralischen
      und berufspolitischen Argumenten.
  - id: women-eliot-context
    note: >-
      Liefert den modernen neurowissenschaftlichen Vergleich zur Beurteilung des historischen „Gehirnbeweises“; die Quelle
      belegt die Richtigkeit der Proposition, nicht eine Ursache des Politikwechsels von 1897.
  - id: women-voyer-context
    note: >-
      Liefert moderne Leistungsdaten bis zur Universitätsebene; sie prüfen die Unfähigkeitsbehauptung, erklären aber nicht
      die historische Entscheidung des Ministeriums.
  - id: women-regulation-correction
    note: >-
      Amtlicher Rechtsnachweis der Zulassung von Frauen als ordentliche oder außerordentliche Hörerinnen an den
      philosophischen Fakultäten der k. k. Universitäten.
  - id: women-first-students-correction
    note: >-
      Dokumentiert die Umsetzung in Wien einschließlich österreichischer Staatsbürgerschaft, regulärer Matura, Kosten- und
      Zugangsbarrieren der privat abgelegten Prüfung und der ersten drei Studentinnen im Wintersemester 1897/98.
  - id: women-certified-correction
    note: >-
      Bestätigt die Öffnung 1897/98, die ersten drei regulären Studentinnen und die spätere Zulassung zur Medizin 1900 und
      zeigt damit, weshalb die Korrektur 1897 unvollständig blieb.
