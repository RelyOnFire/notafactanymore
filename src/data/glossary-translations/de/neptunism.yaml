entryId: neptunism
sourceReviewedAt: '2026-08-21'
term: Neptunismus
aliases:
- neptunistisch
shortDefinition: Eine geologische Theorie des späten 18. Jahrhunderts, nach der die meisten großen Gesteinsgruppen als
  Ablagerungen aus einem gewaltigen Ur-Ozean ausgefällt wurden.
longDefinition: Der Neptunismus ist besonders mit Abraham Gottlob Werner verbunden. In seiner einflussreichen Form ordnete
  er die großen Gesteinseinheiten der Erde als Abfolge von Ablagerungen eines zurückweichenden universellen Ozeans. Das
  Modell erklärte manche geschichteten Gesteine gut, geriet aber mit Hinweisen in Konflikt, dass Granit, Basalt und andere
  Gesteine durch Hitze, Intrusion oder Vulkanismus entstanden waren.
