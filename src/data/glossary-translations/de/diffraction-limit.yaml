entryId: diffraction-limit
sourceReviewedAt: '2026-08-21'
term: Beugungsgrenze
aliases:
- Abbe-Grenze
- Beugungs-Auflösungsgrenze
shortDefinition: Die konventionelle Auflösungsgrenze durch die Wellennatur des Lichts, die punktförmige Objekte als endliche
  verschwommene Lichtflecken erscheinen lässt.
longDefinition: Bei gewöhnlicher optischer Bildgebung verbreitert Beugung das Licht eines punktförmigen Objekts zu einem
  endlichen Muster. Zwei ausreichend nahe Objekte erzeugen daher überlappende Muster, die konventionell nicht sauber
  getrennt werden können. Ernst Abbe verknüpfte diese Auflösungsskala mit Wellenlänge und numerischer Apertur. Superauflösungsverfahren
  schaffen die Beugung nicht ab, sondern gewinnen zusätzliche Information durch veränderte Beleuchtung, Fluoreszenzsteuerung
  oder Rekonstruktion.
