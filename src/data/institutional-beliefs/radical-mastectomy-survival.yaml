  institutionalContext: William Halsted developed and reported his radical mastectomy while serving as surgeon-in-chief at The Johns Hopkins Hospital. The operation removed the breast, axillary lymph nodes and pectoral muscles in one block, reflecting the model that breast cancer spread progressively through adjacent tissues and regional lymphatics. The procedure became the prevailing U.S. standard for decades; by the 1970s, surgeons who proposed less extensive operations could still be accused of offering inadequate treatment.
  consequences:
  - Radical mastectomy became the prevailing operation for breast cancer in the United States for much of the twentieth century
  - Women routinely lost the breast, axillary lymph nodes and chest muscles even when less extensive surgery would later prove equally effective for survival
  - The operation could leave major disfigurement, lymphedema, pain, weakness and restricted arm movement
  - Randomized trials beginning in the 1970s found that less extensive surgery did not reduce survival, forcing a major change in surgical standards
  summary: Halsted's Johns Hopkins operation converted a coherent theory of orderly cancer spread into a durable surgical standard. If breast cancer moved outward through contiguous tissues and lymph nodes, the safest operation seemed to be the widest possible en-bloc removal. Radical mastectomy dominated U.S. treatment for decades despite its substantial physical costs. The NSABP B-04 trial, begun in 1971 and reported in 1977, found that women receiving the radical operation did not live longer than women treated with less extensive surgery. European breast-conservation trials and later U.S. trials reinforced the same lesson, replacing routine maximal surgery with treatment tailored to disease extent and biology.
