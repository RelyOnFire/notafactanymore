title: Lysenkoist heredity
proposition:
  summary: >-
    Environmental treatment can reliably reshape heredity across generations, making Mendelian genetics unnecessary
    or false.
correction:
  summary: >-
    Heredity is transmitted primarily through genetic information. Environmental effects can influence development
    and sometimes persist across generations, but they do not support the broad Lysenkoist claim that directed environmental
    treatment routinely rewrites inherited traits. Modern studies distinguish DNA sequence inheritance from changes
    in gene regulation: in one Arabidopsis experiment, stress-associated epigenetic effects passed mainly through
    the maternal line and were extensively reset when the stress was removed.
category: Genetics
entryId: acquired-traits-drive-evolution
reviewedAt: '2026-09-13'
impact:
  summary: >-
    Lysenkoism's best-supported direct consequences were institutional: genetics was suppressed, scientists were dismissed
    or demoted, teaching and research were reorganized around a politically protected doctrine, and agricultural science
    lost decades of normal scientific correction. In China, the campaign interrupted genetics teaching and breeding
    research. The later Great Leap Forward famine belongs to the wider history of state-directed agriculture; its
    mortality arose from interacting policies and failures and cannot be assigned to Lysenkoism as a single cause.
  highlights:
    - value: '127'
      label: University teachers dismissed in autumn 1948 in one historical accounting
      note: >-
        The same historical review reports that 66 of the 127 were professors; subsequent dismissals, demotions and
        removals from leadership were much broader.
    - value: Several thousand
      label: Scientists and teachers described as dismissed, demoted or removed from leadership after the 1948 Soviet
        campaign
      note: This is an institutional-repression estimate reported in the historical literature, not a death toll.
    - value: 15–30 million
      label: Range of estimated excess deaths in China's 1959–1961 famine reported by Chen and Zhou (2007)
      note: >-
        Overall famine mortality, not deaths attributable specifically to Lysenkoism. Production losses, procurement,
        exports, collectivization and other political-economic mechanisms interacted.
  context:
    - >-
      In the Soviet Union, the turning point was the 1948 VASKhNIL session, organized under Lysenko and approved by
      Stalin. The session did more than endorse a theory: it ended open institutional competition with Mendelian genetics.
      An August 1948 Ministry of Higher Education order directed universities to revise biological teaching and staffing
      around Michurinist biology. Geneticists lost posts, departments were reorganized, textbooks and research materials
      were withdrawn, and the normal mechanisms by which a scientific claim could be challenged were deliberately
      weakened.
    - >-
      An earlier phase overlaps chronologically with the Holodomor. Soviet authorities ordered immediate implementation
      of Lysenko's vernalization program in 1931 and the treated acreage expanded rapidly, so his agricultural methods
      were already being promoted when the 1932–1933 Ukrainian famine occurred. But the evidence does not support
      presenting Lysenkoism as an important established cause of the Holodomor. Historical work instead places collectivization
      and grain seizure or procurement at the center, while recent quantitative work finds that migration restrictions
      and anti-Ukrainian bias in Soviet procurement and grain-retention policy contributed to mortality. The famine
      also strengthened rather than discredited Lysenko: afterward, the People's Commissar for Agriculture instructed
      Vavilov to assist his work.
    - >-
      The Great Leap Forward followed the early campaign against genetics. Its agricultural crisis involved several
      interacting policies and failures. Communalization altered incentives and household food access; large numbers
      of workers were diverted from farming; officials reported inflated harvests; procurement targets were then imposed
      on a shrinking and badly measured crop; and grain exports and increasingly rigid procurement reduced what remained
      for rural consumption. Li and Yang's central-planning study and Kasahara and Li's county-level analysis examine
      these economic mechanisms. They do not estimate a death toll caused specifically by Lysenkoist heredity.
    - >-
      That distinction matters for attribution. Economic studies find that falling agricultural production, higher
      and more inflexible procurement, and grain exports all raised excess mortality, with no single mechanism accounting
      for the whole famine. The 15–30 million range reported by Chen and Zhou (2007) therefore describes the scale
      of the 1959–1961 famine as a whole. It is useful context for understanding the stakes of failed agricultural
      doctrine, but it is not a defensible count of people killed specifically by Lysenkoism.
episodes:
  - id: ussr-1948-1964
    polity: Soviet Union
    region: Eurasia
    startYear: 1948
    endYear: 1964
    strength: enforced-doctrine
    institutionTypes:
      - government
      - academy
      - education
    institutions:
      - Lenin All-Union Academy of Agricultural Sciences (VASKhNIL)
      - USSR Ministry of Higher Education
      - USSR Academy of Sciences
      - Moscow State University
      - Leningrad State University
    institutionalContext: >-
      The 1948 VASKhNIL session gave Lysenko's position state-backed authority. Higher education minister Sergei Kaftanov's
      order of 23 August directed dismissals and the restructuring of teaching and research. The USSR Academy of Sciences
      then adopted its own measures against genetics. At Moscow and Leningrad State Universities, departments were
      reorganized and opponents were dismissed or replaced. These were actions of institutional authorities; individual
      scientists within the same institutions resisted, and some later helped genetics recover. Lysenko's earlier
      vernalization campaign overlapped with the Holodomor, whose documented procurement and migration policies are
      discussed separately in the impact section.
    consequences:
      - Geneticists were dismissed, demoted, or removed from scientific leadership
      - Genetics laboratories and departments were closed or reorganized
      - Mendelian genetics was removed from teaching and textbooks
      - Agricultural and biological research lost normal mechanisms of scientific correction
    summary: >-
      After the 1948 VASKhNIL session, Lysenko's anti-Mendelian biology received state backing while orthodox geneticists
      were dismissed, laboratories were closed, and genetics teaching and research were restricted. Recovery began
      in protected settings during the 1950s. Khrushchev's removal in 1964 opened the way to the Academy of Sciences'
      explicit repudiation of the 1948 decisions in 1965 and new plans for genetics research and teaching. Lysenkoists
      nevertheless retained posts and influence in agricultural institutions.
    mechanism:
      kind: suppression
      summary: >-
        State-backed academy and education authorities imposed Michurinist biology through staffing, curriculum and
        research controls while suppressing Mendelian genetics and scientists who defended it.
    institutionalCorrection:
      status: corrected
      periodLabel: 1964–1966
      action: >-
        In 1965 the USSR Academy of Sciences rejected the 1948 decisions, declined to reelect Lysenko as director
        of its Institute of Genetics, and announced new genetics institutions and teaching plans.
      summary: >-
        The Academy officially rehabilitated genetics within its scientific framework. In January–February 1965 it
        repudiated the imposed doctrine and planned renewed research and curricula; the Institute of General Genetics
        followed. Implementation was gradual, and the continued influence of Lysenkoists in VASKhNIL and agricultural
        education prevents treating 1964 as a universal endpoint for every institution or career.
  - id: china-1949-1956
    polity: People's Republic of China
    region: East Asia
    startYear: 1949
    endYear: 1956
    strength: officially-endorsed
    institutionTypes:
      - government
      - academy
    institutions:
      - Chinese Academy of Sciences, Planning Bureau
      - >-
        Science and Health Office of the Planning Bureau, Cultural and Educational Affairs Committee of the Government
        Administration Council
    consequences:
      - Classical genetics was displaced in research and higher education
      - Scientific careers and curricula were shaped by political orthodoxy
      - Successful hybrid-breeding research was interrupted when classified as Morganist
    summary: >-
      In the early People's Republic, Soviet scientific organization was copied and classical genetics was displaced
      by Lysenkoist biology. The 1952 campaign reached courses, research and publishing. At the Qingdao genetics meeting
      of 10–25 August 1956, organized by the Chinese Academy of Sciences and the Ministry of Higher Education, both
      schools could present their views. Teaching, research and publishing rules subsequently reopened space for classical
      genetics. This was a substantial retreat from one-sided suppression, with coexistence of schools rather than
      a blanket repudiation of Lysenkoism.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Government and Academy bureaus promoted a prescribed Michurinist direction through meetings and party-press
        publication; university courses, research projects and academic publishing then excluded classical genetics.
    institutionalCorrection:
      status: partial
      periodLabel: August 1956 onward
      action: >-
        The Academy and Ministry of Higher Education convened the Qingdao genetics meeting; research, education and
        publishing authorities subsequently changed the rules that had supported one school and suppressed the other.
      summary: >-
        The official chronology records removal of political labels from classical geneticists and a gradual return
        of their courses and research. Both schools were allowed to argue their positions. The response corrected
        exclusion and restored scientific discussion, but does not establish a general institutional rejection of
        every Lysenkoist heredity claim.
    institutionalContext: >-
      China reorganized science along Soviet lines after 1949. In April–June 1952, the Academy's Planning Bureau and
      the government's Science and Health Office convened meetings that led to a 29 June People's Daily article requiring
      biology to follow the Michurinist direction. The Academy's chronology records the subsequent suspension of classical-genetics
      courses and research, interruption of successful hybrid-breeding work, and pressure on geneticists to publish
      statements they did not believe. The Ministry of Higher Education later joined the Academy in organizing the
      1956 Qingdao meeting that reopened discussion. The Great Leap Forward and its famine came later, amid wider
      changes in state-directed agriculture. The famine involved production losses, labour diversion, procurement
      and exports; its total mortality cannot be attributed to this genetics campaign.
  - id: poland-1949-1956
    polity: Poland
    region: Eastern Europe
    startYear: 1949
    endYear: 1956
    strength: enforced-doctrine
    institutionTypes:
      - government
      - academy
      - education
    institutions:
      - Koło Przyrodników Marksistów / Zrzeszenie Przyrodników-Marksistów (renamed 1950; merged in 1952)
      - Polska Akademia Nauk, Division II and Commission of Evolutionism (from 1952)
      - Polish Ministry of Higher Education
      - Polskie Towarzystwo Przyrodników im. Kopernika (from 1952)
    consequences:
      - Removal of genetics from teaching
      - Suppression of competing biological research
      - Political pressure on scientists
      - Attempts to reshape agricultural science
    summary: >-
      A Warsaw conference in March 1949 proclaimed the Lysenkoist “New Biology” an official paradigm in Polish science.
      Genetics and criticism of the doctrine were actively confronted, genetics courses disappeared from universities,
      school curricula were rewritten, and scientists who used politically unacceptable concepts could be silenced
      or publicly stigmatized. During the Academy's General Assembly of 11–12 June 1956, its imposition of Lysenkoism
      came under open criticism. Genetics returned to school and university curricula in 1957–1958. The 1956 episode
      endpoint marks the political and institutional turn, not the completion of every teaching reform.
    mechanism:
      kind: education
      summary: >-
        Scientific and educational institutions made the “New Biology” an official paradigm, rewrote curricula and
        marginalized or suppressed genetics and researchers who used politically unacceptable concepts.
    institutionalCorrection:
      status: corrected
      periodLabel: 1956–1958
      action: >-
        The Polish Academy's June 1956 General Assembly criticized the imposed doctrine; genetics returned to school
        and university curricula in 1957–1958.
      summary: >-
        Genetics regained its place in official teaching, and the imposed doctrine lost its protected position. The
        Academy's institutional turn in 1956 was followed by curricular restoration in 1957–1958. The sources establish
        this reversal in education and scientific administration; they do not establish that every earlier advocate
        recanted or that all the damage was repaired.
    institutionalContext: >-
      The Association of Marxist Naturalists promoted the new doctrine as Koło Przyrodników Marksistów and, after
      its 1950 renaming, as Zrzeszenie Przyrodników-Marksistów. It merged with the Copernican Society of Polish Naturalists
      in 1952. The Polish Academy of Sciences, established in 1952, gave its biological division a role in promoting
      Lysenkoism; its Commission of Evolutionism and the Ministry of Higher Education organized a month-long training
      course at Dziwnów that year. The Copernican Society became a major public advocate. Administrative pressure,
      publishing controls and teaching requirements restricted competing biology. Much of the botanical community
      nevertheless resisted or avoided the doctrine, so institutional enforcement should not be read as unanimous
      scientific acceptance.
