entryId: fossil-flora
sourceReviewedAt: '2026-08-21'
term: Fossile Flora
aliases:
- Pflanzenfossilien
- fossile Pflanzen
shortDefinition: Fossile Belege früheren Pflanzenlebens, darunter Blätter, Holz, Pollen, Sporen, Wurzeln, Samen und andere
  erhaltene Pflanzenreste.
longDefinition: 'Fossile Flora ist der erhaltene Nachweis von Pflanzen vergangener Lebensräume. Verschiedene Pflanzenreste
  liefern unterschiedliche Informationen: Blätter und Holz können Vegetationstypen anzeigen, Pollen und Sporen Pflanzengemeinschaften
  dokumentieren, und Wurzeln oder fossile Böden zeigen, dass Pflanzen tatsächlich vor Ort wuchsen. Zusammen sind solche
  Funde wichtige Belege für die Rekonstruktion früherer Klimate und Ökosysteme.'
