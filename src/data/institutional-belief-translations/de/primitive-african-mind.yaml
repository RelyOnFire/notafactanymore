locale: de
entryId: primitive-african-mind
sourceReviewedAt: 2026-08-22
title: Der „primitive afrikanische Geist“
claim: Koloniale Psychiatrie behandelte Afrikaner als psychisch „primitiv“ – stärker von Instinkt oder „magischem“ Denken und weniger von höherem Denkvermögen geprägt als Europäer.
currentUnderstanding: Einen wissenschaftlich gültigen einheitlichen „afrikanischen Geist“ gibt es nicht, und Abstammung ordnet Bevölkerungen nicht auf einer Hierarchie kognitiver Entwicklung ein. Kognition und psychische Gesundheit unterscheiden sich zwischen Individuen und werden von Biologie, Entwicklung, Kultur, Umwelt, Bildung und sozialen Bedingungen geprägt.
episodes:
  - id: french-algeria-1918-1953
    polity: Französisch-Algerien
    summary: Antoine Porot und die einflussreiche Schule von Algier beschrieben Nordafrikaner als Menschen mit „primitiver“ Gehirnentwicklung, schwachen höheren kortikalen Funktionen und weitgehend instinktgesteuertem Verhalten. Solche Vorstellungen flossen in Lehre und klinische Deutung der kolonialen Psychiatrie in Französisch-Nordafrika ein.
    consequences:
      - Rassifizierte psychiatrische Theorie
      - Klinische Deutung nordafrikanischer Patienten
      - Psychiatrische Ausbildung
  - id: british-kenya-1954-1959
    polity: Britisch-Kenia
    summary: 1954 beauftragte die kenianische Kolonialregierung den Psychiater J. C. Carothers mit einer psychologischen Erklärung der Mau-Mau-Bewegung. Sein Bericht stellte die Kikuyu als zwischen „primitiven“ Denkformen und destabilisierender Modernisierung gefangen dar; Kolonialbeamte griffen dieses ethnopsychiatrische Deutungsmuster später bei Internierungs- und „Rehabilitations“-Programmen auf.
    consequences:
      - Deutung der Aufstandsbekämpfung
      - Internierungs- und „Rehabilitations“-Politik
      - Rassifizierte psychiatrische Deutung von Widerstand
