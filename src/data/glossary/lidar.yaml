term: Lidar
aliases:
- LiDAR
shortDefinition: A remote-sensing method that measures distance with laser pulses to build detailed three-dimensional
  maps.
longDefinition: Lidar sends laser pulses toward a surface and measures the returning light to calculate distance.
  Airborne lidar can record enough returns through gaps in vegetation to reconstruct ground topography and reveal
  archaeological features hidden beneath forest canopy.
relatedTerms: []
reviewedAt: '2026-08-21'
sources:
- title: Pre-Columbian earth-builders settled along the entire southern rim of the Amazon
