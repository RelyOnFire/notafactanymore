evidence:
  - id: cardiazol-jama-proposition
    sourceId: cardiazol-jama
    relation: documents
    target: {scope: belief, aspect: proposition}
    note: >-
      Contemporary 1938 clinical paper explicitly states Meduna's theory that schizophrenia and epilepsy were biologically
      antagonistic and describes attempts to cause remission by inducing epileptiform seizures with Metrazol. The
      inspected abstract describes an American series, not British institutional endorsement.
    locator: Finkelman, Steinberg and Liebert (1938), JAMA 110(10):706–709, abstract, opening paragraphs
  - id: cardiazol-history-correction
    sourceId: cardiazol-history
    relation: supports
    target: {scope: belief, aspect: correction}
    note: >-
      Peer-reviewed historical analysis describes the dubious biological-antagonism hypothesis, flawed outcome measurement,
      severe fear and the transition away from Cardiazol. These historical passages do not establish current ECT indications,
      which are sourced separately.
    locator: McCrae (2006), pp. 72–78, 83–86; HAL deposited full text, hal-00570852
  - id: cardiazol-history-impact
    sourceId: cardiazol-history
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: McCrae (2006), pp. 70–71, 78–79, 83–84
    note: >-
      Pages 70–71 establish the late-1938 survey, published in 1939. Pages 83–84 attribute the 1941 assessment to
      Hemphill and Walter and show continued chemical treatment, including Netherne in 1950.
  - id: cardiazol-board-carrier
    sourceId: cardiazol-board-report
    relation: contextualizes
    target: {scope: episode, episodeId: england-wales-1937-1941, aspect: context}
    note: >-
      Bibliographic record of the Board of Control’s official 1938 report on Cardiazol and hypoglycaemic shock treatment.
      The catalogue establishes publication details; the full report was not inspected and this record does not prove
      hospital adoption.
    locator: 'Google Books, bibliographic information: Board of Control report, H.M. Stationery Office, 1938'
  - id: cardiazol-hansard-mechanism
    sourceId: cardiazol-hansard
    relation: documents
    target: {scope: episode, episodeId: england-wales-1937-1941, aspect: mechanism}
    note: >-
      Primary parliamentary record confirming that the Board of Control was preparing a report on Cardiazol treatment.
      The minister said publication was imminent; this announcement does not establish treatment outcomes or hospital
      adoption.
    locator: HC Deb, 14 July 1938, vol. 338, cols. 1515–1516, question 62 and Mr Elliot’s reply
  - id: cardiazol-history-context
    sourceId: cardiazol-history
    relation: contextualizes
    target: {scope: episode, episodeId: england-wales-1937-1941, aspect: context}
    locator: McCrae (2006), pp. 72–78, 83–86; full text deposited as HAL hal-00570852
    note: >-
      Peer-reviewed historical analysis describing Cardiazol as the most widely used major somatic treatment in British
      public mental hospitals in the late 1930s, tracing the dubious biological-antagonism hypothesis, flawed outcome
      measurement, severe fear and the transition away from Cardiazol. Full text is available as HAL deposit hal-00570852;
      modern ECT indications are sourced separately.
  - id: cardiazol-history-consequences
    sourceId: cardiazol-history
    relation: supports
    target: {scope: episode, episodeId: england-wales-1937-1941, aspect: consequences}
    locator: >-
      McCrae (2006), pp. 70–71 (diffusion), 75 (behavioral outcomes), 77–78 (fractures and memory), 78–79 (fear)
    note: >-
      The article documents diffusion, fear, fractures and memory disturbance, including reports of amnesia months
      later. These are treatment risks reported across institutions, not Bexley-specific incidence figures. Contemporary
      claims about structural brain injury were contested; the record therefore states the reported memory effects.
  - id: cardiazol-history-partial-correction
    sourceId: cardiazol-history
    relation: contextualizes
    target: {scope: episode, episodeId: england-wales-1937-1941, aspect: institutional-correction}
    locator: McCrae (2006), pp. 83–84, Electroshock
    note: >-
      The attributed 1941 change in conception and later replacement by ECT provide a history of clinical change.
      Continued use in named hospitals rules out treating 1941 as general cessation; these passages do not document
      a corrective act by the Board or Bexley.
  - id: cardiazol-ncbi-context
    sourceId: cardiazol-ncbi-history
    relation: contextualizes
    target: {scope: episode, episodeId: england-wales-1937-1941, aspect: context}
    note: >-
      Modern historical synthesis identifying Cardiazol as the most widely used somatic treatment for schizophrenia
      and affective disorders in British public mental hospitals and noting that the Maudsley barred trials because
      the induced convulsions caused extreme anxiety and fear.
    locator: Freebody, chapter 6, The Views of Psychiatrists in Paris and London, paragraph with notes 63–66
  - id: cardiazol-cook-proposition
    sourceId: cardiazol-cook
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: Cook (1938), pp. 567, 573–574
    note: >-
      Cook explains Meduna’s hypothesis but explicitly questions it, while endorsing the clinical treatment and describing
      Bexley’s confidence. His account distinguishes treatment promotion from acceptance of its original biological
      rationale.
  - id: cardiazol-qin-correction
    sourceId: cardiazol-qin
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: 'Qin et al. (2005), Results: Main effect of epilepsy; Discussion: Strengths and weaknesses'
    note: >-
      The Danish register cohort documents schizophrenia following epilepsy and an increased associated risk. This
      contradicts mutual exclusion, but the observational study neither tests Cardiazol nor proves causation; its
      analyses use inpatient diagnoses.
  - id: cardiazol-nice-depression-correction
    sourceId: cardiazol-nice-depression
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: NG222, final recommendations 1.13.1–1.13.4
    note: >-
      NICE gives specified circumstances for considering ECT in severe depression, including rapid response and failed
      other treatments, together with risk and consent requirements. This is modern ECT guidance, not evidence for
      historical chemical convulsions.
  - id: cardiazol-nice-ect-correction
    sourceId: cardiazol-nice-ect
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: TA59, final recommendations 1.1–1.4 and 1.9
    note: >-
      Final guidance restricts ECT for catatonia to specified severe circumstances and does not recommend it for general
      schizophrenia management. TA59’s depression guidance has been superseded by NG222; the two sources have distinct
      scopes.
