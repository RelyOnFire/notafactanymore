schemaVersion: 2
locale: de
entryId: dowsing-subsurface-detection
sourceReviewedAt: 2026-09-19
title: Wünschelrutengehen als verlässliche Methode zur Untergrunderkundung
proposition:
  summary: >-
    Geschulte Personen mit Wünschelrute, Pendel oder ähnlichen radiästhetischen Verfahren galten als fähig, verborgenes
    Grundwasser oder geologische Strukturen zuverlässig genug aufzuspüren, um technische Entscheidungen daran auszurichten.
correction:
  summary: >-
    Kontrollierte Untersuchungen haben nicht gezeigt, dass Wünschelrutengehen verlässliche Informationen über verborgenes
    Grundwasser oder geologische Ziele liefert, die über gewöhnliche Umweltinformationen und Zufall hinausgehen. Eine
    Neuauswertung der großen deutschen Scheunenexperimente fand keine reproduzierbare Wünschelrutenleistung. Gerade bei der
    Wassersuche lässt sich scheinbarer Erfolg leicht überschätzen, weil unter großen Teilen der Landschaft Grundwasser vorhanden
    ist. Tiefe, Ergiebigkeit und Qualität lassen sich belastbar nur mit hydrogeologischen, geologischen und geophysikalischen
    Verfahren bestimmen.
episodes:
  - id: soviet-union-1967-1991
    polity: Sowjetunion
    summary: >-
      1967 berief das sowjetische Geologieministerium am Allunionsinstitut für mineralische Rohstoffe VIMS eine Tagung
      mit acht Instituten ein, um das Wünschelrutengehen unter den Begriffen „biophysikalischer Effekt“ und
      „biophysikalische Methode“ systematisch zu untersuchen. Das erste unionsweite Seminar beschloss 1968 ein
      Forschungsprogramm und gründete eine Kommission. Darstellungen Beteiligter beschreiben wiederholte Fachseminare,
      Veröffentlichungen, methodische Hinweise für die geologische Kartierung und Kontakte zu Anwendern in der
      gesamten UdSSR. N. N. Sotschewanows Darstellung von 1989 ordnet die Kommission der wissenschaftlich-technischen
      Popow-Gesellschaft zu, beschreibt die Ausbildung von Anwendern und behandelt das Aufspüren verborgener Ziele als
      innerhalb der Seminare anerkannte Fähigkeit. Eine Darstellung von 1984 behauptete die Anerkennung der Methode
      und verwies auf einen Unterstützungsbrief eines Vizepräsidenten der Akademie der Wissenschaften der UdSSR, ohne
      dessen Datum zu nennen. Sie berichtete zugleich, ein erfolgloser Versuch an der Kursker Magnetanomalie habe die weitere
      Entwicklung des Programms gebremst.
    consequences:
      - Das unionsweite Seminar von 1968 beschloss nach der Ministeriumstagung mit acht Instituten ein Forschungsprogramm
      - Unionsweite Seminare und eine institutionsübergreifende Kommission institutionalisierten Forschung und fachlichen Austausch
      - Für die geologische Kartierung wurden methodische Hinweise zur Anwendung des Verfahrens ausgearbeitet
      - Untersucht wurde der Einsatz zur Suche nach Erz, Grundwasser, Erdöl, Verwerfungen und anderen Untergrundzielen
    institutions:
      - Institutionsübergreifende Kommission zum biophysikalischen Effekt (auch als Kommission für Biolokation bezeichnet) beim Zentralvorstand der wissenschaftlich-technischen A.-S.-Popow-Allunionsgesellschaft für Radiotechnik, Elektronik und Nachrichtentechnik
    institutionalContext: >-
      Die Ministeriumstagung begründete eine Forschungsinitiative, keine Anerkennung der Wünschelrute durch das
      gesamte Ministerium. Die Darstellung von 1984 erwähnt den gescheiterten Kursk-Versuch und veröffentlichte
      geologische Kritik, liefert aber kein Protokoll, das einen kontrollierten Versuchsaufbau belegt. Die darin
      behauptete Unterstützung aus der Akademie belegt keine akademieweite Billigung; der Originalbrief und sein Datum
      sind nicht verifiziert. Die Kommission förderte das Verfahren dennoch durch Seminare und Anwendungshinweise.
      Ihre Teilnehmerdarstellung von 1989 hielt eine breite Einführung für verfrüht, empfahl aber Anwendungen durch
      erfahrene Personen. Die Episodendaten begrenzen die belegte Kommissionstätigkeit, nicht einen nachgewiesenen
      Zeitpunkt ihrer Einstellung. Der Herausgeber des Nachdrucks von 2011 bringt die Einstellung allgemein mit Krise
      und Auflösung der UdSSR in Verbindung.
    mechanism:
      summary: >-
        Die institutionsübergreifende Kommission bei der Popow-Gesellschaft organisierte Seminare, methodische
        Hinweise und Anwenderschulungen zur „biophysikalischen“ beziehungsweise Biolokationsmethode. Sie vermittelte
        deren behauptete Fähigkeit zur Erkundung verborgener Ziele und förderte praktische Anwendungen.
    institutionalCorrection:
      summary: >-
        Die geprüften Quellen dokumentieren interne Kritik und erfolglose Tests, aber keinen datierten Beschluss der
        Kommission, der die Methode formell verwarf. Die hier zuletzt herangezogene Teilnehmerdarstellung stammt von
        1989; der spätere redaktionelle Bericht über die Einstellung belegt keine institutionelle Korrektur.
    periodLabel: 1968–1989 belegte Kommissionstätigkeit; vorbereitende Tagung 1967
  - id: germany-1991-1995
    polity: Deutschland
    summary: >-
      Die bundeseigene Entwicklungshilfeorganisation GTZ setzte Wünschelrutengänger praktisch in Trinkwasserprojekten
      unter anderem in Sri Lanka, auf den Philippinen, im Kongo und in Kenia ein. Eine zeitgenössische Meldung von
      1991 zitierte den Leiter des GTZ-Bereichs Wasser, Abfallwirtschaft und Ressourcenschutz mit einer auf schwierige
      geologische Bedingungen beschränkten Anwendung. Ein Katalog verzeichnet eine zweite Ausgabe von Hans-Dieter
      Betz' GTZ-Fachbericht zur unkonventionellen Wasserprospektion von 1993. Sein Beitrag von 1995 stellte eine Reihe
      von GTZ-Projekten als Beleg dafür dar, ausgewählte Rutengänger ergänzend in die Grundwasserprospektion
      einzubeziehen. Kontrollierte Evidenz belegt jedoch nicht, dass die Wünschelrute selbst gegenüber gewöhnlichen
      Hinweisen und Zufall reproduzierbare zusätzliche Informationen liefert.
    consequences:
      - Wünschelrutengänger bestimmten Bohrstellen in internationalen Trinkwasserprojekten mit
      - Das Verfahren wurde in schwierigen Trockengebieten neben konventioneller hydrogeologischer und geophysikalischer Erkundung eingesetzt
      - Die GTZ veröffentlichte einen technischen Bericht über Feldtests der Wünschelrute zur Wasserprospektion
    institutions:
      - Deutsche Gesellschaft für Technische Zusammenarbeit (GTZ)
    institutionalContext: >-
      Die GTZ setzte Wünschelrutengehen in bestimmten Projekten ergänzend zur Hydrogeologie ein, nicht als deren
      Ersatz. Der zeitgenössische Bericht von 1991 beschreibt eine „pragmatische“ Kombination konventioneller und
      unkonventioneller Prospektion unter besonders schwierigen geologischen Bedingungen, wobei Rutengänger in
      einzelnen Auslandsprojekten bei der Wahl von Bohrstellen mitwirkten. Parallel dazu erzeugte staatlich
      finanzierte deutsche Wünschelrutenforschung umstrittene positive Befunde; eine spätere fachwissenschaftliche
      Neuauswertung der Scheunenexperimente fand jedoch keine reproduzierbare Leistung und hielt die Ergebnisse für
      mit Zufall vereinbar. Der Feldbericht von 1995 verortet den Beginn des Projekts in Sri Lanka zwei Jahre nach
      1980 und erfasst bis März 1993 vorliegende Ergebnisse. Diese Daten begrenzen Projekt- und Berichtszeitraum,
      nicht ein belegtes Ende der GTZ-Nutzung. Betz räumte ein, dass diese praktischen Projekte nicht die
      experimentelle Kontrolle eigens geplanter wissenschaftlicher Versuche boten.
    mechanism:
      summary: >-
        Die GTZ band ausgewählte Wünschelrutengänger neben konventionellen Verfahren in internationale
        Wasserprospektionsprojekte ein und veröffentlichte technisches Material über Feldtests der Methode. Die
        Leitung ihres Wasserbereichs beschrieb diese Kombination öffentlich als praktische Option unter schwierigen
        geologischen Bedingungen.
    institutionalCorrection:
      summary: >-
        Eine spätere wissenschaftliche Neuauswertung verwarf reproduzierbare Wünschelrutenleistung, doch die
        verfügbaren Quellen zeigen keinen datierten GTZ-Beschluss, der die frühere operative Nutzung formell
        zurücknahm oder verwarf.
    periodLabel: Projekte ab 1982; Ergebnisse bis März 1993, veröffentlicht 1995
  - id: austria-2020-2026
    polity: Österreich
    summary: >-
      Österreichische Landwirtschaftskammern veröffentlichten Wünschelrutengehen als praktische Hilfe bei der
      Wasserversorgung und nicht bloß als Beschreibung eines Volksglaubens. Ein 2020 auf der Website der
      Landwirtschaftskammer Oberösterreich erschienener Beitrag erklärt, Rute und Pendel könnten konkrete Fragen zu
      Brunnen und Quellen verlässlich klären und geübte Rutengänger hätten sehr hohe Erfolgschancen. Er beschreibt
      außerdem eine fortdauernde Zusammenarbeit der Landwirtschaftskammer Oberösterreich mit einem Rutengänger, der
      erstmals 1994 bei der Entwässerung eines Rutschhanges eingesetzt worden war. Das Verzeichnis des nationalen
      Dachverbands von 2022 verbreitet die Reihe zur Wasserknappheit und führt den Wünschelrutenbeitrag ausdrücklich
      auf. Die Landwirtschaftskammern Steiermark und Kärnten veröffentlichten 2024 aktualisierte Hinweise, wonach die
      Wünschelrute bei nachlassender Quellschüttung wertvolle Dienste leisten könne.
    consequences:
      - Offizielle landwirtschaftliche Beratung empfiehlt Rute und Pendel zur Diagnose von Problemen an Brunnen und Quellen
      - Die Hinweise schreiben geübten Rutengängern im Vergleich zu anderen Methoden sehr hohe Erfolgschancen zu
      - Die Landwirtschaftskammer Oberösterreich berichtet von wiederholten Vermittlungen an einen Rutengänger, zu dem seit einem Entwässerungsprojekt von 1994 Kontakt bestand
      - Aktualisierte Kammerinformationen von 2024 stellten Wünschelrutengehen weiterhin als Hilfe bei Wasserknappheit dar
    institutions:
      - Landwirtschaftskammer Österreich
      - Landwirtschaftskammer Oberösterreich
      - Landwirtschaftskammer Steiermark
      - Landwirtschaftskammer Kärnten
    institutionalContext: >-
      Belegt sind veröffentlichte Beratung und die berichtete Vermittlungsgeschichte; die Quellen begründen keine
      gesetzliche technische Vorgabe. Die Landwirtschaftskammern der Länder sind durch Landesgesetz eingerichtet, ihr
      nationaler Dachverband ist hingegen ein Verein. Die Landesbeiträge schreiben geschulten Anwendern verlässliche
      diagnostische Aussagekraft und hohe Erfolgschancen zu und beschreiben die fortdauernde Beziehung der
      Landwirtschaftskammer Oberösterreich zu einem Rutengänger. Der Endpunkt 2026 bezeichnet die weitere Abrufbarkeit
      dieser Hinweise, keine unabhängig verifizierten neuen Vermittlungen im Jahr 2026.
    mechanism:
      summary: >-
        Landwirtschaftskammern der Länder veröffentlichten Wünschelrutengehen als praktische Beratung, schrieben
        geschulten Anwendern verlässliche Diagnosefähigkeit zu und beschrieben die Vermittlung an einen Rutengänger
        durch die Landwirtschaftskammer Oberösterreich. Der nationale Dachverband verbreitete die Beratungsreihe über
        sein Verzeichnis.
    institutionalCorrection:
      periodLabel: Hinweise von 2024 im September 2026 weiterhin veröffentlicht
      summary: >-
        Die im November 2024 veröffentlichten Hinweise aus der Steiermark und Kärnten empfahlen Wünschelrutengehen bei
        Wasserknappheit weiterhin und waren bei der Prüfung im September 2026 ohne Korrektur dieser Empfehlungen
        abrufbar. Der offene, unkorrigierte Status bezieht sich auf diese veröffentlichten Hinweise; er belegt keinen
        neuen institutionellen Beschluss und keine neue Vermittlung im Jahr 2026.
    periodLabel: Beratungstexte von 2020–2024; im September 2026 weiterhin abrufbar
evidence:
  - id: dowsing-usgs-correction
    note: >-
      Erläutert, warum scheinbarer Erfolg bei der Grundwassersuche kein Beleg für die Wirksamkeit der Wünschelrute
      ist, und hält fest, dass Tiefe, Menge und Qualität des Grundwassers mit hydrologischen, geologischen und
      geophysikalischen Methoden zu bestimmen sind.
  - id: dowsing-soviet-proposition
    note: >-
      Reproduziert die spätsowjetische Institutionsgeschichte des Programms mit der Tagung des Geologieministeriums
      1967, beteiligten Instituten, Seminaren, institutionsübergreifender Kommission, methodischen Hinweisen, dem
      gescheiterten Kursk-Versuch, veröffentlichter Kritik und der von den Autoren behaupteten Unterstützung auf
      Akademieebene.
  - id: dowsing-soviet-carrier
    note: >-
      Verzeichnet eine 2008 erschienene Sammlung aus dem Archiv der Institutionsübergreifenden Kommission zum
      biophysikalischen Effekt und bezeichnet sie als Rückblick auf vierzig Jahre wissenschaftlicher
      Wünschelrutenforschung in der UdSSR. Der Katalog nennt die Zuordnung zur Popow-Gesellschaft; geprüft wurde nur
      der bibliografische Nachweis, nicht die Sammlung selbst.
  - id: dowsing-soviet-mechanism
    note: >-
      Reproduziert die spätsowjetische Institutionsgeschichte des Programms mit der Tagung des Geologieministeriums
      1967, beteiligten Instituten, Seminaren, institutionsübergreifender Kommission, methodischen Hinweisen, dem
      gescheiterten Kursk-Versuch, veröffentlichter Kritik und der von den Autoren behaupteten Unterstützung auf
      Akademieebene. Es handelt sich um eine 2011 nachgedruckte Teilnehmerdarstellung; sie verifiziert weder das
      Verfahren noch den Akademiebrief unabhängig.
  - id: dowsing-soviet-consequences
  - id: dowsing-gtz-carrier
    note: >-
      Zeitgenössischer Bericht von 1991 über den operativen Einsatz von Wünschelrutengängern durch die GTZ, die
      zuständige Leitung des Wasserbereichs und die erklärte pragmatische Kombination mit konventioneller Prospektion
      unter schwierigen Bedingungen.
  - id: dowsing-gtz-mechanism
    note: >-
      Bibliografischer Nachweis der zweiten Ausgabe der GTZ-Fachpublikation von 1993 über Feldtests der Wünschelrute
      zur Wassersuche in Trockengebieten; dokumentiert, dass die bundeseigene Organisation die Methode selbst als
      technisches Thema veröffentlichte. Geprüft wurde der Katalog; die vollständige 73-seitige Publikation lag für
      diese Prüfung nicht vor.
  - id: dowsing-gtz-consequences
  - id: dowsing-scheunen-context
    note: >-
      Die verzeichnete fachwissenschaftliche Neuauswertung von 1995 betrifft die deutschen Scheunenexperimente. Hier
      waren nur Verlagsmetadaten zugänglich. In seiner gesondert verzeichneten Darstellung von 1999 erläutert Enright,
      dass sich vermeintliche Spitzenleistungen nicht reproduzieren ließen und die Ergebnisse mit Zufall vereinbar
      waren. Dies ist wissenschaftlicher Kontext, kein Rücknahmebeschluss der GTZ.
  - id: dowsing-austria-proposition
    note: >-
      Stabiles nationales Kammerverzeichnis der Reihe zur Wasserknappheit, das Teil 6 über die Wünschelrute
      ausdrücklich aufführt und die Reihe als praktische Beratung zu Brunnen und Quellen präsentiert. Es handelt sich
      um das Verzeichnis des nationalen Dachverbands vom 31. März 2022, nicht um den Landesbeitrag von 2020 selbst.
  - id: dowsing-austria-carrier
    note: >-
      Die Landesquelle erklärt, Rute und Pendel könnten konkrete Fragen zu Brunnen und Quellen verlässlich klären,
      schreibt geschulten Rutengängern sehr hohe Erfolgschancen zu und beschreibt die fortdauernde Zusammenarbeit und
      Vermittlung der Kammer.
  - id: dowsing-austria-mechanism
  - id: dowsing-austria-consequences
    note: >-
      Kammerinformation vom November 2024, wonach die Wünschelrute bei Wasserknappheit wertvolle Hilfe leisten könne;
      wiederholt Behauptungen über Wasseradern, sensorische Erkennung, verlässliche Diagnose und hohe Erfolgschancen.
  - id: dowsing-austria-carinthia-context
    note: >-
      Aktualisierte Kammerinformation vom November 2024, wonach Wünschelrutengehen bei Wasserknappheit wertvolle Hilfe
      leisten könne; wiederholt den behaupteten sensorischen Mechanismus und praktische Empfehlungen.
  - id: dowsing-austria-uncorrected
    note: >-
      Der Beitrag empfiehlt Wünschelrutengehen weiterhin. Dies belegt fortbestehende veröffentlichte Beratung, keine
      neu verifizierte Vermittlung oder Entscheidung im Jahr 2026.
  - id: dowsing-commission-carrier
    note: >-
      Sotschewanows Teilnehmerdarstellung nennt die institutionelle Zuordnung der Kommission und beschreibt Seminare,
      Anwendungshinweise und Schulungen, die die behauptete Fähigkeit voraussetzen. Gelesen wurde ein HTML-Nachdruck
      von 2013 des Beitrags von 1989, kein Scan des Originalhefts und keine unabhängige Validierung. Der Bericht warnt
      vor einer breiten Einführung und befürwortet zugleich ausgewählte Anwendungen.
  - id: dowsing-commission-mechanism
  - id: dowsing-commission-consequences
  - id: dowsing-commission-dates
  - id: dowsing-soviet-qualifications
  - id: dowsing-soviet-usgs-context
    note: >-
      Erläutert, warum scheinbarer Erfolg bei der Grundwassersuche kein Beleg für die Wirksamkeit der Wünschelrute
      ist, und hält fest, dass Tiefe, Menge und Qualität des Grundwassers mit hydrologischen, geologischen und
      geophysikalischen Methoden zu bestimmen sind.
  - id: dowsing-gtz-adoption
  - id: dowsing-gtz-publication
  - id: dowsing-gtz-field-mechanism
    note: >-
      Betz beschreibt praktische Projekte und befürwortet die Einbeziehung ausgewählter Rutengänger. Auf Druckseite 4
      räumt er begrenzte experimentelle Kontrolle und unvollständige Daten ein. Der Feldbericht belegt Praxis und
      Befürwortung, nicht, dass Wünschelrutengehen verlässliche zusätzliche Informationen liefert. Der Beitrag von
      1995 wurde in der verlinkten Volltextkopie gelesen.
  - id: dowsing-gtz-field-consequences
  - id: dowsing-gtz-field-dates
    note: >-
      Der Beginn 1982 ergibt sich aus der ausdrücklichen relativen Datierung im Bericht. März 1993 ist sein
      Datenstand, 1995 das Publikationsjahr. Diese Grenzen belegen nicht, wann die GTZ den Wünschelruteneinsatz
      beendete.
  - id: dowsing-gtz-scientific-context
    note: >-
      Enrights zugängliche Darstellung untersucht sämtliche Testergebnisse und die Wiederholungsversuche
      vermeintlicher Spitzenleister. Sie erläutert die fehlende Reproduzierbarkeit und die Vereinbarkeit mit Zufall
      und verweist auf seine Analysen von 1995 und 1996. Es handelt sich um kontrollierte Münchner Experimente,
      getrennt von den praktischen GTZ-Feldprojekten.
  - id: dowsing-gtz-usgs-context
    note: >-
      Liefert die heutige hydrologische Korrektur: Scheinbarer Erfolg bestätigt Wünschelrutengehen nicht; für eine
      verlässliche Grundwassercharakterisierung sind konventionelle hydrologische, geologische und geophysikalische
      Belege erforderlich.
  - id: dowsing-enright-correction
  - id: dowsing-austria-published-proposition
  - id: dowsing-austria-styria-carrier
  - id: dowsing-austria-carinthia-carrier
  - id: dowsing-austria-carinthia-uncorrected
  - id: dowsing-austria-organisation
    note: >-
      Die eigene Organisationsbeschreibung unterscheidet die durch Landesgesetz eingerichteten Kammern von ihrem
      nationalen Verein, der Präsidentenkonferenz. Sie liefert institutionellen Kontext, keinen Wirksamkeitsbeleg für
      die Wünschelrute.
  - id: dowsing-austria-usgs-context
    note: >-
      Liefert die heutige hydrologische Korrektur und erklärt, warum scheinbarer Erfolg bei der Wassersuche das
      Wünschelrutengehen nicht bestätigt.
