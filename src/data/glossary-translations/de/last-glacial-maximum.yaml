entryId: last-glacial-maximum
sourceReviewedAt: '2026-08-21'
term: Letztes Glaziales Maximum
aliases:
- LGM
shortDefinition: Die jüngste Phase, in der die globalen Eisschilde ihre größte Ausdehnung erreichten, ungefähr vor 26.500
  bis 19.000 Jahren.
longDefinition: Das Letzte Glaziale Maximum oder LGM war die kälteste große Phase gegen Ende der letzten Eiszeit. Große
  kontinentale Eisschilde bedeckten weite Teile des nördlichen Nordamerikas und Eurasiens, und der globale Meeresspiegel
  lag deutlich niedriger als heute. Belege für Menschen in Nordamerika während dieser Phase verändern die Chronologie
  und mögliche Routen der Besiedlung Amerikas.
