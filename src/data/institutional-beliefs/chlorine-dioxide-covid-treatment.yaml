    locator: Circular dated 26 June 2020, p. 1
    note: >-
      AGEMED stated before promulgation that the marketed products were not authorized medicines, had no registration
      supporting safety, quality or efficacy, lacked evidence against COVID-19 and posed serious health risks.
  - id: chlorine-agemed-67-context
    sourceId: chlorine-agemed-67
    relation: contextualizes
    target: {scope: episode, episodeId: bolivia-2020-2023, aspect: context}
    locator: Circular dated 8 July 2020, p. 1
    note: >-
      AGEMED again stated that no scientific evidence supported treatment and directed proponents to submit properly
      approved clinical-study protocols if they wished to generate evidence.
  - id: chlorine-ministry-context
    sourceId: chlorine-ministry-committee
    relation: contextualizes
    target: {scope: episode, episodeId: bolivia-2020-2023, aspect: context}
    locator: Communiqué dated 20 July 2020
    note: >-
      The Health Ministry denied institutional recognition to the self-described committee promoting chlorine dioxide and
      said its proposed protocols lacked a scientific basis and put lives at risk.
  - id: chlorine-tcp-2022-mechanism
    sourceId: chlorine-tcp-2022
    relation: documents
    target: {scope: episode, episodeId: bolivia-2020-2023, aspect: mechanism}
    locator: SCP 0052/2022-S2, judgment pp. 19–21
    note: >-
      The Tribunal relied on Law 1351, especially Articles 5 and 6, and confirmed relief requiring the hospital to allow
      outside specialized medical personnel to assess and provide the requested treatment.
  - id: chlorine-tcp-2022-consequences
    sourceId: chlorine-tcp-2022
    relation: documents
    target: {scope: episode, episodeId: bolivia-2020-2023, aspect: consequences}
    locator: SCP 0052/2022-S2, judgment pp. 20–21
    note: >-
      The holding made statutory access effective in the particular hospital case. It did not require the hospital's own
      doctors to administer the product and did not independently determine clinical efficacy.
