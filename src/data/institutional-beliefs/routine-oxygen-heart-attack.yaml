schemaVersion: 2
title: Routine oxygen for uncomplicated heart attacks
entryId: all-heart-attack-patients-need-oxygen
proposition:
  summary: >-
    Supplemental oxygen was professionally recommended for routine early use in uncomplicated heart-attack patients even when blood oxygen was not low, because raising available oxygen was expected to help ischemic heart muscle.
correction:
  summary: >-
    Supplemental oxygen is indicated for acute coronary syndrome when hypoxemia or respiratory compromise is present. In patients whose oxygen saturation is already at least 90%, randomized trials have not shown cardiovascular benefit from routine oxygen, and current U.S. guidelines recommend against it.
category: Emergency cardiology and treatment guidelines
reviewedAt: '2026-08-27'
impact:
  summary: Oxygen became a reflexive part of heart-attack care despite weak evidence for normoxic patients. Professional guidelines helped preserve that practice into the twenty-first century. Trials later showed no improvement in survival or recurrent infarction, while hyperoxia can increase coronary vascular resistance and oxidative stress.
  highlights:
    - value: '2004'
      label: ACC/AHA STEMI guideline said oxygen for all uncomplicated patients during the first six hours was reasonable
    - value: '6,629'
      label: Patients in the DETO2X-AMI randomized trial of routine oxygen versus ambient air
    - value: '2025'
      label: U.S. ACS guideline classified routine oxygen at saturation 90% or higher as Class III — No Benefit
  context:
    - "The 2004 recommendation was Class IIa with Level of Evidence C: it said routine oxygen was reasonable, not mandatory, and rested mainly on expert judgment rather than strong outcome trials."
    - Oxygen remains an essential treatment for hypoxemia and respiratory distress. The corrected proposition concerns automatic oxygen for patients whose blood is already adequately oxygenated.
episodes:
  - id: united-states-acc-aha-2004-2013
    polity: United States
    region: North America
    startYear: 2004
    endYear: 2013
    strength: officially-endorsed
    institutionTypes:
      - professional
      - medical
    institutions:
      - American College of Cardiology
      - American Heart Association
    institutionalContext: The 2004 ACC/AHA guideline for ST-elevation myocardial infarction gave a Class IIa recommendation that supplemental oxygen was reasonable for all patients with uncomplicated STEMI during the first six hours, while separately giving a Class I recommendation for patients with oxygen saturation below 90%. By 2013 the STEMI guideline acknowledged that few data supported or refuted routine oxygen, cited a pooled signal of possible harm and emphasized oxygen for hypoxemia. Subsequent trials made the shift more definitive.
    consequences:
      - Professional guidance reinforced routine oxygen use in normoxic heart-attack patients despite the absence of strong evidence that it improved clinical outcomes
      - Patients could receive unnecessary oxygen even when hemoglobin was already adequately saturated
      - Hyperoxia can increase coronary vascular resistance and oxidative stress, creating plausible mechanisms of harm without demonstrated compensating benefit in normoxic patients
      - Large randomized trials later found no reduction in mortality or recurrent myocardial infarction from routine oxygen in patients without hypoxemia
    summary: "The routine oxygen mask survived because the physiology sounded obvious: an obstructed coronary artery was starving myocardium of oxygen, so supplying more oxygen seemed protective. The 2004 ACC/AHA STEMI guideline still called oxygen for every uncomplicated patient during the first six hours reasonable, although the evidence level was only C. By 2013 the same guideline process openly acknowledged the lack of supporting data and possible harm. DETO2X-AMI then randomized 6,629 patients and found no mortality or reinfarction benefit. Current ACC/AHA guidance gives routine oxygen in ACS patients with saturation of at least 90% a Class III 'No Benefit' recommendation."
    mechanism:
      kind: standard-setting
      summary: >-
        The 2004 ACC/AHA STEMI guideline encoded routine oxygen as a Class IIa, Level C recommendation for all uncomplicated patients during the first six hours, distinct from its Class I recommendation for patients with oxygen saturation below 90%.
    institutionalCorrection:
      status: corrected
      periodLabel: 2013–2025
      summary: >-
        ACC/AHA guidance progressively narrowed oxygen use to hypoxemic patients, culminating in the 2025 Class III — No Benefit recommendation against routine oxygen when saturation is at least 90%.
