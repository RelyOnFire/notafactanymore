    publisher: Institute of National Remembrance (Poland)
    note: >-
      Archival transcription of Lavrentiy Beria's proposal and the Politburo approval, signed by Stalin and other
      senior Soviet leaders, ordering execution by shooting under a special procedure.
  - title: Janowiec and Others v. Russia — decision on admissibility
    url: https://hudoc.echr.coe.int/app/conversion/pdf/?filename=001-105727.pdf&id=001-105727&library=ECHR
    publisher: European Court of Human Rights
    note: >-
      Judicial summary of the archival record: the 5 March 1940 Politburo decision; the 21,857 total and 4,421 Katyn
      Forest figure in Shelepin's 1959 memorandum; the Soviet German-guilt claim; the Burdenko report; the Nuremberg
      allegation; and the recommendation to destroy victims' records.
  - title: Records Relating to the Katyn Forest Massacre at the National Archives
    url: https://www.archives.gov/research/foreign-policy/katyn-massacre
    publisher: U.S. National Archives and Records Administration
    note: >-
      Official archival overview describing the 1943 German-organized international medical commission, its
      conclusion that the deaths occurred in 1940, and the later unanimous U.S. congressional finding of NKVD responsibility.
  - title: The Katyn Massacre timeline — 1943
    url: https://katyn.ipn.gov.pl/kat/histori/kalendarium-1/3599%2C1943.html
    publisher: Institute of National Remembrance (Poland)
    note: >-
      Official historical chronology dating the Soviet Information Bureau response blaming the German side to
      15 April 1943.
  - title: 1990–2005 — Katyn chronology
    url: https://katyn.ipn.gov.pl/kat/histori/kalendarium-1/3605%2C19902005.html
    publisher: Institute of National Remembrance (Poland)
    note: >-
      Records the 13 April 1990 TASS communiqué acknowledging direct responsibility of Beria, Merkulov and their
      NKVD subordinates and calling Katyn one of the gravest crimes of Stalinism.
- id: polish-peoples-republic-1944-1989
  polity: Polish People's Republic
  region: Europe
  startYear: 1944
  endYear: 1989
  periodLabel: 1944–1989
  strength: enforced-doctrine
  institutionTypes:
  - government
  - education
  institutions:
  - Polish Workers' Party / Polish United Workers' Party
  - state censorship apparatus of the Polish People's Republic
  institutionalContext: >-
    Soviet-backed Polish communist institutions adopted the German-guilt account while the new regime was being
    established. In the Stalinist period it was propagated directly; later authorities often preferred silence,
    but censorship rules continued to prohibit attributing the officers' deaths to the USSR. State historiography,
    publishing and broadcasting operated within that boundary. People who publicly challenged it could face
    censorship, harassment or other repression. By the second half of 1989, collapsing communist control made open
    publication of Soviet responsibility possible without the former restrictions.
  consequences:
  - Censorship of publications attributing Katyn to the Soviet Union
  - State-controlled historical and media narratives that suppressed or distorted responsibility
  - Harassment and repression of writers, journalists, families and activists who challenged the authorized account
  - Distortion of legal and public records concerning victims' dates and circumstances of death
  summary: >-
    In communist Poland the Soviet Katyn account became more than an allied government's claim: it was an enforced
    boundary on public history. The authorities initially repeated German responsibility directly and later often
    tried to erase the subject from public discussion, while censorship instructions prohibited assigning blame
    to the USSR. IPN documentation records repression and harassment of people who publicized Soviet responsibility.
    The doctrine lost enforceability during Poland's political transformation in 1989, several months before the
    USSR itself formally admitted NKVD responsibility.
  sources:
  - title: The Katyn lie — its rise and duration
    url: https://eng.ipn.gov.pl/en/digital-resources/articles/7303%2CThe-Katyn-lie-Its-rise-and-duration.html
    publisher: Institute of National Remembrance (Poland)
    note: >-
      Institutional history of the Soviet and Polish state narrative, including censorship, official historiography,
      the weakening of restrictions in 1989 and the Soviet admission in 1990.
  - title: The Katyn case in the activity of the opposition in the Polish People's Republic
    url: https://ipn.gov.pl/pl/historia-z-ipn/archiwum/126832%2CEdyta-Krezolek-O-prawde-i-pamiec-Sprawa-Katynia-w-dzialalnosci-opozycji-w-PRL.html
    publisher: Institute of National Remembrance (Poland)
    note: >-
      Reproduces a censorship instruction forbidding attempts to assign responsibility for the deaths of the Polish
      officers at Katyn to the USSR and describes opposition efforts to break the enforced silence.
  - title: In the Polish People's Republic — Black Book of Censorship
    url: https://katyn.ipn.gov.pl/kat/histori/klamstwo/po-wojnie/12132%2CW-PRL-u-Czarna-Ksiega-cenzury.html
    publisher: Institute of National Remembrance (Poland)
    note: >-
      Describes censorship, state historiography, harassment of victims' families, journalists and writers, and
      repression of attempts to publicize Soviet responsibility.
