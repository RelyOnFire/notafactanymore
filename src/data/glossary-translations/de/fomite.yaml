term: Fomit
aliases: []
shortDefinition: Ein unbelebter Gegenstand oder eine Oberfläche, die infektiöses Material tragen und zur Übertragung beitragen
  kann.
longDefinition: Ein Fomit ist ein unbelebter Gegenstand oder eine Oberfläche, die kontaminiert werden und zur Übertragung
  eines Erregers beitragen können. Wie wichtig die Übertragung über Fomiten ist, hängt stark vom jeweiligen Erreger ab; bei
  Gelbfieber galten kontaminierte Gegenstände historisch als verdächtig, tatsächlich erwiesen sich Mücken als der entscheidende
  Übertragungsweg.
