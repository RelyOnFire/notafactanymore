  locator: >-
    Introduction; IV, Abuse of Women in Custody (including the 1986 case at note 46); V, Abuse of Female Students;
    VII, The Role of Doctors; passages on judicial/prosecutorial authorization.
  note: >-
    The custody, school and medical sections describe institutions ordering or facilitating examinations and doctors
    producing findings for police or disciplinary purposes. The authorization discussion separates these practices
    from the legal conditions governing an examination.
- id: virginity-turkey-consequences
  sourceId: virginity-turkey-hrw
  relation: supports
  target:
    scope: episode
    episodeId: turkey-1986-1998
    aspect: consequences
  locator: >-
    Introduction; IV, Abuse of Women in Custody (including the 1986 case at note 46); V, Abuse of Female Students;
    VII, The Role of Doctors; passages on judicial/prosecutorial authorization.
  note: >-
    The report describes coercive examinations, disciplinary and policing uses, punishment or surveillance of
    women and girls, and reported physical and psychological harm. These are documented cases and patterns in
    the investigation, not a national count of all affected people.
- id: virginity-turkey-correction
  sourceId: virginity-turkey-1999
  relation: documents
  target:
    scope: episode
    episodeId: turkey-1986-1998
    aspect: institutional-correction
  locator: >-
    Section 5, Women: paragraph on the late-1998 regulation, the request exception, apparent reduction in testing
    and absence of sanctions.
  note: >-
    The 1999 country report records a late-1998 government regulation prohibiting the traditional practice unless
    requested by the woman. It reports an apparent reduction in testing and enforcement limitations, including
    no sanctions against violators. This supports a restricted institutional response, with the request exception
    intact, rather than universal abolition.
- id: virginity-iran-carrier
  sourceId: virginity-iran-system
  relation: supports
  target:
    scope: episode
    episodeId: iran-2014-2026
    aspect: carrier
  locator: Abstract, Modern forensic medicine and the medico-legal system in Iran, 9(1), 12–14 (2002), DOI 10.1054/jcfm.2002.0533.
  note: >-
    The article’s abstract describes the Legal Medicine Organization as an official body of Iran’s judiciary whose
    medico-legal centres provide expert reports requested by courts, judges and administrative authorities. This
    establishes institutional background. The inspected abstract does not establish a 2002 adoption date for virginity
    testing; practice-specific evidence comes from the separate Tehran interview study.
- id: virginity-iran-mechanism
  sourceId: virginity-iran-study
  relation: supports
  target:
    scope: episode
    episodeId: iran-2014-2026
    aspect: mechanism
  locator: >-
    Introduction; Methods 2.1, Tehran fieldwork in 2014; Results on legal necessity, diagnostic uncertainty and
    psychological/social consequences; Discussion limitations.
  note: >-
    The primary study reports 2014 fieldwork in forensic medical centres and government gynaecology clinics in
    Tehran. Interviewees describe virginity examinations on civil and criminal court orders and uses involving
    marriage, divorce, welfare placement, alleged assault and certificates. They also describe diagnostic uncertainty,
    consent conflicts and possible psychological or social consequences. These qualitative accounts document practice
    and reported experiences; they neither validate the examination nor establish national prevalence.
- id: virginity-iran-consequences
  sourceId: virginity-iran-study
  relation: supports
  target:
    scope: episode
    episodeId: iran-2014-2026
    aspect: consequences
  locator: >-
    Introduction; Methods 2.1, Tehran fieldwork in 2014; Results on legal necessity, diagnostic uncertainty and
    psychological/social consequences; Discussion limitations.
  note: >-
    Results describe court-ordered examinations, certificates and legal applications, alongside practitioners’
    accounts of psychological and social risks, including violence and self-harm. Those experiences and concerns
    should remain attributed to the interviews; the study does not estimate the incidence or causal effect of
    each harm nationally.
- id: virginity-iran-ongoing
  sourceId: virginity-iran-2026
  relation: contextualizes
  target:
    scope: episode
    episodeId: iran-2014-2026
    aspect: context
  locator: >-
    Assessment paragraph on possible testing of young women and section 9.3.4; distinguish the April 2026 assessment
    from the dates of the underlying reporting.
  note: >-
    The April 2026 country assessment reports that authorities may attempt virginity testing of young women in
    some circumstances, while noting that available evidence does not establish prevalence. Its underlying observations
    have their own dates. It supplies qualified later context, not evidence of a corrective process or uninterrupted
    annual use since the fieldwork.
- id: virginity-india-carrier
  sourceId: virginity-india-hrw
  relation: supports
  target:
    scope: episode
    episodeId: india-2005-2013
    aspect: carrier
  locator: >-
    The Use of the Finger Test in India; note 74 (2005/2007 textbooks); hospital forms around note 77; judicial-use
    discussion around notes 89–90.
  note: >-
    Documents institutional use through forensic-medicine textbooks published in 2005 and 2007, public-hospital
    forms and examination practice, and courts’ reliance on supposed signs of sexual habituation. The report describes
    how findings could be used against survivors’ credibility or to imply consent, and records distress associated
    with examinations. Its examples and reviewed judgments do not establish identical conduct at every institution.
- id: virginity-india-mechanism
  sourceId: virginity-india-hrw
  relation: supports
  target:
    scope: episode
    episodeId: india-2005-2013
    aspect: mechanism
  locator: >-
    The Use of the Finger Test in India; note 74 (2005/2007 textbooks); hospital forms around note 77; judicial-use
    discussion around notes 89–90.
  note: >-
    Textbook prescriptions, examination forms and the judicial-use discussion show how finger examinations and
    observations about hymenal condition or vaginal laxity were converted into medico-legal judgments about prior
    sexual activity.
- id: virginity-india-consequences
  sourceId: virginity-india-hrw
  relation: supports
  target:
    scope: episode
    episodeId: india-2005-2013
    aspect: consequences
  locator: >-
    The Use of the Finger Test in India; note 74 (2005/2007 textbooks); hospital forms around note 77; judicial-use
    discussion around notes 89–90.
  note: >-
    The report connects invasive examinations and sexual-history statements in medical reports with attacks on
    survivors’ credibility, implications of consent and further distress. These documented uses support the listed
    consequences without implying that prior sexual experience establishes consent to a particular act.
- id: virginity-india-2013-correction
  sourceId: virginity-india-2013
  relation: documents
  target:
    scope: episode
    episodeId: india-2005-2013
    aspect: institutional-correction
  locator: >-
    Criminal Appeal 1226/2011: privacy, integrity and dignity passages numbered 12–13 in this reproduction; compare
    the quotation in paragraph 61 of the official 2022 judgment.
  note: >-
    The reproduced Lillu judgment rejects the two-finger test’s intrusion on privacy, physical and mental integrity
    and dignity. The official 2022 judgment independently quotes the relevant reasoning. This source supports
    the 2013 judicial response, not universal later compliance. The reproduction’s header and footer disagree
    on the April day; only the year is used here.
- id: virginity-india-2022-correction
  sourceId: virginity-india-2022
  relation: documents
  target:
    scope: episode
    episodeId: india-2005-2013
    aspect: institutional-correction
  locator: >-
    Part E, Parting remarks, paragraphs 60–68, printed pages 30–34: Lillu quotation, health guidelines, continued
    use and renewed directions.
  note: >-
    The official judgment quotes the Ministry of Health and Family Welfare guidelines prohibiting the two-finger
    test and explaining that hymenal status cannot prove prior intercourse. It records continued use after earlier
    rejection and orders dissemination to government and private hospitals, training and curriculum review. Clinically
    indicated examinations remain distinct from testing supposed virginity.
- id: virginity-indonesia-carrier
  sourceId: virginity-indonesia-police
  relation: supports
  target:
    scope: episode
    episodeId: indonesia-2014-2022
    aspect: carrier
  locator: >-
    Paragraphs on Chief Police Regulation 5/2009, Article 36; interview accounts; Pusdokkes Polri and police hospitals;
    recruitment consequences.
  note: >-
    The 2014 investigation identifies police recruitment, Chief Police Regulation 5/2009, Pusdokkes Polri personnel
    and police-operated hospitals. Article 36 requires an obstetrics/gynaecology examination; it does not explicitly
    prescribe a virginity test. Interviews document how the testing was nevertheless performed, the pain or humiliation
    reported, and the recruitment context. A failed examination did not necessarily mean automatic expulsion.
- id: virginity-indonesia-mechanism
  sourceId: virginity-indonesia-police
  relation: supports
  target:
    scope: episode
    episodeId: indonesia-2014-2022
    aspect: mechanism
  locator: >-
    Paragraphs on Chief Police Regulation 5/2009, Article 36; interview accounts; Pusdokkes Polri and police hospitals;
    recruitment consequences.
  note: >-
    Interviews describe the two-finger examination as part of medical selection of women applying to the police
    and identify the personnel and facilities performing it. The account of implementation, rather than the general
    gynaecology requirement alone, establishes the virginity-testing mechanism.
- id: virginity-indonesia-consequences
  sourceId: virginity-indonesia-police
  relation: supports
  target:
    scope: episode
    episodeId: indonesia-2014-2022
    aspect: consequences
  locator: >-
    Paragraphs on Chief Police Regulation 5/2009, Article 36; interview accounts; Pusdokkes Polri and police hospitals;
    recruitment consequences.
  note: >-
    Applicants’ accounts document invasive examinations and pain or humiliation within a sex-specific recruitment
    requirement. They support the discrimination and harm account but do not establish automatic rejection of
    every applicant deemed not to be a virgin.
- id: virginity-indonesia-army-correction
  sourceId: virginity-indonesia-army
  relation: documents
  target:
    scope: episode
    episodeId: indonesia-2014-2022
    aspect: institutional-correction
  locator: Army instruction and recruitment-practice passages; subsequent paragraph stating that police had ceased
    testing.
  note: >-
    Reports the Army chief’s 2021 instruction to remove medically irrelevant virginity testing from recruitment
    examinations and describes its earlier use in the security forces. The same article states that police had
    already ceased the practice. These are reports of institutional withdrawal; they are not an independent audit
    of every recruitment facility.
- id: virginity-indonesia-military-correction
  sourceId: virginity-indonesia-military
  relation: documents
  target:
    scope: episode
    episodeId: indonesia-2014-2022
    aspect: institutional-correction
  locator: >-
    Opening April 2022 announcement covering the Army, Navy and Air Force; subsequent paragraph on earlier police
    and Home Affairs cessation.
  note: >-
    Records the April 2022 armed-forces announcement that the Army, Navy and Air Force had effectively ended virginity
    testing for recruitment. It also reports prior cessation by the police and Home Affairs. The response is scoped
    to the reported recruitment practices, rather than every possible use of genital examination.
- id: virginity-kazakhstan-carrier
  sourceId: virginity-kazakhstan-methodology
  relation: documents
  target:
    scope: episode
    episodeId: kazakhstan-2016
    aspect: carrier
  locator: >-
    Method passport, item 5 (PDF page 3): Scientific Council of the Centre for Forensic Medicine, Ministry of
    Justice, protocol 2 of 05.12.2016; expert tasks and examination procedure, printed pages 7–9.
  note: >-
    The readable method passport identifies approval by the Scientific Council of the Centre for Forensic Medicine,
    Ministry of Justice, protocol 2 of 5 December 2016. The method lists prior intercourse among expert tasks,
    prescribes genital and hymenal examination and acknowledges intercourse without hymenal rupture. The current
    Forensic Examinations website hosts the document; hosting alone does not prove continuous implementation or
    case outcomes.
- id: virginity-kazakhstan-mechanism
  sourceId: virginity-kazakhstan-methodology
  relation: documents
  target:
    scope: episode
    episodeId: kazakhstan-2016
    aspect: mechanism
  locator: >-
    Method task list; printed pages 7–9, especially Установление признаков нарушения половой неприкосновенности
    and its parenthetical девственности; paragraph on intercourse without rupture.
  note: >-
    The task list and procedure explicitly connect examination of the hymen to determining signs of loss of sexual
    inviolability, with “virginity” given parenthetically. The qualification about intercourse without rupture
    is retained. Evidence of this prescribed inference should be separated from the document’s other tasks concerning
    injuries or biological traces.
- id: virginity-kazakhstan-consequences
  sourceId: virginity-kazakhstan-methodology
  relation: supports
  target:
    scope: episode
    episodeId: kazakhstan-2016
    aspect: consequences
  locator: >-
    Method passport, item 5 (PDF page 3): Scientific Council of the Centre for Forensic Medicine, Ministry of
    Justice, protocol 2 of 05.12.2016; expert tasks and examination procedure, printed pages 7–9.
  note: >-
    Establishes what the methodology directs examiners to assess and the potential evidentiary use of those conclusions.
    This supports consequences stated as prescribed procedures and risks. The document supplies no examination
    counts, documented verdicts, measured harms or proof of continuous use through 2026.
- id: virginity-kazakhstan-ongoing
  sourceId: virginity-kazakhstan-methodology
  relation: contextualizes
  target:
    scope: episode
    episodeId: kazakhstan-2016
    aspect: context
  locator: >-
    Method passport, item 5 (PDF page 3): Scientific Council of the Centre for Forensic Medicine, Ministry of
    Justice, protocol 2 of 05.12.2016; expert tasks and examination procedure, printed pages 7–9.
  note: >-
    The official host makes the approved methodology available. Its continued availability supplies documentary
    context, not evidence of a correction underway or proof that the procedure was applied without interruption.
    The approval is dated by the readable method passport rather than by the website upload path.
- id: virginity-bangladesh-carrier
  sourceId: virginity-bangladesh-blast
  relation: supports
  target:
    scope: episode
    episodeId: bangladesh-2013-2018
    aspect: carrier
  locator: >-
    Litigation chronology: 6 November and 11 December 2017; 11 March, 10 April and 12 April 2018; eight numbered
    final directions.
  note: >-
    The litigant’s detailed chronology records countrywide medico-legal use, the opinions of five forensic-department
    heads in November and December 2017, and the Health Ministry’s March 2018 defence of finger and hymen testing
    to determine whether intercourse occurred. It records the ministry’s April withdrawal and the High Court’s
    12 April prohibition and directions. A named respondent’s procedural involvement alone is not evidence of
    adoption. The chronology is the litigant’s account of the proceedings rather than the full judgment.
- id: virginity-bangladesh-mechanism
  sourceId: virginity-bangladesh-blast
  relation: supports
  target:
    scope: episode
    episodeId: bangladesh-2013-2018
    aspect: mechanism
  locator: >-
    Litigation chronology: 6 November and 11 December 2017; 11 March, 10 April and 12 April 2018; eight numbered
    final directions.
  note: >-
    The dated departmental opinions and ministry affidavits explicitly describe use of finger examinations and
    hymenal findings to form medico-legal opinions about whether a sexual act had occurred. They document the
    contested professional practice more specifically than the fact that institutions were named in litigation.
- id: virginity-bangladesh-consequences
  sourceId: virginity-bangladesh-blast
  relation: supports
  target:
    scope: episode
    episodeId: bangladesh-2013-2018
    aspect: consequences
  locator: >-
    Litigation chronology: 6 November and 11 December 2017; 11 March, 10 April and 12 April 2018; eight numbered
    final directions.
  note: >-
    The case account describes invasive examinations and sexual-history findings capable of entering rape investigations
    and trials. Its final directions address degrading examinations, labels such as “habituated to intercourse,”
    privacy and examination safeguards. It does not quantify subsequent compliance or a national rate of harm.
- id: virginity-bangladesh-correction
  sourceId: virginity-bangladesh-news
  relation: documents
  target:
    scope: episode
    episodeId: bangladesh-2013-2018
    aspect: institutional-correction
  locator: '12 April 2018 report: the ruling, absence of legal/scientific basis and directions to use the Health
    Ministry protocol.'
  note: >-
    The contemporaneous report corroborates the High Court’s 12 April 2018 ruling that the tests lacked legal
    or scientific basis and its requirement to follow the Health Ministry’s health-care protocol. The first-party
    litigation chronology independently supplies the sequence and directions. Neither source proves universal
    later compliance.
- id: virginity-pakistan-carrier
  sourceId: virginity-pakistan-dawn
  relation: supports
  target:
    scope: episode
    episodeId: pakistan-2015-2021
    aspect: carrier
  locator: >-
    Report on the January 2021 Lahore High Court judgment: 2015 medico-legal instructions, examination practices
    and invalidation of the relevant provisions.
  note: >-
    The report describes the Lahore High Court’s findings on Punjab’s health and medico-legal instructions of
    2015, insofar as they mandated finger or hymen testing to ascertain virginity. It corroborates the institutions’
    operational roles and the judicial rejection. The separately registered judgment provides the precise primary
    passages; the correcting court is not treated as an adopting carrier merely because it decided the case.
- id: virginity-pakistan-mechanism
  sourceId: virginity-pakistan-dawn
  relation: supports
  target:
    scope: episode
    episodeId: pakistan-2015-2021
    aspect: mechanism
  locator: >-
    Report on the January 2021 Lahore High Court judgment: 2015 medico-legal instructions, examination practices
    and invalidation of the relevant provisions.
  note: >-
    Corroborates the judgment’s account of official instructions converting examination findings into opinions
    about supposed virginity in sexual-violence cases. The primary judgment, rather than this news report alone,
    establishes the wording and scope of the directions challenged.
- id: virginity-pakistan-consequences
  sourceId: virginity-pakistan-dawn
  relation: supports
  target:
    scope: episode
    episodeId: pakistan-2015-2021
    aspect: consequences
  locator: >-
    Report on the January 2021 Lahore High Court judgment: 2015 medico-legal instructions, examination practices
    and invalidation of the relevant provisions.
  note: >-
    Corroborates the invasive examinations, sexual-history opinions and violations of dignity discussed in the
    judgment. The record supports the potential evidentiary role of those opinions; it does not identify a number
    of convictions or other outcomes caused by them.
- id: virginity-pakistan-government-correction
  sourceId: virginity-pakistan-government
  relation: documents
  target:
    scope: episode
    episodeId: pakistan-2015-2021
    aspect: institutional-correction
  locator: Press release No. 78, 9 October 2020, six numbered points on diagnostic uncertainty, dignity and medico-legal
    reporting.
  note: >-
    The official release of 9 October 2020 states that the test is inconclusive, violates dignity and should not
    form part of medico-legal reports in rape or sexual-assault cases. This documents the government’s expressed
    position and reporting instruction, without demonstrating compliance by every examiner.
- id: virginity-pakistan-law-correction
  sourceId: virginity-pakistan-law
  relation: documents
  target:
    scope: episode
    episodeId: pakistan-2015-2021
    aspect: institutional-correction
  locator: >-
    Ministry overview paragraph listing the ban on the two-finger test; exact statutory provision is section 13(1)
    of the separately registered Act.
  note: >-
    The official ministry overview confirms that the Anti-Rape (Investigation and Trial) Act 2021 prohibits the
    two-finger test previously used to assess victims. The separately registered Act supplies section 13(1), its
    scheduled-offence scope and the exclusion of probative value. The overview is not used to establish a commencement
    date.
- id: virginity-georgia-carrier
  sourceId: virginity-georgia-public-defender
  relation: supports
  target:
    scope: episode
    episodeId: georgia-2018-2020
    aspect: carrier
  locator: >-
    Methods, printed pages 5–7; sections 3.5–3.6, printed pages 46–49, including the Bureau correspondence and
    case-file references. Main cohort: 2018–2019; some cited files: 2020.
  note: >-
    The UNICEF-hosted Public Defender report documents investigators’ and prosecutors’ requests for state forensic
    examinations focused on hymenal integrity, including cases without alleged penetration, and their use in evaluating
    sexual-violence allegations. It identifies the National Forensics Bureau through correspondence and cases
    and explains the invalidity of using such findings to establish sexual history. The main cohort covers 2018–2019,
    with some 2020 file references; the later government procedure is separate evidence.
- id: virginity-georgia-mechanism
  sourceId: virginity-georgia-grevio
  relation: contextualizes
  target:
    scope: episode
    episodeId: georgia-2018-2020
    aspect: context
  locator: >-
    Question 30, printed pages 92–93: Resolution 14 of 16 January 2023, listed forensic services, questions within
    expertise, consent and victim safeguards.
  note: >-
    Georgia’s 2025 state report describes the service framework under Resolution 14 of 16 January 2023, including
    hymenal integrity, the age of injuries and questions within the expert’s competence. It also describes consent
    and victim safeguards. This is later procedural context; the listed examination of injuries does not itself
    establish a method of proving prior intercourse or continued virginity testing.
- id: virginity-georgia-consequences
  sourceId: virginity-georgia-public-defender
  relation: supports
  target:
    scope: episode
    episodeId: georgia-2018-2020
    aspect: consequences
  locator: >-
    Methods, printed pages 5–7; sections 3.5–3.6, printed pages 46–49, including the Bureau correspondence and
    case-file references. Main cohort: 2018–2019; some cited files: 2020.
  note: >-
    Sections 3.5–3.6 describe intrusive or repeated examinations, questions limited to hymenal condition, reliance
    on supposed signs of penetration and the risk of secondary victimization or distorted case assessment. These
    findings concern the reviewed cases; they should not be generalized to every forensic injury examination.
- id: virginity-georgia-context
  sourceId: virginity-georgia-bureau
  relation: contextualizes
  target:
    scope: episode
    episodeId: georgia-2018-2020
    aspect: context
  locator: >-
    Notice dated 26 October 2021, Medical Experts Participate in Training: training held 21–26 October with the
    Public Defender and Council of Europe.
  note: >-
    The Bureau’s notice of 26 October 2021 describes training held on 21–26 October with the Public Defender and
    Council of Europe on forensic examination of sexual-violence victims, rights, psychological needs and prevention
    of secondary victimization. It establishes institutional participation in training. It does not announce a
    ban on virginity testing or an explicit abandonment of the sexual-history inference.
- id: virginity-georgia-ongoing
  sourceId: virginity-georgia-grevio
  relation: contextualizes
  target:
    scope: episode
    episodeId: georgia-2018-2020
    aspect: context
  locator: >-
    Question 30, printed pages 92–93: Resolution 14 of 16 January 2023, listed forensic services, questions within
    expertise, consent and victim safeguards.
  note: >-
    The 2025 procedural description is not evidence that correction was underway. Its inclusion of hymenal or
    injury assessment also does not by itself demonstrate continued use of the invalid inference. It is retained
