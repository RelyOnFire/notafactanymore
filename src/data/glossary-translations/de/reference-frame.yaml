term: Bezugssystem
aliases:
- Bezugssysteme
- Referenzsystem
- Inertialsystem
shortDefinition: Ein Koordinatensystem samt Uhren, mit dem ein Beobachter Ereignissen Orte und Zeiten zuordnet.
longDefinition: Ein Bezugssystem liefert die räumlichen Koordinaten und Zeitangaben, mit denen physikalische Ereignisse
  beschrieben werden. In der speziellen Relativität bewegen sich Inertialsysteme mit konstanter Geschwindigkeit relativ
  zueinander und sind durch Lorentz-Transformationen verbunden. Verschiedene Systeme können Ereignissen unterschiedliche
  Zeiten, Längen und Gleichzeitigkeitsbeziehungen zuordnen und dennoch bei den physikalischen Gesetzen und invarianten
  Größen übereinstimmen.
