<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Two ways into a food web</title><desc id="desc">Side-by-side diagram comparing sunlight-powered photosynthesis near the ocean surface with chemical-energy-powered chemosynthesis at a dark hydrothermal vent.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}</style>
<rect width="1200" height="900" fill="#f5f0e6"/>
<text x="50" y="55" font-size="18" font-weight="700" fill="#4f776e" text-anchor="start" letter-spacing="2.1">TWO WAYS INTO A FOOD WEB</text><rect x="40" y="80" width="535" height="610" rx="20" fill="#fbf8f1" stroke="#d6cec0" stroke-width="2"/><rect x="625" y="80" width="535" height="610" rx="20" fill="#fbf8f1" stroke="#d6cec0" stroke-width="2"/><text x="70" y="125" font-size="16" font-weight="700" fill="#4f776e" text-anchor="start" letter-spacing="1.5">MOST ECOSYSTEMS</text><text x="70" y="165" font-size="29" font-weight="700" fill="#2f302d" text-anchor="start"><tspan x="70" dy="0">Sunlight starts primary production</tspan></text><rect x="70" y="250" width="475" height="380" rx="14" fill="#dbe8e8"/><circle cx="150" cy="305" r="32" fill="#c7a24d"/><line x1="193.0" y1="305.0" x2="206.0" y2="305.0" stroke="#c7a24d" stroke-width="3"/><line x1="180.4" y1="335.4" x2="189.6" y2="344.6" stroke="#c7a24d" stroke-width="3"/><line x1="150.0" y1="348.0" x2="150.0" y2="361.0" stroke="#c7a24d" stroke-width="3"/><line x1="119.6" y1="335.4" x2="110.4" y2="344.6" stroke="#c7a24d" stroke-width="3"/><line x1="107.0" y1="305.0" x2="94.0" y2="305.0" stroke="#c7a24d" stroke-width="3"/><line x1="119.6" y1="274.6" x2="110.4" y2="265.4" stroke="#c7a24d" stroke-width="3"/><line x1="150.0" y1="262.0" x2="150.0" y2="249.0" stroke="#c7a24d" stroke-width="3"/><line x1="180.4" y1="274.6" x2="189.6" y2="265.4" stroke="#c7a24d" stroke-width="3"/><text x="205" y="311" font-size="19" font-weight="700" fill="#2f302d" text-anchor="start">sunlight</text><circle cx="160" cy="405" r="9" fill="#4f776e"/><circle cx="205" cy="390" r="9" fill="#4f776e"/><circle cx="245" cy="420" r="9" fill="#4f776e"/><circle cx="285" cy="395" r="9" fill="#4f776e"/><circle cx="325" cy="425" r="9" fill="#4f776e"/><text x="300" y="375" font-size="18" font-weight="600" fill="#2f302d" text-anchor="start"><tspan x="300" dy="0">photosynthetic microbes</tspan><tspan x="300" dy="24">/ algae</tspan></text><path d="M190 520 C220 495 260 495 290 520 C260 545 220 545 190 520 Z" fill="#385966"/><path d="M190 520 L165 500 L165 540 Z" fill="#385966"/><circle cx="268" cy="514" r="3" fill="#ffffff"/><path d="M350 540 C376 518 410 518 436 540 C410 562 376 562 350 540 Z" fill="#4f776e"/><path d="M350 540 L328 522 L328 558 Z" fill="#4f776e"/><text x="300" y="600" font-size="18" font-weight="700" fill="#2f302d" text-anchor="middle">food web</text><path d="M175 343 C190 360 205 370 220 380" fill="none" stroke="#4f776e" stroke-width="3" marker-end="url(#arr)"/><path d="M270 445 C260 465 250 480 240 495" fill="none" stroke="#4f776e" stroke-width="3" marker-end="url(#arr)"/><text x="435" y="472" font-size="17" font-weight="600" fill="#6d6b64" text-anchor="end">organic matter</text><text x="655" y="125" font-size="16" font-weight="700" fill="#4f776e" text-anchor="start" letter-spacing="1.3">SOME VENT ECOSYSTEMS</text><text x="655" y="165" font-size="29" font-weight="700" fill="#2f302d" text-anchor="start"><tspan x="655" dy="0">Chemical reactions start primary</tspan><tspan x="655" dy="35">production</tspan></text><rect x="655" y="250" width="475" height="380" rx="14" fill="#385966"/><text x="892" y="282" font-size="15" font-weight="600" fill="#e7efef" text-anchor="middle">no sunlight reaches the seafloor</text><path d="M655 575 C760 555 840 575 920 560 C1005 548 1060 565 1130 545 L1130 630 L655 630 Z" fill="#92775d"/><path d="M830 575 L850 450 L884 450 L905 575 Z" fill="#5f5c55"/><path d="M842 470 C815 430 820 390 850 360 C867 340 870 315 860 292" fill="none" stroke="#b9c9c4" stroke-width="22" stroke-linecap="round" opacity="0.75"/><line x1="970" y1="575" x2="970" y2="497" stroke="#d7d0c0" stroke-width="10" stroke-linecap="round"/><ellipse cx="970" cy="497" rx="10" ry="7" fill="#9f7a71"/><line x1="990" y1="575" x2="990" y2="477" stroke="#d7d0c0" stroke-width="10" stroke-linecap="round"/><ellipse cx="990" cy="477" rx="10" ry="7" fill="#9f7a71"/><line x1="1010" y1="575" x2="1010" y2="503" stroke="#d7d0c0" stroke-width="10" stroke-linecap="round"/><ellipse cx="1010" cy="503" rx="10" ry="7" fill="#9f7a71"/><line x1="1030" y1="575" x2="1030" y2="467" stroke="#d7d0c0" stroke-width="10" stroke-linecap="round"/><ellipse cx="1030" cy="467" rx="10" ry="7" fill="#9f7a71"/><circle cx="780" cy="505" r="7" fill="#c7a24d"/><circle cx="800" cy="520" r="7" fill="#c7a24d"/><circle cx="815" cy="495" r="7" fill="#c7a24d"/><circle cx="795" cy="485" r="7" fill="#c7a24d"/><circle cx="820" cy="525" r="7" fill="#c7a24d"/><text x="690" y="350" font-size="17" font-weight="600" fill="#f1f5f4" text-anchor="start"><tspan x="690" dy="0">reduced chemicals in vent</tspan><tspan x="690" dy="23">fluids</tspan></text><path d="M785 390 C795 420 802 455 802 475" fill="none" stroke="#f1f5f4" stroke-width="3" marker-end="url(#arrlight)"/><text x="690" y="545" font-size="17" font-weight="700" fill="#f1f5f4" text-anchor="start"><tspan x="690" dy="0">chemosynthetic microbes</tspan></text><path d="M830 515 C875 510 920 515 955 525" fill="none" stroke="#f1f5f4" stroke-width="3" marker-end="url(#arrlight)"/><text x="1040" y="495" font-size="17" font-weight="700" fill="#f1f5f4" text-anchor="middle">vent animals</text><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f776e"/></marker>
<marker id="arrlight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f1f5f4"/></marker>
</defs><rect x="40" y="720" width="1120" height="135" rx="18" fill="#fbf8f1" stroke="#d6cec0" stroke-width="2"/><text x="70" y="762" font-size="22" font-weight="700" fill="#2f302d" text-anchor="start">The 1977 surprise was not the existence of chemosynthesis itself.</text><text x="70" y="796" font-size="21" font-weight="500" fill="#2f302d" text-anchor="start">It was a large, dense ecosystem whose local primary production could begin in darkness.</text><text x="70" y="830" font-size="15" font-weight="400" fill="#6d6b64" text-anchor="start"><tspan x="70" dy="0">Simplified pathway: vent microbes can use chemical energy to fix carbon; real vent communities use several</tspan><tspan x="70" dy="20">metabolisms.</tspan></text></svg>