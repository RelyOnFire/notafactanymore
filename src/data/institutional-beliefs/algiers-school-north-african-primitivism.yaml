  - id: algiers-collignon-carrier
    sourceId: algiers-collignon-history
    relation: documents
    target: {scope: episode, episodeId: french-algeria-1918-1962, aspect: carrier}
    locator: pp. 532–534
    note: >-
      Collignon dates Porot's Algiers faculty chair to 1925, identifies the students he trained and the development of the
      School, and records Blida's opening to patients in 1933 and formal inauguration in 1938.
  - id: algiers-fanon-proposition
    sourceId: algiers-fanon-review
    relation: supports
    target: {scope: belief, aspect: proposition}
    locator: pp. 27–28, “The ‘Algiers School of Psychiatry’”
    note: >-
      The review describes Porot's doctrine of primitive brain development, instinctive life and absent higher brain
      functions, and reports the contemporary teaching that the Arab was an inherent primitive and incipient criminal.
  - id: algiers-mup-mechanism
    sourceId: algiers-mup-history
    relation: documents
    target: {scope: episode, episodeId: french-algeria-1918-1962, aspect: mechanism}
    locator: Chapter 8, pp. 251–263
    note: >-
      The chapter traces the School's hospital-based publications and its use of a purported primitive mentality to
      interpret Muslim patients, alcohol consumption, immoderation and violence.
  - id: algiers-collignon-consequences
    sourceId: algiers-collignon-history
    relation: supports
    target: {scope: episode, episodeId: french-algeria-1918-1962, aspect: consequences}
    locator: pp. 537–539
    note: >-
      The historical review connects the School's teaching and writing to racist images of Maghrebi people, supposed
      biological foundations, “primitivism,” criminal impulsivity and scientific legitimation of colonial prejudice.
  - id: algiers-fanon-response
    sourceId: algiers-fanon-review
    relation: contextualizes
    target: {scope: episode, episodeId: french-algeria-1918-1962, aspect: institutional-correction}
    locator: pp. 27–28, “The ‘Algiers School of Psychiatry’”
    note: >-
      The review documents Fanon's rejection of Porot's thesis while working at Blida and his social and cultural account
      of patients' circumstances. That clinical and intellectual challenge is not treated as a formal institutional repudiation.
