schemaVersion: 2
locale: de
entryId: bitemark-source-identification
sourceReviewedAt: 2026-08-23
title: Bissspuren als individuelle Herkunftsidentifikation
proposition:
  summary: >-
    Von Zähnen auf menschlicher Haut hinterlassene Muster wurden als ausreichend detailgetreue Abbildung individueller
    Zahnmerkmale behandelt, um eine bestimmte Person als Verursacher des Bisses zu identifizieren oder stark damit zu verbinden.
correction:
  summary: >-
    Die wissenschaftlichen Voraussetzungen für eine individuelle Herkunftszuschreibung anhand von Bissspuren sind nicht
    belegt. Für diesen Zweck ist weder gezeigt, dass die vorderen Zahnreihen auf Individualebene einzigartig sind, noch
    dass Haut Zahnmerkmale zuverlässig und unverzerrt abbildet oder Sachverständige Verletzungsmuster zuverlässig genug
    auswerten können, um eine Quelle zu identifizieren oder verlässlich einzuschließen. Zahnvergleiche können in manchen
    Situationen begrenzte Ermittlungs- oder Ausschlussfunktionen haben, rechtfertigen aber keine individuelle
    Herkunftsidentifikation aus einer Hautverletzung.
impact:
  summary: >-
    Die Bissspurenanalyse wurde standardisiert und vor Gericht einflussreich, bevor ihre zentralen Annahmen zur
    Herkunftsidentifikation validiert waren. Spätere Berufsrichtlinien und wissenschaftliche Prüfungen schränkten
    zunehmend ein, welche Aussagen sich aus einem Verletzungsmuster auf Haut verantwortbar ableiten lassen.
  highlights:
    - value: '1984'
      label: ABFO führte Richtlinien und ein einheitliches Bewertungssystem für Bissspurenanalysen ein
    - value: '2015'
      label: Das ABFO-Handbuch unterstützte in offenen Populationen keine uneingeschränkte Schlussfolgerung „The Biter“ mehr
    - value: '2023'
      label: NIST veröffentlichte die endgültige wissenschaftliche Grundlagenprüfung der Bissspurenanalyse
  context:
    - >-
      Die umstrittene Herkunftszuschreibung betrifft den Abgleich einer Hautverletzung mit den Zähnen einer lebenden
      Person. Die forensische Identifizierung menschlicher Überreste anhand von Zahnunterlagen und Röntgenbildern ist
      davon zu unterscheiden und wissenschaftlich etabliert.
    - >-
      Die Praxis verschwand 2015 nicht. Das Jahr markiert eine wesentliche Einschränkung der stärksten Herkunftsaussage
      innerhalb der ABFO-Leitlinien; aktuelle Schlussfolgerungen sind auf Ausschluss, Nicht-Ausschluss oder Unentschiedenheit begrenzt.
episodes:
  - id: united-states-1984-2015
    polity: Vereinigte Staaten
    institutions:
      - American Board of Forensic Odontology (ABFO)
    institutionalContext: >-
      Die ABFO, die wichtigste US-amerikanische Berufsorganisation für forensische Odontologie, führte ab 1984
      standardisierte Richtlinien und ein Bewertungssystem für Bissspuren ein. Sachverständige innerhalb dieses
      professionellen Rahmens lieferten Beweise in Strafverfahren und der Militärjustiz. Gerichte bewerteten die
      Zulässigkeit unterschiedlich, doch veröffentlichte Entscheidungen behandelten Bissspurenvergleiche wiederholt als
      anerkanntes Identifikationsverfahren.
    summary: >-
      1984 führte die American Board of Forensic Odontology Richtlinien zur Standardisierung der Bissspurenanalyse ein,
      darunter ein einheitliches Punktesystem, das die Verfasser zunächst als Schritt zu einem wissenschaftlichen Verfahren
      beschrieben. Die veröffentlichten ABFO-Richtlinien hielten fest, dass Bissspuren bereits in vielen Gerichten und in
      der Militärjustiz verwendet wurden. Die eigentliche Herkunftsentscheidung blieb jedoch subjektiv; eine anerkannte
      Mindestzahl übereinstimmender Merkmale für eine positive Identifikation existierte nicht. 2015 unterstützte das
      ABFO-Handbuch in einer offenen Population keine uneingeschränkte Schlussfolgerung „The Biter“ mehr. Eine spätere
      NIST-Prüfung kam zu dem Ergebnis, dass die drei Grundannahmen der Herkunftszuschreibung nicht ausreichend belegt sind.
    consequences:
      - Bissspuren-Sachverständigenaussagen wurden in Strafgerichten zugelassen und verwendet
      - Verdächtige konnten anhand gemusterter Hautverletzungen eingeschlossen oder identifiziert werden
      - Herkunftsaussagen konnten ansonsten überwiegend indizienbasierte Strafverfahren erheblich verstärken
      - Mit zunehmender wissenschaftlicher Kritik wurden zulässige professionelle Schlussfolgerungen eingeschränkt
    mechanism:
      summary: >-
        Die ABFO standardisierte Erhebung und Vergleich von Bissspuren durch Berufsrichtlinien und ein Bewertungssystem
        und schuf damit eine gemeinsame Methodik und Schlussfolgerungssprache für Straf- und Militärgerichte.
    institutionalCorrection:
      periodLabel: '2015'
      action: Die ABFO unterstützte in offenen Populationen keine uneingeschränkte Schlussfolgerung „The Biter“ mehr.
      summary: >-
        Die ABFO schränkte die stärkste zulässige Herkunftsaussage ein, ohne die Bissspurenpraxis vollständig aufzugeben.
        Spätere wissenschaftliche Prüfungen untergruben individuelle Herkunftszuschreibungen weiter; die professionelle
        Schlussfolgerungssprache ist heute begrenzt statt individualisierend.
evidence:
  - id: bitemark-abfo-proposition
    note: >-
      Die 1986 veröffentlichten ABFO-Richtlinien halten fest, dass Bissspurenbeweise in vielen Gerichten und in der
      Militärjustiz verwendet wurden, und legen standardisierte Methoden zur Erhebung und Analyse der Spuren dar.
  - id: bitemark-nist-correction
    note: >-
      Endgültige NIST-Veröffentlichung zur wissenschaftlichen Grundlage der forensischen Bissspurenanalyse und zu der
      Evidenz, die für Herkunftsvergleichsaussagen erforderlich wäre.
  - id: bitemark-nist-premises
    note: >-
      Erläutert die drei nicht ausreichend belegten Voraussetzungen: individuelle Einzigartigkeit der vorderen Zahnreihen,
      konsistente Übertragung dieser Muster auf Haut und zuverlässige Auswertung des Verletzungsmusters durch Sachverständige.
  - id: bitemark-nrc-impact
    note: >-
      Rekonstruiert die Einführung des einheitlichen ABFO-Bewertungssystems 1984, frühe Zuverlässigkeitsbehauptungen sowie
      die fortbestehende Subjektivität und das Fehlen einer anerkannten Mindestzahl übereinstimmender Merkmale zur Individualisierung.
  - id: bitemark-abfo-carrier
  - id: bitemark-nrc-mechanism
  - id: bitemark-abfo-consequences
  - id: bitemark-nasem-institutional-correction
    note: >-
      Dokumentiert, dass das ABFO-Referenzhandbuch von 2015 in offenen Populationen keine Schlussfolgerung „The Biter“
      unterstützte, und fasst die wissenschaftliche und gerichtliche Geschichte der Bissspuren-Herkunftsaussagen zusammen.
