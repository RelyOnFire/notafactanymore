locale: de
entryId: virginity-testing
sourceReviewedAt: 2026-08-23
title: „Jungfräulichkeitstests“
claim: Untersuchungen des Hymens oder der Vagina wurden als geeignet behandelt, festzustellen, ob eine Frau oder ein Mädchen bereits vaginalen Geschlechtsverkehr hatte.
currentUnderstanding: Keine körperliche Untersuchung kann feststellen, ob eine Frau oder ein Mädchen zuvor vaginalen Geschlechtsverkehr hatte. Das Erscheinungsbild des Hymens variiert natürlicherweise und ist kein verlässlicher Nachweis sexueller Aktivität; sogenannte Jungfräulichkeits- oder Zwei-Finger-Tests besitzen keine wissenschaftliche oder klinische Aussagekraft.
episodes:
  - id: turkey-1986-1998
    polity: Türkei
    summary: Türkische Polizei, Gendarmerie, Schulen, Wohnheime und andere staatliche Einrichtungen ordneten Untersuchungen an oder ermöglichten sie, mit denen die „Jungfräulichkeit“ von Frauen und Mädchen festgestellt werden sollte. Staatliche Gerichtsmediziner führten solche Untersuchungen unter anderem bei Inhaftierten, bei Verdacht auf Prostitution, im Rahmen schulischer Disziplin und wegen vermeintlicher Verstöße gegen die öffentliche Moral durch. Ende 1998 untersagte eine staatliche Regelung Jungfräulichkeitstests, sofern die Frau sie nicht selbst verlangte.
    consequences:
      - Erzwungene Genitaluntersuchungen
      - Verwendung vermeintlicher „Jungfräulichkeit“ als polizeiliches Beweismittel
      - Überwachung und Bestrafung von Frauen und Mädchen
      - Psychische und körperliche Schäden
  - id: india-2005-2013
    polity: Indien
    summary: In der indischen Gerichtsmedizin und in öffentlichen Krankenhäusern wurde der Zwei-Finger-Test weiterhin eingesetzt, um zu beurteilen, ob Vergewaltigungsbetroffene an Geschlechtsverkehr „gewöhnt“ seien. Befunde zu Hymen und vermeintlicher vaginaler Weite gelangten in gerichtsmedizinische Berichte und konnten vor Gericht verwendet werden, um Glaubwürdigkeit oder fehlende Zustimmung infrage zu stellen. Der Supreme Court verwarf die Praxis 2013; nationale Gesundheitsrichtlinien untersagten anschließend den Test und Aussagen über frühere sexuelle Erfahrung.
    consequences:
      - Invasive Untersuchungen von Vergewaltigungsbetroffenen
      - Beurteilung der Sexualgeschichte in gerichtsmedizinischen Berichten
      - Verwendung zur Infragestellung von Glaubwürdigkeit oder Zustimmung
      - Erneute Traumatisierung der Betroffenen
  - id: indonesia-2014-2022
    polity: Indonesien
    institutions:
      - Kepolisian Negara Republik Indonesia (Polri)
      - Pusat Kedokteran dan Kesehatan Polri (Pusdokkes Polri)
      - Tentara Nasional Indonesia (TNI)
      - Tentara Nasional Indonesia Angkatan Darat (TNI AD)
      - Tentara Nasional Indonesia Angkatan Laut (TNI AL)
      - Tentara Nasional Indonesia Angkatan Udara (TNI AU)
    institutionalContext: >-
      Im Polizeisystem benennt Human Rights Watch die nationale Polizeiverordnung und Pusdokkes Polri als Teile des Untersuchungsapparats. In den Streitkräften war die Praxis in allen drei Teilstreitkräften verbreitet. Das Heer begann 2021 mit der Abschaffung; der streitkräfteweite Endpunkt wurde erst 2022 erreicht, als TNI mitteilte, dass Heer, Marine und Luftwaffe die Tests bei der Rekrutierung effektiv beendet hätten.
    summary: Noch 2014 mussten sich Bewerberinnen für die indonesische Polizei sogenannten „Jungfräulichkeitstests“ einschließlich des widerlegten Zwei-Finger-Tests unterziehen; Personal von Pusdokkes Polri führte die Untersuchungen in polizeilichen medizinischen Einrichtungen durch. Human Rights Watch dokumentierte die Praxis außerdem in allen drei Teilstreitkräften. Das Heer begann 2021 mit der Abschaffung, Marine und Luftwaffe folgten jedoch noch nicht vollständig. Im April 2022 teilten die Streitkräfte schließlich mit, dass Heer, Marine und Luftwaffe die Jungfräulichkeitstests bei der Rekrutierung effektiv beendet hätten.
    consequences:
      - Invasive Untersuchungen von Bewerberinnen
      - Geschlechterdiskriminierung im öffentlichen Dienst
      - Psychische und körperliche Schäden
