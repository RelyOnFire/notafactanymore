locale: de
entryId: hiv-denialism
sourceReviewedAt: 2026-08-22
title: HIV-Leugnung
claim: Führende staatliche Entscheidungsträger behandelten die ursächliche Rolle von HIV bei AIDS als zweifelhaft oder unbewiesen und antiretrovirale Medikamente als gefährlich toxisch oder von fraglichem Nutzen.
currentUnderstanding: HIV verursacht AIDS. Eine wirksame antiretrovirale Therapie unterdrückt die Virusvermehrung, erhält die Immunfunktion, verhindert Erkrankungen und vorzeitige Todesfälle und senkt die Übertragung stark – auch von der Mutter auf das Kind. Wie alle Medikamente können antiretrovirale Mittel Nebenwirkungen haben; ihr Nutzen bei der Behandlung von HIV ist jedoch eindeutig und sehr groß.
episodes:
  - id: south-africa-1999-2008
    polity: Südafrika
    summary: Unter Präsident Thabo Mbeki stellte die nationale Führung die ursächliche Rolle von HIV bei AIDS infrage und stellte antiretrovirale Medikamente als gefährlich toxisch dar. Diese Positionen trugen dazu bei, Behandlung und die Prävention der Mutter-Kind-Übertragung im öffentlichen Gesundheitssystem zu verzögern und einzuschränken. Spätere Modellstudien mit unterschiedlichen Methoden schätzten die Zahl vermeidbarer Todesfälle während der verzögerten Versorgung auf mehrere Hunderttausend.
    consequences:
      - Verzögerter landesweiter Zugang zu antiretroviraler Therapie
      - Eingeschränkte Prävention der Mutter-Kind-Übertragung
      - Große Zahl vermeidbarer Todesfälle und HIV-Infektionen
