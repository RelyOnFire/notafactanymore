<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1610" viewBox="0 0 760 1610" role="img" aria-labelledby="title desc">
<title id="title">Where plant mass comes from</title>
<desc id="desc">Three-part diagram showing the older soil-source model, the plant-versus-soil mass problem, and the modern roles of carbon dioxide, water, and mineral nutrients.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}</style>
<rect width="760" height="1610" fill="#f5f0e6"/>
<rect x="30" y="30" width="700" height="400" rx="20" fill="#fbf8f1" stroke="#d6cec0" stroke-width="2"/><rect x="30" y="455" width="700" height="470" rx="20" fill="#fbf8f1" stroke="#d6cec0" stroke-width="2"/><rect x="30" y="950" width="700" height="630" rx="20" fill="#fbf8f1" stroke="#d6cec0" stroke-width="2"/><text x="58" y="78" font-size="18" font-weight="700" fill="#4f776e" text-anchor="start" letter-spacing="2">OLDER MODEL</text><text x="58" y="124" font-size="38" font-weight="700" fill="#2f302d" text-anchor="start">Older soil-centered model</text><rect x="110" y="310" width="540" height="60" rx="10" fill="#a98968"/><line x1="380" y1="305" x2="380" y2="215" stroke="#5f7c52" stroke-width="10" stroke-linecap="round"/><ellipse cx="340" cy="220" rx="48" ry="24" fill="#78966a" transform="rotate(-25 340 220)"/><ellipse cx="420" cy="220" rx="48" ry="24" fill="#78966a" transform="rotate(25 420 220)"/><line x1="290" y1="337" x2="290.0" y2="280.0" stroke="#765c45" stroke-width="4" stroke-linecap="round"/><polygon points="290,270 284.0,280.0 296.0,280.0" fill="#765c45"/><line x1="335" y1="337" x2="335.0" y2="280.0" stroke="#765c45" stroke-width="4" stroke-linecap="round"/><polygon points="335,270 329.0,280.0 341.0,280.0" fill="#765c45"/><line x1="380" y1="337" x2="380.0" y2="280.0" stroke="#765c45" stroke-width="4" stroke-linecap="round"/><polygon points="380,270 374.0,280.0 386.0,280.0" fill="#765c45"/><line x1="425" y1="337" x2="425.0" y2="280.0" stroke="#765c45" stroke-width="4" stroke-linecap="round"/><polygon points="425,270 419.0,280.0 431.0,280.0" fill="#765c45"/><line x1="470" y1="337" x2="470.0" y2="280.0" stroke="#765c45" stroke-width="4" stroke-linecap="round"/><polygon points="470,270 464.0,280.0 476.0,280.0" fill="#765c45"/><text x="58" y="390" font-size="23" font-weight="500" fill="#2f302d" text-anchor="start"><tspan x="58" dy="0">Most new plant substance comes from the soil</tspan></text><text x="58" y="502" font-size="18" font-weight="700" fill="#4f776e" text-anchor="start" letter-spacing="2">THE MASS PROBLEM</text><text x="58" y="548" font-size="38" font-weight="700" fill="#2f302d" text-anchor="start">The mass problem</text><text x="190" y="610" font-size="18" font-weight="700" fill="#6d6b64" text-anchor="middle">BEFORE</text><text x="570" y="610" font-size="18" font-weight="700" fill="#6d6b64" text-anchor="middle">AFTER</text><rect x="85" y="745" width="210" height="55" rx="9" fill="#a98968"/><line x1="190" y1="740" x2="190" y2="690" stroke="#5f7c52" stroke-width="7" stroke-linecap="round"/><ellipse cx="165" cy="690" rx="30" ry="15" fill="#78966a" transform="rotate(-25 165 690)"/><ellipse cx="215" cy="690" rx="30" ry="15" fill="#78966a" transform="rotate(25 215 690)"/><rect x="465" y="745" width="210" height="55" rx="9" fill="#a98968"/><line x1="570" y1="740" x2="570" y2="635" stroke="#5f7c52" stroke-width="10" stroke-linecap="round"/><ellipse cx="542.5" cy="660" rx="34.375" ry="20" fill="#78966a" transform="rotate(-20 542.5 660)"/><ellipse cx="597.5" cy="660" rx="34.375" ry="20" fill="#78966a" transform="rotate(20 597.5 660)"/><ellipse cx="532.5" cy="625" rx="46.875" ry="20" fill="#78966a" transform="rotate(-20 532.5 625)"/><ellipse cx="607.5" cy="625" rx="46.875" ry="20" fill="#78966a" transform="rotate(20 607.5 625)"/><ellipse cx="527.5" cy="590" rx="53.125" ry="20" fill="#78966a" transform="rotate(-20 527.5 590)"/><ellipse cx="612.5" cy="590" rx="53.125" ry="20" fill="#78966a" transform="rotate(20 612.5 590)"/><text x="190" y="840" font-size="18" font-weight="600" fill="#6d6b64" text-anchor="middle"><tspan x="190" dy="0">Soil mass falls</tspan><tspan x="190" dy="23">only slightly</tspan></text><text x="570" y="840" font-size="18" font-weight="600" fill="#4f776e" text-anchor="middle"><tspan x="570" dy="0">Plant dry mass</tspan><tspan x="570" dy="23">rises greatly</tspan></text><text x="58" y="998" font-size="18" font-weight="700" fill="#4f776e" text-anchor="start" letter-spacing="2">MODERN PICTURE</text><text x="58" y="1044" font-size="38" font-weight="700" fill="#2f302d" text-anchor="start">Modern picture</text><rect x="285" y="1390" width="190" height="55" rx="10" fill="#a98968"/><line x1="380" y1="1388" x2="380" y2="1215" stroke="#5f7c52" stroke-width="10" stroke-linecap="round"/><ellipse cx="347.5" cy="1305" rx="38.23529411764706" ry="21" fill="#78966a" transform="rotate(-20 347.5 1305)"/><ellipse cx="412.5" cy="1305" rx="38.23529411764706" ry="21" fill="#78966a" transform="rotate(20 412.5 1305)"/><ellipse cx="337.5" cy="1255" rx="50.0" ry="21" fill="#78966a" transform="rotate(-20 337.5 1255)"/><ellipse cx="422.5" cy="1255" rx="50.0" ry="21" fill="#78966a" transform="rotate(20 422.5 1255)"/><ellipse cx="335.0" cy="1208" rx="52.94117647058824" ry="21" fill="#78966a" transform="rotate(-20 335.0 1208)"/><ellipse cx="425.0" cy="1208" rx="52.94117647058824" ry="21" fill="#78966a" transform="rotate(20 425.0 1208)"/><text x="75" y="1100" font-size="28" font-weight="800" fill="#4f776e" text-anchor="start">CO₂</text><text x="75" y="1140" font-size="19" font-weight="500" fill="#2f302d" text-anchor="start"><tspan x="75" dy="0">CO₂ from air → carbon</tspan><tspan x="75" dy="25">incorporated into plant tissue</tspan></text><line x1="245" y1="1195" x2="292" y2="1222" stroke="#4f776e" stroke-width="5" stroke-linecap="round"/><polygon points="303,1228 290,1227 296,1216" fill="#4f776e"/><line x1="90" y1="1470" x2="273.45060388816313" y2="1418.2575219802616" stroke="#557786" stroke-width="5" stroke-linecap="round"/><polygon points="285,1415 271.8218428980323,1412.4828239243432 275.079364878294,1424.03222003618" fill="#557786"/><text x="58" y="1515" font-size="18" font-weight="500" fill="#2f302d" text-anchor="start"><tspan x="58" dy="0">Water from roots → hydrogen,</tspan><tspan x="58" dy="24">chemistry, and much of fresh mass</tspan></text><line x1="665" y1="1470" x2="486.52677117297475" y2="1418.3366969184926" stroke="#8d7457" stroke-width="5" stroke-linecap="round"/><polygon points="475,1415 484.85842271372843,1424.10008250498 488.19511963222106,1412.5733113320052" fill="#8d7457"/><text x="500" y="1515" font-size="18" font-weight="500" fill="#2f302d" text-anchor="start"><tspan x="500" dy="0">Soil → essential mineral</tspan><tspan x="500" dy="24">nutrients</tspan></text></svg>