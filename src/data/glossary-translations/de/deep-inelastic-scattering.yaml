locale: de
entryId: deep-inelastic-scattering
sourceReviewedAt: '2026-08-21'
term: Tiefinelastische Streuung
aliases:
- DIS
shortDefinition: Hochenergetische Streuung, bei der eine Sonde tief genug in ein Proton oder Neutron eindringt, um punktartige
  Bestandteile im Inneren sichtbar zu machen.
longDefinition: Bei der tiefinelastischen Streuung übertragen hochenergetische Elektronen, Myonen, Neutrinos oder andere
  Sonden genügend Energie und Impuls auf ein Nukleon, dass seine innere Struktur im Streumuster erkennbar wird. Experimente
  ab den späten 1960er Jahren zeigten ein Verhalten, das zu kompakten Bestandteilen im Proton passte und das Quarkmodell
  stützte.
