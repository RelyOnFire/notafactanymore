term: Incorruptible
aliases:
- incorruptibility
- incorruptible heavens
shortDefinition: In Aristotelian natural philosophy, incapable of decay, generation, or fundamental physical alteration.
longDefinition: Incorruptible did not merely mean durable. In Aristotelian cosmology it described the celestial realm
  as exempt from the generation and decay characteristic of earthly matter. The heavens were therefore supposed to remain
  fundamentally unchanged, a view challenged by observations of novae, comets, sunspots, and lunar topography.
relatedTerms:
- sublunary
- aether
reviewedAt: '2026-08-21'
sources:
- title: Natural Philosophy in the Renaissance
  url: https://plato.stanford.edu/entries/natphil-ren/
  publisher: Stanford Encyclopedia of Philosophy
  note: Describes the Aristotelian heavens as immutable and composed of a distinct celestial substance.
