schemaVersion: 2
locale: de
entryId: terra-nullius-australia
sourceReviewedAt: '2026-09-25'
title: Australien als terra nullius ohne indigene Landrechte
proposition:
  summary: >-
    Das britische und australische Bodenrecht behandelte Gesetze und Bräuche der Aboriginal and Torres Strait Islander
    Peoples als unfähig, vom Common Law anzuerkennende Eigentumsrechte zu begründen. Der Erwerb der Souveränität galt
    deshalb als vollständiges wirtschaftliches Eigentum der Krone am gesamten Land und nicht als Radikaltitel, der mit
    fortbestehendem Native Title belastet sein konnte.
correction:
  summary: >-
    Am 3. Juni 1992 verwarf der High Court of Australia in Mabo v Queensland (No 2) diese bodenrechtliche Grundlage. Sechs
    Richter erkannten an, dass Native Title den Souveränitätserwerb der Krone überdauern konnte, weil die Krone Radikaltitel
    und nicht automatisch wirtschaftliches Eigentum an jedem Grundstück erhielt. Inhalt und Umfang des Native Title
    ergeben sich aus den jeweiligen indigenen Gesetzen und Bräuchen; er besteht aber nur fort, wenn die erforderliche
    Kontinuität nachgewiesen ist und kein gültiger, unvereinbarer staatlicher Akt ihn aufgehoben hat. Das Gericht hob die
    Souveränität der Krone nicht auf.
impact:
  summary: >-
    Die Regel wirkte durch Verwaltung und Rechtsprechung. Gouverneur Richard Bourkes Proklamation von 1835 bezeichnete
    das Land aus John Batmans versuchtem Kauf als „vacant Lands of the Crown“, erklärte Vereinbarungen mit Aboriginal
    People gegenüber den Kronrechten für unwirksam und behandelte Besitz ohne staatliche Erlaubnis als unbefugt.
    In Cooper v Stuart bezeichnete der Privy Council 1889 die Kolonie zur Zeit der Annexion als praktisch unbewohnt und
    ohne sesshafte Einwohner oder festes Recht, während er klärte, welches englische Recht in New South Wales galt. In
    Milirrpum v Nabalco stellte Blackburn J 1971 bei den Yolngu ein feingliedriges, ausgearbeitetes Rechtssystem fest,
    entschied aber, gemeinschaftlicher Native Title sei kein Teil des australischen Common Law und der konkrete
    Eigentumsanspruch sei nicht bewiesen. Mabo hob den allgemeinen Ausschluss 1992 auf. Das Parlament verabschiedete danach
    den Native Title Act 1993 zur Anerkennung und zum Schutz von Native Title, zur Regelung künftiger Rechtsgeschäfte, zur
    Entscheidung über Ansprüche und zur Validierung bestimmter früherer Akte.
  highlights:
    - value: 157 Jahre
      label: von Bourkes Proklamation 1835 bis zum Mabo-Urteil des High Court 1992
    - value: 6–1
      label: Mehrheit des High Court für die Anerkennung des Native Title der Meriam in Mabo (No 2)
    - value: '1993'
      label: Jahr des Native Title Act nach Mabo
  context:
    - >-
      „Terra nullius“ ist eine rückblickende Kurzbezeichnung für miteinander verbundene Annahmen des Völkerrechts und des
      Common Law. Die Karte behauptet nicht, Amtsträger hätten Australien 1788 förmlich mit diesem lateinischen Ausdruck
      proklamiert. Auch Bourkes Proklamation von 1835 enthält die Worte terra nullius nicht: Sie nennt das Gebiet „vacant
      Lands of the Crown“ und versagt privaten Käufen von Aboriginal People jede Wirkung gegenüber den Kronrechten.
    - >-
      Cooper v Stuart betraf eine Landzuteilung der Krone von 1823 und die Rezeption der englischen rule against
      perpetuities, nicht einen indigenen Landanspruch. Die weitreichende Bezeichnung von New South Wales als praktisch
      unbewohnt wurde dennoch zu einer maßgeblichen Prämisse dafür, die Kolonie als besiedelt einzuordnen und bereits
      bestehendes Gewohnheitsrecht am Land auszuschließen.
    - >-
      Milirrpum stellte weder fehlendes Recht noch fehlende Landbindung der Yolngu fest. Das Gericht erkannte ausdrücklich
      ein ausgearbeitetes Rechtssystem und eine gut belegte spirituelle Beziehung an, lehnte aber gemeinschaftlichen Native
      Title im Common Law ab und sah außerdem Lücken beim Nachweis des behaupteten Eigentumsverhältnisses und seiner
      Kontinuität. Die Niederlage lässt sich nicht auf einen einzigen Befund verkürzen.
    - >-
      Mabo änderte das innerstaatliche Eigentumsrecht; das Urteil erklärte den britischen Souveränitätserwerb nicht für
      ungültig. Es beließ der Krone den Radikaltitel und die hoheitliche Macht, Native Title durch gültige, mit seinem
      Fortbestand unvereinbare Akte aufzuheben.
    - >-
      Anerkennung stellte nicht jedes enteignete Gebiet wieder her. Anspruchstellende müssen Rechte nach traditionellen
      Gesetzen und Bräuchen, fortbestehende Verbindung und fehlende Aufhebung nachweisen. Die Australian Law Reform
      Commission bezeichnete die richterlich ausgelegte gesetzliche Definition später als belastende Beweishürde,
      insbesondere dort, wo koloniale Eingriffe Recht, Brauch oder Zugang zum Land selbst unterbrochen hatten.
    - >-
      Der Native Title Act verband Anerkennung und Schutz mit Rechtssicherheit für andere Interessen. Zu seinen
      ursprünglichen Zielen gehörte die Validierung früherer, durch Native Title berührter Akte; die Präambel erkannte an,
      dass viele Menschen infolge der Enteignung Native Title nicht mehr geltend machen konnten. Die Doktrin verursachte
      auch nicht allein jede Enteignung: Gewalt, Gesetzgebung, Pastoralexpansion, Reservate und Vertreibungen wirkten ebenfalls.
episodes:
  - id: australia-1835-1992
    polity: Australien
    periodLabel: 26. August 1835–3. Juni 1992
    institutions:
      - Gouverneur von New South Wales und koloniale Landverwaltungen
      - Judicial Committee of the Privy Council
      - Supreme Court of the Northern Territory
      - High Court of Australia
      - australische Common-Law-Gerichte
    institutionalContext: >-
      Bourkes Proklamation machte die Autorität der Krone zum einzigen rechtlich wirksamen Weg, auf dem Kolonisten in dem
      riesigen, damals als New South Wales verwalteten Gebiet Land erwerben oder besetzen konnten: Batmans angeblicher Kauf
      von Aboriginal-Vertretern war gegenüber den Kronrechten unwirksam, nicht genehmigte Besitzer galten als Eindringlinge. Cooper v Stuart lieferte später bei der Klärung der
      Rezeption englischen Rechts die höchstrichterliche Aussage, die Kolonie sei praktisch unbewohnt und ohne sesshafte
      Einwohner oder Recht gewesen. Milirrpum legte 1971 den Widerspruch offen: Der Supreme Court of the Northern Territory
      akzeptierte ausführliche Belege für Yolngu-Recht, verneinte aber gemeinschaftlichen Native Title im australischen
      Common Law und sah den Eigentumsanspruch aus weiteren Gründen als unbewiesen an. Mabo (No 2) beendete diesen
      kategorischen Ausschluss am 3. Juni 1992, indem das Urteil Native Title als mögliche Belastung des Kron-Radikaltitels
      auch nach dem Souveränitätserwerb anerkannte.
    consequences:
      - Vereinbarungen von Aboriginal People zur Landübertragung wurden gegenüber der Krone unwirksam; sie kontrollierte rechtmäßige Zuteilungen
      - Die Einordnung als besiedelte Kolonie rezipierte englisches Recht und verweigerte bereits bestehenden indigenen Eigentumsrechten einen Ausgangspunkt im Common Law
      - Der erste gewohnheitsrechtliche Landanspruch, den Yolngu gegen den Bergbau auf der Gove Peninsula erhoben, scheiterte 1971 trotz Nachweises einer ausgearbeiteten Rechtsordnung
      - Landzuteilungen der Krone und andere gültige, unvereinbare staatliche Akte konnten Native Title Grundstück für Grundstück aufheben
      - Die Anerkennung nach Mabo blieb auf fortbestehenden, beweisbaren Native Title begrenzt und gab veräußertes Land nicht automatisch zurück
      - Der Native Title Act schuf ein nationales Anspruchssystem, validierte aber zugleich Kategorien früherer Akte und sah Entschädigung vor
    summary: >-
      Der institutionelle Irrtum lautete nicht, physisch hätten keine indigenen Menschen Australien bewohnt. Vielmehr
      durften ihre Rechtsordnungen bei der kolonialen Einordnung und Eigentumsverteilung nach englischem Bodenrecht
      unberücksichtigt bleiben: Souveränität der Krone wurde als wirtschaftliches Eigentum der Krone behandelt,
      Gewohnheitsinteressen begründeten keinen allgemein anerkennbaren Titel. Mabo korrigierte diese Eigentumsregel, ließ
      aber Souveränität, Radikaltitel, Aufhebung und einzelfallbezogene Beweispflichten bestehen.
    mechanism:
      summary: >-
        Koloniale Proklamationen behielten den rechtlich wirksamen Landerwerb der Krone vor; die Einordnung als besiedelte
        Kolonie lieferte eine Rezeptionsregel für englisches Recht; und Präzedenzfälle machten diese Einordnung zu einem
        Hindernis für gemeinschaftlichen Native Title. Gerichte und Landverwaltungen konnten Land daher vergeben, ohne
        zuvor indigene Eigentumsrechte anzuerkennen. Mabo ersetzte den kategorischen Ausschluss durch eine Anerkennung unter
        Vorbehalt von Kontinuität, Beweis und Aufhebung.
    institutionalCorrection:
      periodLabel: 3. Juni 1992
      action: >-
        Der High Court of Australia verwarf in Mabo v Queensland (No 2) die Common-Law-Prämisse, der Souveränitätserwerb
        mache die Krone zur wirtschaftlichen Eigentümerin jedes Grundstücks, und erkannte fortbestehenden Native Title an.
      summary: >-
        Die 6:1-Entscheidung erkannte den Native Title der Meriam an den meisten Murray Islands an und machte den
        Kron-Radikaltitel mit Native Title aus indigenen Gesetzen und Bräuchen vereinbar. Das Gesetz von 1993 schuf
        Anerkennung sowie Verfahren für Ansprüche und künftige Akte. Für den kategorischen Common-Law-Ausschluss gilt die
        Korrektur als abgeschlossen; Aufhebung, hohe Beweisanforderungen und die Unmöglichkeit, viele veräußerte Gebiete
        zurückzuerlangen, bleiben jedoch wesentliche Grenzen.
evidence:
  - id: terra-library-proposition
    note: >-
      Zeichnet nach, wie Australien von Common-Law-Präzedenzfällen zum Fortbestand bestehender Privatrechte abwich, wie
      Regierungen Land als Kronland behandelten und wie Cooper, Milirrpum und Mabo den Ausschluss indigenen Eigentums
      nacheinander formulierten, anwendeten und verwarfen.
  - id: terra-bourke-proposition
    note: >-
      Das amtliche Archiv erklärt die Terra-nullius-Bedeutung der Proklamation. Der Text selbst nennt das Land „vacant
      Lands of the Crown“, erklärt private Vereinbarungen mit Aboriginal People gegenüber den Kronrechten für unwirksam
      und behandelt Besitz ohne staatliche Erlaubnis als unbefugt; der lateinische Ausdruck kommt nicht vor.
  - id: terra-cooper-proposition
    note: >-
      Der Privy Council ordnete New South Wales als ein bei der Annexion praktisch unbewohntes Gebiet ohne sesshafte
      Einwohner oder Recht ein und leitete daraus ab, wie englisches Recht in die Kolonie gelangte.
  - id: terra-mabo-correction
    note: >-
      Die tragenden Gründe verwerfen die erweiterte Terra-nullius-Prämisse für das Eigentumsrecht, unterscheiden Radikal-
      und wirtschaftlichen Titel, erkennen Native Title als Belastung des Radikaltitels an und formulieren Regeln für
      Kontinuität und Aufhebung. Mason CJ und McHugh J schlossen sich Brennan J an; Dawson J widersprach der Anerkennung.
  - id: terra-aiatsis-correction
    note: >-
      Die AIATSIS-Fallzusammenfassung dokumentiert die Mehrheit von sechs Richtern, den Titel der Meriam an den meisten
      Inselgebieten, den Fortbestand bei erhaltener Verbindung und die Einschränkung, dass unvereinbare Akte von
      Gesetzgebung oder Exekutive den Titel aufheben können.
  - id: terra-library-impact
    note: >-
      Verbindet koloniale Bodenpolitik, Coopers Einordnung als besiedelte Kolonie, den gescheiterten Gove-Anspruch, die
      Kehrtwende von 1992 und die gesetzliche Reaktion von 1993 und trennt dabei Souveränität von wirtschaftlichem Eigentum.
  - id: terra-alrc-impact
    note: >-
      Dokumentiert die gemischten Tatsachen- und Rechtsbefunde in Milirrpum, Mabos Radikaltitel-Rahmen und die späteren
      Beweisregeln. Die Kommission bezeichnet die Auslegung der gesetzlichen Definition als belastend und empfiehlt
      Reformen; dies begrenzt die Behauptung, Anerkennung habe Landrechte automatisch wiederhergestellt.
  - id: terra-nta-impact
    note: >-
      Der ursprüngliche Gesetzestext erfasst beide Seiten der Reaktion: Anerkennung und Schutz sowie Anspruchs- und
      Zukunftsverfahren neben der Validierung früherer Akte, Regeln für Aufhebung oder Aussetzung und Entschädigung.
  - id: terra-bourke-carrier
    note: >-
      Identifiziert Gouverneur Bourke als kolonial handelnden Amtsträger, der Batmans angeblichen Kauf aufhob und die
      rechtlich wirksame Kontrolle über Land am 26. August 1835 öffentlich der Regierung vorbehielt.
  - id: terra-cooper-carrier
    note: >-
      Identifiziert das Judicial Committee of the Privy Council und die von Lord Watson verkündeten einstimmigen Gründe
      als höchstes imperiales Gericht, das die Einordnung als besiedelte Kolonie 1889 in die veröffentlichte australische
      Rechtsprechung trug.
  - id: terra-alrc-milirrpum-carrier
    note: >-
      Identifiziert den Supreme Court of the Northern Territory als Gericht des ersten australischen Verfahrens über
      gewohnheitsrechtliche Landrechte und stellt Blackburn Js Anerkennung eines ausgearbeiteten Yolngu-Rechtssystems
      seiner Weigerung gegenüber, gemeinschaftlichen Native Title anzuerkennen.
  - id: terra-inquiry-context
    note: >-
      Der Untersuchungsbericht gibt die institutionelle Abfolge von Bourke über Mabo bis zum Native Title Act wieder und
      nennt ausdrücklich Aufhebung und spätere Probleme im Anspruchsverfahren. Seine Aussage, Bourke habe den Ausdruck
      terra nullius verwendet, wird am Proklamationstext geprüft, der stattdessen „vacant Lands of the Crown“ sagt.
  - id: terra-aiatsis-mabo-context
    note: >-
      Beschreibt die beiden von den Meriam-Klägern angegriffenen Annahmen—kein vorkoloniales Eigentum und vollständiges
      Kron-Eigentum durch Souveränität—und erklärt, wie der Fall ein lebendiges System von Meriam-Recht und Landbesitz belegte.
  - id: terra-bourke-mechanism
    note: >-
      Zeigt den Verwaltungsmechanismus unmittelbar: Vereinbarungen mit Aboriginal People konnten keinen gegenüber der
      Krone wirksamen Titel schaffen; Besitz ohne ihre Erlaubnis durfte die Regierung als Hausfriedensbruch behandeln.
  - id: terra-cooper-mechanism
    note: >-
      Zeigt, wie eine weitreichende Tatsacheneinordnung zur Kollisionsregel wurde: angemessenes englisches Recht galt von
      Beginn an, weil das Gebiet der angeblich unbewohnten, besiedelten Kolonie zugeordnet wurde.
  - id: terra-library-consequences
    note: >-
      Erklärt, warum der Yolngu-Anspruch trotz Feststellung eines gefestigten Rechtssystems scheiterte und wie Mabo Native
      Title später anerkannte, während etwa Freehold-Zuteilungen ihn im Umfang der Unvereinbarkeit aufheben konnten.
  - id: terra-alrc-consequences
    note: >-
      Trennt Anerkennung von Rückgabe: Native Title muss aus traditionellen Gesetzen und Bräuchen stammen, die Verbindung
      muss wesentlich fortbestehen, gültige Hoheitsakte können ihn aufheben und spätere Auslegung macht Kontinuität zur
      entscheidenden Beweisfrage.
  - id: terra-mabo-institutional-correction
    note: >-
      Das Primärurteil dokumentiert die institutionelle Kehrtwende und ihre Grenzen: Native Title kann den Kron-Radikaltitel
      belasten, hängt aber von indigenem Recht und Brauch ab, kann bei Kontinuitätsverlust entfallen und durch unvereinbare
      Akte aufgehoben werden.
  - id: terra-aiatsis-institutional-correction
    note: >-
      Bestätigt Datum, Mehrheit, wirksame Anerkennung und Einschränkungen in einer institutionellen Native-Title-Fallzusammenfassung.
  - id: terra-nta-institutional-correction
    note: >-
      Das Parlament hielt Mabos Verwerfung von terra nullius ausdrücklich fest und erließ Anerkennung und Schutz, bewahrte
      aber durch Bestimmungen zu Aufhebung, Validierung und Entschädigung zugleich die Grenzen der Entscheidung.
