schemaVersion: 2
locale: de
entryId: dowsing-subsurface-detection
sourceReviewedAt: 2026-08-23
title: Wünschelrutengehen als verlässliche Methode zur Untergrunderkundung
proposition:
  summary: >-
    Geschulte Personen mit Wünschelrute, Pendel oder ähnlichen radiästhetischen Verfahren galten als fähig, verborgenes
    Grundwasser oder geologische Strukturen zuverlässig genug aufzuspüren, um technische Entscheidungen daran auszurichten.
correction:
  summary: >-
    Kontrollierte Untersuchungen haben nicht gezeigt, dass Wünschelrutengehen verlässliche Informationen über verborgenes
    Grundwasser oder geologische Ziele liefert, die über gewöhnliche Umweltinformationen und Zufall hinausgehen. Eine
    Neuauswertung der großen deutschen Scheunenexperimente fand keine reproduzierbare Wünschelrutenleistung. Gerade bei der
    Wassersuche lässt sich scheinbarer Erfolg leicht überschätzen, weil unter großen Teilen der Landschaft Grundwasser vorhanden
    ist. Tiefe, Ergiebigkeit und Qualität lassen sich belastbar nur mit hydrogeologischen, geologischen und geophysikalischen
    Verfahren bestimmen.
episodes:
  - id: soviet-union-1967-1991
    polity: Sowjetunion
    summary: >-
      1967 berief das sowjetische Geologieministerium am Allunionsinstitut für mineralische Rohstoffe VIMS eine Tagung mit
      acht Instituten ein, um das Wünschelrutengehen unter den Begriffen „biophysikalischer Effekt“ und „biophysikalische
      Methode“ systematisch zu untersuchen. Es folgten ein unionsweites Forschungsprogramm, eine interministerielle Kommission,
      wiederholte Fachseminare, Veröffentlichungen und methodische Hinweise für die geologische Kartierung. Eine Darstellung
      beteiligter Forscher von 1984 erklärte die Wirksamkeit der Methode innerhalb dieses Programms für anerkannt und verwies
      auf Unterstützung aus der Akademie der Wissenschaften, obwohl ein erfolgloser kontrollierter Versuch im Gebiet der
      Kursker Magnetanomalie die weitere Entwicklung bereits gebremst hatte.
    consequences:
      - Ein koordiniertes Forschungsprogramm zur sogenannten biophysikalischen Methode wurde über mehrere Institute hinweg aufgebaut
      - Unionsweite Seminare und eine interministerielle Kommission institutionalisierten Forschung und fachlichen Austausch
      - Für die geologische Kartierung wurden methodische Hinweise zur Anwendung des Verfahrens ausgearbeitet
      - Untersucht wurde der Einsatz zur Suche nach Erz, Grundwasser, Erdöl, Verwerfungen und anderen Untergrundzielen
    institutions:
      - Ministerium für Geologie der UdSSR
      - Allunionsinstitut für mineralische Rohstoffe (VIMS)
      - Interministerielle Kommission zum biophysikalischen Effekt
      - Akademie der Wissenschaften der UdSSR
    institutionalContext: >-
      Dieses institutionelle Programm bedeutete keine einhellige Anerkennung in der sowjetischen Geologie. Die Darstellung
      beteiligter Forscher von 1984 erwähnt selbst einen erfolglosen kontrollierten Versuch an der Kursker Magnetanomalie,
      der das Programm bremste, sowie veröffentlichte geologische Kritik. Trotz dieser internen Gegenbelege bestanden das vom Ministerium
      getragene Forschungsprogramm, die Kommission, die Fachseminare, methodischen Anwendungshinweise und die Unterstützung
      auf Akademieebene fort.
    mechanism:
      summary: >-
        Das Geologieministerium formalisierte ein unionsweites Forschungsprogramm, eine interministerielle Kommission,
        Fachseminare und methodische Hinweise zur „biophysikalischen Methode“ und hielt damit Forschung und mögliche Anwendung aufrecht.
    institutionalCorrection:
      summary: >-
        Die überlieferten Quellen dokumentieren interne Kritik und erfolglose Tests, aber keinen datierten sowjetischen
        Institutionsakt, der das Programm vor dem Ende der UdSSR formell verwarf.
  - id: germany-1991-1995
    polity: Deutschland
    summary: >-
      Die bundeseigene Entwicklungshilfeorganisation GTZ setzte Wünschelrutengänger praktisch in Trinkwasserprojekten unter
      anderem in Sri Lanka, auf den Philippinen, im Kongo und in Kenia ein. Eine zeitgenössische Meldung von 1991 zitierte
      den Leiter des GTZ-Bereichs Wasser, Abfallwirtschaft und Ressourcenschutz mit einer auf schwierige geologische Bedingungen
      beschränkten Anwendung. Später veröffentlichte die GTZ Hans-Dieter Betz' technischen Bericht zur unkonventionellen
      Wasserprospektion; ein Beitrag von 1995 stellte eine Reihe von GTZ-Projekten als Beleg dafür dar, ausgewählte Rutengänger
      ergänzend in die Grundwasserprospektion einzubeziehen. Kontrollierte Evidenz belegt jedoch nicht, dass die Wünschelrute
      selbst gegenüber gewöhnlichen Hinweisen und Zufall reproduzierbare zusätzliche Informationen liefert.
    consequences:
      - Wünschelrutengänger bestimmten Bohrstellen in internationalen Trinkwasserprojekten mit
      - Das Verfahren wurde in schwierigen Trockengebieten neben konventioneller hydrogeologischer und geophysikalischer Erkundung eingesetzt
      - Die GTZ veröffentlichte einen technischen Bericht, der das Verfahren als mögliche Methode der Wasserprospektion behandelte
    institutions:
      - Deutsche Gesellschaft für Technische Zusammenarbeit (GTZ)
    institutionalContext: >-
      Die GTZ setzte Wünschelrutengehen in bestimmten Projekten ergänzend zur Hydrogeologie ein, nicht als deren Ersatz.
      Der zeitgenössische Bericht von 1991 beschreibt eine „pragmatische“ Kombination konventioneller und unkonventioneller
      Prospektion unter besonders schwierigen geologischen Bedingungen, wobei Rutengänger in einzelnen Auslandsprojekten bei
      der Wahl von Bohrstellen mitwirkten. Parallel dazu erzeugte staatlich finanzierte deutsche Wünschelrutenforschung umstrittene
      positive Befunde; eine spätere fachwissenschaftliche Neuauswertung der Scheunenexperimente fand jedoch keine reproduzierbare
      Leistung und hielt die Ergebnisse für mit Zufall vereinbar.
    mechanism:
      summary: >-
        Die GTZ band ausgewählte Wünschelrutengänger neben konventionellen Verfahren in internationale Wasserprospektionsprojekte
        ein und veröffentlichte technisches Material, das die Methode unter schwierigen Feldbedingungen als praktische Option behandelte.
    institutionalCorrection:
      summary: >-
        Eine spätere wissenschaftliche Neuauswertung verwarf reproduzierbare Wünschelrutenleistung, doch die verfügbaren
        Quellen zeigen keinen datierten GTZ-Beschluss, der die frühere operative Nutzung formell zurücknahm oder verwarf.
  - id: austria-2020-2026
    polity: Österreich
    summary: >-
      Österreichische Landwirtschaftskammern veröffentlichten Wünschelrutengehen als praktische Hilfe bei der Wasserversorgung
      und nicht bloß als Beschreibung eines Volksglaubens. Ein 2020 auf nationalen und regionalen Kammerseiten erschienener
      Beitrag erklärt, Rute und Pendel könnten konkrete Fragen zu Brunnen und Quellen verlässlich klären und geübte Rutengänger
      hätten sehr hohe Erfolgschancen. Er beschreibt außerdem eine fortdauernde Zusammenarbeit der Landwirtschaftskammer
      Oberösterreich mit einem Rutengänger, der erstmals 1994 bei der Entwässerung eines Rutschhanges eingesetzt worden war.
      Die Landwirtschaftskammern Steiermark und Kärnten veröffentlichten 2024 aktualisierte Hinweise, wonach die Wünschelrute
      bei nachlassender Quellschüttung wertvolle Dienste leisten könne.
    consequences:
      - Offizielle landwirtschaftliche Beratung empfiehlt Rute und Pendel zur Diagnose von Problemen an Brunnen und Quellen
      - Die Hinweise schreiben geübten Rutengängern im Vergleich zu anderen Methoden sehr hohe Erfolgschancen zu
      - Die Landwirtschaftskammer Oberösterreich berichtet von wiederholten Vermittlungen an einen Rutengänger, zu dem seit einem Entwässerungsprojekt von 1994 Kontakt bestand
      - Aktualisierte Kammerinformationen von 2024 stellten Wünschelrutengehen weiterhin als Hilfe bei Wasserknappheit dar
    institutions:
      - Landwirtschaftskammer Österreich
      - Landwirtschaftskammer Oberösterreich
      - Landwirtschaftskammer Steiermark
      - Landwirtschaftskammer Kärnten
    institutionalContext: >-
      Die Kammern berieten und vermittelten auf diesem Gebiet, ohne dass Wünschelrutengehen eine gesetzlich vorgeschriebene
      technische Methode war. Öffentlich-rechtliche landwirtschaftliche Berufsvertretungen präsentierten die Wünschelrute
      als praktische Hilfestellung, schrieben ihr verlässliche diagnostische Aussagekraft und geschulten Anwendern hohe
      Erfolgschancen zu; die Landwirtschaftskammer Oberösterreich beschrieb zudem eine fortdauernde Vermittlung an einen Rutengänger.
    mechanism:
      summary: >-
        Öffentlich-rechtliche Landwirtschaftskammern veröffentlichten Wünschelrutengehen als praktische Beratung,
        schrieben geschulten Anwendern verlässliche Diagnosefähigkeit zu und beschrieben in Oberösterreich eine fortdauernde Vermittlung.
    institutionalCorrection:
      periodLabel: 2024–2026
      summary: >-
        Eine Korrektur ist in den Kammerinformationen nicht dokumentiert. Aktualisierte Landesinformationen von 2024
        empfahlen Wünschelrutengehen bei Wasserknappheit weiterhin; die Episode bleibt im aktuellen Quellenstand offen.
evidence:
  - id: dowsing-usgs-correction
    note: >-
      Erläutert, warum scheinbarer Erfolg bei der Grundwassersuche kein Beleg für die Wirksamkeit der Wünschelrute ist,
      und hält fest, dass Tiefe, Menge und Qualität des Grundwassers mit hydrologischen, geologischen und geophysikalischen Methoden zu bestimmen sind.
  - id: dowsing-soviet-proposition
    note: >-
      Reproduziert die spätsowjetische Institutionsgeschichte des Programms mit der Tagung des Geologieministeriums 1967,
      beteiligten Instituten, Seminaren, interministerieller Kommission, methodischen Hinweisen, dem gescheiterten Kursk-Versuch,
      veröffentlichter Kritik und der von den Autoren behaupteten Unterstützung auf Akademieebene.
  - id: dowsing-soviet-carrier
    note: >-
      Verzeichnet eine 2008 erschienene Sammlung aus dem Archiv der Interministeriellen Kommission zum biophysikalischen
      Effekt und bezeichnet sie als Rückblick auf vierzig Jahre wissenschaftlicher Wünschelrutenforschung in der UdSSR.
  - id: dowsing-soviet-mechanism
  - id: dowsing-soviet-consequences
  - id: dowsing-gtz-carrier
    note: >-
      Zeitgenössischer Bericht von 1991 über den operativen Einsatz von Wünschelrutengängern durch die GTZ, die zuständige
      Leitung des Wasserbereichs und die erklärte pragmatische Kombination mit konventioneller Prospektion unter schwierigen Bedingungen.
  - id: dowsing-gtz-mechanism
    note: >-
      Bibliografischer Nachweis der zweiten Ausgabe der GTZ-Fachpublikation von 1993 über Feldtests der Wünschelrute zur
      Wassersuche in Trockengebieten; dokumentiert, dass die bundeseigene Organisation die Methode selbst als technisches Thema veröffentlichte.
  - id: dowsing-gtz-consequences
  - id: dowsing-scheunen-context
    note: >-
      Fachwissenschaftliche Neuauswertung der großen deutschen kontrollierten Wünschelrutenexperimente; vermeintliche
      Spitzenleistungen ließen sich nicht reproduzieren, und die Ergebnisse waren mit Zufall vereinbar.
  - id: dowsing-austria-proposition
    note: >-
      Stabiles nationales Kammerverzeichnis der Reihe zur Wasserknappheit, das Teil 6 über die Wünschelrute ausdrücklich
      aufführt und die Reihe als praktische Beratung zu Brunnen und Quellen präsentiert.
  - id: dowsing-austria-carrier
    note: >-
      Die Landesquelle erklärt, Rute und Pendel könnten konkrete Fragen zu Brunnen und Quellen verlässlich klären,
      schreibt geschulten Rutengängern sehr hohe Erfolgschancen zu und beschreibt die fortdauernde Zusammenarbeit und Vermittlung der Kammer.
  - id: dowsing-austria-mechanism
  - id: dowsing-austria-consequences
    note: >-
      Kammerinformation vom November 2024, wonach die Wünschelrute bei Wasserknappheit wertvolle Hilfe leisten könne;
      wiederholt Behauptungen über Wasseradern, sensorische Erkennung, verlässliche Diagnose und hohe Erfolgschancen.
  - id: dowsing-austria-carinthia-context
    note: >-
      Aktualisierte Kammerinformation vom November 2024, wonach Wünschelrutengehen bei Wasserknappheit wertvolle Hilfe
      leisten könne; wiederholt den behaupteten sensorischen Mechanismus und praktische Empfehlungen.
  - id: dowsing-austria-uncorrected
