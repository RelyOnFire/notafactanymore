locale: de
entryId: refractive-index
sourceReviewedAt: '2026-08-21'
term: Brechungsindex
aliases:
- Brechzahl
shortDefinition: Ein Maß dafür, wie stark Licht in einem Material gegenüber dem Vakuum verlangsamt wird und dadurch
  an einer Grenzfläche abgelenkt werden kann.
longDefinition: Der Brechungsindex eines Mediums ist das Verhältnis der Lichtgeschwindigkeit im Vakuum zu ihrer
  Geschwindigkeit in diesem Medium. Da der Brechungsindex von der Wellenlänge abhängen kann, werden verschiedene
  Farben in einem Prisma unterschiedlich stark gebrochen.
