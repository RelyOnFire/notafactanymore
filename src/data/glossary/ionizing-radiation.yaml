term: Ionizing radiation
aliases:
- ionising radiation
- ionizing
shortDefinition: Radiation energetic enough to remove electrons from atoms or molecules, creating ions and potentially
  damaging biological tissue.
longDefinition: Ionizing radiation includes X-rays, gamma rays, and sufficiently energetic particles. By ionizing atoms
  and molecules directly or through secondary particles, it can alter chemical bonds and damage DNA. Biological risk
  depends on radiation type, dose, dose rate, exposed tissue, age, and other factors.
