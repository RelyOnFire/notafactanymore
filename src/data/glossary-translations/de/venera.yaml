shortDefinition: Die sowjetische Serie von Venussonden, die unter anderem die ersten erfolgreichen Atmosphäreneintritte,
  Landungen, Oberflächenmessungen und Bilder von einem anderen Planeten erreichte.
longDefinition: Venera war das langjährige sowjetische Programm zur Erforschung der Venus. Aufeinanderfolgende Missionen
  maßen die dichte Kohlendioxidatmosphäre, den enormen Oberflächendruck und die extreme Temperatur. Venera 7 gelang 1970
  die erste erfolgreiche weiche Landung auf einem anderen Planeten; spätere Venera-Sonden lieferten Oberflächenbilder
  und immer detailliertere Messungen.
