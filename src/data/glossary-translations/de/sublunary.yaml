term: Sublunar
aliases:
- sublunarer Bereich
- sublunare Welt
shortDefinition: In der aristotelischen Kosmologie der Bereich unterhalb des Mondes, in dem gewöhnliche Materie Entstehung,
  Vergehen und anderen Veränderungen unterworfen sein sollte.
longDefinition: Der sublunare Bereich reichte in der aristotelischen Naturphilosophie von der Erde bis zum Mond. Er bestand
  aus den vier irdischen Elementen Erde, Wasser, Luft und Feuer und galt als Bereich von Entstehung, Vergehen, Wetter
  und geradliniger natürlicher Bewegung. Ihm wurde der angeblich vollkommene und unveränderliche Himmel oberhalb des
  Mondes gegenübergestellt.
