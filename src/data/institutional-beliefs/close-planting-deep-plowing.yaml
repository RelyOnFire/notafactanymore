  institutionalContext: The strongest identifiable national carrier was the Chinese Communist Party Central Committee. Its
    29 August 1958 directive declared deep plowing the central agricultural yield-increasing technique and ordered a Party-wide,
    mass campaign; People’s Daily reported that the directive had been approved at an expanded Politburo meeting. The Ministry
    of Agriculture participated in central agricultural policy formation and national technical promotion. Provincial party
    committees, local authorities and people’s communes implemented these campaigns, but those distributed layers are described
    as machinery rather than listed as if they were a single institution.
  consequences:
  - Mandatory or heavily pressured cultivation campaigns
  - Reduced yields in some regions
  - Misallocation of agricultural labor
  summary: During the Great Leap Forward, deep plowing and close planting were elevated into nationally promoted agricultural
    methods and incorporated into Mao’s agricultural “eight-point charter.” A 29 August 1958 Central Committee directive declared
    deep plowing the central technique for increasing yields and called for a mass campaign. Authorities pushed these methods
    far beyond locally appropriate conditions. Historical economic research identifies centrally promoted deep plowing and
    close planting among the policies that reduced agricultural output, alongside several other major causes of the crisis.
