locale: de
entryId: microcephaly
sourceReviewedAt: '2026-08-21'
term: Mikrozephalie
aliases:
- mikrozephal
shortDefinition: Ein Zustand, bei dem Kopf und meist auch Gehirn wegen verminderten oder gestörten Gehirnwachstums deutlich
  kleiner sind als für Alter und Geschlecht erwartet.
longDefinition: Mikrozephalie ist ein klinischer Befund, bei dem der Kopfumfang deutlich unter dem erwarteten Bereich
  liegt und meist ein vermindertes Gehirnwachstum widerspiegelt. Sie kann viele genetische, entwicklungsbedingte, infektiöse
  oder umweltbedingte Ursachen haben. In der Debatte um Homo floresiensis wurde Mikrozephalie als mögliche Erklärung
  für das sehr kleine Gehirn des LB1-Skeletts vorgeschlagen.
