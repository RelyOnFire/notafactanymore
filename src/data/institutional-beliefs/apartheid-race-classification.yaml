    url: https://sabctrc.saha.org.za/reports/volume1/chapter2/subsection3.htm
    publisher: South African Truth and Reconciliation Commission
    note: The Commission calls population registration the bedrock of apartheid, reproduces the racial definitions,
      describes them as crude and hopelessly imprecise and records the human consequences of family classification.
  - title: Population Registration Act Repeal Act 114 of 1991
    url: https://www.gov.za/documents/population-registration-act-repeal-act-11-may-2015-0922
    publisher: South African Government
    note: Primary government record of the 1991 repeal, expressly abolishing statutory distinctions between persons
      belonging to different races or population groups.
  - title: What can we learn about the meaning of race from the classification of population groups during apartheid?
    url: https://journals.co.za/doi/10.10520/EJC96744
    publisher: South African Journal of Science
    note: Research based on apartheid reclassification appeals showing that appearance, descent and acceptance were
      ambiguous, contested and repeatedly reinterpreted by courts.
  - title: AABA Statement on Race & Racism
    url: https://bioanth.org/about/aaba-statement-on-race-racism/
    publisher: American Association of Biological Anthropologists
    note: Professional scientific statement explaining that socially recognised racial categories do not represent
      discrete or fixed human biological groups, while emphasising that race remains socially real through racism
      and institutions.
  - title: 'The Book of Life: the South African population register and the invention of racial descent, 1950–1980'
    url: https://www.scielo.org.za/scielo.php?pid=S0259-01902014000100010&script=sci_arttext
    publisher: Kronos / SciELO South Africa
    note: Peer-reviewed history of the population-register bureaucracy, changing classificatory rules and the state's
      increasingly complex effort to assign every South African to a racial category.
