title: Chlorine dioxide as COVID-19 prevention and treatment
claim: >-
  Chlorine dioxide solution was treated as a medically usable means of preventing or treating COVID-19, warranting legal access, public-health supply, and official information campaigns.
currentUnderstanding: >-
  Chlorine dioxide is an oxidizing chemical used in disinfection and industrial applications, not a proven medicine for COVID-19. There is no adequate scientific evidence that ingesting chlorine dioxide prevents or treats COVID-19, and exposure can cause serious toxic effects. Public-health policy should not infer therapeutic efficacy from its disinfectant properties.
category: Medicine and public health
reviewedAt: 2026-08-24
impact:
  summary: >-
    Bolivia presents a particularly sharp institutional contradiction. The national medicines regulator and Ministry of Health publicly stated that chlorine dioxide lacked scientific evidence, authorization, and a valid COVID-19 treatment basis. The legislature nevertheless enacted a national law requiring public-sector supply and information measures for its use as prevention or alternative treatment, and constitutional litigation later made that statutory access operational in a hospital case.
  highlights:
    - value: "Jun–Jul 2020"
      label: AGEMED and the Ministry of Health said there was no scientific evidence and warned against use
    - value: "Oct 2020"
      label: Law 1351 made chlorine dioxide a legally recognized COVID-19 prevention and treatment option
    - value: "2022"
      label: Constitutional court confirmed relief requiring hospital access to an outside doctor for chlorine-dioxide treatment under the law
  context:
    - >-
      The Ministry of Health and AGEMED are correcting institutions in this episode, not carriers of the disputed medical belief. Before Law 1351 was enacted, they had already said chlorine dioxide was not an authorized medicine, lacked evidence for COVID-19, and could endanger health. The law nevertheless assigned the health ministry and territorial governments implementation duties.
    - >-
      The 2023 endpoint marks the end of Bolivia's national COVID-19 health emergency and is used here as the operational endpoint of this exceptional pandemic policy. It should not be read as a claim that Law 1351 was formally repealed on that date.
episodes:
  - id: bolivia-2020-2023
    polity: Bolivia
    region: Latin America
    startYear: 2020
    endYear: 2023
    periodLabel: 2020–COVID-19 emergency period
    strength: policy-basis
    institutionTypes: [government, court]
    institutions:
      - Asamblea Legislativa Plurinacional
      - Tribunal Constitucional Plurinacional
    institutionalContext: >-
      Law 1351 required departmental and municipal governments to guarantee chlorine-dioxide supply in the public health subsector, authorized its use as an alternative prevention or treatment, required information campaigns, and assigned acquisition and free distribution responsibilities. The Tribunal Constitucional Plurinacional's role was judicial enforcement of statutory patient access rather than an independent scientific validation: in SCP 0052/2022-S2 it upheld relief after a hospital refused requested chlorine-dioxide treatment and relied on the national law. The Ministry of Health and AGEMED had opposed the medical premise before enactment and are therefore not listed as belief-carrying institutions.
    consequences:
      - Legal recognition of chlorine dioxide as an alternative COVID-19 prevention and treatment option
      - Statutory duties for public-sector supply, acquisition, free distribution, and information campaigns
      - Availability without a prescription under the statutory framework
      - Constitutional litigation requiring a hospital to permit access to requested chlorine-dioxide treatment through specialized outside medical personnel
    summary: >-
      In June and July 2020, Bolivia's medicines regulator AGEMED and Ministry of Health warned that chlorine dioxide was not an authorized medicine, that no scientific evidence supported its use against COVID-19, and that proposed treatment protocols lacked scientific basis. The legislature nevertheless enacted Law 1351 in October 2020, explicitly regulating chlorine dioxide as COVID-19 prevention and treatment and imposing supply, acquisition, free-distribution, and information duties on public authorities. In 2022 the Constitutional Tribunal upheld relief in a hospital case, reasoning from Law 1351 that a patient should have been allowed access to the requested treatment through specialized outside medical personnel. Bolivia lifted the national COVID-19 health emergency on 31 July 2023.
    sources:
      - title: Ley Nº 1351 — Solución de Dióxido de Cloro como prevención y tratamiento ante la pandemia del COVID-19
        url: https://www.udape.gob.bo/wp-content/uploads/2024/09/LEY_1351.pdf
        publisher: Unidad de Análisis de Políticas Sociales y Económicas (UDAPE), Estado Plurinacional de Bolivia
        note: >-
          National law enacted 14 October 2020. It regulates chlorine dioxide as prevention and treatment, requires departmental and municipal governments to guarantee public-health supply, allows use without prescription through pharmacies, requires information campaigns, and assigns acquisition and free-distribution responsibilities.
      - title: Circular MS/AGEMED/CR/60/2020 — comunicado sobre dióxido de cloro y clorito de sodio
        url: https://www.agemed.gob.bo/circulares/2020/CIRCULAR-60-2020.pdf
        publisher: Agencia Estatal de Medicamentos y Tecnologías en Salud (AGEMED), Ministry of Health
        note: >-
          Official 26 June 2020 regulator warning states that chlorine dioxide was not an authorized medicine, lacked evidence supporting use against COVID-19, had no sanitary registration establishing safety, quality, or efficacy, and posed serious health risks.
      - title: Circular MS/AGEMED/CR/67/2020 — Estudios Clínicos con Dióxido de Cloro
        url: https://www.agemed.gob.bo/circulares/2020/CIRCULAR-67-2020.pdf
        publisher: Agencia Estatal de Medicamentos y Tecnologías en Salud (AGEMED), Ministry of Health
        note: >-
          Official 8 July 2020 circular reiterates that no scientific evidence supported chlorine dioxide for treatment of COVID-19 and directs proponents toward properly approved clinical studies if they wished to generate evidence.
      - title: Comunicado del Ministerio de Salud sobre el denominado Comité Boliviano de Solución de Dióxido de Cloro
        url: https://www.minsalud.gob.bo/component/jdownloads/?Itemid=1118&catid=27&id=496%3Acomunicado20julio2020a&task=download.send
        publisher: Ministry of Health, Bolivia
        note: >-
          Official 20 July 2020 statement says proposed chlorine-dioxide treatment protocols had no scientific basis, put lives at high risk, and had no institutional recognition from the Ministry.
      - title: Sentencia Constitucional Plurinacional 0052/2022-S2
        url: https://tcpbolivia.bo/wp-content/uploads/2025/03/TomoIIs12022.pdf
        publisher: Tribunal Constitucional Plurinacional de Bolivia
        note: >-
          The Constitutional Tribunal confirmed relief in a 2021 hospital case and relied on Law 1351 when holding that refusal to permit requested chlorine-dioxide treatment through specialized outside medical personnel infringed the patient's protected rights in the circumstances.
      - title: Resolución Ministerial Nº 0461 — Se levanta la emergencia sanitaria nacional contra la COVID-19
        url: https://www.minsalud.gob.bo/normativa/resoluciones/resoluciones-ministeriales
        publisher: Ministry of Health and Sports, Bolivia
        note: >-
          Official ministry index reproduces the resolution ending Bolivia's national COVID-19 health emergency from 31 July 2023; this is used as the operational endpoint for the exceptional pandemic episode, not as evidence of formal repeal of Law 1351.
