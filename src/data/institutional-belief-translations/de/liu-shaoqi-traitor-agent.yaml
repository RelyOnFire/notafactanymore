locale: de
entryId: liu-shaoqi-traitor-agent
sourceReviewedAt: '2026-08-25'
title: Liu Shaoqi als Verräter und feindlicher Agent
claim: Während der Kulturrevolution erklärte die Kommunistische Partei Chinas Liu Shaoqi förmlich zum „Verräter, inneren Agenten
  und Arbeiterverräter“, stellte ihn als Kopf einer konterrevolutionären revisionistischen beziehungsweise bürgerlichen Zentrale
  innerhalb der Partei dar und behandelte zahlreiche Funktionäre und Bürger als Mitglieder, Agenten oder Produkte seines angeblichen
  politischen Netzes.
currentUnderstanding: 1980 kehrte das Fünfte Plenum des Elften Zentralkomitees der Kommunistischen Partei Chinas den Fall
  förmlich um. Es erklärte die Theorie einer von Liu geführten „bürgerlichen Zentrale“ für vollständig falsch und unhaltbar,
  stellte fest, dass Material zu seiner Verleumdung und Verfolgung fabriziert worden war, und dass zahlreiche Partei-, Staats-
  und Militärfunktionäre fälschlich als seine Agenten bezeichnet worden waren.
impact:
  summary: Die Anschuldigungen gegen Liu wurden zu einer förmlichen Partei- und Staatsdoktrin. Im Oktober 1968 billigte das
    erweiterte Zwölfte Plenum des Achten Zentralkomitees den Untersuchungsbericht, schloss den amtierenden Staatspräsidenten
    dauerhaft aus der Partei aus und entzog ihm sämtliche Partei- und Staatsämter. Liu blieb in Haft, wurde schwer verfolgt
    und starb im November 1969 in Kaifeng. Im Februar 1980 rehabilitierte ihn das Fünfte Plenum vollständig und ordnete die
    Korrektur verbundener Unrechtsfälle an.
  highlights:
  - value: 12 Jahre
    label: von der förmlichen Verurteilung 1968 bis zur Rehabilitierung 1980
  - value: '1969'
    label: Jahr, in dem Liu nach politischer Verfolgung in Haft starb
  - value: Größter
    label: Unrechtsfall der Parteigeschichte, so die eigene Beschreibung der KPCh von 1980
  context:
  - „Verräter, innerer Agent und Arbeiterverräter“ gibt die förmlichen chinesischen Bezeichnungen 叛徒、内奸、工贼 sinngemäß wieder.
  - Die Korrektur von 1980 bestritt nicht reale politische Meinungsverschiedenheiten mit Mao. Sie verwarf deren Umwandlung
    in eine erfundene konterrevolutionäre Identität und ein angebliches Netzwerk.
  - Die spätere Parteidarstellung weist Lin Biao, der Viererbande und weiteren Beteiligten große Verantwortung für fabrizierte
    Materialien zu, räumt aber zugleich ein, dass das Zentralkomitee selbst 1968 die falsche Schlussfolgerung förmlich angenommen
    hatte.
episodes:
- id: china-1968-1980
  polity: Volksrepublik China
  institutions:
  - Zentralkomitee der Kommunistischen Partei Chinas
  - Zentrale Sonderfall-Prüfgruppe
  - Partei- und Staatsapparat der Kulturrevolution
  institutionalContext: Liu Shaoqi war Präsident der Volksrepublik China und stellvertretender Vorsitzender der Kommunistischen
    Partei. Am 31. Oktober 1968 billigte das erweiterte Zwölfte Plenum des Achten Zentralkomitees einen Sonderfallbericht,
    erklärte ihn zum Verräter, inneren Agenten und Arbeiterverräter, schloss ihn dauerhaft aus der Partei aus und entzog ihm
    sämtliche Ämter. Schwer erkrankt wurde Liu im Oktober 1969 nach Kaifeng in streng bewachte Haft gebracht und starb dort
    am 12. November. Am 29. Februar 1980 rehabilitierte ihn das Fünfte Plenum des Elften Zentralkomitees einstimmig und ordnete
    die Korrektur verbundener Unrechtsfälle an.
  consequences:
  - Dauerhafter Parteiausschluss des amtierenden Staatspräsidenten und Entzug sämtlicher Ämter
  - Haft, politische Verfolgung und körperliche Misshandlung bis zu Lius Tod 1969
  - Verfolgung zahlreicher Partei-, Staats- und Militärfunktionäre als angebliche Agenten Lius
  - Ausweitung der Beschuldigung auf weitere gesellschaftliche Gruppen
  - Landesweite Propaganda über eine erfundene konterrevolutionäre Identität
  - Umfangreiche Rehabilitierungsarbeit nach 1980 für verbundene Unrechtsfälle
  summary: 'Lius Sturz wurde zu einem institutionellen Glaubenssatz, weil das Zentralkomitee die Anschuldigung förmlich ratifizierte
    und der Partei- und Staatsapparat sie landesweit durchsetzte. Die eigene Prüfung der KPCh von 1980 kehrte den Tatsachenkern
    um: Die Theorie einer „bürgerlichen Zentrale“ sei unhaltbar gewesen, Material sei zur Verleumdung Lius fabriziert worden
    und daraus abgeleitete Beschuldigungen seien Unrechtsfälle gewesen.'
