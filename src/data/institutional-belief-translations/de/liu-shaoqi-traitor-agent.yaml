schemaVersion: 2
locale: de
entryId: liu-shaoqi-traitor-agent
sourceReviewedAt: '2026-09-24'
title: Liu Shaoqi als „Renegat, Verräter und Arbeiterverräter“
proposition:
  summary: >-
    Am 31. Oktober 1968 billigte das erweiterte Zwölfte Plenum des Achten Zentralkomitees der Kommunistischen Partei
    Chinas förmlich einen Bericht der Zentralen Sonderfall-Untersuchungsgruppe, der Liu Shaoqi als „Renegaten, Verräter
    und Arbeiterverräter“ bezeichnete. Das Plenum schloss ihn dauerhaft aus der Partei aus und beschloss, ihn sämtlicher
    Ämter innerhalb und außerhalb der Partei zu entheben. Der politische Bericht an den Neunten Parteitag wiederholte die
    Anschuldigungen im April 1969 und stellte Liu als Kopf einer im Untergrund tätigen „bürgerlichen Zentrale“ dar, deren
    angebliche Agenten wichtige Partei- und Staatsämter besetzt hätten.
correction:
  summary: >-
    Am 29. Februar 1980 kehrte das Elfte Zentralkomitee der Partei den Fall förmlich um. Sein Fünftes Plenum bezeichnete
    die angebliche konterrevolutionäre Linie und „bürgerliche Zentrale“ als vollständig falsche und haltlose Annahme. Es
    stellte fest, dass falsches Belastungsmaterial fabriziert und zahlreiche Partei-, Staats- und Militärfunktionäre zu
    Lius Agenten erklärt worden waren. Das Plenum strich die drei Bezeichnungen, hob den Beschluss und den
    Untersuchungsbericht von 1968 auf, rehabilitierte Liu und ordnete die Korrektur verbundener Unrechtsfälle an. Der
    historische Parteibeschluss von 1981 ergänzte, die angebliche Zentrale habe nicht existiert; sowohl das politische
    Urteil von 1968 als auch die Disziplinarmaßnahme seien völlig falsch gewesen.
impact:
  summary: >-
    Die Anschuldigungen wurden zu einem autoritativen Parteieurteil und blieben nicht bloß eine Parole einer einzelnen
    Fraktion. Das Plenum vom Oktober 1968 billigte den Fallbericht gegen Liu, den damaligen Vorsitzenden der
    Volksrepublik China, und verkündete seinen dauerhaften Parteiausschluss und Amtsentzug. Der Bericht an den Neunten
    Parteitag vom April 1969 trug die angebliche Verschwörung in den nächsten nationalen Parteitag hinein. Liu blieb
    interniert, wurde im Oktober 1969 schwer krank nach Kaifeng gebracht und starb dort am 12. November. 1980 hob das
    Fünfte Plenum den Fall auf und beauftragte die zuständigen Stellen, die daraus hervorgegangenen Unrechtsfälle zu
    korrigieren.
  highlights:
    - value: 31. Okt. 1968
      label: Tag, an dem das Zentralkomitee den Fallbericht billigte und Lius Ausschluss verkündete
    - value: 12. Nov. 1969
      label: Tag, an dem Liu während seiner Internierung in Kaifeng starb
    - value: 29. Feb. 1980
      label: Tag, an dem dieselbe Regierungspartei Liu förmlich rehabilitierte und den Fall von 1968 aufhob
  context:
    - >-
      Die chinesischen Bezeichnungen lauteten 叛徒、内奸、工贼. Die offiziellen englischen Parteiausgaben gaben sie 1980
      als „renegade, traitor and scab“ und 1981 als „renegade, hidden traitor and scab“ wieder. Hier erscheinen sie als
      historische Anschuldigungen, nicht als zutreffende Personenbeschreibung.
    - >-
      Das Fünfte Plenum nannte den Fall den größten konstruierten Unrechtsfall der Parteigeschichte. Dies ist die eigene
      Einordnung der korrigierenden Institution und keine von den wissenschaftlichen Quellen unabhängig ermittelte Rangfolge.
    - >-
      Das Kommuniqué von 1980 wies Lin Biao, der Viererbande und ihrem Umfeld die Hauptverantwortung zu. Der historische
      Beschluss von 1981 erklärte zugleich, Mao habe die Kulturrevolution eingeleitet und geführt, und räumte ausdrücklich
      ein, dass das Plenum des Zentralkomitees selbst zu dem falschen Urteil gelangt war.
    - >-
      Die Rehabilitierung beruhte auf einer Neuprüfung und einem Parteibeschluss, nicht auf einem gerichtlichen Freispruch.
      Sie verwarf den angeblichen Verrat, das vermeintliche Agentennetz und den fabrizierten biografischen Fall; sie
      erklärte nicht jede politische Entscheidung in Lius Laufbahn für unangreifbar.
episodes:
  - id: china-1968-1980
    polity: Volksrepublik China
    periodLabel: förmliche Verurteilung 1968–Rehabilitierung 1980
    institutions:
      - Zentralkomitee der Kommunistischen Partei Chinas
      - Zentrale Sonderfall-Untersuchungsgruppe
      - Neunter Parteitag der Kommunistischen Partei Chinas
    institutionalContext: >-
      Liu war stellvertretender Vorsitzender der KPCh und Vorsitzender der Volksrepublik China gewesen. Am 31. Oktober
      1968 billigte das erweiterte Zwölfte Plenum den Bericht der Zentralen Sonderfall-Untersuchungsgruppe, belegte Liu
      mit den drei Bezeichnungen und verkündete seinen dauerhaften Parteiausschluss und die Enthebung von sämtlichen
      Ämtern. Der politische Bericht an den Neunten Parteitag wiederholte die Verschwörungserzählung im April 1969. Nach
      einer fast einjährigen Neuprüfung durch die Zentrale Disziplinarkontrollkommission nahm das Fünfte Plenum am 29.
      Februar 1980 einstimmig einen Rehabilitierungsbeschluss an. Es hob Anschuldigungen, Disziplinarbeschluss und
      ursprünglichen Bericht auf und übertrug die Korrektur verbundener Fälle den zuständigen Stellen.
    consequences:
      - Dauerhafter Ausschluss aus der Kommunistischen Partei und Beschluss des Zentralkomitees, Liu sämtlicher Ämter innerhalb und außerhalb der Partei zu entheben
      - Erneute Bekräftigung der angeblichen Gruppe und der im Untergrund tätigen „bürgerlichen Zentrale“ auf dem Neunten Parteitag im April 1969
      - Sturz und Verfolgung zahlreicher führender Partei-, Staats- und Militärfunktionäre, die fälschlich als Lius Agenten bezeichnet wurden
      - Internierung und körperliche Verfolgung Lius bis zu seinem Tod in Kaifeng am 12. November 1969
      - Neuprüfung und Korrektur von Unrechtsfällen, die durch die Verbindung mit Lius Fall entstanden waren
    summary: >-
      Eine Sonderfallgruppe stellte die Anschuldigung zusammen, das Zentralkomitee machte daraus ein förmliches
      Parteieurteil und der Neunte Parteitag wiederholte sie als feststehende Geschichte. Die Parteibeschlüsse von 1980
      und 1981 verwarfen später die angebliche Zentrale und den Verratsfall, hoben die Sanktion auf und ordneten die
      Korrektur verbundener Fälle an.
    mechanism:
      summary: >-
        Die Sonderfallgruppe formte erzwungene Aussagen, fabriziertes Belastungsmaterial und gezielt zurückgehaltene
        Zeugenaussagen zu einem Untersuchungsbericht. Das Zentralkomitee ratifizierte den Bericht und verhängte
        Organisationsstrafen; der Neunte Parteitag erneuerte die Darstellung anschließend in seinem politischen Bericht.
        So verband der institutionelle Ablauf Untersuchung, Parteidisziplin und landesweite Parteipropaganda.
    institutionalCorrection:
      periodLabel: 29. Februar 1980; im Juni 1981 bekräftigt
      action: >-
        Das Fünfte Plenum strich die drei Bezeichnungen, hob den Disziplinarbeschluss und den Untersuchungsbericht von
        1968 auf, rehabilitierte Liu und beauftragte die zuständigen Stellen mit der Korrektur verbundener Fälle.
      summary: >-
        Dieselbe Regierungspartei verwarf ihre früheren Tatsachen- und Disziplinarurteile förmlich. Ihr historischer
        Beschluss von 1981 bekräftigte, dass die angebliche „bürgerliche Zentrale“ nicht existiert hatte und Urteil wie
        Sanktion von 1968 völlig falsch gewesen waren.
evidence:
  - id: liu-1968-proposition
    note: >-
      Das zeitgenössische Kommuniqué verzeichnet die Billigung des Sonderfallberichts, die Bezeichnungen
      叛徒、内奸、工贼, den dauerhaften Ausschluss und die Enthebung von sämtlichen Ämtern. Es dokumentiert Behauptung und
      Sanktion der Institution, beweist die Anschuldigungen jedoch nicht.
  - id: liu-1969-proposition
    note: >-
      Der offizielle englische politische Bericht wiederholt die Verratsvorwürfe, beschreibt eine angebliche Gruppe in
      wichtigen Partei- und Staatsämtern und bekräftigt den Amtsentzug und Parteiausschluss durch das Zwölfte Plenum.
  - id: liu-1980-correction-chinese
    note: >-
      Das chinesische Kommuniqué nennt die Annahme einer „bürgerlichen Zentrale“ falsch und unhaltbar, spricht von
      fabriziertem Belastungsmaterial und fälschlich zu Agenten erklärten Funktionären und verzeichnet die Aufhebung der
      Bezeichnungen, des Beschlusses und des Berichts.
  - id: liu-1980-correction-english
    note: >-
      Die offizielle englische Fassung liefert die übersetzten Bezeichnungen, die Feststellung „wrong and groundless“,
      den Befund zu falschem Beweismaterial und angeblichen Agenten sowie den verfügenden Teil des Rehabilitierungsbeschlusses.
  - id: liu-1981-correction
    note: >-
      Der spätere historische Parteibeschluss erklärt, die angebliche „bürgerliche Zentrale“ um Liu und Deng habe nicht
      existiert, nennt die drei Bezeichnungen ein Komplott und bezeichnet Urteil und Disziplinarmaßnahme von 1968 als
      völlig falsch.
  - id: liu-dittmer-context
    note: >-
      Der begutachtete Fachaufsatz bezeichnet Liu unabhängig als höchstrangigen kommunistischen Führer Chinas, der der
      Kulturrevolution zum Opfer fiel, und verzeichnet seine postume Rehabilitierung im Frühjahr 1980. Er dient zur
      Einordnung von Bedeutung und Chronologie, nicht als Beleg für sämtliche Detailaussagen der Partei.
  - id: liu-biography-impact
    note: >-
      Die parteihistorische Biografie verzeichnet Lius Verfolgung, seine Verlegung am 17. Oktober 1969 in schwer krankem
      Zustand nach Kaifeng, seinen Tod dort am 12. November und die Rehabilitierung 1980. Sie wird ausdrücklich als spätere
      offizielle Darstellung ausgewiesen.
  - id: liu-1968-carrier
    note: >-
      Das Kommuniqué nennt das erweiterte Plenum des Zentralkomitees als beschließendes Organ und die Zentrale
      Sonderfall-Untersuchungsgruppe als Verfasserin des Berichts. Damit sind beide institutionellen Träger ohne Rückgriff
      auf spätere Zuschreibungen belegt.
  - id: liu-1969-carrier
    note: >-
      Der politische Bericht zeigt, dass der Neunte Parteitag den Fall nach dem Plenum von 1968 wiederholte und feierte.
      Damit belegt er eine fortdauernde Billigung auf dem nationalen Parteitag statt nur eines einmaligen Beschlusses.
  - id: liu-1980-case-mechanism
    note: >-
      Die offizielle Neuprüfung beschreibt fabrizierte Unterlagen, gefälschte Beweise, erzwungene Geständnisse,
      zurückgehaltene Zeugenaussagen und den von der Untersuchungsgruppe unterdrückten Widerruf einer Aussage. Sie belegt
      den dargestellten Mechanismus so, wie ihn die korrigierende Partei schilderte.
  - id: liu-walder-mechanism
    note: >-
      Walders wissenschaftliche Gesamtdarstellung ordnet die Zentrale Sonderfall-Untersuchungsgruppe in die Säuberungen
      der Kulturrevolution ein und beschreibt ihr landesweites Gruppennetz sowie den Einsatz erzwungener Verhöre. Sie
      bestätigt den institutionellen Rahmen; die Liu-spezifischen Befunde stammen aus der angeführten Fallprüfung.
  - id: liu-1968-consequences
    note: >-
      Das Kommuniqué belegt unmittelbar Parteiausschluss und Amtsentzug. Sein Aufruf, die Kritik fortzusetzen,
      dokumentiert die beabsichtigte Durchsetzung, wird hier aber nicht zur Ableitung einer unbelegten Opferzahl verwendet.
  - id: liu-biography-consequences
    note: >-
      Die spätere offizielle Darstellung belegt Internierung, körperliche Verfolgung, die Verlegung nach Kaifeng sowie
      Datum und Ort des Todes. Der Eintrag begründet keine genauere Behauptung zur unmittelbaren medizinischen Todesursache.
  - id: liu-1980-related-cases
    note: >-
      Das Kommuniqué erklärt, zahlreiche führende Partei-, Staats- und Militärfunktionäre seien als angebliche Agenten
      gestürzt worden, und beauftragt zuständige Stellen mit der Korrektur verbundener Unrechtsfälle. Es nennt keine Zahl
      und überträgt den Befund nicht auf jede von der gesamten Kulturrevolution betroffene gesellschaftliche Gruppe.
  - id: liu-1980-institutional-correction
    note: >-
      Das angenommene Kommuniqué verzeichnet den einstimmigen Beschluss des Fünften Plenums, die genau aufgehobenen
      Maßnahmen und den Auftrag zur Korrektur der aus Lius Fall hervorgegangenen Fälle.
  - id: liu-1980-introduction-context
    note: >-
      Die historische Parteidatenbank fasst unabhängig davon Plenumsdaten, Streichung der drei Bezeichnungen, Aufhebung
      von Beschluss und Bericht, Wiederherstellung von Lius Ansehen und Korrektur verbundener Fälle zusammen.
  - id: liu-1981-context
    note: >-
      Der Beschluss von 1981 erklärt, Mao habe die Kulturrevolution eingeleitet und geführt, verwirft die angebliche
      Zentrale und schreibt das Komplott zugleich Lin Biao, Jiang Qing und ihrem Umfeld zu. So bleibt die
      Verantwortungszuweisung der späteren Parteidarstellung sichtbar, ohne sie als unabhängiges Gerichtsurteil auszugeben.
