locale: de
entryId: oscillation-mode
sourceReviewedAt: '2026-08-21'
term: Schwingungsmodus
aliases:
- Schwingungsmoden
- Eigenmode
- Eigenmoden
shortDefinition: Ein charakteristisches Muster mit einer bestimmten Frequenz, in dem ein physikalisches System von selbst
  schwingen kann.
longDefinition: Ein Planet kann viele Eigen- oder Schwingungsmoden besitzen, jeweils mit einem eigenen räumlichen Muster
  und einer natürlichen Frequenz. Diese Frequenzen hängen von der inneren Struktur des Planeten ab. Wenn sich ein Riesenplanet
  entwickelt, können sich die Moden langsam verschieben, resonant mit Monden wechselwirken und deren Gezeitenmigration
  beeinflussen.
