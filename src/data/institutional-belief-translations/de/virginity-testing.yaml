    von 2025 beschreiben forensische Standards, Verletzungsbewertung und Schutzvorkehrungen. Sie belegen weder
    eine konkrete Aufgabe der ungültigen Schlussfolgerung noch rechtfertigen sie, das dokumentierte Fallmuster
    bis 2026 fortzuschreiben. Die Episode ist auf das frühere Verfahrensmaterial begrenzt.
