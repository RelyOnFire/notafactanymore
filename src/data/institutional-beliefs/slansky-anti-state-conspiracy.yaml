  - id: slansky-jmh-consequences
    sourceId: slansky-jmh-agency
    relation: supports
    target: {scope: episode, episodeId: czechoslovakia-1949-1968, aspect: consequences}
    locator: abstract
    note: >-
      The peer-reviewed study records that the prosecutor labelled eleven of fourteen defendants as being of Jewish
      origin and analyzes how the case broke the party's earlier taboo on antisemitic rhetoric.
  - id: slansky-abs-correction
    sourceId: slansky-abs-rehab
    relation: contextualizes
    target: {scope: episode, episodeId: czechoslovakia-1949-1968, aspect: institutional-correction}
    locator: collection description, paragraphs 1–2
    note: >-
      The official archival guide defines the Rehabilitation Files Collection as records concerning people convicted
      in 1949–1954 proceedings and fully rehabilitated by the Supreme Court. It supplies collection-level provenance,
      not a Slánský-case-specific judgment.
  - id: slansky-london-correction
    sourceId: slansky-political-processes-london
    relation: supports
    target: {scope: episode, episodeId: czechoslovakia-1949-1968, aspect: institutional-correction}
    locator: biography, paragraphs on arrest, trial and review
    note: >-
      Records that a new judicial decision annulled London's conviction and indictment in early February 1956 and that
      he was released, after an earlier reduction of the life sentence.
  - id: slansky-hajdu-correction
    sourceId: slansky-political-processes-hajdu
    relation: supports
    target: {scope: episode, episodeId: czechoslovakia-1949-1968, aspect: institutional-correction}
    locator: biography, paragraph on conviction and release
    note: >-
      Records Hajdů's full rehabilitation and release in May 1956 following review of his life sentence.
  - id: slansky-lobl-correction
    sourceId: slansky-political-processes-lobl
    relation: supports
    target: {scope: episode, episodeId: czechoslovakia-1949-1968, aspect: institutional-correction}
    locator: biography, paragraph on imprisonment, amnesty and rehabilitation
    note: >-
      Distinguishes Löbl's release under the 1960 presidential amnesty from his judicial rehabilitation in 1963.
  - id: slansky-icj-correction
    sourceId: slansky-icj-bulletin
    relation: documents
    target: {scope: episode, episodeId: czechoslovakia-1949-1968, aspect: institutional-correction}
    locator: pp. 10–14, “The Rehabilitation of Stalin's Victims in Czechoslovakia”
    note: >-
      Reproduces the substance of the official Rudé právo account of 22 August 1963: Supreme Court rehabilitation of
      Slánský, restoration of some party memberships, and the express confirmation of Slánský's and several
      co-defendants' party expulsions.
  - id: slansky-ustr-institutional-correction
    sourceId: slansky-ustr-rehabilitation
    relation: contextualizes
    target: {scope: episode, episodeId: czechoslovakia-1949-1968, aspect: institutional-correction}
    locator: pp. 78–79, section “Rehabilitace”
    note: >-
      Shows that the Kolder Commission called the cases fabricated and unlawful while assigning blame chiefly to State
      Security, less to the judiciary and not to the party leadership, demonstrating the limits of the 1963 reckoning.
  - id: slansky-party-correction
    sourceId: slansky-political-processes-slansky
    relation: supports
    target: {scope: episode, episodeId: czechoslovakia-1949-1968, aspect: institutional-correction}
    locator: biography, final paragraph before “Prameny”
    note: >-
      The National Archives/ÚSTR project distinguishes Slánský's judicial rehabilitation in 1963 from his party
