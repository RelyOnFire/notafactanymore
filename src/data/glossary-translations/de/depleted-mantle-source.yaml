locale: de
entryId: depleted-mantle-source
sourceReviewedAt: '2026-08-21'
term: Verarmte Mantelquelle
aliases:
- chemisch verarmte Mantelquelle
- verarmter Mantel
shortDefinition: Ein Mantelreservoir, das bei früheren Schmelz- und Krustenbildungsprozessen bestimmte Elemente verloren
  hat und deshalb an diesen leicht extrahierbaren Bestandteilen verarmt ist.
longDefinition: In der Geochemie bezeichnet eine verarmte Mantelquelle ein Mantelreservoir, aus dem frühere Schmelzvorgänge
  einen Teil jener Elemente entfernt haben, die bevorzugt in Schmelzen übergehen. Später daraus entstehende Magmen besitzen
  daher charakteristische Element- und Isotopensignaturen. Die Chang'e-5-Basalte wurden auf eine verarmte Mondmantelquelle
  mit nur geringem KREEP-Beitrag zurückgeführt.
