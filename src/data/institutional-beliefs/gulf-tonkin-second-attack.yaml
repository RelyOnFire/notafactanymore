  institutionalContext: >-
    After confused reports from USS Maddox and USS Turner Joy on the night of 4 August 1964, the Johnson administration
    accepted the second-attack interpretation and ordered retaliatory strikes under Operation Pierce Arrow. Congress then
    enacted the Gulf of Tonkin Resolution on 7 August. Its preamble stated that North Vietnamese naval units had
    deliberately and repeatedly attacked U.S. naval vessels, and it authorized the president to take all necessary
    measures to repel armed attacks and prevent further aggression. The resolution became a central legal basis invoked
    for expanded U.S. military involvement until its repeal in January 1971. NSA itself continued for years to maintain
    an official account in which the second incident had occurred; a later internal historical reconstruction found that
    the SIGINT evidence had been misread and that there was no attack on 4 August.
  consequences:
  - Retaliatory U.S. air strikes against North Vietnamese naval installations and related targets
  - Congressional adoption of a resolution premised on deliberate and repeated attacks on U.S. vessels
  - Broad authorization for presidential use of military force in Southeast Asia
  - Reliance on the Gulf of Tonkin Resolution as a legal basis for major escalation of U.S. involvement in Vietnam
  - Long-term institutional persistence of an attack narrative that later intelligence reconstruction rejected
  summary: >-
    The false 4 August attack was not an isolated mistaken report. It was accepted at the highest levels of the U.S.
    government, helped trigger immediate retaliatory strikes and entered the factual preamble of legislation granting
    sweeping military authority. Congress repealed that authority in 1971. Later NSA historical analysis, drawing on a
    far larger signals-intelligence record than the material originally used to support the attack, concluded that North
    Vietnamese forces had not attacked the destroyers on 4 August.
  sources:
