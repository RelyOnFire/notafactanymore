nd</tspan></text><text x="58" y="1027" font-size="18" font-weight="700" fill="#4f776e" text-anchor="start" letter-spacing="2">WIEDERVEREINIGUNG</text><text x="58" y="1070" font-size="34" font-weight="700" fill="#2f302d" text-anchor="start">Spektrum wieder vereinen</text><line x1="85" y1="1160" x2="320" y2="1160" stroke="#b24b45" stroke-width="5"/><line x1="350" y1="1160" x2="535" y2="1240" stroke="#b24b45" stroke-width="4"/><line x1="85" y1="1178" x2="320" y2="1178" stroke="#c8733e" stroke-width="5"/><line x1="350" y1="1178" x2="535" y2="1240" stroke="#c8733e" stroke-width="4"/><line x1="85" y1="1196" x2="320" y2="1196" stroke="#c6a13f" stroke-width="5"/><line x1="350" y1="1196" x2="535" y2="1240" stroke="#c6a13f" stroke-width="4"/><line x1="85" y1="1214" x2="320" y2="1214" stroke="#73935b" stroke-width="5"/><line x1="350" y1="1214" x2="535" y2="1240" stroke="#73935b" stroke-width="4"/><line x1="85" y1="1232" x2="320" y2="1232" stroke="#4e7f89" stroke-width="5"/><line x1="350" y1="1232" x2="535" y2="1240" stroke="#4e7f89" stroke-width="4"/><line x1="85" y1="1250" x2="320" y2="1250" stroke="#5f6795" stroke-width="5"/><line x1="350" y1="1250" x2="535" y2="1240" stroke="#5f6795" stroke-width="4"/><line x1="85" y1="1268" x2="320" y2="1268" stroke="#7d5d8f" stroke-width="5"/><line x1="350" y1="1268" x2="535" y2="1240" stroke="#7d5d8f" stroke-width="4"/><ellipse cx="335" cy="1214" rx="15" ry="95" fill="#dce7e5" fill-opacity=".55" stroke="#6d8a84" stroke-width="2"/><circle cx="545" cy="1240" r="18" fill="#fffdf7" stroke="#cfc7b8" stroke-width="2"/><line x1="565" y1="1240" x2="653.0" y2="1240.0" stroke="#d4c9ad" stroke-width="8" stroke-linecap="round"/><polygon points="665,1240 653.0,1234.0 653.0,1246.0" fill="#d4c9ad"/><text x="615" y="1218" font-size="17" font-weight="700" fill="#6d6b64" text-anchor="middle">WEISS</text><text x="58" y="1370" font-size="24" font-weight="400" fill="#2f302d" text-anchor="start"><tspan x="58" dy="0">Getrennte Farben lassen sich wieder zu Weiß