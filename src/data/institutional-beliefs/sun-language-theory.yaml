title: Sun Language Theory
claim: Turkish was treated as the primordial language from which the world's other languages ultimately developed.
currentUnderstanding: Turkish belongs to the Turkic language family and is not the ancestor of all human languages. Historical linguistics reconstructs multiple language families and earlier forms through systematic patterns of sound change, grammar, and documented descent; the Sun Language Theory has no evidentiary basis.
category: Linguistics
reviewedAt: 2026-08-22
