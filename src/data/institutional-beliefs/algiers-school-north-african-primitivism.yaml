  institutions:
  - Faculty of Medicine of Algiers
  - School of Algiers psychiatry
  - Blida-Joinville psychiatric hospital
  institutionalContext: Porot's 1918 Notes de psychiatrie musulmane, written after wartime neuropsychiatric work
    and while he was associated with the Algiers medical faculty, portrayed the colonised Muslim population through
    a hierarchy of supposedly primitive mental development. As psychiatric institutions were established in Algeria
    in the 1930s, the School of Algiers became a durable teaching and clinical network. Porot and Jean Sutter's
    1939 paper explicitly theorised the 'primitivism' of North Africans as relevant to mental pathology. The framework
    circulated through psychiatric education, textbooks, hospital practice and medico-legal interpretation until
    French colonial institutions were transformed by Algerian independence.
  consequences:
  - Medical teaching that presented racial and colonial stereotypes as characteristics of North African psychology
  - Clinical interpretation of patients through assumptions of primitive mentality and innate impulsivity
  - Medico-legal writing that racialised explanations of violence and criminal behaviour
  - Scientific legitimation for a colonial hierarchy that treated the colonised population as developmentally inferior
  - Institutional resistance by Frantz Fanon and later psychiatrists seeking more social, cultural and humanistic
    approaches
  summary: The School of Algiers made colonial hierarchy part of psychiatric explanation. A population-level stereotype
    of biological and psychological 'primitivism' was taught and applied through a medical faculty and psychiatric
    institutions rather than remaining a casual prejudice. Fanon's critique and subsequent historical psychiatry
    rejected the supposed racial neuropsychology as pseudoscientific and redirected attention toward social, cultural
    and individual determinants of mental illness.
  sources:
