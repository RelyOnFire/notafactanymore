schemaVersion: 2
title: Kazakh pastoral nomadism as a backward economy
proposition:
  summary: >-
    Soviet party and state authorities treated Kazakh pastoral nomadism as a backward, unstable stage of social and
    economic development and presented planned settlement, collectivization and greater reliance on fixed agriculture
    as a rational, productive route to socialist modernization.
correction:
  summary: >-
    Mobile pastoralism is neither inherently backward nor automatically suitable everywhere. In drylands it can be a
    specialized production and land-use system: mobility and shared access let herds track water and forage that vary
    across seasons and places. Its performance depends on ecology, land access, governance, markets and services.
    Settlement can be viable when chosen and properly supported, but coercively severing mobility, confiscating herds
    and imposing extraction can destroy productive capacity rather than improve it.
category: Agriculture and political economy
reviewedAt: '2026-09-30'
impact:
  summary: >-
    Soviet authorities combined planned settlement with collectivization, attacks on pastoral elites, grain and
    livestock procurement and coercive enforcement. The resulting crisis devastated the herd economy: a secret-police
    report calculated a 90.8 percent fall in animal numbers from 1929, more than 1.1 million people left Kazakhstan in
    1931–33, and about 1.5 million people died, including approximately 1.3 million ethnic Kazakhs. More than one-third
    of all Kazakhs perished. Much of the lasting shift to settled life occurred because famine survivors had lost the
    herds needed to resume mobile pastoralism, rather than through the stand-alone settlement program alone.
  highlights:
    - value: 90.8%
      label: Decline in Kazakhstan’s animal numbers from 1929, calculated in an October 1932 secret-police report
    - value: 1.1 million+
      label: People who left Kazakhstan during the height of the famine in 1931–33
    - value: ~1.3 million
      label: Ethnic Kazakhs estimated to have died within an overall death toll of about 1.5 million
  context:
    - >-
      These losses belong to the compound collectivization and famine crisis. They cannot be assigned quantitatively to
      the belief in pastoral “backwardness” or to the formal sedentarization program in isolation.
    - >-
      Historians distinguish the planned campaign to settle nomads from the much larger effects of collectivization and
      extraordinary livestock procurement. The explicit settlement program soon became secondary, while herd loss,
      hunger, flight and dependence on state aid forced many survivors into settled life.
    - >-
      Mortality estimates remain contested because deaths, epidemic disease and mass migration were difficult to
      separate. The figures shown here follow Sarah Cameron’s synthesis and are presented as estimates, not a precise
      census of victims.
episodes:
  - id: soviet-kazakhstan-1928-1933
    polity: Soviet Kazakhstan
    region: Central Asia
    startYear: 1928
    endYear: 1933
    periodLabel: 1928–1933
    strength: policy-basis
    institutionTypes:
      - government
    institutions:
      - Central Committee of the All-Union Communist Party (Bolsheviks)
      - Kazakh Regional Committee (Kazkraikom) of the All-Union Communist Party (Bolsheviks)
      - Central Executive Committee of the Kazakh ASSR
      - Republican Sedentarization Committee
    institutionalContext: >-
      Moscow set the central collectivization and procurement priorities. Kazkraikom under Filipp Goloshchekin linked
      settlement to the economic and social reconstruction of the Kazakh aul, while the republic’s Central Executive
      Committee and Sedentarization Committee planned and administered settlement. District party bodies, executive
      committees, procurement officials, police and collective-farm structures carried out the wider campaign. The list
      therefore names the principal policy and settlement bodies rather than presenting that implementation network as
      one institution.
    consequences:
      - Settlement sites were imposed without adequate water, food, housing, pasture, tools or building materials
      - Collectivization and procurement contributed to a catastrophic collapse of livestock and pastoral food security
      - More than 1.1 million people fled Kazakhstan during 1931–33, and many never returned
      - The wider famine killed about 1.5 million people, including roughly 1.3 million ethnic Kazakhs
      - Herd loss and refugee resettlement made much of the resulting sedentarization effectively irreversible
    summary: >-
      From 1928, Soviet authorities attacked pastoral elites and accelerated the socialist transformation of the steppe.
      In late 1929, Kazkraikom formally tied settlement to the reconstruction of production, and republic institutions
      began an ambitious program of settlement points. The campaign was rapidly merged with forced collectivization.
      From 1930, extraordinary livestock procurement intensified an existing food crisis, while warnings about steppe
      conditions and mounting hunger failed to produce a timely reversal. Settlement policy formed part of the coercive
      transformation, but the formal program alone did not cause the full death toll: procurement, collectivization,
      herd slaughter and confiscation, flight, disease and administrative violence interacted in the famine.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Central and republic bodies converted the modernization judgment into settlement targets, collective-farm
        enrollment, fixed settlement points and agricultural reorganization. Procurement and enforcement agencies then
        operated alongside this program, destroying the mobility, herds and resource access on which pastoral production
        depended.
    institutionalCorrection:
      status: partial
      periodLabel: 17 September 1932–1933
      action: >-
        The Central Committee authorized food and seed aid and private livestock holdings, exempted nomadic and
        semi-nomadic farms from centralized grain and livestock procurement and state taxes for two years, reduced
        Kazakhstan’s grain quota, and removed Goloshchekin in early 1933.
      summary: >-
        The measures retreated from the most destructive extraction and restored limited room for private herds and
        pastoral mobility. They were only a partial correction: the September resolution still endorsed gradual
        settlement, collectivization, expanded agriculture and European-style villages, and it did not repudiate the
        underlying hierarchy that cast settled socialist production as the destination of development.
