evidence:
  - id: phrenology-cortex-proposition
    sourceId: cortex-empirical-test
    relation: documents
    target: {scope: belief, aspect: proposition}
    note: >-
      Defines phrenology's fundamental inferential chain: local brain organs were supposed to shape the skull and scalp,
      allowing mental faculties to be read indirectly from the outer surface of the head.
  - id: phrenology-cortex-correction
    sourceId: cortex-empirical-test
    relation: supports
    target: {scope: belief, aspect: correction}
    note: >-
      Reports an MRI analysis using the first UK Biobank imaging release of 5,724 participants. It found no statistically
      significant or meaningful relationship between local scalp curvature and the tested proxies for phrenological
      faculties, while brain gyrification explained very little variation in scalp curvature.
  - id: phrenology-ulster-impact
    sourceId: ulster-cardinal
    relation: supports
    target: {scope: belief, aspect: impact}
    note: Describes the founding and spread of British phrenological societies and the decline of scientific phrenology by about 1850.
  - id: phrenology-bjhs-impact
    sourceId: bjhs-combe
    relation: supports
    target: {scope: belief, aspect: impact}
    note: Examines George Combe, the Edinburgh Phrenological Society, and phrenology's social and educational ambitions.
  - id: phrenology-archives-impact
    sourceId: edinburgh-society-archives
    relation: documents
    target: {scope: belief, aspect: impact}
    note: >-
      The official archival catalogue dates the society's formation to 22 February 1820 and describes minute books through
      1870, lecture records, visitor records, catalogues of casts and skulls, correspondence and printed material.
  - id: phrenology-museum-impact
    sourceId: edinburgh-anatomical-museum
    relation: supports
    target: {scope: belief, aspect: impact}
    note: >-
      Describes the society's museum and the surviving collection of roughly 1,000 busts, masks, skulls, models and
      artworks, estimated to be less than half of the original collection.
