entryId: gravitational-lensing
sourceReviewedAt: '2026-08-21'
term: Gravitationslinseneffekt
aliases:
- Gravitationslinse
- Gravitationslinsen
shortDefinition: Die Ablenkung und Verzerrung von Licht durch Gravitation beim Vorbeilaufen an Masse.
longDefinition: Nach der allgemeinen Relativitätstheorie krümmt Masse die Raumzeit und damit auch die Bahnen von Lichtstrahlen.
  Beim Gravitationslinseneffekt verändert Vordergrundmasse scheinbare Position, Form oder Helligkeit weiter entfernter
  Quellen. Aus diesen Verzerrungen können Astronomen die gesamte gravitierende Masse kartieren, einschließlich Materie,
  die wenig oder kein Licht aussendet.
