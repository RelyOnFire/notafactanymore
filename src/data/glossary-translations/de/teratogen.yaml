term: Teratogen
aliases:
- teratogen
- Teratogenität
- teratogen
shortDefinition: Ein Einfluss, der die Entwicklung von Embryo oder Fötus stören und angeborene Fehlbildungen verursachen
  kann.
longDefinition: Ein Teratogen kann ein Arzneimittel, eine Chemikalie, eine Infektion, eine physikalische Einwirkung
  oder ein anderer Faktor sein, der die vorgeburtliche Entwicklung stört. Die Wirkung hängt häufig stark von Dosis
  und Zeitpunkt der Exposition in der Schwangerschaft ab.
