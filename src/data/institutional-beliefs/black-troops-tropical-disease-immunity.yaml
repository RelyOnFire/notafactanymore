  - United States Army
  institutionalContext: >-
    War Department and Army officials operated in a medical culture that often treated Black ancestry as conferring
    natural resistance to yellow fever and other tropical diseases. Four of the volunteer “Immune” regiments were
    organized as Black units, while Black regulars already serving in Cuba were also assigned duties on the assumption
    that they could withstand tropical disease better than white soldiers. The 24th Infantry, for example, was ordered
    to hospital duty at Siboney as yellow fever spread. Disease rates among the soldiers themselves soon undermined
    the supposed racial protection.
  consequences:
  - Racial assumptions influenced recruitment and organization of Black “Immune” volunteer regiments
  - Black regular troops were assigned to disease-stricken duties partly because of supposed natural resistance
  - Soldiers were exposed to tropical disease without the protection the racial theory implied
  - High malaria and yellow-fever morbidity among Black troops contradicted the institutional assumption
  summary: >-
    In 1898 U.S. military authorities treated Black soldiers as especially suited to tropical service because they
    were believed to possess greater natural resistance to yellow fever and related diseases. The belief shaped the
    organization of Black “Immune” regiments and the assignment of Black regulars to sick-duty roles in Cuba.
    Official Army history records that 50 percent of 471 men of the 24th Infantry reporting at Siboney nevertheless
    contracted malaria or yellow fever, helping expose the supposed racial immunity as false.
