locale: de
entryId: significant-wave-height
sourceReviewedAt: '2026-08-21'
term: Signifikante Wellenhöhe
aliases:
- Hs
shortDefinition: Eine Standardgröße für den Seegang, historisch definiert als mittlere Höhe des höchsten Drittels
  der Wellen.
longDefinition: Die signifikante Wellenhöhe fasst die Größe der Wellen eines Seegangs zusammen. Die klassische Beobachtungsdefinition
  ist die mittlere Höhe des höchsten Drittels der Wellen; moderne Messverfahren bestimmen eine entsprechende Größe
  häufig statistisch aus dem Wellenspektrum. Monsterwellen werden üblicherweise relativ zu diesem Hintergrund definiert.
