locale: de
entryId: covid-organics-covid-treatment
sourceReviewedAt: '2026-08-24'
title: Covid-Organics als etablierte COVID-19-Prävention und -Behandlung
claim: Madagaskar behandelte Covid-Organics als präventives und therapeutisches Mittel gegen COVID-19 und verteilte
  es im Rahmen staatlicher Politik, bevor randomisierte Studien gezeigt hatten, dass es die Krankheit verhindert
  oder behandelt.
currentUnderstanding: Ein plausibler Pflanzeninhaltsstoff oder traditionelle Nutzung belegt keine klinische Wirksamkeit
  gegen COVID-19. Als Covid-Organics beworben und verteilt wurde, war in ausreichend kontrollierten randomisierten
  Studien nicht gezeigt worden, dass es COVID-19 verhindert oder behandelt. Die spätere klinische Prüfung war daher
  ein Evidenzschritt, der Behauptungen eines etablierten therapeutischen Nutzens hätte vorausgehen müssen.
impact:
  summary: Madagaskar überführte Covid-Organics von einem lokal entwickelten Präparat in die nationale Pandemiepolitik.
    Regierungspläne und Rechnungsprüfungen dokumentieren Massenverteilung, Einsatz an Schulen und in der Verwaltung
    sowie die Einbindung in die COVID-Reaktion, bevor die Wirksamkeit randomisiert belegt war. Die WHO behandelte
    das verwandte CVO+-Produkt später als Prüfpräparat, das eine Phase-III-Studie benötigte.
  highlights:
  - value: '2020'
    label: Covid-Organics wurde Teil der nationalen Pandemiepolitik und massenhaft verteilt
  - value: 270.000 Schüler
    label: Der nationale Notfallplan dokumentierte die Verteilung von Masken und Covid-Organics an Prüfungsklassen
  - value: '2021'
    label: Die WHO beschrieb CVO+ als Gegenstand einer Phase-III-Prüfung statt als etablierte Behandlung
  context:
  - Artemisia und andere Pflanzen können medizinisch nützliche Wirkstoffe enthalten. Der strittige Sprung führte
    von Zusammensetzung und Vorbeobachtungen zur Behandlung einer COVID-19-Wirkung als bereits etabliert.
episodes:
- id: madagascar-2020-2021
  polity: Madagaskar
  institutions:
  - Presidency of the Republic of Madagascar
  - Prime Minister’s Office (Primature de Madagascar)
  institutionalContext: Covid-Organics wurde Teil der nationalen COVID-Reaktion und blieb kein rein privates Prüfpräparat.
    Regierungsdokumente belegen Verteilung an Bevölkerung und Schulen; der Rechnungshof dokumentierte die Massenverteilung
    und zugleich das Fehlen wissenschaftlicher Belege für einen kausalen Zusammenhang mit den beobachteten Ergebnissen.
    Der Übergang zu einer formellen Phase-III-Prüfung 2021 bedeutete keinen vollständigen staatlichen Widerruf.
  summary: 2020 band Madagaskar Covid-Organics in seine COVID-19-Reaktion ein und verteilte es breit als Schutz-
    und Behandlungsmittel. Offizielle Notfall- und Prüfberichte dokumentieren die Verteilung an Schulen und Bevölkerung
    sowie seine politische Einbindung. Kontrollierte Evidenz für eine präventive oder therapeutische Wirkung fehlte.
    2021 beschrieb die WHO das verwandte CVO+-Präparat als Mittel, dessen Sicherheit und Wirksamkeit erst in einer
    Phase-III-Studie geprüft werden mussten.
  consequences:
  - Massenhafte präventive Verteilung über lokale Verwaltungsstrukturen
  - Verteilung an Schüler und öffentliche Dienste
  - Einbindung eines unbewiesenen Mittels in die nationale COVID-Reaktion
  - Öffentliche therapeutische Legitimation vor Vorliegen randomisierter Wirksamkeitsdaten
