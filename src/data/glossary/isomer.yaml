term: Isomer
aliases:
- isomers
- isomerism
shortDefinition: One of two or more compounds that share the same molecular formula but differ in how their atoms are
  connected or arranged in space.
longDefinition: Isomers contain the same kinds and numbers of atoms but differ in molecular structure. Constitutional
  isomers differ in which atoms are bonded to which, while stereoisomers have the same connectivity but different three-dimensional
  arrangements. Because structure affects interactions and energy, isomers can have very different physical, chemical,
  and biological properties despite sharing a formula.
relatedTerms: []
reviewedAt: '2026-08-21'
