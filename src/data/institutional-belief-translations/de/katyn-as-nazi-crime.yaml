schemaVersion: 2
locale: de
entryId: katyn-as-nazi-crime
sourceReviewedAt: '2026-09-24'
title: Das Massaker von Katyn als NS-Verbrechen
proposition:
  summary: >-
    Der sowjetische Staat hielt offiziell daran fest, dass NS-Deutschland und nicht der sowjetische NKWD die polnischen
    Gefangenen ermordet habe, deren Massengräber in Katyn entdeckt wurden; im kommunistischen Polen wurde diese
    Zuschreibung als autorisierte Darstellung durchgesetzt.
correction:
  summary: >-
    Die Morde wurden im Frühjahr 1940 vom sowjetischen NKWD auf Grundlage eines Politbüro-Beschlusses verübt, den Stalin
    und weitere führende sowjetische Funktionäre billigten. Laut einem KGB-Vermerk von 1959 wurden bei der umfassenderen
    Katyn-Erschießungsaktion 21.857 polnische Gefangene und Häftlinge getötet; 4.421 davon wurden als im Wald von Katyn
    ermordet erfasst. NS-Deutschland nutzte die Entdeckung der Gräber 1943 propagandistisch, doch dieser Propagandazweck
    machte die sowjetische Gegenbehauptung nicht wahr. Am 13. April 1990 erkannte die UdSSR die Verantwortung des NKWD
    offiziell an.
impact:
  summary: >-
    Katyn wurde zu einer jahrzehntelangen staatlichen Geschichtsfälschung statt zu einem vorübergehenden Irrtum in
    Kriegszeiten. Nachdem Deutschland die Gräber 1943 bekannt gemacht hatte, beschuldigte die sowjetische Regierung
    deutsche Truppen, schuf eine Kommission, deren Auftrag die deutsche Täterschaft bereits voraussetzte, und versuchte
    später, diese Anschuldigung vor dem Nürnberger Tribunal vorzubringen. 1959 empfahl ein KGB-Vermerk die Vernichtung
    der personenbezogenen Akten aller 21.857 Erschossenen. Im kommunistischen Polen wurde die sowjetische Version durch
    Zensur und Repression als öffentliche Doktrin durchgesetzt. Erst 1990 erkannte die UdSSR die Verantwortung des NKWD an.
  highlights:
    - value: '21.857'
      label: Opfer laut KGB-Vermerk von 1959 bei der umfassenderen Katyn-Erschießungsaktion von 1940
    - value: '4.421'
      label: davon als im Wald von Katyn ermordete Opfer erfasst
    - value: 47 Jahre
      label: von der sowjetischen öffentlichen Zuschreibung an Deutschland 1943 bis zum offiziellen Eingeständnis 1990
    - value: '1959'
      label: KGB-Chef Alexander Schelepin empfahl die Vernichtung der personenbezogenen Opferakten
  context:
    - >-
      „Massaker von Katyn“ wird häufig als Bezeichnung für die umfassendere NKWD-Aktion mit Tötungen in Katyn, Charkiw,
      Twer/Mednoje und weiteren Orten verwendet. Es bedeutet nicht, dass rund 22.000 Leichen im Wald von Katyn gefunden
      wurden. Zeitgenössische und archivalische Zahlen verorten etwa 4.400 Gefangene aus Koselsk am Tatort Katyn.
    - >-
      Deutsche Behörden machten die Gräber aus strategischen Propagandagründen öffentlich und organisierten eine
      internationale forensische Kommission. Deren Datierung der Todesfälle auf 1940 stimmt mit den später geöffneten
      sowjetischen Archiven überein; propagandistische Verwendung von Beweisen macht diese nicht automatisch falsch.
    - >-
      Die falsche Zuschreibung wurde institutionell aufrechterhalten, unabhängig davon, ob führende Funktionäre selbst
      aufrichtig an sie glaubten. Entscheidend waren die offizielle Übernahme, Verbreitung und Durchsetzung der Behauptung.
episodes:
  - id: soviet-union-1943-1990
    polity: Sowjetunion
    institutions:
      - Sowjetisches Informationsbüro
      - Außerordentliche Staatliche Kommission der UdSSR
      - Sonderkommission unter Nikolai Burdenko
      - Politbüro der Kommunistischen Allunionspartei (Bolschewiki), später KPdSU
      - sowjetische Anklagevertretung vor dem Internationalen Militärgerichtshof
    institutionalContext: >-
      Am 15. April 1943 reagierte das Sowjetische Informationsbüro auf die deutsche Bekanntgabe der Gräber von Katyn,
      indem es deutsche Truppen beschuldigte. Nach der Rückeroberung der Region Smolensk setzte die Außerordentliche
      Staatliche Kommission die Burdenko-Kommission ein, deren offizieller Name bereits von durch „deutsch-faschistische
      Eindringlinge“ erschossenen polnischen Gefangenen ausging; das Partei-Politbüro billigte den Beschluss, und der Bericht
      vom Januar 1944 datierte die Morde auf den Herbst 1941. Sowjetische Ankläger stützten sich später in Nürnberg auf
      diese Darstellung. Die eigentlichen Akten blieben geheim. 1959 teilte KGB-Chef Alexander Schelepin Nikita
      Chruschtschow mit, dass bei der Aktion von 1940 insgesamt 21.857 Menschen erschossen worden waren, und empfahl die
      Vernichtung ihrer Einzelakten. Erst am 13. April 1990 erkannte die amtliche Nachrichtenagentur TASS die direkte
      Verantwortung des NKWD an.
    consequences:
      - Offizielle sowjetische Zuschreibung der NKWD-Morde an NS-Deutschland
      - Einrichtung einer staatlichen Untersuchungskommission, deren Auftrag und Bericht deutsche Verantwortung behaupteten
      - Versuch, die falsche Zuschreibung im Nürnberger Verfahren als Anklagepunkt zu verwenden
      - Jahrzehntelange Geheimhaltung der Politbüro- und NKWD-Dokumente
      - Empfehlung des KGB-Chefs von 1959, die personenbezogenen Akten von 21.857 Erschossenen zu vernichten
    summary: >-
      Die sowjetische Regierung gab Deutschland im April 1943 offiziell die Schuld an Katyn und schuf nach der
      Rückeroberung des Gebiets einen staatlichen Beweisrahmen für diese Zuschreibung. Die Burdenko-Kommission behauptete,
      deutsche Truppen hätten die Gefangenen 1941 ermordet; sowjetische Ankläger brachten diese Version später in Nürnberg
      vor. Gleichzeitig bewahrte die sowjetische Führung geheime Unterlagen auf, die den Politbüro-Beschluss zur
      Erschießung vom März 1940 dokumentierten. Ein KGB-Vermerk von 1959 erfasste sogar 21.857 Exekutionen und empfahl die
      Vernichtung der Opferakten. Erst am 13. April 1990 erkannte die sowjetische Regierung die Verantwortung des NKWD
      offiziell an.
    mechanism:
      summary: >-
        Sowjetische Informations-, Untersuchungs- und Anklageorgane veröffentlichten und verteidigten die deutsche
        Täterschaft, während die zugrunde liegenden Politbüro- und NKWD-Akten geheim blieben.
    institutionalCorrection:
      periodLabel: 13. April 1990
      action: TASS erkannte die direkte Verantwortung des NKWD für die Morde von Katyn offiziell an.
      summary: >-
        Der Sowjetstaat kehrte seine jahrzehntelange Zuschreibung an Deutschland öffentlich um und benannte Beria,
        Merkulow und ihre NKWD-Untergebenen als verantwortlich.
  - id: polish-peoples-republic-1944-1989
    polity: Volksrepublik Polen
    institutions:
      - Polnische Arbeiterpartei / Polnische Vereinigte Arbeiterpartei
      - staatlicher Zensurapparat der Volksrepublik Polen
      - staatlicher Sicherheits- und Justizapparat der Volksrepublik Polen
    institutionalContext: >-
      Sowjetisch gestützte kommunistische Institutionen in Polen übernahmen die Behauptung deutscher Täterschaft bereits
      beim Aufbau des neuen Regimes. In der stalinistischen Phase wurde sie offen propagiert; später bevorzugten die
      Behörden häufig Schweigen, doch Zensurvorgaben untersagten weiterhin, die UdSSR für den Tod der polnischen Offiziere
      verantwortlich zu machen. Staatliche Geschichtsschreibung, Verlage und Rundfunk bewegten sich innerhalb dieser
      Grenze. Wer sie öffentlich infrage stellte, konnte Zensur, Schikanen oder andere Repression erfahren. In der zweiten
      Hälfte des Jahres 1989 ermöglichte der Zerfall kommunistischer Kontrolle die offene Veröffentlichung der
      sowjetischen Verantwortung ohne die bisherigen Beschränkungen.
    consequences:
      - Zensur von Veröffentlichungen, die die Sowjetunion für Katyn verantwortlich machten
      - Staatlich kontrollierte Geschichts- und Mediennarrative, die die Täterschaft unterdrückten oder verfälschten
      - Schikanen und Repression gegen Autoren, Journalisten, Familien und Aktivisten, die die autorisierte Darstellung infrage stellten
      - Verfälschung rechtlicher und öffentlicher Angaben zu Todeszeitpunkt und Todesumständen der Opfer
    summary: >-
      Im kommunistischen Polen wurde die sowjetische Katyn-Darstellung mehr als nur die Behauptung einer verbündeten
      Regierung: Sie bildete eine durchgesetzte Grenze öffentlicher Geschichtsschreibung. Die Behörden wiederholten
      zunächst offen die deutsche Täterschaft und versuchten später häufig, das Thema ganz aus der Öffentlichkeit zu
      verdrängen; Zensurvorgaben verboten weiterhin die Zuschreibung an die UdSSR. Dokumentationen des IPN belegen
      Repression und Schikanen gegen Menschen, die sowjetische Verantwortung öffentlich machten. Während der politischen
      Transformation 1989 verlor die Doktrin ihre Durchsetzbarkeit, einige Monate bevor die UdSSR selbst die
      NKWD-Verantwortung offiziell eingestand.
    mechanism:
      summary: >-
        Partei- und Staatszensur sowie kontrollierte Geschichtsschreibung untersagten die öffentliche Zuschreibung an die
        Sowjetunion und unterdrückten Widerspruch gegen die autorisierte Darstellung.
    institutionalCorrection:
      periodLabel: Frühjahr bis zweite Jahreshälfte 1989
      action: Im Frühjahr 1989 ließen die Behörden die Möglichkeit einer NKWD-Täterschaft offiziell zu; in der zweiten Jahreshälfte konnte die sowjetische Verantwortung ohne die früheren Beschränkungen veröffentlicht werden.
      summary: >-
        Vor dem Ende der Volksrepublik Polen gab es keine umfassende förmliche Rücknahme durch den Parteistaat, doch
        offizielle Haltung und Zensurpolitik änderten sich: Im Frühjahr 1989 ließen die Behörden die Möglichkeit eines
        NKWD-Verbrechens zu; in der zweiten Jahreshälfte war eine uneingeschränkte öffentliche Zuschreibung möglich.
evidence:
  - id: katyn-echr-proposition
    note: >-
      Die gerichtliche Sachverhaltsdarstellung dokumentiert die sowjetische Behauptung deutscher Täterschaft, den
      Burdenko-Bericht, den Nürnberger Vorwurf der sowjetischen Anklage und das amtliche Kommuniqué von 1990, das die
      direkte Verantwortung des NKWD benannte. Sie belegt den sowjetischen Teil der Proposition; die polnische
      Durchsetzung wird durch die folgende Evidenzbeziehung dokumentiert.
  - id: katyn-ipn-lie-proposition
    note: >-
      Die institutionelle Darstellung verfolgt die offizielle sowjetische Version vom Burdenko-Kommuniqué bis zu ihrer
      Verbreitung in der UdSSR und der Volksrepublik Polen, wo kommunistische Institutionen sie übernahmen und durchsetzten.
  - id: katyn-decision-correction
    note: >-
      Die Archivtranskription dokumentiert Lawrenti Berias Vorschlag, das Sonderverfahren und die Erschießung sowie die
      von Stalin und weiteren führenden sowjetischen Funktionären unterzeichnete Billigung des Politbüros.
  - id: katyn-echr-correction
    note: >-
      Die gerichtliche Zusammenfassung dokumentiert den Politbüro-Beschluss vom März 1940, die Tötungen durch den NKWD im
      April und Mai, Schelepins Gesamtzahl von 21.857 mit 4.421 Opfern im Wald von Katyn sowie das amtliche sowjetische
      Kommuniqué vom 13. April 1990.
  - id: katyn-echr-impact
    note: >-
      Die Zusammenfassung des Gerichtshofs liefert die Zahlen von 21.857 insgesamt und 4.421 im Wald von Katyn aus
      Schelepins Vermerk, die sowjetische Behauptung deutscher Täterschaft, den Burdenko-Bericht, den Nürnberger Vorwurf,
      die Geheimhaltung der Akten von 1940 und die Empfehlung zur Vernichtung der Opferakten sowie das Eingeständnis von 1990.
  - id: katyn-nara-impact-context
    note: >-
      Die amtliche Archivübersicht beschreibt die deutsch organisierte internationale Ärztekommission, ihre Datierung
      der Todesfälle auf 1940, die Verwendung dieser Belege für deutsche Propaganda und die spätere einstimmige
      Feststellung eines US-Kongressausschusses, dass der NKWD verantwortlich war.
  - id: katyn-soviet-information-carrier
    note: >-
      Die amtliche Chronologie datiert das Kommuniqué des Sowjetischen Informationsbüros, das die Enthüllungen von Katyn
      als „Goebbels-Verleumdungen“ beantwortete, auf den 15. April 1943 und belegt dieses Informationsorgan damit
      unmittelbar als ursprünglichen Träger.
  - id: katyn-soviet-echr-carrier
    note: >-
      Die gerichtliche Zusammenfassung benennt sowjetische Behörden, die vom NKWD eingesetzte Kommission unter Burdenko
      und den sowjetischen Ankläger, der sich in Nürnberg auf ihren Bericht stützte. Sie belegt diese Träger, ohne alle
      sowjetischen Organe gleichzusetzen.
  - id: katyn-soviet-party-carrier
    note: >-
      Die IPN-Darstellung schreibt die Einsetzung der Burdenko-Kommission der Außerordentlichen Staatlichen Kommission zu,
      verzeichnet die Billigung des Politbüros, beschreibt die Partei- und Staatsentscheidung hinter dem Nürnberger
      Vorwurf und dokumentiert einen Politbüro-Beschluss von 1971 zur Verteidigung der deutschen Täterschaft. Deshalb
      nennt die Trägerliste diese präzisen Organe und entfernt den unbelegten Rat der Volkskommissare.
  - id: katyn-soviet-mechanism
    note: >-
      Die Zusammenfassung des Gerichtshofs dokumentiert die Abfolge aus amtlicher Gegenbehauptung, der vom NKWD
      eingesetzten Kommission, dem veröffentlichten Befund von 1944, seiner Verwendung durch die Anklage in Nürnberg und
      dem fortgesetzten Verschluss der widersprechenden Akten.
  - id: katyn-soviet-ipn-mechanism
    note: >-
      Die institutionelle Darstellung unterscheidet die Vorbereitung der Erzählung durch den Sicherheitsapparat vom für
      die Öffentlichkeit bestimmten Burdenko-Kommuniqué und verfolgt dessen anschließende Veröffentlichung und
      propagandistische Verbreitung.
  - id: katyn-soviet-consequences
    note: >-
      Diese Abschnitte belegen sämtliche aufgeführten sowjetischen Folgen: die Schuldzuweisung an Deutschland, den
      Burdenko-Befund, seine Nutzung in Nürnberg, den beschränkten Zugang zu „Paket Nr. 1“ und Schelepins Empfehlung,
      21.857 personenbezogene Akten zu vernichten.
  - id: katyn-soviet-correction
    note: >-
      Die IPN-Chronologie verzeichnet das TASS-Kommuniqué vom 13. April 1990, das die direkte Verantwortung des NKWD
      anerkannte und Katyn als eines der schwersten Verbrechen des Stalinismus bezeichnete.
  - id: katyn-soviet-correction-echr
    note: >-
      Der Gerichtshof fasst das amtliche Kommuniqué der sowjetischen Nachrichtenagentur vom 13. April 1990 unabhängig
      zusammen, wonach Beria, Merkulow und ihre Untergebenen die direkte Verantwortung trugen.
  - id: katyn-us-archives-context
    note: >-
      Die amtliche Archivübersicht beschreibt die deutsch organisierte forensische Kommission von 1943, die sowjetische
      Gegenuntersuchung und die spätere einstimmige Feststellung eines US-Kongressausschusses zur NKWD-Verantwortung. Das
      liefert externen Kontext und keinen Beleg für eine sowjetische Selbstkorrektur.
  - id: katyn-polish-carrier
    note: >-
      Die institutionelle Darstellung dokumentiert die Übernahme durch polnische kommunistische Organisationen und die
      Polnische Arbeiterpartei sowie die anschließende Propaganda, Zensur, Tätigkeit des Sicherheitsapparats und
      kontrollierte Geschichtsschreibung des Parteistaats während der gesamten Volksrepublik Polen.
  - id: katyn-polish-mechanism
    note: >-
      Der Artikel reproduziert eine Zensuranweisung, die Versuche untersagte, der UdSSR die Verantwortung für den Tod der
      polnischen Offiziere zuzuschreiben, und beschreibt die Bemühungen der Opposition von 1976 bis 1989, das
      Informationsmonopol zu brechen.
  - id: katyn-polish-censorship-mechanism
    note: >-
      Diese Darstellung unterscheidet die offene Propaganda deutscher Täterschaft in der stalinistischen Phase von der
      späteren Politik des Schweigens, der Zensur und der Entfernung Katyns aus Massenmedien und Nachschlagewerken.
  - id: katyn-polish-consequences
    note: >-
      Die IPN-Darstellung beschreibt Zensur, kontrollierte Geschichtsschreibung, Schikanen gegen Opferfamilien,
      Journalisten und Schriftsteller, Strafverfahren, Festnahmen, Beschlagnahmen und die Repression von Versuchen, die
      sowjetische Verantwortung öffentlich zu machen.
  - id: katyn-polish-consequences-history
    note: >-
      Die institutionelle Darstellung berichtet von rund einhundert dokumentierten Fällen, in denen Strafverfolgungs-
      oder Justizorgane an Repressionen im Zusammenhang mit Katyn beteiligt waren, und unterscheidet dabei Veränderungen
      von Intensität und Form im Zeitverlauf.
  - id: katyn-polish-correction
    note: >-
      Das IPN dokumentiert eine partielle institutionelle Änderung 1989: Im Frühjahr ließen die Behörden die Möglichkeit
      eines NKWD-Verbrechens offiziell zu, die Zensur griff zunächst weiterhin ein, und in der zweiten Jahreshälfte wurde
      eine uneingeschränkte Veröffentlichung möglich. Eine umfassende förmliche Rücknahme durch den scheidenden
      Parteistaat ist nicht belegt.
