entryId: lidar
sourceReviewedAt: '2026-08-21'
term: Lidar
aliases:
- LiDAR
- Laserscanning
shortDefinition: Ein Fernerkundungsverfahren, das Entfernungen mit Laserpulsen misst und daraus detaillierte dreidimensionale
  Karten erzeugt.
longDefinition: Lidar sendet Laserpulse zu einer Oberfläche und bestimmt aus dem zurückkehrenden Licht die Entfernung.
  Aus der Luft können genügend Pulse durch Lücken in der Vegetation gelangen, um die Geländeform zu rekonstruieren
  und archäologische Strukturen unter dichtem Wald sichtbar zu machen.
