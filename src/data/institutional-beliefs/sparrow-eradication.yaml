    summary: During the Four Pests campaign, sparrows were targeted nationally as crop-eating pests. Mass killing sharply reduced sparrow populations; historical and ecological reviews describe insect outbreaks, ecological disruption, and poor harvest effects. This card does not attribute the Great Famine to the sparrow campaign alone.
