schemaVersion: 2
title: Australia as terra nullius with no Indigenous land rights
proposition:
  summary: >-
    British and Australian land law treated Aboriginal and Torres Strait Islander laws and customs as incapable of
    generating proprietary rights that the common law had to recognise. Acquisition of sovereignty was therefore taken
    to give the Crown beneficial ownership of all land, rather than a radical title burdened by any surviving native title.
correction:
  summary: >-
    In Mabo v Queensland (No 2) on 3 June 1992, the High Court of Australia rejected that property-law foundation. Six
    justices held that native title could survive the Crown's acquisition of sovereignty because the Crown acquired
    radical title, not automatic beneficial ownership of every parcel. Native title draws its content from the relevant
    Indigenous laws and customs, but survives only where the required continuity is established and no valid, inconsistent
    governmental act has extinguished it. The Court did not overturn the Crown's sovereignty.
category: Law, Indigenous land rights and colonial doctrine
reviewedAt: '2026-09-25'
impact:
  summary: >-
    The rule operated through administration as well as case law. Governor Richard Bourke's 1835 proclamation called the
    lands covered by John Batman's attempted purchase “vacant Lands of the Crown,” made agreements with Aboriginal people
    void against Crown rights and treated occupation without government authority as trespass. In Cooper v Stuart in
    1889, while deciding which English law applied in New South Wales, the Privy Council described the colony at annexation
    as practically unoccupied and without settled inhabitants or settled law. In Milirrpum v Nabalco in 1971, Blackburn J
    found that the Yolngu had a subtle and elaborate system of law, yet held that communal native title was not part of
    Australian common law and that the particular proprietary claim had not been proved. Mabo reversed the general
    common-law exclusion in 1992. Parliament then enacted the Native Title Act 1993 to recognise and protect native title,
    regulate future dealings, determine claims and validate specified past acts.
  highlights:
    - value: 157 years
      label: from Bourke's 1835 proclamation to the High Court's Mabo judgment in 1992
    - value: 6–1
      label: High Court majority recognising the Meriam people's native title in Mabo (No 2)
    - value: '1993'
      label: year Parliament enacted the Native Title Act after Mabo
  context:
    - >-
      “Terra nullius” is a retrospective shorthand for a linked set of international-law and common-law assumptions. This
      card does not claim that officials formally proclaimed Australia under that Latin phrase in 1788. Bourke's 1835
      proclamation likewise does not contain the words terra nullius: it calls the territory “vacant Lands of the Crown”
      and denies private purchases from Aboriginal people any effect against Crown rights.
    - >-
      Cooper v Stuart was a dispute about an 1823 Crown grant and the reception of the English rule against perpetuities,
      not an Aboriginal land-title claim. Its broad description of New South Wales as practically unoccupied nevertheless
      became an authoritative premise for treating the colony as settled and excluding pre-existing customary title.
    - >-
      Milirrpum did not find that the Yolngu lacked law or attachment to country. The court expressly found a sophisticated
      system of law and a well-proved spiritual relationship, but rejected common-law communal title and also found gaps in
      proof of the claimed proprietary relationship and its continuity. The defeat cannot accurately be reduced to a
      single finding.
    - >-
      Mabo changed domestic property law; it did not invalidate British acquisition of sovereignty. The judgment retained
      Crown radical title and sovereign power to extinguish native title through valid acts inconsistent with its continued
      existence.
    - >-
      Recognition did not restore every dispossessed estate. Claimants must establish rights under traditional laws and
      customs, continuing connection and an absence of extinguishment. The Australian Law Reform Commission later
      described the interpreted statutory definition as imposing an onerous burden of proof, especially where colonial
      disruption itself interrupted law, custom or access to country.
    - >-
      The Native Title Act combined recognition and protection with legal certainty for other interests. Its original
      objects included validating past acts affected by native title, and its preamble acknowledged that many people,
      having been dispossessed, would be unable to assert native title. Nor did this doctrine alone cause every act of
      dispossession: violence, legislation, pastoral expansion, reserves and removals also did so.
episodes:
  - id: australia-1835-1992
    polity: Australia
    region: Oceania
    startYear: 1835
    endYear: 1992
    periodLabel: 26 August 1835–3 June 1992
    strength: policy-basis
    institutionTypes:
      - government
      - court
    institutions:
      - Governor of New South Wales and colonial land administrations
      - Judicial Committee of the Privy Council
      - Supreme Court of the Northern Territory
      - High Court of Australia
      - Australian common-law courts
    institutionalContext: >-
      Bourke's proclamation made Crown authority the only legally effective route by which colonists could acquire or
      occupy land in the vast territory then administered as New South Wales: Batman's purported purchase from Aboriginal
      representatives was void against Crown rights, and unauthorised occupants were trespassers. Cooper v Stuart later supplied a high judicial statement that the colony
      had been practically unoccupied and without settled inhabitants or law, while resolving the reception of English law.
      Milirrpum exposed the contradiction in 1971: the Northern Territory Supreme Court accepted detailed evidence of
      Yolngu law but still denied that communal native title formed part of Australian common law and found the proprietary
      claim unproved on additional grounds. Mabo (No 2) ended that categorical exclusion on 3 June 1992 by recognising that
      native title could survive sovereignty as a burden on Crown radical title.
    consequences:
      - Aboriginal agreements purporting to transfer land were made ineffective against the Crown, which controlled lawful grants
      - The settled-colony classification imported English law while denying a common-law starting point for pre-existing Indigenous proprietary rights
      - The first customary land-rights claim, brought by Yolngu people against mining on the Gove Peninsula, failed in 1971 despite proof of an elaborate legal order
      - Crown grants and other valid, inconsistent governmental acts could extinguish native title parcel by parcel
      - Post-Mabo recognition remained limited to surviving, provable native title and did not automatically return alienated land
      - The Native Title Act created a national claims framework while also validating categories of past acts and providing for compensation
    summary: >-
      The institutional belief was not that no Indigenous people physically occupied Australia. It was that their legal
      orders could be disregarded when English land law classified the colonies and allocated property: Crown sovereignty
      was treated as Crown beneficial ownership, and customary interests supplied no generally recognisable title. Mabo
      corrected that property rule but preserved sovereignty, radical title, extinguishment and case-specific proof.
    mechanism:
      kind: standard-setting
      summary: >-
        Colonial proclamations reserved legally effective land acquisition to the Crown; the settled-colony classification
        supplied a reception rule for English law; and precedent converted that classification into a barrier to communal
        native title. Courts and land administrations could therefore allocate land without first recognising Indigenous
        proprietary rights. Mabo replaced the categorical barrier with recognition subject to continuity, proof and
        extinguishment.
    institutionalCorrection:
      status: corrected
      periodLabel: 3 June 1992
      action: >-
        The High Court of Australia in Mabo v Queensland (No 2) rejected the common-law premise that acquisition of
        sovereignty made the Crown beneficial owner of every parcel and recognised surviving native title.
      summary: >-
        The 6–1 decision recognised the Meriam people's title to most of the Murray Islands and made Crown radical title
        compatible with native title derived from Indigenous laws and customs. Parliament's 1993 Act supplied recognition,
        claims and future-act machinery. The correction is classified as complete for the categorical common-law denial,
        although extinguishment, demanding proof rules and the inability to recover many alienated lands remain material limits.
