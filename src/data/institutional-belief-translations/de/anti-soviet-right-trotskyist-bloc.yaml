  polity: Sowjetunion
  institutions:
  - Kommunistische Allunionspartei (Bolschewiki)
  - Volkskommissariat für Innere Angelegenheiten
  - Staatsanwaltschaft der UdSSR
  - Militärkollegium des Obersten Gerichts der UdSSR
  institutionalContext: Im März 1938 inszenierte der Sowjetstaat einen öffentlichen Prozess gegen 21 Angeklagte um den angeblichen
    „antisowjetischen rechts-trotzkistischen Block“. Staatsanwalt Andrei Wyschinski warf der Gruppe Spionage, Schädlingstätigkeit,
    Sabotage, terroristische Morde und Unterstützung ausländischer Intervention vor. Achtzehn Angeklagte wurden zum Tode verurteilt,
    drei erhielten langjährige Haftstrafen. Spätere Rehabilitationsverfahren entlasteten die meisten Angeklagten schrittweise.
    Am 4. Februar 1988 hob das Plenum des Obersten Gerichts der UdSSR die Urteile gegen Bucharin, Rykow und weitere noch nicht
    rehabilitierte Hauptangeklagte auf und stellte die Verfahren mangels Straftatbestands ein.
  consequences:
  - Hinrichtung von 18 Angeklagten nach einem politisch konstruierten öffentlichen Verfahren
  - Langjährige Haftstrafen für die übrigen drei Angeklagten
  - Staatliche Propaganda über ehemalige Spitzenfunktionäre als Netz ausländischer Spione, Terroristen und Saboteure
  - Nutzung von Geständnissen und Justiztheater zur Legitimation des Großen Terrors
  - Jahrzehntelange amtliche Behandlung der Urteile als Beleg für Verrat
  - Posthume Rehabilitierung von 20 der 21 Angeklagten
  summary: Der dritte Moskauer Prozess verwandelte eine angeblich vom Ausland gesteuerte Verschwörung in ein autoritäres Gerichtsurteil
    und Propagandaereignis. Achtzehn Angeklagte wurden zum Tode verurteilt. Die spätere sowjetische Justizprüfung erklärte
    zentrale Vorwürfe gegen die rehabilitierten Angeklagten für unbelegt. Bis 1988 waren 20 der 21 Angeklagten rehabilitiert;
    Jagoda blieb die Ausnahme.
