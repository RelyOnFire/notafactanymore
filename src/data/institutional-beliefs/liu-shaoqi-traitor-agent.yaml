  - Cultural Revolution party-state apparatus
  institutionalContext: Liu Shaoqi had been president of the People's Republic of China and a vice chairman of the Communist
    Party. During the Cultural Revolution he was increasingly portrayed as China's leading capitalist-roader and head of a
    hostile bourgeois headquarters inside the Party. On 31 October 1968 the enlarged Twelfth Plenum of the Eighth Central
    Committee formally approved a special-case report declaring him a traitor, enemy agent and scab, permanently expelled
    him from the Party and removed all party and state positions. The accusation became a framework for attacks on many other
    officials and social groups labeled Liu's agents or followers. Liu was held under severe conditions, moved while gravely
    ill to detention in Kaifeng in October 1969 and died there on 12 November. After a Central Commission for Discipline Inspection
    review, the Eleventh Central Committee's Fifth Plenum on 29 February 1980 unanimously adopted a rehabilitation resolution,
    cancelled the 1968 charges and investigation report and ordered related wrongful cases corrected.
  consequences:
  - Permanent expulsion of the sitting state president from the Communist Party and removal of all party and state offices
  - Detention, political persecution and physical mistreatment culminating in Liu's death in custody in 1969
  - Use of the alleged Liu Shaoqi network to purge and persecute large numbers of party, state and military cadres
  - Extension of the accusation to workers, peasants, intellectuals, students and institutions described as products of Liu's
    revisionist line
  - Nationwide propaganda presenting a fabricated counterrevolutionary identity as an authoritative Party conclusion
  - Large-scale rehabilitation work after 1980 for people wrongly implicated through Liu's case
  summary: 'Liu Shaoqi''s fall became an institutional belief because the accusation was formally ratified by the Party''s
    Central Committee and then enforced across the party-state. The head of state was branded a traitor and enemy agent, expelled
    and detained, while supposed agents and adherents were attacked throughout the country. The CCP''s own 1980 review reversed
    the factual core of the case: it said the bourgeois-headquarters theory was untenable, materials had been fabricated to
    frame Liu and the resulting accusations against many others were wrongful.'
