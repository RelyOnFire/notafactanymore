evidence:
  - id: homeopathy-easac-correction
    sourceId: homeopathy-easac-report
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: 'Summary, p. 1; §§3.1–3.2, pp. 6–7'
    note: >-
      Concludes that there is no robust, reproducible evidence that homeopathy is effective beyond placebo for
      any known disease and that its scientific claims are inconsistent with established chemistry and physics.
  - id: homeopathy-easac-press-correction
    sourceId: homeopathy-easac-press
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: '20 September 2017; opening paragraphs before ''EASAC recommends that'''
    note: >-
      Summarizes EASAC's evidence review: no known disease has robust, reproducible evidence of homeopathic
      efficacy beyond placebo, and the central scientific claims are inconsistent with established chemistry and
      physics.
  - id: homeopathy-nhmrc-correction
    sourceId: homeopathy-nhmrc-2024
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: 'Executive summary, pp. xviii–xx; §6.1, p. 173'
    note: >-
      The 2024 evaluation reports low-certainty possible benefits over placebo for medication use in allergic
      rhinitis and disease severity in atopic dermatitis, with little to no benefit or uncertain or unknown
      effects for many other outcomes. It distinguishes placebo comparisons from no-intervention comparisons;
      the latter do not establish efficacy beyond placebo.
  - id: homeopathy-uk-proposition
    sourceId: homeopathy-uk-evidence
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: '§2, ''The policy'', paragraphs 11–15'
    note: >-
      Records that homeopathy had been funded and provided through the NHS since 1948, identifies the
      homeopathic hospitals and their NHS commissioning arrangements, and explains that funding decisions were
      made within the NHS.
