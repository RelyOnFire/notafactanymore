locale: de
entryId: close-planting-deep-plowing
sourceReviewedAt: 2026-08-22
title: Dichte Aussaat und tiefes Pflügen
claim: Sehr dichte Aussaat und ungewöhnlich tiefes Pflügen wurden als breit anwendbare Methoden behandelt, die landwirtschaftliche Erträge stark steigern würden.
currentUnderstanding: Pflanzdichte und Bodenbearbeitung haben je nach Kulturpflanze, Boden und Klima unterschiedliche Optima. Mehr Pflanzen pro Fläche oder tieferes Pflügen erhöhen den Ertrag nicht automatisch; übermäßige Dichte verschärft die Konkurrenz um Licht, Wasser und Nährstoffe, während zu tiefe oder unpassende Bodenbearbeitung die Bodenstruktur schädigen und Arbeitskraft verschwenden kann.
episodes:
  - id: china-1958-1961
    polity: Volksrepublik China
    summary: Während des Großen Sprungs nach vorn wurden tiefes Pflügen und dichte Aussaat zu landesweit propagierten Agrarmethoden erhoben und in Maos landwirtschaftliche „Acht-Punkte-Charta“ aufgenommen. Behörden trieben ihre Anwendung weit über lokal sinnvolle Bedingungen hinaus. Wirtschaftshistorische Forschung zählt diese zentral geförderten Techniken zu den Maßnahmen, die – neben mehreren anderen wesentlichen Ursachen der Krise – die landwirtschaftliche Produktion verringerten.
    consequences:
      - Verordnete oder stark erzwungene Anbaukampagnen
      - Ertragsverluste in einzelnen Regionen
      - Fehlallokation landwirtschaftlicher Arbeitskraft
