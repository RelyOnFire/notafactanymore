term: Catalyst
aliases:
- catalysts
- catalysis
- catalytic
shortDefinition: A substance that increases the rate of a chemical reaction without being consumed overall by the reaction.
longDefinition: A catalyst provides a reaction pathway with a lower activation barrier, allowing a reaction to proceed
  faster under given conditions. The catalyst participates in intermediate steps but is regenerated overall. In biology,
  most catalysts are protein enzymes, although some RNA molecules are catalytic as well.
relatedTerms:
- ribozyme
reviewedAt: '2026-08-21'
sources:
- title: The Nobel Prize in Chemistry 1989 – Press release
  url: https://www.nobelprize.org/prizes/chemistry/1989/press-release/
  publisher: The Nobel Prize
  note: Discusses biological catalysis and the discovery that RNA as well as protein can catalyze reactions.
