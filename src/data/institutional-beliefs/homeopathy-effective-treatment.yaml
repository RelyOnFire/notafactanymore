title: Homeopathy as effective treatment
claim: Homeopathic preparations were treated as therapeutically effective enough to justify their provision or reimbursement
  within public health systems.
currentUnderstanding: Homeopathy has not shown robust, reproducible therapeutic effects beyond placebo for any known
  disease. Its central claims, including effects from extreme dilutions that may contain none of the starting substance,
  are not compatible with established chemistry and pharmacology. Clinical attention and placebo effects can still
  influence how patients feel, but they do not establish a specific effect of the homeopathic preparation.
category: Medicine and public health
reviewedAt: '2026-08-23'
episodes:
- id: united-kingdom-1948-2017
  polity: United Kingdom
  region: Europe
  startYear: 1948
  endYear: 2017
  strength: policy-basis
  institutionTypes:
  - government
  - medical
  - professional
  institutions:
  - National Health Service
  - Royal London Homoeopathic Hospital
  - Bristol Homeopathic Hospital
  - Liverpool Homeopathic Hospital
  - Glasgow Homoeopathic Hospital
  institutionalContext: Homeopathy was embedded in the NHS through a mixture of specialist hospitals, general-practice
    prescribing and local commissioning rather than through a single national homeopathy agency. The named hospitals
    were identifiable NHS institutional carriers; local Primary Care Trusts and later commissioning bodies determined
    much of the referral and funding machinery. NHS England supplied the national 2017 reversal in prescribing guidance.
  consequences:
  - Public funding of homeopathic treatment
  - NHS prescribing and referrals
  - Dedicated homeopathic hospital services
  summary: Homeopathy was funded and provided within the NHS from its creation in 1948, including through specialist
    homeopathic hospitals and primary-care prescribing. A 2010 House of Commons evidence review concluded that the
    evidence did not support efficacy beyond placebo and recommended that the NHS stop funding homeopathy. NHS England
    adopted national guidance in 2017 stating that homeopathy should no longer be routinely prescribed because there
    was no clear or robust evidence of clinical effectiveness.
  sources:
  - title: 'Evidence Check 2: Homeopathy'
    url: https://publications.parliament.uk/pa/cm200910/cmselect/cmsctech/45/4504.htm
    publisher: House of Commons Science and Technology Committee
    note: Records that homeopathy had been funded and provided through the NHS since 1948, identifies the homeopathic
      hospitals and their NHS commissioning arrangements, and explains that funding decisions were made within the
      NHS.
  - title: 'Evidence Check 2: Homeopathy — Conclusions'
    url: https://publications.parliament.uk/pa/cm200910/cmselect/cmsctech/45/4506.htm
    publisher: House of Commons Science and Technology Committee
    note: Concludes that there was no credible evidence of efficacy and recommends that homeopathy should not be
      funded on the NHS.
  - title: Items which should not routinely be prescribed in primary care
    url: https://www.england.nhs.uk/long-read/items-which-should-not-routinely-be-prescribed-in-primary-care-policy-guidance/
    publisher: NHS England
    note: Records the 2017 recommendation not to initiate homeopathy and to deprescribe it because no clear or robust
      evidence supported its use on the NHS.
- id: france-1984-2020
  polity: France
  region: Europe
  startYear: 1984
  endYear: 2020
  strength: policy-basis
  institutionTypes:
  - government
  - medical
  institutions:
  - Assurance Maladie
  - Ministère des Affaires sociales et de la Solidarité nationale
  institutionalContext: The 1984 reimbursement list was issued by the Ministère des Affaires sociales et de la Solidarité
    nationale and operated through compulsory health insurance, prescribing physicians and pharmacies. Those distributed
    professional channels are described here rather than listed as a fictitious single ‘prescribing and pharmacy
    system.’ In 2019 the Haute Autorité de Santé performed the scientific reassessment that led to withdrawal of
    reimbursement.
  consequences:
  - Public reimbursement of homeopathic medicines
  - Routine prescribing within insured health care
  - Institutional medical legitimacy without prior efficacy assessment
  summary: Homeopathic medicines were reimbursable through France's compulsory health-insurance system under a framework
    dating from 1984. In 2019, the Haute Autorité de Santé carried out France's first scientific assessment specifically
    for reimbursement and found that efficacy had not been demonstrated sufficiently to justify public coverage.
    Reimbursement was reduced in 2020 and ended on 1 January 2021.
  sources:
  - title: Homeopathic medicines — insufficient efficacy for reimbursement
    url: https://www.has-sante.fr/jcms/p_3066934/fr/medicaments-homeopathiques-une-efficacite-insuffisante-pour-etre-proposes-au-remboursement
    publisher: Haute Autorité de Santé
    note: States that homeopathic medicines had not previously undergone a scientific assessment for reimbursement
      and that the 2019 review found insufficient evidence of efficacy.
  - title: Évaluation des médicaments homéopathiques — Avis du 26 juin 2019
    url: https://www.has-sante.fr/upload/docs/application/pdf/2019-06/homeopathie_pic_avis3_cteval415.pdf
    publisher: Haute Autorité de Santé — Commission de la Transparence
    note: Official HAS assessment reproduces the 12 September 1984 reimbursement order in its annex; that order
      names the Ministère des Affaires sociales et de la Solidarité nationale and established the reimbursable homeopathic
      list later withdrawn.
  - title: Order of 4 October 2019 removing homeopathic medicines from reimbursement
    url: https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000039191413
    publisher: Légifrance
    note: Ends reimbursement from 1 January 2021 and repeals the 12 September 1984 reimbursement order.
  - title: Homeopathic medicines
    url: https://sante.gouv.fr/soins-et-maladies/medicaments/le-circuit-du-medicament/article/les-medicaments-homeopathiques
    publisher: French Ministry of Health
    note: Explains the 2020 transitional reduction in reimbursement and the end of compulsory-insurance reimbursement
      on 1 January 2021.
- id: brazil-2006-2026
  polity: Brazil
  region: Latin America
  startYear: 2006
  endYear: 2026
  endOpen: true
  strength: policy-basis
  institutionTypes:
  - government
  - medical
  - education
  institutions:
  - Ministério da Saúde
  - Sistema Único de Saúde (SUS)
  institutionalContext: PNPIC is a federal Ministry of Health policy implemented through Brazil's decentralized
    SUS. State and municipal health secretariats and services provide much of the actual care, but because those
    bodies vary by jurisdiction they are described here as implementation machinery rather than listed as though
    they were one institution.
  consequences:
  - Public provision of homeopathic care
  - Incorporation into primary and specialist care
  - Public provision of homeopathic medicines
  - Training and dissemination within the health system
  summary: Brazil's 2006 National Policy on Integrative and Complementary Practices formally incorporated homeopathy
    into the public SUS system and directed governments to expand homeopathic consultations, medicines, professional
    training, and services. The policy described homeopathy as contributing to prevention and recovery and to reduced
    demand for conventional interventions. Homeopathy remains listed within the national PNPIC framework as of 2026.
  sources:
  - title: Portaria nº 971, de 3 de maio de 2006
    url: https://bibliotecadigital.gestao.gov.br/handle/123456789/958
    publisher: Brazilian Ministry of Health — Government Digital Library
    note: Stable government-library record and downloadable text of Portaria 971, which approved PNPIC and explicitly
      included homeopathy among the practices to be implemented in SUS.
  - title: Política Nacional de Práticas Integrativas e Complementares no SUS
    url: https://bvs.saude.gov.br/bvs/folder/politica_nacional_praticas_integrativas_sus_folder.pdf
    publisher: Brazilian Ministry of Health
    note: Ministry publication states that Portaria 971 incorporated homeopathy into PNPIC/SUS, describes expansion
      of access to integrative services, and identifies homeopathy as one of the policy's therapeutic systems.
  - title: PICS legislation
    url: https://www.gov.br/saude/pt-br/composicao/saps/pics/legislacao/
    publisher: Brazilian Ministry of Health
    note: Current Ministry legislation index for the PNPIC framework and its subsequent consolidations and expansions.
  - title: Homeopathic products and practices
    url: https://easac.eu/fileadmin/PDF_s/reports_statements/EASAC_Homepathy_statement_web_final.pdf
    publisher: European Academies Science Advisory Council
    note: Concludes that there is no robust, reproducible evidence that homeopathy is effective beyond placebo for
      any known disease and that its scientific claims are inconsistent with established chemistry and physics.
