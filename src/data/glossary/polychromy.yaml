term: Polychromy
aliases: []
shortDefinition: The use of multiple colors in a work of art or architecture.
longDefinition: In classical sculpture, polychromy can include painted pigments, gilding, inlays, and selective coloring of details such as clothing, hair, eyes, or skin.
reviewedAt: '2026-08-21'
sources:
- title: Polychromy of Roman Marble Sculpture
  url: https://www.metmuseum.org/essays/polychromy-of-roman-marble-sculpture
  publisher: The Metropolitan Museum of Art
  note: Reviews evidence that Roman marble sculpture was colored with paint, gilding, and other surface treatments.
