entryId: helicobacter-pylori
sourceReviewedAt: '2026-08-21'
term: Helicobacter pylori
aliases:
- H. pylori
shortDefinition: Ein spiralig geformtes Bakterium, das die Magenschleimhaut besiedeln kann und eine wichtige Ursache
  chronischer Gastritis und peptischer Geschwüre ist.
longDefinition: Helicobacter pylori ist ein an das Leben im menschlichen Magen angepasstes Bakterium. Eine dauerhafte
  Infektion kann chronische Entzündungen der Magenschleimhaut verursachen und gehört zu den beiden häufigsten Ursachen
  peptischer Geschwüre. Wird die Infektion mit geeigneten Antibiotika und säurehemmender Therapie beseitigt, sinkt die
  Rückfallrate von Geschwüren stark.
