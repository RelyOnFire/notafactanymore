evidence:
  -
    id: "tibet-abduction-march30"
    sourceId: "tibet-abduction-pd-march-30"
    relation: "documents"
    target:
      scope: "belief"
      aspect: "proposition"
    locator: "Introductory Xinhua account; six published letters"
    note: >-
      The 30 March article asserts that rebels removed the Dalai Lama from Lhasa against his will on 17
      March and presents his letters as proof that he was being restrained. The Dalai Lama later
      acknowledged writing the letters but disputed that interpretation.
  -
    id: "tibet-abduction-march31"
    sourceId: "tibet-abduction-pd-march-31"
    relation: "documents"
    target:
      scope: "belief"
      aspect: "proposition"
    locator: "Lead editorial, 31 March 1959"
    note: >-
      The Party newspaper calls the Dalai Lama's departure an abduction by rebel leaders, treats it as part
      of the case against the Tibetan local government, and retains his formal role pending his alleged
      release.
  -
    id: "tibet-abduction-march29"
    sourceId: "tibet-abduction-pd-april-29"
    relation: "documents"
    target:
      scope: "belief"
      aspect: "proposition"
    locator: "29 April 1959, page 5, headline and reporting"
    note: >-
      A later People's Daily headline describes the alleged kidnapping as definitively proved, illustrating
      that the interpretation was publicly defended after the Dalai Lama reached India.
  -
    id: "tibet-abduction-nehru-record"
    sourceId: "tibet-abduction-nehru-private"
    relation: "supports"
    target:
      scope: "belief"
      aspect: "correction"
    locator: "24 April 1959, discussion of letters and the decision to leave Lhasa"
    note: >-
      In a private meeting with Nehru the Dalai Lama acknowledged that he had written letters which could
      suggest coercion, but said that he did so to avoid conflict and conceal his own intention to escape.
      He explained how the final decision to leave was made on 17 March.
  -
    id: "tibet-abduction-nehru-public"
    sourceId: "tibet-abduction-nehru-parliament"
    relation: "supports"
    target:
      scope: "belief"
      aspect: "correction"
    locator: "27 April 1959 address to the Lok Sabha"
    note: >-
      Nehru stated that the Dalai Lama told him he had chosen to leave and that no one had compelled him to
      issue his statements in India. This is a contemporaneous Indian official record, not a Chinese
      acknowledgment.
  -
    id: "tibet-abduction-admission-en"
    sourceId: "tibet-abduction-prc-whitepaper-en"
    relation: "documents"
    target:
      scope: "belief"
      aspect: "correction"
    locator: "Part V: The Central Government's Policy Towards the 14th Dalai Lama"
    note: >-
      The PRC's own 2015 white paper says central authorities chose not to prevent his flight and publicly
      described him as abducted so he could still be welcomed back. It recharacterizes the 1959 claim as a
      political accommodation.
  -
    id: "tibet-abduction-admission-cn"
    sourceId: "tibet-abduction-prc-whitepaper-cn"
    relation: "documents"
    target:
      scope: "belief"
      aspect: "correction"
    locator: "Section 五, second bullet, text: 对十四世达赖的叛逃 ... 并以其被劫持的说法，为其留有余地"
    note: >-
      The Chinese original confirms the official retrospective: the leadership chose not to stop his
      departure and used the abduction account to preserve room for a possible return. The original wording
      does not say every individual official knowingly fabricated the allegation.
  -
    id: "tibet-abduction-dalai-memoir"
