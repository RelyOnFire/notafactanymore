- id: virginity-pakistan-law-correction
  note: >-
    Die amtliche Ministeriumsübersicht bestätigt, dass der Anti-Rape (Investigation and Trial) Act 2021 den zuvor
    zur Beurteilung Betroffener verwendeten Zwei-Finger-Test untersagt. Das gesondert erfasste Gesetz liefert
    Paragraf 13 Absatz 1, den Geltungsbereich für die erfassten Straftaten und den Ausschluss des Beweiswerts.
