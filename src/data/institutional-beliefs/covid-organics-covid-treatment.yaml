evidence:
  - id: cvo-plan-proposition
    sourceId: cvo-emergency-plan
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: Foreword, p. 4; Executive Summary, p. 6; §§2.2.1 and 2.7.6, pp. 19–20 and 25–26
    note: >-
      The president's foreword calls Covid-Organics a preventive and curative remedy. The plan records completed school
      distribution, labels family packs preventive, and treats CVO as a mass-protection measure while acknowledging that
      the scientific basis of traditional medicines remained weakly documented.
  - id: cvo-in-vitro-correction
    sourceId: cvo-in-vitro-study
    relation: contextualizes
    target: {scope: belief, aspect: correction}
    locator: Abstract; Results, Table 2; Discussion and Conclusions
    note: >-
      The original Covid-Organics drink inhibited SARS-CoV-2 in VeroE6 cell culture, with EC50 equal to 7.73% of the raw
      drink and a selectivity index of 5.28. The authors called that selectivity index unpromising, said achievable human
      exposure remained unknown, and required animal and human trials before patient recommendations.
  - id: cvo-trial-correction
    sourceId: cvo-plus-trial
    relation: contextualizes
    target: {scope: belief, aspect: correction}
    locator: pp. 817–823, especially Methods, Results, Discussion, Limitations, and Declarations
    note: >-
      The CVO+ Curatif trial reported 87.1% success versus 75.0% with placebo (OR 2.25; p=0.011). It tested a standardized
      capsule richer in active compounds than the original tea, not prevention; analyzed 276 of 339 randomized participants
      per protocol; used one-tailed tests; began enrolment on 18 January before registry approval on 24 March 2021; and
      ended below the planned analyzed sample amid attrition, urgent circumstances, and lack of funding.
  - id: cvo-who-contemporaneous-correction
    sourceId: cvo-who-artemisia
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: 25 August 2020 Q&A, “What is WHO’s position on the use of Artemisia plant material…?”
    note: >-
      WHO's contemporaneous assessment said evidence did not support Artemisia products or extracts as COVID-19 antivirals
      and found no evidence for prevention or treatment with Artemisia-based plant material. The page is preserved for
      reference and is no longer updated, so this evidence is used for the state of knowledge during the rollout.
  - id: cvo-policy-impact
    sourceId: cvo-emergency-plan
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: Executive Summary, p. 6; §§2.2.1.1–2.2.1.2, pp. 19–20; §2.7.6.2, p. 26
    note: >-
      The official plan provides the card's scale figures: 270,000 pupils in a completed distribution measure, and
      separate programme targets of 660,600 pupils and four million households. The targets are identified as plans
      rather than reported completed distributions.
  - id: cvo-president-carrier
    sourceId: cvo-presidential-address
    relation: documents
    target: {scope: episode, episodeId: madagascar-2020-2025, aspect: carrier}
    locator: Sections “À propos du remède contre le Covid-19” and “Les écoles”
    note: >-
      Official diplomatic archive of the 19 April address: the president said IMRA tests on infected people had been
      positive, announced clinical trials for the following week, and included distribution of Covid-Organics tea among
      the measures accompanying pupils' return to examination classes.
  - id: cvo-plan-carrier
    sourceId: cvo-emergency-plan
    relation: documents
    target: {scope: episode, episodeId: madagascar-2020-2025, aspect: carrier}
    locator: Foreword, p. 4; §§2.2.1 and 2.7.6, pp. 19–20 and 25–26
    note: >-
      The national emergency plan incorporates CVO into education and mass-protection programmes and assigns implementation
      through central government sectors rather than describing a private or merely experimental product.
  - id: cvo-plan-impact
    sourceId: cvo-emergency-plan
    relation: supports
    target: {scope: episode, episodeId: madagascar-2020-2025, aspect: consequences}
    locator: Executive Summary, p. 6; §§2.2.1.1–2.2.1.2, pp. 19–20; §2.7.6.2, p. 26
    note: >-
      Records distribution of masks and CVO to 270,000 examination-class pupils as a measure taken; separately plans
      CVO for 660,600 such pupils outside confined regions and preventive family packs for four million households.
      The latter two figures are programme targets, not verified completion counts.
  - id: cvo-audit-carrier
    sourceId: cvo-court-audit
    relation: documents
    target: {scope: episode, episodeId: madagascar-2020-2025, aspect: carrier}
    locator: §2.2.1, pp. 24–25; §3.1.3, pp. 45–46
    note: >-
      The Court found that strategic health decisions were taken at the highest level, that the presidency displaced the
      Health Ministry's technical authority, and that the wholly state-owned Pharmalagasy received a new factory,
      imported machinery, trained staff, and exclusive raw-material supply to produce CVO.
  - id: cvo-audit-consequences
    sourceId: cvo-court-audit
    relation: supports
    target: {scope: episode, episodeId: madagascar-2020-2025, aspect: consequences}
    locator: §2.2.1, p. 24; “Protocoles de traitement…”, pp. 79–80; §2.4.7, p. 90
    note: >-
      The audit records mass sachet distribution through fokontany, public self-service drink stations, compulsory school
      administration with sweets, free distribution in government services, hospital equipment supplied by the presidency,
      and a national-treatment option. It also says the traditional remedy was retained instead of the Health Ministry's
      July 2020 proposal to join COVAX and that other traditional-medicine messaging was prohibited except for CVO.
  - id: cvo-audit-partial-correction
    sourceId: cvo-court-audit
    relation: documents
    target: {scope: episode, episodeId: madagascar-2020-2025, aspect: institutional-correction}
    locator: “Protocoles de traitement à bien communiquer et nécessitant une évaluation systématique”, pp. 79–80
    note: >-
      The Court said no scientific study could confirm a direct, predominant correlation between the low observed
      mortality and the traditional remedy because it accompanied other treatments. It called for systematic protocol
      evaluation, stronger scientific-institution involvement, and clinical research.
  - id: cvo-who-trial-transition
    sourceId: cvo-who-trial-statement
    relation: documents
    target: {scope: episode, episodeId: madagascar-2020-2025, aspect: institutional-correction}
    locator: 5 July 2021 statement, paras. 2–8
    note: >-
      WHO described the completed study as a Phase III trial of CVO+ capsules for mild and moderate disease, stated that
      recommendations require demonstrated safety, efficacy, and quality in randomized trials, and said an independent
      regional expert committee would examine the Malagasy data. The statement itself did not endorse efficacy.
  - id: cvo-trial-transition
    sourceId: cvo-plus-trial
    relation: documents
    target: {scope: episode, episodeId: madagascar-2020-2025, aspect: institutional-correction}
    locator: pp. 817–823
    note: >-
      Documents the government's move from observation and rollout to a randomized, double-blind, placebo-controlled
      trial, while also defining the narrower capsule formulation, treatment population, reported benefit, and design
      limitations that prevent extrapolation to the original drink or prevention.
  - id: cvo-in-vitro-context
    sourceId: cvo-in-vitro-study
    relation: contextualizes
    target: {scope: episode, episodeId: madagascar-2020-2025, aspect: context}
    locator: Results, Table 2; Discussion and Conclusions
    note: >-
      Establishes that the original drink had a laboratory antiviral signal, avoiding the overstatement that it had no
      supporting data of any kind, while drawing the crucial boundary between in-vitro activity and demonstrated benefit
      or prevention in patients.
  - id: cvo-who-rollout-context
    sourceId: cvo-who-artemisia
    relation: contextualizes
    target: {scope: episode, episodeId: madagascar-2020-2025, aspect: context}
    locator: 25 August 2020 Q&A, Artemisia question
    note: >-
      Provides WHO's dated evidentiary assessment during the national rollout; it is not treated as a post-2021 review
      of the later CVO-specific cell study or CVO+ capsule trial.
  - id: cvo-original-registration
    sourceId: cvo-amm-original-2025
    relation: documents
    target: {scope: episode, episodeId: madagascar-2020-2025, aspect: mechanism}
    locator: Product codes 40367–40370
    note: >-
      The 2 May 2025 official register lists original CovidOrganics/Tambavy as 33 cl and one-litre solutions, tea bags,
      and 16.5 g powder sachets manufactured by IMRA. Registration documents regulatory continuity but does not itself
      establish a clinical indication or efficacy.
  - id: cvo-plus-registration
    sourceId: cvo-amm-plus-2025
    relation: documents
    target: {scope: episode, episodeId: madagascar-2020-2025, aspect: institutional-correction}
    locator: Product codes 40640 and 40404
    note: >-
      The 14 July 2025 official register lists both CVO Plus Curatif and CVO Plus Préventif capsules from CNARP and
      Pharmalagasy. The prevention-labelled registration is especially material because the published randomized trial
      evaluated treatment of mild or moderate disease, not prevention.
