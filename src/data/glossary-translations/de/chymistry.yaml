term: Chymie
aliases:
  - Chymist
  - Chymisten
shortDefinition: Frühneuzeitliche Untersuchung und Bearbeitung von Materie, bevor Chemie und Alchemie klar getrennte Disziplinen wurden.
longDefinition: Historikerinnen und Historiker verwenden Chymie als bewusst historische Sammelbezeichnung für das frühneuzeitliche Feld, das Tätigkeiten umfasste, die später unter anderem Chemie, Alchemie, Metallurgie, Pharmazie und Stofftheorien zugeordnet wurden. Der Begriff vermeidet, moderne Disziplingrenzen auf Praktizierende zu übertragen, die diese Trennung so noch nicht kannten.
