  institutions:
  - Presidency of the Republic of Madagascar
  - Prime Minister’s Office (Primature de Madagascar)
  institutionalContext: Covid-Organics became part of the national COVID response rather than remaining a private
    experimental product. Government planning documents recorded population and school distribution; the Court of
    Accounts later documented mass distribution and use across public settings while also noting the lack of scientific
    evidence tying traditional remedies to outcomes. The 2021 endpoint marks the shift toward formal Phase III evaluation,
    not a categorical Malagasy repudiation of the product.
  consequences:
  - Mass preventive distribution of Covid-Organics through local administrative structures
  - Distribution to school pupils and public services
  - Government incorporation of an unproven remedy into the national COVID response
  - Public therapeutic legitimacy before randomized efficacy evidence was available
  summary: In 2020 Madagascar incorporated Covid-Organics into its COVID-19 response and distributed it widely as
    a protective and therapeutic remedy. Government emergency-planning and audit material document school and mass
    distribution and the remedy’s role in public policy. At the time, controlled evidence establishing prevention
    or treatment was absent. In 2021 WHO described the related CVO+ preparation as requiring Phase III clinical
    evaluation to determine safety and efficacy.
