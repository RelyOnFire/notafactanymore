evidence:
- id: virginity-who-correction
  note: >-
    Die WHO erklärt, dass das Erscheinungsbild des Hymens kein verlässlicher Hinweis auf Geschlechtsverkehr ist
    und keine bekannte Untersuchung eine Vorgeschichte vaginalen Geschlechtsverkehrs beweisen kann. Die Übersicht
    beschreibt auch körperliche, psychische und soziale Schäden. Sie belegt die wissenschaftliche Bewertung und
    allgemeine Risiken, nicht die Anwendung oder Korrektur durch einen bestimmten Staat.
- id: virginity-turkey-proposition
  note: >-
    Human Rights Watch dokumentiert staatlich angeordnete Untersuchungen zur Feststellung angeblicher „Jungfräulichkeit“
    unter Beteiligung von Polizei, Gendarmerie, Gerichtsmedizin, Schulen, Wohnheimen, Krankenhäusern und Inhaftierten.
    Der Bericht enthält einen Fall von 1986 und unterscheidet tatsächlich erteilte Anordnungen von der für bestimmte
    Untersuchungen erforderlichen gerichtlichen oder staatsanwaltlichen Genehmigung.
- id: virginity-turkey-carrier
  note: >-
    Dokumentiert staatlich angeordnete Jungfräulichkeitsuntersuchungen in den 1980er- und frühen 1990er-Jahren
    unter Beteiligung von Polizei, Gendarmerie, Gerichtsmedizin, Schulen, Wohnheimen, Krankenhäusern und Inhaftierten.
    Die Abschnitte über Gewahrsam, Schülerinnen und Ärzte benennen institutionelle Rollen sowie berichteten Zwang
    und Schäden. Manche polizeilichen Anordnungen umgingen die erforderliche Genehmigung; der Bericht belegt institutionelles
    Handeln, nicht die Rechtmäßigkeit sämtlicher Anordnungen.
- id: virginity-turkey-mechanism
  note: >-
    Die Abschnitte zu Gewahrsam, Schulen und Medizin beschreiben, wie Einrichtungen Untersuchungen anordneten
    oder ermöglichten und Ärzte Befunde für polizeiliche oder disziplinarische Zwecke erstellten. Die Erörterung
    der Genehmigung trennt diese Praxis von den rechtlichen Voraussetzungen einer Untersuchung.
- id: virginity-turkey-consequences
  note: >-
    Der Bericht beschreibt erzwungene Untersuchungen, disziplinarische und polizeiliche Verwendung, Bestrafung
    oder Überwachung von Frauen und Mädchen sowie berichtete körperliche und psychische Schäden. Es handelt sich
    um dokumentierte Fälle und Muster der Untersuchung, nicht um eine landesweite Zählung aller Betroffenen.
- id: virginity-turkey-correction
  note: >-
    Der Länderbericht für 1999 beschreibt eine Regierungsregelung von Ende 1998, die die traditionelle Praxis
    untersagte, sofern die Frau sie nicht selbst verlangte. Er berichtet von einem offenbar rückläufigen Einsatz
    sowie Vollzugsproblemen einschließlich fehlender Sanktionen gegen Verstöße. Das belegt eine begrenzte institutionelle
    Reaktion mit fortbestehender Ausnahme auf Verlangen, keine allgemeine Abschaffung.
- id: virginity-iran-carrier
  note: >-
    Der Abstract beschreibt die Legal Medicine Organization als offizielle Einrichtung der iranischen Justiz,
    deren gerichtsmedizinische Zentren Gutachten auf Anforderung von Gerichten, Richtern und Verwaltungsbehörden
    erstellen. Das belegt den institutionellen Hintergrund. Der geprüfte Abstract belegt keine Einführung von
    Jungfräulichkeitstests im Jahr 2002; die praxisbezogenen Belege stammen aus der gesonderten Teheraner Interviewstudie.
- id: virginity-iran-mechanism
  note: >-
    Die Primärstudie berichtet über Feldforschung von 2014 in gerichtsmedizinischen Zentren und staatlichen gynäkologischen
    Kliniken in Teheran. Befragte beschreiben Jungfräulichkeitsuntersuchungen auf Anordnung von Zivil- und Strafgerichten
    sowie Anwendungen bei Ehe, Scheidung, Unterbringung, mutmaßlicher Gewalt und Bescheinigungen. Sie schildern
    auch diagnostische Unsicherheit, Konflikte um Einwilligung und mögliche psychische oder soziale Folgen. Die
    qualitativen Aussagen dokumentieren Praxis und berichtete Erfahrungen; sie validieren die Untersuchung nicht
    und belegen keine landesweite Häufigkeit.
- id: virginity-iran-consequences
  note: >-
    Die Ergebnisse beschreiben gerichtlich angeordnete Untersuchungen, Bescheinigungen und rechtliche Anwendungen
    sowie Aussagen der Befragten über psychische und soziale Risiken einschließlich Gewalt und Selbstverletzung.
    Diese Erfahrungen und Befürchtungen bleiben den Interviews zugeschrieben; die Studie schätzt weder die landesweite
    Häufigkeit noch den kausalen Effekt jedes Schadens.
- id: virginity-iran-ongoing
  note: >-
    Die Länderbewertung vom April 2026 berichtet, Behörden könnten bei jungen Frauen unter bestimmten Umständen
    Jungfräulichkeitstests versuchen, weist aber darauf hin, dass die verfügbaren Belege keine Verbreitung nachweisen.
    Die zugrunde liegenden Beobachtungen haben eigene Datierungen. Die Quelle liefert eingeschränkten späteren
