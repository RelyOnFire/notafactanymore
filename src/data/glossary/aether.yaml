term: Aether
aliases:
- ether
- Aristotelian aether
shortDefinition: In Aristotelian cosmology, the incorruptible fifth element assigned to the heavens, distinct from earthly
  earth, water, air, and fire.
longDefinition: Aristotle's aether was the material of the celestial realm. Unlike the four terrestrial elements, which
  were associated with change and straight-line natural motions, aether was supposed to be ungenerated, incorruptible,
  and naturally capable of eternal circular motion. This made it possible to treat stars and planets as physically different
  from earthly matter.
relatedTerms:
- quintessence
reviewedAt: '2026-08-21'
sources:
- title: Natural Philosophy in the Renaissance
  url: https://plato.stanford.edu/entries/natphil-ren/
  publisher: Stanford Encyclopedia of Philosophy
  note: Describes the Aristotelian heavens as perfect, immutable, and composed of aether.
