term: Seven-cell uterus diagram
aliases:
- seven-chambered uterus
- seven-cell uterus
shortDefinition: A medieval anatomical scheme dividing the uterus into seven fetal chambers and assigning different chambers
  to male, female, or intersex fetuses.
longDefinition: The seven-cell uterus was an inherited medieval anatomical diagram in which the womb was divided into
  seven compartments, often three on each side plus a central chamber. The cells were linked to theories of fetal sex
  and bodily heat. Despite human dissection, the scheme persisted in learned anatomy until Renaissance anatomists increasingly
  replaced it with direct descriptions of a single uterine cavity.
