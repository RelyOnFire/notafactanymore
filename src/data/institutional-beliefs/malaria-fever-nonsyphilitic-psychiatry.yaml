  institutionalContext: Under Hans Hoff, Vienna's university psychiatric clinic continued malaria fever therapy
    throughout 1951–1968 and applied it far beyond neurosyphilis. The clinic treated people diagnosed with schizophrenia,
    intellectual disability, affective disorders, psychopathic disorders and additional conditions by deliberately
    transmitting P. vivax, usually with infected blood, and waiting through repeated fever paroxysms before administering
    antimalarial drugs. A modern archival study found 772 malaria-therapy cases within five focal diagnostic groups,
    of which 609—nearly 79%—were not neurosyphilis. The same study found no detailed contemporary discussion justifying
    malaria therapy for the four nonsyphilitic diagnostic groups. Vienna maintained a syphilis-free malaria strain
    specifically because non-neurosyphilitic use was frequent, and the last documented treatment occurred in December
    1968.
  consequences:
  - Deliberate infection of psychiatric patients with Plasmodium vivax
  - Repeated febrile attacks before antimalarial treatment terminated the infection
  - Use in schizophrenia, intellectual disability, affective and psychopathic diagnoses without the neurosyphilis
    rationale
  - Continued exposure to an infectious disease after noninfectious psychiatric treatments had become available
  - Some patients functioned as continuing carriers of the institutional malaria strain
  summary: Vienna's university psychiatric clinic deliberately infected large numbers of non-neurosyphilitic patients
    with malaria well into the 1960s. In the archival sample, 609 of 772 malaria-therapy cases within the five principal
    diagnostic groups involved diagnoses other than neurosyphilis, including schizophrenia, intellectual disability
    and affective or psychopathic disorders. A separate infectious-disease reconstruction identified 158 schizophrenia
    patients who had been inoculated, usually with 4–8 mL of P. vivax-infected blood, and who typically underwent
    several fever attacks before malaria treatment was given. The clinic's own historical record contains little
    detailed scientific justification for these nonsyphilitic extensions, and the practice persisted until December
    1968.
  sources:
  - title: 'In the shadow of the ''psychopharmacological revolution'': Malaria fever, insulin coma, cardiazol and
      electroconvulsive therapy at the Vienna Psychiatric University Clinic, 1951–1969'
    url: https://link.springer.com/article/10.1007/s00508-025-02592-w
    publisher: Wiener klinische Wochenschrift / Springer Nature
    note: Peer-reviewed archival reconstruction documenting 772 malaria-therapy cases in five focal diagnostic groups,
      609 nonsyphilitic cases, the extension to schizophrenia, intellectual disability, affective and psychopathic
      disorders, absence of detailed contemporary justification for those extensions, maintenance of the malaria
      strain, and the final recorded use in December 1968.
  - title: Clinical and Parasitological Characteristics of Plasmodium vivax Malaria in Malaria-Naïve Patients
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12676601/
    publisher: American Journal of Tropical Medicine and Hygiene
    note: Modern medical-record analysis identifying 869 iatrogenically infected Vienna patients, including 158
      with schizophrenia; documents infected-blood inoculation, typical 4–8 mL doses, repeated fever paroxysms and
      subsequent antimalarial treatment. It explicitly notes that Vienna continued malaria therapy until the late
      1960s after most centers had stopped.
  - title: 'Malaria fever therapy: wide-spread administration in Vienna was an exceptional case'
    url: https://www.meduniwien.ac.at/web/en/about-us/news/detailsite/malaria-fever-therapy-wide-spread-administration-in-vienna-was-an-exceptional-case-medical-university-of-vienna-presents-results-from-the-historical-commission/
    publisher: Medical University of Vienna
    note: Official university account of the independent historical commission, confirming unusually broad cross-diagnostic
      use in Vienna, 772 adult focal cases, 35 child-ward cases, and persistence into the 1960s because clinicians
      considered their experience with the treatment positive.
  - title: 'Psychiatric effects of malaria and anti-malarial drugs: historical and modern perspectives'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4918116/
    publisher: Malaria Journal
    note: Peer-reviewed historical review distinguishing the successful neurosyphilis rationale from later extensions
      to non-syphilitic psychiatric disorders, whose results were mixed and less successful.
