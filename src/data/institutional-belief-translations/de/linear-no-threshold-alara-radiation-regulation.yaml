locale: de
entryId: linear-no-threshold-alara-radiation-regulation
sourceReviewedAt: 2026-08-26
title: Lineares Schwellenlos-Modell und ALARA in der Strahlenschutzregulierung
claim: Die US-amerikanische Nuklearregulierung behandelte das stochastische Strahlenrisiko als linear mit der Dosis bis hinunter zu null ohne sichere Schwelle und verlangte, auch Expositionen unterhalb gesetzlicher Dosisgrenzen so niedrig zu halten, wie vernünftigerweise erreichbar (ALARA).
currentUnderstanding: Hohe Dosen ionisierender Strahlung sind nachweislich krebserregend, doch die genaue Dosis-Wirkungs-Beziehung für Krebs bei sehr niedrigen Dosen lässt sich mit heutiger Epidemiologie nicht präzise messen. Das lineare Schwellenlos-Modell bleibt ein plausibles und international verbreitetes Strahlenschutzmodell; weder eine universelle Schwelle noch ein Hormesis-Modell haben sich als wissenschaftlich konsensfähige und unmittelbar regulierungstaugliche Alternative durchgesetzt. Die NRC trennt das Vorsorgemodell inzwischen deutlicher von direkt nachgewiesenen Niedrigdosiseffekten. 2026 schlug sie vor, den Begriff ALARA und eine strikte schwellenlose Umsetzung aufzugeben, gleichzeitig aber ein lineares Dosis-Wirkungs-Modell, Dosisgrenzen und abgestufte Maßnahmen zur Dosissteuerung beizubehalten. Zum Zeitpunkt dieser Prüfung war der Vorschlag noch nicht endgültig beschlossen.
episodes:
  - id: united-states-nrc-1991-present
    polity: Vereinigte Staaten
    institutions:
      - U.S. Nuclear Regulatory Commission
    institutionalContext: Die Überarbeitung von 10 CFR Part 20 durch die NRC im Jahr 1991 etablierte den heutigen regulatorischen Rahmen des Strahlenschutzes. § 20.1101 verpflichtet Lizenznehmer zu Strahlenschutzprogrammen sowie zu praktikablen Verfahren und technischen Kontrollen, um berufliche und öffentliche Dosen ALARA zu halten. Die NRC bezeichnete LNT als grundlegende Annahme großer Teile ihrer Strahlenschutzregulierung und lehnte 2021 Anträge ab, es durch Schwellen- oder Hormesis-Modelle zu ersetzen.
    summary: Die NRC verankerte ALARA 1991 im modernen Part-20-Regelwerk vor dem Hintergrund einer längeren US-amerikanischen Regulierungstradition auf Basis linearer, schwellenloser Risikomodelle. 2015 beantragten mehrere Petenten, LNT und ALARA zugunsten von Schwellen- und Strahlenhormesis-Ansätzen aufzugeben; 2021 lehnte die NRC dies ab und hielt LNT weiterhin für eine tragfähige regulatorische Grundlage. Im Juli 2026 schlug die Behörde dann selbst eine deutliche Eingrenzung dieses Ansatzes vor. Der Entwurf betont ausdrücklich, dass die Evidenz nicht ausreicht, LNT zu widerlegen, und dass keine konsensgestützte, unmittelbar regulierungstaugliche Alternative existiert. Zugleich argumentiert die NRC, dass eine strikte Umsetzung der Schwellenlosigkeit bei sehr niedrigen Dosen unverhältnismäßig konservativ werden kann. Vorgeschlagen wird daher, ein lineares Dosis-Wirkungs-Modell beizubehalten, den Begriff ALARA aber aus den Vorschriften zu streichen und unterhalb der Dosisgrenzen einen klarer abgestuften Ansatz einzuführen.
    consequences:
      - NRC-Lizenznehmer mussten Strahlenschutzprogramme entwickeln, dokumentieren und umsetzen sowie berufliche und öffentliche Dosen auch unterhalb der Grenzwerte weiter reduzieren, soweit zusätzliche Reduktionen vernünftigerweise erreichbar waren.
      - ALARA beeinflusste technische Schutzmaßnahmen, Arbeitsplanung, Überwachung, Ableitungsmanagement, Genehmigungsverfahren und Stilllegung und war damit mehr als eine unverbindliche wissenschaftliche Hypothese.
      - Der NRC-Regelungsvorschlag von 2026 hält fest, dass die Anwendung von ALARA bei sehr niedrigen Dosen zeitweise erhebliche wirtschaftliche Kosten sowie betriebliche oder genehmigungsrechtliche Ineffizienzen ohne entsprechenden Gewinn für Gesundheit und Sicherheit verursacht habe.
      - Der Vorschlag von 2026 würde den Begriff ALARA aufgeben und die subjektive Optimierung unterhalb der Grenzwerte durch ein abgestuftes Dosismanagement ersetzen; solange das Verfahren nicht abgeschlossen war, blieben die bestehenden Regeln jedoch in Kraft.
