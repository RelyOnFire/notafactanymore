term: Ancient DNA
aliases:
- aDNA
- ancient-DNA
shortDefinition: DNA recovered from archaeological, fossil, or historical remains rather than from living organisms.
longDefinition: Ancient DNA, often abbreviated aDNA, is genetic material extracted from old biological remains such as
  bones, teeth, preserved tissues, or sediments. Because DNA degrades and contamination is a major risk, ancient-DNA
  research uses specialized laboratory and statistical methods. Genome-scale datasets can reconstruct ancestry, population
  turnover, migration, domestication, and evolutionary relationships through time.
relatedTerms:
- yamnaya
reviewedAt: '2026-08-21'
sources:
- title: Widespread horse-based mobility arose around 2200 bce in Eurasia
