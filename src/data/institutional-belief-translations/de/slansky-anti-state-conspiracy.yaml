entryId: slansky-anti-state-conspiracy
sourceReviewedAt: '2026-08-25'
title: Die Slánský-Gruppe als staatsfeindliches Verschwörungszentrum
proposition:
  summary: >-
    Kommunistische Partei, Staatssicherheit und Justiz der Tschechoslowakei behaupteten, Rudolf Slánský führe ein
    staatsfeindliches Verschwörungszentrum, das im Auftrag westlicher Nachrichtendienste und verwandter ideologischer
    Feinde Spionage, Sabotage und Verrat betreibe. Erzwungene Geständnisse und ein inszenierter öffentlicher Prozess
    machten die konstruierte Verschwörung zur scheinbaren Tatsache.
correction:
  summary: >-
    Tschechische staatliche Geschichtsinstitutionen beschreiben den Slánský-Fall heute als konstruierten politischen
    Prozess. Die Angeklagten wurden körperlichem Druck, langen Verhören und einstudierten Geständnissen unterworfen; die
    Anklage verband sie mit westlichen Nachrichtendiensten und einem angeblichen staatsfeindlichen Zentrum. Im November
    1952 standen 14 Menschen vor Gericht, elf wurden zum Tode und drei zu lebenslanger Haft verurteilt. 1963 wurden die
    Verurteilten sowohl gerichtlich als auch parteiintern rehabilitiert.
impact:
  summary: >-
    Der Slánský-Prozess wurde als nationales Propagandaereignis und Warnsignal für die Eliten des kommunistischen Blocks
    inszeniert. Die Anklage konstruierte um hochrangige Partei- und Staatsfunktionäre ein „staatsfeindliches
    Verschwörungszentrum“ und zwang die Angeklagten, von Ermittlern verfasste Geständnisse auswendig zu lernen. Mehr als
    8.500 Petitionen unterstützten die Urteile. Elf der 14 Angeklagten wurden am 3. Dezember 1952 hingerichtet, die übrigen
    drei erhielten lebenslange Haft. 1963 erfolgte ihre geheime gerichtliche und parteiinterne Rehabilitation.
  highlights:
    - value: '14'
      label: Angeklagte im Slánský-Prozess vom November 1952
    - value: '11'
      label: zum Tode verurteilte und hingerichtete Angeklagte
    - value: '3'
      label: zu lebenslanger Haft verurteilte Angeklagte
  context:
    - >-
      Elf der 14 Angeklagten wurden in der Kampagne als Menschen jüdischer Herkunft bezeichnet; der Prozess hatte eine
      ausgeprägte antisemitische und antizionistische Dimension.
    - >-
      Die Verhaftungen begannen vor dem öffentlichen Prozess. Slánský selbst wurde im November 1951 festgenommen, einige spätere Mitangeklagte bereits früher.
    - >-
      Die Rehabilitation von 1963 war eine gerichtliche und parteiinterne Rehabilitierung, wurde aber geheim vollzogen; eine offene öffentliche Aufarbeitung wurde erst später möglich.
episodes:
  - id: czechoslovakia-1951-1963
    polity: Tschechoslowakei
    institutions:
      - Kommunistische Partei der Tschechoslowakei
      - Staatssicherheit StB
      - staatlicher Anklage- und Gerichtsapparat der Tschechoslowakei
    institutionalContext: >-
      Unter dem Druck des stalinistischen Säuberungsmodells billigte die tschechoslowakische Führung im November 1951
      Slánskýs Verhaftung; Ermittler fassten anschließend hochrangige Funktionäre zu einem angeblichen staatsfeindlichen
      Verschwörungszentrum zusammen. Sowjetische Berater und die tschechoslowakische Staatssicherheit setzten körperlichen
      Zwang und lange Verhöre ein; die Angeklagten mussten von Ermittlern geschriebene Aussagen für den öffentlichen
      Prozess vom 20. bis 27. November 1952 auswendig lernen. Elf Angeklagte wurden am 3. Dezember hingerichtet. Spätere
      Entstalinisierungsprüfungen führten 1963 zur geheimen parteiinternen und gerichtlichen Rehabilitation.
    consequences:
      - Hinrichtung von elf hochrangigen Funktionären nach einem konstruierten politischen Verfahren
      - Lebenslange Haft für die drei übrigen Hauptangeklagten
      - Institutionalisierter Einsatz von Folter, Zwangsverhören und einstudierten Geständnissen zur Herstellung scheinbarer Beweissicherheit
      - Großangelegte Propaganda, die das angebliche Verschwörungszentrum als existentielle Bedrohung darstellte
      - Verstärkung antisemitischer und antizionistischer politischer Narrative
      - Warnwirkung auf die kommunistische politische Elite gegen Abweichungen von der stalinistischen Linie
    summary: >-
      Hochrangige Funktionäre wurden zu einem angeblichen staatsfeindlichen Zentrum zusammengefügt, zu vorgegebenen
      Geständnissen gezwungen und öffentlich angeklagt. Elf von 14 Angeklagten wurden hingerichtet, drei erhielten
      lebenslange Haft. Die spätere Rehabilitationspraxis des Staates kehrte 1963 die rechtliche und parteipolitische Bewertung um.
    mechanism:
      summary: >-
        Partei, Staatssicherheit, Anklage und Gerichte konstruierten das angebliche staatsfeindliche Zentrum durch
        Zwangsverhöre, einstudierte Geständnisse und einen inszenierten öffentlichen Prozess, verstärkt durch staatliche Propaganda.
    institutionalCorrection:
      periodLabel: '1963'
      action: Tschechoslowakische Partei- und Justizorgane rehabilitierten die Angeklagten und kehrten die politischen Verurteilungen um.
      summary: >-
        Dasselbe Partei-Staat-System rehabilitierte die Verurteilten förmlich und hob damit die rechtliche und
        parteipolitische Bewertung auf, die die konstruierte Verschwörung als Tatsache behandelt hatte.
