term: Chymistry
aliases:
  - chymist
  - chymists
shortDefinition: The early-modern study and manipulation of matter before chemistry and alchemy became sharply separated disciplines.
longDefinition: Historians use chymistry as an intentionally archaic umbrella term for the early-modern field that included activities later divided among chemistry, alchemy, metallurgy, pharmacy, and theories of matter. The spelling helps avoid imposing modern disciplinary boundaries on practitioners who did not recognize them in the same way.
relatedTerms: []
reviewedAt: '2026-08-27'
sources:
  - title: 'Alchemy vs. Chemistry: The Etymological Origins of a Historiographic Mistake'
    url: https://doi.org/10.1163/157338298x00022
    publisher: Early Science and Medicine
    note: Argues against imposing a modern alchemy/chemistry split on seventeenth-century practice.
  - title: A Note on Terminology
    url: https://doi.org/10.7208/chicago/9780226577036.002.0007
    publisher: Atoms and Alchemy / University of Chicago Press
    note: Explains the historians' use of the archaic term chymistry for early-modern alchemy-chemistry.
