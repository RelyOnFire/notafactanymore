term: T cell
aliases:
- T cells
- T lymphocyte
- T lymphocytes
shortDefinition: A type of lymphocyte central to adaptive immunity, with specialized forms that coordinate immune responses,
  kill infected cells, or regulate other immune cells.
longDefinition: T cells are lymphocytes whose precursors originate in bone marrow but mature in the thymus. Their antigen
  receptors allow highly specific recognition. Different T-cell populations include helper T cells, cytotoxic T cells,
  regulatory T cells, and memory cells. Before entering the mature immune system, developing T cells undergo selection
  in the thymus.
relatedTerms:
- t-cell-selection
reviewedAt: '2026-08-21'
sources:
- title: 'History of the thymus: from an accident of evolution to the programming of immunological self-tolerance'
  url: https://pubmed.ncbi.nlm.nih.gov/28990569/
  publisher: PubMed
  note: Reviews the thymus's central role in T-cell development and immune self-tolerance.
