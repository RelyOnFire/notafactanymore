  institutions:
  - Board of Control for England and Wales
  - British public mental hospitals
  - Royal Medico-Psychological Association
  institutionalContext: Cardiazol convulsive treatment reached Britain in 1937 and spread extremely rapidly through
    the public mental-hospital system. The Board of Control noted its use at several institutions in its 1937 report,
    sent officials to Hungary to study the method and published a dedicated 1938 report on Cardiazol and shock treatment
    in schizophrenia. A late-1938 Board survey found shock treatments underway at 92 institutions, 89 of them using
    Cardiazol. The therapy was originally justified by Ladislas Meduna's hypothesis that epilepsy and schizophrenia
    were biologically antagonistic and that inducing epileptiform seizures could therefore cause schizophrenic remission.
    By 1941 British clinicians were acknowledging that this original conception had been abandoned, while electrical
    convulsive therapy was rapidly supplanting the chemical method.
  consequences:
  - Large-scale chemical induction of generalized seizures in psychiatric patients
  - Extreme anticipatory fear and distress immediately before convulsions
  - Risk of vertebral and other fractures, memory disturbance and cerebral injury
  - Behavioral quieting or ward manageability could be misclassified as therapeutic improvement
  - Rapid national diffusion before the underlying schizophrenia theory had been established
  summary: Britain rapidly adopted Cardiazol convulsive therapy after its 1937 introduction. The treatment was built
    on the theory that schizophrenia and epilepsy were biological opposites, so provoking epileptiform seizures
    should drive schizophrenia into remission. The Board of Control investigated the method and by late 1938 found
    Cardiazol in use at 89 institutions. Subsequent experience exposed unstable remission claims, serious distress
    and injuries, and major problems in how 'improvement' was measured. By 1941 British clinicians were explicitly
    saying that the original conception of convulsive therapy as a schizophrenia treatment had been abandoned, while
    ECT replaced the less controllable chemical procedure.
  sources:
