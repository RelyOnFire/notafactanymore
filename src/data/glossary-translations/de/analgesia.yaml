locale: de
entryId: analgesia
sourceReviewedAt: '2026-08-21'
term: Analgesie
aliases:
- Schmerzlinderung
shortDefinition: Verringerung oder Verhinderung von Schmerz, ohne dass dabei zwingend das Bewusstsein ausgeschaltet
  wird.
longDefinition: Analgesie bezeichnet die Linderung oder Verhinderung von Schmerz. Sie kann durch Medikamente oder
  andere Maßnahmen erreicht werden und bedeutet nicht automatisch Bewusstlosigkeit; ein Patient kann bei wirksamer
  Analgesie wach sein.
