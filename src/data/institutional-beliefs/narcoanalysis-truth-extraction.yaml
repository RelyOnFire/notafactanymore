  institutions:
  - Directorate of Forensic Science, Ministry of Home Affairs
  - Forensic Science Laboratory, Bengaluru, Karnataka
  institutionalContext: The Directorate of Forensic Science’s 2005 laboratory procedure manual presented narcoanalysis
    as a forensic investigative technique and expressly claimed that the induced state made lying difficult. State
    laboratories applied the technique in investigations that later formed part of the Selvi litigation. In 2010
    the Supreme Court barred involuntary administration and reviewed evidence showing that drug-induced speech is
    not reliably truthful.
  consequences:
  - Suspects and witnesses were subjected to drug-assisted interrogation
  - Forensic laboratories generated statements and investigative leads from a scientifically unreliable truth premise
  - Compulsory administration interfered with bodily and mental autonomy
  - Investigative and judicial resources were influenced by statements vulnerable to suggestion and fabrication
  summary: India’s 2005 forensic narcoanalysis manual said that sodium-pentothal-induced disinhibition could elicit
    normally concealed information and make it difficult for a subject to lie. Police and forensic laboratories
    used the method in criminal investigations. In Selvi v. State of Karnataka, the Supreme Court reviewed evidence
    that narcoanalysis does not reliably produce truthful statements, highlighted suggestibility and falsehood risks,
    and prohibited involuntary administration in 2010.
  sources:
  - title: Selvi & Ors v. State of Karnataka & Anr — Supreme Court judgment
    url: https://api.sci.gov.in/jonew/judis/36303.pdf
    publisher: Supreme Court of India
    note: Primary 2010 judgment reproducing the Directorate of Forensic Science’s 2005 narcoanalysis manual, including
      the claim that it is difficult for a person to lie in the drug-induced state; reviews scientific reliability
      and suggestibility concerns and prohibits involuntary narcoanalysis.
