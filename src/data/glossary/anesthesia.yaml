term: Anesthesia
aliases:
- anaesthesia
shortDefinition: The medical use of drugs or techniques to prevent pain during procedures; some forms also produce
  unconsciousness.
longDefinition: Anesthesia is a broad term for medical techniques that block sensation during procedures. General
  anesthesia produces unconsciousness, while regional or local anesthesia can block pain in part of the body without
  making the patient unconscious.
relatedTerms:
- analgesia
reviewedAt: '2026-08-21'
sources:
- title: The infancy of infant pain research
  url: https://pubmed.ncbi.nlm.nih.gov/23548489/
  publisher: PubMed
  note: Reviews the historical use of minimal or absent anesthesia in infant surgery and the later shift in neonatal
    pain care.
