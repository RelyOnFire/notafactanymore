evidence:
  - id: malaria-nonsyphilitic-proposition
    sourceId: vienna-heiss-2025
    relation: supports
    target: {scope: belief, aspect: proposition}
    locator: Malaria fever therapy
    note: >-
      Documents Vienna's use of malaria fever therapy as a nonspecific “shock” treatment for schizophrenia, intellectual
      disability, affective and psychopathic disorders, with the intended goals of changing psychological state or
      stimulating development.
  - id: malaria-nonsyphilitic-correction
    sourceId: vienna-heiss-2025
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Malaria fever therapy; Conclusion
    note: >-
      Finds no detailed contemporary indication discussion for the four principal nonsyphilitic diagnosis groups and
      records that other psychiatric literature characterized use outside progressive paralysis as rarely effective.
  - id: malaria-review-correction
    sourceId: malaria-psychiatric-review-2016
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Malariotherapy of psychiatric disease
    note: >-
      Distinguishes the historical neurosyphilis rationale from extensions to schizophrenia and manic-depressive
      psychosis, whose reported results were mixed and perceived as less successful.
  - id: malaria-who-correction
    sourceId: who-malaria-fact-sheet
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Overview; Symptoms; Treatment
    note: >-
      Defines malaria as a potentially life-threatening parasitic disease, identifies P. vivax as one of the two greatest
      human malaria threats and states that malaria is a serious infection requiring antimalarial treatment.
  - id: malaria-cdc-correction
    sourceId: cdc-neurosyphilis-guideline
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Treatment
    note: >-
      Current neurosyphilis guidance recommends high-dose aqueous crystalline penicillin G, illustrating that even the
      historically distinct infectious indication is now treated without deliberately induced malaria.
  - id: malaria-nobel-scope
    sourceId: nobel-malaria-1927
    relation: contextualizes
    target: {scope: belief, aspect: correction}
    note: >-
      The official prize motivation is specifically the therapeutic value of malaria inoculation in dementia paralytica;
      it does not state efficacy for schizophrenia or other nonsyphilitic psychiatric disorders.
  - id: malaria-neurosyphilis-context
    sourceId: malaria-neurosyphilis-history
    relation: contextualizes
    target: {scope: belief, aspect: correction}
    locator: Rebirth of Biological Psychiatry; Enduring Legacy
    note: >-
      Reviews the historically meaningful but hazardous use against general paresis before penicillin, including early
      remission evidence and mortality, and explains why that specific infectious indication became obsolete.
