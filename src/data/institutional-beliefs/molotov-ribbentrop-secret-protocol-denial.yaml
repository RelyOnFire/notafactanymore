schemaVersion: 2
title: The Molotov–Ribbentrop secret protocol as nonexistent or forged
proposition:
  summary: >-
    After the 1948 Western publication of captured German records, Soviet institutions sustained a public historical
    account that omitted or denied the authentic secret additional protocol to the 1939 Soviet-German non-aggression
    treaty. The official counter-publication attacked the Western document collection as falsification without naming
    the protocol, and later Soviet representatives continued to deny its existence or authenticity.
correction:
  summary: >-
    Germany and the Soviet Union signed a secret additional protocol on 23 August 1939 alongside their public
    non-aggression treaty. It set terms for German and Soviet spheres of interest in the Baltic states and Poland and
    recorded Soviet interest in Bessarabia. On 24 December 1989 the USSR Congress of People's Deputies confirmed that
    the protocol had been signed
    and existed, condemned the secret arrangements and declared them legally untenable and invalid from the moment of
    signature. The Soviet original was later located and is now cataloged in the Russian foreign-policy archive.
category: History, diplomacy and state propaganda
reviewedAt: '2026-09-24'
impact:
  summary: >-
    The Soviet Information Bureau's 1948 Falsifiers of History supplied the framework for an official account of the
    1939 pact that endured through most of the remaining Soviet period. Its text defended the pact and subsequent
    Soviet territorial moves while omitting the secret protocol; Soviet historiography then treated Stalin's account
    as official dogma. Challenges to the protocol's authenticity continued into glasnost: at a Novosti press conference
    in August 1988, Valentin Falin acknowledged some division of spheres but stressed that only copies of copies had
    been published and said the protocol might be false. A Congress-appointed commission conducted a reassessment in
    1989, culminating in the formal resolution that acknowledged the protocol and condemned its signing.
  highlights:
    - value: 41 years
      label: from the 1948 state counter-publication to formal Soviet acknowledgment in 1989
    - value: 23 August 1939
      label: date of the treaty and secret additional protocol
    - value: 24 December 1989
      label: date the USSR Congress formally acknowledged and condemned the secret arrangements
  context:
    - >-
      Falsifiers of History called the U.S. documentary release a falsification campaign but did not name or directly
      discuss the 23 August 1939 secret protocol. It is evidence of the state counter-narrative and omission, not a
      source for a verbatim Soviet denial of the protocol.
    - >-
      The 16 August 1988 Novosti conference marked a limited opening, not an authentication. Research based on
      contemporary press and news-agency reports finds that Falin acknowledged some division of spheres while saying
      the protocol might be false and emphasizing that no original had been seen. A participant history calls the
      position a denial and records his later change during the 1989 commission.
    - >-
      In December 1989 the Soviet originals had not yet been found. The Congress relied on copies, maps, related
      documents, expert examinations and correspondence with subsequent events; the Soviet original was located later
      and is now identified by an archival storage code.
    - >-
      The 1989 resolution distinguished the public non-aggression treaty from the secret arrangements: it did not find
      that the public treaty itself departed from normal international practice, but condemned the secret protocols as
      contrary to the sovereignty and independence of third states.
episodes:
  - id: soviet-union-1948-1989
    polity: Soviet Union
    region: Eurasia
    startYear: 1948
    endYear: 1989
    periodLabel: February 1948 – 24 December 1989
    strength: officially-endorsed
    institutionTypes:
      - government
    institutions:
      - Soviet Information Bureau
      - Communist Party of the Soviet Union
      - Novosti Press Agency (APN)
    institutionalContext: >-
      In January 1948 the U.S. State Department published Nazi-Soviet Relations, including a translation of the secret
      protocol from captured German records. Stalin supervised the Soviet Information Bureau's reply, Falsifiers of
      History, which was released through a press conference, Pravda installments and mass publication. Its theses
      became the basis of official Soviet historiography about the pact, while the protocol itself remained excluded
      from the authorized account. Institutional representatives continued to cast doubt on the protocol into 1989
      before the Congress of People's Deputies established a commission and formally reversed the line that December.
    consequences:
      - An authentic secret agreement was excluded from the authorized Soviet account of the diplomacy of 1939
      - Western documentary evidence was publicly framed as part of a falsification campaign
      - Official history supplied alternative explanations for Soviet actions toward Poland, the Baltic states, Finland and Bessarabia
      - The Soviet archival counterpart remained inaccessible while historians and the public debated copies held abroad
      - The dispute became part of late-Soviet political mobilization in the Baltic republics
      - The 1989 commission and Congress had to establish authenticity before the Soviet original had been located
    summary: >-
      The 1948 Soviet response to the Western document release established a durable official framework that defended
      the pact while omitting its secret protocol. Later public denials treated the protocol as nonexistent or
      inauthentic even though copies and corroborating records were available abroad. In December 1989 the Soviet
      Congress confirmed its existence, condemned the secret arrangements and declared them invalid from inception.
    mechanism:
      kind: publication
      summary: >-
        The state answered the documentary release with a centrally directed pamphlet, newspaper serialization and
        international distribution. Its interpretation became official historiography, reinforced by continued public
        denial and the inaccessibility of the Soviet archival counterpart.
    institutionalCorrection:
      status: corrected
      periodLabel: 24 December 1989
      action: The USSR Congress of People's Deputies confirmed that the secret protocol had been signed and existed, condemned its signing and declared the secret arrangements invalid from inception.
      summary: >-
        Resolution No. 979-I formally replaced the inherited public line after a congressional commission assessed
        copies, maps, related records and expert examinations.
