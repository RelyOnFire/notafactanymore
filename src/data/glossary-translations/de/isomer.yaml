entryId: isomer
sourceReviewedAt: '2026-08-21'
term: Isomer
aliases:
- Isomere
- Isomerie
shortDefinition: Eine von mehreren Verbindungen mit derselben Summenformel, deren Atome jedoch unterschiedlich verknüpft
  oder räumlich angeordnet sind.
longDefinition: Isomere enthalten dieselben Arten und Anzahlen von Atomen, unterscheiden sich aber in ihrer Molekülstruktur.
  Konstitutionsisomere unterscheiden sich in der Verknüpfung der Atome, während Stereoisomere dieselbe Verknüpfung, aber
  unterschiedliche räumliche Anordnungen besitzen. Weil Struktur Wechselwirkungen und Energie beeinflusst, können Isomere
  trotz gleicher Summenformel sehr unterschiedliche physikalische, chemische und biologische Eigenschaften haben.
