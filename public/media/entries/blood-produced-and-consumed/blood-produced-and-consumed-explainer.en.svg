<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1710" viewBox="0 0 760 1710" role="img" aria-labelledby="title desc">
<title id="title">From consumption to circulation</title>
<desc id="desc">Vertical comparison of a simplified Galenic blood-production model, Harvey&#x27;s quantitative objection, and a closed circulation driven by the heart.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}</style>
<rect width="760" height="1710" fill="#f5f0e6"/>
<rect x="30" y="30" width="700" height="520" rx="20" fill="#fbf8f1" stroke="#d6cec0" stroke-width="2"/><rect x="30" y="575" width="700" height="345" rx="20" fill="#fbf8f1" stroke="#d6cec0" stroke-width="2"/><rect x="30" y="945" width="700" height="735" rx="20" fill="#fbf8f1" stroke="#d6cec0" stroke-width="2"/><text x="58" y="78" font-size="18" font-weight="700" fill="#4f776e" text-anchor="start" letter-spacing="2">OLDER MODEL</text><text x="58" y="124" font-size="40" font-weight="700" fill="#2f302d" text-anchor="start">Galenic model</text><ellipse cx="175" cy="275" rx="78" ry="45" fill="#a77a65" stroke="#795846" stroke-width="2"/><text x="175" y="283" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">Liver</text><path d="M405 232 C380 198 330 214 330 258 C330 315 405 345 405 345 C405 345 480 315 480 258 C480 214 430 198 405 232Z" fill="#a85d58" stroke="#7f4642" stroke-width="2"/><text x="405" y="278" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Heart</text><circle cx="615" cy="275" r="58" fill="#d5c8b7" stroke="#9d9487" stroke-width="2"/><text x="615" y="283" font-size="21" font-weight="700" fill="#2f302d" text-anchor="middle">Tissues</text><line x1="255" y1="275" x2="318.0" y2="275.0" stroke="#7f5b55" stroke-width="6" stroke-linecap="round"/><polygon points="330,275 318.0,269.0 318.0,281.0" fill="#7f5b55"/><line x1="480" y1="275" x2="543.0" y2="275.0" stroke="#7f5b55" stroke-width="6" stroke-linecap="round"/><polygon points="555,275 543.0,269.0 543.0,281.0" fill="#7f5b55"/><text x="58" y="385" font-size="22" font-weight="600" fill="#2f302d" text-anchor="start">Liver continually makes blood</text><text x="58" y="422" font-size="22" font-weight="600" fill="#2f302d" text-anchor="start">Blood flows outward to nourish tissues</text><text x="58" y="459" font-size="22" font-weight="600" fill="#2f302d" text-anchor="start">Tissues use the blood that reaches them</text><text x="58" y="515" font-size="17" font-weight="400" fill="#6d6b64" text-anchor="start">Simplified framework</text><text x="58" y="622" font-size="18" font-weight="700" fill="#4f776e" text-anchor="start" letter-spacing="2">THE QUANTITATIVE PROBLEM</text><text x="58" y="668" font-size="36" font-weight="700" fill="#2f302d" text-anchor="start">Harvey’s problem</text><path d="M150 715 C128 686 88 700 88 736 C88 782 150 808 150 808 C150 808 212 782 212 736 C212 700 172 686 150 715Z" fill="#a85d58" stroke="#7f4642" stroke-width="2"/><line x1="235" y1="720" x2="338.0" y2="720.0" stroke="#4f776e" stroke-width="5" stroke-linecap="round"/><polygon points="350,720 338.0,714.0 338.0,726.0" fill="#4f776e"/><line x1="235" y1="750" x2="338.0" y2="750.0" stroke="#4f776e" stroke-width="5" stroke-linecap="round"/><polygon points="350,750 338.0,744.0 338.0,756.0" fill="#4f776e"/><line x1="235" y1="780" x2="338.0" y2="780.0" stroke="#4f776e" stroke-width="5" stroke-linecap="round"/><polygon points="350,780 338.0,774.0 338.0,786.0" fill="#4f776e"/><text x="385" y="715" font-size="22" font-weight="500" fill="#2f302d" text-anchor="start"><tspan x="385" dy="0">The heart moves far too much</tspan><tspan x="385" dy="29">blood for constant production</tspan><tspan x="385" dy="29">and consumption to be</tspan><tspan x="385" dy="29">plausible</tspan></text><text x="58" y="992" font-size="18" font-weight="700" fill="#4f776e" text-anchor="start" letter-spacing="2">REPLACEMENT</text><text x="58" y="1038" font-size="40" font-weight="700" fill="#2f302d" text-anchor="start">Closed circulation</text><path d="M380 1155 C354 1121 305 1138 305 1181 C305 1238 380 1268 380 1268 C380 1268 455 1238 455 1181 C455 1138 406 1121 380 1155Z" fill="#a85d58" stroke="#7f4642" stroke-width="2"/><text x="380" y="1202" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Heart</text><rect x="87" y="1138" width="150" height="110" rx="45" fill="#d7dedb" stroke="#84948f" stroke-width="2"/><text x="162" y="1200" font-size="22" font-weight="700" fill="#2f302d" text-anchor="middle">Lungs</text><rect x="523" y="1138" width="150" height="110" rx="45" fill="#d5c8b7" stroke="#9d9487" stroke-width="2"/><text x="598" y="1200" font-size="22" font-weight="700" fill="#2f302d" text-anchor="middle">Body</text><line x1="310" y1="1178" x2="249.0" y2="1178.0" stroke="#557786" stroke-width="6" stroke-linecap="round"/><polygon points="237,1178 249.0,1184.0 249.0,1172.0" fill="#557786"/><line x1="237" y1="1210" x2="293.0" y2="1210.0" stroke="#9e5f58" stroke-width="6" stroke-linecap="round"/><polygon points="305,1210 293.0,1204.0 293.0,1216.0" fill="#9e5f58"/><line x1="455" y1="1178" x2="511.0" y2="1178.0" stroke="#9e5f58" stroke-width="6" stroke-linecap="round"/><polygon points="523,1178 511.0,1172.0 511.0,1184.0" fill="#9e5f58"/><line x1="523" y1="1210" x2="467.0" y2="1210.0" stroke="#557786" stroke-width="6" stroke-linecap="round"/><polygon points="455,1210 467.0,1216.0 467.0,1204.0" fill="#557786"/><text x="58" y="1355" font-size="22" font-weight="600" fill="#2f302d" text-anchor="start">Heart drives blood outward through arteries</text><text x="58" y="1392" font-size="22" font-weight="600" fill="#2f302d" text-anchor="start">Blood returns through veins</text><text x="58" y="1429" font-size="22" font-weight="600" fill="#2f302d" text-anchor="start">The same blood circulates repeatedly</text><rect x="54" y="1490" width="652" height="145" rx="12" fill="#ece7db"/><text x="72" y="1527" font-size="17" font-weight="700" fill="#4f776e" text-anchor="start" letter-spacing="1.5">CAVEAT</text><text x="72" y="1565" font-size="19" font-weight="400" fill="#6d6b64" text-anchor="start"><tspan x="72" dy="0">Simplified: earlier anatomists had already corrected parts of</tspan><tspan x="72" dy="26">Galen’s model.</tspan></text></svg>