title: Lysenkoist heredity
claim: Environmental treatment can reliably reshape heredity across generations, making Mendelian genetics unnecessary or false.
currentUnderstanding: Heredity is transmitted primarily through genetic information. Environmental effects can influence development and sometimes persist across generations, but they do not support the broad Lysenkoist claim that directed environmental treatment routinely rewrites inherited traits.
category: Genetics
entryId: acquired-traits-drive-evolution
reviewedAt: 2026-08-22
