locale: de
entryId: cryovolcanism
sourceReviewedAt: '2026-08-21'
term: Kryovulkanismus
aliases:
- kryovulkanisch
- Eisvulkanismus
shortDefinition: Vulkanähnliche Aktivität auf kalten Himmelskörpern, bei der Wasser, Wasserdampf, Eispartikel oder andere
  flüchtige Stoffe statt geschmolzenen Silikatgesteins austreten.
longDefinition: Kryovulkanismus ist ein Sammelbegriff für eruptive geologische Aktivität mit flüchtigen Stoffen auf eisigen
  Welten. Statt heißer Silikatlava können Wasser, Dampf, Eispartikel, Ammoniak, Methan oder Mischungen daraus austreten.
  Die Fontänen am Südpol von Enceladus sind ein prominentes Beispiel aktiver Freisetzung flüchtigen Materials aus einem
  Eismond, wobei für einzelne Erscheinungen unterschiedliche Eruptionsmechanismen diskutiert werden.
