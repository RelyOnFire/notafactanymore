schemaVersion: 2
title: Paraffin nitrate testing as proof of firearm discharge
proposition:
  summary: >-
    A paraffin or dermal-nitrate test on a person's hands was treated as a reliable indicator of whether that person
    had recently fired a gun: a positive reaction was attributed to gunpowder residue, while a negative result could
    be treated as evidence that the person had not fired.
correction:
  summary: >-
    The classic paraffin test is chemically nonspecific. It detects nitrates or nitrites that can come from many
    sources besides firearm discharge, including fertilizers, tobacco combustion, pharmaceuticals and fireworks;
    genuine shooters can also test negative after washing, ordinary activity, delay, or because of the firearm and
    ammunition used. Modern primer-residue analysis uses particle morphology and elemental composition, commonly by
    SEM/EDS. Even then, a positive finding can reflect discharge, proximity or transfer, and a negative finding does
    not exclude firing. Results therefore require case context and cannot by themselves identify a shooter.
category: Forensic science and firearms investigation
reviewedAt: 2026-10-03
impact:
  summary: >-
    Philippine courts and forensic agencies provide an unusually long, internally documented trajectory. The Supreme
    Court counted a positive paraffin result among the evidence of guilt in 1944 and said in 1981 that such a test
    proved recent firing. By 1994 it expressly called the method extremely unreliable and rejected both positive and
    negative results as source-specific proof. Operational use and public source inferences nevertheless continued:
    police officials cited a positive result in 2021, and in 2026 a Philippine Navy spokesperson treated negative
    results as clearing Marines of direct participation in a shooting.
  highlights:
    - value: '1941'
      label: Philippine Constabulary chemists used the test; the 1944 Supreme Court opinion counted its positive result toward guilt
    - value: '1994'
      label: The Supreme Court expressly said the test was extremely unreliable and could not identify firearm discharge as the nitrate source
    - value: '2026'
      label: A Navy spokesperson publicly treated negative PNP paraffin results as showing that Marines had not fired
  context:
    - >-
      The cited convictions also rested on eyewitnesses, confessions or other evidence. The record does not attribute
      any conviction solely to a paraffin result; it documents the source-specific meaning institutions assigned to
      that result.
    - >-
      Collection of a test does not by itself show that an institution regarded it as conclusive. The later examples
      are included because officials publicly drew the disputed inference from positive or negative results, while the
      2023 Senate notes independently document that paraffin testing still formed part of a police-shooting inquiry.
    - >-
      This correction concerns the nitrate-based paraffin test. It does not imply that all modern gunshot-residue
      analysis is invalid; modern particle analysis is more specific, although its results remain circumstantial.
episodes:
  - id: philippines-1941-present
    polity: Philippines
    region: Southeast Asia
    startYear: 1941
    endYear: 2026
    endOpen: true
    periodLabel: 1941–present (documented through 2026)
    strength: institutionally-influential
    institutionTypes:
      - government
      - court
    institutions:
      - Philippine Constabulary
      - National Bureau of Investigation (NBI) Forensic Chemistry Division
      - Philippine National Police (PNP) Crime Laboratory / Forensic Group
      - Supreme Court of the Philippines
      - Philippine Navy
    institutionalContext: >-
      Successive Philippine law-enforcement laboratories collected paraffin casts and used diphenylamine reactions to
      detect nitrates on suspects' and officers' hands. Courts admitted the results, and early Supreme Court opinions
      themselves assigned positive findings source-specific weight. The Supreme Court later rejected that inference,
      but PNP testing and official interpretations persisted in disciplinary, criminal and police-shooting inquiries.
      The Navy's 2026 statement shows continued reliance on the opposite inference as well: that a negative test meant
      personnel had not fired.
    consequences:
      - Suspects, victims and officers were subjected to paraffin casting during shooting investigations
      - Positive nitrate findings entered criminal trials and were cited in police disciplinary proceedings
      - Negative findings were publicly used to clear personnel despite the known false-negative problem
      - Police-shooting accountability inquiries continued to expect the test after the judicial reliability warning
    summary: >-
      Philippine institutional use is documented from a 1941 Philippine Constabulary examination through PNP testing
      in 2026. Constabulary and NBI chemists reported nitrate reactions as gunpowder evidence, and the Supreme Court
      once credited those results as showing recent firearm discharge. The Court had reversed that evidentiary premise
      by 1994, explaining that nitrates are nonspecific and that genuine shooters can test negative. Yet later police
      investigations retained the procedure and officials continued to give its outcomes source-specific meaning.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Law-enforcement bodies embedded paraffin casting in post-shooting examinations, forensic laboratories issued
        nitrate findings, and investigators, disciplinary authorities and courts used those findings as evidence about
        who had or had not fired a weapon.
    institutionalCorrection:
      status: partial
      periodLabel: 1994–present
      action: The Supreme Court rejected paraffin results as conclusive proof of firearm discharge, but operational testing and source-specific public interpretations continued.
      summary: >-
        Judicial doctrine corrected the central inference and has repeatedly reaffirmed that neither a positive nor a
        negative result identifies a shooter. The correction remained institutionally incomplete because law-enforcement
        agencies continued to administer the test and officials still described its results as incriminating or exculpatory.
