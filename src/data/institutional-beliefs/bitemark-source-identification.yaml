title: Bitemarks as individual source identification
claim: >-
  Patterns left by teeth on human skin were treated as preserving sufficiently distinctive dental features to identify
  or strongly associate a particular person as the biter.
currentUnderstanding: >-
  The scientific premises required for individual bitemark attribution have not been established. Human anterior
  dentition has not been shown to be unique at the individual level for this purpose, skin does not consistently
  preserve dental patterns without distortion, and examiners have not been shown to analyze injury patterns reliably
  enough to identify or reliably include a source. Dental comparison may have limited investigative or exclusionary
  uses in some contexts, but it does not support individual source identification from a skin injury.
category: Forensic medicine and identification
reviewedAt: 2026-08-23
impact:
  summary: >-
    Bitemark analysis became standardized and courtroom-influential before its core source-identification assumptions
    had been validated. Later professional restrictions and scientific reviews progressively narrowed what an examiner
    could responsibly claim from a patterned injury on skin.
  highlights:
    - value: '1984'
      label: ABFO promulgated guidelines and a uniform scoring system for bitemark analysis
    - value: '2015'
      label: ABFO manual no longer supported an unconditional “The Biter” conclusion in open-population cases
    - value: '2023'
      label: NIST published its final scientific-foundation review of bitemark analysis
  context:
    - >-
      This card concerns attribution of a skin injury to a living person's teeth. It does not concern the well-established
      forensic use of dental records and radiographs to identify human remains.
    - >-
      Professional practice did not disappear in 2015. That date marks a significant narrowing of the strongest source
      conclusion within ABFO guidance; current ABFO-style conclusions are limited to exclude, not exclude, or inconclusive.
episodes:
  - id: united-states-1984-2015
    polity: United States
    region: North America
    startYear: 1984
    endYear: 2015
    periodLabel: 1984–2015
    strength: institutionally-influential
    institutionTypes: [professional, court, medical]
    institutions:
      - American Board of Forensic Odontology (ABFO)
    institutionalContext: >-
      ABFO, the principal U.S. professional organization for forensic odontologists, promulgated standardized bitemark
      guidelines and a scoring system beginning in 1984. Practitioners operating within this professional framework
      supplied expert evidence in criminal courts and military justice. Courts varied in how they assessed admissibility,
      but published decisions repeatedly treated bitemark comparison as an accepted means of identification.
    consequences:
      - Bitemark comparison testimony was admitted and used in criminal courts
      - Suspects could be included or identified from patterned injuries on skin
      - Source opinions could materially strengthen otherwise circumstantial prosecutions
      - Professional conclusion language was later restricted as the scientific foundation came under sustained review
    summary: >-
      In 1984 the American Board of Forensic Odontology promulgated guidelines intended to standardize bitemark analysis,
      including a uniform scoring system that its drafting committee initially described as a step toward a scientific
      approach. The published ABFO guidelines noted that bitemark evidence was already used in many courts and in the
      military justice system. Yet the ultimate source opinion remained subjective, with no accepted minimum number of
      matching features for a positive identification. By 2015 ABFO's reference manual no longer supported an
      unconditional conclusion of “The Biter” in an open-population case. Subsequent NIST review found that the three
      essential premises for source attribution—individual dental uniqueness, faithful transfer to skin, and reliable
      examiner interpretation—were not supported by sufficient data.
    sources:
      - title: Guidelines for bite mark analysis — American Board of Forensic Odontology
        url: https://pubmed.ncbi.nlm.nih.gov/3457076/
        publisher: Journal of the American Dental Association — indexed by PubMed
        note: >-
          The 1986 published ABFO guidelines state that bitemark evidence was used in many courts and military justice
          and provide detailed standardized methods for collecting and analyzing the evidence.
      - title: Reference Manual on Scientific Evidence — Reference Guide on Forensic Identification Expertise
        url: https://www.nationalacademies.org/read/13163/chapter/5
        publisher: National Research Council — National Academies Press
        note: >-
          Reconstructs ABFO's 1984 promulgation of a uniform scoring system, its early reliability claims, and the
          persistent subjectivity and lack of an accepted minimum number of matching features for individualization.
      - title: Reference Guide on Forensic Feature Comparison Evidence
        url: https://www.ncbi.nlm.nih.gov/books/NBK621601/
        publisher: National Academies of Sciences, Engineering, and Medicine — NCBI Bookshelf
        note: >-
          Records that the 2015 ABFO reference manual did not support a conclusion of “The Biter” in an open-population
          case and summarizes the scientific and judicial history of bitemark source claims.
      - title: Bitemark Analysis — A NIST Scientific Foundation Review
        url: https://www.nist.gov/publications/bitemark-analysis-nist-scientific-foundation-review
        publisher: National Institute of Standards and Technology
        note: >-
          Final NIST publication reviewing the scientific foundations of forensic bitemark analysis and the evidence
          needed to support source-comparison claims.
      - title: Forensic Bitemark Analysis Not Supported by Sufficient Data, NIST Draft Review Finds
        url: https://www.nist.gov/news-events/news/2022/10/forensic-bitemark-analysis-not-supported-sufficient-data-nist-draft-review
        publisher: National Institute of Standards and Technology
        note: >-
          Explains the review's three unsupported premises: individual uniqueness of anterior dental patterns, consistent
          transfer of those patterns to skin, and reliable examiner analysis of the resulting injury pattern.
