locale: de
entryId: anesthesia
sourceReviewedAt: '2026-08-21'
term: Anästhesie
aliases:
- Narkose
- Betäubung
shortDefinition: Medizinische Verfahren oder Medikamente, die Schmerzen bei Eingriffen verhindern; manche Formen
  schalten zusätzlich das Bewusstsein aus.
longDefinition: Anästhesie ist ein Oberbegriff für medizinische Verfahren, die Empfindungen bei Eingriffen blockieren.
  Eine Allgemeinanästhesie führt zur Bewusstlosigkeit, während Regional- oder Lokalanästhesie Schmerzen in einem
  Teil des Körpers verhindern kann, ohne den Patienten bewusstlos zu machen.
