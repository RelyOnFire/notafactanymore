entryId: ainu-primitive-race
sourceReviewedAt: 2026-08-22
title: Ainu als „primitive Rasse“
claim: Ainu wurden als „primitives“, rückständiges oder verschwindendes Volk behandelt, dessen Überleben und Modernisierung die Assimilation an eine sesshafte japanische Agrargesellschaft erfordere.
currentUnderstanding: Die Ainu sind ein indigenes Volk mit eigenen Geschichten, Sprachen, kulturellen Traditionen und politischen Gemeinschaften. Unterschiede zwischen Ainu und japanischen Lebensweisen waren kein Beleg biologischer Rückständigkeit; koloniale Enteignung, Zwangsumsiedlung, Einschränkungen des Ressourcenzugangs, Krankheiten und Assimilationspolitik trugen selbst wesentlich zu Verarmung und Bevölkerungsrückgang bei.
episodes:
  - id: japan-1899-1939
    polity: Japan
    summary: Japanische Kolonialverwaltung und physische Anthropologie stellten Ainu wiederholt als „primitive“ oder aussterbende „Rasse“ dar. Das Hokkaido Former Aborigines Protection Act von 1899 sollte ihre Lebensweise durch Landwirtschaft und Assimilation umformen; zugleich zielten Einschränkungen bei Jagd, Fischerei, Landbesitz, Sprache und Bräuchen auf die Eingliederung in eine vermeintlich fortgeschrittenere japanische Gesellschaft.
    consequences:
      - Erzwungene Agrarisierung
      - Unterdrückung indigener Lebensweisen
      - Enteignung von Land und Ressourcen
      - Kulturelle Assimilation
