schemaVersion: 2
title: Beriberi as an infectious disease rather than a nutritional deficiency
entryId: beriberi-is-caused-by-infection
proposition:
  summary: >-
    Military and colonial medical institutions in Japan and the Dutch East Indies treated beriberi as principally infectious rather than diet-related. In Japan, Army medical leaders resisted ration reform after the Navy had nearly eliminated the disease through dietary change; in the Dutch East Indies, a government research commission initially concluded that a bacterial infection and toxin caused the disease before colonial laboratory and prison evidence shifted attention to polished rice.
correction:
  summary: >-
    Beriberi is caused by thiamine (vitamin B1) deficiency. Diets dominated by highly polished rice can produce deficiency because milling removes thiamine-rich outer layers. Infection theories could not account for the Japanese Navy's dietary results, Eijkman's food-dependent animal experiments, Vorderman's prison survey or the later biochemical identification of thiamine. The early cause was genuinely uncertain; the institutional error was persisting with or formally endorsing an infectious model after strong dietary evidence emerged.
category: Medicine, nutrition and military health
reviewedAt: '2026-08-25'
impact:
  summary: >-
    Beriberi produced two unusually revealing institutional episodes in Asia. Japan's Navy changed sailors' diets and virtually eliminated the disease while Army medical leaders continued to favor infection and polished-rice rations. In the Dutch East Indies, the government sent a formal beriberi commission in 1886; its leaders returned convinced that a tropical bacterial infection produced a neurotoxin. The colonial medical system then generated its own contradiction. Eijkman's experiments connected polished rice with a beriberi-like neuropathy, and government physician Adolphe Vorderman found a striking prison-level association between polished rice and human beriberi. The prison evidence helped move dietary prevention into practice.
  highlights:
    - value: 1884–85
      label: Japanese Navy dietary experiments and ration reform were followed by the disappearance of beriberi from the Navy
    - value: 34 of 63 vs 1 of 27
      label: 'Dutch East Indies prisons with endemic or occasional beriberi in a later review: polished-rice prisons versus red-rice prisons'
      note: The historical review reports endemic beriberi in 34 of 63 prisons serving white polished rice and occasional beriberi in only one of 27 prisons serving red unpolished rice.
    - value: 1904–05
      label: the Japanese Army still suffered massive wartime beriberi after the Navy had supplied strong dietary counterevidence
  context:
    - Vitamin theory did not yet exist when the first commissions investigated beriberi. Bacteriology was transforming medicine, so an infectious hypothesis was initially reasonable. The institutional failure came later, when strong dietary evidence accumulated but the infectious interpretation continued to shape policy.
    - 'The Japanese case is principally a persistence problem: the Army maintained its infectious interpretation and ration policy after the Navy had produced strong contradictory evidence. The Dutch case is different: a state-sponsored infectious conclusion was progressively overturned by research generated within the same colonial medical and prison system.'
    - Vorderman's 1897 official prison investigation and the associated move toward unpolished rice mark a major institutional shift in the Dutch East Indies. They did not represent worldwide agreement on vitamin deficiency, and thiamine itself had not yet been isolated.
episodes:
  - id: japan-army-1885-1905
    polity: Japan
    region: East Asia
    startYear: 1885
    endYear: 1905
    strength: policy-basis
    institutionTypes:
      - government
      - medical
      - military
    institutions:
      - Imperial Japanese Army
      - Army Medical Department of the Imperial Japanese Army
    institutionalContext: >-
      The Japanese Navy and Army operated under different medical policies. After Takaki's controlled voyage comparison and dietary reform, Navy beriberi collapsed. Army medical leaders, including the head of the Army medical department, continued to treat an infectious origin as more plausible and resisted the food explanation while polished rice remained central to Army rations. The Russo-Japanese War ended in 1905; thiamine itself was identified later.
    consequences:
      - Continued polished-rice military ration policy despite strong dietary counterevidence
      - Large numbers of soldiers developed beriberi during wartime
      - Thousands of preventable military deaths and losses of operational capacity
      - Delayed institutional acceptance of a nutritional mechanism
    summary: >-
      From the mid-1880s, the Japanese Navy's dietary experiments and ration reform supplied strong evidence that beriberi was diet-related and nearly eliminated the disease among sailors. Army medical leaders nevertheless continued to favor an infectious origin and rejected the dietary explanation while soldiers remained heavily dependent on polished rice. During the Russo-Japanese War the Army suffered massive beriberi morbidity and mortality, while later vitamin research established thiamine deficiency as the cause.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Army medical leaders retained an infectious explanation and continued a polished-rice ration policy despite the Navy's strong dietary counterevidence, allowing the theory to shape military provisioning.
    institutionalCorrection:
      status: undocumented
      summary: >-
        Later research established thiamine deficiency as the cause, but the available record does not identify a dated institutional act by the Imperial Japanese Army that formally corrected its beriberi doctrine or ration policy.
  - id: dutch-east-indies-1886-1897
    polity: Dutch East Indies
    region: Southeast Asia
    startYear: 1886
    endYear: 1897
    strength: officially-endorsed
    institutionTypes:
      - government
      - medical
    institutions:
      - Dutch government Commission for Beriberi Research
      - Medical Laboratory at Weltevreden
      - Civil Medical Service and prison health administration of the Dutch East Indies
    institutionalContext: >-
      In 1886 the Dutch government sent Cornelis Pekelharing and Cornelis Winkler to investigate the severe beriberi problem in the East Indies, with Christiaan Eijkman attached to the commission for bacteriological research. Pekelharing and Winkler concluded that beriberi was a peripheral-nerve disease caused by bacteria producing a specific toxin and returned to the Netherlands convinced that it was a tropical infectious disease. Eijkman remained at the government laboratory and gradually obtained evidence linking the disease to diet. Government physician and prison inspector Adolphe Vorderman then used prison records and blinded rice assessment across Java and Madura to test the association in people. His 1897 report showed beriberi to be overwhelmingly associated with polished rather than unpolished rice, helping move colonial prison practice toward dietary prevention.
    consequences:
      - A formal colonial research programme initially organised around a bacterial and toxin explanation
      - Continued bacteriological investigation while a dietary cause remained institutionally marginal
      - Delayed use of rice-based prevention in institutions where polished rice was routinely supplied
      - Large-scale government prison investigation once dietary evidence became compelling
      - Adoption of unpolished rice in prison diets as the colonial health service translated the new evidence into prevention
    summary: >-
      The Dutch East Indies episode shows an institution correcting itself. A government commission initially returned an infectious verdict consistent with the new bacteriology of the 1880s. Research left behind in the colonial medical laboratory then undermined that conclusion: Eijkman's experiments implicated polished rice, and Vorderman's government prison survey demonstrated a striking human association between rice type and beriberi. The evidence redirected institutional practice toward diet years before thiamine itself was isolated.
    mechanism:
      kind: endorsement
      summary: >-
        The Dutch government commission organized the inquiry around bacteriology and officially endorsed a bacterial-toxin explanation, directing the colonial research programme toward an infectious cause.
    institutionalCorrection:
      status: corrected
      periodLabel: '1897'
      summary: >-
        Vorderman's official prison study and the colonial medical system's accumulating dietary evidence shifted prevention toward unpolished rice within the Dutch East Indies.
