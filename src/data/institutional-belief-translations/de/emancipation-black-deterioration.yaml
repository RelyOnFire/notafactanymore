locale: de
entryId: emancipation-black-deterioration
sourceReviewedAt: '2026-08-24'
title: Emanzipation als Ursache psychischer und sozialer Verschlechterung Schwarzer Menschen
claim: >-
  Emanzipation wurde als Ursache psychischer und sozialer Verschlechterung Schwarzer Menschen behandelt; fehlerhafte
  Behinderungsstatistiken der US-Volkszählung dienten als quantitative Begründung für die Behauptung, Schwarze Menschen
  seien unter Sklaverei besser gestellt.
currentUnderstanding: >-
  Die Ergebnisse der Volkszählung von 1840 konnten diesen Kausalzusammenhang nicht belegen. Ihre Behinderungsstatistik
  enthielt schwere Erfassungs- und Tabellenfehler, und die Spalten zu Behinderungen Schwarzer Menschen unterschieden
  nicht selbst zwischen freien und versklavten Personen. Gemeinden wurden mit psychisch kranken Schwarzen Einwohnern
  ausgewiesen, obwohl dieselbe Volkszählung dort überhaupt keine Schwarzen Einwohner verzeichnete. Aus diesen fehlerhaften
  Daten konstruierte regionale Unterschiede waren kein Beleg dafür, dass Emanzipation psychische Erkrankungen,
  Behinderungen oder sozialen Niedergang verursachte.
impact:
  summary: >-
    Fehlerhafte Statistiken der US-Volkszählung von 1840 wurden von Außenminister John C. Calhoun in ein offizielles
    Argument zugunsten der Sklaverei verwandelt. Im April 1844 verwendete er regionale Vergleiche der
    Behinderungszahlen in diplomatischer Korrespondenz, um zu behaupten, eine Veränderung des Verhältnisses zwischen
    Schwarzen und weißen Menschen habe die Lage Schwarzer Menschen verschlechtert. Zeitgenössische Statistiker und
    Anstaltsärzte wiesen grobe Fehler nach; der Kongress untersuchte die Volkszählung. Das Außenministerium verteidigte
    die allgemeine Schlussfolgerung dennoch 1845 erneut.
  highlights:
  - value: 1 zu 96 gegenüber 1 zu 672
    label: Calhouns kombinierte Behinderungsquote für Staaten ohne bzw. mit Sklaverei; keine reine Statistik zu Geisteskrankheit
  - value: 56 von 94
    label: angebliche Fälle psychisch kranker Schwarzer Menschen in Maine, die Orten ohne einen einzigen in derselben Volkszählung erfassten Schwarzen Einwohner zugeordnet waren
  - value: '1844'
    label: Kongressberichte dokumentierten erhebliche Fehler der sechsten Volkszählung
  context:
  - >-
    Die Volkszählung von 1840 lieferte das fehlerhafte Zahlenmaterial, markiert aber nicht den Beginn dieser
    institutionellen Glaubensphase. Zur offiziellen bundesstaatlichen Kausalbehauptung wurde sie 1844, als Außenminister
    John C. Calhoun die Zahlen in der Diplomatie des Außenministeriums verwendete, um Emanzipation beziehungsweise
    veränderte Rassenverhältnisse mit Verschlechterung zu verbinden.
  - >-
    Die Volkszählung zählte freie Schwarze Menschen und versklavte Menschen in den Bevölkerungsspalten getrennt,
    fasste sie bei Behinderungen jedoch als „colored persons“ zusammen. Calhouns Verhältnis von 1 zu 96 gegenüber
    1 zu 672 beruhte daher auf einer regionalen Einteilung der Staaten und nicht auf einem direkten Census-Vergleich
    der Geisteskrankheitsraten freier und versklavter Schwarzer Menschen.
  - >-
    Calhouns Quote kombinierte Taubheit, Stummheit, Blindheit, Idiotie und Geisteskrankheit. Sie darf nicht als
    Statistik beschrieben werden, wonach freie Schwarze Menschen siebenmal häufiger geisteskrank gewesen seien.
episodes:
- id: united-states-1844-1845
  polity: Vereinigte Staaten
  institutions:
  - United States Department of State
  institutionalContext: >-
    Die Volkszählung von 1840 lieferte das fehlerhafte Zahlenmaterial, doch das Außenministerium verlieh der
    Kausalbehauptung institutionelle Autorität. In einem amtlichen Schreiben vom 18. April 1844 an den britischen
    Gesandten Richard Pakenham argumentierte Außenminister John C. Calhoun anhand der Volkszählung und anderer
    amtlicher Statistiken, die Lage Schwarzer Menschen verschlechtere sich dort, wo Staaten das mit der Sklaverei
    verbundene rassische „Verhältnis“ verändert hätten. Er führte stark unterschiedliche regionale Behinderungsquoten
    als Beleg an. Nachdem statistische und parlamentarische Untersuchungen erhebliche Mängel der Volkszählung
    aufgezeigt hatten, verteidigte das Außenministerium den allgemeinen Vergleich 1845 dennoch weiter.
  consequences:
  - Fehlerhafte Bundesstatistiken wurden in ein offizielles diplomatisches Argument der Vereinigten Staaten zur Verteidigung der Sklaverei eingebaut
  - Zahlen verliehen einer rassistischen medizinisch-sozialen Behauptung den Anschein quantitativer bundesstaatlicher Bestätigung
  - Das Außenministerium verteidigte den Vergleich auch nach formellen statistischen Einwänden weiter
  - Die Episode zeigte, wie Fehler einer Volkszählung in institutionelle rassenpolitische Argumentation überführt werden konnten
  summary: >-
    1844 verwendete Außenminister John C. Calhoun die fehlerhaften Behinderungsdaten der sechsten Volkszählung in
    offizieller Korrespondenz, um zu behaupten, Schwarze Menschen erlitten dort stärkere körperliche, psychische und
    soziale Verschlechterung, wo Sklaverei abgeschafft oder rassische Verhältnisse verändert worden seien. Die
    Volkszählung selbst enthielt nicht den häufig ihr zugeschriebenen direkten Vergleich der Geisteskrankheit freier
    und versklavter Schwarzer Menschen: Die Behinderungsspalten fassten Schwarze Menschen zusammen, und Calhoun
    konstruierte stattdessen einen regionalen Vergleich zwischen Staaten mit unterschiedlichen Sklavereiregimen.
    Zeitgenössische Prüfer fanden unmögliche Einträge und grobe Tabellenfehler. Der Kongress untersuchte die
    Volkszählung, doch das Außenministerium verteidigte die allgemeine Schlussfolgerung noch 1845.
