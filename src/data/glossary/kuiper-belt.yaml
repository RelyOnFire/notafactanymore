term: Kuiper Belt
aliases:
- Kuiper belt
shortDefinition: A broad region beyond Neptune containing many icy small bodies, including Pluto and other dwarf planets.
longDefinition: The Kuiper Belt is a population of icy bodies orbiting the Sun beyond Neptune, mostly between roughly
  30 and 50 astronomical units. Discoveries beginning in the 1990s showed that Pluto is part of a much larger family
  of trans-Neptunian objects rather than an isolated oddity, helping trigger the modern debate over the definition of
  a planet.
relatedTerms:
- dwarf-planet
reviewedAt: '2026-08-21'
sources:
- title: Pluto Facts
  url: https://science.nasa.gov/dwarf-planets/pluto/facts/
  publisher: NASA
  note: Places Pluto in the Kuiper Belt and summarizes the discoveries that changed its classification context.
