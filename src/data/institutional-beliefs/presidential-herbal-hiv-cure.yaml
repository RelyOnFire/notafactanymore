title: Presidential herbal treatment as an HIV/AIDS cure
claim: A presidential herbal preparation was treated as capable of curing HIV/AIDS rapidly enough to replace antiretroviral
  therapy for people enrolled in a state treatment programme.
currentUnderstanding: There is no evidence that the herbal preparation used by the Gambian President’s Alternative
  Treatment Programme cured HIV. Effective antiretroviral therapy suppresses HIV replication and must not be discontinued
  in favour of unvalidated herbal remedies; interruption can allow viral rebound and disease progression.
category: Medicine and public health
reviewedAt: '2026-08-24'
impact:
  summary: The Gambia converted a personal cure claim into a coercive state treatment programme. The presidency
    organized the programme, health personnel and laboratories supported it, state broadcasting publicized it, and
    participants were required to stop standard antiretroviral treatment. A later Gambian truth commission reconstructed
    the programme and found serious human-rights and health harms.
  highlights:
  - value: '2007'
    label: President Yahya Jammeh publicly proclaimed an HIV/AIDS cure and created the state treatment programme
  - value: ART stopped
    label: Programme participants were taken off standard antiretroviral therapy while receiving the presidential
      treatment
  - value: 2020s review
    label: The Gambian truth commission reconstructed the programme and its harms from state and participant evidence
  context:
  - The disputed claim was that this specific presidential preparation, administered through the state programme,
    cured HIV/AIDS. That history does not imply that traditional or herbal medicines are ineffective for every condition.
episodes:
- id: gambia-2007-2016
  polity: The Gambia
  region: West Africa
  startYear: 2007
  endYear: 2016
  strength: enforced-doctrine
  institutionTypes:
  - government
  - medical
  institutions:
  - Office of the President of The Gambia
  - President’s Alternative Treatment Programme (PATP)
  - Ministry of Health and Social Welfare
  institutionalContext: The cure claim was operationalized through a programme centered in the presidency rather
    than left as a private statement. Patients living with HIV were enrolled in PATP, state health personnel and
    laboratory services participated, and the programme was publicly legitimized through government media. The programme's
    political operating environment ended with the Jammeh administration in 2016; that date reflects regime change,
    not a scientific discovery.
  consequences:
  - People living with HIV were enrolled in an unvalidated state treatment programme
  - Participants were required to discontinue standard antiretroviral treatment
  - State medical and laboratory resources were used to support the programme
  - Public broadcasting gave institutional legitimacy to the claimed cure
  - Participants experienced medical deterioration and deaths documented by the later truth commission
  summary: Beginning in 2007, President Yahya Jammeh claimed that his herbal treatment could cure HIV/AIDS and established
    the President’s Alternative Treatment Programme to administer it. The later Gambian truth commission found that
    the programme used state structures, required participants to stop antiretroviral therapy, and exposed them
    to serious health and rights violations. WHO had warned contemporaneously that no HIV cure existed and that
    herbal remedies must not replace antiretroviral treatment.
  sources:
  - title: Report Volume 9 — President’s Alternative Treatment Programme
    url: https://moj.gov.gm/wp-content/uploads/2024/12/Volume-9-President-s-Alternative-Treatment-Program.pdf
    publisher: Truth, Reconciliation and Reparations Commission / Ministry of Justice, The Gambia
    note: Official Gambian truth-commission report reconstructing Jammeh’s HIV/AIDS cure proclamation, creation
      and operation of PATP, participation of state personnel, withdrawal of standard treatment, participant testimony,
      and resulting harms.
  - title: WHO Statement on Treatment of HIV/AIDS
    url: https://www.afro.who.int/news/who-statement-treatment-hivaids
    publisher: World Health Organization Regional Office for Africa
    note: Contemporaneous February 2007 WHO statement says there was no cure for HIV/AIDS, identifies continuous
      antiretroviral therapy as effective treatment, and warns that herbal remedies must not replace comprehensive
      HIV care or cause antiretroviral therapy to be discontinued.
