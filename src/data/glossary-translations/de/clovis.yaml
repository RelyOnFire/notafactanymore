shortDefinition: Eine frühe archäologische Kultur Nordamerikas, bekannt besonders für charakteristische geriefte Steinspitzen
  aus der Zeit vor ungefähr 13.000 Jahren.
longDefinition: Clovis bezeichnet einen archäologischen Komplex, der in großen Teilen Nordamerikas vorkommt und besonders
  durch geriefte Steinspitzen gekennzeichnet ist. Über weite Teile des 20. Jahrhunderts galten Clovis-Fundstellen vielen
  Forschenden als Beleg für die ersten Menschen des Kontinents. Sicher datierte ältere Fundplätze zeigten später, dass
  Menschen bereits vor Clovis in Amerika lebten.
