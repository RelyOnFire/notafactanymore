entryId: chemosynthesis
sourceReviewedAt: '2026-08-21'
term: Chemosynthese
aliases:
- chemosynthetisch
shortDefinition: Die Herstellung organischer Stoffe mit Energie aus chemischen Reaktionen statt aus Sonnenlicht.
longDefinition: Bei der Chemosynthese bauen manche Mikroorganismen organische Moleküle mithilfe der Energie chemischer
  Reaktionen auf, etwa durch die Oxidation von Schwefelwasserstoff, Methan oder anderen reduzierten Verbindungen.
  Solche Organismen können die Basis von Nahrungsnetzen in lichtlosen Lebensräumen bilden, darunter einige Tiefseeökosysteme.
