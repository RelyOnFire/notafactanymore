sourceReviewedAt: '2026-08-21'
term: Phlogiston
aliases:
- Phlogistontheorie
- dephlogistisiert
shortDefinition: Ein hypothetischer feuerähnlicher Stoff, der nach früherer Vorstellung in brennbaren Materialien enthalten
  war und beim Verbrennen freigesetzt wurde.
longDefinition: Die Phlogistontheorie gab Chemikern des 17. und 18. Jahrhunderts einen gemeinsamen Erklärungsrahmen für
  Verbrennung, Kalzinierung, Verhüttung und Atmung. Brennbare Stoffe sollten Phlogiston enthalten und es beim Brennen
  verlieren. Quantitative Massenmessungen und die Sauerstofftheorie der Verbrennung machten den hypothetischen Stoff
  schließlich überflüssig.
