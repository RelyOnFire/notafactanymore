term: Lumineszenzdatierung
aliases:
- optisch stimulierte Lumineszenz
- OSL
- OSL-Datierung
shortDefinition: Eine Datierungsmethode, die bestimmt, wann Mineralkörner wie Quarz zuletzt Licht oder starker Hitze
  ausgesetzt waren.
longDefinition: Bei der Lumineszenzdatierung wird gespeicherte elektrische Ladung gemessen, die sich durch natürliche
  Hintergrundstrahlung in Mineralen ansammelt. Sonnenlicht oder ausreichende Hitze setzt einen großen Teil dieses Signals
  zurück. Aus der verbleibenden Lumineszenz und der Strahlungsdosis der Umgebung lässt sich abschätzen, wann ein Sediment
  zuletzt Licht ausgesetzt war. In White Sands lieferte optisch stimulierte Lumineszenz eine unabhängige Überprüfung
  der Fußspuren-Chronologie.
