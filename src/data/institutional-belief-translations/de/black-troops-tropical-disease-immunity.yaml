schemaVersion: 2
locale: de
entryId: black-troops-tropical-disease-immunity
sourceReviewedAt: '2026-09-19'
title: Schwarze Soldaten als von Natur aus resistent gegen Tropenkrankheiten
proposition:
  summary: >-
    US-Militärbehörden behandelten Schwarze Soldaten als von Natur aus widerstandsfähiger gegen Gelbfieber und andere
    Tropenkrankheiten; diese Annahme beeinflusste Rekrutierung und Einsatzentscheidungen für den Dienst auf Kuba im
    Spanisch-Amerikanischen Krieg.
correction:
  summary: >-
    Gelbfieber ist eine durch infizierte Mücken übertragene Viruserkrankung; laut Weltgesundheitsorganisation bietet eine
    einzelne Impfdosis lebenslangen Schutz. Malaria wird durch Plasmodium-Parasiten verursacht, die von Anopheles-Mücken
    übertragen werden. Langjährige Exposition kann eine partielle Malariaimmunität erzeugen, die laut WHO niemals
    vollständigen Schutz bietet. Keine der beiden Krankheiten verleiht durch rassische Abstammung einen allgemeinen
    Schutz. Eine amtliche Armeegeschichte berichtet, dass die Hälfte von 471 Männern des 24th Infantry in Siboney an
    Malaria oder Gelbfieber erkrankte; sie schlüsselt die Fälle nicht nach Krankheit auf.
impact:
  summary: >-
    Eine medizinhistorische Darstellung der Army dokumentiert, dass das War Department afroamerikanische Truppen wegen
    ihrer vermeintlich größeren Gelbfieberimmunität als vorteilhaft für Kuba und die Philippinen ansah. Auf Kuba wiesen
    Kommandeure das 24th Infantry unter einer umfassenderen Theorie natürlicher Schwarzer Immunität gegen Malaria und
    Gelbfieber dem Lazarettdienst in Siboney zu. Rassistische Vorstellungen trugen auch dazu bei, vier von zehn
    „Immune“-Regimentern der US-Freiwilligenarmee für Schwarze Mannschaften und Leutnants zu bestimmen; daneben standen
    die Anwerbung von Menschen mit vermeintlich erworbener Immunität oder Tropenerfahrung sowie politische Bemühungen um
    mehr Möglichkeiten für Schwarze im Militärdienst. Eine amtliche Armeegeschichte berichtet, dass die Hälfte von 471 Männern des 24th in Siboney
    an der einen oder anderen Krankheit erkrankte.
  highlights:
    - value: '4'
      label: von zehn „Immune“-Regimentern der US-Freiwilligenarmee für Schwarze Mannschaften und Leutnants bestimmt, aus mehreren belegten Gründen
    - value: 50 % von 471
      label: Männer des 24th Infantry in Siboney, die laut amtlicher Armeegeschichte an Malaria oder Gelbfieber erkrankten
    - value: '1898'
      label: Rassistische Annahmen über Krankheitsresistenz beeinflussten US-Entscheidungen zum Tropendienst
  context:
    - >-
      Die bundesgesetzliche Ermächtigung für „Immune“-Truppen erklärte Schwarze Menschen nicht selbst für rassisch immun
      gegen Gelbfieber. Die rassistische Behauptung ist vielmehr in Denken und Einsatzentscheidungen von War Department
      und Army sowie bei der Rekrutierung Schwarzer Truppen dokumentiert; das Gesetz selbst enthielt diese rassistische Aussage nicht.
    - >-
      Die berichtete 50-Prozent-Zahl fasst Malaria und Gelbfieber zusammen; sie ist keine reine Gelbfieber-Infektionsrate.
    - >-
      Das „Immune“-Programm verband unterschiedliche Vorstellungen: Anwerber suchten Menschen, die Gelbfieber vermeintlich
      überstanden hatten oder an heißes Klima gewöhnt waren, während die Rassenlehre tropische Eignung pauschal Schwarzen
      Menschen zuschrieb. Auch Schwarze Lobbyarbeit, der Ausschluss aus vielen staatlichen Einheiten und politische
      Anerkennung beeinflussten die Bestimmung der vier Regimenter. Die rassistische Annahme war ein Faktor, nicht die einzige Ursache.
    - >-
      Laut Armeemonografie brachte der Lazarettdienst wenig zusätzliches Kontaktrisiko mit sich, weil Malaria und
      Gelbfieber durch Mücken übertragen werden. Die belegte Folge ist die rassifizierte Begründung des Einsatzes, nicht
      die Behauptung, die Pflegetätigkeit selbst habe die Infektionen verursacht.
episodes:
  - id: united-states-1898
    polity: Vereinigte Staaten
    institutions:
      - United States War Department
      - United States Army
    institutionalContext: >-
      Planer des War Department und Kommandeure der Army nutzten eine medizinische Theorie, die Schwarzer Abstammung
      natürliche Widerstandsfähigkeit gegen Gelbfieber, Malaria oder tropisches Klima zuschrieb. Das War Department sah
      Schwarze Truppen als vorteilhaft für den Tropendienst in Übersee an; Kommandeure wiesen das 24th Infantry in Siboney
      dem Lazarettdienst zu, weil seine Soldaten angeblich immuner als weiße Truppen seien. Davon getrennt wurden vier der
      zehn „Immune“-Regimenter der US-Freiwilligenarmee für Schwarze Mannschaften und Leutnants bestimmt. Rassifizierte
      Vorstellungen tropischer Eignung trugen dazu bei; ebenso wirkten die Anwerbung vermeintlich erworbener Immunität,
      Akklimatisierung, Lobbyarbeit, Zugang zum Freiwilligendienst und Parteipolitik. Erkrankungen im 24th widersprachen
      bald einem allgemeinen rassischen Schutz.
    consequences:
      - Das War Department behandelte die vermeintliche Gelbfieberimmunität Schwarzer Soldaten in seiner Einsatzplanung als Vorteil für den Tropendienst
      - Das 24th Infantry wurde unter einer Theorie größerer natürlicher Resistenz dem Lazarettdienst in Siboney zugewiesen
      - Rassistische Vorstellungen trugen innerhalb eines Programms mit mehreren Ursachen zur Bestimmung von vier Schwarzen „Immune“-Regimentern bei
      - Eine zusammengefasste Erkrankungsrate von 50 Prozent für Malaria oder Gelbfieber bei 471 Männern des 24th widersprach der Vorstellung allgemeiner rassischer Immunität
    summary: >-
      1898 behandelten das Denken im War Department und Entscheidungen der Army Schwarze Soldaten als besonders für den
      Tropendienst geeignet, weil ihnen größere natürliche Widerstandsfähigkeit zugeschrieben wurde. Die Behauptung
      bestimmte unmittelbar den Lazaretteinsatz des 24th Infantry und trug zur Bestimmung Schwarzer Mannschaften und
      Leutnants für vier Regimenter im umfassenderen „Immune“-Programm bei. Eine amtliche Armeegeschichte berichtet dennoch, dass 50 Prozent von 471
      Männern in Siboney an Malaria oder Gelbfieber erkrankten; dieser zusammengefasste Befund widersprach der vermeintlichen rassischen Immunität.
    mechanism:
      summary: >-
        Einsatzplanung des War Department und die Lazarettzuweisung der Army in Siboney setzten die Vorstellung um,
        Schwarze Truppen seien von Natur aus besser für den Tropendienst geeignet. Auch die vier Schwarzen
        „Immune“-Regimenter spiegelten diese Annahme wider, jedoch innerhalb eines Programms, das von der Anwerbung
        erworbener Immunität, Akklimatisierung, Lobbyarbeit und Politik geprägt war.
    institutionalCorrection:
      summary: >-
        Die Erkrankungen im 24th Infantry widersprachen der rassistischen Annahme noch während des Krieges; weder Schwarze
        noch weiße „Immune“-Regimenter zeigten die versprochene Immunität. Eine historische Darstellung belegt, dass die
        Vorstellung Schwarzer Tropeneignung die Organisation der Army 1899 noch beeinflusste. Ein datierter formeller
        Widerruf der umfassenderen Rassentheorie durch War Department oder Army ist im vorhandenen Nachweis nicht belegt.
evidence:
  - id: black-troops-army-medical-proposition
    note: >-
      Die medizinhistorische Darstellung der Army hält fest, das War Department habe im Einsatz afroamerikanischer
      Truppen auf Kuba und den Philippinen einen Vorteil gesehen, weil ihnen größere Gelbfieberimmunität als weißen
      Truppen zugeschrieben wurde.
  - id: black-troops-who-correction
    note: >-
      Die WHO beschreibt Gelbfieber als durch infizierte Mücken übertragenes Virus und erklärt, eine Impfdosis biete
      lebenslangen Schutz. Die Seite wird nicht als Beleg für Immunität nach überstandener natürlicher Infektion verwendet.
  - id: black-troops-army-history-impact
    note: >-
      Amtliche Armeegeschichte zur Annahme natürlicher Tropenkrankheitsresistenz, zum Lazaretteinsatz des 24th Infantry
      in Siboney und zur Feststellung, dass 50 Prozent von 471 Männern dort an der „einen oder anderen“ Krankheit, Malaria
      oder Gelbfieber, erkrankten.
  - id: black-troops-army-history-carrier
    note: >-
      Die amtliche Armeemonografie nennt Kommandeure als diejenigen, die das 24th Infantry unter der damaligen Theorie,
      Schwarze Soldaten seien gegen Malaria und Gelbfieber immuner als weiße, zum Lazarettdienst in Siboney einsetzten.
  - id: black-troops-nps-hayes-mechanism
    note: >-
      Amtliche NPS-Darstellung, wonach Menschen innerhalb und außerhalb des War Department glaubten, afroamerikanische
      Soldaten könnten das tropische Klima Kubas besser verkraften als weiße Soldaten.
  - id: black-troops-nps-buffalo-consequences
    note: >-
      Amtliche NPS-Geschichte, die festhält, dass Schwarze Soldaten des 24th Infantry während des Gelbfieberausbruchs als
      Pfleger und Lazarettordonnanzen dienten, weil das Stereotyp ihnen größere Widerstandsfähigkeit gegen Tropenbedingungen zuschrieb.
  - id: black-troops-army-foundation-context
    note: >-
      Die Synthese trennt die gesetzliche Immunitätsanforderung und die Anwerbung vermeintlich vorexponierter oder
      akklimatisierter Menschen vom rassistischen Glauben an natürliche Schwarze Tropeneignung. Sie dokumentiert auch
      Schwarze Lobbyarbeit, politische Anerkennung, fünf zunächst geplante Schwarze Regimenter und die Reduzierung auf vier.
  - id: black-troops-who-malaria-correction
    note: >-
      Die WHO erklärt, dass Malaria durch Plasmodium-Parasiten verursacht und durch infizierte Anopheles-Mücken übertragen
      wird. Langjährige Exposition kann partielle Immunität erzeugen; sie bietet niemals vollständigen Schutz und kann
      Infektionen weiterhin zulassen.
  - id: black-troops-army-medical-carrier
    note: >-
      Die medizinhistorische Darstellung nennt das War Department als Planer des überseeischen Einsatzes
      afroamerikanischer Truppen unter dem vermeintlichen Gelbfiebervorteil und zählt die nach Kuba entsandten Schwarzen
      regulären und National-Guard-Regimenter auf.
  - id: black-troops-army-medical-consequences
    note: >-
      Die Passage stützt die Folge zur Einsatzplanung des War Department. Sie belegt für sich weder die „Immune“-Regimenter
      noch die Lazarettzuweisung des 24th Infantry.
  - id: black-troops-army-history-consequences
    note: >-
      Die Armeemonografie verbindet die Rassentheorie unmittelbar mit dem Lazaretteinsatz des 24th Infantry in Siboney
      und berichtet, dass 50 Prozent von 471 Männern an Malaria oder Gelbfieber erkrankten, ohne die Krankheiten aufzuschlüsseln.
  - id: black-troops-army-foundation-consequences
    note: >-
      Die Synthese dokumentiert rassistische Argumente über Tropeneignung im Umfeld der Schwarzen „Immune“-Regimenter,
      die zunächst fünf Regimenter umfassende Festlegung in General Orders Nr. 55 und die spätere Reduzierung auf vier;
      zugleich hält sie weitere Motive fest.
  - id: black-troops-army-foundation-mechanism
    note: >-
      Der Artikel zeigt, wie gesetzliche Immunitätssprache, Anwerbung nach Vorexposition und Akklimatisierung,
      rassistischer Glaube, Lobbyarbeit, Zugang zum Militärdienst und Parteipolitik im „Immune“-Programm zusammenwirkten;
      er stützt keine monokausale Darstellung.
  - id: black-troops-army-foundation-correction
    note: >-
      Der Bericht hält fest, dass weder Schwarze noch weiße „Immune“-Regimenter Immunität zeigten und sieben Offiziere
      sowie 241 Mannschaften an Krankheiten starben. Dennoch habe die Vorstellung Schwarzer Tropeneignung noch zwei
      Freiwilligenregimenter von 1899 beeinflusst. Das spricht gegen einen sofortigen formellen Widerruf und ist selbst
      kein dokumentierter Korrekturakt.
