schemaVersion: 2
title: Narcoanalysis as a reliable means of extracting concealed truth
proposition:
  summary: >-
    Drug-induced disinhibition with sodium pentothal was treated as making lying difficult and enabling investigators
    to extract concealed truthful information from suspects and witnesses.
correction:
  summary: >-
    Sedative drugs can lower inhibition, but they do not create a physiological state in which a person must tell the
    truth. Statements under narcoanalysis can be inaccurate, suggestible, confused or confabulated. The technique
    therefore cannot function as a reliable “truth serum,” even though voluntarily obtained information may still
    generate investigative leads.
category: Forensic science and criminal investigation
reviewedAt: '2026-08-24'
impact:
  summary: >-
    India institutionalized narcoanalysis through forensic laboratories and an official procedure manual that explicitly
    said the drugged state made lying difficult. The Supreme Court later reviewed the scientific literature, emphasized
    that narcoanalysis does not reliably induce truthful statements, and in 2010 prohibited involuntary administration.
  highlights:
    - value: '2005'
      label: The national forensic procedure manual described narcoanalysis as making it difficult for a subject to lie
    - value: Operational use
      label: Police and state forensic laboratories used the technique on suspects and witnesses in criminal investigations
    - value: '2010'
      label: The Supreme Court prohibited involuntary narcoanalysis and emphasized its reliability and suggestibility problems
  context:
    - >-
      The 2010 constitutional holding concerned involuntary administration and bodily/mental autonomy as well as reliability.
      It did not transform every voluntary examination into an illegal act, nor does legal permissibility establish scientific validity.
episodes:
  - id: india-2005-2010
    polity: India
    region: South Asia
    startYear: 2005
    endYear: 2010
    strength: policy-basis
    institutionTypes:
      - government
      - court
      - medical
    institutions:
      - Directorate of Forensic Science, Ministry of Home Affairs
      - Forensic Science Laboratory, Bengaluru, Karnataka
    institutionalContext: >-
      The Directorate of Forensic Science’s 2005 laboratory procedure manual presented narcoanalysis as a forensic
      investigative technique and expressly claimed that the induced state made lying difficult. State laboratories
      applied the technique in investigations that later formed part of the Selvi litigation. In 2010 the Supreme Court
      barred involuntary administration and reviewed evidence showing that drug-induced speech is not reliably truthful.
    consequences:
      - Suspects and witnesses were subjected to drug-assisted interrogation
      - Forensic laboratories generated statements and investigative leads from a scientifically unreliable truth premise
      - Compulsory administration interfered with bodily and mental autonomy
      - Investigative and judicial resources were influenced by statements vulnerable to suggestion and fabrication
    summary: >-
      India’s 2005 forensic narcoanalysis manual said that sodium-pentothal-induced disinhibition could elicit normally
      concealed information and make it difficult for a subject to lie. Police and forensic laboratories used the method
      in criminal investigations. In Selvi v. State of Karnataka, the Supreme Court reviewed evidence that narcoanalysis
      does not reliably produce truthful statements, highlighted suggestibility and falsehood risks, and prohibited
      involuntary administration in 2010.
    mechanism:
      kind: standard-setting
      summary: >-
        The national forensic procedure manual codified narcoanalysis as an investigative technique and state forensic
        laboratories operationalized it in criminal investigations.
    institutionalCorrection:
      status: partial
      periodLabel: '2010'
      action: Supreme Court prohibited involuntary narcoanalysis and rejected the premise that the technique reliably induces truthful statements.
      summary: >-
        Selvi imposed a constitutional bar on involuntary administration and explicitly confronted the technique's
        scientific unreliability and suggestibility. The decision did not make every voluntary examination unlawful,
        so the institutional correction was substantial but not a total legal prohibition.
