    sourceId: sparrow-1958-directive
    relation: documents
    target: {scope: episode, episodeId: china-1955-1960, aspect: carrier}
    locator: single substantive paragraph beginning “1958年2月12日”
    note: >-
      Identifies the CCP Central Committee and State Council as joint issuers of the February 1958 directive and describes
