title: Polygraph screening as reliable detection of deception and personnel risk
claim: Polygraph screening was treated as accurate enough at distinguishing truthful from deceptive examinees to
  justify mandatory personnel screening and consequential security or integrity decisions.
currentUnderstanding: Polygraph responses measure physiological arousal, not deception itself. Specific-incident
  testing can perform above chance under some conditions, but it is far from infallible. Broad personnel screening
  and high-stakes appointment decisions amplify false-positive and false-negative risks, especially when the targeted
  misconduct is rare. Polygraphs may still have investigative, deterrent or admission-eliciting utility, but those
  functions are distinct from reliable individual truth or integrity determination.
category: Security screening and behavioral detection
reviewedAt: '2026-08-24'
impact:
  summary: Two institutional corrections show different ways polygraph evidence was given too much weight. The U.S.
    Department of Energy retained mandatory security screening until a National Academies review showed that low-base-rate
    screening could not reliably identify rare security violators. Moldova went further by making a positive result
    a gate for senior integrity-office appointment; its Constitutional Court struck that dispositive requirement
    after emphasizing the test’s low scientific certainty.
  highlights:
  - value: '1999'
    label: DOE established mandatory counterintelligence polygraph screening for sensitive personnel
  - value: '2002'
    label: The National Academies found screening accuracy insufficient to justify reliance on polygraphs for detecting
      security violators
  - value: 2017–18
    label: Moldova excluded an integrity-authority candidate for a non-positive test, then its Constitutional Court
      removed the positive-result gate
  context:
  - The correction is narrower than “polygraphs never work.” The strongest evidentiary problem concerns broad screening
    and dispositive personnel decisions, where physiological arousal is treated as if it uniquely identified deception
    or hidden institutional risk.
episodes:
- id: united-states-doe-1999-2006
  polity: United States
  region: North America
  startYear: 1999
  endYear: 2006
  periodLabel: 1999–2006
  strength: policy-basis
  institutionTypes:
  - government
  institutions:
  - United States Department of Energy (DOE)
  - National Nuclear Security Administration (NNSA)
  - DOE Office of Counterintelligence
  institutionalContext: DOE’s 1999 rule made counterintelligence polygraph screening part of the access regime for
    categories of federal and contractor personnel handling highly sensitive nuclear and classified information.
    Congress then required DOE to take account of a National Academy of Sciences review. After the 2002 report found
    the test insufficiently accurate for employee security screening, DOE initially proposed continuing the existing
    program, then revised the system in 2006 so that polygraph findings were only one component of a broader counterintelligence
    evaluation and could not alone support adverse personnel or access action.
  consequences:
  - Employees and contractors in sensitive positions were subjected to mandatory counterintelligence polygraph screening
  - Refusal could prevent initial access to sensitive positions or result in loss of classified access
  - Polygraph results generated follow-up interviews and counterintelligence investigation
  - Screening created predictable risks of false suspicion and false reassurance in a very low-base-rate security
    population
  summary: In 1999 the U.S. Department of Energy created a formal counterintelligence polygraph screening program
    for employees, contractors and applicants with access to especially sensitive classified information and nuclear-security
    programs. DOE then commissioned the National Academies to review the science. The 2002 review concluded that
    polygraph accuracy was insufficient for employee security screening because the rarity of actual spies and saboteurs
    makes damaging false positives and false negatives unavoidable. DOE’s 2006 replacement rule retained polygraphs
    for defined high-risk evaluations but formally limited their evidentiary role.
  sources:
  - title: Polygraph Examination Regulation — Final Rule, 1999
    url: https://www.govinfo.gov/content/pkg/FR-1999-12-17/pdf/99-32721.pdf
    publisher: United States Department of Energy / Federal Register
    note: Primary federal rule establishing DOE counterintelligence polygraph screening for specified employees,
      contractors, applicants and other personnel with access to sensitive information and programs.
  - title: The Polygraph and Lie Detection — Executive Summary
    url: https://www.nationalacademies.org/read/10420/chapter/2
    publisher: National Research Council / National Academies Press
    note: Concludes that polygraph accuracy for federal employee security screening is insufficient to justify reliance
      on the test and explains the severe false-positive and false-negative tradeoff in low-base-rate populations.
  - title: Counterintelligence Evaluation Regulations — 2006 final rule
    url: https://sgp.fas.org/news/2006/09/fr092906.html
    publisher: United States Department of Energy / Federal Register text mirrored by Federation of American Scientists
    note: Reconstructs DOE’s policy history and establishes the 2006 framework treating polygraph results as one
      component of a broader counterintelligence evaluation.
  - title: 10 CFR § 709.25 — Limits on use of polygraph examination results
    url: https://www.law.cornell.edu/cfr/text/10/709.25
    publisher: Electronic Code of Federal Regulations via Legal Information Institute
    note: Current codified rule prohibits DOE or its contractors from taking adverse personnel or access action
      solely on a significant-response or no-opinion polygraph result and bars substituting the polygraph for required
      investigation.
- id: moldova-2016-2018
  polity: Moldova
  region: Eastern Europe
  startYear: 2016
  endYear: 2018
  periodLabel: 2016–2018
  strength: policy-basis
  institutionTypes:
  - government
  - court
  institutions:
  - National Integrity Authority (Autoritatea Națională de Integritate)
  - Integrity Council (Consiliul de Integritate)
  institutionalContext: Moldova’s integrity-law framework made a positive polygraph result a practical condition
    for appointment to senior leadership of the National Integrity Authority. In 2017 candidate Teodor Cârnaț passed
    the written examination and interview but was excluded because his polygraph was not positive. In 2018 the Constitutional
    Court emphasized that polygraph results are presumptive and orientative, reviewed the test’s low scientific
    certainty, and invalidated the requirement that a candidate obtain a positive result.
  consequences:
  - A candidate for a senior public integrity office was excluded solely because he did not obtain a positive polygraph
    result
  - A physiologically based test became an eliminatory gate for public appointment
  - The system risked treating uncertain deception inference as a definitive integrity judgment
  - Constitutional litigation was required to reduce the test from dispositive gate to non-conclusive information
  summary: Moldova’s 2016 National Integrity Authority framework required leadership candidates to undergo polygraph
    testing in a way that made a positive result eliminatory. In 2017 Teodor Cârnaț was excluded after passing the
    written and interview stages because he did not obtain a positive polygraph result. The Constitutional Court
    held in 2018 that the test has low scientific certainty and is presumptive and orientative rather than exact;
    it removed the positive-result requirement as an unjustified dispositive barrier.
  sources:
  - title: Hotărârea nr. 6 din 10.04.2018 privind testul poligraf
    url: https://constcourt.md/public/ccdoc/hotariri/ro-h62018147g2017-roc51cd.pdf
    publisher: Constitutional Court of the Republic of Moldova
    note: Primary judgment reproducing the statutory purpose of polygraph testing as assessment of the truthfulness
      of supplied information, documenting the 2017 exclusion of a National Integrity Authority candidate for a
      non-positive result, and striking the positive-result requirement after emphasizing the test’s presumptive
      character and low scientific certainty.
