    publisher: Hungarian National Archives
    note: >-
      Archival document guide covering 1955–1956 reviews and rehabilitation proceedings surrounding the major political
      trials, including Rajk; the companion name index records Rajk's 1956 rehabilitation.
  - title: “The interest of the Party above all”
    url: https://www.oktatolapok.mnl.gov.hu/politika/a_part_erdeke_mindenek_felett.html
    publisher: Hungarian National Archives / ArchivNet
    note: >-
      Reproduces a June 1964 Interior Ministry Investigation Department accounting of the wider Rajk affair: proceedings
