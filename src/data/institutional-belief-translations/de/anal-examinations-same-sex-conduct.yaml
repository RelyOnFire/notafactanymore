locale: de
entryId: anal-examinations-same-sex-conduct
sourceReviewedAt: '2026-08-24'
title: Analuntersuchungen als „Beweis“ gleichgeschlechtlichen Verkehrs
claim: Form, Spannung oder Zustand von Anus und Schließmuskel wurden als körperlicher Nachweis dafür behandelt,
  dass eine Person rezeptiven Analverkehr gehabt habe.
currentUnderstanding: Analuntersuchungen können nicht zuverlässig feststellen, ob jemand zuvor einvernehmlichen
  rezeptiven Analverkehr hatte. Die vermeintlichen forensischen Merkmale gehen auf widerlegte Theorien des 19. Jahrhunderts
  zurück und besitzen keine wissenschaftlich tragfähige Beweiskraft.
episodes:
- id: egypt-2001-2017
  polity: Ägypten
  institutions:
  - Forensic Medicine Authority (مصلحة الطب الشرعي)
  - Egyptian Public Prosecution (النيابة العامة)
  - Ministry of Justice (وزارة العدل)
  institutionalContext: Staatsanwälte überweisen Beschuldigte wegen „Ausschweifung“ zur Untersuchung; die dem Justizministerium
    unterstehende Forensic Medicine Authority führt die Untersuchungen durch und erstellt Berichte, die vor Gericht
    als Beweismittel dienen. Die Polizei nimmt Betroffene fest und begleitet sie, doch die entscheidende medizinisch-juristische
    Kette verläuft von der staatsanwaltlichen Überweisung über die Untersuchung bis zur Verwendung des Berichts im
    Verfahren. Neuere Belege zeigen, dass diese Praxis weit über 2017 hinaus fortbestand und bis in die
    2020er-Jahre dokumentiert ist.
  summary: Ägyptische Staatsanwälte überweisen Männer und trans Frauen, denen „Ausschweifung“ vorgeworfen wird,
    seit Jahren an die dem Justizministerium unterstehende Forensic Medicine Authority. Dort sollen Analuntersuchungen
    vermeintliche Beweise für rezeptiven Analverkehr liefern. Die Praxis ist von den Queen-Boat-Verfahren 2001 bis
    in die 2020er-Jahre dokumentiert. Eine Eingabe aus dem Jahr 2024 erfasste allein zwischen Juli 2019 und Juni 2024
    45 staatsanwaltliche Überweisungen zu erzwungenen Analuntersuchungen; die daraus entstandenen Gutachten werden
    trotz fehlender wissenschaftlicher Aussagekraft weiterhin gegen Beschuldigte verwendet.
  consequences:
  - Erzwungene Analuntersuchungen
  - Medizinische Berichte als Beweismittel in Strafverfahren
  - Verurteilung und Haft wegen einvernehmlicher gleichgeschlechtlicher Handlungen
  - Grausame, erniedrigende und potenziell folterähnliche Behandlung
- id: lebanon-2012-2015
  polity: Libanon
  institutions:
  - Staatsanwaltschaft beim Kassationsgericht
  - Internal Security Forces (ISF)
  - Libanesischer Ärzteorden
  institutionalContext: Festnahmen durch die Internal Security Forces führten Verdächtige in ein medizinisch-juristisches
    Verfahren, in dem Staatsanwälte forensische Analuntersuchungen anordnen konnten. An der Spitze der landesweiten
    staatsanwaltlichen Hierarchie stand die Staatsanwaltschaft beim Kassationsgericht; ihre Anweisung von 2012 schuf
    kein vollständiges Verbot, sondern ließ Untersuchungen bei angeblicher Zustimmung zu und wertete eine Verweigerung
    als belastend. Der libanesische Ärzteorden wies Ärzte dagegen an, solche Tests nicht durchzuführen. Human Rights
    Watch dokumentierte Untersuchungen oder deren Androhung noch 2014 und 2015.
  summary: '2012 ordneten libanesische Staatsanwälte bei Männern, die wegen des Verdachts auf homosexuelle Handlungen
    festgenommen worden waren, forensische Analuntersuchungen an; Untersuchungsergebnisse flossen in Strafverfahren
    ein. Der libanesische Ärzteorden verurteilte die Tests als medizinisch und wissenschaftlich nutzlos sowie als
    Form von Folter. Die Praxis endete jedoch nicht sofort: Die staatsanwaltliche Anweisung von 2012 ließ Untersuchungen
    bei angeblicher Zustimmung weiterhin zu und wertete eine Verweigerung als Beweisanzeichen; Berichte belegen
    Untersuchungen oder deren Androhung noch bis 2015.'
  consequences:
  - Erzwungene Analuntersuchungen
  - Medizinische Befunde als Grundlage strafrechtlicher Vorwürfe
  - Grausame und erniedrigende Behandlung
- id: kenya-2015-2018
  polity: Kenia
  institutions:
  - Chief Magistrate Ukunda Law Courts
  - DCIO, Msambweni Police Station
  - Makadara General Hospital, Kwale
  institutionalContext: In einem Strafverfahren von 2015 beantragte die Staatsanwaltschaft medizinische Untersuchungen,
    die gleichgeschlechtliche Handlungen belegen sollten; ein Magistratsgericht genehmigte das Vorgehen und ein
    öffentliches Krankenhaus untersuchte die beiden Männer. Der kenianische Court of Appeal rekonstruierte diese
    institutionelle Kette und entschied 2018, dass die erzwungenen Analuntersuchungen Grundrechte verletzten und
    das behauptete Verhalten wissenschaftlich nicht feststellen konnten.
  summary: Nach der Festnahme zweier Männer in Kwale 2015 erlangten staatliche Ermittler eine richterliche Anordnung
    und brachten sie zu erzwungenen Untersuchungen in das Makadara General Hospital, die Beweise für gleichgeschlechtliche
    Handlungen liefern sollten. 2018 entschied der Court of Appeal, dass die Untersuchungen ihre Rechte verletzt
    hatten. Das Urteil dokumentierte zugleich den medizinischen Einwand, dass Analuntersuchungen das behauptete
    Verhalten nicht feststellen können – entsprechend dem internationalen medizinischen Konsens.
  consequences:
  - Gerichtlich angeordnete erzwungene Analuntersuchungen
  - Polizeilicher Transport und erzwungene medizinische Untersuchung der Beschuldigten
  - Verwendung vermeintlicher anatomischer Beweise in einem Strafverfahren
  - Verletzung von Privatsphäre, Würde und Schutz vor erniedrigender Behandlung
- id: kazakhstan-2016-2026
  polity: Kasachstan
  institutions:
  - Zentrum für forensische Untersuchungen des Justizministeriums der Republik Kasachstan
  institutionalContext: Einvernehmliche gleichgeschlechtliche Beziehungen sind in Kasachstan nicht strafbar; die
    betreffende Methodik ist für Ermittlungen bei Sexualstraftaten vorgesehen. Dennoch weist die forensische Methodik
    des Justizministeriums Sachverständige an, Anus und Rektum auf vermeintliche Merkmale eines „passiven Partners“
    zu untersuchen, darunter den Tonus des Schließmuskels, eine trichterförmige oder klaffende Öffnung und geglättete
    radiäre Falten. Die Methodik wurde im Dezember 2016 vom Wissenschaftlichen Rat des staatlichen forensischen Zentrums
    genehmigt und wird weiterhin im forensischen System des Justizministeriums veröffentlicht.
  summary: Das forensische System des kasachischen Justizministeriums führt für Sexualstrafverfahren eine Untersuchungsmethodik,
    nach der mehrere chronische Veränderungen im Anal- und Rektalbereich als charakteristisch für systematischen
    rezeptiven Verkehr zwischen Männern gelten sollen. Sachverständige sollen unter anderem den Schließmuskel digital
    prüfen; als vermeintliche Merkmale werden eine trichterförmige oder klaffende Analöffnung, geglättete Falten,
    verminderter Schließmuskeltonus und bestimmte Schleimhautfärbungen genannt. Nach heutigem forensischem Konsens
    lassen sich frühere einvernehmliche rezeptive Analkontakte aus solchen Befunden nicht zuverlässig ableiten.
  consequences:
  - Invasive forensische Untersuchung von Anus und Rektum
  - Wissenschaftlich nicht tragfähige Rückschlüsse auf wiederholten rezeptiven Analverkehr
  - Potenziell irreführende Sachverständigenbeweise in Strafverfahren
- id: uzbekistan-2017-2026
  polity: Usbekistan
  institutions:
  - Innenministerium der Republik Usbekistan
  - Staatliche rechtsmedizinische Sachverständige
  - Strafgerichte bei Verfahren nach Artikel 120 des Strafgesetzbuchs
  institutionalContext: Ermittlungsbehörden ordnen bei Männern, die nach Artikel 120 wegen einvernehmlicher gleichgeschlechtlicher
    Beziehungen verfolgt werden, forensische Analuntersuchungen an. Die dabei erstellten medizinischen Gutachten
    werden als Beweismittel in Strafverfahren eingebracht; Gerichte stützten sich auf vermeintliche anatomische Zeichen
    wie geglättete radiäre Falten und verminderten Schließmuskeltonus. Berichte über 2025 sowie eine gemeinsame Erklärung
    vom Juni 2026 dokumentieren die Praxis weiterhin vor dem Hintergrund einer verschärften Anwendung von Artikel
    120.
  summary: Usbekische Ermittlungsbehörden ordnen erzwungene Analuntersuchungen an, um vermeintliche Beweise für Strafverfahren
    nach Artikel 120 des Strafgesetzbuchs zu gewinnen. In einem dokumentierten Verfahren von 2021 stützte sich ein
    Taschkenter Gericht unter anderem auf ein rechtsmedizinisches Gutachten, das oberflächliche Verletzungen, geglättete
    radiäre Falten und verminderten Schließmuskeltonus als Hinweise auf Analverkehr wertete. Die Praxis bestand 2025
    fort, als zwei Männer in Taschkent gegen ihren Willen forensischen Analuntersuchungen unterzogen worden sein sollen;
    eine gemeinsame Erklärung mehrerer Organisationen vom Juni 2026 beschreibt unfreiwillige invasive Untersuchungen
    weiterhin als Teil der Durchsetzung von Artikel 120.
  consequences:
  - Erzwungene Analuntersuchungen in Haft
  - Medizinische Gutachten als Beweismittel für einvernehmliche gleichgeschlechtliche Handlungen
  - Strafrechtliche Verurteilungen, Hausarrest und Haft
  - Grausame, erniedrigende und potenziell folterähnliche Behandlung
