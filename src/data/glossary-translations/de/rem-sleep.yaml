locale: de
entryId: rem-sleep
sourceReviewedAt: '2026-08-21'
term: REM-Schlaf
aliases:
- REM
- Rapid-Eye-Movement-Schlaf
shortDefinition: Eine Schlafphase mit schnellen Augenbewegungen, charakteristischer Hirnaktivität und meist stark vermindertem
  Skelettmuskeltonus.
longDefinition: REM-Schlaf ist eine wiederkehrende Schlafphase mit schnellen Augenbewegungen, einem charakteristischen
  Muster der Hirnaktivität und starker Unterdrückung der meisten willkürlichen Muskelaktivität. Besonders häufig werden
  nach dem Aufwachen aus REM lebhafte Träume berichtet, doch Träumen ist nicht auf REM beschränkt.
