schemaVersion: 2
title: Facilitated communication as authentic authored communication
proposition:
  summary: >-
    Institutions treated messages produced through facilitated communication as the authentic communication of people
    with autism or other developmental disabilities and communication impairments, including nonspeaking people, even
    though a facilitator physically supported the person's hand or arm and could unknowingly determine the output.
correction:
  summary: >-
    Facilitated communication is a discredited facilitator-dependent technique. Controlled authorship tests repeatedly
    found that messages tracked information available to facilitators rather than information known only to the disabled
    person. Independent augmentative and alternative communication is different: the problem is attributing authorship
    when message production depends on a facilitator who can influence selection.
category: Special education and communication
reviewedAt: '2026-09-19'
impact:
  summary: >-
    Facilitated communication acquired institutional legitimacy in university training and special education while
    controlled studies were showing that facilitators could unknowingly author the messages. In documented school use,
    facilitated output entered an individual education plan and was used to describe a child's academic abilities.
  highlights:
    - value: '1992'
      label: Syracuse University opened a Facilitated Communication Institute to study and promote the method
    - value: 1992–1993
      label: A New York child's IEP explicitly stated that facilitated communication was required for effective participation
    - value: '2018'
      label: ASHA formally described facilitated communication as discredited and said its output should not be treated as the disabled person's communication
  context:
    - The discredited claim concerns facilitator-dependent authorship, not communication aids in general. Keyboards, letterboards and other AAC systems can support genuine independent communication when authorship is not controlled by another person.
    - False allegations of abuse are among the documented harms of facilitated communication, but those harms should not be attributed wholesale to the Syracuse or Onteora episodes specifically.
    - Syracuse University material from 2020 still documented training and technical support for typers and facilitators. The evidence establishes continuation through 2020, not that every related university activity necessarily ceased in that year.
episodes:
  - id: united-states-syracuse-university-1992-2020
    polity: United States
    region: North America
    startYear: 1992
    endYear: 2020
    periodLabel: 1992–2020 (documented institutional support)
    strength: institutionally-influential
    institutionTypes:
      - university
      - education
    institutions:
      - Syracuse University School of Education
      - Facilitated Communication Institute / Institute for Communication and Inclusion
      - Inclusion and Communication Initiatives
    institutionalContext: >-
      Syracuse University's School of Education opened the Facilitated Communication Institute in 1992 explicitly to study
      and promote communication by people with autism and other developmental disabilities. Its history names the later
      Institute for Communication and Inclusion and the successor Inclusion and Communication Initiatives. The university's
      2020 magazine calls the former institute the Institute on Communication and Inclusion and describes the successor as
      a national and international leader in research and training about typing to communicate, providing training and
      technical support to typers and facilitators. This continued support coexisted with contrary controlled authorship
      evidence. A separate, undated statement by Syracuse's Communication Sciences and Disorders department affirms ASHA's
      position and does not advocate facilitator-dependent methods with ambiguous authorship; it documents disagreement
      within the university, not a dated withdrawal by the School of Education or its institute.
    consequences:
      - A research university created a dedicated institute that gave facilitated communication sustained academic and professional legitimacy
      - The institute and its successors trained and supported facilitators and disseminated the method through research, training and technical assistance
      - Institutional promotion continued after controlled studies in the early 1990s had already demonstrated facilitator control under blinded conditions
      - The university's own history preserves the institute as part of its disability-education legacy
    summary: >-
      Syracuse University gave facilitated communication an unusually durable university home. Its School of Education
      opened the Facilitated Communication Institute in 1992 to study and promote the method, and successor programs
      continued training and support around facilitator-assisted typing for years afterward. This institutional endorsement
      overlapped with a rapidly growing controlled literature: in blinded tests, supposed communicators failed to transmit
      information unavailable to the facilitator, while typed answers often reflected what the facilitator had seen. The
      later professional consensus did not reject the goal of communication access; it rejected treating facilitator-dependent
      output as authored by the disabled person without independent evidence.
    mechanism:
      kind: education
      summary: >-
        Syracuse created a dedicated university institute, trained facilitators, provided technical assistance and promoted
        facilitator-assisted typing through research and professional education.
    institutionalCorrection:
      status: undocumented
      summary: >-
        The cited sources do not establish a corrective act by the School of Education or its
        facilitated-communication institute and successors. The separate Communication Sciences and Disorders
        statement rejects ambiguous authorship but gives no adoption date and does not document a withdrawal by the
        School of Education. The school's own material still described training and support in 2020.
  - id: united-states-onteora-1992-1994
    polity: United States
    region: North America
    startYear: 1991
    endYear: 1994
    periodLabel: 1991–1993/94 (school use and IEP dispute)
    strength: policy-basis
    institutionTypes:
      - education
    institutions:
      - Onteora Central School District
      - The Children's Annex
    institutionalContext: >-
      A 1993 New York State Education Department review documented that the district's 1992–93 IEP stated that a child
      required facilitated communication to participate effectively in his educational program and included a goal to
      improve his facilitated communication skills. Children's Annex reports then used facilitated communication when
      describing receptive vocabulary, reading and mathematics performance. The same review dates the school's first FC
      use to May 1991 and a reference in its 1991–92 IEP to October 1991. The December 1993 decision concerns the 1993–94
      school plan; it does not establish when use ended. Separate controlled research and a later systematic review provide
      scientific context, rather than an authorship finding about this child.
    consequences:
      - Facilitated communication was written into an individual education plan as required for effective participation
      - School reports attributed age-appropriate or seventh-grade abilities to the child when facilitated communication was used
      - The same state review recorded sharply lower performance without facilitation, including receptive vocabulary roughly five years below chronological age and mathematics at a one-to-one correspondence level
      - Facilitator-dependent output therefore affected how the child's abilities and educational program were formally described
    summary: >-
      The Onteora case shows facilitated communication moving beyond advocacy into the machinery of special education.
      The child's 1992–93 IEP expressly said FC was required for effective participation, and school reports credited him
      with much higher academic performance when facilitated. Yet the same record showed dramatic differences when the
      facilitator was removed. The state review did not itself conduct an authorship experiment or ban the method, but its
      documentation provides unusually concrete evidence that facilitator-dependent output was being used in formal
      educational assessment at the same time controlled studies elsewhere were showing facilitator control. For the
      1993–94 plan, the district removed the FC requirement. A hearing officer ordered reassessment without FC, and the
      state reviewer required the plan to report relevant performance with and without facilitation and specify evaluation
      procedures and schedules. Classroom use remained permitted; these were partial safeguards, not a ban on FC.
    mechanism:
      kind: administrative-adoption
      summary: >-
        The district incorporated facilitated communication into an individual education plan, while the Children's Annex
        used facilitator-dependent output in formal school reports describing academic ability.
    institutionalCorrection:
      status: partial
      periodLabel: April–December 1993
      action: The district removed the FC requirement; hearing and state-review decisions ordered reassessment without FC and clearer reporting of performance and evaluation procedures.
      summary: >-
        After the Committee on Special Education (CSE) review in April 1993, the 1993–94 IEP omitted FC references. The
        chair cited research doubts and concern about requiring one method. On 24 September the hearing officer ordered reassessment without FC. On 10 December
        the state reviewer required relevant performance with and without FC and evaluation procedures and schedules in
        the plan. Continued classroom use remained allowed, and the reviewer did not decide FC's validity. The decision
        records orders, not proof that the reassessment was completed or the method repudiated.
