schemaVersion: 2
title: X-ray treatment for ringworm
entryId: medical-xrays-have-no-cumulative-harm
proposition:
  summary: >-
    Scalp X-ray irradiation was treated as an acceptably safe mass treatment for childhood ringworm.
correction:
  summary: >-
    Scalp irradiation induced hair loss as part of treatment for tinea capitis, together with removal of remaining
    hair and topical care. It exposes healthy tissue to ionizing radiation, and childhood exposure increases the
    later risk of brain and nervous-system tumors. Effective antifungal drugs make routine therapeutic irradiation
    for ringworm unnecessary.
category: Medicine and radiation safety
reviewedAt: '2026-09-19'
episodes:
  - id: israel-1949-1960
    polity: Israel
    region: Middle East
    startYear: 1949
    endYear: 1960
    periodLabel: 1949–1960
    strength: policy-basis
    institutionTypes:
      - government
      - medical
      - education
    institutions:
      - Ministry of Health
      - Hadassah Medical Organization
      - General Sick Fund (Kupat Holim Clalit)
      - Shaar HaAliyah Hospital
      - Tel HaShomer Hospital
    institutionalContext: >-
      The Ministry of Health made ringworm reportable in February 1950 and funded treatment; Hadassah was given
      national organizing and professional-supervision responsibility at a December 1949 ministry meeting and issued
      the treatment protocol;
      the General Sick Fund, Shaar HaAliyah Hospital, Tel HaShomer Hospital and other authorized centers delivered
      irradiation and follow-up care. School nurses and local services identified cases and enforced exclusion from
      school during parts of treatment, but those distributed services are described as implementation machinery
      rather than listed as one institution.
    consequences:
      - Mass irradiation of children
      - Treatment required for return to school in parts of the programme
      - Increased long-term risk of brain and nervous-system tumors
    summary: >-
      Israel organized a national campaign in which tens of thousands of children with tinea capitis received scalp
      X-ray irradiation, then a standard treatment. Hadassah's Drukmann reported skin damage from excessive
      irradiation in children previously treated abroad. The Ministry
      of Health funded and regulated the programme, Hadassah supervised its treatment protocol, and a network including
      the General Sick Fund, Shaar HaAliyah and Tel HaShomer delivered irradiation. By 1952 treatment was compulsory
      in parts of the public-health programme, including as a condition for infected children returning to school.
      Irradiation in this programme ended in 1960 as griseofulvin replaced it; long-term Israeli cohort studies later
      demonstrated increased tumor risk after childhood exposure.
    mechanism:
      kind: administrative-adoption
      summary: >-
        The Ministry of Health funded and regulated a national treatment programme, Hadassah supervised the protocol,
        authorized centers delivered irradiation, and school/public-health services helped identify cases and enforce treatment-related exclusion.
    institutionalCorrection:
      status: corrected
      periodLabel: 1960; compensation from 1995
      action: The national programme replaced routine irradiation with griseofulvin; a later law provided compensation for specified radiation injuries.
      summary: >-
        The national programme stopped routine irradiation in 1960 and shifted to griseofulvin. This establishes
        withdrawal of the practice, while the account of that change does not establish a contemporaneous risk-based
        repudiation of the earlier safety judgment. From 1 January 1995, a compensation law provided payments to eligible
        patients or their survivors for specified illnesses following treatment covered by the law in 1946–1960.
        The Ministry of Health determines entitlement and the National Insurance Institute makes payments.
