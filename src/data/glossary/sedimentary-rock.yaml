term: Sedimentary rock
aliases:
- sedimentary rocks
shortDefinition: Rock formed from deposited sediment or from material precipitated from water and later consolidated.
longDefinition: Sedimentary rocks form at or near Earth's surface from accumulated material. Many are produced when fragments
  of older rocks are deposited, buried, compacted, and cemented; others form when dissolved substances precipitate from
  water or through biological processes. Their layered structures often preserve evidence about past environments.
relatedTerms:
- igneous-rock
- metamorphic-rock
- neptunism
reviewedAt: '2026-08-21'
sources:
- title: Chemical compositions of rock types as factors in our environment
  url: https://www.usgs.gov/publications/chemical-compositions-rock-types-factors-our-environment
  publisher: U.S. Geological Survey
  note: Describes sedimentary rocks as forming chiefly through deposition of weathering and erosion products of older
    rocks.
