    target: {scope: belief, aspect: proposition}
    note: >-
      Open-access historical study based on Vienna clinic records. It documents 965 insulin-treatment cases in 1951–1969,
      mostly insulin coma therapy; the expectation of curing early schizophrenia; a 1960 description of full insulin
      shock as the basic treatment; and continuation in Vienna to about 1970.
  - id: insulin-lancet-correction
    sourceId: insulin-lancet-trial
    relation: supports
    target: {scope: belief, aspect: correction}
    note: >-
      Primary 1957 controlled study by Ackner, Harris and Oldham, widely treated as a pivotal experimental test of
      whether insulin coma itself conferred a specific benefit in schizophrenia.
  - id: insulin-ucl-correction
    sourceId: insulin-ucl-history
    relation: supports
    target: {scope: belief, aspect: correction}
    note: >-
      Modern peer-reviewed review explaining that efficacy doubts predated randomized trials and that controlled
      comparisons failed to establish insulin coma as a specific effective treatment.
