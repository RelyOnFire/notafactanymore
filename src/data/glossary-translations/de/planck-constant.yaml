locale: de
entryId: planck-constant
sourceReviewedAt: '2026-08-21'
term: Plancksche Konstante
aliases:
- Planck-Konstante
- h
shortDefinition: Eine fundamentale Konstante der Quantenphysik, die die Energie eines Photons mit seiner Frequenz
  verknüpft.
longDefinition: Die Plancksche Konstante mit dem Symbol h verbindet Energie und Frequenz über die Beziehung E =
  hν. Seit der SI-Neudefinition von 2019 ist ihr Zahlenwert exakt festgelegt, sodass das Kilogramm durch Präzisionsmessungen
  realisiert werden kann statt durch einen bestimmten Referenzkörper definiert zu sein.
