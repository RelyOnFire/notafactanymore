term: Fossil flora
aliases:
- fossil plants
- plant fossils
shortDefinition: Fossil evidence of past plant life, including leaves, wood, pollen, spores, roots, seeds, and other
  preserved plant remains.
longDefinition: 'Fossil flora is the preserved record of plants from past environments. Different plant remains provide
  different kinds of information: leaves and wood can reveal vegetation type, pollen and spores can document plant communities,
  and roots or fossil soils can show that plants grew locally rather than being transported there. Together these remains
  are powerful evidence for reconstructing ancient climates and ecosystems.'
relatedTerms:
- paleoclimate
reviewedAt: '2026-08-21'
sources:
- title: Fossils from the Antarctic
  url: https://www.bas.ac.uk/data/our-data/fossils-from-the-antarctic/
  publisher: British Antarctic Survey
  note: Describes Antarctic fossil plants and other remains that reveal ancient terrestrial ecosystems.
