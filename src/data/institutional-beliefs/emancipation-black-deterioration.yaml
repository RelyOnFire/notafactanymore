evidence:
  - id: emancipation-calhoun-proposition
    sourceId: emancipation-senate-doc-341
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: S. Doc. 341, pp. 50–53, especially pp. 52–53
    note: >-
      Calhoun's official 18 April 1844 letter says states that changed the relation of slavery made Black people's
      condition worse and uses census-derived disability, pauperism, and prison ratios to defend that conclusion. The
      1-in-96 and 1-in-672 comparison on page 52 combines deafness, muteness, blindness, idiocy, and insanity.
  - id: emancipation-census-structure
    sourceId: emancipation-1840-questionnaire
    relation: documents
    target: {scope: belief, aspect: correction}
    locator: Index of Questions, “Free Colored Persons,” “Slaves,” and “Deaf, Dumb, Blind, and Insane Colored Persons”
    note: >-
      The official question index shows separate age-and-sex population columns for free Black people and enslaved
      people, followed by one combined set of disability columns for “colored persons.” It therefore did not directly
      tabulate disability by free or enslaved status.
  - id: emancipation-ray-correction
    sourceId: emancipation-maine-hospital-report
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Superintendent's report, printed pp. 26–28, especially p. 27
    note: >-
      Isaac Ray reports 94 Black insanity cases in Maine and identifies 56 of them in towns that the same census listed
      with no Black inhabitants. He says some listed towns were personally known to contain no such patient and concludes
      that the returns were extremely inaccurate.
  - id: emancipation-jarvis-correction
    sourceId: emancipation-jarvis-1844
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: pp. 74–83, especially pp. 75–78 and 82–83
    note: >-
      Jarvis traces the inflated rates to town-level entries, including 133 white patients at the Worcester state
      hospital placed in the Black column, and lists numerous disability counts where no Black population was recorded.
      He concludes that the published census cannot support claims about Black insanity in the free states.
  - id: emancipation-asa-correction
    sourceId: emancipation-asa-memorial
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: S. Doc. 5, pp. 9–18, especially pp. 9–12 and 17–18
    note: >-
      The memorial compares manuscript returns, printed tables, state inquiries, and local population totals. It
      documents misclassification and internal contradiction, then asks Congress to correct the census or withdraw its
      sanction if correction is impossible.
  - id: emancipation-calhoun-impact
    sourceId: emancipation-senate-doc-341
    relation: documents
    target: {scope: belief, aspect: impact}
    locator: S. Doc. 341, pp. 50–53
    note: >-
      The statistics appear inside Calhoun's reply to the British minister about abolition in Texas and the treaty of
      annexation, establishing their use in official diplomacy rather than only in private commentary.
  - id: emancipation-census-context
    sourceId: emancipation-1840-questionnaire
    relation: contextualizes
    target: {scope: episode, episodeId: united-states-1844-1845, aspect: context}
    locator: “About the 1840 Questionnaires,” “Enumeration,” and “Index of Questions”
    note: >-
      The Census Bureau identifies the form as a two-page federal schedule, describes State Department supervision and
      enumeration by federal marshals, and reproduces the population and disability headings needed to understand how
      the later sectional proxy was constructed.
  - id: emancipation-calhoun-carrier
    sourceId: emancipation-senate-doc-341
    relation: documents
    target: {scope: episode, episodeId: united-states-1844-1845, aspect: carrier}
    locator: S. Doc. 341, pp. 50–53
    note: >-
      The Senate publication identifies the text as a Department of State letter from Calhoun to Pakenham and places the
      census claim within the executive branch's official correspondence over Texas annexation.
  - id: emancipation-calhoun-mechanism
    sourceId: emancipation-senate-doc-341
    relation: documents
    target: {scope: episode, episodeId: united-states-1844-1845, aspect: mechanism}
    locator: S. Doc. 341, pp. 50–53
    note: >-
      The letter shows the mechanism directly: census figures were selected, combined into sectional ratios, assigned a
      causal meaning, and published as the State Department's answer to a foreign government.
  - id: emancipation-calhoun-consequences
    sourceId: emancipation-senate-doc-341
    relation: documents
    target: {scope: episode, episodeId: united-states-1844-1845, aspect: consequences}
    locator: S. Doc. 341, pp. 50–53
    note: >-
      Calhoun placed the statistical claim inside the argument that British antislavery policy in Texas endangered the
      United States and that annexation was an act of federal self-defense, documenting its immediate policy use.
  - id: emancipation-ray-episode-correction
    sourceId: emancipation-maine-hospital-report
    relation: documents
    target: {scope: episode, episodeId: united-states-1844-1845, aspect: institutional-correction}
    locator: Superintendent's report, printed pp. 26–28
    note: >-
      A state institution's own superintendent publicly challenged the federal returns in 1844 and supplied the exact
      Maine audit behind the card's 56-of-94 figure.
  - id: emancipation-house-reports-correction
    sourceId: emancipation-house-reports-catalogue
    relation: documents
    target: {scope: episode, episodeId: united-states-1844-1845, aspect: institutional-correction}
    locator: Catalogue p. 498, entries for House Reports 579 and 580
    note: >-
      The official catalogue prevents two same-day reports from being conflated: Report 579 concerned Thomas Earle's
      petition and said the alleged errors had not been ascertained, while Report 580 concerned the Statistical
      Association's memorial and described the census as inaccurate.
  - id: emancipation-history-context
    sourceId: emancipation-census-history
    relation: contextualizes
    target: {scope: episode, episodeId: united-states-1844-1845, aspect: context}
    locator: Section “Paper, Pencil, and the Early Census,” paragraphs on the 1840 error and 1850 redesign
    note: >-
      This peer-reviewed institutional history connects the eighty-column 1840 form to column-placement errors, recounts
      Jarvis's audit and Calhoun's refusal to change the results, and explains the Census Board and individual-level
      redesign adopted for 1850.
  - id: emancipation-1854-aftermath
    sourceId: emancipation-1850-statistical-view
    relation: documents
    target: {scope: episode, episodeId: united-states-1844-1845, aspect: context}
    locator: “Free Colored Population,” printed pp. 75–78, especially pp. 76–77
    note: >-
      The 1854 federal compendium revisits the objections, reproduces the State Department's “unimpeachable” defense,
      concedes that the 1830 and 1840 northern ratios probably suffered from error, and nevertheless calculates fresh
      sectional disability ratios from the 1850 returns. It is evidence of an unresolved official aftermath, not a
      direct retraction or a new causal test.
  - id: emancipation-jarvis-episode-correction
    sourceId: emancipation-jarvis-1844
    relation: documents
    target: {scope: episode, episodeId: united-states-1844-1845, aspect: institutional-correction}
    locator: pp. 75–83
    note: >-
      The contemporary journal article supplies a reproducible town-by-town challenge to the census and identifies a
      concrete mechanism—white cases entered in Black columns—for part of the sectional disparity.
  - id: emancipation-asa-memorial-action
    sourceId: emancipation-asa-memorial
    relation: documents
    target: {scope: episode, episodeId: united-states-1844-1845, aspect: institutional-correction}
    locator: S. Doc. 5, pp. 9–18
    note: >-
      The Statistical Association formally carried the documented errors to Congress and requested correction or
      disavowal, turning external criticism into an institutional review question.
  - id: emancipation-senate-response
    sourceId: emancipation-senate-report-146
    relation: documents
    target: {scope: episode, episodeId: united-states-1844-1845, aspect: institutional-correction}
    locator: S. Rep. 146, pp. 1–2
    note: >-
      The Joint Committee on the Library found the memorial's criticisms generally correct and the census errors
      capable of destroying confidence. It recommended safeguards for 1850 but declined revision, formal withdrawal of
      Congress's sanction, and further consideration of the memorial.
  - id: emancipation-state-department-defense
    sourceId: emancipation-state-department-116
    relation: documents
    target: {scope: episode, episodeId: united-states-1844-1845, aspect: carrier}
    locator: H. Doc. 116, pp. 1–4, especially pp. 2–3
    note: >-
      Calhoun's February 1845 transmittal identifies Weaver's departmental review, says the sectional disability result
      stands unimpeached, and concludes that changing slavery's racial relation would be a curse rather than a blessing
      for Black people.
  - id: emancipation-state-department-resistance
    sourceId: emancipation-state-department-116
    relation: documents
    target: {scope: episode, episodeId: united-states-1844-1845, aspect: institutional-correction}
    locator: H. Doc. 116, pp. 1–4; Weaver report, pp. 4–30
    note: >-
      The document also marks the limit of correction inside the adopting institution: Weaver rejects the House
      committee's conclusion, treats most objections as mistaken or immaterial, and defends the census's general result.
  - id: emancipation-history-redesign
    sourceId: emancipation-census-history
    relation: documents
    target: {scope: episode, episodeId: united-states-1844-1845, aspect: institutional-correction}
    locator: Section “The Tabulation Bottleneck, 1850–1880,” opening paragraphs
    note: >-
      The article documents Congress's 1849 Census Board and the 1850 shift from an eighty-column household summary to
      individual rows and separate schedules, a procedural response that prevented recurrence without a general revision
      of the 1840 publication.
