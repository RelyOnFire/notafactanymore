term: Transmutation
aliases:
- elemental transmutation
- metallic transmutation
shortDefinition: The conversion of one chemical element into another; in modern physics this requires changing an atomic
  nucleus.
longDefinition: Transmutation means changing one element into another. Alchemists used the idea in theories about converting
  base metals into gold through ordinary laboratory operations. Modern chemistry shows that chemical reactions only rearrange
  electrons and bonds; changing an element requires changing the number of protons in its nucleus through a nuclear process.
relatedTerms:
- alchemy
reviewedAt: '2026-08-21'
sources:
- title: 'Transmutation of Base Metals into Gold: A Solution to the Essential Mystery of Alchemy'
  url: https://www.tandfonline.com/doi/abs/10.1179/isr.1992.17.4.326
  publisher: Interdisciplinary Science Reviews
  note: Reviews the historical concept of metallic transmutation and its relationship to alchemical practice.
