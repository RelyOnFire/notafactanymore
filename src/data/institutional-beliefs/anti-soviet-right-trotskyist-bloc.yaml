evidence:
  - id: right-trotskyist-docs-proposition
    sourceId: right-trotskyist-docs
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: 'Document no. 1, indictment, printed pp. 21–45; verdict, printed pp. 731–737'
    note: >-
      The indictment and verdict record the Soviet institutions' allegations of a bloc engaged in espionage, sabotage,
      terrorism, treason, preparation of foreign intervention and partition of Soviet territory. This evidence documents
      what the institutions asserted; it does not validate the accusations.
  - id: right-trotskyist-resolution-correction
    sourceId: right-trotskyist-1988-resolution
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Printed pp. 114–121, especially pp. 116–120
    note: >-
      The Procurator General's protest finds no reliable corroboration for foreign-intelligence links, criminal groups,
      sabotage or terrorism, describes falsified records and coercion, and requests termination of proceedings against ten
      defendants. The Supreme Court disposition names those defendants and terminates the proceedings against them for
      absence of a criminal offence.
  - id: right-trotskyist-docs-correction-history
    sourceId: right-trotskyist-docs
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Editors' introduction, printed pp. 18–19
    note: >-
      The introduction reports the 1956 KGB finding that the alleged bloc and organised anti-Soviet activity were
      fabricated. It lists ten individual rehabilitations before 1988 and the ten defendants cleared in 1988. It says no
      protest was filed for Yagoda but supplies no reason for that omission.
  - id: right-trotskyist-docs-impact
    sourceId: right-trotskyist-docs
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: Editors' introduction, printed pp. 4–20; verdict, printed pp. 731–737
    note: >-
      The introduction documents publication, organised press reception, the Short Course and staged rehabilitation. The
      verdict records 21 defendants, 18 death sentences and the three prison terms of 25, 20 and 15 years.
  - id: right-trotskyist-docs-carrier
    sourceId: right-trotskyist-docs
    relation: documents
    target: {scope: episode, episodeId: soviet-union-1938-1988, aspect: carrier}
    locator: 'Indictment, printed pp. 21–45; editors’ introduction, printed pp. 19–20; verdict, printed pp. 731–737'
    note: >-
      The indictment bears Vyshinsky's authorship and Stalin's annotations, the transcript went to the party leadership
      for prepublication editing, and the Military Collegium issued the verdict. Together these passages identify the
      party, Procuracy and court as carriers; the trial record identifies the NKVD investigation behind the case.
  - id: right-trotskyist-docs-mechanism
    sourceId: right-trotskyist-docs
    relation: documents
    target: {scope: episode, episodeId: soviet-union-1938-1988, aspect: mechanism}
    locator: Editors' introduction, printed pp. 19–20; indictment, printed pp. 21–45; verdict, printed pp. 731–737
    note: >-
      These sections document party editing before publication and the conversion of the Procuracy's allegations into the
      Military Collegium's sentences. The source supports the institutional path from investigation and accusation to
      judgment and public dissemination.
  - id: right-trotskyist-resolution-mechanism
    sourceId: right-trotskyist-1988-resolution
    relation: supports
    target: {scope: episode, episodeId: soviet-union-1938-1988, aspect: mechanism}
    locator: Printed pp. 114–120, especially pp. 118–119
    note: >-
      The protest documents suppressed initial denials, prewritten and altered interrogation records, threats, deception,
      violence and uncorroborated admissions in the ten reviewed cases. Its scope is not extended to every defendant.
  - id: right-trotskyist-docs-sentences
    sourceId: right-trotskyist-docs
    relation: documents
    target: {scope: episode, episodeId: soviet-union-1938-1988, aspect: consequences}
    locator: Verdict, printed pp. 735–737; RGASPI f. 17, op. 171, d. 402, ll. 701–708
    note: >-
      The verdict supports the first two consequences: 18 death sentences and prison terms of 25 years for Pletnev, 20
      years for Rakovsky and 15 years for Bessonov.
  - id: right-trotskyist-docs-propaganda
    sourceId: right-trotskyist-docs
    relation: supports
    target: {scope: episode, episodeId: soviet-union-1938-1988, aspect: consequences}
    locator: Editors' introduction, printed pp. 12–18
    note: >-
      The editors describe extensive newspaper treatment, collective readings and meetings, and explain how the October
      1938 Short Course made the Moscow-trial account mandatory official history into the mid-1950s. This supports the
      third and fifth consequences.
  - id: right-trotskyist-resolution-coercion
    sourceId: right-trotskyist-1988-resolution
    relation: supports
    target: {scope: episode, episodeId: soviet-union-1938-1988, aspect: consequences}
    locator: Printed pp. 118–119
    note: >-
      The protest supports the fourth consequence for the reviewed cases by documenting falsified procedural records and
      statements produced through threats, violence and deception.
  - id: right-trotskyist-docs-rehabilitation
    sourceId: right-trotskyist-docs
    relation: supports
    target: {scope: episode, episodeId: soviet-union-1938-1988, aspect: consequences}
    locator: Editors' introduction, printed pp. 18–19
    note: >-
      The introduction names ten defendants rehabilitated in stages before 1988 and ten more rehabilitated on 4 February
      1988, supporting the final consequence without collapsing the corrections into one event.
  - id: right-trotskyist-resolution-institutional-correction
    sourceId: right-trotskyist-1988-resolution
    relation: documents
    target: {scope: episode, episodeId: soviet-union-1938-1988, aspect: institutional-correction}
    locator: Printed pp. 114–121, especially p. 120 and the facsimile on p. 121
    note: >-
      The published disposition names the ten defendants covered on 4 February 1988, vacates their 1938 convictions and
      terminates their cases for absence of a criminal offence. It supports the final stage, not the ten earlier
      rehabilitations.
  - id: right-trotskyist-report-context
    sourceId: right-trotskyist-judicial-report
    relation: contextualizes
    target: {scope: episode, episodeId: soviet-union-1938-1988, aspect: context}
    locator: Catalog description and bibliographic record
    note: >-
      The Presidential Library catalog identifies the official 1938 Soviet judicial report, its issuing court, publication
      place and the 21 defendants. The catalog metadata is used only for bibliographic context, not for detailed claims
      about the prosecution or correction.
  - id: right-trotskyist-bukharin-context
    sourceId: right-trotskyist-bukharin
    relation: contextualizes
    target: {scope: episode, episodeId: soviet-union-1938-1988, aspect: context}
    locator: Biography paragraph beginning with Bukharin's February 1937 arrest
    note: >-
      The scholarly reference records Bukharin's 1938 conviction and his rehabilitation by the USSR Supreme Court Plenum
      on 4 February 1988. It corroborates Bukharin's chronology only, not the treatment of all 21 defendants.
