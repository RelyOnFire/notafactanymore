title: Caste as racial ancestry
claim: Caste rank was treated as reflecting measurable racial ancestry, with bodily measurements such as the nasal index used
  to classify Indians into racial types.
currentUnderstanding: Caste is a historical and social system, not a biological hierarchy of races. Long-term endogamy has
  produced some genetic structure among South Asian populations, but skull or nasal measurements do not define discrete human
  races and do not validate caste rank as a measure of biological ancestry or human worth.
category: Race and anthropology
reviewedAt: '2026-08-23'
