  - Hungarian political-prosecution and people's-court apparatus
  institutionalContext: >-
    Rajk was arrested on 30 May 1949 on fabricated espionage accusations. The party leadership and state-security
    apparatus constructed a case that increasingly centered on an alleged imperialist-Titoist network. Confessions and
    trial narratives were prepared to fit the political conception, and the principal public trial was used for
    extensive propaganda. Rajk, Tibor Szőnyi and András Szalai were sentenced to death and executed in October 1949,
    while connected proceedings multiplied around the supposed conspiracy. De-Stalinization brought formal reviews in
    1955–1956. Hungarian archival records list Rajk as rehabilitated in 1956; his 6 October reburial became a public
    repudiation of the terror associated with the earlier show trial.
  consequences:
  - Execution and imprisonment of defendants on constructed political charges
  - Expansion of the supposed conspiracy into scores of connected prosecutions and internments
  - Use of the trial to legitimize anti-Tito and anti-imperialist purges inside the Hungarian communist system
  - Public propaganda presenting scripted confessions and allegations as proof of a hidden enemy network
  - Destruction of careers and families, including imprisonment and surveillance of people connected to defendants
  - A politically explosive rehabilitation and reburial in 1956 that exposed the earlier case as an instrument of repression
  summary: >-
    The Rajk affair shows how a fabricated conspiracy could become a reusable institutional object. Party and security
    officials converted invented espionage allegations into a public show trial, then extended the supposed network into
    many additional proceedings. A later Interior Ministry review counted 155 people proceeded against in the Rajk
    affair, including 97 convictions, 50 internments and 15 executions. De-Stalinization reversed the official judgment:
    Rajk was rehabilitated in 1956, and his reburial became a mass demonstration against the system that had condemned him.
  sources:
