    relation: documents
    target: {scope: episode, episodeId: britain-phrenological-societies-1820-1870, aspect: mechanism}
    note: >-
      Explains that phrenological societies collected busts and made death masks in an attempt to prove the theory, and
      that the Edinburgh collection was displayed in the society's own museum.
  - id: phrenology-societies-consequences
    sourceId: bjhs-combe
    relation: supports
    target: {scope: episode, episodeId: britain-phrenological-societies-1820-1870, aspect: consequences}
    note: >-
      Shows that society founder George Combe used phrenology in a highly influential program of heredity, education and
      universal human progress, disseminated especially through The Constitution of Man.
  - id: phrenology-alienists-context
    sourceId: medical-history-alienists
    relation: contextualizes
    target: {scope: episode, episodeId: britain-phrenological-societies-1820-1870, aspect: consequences}
    note: >-
      Historical study documents adoption of phrenological concepts by some British alienists between about 1825 and
      1845 while distinguishing partial conceptual borrowing from complete acceptance of cranial organology.
  - id: phrenology-societies-correction
    sourceId: ulster-cardinal
    relation: supports
    target: {scope: episode, episodeId: britain-phrenological-societies-1820-1870, aspect: institutional-correction}
    note: >-
      Describes the 1842 materialist schism and the ensuing collapse of institutional ambition, followed by the terminal
      decline of scientific phrenology in Britain by about 1850; it does not document a formal society retraction.
