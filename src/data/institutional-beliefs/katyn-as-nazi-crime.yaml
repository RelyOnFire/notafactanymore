evidence:
  - id: katyn-echr-proposition
    sourceId: katyn-echr
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: 'Facts §§ 15–16 and 32 (printed pp. 4, 6)'
    note: >-
      The Court's factual summary records the Soviet German-guilt claim, the Burdenko report, the Soviet prosecution's
      Nuremberg allegation and the 1990 official communiqué identifying direct NKVD responsibility. It documents the
      Soviet portion of the proposition rather than the Polish enforcement described in the second evidence edge.
  - id: katyn-ipn-lie-proposition
    sourceId: katyn-ipn-lie
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: 'Paragraphs beginning “The document of 24 January 1944,” “The Katyn lie, in a narrow sense” and “Poles were the key and natural goal”'
    note: >-
      The institutional history follows the official Soviet version from the Burdenko communiqué through its propagation
      in the USSR and the Polish People's Republic, where communist institutions adopted and enforced the account.
  - id: katyn-decision-correction
    sourceId: katyn-1940-decision
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: 'Archival transcription, pp. 1 and 3–4, especially the execution proposal and approval signatures'
    note: >-
      The archival transcription records Lavrentiy Beria's proposal, the special procedure and execution by shooting,
      and Politburo approval signed by Stalin and other senior Soviet leaders.
  - id: katyn-echr-correction
    sourceId: katyn-echr
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: 'Facts §§ 10–13 and 32 (printed pp. 3–4, 6)'
    note: >-
      The judicial summary records the March 1940 Politburo decision, the April–May NKVD killings, Shelepin's total of
      21,857 with 4,421 at Katyn Forest, and the official Soviet communiqué of 13 April 1990.
  - id: katyn-echr-impact
    sourceId: katyn-echr
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: 'Facts §§ 13–18 and 32 (printed pp. 3–4, 6)'
    note: >-
      The Court's summary supplies the 21,857 total and 4,421 Katyn Forest figure from Shelepin's memorandum, the Soviet
      German-guilt claim, Burdenko report, Nuremberg allegation, secrecy of the 1940 records and recommendation to destroy
      victims' files, followed by the 1990 admission.
  - id: katyn-nara-impact-context
    sourceId: katyn-us-archives
    relation: contextualizes
    target: {scope: belief, aspect: impact}
    locator: '“Summary of Events,” paragraphs on the 1943 exhumation, the Soviet enquiry and the Madden Committee'
    note: >-
      The official archival overview describes the German-organized international medical commission, its conclusion
      that the deaths occurred in 1940, the use of that evidence as German propaganda and the later unanimous US
      congressional finding of NKVD responsibility.
  - id: katyn-soviet-information-carrier
    sourceId: katyn-ipn-1943
    relation: documents
    target: {scope: episode, episodeId: soviet-union-1943-1990, aspect: carrier}
    locator: 'Chronology entry “15 IV 1943 r. — Moskwa”'
    note: >-
      The official chronology dates the Soviet Information Bureau communiqué responding to the Katyn revelations as
      “Goebbels slanders” to 15 April 1943, directly establishing that named information organ as an initial carrier.
  - id: katyn-soviet-echr-carrier
    sourceId: katyn-echr
    relation: documents
    target: {scope: episode, episodeId: soviet-union-1943-1990, aspect: carrier}
    locator: 'Facts §§ 15–16 (printed p. 4)'
    note: >-
      The judicial summary identifies Soviet authorities, the NKVD-created commission chaired by Burdenko and the Soviet
      prosecutor who relied on its report at Nuremberg. It supports those carriers without treating every Soviet body as
      interchangeable.
  - id: katyn-soviet-party-carrier
    sourceId: katyn-ipn-lie
    relation: documents
    target: {scope: episode, episodeId: soviet-union-1943-1990, aspect: carrier}
    locator: 'Paragraphs beginning “Over three months after Burdenko’s initiative,” “In Nuremberg” and “On 15 April 1971”'
    note: >-
      The IPN history attributes appointment of the Burdenko Commission to the Extraordinary State Commission, records
      Politburo approval, describes party and state authorization of the Nuremberg allegation, and documents a 1971
      Politburo decision defending the German-guilt version. This is why the carrier list uses those precise bodies and
      removes the unsupported Council of People's Commissars label.
  - id: katyn-soviet-mechanism
    sourceId: katyn-echr
    relation: documents
    target: {scope: episode, episodeId: soviet-union-1943-1990, aspect: mechanism}
    locator: 'Facts §§ 15–18 (printed p. 4)'
    note: >-
      The Court's summary documents the sequence of official counterclaim, NKVD-created commission, published 1944
      finding, prosecutorial use at Nuremberg and continued restriction of the contradictory records.
  - id: katyn-soviet-ipn-mechanism
    sourceId: katyn-ipn-lie
    relation: documents
    target: {scope: episode, episodeId: soviet-union-1943-1990, aspect: mechanism}
    locator: 'Paragraphs beginning “The Communication,” “After the German revelation” and “The publication in early 1944”'
    note: >-
      The institutional history distinguishes the security-service preparation of the account from the Burdenko
      communiqué intended for public use and traces its subsequent publication and propaganda circulation.
  - id: katyn-soviet-consequences
    sourceId: katyn-echr
    relation: supports
    target: {scope: episode, episodeId: soviet-union-1943-1990, aspect: consequences}
    locator: 'Facts §§ 15–18 (printed p. 4)'
    note: >-
      These paragraphs support each listed Soviet consequence: blame assigned to Germany, the Burdenko finding, its use
      at Nuremberg, restricted access to “package no. 1,” and Shelepin's recommendation to destroy 21,857 personal files.
  - id: katyn-soviet-correction
    sourceId: katyn-ipn-1990
