      - Distortion of linguistic research
      - Political control over academic careers
    summary: From about 1930, Nikolai Marr's “New Theory of Language” became the officially recognized framework dominating Soviet linguistics. Traditional comparative and Indo-European linguistics were attacked as bourgeois, and substantial deviations from Marrist foundations were severely suppressed. In 1950 Stalin abruptly repudiated Marrism, after which the doctrine was dismantled just as administratively as it had been elevated.
