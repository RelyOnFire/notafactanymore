term: Suppuration
aliases:
- suppurative
- pus formation
shortDefinition: The formation or discharge of pus, usually as part of an inflammatory response to infection or tissue
  damage.
longDefinition: Suppuration is the production of pus, a fluid containing immune cells, tissue debris, microorganisms,
  and proteins. Historically, some surgical traditions treated certain kinds of pus as a favorable or even necessary
  stage of wound healing. Germ theory and antiseptic practice reframed suppuration as something to prevent or control
  when it reflects infection.
