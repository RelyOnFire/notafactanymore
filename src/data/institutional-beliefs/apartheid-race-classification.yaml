evidence:
  - id: apartheid-act-proposition
    sourceId: apartheid-population-act
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: 'Sections 1–7 and 13–15; printed Government Gazette pp. 277–291'
    note: >-
      The primary statute defines its original categories, creates and populates the register, requires the Director to
      classify every registered person, assigns identity numbers and records classifications in the register and identity
      cards. It documents the state claim that officials could determine and record each person's category.
  - id: apartheid-reclassification-proposition
    sourceId: apartheid-reclassification-study
    relation: supports
    target: {scope: belief, aspect: proposition}
    locator: Printed pp. 450–452
    note: >-
      The study identifies appearance, descent and acceptance as the three statutory criteria considered across 69 Supreme
      Court cases and shows how classifiers, the Race Classification Appeal Board and courts operationalised them.
  - id: apartheid-aaba-correction
    sourceId: apartheid-aaba
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: '“Executive Summary”, paragraphs 1–5; “What race is and what it is not”, paragraphs 1–6'
    note: >-
      The professional statement explains that socially recognised racial categories do not describe discrete, isolated,
      fixed or homogeneous biological groups while racism and institutions make race socially and biologically consequential.
  - id: apartheid-reclassification-correction
    sourceId: apartheid-reclassification-study
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Printed pp. 450–452
    note: >-
      The analysis finds all three criteria ambiguous, complex and contested, records conflicting board and court
      interpretations, and concludes that no single concrete working definition of race existed in the system.
  - id: apartheid-repeal-belief-correction
    sourceId: apartheid-repeal
    relation: documents
    target: {scope: belief, aspect: correction}
    locator: 'Government landing page, “Commencement”; Act section 1(1)–(3), Schedules I–II; Gazette pp. 2–8'
    note: >-
      The Act repeals the Population Registration Act and specified related provisions. Its savings clause preserves the
      existing Identification Act register temporarily, so the correction is framed as dismantling compulsory
      classification machinery rather than immediate deletion of every record or racial distinction.
  - id: apartheid-trc-impact
    sourceId: apartheid-trc
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: 'Volume 1, chapter 2, subsection 3, paragraphs 26–29'
    note: >-
      The Commission calls population registration the bedrock of apartheid, describes the operational four-category
      definitions as bizarre, crude and hopelessly imprecise, and links classification to residence, work and family division.
  - id: apartheid-kronos-impact
    sourceId: apartheid-kronos
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: Printed pp. 225–231
    note: >-
      Breckenridge describes the register as apartheid's bureaucratic cornerstone, distinguishes four later operational
      categories, documents identity cards and examinations, and traces the shift from acceptance and appearance toward
      bureaucratically recorded descent.
  - id: apartheid-act-carrier
    sourceId: apartheid-population-act
