evidence:
  - id: sun-maarif-proposition
    sourceId: sun-maarif-encyclopedia
    relation: documents
    target: {scope: belief, aspect: proposition}
    note: >-
      Documents the theory's claim that Turkish was the mother of all languages and traces its development from Kvergić's
      1935 manuscript through Atatürk's instruction to language reformers.
  - id: sun-cambridge-correction
    sourceId: sun-cambridge-turkish
    relation: supports
    target: {scope: belief, aspect: correction}
    note: Identifies modern Turkish as a member of the Southwestern, or Oghuz, branch of the Turkic language family.
  - id: sun-bls-method-correction
    sourceId: sun-bls-comparative-method
    relation: supports
    target: {scope: belief, aspect: correction}
    note: >-
      Explains that lexical resemblance alone is insufficient for demonstrating descent and that the comparative method
      depends on regular sound correspondences across morphological systems.
  - id: sun-ataturk-context
    sourceId: sun-ataturk-encyclopedia
    relation: contextualizes
    target: {scope: episode, episodeId: turkey-1935-1938, aspect: context}
    note: Describes the theory, Atatürk's support, its political rather than scientific basis, and its treatment at the Third Turkish Language Congress.
