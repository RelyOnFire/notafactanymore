locale: de
entryId: dark-energy
sourceReviewedAt: '2026-08-21'
term: Dunkle Energie
aliases: []
shortDefinition: Die Bezeichnung für die Ursache der beobachteten beschleunigten Expansion des Universums im kosmologischen
  Standardmodell.
longDefinition: Dunkle Energie ist die Bezeichnung für die Komponente des kosmologischen Standardmodells, die mit der
  beschleunigten Expansion des Universums verbunden ist. Im einfachsten Modell verhält sie sich wie eine kosmologische
  Konstante mit nahezu gleichmäßiger Energiedichte im Raum. Ihre physikalische Natur ist unbekannt, und der Begriff bezeichnet
  keine Form von Dunkler Materie.
