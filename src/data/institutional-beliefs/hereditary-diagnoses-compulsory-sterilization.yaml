evidence:
  - id: sterilization-law-proposition
    sourceId: sterilization-1933-law
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: § 1
    note: >-
      The primary law sets eight named conditions plus chronic alcoholism as statutory categories and states the
      claimed high-probability test concerning serious hereditary defects in descendants.
  - id: sterilization-bundestag-proposition
    sourceId: sterilization-bundestag-1998
    relation: supports
    target: {scope: belief, aspect: proposition}
    locator: Printed pp. 3–4, section 2(a)
    note: >-
      The official legislative history reproduces the statutory hereditary forecast, lists the categories and explains
      how the broad diagnoses were used in sterilization decisions.
  - id: sterilization-schizophrenia-correction
    sourceId: sterilization-nimh-schizophrenia
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Section “What causes schizophrenia?”, subsections “Genes” and “Environment”
    note: >-
      Explains that many genes may increase schizophrenia risk, no single gene causes the disorder by itself and
      environmental and life-experience factors may also contribute.
  - id: sterilization-bipolar-correction
    sourceId: sterilization-nimh-bipolar
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Section “What causes bipolar disorder?”, subsection “Genetics”
    note: >-
      Explains that many genes are involved, no one gene causes bipolar disorder and family risk does not mean every
      relative develops it; trauma and other stressful events may also contribute.
  - id: sterilization-huntington-context
    sourceId: sterilization-huntington
    relation: contextualizes
    target: {scope: belief, aspect: correction}
    locator: Sections “Causes” and “Inheritance”
    note: >-
      Establishes the necessary counterexample to an overbroad correction: Huntington disease involves the HTT gene
      and is inherited in an autosomal-dominant pattern, with penetrance varying at some repeat lengths.
  - id: sterilization-ushmm-correction
    sourceId: sterilization-ushmm
    relation: contextualizes
    target: {scope: belief, aspect: correction}
    locator: 'Introductory text and sections “Forced Sterilization: A Tool of Eugenics” and “The Nazi Hereditary Health Law”'
    note: >-
      Documents the discredited eugenic premise, the expansive use of “congenital feeblemindedness” for social
      judgments and alleged testing, and the present international-law treatment of forced sterilization.
  - id: sterilization-ushmm-impact
    sourceId: sterilization-ushmm
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: Sections “The Nazi Hereditary Health Law” and “Special Hereditary Health Courts”
    note: >-
      Gives the nine categories, identifies the medical and judicial machinery, estimates about 400,000 forced
      sterilizations under the law and reports that hundreds of people, mostly women, died from the operations.
  - id: sterilization-bundestag-impact
    sourceId: sterilization-bundestag-1998
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: Printed pp. 3–4, sections 1 and 2(a)
    note: >-
      Gives an estimate of about 350,000 sterilizations from 1934 through 1945, quotes the Bundestag's 1988
      condemnation and describes the law's diagnosis-driven operation.
  - id: sterilization-law-carrier
    sourceId: sterilization-1933-law
    relation: documents
    target: {scope: episode, episodeId: nazi-germany-1934-1945, aspect: carrier}
    locator: §§ 3, 5–6 and signatures
    note: >-
      The law assigns applications to state physicians and institution heads, decisions to special courts composed of
      a judge and two physicians, and bears the signatures of the Reich ministers of the Interior and Justice.
  - id: sterilization-ushmm-carrier
    sourceId: sterilization-ushmm
