term: Oscillation mode
aliases:
- oscillation modes
- normal mode
- normal modes
shortDefinition: A characteristic pattern and frequency at which a physical system can naturally vibrate.
longDefinition: A planet can support many normal or oscillation modes, each with its own spatial pattern and natural
  frequency. Their frequencies depend on the planet's internal structure. As a giant planet evolves, slowly changing
  mode frequencies can interact resonantly with orbiting moons and influence tidal migration.
relatedTerms:
- resonance-locking
reviewedAt: '2026-08-21'
sources:
- title: Resonance locking in giant planets indicated by the rapid orbital expansion of Titan
  url: https://doi.org/10.1038/s41550-020-1120-5
  publisher: Nature Astronomy
  note: Discusses evolving internal oscillation modes of Saturn in the resonance-locking model.
