schemaVersion: 2
title: Every South African as assignable to a definite racial group
proposition:
  summary: >-
    South Africa's apartheid state treated every person's race or population group as a determinate personal fact that
    officials could classify and record using appearance, descent, social acceptance and reputation, and then used that
    official classification to allocate legal rights, restrictions and life opportunities.
correction:
  summary: >-
    The apartheid categories were legal and social constructions, not discrete biological divisions of humanity. The
    statutory criteria were ambiguous and changed over time: appearance, descent and social acceptance could conflict,
    classifications could be challenged or altered, and members of one family could be classified differently. Biological
    anthropology likewise finds that socially recognised races do not map onto discrete, fixed or homogeneous biological
    groups. Act 114 of 1991 repealed the Population Registration Act and specified related provisions, ending that
    compulsory classification machinery, while temporarily preserving the existing Identification Act register. Race
    remains socially consequential because institutions and racism give categories real effects, not because apartheid
    officials discovered natural biological boundaries.
category: Apartheid, racial classification and state administration
reviewedAt: '2026-09-20'
impact:
  summary: >-
    The Population Registration Act of 1950 made racial classification an administrative foundation of apartheid. Its
    original text required the Director of Census to classify everyone in the register as white, coloured or native; the
    later operational system separated Indian from Coloured and used four basic categories. Identity numbers, cards and a
    bureaucracy of census and Interior officials made those classifications portable through the state. The Truth and
    Reconciliation Commission called population registration the bedrock of apartheid and linked classification to where
    people could live and work and to divisions within families. Historical research documents humiliating examinations,
    contested classifications and a later shift toward descent derived from official records. Act 114 repealed the
    classification statute on 28 June 1991, subject to a transitional savings clause for the existing register.
  highlights:
    - value: 41 years
      label: from the Population Registration Act in 1950 to its repeal in 1991
    - value: '3'
      label: 'headline classifications in the original 1950 Act: white, coloured and native'
    - value: '4'
      label: 'basic categories in the later operational system: Coloured, Indian, White and Black'
    - value: 28 June 1991
      label: commencement of Act 114; the existing Identification Act register was temporarily preserved
  context:
    - >-
      The original Act's three headline classifications and the later administration's four basic categories describe
      different stages. The later system treated Indian as a category separate from Coloured; neither count should be
      projected unchanged across the entire 1950–1991 period.
    - >-
      The statute did not rely only on genetics or a single physical test. It combined appearance and social acceptance,
      later amendments and practice gave greater weight to descent, and objections and appeals repeatedly exposed the
      criteria's ambiguity.
    - >-
      Act 114 repealed the Population Registration Act and altered the laws listed in its two schedules. It did not claim
      to remove every racial distinction from South African law on that date, and section 1(3) temporarily kept the
      existing Identification Act population register in force.
episodes:
  - id: south-africa-1950-1991
    polity: South Africa
    region: Southern Africa
    startYear: 1950
    endYear: 1991
    periodLabel: '1950 Population Registration Act–1991 repeal'
    strength: enforced-doctrine
    institutionTypes:
      - government
      - court
    institutions:
      - Director of Census and population-registration officials
      - Department of the Interior and Bureau of Census
      - Minister-constituted classification boards, later attested as the Race Classification Appeal Board
      - Provincial and local divisions, and Appellate Division, of the Supreme Court of South Africa
    institutionalContext: >-
      Sections 2, 4 and 5 of Act 30 of 1950 created a population register, defined who belonged in it and directed the
      Director of Census to classify everyone registered. Sections 6, 7 and 13 tied classifications to identity numbers,
      register entries and identity cards. Under section 11, written objections went to a board of at least three people
      constituted by the Minister. A person contesting the board's decision could apply to a provincial or local division
      of the Supreme Court and then appeal to its Appellate Division. In later administration, the Department of the
      Interior and Bureau of Census used census forms, photographs, examinations and existing family records; from 1967
      the system increasingly treated descent recorded in state paperwork as determinative.
    consequences:
      - Racial classifications were entered in the population register and linked to identity numbers and identity documents
      - Population registration supplied classifications used by residence controls, work controls and the pass system
      - Officials subjected many people with disputed classifications to humiliating examinations and life-altering decisions
      - Written objections, classification-board hearings, court appeals and administrative alterations could revise an official classification
      - Members of the same family could receive different classifications, producing legal and social separation
      - Census and Interior bureaucracies maintained, contested and revised racial identity as an official state record
    summary: >-
      The Population Registration Act made a disputed social classification appear administratively ascertainable. The
      state required people to be sorted and documented through racial categories, even though the criteria shifted and
      generated examinations, objections, appeals, reclassifications and family divisions. The original three headline
      classifications became four basic operational categories. The TRC later described the definitions as bizarre, crude
      and hopelessly imprecise; biological anthropology rejects socially recognised races as discrete biological groups.
    mechanism:
      kind: classification
      summary: >-
        Census and Interior officials assigned racial identities and recorded them in population registers, identity
        numbers and documents. Minister-constituted boards and successive levels of the Supreme Court decided objections
        and appeals using appearance, descent and social acceptance. Other apartheid controls then consumed the recorded
        classification, including residence, work and pass administration.
    institutionalCorrection:
      status: corrected
      periodLabel: '28 June 1991, with transitional savings'
      action: >-
        Act 114 of 1991 repealed the Population Registration Act and the listed amending acts and amended or repealed
        provisions in its schedules to remove their specified racial distinctions. Section 1(3) temporarily preserved the
        existing Identification Act population register until repeal of the 1983 Constitution Act.
      summary: >-
        Parliament dismantled the compulsory legal machinery for assigning every person a population-race classification.
        The savings clause means the transition was not an instantaneous deletion of every existing register entry, and
        the schedules do not support a claim that every racial distinction in South African law ended on 28 June 1991.
