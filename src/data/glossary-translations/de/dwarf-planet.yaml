entryId: dwarf-planet
sourceReviewedAt: '2026-08-21'
term: Zwergplanet
aliases:
- Zwergplaneten
shortDefinition: Nach der IAU-Definition ein Körper, der die Sonne umkreist und durch seine Eigengravitation annähernd
  rund ist, seine Umlaufbahnumgebung aber nicht freigeräumt hat.
longDefinition: Die Internationale Astronomische Union führte die formale Kategorie Zwergplanet 2006 ein. Ein Zwergplanet
  umkreist die Sonne und besitzt genug Eigengravitation, um annähernd rund zu werden, hat aber anders als ein Planet
  die Umgebung seiner Umlaufbahn nicht von vergleichbaren Körpern freigeräumt. Pluto, Eris, Haumea, Makemake und Ceres
  sind anerkannte Beispiele.
