title: Hereditary diagnoses as reliable grounds for compulsory sterilization
claim: Nazi German public-health, medical and judicial institutions treated a list of psychiatric, neurological,
  sensory and social diagnoses as identifying 'hereditarily diseased' people whose children were highly likely to
  inherit serious defects, and used that purported hereditary prediction to order compulsory sterilization.
currentUnderstanding: The blanket hereditary inference built into the sterilization system was scientifically invalid.
  Some conditions on the law's list genuinely have genetic components, and Huntington disease is a clear single-gene
  inherited disorder. But diagnoses such as schizophrenia and bipolar disorder reflect complex genetic and environmental
  risk rather than a single deterministic inheritance pattern, while 'congenital feeblemindedness' was used as an
  elastic category that swept in people judged socially deviant or unable to pass conformity and intelligence tests.
  A diagnosis did not establish the statutory claim that a person's future children were highly likely to suffer
  severe hereditary defects.
category: Medicine, eugenics and compulsory sterilization
reviewedAt: '2026-08-25'
impact:
  summary: The hereditary claim was embedded in law, medical reporting, special courts and surgery. The 1933 Law
    for the Prevention of Offspring with Hereditary Diseases took effect on 1 January 1934, created Hereditary Health
    Courts composed of a judge and physicians, and permitted sterilization to be carried out against the person's
    will with police force if necessary. Doctors, health offices and institutions supplied cases and diagnoses.
    Approximately 400,000 people were forcibly sterilized under the Nazi system. The Bundestag condemned the sterilizations
    as National Socialist injustice in 1988 and legislatively annulled surviving Hereditary Health Court sterilization
    decisions in 1998.
  highlights:
  - value: ≈400,000
    label: people forcibly sterilized under the Nazi Hereditary Health Law
  - value: '9'
    label: diagnostic categories named by the law as sterilization grounds
  - value: '1998'
    label: year Germany legislatively annulled surviving Hereditary Health Court sterilization decisions
  context:
  - The correction is not that heredity is irrelevant to every condition listed in the law. Huntington disease is
    autosomal dominant, while schizophrenia and bipolar disorder have substantial but complex genetic contributions.
    The false institutional leap was from a broad diagnosis to a sufficiently certain prediction about descendants
    to justify irreversible reproductive coercion.
  - The category translated as 'congenital feeblemindedness' was especially expansive. Nazi authorities used it
    not only for intellectual disability but also for people they considered socially deviant or who failed tests
    presented as measures of intelligence or social conformity.
  - 'The program ended with the Nazi regime in 1945, but institutional correction came much later. West German recognition
    was delayed: the Bundestag condemned the forced sterilizations in 1988, annulled the court decisions in 1998
    and in 2007 explicitly condemned the 1933 law itself as National Socialist injustice.'
episodes:
- id: nazi-germany-1934-1945
  polity: Nazi Germany
  region: Europe
  startYear: 1934
  endYear: 1945
  strength: enforced-doctrine
  institutionTypes:
  - government
  - court
  - medical
  institutions:
  - Reich Ministry of the Interior and public-health administration
  - Hereditary Health Courts and Higher Hereditary Health Courts
  - Public health offices, psychiatric institutions and participating hospitals
  institutionalContext: The July 1933 sterilization law defined people with listed diagnoses as 'hereditarily diseased'
    and allowed sterilization when medical science supposedly indicated a high probability of severe hereditary
    defects in their descendants. From January 1934 special courts decided cases using medical reports and testimony.
    Each court combined a judge, a public-health physician and another physician versed in hereditary-health doctrine.
    Once a sterilization order became final, the law permitted police-backed physical compulsion. Physicians, institution
    directors and health officials fed people into the process, and hospitals performed the operations.
  consequences:
  - Forced sterilization of approximately 400,000 people under a diagnosis-driven eugenic system
  - Irreversible reproductive surgery ordered through special courts and enforceable against the person's will
  - Broad use of 'congenital feeblemindedness' to convert social judgments and disputed testing into hereditary
    diagnoses
  - Medical and judicial institutionalisation of Nazi racial-hygiene concepts as purported scientific risk assessment
  - Physical complications, deaths and lifelong psychological and social harm among people subjected to sterilization
  - Decades of delayed legal rehabilitation before the Federal Republic annulled the court orders
  summary: Nazi compulsory sterilization transformed an overconfident hereditarian model into enforceable medical
    law. The state treated heterogeneous diagnoses as if they reliably identified people whose future children faced
    a high probability of severe hereditary defect, and special courts converted those judgments into compulsory
    operations. Modern genetics shows why that inference was untenable for broad psychiatric diagnoses, while historical
    evidence shows that the most frequently used category could absorb social nonconformity itself.
