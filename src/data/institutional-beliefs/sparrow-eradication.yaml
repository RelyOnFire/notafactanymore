        note: Official government reproduction of the CCP Central Committee and State Council directive stating that rats and sparrows were major enemies that damaged grain and obstructed production; the same official historical record notes that sparrows were removed from the Four Pests list by June 1959.
      - title: Threats to China's Biodiversity by Contradictions Policy
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4293358/
        publisher: Environmental Management
        note: Reviews the 1958 sparrow extermination campaign, the scale of killing, and subsequent insect outbreaks.
