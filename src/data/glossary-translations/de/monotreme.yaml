term: Kloakentier
aliases:
- Kloakentiere
- Monotremen
shortDefinition: Ein eierlegendes Säugetier aus der Gruppe, zu der Schnabeltiere und Ameisenigel gehören.
longDefinition: Kloakentiere oder Monotremen sind Säugetiere, die Eier legen, statt lebende Junge zu gebären. Heute leben
  nur noch Schnabeltiere und Ameisenigel. Sie besitzen typische Säugetiermerkmale wie Haare und Milchproduktion, bewahren
  aber eine ursprüngliche Fortpflanzungsform, die sich von Beuteltieren und Plazentatieren unterscheidet.
