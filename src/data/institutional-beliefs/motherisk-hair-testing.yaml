schemaVersion: 2
title: Motherisk hair testing as forensic evidence
proposition:
  summary: Motherisk hair-strand testing was treated as sufficiently reliable to establish drug or alcohol consumption or exposure for child-protection and criminal proceedings.
correction:
  summary: Hair toxicology can be informative when validated forensic methods, confirmation testing, contamination controls, and appropriately cautious interpretation are used. The Motherisk Drug Testing Laboratory's methods and interpretation from 2005 to 2015 did not meet internationally recognized forensic standards and were found inadequate and unreliable for evidentiary use.
category: Medicine and public health
reviewedAt: 2026-09-18
impact:
  summary: Motherisk was not an isolated laboratory error. Between 2005 and 2015 the laboratory tested more than 24,000 hair samples from over 16,000 individuals for child-protection purposes. After the testing was found inadequate and unreliable for evidentiary use, Ontario created a commission that reported reviewing approximately 1,271 children's-aid-society cases to identify people who might have been affected.
  highlights:
    - value: More than 24,000
      label: Hair samples tested for child-protection purposes, 2005–2015
    - value: More than 16,000
      label: Individuals represented in those tests
    - value: 1,271
      label: Children's-aid-society cases reviewed by the Motherisk Commission
      note: A reviewed case is not the same thing as a case in which the test determined the outcome. The report calls this an approximate count because case reviews were still in progress when it was written.
  context:
    - The problem was not that hair toxicology as a field was inherently meaningless. The problem was that a hospital laboratory evolved from clinical testing into work used for legal fact-finding without the validation, confirmation procedures, quality controls, proficiency standards, and interpretive restraint expected of a forensic laboratory.
    - Once a laboratory result entered a child-protection file, it could influence how agencies and courts interpreted parental drug or alcohol use. That gave a technical result institutional consequences far beyond the laboratory itself. Ontario therefore had to review not just the analytical method but the downstream decisions that may have relied on it.
episodes:
  - id: ontario-2005-2015
    polity: Ontario, Canada
    region: North America
    startYear: 2005
    endYear: 2015
    periodLabel: 2005–2015 (testing covered by the review)
    strength: policy-basis
    institutionTypes:
      - medical
    institutions:
      - Motherisk Drug Testing Laboratory, The Hospital for Sick Children (SickKids)
    institutionalContext: >-
      Motherisk results travelled through Ontario's child-protection system: children's aid societies requested or
      relied on testing, and results entered proceedings before Ontario courts. Those downstream bodies formed a
      distributed institutional network of children's aid societies and Ontario courts rather than a single named
      institution. The laboratory promoted its services to children's aid societies by 2001; the 2005–2015 bounds
      identify the testing period examined by the Lang Review, not the beginning of institutional use.
    consequences:
      - Hair-test results were used in child-protection proceedings across Ontario
      - Laboratory results were treated as evidence of drug or alcohol consumption or exposure
      - Ontario directed children's aid societies to stop using or relying on Motherisk hair testing
      - An independent provincial review and subsequent commission were created to examine the consequences of the testing
    summary: >-
      Between 2005 and 2015, the Motherisk Drug Testing Laboratory at Toronto's Hospital for Sick Children tested
      thousands of hair samples for drug and alcohol consumption or exposure. Its results were used primarily in
      child-protection proceedings and also in some criminal proceedings. SickKids permanently closed the laboratory
      in April 2015. On April 22, while the independent review was still under way, Ontario directed children's aid
      societies to stop using or relying on hair-strand drug and alcohol testing. The Lang Review's report, made public
      on December 17, 2015, concluded that Motherisk testing in the reviewed period was inadequate and unreliable for
      evidentiary use and did not meet internationally recognized forensic standards. A further commission began in
      January 2016 to review potentially affected child-protection matters.
    mechanism:
      kind: administrative-adoption
      summary: >-
        A hospital laboratory's hair-testing results were incorporated into Ontario child-protection investigations and
        court proceedings, allowing clinical-style testing to function as forensic evidence across a distributed public system.
    institutionalCorrection:
      status: corrected
      periodLabel: 2014–2018 review and withdrawal
      action: SickKids closed the laboratory; Ontario prohibited reliance on hair testing in child-protection services and established review processes.
      summary: >-
        Ontario appointed the independent review in November 2014. The laboratory closure and April 22, 2015
        directive preceded the final findings in December. The subsequent commission took effect on January 15,
        2016 and reported in February 2018. The laboratory stopped testing, and the directive prohibited reliance in
        child-protection services; the commission addressed possible effects on past decisions. This correction does
        not establish that every affected decision was reversed or every family received a remedy.
