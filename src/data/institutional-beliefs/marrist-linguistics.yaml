schemaVersion: 2
title: Marrist linguistics
proposition:
  summary: >-
    Languages were treated as products of universal class-driven stages rather than primarily as members of historically
    descended language families, making conventional comparative linguistics “bourgeois” or scientifically obsolete.
correction:
  summary: >-
    Languages change through historically traceable descent, contact, borrowing, innovation, and social use. Comparative
    linguistics can reconstruct genealogical relationships among language families; languages do not pass through a
    universal sequence of class-defined developmental stages.
category: Linguistics
reviewedAt: '2026-08-23'
