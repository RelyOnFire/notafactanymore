entryId: storm
sourceReviewedAt: '2026-08-21'
term: STORM
aliases:
- Stochastic Optical Reconstruction Microscopy
shortDefinition: Ein Einzelmolekül-Superauflösungsverfahren, das ein Bild aus vielen präzise lokalisierten Fluoreszenzsignalen
  rekonstruiert, die jeweils nur in kleinen Gruppen eingeschaltet werden.
longDefinition: Bei der Stochastic Optical Reconstruction Microscopy oder STORM werden nahe fluoreszierende Moleküle
  zeitlich getrennt, indem nur kleine Gruppen gleichzeitig leuchten. Jeder isolierte Lichtfleck lässt sich deutlich genauer
  lokalisieren als seine beugungsbedingte Breite vermuten lässt. Aus vielen solchen Lokalisationen wird anschließend
  ein hochaufgelöstes Bild rekonstruiert.
