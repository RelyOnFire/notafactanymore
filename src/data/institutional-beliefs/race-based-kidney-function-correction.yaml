schemaVersion: 2
title: Race-based kidney-function correction
proposition:
  summary: >-
    U.S. kidney-function guidance and laboratory systems treated classification as Black as an input that should raise a
    creatinine-based estimated glomerular filtration rate (eGFR) relative to otherwise identical inputs. The MDRD and 2009
    CKD-EPI equations operationalized group-level statistical associations as Black-race multipliers of about 1.20 and 1.16.
correction:
  summary: >-
    Race is a social classification, not a direct physiological measurement, and current NKF-ASN and KDIGO guidance says
    it should not be used to compute eGFR. The recommended 2021 CKD-EPI creatinine equation was refitted without race rather
    than created by simply deleting the old multiplier. Every eGFR remains an estimate: combining creatinine with cystatin C
    is generally more accurate, and measured GFR may be needed when an especially accurate value would change care.
category: Medicine and clinical algorithms
reviewedAt: '2026-09-24'
impact:
  summary: >-
    For the same age, sex and serum creatinine, the historical equations returned a higher eGFR when a patient was classified
    as Black. Because eGFR categories and thresholds inform chronic-kidney-disease staging, medication decisions, specialist
    referral, clinical-trial eligibility and transplant waiting time, that difference could change when a patient crossed a
    consequential threshold. Much of the task force's pre-implementation evidence about clinical effects came from simulations,
    and it did not attribute broad racial disparities in kidney care conclusively to the coefficient. A documented direct
    effect nevertheless appeared in transplantation: OPTN later restored waiting time to registrations for Black candidates
    who met its criteria for disadvantage from earlier race-inclusive calculations.
  highlights:
    - value: 1.20 / 1.16
      label: Black-race multipliers reported for the MDRD and 2009 CKD-EPI creatinine equations
      note: The task force reports 1.20 relative to White people for MDRD and 1.16 relative to non-Black people for CKD-EPI; these were group-level regression coefficients.
    - value: 65.8%
      label: of 3,542 U.S. respondent laboratories reported adopting the 2021 creatinine equation by March 2023
      note: This College of American Pathologists questionnaire result describes participating laboratories and reported adoption, not a census of every U.S. laboratory.
    - value: '14,701'
      label: OPTN waiting-time modifications processed by 4 January 2024 under the remediation policy
      note: Modified registrations received a median 1.7 years; the count is a policy outcome, not an estimate of every person affected by race-inclusive eGFR.
  context:
    - >-
      The historical coefficients were derived from average prediction differences in particular study datasets and were
      intended to improve statistical fit. That empirical origin did not make self-identified race a measurement of an
      individual patient's muscle mass, creatinine generation, ancestry or kidney physiology.
    - >-
      Racial disparities in kidney disease and care predated routine race-inclusive eGFR. The NKF-ASN interim report described
      those disparities as multifactorial and not conclusively attributable to the coefficient, so replacing the equation is
      one correction within a much larger equity problem.
    - >-
      The 2021 refit changes estimates for both Black and non-Black patients and does not make an individual estimate exact.
      Near important decision thresholds, guidance favors confirmation with creatinine plus cystatin C or, when necessary,
      measured GFR rather than treating any single calculated value as ground truth.
episodes:
  - id: united-states-2002-2021
    polity: United States
    region: North America
    startYear: 2002
    endYear: 2021
    periodLabel: 2002–2021
    strength: policy-basis
    institutionTypes:
      - medical
      - professional
    institutions:
      - National Kidney Foundation — Kidney Disease Outcomes Quality Initiative (KDOQI)
      - Chronic Kidney Disease Epidemiology Collaboration (CKD-EPI)
      - U.S. clinical laboratories and health systems
    institutionalContext: >-
      The 1999 MDRD research equation used self-identified African American race as a predictor and multiplied the resulting
      estimate by about 1.20 relative to its White comparison group. Institutional adoption is dated here from 2002, when the
      National Kidney Foundation's KDOQI guideline recommended the MDRD equation for adults, told laboratories to report eGFR
      and explained race differences through asserted average differences in creatinine generation and muscle mass. The 2009
      CKD-EPI equation retained a smaller multiplier of about 1.16 relative to its non-Black comparison group. Laboratories and
      electronic health-record systems then automated the equations across many institutions. In 2021 the joint NKF-ASN task
      force recommended a newly refitted equation without race; laboratory conversion remained incomplete in a March 2023 survey.
    consequences:
      - Patients with otherwise identical equation inputs received different creatinine-based eGFR values according to Black or non-Black classification
      - Race-dependent estimates could move patients across thresholds used for CKD staging, medication decisions, specialist referral, clinical trials and transplant evaluation
      - Most early estimates of downstream effects came from population or institutional simulations rather than observed care after an equation change
      - Race-inclusive calculation delayed transplant-waiting-time qualification for some Black candidates, later prompting case review and OPTN waiting-time restoration
      - Transition between equations could itself alter longitudinal eGFR trends and clinical categories even when measured kidney function had not changed
    summary: >-
      KDOQI converted the MDRD equation from a research result into a U.S. clinical recommendation in 2002, including routine
      laboratory reporting. Its rationale treated race as a proxy for average non-GFR determinants of serum creatinine, especially
      creatinine generation and muscle mass, although the coefficient itself came from regression in selected datasets rather
      than direct measurement of those traits in each patient. The widely used 2009 CKD-EPI equation retained a Black-race term.
      In 2021 CKD-EPI evaluated both simple omission of the term and full refitting without race; the NKF-ASN task force selected
      the refitted equation and also urged wider cystatin C use. OPTN subsequently required race-neutral eGFR for transplant
      policy and created a process to restore waiting time, while broader laboratory adoption continued unevenly.
    mechanism:
      kind: standard-setting
      summary: >-
        National guidance endorsed race-inclusive equations and routine eGFR reporting; CKD-EPI supplied the later equation;
        and laboratory and electronic-record systems automatically converted a Black/non-Black classification into different
        kidney-function estimates used in clinical workflows.
    institutionalCorrection:
      status: partial
      periodLabel: 2021 onward
      action: >-
        NKF-ASN recommended immediate use of the refitted 2021 race-free equation; implementation guidance followed, and OPTN
        required race-neutral transplant calculations in 2022 and retrospective waiting-time review in 2023.
      summary: >-
        Professional guidance removed race from the recommended eGFR calculation, transplant policy prohibited its use and
        OPTN created a concrete remediation process. The broader correction remained incomplete in the latest national
        laboratory survey used here: in March 2023,
        65.8% of 3,542 U.S. respondents reported adopting the 2021 creatinine equation, while 19.0% reported that they had not
        and 15.1% were unsure.
