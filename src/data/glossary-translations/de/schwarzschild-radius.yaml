term: Schwarzschild-Radius
aliases: []
shortDefinition: Bei einem idealisierten nicht rotierenden und ungeladenen Schwarzen Loch der Radius seines Ereignishorizonts. Er hängt nur von der Masse des Schwarzen Lochs ab.
longDefinition: In der Schwarzschild-Lösung der Allgemeinen Relativitätstheorie liegt der Horizont bei r = 2GM/c². Rotierende oder elektrisch geladene Schwarze Löcher besitzen eine andere Horizontgeometrie; „Schwarzschild-Radius“ ist daher kein universelles Synonym für jeden Ereignishorizont.
