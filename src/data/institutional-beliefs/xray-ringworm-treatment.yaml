title: X-ray treatment for ringworm
claim: Scalp X-ray irradiation was treated as an acceptably safe mass treatment for childhood ringworm, before its
  long-term radiation risks were recognized.
currentUnderstanding: X-ray irradiation can eliminate tinea capitis, but it exposes healthy tissue to ionizing radiation
  and increases the later risk of tumors and other radiation-related disease. Effective antifungal drugs make routine
  therapeutic irradiation for ringworm unnecessary.
category: Medicine and radiation safety
reviewedAt: '2026-08-23'
