schemaVersion: 2
title: HIV/AIDS as a U.S. biological weapon from Fort Detrick
proposition:
  summary: >-
    Soviet and East German state-security institutions propagated the claim that HIV/AIDS originated from U.S. military
    biological-weapons experiments at Fort Detrick, presenting an artificial American origin as fact through coordinated
    international active measures.
correction:
  summary: >-
    HIV-1 group M, the principal cause of the global AIDS pandemic, arose through natural cross-species transmission from
    a simian immunodeficiency virus in central chimpanzees. Its source has been traced to southeastern Cameroon, and the
    virus was already diversifying in humans around Kinshasa in the early twentieth century. Divergent HIV-1 sequences
    recovered from human samples collected there in 1959 and 1960 confirm decades of human evolution before AIDS was
    recognized and contradict the claim that HIV was engineered at Fort Detrick.
category: Public health, intelligence and state disinformation
reviewedAt: '2026-09-24'
impact:
  summary: >-
    The Fort Detrick story became a coordinated international disinformation campaign rather than a stray conspiracy
    theory. An anonymous letter published by the Indian newspaper Patriot in 1983 supplied the first identifiable
    publication naming Fort Detrick; on 7 September 1985 a KGB First Chief Directorate communication described measures
    intended to create the belief abroad that AIDS resulted from secret U.S. biological-weapons experiments. East German
    foreign intelligence joined through OVO “Denver.” By December 1986 U.S. diplomatic reporting had recorded the
    allegation in more than 50 countries and Soviet-bloc radio broadcasts in more than 20 languages.
  highlights:
    - value: 50+
      label: countries in which the Fort Detrick AIDS allegation had appeared by December 1986
    - value: 20+
      label: languages used by Soviet-bloc radio broadcasts spreading AIDS-related allegations
    - value: 1987–1992
      label: period from official Soviet scientific repudiation to public acknowledgment of the KGB's responsibility
  context:
    - >-
      The campaign is often called “Operation INFEKTION” in later literature. The archival study found that “Infektion”
      was not the documented codename of the AIDS campaign: East German foreign intelligence used OVO “Denver,” while a
      separate coordinated action called “Infektion” concerned Radio Free Europe and Radio Liberty.
    - >-
      The 1983 Patriot item is an important seed publication, but its precise authorship remains less securely
      documented than the later campaign. The archival study identifies several indications of KGB inspiration; direct
      institutional evidence begins with KGB Information No. 2955 to Bulgarian state security in September 1985.
    - >-
      The campaign did not represent a Soviet or East German scientific consensus. Leading Soviet virologist Viktor
      Zhdanov publicly supported an African, naturally occurring origin while the KGB-linked media campaign continued,
      and many East German medical scientists rejected the Segal thesis. The relevant carriers were intelligence and
      propaganda institutions, not the scientific communities as a whole.
    - >-
      The available archive does not justify claiming that Jakob Segal knowingly acted as a KGB agent or that the KGB
      secretly authored all of his scientific arguments. East German intelligence used and promoted the Segal thesis,
      but that institutional exploitation does not establish his personal intent.
episodes:
  - id: soviet-union-1983-1988
    polity: Soviet Union
    region: Eurasia
    startYear: 1983
    endYear: 1988
    strength: officially-endorsed
    institutionTypes:
      - government
    institutions:
      - KGB First Chief Directorate, including Service A
      - Literaturnaya Gazeta
      - Novosti Press Agency (APN)
      - Soviet international radio services
    institutionalContext: >-
      The anonymous letter published by Patriot on 17 July 1983 was the first identifiable publication to name Fort
      Detrick as the alleged origin of AIDS, but the evidence for KGB inspiration is circumstantial. By 7 September 1985,
      the direct archival evidence is unambiguous. KGB Information No. 2955 told Bulgarian state security that the USSR
      was conducting measures to create a favorable foreign opinion that AIDS resulted from uncontrolled secret
      services and the Pentagon with new biological weapons, and asked the allied service to use its political and media
      contacts. Literaturnaya Gazeta, a principal KGB channel for propaganda and disinformation, publicly launched the
      expanded theme on 30 October 1985; Soviet media, radio and allied services then amplified it internationally. In
      July 1987 Deputy Foreign Minister Anatoly Adamishin privately called the propaganda “foolish,” yet Soviet press
      items continued. The Soviet Academy of Sciences publicly and officially distanced itself from the Fort Detrick
      thesis in November 1987; in 1988 the president of the Soviet Academy of Medical Sciences publicly rejected support
      among Soviet scientists or scientific institutions. The Soviet press campaign ended in September 1988. Some KGB
      activity then persisted in the narrower theme of AIDS and U.S. military bases.
    consequences:
      - Coordinated dissemination of a false U.S.-military origin for HIV/AIDS through international active measures
      - Mobilization of allied intelligence and propaganda services to amplify the Fort Detrick narrative
      - Spread of the allegation across more than 50 countries and through Soviet-bloc radio in more than 20 languages
      - Use of fears about U.S. military personnel and bases to damage American relations with host countries
      - Undermining of accurate public-health understanding by presenting a fabricated laboratory origin as scientific fact
      - Diplomatic friction and conditions on U.S.–Soviet public-health cooperation while the campaign continued
    summary: >-
      Soviet intelligence converted a Fort Detrick conspiracy claim into an organized active-measures campaign. Explicit
      KGB instructions in 1985 sought to manufacture international belief in a U.S. biological-weapons origin and enlist
      allied services, while Soviet media and radio carried the theme worldwide. The retreat was staged rather than
      instantaneous: a diplomat disavowed the propaganda privately in 1987, Soviet scientific authorities rejected it
      publicly in 1987 and 1988, and the Soviet press stopped the campaign in September 1988. In 1992 Russian foreign-
      intelligence chief Yevgeny Primakov publicly acknowledged that the KGB had been behind the international campaign.
    mechanism:
      kind: publication
      summary: >-
        The KGB set the active-measures theme, requested help from allied security services and used Soviet press and
        international broadcasting to recirculate a Fort Detrick origin as ostensibly independent scientific reporting.
    institutionalCorrection:
      status: corrected
      periodLabel: 1987–1992
      action: Soviet scientific academies publicly rejected the Fort Detrick thesis, the Soviet press ended the campaign, and Russia's foreign-intelligence chief later acknowledged KGB responsibility.
      summary: >-
        The institutional reversal unfolded in stages. Adamishin privately disavowed the propaganda in July 1987; the
        Soviet Academy of Sciences publicly distanced itself in November 1987, and the president of the Soviet Academy of
        Medical Sciences issued a broader public rejection in 1988; Soviet press publication stopped in September 1988.
        Primakov's 1992 statement supplied the later public acknowledgment of KGB responsibility that the Soviet retreat
        itself had not provided.
  - id: east-germany-1986-1989
    polity: East Germany
    region: Europe
    startYear: 1986
    endYear: 1989
    strength: officially-endorsed
    institutionTypes:
      - government
    institutions:
      - Ministry for State Security
      - Hauptverwaltung A, Division X, Section 1
    institutionalContext: >-
      East German foreign intelligence participated in the Soviet-bloc campaign and opened OVO “Denver” on 17 July
      1986. HV A/X sent Bulgarian intelligence a study and other material said to prove that AIDS came from the United
      States and was a product of U.S. biological-weapons research; its officers described the Segal study as material
      used in active measures around the world. The surviving archive does not establish that the service created the
      Segals' thesis or directed their personal beliefs. It does show that HV A/X continued the operation after Moscow
      began retreating: officers supplied updated material to Bulgarian partners in 1988, pursued the theme in 1989 and
      helped finance and seek foreign distribution for the film AIDS — die Afrikalegende.
    consequences:
      - Creation of OVO “Denver” as an East German foreign-intelligence active-measures operation
      - Distribution to allied services of material claiming AIDS was a product of U.S. biological-weapons research
      - International use of the Segal thesis as ostensibly scientific support for the Fort Detrick narrative
      - Continuation of AIDS-related active measures after Soviet scientific authorities repudiated the thesis
      - Support for the 1989 film AIDS — die Afrikalegende and efforts to distribute it in developing countries
    summary: >-
      The East German Ministry for State Security did more than repeat Soviet media claims. Its foreign-intelligence
      service created OVO “Denver,” exchanged materials with allied services and used the Segal thesis in active measures
      intended to strengthen anti-American attitudes. It continued those measures after the Soviet retreat, through the
      final full year of the East German regime.
    mechanism:
      kind: publication
      summary: >-
        East German foreign intelligence organized OVO “Denver,” supplied material to allied services, promoted updated
        versions of the Segal thesis and supported media intended for international distribution.
    institutionalCorrection:
      status: undocumented
      summary: >-
        The documented operation ended with the collapse of the regime. The archival study traces continued activity in
        1989 but identifies no dated Ministry for State Security act retracting or repudiating the Fort Detrick narrative.
