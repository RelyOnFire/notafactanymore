locale: de
entryId: ejecta
sourceReviewedAt: '2026-08-21'
term: Ejekta
aliases:
- Auswurfmaterial
- Einschlagsejekta
shortDefinition: Material, das bei einem Einschlag oder Ausbruch herausgeschleudert wird; Einschlagsejekta können
  zertrümmertes, geschmolzenes oder verdampftes Gestein enthalten.
longDefinition: In der Einschlagsgeologie bezeichnet Ejekta Material, das bei einer kraterbildenden Kollision ausgeworfen
  wird. Seine Verteilung, Zusammensetzung und Schockmerkmale können auch weit vom Krater entfernt Spuren eines Einschlags
  bewahren.
