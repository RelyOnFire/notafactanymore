locale: de
entryId: lysenkoist-heredity
sourceReviewedAt: 2026-08-22
title: Lyssenkistische Vererbungslehre
claim: Umweltbehandlungen können die Vererbung über Generationen gezielt umformen und die mendelsche Genetik damit überflüssig oder falsch machen.
currentUnderstanding: Vererbung wird hauptsächlich durch genetische Information vermittelt. Umweltbedingungen beeinflussen Entwicklung und können in einzelnen Fällen über Generationen nachwirken, stützen aber nicht die breite lyssenkistische Behauptung, dass gezielte Umweltbehandlung erbliche Merkmale routinemäßig umschreibt.
episodes:
  - id: ussr-1948-1964
    polity: Sowjetunion
    summary: Nach der VASKhNIL-Tagung von 1948 erhielt Lyssenkos anti-mendelsche Biologie staatliche Rückendeckung. Genetiker verloren Stellen, Labore wurden geschlossen und Lehre sowie Forschung zur klassischen Genetik eingeschränkt. Das landesweite Verbot zerfiel erst nach Chruschtschows Sturz 1964.
    consequences: [Genetikforschung, Biologieunterricht, Agrarwissenschaft]
  - id: china-1949-1956
    polity: Volksrepublik China
    summary: In der frühen Volksrepublik wurde die sowjetische Wissenschaftsorganisation übernommen und die klassische Genetik zugunsten lyssenkistischer Biologie zurückgedrängt. Die Genetiktagung von Qingdao 1956 markierte die offizielle Rehabilitierung der mendelschen Genetik, auch wenn politischer Druck auf Forschende fortbestand.
    consequences: [Genetikforschung, Biologieunterricht, Wissenschaftliche Laufbahnen]
  - id: poland-1949-1956
    polity: Polen
    summary: Eine Warschauer Konferenz erklärte die lyssenkistische „Neue Biologie“ im März 1949 zum offiziellen Paradigma der polnischen Wissenschaft. Genetik und Kritik an der Doktrin wurden aktiv bekämpft, Genetikkurse verschwanden aus den Universitäten, Lehrpläne wurden umgeschrieben und Wissenschaftler konnten wegen politisch unerwünschter Begriffe zum Schweigen gebracht oder öffentlich stigmatisiert werden. Mit dem politischen Tauwetter von 1956 brach das System zusammen.
    consequences:
      - Entfernung der Genetik aus dem Unterricht
      - Unterdrückung konkurrierender biologischer Forschung
      - Politischer Druck auf Wissenschaftler
      - Versuche zur Umgestaltung der Agrarwissenschaft
