schemaVersion: 2
locale: de
entryId: insulin-coma-schizophrenia
sourceReviewedAt: '2026-09-19'
title: Insulinkomatherapie als Behandlung der Schizophrenie
proposition:
  summary: >-
    Wiederholt durch Insulin ausgelöste hypoglykämische Komas wurden als spezifische oder grundlegende Therapie behandelt,
    die bei Schizophrenie Remission oder Heilung bewirken könne.
correction:
  summary: >-
    Kontrollierte Vergleiche belegten keinen spezifischen therapeutischen Nutzen des Insulinkomas selbst bei Schizophrenie.
    Verbesserungen in frühen unkontrollierten Serien konnten unter anderem durch Patientenauswahl, den natürlichen
    Krankheitsverlauf, intensive Pflege und soziale Betreuung, Begleitbehandlungen und andere unspezifische Effekte
    entstehen. Die absichtliche schwere Hypoglykämie brachte zudem erhebliche Risiken mit sich, darunter Krampfanfälle,
    verlängertes Koma, neurologische Schäden und Tod. Die historische Korrektur lautet daher nicht, dass sich während
    einer solchen Kur niemals ein Patient besserte, sondern dass das insulininduzierte Koma nicht als der behauptete
    spezifisch antischizophrene Wirkmechanismus belegt wurde.
impact:
  summary: >-
    Bei der Insulinkomatherapie wurden psychiatrische Patientinnen und Patienten absichtlich in schwere Hypoglykämie
    und Bewusstlosigkeit versetzt, häufig wiederholt über mehrere Wochen. Von Wien aus verbreitete sich die Methode
    rasch international und wurde zu einer personalintensiven institutionellen Behandlung der Schizophrenie. In Wien
    wurde sie bis etwa 1970 angewandt, obwohl kontrollierte Studien den behaupteten spezifischen Nutzen bereits untergraben hatten.
  highlights:
    - value: '965'
      label: Insulinbehandlungsfälle an der Wiener Universitätspsychiatrie 1951–1969, überwiegend Komatherapie
      note: >-
        Zahl aus den für die Studie ausgewählten Akten zu fünf Diagnosegruppen, nicht ausschließlich Schizophrenie
        und keine Zahl einzelner Komainduktionen oder Schädigungen.
    - value: 31 Kliniken
      label: setzten die tiefe Insulinkomatherapie 1938 bereits in England und Wales ein
    - value: 0,5–4,5 %
      label: Spanne zeitgenössisch berichteter Mortalitätsschätzungen bei der Insulinkomatherapie
      note: >-
        Schätzungen aus unterschiedlichen historischen Berichten, keine gemessene Sterblichkeitsrate der Wiener Klinik oder des Retreat.
  context:
    - >-
      Die Insulinkomatherapie bei Schizophrenie war von der normalen Insulinbehandlung bei Diabetes zu unterscheiden.
      Die Patientinnen und Patienten wurden absichtlich schwer hypoglykämisch und bewusstlos gemacht und anschließend
      mit Glukose, in Wien später auch mit Glukagon, wieder aufgeweckt.
    - >-
      Der Niedergang der Methode hatte mehrere Ursachen. Wissenschaftliche Kritik und kontrollierte Studien stellten
      die Wirksamkeit infrage; zugleich waren neue Antipsychotika einfacher anzuwenden. Das Verschwinden
      einer Therapie beweist daher für sich allein nicht, warum Institutionen sie aufgaben.
episodes:
  - id: austria-vienna-1935-1970
    polity: Österreich — Wien
    periodLabel: Mitte der 1930er Jahre–ca.1970
    institutions:
      - Psychiatrisch-Neurologische Universitätsklinik Wien
    institutionalContext: >-
      Manfred Sakel berichtete 1933 in Wien über frühe Ergebnisse; die historische Klinikstudie datiert die Entwicklung
      der dortigen Insulinkomatherapie auf die Mitte der 1930er Jahre. Die Methode wurde in die Behandlung an der
      Universitätspsychiatrie übernommen und überdauerte dort auch die Einführung der Neuroleptika. Während Hans Hoffs
      Leitung bezeichnete Ottokar H. Arnold eine richtig indizierte und durchgeführte volle Insulinschockkur 1960 noch
      als Grundbehandlung der Schizophrenie. Eine moderne Auswertung der Krankenakten
      fand für 1951–1969 insgesamt 965 Fälle von Insulinbehandlung, größtenteils Insulinkomatherapie, mit Belegen noch
      für 1968; die historische Studie datiert das endgültige Ende in Wien auf etwa 1970.
    summary: >-
      Die Insulinkomatherapie wurde in den 1930er Jahren in Wien entwickelt und etablierte sich an der Universitätspsychiatrie
      als Behandlung der Schizophrenie. Besonders bei frühen Erkrankungen wurde eine Heilung erwartet, und die Kuren
      bestanden aus wiederholt ausgelösten Komas. Nach Einführung der Neuroleptika und zunehmender Kritik an der Wirksamkeit
      ging die Anwendung zurück, hielt sich in Wien aber ungewöhnlich lange: Eine historische Studie von 2025/26 dokumentiert
      965 Insulinbehandlungsfälle zwischen 1951 und 1969, überwiegend Komatherapie, und ein Ende der Methode erst um 1970.
    consequences:
      - Wiederholte absichtliche Auslösung schwerer Hypoglykämie und von Koma bei psychiatrischen Patientinnen und Patienten
      - Behandlungskuren mit häufig Dutzenden Komainduktionen über mehrere Wochen
      - Risiko von Krampfanfällen, verlängertem Koma, neurologischen Schäden und Tod
      - Fortsetzung einer invasiven Therapie, obwohl ihr spezifischer Nutzen bereits stark umstritten war
    mechanism:
      summary: >-
        Die Wiener Universitätspsychiatrie verankerte wiederholt insulininduzierte Komas in der routinemäßigen
        Schizophreniebehandlung, verordnete Kuren mit wiederholten Komainduktionen und hielt auch nach Einführung
        von Neuroleptika an der Begründung als Grundbehandlung fest.
    institutionalCorrection:
      summary: >-
        Die Behandlung wurde um 1970 nach langjähriger wissenschaftlicher Kritik und therapeutischem Wandel eingestellt;
        der vorhandene Nachweis zeigt jedoch keinen datierten Wiener Institutionsbeschluss, der die Insulinkomatherapie ausdrücklich widerrief.
  - id: england-wales-1936-1960
    polity: England und Wales
    periodLabel: 1936–ca.1960
    institutions:
      - Board of Control for England and Wales
      - The Retreat, York
      - Royal Medico-Psychological Association
    institutionalContext: >-
      Der Board of Control, der psychiatrische Krankenhäuser beaufsichtigte, entsandte 1936 eine medizinische Kommissarin
      nach Wien und veröffentlichte anschließend Hinweise zur hypoglykämischen Schockbehandlung. Die institutionelle
      Übernahme erfolgte rasch: 1938 war die tiefe Insulinkomatherapie bereits in 31 Krankenhäusern in England und Wales
      etabliert. Das Retreat führte sie im Oktober 1938 nach positiven Berichten auf der Julitagung der
      Medico-Psychological Association ein. Trotz wissenschaftlicher Kritik hielt die Unterstützung aus der Fachwelt
      in den 1940er und 1950er Jahren an; ein führendes Lehrbuch befürwortete die Methode noch 1960. Ein randomisierter
      Vergleich von 1957 fand keinen signifikanten Vorteil des insulininduzierten gegenüber einem barbituratinduzierten
      Koma; den Nutzen der Komabehandlung selbst konnte er nicht klären. Mit der Verdrängung durch Antipsychotika ging
      die Anwendung zurück. Das ungefähre Enddatum bezeichnet diesen Übergang, kein gemeinsames Ende der Anwendung
      in allen hier genannten Institutionen.
    summary: >-
      England und Wales institutionalisierten die Insulinkomatherapie rasch, nachdem der Board of Control die Wiener
      Methode 1936 untersuchen ließ. Bis 1938 war sie in 31 Kliniken etabliert und erhielt starke Unterstützung aus der
      psychiatrischen Fachwelt. Das Retreat begann im Oktober desselben Jahres mit der Anwendung.
      In den 1950er Jahren nahm die Kritik zu; eine kontrollierte Studie von 1957 fand keinen signifikanten Unterschied
      zwischen Insulinkoma und einer Vergleichskomatherapie. Damit wurde die Annahme eines spezifischen Nutzens des
      Insulins bei Schizophrenie infrage gestellt. Gegen Ende des Jahrzehnts und in den 1960er Jahren ging die Anwendung
      zurück, während manche Kliniker die Methode weiterhin verteidigten.
    consequences:
      - Staatlich unterstützte Verbreitung von Insulinkoma-Einheiten im psychiatrischen Krankenhaussystem
      - Wiederholte invasive Behandlung von Menschen mit Schizophreniediagnose
      - Hoher Personalbedarf und Behandlungskuren über mehrere Wochen
      - Exposition gegenüber schwerer Hypoglykämie, Krampfanfällen, neurologischen Komplikationen und Mortalitätsrisiko
    mechanism:
      summary: >-
        Untersuchung und Hinweise des Board of Control förderten die Verbreitung eigener Insulinkoma-Einheiten im
        psychiatrischen Krankenhaussystem; Tagungen und Veröffentlichungen der RMPA verstärkten die Übernahme.
        Das Archiv des Retreat beschreibt dessen Einführung nach positiven Berichten auf der Verbandstagung von 1938.
    institutionalCorrection:
      summary: >-
        Die klinische Anwendung ging zurück, während kontrollierte Vergleiche einen spezifischen Insulineffekt infrage
        stellten und Antipsychotika das Verfahren verdrängten. Die verfügbaren Quellen belegen weder eine datierte
        Rücknahme durch den Board of Control oder die RMPA noch das Ende der Anwendung im Retreat. Der klinische
        Rückgang belegt keine formelle institutionelle Zurückweisung.
evidence:
  - id: insulin-vienna-proposition
    note: >-
      Open-Access-Studie auf Grundlage Wiener Klinikakten. Sie dokumentiert 965 Insulinbehandlungsfälle
      1951–1969, überwiegend Insulinkomatherapie, die Erwartung einer Heilung früher Schizophrenie, eine
      Beschreibung der vollen Insulinschockkur als Grundbehandlung im Jahr 1960 und die Fortsetzung in Wien bis
      etwa 1970.
  - id: insulin-britain-proposition
    note: >-
      Dokumentiert den behaupteten spezifischen Behandlungseffekt und die Unterstützung durch den Board of
      Control und die RMPA, die zur Etablierung beitrug, ebenso wie den Widerspruch.
  - id: insulin-lancet-correction
    note: >-
      Primäre kontrollierte Studie von Ackner, Harris und Oldham aus dem Jahr 1957, die weithin als
      entscheidender experimenteller Test galt, ob das Insulinkoma selbst einen spezifischen Nutzen bei
      Schizophrenie besitzt. PubMed liefert bibliografische Angaben, nicht den Ergebnisteil. Das Ergebnis wurde
      anhand von Freudenthal und Moncrieff (PDF-S. 7) sowie Jones (S. 148) geprüft; die Originalergebnisse
      wurden nicht direkt eingesehen.
  - id: insulin-ucl-correction
    note: >-
      Moderne fachhistorische Übersicht, wonach Wirksamkeitszweifel den randomisierten Studien vorausgingen und
      kontrollierte Vergleiche die Insulinkomatherapie nicht als spezifisch wirksame Schizophreniebehandlung
      bestätigten. Der Vergleich von insulin- und barbituratinduziertem Koma konnte den Nutzen der
      Komabehandlung selbst nicht klären.
  - id: insulin-jrsm-correction-risk
    note: >-
      Belegt die Behandlungsrisiken und erläutert, warum eine Besserung während der Kur für sich genommen keinen
      insulinspezifischen Effekt nachwies.
  - id: insulin-jrsm-impact
    note: >-
      Historische Auswertung britischer Unterlagen zu Unterstützung durch den Board of Control, Anwendung in 31
      Kliniken bis 1938, dem sehr aufwendigen Behandlungsschema, Mortalitäts- und Hirnschädigungsrisiken,
      Unterstützung aus der psychiatrischen Fachwelt und der kontrollierten Studie von 1957 ohne spezifischen
      Insulinvorteil.
  - id: insulin-vienna-impact
    note: >-
      Die 965 Fälle betreffen die für die Studie ausgewählten Diagnosegruppen und überwiegend Komatherapie. Die
      Studie belegt außerdem die Wiener Anwendung bis etwa 1970 und den späteren Einsatz von Glukagon zur
      Beendigung des Komas.
  - id: insulin-ucl-impact
    note: >-
      Belegt die internationale Verbreitung, das intensive Behandlungsschema und die Spanne historischer
      Mortalitätsschätzungen von 0,5–4,5 %. Die Spanne ist keine lokale Klinikrate; die Darstellung warnt auch
      davor, den Rückgang allein den Studien zuzuschreiben.
  - id: insulin-vienna-carrier
    note: >-
      Open-Access-Studie auf Grundlage Wiener Klinikakten. Sie dokumentiert 965 Insulinbehandlungsfälle
      1951–1969, überwiegend Insulinkomatherapie, die Erwartung einer Heilung früher Schizophrenie, eine
      Beschreibung der vollen Insulinschockkur als Grundbehandlung im Jahr 1960 und die Fortsetzung in Wien bis
      etwa 1970.
  - id: insulin-vienna-mechanism
    note: >-
      Amtliche Darstellung der Medizinischen Universität Wien zur Historischen Kommission, die den parallelen
      fortgesetzten Einsatz von Insulinkoma- und anderen Schock-/Fiebertherapien während des Übergangs zur
      Psychopharmakologie bestätigt. Die dortige Bedauernserklärung betrifft die Erhaltung des Malariastamms,
      keine formelle Rücknahme der Insulinkomatherapie.
  - id: insulin-vienna-treatment-mechanism
    note: >-
      Zeigt, wie die Klinik Kuren mit wiederholten Komas verordnete und die volle Insulinschockkur auch nach
      Verfügbarkeit der Neuroleptika als Grundbehandlung ansah.
  - id: insulin-vienna-consequences
    note: >-
      Belegt wiederholte hypoglykämische Komas, längere Behandlungskuren und die Fortsetzung trotz umstrittener
      Wirksamkeit. Eine Wiener Zahl von Schädigungen oder Todesfällen liefert die Passage nicht.
  - id: insulin-vienna-risks
    note: >-
      Belegt allgemeine Risiken des Verfahrens einschließlich neurologischer Schäden. Gemeint sind
      Behandlungsrisiken, keine dokumentierten Zahlen unerwünschter Ereignisse in Wien.
  - id: insulin-vienna-ucl-consequences
    note: >-
      Begutachtete historische Untersuchung der Evidenz zu langjährigen wissenschaftlichen Zweifeln, späteren
      randomisierten Vergleichen, fehlendem Nachweis einer spezifischen Wirksamkeit und zeitgenössischen
      Mortalitätsschätzungen.
  - id: insulin-vienna-ucl-context
    note: >-
      Datiert den frühen Bericht auf 1933 und damit vor die zeitliche Einordnung in der Wiener Klinikstudie auf
      die Mitte der 1930er Jahre. Der Beginn der Episode ist ein Näherungswert, kein genau belegtes Datum der
      ersten Behandlung.
  - id: insulin-vienna-discontinuation
    note: >-
      Dokumentiert das ungefähre Ende der Anwendung. Die Passage benennt keinen datierten institutionellen Akt
      zur formellen Zurückweisung der Behandlung.
  - id: insulin-britain-carrier
    note: >-
      Historische Auswertung britischer Unterlagen zu Unterstützung durch den Board of Control, Anwendung in 31
      Kliniken bis 1938, dem sehr aufwendigen Behandlungsschema, Mortalitäts- und Hirnschädigungsrisiken,
      Unterstützung aus der psychiatrischen Fachwelt und der kontrollierten Studie von 1957 ohne spezifischen
      Insulinvorteil.
  - id: insulin-retreat-carrier
    note: >-
      Archivkatalog, der die Einführung der Insulinkomatherapie im Retreat 1938 nach positiven Berichten auf der
      Jahrestagung der Medico-Psychological Association dokumentiert. Die Beschreibung nennt Oktober 1938. Als
      Nachweis dient der Katalogtext, nicht die zugangsbeschränkten Patientenakten.
  - id: insulin-britain-mechanism
    note: >-
      Dokumentiert staatliche Hinweise und fachliche Veröffentlichungen, die die Übernahme in Kliniken
      förderten. Diese institutionellen Mechanismen reichen über das einzelne im Retreat-Katalog beschriebene
      Krankenhaus hinaus.
  - id: insulin-wellcome-mechanism
    note: >-
      Archivkatalog, der die Einführung der Insulinkomatherapie im Retreat 1938 nach positiven Berichten auf der
      Jahrestagung der Medico-Psychological Association dokumentiert. Dies belegt den Übernahmeweg speziell für
      das Retreat.
  - id: insulin-britain-consequences
    note: >-
      Belegt alle vier Folgen: Verbreitung, wiederholte Behandlung, Personalbedarf und Kurdauer sowie die
      Exposition gegenüber Behandlungsrisiken. Die Kurdauer belegt keine vergleichende Verlängerung des
      Krankenhausaufenthalts.
  - id: insulin-britain-ucl-context
    note: >-
      Moderne fachhistorische Übersicht, wonach Wirksamkeitszweifel den randomisierten Studien vorausgingen und
      kontrollierte Vergleiche die Insulinkomatherapie nicht als spezifisch wirksame Schizophreniebehandlung
      bestätigten. Sie dokumentiert auch fortgesetzte Fürsprache nach der Studie; etwa 1960 ist daher kein
      allgemeines Datum für das Ende der Anwendung.
  - id: insulin-britain-ucl-consequences
    note: >-
      Bestätigt die wiederholte Behandlung und allgemeine Risiken; eine Sterblichkeitsrate oder Zahl von
      Schädigungen im Retreat belegt sie nicht.
  - id: insulin-britain-lancet-context
    note: >-
      Primäre kontrollierte Studie von Ackner, Harris und Oldham aus dem Jahr 1957, die weithin als
      entscheidender experimenteller Test galt, ob das Insulinkoma selbst einen spezifischen Nutzen bei
      Schizophrenie besitzt. PubMed liefert bibliografische Angaben, nicht den Ergebnisteil. Das Ergebnis wurde
      anhand von Freudenthal und Moncrieff (PDF-S. 7) sowie Jones (S. 148) geprüft; die Originalergebnisse
      wurden nicht direkt eingesehen.
  - id: insulin-britain-decline
    note: >-
      Belegt den klinischen Rückgang und unterschiedliche Erklärungen dafür, keine datierte Rücknahme durch den
      Board of Control oder die RMPA. Das Datum der letzten Anwendung im Retreat geht daraus nicht hervor.
