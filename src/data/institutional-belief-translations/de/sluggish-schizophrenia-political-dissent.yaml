locale: de
entryId: sluggish-schizophrenia-political-dissent
sourceReviewedAt: 2026-08-22
title: „Schleichende Schizophrenie“ und politischer Widerspruch
claim: Beharrlicher Reformwille oder politische Opposition konnten als Anzeichen einer milden Schizophrenie behandelt werden, selbst wenn keine offene Psychose vorlag.
currentUnderstanding: Politischer Widerspruch ist kein Symptom einer Schizophrenie. Eine psychiatrische Diagnose erfordert klinisch belastbare Hinweise auf eine psychische Erkrankung und darf nicht aus Opposition gegen eine Regierung, Reformforderungen oder dem Festhalten an politischen Überzeugungen abgeleitet werden.
episodes:
  - id: soviet-union-1969-1989
    polity: Sowjetunion
    summary: Die ungewöhnlich weit gefasste sowjetische Diagnose der „schleichenden Schizophrenie“ erlaubte es, Schizophrenie auch bei Menschen festzustellen, die im Alltag funktionierten und keine offene Psychose zeigten. In der Breschnew-Ära wurde sie wiederholt auf Dissidenten angewandt; Reformbestrebungen und politische Opposition konnten als krankhaft gedeutet und psychiatrische Internierung als Repressionsmittel eingesetzt werden.
    consequences:
      - Psychiatrische Internierung von Dissidenten
      - Erzwungene psychiatrische Behandlung
      - Unterdrückung politischen und religiösen Widerspruchs
