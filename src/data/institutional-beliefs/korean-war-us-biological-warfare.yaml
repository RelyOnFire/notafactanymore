  institutions:
  - Council of Ministers of the USSR
  - Communist Party of the Soviet Union Central Committee
  - Soviet Ministry of Foreign Affairs
  - Soviet delegation to the United Nations
  - Soviet military mission in North Korea
  institutionalContext: >-
    In 1952 the Soviet government amplified Chinese and North Korean accusations that U.S. forces were conducting
    bacteriological warfare and carried the allegation into United Nations proceedings. The USSR opposed proposed
    impartial investigations and vetoed Security Council efforts on 3 and 9 July 1952. Internal Soviet records opened
    after the Cold War show that Soviet advisers in North Korea had participated in manufacturing evidence. A 21 April
    1953 memorandum to the Soviet leadership reported that two false regions of infection had been simulated with the
    help of Soviet military adviser General Vladimir Razuvaev for the purpose of accusing the Americans. On 2 May 1953
    the Presidium of the USSR Council of Ministers declared that the allegations had been based on false information,
    called them fictitious and ordered the issue removed from the press and international organizations.
  consequences:
  - Official Soviet amplification of biological-warfare accusations against the United States
  - Use of the allegation in formal United Nations diplomacy
  - Soviet vetoes blocking proposed international investigation of the charges
  - Participation by Soviet personnel in fabrication of supposed evidence in North Korea
  - Post-Stalin directive to halt publication, withdraw the issue internationally and punish personnel involved in fabrication
  summary: >-
    The Soviet Union turned disputed wartime accusations into an official diplomatic campaign while parts of its own
    apparatus helped manufacture purported evidence. The USSR used the charges at the United Nations and blocked
    proposed investigation. Internal records reviewed after Stalin's death described staged infection areas and led the
    Soviet leadership to state on 2 May 1953 that the accusations were fictitious, order their removal from public and
    international circulation and call for punishment of Soviet personnel involved in fabricating proof.
  sources:
