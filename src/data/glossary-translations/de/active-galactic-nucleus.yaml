locale: de
entryId: active-galactic-nucleus
sourceReviewedAt: '2026-08-21'
term: Aktiver galaktischer Kern
aliases:
- aktive galaktische Kerne
- AGN
shortDefinition: Eine ungewöhnlich leuchtkräftige kompakte Region im Zentrum einer Galaxie, die durch Materie angetrieben
  wird, die auf ein supermassereiches Schwarzes Loch zufällt.
longDefinition: Ein aktiver galaktischer Kern, kurz AGN, ist die energiereiche Zentralregion einer Galaxie, in der Gas
  und Staub beim Einfall auf ein supermassereiches Schwarzes Loch starke Strahlung erzeugen. Quasare gehören zu den leuchtkräftigsten
  Formen aktiver galaktischer Kerne. Das Schwarze Loch selbst erzeugt dabei nicht das beobachtete Licht; der größte Teil
  stammt aus der erhitzten Materie in seiner Umgebung.
