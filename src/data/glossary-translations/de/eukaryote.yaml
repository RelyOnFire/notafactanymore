term: Eukaryot
aliases:
- Eukaryoten
- eukaryotisch
shortDefinition: Ein Organismus, dessen Zellen ihre DNA in einem Zellkern enthalten; Tiere, Pflanzen, Pilze und viele Einzeller
  sind Eukaryoten.
longDefinition: Eukaryoten sind Organismen aus Zellen mit einem Zellkern und weiteren membranumhüllten Kompartimenten. Tiere,
  Pflanzen, Pilze und viele einzellige Linien gehören dazu. Bakterien und Archaeen gehören zu anderen Zelllinien und besitzen
  keinen Zellkern.
