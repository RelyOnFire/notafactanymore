title: Oophorectomy as a cure for insanity
claim: >-
  Removal of the ovaries and fallopian tubes was treated as a potential cure for insanity when women's psychiatric
  illness was attributed to disease or dysfunction of the reproductive organs.
currentUnderstanding: >-
  Oophorectomy and salpingo-oophorectomy have legitimate gynecologic and cancer-related indications, but removing
  healthy ovaries is not a treatment for primary psychiatric illness. Bilateral oophorectomy is irreversible, causes
  infertility and, before natural menopause, produces surgical menopause with substantial endocrine and long-term
  health consequences. A presumed reproductive cause of psychiatric symptoms does not justify such surgery without
  an independently established surgical indication.
category: Psychiatry and reproductive medicine
reviewedAt: '2026-08-24'
impact:
  summary: >-
    In 1892 the State Hospital for the Insane at Norristown, Pennsylvania, began an institutionally approved program
    of removing the ovaries of women whose insanity was attributed to reproductive pathology. Contemporary accounts
    show that four women had already undergone the operation when the program drew formal scrutiny and that roughly
    fifty additional patients had been marked or proposed for surgery. In 1893 Pennsylvania's Committee on Lunacy
    condemned the practice and brought the program to an end.
  highlights:
  - value: '4'
    label: women had already undergone the operation when the program came under formal scrutiny
  - value: '~50'
    label: additional women were reported as marked or proposed for operation
  - value: '1893'
    label: Pennsylvania's Committee on Lunacy intervened against the program
  context:
  - >-
    Historical accounts differ on the eventual total number of operations, with later sources variously describing
    five or six cases. Four completed operations are contemporaneously documented at the point of controversy; the
    later final count and precise death chronology remain less certain.
  - >-
    The disputed practice was surgery undertaken as psychiatric treatment. Oophorectomy remains medically appropriate
    when performed for an independently established gynecologic or cancer-related indication.
