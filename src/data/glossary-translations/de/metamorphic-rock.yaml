locale: de
entryId: metamorphic-rock
sourceReviewedAt: '2026-08-21'
term: Metamorphes Gestein
aliases:
- metamorphe Gesteine
- Metamorphit
- Metamorphite
shortDefinition: Gestein, das durch Hitze, Druck, Fluide oder eine Kombination daraus aus einem älteren Gestein umgewandelt
  wird, ohne vollständig zu schmelzen.
longDefinition: Metamorphe Gesteine entstehen aus bereits vorhandenen magmatischen, sedimentären oder älteren metamorphen
  Gesteinen. Erhöhte Temperatur, Druck, mechanische Spannung und reaktive Fluide können Minerale rekristallisieren und
  Gefüge oder Zusammensetzung verändern. Schmilzt das Gestein vollständig, gehört die entstehende Schmelze stattdessen
  zum magmatischen Gesteinskreislauf.
