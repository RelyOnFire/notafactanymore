evidence:
  - id: hair-fbi-review-proposition
    sourceId: fbi-doj-hair-review
    relation: contextualizes
    target: {scope: belief, aspect: proposition}
    locator: "Review overview, paragraphs on microscopic comparison and 1996 mtDNA introduction; four numbered case-selection criteria."
    note: >-
      Explicitly distinguishes microscopic hair comparison as a valid comparative technique from the
      overstatement problem, describes the use of mitochondrial DNA for more meaningful association, and defines
      the pre-2000 review scope.
  - id: hair-fbi-review-correction
    sourceId: fbi-doj-hair-review
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: "Review overview, paragraphs on microscopic comparison and 1996 mtDNA introduction; four numbered case-selection criteria."
    note: >-
      States the FBI’s distinction between descriptive comparison and overstated testimony and its rationale for
      complementary mtDNA testing. The independent scientific limits are supported separately by the NRC
      assessment.
  - id: hair-fbi-errors-impact
    sourceId: joint-hair-review-2015
    relation: documents
    target: {scope: belief, aspect: impact}
    locator: "April 20, 2015 joint statement, paragraphs beginning The government identified nearly 3,000 cases and In the 268 cases; following paragraph on 41 states."
    note: >-
      Reports nearly 3,000 potentially reviewable cases, erroneous statements in 257 of 268 cases with reviewed
      inculpatory trial testimony, testimony by reviewed examiners in 41 states, and FBI training of hundreds of
      state hair examiners. These are interim results as of March 2015, published in April 2015.
  - id: hair-pulitzer-carrier
    sourceId: pulitzer-wapo-hair
    relation: documents
    target: {scope: episode, episodeId: united-states-1973-1999, aspect: carrier}
    locator: "Spencer S. Hsu, FBI lab’s woes cast growing shadow (December 23, 2012), sections on state/local hair matches and federal training; paragraphs on 1973, Hal Deadman and the FBI Academy in Quantico."
    note: >-
      Documents that the FBI Laboratory began training state and local hair examiners in 1973 and describes the
      national diffusion and source-attribution assumptions surrounding the practice.
  - id: hair-ojp-mechanism
    sourceId: ojp-hair-manual
    relation: documents
    target: {scope: episode, episodeId: united-states-1973-1999, aspect: mechanism}
    locator: "Linked 1977 manual, foreword; printed p. 24, Conclusions; pp. 41–42, Report Writing and Testimony (OJP digitization NCJ 78957)."
    note: >-
      Official bibliographic record for the FBI-authored 1977 technical manual used to teach microscopic hair
      examination and identification in criminal investigation. The linked manual’s foreword presents
      individualization as an aim, but pp. 24 and 41 expressly deny certain individual identification and p. 41
      gives an optional disclaimer. It does not uniformly teach that microscopy can identify one person with
      certainty.
