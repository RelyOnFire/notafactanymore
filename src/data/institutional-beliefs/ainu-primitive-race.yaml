    note: Primary 1899 law. It grants land to Ainu who engage or wish to engage in agriculture, assigns land and communal-property
      powers to the Hokkaido Government’s governor, and gives the Home Minister authority to issue implementing regulations.
  - title: Physical Anthropology in Japan — The Ainu and the Search for the Origins of the Japanese
