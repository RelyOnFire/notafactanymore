locale: de
entryId: gulf-tonkin-second-attack
sourceReviewedAt: '2026-08-25'
title: Ein zweiter Angriff im Golf von Tonkin
claim: >-
  US-Regierung, Militär und Nachrichtendienste behandelten Meldungen, wonach nordvietnamesische Seestreitkräfte am
  4. August 1964 einen zweiten gezielten Angriff auf die USS Maddox und die USS Turner Joy geführt hätten, als
  bestätigte Tatsache; der Kongress übernahm die Annahme wiederholter Angriffe in die Golf-von-Tonkin-Resolution.
currentUnderstanding: >-
  Am 2. August 1964 griffen nordvietnamesische Torpedoboote die USS Maddox tatsächlich an. Der behauptete zweite Angriff
  am 4. August fand dagegen nicht statt. Radar-, Sonar- und Augenzeugenmeldungen waren in jener Nacht widersprüchlich,
  während fehlgedeutete Fernmeldeaufklärung die Angriffsthese verstärkte. Eine spätere historische Untersuchung der NSA
  kam zu dem Ergebnis, dass die nordvietnamesische Marine lediglich am 2. August beschädigte Boote barg und am
  4. August keinen Angriff führte.
impact:
  summary: >-
    Aus unsicheren Einsatzmeldungen wurde innerhalb weniger Stunden eine folgenreiche staatliche Tatsachenbehauptung.
    Präsident Lyndon Johnson ordnete Vergeltungsangriffe gegen Ziele in Nordvietnam an und verlangte vom Kongress weit
    reichende Vollmachten für Südostasien. Die daraufhin verabschiedete Golf-von-Tonkin-Resolution erklärte, nordvietnamesische
    Marineeinheiten hätten US-Schiffe vorsätzlich und wiederholt angegriffen, und ermächtigte den Präsidenten zu allen
    notwendigen Maßnahmen gegen Angriffe und weitere Aggression. Johnson und später Nixon stützten ihre Militärpolitik
    auf diese Resolution, bis der Kongress sie im Januar 1971 aufhob.
  highlights:
  - value: 88–2
    label: Abstimmung im US-Senat für die Golf-von-Tonkin-Resolution
  - value: 416–0
    label: Abstimmung im US-Repräsentantenhaus für die Golf-von-Tonkin-Resolution
  - value: '1971'
    label: Jahr der Aufhebung der Resolution, die weitreichende Vollmachten für die US-Militärpolitik in Vietnam geschaffen hatte
  context:
  - >-
    Der Angriff vom 2. August 1964 war real. Diese Karte behandelt ausschließlich den behaupteten zweiten Angriff vom
    4. August und darf nicht so zusammengefasst werden, als sei der gesamte Golf-von-Tonkin-Zwischenfall erfunden gewesen.
  - >-
    Die Belege erfordern nicht die Behauptung, Präsident Johnson habe wissentlich einen nicht stattgefundenen Angriff
    erfunden. Die Einsatzlage war in Echtzeit tatsächlich unübersichtlich. Das institutionelle Versagen bestand darin,
    unsichere und fehlgedeutete Hinweise zu einem bestätigten zweiten Angriff zu verdichten und darauf militärisch und
    gesetzgeberisch zu handeln.
  - >-
    Die Episode als politische Grundlage endet mit der Aufhebung der Resolution 1971. Die offizielle Darstellung der NSA
    zum zweiten Zwischenfall bestand länger fort: Robert Hanyoks spätere NSA-Studie hielt fest, dass die Behörde den
    Angriff vom 4. August offiziell vertreten hatte, bevor eine wesentlich breitere Auswertung der Fernmeldeaufklärung
    zu dem Schluss kam, dass kein Angriff stattgefunden hatte.
episodes:
- id: united-states-1964-1971
  polity: Vereinigte Staaten
  institutions:
  - Exekutivbüro des Präsidenten
