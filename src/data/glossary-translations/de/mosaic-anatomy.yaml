entryId: mosaic-anatomy
sourceReviewedAt: '2026-08-21'
term: Mosaikanatomie
aliases:
- Merkmalsmosaik
- mosaikartige Anatomie
shortDefinition: Eine Kombination ursprünglicher und stärker abgeleiteter anatomischer Merkmale im selben Organismus
  oder Fossil.
longDefinition: Mosaikanatomie bezeichnet Organismen, die Merkmale unterschiedlicher evolutionärer Entwicklungsstufen
  kombinieren, statt einfach vollständig „ursprünglich“ oder „modern“ zu sein. Bei frühen Homo-sapiens-Fossilien können
  etwa relativ moderne Gesichtsmerkmale zusammen mit einem archaischeren Hirnschädel auftreten. Solche Kombinationen
  zeigen, dass verschiedene anatomische Systeme sich mit unterschiedlichen Geschwindigkeiten verändern können.
