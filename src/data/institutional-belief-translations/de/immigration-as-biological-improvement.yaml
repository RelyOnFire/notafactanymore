locale: de
entryId: immigration-as-biological-improvement
sourceReviewedAt: 2026-08-22
title: Einwanderung als biologische Verbesserung
claim: Einwanderer wurden anhand rassischer, erblicher und nationaler Merkmale danach eingestuft, ob sie den biologischen und „ethnischen“ Zustand der Nation verbessern oder gefährden würden.
currentUnderstanding: Nationale Herkunft, Ethnizität und gesellschaftlich definierte „Rasse“ bestimmen weder den erblichen Wert eines Menschen noch, ob seine Nachkommen ein Land biologisch „verbessern“. Genetische Variation teilt Bevölkerungen nicht in höher- und minderwertige nationale Bestände ein; soziale, intellektuelle oder moralische Eigenschaften lassen sich nicht mit den eugenischen Kategorien solcher Einwanderungspolitik bewerten.
episodes:
  - id: colombia-1922-1940
    polity: Kolumbien
    summary: Das kolumbianische Einwanderungsgesetz von 1922 verknüpfte Einwanderung ausdrücklich mit der Verbesserung der körperlichen und moralischen „ethnischen Bedingungen“ des Landes und erlaubte den Ausschluss von Menschen, die für die rassische Entwicklung der Nation als unerwünscht galten. In den 1920er- und 1930er-Jahren nutzten Behörden diesen eugenischen und rassistischen Rahmen unter anderem zur Beschränkung afrokaribischer Migranten und jüdischer Flüchtlinge.
    consequences:
      - Rassische Auswahl von Einwanderern
      - Ausschluss afrokaribischer Migranten
      - Beschränkung jüdischer Flüchtlinge
