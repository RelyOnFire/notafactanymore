entryId: exon
sourceReviewedAt: '2026-08-21'
term: Exon
aliases:
- Exons
shortDefinition: Ein Abschnitt der ersten RNA-Kopie eines Gens, der erhalten bleibt, wenn beim RNA-Spleißen Introns entfernt
  werden.
longDefinition: Bei einem geteilten Gen sind Exons die Abschnitte, die nach dem Entfernen der dazwischenliegenden Introns
  in der reifen RNA erhalten bleiben. Durch alternatives Spleißen können Exons unterschiedlich kombiniert werden, sodass ein
  Gen mehrere RNA-Produkte hervorbringen kann.
