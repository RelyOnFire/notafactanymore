locale: de
entryId: equilibrium-climate-sensitivity
sourceReviewedAt: '2026-08-21'
term: Gleichgewichts-Klimasensitivität
aliases:
- ECS
- Klimasensitivität
shortDefinition: Die langfristige globale Erwärmung, die nach einer Verdopplung des atmosphärischen Kohlendioxids erwartet
  wird, nachdem sich das Klimasystem weitgehend angepasst hat.
longDefinition: Die Gleichgewichts-Klimasensitivität oder ECS ist die Änderung der globalen mittleren Oberflächentemperatur
  nach einer anhaltenden Verdopplung des atmosphärischen CO₂, sobald sich das Klima einem Gleichgewicht angenähert hat.
  Sie umfasst schnelle Klimarückkopplungen etwa durch Wasserdampf, Wolken, Meereis und den vertikalen Temperaturverlauf;
  sehr langsame Reaktionen wie große Veränderungen von Eisschilden werden üblicherweise getrennt behandelt.
