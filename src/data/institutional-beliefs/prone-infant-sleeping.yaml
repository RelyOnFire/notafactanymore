title: Prone infant sleeping
claim: Healthy infants were advised to sleep prone, or on their stomachs, because the position was treated as safe or preferable, including from concern that babies sleeping on their backs might aspirate vomit.
currentUnderstanding: For healthy infants, prone sleep substantially increases the risk of sudden infant death syndrome and other sleep-related infant deaths. Supine sleep is recommended for routine infant sleep; placing healthy infants on their backs does not produce the feared increase in fatal aspiration.
category: Pediatrics and public health
reviewedAt: 2026-08-22
episodes:
  - id: australia-1970-1991
    polity: Australia
    region: Oceania
    startYear: 1970
    endYear: 1991
    strength: institutionally-influential
    institutionTypes: [medical, professional, education]
    institutions:
      - Pediatric and maternal-child health professionals
      - Hospitals and infant-care services
      - Health-education advice to parents
    consequences:
      - Widespread prone sleeping among healthy infants
      - Increased exposure to SIDS risk
      - Delayed reversal of infant-sleep advice
    summary: During the 1970s and 1980s, prone sleeping became increasingly common among healthy Australian infants as health professionals and infant-care literature repeated advice that had not been scientifically tested. Evidence linking prone sleep to SIDS accumulated, but sleeping position was not initially accepted by the medical community as a causal risk factor. Australian research prompted a national reversal in 1991, when health campaigns and the NHMRC advised that healthy babies generally should not sleep prone.
    sources:
      - title: A safer infant sleeping position
        url: https://www.nhmrc.gov.au/about-us/resources/impact-case-studies/safer-sleeping
        publisher: National Health and Medical Research Council
        note: Describes the rise of prone sleeping from the late 1960s and 1970s because of untested advice, the medical community's delayed acceptance of risk, and Australia's 1991 national recommendation against prone sleep.
      - title: "Infant sleeping position and the sudden infant death syndrome: systematic review of observational studies and historical review of recommendations from 1940 to 2002"
        url: https://pubmed.ncbi.nlm.nih.gov/15843394/
        publisher: International Journal of Epidemiology
        note: Finds that prone sleeping was recommended for decades on the basis of untested theory even though pooled evidence showed significantly increased SIDS risk by 1970.
  - id: east-germany-1971-1972
    polity: East Germany
    region: Eastern Europe
    startYear: 1971
    endYear: 1972
    strength: officially-endorsed
    institutionTypes: [government, medical, education]
    institutions:
      - Pediatric services of the German Democratic Republic
      - State day-care health system
      - Ministry of Health
    consequences:
      - Prone placement of infants in state day care
      - Preventable infant deaths
      - Rapid reversal of official child-care guidance
    summary: Pediatricians in East Germany followed the international recommendation that infants sleep prone, and the practice was used in the state day-care system. After seven infants died while sleeping prone in day care in 1971, the Ministry of Health reviewed the deaths and in June 1972 issued guidelines sharply restricting prone positioning during sleep and limiting it to supervised exercise while awake.
    sources:
      - title: Prevention of sudden infant death syndrome due to an active health monitoring system 20 years prior to the public “Back to Sleep” campaigns
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2065993/
        publisher: Archives of Disease in Childhood
        note: Reconstructs East Germany's prone-sleep recommendation, the seven 1971 day-care deaths, and the Ministry of Health's June 1972 reversal.
