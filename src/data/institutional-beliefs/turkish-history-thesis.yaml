schemaVersion: 2
title: Turkish History Thesis
proposition:
  summary: >-
    Early Republican Turkish institutions treated Turks as an ancient white, brachycephalic or “Alpine” race whose
    ancestors migrated from Central Asia and created or decisively shaped many of the world's earliest civilizations.
correction:
  summary: >-
    Human biological variation does not divide people into discrete “Alpine,” “Caucasoid” or other continental races.
    Modern populations in Turkey show extensive variation and admixture, while ancient DNA from Anatolia records both
    substantial local continuity and incoming ancestries. Neither skull measurements nor a modern national identity can
    establish that Sumerians, Hittites, Egyptians, Chinese or other ancient peoples belonged to one modern ethnic or
    racial nation.
category: Race, anthropology and historiography
reviewedAt: '2026-08-23'
impact:
  summary: >-
    From 1931 through 1941, the four-volume Tarih series published by the Ministry of Education carried the thesis into
    high-school history, while state-sponsored congresses in 1932 and 1937 promoted it as a research programme. A second
    arm of the programme gathered 64,000 anthropometric forms in 1937. After incomplete or incorrectly completed forms
    were excluded, the General Directorate of Statistics calculated results for 59,728 people. Those measurements fed a
    1939 dissertation and a 1940 Turkish Historical Society publication that used physical classification to support the
    thesis's racial and civilizational claims.
  highlights:
    - value: '4'
      label: volumes in the official high-school history series
      note: The series was used from 1931 through 1941; publication and use do not establish that every teacher or student accepted its claims.
    - value: '2'
      label: state-sponsored Turkish History Congresses held during the episode
      note: The first two congresses met in 1932 and 1937.
    - value: '59,728'
      label: usable individual records in the anthropometric calculations
      note: Field teams collected 64,000 forms; incomplete or incorrectly completed forms were removed before calculation.
  context:
    - >-
      The thesis answered European depictions of Turks as a supposedly inferior, non-white and civilization-destroying
      people and formed part of an early Republican nation-building project. That context explains its institutional
      appeal without validating its racial categories or historical conclusions.
    - >-
      The survey's 64,000 collected forms and 59,728 analyzed records are measures of administrative reach. They are not
      estimates of how many people believed the thesis, and the present evidence does not support a numerical estimate of
      its social harm.
    - >-
      Genetic ancestry, language, culture and political identity are different kinds of evidence. Modern and ancient DNA
      can disprove a model of pure, fixed races, but genetic similarity by itself does not assign an ancient civilization
      to a modern nation.
    - >-
      After Atatürk's death, new textbooks abandoned the strongest claim that Turks were the source of every civilization.
      The Turkish-centered organization of history remained influential, so the curriculum change was substantial but
      incomplete rather than a full institutional repudiation.
episodes:
  - id: turkey-curriculum-1930-1941
    polity: Turkey
    region: Middle East
    startYear: 1930
    endYear: 1941
    periodLabel: 1930–1941
    strength: policy-basis
    institutionTypes:
      - government
      - academy
      - education
    institutions:
      - Türk Tarihini Tetkik Heyeti / Türk Tarihi Tetkik Cemiyeti / Türk Tarih Kurumu
      - Maarif Vekâleti (Ministry of Education)
    institutionalContext: >-
      A sixteen-member history committee formed within the Türk Ocakları in 1930 and produced Türk Tarihinin Ana Hatları.
      Reconstituted in 1931 as the Türk Tarihi Tetkik Cemiyeti and renamed Türk Tarih Kurumu in 1935, the body prepared the
      four-volume Tarih series that the Ministry of Education published for secondary schools. A condensed outline also
      entered middle-school teaching. The state-sponsored history congresses of 1932 and 1937 supplied prominent forums
      for the thesis, but the named society and ministry are the formal carriers recorded here.
    consequences:
      - The four-volume Tarih series made the thesis an official high-school history framework from 1931 through 1941
      - A condensed version of Türk Tarihinin Ana Hatları was distributed for middle-school teaching
      - State-sponsored congresses promoted the thesis and organized historical and anthropological work around it
      - Textbooks recast numerous ancient civilizations as creations of migrating Central Asian Turks
      - Racial typology became part of an official account of national origins and civilizational legitimacy
    summary: >-
      The Turkish Historical Society and the Ministry of Education converted a nation-building thesis into curriculum.
      Official textbooks described white, brachycephalic Central Asian Turks as founders of civilizations across Asia,
      Africa, Anatolia and Europe, and the first two Turkish History Congresses promoted the same framework. Contemporary
      criticism existed, but official teaching treated the thesis as a basis for organizing historical evidence.
    mechanism:
      kind: education
      summary: >-
        The historical society wrote the core texts, the Ministry of Education published and distributed them, and
        state-sponsored congresses reinforced their premises as a programme for teaching and research.
    institutionalCorrection:
      status: partial
      periodLabel: 1942 onward
      action: New Ministry of Education textbooks introduced in 1942 abandoned the claim that Turks were the source of all civilizations and reduced the earlier emphasis on Turkish origins in ancient history.
      summary: >-
        The post-Atatürk curriculum moved toward a humanist account and dropped the thesis's most expansive universal
        claims. It did not issue a comprehensive retraction, and a Turkish-centered historical framework continued in
        modified form, so the change is classified as a partial institutional correction.
  - id: turkey-anthropometry-1937-1940
    polity: Turkey
    region: Middle East
    startYear: 1937
    endYear: 1940
    periodLabel: 1937–1940
    strength: officially-endorsed
    institutionTypes:
      - government
      - medical
      - academy
    institutions:
      - Sıhhat ve İçtimaî Muavenet Vekâleti (Ministry of Health and Social Assistance)
      - İstatistik Umum Müdürlüğü (General Directorate of Statistics)
      - Türk Tarih Kurumu (Turkish Historical Society)
    institutionalContext: >-
      The health ministry financed and organized field teams of civilian and military doctors, health staff and physical-
      education teachers for a nationwide survey from 19 June through 31 December 1937. The teams collected 64,000 forms;
      the statistics administration created a dedicated processing operation and calculated 59,728 usable records after
      exclusions. Afet İnan used the results in her 1939 Geneva dissertation and a 1940 article in the Turkish Historical
      Society's Belleten. She and other researchers shaped the interpretation, but the state ministries and society are
      listed because they supplied the administrative machinery and institutional publication channel.
    consequences:
      - Government personnel collected standardized bodily and demographic measurements across ten survey regions
      - The statistics administration classified and calculated 59,728 usable individual records
      - Survey results were used to portray the population of Turkey as predominantly white and “Alpine”
      - Anthropometric classifications were presented as evidence for the Turkish History Thesis
      - State-backed measurement gave a racial national narrative the appearance of quantitative scientific confirmation
    summary: >-
      The 1937 anthropometric survey turned the thesis's racial premise into a nationwide classification project. Health,
      education and military personnel collected the measurements, the statistics administration processed them, and the
      resulting publications claimed that the findings confirmed a white “Alpine” Turkish race and the thesis's account
      of Central Asian civilization. The corrected total distinguishes 64,000 collected forms from 59,728 analyzed records.
    mechanism:
      kind: classification
      summary: >-
        Ministries deployed trained field teams to record standardized physical traits, and the statistics administration
        converted the forms into racial tables that were then interpreted and published as confirmation of the national
        history thesis.
    institutionalCorrection:
      status: undocumented
      summary: >-
        Modern biological anthropology and population genetics reject the survey's typological racial inference. The
        current evidence record does not identify a dated act by the health ministry, statistics administration or Turkish
        Historical Society formally retracting the proposition or acknowledging the survey's methodological failure.
