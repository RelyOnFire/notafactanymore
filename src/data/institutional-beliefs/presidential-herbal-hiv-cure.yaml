schemaVersion: 2
title: Presidential herbal treatment as an HIV/AIDS cure
proposition:
  summary: >-
    President Yahya Jammeh's herbal preparations were treated by The Gambia's state-run President's Alternative
    Treatment Programme as capable of eliminating HIV within days, justifying the withdrawal of antiretroviral therapy
    and official declarations that enrolled people had been cured.
correction:
  summary: >-
    No clinical trials, regulatory review or reliable diagnostic evidence established that Jammeh's preparations
    eliminated HIV. A rise in CD4 cells or a low or undetectable viral load does not demonstrate eradication. Current
    antiretroviral therapy suppresses HIV replication but does not cure the infection, and interrupting treatment can
    cause viral rebound, immune decompensation and clinical progression. WHO warned in February 2007 that herbal
    remedies must not replace comprehensive HIV care or cause antiretroviral therapy to be discontinued.
category: Medicine and public health
reviewedAt: '2026-10-03'
impact:
  summary: >-
    The Gambia converted a president's personal cure claim into a coercive state programme. The presidency, health
    officials, public hospitals and laboratories, security personnel and the state broadcaster helped operate or
    legitimize PATP. The first group was enrolled without consent; later participants who entered willingly were not
    adequately informed of the risks. Participants were ordered to stop antiretroviral treatment, some were confined
    under guard, and identifying medical information was broadcast without consent. The later truth commission found
    deterioration, deaths and extensive human-rights violations. Its 2021 report and the government's 2022 White Paper
    supplied a formal institutional repudiation.
  highlights:
    - value: '2007'
      label: year Jammeh proclaimed a rapid HIV/AIDS cure and established PATP
    - value: 3 days
      label: duration initially claimed for eliminating HIV from participants
    - value: 25 May 2022
      label: date the government White Paper accepted central PATP accountability and health-system recommendations
  context:
    - >-
      The disputed proposition concerns Jammeh's undisclosed preparations and the state programme's HIV-cure claim. It
      does not imply that every traditional or plant-derived medicine is ineffective; individual products still require
      evidence of safety, quality and efficacy for the use claimed.
    - >-
      Coercion was not identical for every participant. The truth commission found that the first group was forced into
      PATP without consent, while later groups included people who joined willingly but were not adequately informed of
      the risks and could then face compulsory treatment, isolation and restrictions on leaving.
    - >-
      The programme ended amid Jammeh's December 2016 election defeat. That political endpoint was followed by national
      ART guidance and, later, an explicit truth-commission and government correction; it was not the date of a new
      experiment disproving the preparations.
episodes:
  - id: gambia-2007-2016
    polity: The Gambia
    region: West Africa
    startYear: 2007
    endYear: 2016
    strength: enforced-doctrine
    institutionTypes:
      - government
      - medical
    institutions:
      - Office of the President of The Gambia
      - President’s Alternative Treatment Programme (PATP)
      - Ministry of Health and Social Welfare
      - Gambia Radio and Television Services (GRTS)
    institutionalContext: >-
      Jammeh announced the cure as head of state and created PATP around the presidency. The programme used public
      hospitals, clinicians, nurses and laboratory personnel; Dr Tamsir Mbowe directed its clinical work and endorsed
      the cure. State security guarded participants, while GRTS aired promotional programmes and participant testimony
      on television and radio. The programme operated from 2007 until Jammeh lost the December 2016 election.
    consequences:
      - Compulsory enrolment of the first participant group and inadequate informed consent for later groups
      - Withdrawal of life-preserving antiretroviral therapy, followed by deterioration and deaths documented by the truth commission
      - Guarded confinement, restricted movement and separation from family and friends
      - Disclosure of participants' identities, HIV status and test results on national television without consent
      - Cruel and degrading treatment, including sexual abuse of some participants, forced labour and the admission of children
      - Diversion of public-health resources and use of hospitals, laboratories and medical authority to validate an untested treatment
    summary: >-
      From 2007 to 2016, Jammeh used presidential authority to turn an untested and undisclosed set of herbal preparations
      into a state HIV programme. PATP ordered participants off ART, used conventional medical settings and staff to make
      the treatment appear valid, restricted participants' liberty and promoted cure declarations through state media.
      The TRRC later found that no clinical trials or approval supported the three-, five- or ten-day cure claims and
      documented grave health and human-rights harms.
    mechanism:
      kind: administrative-adoption
      summary: >-
        The presidency created a treatment programme, enlisted health personnel and laboratories, enforced its rules
        through state officials and security personnel, and used the national broadcaster to present the cure as a
        medically validated state service.
    institutionalCorrection:
      status: corrected
      periodLabel: 2021–2022
      action: >-
        The TRRC formally found the cure claim fraudulent and the programme abusive; the government White Paper accepted
        the central recommendations on accountability, professional discipline, herbal-product regulation and access to HIV care.
      summary: >-
        Evidence-based ART had again become the stated national standard before the formal reckoning. In 2021 the TRRC
        documented the false claim, state machinery and harms in a dedicated report. In 2022 the government adopted that
        account and accepted the principal PATP recommendations, while requesting further investigation rather than
        immediately accepting the commission's proposed murder charge. Implementation and individual prosecutions are
        separate from the completed institutional correction of the cure claim.
