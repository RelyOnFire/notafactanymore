  - id: ringworm-nii-institutional-correction
    sourceId: ringworm-nii-compensation
    relation: documents
    target: {scope: episode, episodeId: israel-1949-1960, aspect: institutional-correction}
    locator: >-
      Opening eligibility paragraph (effective 1 January 1995; covered treatment in 1946–1960), followed by the
      Ministry of Health entitlement and National Insurance Institute payment paragraphs.
    note: >-
      The official service records compensation from 1 January 1995 for eligible patients or their survivors with
      specified illnesses following covered irradiation. The Ministry of Health determines entitlement and the
      National Insurance Institute pays. This documents recognition of defined radiation injuries under statutory
      conditions, without establishing universal redress or an admission of negligence.
