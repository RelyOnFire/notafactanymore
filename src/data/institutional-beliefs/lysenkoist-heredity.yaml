        publisher: Nature
        note: Contemporary 1948 account describing dismissals, laboratory closures, and removal of orthodox geneticists after the Academy decree.
      - title: "The pushback against state interference in science: how Lysenkoism tried to suppress Genetics and how it was eventually defeated"
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8664584/
        publisher: Genetics
        note: Historical review of state support for Lysenkoism, suppression of genetics, and rehabilitation after the Khrushchev era.
