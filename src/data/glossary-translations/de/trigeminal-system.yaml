entryId: trigeminal-system
sourceReviewedAt: '2026-08-21'
term: Trigeminussystem
aliases:
- Trigeminus-System
shortDefinition: Das sensorische Nervensystem rund um den Trigeminusnerv, das Signale aus großen Teilen von Gesicht,
  Kopf und den Geweben um das Gehirn weiterleitet.
longDefinition: Zum Trigeminussystem gehören der Trigeminusnerv und verbundene Hirnwege, die Empfindungen aus Gesicht,
  Kopfhaut, Schädelgefäßen und den schützenden Hirnhäuten verarbeiten. Es ist ein wichtiger Teil des Schmerzsignalsystems
  bei Migräne.
