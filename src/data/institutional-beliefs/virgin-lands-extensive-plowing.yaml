  institutionalContext: The Virgin Lands campaign was established and repeatedly expanded through formal central decisions
    rather than by an entity called a “Virgin Lands state-farm system.” The CPSU Central Committee Plenum adopted the foundational
    2 March 1954 resolution, and the CPSU Central Committee and USSR Council of Ministers issued joint resolutions later that
    year to expand the programme. Implementation then ran through the Kazakh party and republican administration, state farms,
    machine-tractor stations and local agricultural organizations; those operational layers are described here rather than
    treated as one institution.
  consequences:
  - Large-scale conversion of steppe to cropland
  - Declining soil fertility
  - Wind erosion and dust storms
  - Volatile grain production
  summary: Khrushchev’s Virgin Lands campaign was launched through a March 1954 CPSU Central Committee Plenum resolution and
    expanded through joint CPSU Central Committee and USSR Council of Ministers decisions. It rapidly converted enormous areas
    of Kazakhstan’s steppe to grain production. Early harvests encouraged continued expansion, but political pressure to maximize
    acreage reduced fallow and imported farming practices poorly suited to dry, fragile soils. By the early 1960s fertility
    was declining, erosion was severe, and the 1963 crop failure exposed the limits of the strategy.
