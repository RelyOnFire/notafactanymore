schemaVersion: 2
locale: de
entryId: marrist-linguistics
sourceReviewedAt: '2026-09-07'
title: Marristische Linguistik
proposition:
  summary: >-
    Sprachen wurden als Produkte universeller, klassenbedingter Entwicklungsstufen behandelt und nicht in erster Linie als
    Mitglieder historisch entstandener Sprachfamilien; die traditionelle vergleichende Sprachwissenschaft galt damit als
    „bürgerlich“ oder wissenschaftlich überholt.
correction:
  summary: >-
    Sprachen verändern sich durch historisch nachvollziehbare Abstammung, Sprachkontakt, Entlehnung, Innovation und
    gesellschaftlichen Gebrauch. Die vergleichende Linguistik kann genealogische Beziehungen zwischen verwandten Sprachen
    rekonstruieren; Sprachen durchlaufen keine universelle Abfolge klassenbestimmter Entwicklungsstufen.
episodes:
  - id: soviet-union-1930-1950
    polity: Sowjetunion
    periodLabel: ca. 1930–1950
    institutions:
      - Institut für Sprache und Denken der Akademie der Wissenschaften der UdSSR
      - Akademie der Wissenschaften der UdSSR
    institutionalContext: >-
      Das Institut für Sprache und Denken erhielt 1931 durch Umbenennung des Japhetischen Instituts seinen Namen. Es war
      das wichtigste institutionelle Zentrum des Marrismus innerhalb der Akademie der Wissenschaften. Zu seinen Abteilungen gehörten
      Forschung, Bildung und Propaganda; von 1932 bis 1949 veröffentlichte es seine Proceedings. Die Resolution der
      Akademie vom 21. Juli 1949 kritisierte vergleichende Forschung und die Erforschung von Ursprachen und benannte
      Sprachwissenschaftler, denen bürgerlicher Einfluss vorgeworfen wurde. Die Autorität der Doktrin wirkte über
      Forschungs-, Lehr- und Publikationsstrukturen der Akademie. Sowjetische Ansätze zum Verhältnis von Sprache und
      Gesellschaft waren vielfältiger als der Marrismus allein.
    summary: >-
      Ab etwa 1930 wurde Nikolai Marrs „Neue Lehre von der Sprache“ zum offiziell anerkannten Rahmen, der die sowjetische
      Linguistik dominierte. Traditionelle vergleichende und indogermanische Sprachwissenschaft wurde als „bürgerlich“
      angegriffen; erhebliche Abweichungen von den marristischen Grundlagen wurden stark unterdrückt. Am 20. Juni 1950
      verwarf Stalin den Marrismus öffentlich. Anschließend setzte die Akademie die Institutsleitung ab und vereinigte das
      Institut mit dem Institut für russische Sprache zum Institut für Sprachwissenschaft. Die offizielle Stellung der
      Doktrin wurde durch politische und administrative Eingriffe aufgehoben.
    consequences:
      - Konkurrierende historisch-vergleichende Schulen wurden unterdrückt oder marginalisiert
      - Forschungsvorgaben der Akademie und empfohlene Lehrtexte förderten den Marrismus
      - Forschende, die erheblich von marristischen Grundlagen abwichen, konnten institutionell marginalisiert oder unterdrückt werden
    mechanism:
      summary: >-
        Resolutionen der Akademie verliehen marristischen Positionen institutionelle Autorität über die Forschung und
        marginalisierten konkurrierende historisch-vergleichende Arbeit. Forschungsleitung, Stellenbesetzungen und
        empfohlene Lehrtexte trugen zum Fortbestand der Doktrin bei; bei ihrer eigenen Kehrtwende von 1950 beschrieb die
        Akademie die Unterdrückung von Kritik und die Entfernung von Kritikern aus ihren Positionen.
    institutionalCorrection:
      periodLabel: Juni–Oktober 1950
      action: >-
        Nach Stalins öffentlicher Zurückweisung vom 20. Juni setzte das Akademiepräsidium am 1. Juli die Institutsleitung
        ab und beantragte eine Zusammenlegung. Die Regierung genehmigte die Reorganisation am 3. Juli; am 6. Oktober
        bestätigte das Präsidium die Bildung des Instituts für Sprachwissenschaft aus den vereinigten Instituten.
      summary: >-
        Dieselbe Akademie, die 1949 vergleichende Forschung und die Erforschung von Ursprachen angegriffen hatte, setzte
        1950 marristische Führungspersonen ab und reorganisierte ihre sprachwissenschaftlichen Institute. Dieser Wechsel
        der offiziellen Doktrin beendete die privilegierte institutionelle Stellung des Marrismus.
evidence:
  - id: marr-school-proposition
    note: >-
      Zeitgenössische fachwissenschaftliche Darstellung, wonach die sowjetische Linguistik von etwa 1930 bis 1950 von der
      offiziell anerkannten marristischen Theorie beherrscht wurde und erhebliche Abweichungen stark unterdrückt wurden.
      Der öffentliche Auszug belegt die offizielle Anerkennung; den Inhalt der klassenbezogenen Stufentheorie erläutert
      Yakubovichs Analyse.
  - id: marr-analysis-proposition
    note: >-
      Yakubovich beschreibt, wie Marr genealogische Sprachfamilien durch Stufen eines einheitlichen sprachlichen Prozesses
      ersetzte und diese Stufen uneinheitlich mit sozioökonomischen Formationen verknüpfte. Er erläutert auch die
      Darstellung der Doktrin als marxistische Alternative zur angeblich bürgerlichen vergleichenden Sprachwissenschaft.
  - id: marr-language-change-correction
    note: >-
      Die LSA-Darstellung beschreibt Sprachwandel durch veränderte Bedürfnisse der Sprechenden, soziale Interaktion,
      Innovation, Entlehnung sowie Veränderungen von Wortstellung und Aussprache. Sie stützt die Erklärung von
      Sprachwandel und gesellschaftlichem Gebrauch, ohne diese Prozesse mit einer universellen Abfolge klassenbestimmter
      Stufen gleichzusetzen.
  - id: marr-comparative-correction
    note: >-
      Erläutert historische Belege und die Rekonstruktion gemeinsamer Vorläufersprachen aus verwandten Sprachen und mahnt,
      ererbte Kognaten von Entlehnungen zu unterscheiden. Dies stützt genealogische Beziehungen zwischen verwandten
      Sprachen, ohne vorauszusetzen, dass Beziehungen zwischen verschiedenen Sprachfamilien durchweg nachgewiesen seien.
  - id: marr-analysis-correction
    note: >-
      Erläutert, dass Marr weder die vergleichende Methode widerlegte noch eine Ersatzmethode formal begründete. Dies
      stützt die Zurückweisung seines Stufenschemas als gesicherte Erklärung der Sprachgeschichte. Das im Eintrag genannte
      Datum 20. Juli für Stalins Eingriff widerspricht dem 20. Juni 1950 im Primärtext; für die institutionelle Chronologie
      wird das Datum des Primärtexts verwendet.
  - id: marr-school-correction
    note: >-
      Zeitgenössische fachwissenschaftliche Darstellung, wonach die sowjetische Linguistik von etwa 1930 bis 1950 von der
      offiziell anerkannten marristischen Theorie beherrscht wurde und erhebliche Abweichungen stark unterdrückt wurden.
      Ihr letzter Satz dokumentiert Stalins Zurückweisung von 1950 und die Auflösung der Gruppe von Marrs Anhängern. Dies
      belegt die offizielle Kehrtwende.
  - id: marr-institute-carrier
    note: >-
      Institutionengeschichte des von Marr gegründeten, 1931 in Institut für Sprache und Denken umbenannten Instituts,
      das von Marr und anschließend Iwan Meschtschaninow geleitet und nach der Zurückweisung des Marrismus 1950 in das
      neue Institut für Sprachwissenschaft eingegliedert wurde. Der Eintrag belegt die institutionelle Abfolge und die
      Zusammenlegung; die Zurückweisung ist gesondert dokumentiert.
  - id: marr-academy-carrier
    note: >-
      Gibt die Kritik des Präsidiums an Versuchen wieder, vergleichende Methoden und Ursprachenforschung zu rehabilitieren,
      benennt Sprachwissenschaftler, denen bürgerlicher Einfluss vorgeworfen wurde, und dokumentiert Anweisungen zur
      Veränderung der sprachwissenschaftlichen Arbeit der Akademie. Damit ist eine Handlung der Akademie zur Stützung
      der Doktrin belegt, die über ihre bloße Nennung als übergeordnete Körperschaft des Instituts hinausgeht.
  - id: marr-politics-context
    note: >-
      Historische Untersuchung des politischen und institutionellen Aufstiegs von Marrs vermeintlich marxistischer
      Linguistik gegenüber der traditionellen vergleichenden Sprachwissenschaft. Die eingesehenen öffentlichen Auszüge
      unterscheiden Marrismus auch von anderen sowjetischen Ansätzen zu Sprache und Gesellschaft. Sie liefern politischen
      und wissenschaftsgeschichtlichen Kontext; die konkreten institutionellen Kontrollen dokumentieren die
      Akademieresolutionen.
  - id: marr-academy-mechanism
    note: >-
      Die Resolution von 1949 verlangte Kritik an vergleichender Forschung und Ursprachenforschung. Im Juli 1950
      beschrieb das Präsidium Stellenbesetzungen nach Zugehörigkeit zu Marrs Schule und die Entfernung von Kritikern aus
      ihren Positionen. Diese Dokumente belegen den Einsatz administrativer Autorität zur Einschränkung
      sprachwissenschaftlicher Arbeit, einschließlich der Darstellung der Akademie bei ihrer eigenen Kehrtwende.
  - id: marr-school-consequences
    note: >-
      Der Auszug dokumentiert die Unterdrückung erheblicher Abweichungen von marristischen Grundlagen und stützt die erste
      und dritte Folge auf dieser allgemeinen Ebene. Die konkreteren Forschungs- und Lehrvorgaben belegen die
      Akademieresolutionen und der zeitgenössische Text der Zurückweisung.
  - id: marr-academy-consequences
    note: >-
      Die Resolution von 1949 unterzog namentlich genannte Sprachwissenschaftler ideologischer Kritik und forderte
      Veränderungen der Akademieforschung. Die Resolution von 1950 beschrieb empfohlene marristische Lehrtexte und die
      Entfernung von Kritikern. Diese Passagen stützen die in der zweiten Folge benannte Förderung in Forschung und Lehre
      sowie institutionellen Druck auf konkurrierende Arbeiten und Forschende.
  - id: marr-stalin-teaching-consequences
    note: >-
      Im Zuge der politischen Zurückweisung beschrieb Stalin die erneute Veröffentlichung von Marrs Baku-Kurs und seine
      Empfehlung als Lehrbuch für Studierende. Dies ist eine zeitgenössische Darstellung der in der zweiten
      Folge benannten Förderung in der Lehre, ausdrücklich zugeordnet zu dem Eingriff, der die offizielle Stellung der
      Doktrin beendete.
  - id: marr-institute-context
    note: >-
      Datiert die Ursprünge des Instituts auf 1921 und seine Umbenennung auf 1931, beschreibt seine Abteilungen für
      Forschung, Bildung und Propaganda und dokumentiert seine Proceedings von 1932 bis 1949. Der ungefähre Beginn der
      Episode um 1930 betrifft die Vorherrschaft des Marrismus, nicht die erstmalige Verwendung des späteren Institutsnamens.
  - id: marr-institute-correction
    note: >-
      Dokumentiert die Vereinigung des Instituts für Sprache und Denken mit dem Institut für russische Sprache zum
      Institut für Sprachwissenschaft der Akademie im Jahr 1950. Dies belegt die institutionelle Zusammenlegung; die
      datierten Personal- und Regierungsentscheidungen dokumentiert die Chronologie des Akademiearchivs.
  - id: marr-stalin-correction
    note: >-
      Stalin forderte ausdrücklich die Zurückweisung von Marrs Theorien und kritisierte dessen Ablehnung
      historisch-vergleichender Arbeit. Der Text dokumentiert die öffentliche politische Zurückweisung vom 20. Juni 1950;
      er dient nicht als wissenschaftliche Grundlage der heutigen linguistischen Korrektur.
  - id: marr-academy-correction
    note: >-
      Dokumentiert die Absetzung von Meschtschaninow und Serdjutschenko aus der Institutsleitung durch das Präsidium,
      dessen Antrag auf Zusammenlegung und die Bestätigung der Reorganisation im Oktober auf Grundlage der
      Regierungsanordnung vom Juli. Dies sind konkrete Handlungen des Institutionensystems, das zuvor den Marrismus
      gestützt hatte, und sie belegen das Ende seiner privilegierten offiziellen Stellung.
