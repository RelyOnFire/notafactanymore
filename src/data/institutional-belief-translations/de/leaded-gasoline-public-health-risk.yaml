sourceReviewedAt: '2026-08-26'
title: Verbleites Benzin als vertretbares Gesundheitsrisiko
claim: Die Verwendung von Tetraethylblei in handelsüblichem Benzin galt bei den damals vorgesehenen Konzentrationen als kein hinreichender Grund für ein Verbot, sofern Herstellung, Vertrieb und Verwendung angemessen kontrolliert würden.
currentUnderstanding: Blei ist ein kumulatives Gift, und seine Verbreitung über Autoabgase schuf einen bedeutenden Expositionsweg für die gesamte Bevölkerung. Für Kinder wurde kein sicherer Blutbleispiegel festgestellt; die US-Behörden schrieben schließlich aus Gründen des Gesundheitsschutzes eine schrittweise Verringerung des Bleigehalts im Benzin vor.
episodes:
- id: united-states-1926-1973
  polity: Vereinigte Staaten
  institutionalContext: Nach tödlichen Vergiftungen bei der frühen Herstellung von Tetraethylblei ließ der Surgeon General die Gefahren des Vertriebs und der allgemeinen Verwendung untersuchen. Public Health Bulletin No. 163 kam 1926 zu dem Schluss, dass es nach damaligem Kenntnisstand keinen ausreichenden Grund gebe, Ethylbenzin zu verbieten, sofern Vertrieb und Verwendung durch geeignete Vorschriften kontrolliert würden. Zugleich betonte der Ausschuss, dass die Untersuchung kurz gewesen sei, eine massenhafte Verwendung andere Bedingungen schaffen könne und weitere Forschung unverzichtbar sei. Die bundesweiten Vorgaben blieben dennoch jahrzehntelang weitgehend freiwillig. Laut der historischen Darstellung der EPA hob der Surgeon General 1958 sogar den freiwilligen Konzentrationsgrenzwert an und erklärte erneut, dies stelle für den durchschnittlichen Amerikaner keine Gefahr dar. Erst 1973 verfügte die EPA aus Gründen des Gesundheitsschutzes verbindliche Reduktionen des Bleigehalts im Benzin.
  summary: Das Bundesurteil von 1926 war enger als die Behauptung, Tetraethylblei sei harmlos. Der vom Surgeon General eingesetzte Ausschuss sah auf Grundlage der damals verfügbaren Daten keinen ausreichenden Grund für ein Verbot unter kontrollierten Bedingungen, warnte jedoch ausdrücklich, dass längere und breitere Exposition Gefahren sichtbar machen könne, die in der kurzen Untersuchung nicht erfasst wurden. Diese bedingte Entwarnung bildete dennoch den institutionellen Rahmen für die weitere Nutzung unter überwiegend freiwilligen Kontrollen. 1973 bewertete die EPA Blei aus Benzin als bedeutende und kontrollierbare Quelle übermäßiger Bevölkerungsbelastung und ordnete zum Schutz der öffentlichen Gesundheit verbindliche Reduktionen an.
  consequences:
  - Landesweite weitere Verwendung von Tetraethylblei in Kraftstoffen unter einem weitgehend freiwilligen bundesweiten Kontrollsystem
  - Jahrzehntelange Bleiemissionen in städtische Luft, Staub und Böden vor verbindlichen gesundheitsbasierten Reduktionen
  - Bleibelastung der Bevölkerung, wobei Kinder besonders anfällig für neurologische Schäden sind
  - Verzögerte bundesweite Reduktion trotz der Forderung des Ausschusses von 1926 nach fortlaufender Langzeituntersuchung
