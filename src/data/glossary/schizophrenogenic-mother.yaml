term: Schizophrenogenic mother
aliases:
- schizophrenogenic mother theory
shortDefinition: A discredited mid-20th-century theory that blamed supposedly cold, controlling, or contradictory maternal
  behavior for causing schizophrenia.
longDefinition: The 'schizophrenogenic mother' was a family-blaming theory influential in parts of mid-20th-century psychiatry.
  It proposed that particular maternal personality or communication patterns could produce schizophrenia in a child.
  Later genetic, developmental, epidemiological, and neuroscience research did not support the theory as a causal model.
relatedTerms:
- double-bind
reviewedAt: '2026-08-21'
sources:
