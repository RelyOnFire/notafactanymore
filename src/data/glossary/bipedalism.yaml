term: Bipedalism
aliases:
- bipedal
- habitual bipedalism
- bipedality
shortDefinition: Locomotion on two legs; in human evolution, habitual bipedalism means regularly using upright two-legged
  walking as a normal form of movement.
longDefinition: Bipedalism is movement using two legs. Human habitual bipedalism is reflected in multiple anatomical
  adaptations involving the pelvis, spine, femur, knee, foot, and skull. These traits evolved gradually, and evidence
  for regular upright walking predates the large increase in brain size in later Homo.
relatedTerms:
- hominin
reviewedAt: '2026-08-21'
sources:
- title: Introduction to Human Evolution
  url: https://humanorigins.si.edu/education/introduction-human-evolution
  publisher: Smithsonian Human Origins Program
  note: States that bipedalism evolved millions of years before the later expansion of large, complex human brains.
