schemaVersion: 2
locale: de
entryId: anal-examinations-same-sex-conduct
sourceReviewedAt: '2026-09-07'
title: Analuntersuchungen als „Beweis“ gleichgeschlechtlichen Verkehrs
proposition:
  summary: >-
    Form, Spannung oder Zustand von Anus und Schließmuskel wurden als körperlicher Nachweis dafür behandelt, dass eine
    Person rezeptiven Analverkehr gehabt habe.
correction:
  summary: >-
    Analuntersuchungen können nicht zuverlässig feststellen, ob jemand zuvor einvernehmlichen rezeptiven Analverkehr hatte.
    Die vermeintlichen forensischen Merkmale gehen auf widerlegte Theorien des 19. Jahrhunderts zurück und besitzen keine
    wissenschaftlich tragfähige Beweiskraft.
episodes:
  - id: egypt-2001-2024
    polity: Ägypten
    periodLabel: 2001–Juni 2024 (dokumentiert)
    institutions:
      - Forensic Medicine Authority (مصلحة الطب الشرعي)
      - Egyptian Public Prosecution (النيابة العامة)
      - Ministry of Justice (وزارة العدل)
    institutionalContext: >-
      Staatsanwälte überweisen Beschuldigte wegen „Ausschweifung“ zur Untersuchung; die dem Justizministerium unterstehende
      Forensic Medicine Authority führt die Untersuchungen durch und erstellt Berichte, die vor Gericht als Beweismittel
      dienen. Die Polizei nimmt Betroffene fest und begleitet sie, doch die entscheidende medizinisch-juristische Kette
      verläuft von der staatsanwaltlichen Überweisung über die Untersuchung durch die Forensic Medicine Authority bis zur
      Verwendung des Berichts im Verfahren. Neuere Belege zeigen, dass diese Praxis weit über 2017 hinaus fortbestand und
      bis in die 2020er-Jahre dokumentiert ist.
    summary: >-
      Ägyptische Staatsanwälte überweisen Männer und trans Frauen, denen „Ausschweifung“ vorgeworfen wird, seit Jahren an
      die dem Justizministerium unterstehende Forensic Medicine Authority. Dort sollen Analuntersuchungen vermeintliche
      Beweise für rezeptiven Analverkehr liefern. Die Praxis ist von den Queen-Boat-Verfahren 2001 bis in die 2020er-Jahre
      dokumentiert. Eine gemeinsame zivilgesellschaftliche Eingabe für den Zeitraum Juli 2019–Juni 2024 erfasste 45 Personen,
      die von Staatsanwälten zu erzwungenen Analuntersuchungen überwiesen wurden. Auch der US-Menschenrechtsbericht für 2023
      dokumentiert trotz fehlender wissenschaftlicher Aussagekraft forensische Untersuchungen in „Ausschweifungs“-Verfahren,
      darunter ein Strafverfahren vom Dezember.
    consequences:
      - Erzwungene Analuntersuchungen
      - Medizinische Berichte als Beweismittel in Strafverfahren
      - Verurteilung und Haft wegen vorgeworfener einvernehmlicher gleichgeschlechtlicher Handlungen
      - Grausame und erniedrigende Behandlung, die Folter darstellen kann
    mechanism:
      summary: >-
        Staatsanwälte überweisen Beschuldigte formell an die Forensik des Justizministeriums, die Untersuchungen zur
        Ableitung rezeptiven Analverkehrs durchführt und Berichte für Strafverfahren erstellt.
    institutionalCorrection:
      summary: >-
        Die geprüften Quellen dokumentieren Überweisungen bis Juni 2024, belegen aber keine institutionelle Entscheidung,
        die umstrittenen Rückschlüsse aufzugeben oder die Untersuchungen zu beenden. Juni 2024 markiert das Ende des
        Berichtszeitraums der Eingabe, kein dokumentiertes Ende der Praxis.
  - id: lebanon-2012-2015
    polity: Libanon
    periodLabel: 2012–2015
    institutions:
      - Staatsanwaltschaft beim Kassationsgericht
      - Internal Security Forces (ISF)
    institutionalContext: >-
      Festnahmen durch die Internal Security Forces führten Verdächtige in ein medizinisch-juristisches Verfahren, in dem
      Staatsanwälte forensische Analuntersuchungen anordnen konnten. An der Spitze der landesweiten staatsanwaltlichen
      Hierarchie stand die Staatsanwaltschaft beim Kassationsgericht; ihre Anweisung von 2012 schuf kein vollständiges
      Verbot, sondern ließ Untersuchungen bei angeblicher Zustimmung zu und wertete eine Verweigerung als belastend.
      Der libanesische Ärzteorden wies Ärzte dagegen an, solche Tests nicht durchzuführen. Der Justizminister verlangte im
      August 2012 ein vollständiges Verbot, doch der neue Generalstaatsanwalt leitete dieses Ersuchen ohne verbindliche
      Anweisung weiter. Human Rights Watch dokumentierte Untersuchungen oder deren Androhung noch 2014 und 2015.
    summary: >-
      2012 ordneten libanesische Staatsanwälte bei Männern, die wegen des Verdachts auf homosexuelle Handlungen festgenommen
      worden waren, forensische Analuntersuchungen an; Untersuchungsergebnisse flossen in Strafverfahren ein. Der libanesische
      Ärzteorden verurteilte die Tests als medizinisch und wissenschaftlich nutzlos sowie als Form von Folter. Die Praxis
      endete jedoch nicht sofort: Die staatsanwaltliche Anweisung von 2012 ließ Untersuchungen bei angeblicher Zustimmung
      weiterhin zu und wertete eine Verweigerung als Beweisanzeichen; das spätere Ersuchen des Justizministers um ein
      vollständiges Verbot führte zu keiner verbindlichen staatsanwaltlichen Anweisung. Berichte belegen Untersuchungen
      oder deren Androhung noch bis 2015.
    consequences:
      - Erzwungene Analuntersuchungen
      - Medizinische Befunde als Grundlage strafrechtlicher Vorwürfe
      - Grausame und erniedrigende Behandlung
    mechanism:
      summary: >-
        Polizeiliche Festnahmen und staatsanwaltliche Überweisungen führten Verdächtige in forensische Untersuchungen,
        deren Ergebnisse für strafrechtliche Vorwürfe verwendet werden konnten.
    institutionalCorrection:
      periodLabel: 2012–2015
      action: >-
        Der libanesische Ärzteorden untersagte Ärzten am 7. August 2012 die Untersuchungen; am 11. August ersuchte der
        Justizminister den Generalstaatsanwalt, ihr vollständiges Ende anzuordnen.
      summary: >-
        Die ärztliche Standesorganisation verwarf die Tests als nutzlos und missbräuchlich. Der neue Generalstaatsanwalt
        leitete das ministerielle Ersuchen ohne verbindliche Anweisung weiter, während die frühere Zustimmungsregel eine
        Verweigerung als belastend wertete. Untersuchungen oder deren Androhung bestanden bis 2015 fort; die institutionelle
        Reaktion blieb daher unvollständig.
  - id: kenya-2015-2018
    polity: Kenia
    periodLabel: 2015–2018
    institutions:
      - Chief Magistrate Ukunda Law Courts
      - DCIO, Msambweni Police Station
      - Makadara General Hospital, Kwale
    institutionalContext: >-
      In einem Strafverfahren von 2015 beantragte die Staatsanwaltschaft medizinische Untersuchungen, die
      gleichgeschlechtliche Handlungen belegen sollten; ein Magistratsgericht genehmigte das Vorgehen und ein öffentliches
      Krankenhaus untersuchte die beiden Männer. Der kenianische Court of Appeal rekonstruierte diese institutionelle Kette
      und entschied 2018, dass die erzwungenen Analuntersuchungen Grundrechte verletzten und die daraus gewonnenen Beweise
      aus dem Strafverfahren zu entfernen seien.
    summary: >-
      Nach der Festnahme zweier Männer in Kwale 2015 erlangten staatliche Ermittler eine richterliche Anordnung und brachten
      sie zu erzwungenen Untersuchungen in das Makadara General Hospital, die Beweise für gleichgeschlechtliche Handlungen
      liefern sollten. 2018 entschied der Court of Appeal, dass die Untersuchungen ihre Rechte verletzt hatten und die
      Beweise aus dem Verfahren zu entfernen seien. Das Urteil gibt den Einwand der anwaltlichen Vertretung der
      Berufungskläger wieder, dass Analuntersuchungen das behauptete Verhalten nicht feststellen können; dies entspricht
      dem internationalen medizinischen Konsens. Die eigene Begründung des Gerichts beruht auf der rechtswidrigen
      Untersuchungsanordnung, den Grundrechten und dem Verbot erzwungener Selbstbelastung.
    consequences:
      - Gerichtlich angeordnete erzwungene Analuntersuchungen
      - Polizeilicher Transport und erzwungene medizinische Untersuchung der Beschuldigten
      - Verwendung vermeintlicher anatomischer Beweise in einem Strafverfahren
      - Verletzung von Privatsphäre, Würde und Schutz vor erniedrigender Behandlung
    mechanism:
      summary: >-
        Polizei und Staatsanwaltschaft erlangten richterliche Genehmigung für erzwungene medizinische Untersuchungen, die
        ein öffentliches Krankenhaus zur Erzeugung von Strafverfahrensbeweisen durchführte.
    institutionalCorrection:
      periodLabel: '2018'
      action: >-
        Am 22. März 2018 erklärte der kenianische Court of Appeal die erzwungenen Untersuchungen für verfassungswidrig
        und ihre Ergebnisse im Strafverfahren gegen die Berufungskläger für unzulässig.
      summary: >-
        Das Berufungsgericht hob die Abweisung der Beschwerde durch den High Court auf und verlangte, die
        Untersuchungsbefunde aus dem Verfahren zu entfernen. Dies belegt eine gerichtliche Korrektur im Fall der
        Berufungskläger, aber weder eine landesweite Abkehr von der Praxis durch Polizei oder medizinische Behörden noch
        eine gesonderte Entscheidung über ihre wissenschaftliche Aussagekraft.
  - id: kazakhstan-2016
    polity: Kasachstan
    periodLabel: Genehmigung 2016
    institutions:
      - Zentrum für Rechtsmedizin des Justizministeriums der Republik Kasachstan
    institutionalContext: >-
      Einvernehmliche gleichgeschlechtliche Beziehungen wurden in Kasachstan 1998 entkriminalisiert; die betreffende
      Methodik ist für Ermittlungen bei Sexualstraftaten vorgesehen. Dennoch weist die forensische Methodik des
      Justizministeriums Sachverständige an, Anus und Rektum auf vermeintliche Merkmale eines „passiven Partners“ zu
      untersuchen, darunter den Tonus des Schließmuskels, eine trichterförmige oder klaffende Öffnung und geglättete radiäre
      Falten. Die Methodik wurde am 5. Dezember 2016 vom Wissenschaftlichen Rat des Zentrums für Rechtsmedizin genehmigt
      und bleibt auf dem Forensikportal des Justizministeriums verfügbar. Die Episode erfasst diese Genehmigung;
      die Online-Verfügbarkeit belegt keinen durchgehenden Einsatz in konkreten Fällen bis 2026.
    summary: >-
      Eine 2016 vom forensischen Zentrum des kasachischen Justizministeriums genehmigte Untersuchungsmethodik für Männer
      in Sexualstrafverfahren behandelt mehrere chronische Veränderungen im Anal- und Rektalbereich als charakteristisch
      für systematischen rezeptiven Verkehr zwischen Männern. Sachverständige sollen unter anderem den Schließmuskel
      digital prüfen; als vermeintliche Merkmale werden eine trichterförmige oder klaffende Analöffnung, geglättete Falten,
      verminderter Schließmuskeltonus und bestimmte Schleimhautfärbungen genannt. Nach heutigem forensischem Konsens lassen
      sich frühere einvernehmliche rezeptive Analkontakte aus solchen Befunden nicht zuverlässig ableiten.
    consequences:
      - Amtliche Vorgaben für invasive forensische Untersuchungen von Anus und Rektum
      - Wissenschaftlich nicht tragfähige Rückschlüsse auf wiederholten rezeptiven Analverkehr
      - Potenziell irreführende Sachverständigenbeweise in strafrechtlichen Ermittlungen
    mechanism:
      summary: >-
        Das staatliche Forensikzentrum kodifizierte Untersuchung und Bewertung anorektaler Merkmale in einer amtlichen
        Methodik zur Schlussfolgerung auf wiederholten rezeptiven Verkehr.
    institutionalCorrection:
      summary: >-
        Das Forensikhandbuch von 2025 beschreibt Untersuchungen bei Sexualstraftaten, ohne die umstrittenen Rückschlüsse
        aus chronischen Merkmalen zu bestätigen oder zurückzunehmen. Die geprüften Quellen belegen weder eine institutionelle
        Korrektur noch den aktuellen Einsatz dieser Rückschlüsse in konkreten Fällen.
  - id: uzbekistan-2017-2026
    polity: Usbekistan
    periodLabel: 2017–heute
    institutions:
      - Innenministerium der Republik Usbekistan
    institutionalContext: >-
      Ermittlungsbehörden ordnen bei Männern, die nach Artikel 120 wegen einvernehmlicher gleichgeschlechtlicher Beziehungen
      verfolgt werden, forensische Analuntersuchungen an. Die dabei erstellten medizinischen Gutachten werden als Beweismittel
      in Strafverfahren eingebracht; Gerichte stützten sich auf vermeintliche anatomische Zeichen wie geglättete radiäre
      Falten und verminderten Schließmuskeltonus. Berichte über 2025 sowie eine gemeinsame Erklärung vom Juni 2026
      dokumentieren die Praxis weiterhin vor dem Hintergrund einer verschärften Anwendung von Artikel 120.
    summary: >-
      Usbekische Ermittlungsbehörden ordnen erzwungene Analuntersuchungen an, um vermeintliche Beweise für Verfahren nach
      Artikel 120 des Strafgesetzbuchs zu gewinnen. In einem dokumentierten Verfahren von 2021 stützte sich ein Taschkenter
      Gericht unter anderem auf ein rechtsmedizinisches Gutachten, das oberflächliche Verletzungen, geglättete radiäre Falten
      und verminderten Schließmuskeltonus als Hinweise auf Analverkehr wertete. Die Praxis bestand 2025 fort, als zwei Männer
      in Taschkent gegen ihren Willen forensischen Analuntersuchungen unterzogen worden sein sollen; eine gemeinsame Erklärung
      mehrerer Organisationen vom Juni 2026 beschreibt unfreiwillige invasive Untersuchungen weiterhin als Teil der
      Durchsetzung von Artikel 120.
    consequences:
      - Erzwungene Analuntersuchungen in Haft
      - Medizinische Gutachten als Beweismittel für einvernehmliche gleichgeschlechtliche Handlungen
      - Strafrechtliche Verurteilungen, Hausarrest und Haft
      - Grausame und erniedrigende Behandlung, die Folter darstellen kann
    mechanism:
      summary: >-
        Ermittlungsbehörden ordnen unfreiwillige Untersuchungen an, Sachverständige übersetzen anatomische Befunde in
        Aussagen über gleichgeschlechtlichen Verkehr, und Gerichte können die Berichte nach Artikel 120 verwerten.
    institutionalCorrection:
      summary: >-
        Die gemeinsame Erklärung vom Juni 2026 beschreibt fortdauernde unfreiwillige Untersuchungen und fordert ihr Ende.
        Das geprüfte Material dokumentiert keine institutionelle Entscheidung, die umstrittenen Rückschlüsse aufzugeben
        oder diese Untersuchungen zu verbieten.
evidence:
  - id: anal-hrw-proposition
    note: >-
      Dokumentiert Ägyptens langjährige Praxis, staatsanwaltliche Überweisungen an die Forensic Medicine Authority des
      Justizministeriums, die Wurzeln der behaupteten Merkmale im 19. Jahrhundert und die Nutzung der Gutachten als
      Beweismittel.
  - id: anal-wma-correction
    note: >-
      Die WMA erklärt erzwungene Analuntersuchungen unmittelbar für medizinisch ungültig, unwissenschaftlich und nutzlos
      und fordert Ärzte und Ärzteorganisationen auf, sich nicht daran zu beteiligen.
  - id: anal-plos-correction
    note: >-
      Führt die vermeintlichen anatomischen Merkmale auf Theorien des 19. Jahrhunderts zurück und erklärt, warum sich
      daraus weder die sexuelle Orientierung noch frühere einvernehmliche Analkontakte feststellen lassen.
  - id: anal-ifeg-correction
    note: >-
      Die Independent Forensic Expert Group erläutert die fehlende validierte diagnostische Genauigkeit und die
      Variabilität von Schließmuskeltonus und Anatomie, die eine zuverlässige Zuordnung zu einvernehmlichem Analverkehr
      verhindert.
  - id: anal-egypt-state-carrier
    note: >-
      Gibt Berichte von Menschenrechtsgruppen über Untersuchungen durch die Forensic Medical Authority in
      „Ausschweifungs“-Verfahren wieder und dokumentiert ein Strafverfahren vom Dezember 2023, in dem forensische
      Untersuchungen nach Spuren vermeintlich „abweichender Aktivitäten“ suchten. Der verlinkte Text ist eine Archivkopie
      des Berichts des US-Außenministeriums.
  - id: anal-egypt-hrw-mechanism
    note: >-
      Dokumentiert Ägyptens langjährige Praxis, einschließlich staatsanwaltlicher Überweisungen an die Forensic Medicine
      Authority des Justizministeriums, der Wurzeln der behaupteten Merkmale im 19. Jahrhundert und der Verwendung von
      Untersuchungsberichten als Beweismittel.
  - id: anal-egypt-eipr-consequences
    note: >-
      Dokumentiert 93 Verfahren wegen gewohnheitsmäßiger „Ausschweifung“ mit 181 Personen zwischen Juli 2019 und Juni 2024
      und hält fest, dass Staatsanwälte 45 dieser Personen zu erzwungenen Analuntersuchungen an die Forensic Medicine
      Authority des Justizministeriums überwiesen.
  - id: anal-egypt-eipr-carrier
  - id: anal-egypt-hrw-consequences
    note: >-
      Dokumentiert Untersuchungen, die in Strafverfahren und Verurteilungen einschließlich Haftstrafen einflossen, sowie
      Berichte Inhaftierter über schmerzhafte und demütigende Zwangsuntersuchungen. Diese Fallberichte belegen Folgen,
      die über die spätere Zahl der Überweisungen hinausgehen.
  - id: anal-egypt-wma-context
    note: >-
      Die WMA erklärt erzwungene Analuntersuchungen unmittelbar für medizinisch ungültig, unwissenschaftlich und nutzlos
      und fordert Ärzte und Ärzteorganisationen auf, sich nicht daran zu beteiligen. Diese medizinische Ablehnung belegt
      keine institutionelle Korrektur in Ägypten.
  - id: anal-lebanon-carrier
    note: >-
      Dokumentiert Festnahmen durch die Internal Security Forces, staatsanwaltlich angeordnete Untersuchungen, die
      Verwendung der Ergebnisse für strafrechtliche Vorwürfe, das Verbot des libanesischen Ärzteordens und die
      staatsanwaltliche Anweisung von 2012, die Untersuchungen bei angeblicher Zustimmung weiter zuließ. Der Ärzteorden
      tritt als korrigierende Institution auf, nicht als Träger der Behauptung.
  - id: anal-lebanon-mechanism
  - id: anal-lebanon-consequences
    note: >-
      Dokumentiert, dass Analuntersuchungen oder deren Androhung trotz der medizinischen und menschenrechtlichen Kampagne
      noch 2014 und 2015 im Libanon eingesetzt wurden.
  - id: anal-lebanon-context
    note: >-
      Überblick über die fehlende wissenschaftliche Aussagekraft sowie die medizinischen und rechtlichen Versuche im
      Libanon, die Praxis zu beenden.
  - id: anal-lebanon-partial-correction
  - id: anal-lebanon-2012-consequences
    note: >-
      Dokumentiert erzwungene Untersuchungen und die Verwendung ihrer Ergebnisse für strafrechtliche Vorwürfe; das
      ärztliche Rundschreiben beschreibt die Untersuchungen als demütigend und als Form von Folter.
  - id: anal-lebanon-minister-response
    note: >-
      Dokumentiert das Ersuchen des Justizministers um ein vollständiges Verbot und dessen Weiterleitung durch den neuen
      Generalstaatsanwalt ohne verbindliche Anweisung. Fortgesetzte Untersuchungen und Drohungen zeigen, warum das
      ärztliche Verbot und die ministerielle Intervention keine vollständige Korrektur bewirkten.
  - id: anal-kenya-carrier
    note: >-
      Primäres Berufungsurteil, das die Kette aus Magistratsgericht, Polizei und öffentlichem Krankenhaus rekonstruiert
      und Grundrechtsverletzungen feststellt. Absatz 14 gibt den wissenschaftlichen Einwand der anwaltlichen Vertretung
      der Berufungskläger wieder; die eigene Begründung des Gerichts betrifft die rechtswidrige Anordnung, die
      Grundrechtsverletzungen und den Ausschluss der daraus gewonnenen Beweise.
  - id: anal-kenya-mechanism
  - id: anal-kenya-consequences
  - id: anal-kenya-correction
  - id: anal-kenya-wma-context
    note: >-
      Medizinische Korrektur: Erzwungene Analuntersuchungen haben keine wissenschaftliche Grundlage zum Nachweis
      gleichgeschlechtlicher sexueller Handlungen und sind medizinisch ungültig und nutzlos. Dies liefert die medizinische
      Bewertung getrennt von der verfassungsrechtlichen Entscheidung des Gerichts.
  - id: anal-kazakhstan-carrier
    note: >-
      Offizielle Methodik, die der Wissenschaftliche Rat des Zentrums für Rechtsmedizin des Justizministeriums am
      5. Dezember 2016 mit Protokoll Nr. 2 genehmigte. Sie lässt Schließmuskeltonus und anorektale Form prüfen und
      bezeichnet bestimmte chronische Merkmale als charakteristisch für systematischen rezeptiven Verkehr zwischen Männern.
  - id: anal-kazakhstan-mechanism
  - id: anal-kazakhstan-consequences
    note: >-
      Dokumentiert Vorgaben für invasive Untersuchungen und die in der Methodik verankerten anatomischen Rückschlüsse.
      Untersuchungen oder gerichtliche Ergebnisse in Einzelfällen werden nicht belegt; das Risiko irreführender Beweise
      ist eine Bewertung auf Grundlage der gesonderten medizinischen Korrektur.
  - id: anal-kazakhstan-handbook-context
    note: >-
      Das staatliche Forensikhandbuch von 2025 für Strafverfolgungsbehörden und Gerichte beschreibt Untersuchungen
      männlicher und weiblicher Sexualzustände sowie Ermittlungen bei sexueller Gewalt. Diese Passagen belegen keinen
      fortgesetzten Einsatz der umstrittenen Rückschlüsse aus chronischen Merkmalen in der Methodik von 2016.
  - id: anal-kazakhstan-wma-context
    note: >-
      Medizinische Korrektur: Analuntersuchungen können frühere einvernehmliche rezeptive Analkontakte nicht zuverlässig
      feststellen; ihr erzwungener Einsatz ist medizinisch ungültig und unethisch. Hier geht es um die vermeintliche
      Vorgeschichte einvernehmlichen Verkehrs, getrennt von der Bewertung von Verletzungen oder biologischen Spuren nach
      einem Übergriff.
  - id: anal-kazakhstan-inference-risk
    note: >-
      Die Expertenanalyse erklärt, warum Schließmuskeltonus und anatomische Varianten keine zuverlässigen Rückschlüsse
      auf frühere einvernehmliche Analkontakte erlauben. Auf die behaupteten chronischen Merkmale der Methodik angewandt,
      stützt sie die Bewertung eines Risikos irreführender Beweise, belegt aber weder ein kasachisches Einzelfallergebnis
      noch eine allgemeine Ablehnung der Forensik bei Sexualstraftaten.
  - id: anal-kazakhstan-legal-context
    note: >-
      Belegt die Entkriminalisierung einvernehmlicher gleichgeschlechtlicher Handlungen vor der Methodik von 2016.
      Dies liefert den rechtlichen Kontext und dokumentiert keine Übernahme oder Anwendung der forensischen Methode.
  - id: anal-uzbekistan-carrier
    note: >-
      Dokumentiert mindestens sechs erzwungene Analuntersuchungen zwischen 2017 und 2021 sowie ein Taschkenter Verfahren
      von 2021, in dem ein Gutachten Verletzungen, geglättete radiäre Falten und verminderten Schließmuskeltonus als
      Hinweise auf Analverkehr wertete und dazu beitrug, dass zwei Männer jeweils zu zwei Jahren Hausarrest verurteilt wurden.
  - id: anal-uzbekistan-mechanism
  - id: anal-uzbekistan-consequences
    note: >-
      Berichtet, dass nach Artikel 120 Inhaftierte durch Strafverfolgungs- oder Justizorgane erzwungenen Analuntersuchungen
      unterzogen wurden, die als Beweismittel für gleichgeschlechtliche Handlungen dienten, und dokumentiert die
      fortgesetzte strafrechtliche Anwendung von Artikel 120. Der verlinkte Text ist eine Archivkopie des Berichts des
      US-Außenministeriums.
  - id: anal-uzbekistan-2025-examinations
    note: >-
      Berichtet für den Zeitraum Januar–Dezember 2025, dass zwei junge Männer, die im Februar in Taschkent festgenommen
      wurden, trotz ihrer Einwände gegen ihren Willen forensischen Analuntersuchungen unterzogen wurden.
  - id: anal-uzbekistan-2026-use
    note: >-
      Die gemeinsame Erklärung vom Juni 2026 dokumentiert die verschärfte Anwendung von Artikel 120 und unfreiwillige
      invasive Untersuchungen Inhaftierter ohne freie und informierte Zustimmung; sie fordert das Ende dieser Praxis.
  - id: anal-uzbekistan-hrw-consequences
    note: >-
      Dokumentiert erzwungene Untersuchungen, die Verwendung von Gutachten bei Verurteilungen, zweijährige Hausarreststrafen
      im Fall von 2021 und eine Haftstrafe in einem früheren Fall. Der Bericht bezeichnet die Praxis als grausame und
      erniedrigende Behandlung, die Folter darstellen kann.
  - id: anal-uzbekistan-wma-context
    note: >-
