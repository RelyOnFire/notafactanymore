term: Gravitational lensing
aliases:
- gravitational lens
- lensing
shortDefinition: The bending and distortion of light by gravity as it passes near mass.
longDefinition: General relativity predicts that mass curves spacetime and therefore bends the paths of light rays. In
  gravitational lensing, foreground mass changes the apparent position, shape, or brightness of more distant sources.
  Measuring those distortions lets astronomers map total gravitating mass, including matter that emits little or no light.
relatedTerms:
- dark-matter
reviewedAt: '2026-08-21'
sources:
- title: Dark Matter
  url: https://science.nasa.gov/dark-matter/
  publisher: NASA
  note: Describes gravitational lensing as an important way to infer the distribution of otherwise unseen mass.
