entryId: roche-limit
sourceReviewedAt: '2026-08-21'
term: Roche-Grenze
aliases:
- Roche-Limit
shortDefinition: Die ungefähre Entfernung von einem Himmelskörper, innerhalb der Gezeitenkräfte loses, vor allem durch
  Eigengravitation zusammengehaltenes Material daran hindern können, sich zu einem Mond zusammenzufügen.
longDefinition: Die Roche-Grenze beschreibt das Verhältnis zwischen den Gezeitenkräften eines größeren Körpers und der
  Eigengravitation, die einen kleineren Körper oder loses Material zusammenhält. Innerhalb der klassischen Grenze wird
  loses Material leichter auseinandergezogen oder an der Bildung eines Mondes gehindert. Die genaue Entfernung hängt
  unter anderem von Dichte, Struktur, Rotation und Materialeigenschaften ab und ist daher keine universelle harte Grenze
  für Ringsysteme.
