title: HIV denialism
claim: Senior state leaders treated the causal role of HIV in AIDS as doubtful or unproven and antiretroviral medicines as dangerously toxic or of questionable value.
currentUnderstanding: HIV is the cause of AIDS. Effective antiretroviral therapy suppresses viral replication, preserves immune function, prevents illness and premature death, and sharply reduces transmission, including transmission from mother to child. Like all medicines, antiretrovirals can have adverse effects, but their benefits in HIV treatment are overwhelming.
category: Medicine and public health
reviewedAt: 2026-08-22
episodes:
  - id: south-africa-1999-2008
    polity: South Africa
    region: Africa
    startYear: 1999
    endYear: 2008
    periodLabel: 1999–2008
    strength: policy-basis
    institutionTypes: [government, medical]
    institutions:
      - Presidency of South Africa
      - National Department of Health
      - Presidential AIDS Advisory Panel
    consequences:
      - Delayed national antiretroviral rollout
      - Restricted prevention of mother-to-child transmission
      - Large numbers of preventable deaths and HIV infections
    summary: Under President Thabo Mbeki, senior national leadership questioned whether HIV caused AIDS and portrayed antiretroviral drugs as dangerously toxic. These views contributed to resistance and delay in providing antiretroviral treatment and prevention of mother-to-child transmission through the public health system. Later modelling studies using different methods estimated hundreds of thousands of avoidable deaths during the period of delayed treatment.
    sources:
      - title: The adequacy of policy responses to the treatment needs of South Africans living with HIV (1999–2008)
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2804692/
        publisher: Journal of the International AIDS Society
        note: Reviews Mbeki-era HIV policy, including public questioning of HIV causation and antiretroviral efficacy, and the delayed expansion of treatment.
      - title: Modelling the human immunodeficiency virus epidemic — the impact of AIDS denialism
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5843995/
        publisher: Southern African Journal of HIV Medicine
        note: Reviews independent modelling studies estimating the mortality and infection burden associated with delayed antiretroviral and mother-to-child-transmission programmes.
