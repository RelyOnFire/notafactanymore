schemaVersion: 2
title: Virginity testing
proposition:
  summary: >-
    Examination of the hymen or vagina was treated as capable of determining whether a woman or girl had previously
    had vaginal intercourse.
correction:
  summary: >-
    No physical examination can establish whether a woman or girl has previously had vaginal intercourse. Hymenal
    appearance varies normally and is not a reliable record of sexual activity; so-called virginity or two-finger
    tests have no scientific or clinical validity.
category: Forensic medicine and sexuality
reviewedAt: '2026-09-13'
episodes:
- id: turkey-1986-1998
  polity: Turkey
  region: Middle East
  startYear: 1986
  endYear: 1998
  periodLabel: 1986–1998; documented practice and reported restriction
  strength: policy-basis
  institutionTypes:
  - government
  - medical
  - education
  institutions:
  - Police and gendarmerie
  - State forensic-medicine services and hospitals
  - State schools and dormitories
  institutionalContext: >-
    Human Rights Watch documented examinations ordered or facilitated by police, gendarmes, schools, dormitories
    and other state institutions. State forensic doctors examined detainees, women suspected of prostitution and
    students accused of breaching school discipline or public morality. Some police orders bypassed the court
    or prosecutor authorization described in the report. The 1986 start marks a documented case, rather than the
    first use of the practice.
  consequences:
  - Forced genital examinations
  - Use of supposed “virginity” as evidence in policing
  - Surveillance and punishment of women and girls
  - Psychological and physical harm
  summary: >-
    Turkish police, gendarmes, schools, dormitories and other state institutions ordered or facilitated examinations
    intended to determine women’s and girls’ “virginity.” State forensic doctors performed them in detention,
    suspected-prostitution, school-discipline and public-morality cases. The 1999 U.S. country report describes
    a late-1998 government regulation prohibiting the practice unless requested by the woman. It reports an apparent
    reduction in testing but also enforcement limits, including the absence of sanctions against violators. The
    restriction left the request exception intact and did not establish a complete rejection of the examination’s
    supposed diagnostic value.
  mechanism:
    kind: enforcement
    summary: >-
      State bodies ordered or facilitated genital examinations, while forensic doctors supplied findings about
      supposed “virginity” for policing, institutional discipline and public-morality decisions. Documented practice
      included orders issued without the required authorization.
  institutionalCorrection:
    status: partial
    periodLabel: late 1998
    action: A government regulation reportedly prohibited virginity testing unless requested by the woman.
    summary: >-
      The reported restriction reduced the scope for compulsory testing but retained a request exception. The
      subsequent country report described enforcement shortcomings; it does not establish universal cessation
      or a scientific repudiation of the underlying inference.
  endOpen: false
- id: iran-2014-2026
  polity: Iran
  region: Middle East
  startYear: 2014
  endYear: 2026
  periodLabel: 2014 fieldwork; later reporting assessed in April 2026
  strength: policy-basis
  institutionTypes:
  - court
  - medical
  institutions:
  - Legal Medicine Organization of Iran (LMOI)
  - Judiciary of the Islamic Republic of Iran
  institutionalContext: >-
    The Legal Medicine Organization is an official body of Iran’s judiciary; its medico-legal centres provide
    expert reports at the request of courts, judges and administrative authorities. A qualitative study based
    on Tehran fieldwork in 2014 interviewed practitioners in forensic medical centres and government gynaecology
    clinics. They described examinations on civil and criminal court orders and other formal medico-legal applications.
    A UK Home Office assessment published in April 2026 reports that authorities may attempt testing in some circumstances,
    while cautioning that the evidence does not establish prevalence. That assessment is later reporting, rather
    than proof of uninterrupted practice throughout 2014–2026.
  consequences:
  - Court-ordered hymenal examinations
  - Forensic certificates and reports used in civil and criminal matters
  - Reported applications involving marriage, divorce, welfare placement and alleged sexual activity
  - Interview-reported psychological and social risks, including violence and self-harm
  summary: >-
    Iranian medico-legal centres have performed hymenal examinations intended to determine “virginity” for formal
    legal purposes. Practitioners interviewed in Tehran described court-ordered examinations and applications
    involving marriage, divorce, welfare placement, alleged sexual assault and certificates of virginity. The
    same interviewees expressed uncertainty about diagnostic accuracy and described conflicts over consent and
    the possible consequences of a certificate for the person examined. These interviews establish institutional
    practice and reported experiences; they do not measure national prevalence. The April 2026 UK country assessment
    describes possible testing in some circumstances. The cited record identifies no nationwide institutional
    rejection of the practice.
  mechanism:
    kind: enforcement
    summary: >-
      Courts and judges request medico-legal examinations from the judiciary’s forensic system, which examines
      hymenal condition and issues expert reports or certificates for civil and criminal legal purposes. The practice-specific
      evidence is the Tehran interview study.
  institutionalCorrection:
    status: undocumented
    summary: >-
      The attached sources document medico-legal use and qualified later reporting, but do not identify a corrective
      act by the judicial or forensic carriers. No correction date or action is inferred from continued use or
      from the absence of an abolition report.
  endOpen: false
- id: india-2005-2013
  polity: India
  region: South Asia
  startYear: 2005
  endYear: 2013
  periodLabel: 2005–2013; renewed judicial directions in 2022
  strength: policy-basis
  institutionTypes:
  - government
  - court
  - medical
  - education
  institutions:
  - Government hospitals and medico-legal services
  - Forensic-medicine training and textbooks
  - Criminal courts using medico-legal reports
  institutionalContext: >-
    Human Rights Watch documented the finger test in forensic-medicine textbooks published in 2005 and 2007, public-hospital
    forms and medical reports used by courts. Findings about the hymen and vaginal laxity were used to describe
    survivors as “habituated to sexual intercourse.” The 2013 Supreme Court judgment in Lillu rejected the test’s
    invasion of privacy and dignity and its use to infer consent. In 2022 the Supreme Court returned to the issue,
    quoted national health guidance prohibiting the test and noted that the practice nevertheless persisted.
  consequences:
  - Invasive examinations of rape survivors
  - Sexual-history judgments in medico-legal reports
  - Evidence used to challenge credibility or imply consent
  - Re-traumatization of survivors
  summary: >-
    Indian forensic-medicine teaching and public hospitals used the two-finger test to judge whether rape survivors
    were “habituated to sexual intercourse.” Findings about hymenal condition and vaginal laxity entered medico-legal
    reports and could be used in court to attack credibility or imply consent. The Supreme Court rejected the
    practice in 2013. National health guidance subsequently instructed examiners not to conduct the test or infer
    previous intercourse from hymenal status. In 2022, the Court again condemned its use, ordered circulation
    of the guidance to government and private hospitals and called for training and changes to medical curricula.
    The formal evidentiary position had changed, but the renewed directions reflected continued noncompliance.
    Clinically indicated examinations for injuries and care are a separate matter.
  mechanism:
    kind: standard-setting
    summary: >-
      Forensic teaching, examination forms and public-hospital practice standardized digital and hymenal examinations
      and converted their findings into medico-legal judgments about sexual history, which could enter criminal
      proceedings.
  institutionalCorrection:
    status: corrected
    periodLabel: 2013 onward; implementation directions renewed in 2022
    action: >-
      The Supreme Court rejected the test in Lillu in 2013; national health guidance prohibited it, and the Court
      renewed implementation and training directions in 2022.
    summary: >-
      The correction concerns the formal judicial and health-standard rejection of the test and its claimed inference
      about sexual history or consent. The 2022 judgment itself records continued use, so this classification
      does not certify universal compliance.
  endOpen: false
- id: indonesia-2014-2022
  polity: Indonesia
  region: Southeast Asia
  startYear: 2014
  endYear: 2022
  periodLabel: 2014–2022; reported recruitment reforms
  strength: policy-basis
  institutionTypes:
  - government
  - medical
  - military
  institutions:
  - Indonesian National Police (Polri)
  - Police Medical and Health Center (Pusdokkes Polri)
  - Indonesian National Armed Forces (TNI)
  - Indonesian Army (TNI AD)
  - Indonesian Navy (TNI AL)
  - Indonesian Air Force (TNI AU)
  institutionalContext: >-
    Human Rights Watch’s 2014 investigation identified police recruitment screening and Pusdokkes Polri personnel
    conducting examinations in police-operated hospitals. Article 36 of Chief Police Regulation No. 5/2009 required
    an obstetrics/gynaecology examination; the report documented how “virginity testing” occurred within that
    screening, rather than identifying an explicit virginity-test requirement in the regulation. Separate Human
    Rights Watch reports describe earlier use across the military services. Later reports record police cessation
    and the Army’s 2021 change, followed by an April 2022 announcement covering all three armed-forces branches.
  consequences:
  - Invasive examinations of female recruits
  - Sex discrimination in public employment
  - Psychological and physical harm
  summary: >-
    In 2014, female applicants to Indonesia’s police were subjected to “virginity tests,” including the discredited
    two-finger examination, by Pusdokkes Polri personnel in police medical facilities. Human Rights Watch documented
    distressing recruitment experiences, while noting that failing the examination did not necessarily lead to
    automatic exclusion. The practice was also used across the Army, Navy and Air Force. The Army moved to end
    it in 2021, and an armed-forces spokesperson announced in April 2022 that all three services had effectively
    stopped using it for recruitment. The same reporting states that the police had already ceased the practice.
    These are documented reports of institutional withdrawal; they do not establish that every recruitment site
    was independently audited.
  mechanism:
    kind: administrative-adoption
    summary: >-
      Police and military recruitment systems incorporated invasive “virginity” examinations into medical screening
      of female applicants. Reporting documents the implementation; the police medical regulation itself did not
      expressly name a virginity test.
  institutionalCorrection:
    status: corrected
    periodLabel: reported police cessation; Army reform in 2021; military-wide announcement in April 2022
    action: >-
      Human Rights Watch reported police cessation, the Army’s move to end testing in 2021 and the April 2022
      armed-forces announcement covering the Army, Navy and Air Force.
    summary: >-
      The cited reporting documents withdrawal from police and military recruitment, including the police response.
      The classification is limited to that reported institutional change, not an independently verified end to
      every examination in every setting.
  endOpen: false
- id: kazakhstan-2016
  polity: Kazakhstan
  region: Central Asia
  startYear: 2016
  endYear: 2016
  periodLabel: Methodology approved 5 December 2016
  strength: policy-basis
  institutionTypes:
  - government
  - medical
  institutions:
  - Center for Forensic Medicine, Ministry of Justice of the Republic of Kazakhstan
  institutionalContext: >-
    The methodology’s passport records approval by the Scientific Council of the Center for Forensic Medicine
    of the Ministry of Justice, protocol No. 2 of 5 December 2016. The document is hosted by the present Center
    for Forensic Examinations. It includes determining prior intercourse among expert tasks and identifies the
    hymen as the principal object when assessing “sexual inviolability (virginity).” It prescribes genital and
    hymenal examination while acknowledging that intercourse can occur without hymenal rupture. Its availability
    on the host’s website establishes publication of the methodology, not how frequently it was applied or particular
    judicial outcomes.
  consequences:
  - An official examination framework aimed at inferring prior intercourse
  - Prescribed use of hymenal condition and injuries in expert assessment
  - Potential influence of resulting expert conclusions on criminal and civil proceedings
  - Inclusion of a virginity-assessment task alongside procedures for documenting injuries
  summary: >-
    Kazakhstan’s Center for Forensic Medicine approved a methodology in 2016 that includes determining prior intercourse
    among its expert tasks. In its section on “sexual inviolability (virginity),” the hymen is the central object
    of examination. The instructions nevertheless recognize that intercourse may occur without hymenal rupture.
    This documents an institutional framework for the disputed inference, together with its own qualifications.
    It does not establish continuous use through 2026, examination numbers or case outcomes. The criticism concerns
    attempts to determine sexual history from physical appearance; injury documentation and other forensic evidence
    have different purposes.
  mechanism:
    kind: standard-setting
    summary: >-
      The centre’s Scientific Council approved a forensic methodology that specified examination tasks and genital/hymenal
      assessment for expert conclusions about sexual inviolability and prior intercourse.
  institutionalCorrection:
    status: undocumented
    summary: >-
      The cited methodology does not document an institutional decision to abandon the virginity-assessment task.
      Its later publication is not evidence of a corrective response, and does not by itself establish the extent
      of continuing implementation.
  endOpen: false
- id: bangladesh-2013-2018
  polity: Bangladesh
  region: South Asia
  startYear: 2013
  endYear: 2018
  periodLabel: 2013–2018
  strength: policy-basis
  institutionTypes:
  - government
  - medical
  institutions:
  - Ministry of Health and Family Welfare
  - Dhaka Medical College Hospital, Department of Forensic Medicine
  - Bangabandhu Sheikh Mujib Medical University, Department of Forensic Medicine
  - Sir Salimullah Medical College & Hospital, Department of Forensic Medicine
  - Shaheed Suhrawardy Medical College & Hospital, Department of Forensic Medicine
  - Chittagong Medical College, Department of Forensic Medicine
  institutionalContext: >-
    BLAST’s chronology of Writ Petition No. 10663 of 2013 documents the medico-legal use of the test and the institutions
    defending it. On 6 November 2017, the heads of five forensic-medicine departments told the High Court the
    test was necessary; written opinions followed in December. The Health Ministry’s affidavit of 11 March 2018
    defended finger testing and hymen assessment as ways to determine whether a sexual act had occurred. On 10
    April it submitted a newer health-care protocol and withdrew that defence. The High Court issued its prohibition
    on 12 April. The Directorate General of Health Services was a respondent; that procedural role alone does
    not establish separate adoption of the disputed claim.
  consequences:
  - Invasive genital examinations of rape survivors
  - Medico-legal conclusions about prior sexual activity
  - Evidence capable of affecting rape investigations and trials
  - Humiliation, re-traumatization and violation of bodily dignity
  summary: >-
    Bangladesh’s medico-legal system used the two-finger test and hymenal examination on women and girls reporting
    rape. The institutional belief became explicit during litigation: five forensic-department heads defended
    the test in November 2017, and the Health Ministry argued in March 2018 that doctors relied on it to decide
    whether intercourse had occurred. The ministry withdrew that position in April after submitting a newer health-care
    protocol. According to BLAST’s litigation record, the High Court prohibited the test on 12 April 2018, rejected
    descriptions of survivors as “habituated to sexual intercourse” and ordered dissemination of the protocol.
    Its directions distinguished the discredited test from specialist examinations needed to identify an injury
    or provide care. The ruling and protocol changed the formal standard; these sources do not measure subsequent
    compliance in every facility.
  mechanism:
    kind: standard-setting
    summary: >-
      Forensic-medicine departments and the health administration used and defended finger and hymenal examinations
      as medico-legal tools for determining whether intercourse had occurred, producing medical conclusions capable
      of entering rape proceedings.
  institutionalCorrection:
    status: corrected
    periodLabel: April 2018
    action: >-
      The Health Ministry withdrew its defence on 10 April; the High Court prohibited the test on 12 April and
      directed dissemination of the health-care protocol.
    summary: >-
      The reported judicial directions and the ministry’s changed position explicitly rejected the test and its
      claimed evidentiary usefulness. This is a correction of the formal institutional standard, without a claim
      that the sources establish universal implementation.
  endOpen: false
- id: pakistan-2015-2021
  polity: Pakistan
  region: South Asia
  startYear: 2015
  endYear: 2021
  periodLabel: 2015 instructions; executive and legal responses in 2020–2021
  strength: policy-basis
  institutionTypes:
  - government
  - medical
  institutions:
  - Surgeon Medico Legal Punjab
  - Punjab Health Department
  institutionalContext: >-
    Punjab’s 2015 medico-legal instructions included digital and hymenal examinations for purposes that included
    ascertaining virginity. The Lahore High Court judgment records the health authorities’ and Surgeon Medico
    Legal Punjab’s instructions and explanations. It separately records the Punjab Forensic Science Agency’s statement
    that it did not rely on virginity tests. The federal government rejected the test in an October 2020 statement.
    The High Court’s 2021 judgment invalidated the relevant instructions and guidelines. The Anti-Rape (Investigation
    and Trial) Act 2021 subsequently included an express prohibition and denial of probative value for two-finger
    virginity testing in medico-legal examinations relating to its scheduled offences. The Court and Ministry
    of Law and Justice are identified here for their corrective roles.
  consequences:
  - Invasive genital examinations of sexual-violence survivors
  - Official medico-legal judgments about virginity and sexual history
  - Potential use of those conclusions in criminal proceedings
  - Violation of dignity, privacy and bodily integrity
  summary: >-
    Official medico-legal instructions in Punjab incorporated digital and hymenal examinations intended to ascertain
    the virginity of rape and sexual-abuse victims. The federal government’s October 2020 statement rejected the
    test as inconclusive and incompatible with dignity. In 2021, the Lahore High Court struck down two-finger
    and hymen tests for this purpose and invalidated the corresponding instructions and guidelines. Section 13(1)
    of the Anti-Rape (Investigation and Trial) Act 2021 also provides that two-finger virginity testing must be
    prohibited and given no probative value in medico-legal examinations relating to scheduled offences. The Act
    extends across Pakistan but separately provides for commencement by federal notification; no precise commencement
    date is established here. These judicial and statutory changes concern the invalid virginity inference, while
    clinically justified examinations remain a separate question.
  mechanism:
    kind: standard-setting
    summary: >-
      Punjab’s health and medico-legal authorities issued instructions incorporating digital and hymenal examination
      into sexual-violence assessments, allowing judgments about virginity and sexual history to enter medico-legal
      reports.
  institutionalCorrection:
    status: corrected
    periodLabel: 2020–2021 executive, judicial and statutory responses
    action: >-
      The federal government rejected the test in October 2020; the Lahore High Court invalidated virginity-testing
      instructions in 2021, and section 13(1) of the 2021 Anti-Rape Act provides a prohibition and denial of probative
      value for the specified examinations.
    summary: >-
      The documented executive statement, judgment and enacted statutory provision reject the practice or its
      evidentiary value within their stated scopes. The classification does not assert universal compliance, an
      unverified commencement day, or a ban on all clinically indicated genital examinations.
  endOpen: false
- id: georgia-2018-2020
  polity: Georgia
  region: Caucasus
  startYear: 2018
  endYear: 2020
  periodLabel: 2018–2020 case material; later procedural context in 2025
  strength: policy-basis
  institutionTypes:
  - government
  - court
  - medical
  institutions:
  - Levan Samkharauli National Forensics Bureau
  - Ministry of Internal Affairs of Georgia
  - Prosecutor’s Office of Georgia
  - Common Courts of Georgia
  institutionalContext: >-
    The Public Defender’s 2021 report reviewed a main cohort of judgments and termination decisions from 2018–2019,
    with some cited cases from 2020. It describes investigators and prosecutors seeking to determine vaginal penetration
    from hymenal findings, including repeat examinations where a child had not alleged penetration. The Bureau’s
    notice dated 26 October 2021 records training with the Public Defender and Council of Europe on forensic examination
    and avoiding secondary victimization. Georgia’s 2025 report to GREVIO describes a later procedural framework
    under Government Resolution No. 14 of 16 January 2023: hymenal integrity, injury characteristics and questions
    within the expert’s competence. It also describes adult consent and additional safeguards for minors. That
    procedural description alone does not establish continued use of an invalid sexual-history inference.
  consequences:
  - Forensic genital examinations of sexual-violence victims, including children
  - Scientifically invalid inferences about penetration from hymenal condition in reviewed cases
  - Medical reports used in criminal investigations and court proceedings
  - Risk of secondary victimization and distortion of credibility or penetration findings
  summary: >-
    Georgian investigators and prosecutors used hymenal findings to try to determine whether sexual penetration
    had occurred. The Public Defender’s review documented repeated orders for forensic examinations, sometimes
    where children’s accounts did not allege penetration. In one case, a further examination was ordered after
    an initial report found no injuries, despite no new evidence of penetration. The report identifies the state
    forensic bureau and examines how medical findings entered investigations and proceedings. Later training and
    the 2025 government report describe forensic standards, injury assessment and safeguards. They do not establish
    a specific withdrawal of the invalid inference, nor do they justify extending the documented case pattern
    through 2026. The documented cases span 2018–2020.
  mechanism:
    kind: standard-setting
    summary: >-
      In the reviewed cases, investigative orders directed forensic experts to assess hymenal condition, and investigators
      or prosecutors used those findings to try to establish vaginal penetration. This evidentiary inference is
      documented by the Public Defender; the later government report describes a procedural framework with a narrower
      evidentiary role.
  institutionalCorrection:
    status: undocumented
    summary: >-
      The Public Defender criticized the inference, and the Bureau later reported training on victim-sensitive
      forensic standards. The sources reviewed here do not identify an explicit decision by the adopting institutions
      to withdraw the inference. The 2025 description of injury examinations is not, by itself, evidence either
      of such a correction or of continuing virginity testing.
  endOpen: false
- id: tajikistan-2016-2024
  polity: Tajikistan
  region: Central Asia
  startYear: 2016
  endYear: 2024
  periodLabel: 2016 medical-examination mandate; forensic exception reported in January 2024
  strength: policy-basis
  institutionTypes:
  - government
  - medical
  institutions:
  - National Centre of Forensic Medicine
  institutionalContext: >-
    The UN Common Country Analysis’s 2024 update describes mandatory premarital medical examinations introduced
    through 2016 Family Code amendments and reports cases in which those examinations were used for virginity
    testing. The medical-examination mandate is not itself a virginity-testing mandate. The analysis also cites
    older reporting of about 600 examinations annually at the National Centre of forensic examination; this is
    an attributed figure, not a fresh 2024 or 2026 count. At the CEDAW meeting of 31 January 2024, Tajikistan’s
    delegation stated that virginity tests were prohibited in medical facilities, while authorities such as the
    National Centre of Forensic Medicine remained authorized to carry out checks in criminal investigations.
  consequences:
  - State forensic examinations intended to determine purported virginity
  - Authorization of such checks in criminal investigations, according to the 2024 delegation statement
  - Potential legal and social consequences of medico-legal findings about supposed virginity
  - Potential psychological, reputational and family harm associated with the practice
  summary: >-
    At its January 2024 CEDAW review, the delegation said that virginity tests were prohibited in medical facilities
    but that certain authorities, including the National Centre of Forensic Medicine, could perform them in criminal
    investigations. The UN country analysis separately describes reported premarital testing and repeats an older
    annual figure of about 600 examinations at the state forensic centre. These sources establish a reported restriction
    with a continuing authorized exception; they do not give the prohibition’s original enactment date or prove
    nationwide compliance. The 2024 endpoint marks the documented statement, rather than the end of testing. A
    forensic setting does not establish the scientific validity of the examination’s claimed sexual-history inference.
  mechanism:
    kind: enforcement
    summary: >-
      State forensic authorities conduct or are authorized to conduct examinations intended to determine supposed
      virginity for criminal investigations. The country analysis also reports use of premarital medical examinations
      for testing, without establishing that the Family Code itself required a virginity test.
  institutionalCorrection:
    status: partial
    periodLabel: restriction and forensic exception reported 31 January 2024
    action: >-
      Tajikistan’s delegation told CEDAW that virginity tests were prohibited in medical facilities but remained
      authorized for certain authorities, including the National Centre of Forensic Medicine, in criminal investigations.
    summary: >-
      The official statement describes a restriction in medical facilities alongside a retained forensic exception.
      This supports partial correction within the stated scope. The record does not establish when the underlying
      prohibition was enacted or the extent of its enforcement.
  endOpen: false
