  - National Security Agency
  - US-Kongress
  institutionalContext: >-
    Nach widersprüchlichen Meldungen der USS Maddox und USS Turner Joy in der Nacht des 4. August 1964 übernahm die
    Johnson-Regierung die Deutung eines zweiten Angriffs und ordnete unter dem Namen Operation Pierce Arrow
    Vergeltungsschläge an. Am 7. August verabschiedete der Kongress die Golf-von-Tonkin-Resolution. In ihrer Präambel
    hieß es, nordvietnamesische Marineeinheiten hätten US-Schiffe vorsätzlich und wiederholt angegriffen; zugleich erhielt
    der Präsident die Vollmacht, alle notwendigen Maßnahmen zur Abwehr bewaffneter Angriffe und zur Verhinderung weiterer
    Aggression zu ergreifen. Die Resolution wurde zu einer zentralen Rechtsgrundlage für die Ausweitung des US-Einsatzes,
    bis sie im Januar 1971 aufgehoben wurde. Die NSA hielt noch Jahre an einer offiziellen Darstellung fest, nach der
    der zweite Zwischenfall stattgefunden hatte; eine spätere interne historische Rekonstruktion verwarf diese Version.
  consequences:
  - US-Vergeltungsangriffe auf nordvietnamesische Marineanlagen und weitere Ziele
  - Verabschiedung einer Kongressresolution, deren Tatsachengrundlage vorsätzliche und wiederholte Angriffe behauptete
  - Weitreichende Vollmacht des Präsidenten zum Einsatz militärischer Gewalt in Südostasien
  - Nutzung der Golf-von-Tonkin-Resolution als Rechtsgrundlage für die massive Ausweitung des US-Einsatzes in Vietnam
  - Langjähriges institutionelles Fortbestehen einer Angriffsdarstellung, die spätere Nachrichtendienstanalysen verwarfen
  summary: >-
    Der falsche Angriff vom 4. August blieb nicht bei einer fehlerhaften Einsatzmeldung. Die US-Regierung übernahm ihn
    auf höchster Ebene, er trug zu unmittelbaren Vergeltungsschlägen bei und floss in die Tatsachenbegründung eines
    Gesetzes mit weitreichenden militärischen Vollmachten ein. 1971 hob der Kongress diese Ermächtigung auf. Eine spätere
    NSA-Auswertung, die auf erheblich mehr Fernmeldeaufklärung beruhte als die ursprüngliche Angriffsthese, kam zu dem
    Schluss, dass nordvietnamesische Kräfte die Zerstörer am 4. August nicht angegriffen hatten.
