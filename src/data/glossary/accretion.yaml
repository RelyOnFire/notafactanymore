term: Accretion
aliases:
- accretion flow
- accreting
- accretion disk
shortDefinition: The growth of an astronomical object as surrounding matter falls toward it under gravity; around black
  holes, the infalling material can become extremely hot and luminous.
longDefinition: Accretion is the gravitational accumulation of gas, dust, or other material onto an astronomical object.
  Around a black hole, orbiting matter can form a disk or other inflow in which friction, magnetic fields, and turbulence
  convert gravitational energy into heat and radiation before the material crosses the event horizon. This process powers
  active galactic nuclei and quasars.
relatedTerms:
- active-galactic-nucleus
reviewedAt: '2026-08-21'
sources:
- title: 'Imagine the Universe: Quasars'
  url: https://imagine.gsfc.nasa.gov/ask_astro/quasar.html
  publisher: NASA Goddard Space Flight Center
  note: Describes quasars as extremely luminous galactic nuclei powered by matter associated with massive central black
    holes.
