title: Beriberi as an infectious disease rather than a nutritional deficiency
entryId: beriberi-is-caused-by-infection
claim: Military and colonial medical institutions in Japan and the Dutch East Indies treated beriberi as principally
  infectious rather than diet-related. In Japan, Army medical leaders resisted ration reform after the Navy had
  nearly eliminated the disease through dietary change; in the Dutch East Indies, a government research commission
  initially concluded that a bacterial infection and toxin caused the disease before colonial laboratory and prison
  evidence shifted attention to polished rice.
currentUnderstanding: Beriberi is caused by thiamine (vitamin B1) deficiency. Diets dominated by highly polished
  rice can produce deficiency because milling removes thiamine-rich outer layers. Infection theories could not account
  for the Japanese Navy's dietary results, Eijkman's food-dependent animal experiments, Vorderman's prison survey
  or the later biochemical identification of thiamine. The early cause was genuinely uncertain; the institutional
  error was persisting with or formally endorsing an infectious model after strong dietary evidence emerged.
category: Medicine, nutrition and military health
reviewedAt: '2026-08-25'
impact:
  summary: Beriberi produced two unusually revealing institutional episodes in Asia. Japan's Navy changed sailors'
    diets and virtually eliminated the disease while Army medical leaders continued to favor infection and polished-rice
    rations. In the Dutch East Indies, the government sent a formal beriberi commission in 1886; its leaders returned
    convinced that a tropical bacterial infection produced a neurotoxin. The colonial medical system then generated
    its own contradiction. Eijkman's experiments connected polished rice with a beriberi-like neuropathy, and government
    physician Adolphe Vorderman found a striking prison-level association between polished rice and human beriberi.
    The prison evidence helped move dietary prevention into practice.
  highlights:
  - value: 1884–85
    label: Japanese Navy dietary experiments and ration reform were followed by the disappearance of beriberi from
      the Navy
  - value: 34 of 63 vs 1 of 27
    label: 'Dutch East Indies prisons with endemic or occasional beriberi in a later review: polished-rice prisons
      versus red-rice prisons'
    note: The historical review reports endemic beriberi in 34 of 63 prisons serving white polished rice and occasional
      beriberi in only one of 27 prisons serving red unpolished rice.
  - value: 1904–05
    label: the Japanese Army still suffered massive wartime beriberi after the Navy had supplied strong dietary
      counterevidence
  context:
  - Vitamin theory did not yet exist when the first commissions investigated beriberi. Bacteriology was transforming
    medicine, so an infectious hypothesis was initially reasonable. The institutional failure came later, when
    strong dietary evidence accumulated but the infectious interpretation continued to shape policy.
  - 'The Japanese case is principally a persistence problem: the Army maintained its infectious interpretation
    and ration policy after the Navy had produced strong contradictory evidence. The Dutch case is different:
    a state-sponsored infectious conclusion was progressively overturned by research generated within the same colonial
    medical and prison system.'
  - Vorderman's 1897 official prison investigation and the associated move toward unpolished rice mark a major
    institutional shift in the Dutch East Indies. They did not represent worldwide agreement on vitamin deficiency,
    and thiamine itself had not yet been isolated.
episodes:
- id: japan-army-1885-1905
  polity: Japan
  region: East Asia
  startYear: 1885
  endYear: 1905
  strength: policy-basis
  institutionTypes:
  - government
