    publisher: History of Psychiatry / PubMed
    note: Peer-reviewed historical analysis describing Cardiazol as the most widely used major somatic treatment
      in British public mental hospitals in the late 1930s, tracing the dubious biological-antagonism hypothesis,
      flawed outcome measurement, severe fear and the transition away from Cardiazol.
  - title: Report on Cardiazol Treatment and on the Present Application of Hypoglycaemic Shock Treatment in Schizophrenia
    url: https://books.google.com/books/about/Report_on_Cardiazol_Treatment_and_on_the.html?id=rdN0l6YuOXcC
    publisher: Board of Control for England and Wales / H.M. Stationery Office
    note: Bibliographic and digitized record of the Board of Control's 1938 official report specifically evaluating
      Cardiazol treatment and shock treatment in schizophrenia.
  - title: Mental Treatment — House of Commons debate, 14 July 1938
    url: https://api.parliament.uk/historic-hansard/commons/1938/jul/14/mental-treatment
    publisher: UK Parliament — Historic Hansard
    note: Primary parliamentary record confirming that the Board of Control was preparing a government report on
      Cardiazol injections for schizophrenia as the new treatment spread through public mental hospitals.
  - title: The treatment of schizophrenia with Metrazol by the production of convulsions
    url: https://jamanetwork.com/journals/jama/article-abstract/280297
    publisher: JAMA
    note: Contemporary 1938 clinical paper explicitly states Meduna's theory that schizophrenia and epilepsy were
      biologically antagonistic and describes attempts to cause remission by inducing epileptiform seizures with
      Metrazol.
  - title: The Medical Prescription of Patient Occupation
    url: https://www.ncbi.nlm.nih.gov/books/NBK588725/
    publisher: Palgrave Macmillan / NCBI Bookshelf
    note: Modern historical synthesis identifying Cardiazol as the most widely used somatic treatment for schizophrenia
      and affective disorders in British public mental hospitals and noting that the Maudsley barred trials because
      the induced convulsions caused extreme anxiety and fear.
