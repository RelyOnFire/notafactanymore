schemaVersion: 2
title: Caste as racial ancestry
proposition:
  summary: >-
    The 1901 Census of India treated relative caste rank as reflecting proportions of racial ancestry and used
    anthropometric measurements, especially the nasal index, to sort population groups into racial types and present
    social hierarchy as a measurable biological order.
correction:
  summary: >-
    Caste ranks do not map to discrete biological races, and nasal measurements cannot establish a group's place in a
    fixed racial ladder or its human worth. Genome-wide studies do find population structure, differing ancestry
    proportions and the effects of long-term endogamy in South Asia; one study also found a statistical association
    between traditional caste level and a modelled ancestry component in its sampled groups. Those findings describe
    histories of mixture, isolation and social practice, not Risley's fixed racial types and not a biological
    justification for caste hierarchy.
category: Race and anthropology
reviewedAt: '2026-09-27'
impact:
  summary: >-
    The Government of India connected an all-India Ethnographic Survey to the 1901 census and put Census Commissioner
    Herbert Risley in charge of both projects. The official 1903 report claimed that racial sentiment supplied caste's
    motive principle and that scientific methods confirmed it; its ethnographic appendices published the anthropometric
    material used in the caste chapter. Census classification by social precedence also gave caste groups a state forum
    in which to contest names and rank, prompting organized petitions. The census did not create caste, but it made one
    disputed racial and hierarchical interpretation part of official, comparable colonial knowledge.
  highlights:
    - value: 23 May 1901
      label: date of the Home Department proceedings for the census-linked Ethnographic Survey
    - value: 69 pages
      label: span of the official 1903 report's chapter on Caste, Tribe and Race, pages 489–557
    - value: '1911'
      label: next census year, when the documented Gwalior series replaced social precedence with occupational grouping
  context:
    - >-
      Caste, jati, varna and forms of inherited hierarchy long predated the colonial census. The institutional effect at
      issue is the census's standardization, ranking and racial interpretation of diverse identities, not an assertion
      that British officials invented caste.
    - >-
      The anthropometric appendices were sampled research material attached to the census project, not measurements of
      every person counted. Risley's inference also moved between bodily measurements and a social rank that officials
      had ascertained separately, so apparent agreement could not independently validate either hierarchy.
    - >-
      Modern population genetics requires a narrower correction than saying caste has no relationship to ancestry.
      Mixture was once widespread, later endogamy produced substantial structure, and ancestry proportions can correlate
      with language, geography and traditional caste level. These overlapping histories do not form pure, discrete
      races and do not make social rank a biological scale.
    - >-
      Institutional correction was delayed and staged. The 1911 Gwalior report rejected social-precedence classification
      as unsatisfactory but continued caste enumeration; only much later did an official Census of India monograph
      explicitly characterize Risley's racial classification as procedurally unsound and reject pure-race assumptions.
episodes:
  - id: british-india-1901-1903
    polity: British India
    region: South Asia
    startYear: 1901
    endYear: 1903
    periodLabel: 1901–1903
    strength: officially-endorsed
    institutionTypes:
      - government
    institutions:
      - Home Department, Government of India
      - Office of the Census Commissioner for India
    institutionalContext: >-
      The Home Department formally recorded an Ethnographic Survey in connection with the 1901 census. Risley, whose
      Bengal work had already joined caste description to anthropometric measurement, was Census Commissioner and
      honorary director of the wider survey. Provincial census and survey personnel collected, organized and published
      caste, social-precedence and bodily-measurement material. The central offices supplied authorization, direction and
      a common publication framework; the distributed provincial staff were the operating machinery.
    consequences:
      - People selected as caste or tribal specimens were measured and entered into anthropometric tables
      - Population groups were represented in official reports and maps as racial types
      - Caste returns were arranged through a disputed scale of social precedence
      - Caste associations organized petitions seeking different names or higher placement in the census hierarchy
      - A colonial racial theory gained the authority and circulation of an all-India government publication
    summary: >-
      Between the census operation in 1901 and publication of the report and appendices in 1903, the Government of India
      turned Risley's racial theory of caste into an official classification project. Anthropometric samples, especially
      nasal indices, were read alongside caste and social-precedence returns to argue that narrower noses and greater
      supposed Aryan ancestry tracked higher status. The operation measured only selected subjects, and the hierarchy was
      also assembled from social judgments and petitions; it was therefore not an independent biological discovery.
    mechanism:
      kind: classification
      summary: >-
        The census and linked ethnographic survey converted selected body measurements, caste returns and judgments of
        social precedence into standardized tables, racial types, maps and an official explanatory chapter.
    institutionalCorrection:
      status: corrected
      periodLabel: 1911–1969
      action: The 1911 Gwalior census series replaced social-precedence ranking with occupational grouping; a later Census of India monograph explicitly rejected Risley's racial classification as procedurally unsound.
      summary: >-
        Correction came in stages. The documented 1911 successor report called the social-precedence method
        unsatisfactory and changed the grouping basis, although it retained caste enumeration. In a 1961 Census of India
        monograph published in 1969, the Office of the Registrar General stated that Risley's classification rested on
        unsatisfactory procedures, confused language with race and could not sustain a map of pure races in India.
