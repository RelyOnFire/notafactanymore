- id: australia-1889-1992
  polity: Australia
  region: Oceania
  startYear: 1889
  endYear: 1992
  strength: policy-basis
  institutionTypes:
  - government
  - court
  institutions:
  - Australian colonial and state land administrations
  - Judicial Committee of the Privy Council
  - Australian common-law courts
  institutionalContext: Colonial governments had already treated vast areas as Crown land, but Cooper v Stuart in
    1889 supplied a particularly clear judicial statement that New South Wales had been practically unoccupied and
    without settled law when annexed. The resulting legal framework treated Indigenous customary interests as outside
    ordinary common-law property recognition. In Milirrpum v Nabalco in 1971, the Northern Territory Supreme Court
    rejected a claim to native title. The High Court's Mabo (No 2) judgment on 3 June 1992 reversed that foundation
    by recognising that native title survived the acquisition of sovereignty where it had not been validly extinguished.
  consequences:
  - Denial within Australian common law of a general doctrine recognising pre-existing Indigenous proprietary rights
  - Treatment of Crown title as overriding or excluding Indigenous customary ownership in ordinary land administration
  - Failure of the 1971 Gove land-rights claim despite extensive evidence of Yolngu law and connection to country
  - Long-term legal barriers to Indigenous communities seeking recognition of traditional land rights
  - Post-Mabo creation of a national statutory native-title framework through the Native Title Act 1993
  summary: The institutional belief was not simply that Europeans had arrived first or that Indigenous people were
    absent. Australian law treated Indigenous systems of landholding as incapable of generating property rights
    recognised by the common law. Mabo rejected that legal fiction and held that native title could survive sovereignty,
    changing the foundation of Australian land law while leaving room for earlier valid acts to have extinguished
    title.
  sources:
