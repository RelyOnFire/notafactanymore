schemaVersion: 2
title: Anal examinations as proof of same-sex conduct
proposition:
  summary: >-
    The shape, tone, or condition of the anus and anal sphincter was treated as physical evidence that a person had
    engaged in receptive anal intercourse.
correction:
  summary: >-
    Anal examinations cannot reliably determine whether someone has previously engaged in consensual receptive anal
    intercourse. The supposed forensic signs descend from discredited nineteenth-century theories and have no
    scientifically valid evidentiary value.
category: Forensic medicine and sexuality
reviewedAt: '2026-09-07'
episodes:
  - id: egypt-2001-2024
    polity: Egypt
    region: Middle East
    startYear: 2001
    endYear: 2024
    periodLabel: 2001–June 2024 (documented)
    strength: policy-basis
    institutionTypes:
      - government
      - court
      - medical
    institutions:
      - Forensic Medicine Authority (مصلحة الطب الشرعي)
      - Egyptian Public Prosecution (النيابة العامة)
      - Ministry of Justice (وزارة العدل)
    institutionalContext: >-
      Public prosecutors refer defendants accused of “debauchery” for examination; the Ministry of Justice’s Forensic
      Medicine Authority performs the examinations and produces reports used as evidence. Police make arrests and escort
      detainees, but the decisive medico-legal chain is prosecution referral → Forensic Medicine Authority examination →
      court use of the report. Recent documentation shows that this chain continued well beyond 2017 and remained in
      operation into the 2020s.
    consequences:
      - Forced anal examinations
      - Medical reports used in prosecutions
      - Conviction and imprisonment on allegations of consensual same-sex conduct
      - Cruel, degrading and potentially torturous treatment
    summary: >-
      Egyptian prosecutors have repeatedly referred men and transgender women accused of “debauchery” to the Justice
      Ministry’s Forensic Medicine Authority for anal examinations intended to produce evidence of receptive anal sex. The
      practice is documented from the 2001 Queen Boat prosecutions into the 2020s. A joint civil-society submission
      covering July 2019–June 2024 documented 45 people referred by prosecutors for forced anal examinations. The 2023
      U.S. human-rights report also records forensic examinations in “debauchery” cases, including a December prosecution,
      despite the absence of scientific validity.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Prosecutors formally refer defendants to the Justice Ministry’s forensic authority, which performs examinations
        intended to infer receptive anal intercourse and returns reports for use in criminal proceedings.
    institutionalCorrection:
      status: undocumented
      summary: >-
        The reviewed sources document referrals through June 2024 but do not establish an institutional decision to
        withdraw the disputed inference or end the examinations. June 2024 is the submission’s reporting cutoff, not a
        documented end to the practice.
  - id: lebanon-2012-2015
    polity: Lebanon
    region: Middle East
    startYear: 2012
    endYear: 2015
    periodLabel: 2012–2015
    strength: policy-basis
    institutionTypes:
      - government
      - court
    institutions:
      - Cassation Public Prosecution
      - Internal Security Forces
    institutionalContext: >-
      Internal Security Forces arrests fed suspects into a medico-legal process in which public prosecutors could order
      forensic anal examinations. The Cassation Public Prosecution sat at the top of the national prosecutorial hierarchy;
      its 2012 directive did not impose a categorical ban, but permitted examinations with purported consent and treated
      refusal as incriminating. The Lebanese Order of Physicians separately instructed doctors not to perform the tests.
      The justice minister requested a complete ban in August 2012, but the new public prosecutor forwarded that request
      without issuing a binding directive. Human Rights Watch documented continued examinations or threats of examination
      in 2014 and 2015.
    consequences:
      - Forced anal examinations
      - Medical evidence used in criminal charges
      - Cruel and degrading treatment
    summary: >-
      In 2012, Lebanese public prosecutors ordered forensic anal examinations of men arrested on suspicion of homosexual
      conduct, and examination results contributed to criminal charges. The Lebanese Order of Physicians condemned the
      tests as medically and scientifically useless and a form of torture. The practice did not end immediately: the public
      prosecutor’s 2012 directive still allowed examinations under purported consent and treated refusal as evidence, and
      the justice minister’s subsequent request for a complete ban did not produce a binding prosecutorial directive.
      Later reporting documented continued use or threats of use through 2015.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Police arrests and prosecutorial referrals fed suspects into forensic examinations whose results could be used in
        criminal charges.
    institutionalCorrection:
      status: partial
      periodLabel: 2012–2015
      action: >-
        The Lebanese Order of Physicians prohibited doctors from performing the examinations on 7 August 2012; on
        11 August the justice minister asked the public prosecutor to order a complete end to them.
      summary: >-
        The medical authority rejected the tests as useless and abusive. The new public prosecutor forwarded the
        minister’s request without a binding directive, while the earlier consent rule treated refusal as incriminating.
        Examinations or threats continued through 2015, so the corrective response was incomplete.
  - id: kenya-2015-2018
    polity: Kenya
    region: East Africa
    startYear: 2015
    endYear: 2018
    periodLabel: 2015–2018
    strength: officially-endorsed
    institutionTypes:
      - government
      - court
      - medical
    institutions:
      - Chief Magistrate Ukunda Law Courts
      - DCIO, Msambweni Police Station
      - Makadara General Hospital, Kwale
    institutionalContext: >-
      In a 2015 criminal investigation, the prosecution sought medical examinations intended to establish same-sex conduct,
      a magistrate authorized the process, and a public hospital examined the two men. The Kenyan Court of Appeal later
      reconstructed that institutional chain and held in 2018 that the forced anal examinations violated constitutional
      rights and that the resulting evidence should be expunged from the criminal proceedings.
    consequences:
      - Court-authorized forced anal examinations
      - Police transport and coercive medical examination of accused men
      - Use of supposed anatomical evidence in a criminal prosecution
      - Violation of privacy, dignity and protection from degrading treatment
    summary: >-
      After two men were arrested in Kwale in 2015, state investigators obtained a magistrate’s order and took them to
      Makadara General Hospital for forced examinations intended to provide evidence of same-sex conduct. In 2018 the Court
      of Appeal held that the examinations violated their rights and that the evidence should be expunged. The judgment
      records appellants’ counsel arguing that anal examination cannot establish the alleged conduct, an objection
      consistent with international medical consensus. The court’s own reasoning rests on the unlawful examination order,
      constitutional rights and the rule against self-incrimination.
    mechanism:
      kind: enforcement
      summary: >-
        Police and prosecutors obtained judicial authorization for coercive medical examinations, and a public hospital
        performed them to generate evidence for a criminal prosecution.
    institutionalCorrection:
      status: corrected
      periodLabel: '2018'
      action: >-
        On 22 March 2018 the Court of Appeal of Kenya declared the forced examinations unconstitutional and their results
        inadmissible in the appellants’ criminal proceedings.
      summary: >-
        The appellate court set aside the High Court’s dismissal of the challenge and directed that the examination
        evidence be expunged. This establishes a judicial correction in the appellants’ case, without establishing a
        nationwide withdrawal by police or medical authorities or a separate scientific-validity ruling.
  - id: kazakhstan-2016
    polity: Kazakhstan
    region: Central Asia
    startYear: 2016
    endYear: 2016
    periodLabel: 2016 approval
    strength: policy-basis
    institutionTypes:
      - government
      - medical
    institutions:
      - Center for Forensic Medicine, Ministry of Justice of the Republic of Kazakhstan
    institutionalContext: >-
      Kazakhstan decriminalized consensual same-sex relations in 1998; this methodology is framed for investigations of
      sexual crimes. Even so, the Ministry of Justice forensic methodology directs experts to examine the anus and rectum
      for supposed signs characteristic of a “passive partner,” including sphincter tone, funnel-shaped or gaping appearance
      and smoothed radial folds. The methodology was approved by the Center for Forensic Medicine’s Scientific Council on
      5 December 2016 and remains available on the Ministry of Justice forensic portal. The episode records that approval;
      online availability does not establish continuous use in casework through 2026.
    consequences:
      - Official instructions for invasive forensic examination of the anus and rectum
      - Anatomically unsupported inference about repeated receptive anal intercourse
      - Potentially misleading expert evidence in criminal investigations
    summary: >-
      A methodology approved by Kazakhstan’s Ministry of Justice forensic centre in 2016 for examining men in sexual-crime
      investigations treats several chronic anorectal features as characteristic of systematic receptive male-male
      intercourse. It instructs examiners to assess sphincter tone by digital examination and lists funnel-shaped or gaping
      appearance, smoothed folds, sphincter relaxation and mucosal coloration as characteristic changes in “systematic”
      passive partners. Modern forensic consensus rejects those features as reliable evidence that a person has previously
      engaged in consensual receptive anal intercourse.
    mechanism:
      kind: standard-setting
      summary: >-
        The Ministry of Justice forensic centre codified anorectal inspection and sphincter examination in an official
        methodology that assigns evidentiary meaning to features said to characterize repeated receptive intercourse.
    institutionalCorrection:
      status: undocumented
      summary: >-
        The 2025 forensic handbook describes sexual-offence examinations without affirming or withdrawing the disputed
        chronic-sign inference. The reviewed sources establish neither an institutional correction nor the inference’s
        current use in casework.
  - id: uzbekistan-2017-2026
    polity: Uzbekistan
    region: Central Asia
    startYear: 2017
    endYear: 2026
    endOpen: true
    periodLabel: 2017–present
    strength: policy-basis
    institutionTypes:
      - government
    institutions:
      - Ministry of Internal Affairs of the Republic of Uzbekistan
    institutionalContext: >-
      Law-enforcement officials order forensic anal examinations of men detained under Article 120, which criminalizes
      consensual same-sex relations between men. Medical reports have been introduced as evidence in prosecutions, and
      courts have relied on supposed anatomical signs such as smoothed radial folds and weakened sphincter tone. Reporting
      on 2025 and a June 2026 joint statement document the practice as continuing alongside intensified Article 120 enforcement.
    consequences:
      - Forced anal examinations in detention
      - Medical reports used as evidence of consensual same-sex conduct
      - Criminal convictions, house arrest and imprisonment
      - Cruel, degrading and potentially torturous treatment
    summary: >-
      Uzbek law-enforcement authorities have ordered forced anal examinations to obtain supposed evidence for prosecutions
      under Article 120 of the Criminal Code. A documented 2021 case shows a Tashkent court relying in part on a forensic
      report that treated superficial tears, smoothed radial folds and weakened sphincter tone as evidence of anal sex. The
      practice remained current in 2025, when two men in Tashkent were reportedly subjected to non-consensual forensic anal
      examinations, and a June 2026 multi-organization statement describes involuntary invasive examinations as an ongoing
      enforcement practice associated with Article 120.
    mechanism:
      kind: enforcement
      summary: >-
        Law-enforcement authorities order involuntary forensic examinations, examiners convert anatomical observations into
        reports about same-sex conduct, and criminal courts may use those reports as evidence under Article 120.
    institutionalCorrection:
      status: undocumented
      summary: >-
        The June 2026 joint statement describes continued involuntary examinations and calls for them to end. The reviewed
        material does not document an institutional decision to abandon the disputed inference or prohibit these examinations.
