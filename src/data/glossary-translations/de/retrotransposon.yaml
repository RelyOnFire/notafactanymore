entryId: retrotransposon
sourceReviewedAt: '2026-08-21'
term: Retrotransposon
aliases:
- Retrotransposons
shortDefinition: Ein mobiles genetisches Element, das sich über eine RNA-Zwischenstufe kopiert, die wieder in DNA
  umgeschrieben wird.
longDefinition: Retrotransposons sind DNA-Sequenzen, die zunächst eine RNA-Kopie von sich erzeugen und daraus durch
  Reverse Transkription wieder DNA herstellen können, die an anderer Stelle im Genom eingebaut wird. Ihr Lebenszyklus
  ist ein natürliches Beispiel für Informationsfluss von RNA zurück zu DNA.
