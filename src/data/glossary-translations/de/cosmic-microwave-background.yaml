entryId: cosmic-microwave-background
sourceReviewedAt: '2026-08-21'
term: Kosmische Mikrowellen-Hintergrundstrahlung
aliases:
- CMB
- kosmische Hintergrundstrahlung
shortDefinition: Schwache Mikrowellenstrahlung aus dem frühen Universum, die frei wurde, als der Kosmos etwa 380.000
  Jahre nach dem Urknall durchsichtig wurde.
longDefinition: Die kosmische Mikrowellen-Hintergrundstrahlung oder CMB ist Reliktstrahlung aus dem heißen frühen Universum.
  Sie wurde frei, als sich das Universum so weit abgekühlt hatte, dass Elektronen und Atomkerne neutrale Atome bilden
  konnten und Photonen sich frei ausbreiteten. Winzige Temperatur- und Polarisationsschwankungen enthalten Informationen
  über das frühe Universum und schränken die Anteile gewöhnlicher Materie, Dunkler Materie, Dunkler Energie und weitere
  kosmologische Parameter stark ein.
