  - id: steam-minister-carrier
    sourceId: steam-health-minister-2021
    relation: documents
    target: {scope: episode, episodeId: tanzania-2020-2021, aspect: carrier}
    locator: 1 February 2021 press-conference report
    note: >-
      Attributes the advice to Health Minister Dorothy Gwajima and records that it was delivered as ministry guidance in
      response to questions about COVID-19 vaccination and prevention.
  - id: steam-contested-context
    sourceId: steam-contested-truths
    relation: contextualizes
    target: {scope: episode, episodeId: tanzania-2020-2021, aspect: context}
    locator: section “Steam Inhalation as Alternative Therapeutic for COVID-19”
    note: >-
      The peer-reviewed analysis documents internal disagreement: Deputy Health Minister Faustine Ndugulile warned that
      steaming did not treat COVID-19 before the president promoted it. It also describes the customary herb-infused form
      and the polarized public debate that followed state endorsement.
  - id: steam-review-episode-context
    sourceId: steam-review-2022
    relation: contextualizes
    target: {scope: episode, episodeId: tanzania-2020-2021, aspect: context}
    locator: abstract; sections 3.4, 4, 6 and 8
    note: >-
      Places the official claims against the intervention's clinical record. Even this favorably framed narrative review
      found no established in-vivo temperature, humidity or exposure parameters and called for large randomized trials;
      it therefore does not support treating the government's therapeutic claims as established science.
  - id: steam-systematic-review-episode-context
    sourceId: steam-covid-systematic-review
    relation: contextualizes
    target: {scope: episode, episodeId: tanzania-2020-2021, aspect: context}
    locator: abstract and conclusion; PMID 37426512
    note: >-
      The later systematic review found only three eligible steam-inhalation studies and insufficient evidence for
      prevention, with too little evidence to determine a treatment role. It supplies no clinical basis for the earlier
      nationwide promotion.
  - id: steam-cochrane-episode-context
    sourceId: steam-cochrane-common-cold
    relation: contextualizes
    target: {scope: episode, episodeId: tanzania-2020-2021, aspect: context}
    locator: abstract, main results and authors' conclusions; PMID 28849871
    note: >-
      This pre-pandemic review of heated, humidified air for the common cold found inconsistent low-quality symptom
      effects and no significant reduction in viral shedding. It shows why possible comfort from humidification could
      not validate the claimed antiviral mechanism against SARS-CoV-2.
  - id: steam-speech-mechanism
    sourceId: steam-magufuli-speech
    relation: documents
    target: {scope: episode, episodeId: tanzania-2020-2021, aspect: mechanism}
    locator: full one-page transcript and English translation
    note: >-
      Captures the simple explanatory device used to authorize the treatment: boiling-water temperature plus the viral
      lipid envelope supposedly meant the virus would melt or disintegrate in the nose and mouth.
  - id: steam-health-mechanism
    sourceId: steam-tanzania-health-2021
    relation: documents
    target: {scope: episode, episodeId: tanzania-2020-2021, aspect: mechanism}
    locator: paragraphs on safety review, distribution strategy and listed oral and volatile-oil products
    note: >-
      Shows how government safety testing and registration were converted into a plan for wider availability through
      agents, pharmacies and health facilities. It says five oral and four volatile-oil products were approved but names
      only two oils, underscoring that the announcement was not a clinical efficacy report.
  - id: steam-campaign-mechanism
    sourceId: steam-nyungu-week
    relation: documents
    target: {scope: episode, episodeId: tanzania-2020-2021, aspect: mechanism}
    locator: minister's quoted announcement of “Season Three”
    note: >-
      Demonstrates mass-mobilization mechanics: a senior regional-government minister set common dates for a countrywide
      week and bundled steaming with fruit, prayer and continued work.
  - id: steam-health-consequences
    sourceId: steam-tanzania-health-2020
    relation: supports
    target: {scope: episode, episodeId: tanzania-2020-2021, aspect: consequences}
    locator: 31 August 2020 item, paragraphs quoting Dr Grace Magembe
    note: >-
      Documents claimed large-scale uptake and official attribution of success. Because the ministry provides no outcome
      design or disaggregated COVID-19 data, the figure cannot show recovery, prevention or population benefit.
  - id: steam-burns-consequences
    sourceId: steam-burns-lancet
    relation: contextualizes
    target: {scope: episode, episodeId: tanzania-2020-2021, aspect: consequences}
    locator: full correspondence, Lancet 395 (2020), p. 1690; PMID 32422125
    note: >-
      Establishes that promotion of bowl-based steaming carries a concrete paediatric scald hazard. The evidence supports
      exposure to risk in Tanzania, but it does not document a Tanzanian injury total.
  - id: steam-contested-consequences
    sourceId: steam-contested-truths
    relation: contextualizes
    target: {scope: episode, episodeId: tanzania-2020-2021, aspect: consequences}
    locator: section “Steam Inhalation as Alternative Therapeutic for COVID-19” and Figure 1 discussion
    note: >-
      Describes the sharp rise in Swahili social-media discussion after the 22 April address and the conflict between
      professional warning and presidential authority. This supports public amplification, not a quantified health effect.
  - id: steam-policy-partial-correction
    sourceId: steam-tanzania-policy-shift
    relation: documents
    target: {scope: episode, episodeId: tanzania-2020-2021, aspect: institutional-correction}
    locator: paragraphs 2–20, especially the 6 April appointment and 17 May recommendations
    note: >-
      The official account records the expert committee's call for science-proven traditional medicines, accurate data,
      international prevention standards and vaccination. It also says on 29 June that not all recommendations had yet
      produced new policy, supporting a partial rather than immediate or steam-specific correction.
  - id: steam-vaccine-correction
    sourceId: steam-vaccine-arrival
    relation: documents
    target: {scope: episode, episodeId: tanzania-2020-2021, aspect: institutional-correction}
    locator: 24 July 2021 photo essay, opening four sections
    note: >-
      Documents receipt of the first vaccine shipment and the planned national campaign. It is the material prerequisite
      for implementation of the broader policy reversal, without showing a specific withdrawal of steam advice.
  - id: steam-rollout-correction
    sourceId: steam-vaccine-rollout
    relation: documents
    target: {scope: episode, episodeId: tanzania-2020-2021, aspect: institutional-correction}
    locator: paragraph beginning “On 28 July 2021”
    note: >-
      WHO records that Tanzania launched its COVID-19 vaccination programme on 28 July 2021, supplying the implementation
