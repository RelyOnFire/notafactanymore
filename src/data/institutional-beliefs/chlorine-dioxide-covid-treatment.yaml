evidence:
  - id: chlorine-law-proposition
    sourceId: chlorine-law-1351
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: Arts. 1, 4(b), 5–10; pp. 1–3
    note: >-
      The statute expressly frames chlorine dioxide as prevention and treatment, permits pharmacy sale without a
      prescription, requires public-health supply and assigns communication, acquisition and free-distribution duties.
  - id: chlorine-review-correction
    sourceId: chlorine-systematic-review
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Abstract and Results; pp. 605–610
    note: >-
      PRISMA-based review found no published or preprint human study of inhaled, oral or parenteral chlorine dioxide or
      derivatives for COVID-19 or other coronavirus infections at the search date; one registered observational study had
      no results.
  - id: chlorine-paho-correction
    sourceId: chlorine-paho-2020
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Key messages, p. 1; Toxicity, pp. 2–3
    note: >-
      PAHO advises against oral or parenteral use for suspected or diagnosed COVID-19 or any other case, citing no evidence
      of effectiveness and the possibility of serious adverse effects from ingestion or inhalation.
  - id: chlorine-rct-correction
    sourceId: chlorine-mouthwash-rct
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Abstract, Methods and Results
    note: >-
      In a randomized trial, 0.01% aqueous chlorine-dioxide mouthwash did not reduce salivary SARS-CoV-2 viral titer versus
      purified water at 10, 30 or 60 minutes. This narrow mouth-rinse result supplies no evidence for internal administration.
  - id: chlorine-toxicity-correction
    sourceId: chlorine-poison-centres
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: pp. 448–449 and Table 1
    note: >-
      Analysis of 53 U.S. poison-centre exposures found ingestion was the most common route; vomiting, nausea, abdominal
      pain and diarrhea were frequent, 13 patients were hospitalized, and two required critical care.
  - id: chlorine-law-impact
    sourceId: chlorine-law-1351
    relation: documents
    target: {scope: belief, aspect: impact}
    locator: Arts. 4–11; pp. 1–3
    note: >-
      Documents the scale of the legal framework: non-prescription sale, public-sector supply, information, acquisition,
      free distribution and financing responsibilities.
  - id: chlorine-law-carrier
    sourceId: chlorine-law-1351
    relation: documents
    target: {scope: episode, episodeId: bolivia-2020-2023, aspect: carrier}
    locator: Heading and promulgation clause, pp. 1 and 4
    note: >-
      Identifies the Asamblea Legislativa Plurinacional as the enacting institution and its acting president as the official
      who promulgated the law on 14 October 2020.
  - id: chlorine-law-mechanism
    sourceId: chlorine-law-1351
    relation: documents
    target: {scope: episode, episodeId: bolivia-2020-2023, aspect: mechanism}
    locator: Arts. 3–11; pp. 1–3
