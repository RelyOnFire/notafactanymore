term: Klimaxgemeinschaft
aliases:
- Klimax
- klimatische Klimax
shortDefinition: In der klassischen Sukzessionstheorie die reife, relativ stabile Gemeinschaft, die am Endpunkt ökologischer
  Sukzession erwartet wurde.
longDefinition: Die Klimaxgemeinschaft stand im Zentrum von Frederic Clements' einflussreichem Sukzessionsmodell. Vegetation
  sollte sich in geordneten Stufen zu einer reifen, vor allem vom regionalen Klima bestimmten Gemeinschaft entwickeln.
  Der Begriff Klimax wird in manchen Zusammenhängen weiterhin verwendet, doch die Vorstellung eines einzigen unvermeidlichen
  dauerhaften Endpunkts wurde durch Modelle mit Störungen, mehreren Entwicklungspfaden und alternativen Zuständen abgelöst.
