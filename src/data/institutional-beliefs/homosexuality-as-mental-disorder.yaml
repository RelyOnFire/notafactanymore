schemaVersion: 2
title: Homosexuality as a mental disorder
proposition:
  summary: >-
    Authoritative medical classifications and state medical systems treated homosexuality as a diagnosable mental,
    personality or sexual disorder. The form varied: some classifications pathologized same-sex orientation itself,
    while later residual categories linked diagnosis to distress about orientation or a wish to change it.
correction:
  summary: >-
    Homosexuality and bisexuality are normal variations in human sexuality, not mental disorders, sexual disorders or
    perversions. Lesbian, gay and bisexual people can experience depression, anxiety or other conditions that merit care,
    but stigma-related distress does not make their orientation pathological. Care should address the person's actual
    needs without treating a heterosexual outcome as the clinical goal; the ICD-11 therefore contains no diagnostic
    category based on sexual orientation.
category: Psychiatry, classification and sexuality
reviewedAt: '2026-09-27'
impact:
  summary: >-
    Diagnostic classifications carry authority through clinical coding, health statistics, professional training and
    administration. WHO's classification gave the proposition international reach; national carriers then changed on
    different schedules. Brazil redirected coding in 1985, China's CCMD-3 partially normalized homosexuality while
    retaining an ambiguous named diagnosis, and Iran's military-exemption system still processes gay men through a
    medical or psychiatric route according to current government country assessments.
  highlights:
    - value: '1948'
      label: ICD-6 classified homosexuality as a mental disorder
    - value: 17 May 1990
      label: World Health Assembly adopted the revision that removed homosexuality itself as a diagnosis
    - value: 2019–22
      label: ICD-11 was adopted and took effect without the remaining sexual-orientation-based categories
  context:
    - >-
      A blanket diagnosis of homosexuality and a diagnosis tied to distress about orientation are not identical. Both
      appear here because the latter preserved a diagnostic rationale based specifically on sexual orientation, but the
      episode text distinguishes each step rather than treating partial and full depathologization as the same event.
    - >-
      Adoption and operational dates differ. The World Health Assembly adopted ICD-10 in May 1990 and it took effect in
      1993; it adopted ICD-11 in May 2019 and that revision took effect in 2022.
    - >-
      A classification's availability does not establish how often a particular diagnosis was assigned. In China, a
      current forensic standard cites CCMD-3 as a general diagnostic reference, but the evidence assembled here does not
      show present-day forensic use of its homosexuality category.
    - >-
      Sexual orientation and gender identity are distinct. Some Iran sources discuss gay men and transgender people
      together because the exemption system routes both through medical categories; this entry uses those sources only
      for what they establish about homosexuality and does not treat transgender identity as a sexual orientation or a
      mental disorder.
episodes:
  - id: who-1948-1990
    polity: International — World Health Organization
    region: Global
    startYear: 1948
    endYear: 1990
    periodLabel: 1948–1990
    strength: policy-basis
    institutionTypes:
      - government
      - medical
    institutions:
      - World Health Organization (WHO)
      - World Health Assembly
    institutionalContext: >-
      ICD-6 placed homosexuality within the mental-disorder classification in 1948, and the ICD-9 still listed it under
      sexual deviations and disorders. Because WHO's ICD supplies a shared language for morbidity statistics and informs
      clinical and administrative systems, this was more than a statement by one professional association. On 17 May
      1990 the World Health Assembly adopted ICD-10, which removed homosexuality itself and stated that sexual orientation
      alone was not a disorder. ICD-10 nevertheless retained F66 diagnoses, including egodystonic sexual orientation,
      until ICD-11 removed all categories based on sexual orientation.
    consequences:
      - International classification of homosexuality as mental pathology
      - Medical legitimacy for national and professional pathologization
      - Propagation through health statistics, clinical coding, teaching and administration
      - A diagnostic rationale for treatment directed at sexual orientation, retained in narrower form under ICD-10
    summary: >-
      WHO's sixth International Classification of Diseases classified homosexuality as a mental disorder in 1948, and
      later revisions carried the proposition through the international classification system. The 1990 adoption of
      ICD-10 ended the diagnosis of homosexuality itself, although orientation-based F66 diagnoses remained. Adoption of
      ICD-11 in 2019 completed the classification-level correction by omitting those residual categories as well.
    mechanism:
      kind: classification
      summary: >-
        WHO encoded the proposition in successive editions of the international disease classification, allowing the
        category to travel through national coding, clinical, statistical, educational and administrative systems.
    institutionalCorrection:
      status: corrected
      periodLabel: 1990–2019
      action: >-
        The World Health Assembly adopted ICD-10 without a diagnosis of homosexuality itself in 1990, then adopted
        ICD-11 without the residual sexual-orientation-based F66 diagnoses in 2019.
      summary: >-
        WHO corrected the classification in two stages. ICD-10 explicitly said that orientation alone was not a disorder
        but retained diagnoses defined around conflict or distress about orientation. The ICD-11 revision removed those
        categories after a WHO working group found no adequate clinical, public-health or research justification for
        them.
  - id: china-1989-2026
    polity: China
    region: East Asia
    startYear: 1989
    endYear: 2026
    endOpen: true
    periodLabel: 1989–present
    strength: policy-basis
    institutionTypes:
      - government
      - medical
      - professional
    institutions:
      - Chinese Society of Psychiatry / Chinese Medical Association
      - Ministry of Justice forensic-identification system
    institutionalContext: >-
      CCMD-2 (1989) and CCMD-2-R (published in 1995) retained homosexuality in China's psychiatric nosology. CCMD-3
      made a substantive change in 2001: its accompanying explanation said same-sex sexuality was not necessarily
      abnormal and contemporary reporting said only cases involving serious conflict or distress should be treated as a
      psychosexual disorder. Yet the published classification still placed diagnoses named “homosexuality” (62.31) and
      “bisexuality” (62.32) under “sexual orientation disorders,” and its listed criteria did not state distress as a
      discrete mandatory element. China has begun moving toward ICD-11, but a Ministry of Justice standard issued in
      2024 and effective in 2025 still permits forensic diagnosis under either ICD or CCMD-3.
    consequences:
      - Professional classification of homosexuality in CCMD-2 and CCMD-2-R
      - Continued presence of a diagnosis named homosexuality after the partial normalization announced in 2001
      - A classification rationale that could direct treatment toward changing sexual orientation
      - Continued availability of CCMD-3 as a general reference in state forensic psychiatry
    summary: >-
      China's 2001 revision should not be described either as no change or as an unqualified deletion. It rejected the
      premise that every homosexual person was mentally ill and framed pathology around associated conflict or distress,
      while the manual itself retained a named homosexuality diagnosis inside a disorder chapter. CCMD-3's influence is
      waning as China adopts international classifications, but it remains an authorized forensic reference. That keeps
      the classification-level episode open while leaving actual current use of diagnosis 62.31 unproven.
    mechanism:
      kind: classification
      summary: >-
        A national professional body encoded homosexuality in successive CCMD manuals; later Justice Ministry standards
        incorporated CCMD-3 by reference as one of the classifications available for forensic mental-state diagnosis.
    institutionalCorrection:
      status: partial
      periodLabel: 2001–present
      action: >-
        CCMD-3 stated that same-sex sexuality was not necessarily abnormal, and China later began implementing ICD-11,
        which contains no diagnosis based on sexual orientation.
      summary: >-
        The 2001 revision was a meaningful but internally inconsistent correction. Its explanatory text and public
        presentation rejected automatic pathologization, while its hierarchy and criteria retained homosexuality as a
        named disorder. China has not yet documented a complete replacement of CCMD-3 across the systems examined here;
        the 2025 forensic standard still names it alongside ICD.
  - id: brazil-1979-1985
    polity: Brazil
    region: Latin America
    startYear: 1979
    endYear: 1985
    periodLabel: 1979–1985
    strength: policy-basis
    institutionTypes:
      - government
      - medical
      - professional
    institutions:
      - Ministério da Saúde
      - Conselho Federal de Medicina (CFM)
      - Centro Brasileiro de Classificação de Doenças (CBCD)
    institutionalContext: >-
      The ICD-9, in effect from 1979, placed homosexuality at 302.0 under “sexual deviations and disorders” in the
      mental-disorders chapter. After Grupo Gay da Bahia asked that the diagnosis be made ineffective in Brazil, the
      request moved through the federal health administration. The CBCD proposed V62 for consultations whose reason was
      homosexuality, the Ministry of Health referred the question to the CFM, and the CFM approved that approach in 1985.
    consequences:
      - Diagnostic coding of homosexuality within the mental-disorders chapter
      - Medical authority for treating homosexuality as a sexual deviation or disorder
      - Institutional stigma in health care
    summary: >-
      Brazil used ICD-9 code 302.0, which classified homosexuality under sexual deviations and disorders. In 1985 the
      CFM authorized physicians to code consultations prompted by homosexuality under V62, “other psychosocial
      circumstances,” instead. If a separate illness was present, that underlying condition was to be coded. The opinion
      changed Brazilian coding practice without formally rewriting the international ICD-9 category or unequivocally
      resolving every medical disagreement recorded in the opinion.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Brazil's health system applied the ICD-9 disease code until federal classification and medical authorities
        approved an alternative non-disease code for consultations concerning homosexuality.
    institutionalCorrection:
      status: partial
      periodLabel: 1985–1999
      action: >-
        The CFM authorized V62 rather than 302.0 in 1985; in 1999 the Federal Council of Psychology barred psychologists
        from practices that pathologize homoerotic behavior or promise a cure.
      summary: >-
        The 1985 opinion removed compelled use of the mental-disorder code in Brazilian medical practice, but used
        permissive language and did not delete ICD-9's text. The psychology profession's 1999 rule supplied a clearer
        anti-pathologization standard, so the institutional correction developed in stages.
  - id: iran-2017-2026
    polity: Iran
    region: Middle East
    startYear: 2017
    endYear: 2026
    endOpen: true
    periodLabel: 2017–present
    strength: policy-basis
    institutionTypes:
      - government
      - medical
      - military
    institutions:
      - Iranian compulsory military-service medical exemption system
      - Armed Forces medical examination and exemption boards
    institutionalContext: >-
      U.S. and UK government country assessments report that Iran's compulsory-service system treats gay men as eligible
      for exemption through a mental-health or behavioral category. The translated wording quoted for the 2020 medical
      exemption regulations is broader than “homosexuality”: Article 33, paragraph 8 covers behavioral disorders and
      moral or sexual “deviancies.” Reports describe gay applicants undergoing medical examination to prove eligibility,
      while exemption records identify the applicable subsection. The available evidence therefore establishes the
      reported administrative practice, but it is not a direct publication of the full current Persian regulation.
    consequences:
      - Medical or psychiatric examination connected to sexual orientation
      - Military exemption through a mental-health or behavioral category
      - Disclosure of the exemption subsection in military records
      - Risk of employment discrimination, familial abuse, violence or arrest after involuntary outing
      - State reinforcement of a pathological account of homosexuality
    summary: >-
      Iran's military-exemption system continues to operationalize homosexuality through medical and psychiatric
      categories. Current assessments report that gay men may seek exemption only by submitting to medical review and
      that the resulting record can disclose the subsection used. Because consensual same-sex conduct is criminalized,
      the process can expose applicants to risks well beyond the exemption itself. Government country reporting through
      August 2026 documents no institutional correction.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Compulsory-service authorities route gay exemption applicants through medical examination and behavioral or
        psychiatric provisions, then record the governing subsection in military documentation.
    institutionalCorrection:
      status: uncorrected
      periodLabel: 2017–present
      action: No institutional correction is documented through August 2026.
      summary: >-
        Recent UK assessments continue to report exemption on this basis and the associated mental-disorder label. The
        evidence describes some changes in which regulatory subsection is used, but no rejection of the pathological
        premise for gay applicants.
