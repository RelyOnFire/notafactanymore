term: Episiotomy
aliases:
- episiotomies
shortDefinition: A surgical incision made in the perineum to enlarge the vaginal opening during childbirth.
longDefinition: An episiotomy is a surgical cut through the perineal tissues during the second stage of labor to enlarge
  the vaginal opening. It was once performed routinely in many settings in the belief that a controlled incision would
  prevent more serious tearing and protect the pelvic floor. Evidence favored restrictive rather than routine use for
  spontaneous vaginal birth.
relatedTerms:
- perineum
reviewedAt: '2026-08-21'
sources:
- title: WHO recommendation on routine or liberal use of episiotomy
  url: https://www.ncbi.nlm.nih.gov/books/NBK615641/table/part1.tab76/
  publisher: World Health Organization via NCBI Bookshelf
  note: States that routine or liberal episiotomy is not recommended for women undergoing spontaneous vaginal birth.
