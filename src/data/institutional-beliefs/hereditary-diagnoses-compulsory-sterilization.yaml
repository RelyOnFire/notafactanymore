  - id: sterilization-bundestag-carrier
    sourceId: sterilization-bundestag-1998
    relation: supports
    target: {scope: episode, episodeId: nazi-germany-1934-1945, aspect: carrier}
    locator: Printed p. 4, paragraphs on applications, reporting and the special courts
    note: >-
      Traces mandatory reporting through the public-health apparatus, applications by state physicians and institution
