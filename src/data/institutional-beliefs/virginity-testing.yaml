title: Virginity testing
claim: Examination of the hymen or vagina was treated as capable of determining whether a woman or girl had previously
  had vaginal intercourse.
currentUnderstanding: No physical examination can establish whether a woman or girl has previously had vaginal intercourse.
  Hymenal appearance varies normally and is not a reliable record of sexual activity; so-called virginity or two-finger
  tests have no scientific or clinical validity.
category: Forensic medicine and sexuality
reviewedAt: '2026-08-24'
episodes:
- id: turkey-1986-1998
  polity: Turkey
  region: Middle East
  startYear: 1986
  endYear: 1998
  periodLabel: 1986–1998
  strength: policy-basis
  institutionTypes:
  - government
  - medical
  - education
  institutions:
  - Police and gendarmerie
  - State forensic-medicine services and hospitals
  - State schools and dormitories
  consequences:
  - Forced genital examinations
  - Use of supposed “virginity” as evidence in policing
  - Surveillance and punishment of women and girls
  - Psychological and physical harm
  summary: Turkish police, gendarmes, schools, dormitories, and other state institutions ordered or facilitated
    examinations intended to determine women's and girls' “virginity.” State forensic doctors performed such examinations
    in cases involving detainees, suspected prostitution, school discipline, and public morality. A government regulation
    in late 1998 prohibited virginity testing unless requested by the woman.
  sources:
  - title: A Matter of Power — State Control of Women's Virginity in Turkey
    url: https://www.hrw.org/report/1994/06/01/matter-power/state-control-womens-virginity-turkey
    publisher: Human Rights Watch
    note: Documents state-ordered virginity examinations from the 1980s and early 1990s involving police, forensic
      doctors, schools, dormitories, hospitals, and detainees.
  - title: 1999 Country Report on Human Rights Practices — Turkey
    url: https://2009-2017.state.gov/j/drl/rls/hrrpt/1999/365.htm
    publisher: U.S. Department of State
    note: Records that a late-1998 Turkish government regulation prohibited the traditional practice of virginity
      testing unless requested by a woman.
  - title: Eliminating virginity testing — an interagency statement
    url: https://www.who.int/publications/i/item/WHO-RHR-18.15
    publisher: World Health Organization
    note: States that hymen and two-finger examinations have no scientific merit and cannot establish a history
      of vaginal intercourse.
- id: iran-2002-2026
  polity: Iran
  region: Middle East
  startYear: 2002
  endYear: 2026
  endOpen: true
  periodLabel: 2002–present
  strength: policy-basis
  institutionTypes:
  - court
  - medical
  institutions:
  - Legal Medicine Organization of Iran (LMOI)
  - Judiciary of the Islamic Republic of Iran
  institutionalContext: The Legal Medicine Organization is an official body of Iran's judiciary and its medico-legal
    centers provide expert reports when requested by courts and judges. Research conducted inside Iranian forensic
    centers describes virginity examinations as being performed on civil and criminal court orders as well as for
    other formal medico-legal purposes. The accessible record does not establish a nationwide abolition; a 2026
    country review still reports that authorities may attempt virginity testing in some cases, so the episode is
    treated as open rather than assigned an invented correction date.
  consequences:
  - Court-ordered hymenal examinations
  - Forensic certificates and reports used in civil and criminal matters
  - Decisions concerning marriage, divorce, welfare placement, and alleged sexual activity
  - Psychological and social harm, including risk of violence and self-harm
  summary: Iranian medico-legal centers have performed hymenal examinations intended to determine “virginity” for
    formal legal purposes. A study involving experienced examiners from Tehran forensic centers, including researchers
    affiliated with the Legal Medicine Organization of Iran, states that the tests are performed on civil and criminal
    court orders and documents applications involving marriage, divorce, welfare placement, alleged sexual assault,
    and certificates of virginity. The same examiners expressed uncertainty about the accuracy and certainty of
    the diagnosis. Modern evidence establishes that hymenal appearance cannot determine a history of intercourse,
    but the accessible record does not show a nationwide Iranian abolition of the practice.
  sources:
  - title: Virginity Testing Beyond a Medical Examination
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4965672/
    publisher: Global Journal of Health Science
    note: Iranian study conducted in forensic medical centers and governmental gynecology clinics in Tehran; states
      that forensic centers perform virginity testing on civil and criminal court orders, documents formal uses
      of the examinations, and reports examiners' uncertainty about diagnostic accuracy and ethics.
  - title: Modern forensic medicine and the medico-legal system in Iran
    url: https://pubmed.ncbi.nlm.nih.gov/15274958/
    publisher: Journal of Clinical Forensic Medicine
    note: Describes the Legal Medicine Organization as an official body of Iran's judiciary whose medico-legal centers
      provide expert forensic reports when requested by courts, judges, and administrative authorities.
  - title: Country policy and information note — Zina, Iran, April 2026
    url: https://www.gov.uk/government/publications/iran-country-policy-and-information-notes/country-policy-and-information-note-zina-sex-outside-of-marriage-and-adultery-iran-april-2026-accessible
    publisher: UK Home Office
    note: Recent country review reports that Iranian authorities may attempt virginity tests on young women arrested
      in some circumstances, while noting that the available evidence does not show the practice to be prevalent.
  - title: Eliminating virginity testing — an interagency statement
    url: https://www.who.int/publications/i/item/WHO-RHR-18.15
    publisher: World Health Organization
    note: States that hymenal appearance is not a reliable indication of intercourse and that no examination can
      prove a history of vaginal intercourse.
- id: india-2005-2013
  polity: India
  region: South Asia
  startYear: 2005
  endYear: 2013
  periodLabel: 2005–2013
  strength: policy-basis
  institutionTypes:
  - government
  - court
  - medical
  - education
  institutions:
  - Government hospitals and medico-legal services
  - Forensic-medicine training and textbooks
  - Criminal courts using medico-legal reports
  consequences:
  - Invasive examinations of rape survivors
  - Sexual-history judgments in medico-legal reports
  - Evidence used to challenge credibility or imply consent
  - Re-traumatization of survivors
  summary: Indian forensic-medicine teaching and public hospitals continued to use the two-finger test to judge
    whether rape survivors were “habituated to sexual intercourse.” Medical findings about hymenal condition and
    vaginal laxity entered medico-legal reports and could be used in court to attack a survivor's credibility or
    imply consent. The Supreme Court rejected the practice in 2013, and national health guidelines subsequently
    instructed examiners not to perform it or comment on past sexual experience.
  sources:
  - title: Dignity on Trial — India's Need for Sound Standards for Conducting and Interpreting Forensic Examinations
      of Rape Survivors
    url: https://www.hrw.org/report/2010/09/06/dignity-trial/indias-need-sound-standards-conducting-and-interpreting-forensic
    publisher: Human Rights Watch
    note: Documents widespread institutional use of the test, its prescription in 2005 and 2007 forensic-medicine
      textbooks, public-hospital examination forms, and court reliance on supposed signs of sexual habituation.
  - title: Guidelines & Protocols — Medico-legal care for survivors/victims of sexual violence
    url: https://mohfw.gov.in/sites/default/files/953522324.pdf
    publisher: Ministry of Health and Family Welfare, Government of India
    note: National guidelines state that the two-finger test must not be conducted and that hymenal, vaginal, or
      anal findings cannot establish past sexual experience.
  - title: Supreme Court of India — Lillu @ Rajesh and Anr. v. State of Haryana
    url: https://api.sci.gov.in/jonew/judis/40308.pdf
    publisher: Supreme Court of India
    note: 2013 judgment rejecting the two-finger test as violating survivors' privacy, physical and mental integrity,
      and dignity.
- id: indonesia-2014-2022
  polity: Indonesia
  region: Southeast Asia
  startYear: 2014
  endYear: 2022
  periodLabel: 2014–2022
  strength: policy-basis
  institutionTypes:
  - government
  - medical
  - military
  institutions:
  - Indonesian National Police (Polri)
  - Police Medical and Health Center (Pusdokkes Polri)
  - Indonesian National Armed Forces (TNI)
  - Indonesian Army (TNI AD)
  - Indonesian Navy (TNI AL)
  - Indonesian Air Force (TNI AU)
  institutionalContext: In the police recruitment system, Human Rights Watch identified the National Police regulation
    and Pusdokkes Polri personnel as part of the testing machinery. In the military, all three service branches
    had used the practice. The Army began ending it in 2021; the armed-forces-wide endpoint came only in 2022, when
    the military announced that the Army, Navy, and Air Force had all effectively ended the tests for recruitment.
  consequences:
  - Invasive examinations of female recruits
  - Sex discrimination in public employment
  - Psychological and physical harm
  summary: In 2014, Indonesia's police recruitment system still subjected female applicants to “virginity tests,”
    including the discredited two-finger examination; Pusdokkes Polri personnel conducted the examinations in police
    medical facilities. Human Rights Watch also documented the practice across all three armed-forces branches.
    The Army began ending the practice in 2021, but the Navy and Air Force had not yet fully followed; in April
    2022 an armed-forces spokesperson announced that the Army, Navy, and Air Force had all effectively ended virginity
    testing for recruitment.
  sources:
  - title: Indonesia — “Virginity Tests” for Female Police
    url: https://www.hrw.org/news/2014/11/17/indonesia-virginity-tests-female-police
    publisher: Human Rights Watch
    note: Documents the official police recruitment context, Chief Police Regulation No. 5/2009, the continuing
      two-finger examination in 2014, and Pusdokkes Polri personnel conducting the tests in police-operated hospitals.
  - title: Indonesia Army Chief to Terminate Unscientific “Virginity Test”
    url: https://www.hrw.org/news/2021/08/03/indonesia-army-chief-terminate-unscientific-virginity-test
    publisher: Human Rights Watch
    note: Documents the 2021 Army order ending medically irrelevant virginity testing for female recruits while
      noting the practice's long use across the security forces.
  - title: Indonesia Military Finally Ends Abusive “Virginity Test”
    url: https://www.hrw.org/news/2022/04/20/indonesia-military-finally-ends-abusive-virginity-test
    publisher: Human Rights Watch
    note: Records the armed forces' April 2022 announcement that all three branches — Army, Navy, and Air Force
      — had effectively ended virginity testing for recruitment, establishing the later military-wide endpoint.
  - title: Eliminating virginity testing — an interagency statement
    url: https://www.who.int/publications/i/item/WHO-RHR-18.15
    publisher: World Health Organization
    note: Summarizes the scientific evidence that such examinations cannot establish prior vaginal intercourse.
- id: kazakhstan-2025-2026
  polity: Kazakhstan
  region: Central Asia
  startYear: 2025
  endYear: 2026
  endOpen: true
  periodLabel: 2025–present
  strength: policy-basis
  institutionTypes:
  - government
  - medical
  institutions:
  - Center for Forensic Examinations, Ministry of Justice of the Republic of Kazakhstan
  institutionalContext: A current Ministry of Justice forensic methodology defines examinations of female “sexual
    states” as including determination of sexual inviolability and whether previous sexual intercourse occurred.
    The same methodology acknowledges that intercourse can occur without disruption of the hymen, yet retains hymenal
    and genital examination within an expert task aimed at inferring prior intercourse. The episode is kept open
    because the methodology was published by the state forensic centre in 2025 and remains current evidence of institutional
    use.
  consequences:
  - Forensic genital examinations intended to infer prior sexual intercourse
  - Use of hymenal condition and injuries within a state evidentiary methodology
  - Potential influence on criminal and civil proceedings through medico-legal conclusions
  - Continuation of a scientifically invalid virginity inference in an official forensic framework
  summary: Kazakhstan’s Ministry of Justice forensic centre published a methodology in 2025 for examining female
    sexual states that includes determining “sexual inviolability” and establishing whether previous intercourse
    occurred. The document instructs direct genital and hymenal examination while also acknowledging that intercourse
    may occur without hymenal rupture. WHO states that hymenal appearance cannot establish prior vaginal intercourse
    and that no examination can prove a history of intercourse.
  sources:
  - title: Methodology for examination of a female person to determine signs of sexual inviolability
    url: https://forensic.gov.kz/wp-content/uploads/2025/09/23.124-1.pdf
    publisher: Center for Forensic Examinations, Ministry of Justice of the Republic of Kazakhstan
    note: Official 2025 forensic methodology listing determination of sexual inviolability and prior intercourse
      among expert tasks, prescribing genital and hymenal examination, and acknowledging that intercourse can occur
      without hymenal rupture.
  - title: Eliminating virginity testing — an interagency statement
    url: https://www.who.int/publications/i/item/WHO-RHR-18.15
    publisher: World Health Organization
    note: States that hymenal appearance is not a reliable indication of intercourse and that no known examination
      can prove a history of vaginal intercourse.
