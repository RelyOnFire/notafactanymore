term: Metamorphic rock
aliases:
- metamorphic rocks
shortDefinition: Rock transformed from an older rock by heat, pressure, fluids, or a combination of these without fully
  melting.
longDefinition: Metamorphic rocks begin as pre-existing igneous, sedimentary, or older metamorphic rocks. Elevated temperature,
  pressure, stress, and reactive fluids can recrystallize minerals and change the rock's texture or composition. If the
  rock melts completely, the resulting melt belongs to the igneous cycle instead.
relatedTerms:
- igneous-rock
- sedimentary-rock
reviewedAt: '2026-08-21'
sources:
- title: What are metamorphic rocks?
  url: https://www.usgs.gov/faqs/what-are-metamorphic-rocks
  publisher: U.S. Geological Survey
  note: Explains how pre-existing rocks are transformed by heat, pressure, and mineral-rich fluids without necessarily
    melting.
