schemaVersion: 2
title: Eugenic sterilization as population improvement
proposition:
  summary: >-
    Government, judicial, welfare and medical institutions treated disability, psychiatric diagnosis and socially
    defined “unfitness” as inherited population defects, and treated preventing selected people from reproducing as
    a legitimate way to improve the population. In practice, those classifications also absorbed judgments about
    poverty, sexuality, ethnicity, institutional status and conformity.
correction:
  summary: >-
    Eugenic sterilization systems joined a false scientific generalization to an abuse of state and clinical power.
    They collapsed heterogeneous conditions and social labels into simple hereditary defects, overstated how reliably
    a diagnosis or category predicted a descendant's health, and converted that prediction into authority over another
    person's fertility. Some conditions genuinely have genetic components, but inheritance ranges from single-gene
    disorders to complex and environmentally mediated risks; neither genetic risk nor a social classification supplies
    consent. Sterilization requires the individual's full, free and informed decision and must be free from discrimination,
    coercion and violence.
category: Genetics, eugenics and reproductive coercion
reviewedAt: '2026-09-27'
impact:
  summary: >-
    The five episodes were separate legal and administrative systems, so their totals are not directly additive. U.S.
    states sterilized at least 60,000 people under eugenic laws; Nazi Germany forcibly sterilized approximately 400,000.
    Sweden reported 62,888 operations under its 1935–1975 laws, with the later inquiry distinguishing voluntary cases,
    operations without consent, coercion-like conditions, pressure and unclassified files. Japan now describes about
    25,000 people as victims of sterilizing operations under its former law. In Czechoslovakia, formally neutral medical
    rules were applied through racialized welfare and clinical practices that particularly harmed Romani women. Later
    remedies ranged from national annulment, inquiry and compensation to narrower or still-troubled successor-state programs.
  highlights:
    - value: ≈60,000
      label: people sterilized under U.S. state eugenic laws by the 1970s
    - value: ≈400,000
      label: people forcibly sterilized under the Nazi Hereditary Health Law
    - value: '62,888'
      label: total sterilizations reported under Sweden's 1935–1975 laws, not all classified as coerced
    - value: ≈25,000
      label: sterilization victims now identified by Japan under the former Eugenic Protection Act
  context:
    - >-
      Counts in this field depend on the category being measured: statutes enacted, orders approved, operations
      performed, formally non-consensual cases, or procedures accepted under pressure. The Swedish official inquiry,
      for example, separated roughly 6,000 operations without consent, 15,000 under coercion-like circumstances and
      just over 6,000 with signs of persuasion or pressure; a later scholarly review used the broader estimate of
      approximately 32,000 involuntary procedures.
    - >-
      The scientific correction does not claim that heredity is irrelevant to every condition targeted. It rejects the
      institutional leap from a broad diagnosis or social judgment to a deterministic forecast about descendants and
      then to irreversible reproductive coercion.
    - >-
      Formal repeal ended the legal authority at different times, while acknowledgment and remedy often followed decades
      later. A correction status here describes the documented institutional response to the historical program; it does
      not imply that surgery can be undone or that every survivor received compensation.
episodes:
  - id: united-states-1907-1974
    polity: United States
    region: North America
    startYear: 1907
    endYear: 1974
    periodLabel: 1907–mid-1970s
    strength: policy-basis
    institutionTypes:
      - government
      - court
      - medical
    institutions:
      - Virginia General Assembly
      - Virginia State Colony for Epileptics and Feeble-Minded
      - Supreme Court of the United States
    institutionalContext: >-
      The United States had no single federal eugenic-sterilization authority. States enacted and administered their own
      laws through hospitals, custodial institutions, welfare officials and courts. Virginia shows the chain that produced
      the nationally influential precedent: its legislature enacted the 1924 law, the state colony selected Carrie Buck as
      a test case, and the Supreme Court upheld the order in 1927. Comparable systems operated across dozens of states.
    consequences:
      - At least 60,000 people were sterilized under state eugenic laws by the 1970s
      - Institutionalized people and people labelled disabled, “feebleminded” or socially unfit were targeted
      - Buck v. Bell supplied constitutional authority for compulsory sterilization under Virginia's procedure
      - State programs disproportionately harmed women, disabled people, poor people and racialized communities
      - Apologies and compensation arrived state by state and covered only defined groups of survivors
    summary: >-
      Indiana enacted the first U.S. eugenic sterilization law in 1907, and 32 states passed such statutes between 1907
      and 1937. State institutions sterilized tens of thousands of people classified as unfit. In Buck v. Bell, the
      Supreme Court upheld Virginia's law and Carrie Buck's sterilization order, allowing a medical and social judgment
      about supposed hereditary “feeblemindedness” to become enforceable constitutional policy.
    mechanism:
      kind: enforcement
      summary: >-
        State statutes authorized officials and institutions to petition for or order sterilization; medical testimony
        supplied hereditary classifications, and judicial review—including Buck v. Bell—legitimated the resulting surgery.
    institutionalCorrection:
      status: partial
      periodLabel: 2001–2015
      action: Virginia formally expressed profound regret for its role and later created a compensation program paying $25,000 per verified eligible claim.
      summary: >-
        The documented remedies addressed particular state systems. Virginia acknowledged the false science and harm and
        funded compensation for a defined class of verified survivors, but those measures covered one part of a nationwide,
        state-administered pattern.
  - id: germany-1933-1945
    polity: Nazi Germany
    region: Europe
    startYear: 1933
    endYear: 1945
    periodLabel: 1933–1945 (in force from 1934)
    strength: enforced-doctrine
    institutionTypes:
      - government
      - court
      - medical
    institutions:
      - Reichsministerium des Innern
      - Erbgesundheitsgerichte
      - Erbgesundheitsobergerichte
      - Gesundheitsämter und Amtsärzte
    institutionalContext: >-
      The Interior Ministry directed implementation of the July 1933 law. Public-health offices, physicians and institution
      directors reported and initiated cases; Hereditary Health Courts, each combining a judge and physicians, issued
      orders; Higher Hereditary Health Courts heard appeals; and hospitals performed the operations. Once an order was
      final, the statute permitted sterilization against the person's will with police assistance.
    consequences:
      - Approximately 400,000 people were forcibly sterilized under the Hereditary Health Law
      - Nine diagnostic categories were converted into statutory grounds for reproductive surgery
      - Elastic labels such as “congenital feeblemindedness” absorbed social nonconformity and disputed testing
      - Special courts and medical reporting made eugenic prediction a routine administrative process
      - Survivors waited decades for formal condemnation and annulment of the court orders
    summary: >-
      The 1933 Law for the Prevention of Offspring with Hereditary Diseases made a blanket hereditary forecast enforceable
      through medicine, administration and special courts from January 1934. Broad psychiatric, neurological, sensory and
      social diagnoses were treated as reliable evidence that descendants would have severe hereditary defects. The system
      compulsorily sterilized approximately 400,000 people before the Nazi regime ended.
    mechanism:
      kind: enforcement
      summary: >-
        Statutory diagnostic categories, compulsory reporting, medical assessment and special-court orders converted
        eugenic heredity claims into surgery enforceable by police-backed physical compulsion.
    institutionalCorrection:
      status: corrected
      periodLabel: '1998'
      action: The German Bundestag legislatively annulled surviving sterilization decisions of the former Hereditary Health Courts.
      summary: >-
        The coercive machinery ended in 1945, while formal rehabilitation lagged. The Bundestag later recognized the
        sterilizations as National Socialist injustice and in 1998 removed the continuing legal force of the court orders.
  - id: sweden-1935-1975
    polity: Sweden
    region: Europe
    startYear: 1935
    endYear: 1975
    periodLabel: 1935–1975
    strength: policy-basis
    institutionTypes:
      - government
      - medical
    institutions:
      - Medicinalstyrelsen
      - Socialstyrelsen (from 1968)
    institutionalContext: >-
      Medicinalstyrelsen—and from 1968 Socialstyrelsen—was the central permit authority and issued guidance. Applications
      could be initiated or shaped by institution directors, physicians, child-welfare and poor-relief bodies, and approved
      procedures were carried out in hospitals. Formal applications or signatures did not necessarily show free choice:
      sterilization could be made a condition of discharge, abortion, marriage permission or public assistance.
    consequences:
      - Sweden recorded 62,888 sterilizations under the laws in force from 1935 through 1975
      - The official inquiry classified about 6,000 as without consent and 15,000 as occurring under coercion-like conditions
      - Just over 6,000 further files showed persuasion or pressure, while more than 4,000 could not be classified
      - Ninety-three percent of all people sterilized during the period were women
      - Vulnerable and institutionalized people were especially exposed to official pressure
    summary: >-
      Sweden's 1934 and 1941 sterilization laws operated from 1935 through 1975 through a centralized permit system and
      local medical and welfare actors. A later government inquiry found that practice changed substantially over time,
      from predominantly coercive, population and racial-hygiene rationales toward predominantly voluntary family planning.
      Its file review nevertheless documented operations without consent, coercion-like conditions and official pressure.
    mechanism:
      kind: administrative-adoption
      summary: >-
        A central permit system joined medical indications to applications assembled by local clinical, institutional and
        welfare officials; dependence on release, abortion or assistance could turn nominal consent into conditional coercion.
    institutionalCorrection:
      status: corrected
      periodLabel: 1975–2000
      action: Sweden replaced the earlier laws with a consent-based 1975 statute, commissioned an official inquiry and enacted a 1999 compensation law for qualifying people sterilized against their will or on another person's initiative.
      summary: >-
        The coercive legal framework ended, and the later national response documented the state's responsibility and
        created a standardized compensation route. By October 2000 the compensation board had decided about 1,500 cases
        and approved roughly 82 percent of applications.
  - id: japan-1948-1996
    polity: Japan
    region: East Asia
    startYear: 1948
    endYear: 1996
    periodLabel: 1948–1996
    strength: policy-basis
    institutionTypes:
      - government
      - medical
    institutions:
      - Ministry of Health and Welfare (厚生省)
      - Prefectural Eugenic Protection Review Boards (都道府県優生保護審査会)
      - Central Eugenic Protection Review Board (中央優生保護審査会)
    institutionalContext: >-
      The 1948 Act stated that it sought to prevent the birth of “inferior descendants” from a eugenic viewpoint. The
      Ministry issued implementation instructions to prefectural governors; prefectural boards reviewed compulsory cases,
      a central body performed supervisory or review functions, and designated physicians and medical institutions carried
      out the operations. The statutory scheme also sought consent for some categories in a context the Supreme Court later
      held could not make the eugenic operation voluntary.
    consequences:
      - About 25,000 people underwent sterilizing operations under the former Eugenic Protection Act
      - People with specified disabilities or diseases, and in some provisions their spouses or relatives, were singled out
      - Prefectural review boards converted statutory disability classifications into compulsory-operation approvals
      - Government implementation guidance permitted restraint or deception in carrying out some approved operations
      - Survivors faced decades of barriers before the Supreme Court recognized state liability
    summary: >-
      Japan's Eugenic Protection Act operated from 1948 until its eugenic provisions were removed in 1996. It expressly
      ranked people with specified diseases or disabilities as an undesirable reproductive category and authorized
      sterilizing operations through national guidance, prefectural review and medical implementation. The government now
      describes approximately 25,000 people as victims of sterilizing operations under the former law.
    mechanism:
      kind: enforcement
      summary: >-
        Statutory disability lists, ministry circulars, prefectural review-board decisions and designated medical providers
        turned a eugenic population objective into approved and, in specified cases, physically compelled operations.
    institutionalCorrection:
      status: corrected
      periodLabel: 1996–2025
      action: Japan removed the eugenic provisions in 1996; in 2024 the Supreme Court held them unconstitutional and the Diet enacted a new apology and compensation law, effective in 2025.
      summary: >-
        The Grand Bench held that the eugenic purpose was unjustifiable, that both compulsory and nominally consent-based
        provisions violated constitutional dignity and equality, and that the state could not use the old exclusion period
        to defeat the claims. The 2024 law accepted responsibility, apologized and established compensation for survivors,
        spouses and certain bereaved relatives.
  - id: czechoslovakia-1972-1989
    polity: Czechoslovakia
    region: Eastern Europe
    startYear: 1972
    endYear: 1989
    periodLabel: 1972–1989
    strength: policy-basis
    institutionTypes:
      - government
      - medical
    institutions:
      - Ministry of Health of the Czech Socialist Republic
      - Ministry of Health of the Slovak Socialist Republic
      - Sterilization commissions established under the 1972 directives
    institutionalContext: >-
      Parallel Czech and Slovak rules placed decisions in hospital-based sterilization commissions and included genetic
      indications. The written rules required an application or consent, yet medical and social-welfare personnel shaped
      access, information and incentives. Later investigation found sterilizations without valid informed consent and a
      wider state-supported setting in which Romani women were disproportionately targeted; unlawful practice also
      continued beyond the socialist period in the territory of the successor Czech Republic.
    consequences:
      - Romani women were disproportionately subjected to sterilization without full and informed consent
      - Welfare pressure and financial incentives could make formally signed requests coercive
      - Hospital commissions and clinicians could turn social and ethnic judgments into irreversible surgery
      - Missing or destroyed medical files later obstructed proof and compensation claims
      - The Czech remedy covers unlawful procedures on present-day Czech territory, while the episode involved a former federal state
    summary: >-
      The 1972 sterilization directives were formally ethnicity-neutral and described consent procedures, but their
      administration did not guarantee free and informed choice. Doctors and social workers disproportionately and
      coercively applied sterilization to Romani women. Historical scholarship traces this practice through continuities
      among eugenics, medical genetics and socialist population and welfare policy, while the Czech Ombudsman's inquiry
      documented unlawful operations and systemic defects in informed consent.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Health-ministry directives created medical indications and hospital commissions; clinicians and welfare officials
        then controlled information, applications and benefits in ways that could convert nominal consent into coercion.
    institutionalCorrection:
      status: partial
      periodLabel: 2009–present
      action: The Czech government apologized in 2009, and a law effective in 2022 created lump-sum compensation for unlawful sterilizations performed from 1966 to 2012 on the territory of today's Czech Republic.
      summary: >-
        The Czech successor state created an acknowledgment and remedy, but the response is territorially narrower than the
        former Czechoslovak system and its administration has remained troubled. The Czech Ombudsman documented delayed
        decisions, overly formal demands for missing medical records and other barriers in the compensation process.
