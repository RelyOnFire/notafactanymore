term: Free radical
aliases:
- free radicals
- radical
- radicals
shortDefinition: An atom, molecule, or molecular fragment with one or more unpaired electrons.
longDefinition: 'A free radical contains at least one unpaired electron, which often makes it chemically reactive. Radical
  lifetimes vary enormously: many are extremely short-lived, while others can persist when their unpaired electron is
  delocalized or when bulky molecular groups shield the reactive region. Stable and persistent radicals are important
  in organic chemistry, materials science, biology, and atmospheric chemistry.'
