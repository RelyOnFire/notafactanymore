evidence:
  - id: patp-trrc-proposition
    sourceId: trrc-patp-volume-9
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: Declaration of mandate and Analysis of Evidence, especially pp. 9–11 and 61–73
    note: >-
      Official Gambian truth-commission report reconstructing Jammeh’s HIV/AIDS cure proclamation, creation and operation of PATP, participation of state personnel, withdrawal of standard treatment, participant testimony, and resulting harms.
  - id: patp-who-2007-proposition
    sourceId: who-africa-2007-treatment-statement
    relation: disputes
    target: {scope: belief, aspect: proposition}
    locator: Statement points 1–4, 27 February 2007
    note: >-
      Contemporaneous February 2007 WHO statement says there was no cure for HIV/AIDS, identifies continuous antiretroviral therapy as effective treatment, and warns that herbal remedies must not replace comprehensive HIV care or cause antiretroviral therapy to be discontinued.
  - id: patp-who-current-correction
    sourceId: who-2026-hiv-fact-sheet
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Key facts and Treatment sections, 27 July 2026
    note: >-
      WHO states that current ART stops HIV from replicating and enables long, healthy lives but does not cure the infection.
  - id: patp-nih-interruption-correction
    sourceId: nih-2026-art-interruption
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Opening recommendation and Analytical Treatment Interruption section, reviewed 24 September 2026
    note: >-
      NIH guidance links ART interruption to viral rebound, increased transmission risk, immune decompensation and clinical progression and advises against discontinuation outside a clinical trial.
  - id: patp-trrc-impact
    sourceId: trrc-patp-volume-9
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: Participant testimony and Findings 2, 7–22, pp. 9–61 and 73–75
    note: >-
      The commission synthesized protected and public testimony, clinical and laboratory evidence, and institutional testimony to document the programme's operation, coercion, medical deterioration, deaths and rights violations.
  - id: patp-trrc-carrier
    sourceId: trrc-patp-volume-9
    relation: documents
    target: {scope: episode, episodeId: gambia-2007-2016, aspect: carrier}
    locator: Investigation background, Role of Persons Involved and Findings 11–16
    note: >-
      The report identifies the presidency and PATP, participating ministers and clinicians, public hospitals and laboratories, state security and GRTS as operational or promotional carriers.
  - id: patp-trrc-mechanism
    sourceId: trrc-patp-volume-9
    relation: documents
    target: {scope: episode, episodeId: gambia-2007-2016, aspect: mechanism}
    locator: Analysis of Evidence, pp. 61–73; Findings 2, 7–17
    note: >-
      The report traces how presidential orders became enrolment, compulsory ART withdrawal, guarded treatment, clinical monitoring, laboratory claims and state-broadcast cure testimony.
  - id: patp-trrc-consequences
    sourceId: trrc-patp-volume-9
    relation: supports
    target: {scope: episode, episodeId: gambia-2007-2016, aspect: consequences}
    locator: The Impact of the Presidential Treatment Programme, pp. 69–73; Findings 9–22, pp. 73–75
    note: >-
      The findings cover confinement, privacy violations, degrading and sexual abuse, forced labour, ART withdrawal, worsened health, deaths and the admission of children.
  - id: patp-trrc-context
    sourceId: trrc-patp-volume-9
    relation: contextualizes
    target: {scope: episode, episodeId: gambia-2007-2016, aspect: context}
    locator: Findings 7–9, pp. 73–74
    note: >-
      The commission distinguished the first batch, whose participation was forced and unconsented, from later participants who could enter willingly but lacked adequate disclosure of risks.
  - id: patp-trrc-institutional-correction
    sourceId: trrc-patp-volume-9
    relation: documents
    target: {scope: episode, episodeId: gambia-2007-2016, aspect: institutional-correction}
    locator: Findings and Recommendations, pp. 73–76
    note: >-
      The TRRC formally characterized the treatment as unproven, fraudulent and unlicensed and recommended accountability, professional discipline, regulation and comprehensive HIV care.
  - id: patp-white-paper-institutional-correction
    sourceId: gambia-2022-trrc-white-paper
    relation: documents
    target: {scope: episode, episodeId: gambia-2007-2016, aspect: institutional-correction}
    locator: Theme 10, paragraphs 268–290, pp. 73–79
    note: >-
      The government adopted the TRRC's account of PATP and accepted the recommendations on negligence and degrading treatment prosecutions, children, professional discipline, herbal-product regulation, HIV care, privacy and ethics; it sought further evidence before accepting a murder charge.
  - id: patp-gambia-guidelines-institutional-correction
    sourceId: gambia-2019-art-guidelines
    relation: documents
    target: {scope: episode, episodeId: gambia-2007-2016, aspect: institutional-correction}
    locator: Foreword, p. ii; definition of ART, p. xi
    note: >-
      The post-Jammeh national guideline commits the government to free ARVs at public facilities and defines ART as viral-suppressing treatment usually given for life.
