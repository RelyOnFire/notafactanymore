schemaVersion: 2
title: Manacovid as an established effective COVID-19 treatment
proposition:
  summary: >-
    The Democratic Republic of the Congo authorized Manacovid for market release and publicly treated reported results
    in 300 symptomatic SARS-CoV-2-positive patients as sufficient to present it as an effective, safe, and 100% curative
    COVID-19 treatment before publicly documented randomized evidence had established a treatment effect.
correction:
  summary: >-
    Becoming test-negative and experiencing symptom resolution in a treated patient series do not by themselves show
    that a medicine caused recovery. The public reports of the 300 patients do not describe a randomized comparator,
    baseline severity, prespecified outcomes, or a transparent statistical analysis, leaving natural recovery, timing
    of testing, supportive treatment, and other differences as alternative explanations. A 2022 joint WHO, Africa CDC,
    and African Union mission that reviewed Manacovid among several Congolese traditional therapeutics concluded that
    the way the available data had been analyzed and presented had not generated the evidence needed to establish
    efficacy and recommended stronger observational and randomized trials. That was a portfolio-level assessment, not
    a negative product-specific randomized trial: it did not prove that Manacovid had no active ingredients or that it
    was unsafe, but it did mean the advertised therapeutic effect remained unestablished.
category: Medicine and public health
reviewedAt: '2026-09-30'
impact:
  summary: >-
    Manacovid moved beyond an experimental candidate into authorized sale and official promotion. State reports said it
    received market authorization on 24 November 2020, repeated a claim that all 300 treated symptomatic patients became
    test-negative, and presented it as the first 100%-effective curative COVID-19 medicine. In January 2021 the health
    minister called the reported results conclusive and significant and promised ministry support toward an effective
    and safe remedy. Yet the Council of Ministers was still calling for randomization in September 2021, the joint expert
    mission found the presented evidence insufficient in March 2022, and a government research bulletin said in 2023
    that Manacovid was still awaiting scientific proof at the University of Kinshasa Faculty of Medicine.
  highlights:
    - value: 24 Nov 2020
      label: Reported date of authorization for market release as a COVID-19 treatment
    - value: 300 patients
      label: Treated symptomatic patients publicly reported as all becoming test-negative
      note: The public reports do not provide a comparator group or enough trial detail to attribute that outcome to Manacovid.
    - value: '2023'
      label: A government research bulletin said Manacovid was still awaiting scientific proof
  context:
    - >-
      The two authorization accounts are state-news reports, not the authorization certificate or a public clinical-study
      report. They document what the ministry, developer, and national press agency represented publicly; they do not
      independently verify the study design, individual outcomes, safety profile, or regulatory dossier.
    - >-
      The 2022 mission assessed a group of Congolese traditional COVID-19 therapeutics that included Manacovid. Its
      evidence finding should not be misrepresented as the result of a Manacovid-only randomized trial or as proof that
      every ingredient was inactive.
    - >-
      Manacovid does not appear by product or applicant name in ACOREP's public authorization register released in
      February 2026, although that register lists five later CRPL products. Absence from this register does not establish
      when or why the reported 2020 authorization expired, was withdrawn, or otherwise ceased to appear; no formal
      Manacovid withdrawal decision was located.
episodes:
  - id: drc-2020-2023
    polity: Democratic Republic of the Congo
    region: Central Africa
    startYear: 2020
    endYear: 2023
    periodLabel: 2020–2023
    strength: policy-basis
    institutionTypes:
      - government
      - medical
    institutions:
      - Ministry of Public Health (later Ministry of Public Health, Hygiene and Prevention)
      - Directorate of Pharmacy and Medicine
      - Council of Ministers of the Democratic Republic of the Congo
      - Ministry of Scientific Research and Technological Innovation
      - Congolese Press Agency (ACP)
    institutionalContext: >-
      A December 2020 ACP report, relaying a communiqué from the private Luozi Pharmaceutical Research Centre, said that
      Manacovid had been approved on 24 November after work in 300 symptomatic patients and that its protocol had ethics
      approval. A January 2021 ACP report then quoted a health-minister letter calling the investigators' results
      conclusive and significant, promising support through the medicines directorate, and looking to Manacovid as an
      effective and safe remedy; the agency separately headlined it as the first 100%-effective curative medicine. In
      September 2021 the cabinet called for continued randomization of Manacovid toward international recognition. The
      health minister and other Congolese stakeholders received the joint expert mission's contrary evidentiary finding
      in March 2022. A July 2023 bulletin of the National Scientific Council and research ministry reported the research
      minister saying that Manacovid still awaited scientific proof at the University of Kinshasa.
    consequences:
      - Authorization for market release and entry into the official pharmaceutical distribution environment
      - State-news amplification of a 100% cure claim drawn from a reported 300-patient series
      - Health-ministry support that publicly framed Manacovid as a prospective effective and safe remedy
      - Cabinet-level pursuit of further randomization and international recognition after domestic authorization
      - Continued evidentiary uncertainty acknowledged by government and international reviewers through 2023
    summary: >-
      The Democratic Republic of the Congo gave Manacovid regulatory and political legitimacy before its claimed benefit
      had been demonstrated in a publicly documented randomized comparison. Authorization, a supportive ministerial
      letter, and emphatic reporting by the national press agency turned an incompletely reported 300-patient result into
      a marketable claim of safe and complete efficacy. Subsequent official actions reveal that the evidence remained
      unsettled: the cabinet sought randomization, an invited international mission found that the data presentation for
      the reviewed traditional therapeutics had not generated efficacy evidence, and the research minister later said
      Manacovid was still awaiting scientific proof.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Reported health-ministry authorization, support through the medicines directorate, national-press promotion, and
        cabinet sponsorship moved Manacovid from a privately developed candidate into the country's official treatment
        environment while confirmatory randomization was still being pursued.
    institutionalCorrection:
      status: partial
      periodLabel: 2021–2023
      action: The cabinet called for randomization, the government received a joint expert review that found the presented data insufficient, and the research minister later said Manacovid still awaited scientific proof.
      summary: >-
        Congolese institutions participated in a meaningful evidentiary correction by pursuing randomized evaluation,
        hosting and receiving the 2022 expert mission, and later acknowledging that proof was still pending. The record
        does not show a product-specific randomized result, a retraction of the ministerial efficacy framing, a formal
        withdrawal decision, or an official account of how the reported 2020 authorization ended.
