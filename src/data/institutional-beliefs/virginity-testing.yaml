schemaVersion: 2
title: Virginity testing
proposition:
  summary: >-
    Examination of the hymen or vagina was treated as capable of determining whether a woman or girl had previously had vaginal intercourse.
correction:
  summary: >-
    No physical examination can establish whether a woman or girl has previously had vaginal intercourse. Hymenal appearance
    varies normally and is not a reliable record of sexual activity; so-called virginity or two-finger tests have no
    scientific or clinical validity.
category: Forensic medicine and sexuality
reviewedAt: '2026-08-24'
episodes:
  - id: turkey-1986-1998
    polity: Turkey
    region: Middle East
    startYear: 1986
    endYear: 1998
    periodLabel: 1986–1998
    strength: policy-basis
    institutionTypes:
      - government
      - medical
      - education
    institutions:
      - Police and gendarmerie
      - State forensic-medicine services and hospitals
      - State schools and dormitories
    consequences:
      - Forced genital examinations
      - Use of supposed “virginity” as evidence in policing
      - Surveillance and punishment of women and girls
      - Psychological and physical harm
    summary: >-
      Turkish police, gendarmes, schools, dormitories, and other state institutions ordered or facilitated examinations
      intended to determine women's and girls' “virginity.” State forensic doctors performed such examinations in cases
      involving detainees, suspected prostitution, school discipline, and public morality. A government regulation in late
      1998 prohibited virginity testing unless requested by the woman.
    mechanism:
      kind: enforcement
      summary: >-
        Police, schools, dormitories and other state bodies ordered or facilitated genital examinations, while state
        forensic doctors performed them to generate official judgments about “virginity.”
    institutionalCorrection:
      status: partial
      periodLabel: late 1998
      action: A Turkish government regulation prohibited virginity testing unless requested by the woman.
      summary: >-
        The regulation restricted compulsory state use but, on the currently attached evidence, did not itself repudiate
        the underlying proposition that an examination could determine virginity; the correction was therefore incomplete.
  - id: iran-2002-2026
    polity: Iran
    region: Middle East
    startYear: 2002
    endYear: 2026
    endOpen: true
    periodLabel: 2002–present
    strength: policy-basis
    institutionTypes:
      - court
      - medical
    institutions:
      - Legal Medicine Organization of Iran (LMOI)
      - Judiciary of the Islamic Republic of Iran
    institutionalContext: >-
      The Legal Medicine Organization is an official body of Iran's judiciary and its medico-legal centers provide expert
      reports when requested by courts and judges. Research conducted inside Iranian forensic centers describes virginity
      examinations as being performed on civil and criminal court orders as well as for other formal medico-legal purposes.
      A 2026 country review still reports that authorities may attempt virginity testing in some cases; no nationwide
      abolition is documented.
    consequences:
      - Court-ordered hymenal examinations
      - Forensic certificates and reports used in civil and criminal matters
      - Decisions concerning marriage, divorce, welfare placement, and alleged sexual activity
      - Psychological and social harm, including risk of violence and self-harm
    summary: >-
      Iranian medico-legal centers have performed hymenal examinations intended to determine “virginity” for formal legal
      purposes. A study involving experienced examiners from Tehran forensic centers states that the tests are performed on
      civil and criminal court orders and documents applications involving marriage, divorce, welfare placement, alleged
      sexual assault, and certificates of virginity. Modern evidence establishes that hymenal appearance cannot determine a
      history of intercourse, but the accessible record does not show a nationwide Iranian abolition of the practice.
    mechanism:
      kind: enforcement
      summary: >-
        Courts and judges request medico-legal examinations from the judiciary's forensic system, which examines hymenal
        condition and issues expert reports for civil and criminal legal purposes.
    institutionalCorrection:
      status: ongoing
      periodLabel: 2002–present
      action: No nationwide institutional abolition is documented; recent country evidence still reports that authorities may attempt virginity testing in some cases.
      summary: >-
        The current evidence record continues to document official medico-legal use and does not identify a carrier-level
        scientific or legal repudiation of the practice.
  - id: india-2005-2013
    polity: India
    region: South Asia
    startYear: 2005
    endYear: 2013
    periodLabel: 2005–2013
    strength: policy-basis
    institutionTypes:
      - government
      - court
      - medical
      - education
    institutions:
      - Government hospitals and medico-legal services
      - Forensic-medicine training and textbooks
      - Criminal courts using medico-legal reports
    consequences:
      - Invasive examinations of rape survivors
      - Sexual-history judgments in medico-legal reports
      - Evidence used to challenge credibility or imply consent
      - Re-traumatization of survivors
    summary: >-
      Indian forensic-medicine teaching and public hospitals continued to use the two-finger test to judge whether rape
      survivors were “habituated to sexual intercourse.” Medical findings about hymenal condition and vaginal laxity entered
      medico-legal reports and could be used in court to attack a survivor's credibility or imply consent. The Supreme Court
      rejected the practice in 2013, and national health guidelines subsequently instructed examiners not to perform it or
      comment on past sexual experience.
    mechanism:
      kind: standard-setting
      summary: >-
        Forensic-medicine teaching, examination forms and public-hospital practice standardized digital and hymenal
        examinations and converted their results into medico-legal statements about sexual history.
    institutionalCorrection:
      status: corrected
      periodLabel: 2013 onward
      action: The Supreme Court rejected the two-finger test in 2013, and national health guidelines prohibited it and stated that hymenal status cannot prove previous intercourse.
      summary: >-
        India’s judicial and health institutions explicitly rejected both the invasive procedure and its claimed
        evidentiary inference about prior sexual activity.
  - id: indonesia-2014-2022
    polity: Indonesia
    region: Southeast Asia
    startYear: 2014
    endYear: 2022
    periodLabel: 2014–2022
    strength: policy-basis
    institutionTypes:
      - government
      - medical
      - military
    institutions:
      - Indonesian National Police (Polri)
      - Police Medical and Health Center (Pusdokkes Polri)
      - Indonesian National Armed Forces (TNI)
      - Indonesian Army (TNI AD)
      - Indonesian Navy (TNI AL)
      - Indonesian Air Force (TNI AU)
    institutionalContext: >-
      In the police recruitment system, Human Rights Watch identified the National Police regulation and Pusdokkes Polri
      personnel as part of the testing machinery. In the military, all three service branches had used the practice. The
      Army began ending it in 2021; in 2022 the military announced that the Army, Navy, and Air Force had all effectively
      ended the tests for recruitment.
    consequences:
      - Invasive examinations of female recruits
      - Sex discrimination in public employment
      - Psychological and physical harm
    summary: >-
      In 2014, Indonesia's police recruitment system still subjected female applicants to “virginity tests,” including the
      discredited two-finger examination; Pusdokkes Polri personnel conducted the examinations in police medical facilities.
      Human Rights Watch also documented the practice across all three armed-forces branches. The Army began ending the
      practice in 2021, and in April 2022 an armed-forces spokesperson announced that all three military branches had
      effectively ended virginity testing for recruitment.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Police and military recruitment systems incorporated invasive “virginity” examinations into medical screening of
        female applicants and recruits.
    institutionalCorrection:
      status: partial
      periodLabel: 2021–2022
      action: The Army began ending virginity testing in 2021, and in April 2022 the armed forces announced that Army, Navy and Air Force had effectively ended it for recruitment.
      summary: >-
        The military carriers corrected their recruitment practice, but the current evidence record does not establish an
        equivalent institutional reversal by the National Police, so the episode as a whole is only partially corrected.
  - id: kazakhstan-2016-2026
    polity: Kazakhstan
    region: Central Asia
    startYear: 2016
    endYear: 2026
    endOpen: true
    periodLabel: 2016–present
    strength: policy-basis
    institutionTypes:
      - government
      - medical
    institutions:
      - Center for Forensic Examinations, Ministry of Justice of the Republic of Kazakhstan
    institutionalContext: >-
      A Ministry of Justice forensic methodology approved in December 2016 and later published by the state forensic centre
      defines examinations of female “sexual states” as including determination of sexual inviolability and whether previous
      sexual intercourse occurred. The same methodology acknowledges that intercourse can occur without disruption of the
      hymen, yet retains hymenal and genital examination within an expert task aimed at inferring prior intercourse. The
      methodology remains published by the state forensic centre as part of its current methodological materials.
    consequences:
      - Forensic genital examinations intended to infer prior sexual intercourse
      - Use of hymenal condition and injuries within a state evidentiary methodology
      - Potential influence on criminal and civil proceedings through medico-legal conclusions
      - Continuation of a scientifically invalid virginity inference in an official forensic framework
    summary: >-
      Kazakhstan's Ministry of Justice forensic centre uses a methodology approved in 2016 for examining female sexual
      states that includes determining “sexual inviolability” and establishing whether previous intercourse occurred. The
      document instructs direct genital and hymenal examination while also acknowledging that intercourse may occur without
      hymenal rupture. WHO states that hymenal appearance cannot establish prior vaginal intercourse and that no examination
      can prove a history of intercourse.
    mechanism:
      kind: standard-setting
      summary: >-
        The state forensic centre codified genital and hymenal examination in an official methodology whose expert tasks
        include determining sexual inviolability and whether previous intercourse occurred.
    institutionalCorrection:
      status: ongoing
      periodLabel: 2016–present
      action: No correction is documented; the 2016 methodology remains published within the state forensic centre's current methodological materials.
      summary: >-
        The carrier continues to maintain an official framework for inferring prior intercourse from genital and hymenal examination.
  - id: bangladesh-2013-2018
    polity: Bangladesh
    region: South Asia
    startYear: 2013
    endYear: 2018
    periodLabel: 2013–2018
    strength: policy-basis
    institutionTypes:
      - government
      - court
      - medical
    institutions:
      - Ministry of Health and Family Welfare
      - Directorate General of Health Services
      - Dhaka Medical College Hospital, Department of Forensic Medicine
      - Bangabandhu Sheikh Mujib Medical University, Department of Forensic Medicine
      - Sir Salimullah Medical College & Hospital, Department of Forensic Medicine
      - Shaheed Suhrawardy Medical College & Hospital, Department of Forensic Medicine
      - Chittagong Medical College, Department of Forensic Medicine
    institutionalContext: >-
      The 2013 High Court litigation documented physicians in medical colleges across Bangladesh using the two-finger test
      on women and girls reporting rape. In November 2017, heads of five forensic-medicine departments told the court the
      test was necessary. In March 2018 the Ministry of Health and Family Welfare itself stated that finger testing and
      assessment of the hymen were regularly used to determine whether a sexual act had occurred. The ministry withdrew
      that position the following month, and the High Court prohibited the practice.
    consequences:
      - Invasive genital examinations of rape survivors
      - Medico-legal conclusions about prior sexual activity
      - Evidence capable of affecting rape investigations and trials
      - Humiliation, re-traumatization and violation of bodily dignity
    summary: >-
      Bangladesh's medico-legal system used the two-finger test and hymenal examination on women and girls who reported
      rape. In March 2018 the Health Ministry told the High Court that the tests were regularly used to determine whether
      sexual intercourse had occurred. In April the ministry withdrew that position, and on 12 April 2018 the High Court
      declared the two-finger test unscientific, unreliable and invalid and prohibited it in examinations of rape victims.
    mechanism:
      kind: standard-setting
      summary: >-
        Forensic-medicine departments and the health system used finger and hymenal examinations as standard medico-legal
        tools for deciding whether sexual intercourse had occurred.
    institutionalCorrection:
      status: corrected
      periodLabel: April 2018
      action: The Health Ministry withdrew its defence of the tests and the High Court declared the two-finger test unscientific, unreliable and invalid and prohibited it in examinations of rape victims.
      summary: >-
        The health and judicial system explicitly reversed the claimed evidentiary validity and prohibited the practice.
  - id: pakistan-2015-2021
    polity: Pakistan
    region: South Asia
    startYear: 2015
    endYear: 2021
    periodLabel: 2015–2021
    strength: policy-basis
    institutionTypes:
      - government
      - court
      - medical
    institutions:
      - Surgeon Medico Legal Punjab
      - Punjab Health Department
      - Lahore High Court
      - Ministry of Law and Justice, Government of Pakistan
    institutionalContext: >-
      Punjab's 2015 medico-legal instructions mandated digital and hymenal examination in rape and sexual-abuse cases for
      purposes that included ascertaining virginity. The federal government formally rejected the test in 2020. In January
      2021 the Lahore High Court declared two-finger and hymen tests for determining virginity illegal and unconstitutional
      and invalidated the relevant portions of the 2015 instructions and later guidelines. Parliament's Anti-Rape
      (Investigation and Trial) Act 2021 then prohibited two-finger virginity testing and removed its probative value.
    consequences:
      - Invasive genital examinations of sexual-violence survivors
      - Official medico-legal judgments about virginity and sexual history
      - Potential use of those conclusions in criminal proceedings
      - Violation of dignity, privacy and bodily integrity
    summary: >-
      Official medico-legal instructions in Punjab incorporated digital and hymenal examinations intended to ascertain the
      virginity of rape and sexual-abuse victims. By 2020 the federal government had formally rejected the practice as
      inconclusive and incompatible with dignity. In January 2021 the Lahore High Court struck down the tests, and the
      Anti-Rape (Investigation and Trial) Act 2021 subsequently prohibited two-finger virginity testing and removed its
      probative value nationwide.
    mechanism:
      kind: standard-setting
      summary: >-
        Provincial medico-legal instructions made digital and hymenal examination part of official sexual-violence
        examination practice and allowed conclusions about virginity to enter criminal proceedings.
    institutionalCorrection:
      status: corrected
      periodLabel: 2020–2021
      action: The federal government rejected the test, the Lahore High Court struck down the relevant medico-legal rules, and the Anti-Rape Act 2021 prohibited two-finger virginity testing and removed its probative value.
      summary: >-
        Pakistan's executive, judicial and legislative institutions expressly rejected the practice and its evidentiary value.
  - id: georgia-2018-2026
    polity: Georgia
    region: Caucasus
    startYear: 2018
    endYear: 2026
    endOpen: true
    periodLabel: 2018–present
    strength: policy-basis
    institutionTypes:
      - government
      - court
      - medical
    institutions:
      - Levan Samkharauli National Forensics Bureau
      - Ministry of Internal Affairs of Georgia
      - Prosecutor's Office of Georgia
      - Common Courts of Georgia
    institutionalContext: >-
      The Public Defender's review of criminal cases from 2018–2020 found investigators repeatedly ordering state forensic
      examinations focused on hymenal integrity, including cases in which the child's allegation did not involve
      penetration. Georgia's 2025 government report to GREVIO confirms that the current state forensic procedure for sexual
      acts, defined by Government Resolution No. 14 of 16 January 2023, still includes determining hymenal integrity and the
      age of any disruption.
    consequences:
      - Forensic genital examinations of sexual-violence victims, including children
      - Scientifically invalid inferences from hymenal condition
      - Medical reports used as important evidence in criminal investigations and trials
      - Secondary victimization and potential distortion of credibility or penetration findings
    summary: >-
      Georgian investigators and courts have treated hymenal condition as significant forensic evidence in sexual-violence
      cases. A Public Defender study documented repeated orders to examine hymenal integrity and showed that such findings
      could affect credibility and case assessment. The government reported in 2025 that the formal state forensic
      procedure still includes determining hymenal integrity; no subsequent institutional abolition is documented.
    mechanism:
      kind: standard-setting
      summary: >-
        State investigation and forensic rules direct experts to determine hymenal integrity and the age of disruption and
        feed those findings into sexual-violence investigations and court proceedings.
    institutionalCorrection:
      status: ongoing
      periodLabel: 2018–present
      action: No abolition is documented; Georgia's 2025 state report confirms that the formal forensic procedure still includes determining hymenal integrity.
      summary: >-
        The current state forensic framework continues to assign evidentiary significance to hymenal integrity despite the
        documented absence of scientific validity for virginity inference.
  - id: tajikistan-2016-2026
    polity: Tajikistan
    region: Central Asia
    startYear: 2016
    endYear: 2026
    endOpen: true
    periodLabel: 2016–present
    strength: policy-basis
    institutionTypes:
      - government
      - medical
    institutions:
      - National Centre of Forensic Medicine
      - Ministry of Health and Social Protection of the Population of Tajikistan
    institutionalContext: >-
      Tajikistan's 2016 Family Code amendments established mandatory pre-marital medical examinations, and the United
      Nations Common Country Analysis records cases in which those examinations were used for virginity testing; it also
      reports that the state forensic centre checks the virginity of about 600 girls annually. Tajikistan later prohibited
      ordinary virginity tests in medical facilities, but during the country's 2024 CEDAW review its own delegation stated
      that authorities including the National Centre of Forensic Medicine remain authorized to conduct the checks in criminal investigations.
    consequences:
      - State forensic genital examinations intended to determine virginity
      - Use in criminal investigations despite absence of scientific validity
      - Potential legal and social consequences from forensic certificates
      - Psychological, reputational and family harm
    summary: >-
      Tajikistan has restricted ordinary medical virginity testing but retains an explicit forensic exception. A current UN
      country analysis reports substantial state-forensic use, while Tajikistan's own delegation told CEDAW in 2024 that
      the National Centre of Forensic Medicine remains authorized to perform the checks in criminal investigations. This
      preserves an official forensic use of an examination that cannot establish whether vaginal intercourse has occurred.
    mechanism:
      kind: enforcement
      summary: >-
        State medico-legal institutions perform genital examinations intended to determine virginity, including within
        criminal investigations where the forensic exception remains authorized.
    institutionalCorrection:
      status: partial
      periodLabel: by 2024
      action: Tajikistan prohibited ordinary virginity tests in medical facilities but retained authorization for the National Centre of Forensic Medicine and other authorities to conduct them in criminal investigations.
      summary: >-
        The state restricted the practice in ordinary medical settings while preserving an official forensic exception,
        so the underlying institutional inference remains only partially corrected.
