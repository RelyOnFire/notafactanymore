schemaVersion: 2
locale: de
entryId: virginity-testing
sourceReviewedAt: '2026-09-13'
title: „Jungfräulichkeitstests“
proposition:
  summary: >-
    Untersuchungen des Hymens oder der Vagina wurden als geeignet behandelt, festzustellen, ob eine Frau oder
    ein Mädchen bereits vaginalen Geschlechtsverkehr hatte.
correction:
  summary: >-
    Keine körperliche Untersuchung kann feststellen, ob eine Frau oder ein Mädchen zuvor vaginalen Geschlechtsverkehr
    hatte. Das Erscheinungsbild des Hymens variiert natürlicherweise und ist kein verlässlicher Nachweis sexueller
    Aktivität; sogenannte Jungfräulichkeits- oder Zwei-Finger-Tests besitzen keine wissenschaftliche oder klinische
    Aussagekraft.
episodes:
- id: turkey-1986-1998
  polity: Türkei
  periodLabel: 1986–1998; dokumentierte Praxis und berichtete Einschränkung
  institutions:
  - Polizei und Gendarmerie
  - Staatliche gerichtsmedizinische Dienste und Krankenhäuser
  - Staatliche Schulen und Wohnheime
  institutionalContext: >-
    Human Rights Watch dokumentierte Untersuchungen, die Polizei, Gendarmerie, Schulen, Wohnheime und andere staatliche
    Einrichtungen anordneten oder ermöglichten. Staatliche Gerichtsmediziner untersuchten Inhaftierte, Frauen
    unter Prostitutionsverdacht und Schülerinnen, denen Verstöße gegen Schuldisziplin oder öffentliche Moral vorgeworfen
    wurden. Manche polizeilichen Anordnungen umgingen die im Bericht beschriebene Genehmigung durch Gericht oder
    Staatsanwaltschaft. Das Anfangsjahr 1986 bezeichnet einen dokumentierten Fall, nicht die erstmalige Anwendung.
  consequences:
  - Erzwungene Genitaluntersuchungen
  - Verwendung vermeintlicher „Jungfräulichkeit“ als polizeiliches Beweismittel
  - Überwachung und Bestrafung von Frauen und Mädchen
  - Psychische und körperliche Schäden
  summary: >-
    Türkische Polizei, Gendarmerie, Schulen, Wohnheime und andere staatliche Einrichtungen ordneten Untersuchungen
    an oder ermöglichten sie, mit denen die „Jungfräulichkeit“ von Frauen und Mädchen festgestellt werden sollte.
    Staatliche Gerichtsmediziner führten sie bei Inhaftierten, bei Prostitutionsverdacht, zur schulischen Disziplinierung
    und wegen vermeintlicher Verstöße gegen die öffentliche Moral durch. Der US-Länderbericht für 1999 beschreibt
    eine Regierungsregelung von Ende 1998, die solche Tests untersagte, sofern die Frau sie nicht selbst verlangte.
    Er berichtet von einem offenbar rückläufigen Einsatz, zugleich aber von Vollzugsproblemen und fehlenden Sanktionen
    gegen Verstöße. Die Ausnahme auf Verlangen blieb bestehen; eine vollständige Zurückweisung der vermeintlichen
    diagnostischen Aussagekraft ist damit nicht belegt.
  mechanism:
    summary: >-
      Staatliche Stellen ordneten Genitaluntersuchungen an oder ermöglichten sie; Gerichtsmediziner lieferten
      Befunde über angebliche „Jungfräulichkeit“ für polizeiliche, disziplinarische und moralbezogene Entscheidungen.
      Die dokumentierte Praxis umfasste auch Anordnungen ohne die erforderliche Genehmigung.
  institutionalCorrection:
    periodLabel: Ende 1998
    action: Eine Regierungsregelung untersagte die Tests dem Länderbericht zufolge, sofern die Frau sie nicht
      selbst verlangte.
    summary: >-
      Die berichtete Einschränkung begrenzte zwangsweise Tests, ließ jedoch eine Ausnahme auf Verlangen zu. Der
      spätere Länderbericht beschreibt Vollzugsdefizite; er belegt weder ein allgemeines Ende der Praxis noch
      eine wissenschaftliche Zurückweisung der zugrunde liegenden Schlussfolgerung.
- id: iran-2014-2026
  polity: Iran
  periodLabel: Feldforschung 2014; spätere Berichte im April 2026 bewertet
  institutions:
  - Legal Medicine Organization of Iran (LMOI)
  - Justiz der Islamischen Republik Iran
  institutionalContext: >-
    Die Legal Medicine Organization ist eine offizielle Einrichtung der iranischen Justiz; ihre gerichtsmedizinischen
    Zentren erstellen Gutachten auf Anforderung von Gerichten, Richtern und Verwaltungsbehörden. Eine qualitative
    Studie mit Feldforschung in Teheran im Jahr 2014 befragte Fachkräfte aus gerichtsmedizinischen Zentren und
    staatlichen gynäkologischen Kliniken. Sie beschrieben Untersuchungen auf Anordnung von Zivil- und Strafgerichten
    sowie weitere formelle gerichtsmedizinische Anwendungen. Eine im April 2026 veröffentlichte Bewertung des
    britischen Innenministeriums berichtet, Behörden könnten in bestimmten Situationen solche Tests veranlassen,
    weist aber darauf hin, dass die Belege keine Aussage über deren Verbreitung erlauben. Dies ist eine spätere
    Berichterstattung, kein Nachweis einer durchgängigen Praxis von 2014 bis 2026.
  consequences:
  - Gerichtlich angeordnete Hymenuntersuchungen
  - Gerichtsmedizinische Bescheinigungen und Gutachten in Zivil- und Strafsachen
  - Berichtete Anwendungen bei Ehe, Scheidung, Unterbringung und mutmaßlicher sexueller Aktivität
  - In Interviews geschilderte psychische und soziale Risiken einschließlich Gewalt und Selbstverletzung
  summary: >-
    Iranische gerichtsmedizinische Zentren führten Hymenuntersuchungen durch, mit denen für formelle rechtliche
    Zwecke eine angebliche „Jungfräulichkeit“ festgestellt werden sollte. In Teheran befragte Fachkräfte beschrieben
    gerichtlich angeordnete Untersuchungen und Anwendungen bei Ehe, Scheidung, Unterbringung, mutmaßlicher sexueller
    Gewalt und Jungfräulichkeitsbescheinigungen. Dieselben Befragten äußerten Unsicherheit über die diagnostische
    Genauigkeit und schilderten Konflikte um Einwilligung und mögliche Folgen einer Bescheinigung für die untersuchte
    Person. Die Interviews belegen institutionelle Praxis und berichtete Erfahrungen; sie messen keine landesweite
    Verbreitung. Die britische Länderbewertung vom April 2026 beschreibt mögliche Tests in bestimmten Situationen.
    Die angeführten Quellen benennen keine landesweite institutionelle Zurückweisung der Praxis.
  mechanism:
    summary: >-
      Gerichte und Richter fordern gerichtsmedizinische Untersuchungen beim Forensiksystem der Justiz an, das
      den Hymenzustand untersucht und Gutachten oder Bescheinigungen für zivil- und strafrechtliche Zwecke ausstellt.
      Den konkreten Praxisbeleg liefert die Teheraner Interviewstudie.
  institutionalCorrection:
    summary: >-
      Die angeführten Quellen dokumentieren gerichtsmedizinische Anwendung und eingeschränkte spätere Berichte,
      benennen aber keinen Korrekturakt der Justiz- oder Forensikträger. Aus fortgesetzter Nutzung oder einem
      fehlenden Abschaffungsbericht wird weder ein Korrekturdatum noch eine Korrekturmaßnahme abgeleitet.
- id: india-2005-2013
  polity: Indien
  periodLabel: 2005–2013; erneute gerichtliche Anordnungen 2022
  institutions:
  - Staatliche Krankenhäuser und gerichtsmedizinische Dienste
  - Gerichtsmedizinische Ausbildung und Lehrbücher
  - Strafgerichte, die gerichtsmedizinische Berichte verwendeten
  institutionalContext: >-
    Human Rights Watch dokumentierte den Fingertest in gerichtsmedizinischen Lehrbüchern von 2005 und 2007, Formularen
    öffentlicher Krankenhäuser und vor Gericht verwendeten Gutachten. Befunde zu Hymen und vaginaler Weite dienten
    dazu, Betroffene als an Geschlechtsverkehr „gewöhnt“ zu beschreiben. Der Supreme Court verwarf im Fall Lillu
    2013 den Eingriff in Privatsphäre und Würde sowie die Verwendung solcher Befunde zur Schlussfolgerung auf
    Einwilligung. 2022 griff er das Thema erneut auf, zitierte nationale Gesundheitsrichtlinien mit einem Verbot
    des Tests und stellte fest, dass die Praxis dennoch fortbestand.
  consequences:
  - Invasive Untersuchungen von Vergewaltigungsbetroffenen
  - Beurteilung der Sexualgeschichte in gerichtsmedizinischen Berichten
  - Verwendung zur Infragestellung von Glaubwürdigkeit oder zur Unterstellung einer Einwilligung
  - Erneute Traumatisierung der Betroffenen
  summary: >-
    In der indischen Gerichtsmedizin und in öffentlichen Krankenhäusern wurde der Zwei-Finger-Test eingesetzt,
    um zu beurteilen, ob Vergewaltigungsbetroffene an Geschlechtsverkehr „gewöhnt“ seien. Befunde zu Hymen und
    vaginaler Weite gelangten in gerichtsmedizinische Berichte und konnten vor Gericht zur Infragestellung der
    Glaubwürdigkeit oder zur Unterstellung einer Einwilligung dienen. Der Supreme Court verwarf die Praxis 2013.
    Nationale Gesundheitsrichtlinien untersagten anschließend den Test und Schlussfolgerungen auf früheren Geschlechtsverkehr
    aus dem Hymenstatus. 2022 verurteilte das Gericht den Einsatz erneut, ordnete die Verbreitung der Richtlinien
    an staatliche und private Krankenhäuser an und verlangte Fortbildung und Änderungen medizinischer Lehrpläne.
    Die formelle Beweisbewertung hatte sich geändert; die erneuten Anordnungen reagierten jedoch auf fortbestehende
    Verstöße. Medizinisch erforderliche Untersuchungen zur Feststellung von Verletzungen und zur Versorgung sind
    davon zu unterscheiden.
  mechanism:
    summary: >-
      Gerichtsmedizinische Lehre, Untersuchungsformulare und Krankenhauspraxis standardisierten Untersuchungen
      mit den Fingern sowie Hymenuntersuchungen und übersetzten deren Befunde in Aussagen über die Sexualgeschichte,
      die in Strafverfahren eingehen konnten.
  institutionalCorrection:
    periodLabel: ab 2013; erneute Umsetzungsanordnungen 2022
    action: >-
      Der Supreme Court verwarf den Test 2013 im Fall Lillu; nationale Gesundheitsrichtlinien untersagten ihn,
      und 2022 erneuerte das Gericht Anordnungen zu Umsetzung und Fortbildung.
    summary: >-
      Die Korrektur betrifft die formelle Zurückweisung des Tests und seiner behaupteten Aussagekraft für Sexualgeschichte
      oder Einwilligung durch Justiz und Gesundheitsstandards. Das Urteil von 2022 dokumentiert selbst die fortgesetzte
      Anwendung; die Einordnung bestätigt daher keine allgemeine Befolgung.
- id: indonesia-2014-2022
  polity: Indonesien
  periodLabel: 2014–2022; berichtete Reformen der Rekrutierung
  institutions:
  - Kepolisian Negara Republik Indonesia (Polri)
  - Pusat Kedokteran dan Kesehatan Polri (Pusdokkes Polri)
  - Tentara Nasional Indonesia (TNI)
  - Tentara Nasional Indonesia Angkatan Darat (TNI AD)
  - Tentara Nasional Indonesia Angkatan Laut (TNI AL)
  - Tentara Nasional Indonesia Angkatan Udara (TNI AU)
  institutionalContext: >-
    Die Untersuchung von Human Rights Watch aus dem Jahr 2014 benannte die polizeiliche Bewerberauswahl und Personal
    von Pusdokkes Polri, das Untersuchungen in Polizeikrankenhäusern durchführte. Artikel 36 der Polizeiverordnung
    Nr. 5/2009 verlangte eine geburtshilflich-gynäkologische Untersuchung. Der Bericht dokumentierte „Jungfräulichkeitstests“
    innerhalb dieser Auswahlpraxis; die Verordnung schrieb einen solchen Test nicht ausdrücklich vor. Gesonderte
    Berichte von Human Rights Watch beschreiben den früheren Einsatz in den Teilstreitkräften. Spätere Berichte
    nennen die Beendigung bei der Polizei und die Änderung im Heer 2021, gefolgt von einer Mitteilung zu allen
    drei Teilstreitkräften im April 2022.
  consequences:
  - Invasive Untersuchungen von Bewerberinnen
  - Geschlechterdiskriminierung im öffentlichen Dienst
  - Psychische und körperliche Schäden
  summary: >-
    Noch 2014 mussten sich Bewerberinnen für die indonesische Polizei sogenannten „Jungfräulichkeitstests“ einschließlich
    des widerlegten Zwei-Finger-Tests unterziehen; Personal von Pusdokkes Polri führte sie in polizeilichen medizinischen
    Einrichtungen durch. Human Rights Watch dokumentierte belastende Erfahrungen bei der Rekrutierung, wies aber
    darauf hin, dass ein Nichtbestehen nicht zwangsläufig zum automatischen Ausschluss führte. Auch Heer, Marine
    und Luftwaffe verwendeten die Praxis. Das Heer leitete 2021 ihre Beendigung ein; im April 2022 erklärte ein
    Sprecher der Streitkräfte, alle drei Teilstreitkräfte hätten sie bei der Rekrutierung tatsächlich eingestellt.
    Dieselbe Berichterstattung hält fest, dass die Polizei bereits zuvor aufgehört hatte. Das dokumentiert Berichte
    über eine institutionelle Abkehr, jedoch keine unabhängige Überprüfung jeder einzelnen Rekrutierungsstelle.
  mechanism:
    summary: >-
      Polizei und Militär integrierten invasive „Jungfräulichkeitsuntersuchungen“ in die medizinische Bewerberauswahl.
      Die Berichterstattung belegt die Umsetzung; die polizeiliche Gesundheitsverordnung selbst nannte einen Jungfräulichkeitstest
      nicht ausdrücklich.
  institutionalCorrection:
    periodLabel: berichtete Beendigung bei der Polizei; Heeresreform 2021; Mitteilung zu allen Teilstreitkräften
      im April 2022
    action: >-
      Human Rights Watch berichtete vom Ende bei der Polizei, der eingeleiteten Beendigung im Heer 2021 und der
      Mitteilung vom April 2022 zu Heer, Marine und Luftwaffe.
    summary: >-
      Die Quellen berichten über die Abkehr in der polizeilichen und militärischen Rekrutierung, einschließlich
      der Reaktion der Polizei. Die Einordnung beschränkt sich auf diese berichtete institutionelle Veränderung
      und bestätigt kein unabhängig überprüftes Ende jeder Untersuchung in jedem Umfeld.
- id: kazakhstan-2016
  polity: Kasachstan
  periodLabel: Methodik am 5. Dezember 2016 genehmigt
  institutions:
  - Zentrum für Rechtsmedizin des Justizministeriums der Republik Kasachstan
  institutionalContext: >-
    Der Methodenpass verzeichnet die Genehmigung durch den Wissenschaftlichen Rat des Zentrums für Rechtsmedizin
    des Justizministeriums, Protokoll Nr. 2 vom 5. Dezember 2016. Das heutige Zentrum für forensische Untersuchungen
    stellt das Dokument auf seiner Website bereit. Die Methodik zählt die Feststellung früheren Geschlechtsverkehrs
    zu den Sachverständigenaufgaben und bezeichnet das Hymen als hauptsächlichen Untersuchungsgegenstand bei der
    Bewertung „sexueller Unversehrtheit (Jungfräulichkeit)“. Sie schreibt Genital- und Hymenuntersuchungen vor,
    räumt aber ein, dass Geschlechtsverkehr ohne Hymenruptur möglich ist. Die Verfügbarkeit auf der Website belegt
    die Veröffentlichung, nicht die Anwendungshäufigkeit oder bestimmte Gerichtsentscheidungen.
  consequences:
  - Amtlicher Untersuchungsrahmen zur Schlussfolgerung auf früheren Geschlechtsverkehr
  - Vorgeschriebene Berücksichtigung von Hymenzustand und Verletzungen in Gutachten
  - Möglicher Einfluss daraus entstehender Gutachten auf Straf- und Zivilverfahren
  - Aufnahme einer Aufgabe zur Bewertung von Jungfräulichkeit neben Verfahren zur Verletzungsdokumentation
  summary: >-
    Kasachstans Zentrum für Rechtsmedizin genehmigte 2016 eine Methodik, die die Feststellung früheren Geschlechtsverkehrs
    zu ihren Sachverständigenaufgaben zählt. Im Abschnitt zur „sexuellen Unversehrtheit (Jungfräulichkeit)“ steht
    das Hymen im Mittelpunkt der Untersuchung. Zugleich erkennen die Anweisungen an, dass Geschlechtsverkehr ohne
    Hymenruptur stattfinden kann. Das dokumentiert einen institutionellen Rahmen für die strittige Schlussfolgerung
    einschließlich der darin enthaltenen Einschränkungen. Eine durchgängige Anwendung bis 2026, Untersuchungszahlen
    oder konkrete Verfahrensergebnisse sind damit nicht belegt. Die Kritik betrifft die Bestimmung der Sexualgeschichte
    anhand körperlicher Merkmale; Verletzungsdokumentation und andere forensische Beweise erfüllen andere Aufgaben.
  mechanism:
    summary: >-
      Der Wissenschaftliche Rat des Zentrums genehmigte eine forensische Methodik mit Untersuchungsaufgaben und
      Genital- beziehungsweise Hymenbefunden für Gutachten über sexuelle Unversehrtheit und früheren Geschlechtsverkehr.
  institutionalCorrection:
    summary: >-
      Die zitierte Methodik dokumentiert keine institutionelle Entscheidung, die Bewertung von Jungfräulichkeit
      aufzugeben. Ihre spätere Veröffentlichung belegt keine Korrektur und lässt für sich allein auch den Umfang
      einer fortgesetzten Anwendung offen.
- id: bangladesh-2013-2018
  polity: Bangladesch
  periodLabel: 2013–2018
  institutions:
  - Ministerium für Gesundheit und Familienwohlfahrt
  - Dhaka Medical College Hospital, Abteilung für Rechtsmedizin
  - Bangabandhu Sheikh Mujib Medical University, Abteilung für Rechtsmedizin
  - Sir Salimullah Medical College & Hospital, Abteilung für Rechtsmedizin
  - Shaheed Suhrawardy Medical College & Hospital, Abteilung für Rechtsmedizin
  - Chittagong Medical College, Abteilung für Rechtsmedizin
  institutionalContext: >-
    Die BLAST-Chronologie zum Verfahren Nr. 10663 von 2013 dokumentiert den gerichtsmedizinischen Einsatz des
    Tests und die Institutionen, die ihn verteidigten. Am 6. November 2017 erklärten die Leiter von fünf rechtsmedizinischen
    Abteilungen vor dem High Court, der Test sei notwendig; im Dezember folgten schriftliche Stellungnahmen. Das
    Gesundheitsministerium verteidigte in seiner Erklärung vom 11. März 2018 Fingertest und Hymenbewertung als
    Methoden zur Feststellung eines Geschlechtsakts. Am 10. April legte es ein neueres Versorgungsprotokoll vor
    und zog diese Verteidigung zurück. Der High Court untersagte den Test am 12. April. Die Generaldirektion für
    Gesundheitsdienste war Verfahrensgegnerin; diese Stellung allein belegt keine eigenständige Übernahme der
    strittigen Behauptung.
  consequences:
  - Invasive Genitaluntersuchungen von Vergewaltigungsbetroffenen
  - Gerichtsmedizinische Schlussfolgerungen über frühere sexuelle Aktivität
  - Potenzieller Einfluss solcher Befunde auf Ermittlungen und Strafverfahren
  - Erniedrigung, erneute Traumatisierung und Verletzung körperlicher Würde
  summary: >-
    Im gerichtsmedizinischen System Bangladeschs wurden Frauen und Mädchen nach Vergewaltigungsanzeigen dem Zwei-Finger-Test
    und Hymenuntersuchungen unterzogen. Die institutionelle Annahme wurde im Rechtsstreit ausdrücklich sichtbar:
    Fünf Leiter rechtsmedizinischer Abteilungen verteidigten den Test im November 2017; im März 2018 argumentierte
    das Gesundheitsministerium, Ärzte seien darauf angewiesen, um früheren Geschlechtsverkehr festzustellen. Im
    April zog es diese Position nach Vorlage eines neueren Versorgungsprotokolls zurück. Nach der BLAST-Prozesschronologie
    untersagte der High Court den Test am 12. April 2018, verwarf die Beschreibung von Betroffenen als an Geschlechtsverkehr
    „gewöhnt“ und ordnete die Verbreitung des Protokolls an. Die Anordnungen unterschieden den widerlegten Test
    von fachärztlichen Untersuchungen zur Feststellung von Verletzungen oder zur Versorgung. Urteil und Protokoll
    änderten den formellen Standard; die Quellen messen keine spätere Befolgung in jeder Einrichtung.
  mechanism:
    summary: >-
      Rechtsmedizinische Abteilungen und Gesundheitsverwaltung nutzten und verteidigten Finger- und Hymenuntersuchungen
      als gerichtsmedizinische Instrumente zur Feststellung eines Geschlechtsakts. Daraus entstanden medizinische
      Aussagen, die in Vergewaltigungsverfahren eingehen konnten.
  institutionalCorrection:
    periodLabel: April 2018
    action: >-
      Das Gesundheitsministerium zog seine Verteidigung am 10. April zurück; der High Court untersagte den Test
      am 12. April und ordnete die Verbreitung des Versorgungsprotokolls an.
    summary: >-
      Die berichteten gerichtlichen Anordnungen und die geänderte Position des Ministeriums verwarfen den Test
      und seinen behaupteten Beweiswert ausdrücklich. Das korrigierte den formellen institutionellen Standard,
      ohne dass die Quellen eine allgemeine Umsetzung belegen.
- id: pakistan-2015-2021
  polity: Pakistan
  periodLabel: Anweisungen 2015; exekutive und rechtliche Reaktionen 2020–2021
  institutions:
  - Surgeon Medico Legal Punjab
  - Gesundheitsbehörde Punjab
  institutionalContext: >-
    Punjabs gerichtsmedizinische Anweisungen von 2015 umfassten Untersuchungen mit den Fingern und Hymenuntersuchungen
    unter anderem zur Feststellung angeblicher Jungfräulichkeit. Das Urteil des Lahore High Court dokumentiert
    die Anweisungen und Erläuterungen der Gesundheitsbehörden und des Surgeon Medico Legal Punjab. Es hält gesondert
    fest, dass die Punjab Forensic Science Agency nach eigener Aussage keine Jungfräulichkeitstests verwendete.
    Die Bundesregierung verwarf den Test in einer Erklärung vom Oktober 2020. Das Urteil des High Court von 2021
    erklärte die entsprechenden Anweisungen und Richtlinien für ungültig. Der Anti-Rape (Investigation and Trial)
    Act 2021 enthielt anschließend ein ausdrückliches Verbot und den Ausschluss des Beweiswerts für Zwei-Finger-Jungfräulichkeitstests
    bei gerichtsmedizinischen Untersuchungen zu den im Gesetz aufgeführten Straftaten. Gericht und Justizministerium
    werden hier für ihre korrigierende Rolle benannt.
  consequences:
  - Invasive Genitaluntersuchungen von Betroffenen sexueller Gewalt
  - Amtliche gerichtsmedizinische Urteile über Jungfräulichkeit und Sexualgeschichte
  - Potenzielle Verwendung dieser Schlussfolgerungen in Strafverfahren
  - Verletzung von Würde, Privatsphäre und körperlicher Integrität
  summary: >-
    Offizielle gerichtsmedizinische Anweisungen in Punjab sahen Untersuchungen mit den Fingern und Hymenuntersuchungen
    zur Feststellung angeblicher Jungfräulichkeit von Vergewaltigungs- und Missbrauchsbetroffenen vor. Die Bundesregierung
    verwarf den Test im Oktober 2020 als nicht schlüssig und mit der Menschenwürde unvereinbar. 2021 erklärte
    der Lahore High Court Zwei-Finger- und Hymentests zu diesem Zweck sowie die entsprechenden Anweisungen und
    Richtlinien für ungültig. Auch § 13 Absatz 1 des Anti-Rape (Investigation and Trial) Act 2021 sieht für gerichtsmedizinische
    Untersuchungen zu den dort aufgeführten Straftaten ein Verbot des Zwei-Finger-Jungfräulichkeitstests vor und
    schließt dessen Beweiswert aus. Das Gesetz erstreckt sich auf ganz Pakistan, sieht aber eine gesonderte Bekanntmachung
    der Bundesregierung zum Inkrafttreten vor; ein genaues Inkrafttretensdatum wird hier nicht festgestellt. Die
    gerichtlichen und gesetzlichen Änderungen betreffen den ungültigen Rückschluss auf Jungfräulichkeit. Medizinisch
    begründete Untersuchungen sind davon zu unterscheiden.
  mechanism:
    summary: >-
      Gesundheits- und gerichtsmedizinische Behörden Punjabs nahmen Untersuchungen mit den Fingern sowie Hymenuntersuchungen
      in die Anweisungen zur Begutachtung sexueller Gewalt auf. Dadurch konnten Urteile über Jungfräulichkeit
      und Sexualgeschichte in gerichtsmedizinische Berichte eingehen.
  institutionalCorrection:
    periodLabel: exekutive, gerichtliche und gesetzliche Reaktionen 2020–2021
    action: >-
      Die Bundesregierung verwarf den Test im Oktober 2020; der Lahore High Court erklärte die Testanweisungen
      2021 für ungültig. § 13 Absatz 1 des Anti-Rape Act 2021 sieht ein Verbot und den Ausschluss des Beweiswerts
      für die genannten Untersuchungen vor.
    summary: >-
      Die dokumentierte Regierungserklärung, das Urteil und die verabschiedete Gesetzesbestimmung verwerfen die
      Praxis oder deren Beweiswert innerhalb ihres jeweiligen Geltungsbereichs. Die Einordnung behauptet weder
      allgemeine Befolgung noch ein ungeprüftes Inkrafttretensdatum oder ein Verbot aller medizinisch erforderlichen
      Genitaluntersuchungen.
- id: georgia-2018-2020
  polity: Georgien
  periodLabel: Verfahrensmaterial 2018–2020; späterer Verfahrenskontext 2025
  institutions:
  - Levan Samkharauli National Forensics Bureau
  - Innenministerium Georgiens
