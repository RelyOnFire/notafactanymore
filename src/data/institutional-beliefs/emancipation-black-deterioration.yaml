schemaVersion: 2
title: Emancipation as a cause of Black mental and social deterioration
proposition:
  summary: >-
    The United States Department of State treated sectional disability and social-welfare figures derived from the
    1840 census as evidence that changing the relation of slavery, especially through emancipation, caused Black
    people's physical, mental, moral, and social condition to deteriorate.
correction:
  summary: >-
    The 1840 returns could not sustain that causal inference. The population schedule counted free Black people and
    enslaved people separately, but its disability columns grouped all “colored persons”; the free-versus-enslaved
    contrast was therefore a sectional proxy constructed from states with different slavery regimes. The published
    tables also contained impossible entries and major misclassifications, including disability cases assigned to
    towns reporting no Black inhabitants. Even accurate aggregate counts would not isolate emancipation from regional
    differences in enumeration, diagnosis, institutional access, living conditions, and reporting. The historical
    categories themselves bundled distinct disabilities and are not modern diagnoses. These data supplied no valid
    basis for concluding that freedom caused disability or social deterioration.
category: Race, statistics and public policy
reviewedAt: '2026-09-27'
impact:
  summary: >-
    Secretary of State John C. Calhoun inserted the defective returns into an official diplomatic case for Texas
    annexation and the preservation of slavery. His 18 April 1844 letter to British minister Richard Pakenham presented
    a seven-to-one sectional disability ratio as evidence that changing slavery's racial relation harmed Black people.
    Physicians and statisticians demonstrated gross errors, and one House report and a Senate committee accepted major
    parts of that criticism. Calhoun nevertheless commissioned a defense by the official who had supervised preparation
    of the census and told the House in February 1845 that the sectional result stood unimpeached. The returns were never
    subjected to the requested general revision or formally disowned; although the 1850 census was redesigned, an
    official 1854 compendium still reproduced the departmental defense and calculated new sectional disability ratios.
  highlights:
    - value: 1 in 96 vs 1 in 672
      label: Calhoun's composite ratio for five disability categories in states without and with slavery, not an insanity-only statistic
    - value: 56 of 94
      label: Maine cases labeled as Black insanity that a state hospital report located in towns with no Black inhabitants in the same census
    - value: 1844–1850
      label: Federal criticism led to a redesigned census, while Congress declined a general revision or withdrawal of sanction for the 1840 returns
  context:
    - >-
      The sixth census supplied the numerical material, but the federal causal endorsement came from the Department of
      State in 1844 and 1845. The card does not attribute Calhoun's interpretation to every census enumerator or every
      member of Congress.
    - >-
      The census separated free Black people and enslaved people in its population columns but used combined disability
      columns for “colored persons.” Calhoun's comparison therefore sorted states by slavery regime rather than directly
      comparing otherwise similar free and enslaved people.
    - >-
      Calhoun's 1-in-96 and 1-in-672 figures combined deafness, muteness, blindness, idiocy, and insanity. A separate
      ratio in the same letter added pauperism and imprisonment; neither figure was an insanity-only rate.
    - >-
      Contemporary critics established decisive internal contradictions in the census, but that does not make all of
      their wider racial or medical assumptions sound. Their audits are used here for the documented errors, not as
      present-day authority on race, disability, or mental health.
episodes:
  - id: united-states-1844-1845
    polity: United States
    region: North America
    startYear: 1844
    endYear: 1845
    periodLabel: 1844–1845
    strength: officially-endorsed
    institutionTypes:
      - government
    institutions:
      - United States Department of State
    institutionalContext: >-
      On 18 April 1844, Secretary of State John C. Calhoun used the 1840 census in formal correspondence with British
      minister Richard Pakenham. In arguing for the annexation of Texas against British antislavery policy, he claimed
      that states which had changed the “ancient relation” of slavery had driven Black people into vice, pauperism,
      disability, and mental illness. After medical, statistical, and congressional challenges exposed major defects,
      Calhoun assigned William A. Weaver, who had supervised preparation and correction of the 1840 returns, to review
      the accusations. Calhoun transmitted Weaver's rebuttal to the House in February 1845 and declared the sectional
      disability result unimpeached and a change from slavery a curse rather than a benefit for Black people.
    consequences:
      - Defective federal statistics became part of an official diplomatic argument for Texas annexation and the preservation of slavery
      - A composite disability ratio was presented as quantitative proof of a broad racial, moral, and social causal claim
      - The Department of State reaffirmed the conclusion after documented errors had prompted congressional scrutiny
      - Congress declined a general revision and did not formally withdraw its sanction, even while redesigning the next census
      - An official 1854 census compendium continued to circulate the departmental defense and sectional comparison
    summary: >-
      Calhoun converted the 1840 census's defective disability returns into an official proslavery causal argument. His
      1844 letter used a sectional proxy and a composite of five disability categories to claim that emancipation or a
      changed racial relation produced physical, mental, and social decline. Contemporary investigators found impossible
      entries and documented how white patients and other counts had been placed in Black disability columns. Federal
      responses then split: a House report and a Senate committee accepted serious defects and the next census was
      redesigned, while the Department of State defended the result and Congress declined a general revision or formal
      disavowal. The episode therefore ended with a partial procedural correction, not a clear retraction by the adopting
      institution.
    mechanism:
      kind: endorsement
      summary: >-
        The Department of State turned an error-ridden census table into an official causal proposition through
        diplomatic correspondence, congressional publication, and a departmental review that defended the result after
        formal challenges.
    institutionalCorrection:
      status: partial
      periodLabel: 1844–1850
      action: House and Senate reviewers acknowledged major defects and Congress redesigned the 1850 census, but it ordered no general revision and did not formally withdraw its sanction from the 1840 returns.
      summary: >-
        House Report 580 accepted that the census was inaccurate, whereas the separate Report 579 did not establish the
        alleged errors in the petition before it. In 1845 the Joint Committee on the Library found the Statistical
        Association's criticisms generally correct and the errors serious enough to undermine confidence, yet declined
        both a costly revision and a formal withdrawal of congressional sanction. Congress created a Census Board in
        1849, and the 1850 enumeration replaced the cramped household-summary form with individual-level schedules.
        The correction remained partial because the Department of State rejected the central criticism, the sectional
        result remained officially defended, and the 1854 census compendium still reproduced the defense and
        sectional comparisons.
