entryId: reichstag-fire-communist-insurrection
sourceReviewedAt: '2026-08-25'
title: Der Reichstagsbrand als Beleg für einen kommunistischen Aufstand
claim: >-
  Die nationalsozialistischen Behörden behandelten den Reichstagsbrand als Beleg für eine kommunistische
  Umsturzverschwörung, die den Staat bedrohe, und begründeten mit dieser behaupteten Gefahr außerordentliche
  Notstandsbefugnisse und politische Repression.
currentUnderstanding: >-
  Der Reichstag brannte am 27. Februar 1933, und Marinus van der Lubbe wurde wegen der Brandstiftung verurteilt.
  Die von der Regierung behauptete weitergehende kommunistische Verschwörung ließ sich jedoch nicht belegen. Vier
  weitere Angeklagte, denen eine Beteiligung an einem Plan zur Auslösung eines kommunistischen Aufstands vorgeworfen
  wurde, sprach das Reichsgericht mangels Beweisen frei; das Regime hielt dennoch an der Verschwörungsthese fest.
  Ob van der Lubbe beim Brand selbst völlig allein handelte, ist in der Forschung weiterhin umstritten und muss für
  diese Korrektur nicht entschieden werden.
impact:
  summary: >-
    Die behauptete kommunistische Revolutionsgefahr wurde unmittelbar zur rechtlichen Begründung der
    Reichstagsbrandverordnung vom 28. Februar 1933. Sie setzte zentrale Grundrechte außer Kraft und erlaubte weitreichende
    Eingriffe in persönliche Freiheit, Meinungs- und Pressefreiheit, Versammlungs- und Vereinigungsfreiheit,
    Kommunikationsgeheimnis, Hausrecht und Eigentum. Damit wurde die Behauptung zu einem dauerhaften Bestandteil der
    Repressions- und Polizeistaatsmechanik des NS-Regimes, obwohl der Strafprozess die weitergehende Verschwörung gegen
    vier der fünf Angeklagten nicht nachweisen konnte.
  highlights:
  - value: '7'
    label: Artikel der Weimarer Reichsverfassung, die durch die Reichstagsbrandverordnung außer Kraft gesetzt wurden
  - value: 4 von 5
    label: Angeklagte im Reichstagsbrandprozess, die mangels Beweisen freigesprochen wurden
  - value: 1933–1945
    label: der durch die Verordnung geschaffene Ausnahmezustand blieb während der NS-Herrschaft formell bestehen
  context:
  - >-
    Ob Nationalsozialisten selbst an der Brandlegung beteiligt waren, ist historisch weiterhin umstritten. Die
    dokumentierte institutionelle Falschbehauptung ist enger: Die Behörden behandelten den Brand als Beleg für eine
    kommunistische Umsturzverschwörung und begründeten damit den Notstand.
  - >-
    Van der Lubbe wurde verurteilt und hingerichtet. Das Beweisproblem betraf die weitergehende Anklagethese, er habe
    gemeinsam mit vier kommunistischen Mitangeklagten durch Brandstiftung und Hochverrat einen Aufstand auslösen wollen.
  - >-
    Die Verordnung wirkte weit über die Ermittlungen zum Brand hinaus: Der von ihr geschaffene Ausnahmezustand blieb
    bis zum Zusammenbruch des NS-Regimes 1945 bestehen.
episodes:
- id: nazi-germany-1933-1945
  polity: NS-Deutschland
  institutions:
  - Reichsregierung
  - Reichsministerium des Innern
  institutionalContext: >-
    Am 28. Februar 1933, einen Tag nach dem Brand, erließ Reichspräsident Paul von Hindenburg auf Betreiben der Regierung
    Adolf Hitlers die Verordnung zum Schutz von Volk und Staat. Schon ihre Präambel erklärte sie zur Abwehr
    „kommunistischer staatsgefährdender Gewaltakte“. Sie setzte sieben Verfassungsartikel außer Kraft und ermöglichte
    außergewöhnliche Eingriffe in Grundrechte und staatliche Zuständigkeiten. Parallel beschuldigten die Machthaber
    Kommunisten eines geplanten Umsturzes und klagten fünf Männer wegen gemeinschaftlicher Brandstiftung und Hochverrats
    zur Auslösung eines kommunistischen Aufstands an. Im Dezember 1933 wurde van der Lubbe verurteilt; die vier übrigen
    Angeklagten wurden mangels Beweisen freigesprochen. Das Regime hielt trotzdem an der Verschwörungsthese fest, und
    die Notstandsverordnung blieb bis 1945 in Kraft.
  consequences:
  - Außerkraftsetzung zentraler Grundrechte auf persönliche Freiheit, Meinungsäußerung, Presse, Versammlung und Vereinigung
  - Ausweitung von Haussuchungen, Beschlagnahmen, Überwachung der Kommunikation und Eingriffen des Reichs in die Länder
  - Massenhafte politische Verfolgung einschließlich Haft sowie Unterdrückung von Organisationen und Publikationen
  - Fortbestand des Notstandsrechts, obwohl die weitergehende kommunistische Verschwörung im Prozess nicht bewiesen wurde
  summary: >-
    Der Reichstagsbrand wurde nicht nur zum Gegenstand eines Strafverfahrens, sondern zum Tatsachenkern eines
    dauerhaften Notstandsregimes. Die Verordnung vom 28. Februar berief sich ausdrücklich auf kommunistische Gewaltakte,
    die den Staat bedrohten, und setzte sieben Verfassungsgarantien außer Kraft. Im anschließenden Prozess versuchte die
    Anklage zu beweisen, fünf Männer hätten gemeinsam einen kommunistischen Aufstand vorbereiten wollen. Vier wurden
    mangels Beweisen freigesprochen. Dennoch gab die Regierung weder die Verschwörungserzählung noch die damit
    verbundenen Notstandsbefugnisse auf; der Ausnahmezustand bestand bis 1945 fort.
