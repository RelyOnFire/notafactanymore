      - title: Notification of approval of GOST R 71946-2025
        url: https://uvedns.gostinfo.ru/uveddetails?id=179826
        publisher: Russian Institute for Standardization
        note: Official notification records Rosstandart registration of the dedicated national algolization standard.
      - title: Federal Law No. 162-FZ — Article 26, General rules for applying national standardization documents
        url: https://www.consultant.ru/document/cons_doc_LAW_181810/0b41c80a4b380c5845a29b37afa6f49390738b18/
        publisher: ConsultantPlus — text of Federal Law No. 162-FZ on Standardization in the Russian Federation
        note: >-
          Article 26 states that documents of the national standardization system are generally applied voluntarily unless
