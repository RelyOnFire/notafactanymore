  institutions:
  - USSR Ministry of Foreign Affairs
  - Soviet public-health authorities
  institutionalContext: >-
    During and after the 1979 outbreak, Soviet public information attributed anthrax risk to diseased animals and
    uninspected meat. On 20 March 1980 the Soviet Foreign Ministry formally told the United States that Sverdlovsk had
    experienced an ordinary natural anthrax outbreak among animals and that human cases were intestinal anthrax caused
    by eating cattle meat sold without proper veterinary supervision. It denied any relevance to the Biological Weapons
    Convention. When the United States requested expert consultations under Article V, the Soviet government repeated
    the natural-outbreak explanation and refused consultation; by mid-1980 the United States had made three formal
    overtures. The official explanation persisted until after the Soviet Union's dissolution. In May 1992 Russian
    President Boris Yeltsin said that the KGB had admitted Soviet military development caused the outbreak.
  consequences:
  - Official attribution of the human epidemic to contaminated meat and natural animal anthrax
  - Presentation of the foodborne explanation through Soviet public-health and epidemiological channels
  - Formal denial that the outbreak raised a Biological Weapons Convention compliance issue
  - Repeated refusal of requested expert consultations under Article V of the convention
  - Long-term obstruction of accurate public and international understanding of the outbreak's military airborne origin
  summary: >-
    Sverdlovsk turned a biological accident into a sustained institutional false explanation. Soviet officials described
    the human epidemic as intestinal anthrax from contaminated meat and carried that position into diplomatic exchanges
    over Biological Weapons Convention compliance. The government repeatedly rejected expert consultation while
    maintaining that the outbreak was natural. In 1992 Yeltsin publicly acknowledged a military cause, and subsequent
    pathology and epidemiology demonstrated that the human outbreak was inhalational and followed an aerosol plume
    extending downwind from Compound 19.
