term: Element
aliases:
- chemical element
- classical element
- elemental
shortDefinition: 'A word whose scientific meaning changed: classical ''elements'' were basic kinds or principles of matter,
  whereas a modern chemical element is defined by the number of protons in its atoms.'
longDefinition: 'In ancient and medieval natural philosophy, an element could mean one of a small set of fundamental
  material principles such as earth, water, air, and fire. Modern chemistry uses the same word much more narrowly: a
  chemical element is a substance whose atoms share the same atomic number, meaning the same number of protons in the
  nucleus. Air is therefore not a modern element but a mixture of several gases, including elemental nitrogen and oxygen.'
relatedTerms:
- aether
reviewedAt: '2026-08-21'
sources:
- title: Joseph Priestley, Discoverer of Oxygen
  url: https://www.acs.org/education/whatischemistry/landmarks/josephpriestleyoxygen.html
  publisher: American Chemical Society
  note: Describes the long-standing conception of air as an elementary substance and the experiments that established
    it as a mixture of gases.
