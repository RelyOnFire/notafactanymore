<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Von der Annahme zur Messung</title>
<desc id="desc">Zweiteilige Grafik: links ein früher vorgestelltes glattes Ozeanbecken auf Grundlage weniger Lotungen, rechts der durch systematische Lotungen und Sonar sichtbar gewordene strukturreiche Meeresboden.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}</style>
<rect width="1200" height="820" fill="#f5f0e6"/>
<text x="50" y="55" font-size="18" font-weight="700" fill="#4f776e" text-anchor="start" letter-spacing="2.1">VON DER ANNAHME ZUR MESSUNG</text><rect x="40" y="80" width="535" height="650" rx="20" fill="#fbf8f1" stroke="#d6cec0" stroke-width="2"/><rect x="625" y="80" width="535" height="650" rx="20" fill="#fbf8f1" stroke="#d6cec0" stroke-width="2"/><text x="70" y="125" font-size="16" font-weight="700" fill="#4f776e" text-anchor="start" letter-spacing="1.8">FRÜHERES BILD</text><text x="70" y="165" font-size="30" font-weight="700" fill="#2f302d" text-anchor="start">Ein weitgehend glattes Becken</text><text x="70" y="198" font-size="19" font-weight="400" fill="#6d6b64" text-anchor="start"><tspan x="70" dy="0">Wenige Tiefenlotungen ließen riesige</tspan><tspan x="70" dy="27">Lücken zwischen den Messpunkten.</tspan></text><rect x="70" y="280" width="475" height="275" rx="14" fill="#dbe8e8"/><path d="M70 335 C170 352 205 430 307 465 C405 430 450 355 545 337 L545 555 L70 555 Z" fill="#c5ad82"/><path d="M70 335 C170 352 205 430 307 465 C405 430 450 355 545 337" fill="none" stroke="#92775d" stroke-width="4"/><path d="M255 302 L350 302 L332 322 L273 322 Z" fill="#2f302d"/><line x1="303" y1="282" x2="303" y2="302" stroke="#2f302d" stroke-width="4"/><path d="M303 284 L329 296 L303 296 Z" fill="#c7a24d"/><line x1="180" y1="322" x2="180" y2="365" stroke="#4f776e" stroke-width="2" stroke-dasharray="5 6"/><circle cx="180" cy="365" r="5" fill="#4f776e"/><line x1="303" y1="322" x2="303" y2="458" stroke="#4f776e" stroke-width="2" stroke-dasharray="5 6"/><circle cx="303" cy="458" r="5" fill="#4f776e"/><line x1="437" y1="322" x2="437" y2="377" stroke="#4f776e" stroke-width="2" stroke-dasharray="5 6"/><circle cx="437" cy="377" r="5" fill="#4f776e"/><text x="307" y="595" font-size="18" font-weight="600" fill="#6d6b64" text-anchor="middle">einzelne Tiefenmessungen</text><text x="70" y="642" font-size="18" font-weight="500" fill="#2f302d" text-anchor="start"><tspan x="70" dy="0">Abyssale Ebenen sind tatsächlich weitläufig und relativ flach.</tspan><tspan x="70" dy="27">Die Korrektur: Sie sind nur ein Teil eines wesentlich vielfältigeren Meeresbodens.</tspan></text><text x="655" y="125" font-size="16" font-weight="700" fill="#4f776e" text-anchor="start" letter-spacing="1.6">WAS MESSUNGEN ZEIGTEN</text><text x="655" y="165" font-size="30" font-weight="700" fill="#2f302d" text-anchor="start">Relief im Maßstab von Kontinenten</text><text x="655" y="198" font-size="19" font-weight="400" fill="#6d6b64" text-anchor="start"><tspan x="655" dy="0">Systematische Lotungen und Sonar machten</tspan><tspan x="655" dy="27">verborgene Formen des Meeresbodens sichtbar.</tspan></text><rect x="655" y="280" width="475" height="275" rx="14" fill="#dbe8e8"/><path d="M655 340 L705 360 L745 415 L790 455 L845 447 L885 390 L918 430 L955 350 L987 405 L1018 448 L1045 515 L1070 455 L1105 370 L1130 345 L1130 555 L655 555 Z" fill="#c5ad82"/><path d="M655 340 L705 360 L745 415 L790 455 L845 447 L885 390 L918 430 L955 350 L987 405 L1018 448 L1045 515 L1070 455 L1105 370 L1130 345" fill="none" stroke="#92775d" stroke-width="4" stroke-linejoin="round"/><path d="M846 302 L938 302 L920 322 L864 322 Z" fill="#2f302d"/><line x1="892" y1="282" x2="892" y2="302" stroke="#2f302d" stroke-width="4"/><path d="M892 284 L918 296 L892 296 Z" fill="#c7a24d"/><path d="M875 326 L820 445 M892 326 L892 393 M909 326 L1040 505" stroke="#4f776e" stroke-width="2.5" stroke-dasharray="5 5" opacity="0.9"/><text x="894" y="345" font-size="16" font-weight="600" fill="#4f776e" text-anchor="middle">Sonar / Echolot</text><line x1="704" y1="390" x2="665" y2="448" stroke="#6d6b64" stroke-width="1.5"/><text x="665" y="466" font-size="16" font-weight="600" fill="#2f302d" text-anchor="start">Kontinentalhang</text><line x1="820" y1="447" x2="770" y2="512" stroke="#6d6b64" stroke-width="1.5"/><text x="770" y="530" font-size="16" font-weight="600" fill="#2f302d" text-anchor="middle">abyssale Ebene</text><line x1="918" y1="430" x2="900" y2="482" stroke="#6d6b64" stroke-width="1.5"/><text x="900" y="500" font-size="16" font-weight="600" fill="#2f302d" text-anchor="middle">Seeberg</text><line x1="955" y1="350" x2="1030" y2="312" stroke="#6d6b64" stroke-width="1.5"/><text x="1030" y="330" font-size="16" font-weight="600" fill="#2f302d" text-anchor="middle">mittelozeanischer Rücken</text><line x1="1045" y1="515" x2="1090" y2="522" stroke="#6d6b64" stroke-width="1.5"/><text x="1090" y="540" font-size="16" font-weight="600" fill="#2f302d" text-anchor="middle">Tiefseegraben</text><text x="1128" y="705" font-size="15" font-weight="400" fill="#6d6b64" text-anchor="end">schematisch — nicht maßstabsgetreu</text></svg>