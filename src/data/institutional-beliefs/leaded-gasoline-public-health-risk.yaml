  institutionalContext: After lethal occupational poisonings during early tetraethyl-lead production, the Surgeon General convened an expert investigation of the hazards of retail distribution and general use. Public Health Bulletin No. 163 concluded in 1926 that there were not then good grounds to prohibit ethyl gasoline if its distribution and use were controlled by proper regulations. The committee simultaneously stressed that its study was short, that widespread use might create different conditions, and that continued investigation was essential. Federal controls remained largely voluntary for decades. EPA's historical review records that in 1958 the Surgeon General raised the voluntary concentration standard and again concluded that the change posed no threat to the average American. In 1973, EPA adopted mandatory reductions in gasoline lead specifically to protect public health.
  consequences:
  - Continued nationwide use of tetraethyl lead in motor gasoline under a largely voluntary federal control regime
  - Decades of lead emissions into urban air, dust and soil before mandatory health-based reductions
  - Population lead exposure, with children particularly vulnerable to neurological harm
  - Delayed federal phase-down despite the 1926 committee's call for continued long-term investigation
  summary: The federal judgment in 1926 was narrower than a declaration that tetraethyl lead was harmless. The Surgeon General's committee found no adequate grounds, on the evidence then available, to prohibit leaded gasoline under controlled conditions, while explicitly warning that longer and more widespread exposure could reveal hazards the short investigation could not detect. That conditional acceptance nonetheless became the institutional basis for continued use under voluntary controls. By 1973, EPA concluded that gasoline lead was a significant and controllable source of excessive population exposure and issued mandatory reductions to protect public health.
