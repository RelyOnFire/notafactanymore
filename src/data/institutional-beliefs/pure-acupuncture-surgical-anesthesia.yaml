        publisher: People's Daily historical archive reproduction
        note: >-
          Contemporary state press states that urban, rural, and PLA medical units were using acupuncture anesthesia, reports more than 400,000 operated patients and an approximately 90 percent success rate, and promotes the method for major surgery and for rural, mountain, and wartime settings where conventional anesthesia equipment was limited.
      - title: 周恩来观看针灸麻醉 频频点头连声说“好”
        url: https://www.gdghospital.org.cn/ComprehensiveNews/info_itemid_1774.html
        publisher: Guangdong Provincial People's Hospital
        note: >-
          Hospital history records that the Ministry of Health Military Control Commission made acupuncture anesthesia an important national wartime-health task at a September 1969 national meeting. It also documents a 1971 operation that still required a small amount of lidocaine because analgesia from acupuncture was incomplete.
      - title: 曾轰动世界，为何走向沉默？
        url: https://wenhui.whb.cn/third/baidu/201903/27/252257.html
        publisher: Wenhui Daily
        note: >-
          Interviews modern acupuncture-anesthesia leader Zhou Jia and describes the earlier indiscriminate expansion to more than 90 types of disease or operation and roughly two million procedures, notes that pure acupuncture was ineffective or inadequate for some surgery, and explains the later shift toward acupuncture-drug combined anesthesia.
      - title: 我校系统5项成果荣获2022年度上海市科学技术奖
        url: https://wmzx.shutcm.edu.cn/2023/0527/c1262a153168/page.htm
        publisher: Shanghai University of Traditional Chinese Medicine
        note: >-
          Official university account says the modern team changed the old awake pure-acupuncture technique into shallow-sleep, spontaneous-breathing acupuncture-drug combined anesthesia, redefined advantageous indications, produced clinical guidelines, and thereby returned acupuncture anesthesia to a more appropriate developmental path.
