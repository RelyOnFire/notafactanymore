entryId: hominin
sourceReviewedAt: '2026-08-21'
term: Hominine
aliases:
- Homininen
shortDefinition: Ein Angehöriger der menschlichen Entwicklungslinie nach ihrer Abspaltung von der Linie, die zu Schimpansen
  und Bonobos führte.
longDefinition: Homininen sind Menschen und ausgestorbene Arten, die mit Menschen näher verwandt sind als mit Schimpansen
  und Bonobos. Dazu gehören die Gattung Homo sowie ältere Linien wie Australopithecus und weitere Formen nahe der Trennung
  der menschlichen und Schimpansen-Linie.
