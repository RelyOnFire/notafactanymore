evidence:
  - id: manacovid-minister-proposition
    sourceId: manacovid-acp-minister
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: 12 January 2021 report, paras. 1–6
    note: >-
      The state news agency quotes the health minister's letter describing the investigators' results as conclusive and
      significant, promising directorate support so patients could find an effective and safe remedy, and stating that
      the ministry had authorized market release on 24 November 2020.
  - id: manacovid-claim-proposition
    sourceId: manacovid-acp-100-percent
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: Headline and opening three paragraphs
    note: >-
      ACP called Manacovid the first 100%-effective curative COVID-19 medicine, said it had been launched on the market,
      and attributed a 100% recovery result in 300 patients to the principal investigator.
  - id: manacovid-homologation-impact
    sourceId: manacovid-acp-homologation
    relation: documents
    target: {scope: belief, aspect: impact}
    locator: 15 December 2020 report, paras. 1–6
    note: >-
      Relaying a CRPL communiqué, ACP reports approval on 24 November 2020, 300 symptomatic positive cases becoming
      negative with symptom disappearance within five days, protocol approval by the national ethics committee, and
      clinical work conducted from June through October. It is evidence of the public account, not an independent audit
      of the study or the underlying authorization certificate.
  - id: manacovid-mission-correction
    sourceId: manacovid-who-mission-2022
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: 31 March 2022 statement, paras. 2–13
    note: >-
      The mission explicitly includes Manacovid among several products reviewed and says the way the data were analyzed
      and presented did not generate evidence of efficacy. Because the finding covers the reviewed portfolio, it is not
      treated here as a product-specific negative trial.
  - id: manacovid-trial-standard-correction
    sourceId: manacovid-who-phase-three-protocol
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: 19 September 2020 release, paras. 1–8
    note: >-
      The contemporaneous regional expert committee describes Phase III trials and independent data-safety monitoring
      as pivotal to establishing the quality, safety, and efficacy of herbal medical products before recommendation.
  - id: manacovid-minister-impact
    sourceId: manacovid-acp-minister
    relation: documents
    target: {scope: belief, aspect: impact}
    locator: 12 January 2021 report, quoted ministerial letter and final three paragraphs
    note: >-
      Records both the ministry's supportive framing and the public account that all 300 symptomatic positive patients
      became test-negative after Manacovid, while mentioning antitussive or antipyretic treatment for residual symptoms.
  - id: manacovid-ministry-carrier
    sourceId: manacovid-acp-minister
    relation: documents
    target: {scope: episode, episodeId: drc-2020-2023, aspect: carrier}
    locator: Quoted letter from Health Minister Eteni Longondo
    note: >-
      Connects the efficacy framing to the health minister and Directorate of Pharmacy and Medicine rather than only to
      the private product developer.
  - id: manacovid-acp-carrier
    sourceId: manacovid-acp-100-percent
    relation: documents
    target: {scope: episode, episodeId: drc-2020-2023, aspect: carrier}
    locator: Headline and opening paragraphs
    note: >-
      Documents amplification by the national press agency through an unqualified 100%-effective cure headline and
      announcement that the product had entered the market.
  - id: manacovid-homologation-mechanism
    sourceId: manacovid-acp-homologation
    relation: documents
    target: {scope: episode, episodeId: drc-2020-2023, aspect: mechanism}
    locator: 15 December 2020 report, paras. 1–6
    note: >-
      Describes the reported authorization and the sequence from government selection for trials through ethics approval,
      clinical work, and entry into the pharmaceutical market.
  - id: manacovid-cabinet-mechanism
    sourceId: manacovid-cabinet-2021
    relation: documents
    target: {scope: episode, episodeId: drc-2020-2023, aspect: mechanism}
    locator: Section II.3, p. 6
    note: >-
      Official cabinet minutes place Manacovid on the national research agenda by calling for continued randomization
      toward international recognition as a COVID-19 treatment.
  - id: manacovid-public-consequences
    sourceId: manacovid-acp-100-percent
    relation: documents
    target: {scope: episode, episodeId: drc-2020-2023, aspect: consequences}
    locator: Headline and opening three paragraphs
  - id: manacovid-cabinet-partial-correction
    sourceId: manacovid-cabinet-2021-current
    relation: documents
    target: {scope: episode, episodeId: drc-2020-2023, aspect: institutional-correction}
    locator: Section II.3, p. 6
    note: >-
      The current official archive page supplies an accessible copy of the minutes. Their call for randomization shows
      that confirmatory evidence was still being pursued after domestic authorization; the minutes frame that work as a
      route to international recognition rather than retracting the domestic claims.
  - id: manacovid-mission-partial-correction
    sourceId: manacovid-who-mission-2022
    relation: documents
    target: {scope: episode, episodeId: drc-2020-2023, aspect: institutional-correction}
    locator: 31 March 2022 statement, paras. 2–13
    note: >-
      Records restitution of the mission's findings to the health minister and other stakeholders, continued technical
      assistance, and recommendations for stronger observational and randomized protocols and regulatory oversight.
  - id: manacovid-research-ministry-correction
    sourceId: manacovid-csn-bulletin-2023
    relation: documents
    target: {scope: episode, episodeId: drc-2020-2023, aspect: institutional-correction}
    locator: Bulletin p. 3, report of the research minister's June 2023 press conference
    note: >-
      The ministry and National Scientific Council bulletin reports Research Minister Gilbert Kabanda saying Manacovid
      was awaiting scientific proof at the University of Kinshasa Faculty of Medicine, an official acknowledgment that
      the efficacy question remained unresolved.
  - id: manacovid-register-context
    sourceId: manacovid-acorep-register-2026
    relation: contextualizes
    target: {scope: episode, episodeId: drc-2020-2023, aspect: context}
    locator: Entire register; CRPL entries 5358–5361 and 5469
    note: >-
      The register released on 4 February 2026 contains no Manacovid or COVID treatment entry under CRPL, while listing
      five CRPL registrations issued in 2025 for Manalaria, Manadiar, and EVA. A missing entry cannot establish the legal
      route or date by which the reported 2020 authorization ended, so it is not treated as proof of formal withdrawal.
