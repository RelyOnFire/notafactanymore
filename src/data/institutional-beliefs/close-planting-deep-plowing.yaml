    consequences:
      - Mandatory or heavily pressured cultivation campaigns
      - Reduced yields in some regions
      - Misallocation of agricultural labor
    summary: During the Great Leap Forward, deep plowing and close planting were elevated into nationally promoted agricultural methods and incorporated into Mao's agricultural “eight-point charter.” Authorities pushed them far beyond locally appropriate conditions. Historical economic research identifies these centrally promoted techniques as among the policies that reduced agricultural output, alongside several other major causes of the crisis.
