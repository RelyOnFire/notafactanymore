entryId: quintessence
sourceReviewedAt: '2026-08-21'
term: Quintessenz
aliases:
- quinta essentia
- fünfte Essenz
shortDefinition: Wörtlich die „fünfte Essenz“; eine spätere Bezeichnung für ein fünftes himmlisches Element neben Erde,
  Wasser, Luft und Feuer.
longDefinition: Quintessenz geht auf das lateinische quinta essentia, „fünfte Essenz“, zurück. In mittelalterlicher und
  frühneuzeitlicher Naturphilosophie bezeichnete der Ausdruck eine fünfte Substanz jenseits der vier irdischen Elemente
  und wurde häufig mit dem unvergänglichen himmlischen Äther verbunden. In Alchemie und Medizin entwickelte der Begriff
  weitere Bedeutungen und ist daher verwandt mit, aber nicht immer völlig gleichbedeutend mit Aristoteles' ursprünglichem
  Äther.
