schemaVersion: 2
locale: de
entryId: marrist-linguistics
sourceReviewedAt: '2026-08-23'
title: Marristische Linguistik
proposition:
  summary: >-
    Sprachen wurden als Produkte universeller, klassenbedingter Entwicklungsstufen behandelt und nicht in erster Linie als
    historisch entstandene Sprachfamilien; die traditionelle vergleichende Sprachwissenschaft galt damit als „bürgerlich“
    oder wissenschaftlich überholt.
correction:
  summary: >-
    Marrs universale Theorie klassenbestimmter Sprachstufen wurde 1950 aufgegeben; die historisch-vergleichende
    Sprachwissenschaft wurde wiederhergestellt, statt sich als wissenschaftlich überholt zu erweisen. Die historische
    Evidenz stützt keine universale Abfolge klassenbestimmter Sprachentwicklungsstufen.
episodes:
  - id: soviet-union-1930-1950
    polity: Sowjetunion
    institutions:
      - Institut für Sprache und Denken der Akademie der Wissenschaften der UdSSR
      - Akademie der Wissenschaften der UdSSR
    institutionalContext: >-
      Das Institut für Sprache und Denken war das wichtigste institutionelle Zentrum des Marrismus. Seine Autorität reichte
      jedoch über Akademiestrukturen, Universitäten, Fachzeitschriften, Verlage und das Bildungswesen weit über dieses
      Institut hinaus und bildete ein verteiltes institutionelles Netz. Die derzeitige Beleglage weist die Sektion für
      materialistische Linguistik der Kommunistischen Akademie nicht eigenständig als Träger dieser konkreten Behauptung
      aus; sie wird deshalb hier nicht als solcher geführt.
    summary: >-
      Ab etwa 1930 wurde Nikolai Marrs „Neue Lehre von der Sprache“ zum offiziell anerkannten Rahmen, der die sowjetische
      Linguistik dominierte. Traditionelle vergleichende und indogermanische Sprachwissenschaft wurde als „bürgerlich“
      angegriffen; erhebliche Abweichungen von den marristischen Grundlagen wurden stark unterdrückt. 1950 verwarf Stalin
      den Marrismus abrupt; anschließend wurde das Institut für Sprache und Denken aufgelöst und die Doktrin ebenso
      administrativ abgebaut, wie sie zuvor erhoben worden war.
    consequences:
      - Konkurrierende historisch-vergleichende Schulen wurden unterdrückt oder marginalisiert
      - Forschung und Lehre wurden nach marristischen Kategorien umorganisiert
      - Forschende, die erheblich von marristischen Grundlagen abwichen, konnten institutionell marginalisiert oder unterdrückt werden
    mechanism:
      summary: >-
        Akademiestrukturen erhoben den Marrismus zum offiziell anerkannten Rahmen und marginalisierten konkurrierende
        historisch-vergleichende Linguistik über Forschung, Lehre und Publikationskontrolle.
    institutionalCorrection:
      periodLabel: '1950'
      action: Stalin verwarf den Marrismus öffentlich; anschließend baute die Akademiestruktur die Doktrin ab und löste das Institut für Sprache und Denken in einer neu organisierten Linguistikinstitution auf.
      summary: >-
        Dasselbe sowjetische Institutionensystem, das den Marrismus erhoben hatte, kehrte 1950 den Kurs um: Die Doktrin
        verlor ihre offizielle Autorität und ihr wichtigstes institutionelles Zentrum wurde in der anschließenden
        Reorganisation aufgelöst.
evidence:
  - id: marr-school-proposition
    note: >-
      Zeitgenössische fachwissenschaftliche Darstellung, wonach die sowjetische Linguistik von etwa 1930 bis 1950 von der
      offiziell anerkannten marristischen Theorie beherrscht wurde und erhebliche Abweichungen stark unterdrückt wurden.
  - id: marr-school-correction
    note: >-
      Dokumentiert die Aufgabe des offiziell anerkannten marristischen Rahmens im Jahr 1950 und die Rückkehr nichtmarristischer
      historisch-vergleichender Sprachwissenschaft.
  - id: marr-institute-carrier
  - id: marr-politics-mechanism
    note: >-
      Historische Untersuchung des politischen und institutionellen Aufstiegs von Marrs vermeintlich marxistischer
      Linguistik gegenüber der traditionellen vergleichenden Sprachwissenschaft.
  - id: marr-school-consequences
  - id: marr-institute-context
  - id: marr-institute-correction
    note: >-
      Institutionengeschichte des von Marr gegründeten, 1931 in Institut für Sprache und Denken umbenannten Instituts, das
      von Marr und anschließend Iwan Meschtschaninow geleitet und nach der Zurückweisung des Marrismus 1950 in das neue
      Institut für Linguistik eingegliedert wurde.
