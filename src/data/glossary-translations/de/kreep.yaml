entryId: kreep
sourceReviewedAt: '2026-08-21'
term: KREEP
aliases:
- KREEP-reich
shortDefinition: Eine geochemische Komponente von Mondmaterial, die an Kalium (K), Seltenerdelementen (REE), Phosphor
  (P) und mehreren wärmeerzeugenden radioaktiven Elementen angereichert ist.
longDefinition: KREEP ist die gebräuchliche Bezeichnung für Mondmaterial, das an Kalium, Seltenerdelementen und Phosphor
  angereichert ist. Es ist außerdem mit inkompatiblen Elementen wie Uran und Thorium verbunden, deren radioaktiver Zerfall
  Wärme erzeugt. KREEP spielt daher eine wichtige Rolle in Modellen zur chemischen Differentiation und thermischen Geschichte
  des Mondes, auch wenn Chang'e-5 zeigte, dass die jüngsten untersuchten Mare-Basalte keine KREEP-reiche Mantelquelle
  benötigten.
