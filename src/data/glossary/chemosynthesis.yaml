term: Chemosynthesis
aliases:
- chemosynthetic
shortDefinition: The production of organic matter using energy from chemical reactions rather than energy from sunlight.
longDefinition: Chemosynthesis allows some microorganisms to build organic molecules using energy released by chemical
  reactions, for example by oxidizing hydrogen sulfide, methane, or other reduced compounds. These organisms can
  form the base of food webs in environments where sunlight is absent, including some deep-sea ecosystems.
relatedTerms:
- hydrothermal-vent
reviewedAt: '2026-08-21'
sources:
- title: What is the deep ocean?
  url: https://oceanexplorer.noaa.gov/ocean-fact/deep-ocean/
  publisher: NOAA Ocean Exploration
  note: Describes deep-ocean ecosystems and energy sources that support life far below the sunlit surface.
