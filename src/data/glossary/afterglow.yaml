term: Afterglow
aliases:
- afterglows
- gamma-ray burst afterglow
- GRB afterglow
shortDefinition: Fading radiation observed after the initial flash of a transient event such as a gamma-ray burst.
longDefinition: A gamma-ray burst afterglow is longer-lived emission that follows the prompt gamma-ray flash and can
  be observed at X-ray, optical, radio, and other wavelengths. Because it persists much longer than the burst itself,
  astronomers can localize the event, identify its host galaxy, and obtain spectra for distance measurements.
relatedTerms:
- redshift
reviewedAt: '2026-08-21'
sources:
