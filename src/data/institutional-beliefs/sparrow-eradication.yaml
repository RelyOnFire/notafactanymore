schemaVersion: 2
title: Sparrow eradication
proposition:
  summary: Sparrows were treated as net agricultural enemies whose mass eradication would increase grain production.
correction:
  summary: >-
    Sparrows can consume grain, but they also eat insects and participate in food webs. Large-scale predator removal can
    trigger ecological effects that make simple “pest equals net harm” assumptions fail.
category: Ecology and agriculture
reviewedAt: '2026-08-23'
episodes:
  - id: china-1958-1959
    polity: People's Republic of China
    region: East Asia
    startYear: 1958
    endYear: 1959
    periodLabel: 1958–1959
    strength: policy-basis
    institutionTypes:
      - government
      - education
    institutions:
      - Central Committee of the Communist Party of China
      - State Council of the People's Republic of China
    institutionalContext: >-
      The national institutional proposition is unusually explicit. On 12 February 1958, the CCP Central Committee and
      State Council jointly issued the directive 关于除四害讲卫生的指示, describing rats and sparrows as major enemies that
      damaged grain and obstructed production. Mass implementation then ran through the wider Four Pests and
      patriotic-health mobilization apparatus; those provincial and local implementation networks are described as
      machinery rather than listed as if they were single institutions.
    consequences:
      - Wildlife eradication
      - Agricultural policy
      - Ecological disruption
    summary: >-
      During the Four Pests campaign, a February 1958 directive from the CCP Central Committee and State Council explicitly
      classified sparrows as major enemies that damaged grain and obstructed production. Mass killing sharply reduced
      sparrow populations. Historical and ecological reviews describe subsequent insect outbreaks, ecological disruption,
      and poor harvest effects; by June 1959 sparrows had been removed from the official Four Pests list. This card does
      not attribute the Great Famine to the sparrow campaign alone.
    mechanism:
      kind: administrative-adoption
      summary: >-
        The CCP Central Committee and State Council turned the pest proposition into a national eradication directive and
        implemented it through the Four Pests and patriotic-health mobilization apparatus.
    institutionalCorrection:
      status: corrected
      periodLabel: June 1959
      action: The official Four Pests list was revised to remove sparrows.
      summary: >-
        The same central policy system that had designated sparrows as a major agricultural enemy abandoned that
        classification within the campaign by removing sparrows from the official list.
