schemaVersion: 2
title: Oophorectomy as a cure for insanity
proposition:
  summary: >-
    Removal of the ovaries and fallopian tubes was treated as a potential cure for insanity when women's psychiatric
    illness was attributed to disease or dysfunction of the reproductive organs. At Norristown, Alice Bennett described
    insanity as a symptom of bodily disease and claimed mental recoveries after surgery, while insisting that each
    operation also had an independent physical indication.
correction:
  summary: >-
    Bennett's uncontrolled case reports do not establish that reproductive disease caused the patients' psychiatric
    conditions or that removing their ovaries cured them. Oophorectomy and salpingo-oophorectomy have legitimate gynecologic
    and cancer-related indications. Current guidance also allows hysterectomy with removal of both ovaries for selected
    severe premenstrual syndrome after other treatments have failed and a trial of hormonal suppression has assessed
    likely benefit; this specific indication does not validate a general cure for insanity. Bilateral ovarian removal
    is irreversible, eliminates natural fertility and, before natural menopause, induces surgical menopause. ACOG
    identifies possible increased risks including cardiovascular disease, osteoporosis and cognitive impairment. These
    general consequences do not establish every historical patient's prior fertility, menopausal status or later health
    outcomes.
category: Psychiatry and reproductive medicine
reviewedAt: '2026-09-19'
impact:
  summary: >-
    Bennett's February 1893 report described six women at Norristown's state hospital whose ovaries and fallopian
    tubes had been removed in July and October 1892. She reported three physical and mental recoveries, differing
    degrees of improvement in two other survivors, and one death from peritonitis on the sixth postoperative day.
    The hospital's trustees defended the operations as treatment of bodily disease. Pennsylvania's Board of Public
    Charities intervened in December 1892, but in March 1893 withdrew its report after declaring its allegation of
    experimental surgery erroneous.
  highlights:
    - value: '6'
      label: women operated on in July and October 1892, according to Bennett's detailed report
      note: The report describes removal of both ovaries and both fallopian tubes in each case.
    - value: '1'
      label: reported death from peritonitis on the sixth postoperative day
      note: >-
        This was case six in Bennett's report; her recovery claims for the survivors were uncontrolled observations.
    - value: '1893'
      label: Board of Public Charities withdrew its report alleging experimental operations
      note: >-
        A letter dated 2 March reports resolutions adopted the previous day; it does not establish a hospital repudiation
        of the psychiatric theory.
  context:
    - >-
      Contemporary accounts conflict. An American Journal of Insanity editorial repeated a newspaper report of four
      operations and fifty women selected; Morton's report referred to forty or fifty proposed cases. Bennett's February
      report and letter instead described six operations, all in July and October 1892, and denied that any other
      patients had been selected. Her letter acknowledged that some cases were under consideration. The reported fifty
      cannot be treated as a verified additional surgical cohort.
    - >-
      The controversy concerned whether the operations were experiments to cure insanity or treatment of independently
      serious bodily disease. Bennett and the trustees defended the latter indication while treating mental illness
      as a symptom of physical disease and claiming psychiatric benefits. Neither that defence nor the Board's withdrawal
      proves psychiatric efficacy; the sources also do not establish that every removed organ was healthy or every
      operation lacked a physical indication.
    - >-
      Gynecologic disease, cancer risk and selected severe premenstrual syndrome can provide modern indications for
      ovarian surgery. These require their own clinical assessment; they do not retrospectively diagnose or validate
      the Norristown cases. General infertility and surgical-menopause risks must be distinguished from the outcomes
      actually reported for those patients.
episodes:
  - id: united-states-pennsylvania-1892-1893
    polity: United States — Pennsylvania
    region: North America
    startYear: 1892
    endYear: 1893
    periodLabel: 1892–1893 (operations and institutional dispute)
    strength: institutionally-influential
    institutionTypes:
      - government
      - medical
    institutions:
      - State Hospital for the Insane at Norristown
    institutionalContext: >-
      Alice Bennett directed the women's department of the State Hospital for the Insane at Norristown. Her February
      1893 report described two operations by Marie B. Werner, assisted by Joseph Price, in July 1892 and four by
      Price in October. It attributed psychiatric symptoms to bodily disease while claiming that physical indications
      independently justified surgery. In their response dated 3 February 1893, the trustees defended the medical
      staff's judgment and asked the Board of Public Charities to reconsider its December intervention. They rejected
      the description of the operations as experiments to cure insanity, while also calling insanity a symptom of
      bodily disease. This is evidence of clinical practice and institutional protection of its rationale, with a
      disputed indication. The Board and its Committee on Lunacy acted as oversight bodies; the episode does not establish
      a statewide psychiatric-surgery policy. Its dates bound the operations and documented dispute, without dating
      the end of this surgical practice.
    consequences:
      - >-
        Bennett reported removal of both ovaries and both fallopian tubes in six hospitalized women, claiming physical
        indications and consent from their nearest relatives or guardians
      - >-
        Bilateral removal irreversibly eliminates natural fertility and induces surgical menopause before natural
        menopause; these general effects do not establish each patient's previous fertility, menopausal status or
        later symptoms
      - >-
        Bennett reported one death from peritonitis on the sixth postoperative day and a separate patient's slow surgical
        recovery with suppuration around the stitches
      - >-
        The operations provoked medical, legal and ethical objections, a reported temporary suspension and a dispute
        between hospital trustees and state oversight; the Board subsequently withdrew its experimental-surgery allegation
    summary: >-
      At Norristown in 1892, six women underwent bilateral ovarian and tubal removal according to Bennett's own case
      report. She claimed three mental and physical recoveries and improvement in two other survivors; one patient
      died. Her explanation connected mental symptoms to diseased reproductive organs, but she and the trustees insisted
      that the operations were independently justified by bodily disease. The Board of Public Charities intervened
      in December 1892, and a contemporary press account reported a temporary halt. The trustees defended their physicians
      in a response dated February 1893. In March the Board withdrew its report, declaring its experimental-surgery
      allegation erroneous. The records establish a contested institutional practice and reported outcomes, without
      demonstrating either a psychiatric cure or the hospital's later abandonment of the causal theory.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Bennett's department used ovarian surgery and reported psychiatric recoveries through its clinical case histories.
        The trustees formally defended their staff's discretion and transmitted her six-case report to state oversight.
        Their response described insanity as a symptom of bodily disease while disputing that the operations were
        psychiatric experiments. Hospital practice, case reporting and administrative protection gave the rationale institutional
        influence; a blanket policy to remove healthy ovaries to cure insanity is not established.
    institutionalCorrection:
      status: undocumented
      summary: >-
        The Board's December 1892 intervention and the reported temporary halt were followed by the trustees' defence
        of the operations. A letter of 2 March 1893 communicates resolutions adopted the previous day withdrawing
        the Board's report because its experimental-surgery allegation was erroneous. This documents the oversight
        body's reversal. The reviewed sources do not establish a subsequent Norristown renunciation of Bennett's psychiatric
        causal theory or a permanent cessation of surgery under that rationale. The 1893 endpoint is the documented
        dispute, not a verified institutional correction.
