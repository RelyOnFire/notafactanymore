title: Eugenic sterilization
claim: Disability, mental illness, and social “unfitness” were often treated as sufficiently hereditary that preventing selected people from reproducing would improve the population.
currentUnderstanding: Human traits arise from complex interactions among many genes, development, environment, culture, and social conditions. Many categories targeted by eugenic programs were not simple hereditary traits at all, and coercive sterilization violated bodily autonomy and human rights.
category: Genetics and medicine
reviewedAt: 2026-08-22
episodes:
  - id: united-states-1907-1974
    polity: United States
    region: North America
    startYear: 1907
    endYear: 1974
    periodLabel: 1907–mid-1970s
    strength: policy-basis
    institutionTypes: [government, court, medical]
    institutions:
      - State legislatures and state institutions
      - U.S. Supreme Court
      - State medical and mental-health systems
    consequences:
      - Compulsory sterilization
      - Disability policy
      - Reproductive rights
    summary: Thirty-two states enacted eugenic sterilization laws, beginning with Indiana in 1907. State institutions sterilized tens of thousands of people deemed “unfit,” and the U.S. Supreme Court upheld Virginia's law in Buck v. Bell in 1927.
    sources:
      - title: Eugenics and Involuntary Sterilization, 1907–2015
        url: https://pubmed.ncbi.nlm.nih.gov/26322647/
        publisher: Annual Review of Genomics and Human Genetics
        note: Reviews U.S. sterilization laws, Buck v. Bell, and the roughly 60,000 people sterilized under eugenic programs.
      - title: Demographic Patterns of Eugenic Sterilization in Five U.S. States
        url: https://reporter.nih.gov/project-details/10463757
        publisher: National Institutes of Health
        note: NIH project summary describing state eugenic laws from 1907 into the 1970s and their discriminatory implementation.
