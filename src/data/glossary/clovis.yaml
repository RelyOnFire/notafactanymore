term: Clovis
aliases:
- Clovis culture
- Clovis people
- Clovis-first
shortDefinition: An early archaeological culture of North America known especially for distinctive fluted stone projectile
  points dating to roughly 13,000 years ago.
longDefinition: Clovis refers to an archaeological complex found across much of North America and characterized especially
  by fluted stone points. During much of the twentieth century, Clovis sites were widely treated as evidence for the
  continent's first human population. Securely dated older sites later showed that people were present in the Americas
  before Clovis.
relatedTerms:
- pre-clovis
reviewedAt: '2026-08-21'
