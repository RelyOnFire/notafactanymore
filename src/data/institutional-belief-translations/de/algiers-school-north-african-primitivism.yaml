schemaVersion: 2
locale: de
entryId: algiers-school-north-african-primitivism
sourceReviewedAt: '2026-08-25'
title: Nordafrikaner als biologisch „primitiv“ in der kolonialen Psychiatrie
proposition:
  summary: >-
    Die französische koloniale psychiatrische Schule von Algier lehrte, nordafrikanische Muslime besäßen einen biologisch
    begründeten „Primitivismus“ mit schwach entwickelten höheren geistigen Funktionen, geringer abstrakter oder moralischer
    Fähigkeit und angeborener Impulsivität, und verwendete dieses rassifizierte Modell in Lehre und Klinik.
correction:
  summary: >-
    Es gibt keinen biologischen nordafrikanischen Psychiatrietyp mit „primitiver“ Gehirnorganisation, mangelnden höheren
    Geistesfunktionen oder angeborener rassischer Impulsivität. Die Psychiatriegeschichte beschreibt die evolutionistische
    Theorie der Schule von Algier als pseudowissenschaftliche Rassenideologie, die koloniale Stereotype in vermeintliche
    neuropsychiatrische Tatsachen verwandelte. Frantz Fanon und spätere Ansätze rückten stattdessen soziale Bedingungen,
    Kultur, koloniale Gewalt und individuelle klinische Umstände in den Mittelpunkt.
impact:
  summary: >-
    Die Theorie hatte institutionelle Reichweite, weil Antoine Porot nicht nur publizierte: Er lehrte Neuropsychiatrie
    an der medizinischen Fakultät von Algier, prägte die Schule von Algier und wirkte am Aufbau des kolonialen psychiatrischen
    Systems einschließlich Blida-Joinville mit. Sein Artikel von 1918 wurde zum Gründungstext; 1939 machten Porot und
    Sutter „Primitivismus“ ausdrücklich zum Erklärungsmodell nordafrikanischer Psychopathologie. Fanons Arbeit in Blida
    in den 1950er-Jahren wurde zu einem wichtigen Gegenmodell.
  highlights:
    - value: '1918'
      label: Jahr von Porots grundlegendem Artikel „Notes de psychiatrie musulmane“
    - value: '1939'
      label: Jahr der ausdrücklichen Porot-Sutter-Theorie des nordafrikanischen „Primitivismus“
    - value: 44 Jahre
      label: vom Gründungstext 1918 bis zum Ende der französischen Kolonialherrschaft 1962
  context:
    - >-
      Nicht jede klinische Arbeit Porots war wissenschaftlich wertlos. Die spätere Forschung erkennt echte Innovationen
      bei Organisation und Behandlung an. Korrigiert wird gezielt die rassisch-evolutionistische Lehre von der angeborenen
      Primitivität einer kolonisierten Bevölkerung.
    - >-
      Die historischen Begriffe „Muslim“ und „nordafrikanischer Eingeborener“ geben die damaligen Kategorien wieder und
      werden nicht als gültige biologische Klassifikationen übernommen.
    - >-
      1962 markiert das Ende der französisch-kolonialen institutionellen Episode in Algerien, nicht das augenblickliche
      Verschwinden der Theorie. Elemente ihres Vokabulars blieben auch nach der Unabhängigkeit in französischer psychiatrischer Literatur erhalten.
episodes:
  - id: french-algeria-1918-1962
    polity: Französisch-Algerien
    institutions:
      - Medizinische Fakultät von Algier
      - Psychiatrische Schule von Algier
      - Psychiatrisches Krankenhaus Blida-Joinville
    institutionalContext: >-
      Porots „Notes de psychiatrie musulmane“ von 1918 stellte die kolonisierte muslimische Bevölkerung in eine Hierarchie
      angeblich primitiver geistiger Entwicklung. Mit dem Aufbau psychiatrischer Einrichtungen in Algerien in den
      1930er-Jahren wurde die Schule von Algier zu einem dauerhaften Lehr- und Kliniknetz. Der Artikel von Porot und Jean
      Sutter von 1939 erklärte den „Primitivismus“ Nordafrikas ausdrücklich für psychiatrisch relevant. Das Modell
      zirkulierte in Lehre, Fachliteratur, Klinik und forensischer Interpretation.
    consequences:
      - Medizinische Lehre, die rassische und koloniale Stereotype als Eigenschaften nordafrikanischer Psychologie präsentierte
      - Interpretation psychiatrischer Patienten unter Annahmen primitiver Mentalität und angeborener Impulsivität
      - Forensisch-psychiatrische Deutungen, die Gewalt und Kriminalität rassifizierten
      - Wissenschaftliche Legitimation einer kolonialen Hierarchie vermeintlicher geistiger Entwicklungsstufen
      - Institutioneller und intellektueller Widerspruch durch Frantz Fanon und spätere sozial und kulturell orientierte Psychiatrie
    summary: >-
      Die Schule von Algier machte koloniale Hierarchie zu psychiatrischer Erklärung. Ein bevölkerungsweites Stereotyp
      biologischer und psychischer „Primitivität“ wurde über Fakultät und Kliniken gelehrt und angewandt. Fanon und die
      spätere Psychiatriegeschichte verwarfen diese vermeintliche Rassenneuropsychologie als pseudowissenschaftlich und
      richteten den Blick stärker auf soziale, kulturelle und individuelle Faktoren.
    mechanism:
      summary: >-
        Eine medizinische Fakultät und das verbundene koloniale Psychiatrienetz lehrten und verwendeten ein rassisch-
        evolutionistisches Modell nordafrikanischer Mentalität in Ausbildung, klinischer Deutung und forensischer Praxis.
    institutionalCorrection:
      summary: >-
        Fanon und die spätere Psychiatrie stellten die Lehre infrage, und mit der algerischen Unabhängigkeit endete das
        französisch-koloniale Institutionennetz. Ein datierter formeller Widerruf der Rassentheorie durch die Schule von
        Algier oder eine französische Trägerinstitution ist im vorhandenen Nachweis jedoch nicht belegt.
evidence:
  - id: algiers-porot-proposition
    note: >-
      Primärveröffentlichung von 1918, die gemeinhin als Gründungstext der Schule von Algier gilt und nordafrikanische
      muslimische Patienten in einer Hierarchie vermeintlich primitiver psychologischer Merkmale darstellt.
  - id: algiers-evolutionism-correction
    note: >-
      Fachhistorische Analyse, die den Evolutionismus der Schule als pseudowissenschaftliche Rassenideologie einordnet,
      welche kolonialer Hierarchie wissenschaftlichen Anschein verlieh, und Fanons Kritik behandelt.
  - id: algiers-mup-impact
    note: >-
      Moderne historische Studie, die den Text von 1918 in die spätere institutionelle Ausbildung der Schule von Algier
      und den Aufbau psychiatrischer Einrichtungen in Nordafrika in den 1930er-Jahren einordnet.
  - id: algiers-mup-carrier
  - id: algiers-porot-sutter-mechanism
    note: >-
      Katalogeintrag der französischen Nationalbibliothek zu Porot und Sutters Veröffentlichung von 1939, die ausdrücklich
      dem angeblichen „Primitivismus“ nordafrikanischer Menschen und seinen behaupteten psychiatrischen Folgen gewidmet war.
  - id: algiers-evolutionism-consequences
  - id: algiers-history-context
    note: >-
      Fachhistorische Darstellung der französischen Psychiatrieinstitutionen und -lehren in Algerien, einschließlich Porot,
      der Schule von Algier und des Übergangs weg von kolonialer Psychiatrie.
