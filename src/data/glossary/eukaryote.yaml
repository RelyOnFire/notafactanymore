term: Eukaryote
aliases:
- eukaryotic
- eukaryotes
shortDefinition: An organism whose cells keep their DNA inside a nucleus; animals, plants, fungi, and many single-celled organisms
  are eukaryotes.
longDefinition: Eukaryotes are organisms made of cells that contain a nucleus and other internal membrane-bound compartments.
  Animals, plants, fungi, and many single-celled lineages are eukaryotes. Bacteria and archaea belong to different cellular
  lineages and do not have a nucleus.
relatedTerms:
- molecular-phylogeny
reviewedAt: '2026-08-21'
sources:
- title: The Origin and Evolution of Cells
  url: https://www.ncbi.nlm.nih.gov/books/NBK9841/
  publisher: NCBI Bookshelf
  note: Explains the nucleus and membrane-enclosed organelles that distinguish eukaryotic cells.
