evidence:
  - id: polygraph-doe-proposition
    sourceId: polygraph-doe-1999
    relation: documents
    target: {scope: belief, aspect: proposition}
    note: >-
      Primary federal rule establishing DOE counterintelligence polygraph screening for specified employees,
      contractors, applicants and other personnel with access to sensitive information and programs.
    locator: '64 FR 70962–70964, summary and background; 70976–70978, §§ 709.4, 709.14–709.15'
  - id: polygraph-nas-correction
    sourceId: polygraph-nas
    relation: supports
    target: {scope: belief, aspect: correction}
    note: >-
      Scientific review finding that physiological responses measured by polygraphs are not unique to deception,
      that evidence for screening accuracy is extremely limited, and that employee screening creates serious
      false-positive and false-negative problems; it distinguishes these limitations from the above-chance
      performance sometimes seen in specific-incident testing.
    locator: 'Executive Summary, pp. 1–7: basic science, accuracy, security screening and investigative utility'
  - id: polygraph-nas-impact
    sourceId: polygraph-nas
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: Executive Summary, pp. 5–7, especially Table S-1 and the screening conclusion
    note: >-
      Supports the scientific interpretation of screening risks and the distinction between diagnostic accuracy
      and deterrent or admission-eliciting utility. It does not document the later country-specific policies.
