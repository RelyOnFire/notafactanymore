schemaVersion: 2
title: Predator eradication in Yellowstone
proposition:
  summary: >-
    Wolves and other large predators in Yellowstone were treated as destructive competitors whose removal would protect
    desirable game animals such as deer and elk and improve wildlife management.
correction:
  summary: >-
    Predators can reduce prey populations and create conflicts with livestock or human objectives, but native apex
    predators are also components of functioning ecosystems. Their removal can reorganize predator-prey relationships,
    scavenger food supplies, herbivore abundance and behavior, and vegetation. Yellowstone now manages wolves as a
    restored native species and an important part of the park's food web.
category: Wildlife management and ecology
entryId: predators-only-harm-prey-populations
reviewedAt: '2026-08-27'
impact:
  summary: >-
    Predator control in Yellowstone converted a simple management proposition into direct eradication. Park authorities
    killed wolves and other carnivores to protect animals regarded as more desirable. Wolves disappeared as a breeding
    population, and restoring the missing predator later required federal protection, decades of planning and active
    reintroduction.
  highlights:
    - value: '136+'
      label: Wolves killed inside Yellowstone from 1914 through 1926 according to National Park Service records
    - value: '1926'
      label: The last known Yellowstone wolf pack was killed
    - value: '1995'
      label: Federal wolf reintroduction began after nearly seven decades without a resident pack
  context:
    - >-
      The famous claim that wolves alone transformed Yellowstone's rivers and vegetation is too simple. Researchers
      continue to debate the magnitude of wolf-driven trophic cascades because climate, hunting, bears, cougars,
      groundwater and other factors also changed.
    - >-
      The corrected proposition is narrower and better supported: treating predators only as destructive competitors
      missed important ecological functions and made their deliberate elimination itself a major ecosystem intervention.
episodes:
  - id: united-states-yellowstone-1886-1926
    polity: United States
    region: North America
    startYear: 1886
    endYear: 1926
    strength: policy-basis
    institutionTypes:
      - government
    institutions:
      - U.S. Army administration of Yellowstone National Park
      - U.S. National Park Service
    institutionalContext: >-
      In the late nineteenth and early twentieth centuries, Yellowstone managers participated in the wider North American
      campaign against large predators. The National Park Service's own history says early managers, lacking a modern
      understanding of ecosystems, viewed wolves as destructive and targeted wolves, bears, cougars and coyotes to protect
      livestock and 'desirable' wildlife such as deer and elk. Federal park management continued this logic after the
      National Park Service was established in 1916.
    consequences:
      - At least 136 wolves were killed inside Yellowstone between 1914 and 1926
      - The last known wolf pack in the park was killed in 1926, and later surveys found no resident breeding population
      - Removing wolves changed the park's predator-prey system and eliminated ecological interactions associated with a native apex predator
      - Restoring wolves ultimately required Endangered Species Act protection, an environmental impact process and active translocation beginning in 1995
    summary: >-
      Yellowstone's early predator policy divided wildlife into animals worth protecting and predators that competed with
      those preferred species. Wolves were therefore not merely tolerated at low numbers; they were deliberately removed.
      At least 136 were killed in the park from 1914 through 1926, when the last known pack was eliminated. By the 1960s
      National Park Service thinking had shifted toward maintaining natural ecological processes, and later federal
      conservation law supported recovery. Wolves were reintroduced in 1995–1997. Their exact contribution to every
      subsequent vegetation change remains scientifically debated, but the old premise that their ecological role amounted
      only to killing desirable prey did not survive.
    mechanism:
      kind: enforcement
      summary: >-
        Federal park managers operationalized the predator-as-competitor premise through direct predator-control killing,
        systematically removing wolves and other carnivores to protect species considered more desirable.
    institutionalCorrection:
      status: corrected
      periodLabel: 1960s–1995
      action: National Park Service management shifted toward maintaining natural ecological processes and later participated in restoring wolves to Yellowstone, with reintroduction beginning in 1995.
      summary: >-
        The successor federal park-management system reversed the eradication premise by recognizing wolves as a native
        ecological component and actively restoring them to the park rather than treating their absence as a management success.
