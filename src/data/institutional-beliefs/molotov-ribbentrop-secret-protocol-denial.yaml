    publisher: Russian State Library
    note: >-
      Bibliographic record and digitized 1948 state edition identifying the Soviet Information Bureau as the author of
      the official historical response to the U.S. publication of German Foreign Ministry records. The pamphlet attacks
      the Western documentary publication as falsification but does not explicitly name the secret protocol.
  - title: Valentin Falin — “The situation in the Baltics does not allow us to wait in inactivity”
    url: https://rg.ru/2019/10/30/valentin-falin-situaciia-v-pribaltike-ne-pozvoliaet-zhdat-v-bezdejstvii.html
    publisher: Rossiyskaya Gazeta
    note: >-
      Archival article by RGASPI historians documenting the change in the official Soviet line. It records Falin's
      16 August 1988 APN statement that there was no basis to regard the secret protocols as fake and reproduces his
      1989 archival assessment that the protocols existed and were not a myth.
  - title: Resolution on the political and legal assessment of the Soviet-German Non-Aggression Treaty of 1939
    url: https://vedomosti.sssr.su/1989/29/
    publisher: Congress of People's Deputies of the USSR
    note: >-
      Official published Soviet legislative record of Resolution No. 979-I of 24 December 1989. The Congress confirms
      that a secret additional protocol was signed, describes its division of spheres of interest, condemns its signing
      and declares the secret protocols legally invalid from the moment they were concluded.
  - title: Secret additional protocol on the boundary of German and Soviet spheres of interest
    url: https://www.prlib.ru/item/1293992
    publisher: Boris Yeltsin Presidential Library
    note: >-
      Current Russian state-library catalog record for the 23 August 1939 secret additional protocol, giving its
