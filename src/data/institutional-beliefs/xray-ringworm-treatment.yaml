    note: >-
      Reconstructs the national treatment machinery in detail: Ministry of Health responsibility and funding, Hadassah's
      organizing and supervisory role, General Sick Fund treatment centers, Shaar HaAliyah and Tel HaShomer facilities,
      school-related compulsory treatment, and an estimated 26,000–27,000 children irradiated in Israel from 1948 to 1960.
