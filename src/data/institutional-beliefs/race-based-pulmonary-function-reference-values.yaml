    note: >-
      Unequivocally rejects fixed race factors but still says either a similar ancestral grouping or a whole-population
      comparison may be appropriate, documenting a transitional position before the 2023 recommendation.
  - id: pft-occupational-mechanism
    sourceId: pft-ats-occupational-2014
    relation: documents
    target: {scope: episode, episodeId: ats-ers-2005-2023, aspect: mechanism}
    locator: Reference Values for Asian Americans; Recommendation
    note: >-
      Prefers population-specific equations but calls a factor an appropriate interim solution and recommends multiplying
      White FEV1 and FVC reference values by 0.88 for Asian populations in North America.
  - id: pft-2005-consequences
    sourceId: pft-2005-standard
    relation: supports
    target: {scope: episode, episodeId: ats-ers-2005-2023, aspect: consequences}
    locator: Reference Equations — General issues, pp. 949–950
    note: >-
      Explains that reference choice affects classification against the lower limit of normal and warns that changing equations
      can alter interpretation, especially for results near an abnormality threshold.
  - id: pft-2023-consequences
    sourceId: pft-2023-statement
    relation: supports
    target: {scope: episode, episodeId: ats-ers-2005-2023, aspect: consequences}
    locator: Clinical Implications of Race-Specific Pulmonary Function Prediction Equations; Table 1
    note: >-
      Shows how reference choice can cross thresholds used for insurance, ventilatory support, transplant referral and surgery,
      while discussing potential harms from either retaining or changing the equations.
  - id: pft-reclassification-consequences
    sourceId: pft-reclassification-2023
    relation: supports
    target: {scope: episode, episodeId: ats-ers-2005-2023, aspect: consequences}
    locator: Abstract, Results and Conclusions
    note: >-
      Documents that changing equations alone altered physiological pattern and severity labels in opposite directions across
      the two studied groups and calls for further work on effects on diagnosis, referral and treatment.
  - id: pft-implications-consequences
    sourceId: pft-implications-2024
    relation: contextualizes
    target: {scope: episode, episodeId: ats-ers-2005-2023, aspect: consequences}
    locator: Abstract; Lung-Transplant Priority; Discussion; Limitations
    note: >-
      Finds similar discrimination for studied respiratory outcomes but major modeled differences in threshold-defined
      classifications, eligibility and payments; limitations include U.S.-only projections and applications a person might never face.
  - id: pft-2022-context
    sourceId: pft-2022-standard
    relation: contextualizes
    target: {scope: episode, episodeId: ats-ers-2005-2023, aspect: context}
    locator: Table 1; Comparison of measured values to a healthy population
    note: >-
      Contrasts the 2005 preference for group-specific equations with the update's rejection of fixed factors, uncertainty
      about genetic, social and environmental causes, and continued caution over the appropriate comparison population.
  - id: pft-2023-context
    sourceId: pft-2023-statement
    relation: contextualizes
    target: {scope: episode, episodeId: ats-ers-2005-2023, aspect: context}
    locator: History and Methodology of Race-Specific Reference Equations; Key Conclusions and Recommendations
    note: >-
      Distinguishes group-specific equations from fixed adjustments, explains GLI Global as a weighted race composite with
      wider uncertainty and notes that many world populations remain absent from the source data.
  - id: pft-gli-global-context
    sourceId: pft-gli-global-2022
    relation: supports
    target: {scope: episode, episodeId: ats-ers-2005-2023, aspect: context}
    locator: Abstract; Discussion
    note: >-
      Documents the available race-neutral comparator adopted in 2023: a weighted reanalysis of the GLI 2012 data that omits
      race at application but has wider normal limits and does not represent every population or ideal individual health.
  - id: pft-2023-institutional-correction
    sourceId: pft-2023-statement
    relation: documents
    target: {scope: episode, episodeId: ats-ers-2005-2023, aspect: institutional-correction}
    locator: Overview; Key Conclusions and Recommendations; Conclusions
    note: >-
      Recommends race-neutral average equations, identifies GLI Global for spirometry, rejects adjustment factors for lung
      volumes and diffusing capacity and calls for broader review of PFT-based decisions.
  - id: pft-ats-summary-institutional-correction
    sourceId: pft-ats-summary
    relation: documents
    target: {scope: episode, episodeId: ats-ers-2005-2023, aspect: institutional-correction}
    locator: Page body, paragraphs on the new recommendation and continued research
    note: >-
      The ATS public announcement presents the move to GLI Global as an institutional change, confirms ERS endorsement and
      emphasizes continuing research and reassessment of threshold-based decisions.
  - id: pft-implementation-institutional-correction
    sourceId: pft-implementation-survey-2026
    relation: documents
    target: {scope: episode, episodeId: ats-ers-2005-2023, aspect: institutional-correction}
    locator: Abstract; Current Practices; Discussion and Limitations
    note: >-
      Supports a partial rather than complete correction rating: just over half of this small, mostly academic respondent
      sample reported laboratory use of a race-neutral equation three years after the recommendation.
