    sourceId: mmdh-operation-colombo
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: 'Article paragraphs 1–5, 24 Jul 2023'
    note: >-
      The Chilean memory museum identifies the episode as a dictatorship media fabrication, describes the DINA's false
      account of internal MIR killings and records the two foreign publications followed by Chilean press amplification.
  - id: colombo-rettig-proposition
    sourceId: rettig-operation-colombo
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: 'Vol. I, pt. 2, section 2.g.4.3, pp. 87–90'
    note: >-
      The truth commission reconstructs the claim that disappeared detainees had killed one another abroad, the false
      identities attached to bodies in Argentina, and the two lists reporting 119 deaths outside Chile.
  - id: colombo-cable-proposition
    sourceId: us-embassy-colombo-cable
    relation: disputes
    target: {scope: belief, aspect: proposition}
    locator: 'Cable 1975SANTI05483, paras. 1–16, PDF pp. 1–5'
    note: >-
      In August 1975 the embassy assessed the foreign reports as probably untrue, found no confirmation for either list
      and judged a Chilean government plant the most plausible explanation.
  - id: colombo-mmdh-correction
    sourceId: mmdh-operation-colombo
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: 'Article paragraphs 4–5, 24 Jul 2023'
    note: >-
      The museum states that the 119 had been detained, tortured and disappeared in Chile and records the first 2004
      prosecution of former DINA agents for 34 of the victims.
  - id: colombo-bcn-correction
    sourceId: bcn-operation-colombo
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: 'Numbered points 3–9 and the ensuing floor statement'
    note: >-
      The parliamentary record quotes the Rettig finding that the lists were DINA disinformation and describes the 119 as
      people abducted in Chile whose supposed deaths abroad were fabricated.
  - id: colombo-rettig-correction
    sourceId: rettig-operation-colombo
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: 'Vol. I, pt. 2, section 2.g.4.3, pp. 87–90; individual findings throughout pt. 2'
    note: >-
      The commission identifies Operation Colombo as a DINA operation to relieve pressure over disappearances and records
      its own findings of state-agent responsibility in the listed victims' individual cases.
  - id: colombo-mmdh-impact
