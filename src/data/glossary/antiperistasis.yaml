term: Antiperistasis
aliases: []
shortDefinition: A historical Aristotelian-style explanation in which surrounding air displaced by a projectile circulates
  behind it and helps keep it moving.
longDefinition: Antiperistasis was one way medieval commentators described the Aristotelian attempt to explain projectile
  motion after contact with the thrower ended. The displaced medium was supposed to move around the projectile and continue
  pushing it from behind. The model became a target for later critics because the resisting medium was also being asked
  to serve as the continuing mover.
relatedTerms:
