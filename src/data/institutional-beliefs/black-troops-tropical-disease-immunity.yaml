schemaVersion: 2
title: Black troops as naturally resistant to tropical disease
proposition:
  summary: >-
    U.S. military authorities treated Black soldiers as naturally more resistant to yellow fever and other tropical
    disease, influencing recruitment and assignments for service in Cuba during the Spanish-American War.
correction:
  summary: >-
    Yellow fever is a viral disease transmitted by infected mosquitoes; the World Health Organization states that one
    vaccine dose provides lifelong protection. Malaria is caused by Plasmodium parasites transmitted by Anopheles
    mosquitoes. Long exposure can produce partial immunity to malaria, but WHO states that it never provides complete
    protection. Neither disease confers blanket protection through racial ancestry. An official Army history reports
    that half of 471 men of the 24th Infantry at Siboney contracted malaria or yellow fever; it does not separate the
    cases by disease.
category: Race, military medicine and public health
reviewedAt: '2026-09-19'
impact:
  summary: >-
    An Army medical history records that the War Department considered African American troops advantageous for Cuba
    and the Philippines because they were thought to have greater yellow-fever immunity. In Cuba, commanders assigned
    the 24th Infantry to hospital work at Siboney under a broader theory of natural Black immunity to malaria and yellow
    fever. Racial ideas also contributed to designating four of ten federal “Immune” regiments for Black enlisted men and lieutenants,
    alongside efforts to recruit people believed to have acquired immunity or hot-climate experience and political
    efforts to expand Black military service. An official Army history reports that half of 471 men of the 24th at
    Siboney contracted one or the other disease.
  highlights:
    - value: '4'
      label: of ten federal “Immune” regiments designated for Black enlisted men and lieutenants, for several documented reasons
    - value: 50% of 471
      label: men of the 24th Infantry at Siboney who contracted malaria or yellow fever according to official Army history
    - value: '1898'
      label: racial disease-resistance assumptions shaped U.S. tropical-service decisions during the war
  context:
    - >-
      The federal authorization for “Immune” troops did not itself state that Black people were racially immune to yellow
      fever. The racial proposition is documented instead in War Department and Army thinking and in how Black troops were
      recruited and assigned; the statute itself did not contain that racial claim.
    - >-
      The reported 50-percent figure combines malaria and yellow fever; it is not a yellow-fever-only infection rate.
    - >-
      The “Immune” program combined distinct ideas: recruiters sought people believed to have survived yellow fever or
      become acclimated to hot climates, while racial doctrine generalized tropical fitness to Black people. Black
      lobbying, exclusion from many state units and political recognition also influenced the four regiment designations.
      The racial belief was a contributing factor, not the program's only cause.
    - >-
      The Army monograph says hospital work involved little additional contact risk because malaria and yellow fever are
      mosquito-borne. The documented consequence is the racialized assignment rationale, not a claim that nursing itself caused the infections.
episodes:
  - id: united-states-1898
    polity: United States
    region: North America
    startYear: 1898
    endYear: 1898
    periodLabel: '1898'
    strength: policy-basis
    institutionTypes:
      - government
      - military
      - medical
    institutions:
      - United States War Department
      - United States Army
    institutionalContext: >-
      War Department planning and Army commanders used a medical theory that treated Black ancestry as conferring
      natural resistance to yellow fever, malaria or tropical climates. The War Department considered Black troops
      advantageous for overseas tropical service, and commanders ordered the 24th Infantry to hospital duty at Siboney
      under the theory that its soldiers were more immune than white troops. Separately, four of the ten federal
      “Immune” volunteer regiments were designated for Black enlisted men and lieutenants. Racialized ideas of tropical fitness
      contributed to that decision, but acquired-immunity recruitment, acclimation, lobbying, access to volunteer service
      and party politics also shaped the program. Disease among the 24th soon contradicted broad racial protection.
    consequences:
      - War Department deployment planning treated supposed Black yellow-fever immunity as an advantage for tropical service
      - The 24th Infantry was assigned to hospital duty at Siboney under a theory of greater natural resistance
      - Racial ideas contributed to designating four federal “Immune” regiments for Black enlisted men and lieutenants within a multi-cause program
      - A combined malaria-or-yellow-fever rate of 50 percent among 471 men of the 24th contradicted broad racial immunity
    summary: >-
      In 1898 War Department thinking and Army decisions treated Black soldiers as especially suited to tropical service
      because they were believed to possess greater natural resistance. The claim directly informed the 24th Infantry's
      hospital assignment and contributed to the racial designation of four regiments in the broader “Immune” program. Official
      Army history records that 50 percent of 471 men reporting at Siboney nevertheless contracted malaria or yellow
      fever, a combined finding that contradicted the supposed racial immunity.
    mechanism:
      kind: administrative-adoption
      summary: >-
        War Department deployment planning and the Army's Siboney hospital assignment operationalized the belief that
        Black troops were naturally better suited to tropical service. The four Black “Immune” regiments also reflected
        that belief, but within a program shaped by acquired-immunity recruitment, acclimation, lobbying and politics.
    institutionalCorrection:
      status: undocumented
      summary: >-
        The 24th Infantry's disease experience contradicted the racial assumption during the war, and neither Black nor
        white “Immune” regiments demonstrated the promised immunity. A historical account records that belief in Black
        tropical fitness still influenced Army organization in 1899; the existing record does not identify a dated War
        Department or Army act formally repudiating the broader racial theory.
