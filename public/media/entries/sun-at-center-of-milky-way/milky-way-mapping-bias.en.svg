<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-label="Two-panel schematic showing how interstellar dust biased star-count maps of the Milky Way, and how globular clusters revealed a more distant Galactic center."><rect width="1200" height="790" rx="22" fill="#f5f0e6"/><text x="70" y="72" fill="#4f776e" font-size="25" font-weight="700" text-anchor="start" style="font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" letter-spacing="3">HOW DUST BIASED THE MAP</text><rect x="70" y="110" width="500" height="590" rx="20" fill="#fbf8f1" stroke="#d6cec0" stroke-width="2"/><rect x="630" y="110" width="500" height="590" rx="20" fill="#fbf8f1" stroke="#d6cec0" stroke-width="2"/><text x="110" y="160" fill="#4f776e" font-size="19" font-weight="700" text-anchor="start" style="font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" letter-spacing="2">STAR COUNTS</text><text x="670" y="160" fill="#4f776e" font-size="19" font-weight="700" text-anchor="start" style="font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" letter-spacing="2">GLOBULAR CLUSTERS</text><ellipse cx="320" cy="370" rx="180" ry="110" fill="#e8e1d4" stroke="#d6cec0" stroke-width="2"/><circle cx="190" cy="290" r="4" fill="#b9b1a4" opacity="0.85"/><circle cx="230" cy="275" r="4" fill="#b9b1a4" opacity="0.85"/><circle cx="270" cy="285" r="4" fill="#b9b1a4" opacity="0.85"/><circle cx="370" cy="286" r="4" fill="#b9b1a4" opacity="0.85"/><circle cx="430" cy="300" r="4" fill="#b9b1a4" opacity="0.85"/><circle cx="450" cy="410" r="4" fill="#b9b1a4" opacity="0.85"/><circle cx="410" cy="455" r="4" fill="#b9b1a4" opacity="0.85"/><circle cx="250" cy="455" r="4" fill="#b9b1a4" opacity="0.85"/><circle cx="180" cy="410" r="4" fill="#b9b1a4" opacity="0.85"/><circle cx="215" cy="360" r="4" fill="#6d6b64"/><circle cx="240" cy="410" r="4" fill="#6d6b64"/><circle cx="275" cy="345" r="4" fill="#6d6b64"/><circle cx="300" cy="390" r="4" fill="#6d6b64"/><circle cx="340" cy="345" r="4" fill="#6d6b64"/><circle cx="375" cy="395" r="4" fill="#6d6b64"/><circle cx="405" cy="355" r="4" fill="#6d6b64"/><circle cx="430" cy="405" r="4" fill="#6d6b64"/><path d="M 170 320 C 245 300 400 302 472 332" fill="none" stroke="#b9b1a4" stroke-width="22" opacity="0.8"/><path d="M 170 420 C 250 438 388 438 470 412" fill="none" stroke="#b9b1a4" stroke-width="18" opacity="0.7"/><ellipse cx="320" cy="370" rx="120" ry="74" fill="none" stroke="#c7a24d" stroke-width="3" stroke-dasharray="8 8"/><circle cx="320" cy="370" r="11" fill="#c7a24d"/><text x="320" y="515" fill="#2f302d" font-size="19" font-weight="650" text-anchor="middle" style="font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">Sun</text><text x="320" y="545" fill="#6d6b64" font-size="17" font-weight="600" text-anchor="middle" style="font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">apparent map</text><text x="320" y="612" fill="#6d6b64" font-size="17" font-weight="400" text-anchor="middle" style="font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><tspan x="320" dy="0">distant stars hidden by dust</tspan><tspan x="320" dy="23">make the visible system look</tspan><tspan x="320" dy="23">roughly centered on the Sun</tspan></text><ellipse cx="885" cy="385" rx="195" ry="118" fill="#e8e1d4" stroke="#d6cec0" stroke-width="2"/><text x="885" y="540" fill="#6d6b64" font-size="17" font-weight="600" text-anchor="middle" style="font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">larger Galaxy</text><circle cx="805" cy="385" r="12" fill="#2f302d"/><circle cx="1015" cy="435" r="11" fill="#c7a24d"/><line x1="819" y1="387" x2="1003" y2="431" stroke="#9b958b" stroke-width="2" stroke-dasharray="7 7"/><circle cx="750" cy="345" r="7" fill="#4f776e" opacity="0.95"/><circle cx="775" cy="330" r="7" fill="#4f776e" opacity="0.95"/><circle cx="800" cy="315" r="7" fill="#4f776e" opacity="0.95"/><circle cx="830" cy="335" r="7" fill="#4f776e" opacity="0.95"/><circle cx="760" cy="380" r="7" fill="#4f776e" opacity="0.95"/><circle cx="790" cy="362" r="7" fill="#4f776e" opacity="0.95"/><circle cx="835" cy="370" r="7" fill="#4f776e" opacity="0.95"/><circle cx="780" cy="425" r="7" fill="#4f776e" opacity="0.95"/><circle cx="810" cy="440" r="7" fill="#4f776e" opacity="0.95"/><circle cx="845" cy="428" r="7" fill="#4f776e" opacity="0.95"/><circle cx="820" cy="470" r="7" fill="#4f776e" opacity="0.95"/><circle cx="780" cy="470" r="7" fill="#4f776e" opacity="0.95"/><circle cx="740" cy="405" r="7" fill="#4f776e" opacity="0.95"/><ellipse cx="805" cy="385" rx="85" ry="78" fill="none" stroke="#4f776e" stroke-width="3" stroke-dasharray="7 7"/><text x="845" y="575" fill="#2f302d" font-size="19" font-weight="650" text-anchor="middle" style="font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">Galactic center</text><text x="1015" y="490" fill="#2f302d" font-size="19" font-weight="650" text-anchor="middle" style="font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">Sun</text><text x="880" y="620" fill="#6d6b64" font-size="17" font-weight="400" text-anchor="middle" style="font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><tspan x="880" dy="0">globular clusters point toward</tspan><tspan x="880" dy="23">a distant Galactic center</tspan></text></svg>