locale: de
entryId: hereditary-diagnoses-compulsory-sterilization
sourceReviewedAt: '2026-08-25'
title: Erbdiagnosen als verlässliche Grundlage für Zwangssterilisation
claim: Gesundheitsverwaltung, Medizin und Justiz des NS-Staates behandelten eine Liste psychiatrischer, neurologischer,
  sensorischer und sozialer Diagnosen als Kennzeichen „erbkranker“ Menschen, deren Kinder mit hoher Wahrscheinlichkeit
  schwere Erbschäden erleiden würden, und machten diese vermeintliche Erbprognose zur Grundlage von Zwangssterilisationen.
currentUnderstanding: Die pauschale Erbprognose des Sterilisationssystems war wissenschaftlich nicht haltbar. Einige
  der erfassten Krankheiten besitzen tatsächlich genetische Komponenten; Chorea Huntington ist eine klar monogen
  vererbte Erkrankung. Schizophrenie und bipolare Störung beruhen dagegen auf komplexem Zusammenspiel vieler Gene
  und Umweltfaktoren. Zugleich wurde „angeborener Schwachsinn“ als dehnbare Kategorie auch auf Menschen angewandt,
  die als sozial unangepasst galten oder Konformitäts- und Intelligenztests nicht bestanden. Eine Diagnose bewies
  nicht die gesetzlich behauptete hohe Wahrscheinlichkeit schwerer Erbschäden bei zukünftigen Kindern.
impact:
  summary: Die Erbbehauptung wurde in Gesetz, ärztliche Begutachtung, Sondergerichte und chirurgische Eingriffe
    eingebaut. Das Gesetz zur Verhütung erbkranken Nachwuchses trat am 1. Januar 1934 in Kraft. Erbgesundheitsgerichte
    aus Richter und Ärzten konnten Sterilisationen anordnen, die nötigenfalls gegen den Willen der Betroffenen und
    mit polizeilichem Zwang vollzogen wurden. Rund 400.000 Menschen wurden zwangssterilisiert. Der Bundestag ächtete
    die Maßnahmen 1988 als NS-Unrecht und hob 1998 die noch bestehenden Sterilisationsbeschlüsse gesetzlich auf.
  highlights:
  - value: ≈400.000
    label: unter dem NS-Erbgesundheitsgesetz zwangssterilisierte Menschen
  - value: '9'
    label: im Gesetz genannte Diagnosekategorien als Sterilisationsgründe
  - value: '1998'
    label: Jahr der gesetzlichen Aufhebung der Sterilisationsbeschlüsse der Erbgesundheitsgerichte
  context:
  - Die Korrektur lautet nicht, dass Vererbung bei jeder genannten Erkrankung bedeutungslos sei. Chorea Huntington
    wird autosomal-dominant vererbt; Schizophrenie und bipolare Störung haben erhebliche, aber komplexe genetische
    Anteile. Falsch war der Sprung von einer breiten Diagnose zu einer hinreichend sicheren Prognose über die Nachkommen,
    mit der irreversible staatliche Eingriffe gerechtfertigt wurden.
  - Besonders weit wurde „angeborener Schwachsinn“ ausgelegt. Unter diese Bezeichnung fielen auch Menschen, die
    das Regime als sozial abweichend betrachtete oder die angebliche Tests von Intelligenz und sozialer Konformität
    nicht bestanden.
  - 'Die praktische Aktion endete 1945 mit dem NS-Regime, die institutionelle Korrektur aber erst Jahrzehnte später:
    1988 ächtete der Bundestag die Zwangssterilisationen, 1998 hob er die Gerichtsbeschlüsse auf und 2007 verurteilte
    er auch das Gesetz selbst ausdrücklich als nationalsozialistisches Unrecht.'
episodes:
- id: nazi-germany-1934-1945
  polity: NS-Deutschland
  institutions:
  - Reichsministerium des Innern und öffentliche Gesundheitsverwaltung
  - Erbgesundheitsgerichte und Erbgesundheitsobergerichte
  - Gesundheitsämter, psychiatrische Einrichtungen und ausführende Krankenhäuser
  institutionalContext: Das Gesetz von Juli 1933 definierte Menschen mit bestimmten Diagnosen als „erbkrank“ und
    erlaubte ihre Unfruchtbarmachung, wenn angebliche medizinische Erfahrung eine hohe Wahrscheinlichkeit schwerer
    Erbschäden bei ihren Nachkommen erwarten ließ. Ab Januar 1934 entschieden besondere Gerichte anhand ärztlicher
    Gutachten. Sie bestanden aus einem Richter, einem Amtsarzt und einem weiteren mit der Erbgesundheitslehre vertrauten
    Arzt. Nach Rechtskraft durfte die Operation mit unmittelbarem und polizeilichem Zwang durchgesetzt werden.
  consequences:
  - Zwangssterilisation von ungefähr 400.000 Menschen in einem diagnosegestützten eugenischen System
  - Irreversible Eingriffe auf Anordnung besonderer Gerichte und nötigenfalls gegen den Willen der Betroffenen
  - Verwendung von „angeborenem Schwachsinn“ als Sammelkategorie für soziale Werturteile und umstrittene Tests
  - Institutionalisierung nationalsozialistischer Rassenhygiene als vermeintlich wissenschaftliche medizinische
    Risikobewertung
  - Körperliche Komplikationen, Todesfälle sowie lebenslange psychische und soziale Folgen
  - Erst Jahrzehnte später erfolgte gesetzliche Rehabilitierung durch Aufhebung der Gerichtsbeschlüsse
  summary: Die NS-Zwangssterilisation verwandelte ein überzogenes erbbiologisches Modell in durchsetzbares Medizinrecht.
    Heterogene Diagnosen galten als verlässliche Vorhersage schwerer Erbschäden bei zukünftigen Kindern; besondere
    Gerichte machten daraus Operationsbefehle. Moderne Genetik widerlegt diese pauschale Prognoselogik für breite
    psychiatrische Diagnosen, während die historische Forschung zeigt, wie soziale Abweichung selbst in die häufig
    verwendete Kategorie „Schwachsinn“ einfließen konnte.
