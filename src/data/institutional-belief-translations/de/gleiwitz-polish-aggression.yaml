schemaVersion: 2
locale: de
entryId: gleiwitz-polish-aggression
sourceReviewedAt: '2026-08-25'
title: Der Überfall auf den Sender Gleiwitz als polnische Aggression
proposition:
  summary: >-
    Die nationalsozialistischen Behörden inszenierten die Besetzung und polnischsprachige Sendung am Sender Gleiwitz
    und stellten den Vorfall im Rahmen einer umfassenderen Erzählung als echte polnische Aggression gegen deutsches
    Staatsgebiet dar.
correction:
  summary: >-
    Der Vorfall vom 31. August 1939 war kein polnischer Angriff, sondern eine von Reinhard Heydrich angeordnete Operation
    des deutschen Sicherheitsapparats. Alfred Naujocks erklärte später unter Eid, Heydrich habe ihm befohlen, einen
    Angriff vorzutäuschen, die Angreifer als Polen erscheinen zu lassen und damit Beweise für die ausländische Presse
    und deutsche Propaganda zu schaffen. Am nächsten Morgen überfiel Deutschland Polen; der Angriffskrieg war jedoch
    bereits geplant. Gleiwitz war ein fabrizierter Vorwand innerhalb der Aggressionserzählung, nicht der Auslöser der Invasionsentscheidung.
impact:
  summary: >-
    Gleiwitz zeigt, wie ein Staat einen vermeintlichen Tatsachenbeleg gezielt herstellen und zur Rechtfertigung
    militärischer Aggression einsetzen kann. Eine kleine deutsche Sicherheitsdienstgruppe besetzte den Sender, sendete
    kurz auf Polnisch und gab Schüsse ab. Am 1. September stellte Hitler Deutschland öffentlich als Opfer polnischer
    Angriffe dar. Die Aktion lieferte inszeniertes Beweismaterial für eine bereits beschlossene Politik.
  highlights:
    - value: 5–6
      label: weitere SD-Männer, die Naujocks nach eigener Aussage auf Heydrichs Befehl begleiteten
    - value: 3–4 Minuten
      label: ungefähre Dauer der polnischsprachigen Sendung laut Naujocks' eidesstattlicher Erklärung
    - value: 1 Tag
      label: vom inszenierten Vorfall bis zum deutschen Überfall auf Polen am folgenden Morgen
      note: Die zeitliche Abfolge bedeutet nicht, dass Gleiwitz den Überfall verursachte; der Angriff auf Polen war bereits geplant.
  context:
    - >-
      Hitler nannte Gleiwitz in seiner Reichstagsrede vom 1. September nicht beim Namen, sondern behauptete allgemeiner,
      reguläre polnische Soldaten hätten auf deutsches Gebiet geschossen.
    - >-
      Das Reichssicherheitshauptamt bestand im August 1939 noch nicht formell; es wurde erst am 27. September 1939 geschaffen.
    - >-
      Populäre Darstellungen ergänzen häufig Details, die über Naujocks' eidesstattliche Aussage hinausgehen und für den
      Nachweis der inszenierten Aktion nicht erforderlich sind.
episodes:
  - id: nazi-germany-1939
    polity: NS-Deutschland
    institutions:
      - Dienststelle des Chefs der Sicherheitspolizei und des SD unter Reinhard Heydrich
      - Reichsregierung
    institutionalContext: >-
      Naujocks sagte aus, Heydrich habe ihm um den 10. August 1939 persönlich befohlen, einen Angriff auf den Sender
      Gleiwitz zu simulieren und die Angreifer als Polen erscheinen zu lassen. Als Zweck habe Heydrich verwertbare
      Beweise für die ausländische Presse und deutsche Propaganda genannt. Naujocks führte die Aktion am Abend des
      31. August mit fünf oder sechs weiteren SD-Männern aus. Am 1. September behauptete Hitler im Reichstag, reguläre
      polnische Soldaten hätten auf deutsches Gebiet geschossen. Das Bundesarchiv ordnet Gleiwitz und weitere
      Grenzzwischenfälle ausdrücklich als nationalsozialistische Inszenierungen ein.
    consequences:
      - Herstellung fingierter Beweise für ausländische Presse und deutsche Propaganda
      - Einbindung inszenierter Grenzzwischenfälle in die offizielle Behauptung polnischer Angriffe auf deutsches Gebiet
      - Öffentliche Darstellung des deutschen Angriffs als defensive Reaktion statt als geplante Aggression
      - Nutzung eines fabrizierten Vorfalls als Bestandteil der propagandistischen Rechtfertigung des Überfalls auf Polen
    summary: >-
      Gleiwitz war keine irrtümliche Grenzmeldung. Heydrich beauftragte eine deutsche Sicherheitsdienstgruppe damit,
      einen scheinbar polnischen Angriff zu produzieren und verknüpfte die Aktion ausdrücklich mit Presse- und
      Propagandazwecken. Die Rolle des Vorfalls bleibt eng: Er lieferte scheinbare Belege für die Aggressionserzählung,
      nicht die Entscheidung zum Krieg.
    mechanism:
      summary: >-
        Deutsche Sicherheitsdienste fabrizierten einen Grenzzwischenfall und die Reichsregierung band angebliche
        polnische Angriffe in eine öffentliche Propaganda ein, die deutsches Militärhandeln als defensive Reaktion darstellte.
    institutionalCorrection:
      summary: >-
        NS-Deutschland nahm die fabrizierte Aggressionserzählung vor dem Zusammenbruch des Regimes institutionell nicht
        zurück. Spätere Aussagen und deutsche Archivinstitutionen belegten die Inszenierung, werden hier aber nicht als
        Selbstkorrektur des ursprünglichen Trägers gewertet.
evidence:
  - id: gleiwitz-naujocks-proposition
    note: >-
      Naujocks' eidesstattliche Erklärung sagt aus, Heydrich habe einen simulierten polnischen Angriff für Presse- und Propagandazwecke angeordnet.
  - id: gleiwitz-bundesarchiv-correction
    note: >-
      Das Bundesarchiv bezeichnet Gleiwitz und verwandte Grenzzwischenfälle als NS-Fabrikationen und stellt fest, dass der Überfall auf Polen bereits geplant war.
  - id: gleiwitz-naujocks-impact
  - id: gleiwitz-naujocks-carrier
  - id: gleiwitz-naujocks-mechanism
  - id: gleiwitz-hitler-consequences
    note: >-
      Hitlers Rede vom 1. September behauptete öffentlich, reguläre polnische Soldaten hätten deutsches Gebiet beschossen, und stellte deutsches Handeln als Gegenfeuer dar.
  - id: gleiwitz-bundesarchiv-context
