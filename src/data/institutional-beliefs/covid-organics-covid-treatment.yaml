title: Covid-Organics as established COVID-19 prevention and treatment
claim: Madagascar treated Covid-Organics as a preventive and therapeutic COVID-19 remedy and distributed it through
  state policy before randomized trials had demonstrated that it prevented or treated the disease.
currentUnderstanding: A plausible plant ingredient or traditional use does not establish clinical efficacy against
  COVID-19. Covid-Organics had not been shown in adequately controlled randomized trials to prevent or treat COVID-19
  when it was promoted and distributed. Later clinical evaluation was therefore an evidentiary step that should
  have preceded claims of established therapeutic benefit.
category: Medicine and public health
reviewedAt: '2026-08-24'
impact:
  summary: Madagascar moved Covid-Organics from a locally developed preparation into national pandemic policy. Government
    plans and audits document mass distribution, use in schools and public administration, and incorporation into
    the COVID response before efficacy had been established in randomized trials. WHO later treated the related
    CVO+ product as an investigational remedy requiring a Phase III trial.
  highlights:
  - value: '2020'
    label: Covid-Organics entered national pandemic policy and mass distribution
  - value: 270,000 pupils
    label: The national emergency plan recorded distribution of masks and Covid-Organics to examination-class pupils
  - value: '2021'
    label: WHO described CVO+ as undergoing Phase III evaluation rather than as an established treatment
  context:
  - The card does not assert that Artemisia or other plants can never contain useful medicines. It concerns the
    leap from a preparation’s composition and preliminary observations to an established COVID-prevention or treatment
    claim.
episodes:
- id: madagascar-2020-2021
  polity: Madagascar
  region: East Africa
  startYear: 2020
  endYear: 2021
  strength: policy-basis
  institutionTypes:
  - government
