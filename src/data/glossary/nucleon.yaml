term: Nucleon
aliases:
- nucleons
shortDefinition: 'A collective name for the two particles that make up ordinary atomic nuclei: protons and neutrons.'
longDefinition: 'Protons and neutrons are collectively called nucleons because both occupy the atomic nucleus and participate
  in the strong nuclear interaction. They are not fundamental particles: each is a composite hadron whose internal structure
  is described in terms of quarks and gluons.'
relatedTerms:
