term: Stellar occultation
aliases:
- stellar occultations
- occultation
- occultations
shortDefinition: An event in which a Solar System body or other foreground object passes in front of a star and temporarily
  blocks some or all of its light.
longDefinition: During a stellar occultation, astronomers record how a background star's brightness changes as a foreground
  object passes across the line of sight. The timing and shape of the dimming can reveal an object's size, atmosphere,
  rings, or nearby material even when those features cannot be resolved directly in an image.
relatedTerms:
- roche-limit
reviewedAt: '2026-08-21'
sources:
- title: A dense ring of the trans-Neptunian object Quaoar outside its Roche limit
  url: https://doi.org/10.1038/s41586-022-05629-6
  publisher: Nature
  note: Uses multiple stellar occultations to detect and locate Quaoar's ring.
