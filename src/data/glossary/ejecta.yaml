term: Ejecta
aliases:
- impact ejecta
shortDefinition: Material thrown outward from an impact or eruption; impact ejecta can include shattered, melted,
  or vaporized rock.
longDefinition: In impact geology, ejecta is material expelled from a crater-forming collision. Its distribution,
  chemistry, and shock effects can preserve evidence of an impact far from the crater itself.
relatedTerms: []
reviewedAt: '2026-08-21'
sources:
- title: Sudden death at the end of the Mesozoic
  url: https://www.usgs.gov/publications/sudden-death-end-mesozoic
  publisher: U.S. Geological Survey
  note: Discusses impact debris and other geological evidence associated with the end-Cretaceous extinction.
