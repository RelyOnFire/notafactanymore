term: Luminescence dating
aliases:
- optically stimulated luminescence
- OSL
- OSL dating
shortDefinition: A dating method that estimates when mineral grains such as quartz were last exposed to light or intense
  heat.
longDefinition: Luminescence dating measures trapped electronic charge that accumulates in minerals through natural background
  radiation. Exposure to sunlight or sufficient heat resets much of that stored signal. By measuring the remaining luminescence
  and the environmental radiation dose, researchers can estimate the time since sediment was last exposed to light. At
  White Sands, optically stimulated luminescence provided an independent check on the footprint chronology.
relatedTerms:
- last-glacial-maximum
reviewedAt: '2026-08-21'
sources:
