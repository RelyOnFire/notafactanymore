locale: de
entryId: homosexuality-as-mental-disorder
sourceReviewedAt: 2026-08-22
title: Homosexualität als psychische Störung
claim: Homosexualität wurde im offiziellen medizinischen Klassifikationssystem als diagnostizierbare psychische beziehungsweise sexuelle Störung behandelt.
currentUnderstanding: Homosexualität ist weder Krankheit noch psychische oder sexuelle Störung und keine „Perversion“. Gleichgeschlechtliche Anziehung gehört zur normalen Vielfalt menschlicher Sexualität; für die Pathologisierung sexueller Orientierung gibt es keine tragfähige medizinische Grundlage.
episodes:
  - id: brazil-1979-1985
    polity: Brasilien
    summary: Das brasilianische Gesundheitssystem verwendete den ICD-9-Code 302.0, der Homosexualität im Kapitel der psychischen Störungen unter „sexuelle Abweichungen und Störungen“ einordnete. Nach einer formellen Überprüfung auf Initiative des Gesundheitsministeriums wies der Conselho Federal de Medicina 1985 Ärzte an, diese pathologisierende Einstufung nicht mehr zu verwenden und Homosexualität aus dem Störungscode herauszunehmen.
    consequences:
      - Diagnostische Kodierung als psychische oder sexuelle Störung
      - Medizinische Pathologisierung von Homosexualität
      - Institutionelle Stigmatisierung im Gesundheitswesen
