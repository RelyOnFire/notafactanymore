entryId: accretion
sourceReviewedAt: '2026-08-21'
term: Akkretion
aliases:
- Akkretionsfluss
- Akkretionsscheibe
shortDefinition: Das Anwachsen eines astronomischen Objekts, weil Materie unter dem Einfluss der Gravitation auf es zufällt;
  bei Schwarzen Löchern kann dieses Material extrem heiß und leuchtkräftig werden.
longDefinition: Akkretion ist die gravitative Ansammlung von Gas, Staub oder anderem Material auf einem astronomischen
  Objekt. Um ein Schwarzes Loch kann die einfallende Materie eine Scheibe oder einen anderen Zufluss bilden, in dem Reibung,
  Magnetfelder und Turbulenz Gravitationsenergie in Wärme und Strahlung umwandeln, bevor das Material den Ereignishorizont
  überschreitet. Dieser Prozess treibt aktive galaktische Kerne und Quasare an.
