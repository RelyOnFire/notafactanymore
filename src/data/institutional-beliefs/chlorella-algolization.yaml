  - id: chlorella-gost71946-text-proposition
    sourceId: chlorella-gost-71946-text
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: introduction and §4
    note: >-
      The standard acknowledges that the first 1998 Penza Reservoir attempt was ineffective, then attributes bloom
      suppression, higher oxygen, odor removal, greater clarity, ecological stability and other benefits to the method.
  - id: chlorella-gost71946-text-mechanism
    sourceId: chlorella-gost-71946-text
    relation: documents
    target: {scope: episode, episodeId: russia-2022-2026, aspect: mechanism}
    locator: preface and §§4–10
