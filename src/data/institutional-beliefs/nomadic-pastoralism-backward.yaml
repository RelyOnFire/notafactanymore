title: Nomadic pastoralism as a backward economy
claim: Kazakh nomadic pastoralism was treated as inherently backward and inefficient, and forced settlement into collectivized agriculture as a route to greater productivity and socialist modernization.
currentUnderstanding: Mobile pastoralism can be a highly adapted way of using dry and variable grasslands, where seasonal movement helps match livestock to shifting water and forage. Agricultural systems must fit local ecology; forcing mobile herders into unsuitable settlement and procurement systems can destroy rather than increase productive capacity.
category: Agriculture and political economy
reviewedAt: 2026-08-23
episodes:
  - id: soviet-kazakhstan-1928-1933
    polity: Soviet Kazakhstan
    region: Central Asia
    startYear: 1928
    endYear: 1933
    strength: policy-basis
    institutionTypes: [government]
    institutions:
      - Central Committee of the All-Union Communist Party (Bolsheviks)
      - Kazakh Regional Committee (Kazkraikom) of the All-Union Communist Party (Bolsheviks)
      - Council of People's Commissars of the Kazakh ASSR
    institutionalContext: Moscow's collectivization and procurement directives were translated into Kazakh policy through Kazkraikom under Filipp Goloshchekin and the republic's Soviet government, then enforced through district party, procurement and collective-farm structures. Those implementation networks were extensive, so the list names the principal decision-making bodies rather than calling them simply “collectivization authorities.”
    consequences:
      - Forced sedentarization of mobile pastoralists
      - Livestock confiscation, slaughter and collapse of herds
      - Destruction of pastoral livelihoods and mass flight
      - Famine in which roughly one-third of the Kazakh population died
    summary: From 1928, Soviet policy increasingly treated Kazakh pastoral nomadism as incompatible with rapid agricultural modernization and socialist organization. In 1929 Kazkraikom adopted a program linking settlement to economic reconstruction; plans for mass sedentarization were then merged with forced collectivization and heavy livestock procurement despite warnings about steppe conditions. The resulting catastrophe had multiple causes, but these policies destroyed much of the pastoral economy and turned an ongoing food crisis into mass famine.
    sources:
      - title: Nomads under Siege — Kazakhstan and the Launch of Forced Collectivization
        url: https://academic.oup.com/cornell-scholarship-online/book/15707/chapter-abstract/170494941
        publisher: Cornell University Press / Oxford Academic
        note: Shows that Soviet leaders pursued forced collectivization and sedentarization to increase steppe productivity while repeatedly ignoring warnings about the risks.
      - title: Nomads and the State in Soviet Kazakhstan
        url: https://academic.oup.com/edited-volume/61799/chapter-abstract/546311768
        publisher: Oxford Research Encyclopedia of Asian History
        note: Documents the sudden 1929 plan for total sedentarization, its merger with collectivization, livestock procurement, and the famine that killed about one-third of Kazakhs.
      - title: From the history of collectivization of agriculture in Kazakhstan
        url: https://e-history.kz/en/history-of-kazakhstan/show/9610
        publisher: Qazaqstan Tarihy / Institute of History and Ethnology
        note: Identifies the Kazakh Regional Committee (Kazkraikom) as a central institutional driver of collectivization and records its directives for livestock regions.
