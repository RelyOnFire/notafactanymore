schemaVersion: 2
title: Race-based pulmonary-function reference values
proposition:
  summary: >-
    Professional pulmonary-function standards treated race or ethnicity as an input for choosing expected values. They
    preferred group-specific reference equations and, when those were unavailable, allowed numerical factors that lowered
    reference values derived from White populations for some patients classified as Black or Asian.
correction:
  summary: >-
    Race and ethnicity are social classifications, not direct measurements of an individual's lung physiology. Current ATS
    guidance, endorsed by the ERS, recommends the race-neutral GLI Global average equation for spirometry and rejects race
    adjustment factors for lung volumes and diffusing capacity. These statistical references remain imperfect: they do not
    define ideal health or diagnose disease by themselves, and results near thresholds require clinical context, prior tests
    and other evidence.
category: Pulmonary medicine and clinical standards
reviewedAt: '2026-09-24'
impact:
  summary: >-
    Reference equations do not alter the air a person exhales; they alter the predicted value, lower limit of normal and
    severity label against which that measurement is compared. The historical approach could therefore give otherwise
    identical measurements different interpretations according to racial or ethnic classification. Studies document large
    reclassification effects when equations change, but reclassification alone does not establish a new diagnosis or prove
    benefit or harm. Its consequences depend on how clinical, employment, disability, insurance and transplant systems use
    the resulting thresholds.
  highlights:
    - value: ≈12%
      label: 2005 example reduction for predicted TLC, FEV1 and FVC in Black subjects
      note: The joint standard presented this as an average adjustment when suitable group-specific equations were unavailable, not as an individual physiological measurement; it gave about 7% for FRC and RV.
    - value: 12.5 million
      label: U.S. residents projected to change ventilatory-impairment classification under GLI Global
      note: A 2024 modeling study projected this among 249 million people aged 6–79 able to produce high-quality spirometry; it was not a count of observed diagnoses or injuries.
    - value: 54%
      label: of 66 surveyed pulmonologists reported a race-neutral equation in their PFT laboratory in 2026
      note: The survey had a 29% response rate and 95% of respondents worked in academic settings, so it documents incomplete transition in this sample rather than national prevalence.
  context:
    - >-
      The 2005 standard preferred race- or ethnicity-specific equations. Its fallback examples reduced White-derived expected
      TLC, FEV1 and FVC values by about 12% for Black subjects, reduced FRC and RV by about 7%, and used a factor of 0.94 for
      Asian Americans. A 2014 official ATS occupational standard continued to call correction factors appropriate when a
      suitable equation was unavailable but changed its Asian-American example to 0.88. These were population-level rules,
      not measurements of the individual characteristics thought to explain average differences.
    - >-
      In one academic-center study, applying GLI Global rather than GLI 2012 to 2,722 Black and 5,709 White patients changed
      the modeled prevalence of a restrictive pattern from 26.8% to 37.5% in the Black group and from 22.6% to 18.0% in the
      White group. Those are reinterpretations of recorded tests, not observed changes in lungs, confirmed diagnoses or
      patient outcomes.
    - >-
      A 2024 study projected U.S. changes across disease classification, occupational eligibility, impairment ratings and
      disability compensation. The race-based and race-neutral equations had similar discrimination for the studied
      respiratory outcomes while assigning different classifications to millions. The authors stressed that threshold
      changes can exchange sensitivity and specificity and that their national estimates model potential reclassification,
      not automatically beneficial or harmful outcomes.
    - >-
      Changing equations can create an apparent break in a patient's longitudinal results even when the measured volumes are
      unchanged. The 2023 statement therefore calls for explicit reporting and education, review of prior measurements and
      reassessment of policies that turn statistical reference values into hard clinical or administrative thresholds.
episodes:
  - id: ats-ers-2005-2023
    polity: United States and Europe
    region: Cross-regional
    startYear: 2005
    endYear: 2023
    periodLabel: 2005–2023
    strength: officially-endorsed
    institutionTypes:
      - medical
      - professional
    institutions:
      - American Thoracic Society (ATS)
      - European Respiratory Society (ERS)
      - Global Lung Function Initiative (GLI)
    institutionalContext: >-
      This episode begins with the joint 2005 ATS/ERS interpretation standard, not with the much older origins of racialized
      spirometry. The standard instructed patients to identify their race or ethnic group, preferred matching group-specific
      equations and allowed fixed adjustment factors as a fallback. GLI 2012 then supplied equations labeled Caucasian,
      African American, North East Asian and South East Asian, plus an averaged “Other” category, and urged widespread
      implementation in equipment. An official 2014 ATS occupational standard still endorsed group-specific equations or a
      fallback factor. The 2022 joint standard unequivocally rejected fixed race factors but remained transitional: it
      recommended GLI equations while saying either a similar ancestral grouping or the whole population might be the relevant
      comparator depending on context. The explicit recommendation to replace race- and ethnicity-specific interpretation
      with a race-neutral average equation came in the 2023 ATS statement endorsed by the ERS.
    consequences:
      - Identical measured volumes could receive different predicted values, lower limits of normal and severity scores according to racial or ethnic classification
      - Race-specific reference values could delay recognition of impairment or access to evaluation and therapy for people compared with a lower expected value
      - Equation-dependent thresholds affected clinical evaluation, surgery and transplant referral as well as employment, disability and insurance decisions
      - Switching equations reclassified results in both directions and could change true-positive and false-positive rates without changing the underlying measurement
      - Laboratories, device software and downstream policies required coordinated changes so longitudinal reports would not imply a physiological change caused only by a new equation
    summary: >-
      ATS/ERS guidance operationalized race and ethnicity in pulmonary-function interpretation rather than merely describing
      population averages. Laboratories used a patient's category to select an equation or adjustment factor, and GLI 2012
      gave this approach an all-age, multi-group reference system. By 2022 the joint technical standard rejected fixed factors
      and acknowledged uncertain genetic, social and environmental explanations, yet it did not fully abandon ancestry-linked
      comparison. The 2023 ATS statement, endorsed by the ERS, supplied the formal reversal and recommended GLI Global while
      warning that reference equations remain uncertain and that the many threshold-based uses of PFTs also need review.
    mechanism:
      kind: standard-setting
      summary: >-
        Professional standards told laboratories which reference populations or numerical factors to use; GLI encoded the
        categories in equations; and manufacturers and laboratory information systems turned the selected category into
        predicted values, limits of normal and severity classifications on reports.
    institutionalCorrection:
      status: partial
      periodLabel: 2023 onward
      action: >-
        The ATS issued an official statement, endorsed by the ERS, recommending GLI Global for race-neutral spirometry
        interpretation, rejecting race adjustment factors for other PFTs and calling for review of threshold-based decisions.
      summary: >-
        The professional recommendation was reversed, but correction is incomplete in practice and in the underlying evidence.
        The 2023 panel emphasized limited data for lung volumes and diffusing capacity, underrepresentation in GLI Global,
        uncertain effects near decision thresholds and the need to change policies outside PFT laboratories. In a small 2026
        survey dominated by academic pulmonologists, 54% reported that their laboratory used a race-neutral equation.
