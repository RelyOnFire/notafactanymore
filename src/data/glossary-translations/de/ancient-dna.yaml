locale: de
entryId: ancient-dna
sourceReviewedAt: '2026-08-21'
term: Alte DNA
aliases:
- aDNA
- archäogenetische DNA
shortDefinition: DNA, die aus archäologischen, fossilen oder historischen Überresten statt aus lebenden Organismen gewonnen
  wird.
longDefinition: Alte DNA, häufig aDNA abgekürzt, ist genetisches Material aus alten biologischen Überresten wie Knochen,
  Zähnen, erhaltenem Gewebe oder Sedimenten. Da DNA zerfällt und Kontamination ein großes Problem darstellt, verwendet
  die Forschung spezielle Labor- und statistische Verfahren. Große Genomdatensätze können Abstammung, Populationswechsel,
  Migration, Domestikation und evolutionäre Beziehungen im Zeitverlauf rekonstruieren.
