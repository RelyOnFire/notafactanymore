locale: de
entryId: leprosy-compulsory-segregation
sourceReviewedAt: '2026-08-24'
title: Lepra als Grund für langandauernde verpflichtende Isolation
claim: Menschen mit Lepra wurden als so gefährlich behandelt, dass sie langfristig zwangsweise abgesondert werden
  müssten, obwohl wirksame Chemotherapie eine pauschale Isolationspolitik medizinisch unnötig gemacht hatte.
currentUnderstanding: Lepra ist übertragbar, doch die Übertragung erfordert typischerweise längeren engen Kontakt
  mit einem unbehandelten Fall. Wirksame Mehrfachtherapie beendet die Infektiosität rasch; laut WHO überträgt ein
  Patient die Krankheit nach Beginn der Behandlung nicht mehr. Medizinische Behandlung und Nachsorge können nötig
  sein, eine langandauernde pauschale Absonderung behandelter Patienten jedoch nicht.
impact:
  summary: Japan hielt an einem Segregationssystem fest, lange nachdem seine medizinische Grundlage weggefallen
    war. Die staatliche Aufarbeitung der Hansen-Krankheit kam zu dem Ergebnis, dass Chemotherapie Isolation unnötig
    gemacht hatte und der Gesundheitsminister spätestens 1960 über genügend Wissen verfügte, dies zu erkennen. Der
    gesetzliche Rahmen blieb dennoch bis 1996 bestehen.
  highlights:
  - value: '1960'
    label: Die spätere amtliche Prüfung sah die medizinische Grundlage der Segregation spätestens zu diesem Zeitpunkt
      als nicht mehr tragfähig an
  - value: 36 Jahre
    label: Vom repräsentativen Korrekturpunkt 1960 bis zur Aufhebung 1996 blieb das Segregationssystem bestehen
  - value: '1996'
    label: Japan hob das Leprosy Prevention Law auf und beendete den gesetzlichen Segregationsrahmen
  context:
  - Unbehandelte Lepra kann übertragen werden. Korrigiert wird nicht die Aussage „Lepra ist niemals ansteckend“,
    sondern die Annahme, nach wirksamer Behandlung bleibe langandauernde Zwangsisolation zur Infektionskontrolle
    erforderlich.
episodes:
- id: japan-1960-1996
  polity: Japan
  institutions:
  - Ministry of Health and Welfare of Japan
  institutionalContext: Japans Segregationspolitik begann wesentlich früher. 1960 wird hier als belastbarer Beginn
    der institutionellen Fehlerphase verwendet, weil die spätere staatliche Prüfung feststellte, dass der Gesundheitsminister
    spätestens damals über das notwendige medizinische Wissen verfügte oder es leicht hätte beschaffen können, um
    die Unnötigkeit der Isolation zu erkennen. Gesetz und Politik blieben dennoch bis 1996 bestehen.
  summary: Japan hielt an einem gesetzlichen Segregationssystem für Menschen mit Hansen-Krankheit fest, nachdem
    wirksame Chemotherapie pauschale Isolation medizinisch unnötig gemacht hatte. Die spätere staatliche Untersuchung
    kam zu dem Ergebnis, dass die medizinische Rechtfertigung spätestens um 1960 nicht mehr tragfähig war und die
    offizielle Politik die Vorstellung fortschrieb, Patienten seien weiterhin gefährlich. Das Leprosy Prevention
    Law wurde erst 1996 aufgehoben.
  consequences:
  - Fortgesetzte Absonderung und Unterbringung von Menschen mit Hansen-Krankheit
  - Massive Einschränkungen von Familienleben, Wohnort und gesellschaftlicher Teilhabe
  - Staatliche Verstärkung des Stigmas, Patienten seien weiterhin gefährlich
  - Jahrzehntelange Grundrechtsverletzungen nach Wegfall der medizinischen Rechtfertigung für pauschale Isolation
