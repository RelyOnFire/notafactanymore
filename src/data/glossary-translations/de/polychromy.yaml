term: Polychromie
aliases: []
shortDefinition: Die Verwendung mehrerer Farben an einem Kunstwerk oder Bauwerk.
longDefinition: Bei antiken Skulpturen kann Polychromie gemalte Pigmente, Vergoldung, Einlagen und die gezielte Farbgestaltung von Kleidung, Haaren, Augen oder Haut umfassen.
