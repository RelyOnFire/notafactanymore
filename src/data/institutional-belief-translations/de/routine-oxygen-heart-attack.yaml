  - id: oxygen-2004-carrier
    note: Die Leitlinie bewertete zusätzlichen Sauerstoff für alle unkomplizierten STEMI-Patienten in den ersten sechs Stunden als Klasse IIa bei Evidenzgrad C; für dokumentierte Hypoxämie galt zugleich eine stärkere Empfehlung.
  - id: oxygen-2004-mechanism
  - id: oxygen-2013-consequences
    note: Die spätere Leitlinie stellt fest, dass nur wenige Daten die Routinegabe stützten, nennt eine mögliche Übersterblichkeit in zusammengefassten Studien, verweist auf erhöhten koronaren Gefäßwiderstand und betont die Anwendung bei Hypoxämie.
  - id: oxygen-deto2x-consequences
    note: DETO2X-AMI randomisierte 6.629 Patienten mit vermutetem Myokardinfarkt und einer Sauerstoffsättigung von mindestens 90 Prozent; Routine-Sauerstoff senkte weder die Einjahressterblichkeit noch erneute Krankenhausaufnahmen wegen Myokardinfarkts.
  - id: oxygen-2013-institutional-correction
  - id: oxygen-2025-institutional-correction
    note: Die aktuelle Leitlinie empfiehlt Sauerstoff bei bestätigter Hypoxie und bewertet Routine-Sauerstoff bei ACS und einer Sättigung von mindestens 90 Prozent anhand randomisierter Evidenz als Klasse III — kein Nutzen.
