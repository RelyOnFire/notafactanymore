evidence:
- id: virginity-who-correction
  sourceId: virginity-who
  relation: supports
  target:
    scope: belief
    aspect: correction
  locator: >-
    Publication overview: paragraphs on hymenal appearance, the absence of a valid examination, and physical,
    psychological and social harm.
  note: >-
    WHO states that hymenal appearance cannot reliably indicate intercourse and that no known examination can
    prove a history of vaginal intercourse. The overview also describes physical, psychological and social harm.
    It establishes the scientific assessment and general risks, rather than adoption or correction by a particular
    country.
- id: virginity-turkey-proposition
  sourceId: virginity-turkey-hrw
  relation: supports
  target:
    scope: belief
    aspect: proposition
  locator: >-
    Introduction; IV, Abuse of Women in Custody (including the 1986 case at note 46); V, Abuse of Female Students;
    VII, The Role of Doctors; passages on judicial/prosecutorial authorization.
  note: >-
    Human Rights Watch documents state-ordered examinations intended to determine “virginity,” including police,
    gendarmes, forensic doctors, schools, dormitories, hospitals and detainees. The report includes a 1986 case
    and distinguishes actual orders from the court or prosecutor authorization required for some examinations.
- id: virginity-turkey-carrier
  sourceId: virginity-turkey-hrw
  relation: documents
  target:
    scope: episode
    episodeId: turkey-1986-1998
    aspect: carrier
  locator: >-
    Introduction; IV, Abuse of Women in Custody (including the 1986 case at note 46); V, Abuse of Female Students;
    VII, The Role of Doctors; passages on judicial/prosecutorial authorization.
  note: >-
    Documents state-ordered virginity examinations in the 1980s and early 1990s involving police, gendarmes, forensic
    doctors, schools, dormitories, hospitals and detainees. Sections on custody, students and doctors identify
    the different institutional roles, reported coercion and harms. Some police orders bypassed required authorization;
    the report is evidence of institutional conduct, not proof that all such orders were lawful.
- id: virginity-turkey-mechanism
  sourceId: virginity-turkey-hrw
  relation: supports
  target:
    scope: episode
    episodeId: turkey-1986-1998
