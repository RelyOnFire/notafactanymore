term: Prion
aliases:
- prions
- prion protein
shortDefinition: An infectious protein form that can propagate by inducing normally folded versions of the same
  protein to adopt the same abnormal shape.
longDefinition: 'A prion is an infectious agent composed principally of protein and lacking its own DNA or RNA genome.
  Its propagation depends on protein conformation: an abnormal form can induce normally folded copies of the host
  protein to adopt the same misfolded state. The host genome still encodes the normal protein; what the infectious
  agent lacks is a separate nucleic-acid genome.'
relatedTerms: []
reviewedAt: '2026-08-21'
sources:
- title: The Nobel Prize in Physiology or Medicine 1997 – Press release
  url: https://www.nobelprize.org/prizes/medicine/1997/press-release/
  publisher: The Nobel Prize
  note: States that prion particles are proteins and, unlike other known infectious agents, lack nucleic acid.
