term: Jebel Irhoud
aliases: []
shortDefinition: A fossil site in Morocco that yielded early Homo sapiens remains dated to roughly 315,000 years ago.
longDefinition: Jebel Irhoud in Morocco preserves human fossils and Middle Stone Age artifacts dated to about 315,000
  years ago. The fossils combine relatively modern facial and dental features with a more archaic braincase. Their age
  and anatomy helped extend the known roots of Homo sapiens toward 300,000 years and broaden the geography of early human
  evolution beyond East Africa.
relatedTerms:
- mosaic-anatomy
reviewedAt: '2026-08-21'
sources:
- title: New fossils from Jebel Irhoud, Morocco and the pan-African origin of Homo sapiens
  url: https://www.nature.com/articles/nature22336
  publisher: Nature
  note: Describes approximately 315,000-year-old fossils attributed to an early phase of the Homo sapiens lineage.
