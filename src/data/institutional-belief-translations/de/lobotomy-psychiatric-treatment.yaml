locale: de
entryId: lobotomy-psychiatric-treatment
sourceReviewedAt: '2026-08-24'
title: Lobotomie als wirksame psychiatrische Behandlung
claim: Das Durchtrennen oder Zerstören von Verbindungen im Frontallappen wurde als therapeutisch wirksam genug behandelt,
  um die Lobotomie als reguläre institutionelle Therapie bei Schizophrenie und anderen schweren psychiatrischen
  oder verhaltensbezogenen Zuständen zu rechtfertigen.
currentUnderstanding: Die großflächigen präfrontalen und transorbitalen Lobotomien des 20. Jahrhunderts waren durch
  die Evidenz nicht ausreichend gerechtfertigt, um ihren breiten und irreversiblen Einsatz zu tragen. Frühe Erfolgsangaben
  beruhten stark auf unkontrollierten Fallserien und auf Kriterien wie geringerer Unruhe oder leichterer institutioneller
  Betreuung. Die Ergebnisse waren uneinheitlich; zu den schweren Schäden gehörten Persönlichkeits- und kognitive
  Veränderungen, Apathie oder Enthemmung, Krampfanfälle, neurologische Schäden und Tod. Manche Patientinnen und
  Patienten wurden als gebessert beschrieben, doch dies belegte nicht, dass große destruktive Frontallappenläsionen
  eine spezifische oder verhältnismäßige Therapie waren. Moderne psychiatrische Neurochirurgie arbeitet wesentlich
  gezielter bei seltenen, streng ausgewählten therapieresistenten Erkrankungen und ist nicht mit der historischen
  Lobotomie gleichzusetzen.
impact:
  summary: Die Lobotomie entwickelte sich von einem experimentellen Eingriff zu einer Behandlung in staatlichen
    Krankenhäusern und nationalen Psychiatriesystemen, obwohl die Wirksamkeit unsicher und die neurologischen Schäden
    irreversibel waren. Die institutionelle Anerkennung reichte von staatlichen Kliniken und der US-Veteranenverwaltung
    bis zum Nobelpreis von 1949 für den behaupteten therapeutischen Wert der Leukotomie. In mehreren Systemen galt
    auch eine bessere Beherrschbarkeit schwer gestörter Anstaltspatienten als Erfolg.
  highlights:
  - value: '1949'
    label: Nobelpreis für den behaupteten therapeutischen Wert der Leukotomie bei bestimmten Psychosen
  - value: 47 VA-Kliniken
    label: waren bis Juni 1950 in den USA für Lobotomieprogramme zugelassen
  - value: ≈4.500
    label: Menschen wurden während der schwedischen Lobotomieära operiert
  context:
  - Der historische Irrtum betrifft die großflächigen destruktiven Lobotomieverfahren der 1930er bis 1970er Jahre.
    Moderne stereotaktische und neuromodulatorische psychiatrische Neurochirurgie verwendet andere Techniken,
    Indikationen und Evidenz und ist nicht mit der historischen Lobotomie gleichzusetzen.
  - Berichte über Besserungen einzelner lobotomierter Patientinnen und Patienten belegen keine allgemeine Wirksamkeit.
    Institutionen werteten geringere Unruhe, Aggression, Entlassung oder leichtere Stationsführung häufig als
    therapeutischen Erfolg. Diese Ergebnisse müssen gegen irreversible Veränderungen von Kognition, Antrieb und
    Persönlichkeit sowie gegen die schwache Kontrolle vieler damaliger Studien abgewogen werden.
episodes:
- id: united-states-va-1944-1960
  polity: Vereinigte Staaten — Veterans Administration
  institutions:
  - United States Veterans Administration
  - Neuropsychiatrische Kliniken der Veterans Administration
  institutionalContext: Die Veterans Administration institutionalisierte die Frontallobotomie in ihrem psychiatrischen
    System während und nach dem Zweiten Weltkrieg. Der Jahresbericht 1944 dokumentierte spezielle ärztliche Ausbildung
    und die Einführung der präfrontalen Lobotomie an mehreren Kliniken. Bis Juni 1950 waren 47 VA-Kliniken für Lobotomieprogramme
    zugelassen und mehr als 1.400 psychiatrische VA-Patienten operiert worden, überwiegend Menschen mit chronischer
    Schizophreniediagnose. Gleichzeitig startete die Behörde eine kooperative Studie, weil die tatsächliche Wirksamkeit
    weiterhin unsicher war. Das Forschungsprogramm lief in den 1950er Jahren weiter, während Psychopharmaka die
    Lobotomie zunehmend verdrängten.
  summary: Die US-Veteranenverwaltung übernahm die präfrontale Lobotomie während und nach dem Zweiten Weltkrieg
    als Behandlung schwerer psychischer Erkrankungen. 1950 waren Programme an 47 Kliniken zugelassen und mehr als
    1.400 Veteranen operiert worden. Die Behörde bezeichnete den Eingriff als geeignete Behandlung ausgewählter
    Fälle, obwohl eigene Forschende bereits festgestellt hatten, dass behauptete Vorteile sich nicht klar in Entlassung
    oder selbstständigem Leben widerspiegelten. Deshalb wurde eine vergleichende Mehrklinikstudie durchgeführt.
    Gegen Ende der 1950er Jahre verlor das Massenprogramm mit dem Aufstieg der Psychopharmakologie und strengeren
    Kontrollen seine Grundlage.
  consequences:
  - Irreversible Hirnoperationen an hospitalisierten Veteranen mit psychiatrischen Diagnosen
  - Großflächige institutionelle Anwendung in Dutzenden Bundeskliniken
  - Persönlichkeits- und Verhaltensänderungen teilweise als therapeutischer Erfolg bewertet
  - Risiko von Krampfanfällen, neurologischen Schäden, Abhängigkeit und Tod
  - Fortgesetzte klinische Nutzung, während das System noch untersuchte, welche Patienten überhaupt profitierten
- id: sweden-1944-1964
  polity: Schweden
  institutions:
  - Medicinalstyrelsen (Schwedische Gesundheitsbehörde)
  - Umedalens sjukhus
  - Sidsjöns sjukhus
  - Schwedisches System staatlicher psychiatrischer Krankenhäuser
  institutionalContext: Schwedische Neurochirurgen und Psychiater begannen 1944 mit präfrontalen Lobotomien. Die
    staatlichen psychiatrischen Kliniken Umedalen und Sidsjön führten die Methode 1946–1947 in großem Umfang ein;
    anschließend verbreitete sie sich landesweit, wobei ärztliche Klinikleiter von der staatlichen Gesundheitsverwaltung
    weitgehende Autonomie erhielten. Historische Forschung schätzt rund 4.500 schwedische Lobotomien. Frauen stellten
    die Mehrheit, Schizophrenie war die häufigste Diagnose. In Umedalen wurden 1947–1958 insgesamt 771 Lobotomien
    mit einer postoperativen Mortalität von 7,4 % durchgeführt. 1949 verstärkte der Nobelpreis an Egas Moniz für
    den therapeutischen Wert der Leukotomie die internationale fachliche Anerkennung.
  summary: Schweden übernahm die Lobotomie nach ihrer Einführung 1944 rasch, darunter große Programme in den staatlichen
    psychiatrischen Kliniken Umedalen und Sidsjön. Insgesamt wurden ungefähr 4.500 Menschen lobotomiert, am häufigsten
    wegen Schizophrenie, während die staatliche Gesundheitsbehörde die konkrete Durchführung weitgehend den Klinikleitern
    überließ – auch dort, wo die Mortalität hoch war. Allein Umedalen führte 771 Eingriffe mit 7,4 % postoperativer
    Mortalität durch. In den 1950er Jahren ging die Nutzung zurück, hielt sich jedoch bis in die frühen 1960er Jahre.
  consequences:
  - Tausende irreversible psychoschirurgische Eingriffe in psychiatrischen Einrichtungen
  - Überproportional hoher Anteil von Frauen unter den Operierten
  - Erhebliche postoperative Mortalität in einzelnen staatlichen Kliniken
  - Lobotomien durch Allgemeinchirurgen auch in Häusern ohne spezialisierte Neurochirurgie
  - Persönlichkeitsveränderung und Verhaltensberuhigung konnten als Behandlungserfolg gewertet werden
- id: norway-1941-1974
  polity: Norwegen
  institutions:
  - Norwegische psychiatrische Krankenhäuser
  - Gaustad sykehus
  - Norwegische Gesundheitsbehörden
  institutionalContext: 'Norwegische psychiatrische Kliniken begannen 1941 am Gaustad-Krankenhaus mit Lobotomien;
    in den folgenden Jahren verbreitete sich die Methode auf die meisten Krankenhäuser und blieb bis in die 1970er
    Jahre in Gebrauch. Die späteren staatlichen Entschädigungsakten zeigen auch den damaligen Einwilligungsrahmen
    ungewöhnlich klar: Eine ausdrückliche Zustimmung des Patienten, Vormunds oder der Angehörigen war nach den damaligen
    Regeln nicht zwingend erforderlich. In den 1990er Jahren untersuchte Norwegen die Praxis landesweit und richtete
    eine allgemeine Entschädigungsregelung für alle nachweislich zwischen 1941 und 1974 lobotomierten Personen ein.'
  summary: Norwegen setzte Lobotomien in psychiatrischen Krankenhäusern von 1941 bis 1974 ein. Spätere staatliche
    Untersuchungen hielten fest, dass der Eingriff damals vom Fach als vertretbar angesehen worden war, obwohl er
    irreversible Folgen, Persönlichkeitsveränderungen, Epilepsie und Todesfälle verursachte und ohne heutige Einwilligungsstandards
    vorgenommen werden konnte. Nach einer nationalen Untersuchung schuf die Regierung eine allgemeine Entschädigungsregelung
    für Betroffene.
  consequences:
  - Irreversible Psychoschirurgie ohne heutigen Einwilligungsstandard
  - Persönlichkeitsveränderungen sowie kognitive oder funktionelle Beeinträchtigungen
  - Erhöhtes Risiko für Epilepsie und andere neurologische Folgeschäden
  - Mit dem Eingriff verbundene Todesfälle
  - Spätere landesweite staatliche Entschädigung für überlebende Betroffene
