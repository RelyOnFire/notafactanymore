term: Cosmic microwave background
aliases:
- CMB
- cosmic background radiation
shortDefinition: Faint microwave radiation left from the early universe, released when the cosmos became transparent
  about 380,000 years after the Big Bang.
longDefinition: The cosmic microwave background, or CMB, is relic radiation from the hot early universe. It was released
  when matter cooled enough for electrons and nuclei to combine into neutral atoms, allowing photons to travel freely.
  Tiny temperature and polarization variations in the CMB preserve information about the early universe and strongly
  constrain the amounts of ordinary matter, dark matter, dark energy, and other cosmological parameters.
relatedTerms:
- dark-matter
- dark-energy
reviewedAt: '2026-08-21'
sources:
- title: The Universe's Building Blocks
  url: https://science.nasa.gov/universe/overview/building-blocks/
  publisher: NASA
  note: Describes the cosmic inventory and the role of cosmological observations in measuring it.
