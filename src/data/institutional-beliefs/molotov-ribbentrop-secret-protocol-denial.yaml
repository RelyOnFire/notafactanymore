title: Molotov–Ribbentrop secret protocol as a Western fabrication
claim: >-
  Postwar Soviet institutions maintained an official historical narrative in which Western-published evidence for a
  secret additional protocol to the 1939 Soviet-German non-aggression pact was treated as falsified or unauthenticated,
  denying an authentic agreement that divided Eastern Europe into German and Soviet spheres of interest.
currentUnderstanding: >-
  The Soviet Union and Nazi Germany signed a secret additional protocol on 23 August 1939 alongside the public
  non-aggression treaty. It divided areas from the Baltic to the Black Sea into German and Soviet spheres of interest.
  On 24 December 1989 the USSR Congress of People's Deputies formally confirmed that the protocol had been signed and
  existed, condemned the secret arrangements and declared them legally invalid from the moment of signature. The
  original Soviet protocol was later recovered from the Soviet archival record and is now held by the Archive of
  Foreign Policy of the Russian Federation.
category: History, diplomacy and state propaganda
reviewedAt: '2026-08-25'
impact:
  summary: >-
    The secret protocol was concealed at the time of the pact and, after German diplomatic records were published in the
    West, became the subject of a long Soviet state counter-narrative. In 1948 the Soviet Information Bureau answered the
    U.S. publication Nazi-Soviet Relations with Falsifiers of History, attacking the released documentary record as a
    falsification campaign while presenting the 1939 pact and subsequent Soviet moves as defensive. The protocol itself
    remained outside the authorized account. Under glasnost the line began to break: in August 1988 APN chairman Valentin
    Falin publicly said there was no basis to call the secret protocols fake. In December 1989 the Congress of People's
    Deputies formally acknowledged their existence and condemned their signing.
  highlights:
  - value: 41 years
    label: from the 1948 Soviet state counter-publication to formal Soviet acknowledgment of the secret protocol in 1989
  - value: 23 August 1939
    label: date the secret additional protocol was signed alongside the public non-aggression treaty
  - value: 24 December 1989
    label: date the USSR Congress of People's Deputies formally confirmed and condemned the secret protocol
  context:
  - >-
    The 1948 Soviet Information Bureau pamphlet Falsifiers of History is important evidence of the institutional
    counter-narrative because it was issued specifically against the Western publication of captured German diplomatic
    records. It does not, however, explicitly discuss the secret additional protocol by name. The pamphlet therefore does not support a verbatim claim that it explicitly denied the protocol's existence.
  - >-
    The official Soviet position was already beginning to change before the December 1989 resolution. On 16 August 1988
    APN chairman Valentin Falin said that, despite the absence of originals then available to the public, there were no
    grounds to regard the secret protocols as a fake; Russian archival historians describe this as a serious change in
    the official Soviet position.
  - >-
    The 1989 Congress stated that originals had not then been found and relied on examinations of copies, maps, other
    documents and the correspondence between the protocol and subsequent events. The Soviet original was found later.
    The Russian Presidential Library now catalogs the original secret protocol as held by the Archive of Foreign Policy
    of the Russian Federation, so the 1989 statement about missing originals no longer describes the archival situation.
episodes:
- id: soviet-union-1948-1989
  polity: Soviet Union
  region: Eurasia
  startYear: 1948
  endYear: 1989
  strength: officially-endorsed
  institutionTypes:
  - government
  institutions:
  - Soviet Information Bureau
  - Communist Party of the Soviet Union
  institutionalContext: >-
    In January 1948 the U.S. State Department published captured German diplomatic records in Nazi-Soviet Relations,
    including documentary evidence of secret Soviet-German arrangements. The Soviet Information Bureau, operating as
    an official state information organ, replied with Falsifiers of History and framed the Western release as a
    falsification campaign while advancing a defensive account of Soviet policy in 1939. Across the following decades
    Soviet public historiography denied or excluded an authentic secret protocol dividing spheres of interest. That
    position became increasingly untenable under glasnost. Falin's August 1988 APN press conference publicly rejected
    the assumption that the protocols were fake, and on 24 December 1989 the Congress of People's Deputies formally
    confirmed that the secret additional protocol had been signed and existed.
  consequences:
  - Decades of state-sponsored historical narrative excluding an authentic secret agreement from the public account of 1939 diplomacy
  - Continued archival concealment of the Soviet documentary record for the protocol
  - Distortion of the publicly authorized explanation for Soviet policy toward Poland, the Baltic states, Finland and Bessarabia
  - A major late-Soviet historical controversy that became entangled with political mobilization in the Baltic republics
  - Formal congressional acknowledgment in 1989 that the secret arrangements contradicted the sovereignty and independence of third states
  summary: >-
    The Soviet response to postwar publication of the German diplomatic archive did more than defend the wisdom of the
    1939 non-aggression pact: it helped sustain an official historical account in which the secret protocol dividing
    spheres of interest was denied or treated as Western falsification. The documentary question became politically
    explosive under glasnost. An official crack appeared in 1988 when APN chairman Valentin Falin said there was no
    basis to call the protocols fake. The Congress of People's Deputies completed the reversal in December 1989 by
    confirming that the protocol existed, condemning its signing and declaring the secret arrangements legally invalid
    from their inception.
  sources:
