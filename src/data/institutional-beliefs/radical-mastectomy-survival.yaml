title: Radical mastectomy as the best route to breast-cancer survival
entryId: radical-mastectomy-best-survival
claim: The most extensive routine removal of the breast, axillary lymph nodes and chest muscles was treated as giving women with operable breast cancer the best chance of survival because the disease was expected to spread outward in an orderly local-to-regional sequence.
currentUnderstanding: For many patients with early breast cancer, more extensive local surgery does not improve overall survival. Randomized trials showed no survival advantage for Halsted radical mastectomy over less extensive surgery, and breast-conserving surgery followed by radiation can provide survival comparable to mastectomy for appropriately selected patients.
category: Cancer surgery and treatment standards
reviewedAt: '2026-08-27'
impact:
  summary: Halsted radical mastectomy became the dominant U.S. breast-cancer operation for much of the twentieth century. Its local-control logic exposed generations of women to removal of the chest muscles and extensive lymphatic tissue, with substantial disfigurement, arm swelling and functional impairment, before randomized trials showed that greater surgical extent did not improve survival.
  context:
  - Radical mastectomy was an important advance over earlier surgery because it greatly improved local control at a time when anesthesia, antisepsis and cancer surgery were rapidly developing.
  - The correction does not mean mastectomy itself is obsolete. Mastectomy remains appropriate in many circumstances; what failed was the rule that routinely removing more local tissue necessarily improved survival.
