        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7110946/
        publisher: History and Philosophy of the Life Sciences
        note: Documents the March 1949 proclamation of the New Biology as Poland's official paradigm, curriculum changes, suppression of genetics, and the collapse of the doctrine in 1956.
      - title: Lysenkoism Against Genetics
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6499510/
        publisher: Genetics
        note: Reviews the administrative introduction of Michurinist biology in Poland and its disappearance from official mass discourse after 1956.
