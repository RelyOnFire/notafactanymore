    summary: After the 1948 VASKhNIL session, Lysenko's anti-Mendelian biology received state backing while orthodox geneticists were dismissed, laboratories were closed, and genetics teaching and research were restricted. The national prohibition unraveled only after Khrushchev's removal in 1964.
    sources:
