term: Redshift
aliases:
- redshifts
- cosmological redshift
shortDefinition: A shift of observed light toward longer wavelengths; for distant galaxies, cosmological redshift mainly
  reflects the expansion of space during the light's journey.
longDefinition: Redshift describes an increase in the observed wavelength of light. It can arise in several ways, including
  relative motion, gravity, and cosmic expansion. For distant galaxies and gamma-ray burst hosts, cosmological redshift
  provides a key measure related to distance and the expansion history of the universe.
relatedTerms:
- afterglow
reviewedAt: '2026-08-21'
sources:
