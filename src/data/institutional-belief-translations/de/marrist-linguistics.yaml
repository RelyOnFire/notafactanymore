entryId: marrist-linguistics
sourceReviewedAt: 2026-08-22
title: Marristische Linguistik
claim: Sprachen wurden als Produkte universeller, klassenbedingter Entwicklungsstufen behandelt und nicht in erster Linie als historisch entstandene Sprachfamilien; die traditionelle vergleichende Sprachwissenschaft galt damit als „bürgerlich“ oder wissenschaftlich überholt.
currentUnderstanding: Sprachen verändern sich durch historisch nachvollziehbare Abstammung, Sprachkontakt, Entlehnung, Innovation und gesellschaftlichen Gebrauch. Die vergleichende Linguistik kann genealogische Beziehungen zwischen Sprachfamilien rekonstruieren; Sprachen durchlaufen keine universelle Abfolge klassenbestimmter Entwicklungsstufen.
episodes:
  - id: soviet-union-1930-1950
    polity: Sowjetunion
    summary: Ab etwa 1930 wurde Nikolai Marrs „Neue Lehre von der Sprache“ zum offiziell anerkannten Rahmen, der die sowjetische Linguistik dominierte. Traditionelle vergleichende und indogermanische Sprachwissenschaft wurde als „bürgerlich“ angegriffen; erhebliche Abweichungen von den marristischen Grundlagen wurden stark unterdrückt. 1950 verwarf Stalin Marrismus abrupt, worauf die Doktrin ebenso administrativ abgebaut wurde, wie sie zuvor erhoben worden war.
    consequences:
      - Unterdrückung konkurrierender sprachwissenschaftlicher Schulen
      - Verzerrung sprachwissenschaftlicher Forschung
      - Politische Kontrolle akademischer Laufbahnen
