schemaVersion: 2
locale: de
entryId: steam-inhalation-covid-treatment
sourceReviewedAt: 2026-08-24
title: Dampfinhalation als wirksames Mittel gegen COVID-19
proposition:
  summary: >-
    Tansania behandelte Dampfinhalation und verwandte traditionelle Präparate während der COVID-19-Pandemie als
    erfolgreiche Heil- und Schutzmittel, schrieb ihnen öffentlich Genesungen und breiten therapeutischen Erfolg zu
    und schuf offiziellen Zugang zu zugelassenen Präparaten, bevor hinreichende Evidenz eine Wirkung gegen COVID-19
    als Behandlung oder Prävention belegt hatte.
correction:
  summary: >-
    Dampfinhalation kann die oberen Atemwege befeuchten und vorübergehend subjektive Beschwerden lindern. Das ist jedoch
    etwas anderes als eine SARS-CoV-2-Infektion zu verhindern oder die zugrunde liegende Viruserkrankung zu behandeln.
    Belastbare Evidenz etablierte Dampfinhalation nicht als wirksame COVID-19-Behandlung oder Präventionsmethode.
    Übersichtsarbeiten während und nach der Pandemie beschrieben die Evidenz als unzureichend beziehungsweise
    wissenschaftlich ungeklärt; zugleich dokumentierte die Verbrennungsmedizin ein reales Risiko schwerer Verbrühungen.
    Auch traditionelle Präparate benötigen produktspezifische Belege für Sicherheit und Wirksamkeit, statt diese aus
    traditioneller Nutzung oder anekdotischer Genesung abzuleiten.
impact:
  summary: >-
    Tansanias COVID-19-zeitliche Förderung ging über private Volksmedizin hinaus. Im Mai 2020 veröffentlichte das
    Präsidialamt die Schilderung des Präsidenten, sein Sohn sei von COVID-19 genesen, während er Zitrone und Ingwer
    konsumiert und Dampfinhalationen angewandt habe. Im August erklärte das Gesundheitsministerium, traditionelle
    Therapien hätten dem Land während des Corona-Ausbruchs erheblich geholfen, und berichtete von mehr als 100.018
    Nutzern traditioneller Mittel, ausdrücklich einschließlich der Nyungu-Dampfinhalation, mit beträchtlichem Erfolg.
    Im Februar 2021 verfolgte das Ministerium eine breitere Verfügbarkeit zugelassener traditioneller Präparate über
    Gesundheitseinrichtungen und Apotheken, darunter flüchtige Öle zur Dampfinhalation. Unter der folgenden Regierung
    verlangte ein staatliches Expertengremium, traditionelle Arzneimittel nur bei wissenschaftlichem Wirksamkeitsnachweis
    einzusetzen; zugleich schwenkte das Land auf Impfungen und international abgestimmte COVID-19-Maßnahmen um.
  highlights:
    - value: Mai 2020
      label: Das Präsidialamt veröffentlichte eine COVID-19-Genesung im Zusammenhang mit Zitrone, Ingwer und Dampfinhalation
    - value: '>100.018'
      label: Das Gesundheitsministerium meldete Nutzer traditioneller Mittel einschließlich Nyungu-Dampfinhalation und sprach von beträchtlichem Erfolg
    - value: '2021'
      label: Ein präsidiales Expertengremium verlangte wissenschaftliche Belege für traditionelle Arzneimittel
  context:
    - >-
      Dampf kann subjektive Beschwerden lindern, und die in Tansania geförderten traditionellen Präparate waren nicht
      sämtlich chemisch identisch. Der unbelegte institutionelle Schritt bestand darin, aus Anekdoten, Nutzung und
      sicherheitsbezogener Zulassung Aussagen und Politik abzuleiten, die einen relevanten therapeutischen Nutzen gegen COVID-19 nahelegten.
    - >-
      2021 verlagerte sich die nationale COVID-19-Politik hin zu wissenschaftlicher Expertenprüfung, Impfungen und dem
      Grundsatz, traditionelle Arzneimittel nur bei wissenschaftlichem Nachweis einzusetzen. Dieser Kurswechsel war
      kein formales gesetzliches Verbot der Dampfinhalation.
episodes:
  - id: tanzania-2020-2021
    polity: Tansania
    institutions:
      - Office of the President of Tanzania
      - Ministry of Health, Community Development, Gender, Elderly and Children
      - Traditional and Alternative Health Practice Council
    institutionalContext: >-
      Im ersten Pandemiejahr verliehen Mitteilungen des Präsidialamts und des Gesundheitsministeriums Dampfinhalation
      und traditionellen Mitteln offizielle therapeutische Legitimität. Das Präsidialamt veröffentlichte Präsident
      John Magufulis Aussage, sein Sohn habe COVID-19 gehabt und sei genesen, während er Zitrone und Ingwer zu sich genommen
      und Dampfinhalationen angewandt habe. Im August 2020 erklärte das Gesundheitsministerium, traditionelle Therapien
      hätten Tansania während des Corona-Ausbruchs erheblich geholfen, und meldete mehr als 100.018 Nutzer traditioneller
      Mittel einschließlich Nyungu-Dampfinhalation mit beträchtlichem Erfolg. Im Februar 2021 kündigte das Ministerium
      eine Strategie an, zugelassene traditionelle Arzneimittel über Gesundheitseinrichtungen und Apotheken leichter
      verfügbar zu machen, und nannte sowohl orale Präparate als auch flüchtige Öle zur Dampfinhalation. Nach dem
      Amtsantritt von Präsidentin Samia Suluhu Hassan änderte sich das politische Umfeld: Ein von ihr eingesetztes
      Expertengremium empfahl traditionelle Arzneimittel nur bei wissenschaftlichem Nachweis und sprach sich für
      Impfungen sowie international abgestimmte COVID-19-Maßnahmen aus.
    consequences:
      - Präsidiale Verstärkung von Dampfinhalation als Bestandteil einer vermeintlichen COVID-19-Genesung
      - Zuschreibung beträchtlicher Pandemieerfolge an traditionelle Mittel einschließlich Nyungu-Dampfinhalation durch das Gesundheitsministerium
      - Staatliche Zulassung und Zugangsplanung für traditionelle orale und zur Dampfinhalation bestimmte Präparate über Gesundheitseinrichtungen und Apotheken
      - Öffentliche Exposition gegenüber einem für COVID-19 unzureichend belegten Mittel mit dokumentiertem Verbrühungsrisiko
    summary: >-
      Tansania verlieh Dampfinhalation und verwandten traditionellen Mitteln während der COVID-19-Pandemie ungewöhnlich
      starke staatliche Legitimität. Präsident John Magufuli verband die Genesung seines Sohnes öffentlich mit Zitrone,
      Ingwer und Dampfinhalation; später erklärte das Gesundheitsministerium, traditionelle Mittel hätten dem Land
      während des Ausbruchs erheblich geholfen, und berichtete von mehr als 100.018 Nutzern einschließlich Nyungu-Anwendern.
      Anfang 2021 plante das Ministerium eine breitere Verfügbarkeit zugelassener traditioneller Präparate, darunter
      flüchtige Öle zur Dampfinhalation. Die folgende Regierung änderte den Kurs: Ein präsidiales Expertengremium verlangte
      wissenschaftliche Belege für traditionelle Arzneimittel und unterstützte Impfungen und international abgestimmte
      Maßnahmen. Wissenschaftliche Übersichtsarbeiten etablierten Dampfinhalation nicht als wirksame COVID-19-Behandlung
      oder Prävention; klinische Berichte dokumentierten zugleich erhebliche Verbrühungsrisiken.
    mechanism:
      summary: >-
        Präsidialamt und Gesundheitsministerium schrieben Dampfinhalation und verwandten traditionellen Mitteln öffentlich
        therapeutischen Erfolg zu; zugleich plante das Ministerium eine breitere Verfügbarkeit zugelassener oraler und
        zur Dampfinhalation bestimmter Präparate.
    institutionalCorrection:
      periodLabel: '2021'
      action: Ein präsidiales Expertengremium verlangte wissenschaftliche Belege für traditionelle Arzneimittel; die Regierung schwenkte zugleich auf Impfungen und international abgestimmte COVID-19-Maßnahmen um.
      summary: >-
        Die folgende Regierung ersetzte die frühere permissive therapeutische Rahmung durch einen Evidenzgrundsatz und
        eine stärker wissenschaftlich ausgerichtete COVID-19-Politik; ein formales dampfspezifisches Verbot oder eine
        vollständige Rücknahme sämtlicher früherer Aussagen ist jedoch nicht dokumentiert.
evidence:
  - id: steam-presidency-proposition
    note: >-
      Amtliche Mitteilung des Präsidialamts über Präsident John Magufulis Aussage, sein Sohn habe COVID-19 gehabt und sei
      genesen, während er Zitrone und Ingwer konsumiert und Dampfinhalationen angewandt habe. Sie dokumentiert die
      präsidiale Förderung der Praxis, belegt aber für sich keine Kausalität.
  - id: steam-review-correction
    note: >-
      Übersichtsarbeit von 2022, die zu dem Ergebnis kommt, Dampfinhalation verfüge nicht über die wissenschaftliche
      Grundlage, um als angemessene COVID-19-Praxis etabliert zu werden, und die klinische Evidenz sei wissenschaftlich ungeklärt.
  - id: steam-burns-correction
    note: >-
      Klinischer Bericht von 2020, der die Evidenzbasis der Dampfinhalation als schwach beschreibt und in einem
      Kinderverbrennungszentrum im ersten Lockdown-Monat einen 30-fachen Anstieg von Verbrühungen durch Dampfinhalation dokumentiert.
  - id: steam-health-impact
    note: >-
      Amtlicher Bericht des Gesundheitsministeriums vom 31. August 2020, wonach traditionelle Mittel Tansania während
      des Corona-Ausbruchs erheblich geholfen hätten; genannt werden mehr als 100.018 Nutzer traditioneller Arzneien
      einschließlich Nyungu-Dampfinhalation mit beträchtlichem Erfolg.
  - id: steam-presidency-carrier
  - id: steam-health-mechanism
    note: >-
      Amtlicher Ministeriumsbericht vom 6. Februar 2021 über eine Regierungsstrategie, akzeptierte traditionelle
      Arzneimittel über Gesundheitseinrichtungen und Apotheken leichter verfügbar zu machen; genannt werden orale
      Präparate und flüchtige Öle zur Dampfinhalation.
  - id: steam-health-consequences
  - id: steam-policy-partial-correction
    note: >-
      Amtliche Regierungsdarstellung des Politikwechsels 2021: Präsidentin Samia Suluhu Hassan verlangte professionelle
      Forschung; das Expertengremium empfahl traditionelle Arzneimittel nur bei wissenschaftlichem Nachweis sowie
      Impfungen, Datenerfassung und international abgestimmte Präventionsmaßnahmen.
