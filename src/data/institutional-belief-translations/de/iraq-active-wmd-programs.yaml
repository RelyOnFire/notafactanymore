  institutionalContext: Auf Bitte von Mitgliedern des Kongresses erstellte der National Intelligence Council im
    Oktober 2002 das NIE „Iraq's Continuing Programs for Weapons of Mass Destruction“. Zu den zentralen Aussagen
    gehörte, Bagdad besitze chemische und biologische Waffen; sein biologisches Potential sei größer und weiter
    entwickelt als vor dem Golfkrieg; es verfüge über mobile Produktionsanlagen für biologische Kampfstoffe; die
    Chemiewaffenproduktion sei wieder aufgenommen worden und der Bestand liege bei 100–500 Tonnen; außerdem gingen
    die meisten Behörden davon aus, dass der Irak sein Kernwaffenprogramm wieder aufbaue. Public Law 107-243 übernahm
    fortbestehende chemische, biologische und nukleare Fähigkeiten in seine Feststellungen und ermächtigte zum Einsatz
    militärischer Gewalt. Im März 2003 begannen die US-geführten Kampfhandlungen. Die Nachkriegsuntersuchungen widersprachen
    den zentralen WMD-Einschätzungen; 2005 stellte die präsidiale Kommission offiziell ein schweres Nachrichtendienstversagen
    fest.
  consequences:
  - Aufnahme falscher Aussagen zu aktiven Massenvernichtungswaffen in die Feststellungen von Public Law 107-243
  - Weitreichende gesetzliche Ermächtigung des Präsidenten zum Einsatz der US-Streitkräfte gegen den Irak
  - Verwendung der WMD-Einschätzungen in exekutiven und diplomatischen Argumenten für die Abrüstung des Irak
  - Öffentliche Aussagen führender Regierungsvertreter, die teilweise größere Gewissheit vermittelten oder über
    die vorhandene Nachrichtendienstlage hinausgingen
  - Verwendung erfundener oder unzuverlässiger Quellenberichte, die in Analyse und Führung nicht ausreichend geprüft
    oder relativiert wurden
  - US-geführte Invasion im März 2003, nachdem die angenommenen aktiven Bestände und Programme Teil der politischen
    Begründung geworden waren
  - Umfassende nachträgliche Untersuchungen und Reformen der Nachrichtendienste nach dem Scheitern der zentralen
    Einschätzungen
  - Langfristiger Glaubwürdigkeitsverlust für US-Nachrichtendienste und amtliche Aussagen über Waffenprogramme
  summary: Die angenommenen irakischen Massenvernichtungswaffen wurden zu einem institutionellen Glauben mit außergewöhnlich
    hohen Folgen. Das NIE von 2002 verdichtete bruchstückhafte und teilweise unzuverlässige Hinweise zu selbstbewussten
    Urteilen über chemische und biologische Waffen sowie ein erneuertes Kernwaffenprogramm. Der Kongress übernahm
    vergleichbare WMD-Behauptungen in die Tatsachenfeststellungen der Kriegsermächtigung. Die Suche nach der Invasion
    ergab dagegen, dass die wichtigsten Aussagen über aktive Programme und Bestände falsch waren. Amtliche Untersuchungen
    fanden keinen Beleg dafür, dass Analysten der Intelligence Community angewiesen worden waren, ihre Urteile zu
    fälschen; sie dokumentierten jedoch schwere Fehler bei Quellen, Analyse und Führung. Eine spätere Senatsprüfung
    stellte zusätzlich fest, dass manche öffentlichen Aussagen führender Regierungsvertreter die vorhandene Nachrichtendienstlage
    übertrieben oder überschritten.
