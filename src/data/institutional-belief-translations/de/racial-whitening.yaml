locale: de
entryId: racial-whitening
sourceReviewedAt: 2026-08-22
title: Rassische „Aufhellung“
claim: Ein höherer Anteil europäischer Abstammung durch Einwanderung und Eheschließungen wurde als biologischer Weg behandelt, die Nation „weißer“ zu machen und zu verbessern.
currentUnderstanding: Menschliche Populationen bilden keine biologische Hierarchie von minder- zu höherwertigen „Rassen“, und ein größerer Anteil einer gesellschaftlich als „weiß“ definierten Abstammung verbessert eine Bevölkerung nicht biologisch. „Rasse“ ist eine soziale Einteilung, die genetische Abstammungsmuster nur unvollkommen abbildet.
episodes:
  - id: brazil-1890-1930
    polity: Brasilien
    summary: In der Ersten Brasilianischen Republik war die Vorstellung politisch einflussreich, europäische Einwanderung und rassische Vermischung könnten Brasilien schrittweise „weißer“ machen. Die Einwanderungspolitik förderte Europäer finanziell, während die Regelungen von 1890 die Einwanderung aus Afrika und Asien beschränkten und dem Whitening-Projekt institutionelle Wirkung verliehen.
    consequences:
      - Subventionierte europäische Einwanderung
      - Beschränkung afrikanischer und asiatischer Einwanderung
      - Rassifizierte Bevölkerungspolitik
