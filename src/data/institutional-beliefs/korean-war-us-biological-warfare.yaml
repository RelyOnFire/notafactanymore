      scope: belief
      aspect: proposition
    locator: S/PV.587, printed pp. 1–5; vote at p. 5
    note: >-
      The official Security Council record documents debate over a proposed impartial investigation, the Soviet position
      and the first July veto. It establishes the USSR's diplomatic use of the allegation and opposition to investigation,
      not the truth of the wartime allegation itself.
  - id: korean-bw-resolution-correction
