term: Gray
aliases:
  - Gy
  - nGy
  - nanogray
  - nanograys
shortDefinition: The SI unit of absorbed ionizing-radiation dose. One gray (Gy) means one joule of radiation energy absorbed per kilogram of matter; one nanogray (nGy) is one-billionth of a gray.
longDefinition: Gray measures how much ionizing-radiation energy is deposited in matter. It is an absorbed-dose unit, not by itself a measure of biological harm; sieverts (Sv) are used for radiation quantities that apply biological weighting. In the background-radiation card, 214 nGy per hour means an absorbed dose rate of 214 billionths of a joule per kilogram each hour. Popular "banana equivalent dose" comparisons are normally framed in sieverts, so they are not a direct conversion from gray.
