entryId: bone-histology
sourceReviewedAt: '2026-08-21'
term: Knochenhistologie
aliases:
- Histologie
- Osteohistologie
shortDefinition: Die mikroskopische Untersuchung von Knochengewebe, einschließlich Wachstumsmarken und Gewebestrukturen,
  die Hinweise auf Alter und Wachstumsgeschwindigkeit eines Tieres geben können.
longDefinition: Bei der Knochenhistologie werden dünne Schnitte fossiler oder rezenter Knochen mikroskopisch untersucht.
  Merkmale wie Gefäßversorgung, Wachstumslinien, Umbauprozesse und Veränderungen der Gewebestruktur können helfen, die
  Wachstumsgeschichte zu rekonstruieren und einzuschätzen, ob ein Individuum noch wuchs oder sich der Skelettreife näherte.
  In der Paläontologie werden solche Signale zusammen mit Anatomie und Erhaltungszustand bewertet.
