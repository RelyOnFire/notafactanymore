locale: de
entryId: pure-acupuncture-surgical-anesthesia
sourceReviewedAt: 2026-08-24
title: Reine Akupunktur als ausreichende Operationsanästhesie
claim: >-
  Akupunkturstimulation allein wurde als hinreichend verlässliche Anästhesie für ein breites Spektrum großer Operationen behandelt, darunter Eingriffe an Brustkorb und Bauch, und als möglicher Ersatz für Medikamentenanästhesie in Situationen mit knappen Narkosemitteln oder Geräten.
currentUnderstanding: >-
  Akupunktur kann analgetische Effekte beitragen und in ausgewählten perioperativen Situationen den Bedarf an Anästhetika verringern. Eine wache „reine Akupunkturanästhesie“ liefert bei großen Operationen jedoch nicht zuverlässig die vollständige Analgesie, Sedierung, Muskelrelaxation und physiologische Kontrolle, die erforderlich sind. Moderne chinesische Akupunkturanästhesie beschränkt sich auf ausgewählte Indikationen und kombiniert Akupunktur üblicherweise mit Anästhetika oder Analgetika, statt sie als universellen Ersatz zu behandeln.
impact:
  summary: >-
    China beschränkte sich nicht auf einzelne Experimente. Staatliche Wissenschafts- und Gesundheitsstellen organisierten ein nationales Forschungsprogramm und eine breite Einführung; Krankenhäuser und die Volksbefreiungsarmee setzten das Verfahren in großem Umfang klinisch ein. Spätere chinesische medizinische Darstellungen beschreiben die wahllose Ausweitung der reinen Akupunkturanästhesie selbst als Überdehnung und die heutige Praxis als enger gefasste Kombination aus Akupunktur und Medikamenten.
  highlights:
    - value: "1966"
      label: Staatliche Wissenschaftskommission und Gesundheitsministerium legten ein nationales Forschungsprogramm fest
    - value: "400.000+"
      label: Patienten, die laut Volkszeitung bis Juli 1971 unter Akupunkturanästhesie operiert worden waren
    - value: "1990er"
      label: Die meisten Krankenhäuser stellten die alten reinen Akupunkturoperationen ein, nachdem die Grenzen deutlicher geworden waren
  context:
    - >-
      Die institutionelle Überdehnung bestand in reiner oder nahezu reiner Akupunktur als hauptsächlicher Anästhesie für ein breites Spektrum großer Operationen, nicht in der Behauptung, Akupunktur habe keinerlei analgetische Wirkung. Moderne chinesische Teams untersuchen und verwenden Akupunktur weiterhin als Zusatz, mit dem sich Medikamentendosen reduzieren lassen.
    - >-
      Zeitgenössische und spätere chinesische Quellen zeigen außerdem eine uneinheitliche Praxis: Manche Teams verwendeten geringe Mengen lokaler oder zusätzlicher Medikamente; selbst damalige Berichte räumten unvollständige Schmerzstillung und Beschwerden bei der Manipulation innerer Organe ein. Die institutionelle Überdehnung bestand in der breiten Bewerbung als ausreichende Anästhesie für schlecht ausgewählte Operationen und Mangelsituationen, nicht in jedem einzelnen akupunkturunterstützten Eingriff.
episodes:
  - id: china-1966-1989
    polity: Volksrepublik China
    institutions:
      - Staatliche Wissenschafts- und Technologiekommission (国家科学技术委员会)
      - Gesundheitsministerium der Volksrepublik China (卫生部)
      - Militärkontrollkommission des Gesundheitsministeriums (卫生部军管会)
      - Allgemeines Krankenhaus der Chinesischen Volksbefreiungsarmee (中国人民解放军总医院)
    institutionalContext: >-
      Im Februar 1966 beriefen Staatliche Wissenschaftskommission und Gesundheitsministerium in Shanghai eine nationale Forschungstagung zur Akupunkturanästhesie ein und erarbeiteten einen Forschungsplan für 1966–1968; anschließend verbreitete sich das Verfahren landesweit. Im September 1969 erklärte die Militärkontrollkommission des Gesundheitsministeriums Akupunkturanästhesie zu einer wichtigen nationalen Aufgabe der medizinischen Kriegsvorbereitung. Krankenhäuser, lokale Gesundheitsdienste, Forschungsinstitute und medizinische Einheiten der Volksbefreiungsarmee setzten das Verfahren danach in großem Umfang ein. Seit den 1980er-Jahren wuchsen die Zweifel, und chinesische Rückblicke berichten, dass die meisten Krankenhäuser diese Operationen in den 1990er-Jahren einstellten; 1989 markiert damit das Ende des breit angewandten Modells der 1960er- bis 1980er-Jahre und keinen einzelnen wissenschaftlichen Wendepunkt.
    summary: >-
      Ausgehend von einem nationalen Forschungsplan von 1966 förderten chinesische Wissenschafts- und Gesundheitsbehörden Akupunkturanästhesie in Krankenhäusern und der Militärmedizin. 1971 berichtete die Volkszeitung von mehr als 400.000 unter Akupunkturanästhesie operierten Patienten, nannte eine Erfolgsquote von etwa 90 Prozent und hob den Einsatz dort hervor, wo Narkosemittel oder Geräte knapp waren. Das Verfahren wurde anschließend auf sehr viele Operationsarten ausgeweitet. Chinesische Rückblicke beschreiben diese Phase heute selbst als zu wahllose Ausdehnung: Reine Akupunktur konnte bei vielen Eingriffen keine vollständige Schmerzfreiheit, Sedierung oder Muskelrelaxation gewährleisten, und die meisten Krankenhäuser gaben das alte Modell in den 1990er-Jahren auf. Moderne chinesische Praxis setzt stattdessen auf ausgewählte Indikationen und eine kombinierte Akupunktur-Medikamenten-Anästhesie.
    consequences:
      - Nationale Forschungsplanung und großflächige klinische Einführung
      - Einsatz reiner Akupunkturanästhesie bei großen Thorax-, Bauch-, Schädel- und weiteren Operationen
      - Bewerbung für ländliche, gebirgige und kriegsbedingte Mangelsituationen als Alternative bei eingeschränkter Medikamentenanästhesie
      - Ausbildung und Verbreitung über Krankenhäuser, lokale Gesundheitsdienste und medizinische Einheiten der Volksbefreiungsarmee
