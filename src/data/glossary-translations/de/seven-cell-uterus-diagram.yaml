entryId: seven-cell-uterus-diagram
sourceReviewedAt: '2026-08-21'
term: Sieben-Zellen-Schema der Gebärmutter
aliases:
- Gebärmutter mit sieben Kammern
- Sieben-Kammern-Modell
shortDefinition: Ein mittelalterliches anatomisches Schema, das die Gebärmutter in sieben fetale Kammern unterteilte
  und diese männlichen, weiblichen oder intergeschlechtlichen Föten zuordnete.
longDefinition: Das Sieben-Zellen-Schema war eine überlieferte mittelalterliche Darstellung der Gebärmutter mit sieben
  Abteilungen, häufig drei auf jeder Seite und einer mittleren Kammer. Die Zellen wurden mit Theorien über fetales Geschlecht
  und Körperwärme verbunden. Trotz menschlicher Sektionen blieb das Modell in der gelehrten Anatomie bestehen, bis Renaissance-Anatomen
  es zunehmend durch direkte Beschreibungen einer einfachen Gebärmutterhöhle ersetzten.
