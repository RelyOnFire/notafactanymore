evidence:
  - id: slansky-vhu-proposition
    sourceId: slansky-vhu-indictment
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: paragraphs 1–9; description of Obrana lidu, paragraphs 10–12
    note: >-
      The state military-history account identifies the espionage, sabotage and conspiracy accusations, Josef Urválek's
      prosecutorial role, the designation of eleven defendants as being of Jewish origin and the six-page publication
      of the indictment in the army newspaper Obrana lidu.
  - id: slansky-vhu-correction
    sourceId: slansky-vhu-reicin
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: opening paragraphs 1–4
    note: >-
      Records the Military Collegium's annulment of Reicin's conviction on 17 May 1963 and distinguishes the fabricated,
      manipulated Slánský proceeding from separate abuses for which Reicin bore responsibility.
  - id: slansky-archive-correction
    sourceId: slansky-national-archives
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: introductory history, paragraphs beginning “Rudolf Slánský...” and “Interrogations...”
    note: >-
      The National Archives identifies the trial as fabricated and documents interrogation plans, Soviet-adviser review,
      cruel physical and psychological violence, predetermined confessions and rehearsed courtroom answers.
  - id: slansky-ustr-correction
    sourceId: slansky-ustr-rehabilitation
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: pp. 78–79, section “Rehabilitace”
    note: >-
      Describes the Kolder Commission's 1963 conclusion that the communist trials were fabricated and unlawful, the legal
      rehabilitation of the Slánský group and the review's effort to minimize responsibility of the KSČ leadership.
  - id: slansky-vhu-impact
    sourceId: slansky-vhu-reicin
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: paragraphs beginning “Gottwald, pod nátlakem Moskvy...” through “Proces měl v Československu...”
    note: >-
      Records the 14 defendants, scripted testimony, more than 8,500 supportive petitions, eleven death sentences,
      three life sentences, Gottwald's refusal of clemency and the executions during the night of 3 December 1952.
  - id: slansky-archive-impact
    sourceId: slansky-national-archives
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: introductory history and film-recording catalogue, especially final arguments and verdict
    note: >-
      Documents all sentences, the production of audio and film for propaganda, selected radio broadcasts, the
      prosecutor's demand for death for all defendants and filmed statements accepting the sentences.
  - id: slansky-vhu-carrier
    sourceId: slansky-vhu-reicin
