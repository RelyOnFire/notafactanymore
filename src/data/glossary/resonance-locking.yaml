term: Resonance locking
aliases:
- resonance lock
shortDefinition: A tidal-evolution mechanism in which a moon's orbital frequency stays coupled to a changing natural
  oscillation frequency inside its planet.
longDefinition: In resonance locking, the internal structure of an evolving giant planet changes slowly, causing one
  of its natural oscillation frequencies to drift. A moon can remain near resonance with that mode as its orbit also
  evolves. The sustained resonance can maintain strong tidal energy transfer and drive orbital migration faster than
  a model based on a fixed tidal response would predict.
relatedTerms:
- oscillation-mode
reviewedAt: '2026-08-21'
sources:
- title: Resonance locking in giant planets indicated by the rapid orbital expansion of Titan
  url: https://doi.org/10.1038/s41550-020-1120-5
  publisher: Nature Astronomy
  note: Presents resonance locking as an explanation for Titan's unexpectedly rapid outward tidal migration.
