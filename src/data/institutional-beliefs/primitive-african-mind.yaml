title: The “primitive African mind”
claim: Colonial psychiatric authorities treated Africans as psychologically primitive, governed more by instinct or “magical” thinking and less by higher reasoning than Europeans.
currentUnderstanding: There is no scientifically valid unitary “African mind,” and racial ancestry does not place populations on a hierarchy of cognitive development. Human cognition and mental health vary among individuals and are shaped by biology, development, culture, environment, education, and social conditions.
category: Colonial psychiatry
reviewedAt: 2026-08-22
episodes:
