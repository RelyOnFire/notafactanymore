evidence:
  - id: turkish-history-white-lilies-proposition
    sourceId: turkish-history-white-lilies
    relation: documents
    target: {scope: belief, aspect: proposition}
    note: Describes state-sponsored efforts to establish Turks as members of the white Alpine race, the Turkish History Congresses, and the large anthropometric survey associated with Afet İnan.
  - id: turkish-history-maarif-proposition
    sourceId: turkish-history-maarif
    relation: documents
    target: {scope: belief, aspect: proposition}
    note: >-
      Defines the thesis as early Republican official history policy and records its claims that white, brachycephalic
      Central Asian Turks founded civilizations including those of China, India, Egypt, Mesopotamia, Anatolia, Greece and Rome.
  - id: turkish-history-aaba-correction
    sourceId: turkish-history-aaba-race
    relation: supports
    target: {scope: belief, aspect: correction}
    note: >-
      The professional association's 2019 statement explains that race does not accurately represent human biological
      variation and that humans are not divided into discrete continental types or racial genetic clusters.
  - id: turkish-history-genetics-correction
    sourceId: turkish-history-genetics
    relation: supports
    target: {scope: belief, aspect: correction}
    note: >-
      Genome and exome data from 3,362 unrelated individuals show high variation and extensive admixture in the modern
      population of Turkey rather than a pure, bounded racial type.
  - id: turkish-history-anatolia-correction
    sourceId: turkish-history-anatolia-dna
    relation: supports
    target: {scope: belief, aspect: correction}
    note: >-
      Ancient DNA from central Anatolia finds substantial local hunter-gatherer continuity into early farming alongside
      later Iranian/Caucasus-related and Levantine ancestries, contradicting a single-race civilizational origin story.
  - id: turkish-history-ttk-impact
    sourceId: turkish-history-ttk-history
    relation: supports
    target: {scope: belief, aspect: impact}
    note: >-
      Official institutional history documents the four-volume school series and the first two congresses, while tracing
      the history committee's 1930 formation, its 1931 incorporation and its 1935 renaming.
  - id: turkish-history-survey-impact
    sourceId: turkish-history-survey-primary
    relation: documents
    target: {scope: belief, aspect: impact}
    note: >-
      The survey author's primary report states that 64,000 forms were collected and that final calculations covered
      59,728 people—39,465 men and 20,263 women—after incorrect and incomplete forms were excluded.
  - id: turkish-history-ttk-curriculum-carrier
    sourceId: turkish-history-ttk-history
    relation: documents
    target: {scope: episode, episodeId: turkey-curriculum-1930-1941, aspect: carrier}
    note: Official institutional history stating that the society prepared the four-volume secondary-school history books and that they were published under the Maarif Vekâleti.
  - id: turkish-history-maarif-curriculum-mechanism
    sourceId: turkish-history-maarif
    relation: documents
    target: {scope: episode, episodeId: turkey-curriculum-1930-1941, aspect: mechanism}
    note: >-
      Describes the condensed outline's use in middle schools, the four-volume Tarih series in high schools and the 1932
      congress as an official vehicle for presenting the thesis to teachers and scholars.
  - id: turkish-history-white-lilies-curriculum-consequences
    sourceId: turkish-history-white-lilies
    relation: supports
    target: {scope: episode, episodeId: turkey-curriculum-1930-1941, aspect: consequences}
    note: >-
      Documents the state-sponsored 1932 and 1937 congresses and the claim presented there that Central Asian ancestors
      of the Turks had spread civilization outward.
  - id: turkish-history-maarif-curriculum-consequences
    sourceId: turkish-history-maarif
    relation: supports
    target: {scope: episode, episodeId: turkey-curriculum-1930-1941, aspect: consequences}
    note: >-
      Records the thesis's deep effect on history teaching and explains that evidence was made to fit a proposition treated
      at the first congress as a truth beyond ordinary scientific dispute.
  - id: turkish-history-maarif-curriculum-correction
