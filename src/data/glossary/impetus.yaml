term: Impetus
aliases:
- impetus theory
shortDefinition: A medieval theory in which a mover imparts a continuing motive tendency to a projectile, allowing it
  to keep moving after contact ends.
longDefinition: In Jean Buridan's influential fourteenth-century impetus theory, the thrower impresses an impetus into
  the projectile. That impressed quality keeps the object moving until resistance and other influences diminish or overcome
  it. Impetus was an important step away from external air-push explanations, but it was not yet Newtonian inertia because
  continued motion was still attributed to a positive internal cause.
relatedTerms:
- antiperistasis
reviewedAt: '2026-08-21'
sources:
- title: John Buridan
  url: https://plato.stanford.edu/entries/buridan/
  publisher: Stanford Encyclopedia of Philosophy
  note: Explains Buridan's impetus theory and its relation to earlier Aristotelian accounts of projectile motion.
