term: Bipedalismus
aliases:
- Zweibeinigkeit
- zweibeinig
- habituelle Bipedie
shortDefinition: Fortbewegung auf zwei Beinen; in der menschlichen Evolution bedeutet habituelle Zweibeinigkeit, regelmäßig
  aufrecht auf zwei Beinen zu gehen.
longDefinition: Bipedalismus bezeichnet Fortbewegung auf zwei Beinen. Die habituelle Zweibeinigkeit des Menschen zeigt
  sich in mehreren anatomischen Anpassungen unter anderem an Becken, Wirbelsäule, Oberschenkel, Knie, Fuß und Schädel.
  Diese Merkmale entwickelten sich schrittweise, und regelmäßiges aufrechtes Gehen entstand lange vor der starken Gehirnvergrößerung
  bei späteren Vertretern der Gattung Homo.
