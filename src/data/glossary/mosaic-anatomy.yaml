term: Mosaic anatomy
aliases:
- mosaic of traits
- mosaic evolution
shortDefinition: A combination of ancestral and more derived anatomical traits in the same organism or fossil.
longDefinition: Mosaic anatomy describes organisms that combine traits at different evolutionary stages rather than fitting
  a simple all-old or all-modern pattern. In early Homo sapiens fossils, for example, relatively modern facial features
  can occur alongside a more archaic braincase. Such combinations are evidence that evolutionary change often proceeds
  in different anatomical systems at different rates.
relatedTerms:
- jebel-irhoud
reviewedAt: '2026-08-21'
sources:
- title: New fossils from Jebel Irhoud, Morocco and the pan-African origin of Homo sapiens
  url: https://www.nature.com/articles/nature22336
  publisher: Nature
  note: Discusses the combination of derived facial morphology and more archaic neurocranial shape in the Jebel Irhoud
    fossils.
