term: Metagenomics
aliases: []
shortDefinition: The study of genetic material taken directly from a mixed sample, without first growing each microorganism separately in the laboratory.
longDefinition: Metagenomics reads DNA from entire communities in samples such as seawater, soil, or the human gut. It can reveal organisms and genes that routine laboratory culture misses.
reviewedAt: '2026-08-21'
sources:
- title: The uncultured microbial majority
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC419844/
  publisher: Annual Review of Microbiology
  note: Reviews the large fraction of environmental microbial diversity that ordinary cultivation misses and the molecular approaches used to study it.
