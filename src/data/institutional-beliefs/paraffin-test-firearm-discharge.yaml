evidence:
  - id: paraffin-guinoban-proposition
    sourceId: guinoban-1944
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: Opinion, paraffin-test testimony and assessment of Leonardo Guinoban's guilt
    note: Documents Philippine Constabulary use of the paraffin-diphenylamine test in 1941 and expert testimony treating nitrate distribution as a strong indication of firearm discharge.
  - id: paraffin-esteban-proposition
    sourceId: esteban-1981
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: Opinion, Case of Esteban
    note: The Supreme Court stated that the NBI paraffin test “proved” that Esteban had fired a gun shortly before his arrest.
  - id: paraffin-nist-correction
    sourceId: nist-primer-gsr-guide
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: pp. 28 and 75–76
    note: >-
      Explains the paraffin test's false-positive and false-negative problem, identifies SEM/EDS as the preferred modern
      method, and states that even modern positive or negative GSR findings do not by themselves establish whether a person fired.
  - id: paraffin-ojp-correction
    sourceId: ojp-gsr-tests
    relation: supports
    target: {scope: belief, aspect: correction}
    note: Describes the paraffin test as discredited because of nonspecificity and contrasts it with more specific modern gunshot-residue techniques.
  - id: paraffin-guinoban-impact
    sourceId: guinoban-1944
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: Opinion, paraffin-test testimony and assessment of Leonardo Guinoban's guilt
    note: The 1944 opinion counted the positive result among three stated grounds for finding Guinoban guilty, while also relying on a confession and a dying declaration.
  - id: paraffin-barte-impact
    sourceId: barte-1994
    relation: documents
    target: {scope: belief, aspect: impact}
    locator: Opinion, discussion of the negative diphenylamine test
    note: Marks an explicit Supreme Court rejection of both the positive-source inference and the claim that a negative test excludes firing.
  - id: paraffin-pna-2026-impact
    sourceId: pna-marines-2026
    relation: documents
    target: {scope: belief, aspect: impact}
    note: Records a Philippine Navy spokesperson treating negative PNP paraffin results as showing Marines were not directly involved in a 2026 shooting and had “come out clean.”
  - id: paraffin-guinoban-carrier
    sourceId: guinoban-1944
    relation: documents
    target: {scope: episode, episodeId: philippines-1941-present, aspect: carrier}
    note: Identifies the Philippine Constabulary chemist who performed the tests and the Supreme Court opinion that credited the positive result.
  - id: paraffin-esteban-carrier
    sourceId: esteban-1981
    relation: documents
    target: {scope: episode, episodeId: philippines-1941-present, aspect: carrier}
    note: Documents NBI Forensic Chemistry Division testing and the Supreme Court's source-specific interpretation in a later case.
  - id: paraffin-pna-2021-carrier
    sourceId: pna-female-cop-2021
    relation: documents
    target: {scope: episode, episodeId: philippines-1941-present, aspect: carrier}
    note: Official Philippine government news report from 2021 records the PNP chief citing a positive paraffin test as evidence in an investigation of alleged firearm discharge.
  - id: paraffin-pna-2026-carrier
