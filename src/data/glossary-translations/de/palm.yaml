locale: de
entryId: palm
sourceReviewedAt: '2026-08-21'
term: PALM
aliases:
- Photoactivated Localization Microscopy
shortDefinition: Ein Superauflösungsverfahren, das jeweils nur wenige photoaktivierbare Fluoreszenzmoleküle lokalisiert
  und viele Zyklen zu einem fein aufgelösten Bild kombiniert.
longDefinition: Bei der Photoactivated Localization Microscopy oder PALM wird jeweils nur eine kleine Gruppe fluoreszierender
  Marker aktiviert, sodass sich ihre beugungsverbreiterten Lichtflecken kaum überlagern. Dadurch kann die Position einzelner
  Moleküle sehr genau geschätzt werden. Viele Wiederholungen und die Kombination Tausender Lokalisationen ergeben ein
  superaufgelöstes Bild.
