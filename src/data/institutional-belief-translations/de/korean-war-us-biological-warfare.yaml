schemaVersion: 2
locale: de
entryId: korean-war-us-biological-warfare
sourceReviewedAt: '2026-09-24'
title: US-amerikanische biologische Kriegführung im Koreakrieg
proposition:
  summary: >-
    Die sowjetische Regierung billigte und verbreitete offiziell die Behauptung, US-Streitkräfte betrieben in Korea und
    China bakteriologische Kriegführung, trug die Anschuldigung in die internationale Diplomatie und stellte sich gegen
    eine unabhängige Untersuchung. Später ausgewertete sowjetische interne Akten berichteten außerdem, dass Angehörige
    ihrer Militär- und Beratermission in Nordkorea bei der Inszenierung angeblicher Beweise geholfen hatten.
correction:
  summary: >-
    Nach Stalins Tod ausgewertete sowjetische Akten bezeichnen die veröffentlichten Informationen als falsch und die
    Anschuldigungen als erfunden. Sie berichten, sowjetische Berater hätten zwei Infektionsgebiete fingiert, und
    dokumentieren Beschlüsse vom April und Mai 1953: Das Thema sollte bei den Vereinten Nationen nicht weiter gefördert,
    Peking und Pjöngjang sollten zum Ende der Veröffentlichungen und zum taktischen Rückzug aus internationalen Gremien
    angehalten und verantwortliches sowjetisches Personal bestraft werden. Dies war eine interne Kehrtwende und ein
    diplomatischer Rückzug, kein öffentliches sowjetisches Eingeständnis. Die USA unterhielten damals ein
    Biowaffen-Forschungsprogramm; daraus folgt jedoch nicht, dass sie im Koreakrieg tatsächlich biologische Waffen einsetzten.
impact:
  summary: >-
    Die Behauptung über bakteriologische Kriegführung wurde zu einer formellen sowjetischen internationalen Position. Im
    Februar 1952 erklärte Stalin Mao Zedong, die sowjetische Regierung werde die geplanten Maßnahmen aktiv unterstützen;
    sowjetische Vertreter wiederholten den Vorwurf bei den Vereinten Nationen. Die UdSSR blockierte anschließend mit ihrem
    Veto zunächst einen Entwurf für eine unparteiische Untersuchung durch das Rote Kreuz und danach einen zweiten Entwurf,
    der die Fabrikation und Verbreitung der Anschuldigungen verurteilte. Später veröffentlichte interne Akten berichteten,
    sowjetische Berater hätten in Nordkorea falsche Infektionsgebiete vorbereitet. Nach Stalins Tod stufte die sowjetische
    Führung die Anschuldigungen intern als erfunden ein und fuhr die Kampagne zurück, ohne öffentlich einzuräumen, dass
    ihre frühere Position falsch gewesen war.
  highlights:
    - value: '2'
      label: fingierte Infektionsgebiete, die laut einem sowjetischen Vermerk von 1953 zur Beschuldigung der USA inszeniert worden waren
    - value: 10–1 / 9–1–1
      label: Abstimmungsergebnisse zu den beiden Entwürfen im UN-Sicherheitsrat im Juli 1952, die jeweils am sowjetischen Veto scheiterten
    - value: 2. Mai 1953
      label: Datum des internen sowjetischen Beschlusses, der die Anschuldigungen als erfunden bezeichnete und das Ende der Kampagne empfahl
  context:
    - >-
      Die 1998 veröffentlichte Sammlung von zwölf sowjetischen Dokumenten war im russischen Präsidentenarchiv von Hand
      abgeschrieben und anschließend abgetippt worden; Forschende hatten weder die Originale noch Fotokopien mit Stempeln,
      Unterschriften oder Archivsignaturen. Die Akten entstanden zudem im Umfeld eines Machtkampfs nach Stalins Tod und
      einer geheimdienstlichen Untersuchung, in der erzwungene Aussagen ein bekanntes Risiko waren. Redaktion und Autoren
      hielten die Dokumente aufgrund ihrer textlichen und historischen Zusammenhänge für glaubwürdig, ohne diese Grenzen auszublenden.
    - >-
      Die russische Archivveröffentlichung verwandter sowjetischer Nachrichten im Jahr 2010 und spätere Archivforschung
      stärkten das Gesamtbild der offiziellen sowjetischen Unterstützung und ihres Rückzugs nach Stalins Tod. Die Akten von
      1953 bleiben fragmentarisch: Sie dokumentieren unmittelbar zwei inszenierte Orte und die sowjetische institutionelle
      Reaktion, nicht jeden von chinesischen oder nordkoreanischen Stellen behaupteten Vorfall.
    - >-
      Die Existenz eines US-amerikanischen Biowaffen-Forschungsprogramms ist von der Frage zu unterscheiden, ob
      US-Streitkräfte die konkret behaupteten biologischen Angriffe in Korea und China tatsächlich durchführten. Die
      späteren sowjetischen Akten betreffen die zweite Frage.
    - >-
      Chinesische und nordkoreanische Behörden waren ebenfalls zentral für die umfassendere Anschuldigung. Ihre
      institutionellen Akten und späteren Positionen haben eigene Dokumentationsgeschichten. Diese Episode beschränkt sich
      auf die offizielle sowjetische Verbreitung der Behauptung, die Beteiligung sowjetischen Personals an der Fabrikation
      angeblicher Beweise und die interne Reaktion der sowjetischen Führung.
episodes:
  - id: soviet-union-1952-1953
    polity: Sowjetunion
    institutions:
      - Präsidium des Ministerrats der UdSSR
      - Präsidium des Zentralkomitees der KPdSU
      - Außenministerium der UdSSR
      - sowjetische Delegation bei den Vereinten Nationen
      - sowjetische Militär- und Beratermission in Nordkorea
    institutionalContext: >-
      Am 23. Februar 1952 erklärte Stalin Mao Zedong, die sowjetische Regierung werde die geplante Kampagne aktiv
      unterstützen. Die sowjetische Diplomatie wiederholte die Anschuldigung und stellte sich gegen eine unabhängige
      Untersuchung. Am 3. Juli gab die UdSSR als einziges Mitglied eine Gegenstimme zum Entwurf S/2671 ab, der eine
      unparteiische Untersuchung durch das Internationale Komitee vom Roten Kreuz beantragt hätte. Am 9. Juli legte sie
      ihr Veto gegen S/2688 ein, einen anderen Entwurf, der die Fabrikation und Verbreitung der Anschuldigungen verurteilte.
      Nach Stalins Tod ausgewertete interne Akten berichteten, sowjetische Berater, darunter der Botschafter und oberste
      Militärberater General Wladimir Rasuwajew, hätten zwei falsche Infektionsgebiete geschaffen. Berias Vermerk vom
      21. April 1953 berichtete außerdem, zwei zum Tode verurteilte Koreaner seien infiziert und einer später vergiftet
      worden. Noch am selben Tag schlug Molotow vor, den sowjetischen UN-Vertreter anzuweisen, das Thema nicht weiter zu
      fördern. Am 2. Mai bezeichnete das Präsidium des Ministerrats die Anschuldigungen als erfunden und billigte
      Empfehlungen an China und Nordkorea, Veröffentlichungen einzustellen und das Thema taktisch aus
      internationalen Gremien zurückzuziehen. Moskau fuhr die Kampagne zurück, räumte die Unwahrheit seiner früheren
      Behauptungen aber nicht öffentlich ein.
    consequences:
      - Offizielle sowjetische Billigung und Verstärkung der Biowaffenanschuldigungen gegen die Vereinigten Staaten
      - Verwendung der Behauptung in der formellen Diplomatie der Vereinten Nationen
      - Sowjetisches Veto gegen einen Untersuchungsentwurf und ein zweites Veto gegen einen Entwurf zur Verurteilung der Fabrikation und Verbreitung
      - Beteiligung sowjetischen Personals an der Inszenierung zweier angeblicher Infektionsgebiete in Nordkorea
      - Bericht eines sowjetischen Vermerks, zwei zum Tode verurteilte Koreaner seien für die Fabrikation infiziert und einer später vergiftet worden
      - Anweisungen nach Stalins Tod, das Thema nicht weiter zu fördern, seinen internationalen Rückzug zu empfehlen und sowjetische Beteiligte zu bestrafen
      - Diplomatischer Rückzug ohne öffentliche sowjetische Rücknahme der Anschuldigung
    summary: >-
      Die Sowjetunion machte umstrittene Kriegsbehauptungen zu einer offiziellen diplomatischen Kampagne und blockierte
      eine unparteiische Untersuchung. Interne Akten berichteten später zugleich, Angehörige ihres eigenen Beraterapparats
      hätten angebliche Beweise hergestellt. Die Führung nach Stalin bezeichnete die Behauptungen in einem internen
      Beschluss als erfunden, wies ihren UN-Vertreter an, sie nicht weiter zu fördern, empfahl Peking und Pjöngjang das Ende
      der Kampagne und kündigte die Bestrafung sowjetischer Beteiligter an. Weil Moskau nie öffentlich einräumte, dass seine
      frühere Position falsch gewesen war, blieb die institutionelle Korrektur unvollständig.
    mechanism:
      summary: >-
        Sowjetische Staats- und Diplomatieorgane billigten und verbreiteten die Anschuldigung durch amtliche Kommunikation,
        Veröffentlichungen und UN-Diplomatie. Die sowjetische Delegation stellte sich gegen eine unabhängige Untersuchung,
        während Angehörige des sowjetischen Militär- und Beraterapparats an der Inszenierung angeblicher Beweise mitwirkten.
    institutionalCorrection:
      periodLabel: April–Juli 1953
      action: Die Führung wies ihren UN-Vertreter an, das Thema nicht weiter zu fördern, empfahl den Verbündeten das Ende der Veröffentlichungen und den Rückzug aus internationalen Gremien und kündigte die Bestrafung sowjetischer Beteiligter an der Fabrikation an.
      summary: >-
        Die sowjetische Führung vollzog innerhalb des Staatsapparats eine förmliche Kehrtwende und fuhr die diplomatische
        Unterstützung der Anschuldigung zurück. Sie übermittelte die Abkehr nichtöffentlich und vermied das öffentliche
        Eingeständnis, ihre früheren Behauptungen seien falsch gewesen; die institutionelle Korrektur blieb daher unvollständig.
evidence:
  - id: korean-bw-soviet-endorsement
    note: >-
      Stalins Antwort an Mao vom 23. Februar 1952 erklärt, die sowjetische Regierung stimme den geplanten Maßnahmen zu und
      werde sie aktiv unterstützen. Sie dokumentiert die offizielle sowjetische Billigung, nicht die Wahrheit der Anschuldigung.
  - id: korean-bw-un-proposition
    note: >-
      Das amtliche Protokoll des Sicherheitsrats dokumentiert die Debatte über eine vorgeschlagene unparteiische
      Untersuchung, die sowjetische Position und das erste Veto im Juli. Es belegt den diplomatischen Gebrauch der
      Anschuldigung und den Widerstand gegen eine Untersuchung, nicht die Wahrheit der Kriegsbehauptung selbst.
  - id: korean-bw-resolution-correction
    note: >-
      Die archivalische Rekonstruktion zitiert und belegt den Beschluss des Präsidiums vom 2. Mai 1953 aus dem Archiv des
      Präsidenten der Russischen Föderation. Er bezeichnet die veröffentlichten Informationen als falsch und die
      Anschuldigungen als erfunden und kündigt eine strenge Bestrafung sowjetischer Beteiligter an der Beweisfabrikation an.
  - id: korean-bw-resolution-impact
    note: >-
      Stellt Stalins Zusage aktiver sowjetischer Unterstützung vom Februar 1952 der internen Feststellung vom Mai 1953
      gegenüber, die Anschuldigungen seien erfunden, und dokumentiert so die offizielle Übernahme und Kehrtwende.
  - id: korean-bw-russian-impact
    note: >-
      Veröffentlicht Übersetzungen und Analysen sowjetischer Akten zur internationalen Kampagne, zur Inszenierung falscher
      Infektionsgebiete und zu den Beschlüssen vom April und Mai 1953, die Unterstützung der Anschuldigung zurückzufahren.
  - id: korean-bw-provenance-context
    note: >-
      Erläutert, dass die Akten von 1953 ohne Zugang zu Originalen, Stempeln, Unterschriften oder Archivsignaturen von Hand
      kopiert und abgetippt wurden. Behandelt werden auch der geheimdienstliche Kontext nach Stalin, das Risiko erzwungener
      Aussagen, ergänzende Akten und die Gründe, die Sammlung dennoch für glaubwürdig, aber unvollständig zu halten.
  - id: korean-bw-later-corroboration-context
    note: >-
      Erörtert die frühen Einwände gegen die Herkunft und verweist auf die RGASPI-Veröffentlichung verwandter Nachrichten
      zwischen Mao, Zhou und Stalin im Jahr 2010, die den Dokumentationszusammenhang stärkt, ohne die fragmentarischen Akten
      zu einer vollständigen Überlieferung zu machen.
  - id: korean-bw-us-program-context
    note: >-
      Behandelt das damalige US-Biowaffenprogramm und die dazugehörigen Grundsatzfragen. Diese Fähigkeit ist relevanter
      Kontext, aber kein Beleg dafür, dass die konkret behaupteten Angriffe in Korea und China stattfanden.
  - id: korean-bw-central-carrier
    note: >-
      Dokumentiert getrennte Rollen Berias, Molotows, des Präsidiums des Zentralkomitees der KPdSU, des Präsidiums des
      Ministerrats und des Außenministeriums; diese Institutionen werden in der Darstellung nicht gleichgesetzt.
  - id: korean-bw-russian-carrier
    note: >-
      Veröffentlicht die Aussagen und den Vermerk vom April 1953 darüber, wie General Wladimir Rasuwajew und andere
      Angehörige der sowjetischen Botschaft sowie des militärischen, geheimdienstlichen und medizinischen Beraterapparats
      bei falschen Infektionsgebieten und anderem angeblichen Beweismaterial halfen.
  - id: korean-bw-un-mechanism
    note: >-
      Dokumentiert, wie die Anschuldigung in der formellen Diplomatie des Sicherheitsrats wiederholt und verteidigt und eine unabhängige Untersuchung abgelehnt wurde.
  - id: korean-bw-russian-mechanism
    note: >-
      Beschreibt einen zweiten Mechanismus der Episode: die Beteiligung sowjetischer Berater an der Inszenierung falscher
      Orte und an der Vorbereitung von Material, das die öffentliche Anschuldigung stützen sollte.
  - id: korean-bw-un-first-veto
    note: >-
      Hält die Abstimmung zu S/2671 mit 10 zu 1 Stimmen fest. Alle anderen Ratsmitglieder unterstützten die Anforderung
      einer unparteiischen Untersuchung durch das Rote Kreuz; der Entwurf scheiterte an der einzigen Gegenstimme der UdSSR
      als ständigem Mitglied.
  - id: korean-bw-un-second-veto
    note: >-
      Hält die Abstimmung zu S/2688 mit 9 zu 1 Stimmen bei einer Enthaltung fest; die UdSSR stimmte dagegen, Pakistan
      enthielt sich. Der zweite Entwurf verurteilte die Fabrikation und Verbreitung der Anschuldigungen; er war kein zweiter
      Antrag zur Einleitung einer Untersuchung.
  - id: korean-bw-fabrication-consequences
    note: >-
      Die übersetzten Akten berichten von zwei inszenierten Infektionsgebieten. Berias Vermerk erklärt darüber hinaus, zwei
      zum Tode verurteilte Koreaner seien im Zuge der Fabrikation infiziert und einer später vergiftet worden.
  - id: korean-bw-resolution-consequences
    note: >-
      Dokumentiert die interne Feststellung der Führung, die Kampagne habe auf falschen Informationen beruht, sowie die
      angekündigte strenge Bestrafung sowjetischer Beteiligter an der Herstellung angeblicher Beweise.
  - id: korean-bw-resolution-institutional-correction
    note: >-
      Dokumentiert die Anweisung, das Thema bei den Vereinten Nationen nicht weiter zu fördern, den internen Beschluss vom
      2. Mai, die Empfehlungen an Peking und Pjöngjang zum Ende der Veröffentlichungen und zum taktischen Rückzug sowie die
      nichtöffentliche Übermittlung dieser Empfehlungen.
  - id: korean-bw-public-retraction-limit
    note: >-
      Neuere Forschung mit sowjetischen Archivbeständen ordnet die Anschuldigung als organisierte Kampagne ein und kommt zu
      dem Ergebnis, dass die Führung nach Stalin ihre Unterstützung zurückfuhr, ohne öffentlich die Unwahrheit der früheren
      Behauptungen einzuräumen.
