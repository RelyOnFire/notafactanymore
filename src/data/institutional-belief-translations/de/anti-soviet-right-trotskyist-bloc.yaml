entryId: anti-soviet-right-trotskyist-bloc
sourceReviewedAt: '2026-08-25'
title: Der „antisowjetische rechts-trotzkistische Block“ als Spionage- und Terrorverschwörung
claim: Sowjetische Partei-, Sicherheits-, Anklage- und Justizorgane behaupteten im dritten Moskauer Prozess von 1938, Nikolai
  Bucharin, Alexei Rykow und ihre Mitangeklagten hätten einen „antisowjetischen rechts-trotzkistischen Block“ gebildet, der
  gemeinsam mit ausländischen Nachrichtendiensten Spionage, Sabotage, Terror und Verrat betrieben und auf den Sturz sowie
  die Zerschlagung des Sowjetstaates hingearbeitet habe.
currentUnderstanding: Spätere sowjetische Justizprüfungen erklärten den Kern der strafrechtlichen Verschwörungsvorwürfe gegen
  die rehabilitierten Angeklagten für unbelegt. Der Oberste Gerichtshof der UdSSR fand keine Belege für Verbindungen Bucharins
  und Rykows zu ausländischen Geheimdiensten, keine Grundlage für das behauptete Netz krimineller Gruppen und stellte fest,
  dass zentrale Sabotagevorwürfe den tatsächlichen Umständen widersprachen. Zwanzig der 21 Angeklagten von 1938 wurden schließlich
  rehabilitiert. Der frühere NKWD-Chef Genrich Jagoda war die Ausnahme.
impact:
  summary: Der dritte Moskauer Prozess machte auf dem Höhepunkt des Großen Terrors aus einer konstruierten politischen Verschwörung
    eine öffentliche gerichtliche Tatsache. Im März 1938 standen 21 Angeklagte vor dem Militärkollegium des Obersten Gerichts
    der UdSSR. Achtzehn erhielten Todesurteile, drei langjährige Haftstrafen. Intensive staatliche Propaganda präsentierte
    ehemalige Spitzenfunktionäre als Spione, Saboteure, Terroristen und Agenten ausländischer Mächte. Jahrzehnte später hob
    der Sowjetstaat die Urteile für nahezu die gesamte Angeklagtengruppe auf.
  highlights:
  - value: '21'
    label: Angeklagte im dritten Moskauer Prozess
  - value: '18'
    label: im März 1938 zum Tode verurteilte Angeklagte
  - value: 20 von 21
    label: schließlich rehabilitierte Angeklagte; Genrich Jagoda blieb die Ausnahme
  context:
  - Die im dritten Moskauer Prozess konstruierte und verfolgte Verschwörung war von den Vorwürfen der früheren
    Sinowjew-Kamenew- und Pjatakow-Radek-Prozesse zu unterscheiden; dort standen andere Angeklagtengruppen im Zentrum.
  - Genrich Jagoda hatte als NKWD-Chef reale staatliche Verbrechen zu verantworten, die unabhängig von der erfundenen rechts-trotzkistischen
    Verschwörung standen. Bei der späteren Überprüfung wurde seine Rehabilitierung nicht beantragt.
  - Die heutige Dokumentenedition auf Grundlage von RGASPI, GARF und dem Zentralarchiv des FSB enthält die vollständige Prozessmitschrift
    mit redaktionellen Korrekturen Stalins. Die spätere Prüfung durch den Obersten Gerichtshof lieferte die entscheidende
    institutionelle Zurückweisung der strafrechtlichen Vorwürfe.
episodes:
