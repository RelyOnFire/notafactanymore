schemaVersion: 2
locale: de
entryId: homeopathy-effective-treatment
sourceReviewedAt: '2026-09-07'
title: Homöopathie als wirksame Behandlung
proposition:
  summary: >-
    Homöopathie wurde institutionell als medizinisch wirksame Therapie behandelt – stark genug, um öffentliche
    Bereitstellung, Erstattung, formelle Einbindung in Gesundheitssysteme oder ärztliche Zertifizierung zu rechtfertigen.
correction:
  summary: >-
    Für Homöopathie sind bei keiner bekannten Krankheit robuste und reproduzierbare therapeutische Wirkungen über den
    Placeboeffekt hinaus belegt. Zentrale Annahmen der Homöopathie – darunter Wirkungen extremer Verdünnungen, die kein
    Molekül des Ausgangsstoffs mehr enthalten können – sind mit etablierter Chemie und Pharmakologie nicht vereinbar.
    Zuwendung und Placeboeffekte können das subjektive Befinden beeinflussen, belegen aber keine spezifische Wirkung
    des homöopathischen Präparats. Eine 2024 abgeschlossene australische Evidenzbewertung fand Hinweise geringer
    Vertrauenswürdigkeit auf mögliche Vorteile gegenüber Placebo bei der Verringerung des Medikamentenverbrauchs bei
    allergischer Rhinitis und des Schweregrads atopischer Dermatitis. Viele andere untersuchte Ergebnisse zeigten
    wenig bis keinen Nutzen oder blieben ungewiss beziehungsweise unbekannt.
episodes:
  - id: united-kingdom-1948-2017
    polity: Vereinigtes Königreich
    periodLabel: 1948–2017 (bis zur Verordnungsempfehlung in England)
    institutions:
      - National Health Service
      - Royal London Homoeopathic Hospital
      - Bristol Homeopathic Hospital
      - Liverpool Homeopathic Hospital
      - Glasgow Homoeopathic Hospital
    institutionalContext: >-
      Homöopathie war im NHS über spezialisierte Krankenhäuser, hausärztliche Verordnungen und lokale Beauftragung
      verankert, nicht über eine einzige nationale Homöopathiebehörde. Der Unterhausbericht von 2010 benannte homöopathische
      Krankenhausangebote in London, Bristol, Liverpool und Glasgow. In England steuerten lokale Primary Care Trusts und
      spätere Beauftragungsstellen einen großen Teil von Finanzierung und Überweisungen. NHS England veröffentlichte
      2017 Verordnungsempfehlungen für die Primärversorgung in England.
    summary: >-
      Homöopathie wurde seit der Gründung des NHS 1948 öffentlich finanziert und angeboten, unter anderem über
      spezialisierte homöopathische Krankenhäuser und Verordnungen in der Primärversorgung. Eine Untersuchung des
      britischen Unterhauses kam 2010 zu dem Schluss, dass die Evidenz keine Wirksamkeit über Placebo hinaus stützte,
      und empfahl ein Ende der NHS-Finanzierung. 2017 empfahl NHS England, homöopathische Mittel in der Primärversorgung
      nicht neu zu verordnen und das Absetzen bestehender Verordnungen zu unterstützen, weil klare und belastbare
      Wirksamkeitsnachweise fehlten. Diese Verordnungsempfehlung galt für England.
    consequences:
      - Öffentliche Finanzierung homöopathischer Behandlung
      - Verordnungen und Überweisungen im NHS
      - Spezialisierte homöopathische Krankenhausangebote
    mechanism:
      summary: >-
        NHS-Institutionen finanzierten homöopathische Spezialangebote, Verordnungen und Überweisungen über Krankenhäuser,
        Primärversorgung und Beauftragungsstrukturen und verankerten die Therapie damit in der öffentlich bereitgestellten
        Gesundheitsversorgung.
    institutionalCorrection:
      periodLabel: '2017'
      action: NHS England empfahl den Beauftragungsstellen, homöopathische Mittel in der Primärversorgung nicht neu verordnen zu lassen und die Verordnenden beim Absetzen für alle bereits behandelten Patientinnen und Patienten zu unterstützen, gegebenenfalls mit begleitenden Unterstützungsangeboten.
      summary: >-
        NHS England verringerte die institutionelle Unterstützung durch Verordnungsempfehlungen für die Primärversorgung,
        weil belastbare Wirksamkeitsnachweise fehlten. Das Endjahr 2017 bezeichnet diese politische Reaktion in England;
        die Quellen belegen kein gleichzeitiges Ende sämtlicher NHS-bezogener Krankenhausangebote oder homöopathischer
        Anwendungen im gesamten Vereinigten Königreich.
  - id: france-1984-2021
    polity: Frankreich
    institutions:
      - Assurance Maladie
      - Ministère des Affaires sociales et de la Solidarité nationale
    institutionalContext: >-
      Die Erstattungsliste von 1984 wurde vom Ministère des Affaires sociales et de la Solidarité nationale erlassen
      und über die gesetzliche Krankenversicherung sowie ein verteiltes Netz aus verordnenden Ärzten und Apotheken
      umgesetzt. Diese professionelle Infrastruktur bildete den Erstattungsmechanismus, ohne selbst eine einzelne
      Institution zu sein. Die Regelung umfasste gelistete homöopathische Arzneimittel, die auf Rezept abgegeben wurden;
      homöopathische Markenpräparate wurden darüber nicht erstattet. 2019 führte die Haute Autorité de Santé die
      wissenschaftliche Neubewertung durch, die zum Ende der Erstattung führte.
    summary: >-
      Gelistete homöopathische Arzneimittel waren in Frankreich auf Grundlage einer Regelung von 1984 durch die gesetzliche
      Krankenversicherung erstattungsfähig. 2019 führte die Haute Autorité de Santé erstmals eine wissenschaftliche
      Bewertung speziell zur Erstattungsfähigkeit durch und kam zu dem Ergebnis, dass die Wirksamkeit für eine öffentliche
      Finanzierung nicht ausreichend belegt war. 2020 wurde die Erstattung reduziert und zum 1. Januar 2021 beendet.
    consequences:
      - Öffentliche Erstattung gelisteter homöopathischer Arzneimittel
      - Routinemäßige Verordnung im versicherten Gesundheitssystem
      - Öffentliche Finanzierung vor einer wissenschaftlichen Bewertung der Erstattungsfähigkeit
    mechanism:
      summary: >-
        Eine ministerielle Erstattungsliste und die gesetzliche Krankenversicherung machten gelistete homöopathische
        Arzneimittel über gewöhnliche Verordnungs- und Apothekenwege öffentlich erstattungsfähig.
    institutionalCorrection:
      periodLabel: 2019–1. Januar 2021
      action: Französische Gesundheitsbehörden stuften die Wirksamkeit als unzureichend für eine Erstattung ein, reduzierten diese 2020 und beendeten die Erstattung durch die gesetzliche Krankenversicherung zum 1. Januar 2021.
      summary: >-
        Das öffentliche Erstattungssystem kehrte seine frühere Unterstützung nach einer formellen wissenschaftlichen
        Bewertung um, die die Evidenz für eine weitere Finanzierung als unzureichend einstufte.
  - id: brazil-2006-2026
    polity: Brasilien
    institutions:
      - Ministério da Saúde
      - Sistema Único de Saúde (SUS)
    institutionalContext: >-
      PNPIC ist eine bundesweite Politik des Ministério da Saúde und wird über das dezentral organisierte SUS umgesetzt.
      Gesundheitssekretariate und Versorgungsstellen der Bundesstaaten und Gemeinden tragen die Verantwortung für die
      örtliche Umsetzung. Sie unterscheiden sich je nach Gebiet und bilden gemeinsam einen dezentralen
      Umsetzungsapparat, keine einzelne Institution. Homöopathische Versorgung bestand in manchen öffentlichen Diensten
      bereits vor 2006; diese Episode betrifft ihre Aufnahme in den nationalen PNPIC-Rahmen. Die Bewertung der
      therapeutischen Wirksamkeit durch EASAC ist eine externe wissenschaftliche Einschätzung, getrennt von brasilianischen
      politischen Entscheidungen.
    summary: >-
      Brasiliens Nationale Politik für Integrative und Komplementäre Praktiken nahm Homöopathie 2006 ausdrücklich in
      ihren Rahmen für das öffentliche SUS-System auf und forderte Gesundheitsbehörden auf, homöopathische Konsultationen,
      Arzneimittel, Fortbildung und Versorgungsangebote auszubauen. Die Politik schrieb der Homöopathie Beiträge zu
      Prävention und Genesung sowie zu einer Verringerung von Krankenhaus- und Notfallinterventionen zu. Dies waren die
      therapeutischen Behauptungen der Politik. Homöopathie ist 2026 weiterhin Bestandteil des nationalen PNPIC-Rahmens.
    consequences:
      - Nationale politische Vorgaben für öffentliche homöopathische Versorgung
      - Politische Unterstützung der Einbindung in Primär- und Spezialversorgung
      - Politische Vorgaben zum Ausbau des öffentlichen Zugangs zu verordneten homöopathischen Arzneimitteln
      - Politische Unterstützung von Ausbildung und Verbreitung im Gesundheitssystem
    mechanism:
      summary: >-
        Die Bundesgesundheitspolitik nahm Homöopathie in PNPIC/SUS auf und legte Vorgaben für dezentrale öffentliche
        Gesundheitseinrichtungen fest, Konsultationen, Arzneimittel, Fortbildung und Versorgung auszubauen.
    institutionalCorrection:
      summary: >-
        Die geprüften Quellen dokumentieren weder eine korrigierende Rücknahme noch eine auf mangelnde Wirksamkeit
        gestützte Einschränkung durch das Gesundheitsministerium oder SUS. Offizielle Politikmaterialien führen
        Homöopathie weiterhin auf. Externe wissenschaftliche Bewertungen belegen keine korrigierende Reaktion dieser
        institutionellen Träger.
  - id: austria-1994-2026
    polity: Österreich
    institutions:
      - Österreichische Ärztekammer
      - Österreichische Akademie der Ärzte
    institutionalContext: >-
      Die Österreichische Ärztekammer führte 1994 ein Spezialdiplom für Homöopathie ein und hält es bis heute in ihrem
      formellen ärztlichen Weiterbildungssystem aufrecht. Das aktuelle Curriculum bezeichnet Homöopathie als ärztliche
      Therapie mit Arzneimittelprüfung am gesunden Menschen, Potenzierung und Ähnlichkeitsprinzip und sieht vor, dass
      Absolventinnen und Absolventen akute und chronische Erkrankungen nach den Regeln der Homöopathie behandeln können.
      Die Österreichische Akademie der Ärzte administriert das Diplom im Auftrag der Ärztekammer. Dies ist eine berufliche
      Zertifizierung und keine allgemeine Kassenleistung: In einer Stellungnahme vom April 2017 berichtete der Hauptverband
      der österreichischen Sozialversicherungsträger, dass der Oberste Sanitätsrat Homöopathie nicht als wissenschaftlich
      gesicherte Heilmethode anerkannt habe und homöopathische Arzneimittel grundsätzlich keine ausreichenden
      Wirksamkeitsnachweise für eine Erstattung aufwiesen. Die externen wissenschaftlichen Bewertungen durch EASAC und die
      australischen Evidenzprüfer betreffen die therapeutische Wirksamkeit, getrennt von den Zertifizierungsentscheidungen
      der Ärztekammer.
    summary: >-
      Die Österreichische Ärztekammer zertifiziert Ärztinnen und Ärzte seit 1994 in Homöopathie. Ihr aktuelles ÖÄK-Diplom
      definiert die Methode als ärztliche Therapie, lehrt Potenzierung und Ähnlichkeitsprinzip und sieht die Behandlung
      akuter und chronischer Erkrankungen vor. Nach einer Überprüfung beschloss der ÖÄK-Vorstand im April 2018, die
      bestehenden komplementärmedizinischen Diplome als Qualifikationsnachweise für strukturierte Fortbildung
      aufrechtzuerhalten. Das Diplom ist weiterhin aktiv: Im Fortbildungsbericht 2025 wurden zum Jahresende 2024 insgesamt
      675 Diplominhaberinnen und -inhaber gezählt. Diese Anerkennung besteht neben einer gesonderten österreichischen
      gesundheitspolitischen Bewertung: Die Stellungnahme des Hauptverbands der Sozialversicherungsträger vom April 2017
      berichtete, dass Homöopathie wissenschaftlich nicht gesichert sei und homöopathische Arzneimittel grundsätzlich nicht
      die Evidenzschwelle für eine Erstattung erreichten.
    consequences:
      - Formelles ärztliches Diplom für homöopathische Diagnostik und Behandlung
      - Von der Ärztekammer anerkannter Weiterbildungspfad von mindestens drei Jahren und 350 Unterrichtseinheiten
      - Ein Curriculum, das Homöopathie als Behandlungsmöglichkeit für akute und chronische Erkrankungen darstellt
      - 675 Inhaberinnen und Inhaber des Homöopathiediploms zum 31. Dezember 2024
    mechanism:
      summary: >-
        Ärztekammer und Ärzteakademie unterhalten ein formelles Weiterbildungsdiplom, das Ärztinnen und Ärzte zur Diagnostik
        und Behandlung akuter und chronischer Erkrankungen nach homöopathischen Prinzipien ausbildet und zertifiziert.
    institutionalCorrection:
      periodLabel: Überprüfungsbeschluss vom April 2018
      action: Nach einer Überprüfung hielt der Vorstand der Österreichischen Ärztekammer die bestehenden komplementärmedizinischen Diplome als Qualifikationsnachweise für strukturierte Weiterbildung aufrecht.
      summary: >-
        Der berichtete ÖÄK-Beschluss vom April 2018 erhielt die Diplome einschließlich Homöopathie aufrecht. Das
        Homöopathiediplom und sein therapeutisches Curriculum sind in den 2026 geprüften Materialien weiterhin aktiv.
        Die gesonderte Kritik der Sozialversicherung stellt keine Rücknahme des Diploms durch Ärztekammer oder Akademie dar.
evidence:
  - id: homeopathy-easac-correction
    note: >-
      Kommt zu dem Schluss, dass für keine bekannte Krankheit robuste, reproduzierbare Belege einer Wirksamkeit
      über den Placeboeffekt hinaus vorliegen und dass die wissenschaftlichen Behauptungen der Homöopathie mit
      etablierter Chemie und Physik unvereinbar sind.
  - id: homeopathy-easac-press-correction
    note: >-
      Fasst die EASAC-Evidenzbewertung zusammen: Für keine bekannte Krankheit gibt es robuste, reproduzierbare
      Belege einer homöopathischen Wirksamkeit über Placebo hinaus; die zentralen wissenschaftlichen
      Behauptungen sind mit etablierter Chemie und Physik unvereinbar.
  - id: homeopathy-nhmrc-correction
    note: >-
      Die Bewertung von 2024 berichtet mögliche Vorteile gegenüber Placebo bei Medikamentenverbrauch bei
      allergischer Rhinitis und Krankheitsschwere bei atopischer Dermatitis, jeweils bei geringer
      Vertrauenswürdigkeit der Evidenz. Viele andere Zielgrößen zeigen wenig bis keinen Nutzen oder ungewisse
      beziehungsweise unbekannte Effekte. Vergleiche mit Placebo werden von solchen ohne Intervention getrennt;
      Letztere belegen keine Wirksamkeit über Placebo hinaus.
  - id: homeopathy-uk-proposition
    note: >-
      Dokumentiert, dass Homöopathie seit 1948 durch den NHS finanziert und angeboten wurde, benennt die
      homöopathischen Krankenhäuser und ihre Einbindung in die NHS-Beauftragung und erläutert, dass
      Finanzierungsentscheidungen innerhalb des NHS getroffen wurden.
  - id: homeopathy-uk-carrier
    note: >-
      Dokumentiert, dass Homöopathie seit 1948 durch den NHS finanziert und angeboten wurde, benennt die
      homöopathischen Krankenhäuser und ihre Einbindung in die NHS-Beauftragung und erläutert, dass
      Finanzierungsentscheidungen innerhalb des NHS getroffen wurden.
  - id: homeopathy-uk-mechanism
    note: >-
      Beschreibt die NHS-Beauftragung, Ausgaben für homöopathische Produkte und die Unterstützung
      spezialisierter Krankenhäuser durch den NHS. Diese Strukturen dokumentieren den Finanzierungs- und
      Versorgungsmechanismus, ohne therapeutische Wirksamkeit zu belegen.
  - id: homeopathy-uk-consequences
    note: >-
      Dokumentiert finanzierte Krankenhausangebote, Verordnungsausgaben und Überweisungen, darunter die
      Schließung in Tunbridge Wells nach rückläufigen Überweisungen und einer Überprüfung der Beauftragung.
      Diese Passagen belegen alle drei Folgen, aber keine überall im Vereinigten Königreich gleiche Versorgung
      oder ein gemeinsames Enddatum.
  - id: homeopathy-uk-review-context
    note: >-
      Kommt zu dem Schluss, dass keine glaubwürdige Wirksamkeitsevidenz vorlag, und empfiehlt, Homöopathie nicht
      durch den NHS zu finanzieren. Dies ist die Bewertung und Empfehlung des Ausschusses, kein Beleg für eine
      bereits erfolgte Umsetzung des vorgeschlagenen Finanzierungsendes.
  - id: homeopathy-uk-institutional-correction
    note: >-
      Dokumentiert die Empfehlung von 2017, Homöopathie nicht neu zu verordnen und bestehende Verordnungen
      abzusetzen, weil keine klare oder belastbare Evidenz ihre Nutzung im NHS stützte. Die aktualisierte
      Leitlinie behält den mit 2017 bezeichneten Eintrag bei und betrifft Verordnungen in Englands
      Primärversorgung; sie dokumentiert keine Schließung aller homöopathischen Krankenhausangebote im
      Vereinigten Königreich.
  - id: homeopathy-fr-proposition
    note: >-
      Die offizielle HAS-Bewertung gibt die Erstattungsverordnung vom 12. September 1984 im Anhang wieder. Diese
      nennt das Ministère des Affaires sociales et de la Solidarité nationale und begründete die später
      aufgehobene Liste erstattungsfähiger homöopathischer Arzneimittel.
  - id: homeopathy-fr-carrier
    note: >-
      Die offizielle HAS-Bewertung gibt die Erstattungsverordnung vom 12. September 1984 im Anhang wieder. Diese
      nennt das Ministère des Affaires sociales et de la Solidarité nationale und begründete die später
      aufgehobene Liste erstattungsfähiger homöopathischer Arzneimittel.
  - id: homeopathy-fr-mechanism
    note: >-
      Erläutert die Erstattung gelisteter, auf Rezept abgegebener homöopathischer Arzneimittel und grenzt sie
      von nicht erstatteten Markenpräparaten ab. Dies belegt den Versicherungs- und Apothekenweg, keine
      umfassende Erstattung aller homöopathischen Produkte.
  - id: homeopathy-fr-consequences
    note: >-
      Stellt fest, dass homöopathische Arzneimittel zuvor keiner wissenschaftlichen Bewertung für die Erstattung
      unterzogen worden waren und dass die Prüfung von 2019 unzureichende Wirksamkeitsevidenz fand. Das belegt
      die Finanzierung vor einer Erstattungsprüfung, nicht das Fehlen früherer wissenschaftlicher Forschung zur
      Homöopathie.
  - id: homeopathy-fr-prescribing-consequences
    note: >-
      Beschreibt die an eine Verordnung gebundene Erstattung und berichtet Daten zur Abgabe in Apotheken sowie
      zu Versicherungsabrechnungen. Diese dokumentieren tatsächliche Verordnungen und Erstattungen und belegen
      die ersten beiden Folgen.
  - id: homeopathy-fr-order-correction
    note: >-
      Beendet die Erstattung zum 1. Januar 2021 und hebt die Erstattungsverordnung vom 12. September 1984 auf.
  - id: homeopathy-fr-ministry-correction
    note: >-
      Erläutert die Übergangsreduktion der Erstattung im Jahr 2020 und das Ende der Erstattung durch die
      gesetzliche Krankenversicherung am 1. Januar 2021.
  - id: homeopathy-br-proposition
    note: >-
      Regierungsbibliotheksnachweis zur Portaria 971, die PNPIC genehmigte und Homöopathie ausdrücklich zu den
      im SUS umzusetzenden Praktiken zählte. Der Nachweis verlinkt die Verordnung und das vollständige
      PNPIC-Politikdokument; Letzteres wurde eingesehen und für seine konkreten Vorgaben gesondert registriert.
  - id: homeopathy-br-adoption-carrier
    note: >-
      Regierungsbibliotheksnachweis zur Portaria 971, die PNPIC genehmigte und Homöopathie ausdrücklich zu den
      im SUS umzusetzenden Praktiken zählte. Der Nachweis verlinkt die Verordnung und das vollständige
      PNPIC-Politikdokument; Letzteres wurde eingesehen und für seine konkreten Vorgaben gesondert registriert.
  - id: homeopathy-br-carrier
    note: >-
      Die Ministeriumsveröffentlichung hält fest, dass Portaria 971 Homöopathie in PNPIC/SUS aufnahm, beschreibt
      den Ausbau des Zugangs zu integrativen Angeboten und benennt Homöopathie als eines der therapeutischen
      Systeme der Politik.
  - id: homeopathy-br-mechanism
    note: >-
      Legt Vorgaben für Versorgung, Finanzierung, Arzneimittelzugang, Ausbildung und Kommunikation sowie
      Zuständigkeiten von Bund, Bundesstaaten und Gemeinden fest. Sie belegen den in der Politik vorgesehenen
      administrativen Mechanismus.
  - id: homeopathy-br-consequences
    note: >-
      Sieht homöopathische Versorgung in der Primär- und Spezialversorgung vor und belegt damit die ersten
      beiden politischen Vorgaben. Die Bestimmung misst nicht, wie vollständig diese Angebote tatsächlich
      umgesetzt wurden.
  - id: homeopathy-br-medicines-consequences
    note: >-
      Sieht den Ausbau öffentlicher Herstellung und des Zugangs zu verordneten homöopathischen Arzneimitteln vor
      und belegt die dritte Folge als politische Vorgabe.
  - id: homeopathy-br-training-consequences
    note: >-
      Sieht die Förderung beruflicher Ausbildung und der Verbreitung homöopathischer Informationen vor und
      belegt die vierte Folge als politische Vorgabe.
  - id: homeopathy-br-policy-context
    note: >-
      Aktueller Gesetzgebungsindex des Gesundheitsministeriums zum PNPIC-Rahmen und seinen späteren
      Konsolidierungen und Erweiterungen. Der Index liefert rechtlichen Kontext; er belegt für sich weder eine
      auf Wirksamkeit gestützte Korrektur noch den Umfang tatsächlich erbrachter homöopathischer Versorgung.
  - id: homeopathy-br-implementation-context
    note: >-
      Dokumentiert örtliche öffentliche Homöopathieangebote vor PNPIC, ungleichen Arzneimittelzugang und die
      Verteilung der Umsetzungszuständigkeiten. Die behauptete Verringerung von Krankenhaus- und
      Notfallinterventionen ist eine Aussage der Politik, kein nachgewiesener Effekt.
  - id: homeopathy-br-current-policy-context
    note: >-
      Das Gesundheitssekretariat Bahias beschreibt PNPIC als landesweit in Kraft und führt Homöopathie unter den
      aktuellen Praktiken auf. Zusammen mit dem Gesetzgebungsindex des Ministeriums stützt dies den
      fortbestehenden Platz im Politikrahmen, ohne eine einheitliche Versorgung in ganz Brasilien zu belegen.
  - id: homeopathy-br-easac-context
    note: >-
      Kommt zu dem Schluss, dass für keine bekannte Krankheit robuste, reproduzierbare Belege einer Wirksamkeit
      über den Placeboeffekt hinaus vorliegen und dass die wissenschaftlichen Behauptungen der Homöopathie mit
      etablierter Chemie und Physik unvereinbar sind. Dies ist eine externe wissenschaftliche Bewertung, keine
      Rücknahme brasilianischer Politik.
  - id: homeopathy-at-proposition
    note: >-
      Das offizielle Curriculum definiert Homöopathie als ärztliche Therapie mit am gesunden Menschen geprüften
      Arzneimitteln, Potenzierung und Ähnlichkeitsprinzip und sieht vor, dass Diplominhaberinnen und -inhaber
      akute und chronische Erkrankungen nach den Regeln homöopathischer Heilkunst behandeln können.
  - id: homeopathy-at-carrier
    note: >-
      Aktuelle offizielle Diplomseite. Sie nennt die ärztliche Weiterbildungsverordnung der Ärztekammer als
      Grundlage, beschreibt als Ziel das Erlernen der Indikationsstellung und Durchführung homöopathischer
      Therapie und verlangt mindestens drei Jahre sowie 350 Unterrichtseinheiten.
  - id: homeopathy-at-mechanism
    note: >-
      Das offizielle Curriculum definiert Homöopathie als ärztliche Therapie mit am gesunden Menschen geprüften
      Arzneimitteln, Potenzierung und Ähnlichkeitsprinzip und sieht vor, dass Diplominhaberinnen und -inhaber
      akute und chronische Erkrankungen nach den Regeln homöopathischer Heilkunst behandeln können. Die
      Weiterbildungsinhalte umfassen diagnostische Abklärung, Arzneimittelauswahl und Therapiekontrolle.
  - id: homeopathy-at-consequences
    note: >-
      Der offizielle Fortbildungsbericht zählt zum 31. Dezember 2024 insgesamt 675 Inhaberinnen und Inhaber des
      ÖÄK-Homöopathiediploms, darunter 148 in Wien. Dies belegt die Zahl zu diesem Stichtag, keine Zahl für 2026
      und keine therapeutische Wirksamkeit.
  - id: homeopathy-at-curriculum-consequences
    note: >-
      Das Diplomcurriculum legt Ausbildung in Diagnostik und Behandlung, mindestens drei Jahre mit 350 Einheiten
      sowie das erklärte Ziel der Behandlung akuter und chronischer Erkrankungen fest. Diese Vorgaben belegen
      die ersten drei Folgen der Zertifizierung.
  - id: homeopathy-at-training-consequences
    note: >-
      Bestätigt den Weiterbildungspfad von mindestens drei Jahren und 350 Unterrichtseinheiten. Die Seite stellt
      außerdem klar, dass das Diplom die gesetzliche Sonderfachbeschränkung nicht aufhebt oder erweitert.
  - id: homeopathy-at-history-context
    note: >-
      Publikation einer österreichischen Landesärztekammer zur Chronologie der ÖÄK-Spezialdiplome in
      Komplementärmedizin, die die Einführung des Homöopathiediploms auf 1994 datiert.
  - id: homeopathy-at-history-carrier
    note: >-
      Datiert das ÖÄK-Homöopathiediplom auf 1994 und belegt damit den Beginn dieser Zertifizierungsepisode,
      nicht den Beginn homöopathischer Praxis in Österreich.
  - id: homeopathy-at-parliament-context
    note: >-
      Die offizielle parlamentarische Anlage beschreibt Homöopathie als ärztliche Leistung in Österreich und die
      Vergabe von Homöopathiediplomen durch die Ärztekammer. Zugleich berichtet sie, dass der Oberste
      Sanitätsrat Homöopathie nicht als wissenschaftlich gesicherte Heilmethode anerkannte und homöopathische
      Arzneimittel grundsätzlich keine ausreichenden Wirksamkeitsnachweise für eine Erstattung aufwiesen. Dies
      ist die Position des Sozialversicherungs-Hauptverbands von 2017, keine Rücknahme durch die
      zertifizierenden Träger.
  - id: homeopathy-at-retention-response
    note: >-
      Berichtet über eine Überprüfung der komplementärmedizinischen Diplome und den anschließenden
      Vorstandsbeschluss vom April 2018, die bestehenden Diplome als Qualifikationsnachweise für strukturierte
      Fortbildung aufrechtzuerhalten. Der Artikel zählt Homöopathie zu dieser Diplomgruppe. Dies dokumentiert
      die Beibehaltung nach Überprüfung und stützt den Status einer nicht erfolgten Korrektur.
  - id: homeopathy-at-easac-context
    note: >-
      Fasst die EASAC-Evidenzbewertung zusammen: Für keine bekannte Krankheit gibt es robuste, reproduzierbare
      Belege einer homöopathischen Wirksamkeit über Placebo hinaus; die zentralen wissenschaftlichen
      Behauptungen sind mit etablierter Chemie und Physik unvereinbar. Diese wissenschaftliche Bewertung ist von
      den Entscheidungen der österreichischen zertifizierenden Träger getrennt.
  - id: homeopathy-at-nhmrc-context
    note: >-
      Liefert eine neuere externe wissenschaftliche Bewertung mit möglichen Vorteilen geringer
      Evidenzvertrauenswürdigkeit für einzelne Zielgrößen und erheblicher Unsicherheit bei anderen. Sie bewertet
      klinische Wirksamkeit für australische gesundheitspolitische Zwecke und dokumentiert keine Änderung
      österreichischer ärztlicher Diplome.
