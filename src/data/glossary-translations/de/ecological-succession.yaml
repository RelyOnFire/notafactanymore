locale: de
entryId: ecological-succession
sourceReviewedAt: '2026-08-21'
term: Ökologische Sukzession
aliases:
- Sukzession
shortDefinition: Die Veränderung von Artenzusammensetzung und Struktur einer ökologischen Gemeinschaft im Laufe der Zeit,
  häufig nach einer Störung oder der Entstehung neuen Lebensraums.
longDefinition: Ökologische Sukzession beschreibt gerichtete Veränderungen von Gemeinschaften im Laufe der Zeit, wenn
  Arten einwandern, verschwinden, konkurrieren, ihre Umwelt verändern und auf Störungen reagieren. Ältere Theorien stellten
  Sukzession oft als vorhersehbare Entwicklung zu einer einzigen Klimaxgemeinschaft dar. Moderne Ökologie berücksichtigt
  mehrere mögliche Pfade, wiederkehrende Störungen, historische Zufälle und alternative langlebige Zustände.
