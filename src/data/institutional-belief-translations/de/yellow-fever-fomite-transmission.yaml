  institutionalContext: Als US-Truppen 1898 nach Kuba kamen, behandelte die Heeresmedizin kontaminierte Orte und Gegenstände
    als wichtige Quellen der Gelbfieberinfektion. Amtliche Empfehlungen sahen vor, von Einwohnern genutzte Gebäude,
    Flüchtlingskleidung und Kleidung von Gelbfieber-Rekonvaleszenten zu verbrennen und Lager von vermeintlich infizierten
    Orten zu verlegen. In Havanna verbesserten Reinigung, Quarantäne und Desinfektion zwar die allgemeine Gesundheit,
    kontrollierten aber Gelbfieber nicht. Surgeon General George Sternberg setzte deshalb im Mai 1900 die Yellow Fever
    Commission ein. Reed, Carroll, Lazear und Agramonte kombinierten anschließend Mückenversuche mit einem absichtlich
    extremen Fomitentest in Camp Lazear. Freiwillige blieben trotz langandauernden Kontakts mit kontaminierter Kleidung
    und Bettzeug gesund. Die Sanitätspolitik verlagerte sich auf Abschirmung von Patienten, Abtötung erwachsener Mücken
    und Beseitigung von Brutstätten; die aufwendige Desinfektion von Gepäck und Kontaktgegenständen als Gelbfiebermaßnahme
    entfiel.
  summary: 'Die Kuba-Episode der US-Armee ist eine besonders kompakte institutionelle Selbstkorrektur. 1898 handelte
    das Medizinsystem nach der weithin akzeptierten Annahme, infizierte Räume, Kleidung und Bettzeug könnten Gelbfieber
    übertragen. Dasselbe militärmedizinische System prüfte die Behauptung dann direkt: Nichtimmune Freiwillige blieben
    trotz langem Fomitenkontakt gesund, während infizierte Mücken die Krankheit übertrugen. Die Militärregierung schrieb
    ihre Sanitätspraxis um den Mückenmechanismus herum neu.'
  consequences:
  - Verbrennung von Gebäuden und Kleidung, die als mögliche Träger von Gelbfieber angesehen wurden
  - Zeitaufwendige Desinfektions- und Quarantäneverfahren für vermeintlich kontaminierte persönliche Gegenstände
  - Fortbestehen von Gelbfieber trotz umfangreicher Stadtreinigung und fomitenorientierter Hygienemaßnahmen
  - Kontrollierte Humanexperimente der Army Commission zur Unterscheidung zwischen Fomiten- und Mückenübertragung
  - Rasche Ablösung des alten Mechanismus durch Mückenschutz, Begasung und Brutstättenbekämpfung
  - Starker Rückgang und schließlich Beseitigung des städtischen Gelbfiebers in Havanna unter dem Vektorkontrollprogramm
