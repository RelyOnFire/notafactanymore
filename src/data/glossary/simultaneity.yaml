term: Simultaneity
aliases:
- relativity of simultaneity
- simultaneous
shortDefinition: The relationship of events occurring at the same time; in special relativity, distant events judged
  simultaneous in one inertial frame need not be simultaneous in another.
longDefinition: Special relativity removes universal simultaneity for spatially separated events. Observers in relative
  motion use different but internally consistent definitions of which distant events occur at the same time. This relativity
  of simultaneity follows from the invariance of the speed of light and the Lorentz transformations; it is not caused
  by inaccurate clocks or signal delays that could simply be corrected away.
relatedTerms:
