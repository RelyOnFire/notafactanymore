schemaVersion: 2
title: Masturbation as causing or worsening insanity
proposition:
  summary: >-
    Masturbation was treated as a cause or aggravating factor in mental illness strongly enough for psychiatric
    institutions to classify it etiologically and, in some cases, physically prevent patients from engaging in it.
correction:
  summary: >-
    Masturbation is a normal sexual behavior and is not a cause of insanity or mental disorder. Sexual or masturbatory
    behavior can occur alongside psychiatric illness or become compulsive, but observing it in a patient does not
    establish that it caused or worsened the underlying disorder.
category: Psychiatry and sexuality
reviewedAt: '2026-08-24'
impact:
  summary: >-
    In 1877 the provincial London Asylum for the Insane in Ontario acted directly on the belief that masturbation
    could precipitate attacks or aggravate insanity. Superintendent R. M. Bucke used genital “wiring” on 15 male
    patients to make masturbation difficult or painful. The intervention failed and was discontinued.
  highlights:
    - value: '1877'
      label: London Asylum carried out the documented anti-masturbation intervention
    - value: '15'
      label: male patients subjected to genital wiring in the asylum
  context:
    - >-
      Bucke's position was narrower than the blanket slogan “all masturbation causes insanity.” Contemporary historical
      reconstruction of his official report shows that he treated masturbation as capable of precipitating an attack
      or aggravating existing insanity. His position therefore included both causing and worsening mental illness.
    - >-
      The figure of 15 refers to patients. Some biographical accounts count 21 procedures, but that does not mean
      21 separate patients.
episodes:
  - id: canada-ontario-1877
    polity: Canada — Ontario
    region: North America
    startYear: 1877
    endYear: 1877
    periodLabel: '1877'
    strength: officially-endorsed
    institutionTypes:
      - government
      - medical
    institutions:
      - London Asylum for the Insane
    institutionalContext: >-
      During his first year as medical superintendent, R. M. Bucke acted on a psychiatric belief then common enough
      to appear in asylum etiologies: masturbation could precipitate or aggravate insanity. His 1877 superintendent's
      report, preserved in the Ontario Sessional Papers, documented an intervention intended to prevent male patients
      from masturbating. Because this occurred inside a provincial public asylum under its superintendent's treatment
      authority, the belief became an institutional medical practice rather than merely a private theory.
    consequences:
      - Fifteen male patients were subjected to genital wiring intended to inhibit erections and masturbation
      - Pain and physical restraint were used as psychiatric treatment on institutionalized patients
      - The intervention continued until experience showed it did not reliably prevent the behavior
      - The treatment embodied a false causal interpretation of sexual behavior in mentally ill patients
    summary: >-
      During his first year as superintendent in 1877, R. M. Bucke acted on the belief that masturbation could
      precipitate attacks or aggravate insanity. The provincial public asylum subjected 15 male patients to genital
      “wiring” intended to make erections and masturbation difficult or painful. The procedure failed to stop
      masturbation reliably and was abandoned.
    mechanism:
      kind: administrative-adoption
      summary: >-
        The asylum superintendent converted an etiological belief about masturbation into a physical treatment programme,
        subjecting institutionalized male patients to genital wiring intended to prevent the behavior.
    institutionalCorrection:
      status: partial
      periodLabel: '1877'
      action: The London Asylum discontinued the wiring intervention after it failed to prevent masturbation reliably.
      summary: >-
        The institution abandoned the specific coercive intervention after failure, but the surviving record does not
        establish a formal institutional repudiation of the broader masturbation-insanity causal theory.
