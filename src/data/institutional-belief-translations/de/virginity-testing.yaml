locale: de
entryId: virginity-testing
sourceReviewedAt: '2026-08-24'
title: „Jungfräulichkeitstests“
claim: Untersuchungen des Hymens oder der Vagina wurden als geeignet behandelt, festzustellen, ob eine Frau oder
  ein Mädchen bereits vaginalen Geschlechtsverkehr hatte.
currentUnderstanding: Keine körperliche Untersuchung kann feststellen, ob eine Frau oder ein Mädchen zuvor vaginalen
  Geschlechtsverkehr hatte. Das Erscheinungsbild des Hymens variiert natürlicherweise und ist kein verlässlicher
  Nachweis sexueller Aktivität; sogenannte Jungfräulichkeits- oder Zwei-Finger-Tests besitzen keine wissenschaftliche
  oder klinische Aussagekraft.
episodes:
- id: turkey-1986-1998
  polity: Türkei
  summary: Türkische Polizei, Gendarmerie, Schulen, Wohnheime und andere staatliche Einrichtungen ordneten Untersuchungen
    an oder ermöglichten sie, mit denen die „Jungfräulichkeit“ von Frauen und Mädchen festgestellt werden sollte.
    Staatliche Gerichtsmediziner führten solche Untersuchungen unter anderem bei Inhaftierten, bei Verdacht auf
    Prostitution, im Rahmen schulischer Disziplin und wegen vermeintlicher Verstöße gegen die öffentliche Moral
    durch. Ende 1998 untersagte eine staatliche Regelung Jungfräulichkeitstests, sofern die Frau sie nicht selbst
    verlangte.
  consequences:
  - Erzwungene Genitaluntersuchungen
  - Verwendung vermeintlicher „Jungfräulichkeit“ als polizeiliches Beweismittel
  - Überwachung und Bestrafung von Frauen und Mädchen
  - Psychische und körperliche Schäden
- id: iran-2002-2026
  polity: Iran
  institutions:
  - Legal Medicine Organization of Iran (LMOI)
  - Justiz der Islamischen Republik Iran
  institutionalContext: Die Legal Medicine Organization ist eine offizielle Einrichtung der iranischen Justiz; ihre
    gerichtsmedizinischen Zentren erstellen auf Anforderung von Gerichten und Richtern Gutachten. Forschungen aus
    iranischen gerichtsmedizinischen Zentren beschreiben Jungfräulichkeitsuntersuchungen auf Anordnung von Zivil-
    und Strafgerichten sowie für weitere formelle gerichtsmedizinische Zwecke. Eine landesweite Abschaffung lässt
    sich in den zugänglichen Quellen nicht belegen; ein Länderbericht von 2026 berichtet weiterhin von möglichen
    staatlich veranlassten Tests in einzelnen Fällen. Deshalb wird die Episode als fortdauernd geführt.
  summary: Iranische gerichtsmedizinische Zentren führten Hymenuntersuchungen durch, mit denen für formelle rechtliche
    Zwecke eine angebliche „Jungfräulichkeit“ festgestellt werden sollte. Eine Studie aus Teheraner gerichtsmedizinischen
    Zentren beschreibt Untersuchungen auf Anordnung von Zivil- und Strafgerichten und Anwendungen bei Ehe, Scheidung,
    Unterbringung, mutmaßlicher sexueller Gewalt und Jungfräulichkeitsbescheinigungen. Die moderne Evidenz zeigt,
    dass das Erscheinungsbild des Hymens keine sexuelle Vorgeschichte bestimmen kann; eine landesweite iranische
    Abschaffung ist in den zugänglichen Quellen jedoch nicht belegt.
  consequences:
  - Gerichtlich angeordnete Hymenuntersuchungen
  - Gerichtsmedizinische Bescheinigungen und Gutachten in Zivil- und Strafsachen
  - Entscheidungen zu Ehe, Scheidung, Unterbringung und mutmaßlicher sexueller Aktivität
  - Psychische und soziale Schäden
- id: india-2005-2013
  polity: Indien
  summary: In der indischen Gerichtsmedizin und in öffentlichen Krankenhäusern wurde der Zwei-Finger-Test weiterhin
    eingesetzt, um zu beurteilen, ob Vergewaltigungsbetroffene an Geschlechtsverkehr „gewöhnt“ seien. Befunde zu
    Hymen und vermeintlicher vaginaler Weite gelangten in gerichtsmedizinische Berichte und konnten vor Gericht
    verwendet werden, um Glaubwürdigkeit oder fehlende Zustimmung infrage zu stellen. Der Supreme Court verwarf
    die Praxis 2013; nationale Gesundheitsrichtlinien untersagten anschließend den Test und Aussagen über frühere
    sexuelle Erfahrung.
  consequences:
  - Invasive Untersuchungen von Vergewaltigungsbetroffenen
  - Beurteilung der Sexualgeschichte in gerichtsmedizinischen Berichten
  - Verwendung zur Infragestellung von Glaubwürdigkeit oder Zustimmung
  - Erneute Traumatisierung der Betroffenen
- id: indonesia-2014-2022
  polity: Indonesien
  institutions:
  - Kepolisian Negara Republik Indonesia (Polri)
  - Pusat Kedokteran dan Kesehatan Polri (Pusdokkes Polri)
  - Tentara Nasional Indonesia (TNI)
  - Tentara Nasional Indonesia Angkatan Darat (TNI AD)
  - Tentara Nasional Indonesia Angkatan Laut (TNI AL)
  - Tentara Nasional Indonesia Angkatan Udara (TNI AU)
  institutionalContext: Im Polizeisystem waren die nationale Polizeiverordnung und Pusdokkes Polri Teil des Untersuchungsapparats.
    In den Streitkräften war die Praxis in allen drei Teilstreitkräften verbreitet. Das Heer begann 2021 mit der
    Abschaffung; der streitkräfteweite Endpunkt wurde 2022 erreicht, als TNI mitteilte, dass Heer, Marine und Luftwaffe
    die Tests bei der Rekrutierung effektiv beendet hätten.
  summary: Noch 2014 mussten sich Bewerberinnen für die indonesische Polizei sogenannten „Jungfräulichkeitstests“
    einschließlich des widerlegten Zwei-Finger-Tests unterziehen; Personal von Pusdokkes Polri führte die Untersuchungen
    in polizeilichen medizinischen Einrichtungen durch. Human Rights Watch dokumentierte die Praxis außerdem in
    allen drei Teilstreitkräften. Im April 2022 teilten die Streitkräfte mit, dass Heer, Marine und Luftwaffe die
    Jungfräulichkeitstests bei der Rekrutierung effektiv beendet hätten.
  consequences:
  - Invasive Untersuchungen von Bewerberinnen
  - Geschlechterdiskriminierung im öffentlichen Dienst
  - Psychische und körperliche Schäden
- id: kazakhstan-2025-2026
  polity: Kasachstan
  institutions:
  - Center for Forensic Examinations, Ministry of Justice of the Republic of Kazakhstan
  institutionalContext: Eine forensische Methodik des Justizministeriums, die im Dezember 2016 genehmigt und später
    vom staatlichen Forensikzentrum veröffentlicht wurde, zählt bei Untersuchungen weiblicher „Sexualzustände“ sowohl
    die Bestimmung sexueller Unversehrtheit als auch die Feststellung früheren Geschlechtsverkehrs zu den Sachverständigenaufgaben.
    Das Dokument räumt ein, dass Geschlechtsverkehr ohne Verletzung des Hymens möglich ist, hält die Hymen- und
    Genitaluntersuchung aber dennoch in einem Verfahren zur Schlussfolgerung auf frühere sexuelle Aktivität aufrecht.
  summary: Kasachstans forensisches Zentrum des Justizministeriums verwendet eine 2016 genehmigte Methodik zu weiblichen
    „Sexualzuständen“, die die Bestimmung sexueller Unversehrtheit und die Feststellung früheren Geschlechtsverkehrs
    umfasst. Das Dokument verlangt Genital- und Hymenuntersuchungen und räumt zugleich ein, dass Geschlechtsverkehr
    ohne Hymenruptur stattfinden kann. Die WHO stellt klar, dass das Aussehen des Hymens früheren vaginalen Geschlechtsverkehr
    nicht nachweisen kann.
  consequences:
  - Forensische Genitaluntersuchungen zur Schlussfolgerung auf früheren Geschlechtsverkehr
  - Verwendung von Hymenzustand und Verletzungen innerhalb einer staatlichen Beweismethodik
  - Möglicher Einfluss medizinisch-forensischer Schlussfolgerungen auf Straf- und Zivilverfahren
  - Fortführung einer wissenschaftlich ungültigen Jungfräulichkeitsinferenz im amtlichen Forensikrahmen
- id: bangladesh-2013-2018
  polity: Bangladesch
  institutions:
  - Ministry of Health and Family Welfare
  - Directorate General of Health Services
  - Dhaka Medical College Hospital, Department of Forensic Medicine
  - Bangabandhu Sheikh Mujib Medical University, Department of Forensic Medicine
  - Sir Salimullah Medical College & Hospital, Department of Forensic Medicine
  - Shaheed Suhrawardy Medical College & Hospital, Department of Forensic Medicine
  - Chittagong Medical College, Department of Forensic Medicine
  institutionalContext: Das Verfahren von 2013 dokumentierte den Einsatz des Zwei-Finger-Tests an medizinischen
    Hochschulen im ganzen Land. Im November 2017 erklärten die Leiter von fünf gerichtsmedizinischen Abteilungen
    vor dem High Court, der Test sei notwendig. Noch im März 2018 erklärte das Gesundheitsministerium, Fingeruntersuchung
    und Beurteilung des Hymens würden regelmäßig eingesetzt, um festzustellen, ob ein Geschlechtsakt stattgefunden
    habe. Einen Monat später zog das Ministerium diese Position zurück; der High Court untersagte die Praxis.
  summary: 'Im gerichtsmedizinischen System Bangladeschs wurden Frauen und Mädchen nach Vergewaltigungsanzeigen
    dem Zwei-Finger-Test und Hymenuntersuchungen unterzogen. Die zugrunde liegende institutionelle Annahme wurde
    im Rechtsstreit ungewöhnlich deutlich: Noch im März 2018 erklärte das Gesundheitsministerium, die Untersuchungen
    würden regelmäßig zur Feststellung eines vorausgegangenen Geschlechtsakts verwendet. Im April zog das Ministerium
    diese Position zurück. Am 12. April 2018 erklärte der High Court den Zwei-Finger-Test für unwissenschaftlich,
    unzuverlässig und ungültig und untersagte ihn.'
  consequences:
  - Invasive Genitaluntersuchungen von Vergewaltigungsbetroffenen
  - Gerichtsmedizinische Schlussfolgerungen über frühere sexuelle Aktivität
  - Potenzieller Einfluss solcher Befunde auf Ermittlungen und Strafverfahren
  - Erniedrigung, erneute Traumatisierung und Verletzung körperlicher Würde
- id: pakistan-2015-2021
  polity: Pakistan
  institutions:
  - Surgeon Medico Legal Punjab
  - Punjab Health Department
  - Lahore High Court
  - Ministry of Law and Justice, Government of Pakistan
  institutionalContext: Die gerichtsmedizinischen Anweisungen Punjabs von 2015 sahen bei Vergewaltigungs- und Missbrauchsbetroffenen
    digitale Untersuchungen und die Beurteilung des Hymens zur vermeintlichen Feststellung der Jungfräulichkeit
    vor. 2020 verwarf die Bundesregierung den Test. Im Januar 2021 erklärte der Lahore High Court Zwei-Finger- und
    Hymentests zu diesem Zweck für rechtswidrig und verfassungswidrig; das Anti-Rape-Gesetz von 2021 untersagte
    den Zwei-Finger-Jungfräulichkeitstest anschließend ausdrücklich und entzog ihm Beweiswert.
  summary: Offizielle gerichtsmedizinische Anweisungen in Punjab enthielten digitale und Hymenuntersuchungen, mit
    denen die vermeintliche Jungfräulichkeit von Vergewaltigungs- und Missbrauchsbetroffenen beurteilt werden sollte.
    Bis 2020 hatte die Bundesregierung die Praxis als nicht schlüssig und mit der Menschenwürde unvereinbar verworfen.
    Im Januar 2021 erklärte der Lahore High Court die Tests für rechtswidrig; das Anti-Rape-Gesetz von 2021 untersagte
    den Zwei-Finger-Test anschließend landesweit und entzog ihm ausdrücklich den Beweiswert.
  consequences:
  - Invasive Genitaluntersuchungen von Betroffenen sexueller Gewalt
  - Amtliche gerichtsmedizinische Urteile über Jungfräulichkeit und Sexualgeschichte
  - Potenzielle Verwendung dieser Schlussfolgerungen in Strafverfahren
  - Verletzung von Würde, Privatsphäre und körperlicher Integrität
- id: georgia-2018-2026
  polity: Georgien
  institutions:
  - Levan Samkharauli National Forensics Bureau
  - Innenministerium Georgiens
  - Staatsanwaltschaft Georgiens
  - Ordentliche Gerichte Georgiens
  institutionalContext: Die Ombudsstelle dokumentierte in Strafverfahren ab 2018 wiederholt Anordnungen staatlicher
    gerichtsmedizinischer Untersuchungen zur Feststellung der Hymenintegrität, darunter Fälle, in denen die Schilderung
    des Kindes gar keine Penetration umfasste. Als staatlicher forensischer Träger erscheint das Levan Samkharauli
    National Forensics Bureau. In seinem 2025 an GREVIO übermittelten Bericht bestätigte der georgische Staat, dass
    das durch Regierungsbeschluss Nr. 14 vom 16. Januar 2023 geregelte forensische Verfahren bei Sexualdelikten
    weiterhin die Feststellung der Hymenintegrität und des Alters etwaiger Verletzungen umfasst.
  summary: Georgische Ermittlungsbehörden und Gerichte behandelten den Zustand des Hymens als bedeutsames forensisches
    Beweismittel in Sexualstrafverfahren. Eine Studie der Ombudsstelle dokumentierte seit 2018 wiederholte Anordnungen
    zur Prüfung der Hymenintegrität, teils sogar bei Vorwürfen ohne Penetration, und zeigte, dass solche Befunde
    Glaubwürdigkeit und Fallbewertung beeinflussen konnten. 2025 berichtete die Regierung selbst, dass das formelle
    staatliche Forensikverfahren die Feststellung der Hymenintegrität weiterhin vorsieht. Da kein institutioneller
    Endpunkt belegt ist, bleibt die Episode offen.
  consequences:
  - Gerichtsmedizinische Genitaluntersuchungen von Betroffenen sexueller Gewalt, darunter Kinder
  - Wissenschaftlich ungültige Schlussfolgerungen aus dem Hymenzustand
  - Medizinische Gutachten als wichtiges Beweismittel in Ermittlungen und Gerichtsverfahren
  - Sekundäre Viktimisierung und mögliche Verzerrung von Glaubwürdigkeits- oder Penetrationsbewertungen
- id: tajikistan-2016-2026
  polity: Tadschikistan
  institutions:
  - National Centre of Forensic Medicine
  - Ministerium für Gesundheit und sozialen Schutz der Bevölkerung Tadschikistans
  institutionalContext: Mit Änderungen des Familiengesetzbuchs von 2016 wurden verpflichtende voreheliche medizinische
    Untersuchungen eingeführt; die aktuelle UN-Länderanalyse dokumentiert Fälle, in denen diese für Jungfräulichkeitstests
    genutzt wurden, und berichtet von rund 600 entsprechenden Untersuchungen pro Jahr durch das staatliche Forensikzentrum.
    Gewöhnliche medizinische Jungfräulichkeitstests wurden später verboten. Bei der CEDAW-Prüfung 2024 erklärte
    die tadschikische Delegation jedoch ausdrücklich, dass das National Centre of Forensic Medicine solche Untersuchungen
    weiterhin im Rahmen strafrechtlicher Ermittlungen durchführen darf.
  summary: Tadschikistan hat gewöhnliche medizinische Jungfräulichkeitstests eingeschränkt, lässt im staatlichen
    Forensiksystem jedoch eine ausdrückliche Ausnahme bestehen. Eine aktuelle UN-Länderanalyse dokumentiert umfangreiche
    staatlich-forensische Nutzung; bei der Prüfung Tadschikistans vor dem UN-Ausschuss zur Beseitigung der Diskriminierung
    der Frau 2024 räumte die Regierung ein, dass das National Centre of Forensic Medicine weiterhin zu solchen Untersuchungen
    in Strafverfahren befugt ist. Damit besteht eine offizielle forensische Verwendung eines wissenschaftlich ungültigen
    Verfahrens fort.
  consequences:
  - Staatliche forensische Genitaluntersuchungen zur vermeintlichen Feststellung von Jungfräulichkeit
  - Verwendung in Strafverfahren trotz fehlender wissenschaftlicher Aussagekraft
  - Mögliche rechtliche und soziale Folgen gerichtsmedizinischer Bescheinigungen
  - Psychische, reputative und familiäre Schäden
