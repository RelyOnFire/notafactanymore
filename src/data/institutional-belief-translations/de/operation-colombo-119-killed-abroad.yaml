schemaVersion: 2
locale: de
entryId: operation-colombo-119-killed-abroad
sourceReviewedAt: '2026-09-24'
title: Chiles 119 Verschwundene seien im Ausland gestorben
proposition:
  summary: >-
    Chiles Geheimdienst DINA und der Informationsapparat der Diktatur setzten 1975 die Behauptung in Umlauf, 119 nach
    ihrer Festnahme in Chile verschwundene Menschen hätten sich stattdessen im Ausland befunden und seien dort bei
    internen Säuberungen der Linken oder bei Zusammenstößen mit ausländischen Sicherheitskräften ums Leben gekommen.
    Damit wurde geleugnet, dass chilenische Staatsorgane sie festgenommen und gewaltsam verschwinden lassen hatten.
correction:
  summary: >-
    Die Operación Colombo war eine Desinformationsoperation der DINA, die gewaltsames Verschwindenlassen verschleiern
    sollte. Chiles Nationale Wahrheits- und Versöhnungskommission ordnete die beiden ausländischen Listen als Höhepunkt
    dieser Operation ein und stellte fest, dass die Berichte über Todesfälle im Ausland falsch waren. Die 119 waren in
    Chile festgenommen worden und im Zuge staatlicher Repression verschwunden. Spätere Strafverfahren wiesen die
    Verantwortung der DINA für einzelne Opfer nach; diese Urteile betreffen einzelne Colombo-Verfahrenskomplexe und sind
    nicht als ein einziges Verfahren darzustellen, das das Schicksal aller 119 geklärt hätte.
impact:
  summary: >-
    Die Operación Colombo verwandelte die Namen von Menschen, nach denen bereits mit Amparo-Anträgen und durch
    Menschenrechtsarbeit gesucht wurde, in eine erfundene Erzählung von Todesfällen im Ausland. Die argentinische Zeitschrift Lea nannte
    60 Personen als Opfer angeblicher interner Säuberungen; die brasilianische Publikation O Dia nannte 59 Personen im
    Zusammenhang mit vorgeblichen Kämpfen gegen argentinische Sicherheitskräfte. Chilenische Zeitungen verbreiteten die
    einander ergänzenden Listen anschließend mit reißerischen Behauptungen. Die Rettig-Kommission stellte fest, dass die
    Kampagne die Öffentlichkeit verwirrte, Berichte über Verschwundene diskreditierte und Angehörige sowie
    Menschenrechtsverteidiger demütigte und isolierte. Ihr Bericht deckte die Operation 1991 amtlich auf;
    Strafverfahren und Forderungen nach Richtigstellungen durch die Presse dauerten noch Jahrzehnte an.
  highlights:
    - value: '119'
      label: verschwundene Chileninnen und Chilenen, deren Namen für die falschen Auslandsberichte benutzt wurden
    - value: '2'
      label: obskure ausländische Publikationen mit einander ergänzenden Listen von 60 und 59 Namen
    - value: '1991'
      label: Jahr der amtlichen Einordnung als DINA-Desinformation durch die Rettig-Kommission
  context:
    - >-
      Die beiden Listen enthielten nicht dieselbe Behauptung. Lea meldete 60 angebliche Todesopfer interner Säuberungen in
      mehreren Ländern; O Dia meldete, weitere 59 Personen seien bei Kämpfen in Argentinien getötet oder verwundet worden
      beziehungsweise entkommen. Chilenische Berichte verdichteten beide Listen häufig zur Erzählung, alle 119 seien im
      Ausland gestorben.
    - >-
      Die 119 bildeten keine einzelne Gruppe, die am selben Ort oder nachweislich auf dieselbe Weise getötet wurde. Es
      waren unterschiedliche Fälle von Verschwindenlassen, überwiegend, aber nicht ausschließlich von MIR-Mitgliedern,
      die zu einer gemeinsamen Tarnlegende verbunden wurden. Für viele Familien bedeutet das Verschwindenlassen bis heute,
      dass das endgültige Schicksal des Opfers und der Verbleib seiner sterblichen Überreste ungeklärt sind.
    - >-
      Ein Telegramm der US-Botschaft vom August 1975 bewertete die Auslandsberichte bereits als wahrscheinlich falsch und
      die Listen als vermutlich von chilenischen Regierungskräften lanciert. Diese zeitgenössische Einschätzung belegt
      frühe amtliche Zweifel; die späteren Feststellungen der chilenischen Wahrheitskommission und Gerichte besitzen
      größeres Gewicht.
    - >-
      Die amtliche Korrektur der Erzählung von Todesfällen im Ausland bedeutet weder, dass jedes Verschwindenlassen gerichtlich geklärt
      ist, noch dass die verstärkenden Zeitungen den Schaden vollständig wiedergutgemacht haben. Eine Untersuchung des
      Nationalarchivs von 2025 berichtete über begrenzte Richtigstellungen auf Innenseiten, erfolglose Forderungen nach
      gleich prominenter Korrektur und damals anhängige Eingaben bei der Interamerikanischen Menschenrechtskommission.
episodes:
  - id: chile-1975
    polity: Chile
    institutions:
      - Dirección de Inteligencia Nacional (DINA)
      - Informationsapparat der chilenischen Militärdiktatur
    institutionalContext: >-
      Unter Druck wegen der verschwundenen Gefangenen entwickelte die DINA eine grenzüberschreitende Tarnlegende. In einer
      frühen Phase wurden Leichen in Argentinien mit gefälschten chilenischen Identitäten versehen. Im Juli gipfelte die
      Operation in zwei Listen mit insgesamt 119 Namen, die über Lea in Argentinien und O Dia/Novo O Dia in Brasilien
      platziert wurden. Laut Rettig-Kommission waren diese Titel eigens dafür geschaffen oder reaktiviert worden.
      Regimenahe chilenische Zeitungen übernahmen und dramatisierten die Meldungen. Zentrale staatliche Träger waren die
      DINA und der Informationsapparat der Diktatur; die ausländischen Titel und chilenischen Zeitungen dienten als Kanäle
      und Verstärker, ohne dass damit die Kenntnis jedes einzelnen Beschäftigten über den Ursprung belegt wäre.
    consequences:
      - Verschleierung des gewaltsamen Verschwindenlassens durch chilenische Staatsorgane
      - Falsche Zuschreibung des Schicksals der Opfer zu linken Säuberungen oder Kämpfen mit ausländischen Sicherheitskräften
      - Nutzung von Namen aus bereits eingereichten Amparo-Anträgen für eine Erzählung, die staatlichen Gewahrsam leugnete
      - Verwirrung der Öffentlichkeit und Diskreditierung von Angehörigen und Menschenrechtsorganisationen
      - Demütigung und Isolation von Opferfamilien und Menschenrechtsverteidigern
      - Grenzüberschreitende Platzierung in obskuren ausländischen Publikationen und anschließende breite Verstärkung in chilenischen Zeitungen
      - Jahrzehntelange Strafverfahren zu einzelnen Opfern und Forderungen nach prominenter Richtigstellung durch die Presse
    summary: >-
      Die Operación Colombo nutzte scheinbar externe Publikationen, um einer staatlichen Tarnlegende den Anschein
      unabhängiger Bestätigung zu geben. Die beiden Listen fassten 119 unterschiedliche Fälle von Verschwindenlassen
      zusammen; chilenische Medien formten daraus eine reißerische Geschichte über Todesfälle im Ausland. Der Rettig-Bericht
      ordnete die Konstruktion 1991 amtlich als DINA-Desinformation ein. Spätere Gerichte stellten Verantwortung in
      Einzelfällen fest, ohne das Schicksal jedes Opfers zu klären.
    mechanism:
      summary: >-
        Die DINA platzierte einander ergänzende Listen über obskure argentinische und brasilianische Publikationen, nachdem
        zuvor versucht worden war, Leichen in Argentinien mit gefälschten Identitäten chilenischer Gefangener zu verbinden.
        Das eingeschränkte Medienumfeld der Diktatur und die schnelle Übernahme durch regimenahe chilenische Zeitungen
        ließen die lancierten Auslandsberichte wie eine Bestätigung der amtlichen Leugnung der Festnahmen erscheinen.
    institutionalCorrection:
      periodLabel: 1991–2023
      action: Die Rettig-Kommission ordnete die Operación Colombo 1991 als DINA-Desinformation ein; chilenische Gerichte stellten später in einzelnen Colombo-Verfahren die Verantwortung der DINA fest, darunter in einem Urteil des Obersten Gerichtshofs von 2023 zu 16 Opfern.
      summary: >-
        Der demokratische Staat ersetzte die Erzählung von Todesfällen im Ausland durch eine amtliche Darstellung von Festnahme,
        Verschwindenlassen und staatlicher Verantwortung. Die Fälschung ist damit eindeutig korrigiert. Das bedeutet jedoch
        weder, dass die sterblichen Überreste jedes Opfers gefunden oder alle 119 Fälle rechtskräftig abgeschlossen wurden,
        noch dass die verstärkenden Zeitungen eine vollständige und gleich prominente Richtigstellung veröffentlicht haben.
evidence:
  - id: colombo-mmdh-proposition
    note: >-
      Das chilenische Erinnerungsmuseum beschreibt den Vorgang als mediale Fabrikation der Diktatur, die falsche
      DINA-Erzählung über interne MIR-Tötungen sowie die beiden Auslandspublikationen und die anschließende Verstärkung in Chile.
  - id: colombo-rettig-proposition
    note: >-
      Die Wahrheitskommission rekonstruiert die Behauptung, verschwundene Gefangene hätten einander im Ausland getötet, die
      falschen Identitäten an Leichen in Argentinien und die beiden Listen über 119 angebliche Auslandstote.
  - id: colombo-cable-proposition
    note: >-
      Die US-Botschaft bewertete die Auslandsberichte im August 1975 als wahrscheinlich falsch, fand für keine der beiden
      Listen eine Bestätigung und hielt eine Lancierung durch chilenische Regierungskräfte für die plausibelste Erklärung.
  - id: colombo-mmdh-correction
    note: >-
      Das Museum hält fest, dass die 119 in Chile festgenommen, gefoltert und zum Verschwinden gebracht worden waren, und
      dokumentiert die erste Anklage von 2004 gegen ehemalige DINA-Agenten wegen 34 Opfern.
  - id: colombo-bcn-correction
    note: >-
      Das Parlamentsprotokoll zitiert die Rettig-Feststellung einer DINA-Desinformation und beschreibt die 119 als in
      Chile Entführte, deren angebliche Auslandstode erfunden worden waren.
  - id: colombo-rettig-correction
    note: >-
      Die Kommission ordnet die Operación Colombo als Maßnahme der DINA ein, die den Druck wegen der Verschwundenen mindern
      sollte, und hält in den jeweiligen Einzelfällen ihre Feststellungen zur Verantwortung von Staatsorganen fest.
  - id: colombo-mmdh-impact
    note: >-
      Dokumentiert den internationalen Druck, die Kampagne in Chile, den Einsatz zweier eigens geschaffener ausländischer Publikationen
      und spätere Strafverfahren zu Opfern aus der Liste.
  - id: colombo-rettig-impact
    note: >-
      Der Bericht hält fest, dass die chilenische Verbreitung der Listen Verwirrung stiftete, Anzeigen wegen
      Verschwindenlassens diskreditierte und Angehörige sowie Menschenrechtsverteidiger demütigte und isolierte.
  - id: colombo-mmdh-carrier
    note: >-
      Benennt die DINA als Organisatorin sowie El Mercurio, La Segunda und La Tercera als chilenische Verbreiter der
      falschen Darstellung und unterscheidet damit staatlichen Ursprung von medialer Verstärkung.
  - id: colombo-rettig-carrier
    note: >-
      Schreibt die Operation und Veröffentlichung der beiden Listen der DINA zu und beschreibt gesondert ihre schnelle,
      reißerische Übernahme durch chilenische Zeitungen.
  - id: colombo-judiciary-mechanism
    note: >-
      Die chilenische Justiz beschreibt eine von der DINA ausgeführte Kommunikationsfabrikation, bei der Medien
      fälschlich berichteten, politische Gefangene seien im Untergrund und hätten einander getötet.
  - id: colombo-rettig-mechanism
    note: >-
      Rekonstruiert die gefälschten Identitäten, die 119 Namen in eigens geschaffenen oder reaktivierten ausländischen Publikationen und
      die anschließende Pressekampagne in Chile.
  - id: colombo-rettig-consequences
    note: >-
      Dokumentiert unmittelbar die Folgen für das öffentliche Verständnis, für Anzeigen wegen Verschwindenlassens, für
      Opferfamilien und für Menschenrechtsverteidiger.
  - id: colombo-cable-context
    note: >-
      Die zeitgenössische diplomatische Analyse unterscheidet Leas Säuberungserzählung zu 60 Personen von O Dias
      Kampferzählung zu 59 Personen, verbindet die Namen mit Amparo-Anträgen und belegt frühe Skepsis, ohne spätere
      Feststellungen durch damalige Schlussfolgerungen zu ersetzen.
  - id: colombo-archive-context
    note: >-
      Der Band des Nationalarchivs behandelt die Publikationen mit 60 und 59 Namen, psychologische DINA-Operationen,
      chilenische Pressekanäle, den Festnahmezeitraum der Opfer und den Unterschied zwischen faktischer Widerlegung und
      späterer Richtigstellung durch die Presse.
  - id: colombo-bcn-institutional-correction
    note: >-
      Das amtliche Protokoll gibt die Rettig-Zurückweisung wieder und zeigt, wie die Abgeordnetenkammer weitere Aufklärung
      und Justiz verlangte, wobei sie die Colombo-Erzählung ausdrücklich als Erfindung der DINA behandelte.
  - id: colombo-archive-institutional-correction
    note: >-
      Dokumentiert spätere Strafurteile, darunter die Entscheidung des Obersten Gerichtshofs von 2023 zu 16 Opfern und 59
      ehemaligen DINA-Agenten, und erklärt zugleich, warum prominente Richtigstellungen und die gerichtliche Aufarbeitung
      der einzelnen Opferfälle unvollständig bleiben.
