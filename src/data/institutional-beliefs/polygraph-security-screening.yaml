schemaVersion: 2
title: Polygraph screening as reliable detection of deception and personnel risk
proposition:
  summary: >-
    Polygraph screening was treated as accurate enough to infer deception, concealed misconduct, or personnel risk from
    physiological responses, justifying mandatory personnel screening and consequential security, integrity, hiring, or
    appointment decisions.
correction:
  summary: >-
    Polygraph responses measure physiological arousal, not deception, integrity, or corruption propensity itself.
    Specific-incident testing can perform above chance under some conditions, but it is far from infallible, and evidence
    for broad personnel-screening accuracy is much weaker. Screening and high-stakes appointment decisions amplify
    false-positive and false-negative risks, especially when the targeted misconduct is rare. Polygraphs may still have
    investigative, deterrent or admission-eliciting utility, but those functions are distinct from reliable individual
    truthfulness, integrity or future-misconduct determination.
category: Security screening and behavioral detection
reviewedAt: '2026-08-24'
impact:
  summary: >-
    The documented footprint now includes both corrected systems and current ones. The U.S. Department of Energy reduced
    the evidentiary weight of mandatory security screening after a National Academies review; Moldova removed a dispositive
    positive-result gate after constitutional review. Kyrgyzstan, Kazakhstan and Uzbekistan, however, continue to embed
    polygraph results in public-service, law-enforcement or judicial personnel systems. The institutional error is not the
    use of physiological data itself, but treating those responses as sufficiently diagnostic of truthfulness, concealed
    misconduct or integrity risk to influence consequential personnel decisions.
  highlights:
    - value: '2002'
      label: National Academies found screening accuracy insufficient to justify reliance on polygraphs for detecting security violators
    - value: 2010–present
      label: Kyrgyzstan retains polygraph testing in its state-service personnel framework, including corruption-risk posts
    - value: 2014–present
      label: Kazakhstan requires polygraph conclusions on answer truthfulness in law-enforcement screening and later extended testing to judge candidates
    - value: 2023–present
      label: Uzbekistan made polygraph examination part of Interior Ministry recruitment and trains specialists to assess corruption and misconduct risk
  context:
    - >-
      The correction is narrower than “polygraphs never work.” The strongest evidentiary problem concerns broad screening
      and consequential personnel decisions, where physiological arousal is treated as if it uniquely identified deception,
      concealed misconduct or future institutional risk.
    - >-
      Several current systems formally describe polygraph conclusions as advisory, probabilistic or one component of a wider
      assessment. They still qualify here when the test is institutionally required and its inferred truthfulness or risk
      findings are expressly fed into hiring, appointment, attestation or internal-investigation decisions.
episodes:
  - id: united-states-doe-1999-2006
    polity: United States
    region: North America
    startYear: 1999
    endYear: 2006
    periodLabel: 1999–2006
    strength: policy-basis
    institutionTypes:
      - government
    institutions:
      - United States Department of Energy (DOE)
      - National Nuclear Security Administration (NNSA)
      - DOE Office of Counterintelligence
    institutionalContext: >-
      DOE’s 1999 rule made counterintelligence polygraph screening part of the access regime for categories of federal and
      contractor personnel handling highly sensitive nuclear and classified information. Congress then required DOE to take
      account of a National Academy of Sciences review. After the 2002 report found the test insufficiently accurate for
      employee security screening, DOE initially proposed continuing the existing program, then revised the system in 2006
      so that polygraph findings were only one component of a broader counterintelligence evaluation and could not alone
      support adverse personnel or access action.
    consequences:
      - Employees and contractors in sensitive positions were subjected to mandatory counterintelligence polygraph screening
      - Refusal could prevent initial access to sensitive positions or result in loss of classified access
      - Polygraph results generated follow-up interviews and counterintelligence investigation
      - Screening created predictable risks of false suspicion and false reassurance in a very low-base-rate security population
    summary: >-
      In 1999 the U.S. Department of Energy created a formal counterintelligence polygraph screening program for employees,
      contractors and applicants with access to especially sensitive classified information and nuclear-security programs.
      DOE then commissioned the National Academies to review the science. The 2002 review concluded that polygraph accuracy
      was insufficient for employee security screening because the rarity of actual spies and saboteurs makes damaging false
      positives and false negatives unavoidable. DOE’s 2006 replacement rule retained polygraphs for defined high-risk
      evaluations but formally limited their evidentiary role.
    mechanism:
      kind: administrative-adoption
      summary: >-
        DOE made polygraph examination a formal personnel-access screening requirement and used results to trigger further
        counterintelligence evaluation for employees, contractors and applicants in sensitive positions.
    institutionalCorrection:
      status: partial
      periodLabel: '2006'
      action: DOE replaced the earlier screening rule so polygraph findings became only one component of a broader counterintelligence evaluation and could not alone support adverse personnel or access action.
      summary: >-
        DOE reduced the test’s evidentiary authority after the scientific review but retained polygraph use in defined
        evaluations, making this a limitation rather than a complete institutional abandonment.
  - id: moldova-2016-2018
    polity: Moldova
    region: Eastern Europe
    startYear: 2016
    endYear: 2018
    periodLabel: 2016–2018
    strength: policy-basis
    institutionTypes:
      - government
      - court
    institutions:
      - National Integrity Authority (Autoritatea Națională de Integritate)
      - Integrity Council (Consiliul de Integritate)
    institutionalContext: >-
      Moldova’s integrity-law framework made a positive polygraph result a practical condition for appointment to senior
      leadership of the National Integrity Authority. In 2017 candidate Teodor Cârnaț passed the written examination and
      interview but was excluded because his polygraph was not positive. In 2018 the Constitutional Court emphasized that
      polygraph results are presumptive and orientative, reviewed the test’s low scientific certainty, and invalidated the
      requirement that a candidate obtain a positive result.
    consequences:
      - A candidate for a senior public integrity office was excluded solely because he did not obtain a positive polygraph result
      - A physiologically based test became an eliminatory gate for public appointment
      - The system risked treating uncertain deception inference as a definitive integrity judgment
      - Constitutional litigation was required to reduce the test from dispositive gate to non-conclusive information
    summary: >-
      Moldova’s 2016 National Integrity Authority framework required leadership candidates to undergo polygraph testing in
      a way that made a positive result eliminatory. In 2017 Teodor Cârnaț was excluded after passing the written and
      interview stages because he did not obtain a positive polygraph result. The Constitutional Court held in 2018 that the
      test has low scientific certainty and is presumptive and orientative rather than exact; it removed the positive-result
      requirement as an unjustified dispositive barrier.
    mechanism:
      kind: administrative-adoption
      summary: >-
        The integrity-law appointment framework converted a polygraph outcome into an eliminatory gate for senior public
        appointment, allowing a non-positive result to override otherwise successful selection stages.
    institutionalCorrection:
      status: partial
      periodLabel: 10 April 2018
      action: Moldova's Constitutional Court struck down the requirement that a candidate obtain a positive polygraph result and characterized the test as presumptive and orientative rather than exact.
      summary: >-
        The court removed the dispositive gate and reduced the institutional authority of the test, but the current evidence
        record describes a demotion to non-conclusive information rather than complete abolition of polygraph use.
  - id: kyrgyzstan-2010-2026
    polity: Kyrgyzstan
    region: Central Asia
    startYear: 2010
    endYear: 2026
    endOpen: true
    periodLabel: 2010–present
    strength: policy-basis
    institutionTypes:
      - government
    institutions:
      - State Personnel Service of the Kyrgyz Republic
      - State Agency for Civil Service and Local Government under the Cabinet of Ministers of the Kyrgyz Republic
    institutionalContext: >-
      A 2010 presidential decree introduced polygraph testing into Kyrgyzstan’s state-service personnel system. The
      implementing regulation defined testing as an assessment of the reliability of information supplied by the examinee
      and set goals including detecting official abuse, identifying commitment or susceptibility to corrupt conduct,
      verifying education and qualifications, and assessing suitability for a post. Amendments in 2018 expressly included
      government positions most exposed to corruption risk. The present State Agency for Civil Service and Local Government
      still lists the decree in its normative legal base, and the agency’s current governing regulation assigns it
      responsibility for organizing polygraph testing where legislation provides.
    consequences:
      - State-service applicants in covered posts can be subjected to polygraph screening
      - Physiological responses are used to assess the reliability of information supplied by candidates and officials
      - Testing is directed at corruption susceptibility, official misconduct and suitability for public service
      - Polygraph information can enter recruitment, rotation and internal-investigation processes
    summary: >-
      Kyrgyzstan formally introduced polygraph testing into state-service personnel policy in 2010 as an anti-corruption and
      integrity-screening tool. The governing framework treats the examination as capable of assessing whether information
      supplied by an applicant or official is reliable and uses it to probe corruption-related risk, hidden misconduct,
      qualifications and job suitability. The regime was amended in 2018 to include posts considered particularly exposed
      to corruption, and the current civil-service agency still lists the decree among its operative legal foundations.
    mechanism:
      kind: administrative-adoption
      summary: >-
        State-service rules made polygraph testing a personnel-screening instrument for judging the reliability of supplied
        information, corruption susceptibility, hidden misconduct, qualifications and suitability for public office.
    institutionalCorrection:
      status: ongoing
      periodLabel: 2010–present
      action: No institutional correction is documented; the current civil-service agency still lists the polygraph decree among its operative legal foundations.
      summary: >-
        The personnel framework remains institutionally current and continues to treat polygraph-derived information as
        relevant to state-service screening.
  - id: kazakhstan-2014-2026
    polity: Kazakhstan
    region: Central Asia
    startYear: 2014
    endYear: 2026
    endOpen: true
    periodLabel: 2014–present
    strength: policy-basis
    institutionTypes:
      - government
    institutions:
      - Government of the Republic of Kazakhstan
      - Ministry of Internal Affairs of the Republic of Kazakhstan
      - High Judicial Council of the Republic of Kazakhstan
      - National Security Committee of the Republic of Kazakhstan
    institutionalContext: >-
      Government rules adopted in 2014 require polygraph examinations for defined applicants and personnel in law
      enforcement, civil protection and state courier bodies. Their stated purpose is to obtain additional information and
      check the reliability of information supplied by the examinee; the polygraphist issues a formal conclusion about the
      truthfulness of answers. The rules expressly say the result is probabilistic, advisory and auxiliary, yet require
      personnel and internal-security bodies to use it in hiring, attestation, competition and service-investigation
      decisions. Separate rules adopted in 2016 require successful judicial-exam candidates to undergo testing at the
      National Security Committee. Both frameworks remain current.
    consequences:
      - Applicants and serving personnel in covered security and law-enforcement bodies undergo polygraph screening
      - Formal conclusions classify the truthfulness of answers given during the examination
      - Results feed hiring, attestation, promotion competition, education admission and service-investigation processes
      - Judge candidates who pass the qualification examination undergo polygraph testing before further consideration
      - Information suggesting involvement in offences is forwarded for further official verification
    summary: >-
      Kazakhstan has embedded polygraph screening in consequential public-personnel decisions since 2014. Current rules
      require a polygraphist to issue a conclusion on the truthfulness of an examinee’s answers and direct personnel and
      internal-security bodies to use the resulting information in recruitment, attestation, competitions and service
      investigations, while formally describing it as probabilistic and advisory. A parallel system has applied to judge
      candidates since 2016; both frameworks remained current through 2026.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Government personnel rules require polygraph examinations and formal truthfulness conclusions and feed the
        resulting information into recruitment, attestation, competitions, service investigations and judge-candidate review.
    institutionalCorrection:
      status: ongoing
      periodLabel: 2014–present
      action: No correction is documented; the law-enforcement rules remained current with 2025 amendments and the judge-candidate framework was amended again in July 2026.
      summary: >-
        Kazakhstan continues to institutionalize polygraph-derived truthfulness judgments in consequential personnel
        systems despite formally describing results as probabilistic and advisory.
  - id: uzbekistan-2023-2026
    polity: Uzbekistan
    region: Central Asia
    startYear: 2023
    endYear: 2026
    endOpen: true
    periodLabel: 2023–present
    strength: policy-basis
    institutionTypes:
      - government
    institutions:
      - Ministry of Internal Affairs of the Republic of Uzbekistan
      - Academy of the Ministry of Internal Affairs of the Republic of Uzbekistan
    institutionalContext: >-
      Uzbekistan’s current Interior Ministry service rules make a psychophysiological polygraph examination part of the
      investigative stage for candidates entering the internal-affairs bodies from 1 September 2023, specifically to
      identify negative factors that can prevent service. The results of the selection and investigation stages feed an
      official conclusion on the candidate’s moral-professional and health suitability. In August 2026 the Interior
      Ministry Academy trained psychologists to use polygraph testing to assess applicant risk factors and identify an
      employee’s propensity toward corruption and other misconduct.
    consequences:
      - Police-service candidates undergo polygraph examination as part of the formal recruitment investigation stage
      - Polygraph-derived risk findings contribute to assessment of suitability for service
      - Personnel specialists are trained to infer propensity toward corruption and other misconduct from psychophysiological testing
      - The method is being institutionalized through certified specialist training inside the Interior Ministry system
    summary: >-
      Since September 2023, Uzbekistan has required a psychophysiological polygraph examination within the selection
      process for candidates entering the internal-affairs service, with the stated purpose of identifying negative factors
      that may bar service. This remains an active personnel practice. In August 2026 the Interior Ministry Academy trained
      specialists to use polygraph examinations to evaluate candidate risk factors and identify corruption and other
      misconduct propensity when making personnel decisions.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Interior Ministry service rules made polygraph testing part of recruitment screening, while the ministry academy
        trains specialists to infer applicant risk and propensity toward corruption or misconduct from psychophysiological responses.
    institutionalCorrection:
      status: ongoing
      periodLabel: 2023–present
      action: No correction is documented; the Interior Ministry continued the recruitment requirement and expanded specialist training in August 2026.
      summary: >-
        The current personnel system continues to operationalize polygraph-derived risk judgments rather than formally
        retreating from them.
