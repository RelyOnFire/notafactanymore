term: Prion
aliases:
- Prionen
- Prionprotein
shortDefinition: Eine infektiöse Proteinform, die sich ausbreiten kann, indem sie normal gefaltete Versionen desselben
  Proteins zur gleichen abnormen Faltung bringt.
longDefinition: 'Ein Prion ist ein infektiöser Erreger, der hauptsächlich aus Protein besteht und kein eigenes DNA-
  oder RNA-Genom besitzt. Seine Vermehrung beruht auf der Proteinform: Eine abnorm gefaltete Variante kann normal
  gefaltete Kopien des Wirtsproteins dazu bringen, denselben fehlgefalteten Zustand anzunehmen. Der Wirt besitzt
  weiterhin das Gen für das normale Protein; dem infektiösen Agens fehlt ein eigenes Nukleinsäuregenom.'
