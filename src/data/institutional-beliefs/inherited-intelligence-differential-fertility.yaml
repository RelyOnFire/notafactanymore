    sourceId: deary-intelligence-genetics-2021
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Genetic nurture discussion and Box 2
    note: >-
      Explains that intelligence is heritable and polygenic while defining heritability as variation in a particular
      sample and time, and distinguishes direct genetic effects from indirect, environmentally mediated effects.
  - id: okbay-science-correction
    sourceId: okbay-education-genetics-2022
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Abstract; Polygenic prediction; Direct and population effects
    note: >-
      In a roughly three-million-person GWAS, the educational-attainment polygenic index explained 12–16 percent of
      variance, and controlling parental indices roughly halved its association, showing both limited prediction and
      substantial indirect or contextual contribution.
