    paragraphs 27–33 on validity, rights and relief, particularly 32–33.
  note: >-
    Paragraphs 6–7 describe the medico-legal instructions and forms governing examinations; the later analysis
    explains their use to assess purported virginity. The relevant administrative mechanism is the instruction
    and its evidentiary inference, not every clinically necessary examination of a survivor.
- id: virginity-pakistan-lhc-consequences
  sourceId: virginity-pakistan-lhc-judgment
  relation: supports
  target:
    scope: episode
    episodeId: pakistan-2015-2021
