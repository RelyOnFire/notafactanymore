term: Super-Kamiokande
aliases:
- Super-K
- Super-Kamioka Neutrino Detection Experiment
shortDefinition: A large underground neutrino detector in Japan that uses an enormous tank of ultra-pure water and light
  sensors to observe neutrino interactions.
longDefinition: Super-Kamiokande is a water-Cherenkov detector located about one kilometer underground in Japan. Charged
  particles created when neutrinos interact in its water can emit faint Cherenkov light, which thousands of photomultiplier
  tubes record. Its 1998 atmospheric-neutrino results provided compelling evidence for neutrino oscillation and therefore
  nonzero neutrino mass.
relatedTerms:
- neutrino-oscillation
reviewedAt: '2026-08-21'
