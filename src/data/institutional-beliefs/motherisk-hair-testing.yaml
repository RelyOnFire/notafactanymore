title: Motherisk hair testing as forensic evidence
claim: Motherisk hair-strand testing was treated as sufficiently reliable to establish drug or alcohol consumption
  or exposure for child-protection and criminal proceedings.
currentUnderstanding: Hair toxicology can be informative when validated forensic methods, confirmation testing,
  contamination controls, and appropriately cautious interpretation are used. The Motherisk Drug Testing Laboratory's
  methods and interpretation from 2005 to 2015 did not meet internationally recognized forensic standards and were
  found inadequate and unreliable for evidentiary use.
category: Medicine and public health
reviewedAt: 2026-08-23
impact:
  summary: Motherisk was not an isolated laboratory error. Between 2005 and 2015 the laboratory tested more than
    24,000 hair samples from over 16,000 individuals for child-protection purposes. After the testing was found
    inadequate and unreliable for evidentiary use, Ontario created a commission that reviewed 1,271 children's-aid-society
    cases to identify people who might have been affected.
  highlights:
  - value: More than 24,000
    label: Hair samples tested for child-protection purposes, 2005–2015
  - value: More than 16,000
    label: Individuals represented in those tests
  - value: 1,271
    label: Children's-aid-society cases reviewed by the Motherisk Commission
    note: A reviewed case is not the same thing as a case in which the test determined the outcome.
  context:
  - The problem was not that hair toxicology as a field was inherently meaningless. The problem was that a hospital
    laboratory evolved from clinical testing into work used for legal fact-finding without the validation, confirmation
    procedures, quality controls, proficiency standards, and interpretive restraint expected of a forensic laboratory.
  - Once a laboratory result entered a child-protection file, it could influence how agencies and courts interpreted
    parental drug or alcohol use. That gave a technical result institutional consequences far beyond the laboratory
    itself. Ontario therefore had to review not just the analytical method but the downstream decisions that may
    have relied on it.
episodes:
- id: ontario-2005-2015
  polity: Ontario, Canada
  region: North America
  startYear: 2005
  endYear: 2015
  strength: policy-basis
  institutionTypes:
  - medical
  - government
  - court
  institutions:
  - Motherisk Drug Testing Laboratory, The Hospital for Sick Children (SickKids)
  - Ontario Ministry of Children and Youth Services
  consequences:
  - Hair-test results were used in child-protection proceedings across Ontario
  - Laboratory results were treated as evidence of drug or alcohol consumption or exposure
  - Ontario directed children's aid societies to stop using or relying on Motherisk hair testing
  - An independent provincial review and subsequent commission were created to examine the consequences of the testing
  summary: Between 2005 and 2015, the Motherisk Drug Testing Laboratory at Toronto's Hospital for Sick Children
    tested thousands of hair samples for drug and alcohol consumption or exposure. Its results were used primarily
    in child-protection proceedings and also in some criminal proceedings. Ontario's independent review concluded
    that the laboratory's hair-strand testing during this period was inadequate and unreliable for use as evidence
    and that its operation did not meet internationally recognized forensic standards. The province instructed children's
    aid societies to stop using the tests and created a further process to review potentially affected child-protection
    matters.
  sources:
  - title: Innocence at Stake — Motherisk Hair Analysis Independent Review
    url: https://www.ppsc-sppc.gc.ca/eng/pub/is-ip/ch6.html
    publisher: Public Prosecution Service of Canada
    note: Summarizes the Lang Review, the laboratory's evolution into clinical and forensic testing, its use in
      thousands of samples from 2005 to 2015, and the conclusion that the testing was inadequate and unreliable
      for child-protection and criminal proceedings.
  - title: Ontario Expanding Mandate for Review of Motherisk Program
    url: https://news.ontario.ca/en/release/32522/ontario-expanding-mandate-for-review-of-motherisk-program
    publisher: Government of Ontario
    note: Records the province's review of Motherisk methods against internationally recognized forensic standards
      and its direction that children's aid societies immediately stop using or relying on the hair tests.
  - title: 'Harmful impacts: The reliance on hair testing in child protection'
    url: https://www.ontario.ca/page/harmful-impacts-reliance-hair-testing-child-protection
    publisher: Government of Ontario
    note: Records more than 24,000 hair samples from over 16,000 individuals tested for child-protection purposes
      between 2005 and 2015 and states that the subsequent Motherisk Commission reviewed 1,271 children's-aid-society
      cases.
  - title: Order in Council — Motherisk Commission
    url: https://news.ontario.ca/mag/en/2016/01/order-in-council-1.html
    publisher: Government of Ontario
    note: Records the official finding that Motherisk hair-strand testing from 2005 to 2015 was inadequate and unreliable
      for evidence in child-protection and criminal proceedings.
  - title: Update on Motherisk Program at The Hospital for Sick Children
    url: https://www.sickkids.ca/en/news/archive/2017/update-on-motherisk-program-at-the-hospital-for-sick-children/
    publisher: The Hospital for Sick Children
    note: Confirms that SickKids permanently closed the Motherisk Drug Testing Laboratory in April 2015 after concerns
      about the laboratory emerged.
  institutionalContext: 'Motherisk results travelled through Ontario''s child-protection system: children''s aid
    societies requested or relied on testing, and results entered proceedings before Ontario courts. Those downstream
    bodies were numerous rather than a single named institution, so they are described here rather than collapsed
    into generic institution labels.'
