title: Liu Shaoqi as a traitor and enemy agent
claim: During the Cultural Revolution, the Chinese Communist Party formally declared Liu Shaoqi a traitor, enemy agent and
  labor scab, portrayed him as the head of a counterrevolutionary revisionist or bourgeois headquarters inside the Party,
  and treated large numbers of officials and citizens as members, agents or products of his supposed political network.
currentUnderstanding: In 1980 the Chinese Communist Party's Eleventh Central Committee formally reversed the case. Its Fifth
  Plenum stated that the theory of a counterrevolutionary revisionist line and a bourgeois headquarters led by Liu was completely
  wrong and untenable, that materials had been fabricated to frame and persecute him, and that numerous party, state and military
  cadres had been falsely branded as his agents. The plenum revoked the accusations, annulled the 1968 investigation report
  and restored Liu's reputation.
category: Political repression, Cultural Revolution and party-state propaganda
reviewedAt: '2026-08-25'
impact:
  summary: The accusations against Liu became a formal party-state doctrine rather than a factional insult. In October 1968
    the enlarged Twelfth Plenum of the Eighth Central Committee approved the investigation report branding the sitting state
    president a traitor, enemy agent and scab, permanently expelled him from the Party and stripped all party and state posts.
    The campaign was extended to people labeled Liu's agents, followers or products of his line across the party, government,
    military, workplaces, universities and schools. Liu remained detained and severely persecuted and died in Kaifeng in November
    1969. In February 1980 the Fifth Plenum fully rehabilitated him and ordered correction of the wrongful cases created through
    association with his case.
  highlights:
  - value: 12 years
    label: from the Central Committee's formal 1968 condemnation to full Party rehabilitation in 1980
  - value: '1969'
    label: year Liu died in detention after political persecution and physical mistreatment
  - value: Largest
    label: wrongful case in the Party's history, as the CCP's own 1980 account described the Liu Shaoqi case
  context:
  - “Traitor, enemy agent and scab” translates the formal Chinese labels 叛徒、内奸、工贼. The terms carried specific revolutionary-political
    meanings and should not be expanded into additional crimes that were not part of the formal accusation.
  - The 1980 correction did not deny that Liu had political disagreements with Mao or that serious policy disputes existed
    before the Cultural Revolution. It rejected the conversion of those disagreements into a fabricated counterrevolutionary
    identity and criminal-political network.
  - The Party's later account assigns major responsibility for fabricated materials and persecution to Lin Biao, the Gang
    of Four and associated actors while also acknowledging that the 1968 Central Committee plenum itself formally adopted
    the erroneous conclusion. The carrier is therefore the party-state institution that ratified and enforced the case, not
    merely the individuals later blamed for constructing it.
