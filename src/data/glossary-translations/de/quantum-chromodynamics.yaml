locale: de
entryId: quantum-chromodynamics
sourceReviewedAt: '2026-08-21'
term: Quantenchromodynamik
aliases:
- QCD
shortDefinition: Die Quantentheorie der starken Wechselwirkung, die beschreibt, wie Quarks über Gluonen miteinander wechselwirken.
longDefinition: Die Quantenchromodynamik, meist QCD abgekürzt, ist der Teil des Standardmodells, der die starke Wechselwirkung
  beschreibt. Quarks tragen eine Farbladung und wechselwirken durch den Austausch von Gluonen. QCD erklärt, warum Quarks
  in Hadronen wie Protonen und Neutronen gebunden bleiben und warum ein großer Teil der Masse eines Nukleons aus der
  Energie der starken Wechselwirkung stammt und nicht allein aus den Massen seiner Quarks.
