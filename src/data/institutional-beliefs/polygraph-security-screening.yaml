  - id: polygraph-kyrgyz-nas-context
    sourceId: polygraph-nas
    relation: contextualizes
    target: {scope: episode, episodeId: kyrgyzstan-2010-2026, aspect: context}
    locator: 'Executive Summary, pp. 1–7: inference from physiological responses, screening validity and future-behavior claims'
    note: >-
      Scientific review finding that physiological responses measured by polygraphs are not unique to deception,
      that evidence for screening accuracy is extremely limited, and that employee screening creates serious
      false-positive and false-negative problems; it distinguishes these limitations from the above-chance
      performance sometimes seen in specific-incident testing. Provides scientific context for the screening
      inference, not evidence of local implementation, measured harms or an institutional response.
