title: Facilitated communication as authentic authored communication
claim: Institutions treated messages produced through facilitated communication as the authentic communication of nonspeaking people with autism or other developmental disabilities, even though a facilitator physically supported the person's hand or arm and could unknowingly determine the output.
currentUnderstanding: >-
  Facilitated communication is a discredited facilitator-dependent technique. Controlled authorship tests repeatedly found that messages tracked information available to facilitators rather than information known only to the disabled person. Independent augmentative and alternative communication is different: the problem is attributing authorship when message production depends on a facilitator who can influence selection.
category: Special education and communication
reviewedAt: '2026-08-27'
impact:
  summary: Facilitated communication acquired institutional legitimacy in university training and special education while controlled studies were showing that facilitators could unknowingly author the messages. In documented school use, facilitated output entered an individual education plan and was used to describe a child's academic abilities.
  highlights:
  - value: '1992'
    label: Syracuse University opened a Facilitated Communication Institute to study and promote the method
  - value: 1992–1993
    label: A New York child's IEP explicitly stated that facilitated communication was required for effective participation
  - value: '2018'
    label: ASHA formally described facilitated communication as discredited and said its output should not be treated as the disabled person's communication
  context:
  - The discredited claim concerns facilitator-dependent authorship, not communication aids in general. Keyboards, letterboards and other AAC systems can support genuine independent communication when authorship is not controlled by another person.
  - False allegations of abuse are among the documented harms of facilitated communication, but those harms should not be attributed wholesale to the Syracuse or Onteora episodes specifically.
  - Syracuse University material from 2020 still documented training and technical support for typers and facilitators. The evidence establishes continuation through 2020, not that every related university activity necessarily ceased in that year.
episodes:
- id: united-states-syracuse-university-1992-2020
  polity: United States
  region: North America
  startYear: 1992
  endYear: 2020
  strength: institutionally-influential
  institutionTypes:
  - university
  - education
  institutions:
  - Syracuse University School of Education
  - Facilitated Communication Institute / Institute on Communication and Inclusion
  institutionalContext: Syracuse University's School of Education opened the Facilitated Communication Institute in 1992 explicitly to study and promote communication by people with autism and other developmental disabilities. The university later renamed the unit, but its own 2020 material still described the successor initiative as a national and international leader in research and training about typing to communicate and as providing training and technical support to typers and facilitators.
  consequences:
  - A research university created a dedicated institute that gave facilitated communication sustained academic and professional legitimacy
  - The institute trained and supported facilitators and disseminated the method through research, workshops and technical assistance
  - Institutional promotion continued after controlled studies in the early 1990s had already demonstrated facilitator control under blinded conditions
  - The university's own history preserves the institute as part of its disability-education legacy, while Syracuse's Communication Sciences and Disorders department now separately affirms ASHA's position and does not advocate facilitator-dependent methods with ambiguous authorship
  summary: >-
    Syracuse University gave facilitated communication an unusually durable university home. Its School of Education opened the Facilitated Communication Institute in 1992 to study and promote the method, and successor programs continued training and support around facilitator-assisted typing for years afterward. This institutional endorsement overlapped with a rapidly growing controlled literature: in blinded tests, supposed communicators failed to transmit information unavailable to the facilitator, while typed answers often reflected what the facilitator had seen. The later professional consensus did not reject the goal of communication access; it rejected treating facilitator-dependent output as authored by the disabled person without independent evidence.
  sources:
  - title: History of the School of Education
    url: https://soe.syr.edu/about/history/
    publisher: Syracuse University School of Education
    note: Syracuse's institutional history records that the Facilitated Communication Institute opened in 1992 to study and promote communication by people with autism and other developmental disabilities and was later renamed.
  - title: Education Exchange 2020
    url: https://soe.syr.edu/wp-content/uploads/EducationExchangeFall2020.pdf
    publisher: Syracuse University School of Education
    note: The School of Education's 2020 publication describes the successor Inclusion and Communication Initiatives as a national and international leader in research and training about typing to communicate and notes training and technical support for typers and facilitators.
  - title: An experimental assessment of facilitated communication
    url: https://pubmed.ncbi.nlm.nih.gov/8441353/
    publisher: Mental Retardation / PubMed
    note: A 1993 controlled study found that when participants and facilitators saw different pictures, typed answers matched the pictures shown to facilitators, demonstrating that facilitators were unknowingly determining the output.
  - title: Facilitated Communication
    url: https://www.asha.org/policy/ps2018-00352/
    publisher: American Speech-Language-Hearing Association
    note: ASHA's 2018 position statement calls facilitated communication discredited, says extensive evidence shows facilitator authorship, and states that FC output should not be considered the disabled person's communication.
  - title: Communication Sciences & Disorders Statement on Facilitated Communication
    url: https://artsandsciences.syracuse.edu/department-communication-sciences-disorders/communication-sciences-disorders-statement-on-facilitated-communication/
    publisher: Syracuse University College of Arts and Sciences
    note: Syracuse's Communication Sciences and Disorders department now affirms ASHA's position and states that it does not advocate approaches such as facilitated communication when authorship is ambiguous.
- id: united-states-onteora-1992-1994
  polity: United States
  region: North America
  startYear: 1992
  endYear: 1994
  strength: policy-basis
  institutionTypes:
  - education
  institutions:
  - Onteora Central School District
  - The Children's Annex
  institutionalContext: A 1993 New York State Education Department review documented that the district's 1992–93 IEP stated that a child required facilitated communication to participate effectively in his educational program and included a goal to improve his facilitated communication skills. Children's Annex reports then used facilitated communication when describing receptive vocabulary, reading and mathematics performance.
  consequences:
  - Facilitated communication was written into an individual education plan as required for effective participation
  - School reports attributed age-appropriate or seventh-grade abilities to the child when facilitated communication was used
  - The same state review recorded sharply lower performance without facilitation, including receptive vocabulary roughly five years below chronological age and mathematics at a one-to-one correspondence level
  - Facilitator-dependent output therefore affected how the child's abilities and educational program were formally described
  summary: The Onteora case shows facilitated communication moving beyond advocacy into the machinery of special education. The child's 1992–93 IEP expressly said FC was required for effective participation, and school reports credited him with much higher academic performance when facilitated. Yet the same record showed dramatic differences when the facilitator was removed. The state review did not itself conduct an authorship experiment or ban the method, but its documentation provides unusually concrete evidence that facilitator-dependent output was being used in formal educational assessment at the same time controlled studies elsewhere were showing facilitator control.
  sources:
  - title: 'Application of a Child with a Disability, Appeal No. 93-046'
    url: https://www.sro.nysed.gov/decision/1993/93-046
    publisher: New York State Education Department, Office of State Review
    note: Official decision documenting the child's 1992–93 IEP requirement for facilitated communication, FC-related goals, and large discrepancies between academic performance reported with and without facilitation.
  - title: An experimental assessment of facilitated communication
    url: https://pubmed.ncbi.nlm.nih.gov/8441353/
    publisher: Mental Retardation / PubMed
    note: Contemporary 1993 controlled evidence showing that facilitators could unknowingly determine typed answers.
  - title: Facilitated communication and authorship — a systematic review
    url: https://pubmed.ncbi.nlm.nih.gov/25384895/
    publisher: Augmentative and Alternative Communication / PubMed
    note: Systematic review finding unequivocal experimental evidence of facilitator control over messages produced through facilitated communication.
