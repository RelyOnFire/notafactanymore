term: Sublunary
aliases:
- sublunar
- sublunary realm
- sublunary world
shortDefinition: In Aristotelian cosmology, the region below the Moon, where ordinary matter was thought to undergo generation,
  decay, and other kinds of change.
longDefinition: The sublunary realm was the region from Earth up to the Moon in Aristotelian natural philosophy. It was
  composed of the four terrestrial elements—earth, water, air, and fire—and was the domain of generation, corruption,
  weather, and rectilinear natural motion. It was contrasted with the supposedly perfect and unchanging celestial realm
  above the Moon.
relatedTerms:
- incorruptible
- aether
reviewedAt: '2026-08-21'
sources:
- title: Natural Philosophy in the Renaissance
  url: https://plato.stanford.edu/entries/natphil-ren/
  publisher: Stanford Encyclopedia of Philosophy
  note: Describes the Aristotelian division between the mutable sublunary world and the immutable celestial realm.
