  institutions:
  - New Zealand Department of Education
  - The School Journal
  institutionalContext: The School Journal was an official educational publication circulated to New Zealand state
    schools. Crown historical acknowledgements identify its 1916 and 1946 editions as teaching that Moriori were
    an inferior race, had preceded Māori on mainland New Zealand and had become extinct. These claims persisted
    in classroom culture despite scholarly challenges. In 2010 the education system issued three School Journal
    special issues on Rēkohu and Moriori, developed in collaboration with Moriori in part to rectify the earlier
    publications.
  consequences:
  - State-school transmission of a false racial history to generations of New Zealand children
  - Stigmatisation of Moriori as inferior, primitive or extinct
  - Confusion and shame among some children of Moriori descent about their own identity and ancestry
  - Wider public persistence of the myth outside schools, including in media and political argument
  - Delayed recognition in mainstream education of Moriori survival, history and cultural distinctiveness
  summary: 'The Moriori myth became institutionally consequential because the state education system carried it
    into classrooms. The Crown now acknowledges that its School Journal helped teach generations that Moriori were
    an inferior pre-Māori race that disappeared. The same publication series later became a vehicle of correction:
    in 2010 it issued Moriori-developed material explicitly intended to repair the earlier misinformation.'
