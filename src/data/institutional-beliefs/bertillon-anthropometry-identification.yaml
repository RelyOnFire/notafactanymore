schemaVersion: 2
title: Bertillon body measurements as a reliable criminal-record index
proposition:
  summary: >-
    In British India, colonial authorities treated a standardized set of adult body measurements as stable and
    reproducible enough to serve as the primary index for finding a habitual offender's earlier record; photographs,
    scars and other descriptive features could then help confirm identity.
correction:
  summary: >-
    Bertillonage was a multipart record system, not identification by measurements alone. Its anthropometric index did
    produce recognitions, but it depended on trained measurers, delicate instruments and accurate transcription. The
    Government of India's 1897 inquiry documented measurement variation, slow searches and errors that could prevent a
    prior file from being found, and judged Bengal's ten-fingerprint classification system operationally superior. The
    resulting resolution changed the official identification policy; it did not show that body measurements have no
    descriptive value or that fingerprint comparison is infallible.
category: Forensic medicine and identification
reviewedAt: '2026-09-24'
impact:
  summary: >-
    The Bengal Police introduced modified Bertillon anthropometry in March 1892, and a Government of India letter of
    10 May instructed Bengal's chief secretary and other provinces to introduce the system for habitual-offender
    identification. An official account reported that nearly 200,000 anthropometric cards had accumulated across the
    provinces by the end of 1898. After a two-member committee compared the systems in March 1897, the Governor-General
    in Council directed on 12 June that fingerprint identification be adopted generally in British India. Conversion
    was gradual: the same account, published in 1900, said existing anthropometric cards were still being replaced.
  highlights:
    - value: '1892'
      label: Government of India formally extended Bertillon anthropometry for habitual-offender records
    - value: 5 years
      label: Time from the 1892 instruction to the policy decision for general fingerprint adoption
    - value: 12 June 1897
      label: Resolution directed general adoption of fingerprint identification in British India
      note: The policy changed on this date; conversion of existing anthropometric files continued afterward.
  context:
    - >-
      The disputed premise concerns measurements as the primary filing and retrieval key. A Bertillon card combined
      measurements with photographs and descriptive details, and a retrieved candidate record still had to be compared
      with the person. Calling the method stand-alone identification obscures how the system actually worked.
    - >-
      The 1897 committee acknowledged that anthropometry had produced improving results before identifying its weak
      points. The historical correction was therefore an administrative judgment that fingerprints were simpler,
      cheaper, faster and more certain for this record-indexing task, followed by a phased replacement process.
    - >-
      This was a colonial surveillance system applied to people officially classified as habitual criminals. Bengal's
      fingerprint classification was developed through the work of Edward Henry and Indian police officers Azizul Haq
      and Hem Chandra Bose; later accounts often credited Henry while minimizing those officers' contributions.
episodes:
  - id: british-india-1892-1897
    polity: British India
    region: South Asia
    startYear: 1892
    endYear: 1897
    strength: policy-basis
    institutionTypes:
      - government
    institutions:
      - Government of India
      - Bengal Police
    institutionalContext: >-
      The Bengal Police introduced a modified six-measurement form in March 1892. A Government of India letter of
      10 May 1892 instructed Bengal's chief secretary and other provinces to introduce Bertillon anthropometry for
      habitual-offender identification. Measurements sorted cards into classes so officers could retrieve a suspected
      repeat offender's earlier record and compare its photographs, marks and other details. On 29 March 1897 a
      Government of India committee examined the anthropometric and Bengal fingerprint systems. Its report of 31 March
      found fingerprints superior in simplicity, equipment cost, concentration of skilled work, speed and certainty.
      The Governor-General in Council directed their general adoption on 12 June; existing anthropometric records were
      then converted over time.
    consequences:
      - People classified as habitual offenders were measured and indexed in anthropometric criminal-record systems
      - Police and prison staff needed special training, precise instruments and repeated measurements to prepare cards
      - Measurement and transcription variation forced searches across multiple filing classes and could prevent retrieval
      - By the late 1890s the provinces held roughly 150,000 to 200,000 anthropometric cards requiring gradual conversion
      - The government replaced anthropometry as the primary criminal-record index after an official comparative review
    summary: >-
      From 1892, the Government of India and Bengal Police made modified Bertillon anthropometry a policy basis for
      locating habitual offenders' earlier records. The system could produce recognitions, but its operation depended on
      accurately taking, reading and filing repeated measurements. The 1897 committee documented the administrative
      burden and error risk, recommended the Bengal fingerprint classification system, and the Governor-General in
      Council ordered its general adoption on 12 June. That resolution ended anthropometry's policy primacy, while the
      physical conversion of accumulated cards continued beyond 1897.
    mechanism:
      kind: classification
      summary: >-
        Government instructions and police record systems sorted prisoners' cards by standardized body measurements.
        Officers measured each dimension repeatedly, filed the resulting categories centrally and searched neighboring
        categories to allow for operator error before comparing a candidate record's additional identifying details.
    institutionalCorrection:
      status: corrected
      periodLabel: Policy decision on 12 June 1897
      action: >-
        The Governor-General in Council directed that identification by finger impressions be adopted generally in
        British India, initiating replacement of anthropometric criminal-record cards.
      summary: >-
        The resolution followed a Government of India committee's finding that Bengal's fingerprint system was superior
        to anthropometry for the same administrative task. The corrected status refers to this formal reversal of the
        primary identification policy; contemporary records show that converting the existing files took additional time.
