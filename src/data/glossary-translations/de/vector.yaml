term: Vektor
aliases: []
shortDefinition: Ein lebender Überträger – häufig ein Insekt oder eine Zecke –, der einen Erreger zwischen Wirten weitergibt.
longDefinition: In der Infektionsepidemiologie trägt ein Vektor einen Erreger von einem Wirt zum nächsten. Bei urbanem Gelbfieber ist die Stechmücke Aedes aegypti der wichtigste Vektor.
