term: Kohlenstoffnanoröhre
aliases:
- Kohlenstoffnanoröhren
- Nanoröhre
- Nanoröhren
shortDefinition: Eine nanoskopische röhrenförmige Struktur aus einem flächigen Netzwerk von Kohlenstoffatomen.
longDefinition: Kohlenstoffnanoröhren sind röhrenförmige Kohlenstoffallotrope, deren Wände aus einem graphenähnlichen
  hexagonalen Kohlenstoffnetz bestehen. Ihre Geometrie verleiht ihnen mechanische, elektrische und thermische Eigenschaften,
  die sich deutlich von massivem Graphit oder Diamant unterscheiden.
