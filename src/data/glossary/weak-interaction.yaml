term: Weak interaction
aliases:
- weak force
- weak nuclear interaction
shortDefinition: One of the four fundamental interactions, responsible for processes including beta decay and neutrino
  interactions.
longDefinition: The weak interaction is a fundamental interaction of the Standard Model carried by W and Z bosons. It
  changes particle identities in processes such as radioactive beta decay and governs many neutrino reactions. Unlike
  electromagnetism and the strong interaction, weak processes can violate parity symmetry.
relatedTerms:
- parity
- neutrino-flavor
reviewedAt: '2026-08-21'
sources:
