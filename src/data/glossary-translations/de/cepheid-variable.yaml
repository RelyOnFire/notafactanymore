term: Cepheide
aliases: []
shortDefinition: Ein pulsierender Stern, dessen Helligkeit sich regelmäßig ändert und dessen Pulsationsdauer mit seiner tatsächlichen Leuchtkraft zusammenhängt. Dadurch eignet er sich zur Entfernungsmessung.
longDefinition: Bei Cepheiden entspricht eine längere Pulsationsperiode einer höheren intrinsischen Leuchtkraft. Der Vergleich dieser tatsächlichen Leuchtkraft mit der beobachteten Helligkeit liefert eine Entfernungsschätzung.
