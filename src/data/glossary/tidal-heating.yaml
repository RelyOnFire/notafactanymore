term: Tidal heating
aliases:
- tidal flexing
- tidal dissipation
shortDefinition: Internal heating produced when changing gravitational tides repeatedly flex and deform a moon, planet,
  or other body.
longDefinition: Tidal heating converts orbital and rotational energy into internal heat through repeated deformation.
  A moon on a slightly eccentric orbit experiences changing tidal forces as its distance and orientation relative to
  its planet vary. Internal friction dissipates some of that mechanical energy as heat. The effect powers Io's extreme
  volcanism and contributes to maintaining subsurface oceans in moons such as Europa and Enceladus.
relatedTerms:
- cryovolcanism
reviewedAt: '2026-08-21'
sources:
- title: 'Io: Facts'
  url: https://science.nasa.gov/jupiter/moons/io/facts/
  publisher: NASA Science
  note: Describes tidal heating from Jupiter's gravity as the energy source driving Io's intense volcanic activity.
