term: Graphen
aliases: []
shortDefinition: Ein zweidimensionales Material aus einer einzigen Atomlage Kohlenstoff in einem hexagonalen Gitter.
longDefinition: Graphen ist eine nur ein Atom dicke Schicht aus Kohlenstoffatomen, die in einem wabenartigen hexagonalen
  Gitter gebunden sind. Es bildet den strukturellen Grundbaustein von Graphit und kann als freistehender oder getragener
  zweidimensionaler Kristall existieren. Seine ungewöhnlichen elektronischen, mechanischen und thermischen Eigenschaften
  trugen wesentlich zum modernen Forschungsfeld atomar dünner Materialien bei.
