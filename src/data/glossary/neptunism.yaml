term: Neptunism
aliases:
- Neptunist
- Neptunist geology
shortDefinition: A late-18th-century geological theory that treated most major rocks as deposits precipitated from a
  vast primordial ocean.
longDefinition: Neptunism is associated especially with Abraham Gottlob Werner. In its influential form, Earth's major
  rock units were arranged as a sequence deposited as a universal ocean receded. The theory explained some layered rocks
  well but struggled with evidence that granite, basalt, and other rocks had formed through heat, intrusion, or volcanism.
