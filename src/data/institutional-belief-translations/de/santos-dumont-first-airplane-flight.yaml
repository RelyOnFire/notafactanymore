schemaVersion: 2
locale: de
entryId: santos-dumont-first-airplane-flight
sourceReviewedAt: '2026-11-19'
title: Santos-Dumont als erster Mensch, der mit einem Flugzeug flog
proposition:
  summary: >-
    Brasilianische Bundesinstitutionen behandelten Alberto Santos-Dumonts Flug mit der 14-bis von 1906 als den ersten
    Flug eines motorisierten Luftfahrzeugs schwerer als Luft und räumten ihm damit Vorrang vor den Flügen der Brüder
    Wright von 1903 ein. Die Behauptung gelangte in ein offizielles Luftfahrtgedenken, schulische Veranstaltungen,
    Schulbücher und spätere staatliche Geschichtsdarstellungen.
correction:
  summary: >-
    Am 17. Dezember 1903 absolvierten Orville und Wilbur Wright in Kitty Hawk vier gesteuerte, motorisierte und
    anhaltende Flüge. Ihr Flyer startete mit eigener Motorkraft von einer auf ebenem Boden verlegten Startschiene; das
    Katapultsystem, das die Brüder bei späteren Versuchen verwendeten, kam dabei nicht zum Einsatz. Santos-Dumonts
    Leistung bleibt ein bedeutender Meilenstein: 1906 absolvierte die 14-bis in Europa den ersten offiziell beobachteten
    Motorflug über mehr als 25 Meter und stellte die ersten international anerkannten Luftfahrtrekorde auf. Diese
    Bedingungen machten seine Flüge öffentlich und rekordfähig, aber nicht zu den ersten motorisierten Flugzeugflügen.
impact:
  summary: >-
    Das Bundesgesetz Nr. 218 von 1936 erklärte den 23. Oktober, den Tag des ersten Fluges der 14-bis, zum Tag des Fliegers.
    Es wies die Behörden an, Santos-Dumonts Vorrang beim Flug schwerer als Luft besonders bei schulischen
    Gedenkveranstaltungen hervorzuheben. 1956 teilte das Bildungsministerium einem Parlamentsausschuss mit, Schulbücher
    stellten den Vorrang bereits allgemein dar; der Ausschuss archivierte daraufhin einen Vorschlag, der diese Darstellung
    verpflichtend gemacht hätte. Die Rahmung setzte sich in späterem amtlichem Gedenken und staatlicher
    Geschichtsvermittlung fort, obwohl eine heutige Einführung der ANAC zur Luftfahrt nun die Wright-Flüge von 1903
    anerkennt und Santos-Dumonts eigene öffentliche Leistung von 1906 gesondert beschreibt.
  highlights:
    - value: '1936'
      label: Jahr, in dem ein Bundesgesetz den Tag des Fliegers und schulisches Gedenken mit Santos-Dumonts beanspruchtem Vorrang verband
    - value: '1956'
      label: Jahr, in dem das Bildungsministerium die Behauptung als bereits allgemein in Schulbüchern dargestellt bezeichnete
    - value: 3 Jahre
      label: Abstand zwischen den Wright-Flügen und den Flügen der 14-bis
      note: Die Wrights flogen am 17. Dezember 1903; die dokumentierten Flüge der 14-bis fanden im Oktober und November 1906 statt.
  context:
    - >-
      Das Gesetz von 1936 behauptete Santos-Dumonts Vorrang beim Flug schwerer als Luft. Es verwendete nicht die
      geläufigere Formulierung „Erfinder des Flugzeugs“, obwohl spätere offizielle Gedenktexte gleichbedeutende Aussagen
      zum Erstflug machten und ihn als Vater der Luftfahrt bezeichneten.
    - >-
      Die Antwort des Bildungsministeriums von 1956 dokumentiert die von ihm als allgemein bezeichnete Schulbuchpraxis.
      Sie belegt nicht, dass jede Schule, jede Lehrkraft, alle Lernenden oder sämtliche brasilianischen Bürger die
      Behauptung akzeptierten.
    - >-
      „Erster Flug“ kann verschiedene Leistungen verdecken. Die Wrights erreichten 1903 den ersten gesteuerten,
      motorisierten und anhaltenden Flug eines Flugzeugs. Santos-Dumont absolvierte 1906 in Europa den ersten offiziell
      beobachteten Motorflug über mehr als 25 Meter und gewann vor großem Publikum die ersten anerkannten Luftfahrtrekorde.
    - >-
      Brasilianische Bundesinstitutionen geben heute widersprüchliche Darstellungen. Lehrmaterial der ANAC erkennt die
      Wrights 1903 an und beschreibt die 14-bis als ersten erfolgreichen öffentlichen Flug eines benzinbetriebenen
      Flugzeugs. Andere staatliche und militärhistorische Seiten bezeichnen Santos-Dumonts Leistung von 1906 weiterhin
      als ersten autonomen oder ausschließlich aus eigener Kraft erfolgten Flug schwerer als Luft.
episodes:
  - id: brazil-federal-1936-present
    polity: Brasilien
    periodLabel: 1936–heute (geprüft 2026)
    institutions:
      - Präsidentschaft und Nationalkongress Brasiliens
      - Bildungsministerium
      - Brasilianische Luftwaffe und Instituto Histórico-Cultural da Aeronáutica
      - Ministerium für Häfen und Flughäfen
      - Agência Nacional de Aviação Civil (ANAC)
    institutionalContext: >-
      Die Episode beginnt mit einem unter Getúlio Vargas unterzeichneten Bundesgesetz, das den Tag des Fliegers schuf und
      Behörden anwies, Santos-Dumonts Vorrang besonders bei schulischen Gedenkveranstaltungen hervorzuheben. Ein
      Parlamentsprotokoll von 1956 zeigt, dass das Bildungsministerium dieselbe Behauptung bereits als üblich in
      einschlägigen Schulbüchern betrachtete. Spätere Bundesveröffentlichungen zum Gedenken wiederholten Aussagen zum
      Erstflug. Die genannten Institutionen verwendeten nicht immer dieselbe Formulierung und sprechen nicht für alle
      brasilianischen Historiker oder Bürger. Die ANAC trifft inzwischen eine wesentlich genauere Unterscheidung, während
      andere offizielle Seiten die ältere Vorrangdarstellung bewahren.
    consequences:
      - Ein bundesweiter Gedenktag wurde auf den 23. Oktober 1906, das Datum des ersten Fluges der 14-bis, ausgerichtet
      - Behörden sollten Santos-Dumonts beanspruchten Vorrang besonders bei schulischen Gedenkveranstaltungen hervorheben
      - Das Bildungsministerium berichtete 1956, die Vorrangbehauptung werde bereits allgemein in Schulbüchern dargestellt
      - Staatliche, parlamentarische und militärhistorische Veröffentlichungen wiederholten weiterhin Formulierungen zum Erstflug
      - Der öffentliche und amtlich bestätigte Charakter der Flüge von 1906 diente als Grundlage, die dokumentierten Wright-Flüge von 1903 abzuwerten
    summary: >-
      Brasiliens Bundesregierung würdigte nicht lediglich einen nationalen Luftfahrtpionier. Gesetz und Bildungspraxis
      verliehen einer bestimmten historischen Vorrangbehauptung institutionelle Autorität. Daraus entstand eine
      beständige offizielle Erzählung, in der öffentliche Bestätigung und Start ohne äußere Hilfe im Jahr 1906 die
      früheren Wright-Flüge verdrängten. Heutige Bundesquellen sind uneinheitlich: Die ANAC unterscheidet inzwischen die
      Leistungen der Wrights und Santos-Dumonts, während andere amtliche Geschichtsdarstellungen Varianten der älteren
      Behauptung wiederholen.
    mechanism:
      summary: >-
        Ein Gesetz verband ein jährliches staatsbürgerliches Gedenken mit der Vorrangbehauptung und hob Schulen als Ort
        ihrer Vermittlung hervor. Schulbücher, Gedenkveranstaltungen, parlamentarische Äußerungen und staatliche
        Geschichtsveröffentlichungen trugen die Behauptung anschließend über Generationen weiter.
    institutionalCorrection:
      periodLabel: Bis 2024 dokumentiert; widersprüchliche amtliche Darstellungen bestanden 2026 fort
      action: >-
        Das heutige Einführungsmaterial der ANAC zur Luftfahrt schreibt Wilbur und Orville Wright den motorisierten Flug
        vom 17. Dezember 1903 ausdrücklich zu und bezeichnet Santos-Dumonts Leistung von 1906 anschließend als ersten
        erfolgreichen öffentlichen Flug eines benzinbetriebenen Flugzeugs.
      summary: >-
        Die ANAC stellt die zentrale historische Unterscheidung nun zutreffend dar. Die Belege zeigen jedoch weder eine
        allgemeine Rücknahme der Vorrangbehauptung von 1936 durch den Bund noch eine koordinierte Korrektur über mehrere
        Institutionen hinweg. Staatliche Gedenktexte und militärhistorisches Material verwenden weiterhin unvereinbare
        Erstflugformulierungen; die institutionelle Reaktion wird daher als teilweise Korrektur eingestuft.
evidence:
  - id: brazil-law-proposition
    note: >-
      Das Bundesgesetz schafft den Tag des Fliegers am 23. Oktober und weist die Behörden an, Santos-Dumonts Vorrang beim
      Flug schwerer als Luft besonders im schulischen Gedenken hervorzuheben.
  - id: brazil-ports-proposition
    note: >-
      Der Jubiläumstext des Ministeriums bezeichnet den Flug der 14-bis als ersten vollständig autonomen Flug schwerer
      als Luft, behandelt ihn als Geburtsstunde des „Vaters der Luftfahrt“ und erklärt abschließend, Santos-Dumont habe der
      Menschheit das Fliegen ermöglicht.
  - id: brazil-incaer-proposition
    note: >-
      Das historische Institut der Luftwaffe beschreibt die 14-bis als Urheberin des weltweit ersten Fluges eines
      Luftfahrzeugs schwerer als Luft, der ausschließlich mit den Mitteln des Geräts selbst erfolgt sei.
  - id: nps-wright-correction
    note: >-
      Bezeichnet den Flyer von 1903 als erstes erfolgreiches motorisiertes Luftfahrzeug schwerer als Luft und erläutert,
      dass er am 17. Dezember von einer Startschiene abhob und an diesem Tag vier Flüge absolvierte.
  - id: loc-photo-correction
    note: >-
      Die zeitgenössische Fotografie zeigt Orville Wright am 17. Dezember 1903 in der Luft und bezeichnet das Ereignis
      als motorisierten, gesteuerten und anhaltenden Flug; die Startschiene ist hinter dem Flugzeug sichtbar.
  - id: loc-timeline-correction
    note: >-
      Unterscheidet den ersten motorisierten, anhaltenden und gesteuerten Flug schwerer als Luft der Wrights von 1903 von
      Santos-Dumonts erstem erfolgreichen Motorflug in Europa im Jahr 1906.
  - id: fai-santos-dumont-correction
    note: >-
      Bestimmt Santos-Dumonts Rekord genau als ersten offiziell beobachteten Flug in Europa über mehr als 25 Meter und
      dokumentiert den späteren 220-Meter-Flug vom 12. November 1906.
  - id: icao-santos-dumont-correction
    note: >-
      Bezeichnet das Ereignis vom Oktober 1906 als ersten anhaltenden Flug in Europa und als ersten vom Aéro-Club de France
      und der FAI bestätigten Flug, ohne der 14-bis den weltweiten Vorrang beim Erstflug zuzuschreiben.
  - id: brazil-law-impact
    note: >-
      Dokumentiert das jährliche staatsbürgerliche, sportliche und kulturelle Gedenken, seine besondere schulische
      Ausrichtung und die gesetzliche Anweisung, die Vorrangbehauptung hervorzuheben.
  - id: brazil-diary-impact
    note: >-
      Dokumentiert den Vorschlag, die Behauptung in Luftfahrt-Schulbüchern verpflichtend zu machen, die Antwort des
      Bildungsministeriums, wonach dies bereits allgemein praktiziert werde, und die einstimmige Archivierung des
      Vorschlags als unnötig.
  - id: brazil-committee-impact
    note: >-
      Dokumentiert die Unterstützung des Bildungs- und Kulturausschusses für dauerhafte Ehrungen an Flughäfen und die
      Aussage des Berichterstatters, jüngere Brasilianer begännen, anstelle von Santos-Dumonts Vorrang die Wright-Version
      zu akzeptieren.
  - id: brazil-law-carrier
    note: Benennt den gesetzgeberischen und exekutiven Bundesakt, der Gedenktag und Vorrangbehauptung institutionalisierte.
  - id: brazil-diary-carrier
    note: >-
      Benennt das Bildungsministerium und den Bildungs- und Kulturausschuss der Abgeordnetenkammer als Institutionen, die
      sich mit der Darstellung der Vorrangbehauptung in Schulbüchern befassten.
  - id: brazil-current-carrier
    note: Dokumentiert ein heutiges Bundesministerium, das eine Variante der Vorrangbehauptung als amtliche Gedenkgeschichte veröffentlicht.
  - id: brazil-law-mechanism
    note: >-
      Das Gesetz schafft einen jährlichen Gedenktag, weist Behörden zu dessen Gestaltung an und bestimmt schulische Kultur
      als wichtigen Kanal zur Hervorhebung von Santos-Dumonts Vorrang.
  - id: brazil-diary-mechanism
    note: >-
      Das Parlamentsprotokoll dokumentiert Schulbücher als etablierten Vermittlungsweg und zeigt, warum eine vorgeschlagene
      gesetzliche Verpflichtung als unnötig galt.
  - id: brazil-law-consequences
    note: >-
      Belegt die Einführung des Gedenktags am 23. Oktober und die Anweisung, die Vorrangbehauptung besonders im schulischen
      Gedenken hervorzuheben.
  - id: brazil-diary-consequences
    note: >-
      Die Antwort des Bildungsministeriums stützt den begrenzten Befund, dass die Vorrangbehauptung bis 1956 in
      einschlägigen Schulbüchern allgemein üblich geworden war; sie misst nicht die Überzeugungen einzelner Menschen.
  - id: brazil-committee-consequences
    note: >-
      Zeigt, dass die Vorrangerzählung 2011 weiterhin parlamentarisches Gedenken und Argumente der öffentlichen
      Geschichtsvermittlung prägte.
  - id: brazil-anac-institutional-correction
    note: >-
      Die ANAC erklärt, die Wrights hätten 1903 den motorisierten Flug verwirklicht, und benennt anschließend den
      eigenständigen öffentlichen und pionierhaften Charakter von Santos-Dumonts Flug von 1906.
  - id: brazil-ports-institutional-correction-scope
    note: >-
      Begrenzt die Reichweite der ANAC-Korrektur, weil ein anderes Bundesministerium 2023 weiterhin eine unvereinbare
      weltweite Erstflugformulierung veröffentlichte.
  - id: brazil-incaer-institutional-correction-scope
    note: >-
      Begrenzt die institutionelle Reichweite der Korrektur zusätzlich, weil das historische Institut der Luftwaffe die
      14-bis weiterhin als Urheberin des weltweit ersten ausschließlich aus eigener Kraft erfolgten Fluges schwerer als
      Luft bezeichnet.
