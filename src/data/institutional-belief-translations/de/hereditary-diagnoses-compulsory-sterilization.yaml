schemaVersion: 2
locale: de
entryId: hereditary-diagnoses-compulsory-sterilization
sourceReviewedAt: '2026-08-25'
title: Erbdiagnosen als verlässliche Grundlage für Zwangssterilisation
proposition:
  summary: >-
    Gesundheitsverwaltung, Medizin und Justiz des NS-Staates behandelten eine Liste psychiatrischer, neurologischer,
    sensorischer und sozialer Diagnosen als Kennzeichen „erbkranker“ Menschen, deren Kinder mit hoher Wahrscheinlichkeit
    schwere Erbschäden erleiden würden, und machten diese vermeintliche Erbprognose zur Grundlage von Zwangssterilisationen.
correction:
  summary: >-
    Die pauschale Erbprognose des Sterilisationssystems war wissenschaftlich nicht haltbar. Einige der erfassten
    Krankheiten besitzen tatsächlich genetische Komponenten; Chorea Huntington ist eine klar monogen vererbte Erkrankung.
    Schizophrenie und bipolare Störung beruhen dagegen auf komplexem Zusammenspiel vieler Gene und Umweltfaktoren.
    Zugleich wurde „angeborener Schwachsinn“ als dehnbare Kategorie auch auf Menschen angewandt, die als sozial unangepasst
    galten oder Konformitäts- und Intelligenztests nicht bestanden. Eine Diagnose bewies nicht die gesetzlich behauptete
    hohe Wahrscheinlichkeit schwerer Erbschäden bei zukünftigen Kindern.
impact:
  summary: >-
    Die Erbbehauptung wurde in Gesetz, ärztliche Begutachtung, Sondergerichte und chirurgische Eingriffe eingebaut.
    Das Gesetz zur Verhütung erbkranken Nachwuchses trat am 1. Januar 1934 in Kraft. Erbgesundheitsgerichte aus Richter
    und Ärzten konnten Sterilisationen anordnen, die nötigenfalls gegen den Willen der Betroffenen und mit polizeilichem
    Zwang vollzogen wurden. Rund 400.000 Menschen wurden zwangssterilisiert. Der Bundestag ächtete die Maßnahmen 1988
    als NS-Unrecht und hob 1998 die noch bestehenden Sterilisationsbeschlüsse gesetzlich auf.
  highlights:
    - value: ≈400.000
      label: unter dem NS-Erbgesundheitsgesetz zwangssterilisierte Menschen
    - value: '9'
      label: im Gesetz genannte Diagnosekategorien als Sterilisationsgründe
    - value: '1998'
      label: Jahr der gesetzlichen Aufhebung der Sterilisationsbeschlüsse der Erbgesundheitsgerichte
  context:
    - >-
      Die Korrektur lautet nicht, dass Vererbung bei jeder genannten Erkrankung bedeutungslos sei. Chorea Huntington
      wird autosomal-dominant vererbt; Schizophrenie und bipolare Störung haben erhebliche, aber komplexe genetische
      Anteile. Falsch war der Sprung von einer breiten Diagnose zu einer hinreichend sicheren Prognose über die Nachkommen,
      mit der irreversible staatliche Eingriffe gerechtfertigt wurden.
    - >-
      Besonders weit wurde „angeborener Schwachsinn“ ausgelegt. Unter diese Bezeichnung fielen auch Menschen, die das
      Regime als sozial abweichend betrachtete oder die angebliche Tests von Intelligenz und sozialer Konformität nicht bestanden.
    - >-
      Die praktische Aktion endete 1945 mit dem NS-Regime, die institutionelle Korrektur aber erst Jahrzehnte später:
      1988 ächtete der Bundestag die Zwangssterilisationen, 1998 hob er die Gerichtsbeschlüsse auf und 2007 verurteilte
      er auch das Gesetz selbst ausdrücklich als nationalsozialistisches Unrecht.
episodes:
  - id: nazi-germany-1934-1945
    polity: NS-Deutschland
    institutions:
      - Reichsministerium des Innern und öffentliche Gesundheitsverwaltung
      - Erbgesundheitsgerichte und Erbgesundheitsobergerichte
      - Gesundheitsämter, psychiatrische Einrichtungen und ausführende Krankenhäuser
    institutionalContext: >-
      Das Gesetz von Juli 1933 definierte Menschen mit bestimmten Diagnosen als „erbkrank“ und erlaubte ihre
      Unfruchtbarmachung, wenn angebliche medizinische Erfahrung eine hohe Wahrscheinlichkeit schwerer Erbschäden bei
      ihren Nachkommen erwarten ließ. Ab Januar 1934 entschieden besondere Gerichte anhand ärztlicher Gutachten. Sie
      bestanden aus einem Richter, einem Amtsarzt und einem weiteren mit der Erbgesundheitslehre vertrauten Arzt. Nach
      Rechtskraft durfte die Operation mit unmittelbarem und polizeilichem Zwang durchgesetzt werden.
    consequences:
      - Zwangssterilisation von ungefähr 400.000 Menschen in einem diagnosegestützten eugenischen System
      - Irreversible Eingriffe auf Anordnung besonderer Gerichte und nötigenfalls gegen den Willen der Betroffenen
      - Verwendung von „angeborenem Schwachsinn“ als Sammelkategorie für soziale Werturteile und umstrittene Tests
      - Institutionalisierung nationalsozialistischer Rassenhygiene als vermeintlich wissenschaftliche medizinische Risikobewertung
      - Körperliche Komplikationen, Todesfälle sowie lebenslange psychische und soziale Folgen
      - Erst Jahrzehnte später erfolgte gesetzliche Rehabilitierung durch Aufhebung der Gerichtsbeschlüsse
    summary: >-
      Die NS-Zwangssterilisation verwandelte ein überzogenes erbbiologisches Modell in durchsetzbares Medizinrecht.
      Heterogene Diagnosen galten als verlässliche Vorhersage schwerer Erbschäden bei zukünftigen Kindern; besondere
      Gerichte machten daraus Operationsbefehle. Moderne Genetik widerlegt diese pauschale Prognoselogik für breite
      psychiatrische Diagnosen, während die historische Forschung zeigt, wie soziale Abweichung selbst in die häufig
      verwendete Kategorie „Schwachsinn“ einfließen konnte.
    mechanism:
      summary: >-
        Der Staat schrieb Erbprognosen gesetzlich fest, verlangte medizinische Meldungen und Entscheidungen besonderer
        Gerichte und erlaubte nach Rechtskraft die zwangsweise operative Durchführung unter Polizeieinsatz.
    institutionalCorrection:
      periodLabel: '1998'
      action: Der Deutsche Bundestag hob die noch bestehenden Sterilisationsbeschlüsse der ehemaligen Erbgesundheitsgerichte gesetzlich auf.
      summary: >-
        Das Zwangsprogramm endete 1945 mit dem NS-Regime; die formelle deutsche institutionelle Korrektur erfolgte erst
        Jahrzehnte später durch die Ächtung der Sterilisationen und die gesetzliche Aufhebung der Gerichtsbeschlüsse.
evidence:
  - id: sterilization-law-proposition
    note: >-
      Primärtext des Gesetzes, der die aufgeführten Zustände als Erbkrankheiten definiert, Erbgesundheitsgerichte einrichtet
      und die zwangsweise Durchsetzung von Sterilisationsbeschlüssen erlaubt.
  - id: sterilization-schizophrenia-correction
    note: >-
      Aktuelle medizinische Darstellung, wonach viele Gene und Umweltfaktoren zum Schizophrenierisiko beitragen und kein einzelnes Gen die Erkrankung allein verursacht.
  - id: sterilization-bipolar-correction
    note: >-
      Aktuelle medizinische Darstellung, wonach die bipolare Störung einen erheblichen erblichen Anteil besitzt, aber
      viele Gene und weitere Faktoren beteiligt sind statt eines einzelnen deterministischen Gens.
  - id: sterilization-huntington-context
    note: >-
      Aktuelle genetische Referenz, die zeigt, warum die Karte nicht das Gegenextrem behauptet, keine der gesetzlichen
      Diagnosen habe echte Erblichkeit beinhaltet: Chorea Huntington wird autosomal-dominant vererbt.
  - id: sterilization-ushmm-impact
    note: >-
      Maßgebliche historische Darstellung der neun als erblich angenommenen Kategorien, der Sondergerichte, der ungefähr
      400.000 Zwangssterilisationen und der breiten Anwendung von „angeborenem Schwachsinn“ auf als sozial abweichend eingestufte Menschen.
  - id: sterilization-ushmm-carrier
  - id: sterilization-law-mechanism
  - id: sterilization-ushmm-consequences
  - id: sterilization-bundestag-correction
    note: >-
      Amtliche Gesetzgebungsunterlage, die die Sterilisationen als nationalsozialistisches Unrecht bezeichnet, das Ausmaß
      des Programms beschreibt und die Aufhebung noch bestehender Sterilisationsbeschlüsse der Erbgesundheitsgerichte vorsieht.
