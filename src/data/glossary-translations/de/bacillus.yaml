entryId: bacillus
sourceReviewedAt: '2026-08-21'
term: Bazillus
aliases:
- Bazillen
shortDefinition: Ein stäbchenförmiges Bakterium; historisch wurde der Begriff beschreibend in Bezeichnungen wie
  „Tuberkulosebazillus“ verwendet.
longDefinition: Im beschreibenden mikrobiologischen Sinn bezeichnet Bazillus ein stäbchenförmiges Bakterium. Der
  Begriff kommt auch in historischen Krankheitsbezeichnungen vor, etwa „Tuberkulosebazillus“ für Mycobacterium tuberculosis.
  Er ist nicht mit Bacillus als formalem Gattungsnamen gleichzusetzen.
