    note: Dutch National Archives record documenting Eijkman's military-medical background, his 1886 membership
      in the Commission for Beriberi Research and his later direction of the medical laboratory at Weltevreden.
  - title: Christiaan Eijkman — Nederlandsche helden der wetenschap
    url: https://www.dbnl.org/tekst/seve003nede01_01/seve003nede01_01_0009.php
    publisher: Digital Library for Dutch Literature
    note: Historical Dutch account explaining that Pekelharing and Winkler returned from the official commission
      convinced that beriberi was a tropical infectious disease caused by bacteria producing a toxin, while noting
