  - military
  institutions:
  - Imperial Japanese Army
  - Army Medical Department of the Imperial Japanese Army
  institutionalContext: The Japanese Navy and Army operated under different medical policies. After Takaki's controlled
    voyage comparison and dietary reform, Navy beriberi collapsed. Army medical leaders, including the head of the
    Army medical department, continued to treat an infectious origin as more plausible and resisted the food explanation
    while polished rice remained central to Army rations. The Russo-Japanese War ended in 1905; thiamine itself
    was identified later.
  consequences:
  - Continued polished-rice military ration policy despite strong dietary counterevidence
  - Large numbers of soldiers developed beriberi during wartime
  - Thousands of preventable military deaths and losses of operational capacity
  - Delayed institutional acceptance of a nutritional mechanism
  summary: From the mid-1880s, the Japanese Navy's dietary experiments and ration reform supplied strong evidence
    that beriberi was diet-related and nearly eliminated the disease among sailors. Army medical leaders nevertheless
    continued to favor an infectious origin and rejected the dietary explanation while soldiers remained heavily
    dependent on polished rice. During the Russo-Japanese War the Army suffered massive beriberi morbidity and mortality,
    while later vitamin research established thiamine deficiency as the cause.
