schemaVersion: 2
title: Close planting and deep plowing
proposition:
  summary: >-
    Unusually dense planting and deep plowing were treated as generally applicable ways to raise crop yields: deeper
    tillage would create the soil conditions needed for crowding, while adding more plants per unit of land would turn
    those conditions into sharply higher production.
correction:
  summary: >-
    Planting density and tillage depth have crop-, soil-, climate- and management-specific optima. Denser stands can
    increase yield per unit area up to an optimum, but crowding intensifies competition and can reduce reproductive yield;
    deep tillage can relieve a restrictive compacted layer, but greater depth does not automatically add benefit and can
    reduce yield when it is poorly matched to field conditions. Neither practice supports a universal “more is better” rule.
category: Agriculture
reviewedAt: '2026-09-27'
impact:
  summary: >-
    The 29 August 1958 Central Committee directive made deep plowing a national production campaign, prescribed a depth
    and timetable for nearly all land considered capable of it, and described deep plowing as the basis for close planting.
    Historical research finds that the campaign consumed large amounts of labor and that excessive or improper deep
    plowing sometimes reduced soil fertility; economic history identifies deep plowing and close planting pushed beyond
    rational limits as contributors to reduced output. No defensible national loss or famine-death figure can be assigned
    to these two practices alone.
  highlights:
    - value: 2–3 years
      label: timetable in the 1958 directive for deep-plowing all arable land considered capable of it
    - value: more than 1 chi
      label: directive's general depth standard, with more than 2 chi prescribed for high-yield fields
    - value: 29 Apr 1959
      label: date central leadership called rigid planting-density orders useless and harmful
  context:
    - >-
      Close planting and deep tillage are not inherently invalid. The error was turning conditional agronomic practices
      into escalating, broadly imposed prescriptions detached from crop, soil, water, fertilizer and local experience.
    - >-
      The Great Famine and the wider production crisis were multicausal. The cited economic history also identifies
      excessive procurement, labor diversion, distorted reporting, commune organization, lost incentives, harmful water
      projects and natural conditions; this card does not attribute the crisis or its mortality to these techniques alone.
    - >-
      The directive itself warned against bringing raw subsoil to the surface. That qualification did not make its
      nationwide depth targets or mass-campaign implementation agronomically self-validating, and historical research
      documents overextension and improper execution in practice.
episodes:
  - id: china-1958-1961
    polity: People's Republic of China
    region: East Asia
    startYear: 1958
    endYear: 1961
    periodLabel: 1958–1961
    strength: policy-basis
    institutionTypes:
      - government
    institutions:
      - Central Committee of the Chinese Communist Party
      - Ministry of Agriculture of the People's Republic of China
    institutionalContext: >-
      The strongest national carrier was the CCP Central Committee. Its 29 August 1958 directive declared deep plowing
      the central yield-increasing technique and the basis for close planting, ordered all feasible arable land to be
      deep-plowed within two or three years and every three years thereafter, set national depth standards, and demanded
      Party-wide and population-wide mobilization. The Ministry of Agriculture was the central administrative carrier for
      agricultural policy: Alfred L. Chan's institutional history describes how it was transformed into an agent of
      mobilization under rapidly changing initiatives and impossible targets. Provincial committees, communes and
      production units implemented the campaign, but they are described as machinery rather than listed as one institution.
    consequences:
      - A nationwide, labor-intensive deep-plowing and soil-improvement campaign
      - Prescriptive planting-density and tillage targets imposed beyond locally appropriate conditions
      - Reduced soil fertility and crop output in places where deep plowing or crowding was excessive or improper
      - Displacement of farmers' and production teams' agronomic judgment by top-down campaign orders
      - Contribution to agricultural losses within the wider, multicausal Great Leap Forward production crisis
    summary: >-
      During the Great Leap Forward, the Central Committee converted deep plowing and close planting from conditional
      techniques into components of a national yield campaign. Its August 1958 directive prescribed unusually deep,
      repeated tillage across almost all feasible arable land and mobilized the Party and population to carry it out. The
      Ministry of Agriculture and local campaign apparatus translated central initiatives into implementation. Historical
      studies document extensive labor mobilization, improper and excessive tillage, soil-fertility damage in some places,
      and output losses from deep plowing and close planting pushed beyond rational limits.
    mechanism:
      kind: administrative-adoption
      summary: >-
        The Central Committee issued quantified national tillage targets and a mass-mobilization order; the agricultural
        administration and local party-commune apparatus organized labor, promoted implements and converted the methods
        into campaign requirements.
    institutionalCorrection:
      status: partial
      periodLabel: April–July 1959
      action: >-
        Central leadership told production teams to determine suitable planting density and prohibited rigid density
        commands from above.
      summary: >-
        Mao's 29 April 1959 intra-party letter expressly rejected the claim that closer planting was always better, called
        rigid orders from above useless and harmful, and said density had to vary with climate, place, soil, fertilizer,
        water, seed, crop and field management. The correction was incomplete: official party history says the broader
        effort to correct Great Leap excesses stopped abruptly after the Lushan Conference, and the reviewed record does
        not identify a comparably explicit institutional retraction of the deep-plowing directive during this episode.
