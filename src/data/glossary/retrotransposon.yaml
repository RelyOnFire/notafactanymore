term: Retrotransposon
aliases:
- retrotransposons
shortDefinition: A mobile genetic element that copies itself through an RNA intermediate that is converted back
  into DNA.
longDefinition: Retrotransposons are DNA sequences that can make an RNA copy of themselves and then use reverse
  transcription to generate DNA that is inserted elsewhere in the genome. Their life cycle is one natural example
  of genetic information flowing from RNA back to DNA.
relatedTerms: []
reviewedAt: '2026-08-21'
sources:
- title: The Nobel Prize in Physiology or Medicine 1975 – Press release
  url: https://www.nobelprize.org/prizes/medicine/1975/press-release/
  publisher: The Nobel Prize
  note: Explains the discovery of reverse transcription, the RNA-to-DNA reaction used by retroelements.
