schemaVersion: 2
title: Covid-Organics as established COVID-19 prevention and treatment
proposition:
  summary: >-
    Madagascar treated the original Covid-Organics drink as an established preventive and curative COVID-19 remedy,
    distributed it through national policy, and later registered CVO and CVO+ products before product-specific
    randomized evidence supported the breadth of the prevention and treatment claims.
correction:
  summary: >-
    Laboratory inhibition can justify clinical study, but it does not establish that a drink prevents infection or
    improves illness in people. A CVO-specific cell-culture study found antiviral activity, yet called its selectivity
    index unpromising and required animal and human trials before recommending use. A later randomized trial provides
    relevant but much narrower evidence for CVO+ Curatif: it tested standardized artemisinin and 1,8-cineole capsules
    in adults with mild or moderate COVID-19, rather than the original drink or a preventive regimen, and reported
    87.1% versus 75.0% success on its composite endpoint. The report analyzed 276 of 339 randomized participants per
    protocol, used one-tailed tests, began enrolment before registry approval, and ended below its planned analyzed
    sample. That result cannot retroactively validate the 2020 rollout or establish prevention by CVO products; those
    broader claims require product-specific, independently reproducible clinical evidence and patient-relevant outcomes.
category: Medicine and public health
reviewedAt: '2026-09-27'
impact:
  summary: >-
    Covid-Organics moved rapidly from a presidential announcement into Madagascar's national pandemic response. The
    July 2020 emergency plan called it preventive and curative, recorded masks and CVO distributed to 270,000 pupils,
    planned CVO for 660,600 examination-class pupils, and proposed preventive family packs for four million households.
    The Court of Accounts later documented mass distribution through fokontany, public self-service points, schools,
    government offices, and hospitals, while finding no scientific study that could attribute the observed mortality
    pattern to CVO. Product registration also outlasted the emergency rollout: official 2025 registers listed four
    presentations of the original CVO and both CVO+ Curatif and CVO+ Préventif capsules.
  highlights:
    - value: 270,000 pupils
      label: The emergency plan recorded masks and Covid-Organics distributed to examination-class pupils
    - value: 4 million households
      label: The emergency plan's proposed reach for preventive CVO family packs, not a completed-distribution count
    - value: '2025'
      label: Official medicine registers still listed original CVO and curative and preventive CVO+ products
  context:
    - >-
      Artemisia and other plants can contain medically useful compounds. The disputed institutional step was treating
      composition, traditional use, early observations, or cell-culture activity as proof of prevention and treatment
      in people before suitable trials.
    - >-
      CVO, CVO+ Curatif, and CVO+ Préventif were not interchangeable products. The published randomized trial tested
      a higher-concentration capsule formulation for treatment of mild or moderate disease; it did not test the original
      tea and did not evaluate prevention.
    - >-
      Appearance in Madagascar's registered-medicines lists documents national regulatory status. The lists alone do
      not supply a clinical indication, prove efficacy, or constitute a WHO recommendation.
episodes:
  - id: madagascar-2020-2025
    polity: Madagascar
    region: East Africa
    startYear: 2020
    endYear: 2025
    periodLabel: 2020–2025
    strength: policy-basis
    institutionTypes:
      - government
      - medical
    institutions:
      - Presidency of the Republic of Madagascar
      - Prime Minister’s Office (Primature de Madagascar)
      - Ministry of Public Health of Madagascar
      - Agency of Medicine of Madagascar
      - Pharmalagasy
    institutionalContext: >-
      The presidency supplied the initial claim and distribution order. On 19 April 2020 President Andry Rajoelina
      announced an Artemisia-based remedy, said IMRA tests on infected people had been positive, promised clinical trials
      for the following week, and ordered Covid-Organics distributed when examination classes returned. The national
      emergency plan then described CVO as preventive and curative, embedded actual and planned distribution in education
      and mass-protection programmes, and proposed family packs for two-thirds of Malagasy households. The Court of
      Accounts found that strategic health decisions had been centralized at the presidency, that the state had adopted
      the remedy, and that the wholly state-owned Pharmalagasy factory received exceptional support to manufacture it.
      Formal evaluation followed: the government publicized a CVO+ Phase III trial in 2021 and its researchers published
      results in 2022. Official medicine registers nevertheless continued to list the original CVO presentations in May
      2025 and both curative and preventive CVO+ capsules in July 2025.
    consequences:
      - Distribution of masks and Covid-Organics to 270,000 examination-class pupils recorded as a completed measure
      - Mass distribution through fokontany, public self-service points, schools, public administration, and hospitals
      - Plans to reach 660,600 examination-class pupils and four million households with preventive CVO
      - State investment in the wholly state-owned Pharmalagasy factory and continued national product registration
      - Retention of the traditional remedy when the Health Ministry proposed joining COVAX in July 2020
      - Public preventive and therapeutic legitimacy extending beyond the products and uses examined in a randomized trial
    summary: >-
      Madagascar made Covid-Organics part of state pandemic policy within days of its presidential launch. It was
      distributed through schools and local administration, placed in the national treatment environment, and planned
      for household-scale preventive distribution before controlled clinical evidence existed. A later government-backed
      trial was a meaningful change in evidentiary method, but it examined a distinct standardized CVO+ Curatif capsule
      only for mild or moderate treatment. Its positive reported result did not test the original drink or prevention,
      and the report's attrition, per-protocol analysis, one-tailed testing, registry approval after enrolment began,
      and fewer evaluable participants than planned limit the inference. The Court of Accounts rejected causal claims
      based on observed mortality and urged systematic evaluation, yet national registers still carried original,
      curative, and preventive CVO products in 2025.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Presidential endorsement became administrative distribution, national emergency planning, a state-owned
        manufacturing programme, government-backed clinical research, and medicine registration. These channels gave
        the products preventive and therapeutic authority well beyond an experimental research setting.
    institutionalCorrection:
      status: partial
      periodLabel: 2021–2022
      action: The Court of Accounts rejected a causal efficacy inference and called for systematic evaluation, while the government moved the distinct CVO+ Curatif capsule into a randomized trial.
      summary: >-
        The audit and randomized trial corrected part of the original evidentiary process: one oversight body expressly
        said no scientific study could tie the mortality pattern to CVO, and the later capsule was subjected to controlled
        testing. The correction remained incomplete because neither step withdrew the original drink's prevention and
        treatment claims, the trial did not test prevention or the original formulation, and official 2025 registers
        still listed original CVO plus products explicitly named Curatif and Préventif.
