evidence:
  - id: detector-sedena-proposition
    sourceId: sedena-gt200-operation-2009
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: 28 July 2009 communiqué; opening account of the 27 July operation at Turicato, Michoacán
    note: >-
      Official 2009 SEDENA communiqué explicitly records military operational use of a GT200 detector during a
      counter-narcotics action, illustrating that the device was used as an active security tool rather than merely procured.
  - id: detector-ieee-correction
    sourceId: ieee-gt200-test
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: IEEE Technology and Society Magazine 36(2), June 2017, pp. 77–80; Investigating the GT200, Test, and Results; blinding limitation on p. 79
    note: >-
      Peer-reviewed study reports a controlled test in which certified operators failed in 17 of 20 attempts to
      locate clorobenzorex capsules and bullets hidden in one of eight identical boxes, a result compatible with
      chance. The intended double-blind protocol was compromised when operator swaps exposed interim results;
      searchers remained unaware of the current sample location.
  - id: detector-mccormick-correction
    sourceId: mccormick-sentencing
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: 2 May 2013 sentencing remarks, pp. 1–2; device efficacy, false security, and the limit on attributing individual casualties
    note: >-
      The sentencing court states that more than 7,000 ADE devices were sold to the Iraqi government and other
      international agencies, calls the device useless and no better than random chance for explosive detection,
      and describes the false security created by its operational use.
