title: Predator eradication in Yellowstone
entryId: predators-only-harm-prey-populations
claim: Wolves and other large predators in Yellowstone were treated as destructive competitors whose removal would protect desirable game animals such as deer and elk and improve wildlife management.
currentUnderstanding: Predators can reduce prey populations and create conflicts with livestock or human objectives, but native apex predators are also components of functioning ecosystems. Their removal can reorganize predator-prey relationships, scavenger food supplies, herbivore abundance and behavior, and vegetation. Yellowstone now manages wolves as a restored native species and an important part of the park's food web.
category: Wildlife management and ecology
reviewedAt: '2026-08-27'
impact:
  summary: Predator control in Yellowstone converted a simple management proposition into direct eradication. Park authorities killed wolves and other carnivores to protect animals regarded as more desirable. Wolves disappeared as a breeding population, and restoring the missing predator later required federal protection, decades of planning and active reintroduction.
  highlights:
  - value: '136+'
    label: Wolves killed inside Yellowstone from 1914 through 1926 according to National Park Service records
  - value: '1926'
    label: The last known Yellowstone wolf pack was killed
  - value: '1995'
    label: Federal wolf reintroduction began after nearly seven decades without a resident pack
  context:
  - The famous claim that wolves alone transformed Yellowstone's rivers and vegetation is too simple. Researchers continue to debate the magnitude of wolf-driven trophic cascades because climate, hunting, bears, cougars, groundwater and other factors also changed.
  - "The corrected proposition is narrower and better supported: treating predators only as destructive competitors missed important ecological functions and made their deliberate elimination itself a major ecosystem intervention."
episodes:
- id: united-states-yellowstone-1886-1926
  polity: United States
  region: North America
  startYear: 1886
  endYear: 1926
  strength: policy-basis
  institutionTypes:
  - government
  institutions:
  - U.S. Army administration of Yellowstone National Park
  - U.S. National Park Service
  institutionalContext: In the late nineteenth and early twentieth centuries, Yellowstone managers participated in the wider North American campaign against large predators. The National Park Service's own history says early managers, lacking a modern understanding of ecosystems, viewed wolves as destructive and targeted wolves, bears, cougars and coyotes to protect livestock and 'desirable' wildlife such as deer and elk. Federal park management continued this logic after the National Park Service was established in 1916.
  consequences:
  - At least 136 wolves were killed inside Yellowstone between 1914 and 1926
  - The last known wolf pack in the park was killed in 1926, and later surveys found no resident breeding population
  - Removing wolves changed the park's predator-prey system and eliminated ecological interactions associated with a native apex predator
  - Restoring wolves ultimately required Endangered Species Act protection, an environmental impact process and active translocation beginning in 1995
  summary: Yellowstone's early predator policy divided wildlife into animals worth protecting and predators that competed with those preferred species. Wolves were therefore not merely tolerated at low numbers; they were deliberately removed. At least 136 were killed in the park from 1914 through 1926, when the last known pack was eliminated. By the 1960s National Park Service thinking had shifted toward maintaining natural ecological processes, and later federal conservation law supported recovery. Wolves were reintroduced in 1995–1997. Their exact contribution to every subsequent vegetation change remains scientifically debated, but the old premise that their ecological role amounted only to killing desirable prey did not survive.
  sources:
  - title: History of Wolf Management
    url: https://www.nps.gov/yell/learn/historyculture/wolf-management.htm
    publisher: U.S. National Park Service
    note: Official history stating that early Yellowstone managers viewed wolves as destructive predators, that at least 136 were killed in the park from 1914 through 1926, and that the last pack was eliminated in 1926 before later restoration efforts.
  - title: Wolf Management
    url: https://www.nps.gov/yell/learn/management/wolf.htm
    publisher: U.S. National Park Service
    note: Current Yellowstone management describes wolves as apex predators that influence the food web and explains that reintroduction sought to restore a native species and the ecological role of predation.
  - title: Lamar Valley — Trophic Cascades
    url: https://www.nps.gov/places/000/lamar-valley-trophic-cascades.htm
    publisher: U.S. National Park Service
    note: NPS explanation of predator effects on elk and vegetation that also explicitly cautions that the magnitude and causation of Yellowstone trophic cascades remain scientifically contested.
  - title: The Big Scientific Debate — Trophic Cascades
    url: https://home.nps.gov/articles/the-big-scientific-debate-trophic-cascades.htm
    publisher: U.S. National Park Service
    note: Yellowstone scientists explain why the ecological consequences of wolf restoration are real but more complex than the popular single-cause trophic-cascade story.
