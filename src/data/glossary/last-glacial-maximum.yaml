term: Last Glacial Maximum
aliases:
- LGM
shortDefinition: The most recent interval when global ice sheets reached their greatest extent, roughly 26,500 to 19,000
  years ago.
longDefinition: The Last Glacial Maximum, or LGM, was the coldest major phase near the end of the last ice age, when
  large continental ice sheets covered much of northern North America and Eurasia and global sea level was far lower
  than today. Evidence for humans in North America during this interval has major implications for migration routes and
  the chronology of the peopling of the Americas.
relatedTerms:
- luminescence-dating
reviewedAt: '2026-08-21'
sources:
- title: Evidence for humans in North America during the Last Glacial Maximum
  url: https://doi.org/10.1126/science.abg7586
  publisher: Science
  note: Reports White Sands human footprints dated to approximately 23,000–21,000 years ago during the Last Glacial Maximum.
