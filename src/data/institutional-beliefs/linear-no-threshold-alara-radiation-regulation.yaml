    institutionalContext: The NRC's 1991 revision of 10 CFR Part 20 established the current radiation-protection framework. Section 20.1101 requires licensees to maintain radiation-protection programs and to use practical procedures and engineering controls to keep occupational and public doses ALARA. The NRC has described the LNT model as an underlying premise of much of its radiation-protection regulation and in 2021 rejected petitions seeking to replace it with threshold or hormesis approaches.
    consequences:
      - NRC licensees were required to develop, document and implement radiation-protection programs and to reduce occupational and public doses below regulatory limits when further reduction was reasonably achievable.
      - ALARA affected engineering controls, work planning, monitoring, effluent management, licensing and decommissioning decisions rather than functioning only as an advisory scientific hypothesis.
      - The NRC's 2026 proposed rule states that application of ALARA at very low doses has at times produced significant economic costs and operational or licensing inefficiencies without commensurate public-health and safety gains.
      - The 2026 proposal would retire ALARA terminology and replace highly subjective below-limit optimization with a graded dose-management framework, but the existing rules remained in force while the proposal was pending.
    summary: The NRC codified ALARA throughout the modern Part 20 framework in 1991 against a longer U.S. regulatory history of linear, no-threshold radiation protection. In 2015, petitioners asked the agency to abandon LNT and ALARA in favor of threshold and radiation-hormesis interpretations; the NRC denied those petitions in 2021, concluding that LNT remained a sound regulatory basis. In July 2026 the agency proposed a substantial narrowing of that approach. The proposal explicitly says the evidence remains insufficient to refute LNT and that no consensus-supported, regulation-ready alternative exists, but argues that strict implementation of the no-threshold premise can become disproportionately conservative at very low doses. It therefore proposes retaining a linear dose-response model while retiring ALARA terminology and specifying a more determinate graded approach below dose limits.
