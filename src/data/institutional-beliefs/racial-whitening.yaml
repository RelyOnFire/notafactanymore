title: Racial whitening
claim: Increasing European ancestry through immigration and intermarriage was treated as a biological route to “whiten” and improve the nation.
currentUnderstanding: Human populations do not form a biological hierarchy from inferior to superior races, and increasing ancestry associated with socially defined “whiteness” does not biologically improve a population. Race is a social classification that only imperfectly tracks patterns of genetic ancestry.
category: Race and demography
reviewedAt: 2026-08-22
episodes:
  - id: brazil-1890-1930
    polity: Brazil
    region: Latin America
    startYear: 1890
    endYear: 1930
    periodLabel: 1890–1930
    strength: policy-basis
    institutionTypes: [government]
    institutions:
      - Federal government of the First Brazilian Republic
      - Federal and state immigration administrations
    consequences:
      - Subsidized European immigration
      - Restrictions on African and Asian immigration
      - Racialized population policy
    summary: During the First Brazilian Republic, influential racial theory held that European immigration and interracial marriage could make Brazil progressively whiter. Immigration policy subsidized Europeans while the 1890 framework restricted immigration from Africa and Asia, giving the whitening project concrete institutional form.
    sources:
      - title: Racial Whitening as a Global “Innovation” — Race in the First Brazilian Republic, 1889–1930
        url: https://www.cambridge.org/core/journals/du-bois-review-social-science-research-on-race/article/racial-whitening-as-a-global-innovation/2675EBB583BEE2C057ED301018F153D2
        publisher: Du Bois Review
        note: Argues that racial whitening had wide political resonance in the First Republic and oriented discriminatory immigration structures intended to reshape the national population.
      - title: Pursuing Racial Order and Social Progress — Violence, Afrophobia and “Religious Racism” in Brazil
        url: https://www.cambridge.org/core/journals/latin-american-research-review/article/pursuing-racial-order-and-social-progress-violence-afrophobia-and-religious-racism-in-brazil/A36688155381AE52A05987C590F8ED69
        publisher: Latin American Research Review
        note: Describes the 1890 restriction on African and Asian immigration alongside aggressive encouragement and subsidization of European immigration.
