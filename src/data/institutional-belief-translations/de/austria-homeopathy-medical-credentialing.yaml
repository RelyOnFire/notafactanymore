locale: de
entryId: austria-homeopathy-medical-credentialing
sourceReviewedAt: '2026-08-24'
title: Homöopathie als zertifizierte ärztliche Therapie in Österreich
claim: Die österreichische Ärzteschaft behandelte Homöopathie institutionell als ärztliche Therapie, deren Prinzipien
  und klinische Anwendung gelehrt, geprüft, diplomiert und zur Behandlung akuter und chronischer Erkrankungen eingesetzt
  werden können.
currentUnderstanding: Für Homöopathie sind bei keiner bekannten Krankheit robuste und reproduzierbare therapeutische
  Wirkungen über den Placeboeffekt hinaus belegt. Zentrale Annahmen – darunter therapeutische Wirkungen extremer
  Verdünnungen und das Ähnlichkeitsprinzip – werden weder durch etablierte Chemie und Pharmakologie noch durch verlässliche
  klinische Evidenz gestützt. Eine berufliche Zertifizierung kann die Ausbildung in einer Methode standardisieren,
  belegt aber nicht die Wirksamkeit der Methode selbst.
impact:
  summary: Seit 1994 führt die Österreichische Ärztekammer ein formelles Homöopathie-Diplom für Ärztinnen und Ärzte.
    Das aktuelle Curriculum bezeichnet Homöopathie als ärztliche Therapie, verlangt drei Jahre und 350 Unterrichtseinheiten
    und sieht die Behandlung akuter und chronischer Erkrankungen nach homöopathischen Regeln vor. Diese berufliche
    Anerkennung besteht parallel zu einer gegenteiligen österreichischen gesundheitspolitischen Bewertung, nach
    der Homöopathie keine wissenschaftlich gesicherte Heilmethode ist und grundsätzlich nicht öffentlich erstattet
    wird.
  highlights:
  - value: '1994'
    label: Homöopathie erhielt ein Spezialdiplom der Österreichischen Ärztekammer
  - value: 350 Einheiten
    label: Das aktuelle ÖÄK-Diplom verlangt mindestens drei Jahre ärztliche Weiterbildung
  - value: '675'
    label: Ärztinnen und Ärzte hielten Ende 2024 das ÖÄK-Diplom Homöopathie
  context:
  - Die Karte betrifft die berufliche ärztliche Zertifizierung und nicht die Behauptung, dass die österreichische
    Sozialversicherung Homöopathie generell bezahlt. Die Sozialversicherung hat diese Bereiche ausdrücklich getrennt
    und Homöopathie nicht als wissenschaftlich gesicherte Heilmethode für eine allgemeine Erstattung anerkannt.
  - 'Gerade der institutionelle Widerspruch ist relevant: Eine zentrale ärztliche Institution zertifiziert weiterhin
    homöopathische Diagnostik und Behandlung, während andere österreichische Gesundheitsorgane ausdrücklich auf
    unzureichende Wirksamkeitsnachweise verweisen.'
episodes:
- id: austria-1994-2026
  polity: Österreich
  institutions:
  - Österreichische Ärztekammer
  - Österreichische Akademie der Ärzte
  institutionalContext: 'Die Österreichische Ärztekammer führte 1994 ein Spezialdiplom für Homöopathie ein und hält
    es bis heute in ihrem formellen ärztlichen Weiterbildungssystem aufrecht. Das aktuelle Curriculum bezeichnet
    Homöopathie als ärztliche Therapie mit Arzneimittelprüfung am gesunden Menschen, Potenzierung und Ähnlichkeitsprinzip
    und sieht vor, dass Absolventinnen und Absolventen akute und chronische Erkrankungen nach den Regeln der Homöopathie
    behandeln können. Die Österreichische Akademie der Ärzte administriert das Diplom im Auftrag der Ärztekammer.
    Dies ist eine berufliche Zertifizierung und keine allgemeine Kassenleistung: Die österreichische Sozialversicherung
    hat Homöopathie getrennt davon als nicht wissenschaftlich gesicherte Heilmethode und homöopathische Arzneimittel
    grundsätzlich als nicht ausreichend wirksam für eine Erstattung eingeordnet.'
  summary: 'Die Österreichische Ärztekammer zertifiziert Ärztinnen und Ärzte seit 1994 in Homöopathie. Ihr aktuelles
    ÖÄK-Diplom definiert die Methode als ärztliche Therapie, lehrt Potenzierung und Ähnlichkeitsprinzip und sieht
    die Behandlung akuter und chronischer Erkrankungen vor. Das Diplom ist weiterhin aktiv: Im Fortbildungsbericht
    2025 wurden zum Jahresende 2024 insgesamt 675 Diplominhaberinnen und -inhaber gezählt. Diese Anerkennung besteht
    neben einer ausdrücklich anderen österreichischen gesundheitspolitischen Bewertung, nach der Homöopathie wissenschaftlich
    nicht gesichert ist und homöopathische Arzneimittel grundsätzlich nicht die Evidenzschwelle für eine Erstattung
    erreichen.'
  consequences:
  - Formelles ärztliches Diplom für homöopathische Diagnostik und Behandlung
  - Dreijähriger Weiterbildungspfad mit 350 Unterrichtseinheiten unter Anerkennung der Ärztekammer
  - Berufliche Legitimation der Behandlung akuter und chronischer Erkrankungen nach homöopathischen Prinzipien
  - Hunderte aktuell diplomierte Ärztinnen und Ärzte trotz fehlender robuster Evidenz für eine spezifische therapeutische
    Wirkung
