title: Universal fire suppression in Yellowstone
entryId: fire-is-always-harmful-to-ecosystems
claim: Natural wildland fires in Yellowstone were treated primarily as damage to park resources that should be extinguished, rather than as recurring ecological processes that could be necessary to maintain some of the landscapes the park was meant to preserve.
currentUnderstanding: Fire can threaten lives, structures and particular resources and often must be suppressed, but in many Yellowstone ecosystems it is also a natural ecological process that shapes vegetation, regeneration and habitat. Modern park policy therefore manages fires according to conditions and objectives rather than treating every ignition as ecological damage.
category: Conservation and fire management
reviewedAt: '2026-08-27'
impact:
  summary: For decades, Yellowstone management operationalized the belief that protecting the park meant excluding fire. The policy suppressed natural ignitions and nearly eliminated fire for long periods in accessible northern-range communities. Ecological research later showed that blanket exclusion itself changes fire-adapted landscapes, leading the National Park Service to restore a managed role for natural and prescribed fire.
  highlights:
  - value: '1886'
    label: U.S. Army fire suppression began after the Army assumed management of Yellowstone
  - value: '1972'
    label: Yellowstone began allowing some lightning-caused fires to burn under a natural-fire program
  - value: '235'
    label: Natural fires allowed to burn in Yellowstone from 1972 through 1987
  context:
  - The correction is not that fires should simply be left alone. Modern fire management still suppresses fires that threaten people, structures, cultural resources or other protected values.
  - A century of suppression does not by itself explain the 1988 Yellowstone fires. The National Park Service notes that suppression did not produce a significant park-wide increase in fuel loads, except perhaps on parts of the northern range; the 1988 season also involved exceptional drought and wind.
episodes:
