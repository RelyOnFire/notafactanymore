locale: de
entryId: martial-races
sourceReviewedAt: 2026-08-22
title: „Kriegerrassen“
claim: Bestimmten indischen Gemeinschaften wurden angeborene rassische oder erbliche Eigenschaften zugeschrieben, die sie von Natur aus zu besseren Soldaten machen sollten als andere.
currentUnderstanding: Militärische Leistungsfähigkeit ist keine erbliche Eigenschaft einer „Rasse“ oder Kaste. Ausbildung, Auswahl, Ernährung, Organisation, Erfahrung, Anreize, Technologie und soziale Bedingungen beeinflussen militärische Effektivität; breite ethnische Kategorien begründen keine angeborene Eignung zum Soldaten.
episodes:
  - id: british-india-1880-1947
    polity: Britisch-Indien
    summary: Seit dem späten 19. Jahrhundert bevorzugte die Rekrutierung der britisch-indischen Armee zunehmend Gemeinschaften, die als „martial races“ eingestuft wurden, darunter Sikhs, Gurkhas sowie Teile der punjabischen muslimischen und nordwestlichen Bevölkerung. Rassifizierte Vorstellungen über Mut, Männlichkeit, Klima, Kaste und Vererbung wurden Teil der praktischen Rekrutierungspolitik.
    consequences:
      - Selektive Militärrekrutierung
      - Ungleicher Zugang zu militärischer Beschäftigung
      - Rassifizierte Einteilung von Gemeinschaften
