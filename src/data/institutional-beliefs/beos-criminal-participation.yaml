title: BEOS brain profiling as evidence of criminal participation
claim: Brain Electrical Oscillation Signature (BEOS) profiling was treated as capable of distinguishing experiential
  memory acquired through personal participation in a crime from knowledge acquired by learning about, witnessing,
  or otherwise becoming familiar with the event, thereby indicating a suspect's involvement.
currentUnderstanding: EEG-based experiments can reveal aspects of recognition and memory under controlled conditions,
  but BEOS's stronger forensic inference—from a pattern of brain activity to whether a person personally participated
  in a specific crime—has not been established as a reliably validated case-level test. Memory can be misattributed,
  suggested, rehearsed, contaminated, or sincerely false, and current science cannot reliably infer from a detected
  memory that the subject actually performed the remembered act. Supportive BEOS studies exist, but they do not
  establish a known real-world error rate or robust independent validation for determining criminal participation.
category: Forensic psychology and criminal evidence
reviewedAt: '2026-08-24'
impact:
  summary: Indian forensic institutions used BEOS on criminal suspects and witnesses as an investigative aid and,
    in early cases, courts considered its claimed experiential-memory findings alongside other evidence. The Supreme
    Court later prohibited involuntary brain-mapping-type testing and barred direct admission of the test result
    itself even when voluntarily obtained, but state forensic and national training institutions continue to maintain
    and describe BEOS as a tool for inferring participation in crime.
  highlights:
  - value: '2008'
    label: Maharashtra courts considered BEOS findings in murder prosecutions
  - value: 75+
    label: suspects and witnesses had reportedly undergone BEOS at one Maharashtra laboratory by 2008
  - value: '2026'
    label: Maharashtra's state forensic laboratory still describes BEOS as detecting experiential knowledge from
      crime participation
  context:
  - The disputed BEOS inference is specifically from brain responses to personal participation in an event. EEG
    can measure brain activity, recognition-memory paradigms are not all invalid, and a detected memory can still
    have investigative value; none of those narrower points establishes that BEOS can reliably prove participation.
  - Selvi v. State of Karnataka did not scientifically abolish BEOS. The Supreme Court addressed BEAP and related
    deception-detection techniques, prohibited involuntary administration, required safeguards for voluntary testing,
    and held that the test results themselves are not directly admissible as evidence. The continuing institutional
    issue is therefore investigative use and the factual inference attached to it.
