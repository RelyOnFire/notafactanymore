t-anchor="start"><tspan x="120" dy="0">Orbits the Sun</tspan></text><circle cx="82" cy="1252" r="20" fill="#dfe9e4" stroke="#4f776e" stroke-width="2"/><text x="82" y="1260" font-size="24" font-weight="800" fill="#4f776e" text-anchor="middle">✓</text><text x="120" y="1253" font-size="22" font-weight="600" fill="#2f302d" text-anchor="start"><tspan x="120" dy="0">Rounded by its own gravity</tspan></text><circle cx="82" cy="1342" r="20" fill="#eee1dd" stroke="#9c665e" stroke-width="2"/><text x="82" y="1350" font-size="24" font-weight="800" fill="#9c665e" text-anchor="middle">×</text><text x="120" y="1343" font-size="22" font-weight="600" fill="#2f302d" text-anchor="start"><tspan x="120" dy="0">Cleared its orbital neighbourhood</tspan></text><rect x="54" y="1440" width="652" height="105" rx="14" fill="#ece7db"/><text x="72" y="1477" font-size="19" font-weight="700" fill="#4f776e" text-anchor="start">Official classification</text><text x="688" y="1508" font-size="34" font-weight="800" fill="#2f302d" text-anchor="end">Dwarf planet</text><text x="58" y="1590" font-size="17" font-weight="400" fill="#6d6b64" text-anchor="start"><tspan x="58" dy="0">The IAU definition is official, but some planetary scientists favor</tspan><tspan x="58" dy="24">broader definitions.</tspan></text></svg>