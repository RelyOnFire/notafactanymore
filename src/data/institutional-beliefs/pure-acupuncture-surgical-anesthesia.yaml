evidence:
  - id: acupuncture-shanghai-proposition
    sourceId: acupuncture-shanghai-observer-history
    relation: documents
    target: {scope: belief, aspect: proposition}
    note: >-
      Domestic historical reconstruction records Ministry of Health funding in 1961, State Science Commission recognition in 1965, and the joint State Science Commission–Ministry of Health national research meeting of 28 February 1966 that established the 1966–1968 acupuncture-anesthesia research plan and drove nationwide expansion.
  - id: acupuncture-peoples-daily-proposition
    sourceId: acupuncture-peoples-daily-1971
    relation: documents
    target: {scope: belief, aspect: proposition}
    note: >-
      Contemporary state press states that urban, rural, and PLA medical units were using acupuncture anesthesia, reports more than 400,000 operated patients and an approximately 90 percent success rate, and promotes the method for major surgery and for rural, mountain, and wartime settings where conventional anesthesia equipment was limited.
  - id: acupuncture-perioperative-correction
    sourceId: acupuncture-perioperative-review
    relation: supports
    target: {scope: belief, aspect: correction}
    note: >-
      An anesthesiology review explains that acupuncture does not provide true anesthesia or unconsciousness, adequate
      muscle relaxation, or suppression of autonomic reflexes from visceral pain, while distinguishing possible analgesic
      and perioperative uses in combination with conventional techniques.
  - id: acupuncture-network-correction
    sourceId: acupuncture-network-meta-analysis
    relation: supports
    target: {scope: belief, aspect: correction}
    note: >-
      Network meta-analysis of 76 randomized trials concerns acupuncture techniques added to general anesthesia, reports
      possible reductions in propofol or remifentanil use, grades comparisons low to moderate, and identifies moderate risk
      of bias and substantial heterogeneity.
  - id: acupuncture-current-boundary
    sourceId: acupuncture-history-dilemma-review
    relation: supports
    target: {scope: belief, aspect: correction}
    note: >-
      A contemporary specialty review describes acupuncture anesthesia as predominantly adjunctive, says standalone use is
      difficult and usually requires pharmacological anesthesia, and warns that the term itself can falsely suggest that
      acupuncture is a form of anesthesia.
  - id: acupuncture-wenhui-impact
    sourceId: acupuncture-wenhui-retrospective
    relation: supports
    target: {scope: belief, aspect: impact}
    note: >-
      Interviews modern acupuncture-anesthesia leader Zhou Jia and describes the earlier indiscriminate expansion to more than 90 types of disease or operation and roughly two million procedures, notes that pure acupuncture was ineffective or inadequate for some surgery, and explains the later shift toward acupuncture-drug combined anesthesia.
  - id: acupuncture-shanghai-carrier
    sourceId: acupuncture-shanghai-observer-history
    relation: documents
    target: {scope: episode, episodeId: china-1966-1999, aspect: carrier}
    note: >-
      Identifies the State Science Commission and Ministry of Health as the organizers of the 1966 national meeting and
      plan and traces implementation through regional authorities, hospitals, research bodies, and military units.
  - id: acupuncture-guangdong-mechanism
    sourceId: acupuncture-guangdong-history
    relation: documents
    target: {scope: episode, episodeId: china-1966-1999, aspect: mechanism}
    note: >-
      Hospital history records that the Ministry of Health Military Control Commission made acupuncture anesthesia an important national wartime-health task at a September 1969 national meeting. It also documents a 1971 operation that still required a small amount of lidocaine because analgesia from acupuncture was incomplete.
  - id: acupuncture-peoples-daily-consequences
    sourceId: acupuncture-peoples-daily-1971
    relation: documents
    target: {scope: episode, episodeId: china-1966-1999, aspect: consequences}
    note: >-
      The state article promotes use in head, chest, abdominal, and limb operations, in rural and mountain areas, and under
      wartime constraints; it also describes a PLA General Hospital team conducting thousands of operations in rural Shanxi.
  - id: acupuncture-guangdong-context
    sourceId: acupuncture-guangdong-history
    relation: contextualizes
    target: {scope: episode, episodeId: china-1966-1999, aspect: context}
    note: >-
      The documented use of lidocaine when analgesia proved incomplete shows why “pure” acupuncture cannot be assumed for
      every operation counted under the historical acupuncture-anesthesia label.
  - id: acupuncture-reston-context
    sourceId: acupuncture-shanghai-observer-history
    relation: contextualizes
    target: {scope: episode, episodeId: china-1966-1999, aspect: context}
    note: >-
      Reconstructs Reston's 1971 case as a conventionally anesthetized appendectomy followed by acupuncture for
      postoperative abdominal distension, separating the episode's publicity effect from evidence for surgical anesthesia.
  - id: acupuncture-perioperative-episode-context
    sourceId: acupuncture-perioperative-review
    relation: contextualizes
    target: {scope: episode, episodeId: china-1966-1999, aspect: context}
    note: >-
      Provides the modern anesthesiology boundary for evaluating the historical program: acupuncture can contribute
      analgesia or sedation but cannot alone supply the full conditions required for major surgery.
  - id: acupuncture-network-institutional-context
    sourceId: acupuncture-network-meta-analysis
    relation: contextualizes
    target: {scope: episode, episodeId: china-1966-1999, aspect: institutional-correction}
    note: >-
      Shows that the contemporary trial literature evaluates acupuncture as an addition to general anesthesia rather than
      as the broad standalone replacement promoted during the historical episode.
  - id: acupuncture-current-institutional-context
    sourceId: acupuncture-history-dilemma-review
    relation: contextualizes
    target: {scope: episode, episodeId: china-1966-1999, aspect: institutional-correction}
    note: >-
      Places current practice predominantly in an adjunctive role and calls for clearer professional boundaries, supporting
      the classification of the later institutional shift as real but incomplete.
  - id: acupuncture-wenhui-correction
    sourceId: acupuncture-wenhui-retrospective
    relation: documents
    target: {scope: episode, episodeId: china-1966-1999, aspect: institutional-correction}
    note: >-
      Reports that hospitals gradually abandoned the old pure-acupuncture model after the 1980s as its limitations became
      apparent and describes the subsequent move toward combined acupuncture-drug anesthesia and selected indications.
  - id: acupuncture-shutcm-correction
    sourceId: acupuncture-shutcm-combined
    relation: documents
    target: {scope: episode, episodeId: china-1966-1999, aspect: institutional-correction}
    note: >-
      Official university account says the modern team changed the old awake pure-acupuncture technique into shallow-sleep, spontaneous-breathing acupuncture-drug combined anesthesia, redefined advantageous indications, produced clinical guidelines, and thereby returned acupuncture anesthesia to a more appropriate developmental path.
