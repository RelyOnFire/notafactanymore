evidence:
  - id: pft-2005-proposition
    sourceId: pft-2005-standard
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: Reference Equations — General issues, p. 949
    note: >-
      The joint standard directs patients to identify their race or ethnic group, prefers group-specific reference equations
      and permits published adjustment factors when suitable equations are unavailable.
  - id: pft-gli-2012-proposition
    sourceId: pft-gli-2012
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: Abstract; Conclusions; Recommendations
    note: >-
      The ERS task force derived separate Caucasian, African-American, North East Asian and South East Asian equations and an
      averaged “Other” equation, then recommended widespread implementation of the reference system.
  - id: pft-2023-correction
    sourceId: pft-2023-statement
    relation: documents
    target: {scope: belief, aspect: correction}
    locator: Overview; Key Conclusions and Recommendations
    note: >-
      The official ATS statement describes race as a social construct, recommends race-neutral average reference equations
      and says results near the lower limit require history, testing, imaging and other clinical evidence.
  - id: pft-gli-global-correction
    sourceId: pft-gli-global-2022
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Abstract; Discussion
    note: >-
      Derives GLI Global from the original data without requiring race or ethnicity at application, reports wider limits of
      normal and cautions that any reference equation must be used with symptoms and medical history.
  - id: pft-reclassification-impact
    sourceId: pft-reclassification-2023
    relation: documents
    target: {scope: belief, aspect: impact}
    locator: Abstract, Results and Conclusions
    note: >-
      Reinterprets 8,431 tests from one academic center and quantifies opposite changes in restrictive-pattern prevalence and
      severity among Black and White patients; it does not measure diagnoses, treatment changes or outcomes after implementation.
  - id: pft-implications-impact
    sourceId: pft-implications-2024
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: Abstract; Results; Discussion; Limitations
    note: >-
      Projects U.S. clinical, occupational and financial reclassification from multiple cohorts, including 12.5 million
      ventilatory-impairment classifications, while distinguishing modeled threshold effects from observed patient outcomes.
  - id: pft-implementation-impact
    sourceId: pft-implementation-survey-2026
    relation: documents
    target: {scope: belief, aspect: impact}
    locator: Abstract; Current Practices; Discussion and Limitations
    note: >-
      Of 66 respondents, 54% reported a race-neutral equation in their laboratory; the 29% response rate and predominantly
      academic sample sharply limit any inference about national adoption.
  - id: pft-2005-carrier
    sourceId: pft-2005-standard
    relation: documents
    target: {scope: episode, episodeId: ats-ers-2005-2023, aspect: carrier}
    locator: Title page; Reference Equations — General issues, pp. 948–949
    note: >-
      Direct joint ATS/ERS task-force standard identifying the societies that issued the interpretive guidance.
  - id: pft-gli-2012-carrier
    sourceId: pft-gli-2012
    relation: documents
    target: {scope: episode, episodeId: ats-ers-2005-2023, aspect: carrier}
    locator: Title and author group; Recommendations
    note: >-
      Identifies the ERS Global Lung Function Initiative as the task force that assembled the multi-group equations and urged
      respiratory societies and device users to implement them.
  - id: pft-occupational-carrier
    sourceId: pft-ats-occupational-2014
    relation: documents
    target: {scope: episode, episodeId: ats-ers-2005-2023, aspect: carrier}
    locator: Reference Values for Asian Americans; Recommendation
    note: >-
      An official ATS standard showing that race- or ethnicity-specific equations and fallback correction factors remained
      endorsed in occupational spirometry in 2014.
  - id: pft-2023-carrier
    sourceId: pft-2023-statement
    relation: documents
    target: {scope: episode, episodeId: ats-ers-2005-2023, aspect: carrier}
    locator: Footnote on approval and endorsement
    note: >-
      Records ATS approval in February 2023 and ERS endorsement in March 2023, establishing the institutional status of the reversal.
  - id: pft-2005-mechanism
    sourceId: pft-2005-standard
    relation: documents
    target: {scope: episode, episodeId: ats-ers-2005-2023, aspect: mechanism}
    locator: Reference Equations — General issues, p. 949
    note: >-
      Specifies self-identification, selection of a group-specific equation and fallback adjustments of about 12%, 7% or
      0.94 for named measurements and groups, with the selected factor recorded on the report.
  - id: pft-gli-2012-mechanism
    sourceId: pft-gli-2012
    relation: documents
    target: {scope: episode, episodeId: ats-ers-2005-2023, aspect: mechanism}
    locator: Results; Conclusions; Recommendations
    note: >-
      Encodes four named racial or geographic groups and an averaged “Other” category in continuous all-age reference equations
      intended for implementation in spirometry equipment.
  - id: pft-2022-mechanism
    sourceId: pft-2022-standard
