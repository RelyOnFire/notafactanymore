locale: de
entryId: chlorella-algolization
sourceReviewedAt: 2026-08-23
title: Chlorella-„Algolisierung“ zur Sanierung von Gewässern
claim: Das Einbringen ausgewählter planktonischer Chlorella-Stämme in natürliche Gewässer wurde als verlässliche Methode
  behandelt, um Cyanobakterienblüten zu unterdrücken und die Wasserqualität über die behaupteten ökologischen Mechanismen
  zu verbessern.
currentUnderstanding: Chlorella hat legitime Anwendungen in Biotechnologie und Abwasserforschung. Die Evidenz belegt jedoch
  nicht, dass das Beimpfen natürlicher Stauseen mit ausgewählten Chlorella-Stämmen Cyanobakterienblüten zuverlässig unterdrückt
  oder die weitreichenden Sanierungseffekte der sogenannten Algolisierung erzielt. Russische staatliche Versuche von 2007
  konnten die Wirksamkeit nicht nachweisen; 2009 kam ein wissenschaftlich-technischer Beirat der Föderalen Wasseragentur
  zu dem Schluss, dass der vorgeschlagene Einsatz von Chlorella gegen Algenblüten wissenschaftlich nicht begründet und durch
  die Praxis nicht bestätigt sei.
impact:
  summary: Das Bemerkenswerte an diesem Fall ist der institutionelle Widerspruch selbst. Russische Wasserbehörden erzeugten
    negative oder nicht eindeutige Evidenz, und ein föderaler wissenschaftlicher Beirat verwarf die behauptete Methode zur
    Unterdrückung von Algenblüten als unbelegt. Später erhielt die Algolisierung dennoch die Legitimität nationaler technischer
    Normen.
  highlights:
  - value: '2009'
    label: Ein föderaler wissenschaftlicher Beirat erklärte die Methode zur Blütenunterdrückung für wissenschaftlich unbegründet
      und praktisch nicht bestätigt
  - value: '2022'
    label: Algolisierung wurde in einer russischen nationalen Norm festgeschrieben
  - value: '2025'
    label: Eine eigene nationale Norm für Chlorella-Algolisierung wurde eingeführt
  context:
  - Die zeitliche Abfolge ist entscheidend. Der erste großflächige Einsatz im Pensa-Stausee 1998 wird in der späteren Norm
    selbst als wirkungslos beschrieben. Ein Versuch der Föderalen Wasseragentur am Zimljansker Stausee 2007 lieferte keine
    eindeutigen Wirksamkeitsnachweise; 2009 kam ihr wissenschaftlich-technischer Beirat zu dem Schluss, der vorgeschlagene
    Chlorella-Einsatz gegen Algenblüten sei wissenschaftlich nicht begründet und praktisch nicht bestätigt.
  - Trotz dieser negativen Bewertung blieb die Methode im Umlauf. Russische Wasserforscher berichteten über weitere Labor-
    und Feldversuche 2012–2013, die den behaupteten Mechanismus ebenfalls nicht bestätigten. Dennoch schrieb GOST R 59977-2022
    die Algolisierung in einer nationalen Norm zur Gewässersanierung fest, und GOST R 71946-2025 schuf anschließend einen
    eigenen Standard für den Einsatz planktonischer Chlorella-Stämme. Der institutionelle Irrtum besteht deshalb nicht bloß
    darin, dass ein Versuch misslang, sondern darin, dass eine umstrittene Methode formale technische Autorität erhielt,
    nachdem das staatliche Wissenschaftssystem bereits gegenteilige Befunde erzeugt hatte.
episodes:
- id: russia-2022-2026
  polity: Russland
  summary: Russland normierte die Chlorella-basierte Algolisierung mit GOST R 59977-2022 als Technologie zur Sanierung von
    Gewässern. Der Standard schreibt wiederholtes Einbringen der Mikroalge vor und schreibt der Methode weitreichende Verbesserungen
    der Wasserqualität zu. Zuvor hatte ein Versuch der Föderalen Wasseragentur 2007 keine eindeutigen Wirksamkeitsnachweise
    erbracht; ihr wissenschaftlich-technischer Beirat erklärte 2009, der Einsatz von Chlorella zur Unterdrückung von Algenblüten
    sei wissenschaftlich nicht begründet und praktisch nicht bestätigt. 2025 genehmigte Rosstandart dennoch einen eigenen
    nationalen Standard für die Algolisierung mit planktonischen Chlorella-Stämmen, der 2026 weiterhin gilt.
  consequences:
  - Nationale Standards schrieben die Algolisierung als Verfahren zur Sanierung von Gewässern fest
  - Das normierte Verfahren legte Chlorella-Stämme, Einsatzmengen, wiederholte Behandlungen und Überwachungsanforderungen
    fest
  - Ein eigener Standard von 2025 erweiterte die Anforderungen auf Trinkwasserquellen, Freizeitgewässer, Fischereigewässer
    und biologische Reinigungsgewässer
  institutions:
  - Rosstandart (Föderale Agentur für technische Regulierung und Metrologie)
  - Russisches Institut für Standardisierung
  - Technisches Komitee 409 „Umweltschutz“
