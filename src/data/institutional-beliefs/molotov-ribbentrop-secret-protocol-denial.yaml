    note: >-
      Research paper based on contemporary Soviet press, Associated Press, TASS and Radio Liberty archival records. It
      describes the long denial and shows the qualified but continuing doubt expressed at the August 1988 press conference.
  - id: protocol-lindpere-proposition
    sourceId: protocol-lindpere-commission-history
    relation: supports
