schemaVersion: 2
title: Wolf extirpation and predator control in Yellowstone
entryId: predators-only-harm-prey-populations
proposition:
  summary: >-
    Yellowstone managers treated wolves and other carnivores as destructive competitors: killing them was expected to
    protect livestock and favored wildlife, especially deer and elk. From 1914 through 1926, this premise supported an
    intensive campaign that killed at least 136 wolves inside the park and eliminated its last known pack.
correction:
  summary: >-
    Wolves kill prey and can cause livestock conflicts; their effects depend on prey density, weather, other predators,
    hunting and place. A native apex predator cannot, however, be reduced to those costs. Wolves shape predator-prey
    relationships and scavenger food supplies, and removing them is itself a food-web intervention. Yellowstone ended
    general predator control in 1935 and ultimately restored wolves, but the evidence does not support attributing every
    later change in vegetation or streams to wolves alone.
category: Wildlife management and ecology
reviewedAt: '2026-09-27'
impact:
  summary: >-
    The predator-as-competitor premise became a lethal federal campaign. National Park Service records count at least
    136 wolves killed inside Yellowstone from 1914 through 1926. The last known den was destroyed in 1923 and the last
    known pack was killed in 1926; scattered sightings followed, but the 1994 federal environmental review found no
    known pack or breeding pair in the Greater Yellowstone Area. Repair required federal protection, recovery planning,
    an environmental review and the active relocation of 31 Canadian wolves to Yellowstone in 1995 and 1996.
  highlights:
    - value: '136+'
      label: minimum number of wolves killed inside Yellowstone from 1914 through 1926
    - value: '1926'
      label: year the last known Yellowstone wolf pack was killed
    - value: '31 wolves'
      label: relocated from western Canada to Yellowstone in 1995 and 1996
  context:
    - >-
      Predator control in Yellowstone predates 1914, but the surviving National Park Service count begins in that year.
      The Army's arrival in 1886 does not by itself establish that a continuous wolf-eradication campaign began then, so
      this episode uses the documented 1914–1926 campaign as its auditable boundary.
    - >-
      “Eradication” accurately describes the loss of Yellowstone's breeding wolf population, not the fate of every
      targeted carnivore. Cougar policy changed repeatedly: Theodore Roosevelt ordered cougar killing stopped in 1908,
      it resumed in 1914, and the last reported official cougar killing occurred in 1925. Coyote killing continued after
      the last known wolf pack was destroyed.
    - >-
      Wolves are one influence among many. Elk abundance and behavior also reflect other predators, human hunting,
      drought, winter severity and changing prey communities. Groundwater, climate and the loss of beaver engineering
      also affect willow and aspen, so the popular story that wolves alone transformed Yellowstone's vegetation and rivers
      is not supported.
    - >-
      A 20-year field experiment found that returning large carnivores did not by itself restore northern-range willow
      communities: continued browsing and altered hydrology kept many willows short. Restoration of a missing predator
      therefore does not automatically or quickly reverse every ecological effect of its earlier removal.
    - >-
      Yellowstone now lets the in-park wolf population be shaped primarily by natural processes while monitoring packs,
      prey, disease and genetics. Wolves that cross park boundaries encounter different state and Tribal rules, so the
      park's correction should not be mistaken for one uniform policy across the Greater Yellowstone Ecosystem.
episodes:
  - id: united-states-yellowstone-1914-1926
    polity: United States
    region: North America
    startYear: 1914
    endYear: 1926
    strength: policy-basis
    institutionTypes:
      - government
    institutions:
      - U.S. Army administration of Yellowstone National Park
      - U.S. National Park Service
    institutionalContext: >-
      The U.S. Army administered Yellowstone through 1918 and the National Park Service thereafter. Predator control had
      begun earlier, but 1914 marks the start of the park's documented minimum count for the intensive wolf campaign.
      Managers divided wildlife into favored species and carnivores treated as destructive competitors, then killed
      wolves and other predators to protect livestock and “desirable” deer and elk. The premise was influential but never
      perfectly uniform across species or officials, as the earlier reversal over cougar killing demonstrates.
    consequences:
      - At least 136 wolves were killed inside Yellowstone from 1914 through 1926
      - The last known den was destroyed in 1923 and the last known pack was killed in 1926
      - Later reports involved scattered individuals or small groups; no persistent breeding population was confirmed before reintroduction
      - Pack-level predation and the associated supply of carcasses to scavengers were removed from the park's food web
      - Restoring wolves required federal protection, recovery planning, environmental review and active translocation beginning in 1995
    summary: >-
      Yellowstone's wolf campaign converted a simplified wildlife hierarchy into direct removal. At least 136 wolves were
      killed from 1914 through 1926, when the park's last known pack was eliminated. Ending organized predator control in
      1935 did not restore the missing breeding population. The National Park Service later adopted ecological management,
      federal law enabled recovery, and a 1994 decision approved active reintroduction. Wolves returned in 1995 and 1996.
      Their restoration reinstated a native predator and its interactions, while research continues to reject a single-cause
      account of every subsequent change in elk, vegetation or streams.
    mechanism:
      kind: enforcement
      summary: >-
        Federal park personnel carried out organized predator control, directly killed wolves and other selected
        carnivores, recorded the removals and treated fewer predators as protection for livestock and favored wildlife.
    institutionalCorrection:
      status: corrected
      periodLabel: 1935–1995
      action: >-
        The National Park Service ended general predator control in Yellowstone in 1935; the 1963 Leopold Report urged
        protection of natural predation, and federal recovery planning and a 1994 Record of Decision led to wolf releases
        beginning in 1995.
      summary: >-
        Correction came in stages. The park stopped routine predator killing, national policy recognized predators as
        components of native biotic communities, and the federal government protected and then actively restored wolves.
        Current Yellowstone management monitors wolves within a food web instead of treating their absence as a success.
