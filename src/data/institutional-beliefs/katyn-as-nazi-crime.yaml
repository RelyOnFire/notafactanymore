    note: >-
      IPN chronology records the 13 April 1990 TASS communiqué acknowledging direct NKVD responsibility and calling
      Katyn one of the gravest crimes of Stalinism.
  - id: katyn-soviet-correction-echr
    sourceId: katyn-echr
    relation: documents
    target: {scope: episode, episodeId: soviet-union-1943-1990, aspect: institutional-correction}
    locator: 'Facts § 32 (printed p. 6)'
    note: >-
      The Court independently summarizes the official Soviet news-agency communiqué of 13 April 1990 and its finding
      that Beria, Merkulov and their subordinates bore direct responsibility.
  - id: katyn-us-archives-context
    sourceId: katyn-us-archives
    relation: contextualizes
    target: {scope: episode, episodeId: soviet-union-1943-1990, aspect: context}
    locator: '“Summary of Events,” paragraphs on the 1943 commissions and 1951–1952 Madden Committee'
    note: >-
      The official archival overview describes the German-organized 1943 forensic commission, the Soviet counter-enquiry
      and the later unanimous US congressional finding of NKVD responsibility. This provides external context rather
      than evidence of Soviet self-correction.
  - id: katyn-polish-carrier
    sourceId: katyn-ipn-lie
    relation: documents
    target: {scope: episode, episodeId: polish-peoples-republic-1944-1989, aspect: carrier}
    locator: 'Paragraphs beginning “Poles were the key and natural goal,” “After the Red Army entered Poland” and “From the turn of 1944 and 1945”'
    note: >-
      The institutional history documents adoption by Polish communist organizations and the Polish Workers' Party,
      followed by party-state propaganda, censorship, security-service action and controlled historiography throughout
      the Polish People's Republic.
  - id: katyn-polish-mechanism
    sourceId: katyn-ipn-opposition
    relation: documents
    target: {scope: episode, episodeId: polish-peoples-republic-1944-1989, aspect: mechanism}
    locator: 'Opening paragraphs and “Przełamane tabu”'
    note: >-
      The article reproduces a censorship instruction forbidding attempts to assign responsibility for the Polish
      officers' deaths to the USSR and describes opposition efforts from 1976 to 1989 to break the information monopoly.
  - id: katyn-polish-censorship-mechanism
    sourceId: katyn-ipn-censorship
    relation: documents
    target: {scope: episode, episodeId: polish-peoples-republic-1944-1989, aspect: mechanism}
    locator: '“W PRL-u: Czarna Księga cenzury,” opening paragraphs and discussion of the post-1956 silence policy'
    note: >-
      This history distinguishes direct German-guilt propaganda in the Stalinist period from the later policy of silence,
      censorship and removal of Katyn from mass media and reference works.
  - id: katyn-polish-consequences
    sourceId: katyn-ipn-censorship
    relation: supports
    target: {scope: episode, episodeId: polish-peoples-republic-1944-1989, aspect: consequences}
    locator: 'Opening paragraphs; sections describing prosecutions, harassment, confiscations and 1980s memorial actions'
    note: >-
      The IPN account describes censorship, controlled historiography, harassment of victims' families, journalists and
      writers, prosecutions, arrests, confiscations and repression of attempts to publicize Soviet responsibility.
  - id: katyn-polish-consequences-history
    sourceId: katyn-ipn-lie
    relation: supports
    target: {scope: episode, episodeId: polish-peoples-republic-1944-1989, aspect: consequences}
    locator: 'Paragraphs beginning “It should be noted that in communist Poland” and “Based on materials of the Ministry of the Interior”'
    note: >-
      The institutional history reports roughly one hundred documented cases involving law-enforcement or justice bodies
      in repression related to Katyn, while distinguishing changes in intensity and form across the period.
  - id: katyn-polish-correction
    sourceId: katyn-ipn-lie
    relation: documents
    target: {scope: episode, episodeId: polish-peoples-republic-1944-1989, aspect: institutional-correction}
    locator: 'Final paragraphs beginning “The Katyn lie lasted practically” and “Trying to control the transformation”'
    note: >-
      IPN records a partial institutional change in 1989: authorities officially allowed the possibility of an NKVD
      crime in spring, censorship still intervened for a time, and unrestricted publication became possible in the
      second half of the year. It does not identify a comprehensive formal retraction by the outgoing party-state.
