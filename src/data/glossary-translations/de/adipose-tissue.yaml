locale: de
entryId: adipose-tissue
sourceReviewedAt: '2026-08-21'
term: Fettgewebe
aliases:
- adipöses Gewebe
- weißes Fettgewebe
shortDefinition: Körpergewebe, das auf Fettspeicherung spezialisiert ist und zugleich Hormone sowie andere Signalstoffe
  produziert.
longDefinition: Fettgewebe enthält fettspeichernde Adipozyten sowie Blutgefäße, Immunzellen, Bindegewebe und weitere
  Zelltypen. Es speichert und mobilisiert Energie, wirkt aber auch als endokrines und immunologisches Organ, das
  Signale an Gehirn, Leber, Muskeln und andere Gewebe sendet.
