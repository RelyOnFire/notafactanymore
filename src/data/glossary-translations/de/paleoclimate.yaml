locale: de
entryId: paleoclimate
sourceReviewedAt: '2026-08-21'
term: Paläoklima
aliases:
- früheres Klima
- Klima der Erdgeschichte
shortDefinition: Das Klima der geologischen Vergangenheit, rekonstruiert aus physikalischen, chemischen und biologischen
  Spuren.
longDefinition: Die Paläoklimaforschung rekonstruiert Klimazustände aus Zeiten vor modernen Messreihen. Hinweise stammen
  unter anderem aus Eisbohrkernen, Sedimenten, Fossilien, Pollen, Baumringen, Böden und Isotopen. Solche Archive zeigen,
  dass sich das Erdklima im Lauf der Zeit stark verändert hat und helfen zu prüfen, wie Treibhausgase, Kontinentalanordnung,
  Ozeanzirkulation und Erdbahnparameter das Klima beeinflussen.
