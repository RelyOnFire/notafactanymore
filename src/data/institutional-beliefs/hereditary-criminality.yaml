schemaVersion: 2
title: Hereditary criminality
proposition:
  summary: >-
    British Indian authorities treated membership in notified tribes, castes, gangs or classes as sufficient grounds
    for a collective criminal status that passed to people by birth. Colonial accounts often described crime as a
    hereditary occupation or caste practice, while the Criminal Tribes Acts converted that ancestry-based category
    into registration, surveillance, movement controls and compulsory settlement without requiring an individual
    conviction.
correction:
  summary: >-
    Community ancestry does not establish that an individual is criminal or destined to offend. The colonial category
    confused membership in a socially defined group with evidence about a person's conduct: it reached people never
    convicted or even suspected of an offence, and children acquired the status by birth. Modern research describes
    antisocial behaviour as heterogeneous and shaped by interacting genetic and environmental influences; it does not
    support assigning criminal propensity to a caste, tribe or ethnic community. India's 1949–1950 enquiry likewise
    rejected the premise that criminality was hereditary and found birth-based branding incompatible with constitutional
    equality.
category: Colonial criminology and policing
reviewedAt: '2026-09-27'
impact:
  summary: >-
    From 1871 until nationwide repeal took effect in 1952, successive Criminal Tribes Acts enabled governments to
    notify communities or parts of communities as “criminal tribes.” Around 150 tribes and castes were notified across
    India; one scholarly estimate places the notified population of Punjab alone at about 150,000 before 1947. District
    authorities registered members and fingerprints, police monitored movement and reporting, and governments could
    confine people in industrial, agricultural or reformatory settlements. Children could be separated into reformatory
    schools. The system disrupted livelihoods, subjected families to coercive labour and punishment, and attached a
    criminal stigma to descendants who had committed no offence.
  highlights:
    - value: ≈150
      label: tribes and castes the Supreme Court records as having been notified across India
    - value: ≈150,000
      label: people estimated to belong to notified communities in Punjab before 1947
    - value: 31 Aug 1952
      label: date nationwide statutory repeal took effect
  context:
    - >-
      “Hereditary” did not carry one stable meaning in this system. Officials and writers variously described criminality
      as a caste occupation transmitted across generations, a social way of life and, at times, an innate disposition.
      The legal wrong did not depend on choosing among those theories: notification made descent and community membership
      a proxy for individual guilt.
    - >-
      The legal regime changed over time. The 1871 Act initially applied in parts of northern India; later amendments
      and the 1911 and 1924 Acts expanded and consolidated it. Application varied by province and notification, and the
      statutory category could cover whole communities, sections of communities, gangs or other classes rather than one
      fixed ethnographic population.
    - >-
      Repeal removed the formal category but did not erase its institutional afterlife. States enacted habitual-offender
      laws, some officials and prison rules continued to associate denotified or wandering communities with habitual
      crime, and stigma persisted. In 2024 the Supreme Court invalidated discriminatory prison-manual provisions and
      directed revisions, while noting that the validity of state habitual-offender statutes was not before it.
episodes:
  - id: india-1871-1952
    polity: British India and India
    region: South Asia
    startYear: 1871
    endYear: 1952
    periodLabel: 1871–1952
    strength: enforced-doctrine
    institutionTypes:
      - government
      - court
    institutions:
      - Governor-General of India in Council and provincial or local governments
      - District magistrates and police superintendents
      - Punjab Criminal Tribes Department (1917–1952)
    institutionalContext: >-
      Under the 1871 Act, a local government could ask the Governor-General in Council to declare a tribe, gang or class
      “criminal” when it claimed the group was addicted to systematically committing non-bailable offences. Later Acts
      gave provincial governments broader notification powers. District magistrates compiled registers, superintendents
      of police kept them and reported changes, and police and village officials enforced reporting and movement rules.
      Punjab centralized much of this work in a dedicated Criminal Tribes Department from 1917. Statutory clauses also
      prevented courts from questioning the validity of notification decisions.
    consequences:
      - Collective notification and registration based on community membership, including the automatic branding of children born into notified groups
      - Fingerprinting, roll calls, passes, surveillance and restrictions on residence and movement
      - Confinement in industrial, agricultural or reformatory settlements and coercive use of residents' labour
      - Separation of children from parents for placement in industrial, agricultural or reformatory schools
      - Penal sanctions for breaching controls and heightened exposure to police suspicion irrespective of individual conduct
      - Long-lived stigma and disruption of livelihoods that continued after formal denotification
    summary: >-
      The Criminal Tribes regime turned a flexible colonial stereotype into an enforceable status. Governments notified
      groups; magistrates and police identified and registered their members; and a distributed administrative apparatus
      controlled movement, residence, labour and family life. Because the trigger was group membership, the machinery
      reached people without an individual finding of criminal conduct and reproduced the label across generations.
    mechanism:
      kind: enforcement
      summary: >-
        Legislation authorized executive notification of an entire tribe, gang, class or part thereof. Notification then
        activated registers, fingerprinting, police reporting, movement restrictions, passes and settlement powers,
        turning ancestry or community membership into a state-enforced criminal classification.
    institutionalCorrection:
      status: partial
      periodLabel: 1951–2024
      action: >-
        A government enquiry rejected hereditary criminality, Parliament repealed the Criminal Tribes laws effective
        31 August 1952, and the Supreme Court later invalidated discriminatory prison-rule uses of the inherited stereotype.
      summary: >-
        The Criminal Tribes Act Enquiry Committee found that birth-based criminal status violated the constitutional
        commitment to equality, and Parliament's 1952 Act ended the Criminal Tribes laws nationwide. Correction remains
        partial because successor habitual-offender laws and administrative practices preserved parts of the surveillance
        framework and continued to target denotified communities. In 2024 the Supreme Court ordered prison-rule reforms,
        directed police to avoid arbitrary arrests of denotified people and urged states to reconsider whether habitual-
        offender laws belong in a constitutional system; it did not decide those statutes' validity.
