term: Allgemeine Relativitätstheorie
aliases:
- relativistisch
shortDefinition: Einsteins Gravitationstheorie, in der Materie und Energie die Raumzeit krümmen und diese Krümmung die Bewegung
  von Körpern und Licht bestimmt.
longDefinition: Die allgemeine Relativitätstheorie ist Einsteins Theorie der Gravitation. Masse, Energie und Druck formen
  darin die Raumzeit, und Körper sowie Licht bewegen sich durch diese gekrümmte Geometrie. Lösungen für Schwarze Löcher ergeben
  sich aus der Theorie bei hinreichend extremen Gravitationsbedingungen.
