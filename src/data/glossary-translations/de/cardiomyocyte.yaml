shortDefinition: Eine spezialisierte Muskelzelle des Herzens, die die Kraft für den Herzschlag erzeugt.
longDefinition: Kardiomyozyten sind die kontraktilen Muskelzellen, die einen großen Teil des arbeitenden Herzmuskels
  bilden. Beim erwachsenen Menschen werden sie in geringem Umfang ersetzt; diese langsame Erneuerung reicht jedoch
  nicht aus, um nach einem schweren Herzinfarkt große verlorene Muskelbereiche wieder aufzubauen.
