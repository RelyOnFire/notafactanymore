title: Chlorella algolization for water-body rehabilitation
claim: >-
  Introducing selected planktonic Chlorella strains into natural water bodies was treated as a reliable way to suppress
  cyanobacterial blooms and improve water quality through the claimed ecological mechanisms.
currentUnderstanding: >-
  Chlorella has legitimate uses in biotechnology and wastewater research, but evidence does not establish that inoculating
  natural reservoirs with selected Chlorella strains reliably suppresses cyanobacterial blooms or produces the broad
  rehabilitation effects claimed for algolization. Russian state testing in 2007 did not establish efficacy; a 2009 scientific
  council of the Federal Water Resources Agency concluded that the proposed use of Chlorella to suppress blooms was not
  scientifically substantiated or confirmed by practice; and in 2014 the Hydrobiological Society at the Russian Academy of
  Sciences called the so-called algolization method false and damaging to Russian hydrobiology.
category: Environment
reviewedAt: 2026-08-23
impact:
  summary: >-
    The significance of this episode is the institutional contradiction itself. Russian water authorities generated negative
    or inconclusive evidence, a federal scientific council rejected the claimed bloom-suppression method as unsubstantiated,
    and a 2014 congress of the Hydrobiological Society at the Russian Academy of Sciences formally rejected the method. Yet
    algolization later acquired formal status and official technical legitimacy in Russian national standards.
  highlights:
    - value: '2009'
      label: Federal scientific council rejected the claimed bloom-suppression method as scientifically unsubstantiated and unconfirmed in practice
    - value: '2014'
      label: Hydrobiological Society at the Russian Academy of Sciences called the so-called algolization method false and damaging to Russian hydrobiology
    - value: '2022'
      label: Algolization was codified in a Russian national standard
    - value: '2025'
      label: A dedicated national Chlorella-algolization standard entered the standards system
  context:
    - >-
      The sequence matters. The first large Penza Reservoir application in 1998 is described in the later 2025 standard itself
      as ineffective. A Federal Water Resources Agency trial at the Tsimlyansk Reservoir in 2007 produced results too ambiguous
      to establish effectiveness, and in 2009 the agency's scientific-technical council concluded that the proposed use of
      Chlorella against blooms was not scientifically substantiated or confirmed by practice and that further R&D in that
      direction was inadvisable.
    - >-
      The contradiction deepened in 2014. The XI Congress of the Hydrobiological Society at the Russian Academy of Sciences
      adopted a decision calling the so-called algolization method false and damaging to Russian hydrobiology. Later Russian
      water-research work likewise reported that the claimed competitive mechanism was not supported and described the method
      as ineffective and potentially carrying sanitary risks.
    - >-
      The technique nevertheless acquired national-standard status. GOST R 59977-2022 included algolization within a water-body
      rehabilitation standard, and GOST R 71946-2025 created a dedicated standard for applying planktonic Chlorella strains.
      This is formal technical endorsement rather than proof of a universal legal mandate: Article 26 of Federal Law 162-FZ
      provides that documents of Russia's national standardization system are generally applied voluntarily unless legislation
      provides otherwise, with additional binding effects when a producer or performer publicly declares conformity to a
      national standard.
episodes:
  - id: russia-2022-2026
    polity: Russia
    region: Europe and Asia
    startYear: 2022
    endYear: 2026
    endOpen: true
    strength: officially-endorsed
    institutionTypes: [government, professional]
    institutions:
      - Rosstandart (Federal Agency for Technical Regulation and Metrology)
      - Russian Institute for Standardization
      - Technical Committee 409 — Environmental Protection
    institutionalContext: >-
      National technical standardization supplied the institutional endorsement; it did not impose a blanket statutory
      order requiring every Russian water manager to use algolization. Under Article 26 of Federal Law 162-FZ, national standardization documents are generally
      voluntary unless legislation provides otherwise; application also becomes binding for a producer or performer that
      publicly declares conformity to the national standard. GOST R 71946-2025 was developed by the private Innovative
      Environmental Fund (INEKO), submitted through Technical Committee 409, and approved within the Rosstandart standards
      system. The resulting status was official technical endorsement rather than mandatory nationwide deployment.
    consequences:
      - National standards formally codified algolization as a water-body rehabilitation method
      - The standardized method specified Chlorella strains, application quantities, repeated inoculation, and monitoring requirements
      - A dedicated 2025 standard covered drinking-water sources, recreational waters, fisheries waters, and biological-treatment water bodies
    summary: >-
      Russia gave Chlorella-based algolization formal national-standard status in GOST R 59977-2022 and then in the dedicated
      GOST R 71946-2025. The standards specify how the method is to be performed and attribute water-quality benefits to it.
      This formal endorsement came after a 2007 Federal Water Resources Agency trial failed to establish efficacy, after the
      agency's scientific-technical council concluded in 2009 that the bloom-suppression proposal was scientifically
      unsubstantiated and unconfirmed by practice, and after the Hydrobiological Society at the Russian Academy of Sciences
      formally rejected the method in 2014. The 2025 standard remains active in 2026, but Russian national standards are
      generally voluntary unless a separate legal or conformity mechanism makes their application binding.
    sources:
      - title: On the question of algolization of water bodies
