term: Quintessence
aliases:
- quinta essentia
- fifth essence
shortDefinition: Literally the 'fifth essence'; a later term associated with the heavenly fifth element beyond earth,
  water, air, and fire.
longDefinition: Quintessence derives from the Latin quinta essentia, 'fifth essence.' In medieval and early-modern natural
  philosophy it was used for a fifth substance beyond the four terrestrial elements and was often associated with the
  incorruptible celestial aether. The term also developed other meanings in alchemy and medicine, so it is related to
  but not always exactly interchangeable with Aristotle's original aether.
relatedTerms:
- aether
reviewedAt: '2026-08-21'
sources:
- title: Natural Philosophy in the Renaissance
  url: https://plato.stanford.edu/entries/natphil-ren/
  publisher: Stanford Encyclopedia of Philosophy
  note: Provides historical context for Aristotelian celestial matter and its later Renaissance reception.
