term: Refractive index
aliases:
- index of refraction
shortDefinition: A measure of how much light slows down in a material relative to vacuum and therefore how strongly
  its path can bend at a boundary.
longDefinition: The refractive index of a medium is the ratio of the speed of light in vacuum to its speed in that
  medium. Because refractive index can vary with wavelength, different colors can bend by different amounts in a
  prism, producing dispersion.
relatedTerms: []
reviewedAt: '2026-08-21'
