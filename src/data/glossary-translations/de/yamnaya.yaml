term: Jamnaja
aliases:
- Jamnaja-Kultur
- Yamnaya
shortDefinition: Mobile Hirtengemeinschaften der pontisch-kaspischen Steppe, deren Abstammung sich im dritten Jahrtausend
  v. Chr. weit nach Europa ausbreitete.
longDefinition: Jamnaja bezeichnet einen archäologischen Horizont mobiler Hirtengemeinschaften der pontisch-kaspischen
  Steppe im späten vierten und frühen dritten Jahrtausend v. Chr. Alte menschliche DNA zeigt in dieser Zeit eine starke
  Ausbreitung steppenbezogener Abstammung in weite Teile Europas. Archäologisch sind unter anderem charakteristische
  Grabhügel, Viehhaltung und Wagenverkehr belegt.
