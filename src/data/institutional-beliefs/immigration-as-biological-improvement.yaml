    consequences:
      - Racial selection of immigrants
      - Exclusion of Afro-Caribbean migrants
      - Restrictions on Jewish refugees
    summary: Colombia's 1922 immigration law explicitly linked immigration to improving the country's physical and moral “ethnic conditions” and authorized exclusion of people considered undesirable for the nation's racial development. During the 1920s and 1930s, officials applied this eugenic and racial framework to restrict migrants including Afro-Caribbeans and Jewish refugees.
    sources:
      - title: Ley 114 de 1922 — Sobre inmigración y colonias agrícolas
        url: https://www.suin-juriscol.gov.co/viewDocument.asp?ruta=Leyes%2F1644783
        publisher: Government of Colombia — SUIN-Juriscol
        note: The law explicitly directs immigration policy toward improvement of Colombia's physical and moral ethnic conditions and excludes people considered unsuitable for the development of the race.
      - title: El discurso eugenésico y las teorías racistas en las políticas migratorias colombianas — el rechazo de migrantes afroantillanos y judíos (1920–1940)
        url: https://historiayespacio.univalle.edu.co/index.php/historia_y_espacio/article/view/11495
        publisher: Historia y Espacio — Universidad del Valle
        note: Uses diplomatic correspondence and executive decrees to document how eugenic and racist migration policy was applied to Afro-Caribbean migrants and Jewish refugees from 1920 to 1940.
