      Dates the official post-Khrushchev agricultural programme to the March 1965 Central Committee plenum, where speakers
      repudiated Khrushchev's agricultural policies and redirected policy toward reconstruction and modernization.
  - id: virgin-lands-1967-correction
    sourceId: virgin-lands-1967-erosion-resolution
    relation: documents
    target: {scope: episode, episodeId: soviet-union-1954-1964, aspect: institutional-correction}
    note: >-
      Primary joint party-government resolution ordering urgent protection from wind and water erosion through measures
      including soil-protection rotations, strip placement, shelterbelts, non-moldboard tillage and retention of stubble.
  - id: virgin-lands-institute-correction
    sourceId: virgin-lands-grain-institute-erosion
    relation: supports
    target: {scope: episode, episodeId: soviet-union-1954-1964, aspect: institutional-correction}
    note: >-
      Archival historical study connecting campaign-era plowing and loss of surface stubble to erosion in northern
      Kazakhstan and documenting the All-Union Grain Farming Institute's development of new tillage tools and a
      soil-protective farming system during the 1960s and 1970s.
  - id: virgin-lands-sixty-years-correction-context
    sourceId: virgin-lands-sixty-years
    relation: contextualizes
    target: {scope: episode, episodeId: soviet-union-1954-1964, aspect: context}
    note: >-
      Finds that later Soviet policy emphasized intensification, machinery and wind protection but retained the converted
      regions, continued some marginal-land plowing and reached peak former-campaign acreage only in 1975–1980.
