entryId: ionizing-radiation
sourceReviewedAt: '2026-08-21'
term: Ionisierende Strahlung
aliases:
- ionisierend
shortDefinition: Strahlung mit genügend Energie, um Elektronen aus Atomen oder Molekülen zu lösen, Ionen zu erzeugen
  und dadurch biologisches Gewebe schädigen zu können.
longDefinition: Zu ionisierender Strahlung gehören Röntgen- und Gammastrahlung sowie ausreichend energiereiche Teilchen.
  Durch direkte Ionisation oder Sekundärteilchen kann sie chemische Bindungen verändern und DNA schädigen. Das biologische
  Risiko hängt unter anderem von Strahlungsart, Dosis, Dosisleistung, bestrahltem Gewebe und Alter ab.
