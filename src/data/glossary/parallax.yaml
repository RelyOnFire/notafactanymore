term: Parallax
aliases:
- parallax measurement
- parallactic shift
shortDefinition: The apparent shift in an object's position against a more distant background when viewed from different
  locations.
longDefinition: Parallax is a geometric effect caused by changing the observer's viewpoint. Nearby objects appear to
  shift more against distant background objects than faraway ones do. Astronomers can therefore use parallax to estimate
  distance. Tycho Brahe's failure to detect the large parallax expected for a nearby atmospheric comet helped place the
  Great Comet of 1577 beyond the Moon.
