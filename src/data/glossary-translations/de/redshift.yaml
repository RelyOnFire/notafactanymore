term: Rotverschiebung
aliases:
- Rotverschiebungen
- kosmologische Rotverschiebung
shortDefinition: Eine Verschiebung beobachteten Lichts zu längeren Wellenlängen; bei fernen Galaxien entsteht die kosmologische
  Rotverschiebung hauptsächlich durch die Expansion des Raums während der Lichtreise.
longDefinition: Rotverschiebung bezeichnet eine Zunahme der beobachteten Wellenlänge von Licht. Sie kann durch verschiedene
  Effekte entstehen, darunter Relativbewegung, Gravitation und kosmische Expansion. Bei fernen Galaxien und Wirtsgalaxien
  von Gammastrahlenausbrüchen liefert die kosmologische Rotverschiebung eine wichtige Entfernungs- und Expansionsinformation.
