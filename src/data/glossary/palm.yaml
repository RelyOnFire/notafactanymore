term: PALM
aliases:
- photoactivated localization microscopy
shortDefinition: A super-resolution method that localizes sparse subsets of photoactivatable fluorescent molecules and
  combines many cycles into a fine image.
longDefinition: Photoactivated localization microscopy, or PALM, activates only a sparse subset of fluorescent labels
  at a time so that their diffraction-blurred spots do not strongly overlap. Each molecule's position can then be estimated
  with high precision. Repeating the cycle and combining thousands of localizations reconstructs a super-resolved image.
relatedTerms:
