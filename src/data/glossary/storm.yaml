term: STORM
aliases:
- stochastic optical reconstruction microscopy
shortDefinition: A single-molecule super-resolution method that reconstructs an image from many precisely localized fluorescent
  emitters switched on in sparse subsets.
longDefinition: Stochastic optical reconstruction microscopy, or STORM, separates nearby fluorescent emitters in time
  by switching only sparse subsets into an emitting state. Each isolated spot can be localized much more precisely than
  its diffraction-blurred width. Accumulating many localization events produces a high-resolution reconstruction.
relatedTerms:
