title: Malaria fever therapy for non-syphilitic psychiatric disease
claim: Deliberately infecting psychiatric patients with malaria and provoking repeated high fevers was treated as
  a therapeutic method for schizophrenia, intellectual disability, affective disorders, psychopathic disorders,
  and other conditions without neurosyphilis.
currentUnderstanding: Malaria fever therapy had a distinct historical rationale in neurosyphilis, where high fever
  could impair Treponema pallidum before effective antibiotics were available. That rationale did not establish
  malaria as a treatment for schizophrenia or other non-syphilitic psychiatric conditions. Historical outcomes for
  those extensions were mixed and poorly justified, and modern evidence does not support intentionally inducing
  Plasmodium vivax infection as a psychiatric treatment. Malaria itself is an acute infectious disease that can
  produce severe complications. The correction therefore concerns the extension of malariotherapy beyond neurosyphilis,
  not its historically different use against neurosyphilitic disease.
category: Medicine and public health
reviewedAt: '2026-08-24'
impact:
  summary: Vienna's university psychiatric clinic maintained a transmissible Plasmodium vivax strain and deliberately
    infected psychiatric patients well into the 1960s. Most malaria-therapy cases in the clinic's five focal diagnostic
    groups were not neurosyphilis. Patients with schizophrenia and other diagnoses were used in a practice that
    contemporary publications scarcely justified, even after neuroleptics and antidepressants provided noninfectious
    alternatives.
  highlights:
  - value: 609 / 772
    label: malaria-therapy cases in Vienna's five focal diagnostic groups were for diagnoses other than neurosyphilis
  - value: '158'
    label: schizophrenia patients were identified as deliberately infected with P. vivax in the 1951–1969 archive
  - value: '1968'
    label: last recorded malaria-fever treatment at the Vienna psychiatric clinic
  context:
  - This card deliberately excludes the classic indication of general paresis/neurosyphilis. Before penicillin,
    malaria-induced fever had a biologically plausible and historically meaningful antisyphilitic role, even though
    it was hazardous. Treating that use as equivalent to malaria therapy for schizophrenia would erase an important
    distinction.
  - The archival evidence does not prove that every non-neurosyphilitic patient lacked a sincerely intended therapeutic
    indication. It does show that the clinic extended malaria therapy across diagnoses despite little detailed contemporary
    justification and sometimes used patients as carriers to preserve the malaria strain.
