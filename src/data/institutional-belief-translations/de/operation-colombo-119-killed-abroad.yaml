schemaVersion: 2
locale: de
entryId: operation-colombo-119-killed-abroad
sourceReviewedAt: '2026-08-25'
title: Chiles 119 verschwundene Gefangene als im Ausland Getötete
proposition:
  summary: >-
    Chiles Geheimdienst DINA und das Informationsnetz der Diktatur verbreiteten die Behauptung, 119 nach ihrer Festnahme
    in Chile vermisste Menschen hätten das Land tatsächlich verlassen und seien im Ausland bei internen Säuberungen der Linken
    oder in Auseinandersetzungen ums Leben gekommen – statt durch chilenische Staatsorgane gewaltsam verschwunden zu sein.
correction:
  summary: >-
    Die Operación Colombo war eine von der DINA organisierte internationale Desinformationsaktion zur Verschleierung
    gewaltsamen Verschwindenlassens. Die 119 genannten Personen waren in Chile festgenommen worden. Die chilenische Nationale
    Wahrheits- und Versöhnungskommission kam zu dem Ergebnis, dass sie Opfer staatlicher Repression waren und nicht ins Ausland
    geflohen waren, um sich dort gegenseitig zu töten. Spätere Strafverfahren und chilenische Justizinstitutionen behandelten
    die Colombo-Erzählung wiederholt als Kommunikationsfabrikation zur Verschleierung von DINA-Verbrechen.
impact:
  summary: >-
    Die Operación Colombo erfand unter starkem internationalen Druck wegen Menschenrechtsverletzungen ein alternatives
    Schicksal für eine große Gruppe verschwundener Gefangener. Die DINA ließ zwei ausländische Publikationen die angeblichen
    Todesfälle einer Liste mit 119 Namen melden; chilenische Zeitungen verstärkten die Behauptungen und stellten die Verschwundenen
    als Militante dar, die von der eigenen Seite oder in ausländischen Kämpfen getötet worden seien. Die demokratische Wahrheitsaufarbeitung
    verwarf diese Darstellung 1991 förmlich.
  highlights:
    - value: '119'
      label: verschwundene Chileninnen und Chilenen auf den erfundenen Todeslisten
    - value: '2'
      label: für die Todeslisten geschaffene oder reaktivierte ausländische Publikationen
    - value: '1991'
      label: Jahr der förmlichen Zurückweisung durch Chiles Wahrheitskommission
  context:
    - Die stabile falsche Aussage lautete, die vermissten Gefangenen hätten Chile verlassen und seien im Ausland durch innerlinke Gewalt oder fremde Auseinandersetzungen ums Leben gekommen.
    - Chilenische Zeitungen waren wichtige Verstärker. Der zentrale institutionelle Träger war jedoch der Sicherheits- und Informationsapparat der Diktatur, insbesondere die DINA.
    - Die Wahrheits- und Versöhnungskommission verwarf die erfundene Darstellung 1991 förmlich. Strafrechtliche Ermittlungen und Verurteilungen liefen noch Jahrzehnte weiter.
episodes:
  - id: chile-1975-1991
    polity: Chile
    institutions:
      - Dirección de Inteligencia Nacional (DINA)
      - Informationsapparat der chilenischen Militärdiktatur
    institutionalContext: >-
      1975 versuchte die DINA, wachsende Belege für gewaltsames Verschwindenlassen mit einer Gegenerzählung zu beantworten.
      Im Juli erschienen Listen mit 119 Namen über die argentinische Zeitschrift Lea und die brasilianische Zeitung O Dia/Novo O Dia.
      Regimenahe chilenische Medien übernahmen die angeblichen Auslandstode. Nach dem Übergang zur Demokratie stellte die
      Nationale Wahrheits- und Versöhnungskommission fest, dass die Personen auf den Listen Opfer chilenischer Staatsrepression
      waren, und ordnete die Operación Colombo als Desinformationsmanöver der DINA ein.
    consequences:
      - Verschleierung des gewaltsamen Verschwindenlassens durch chilenische Sicherheitsorgane
      - Falsche Zuschreibung der Todesfälle zu interner MIR-Gewalt oder Auseinandersetzungen im Ausland
      - Diskreditierung von Angehörigen und Menschenrechtsorganisationen
      - Internationale und chilenische Medienverstärkung erfundener Angaben über das Schicksal der Opfer
      - Zusätzliche Ungewissheit und Belastung für Familien
      - Jahrzehntelange Strafverfahren nach dem Zusammenbruch der amtlichen Geschichte
    summary: >-
      Die Operación Colombo ging über die bloße Leugnung einzelner Festnahmen hinaus. Sie erfand für 119 verschwundene
      Menschen eine koordinierte internationale Erklärung: Die Vermissten seien ins Ausland geflohen und dort durch innerlinke
      Gewalt ums Leben gekommen. Die demokratische Wahrheitskommission stellte später fest, dass die 119 Opfer staatlicher Repression in Chile waren.
    mechanism:
      summary: >-
        Die DINA platzierte die Todeserzählung mit 119 Namen über ausländische Publikationen und den Informationsapparat
        der Diktatur; regimenahe chilenische Medien verstärkten sie anschließend als amtliche Erklärung für verschwundene Gefangene.
    institutionalCorrection:
      periodLabel: '1991'
      action: Chiles Nationale Wahrheits- und Versöhnungskommission verwarf die Auslandstod-Erzählung formell und erkannte die 119 als Opfer staatlicher Repression an.
      summary: >-
        Die demokratische Wahrheitskommission demontierte die Darstellung der Diktatur, indem sie die Operación Colombo
        als DINA-Desinformationsmanöver einordnete und die aufgeführten Gefangenen als Opfer chilenischer Staatsrepression anerkannte.
evidence:
  - id: colombo-mmdh-proposition
    note: >-
      Institutioneller historischer Überblick, der die Operación Colombo als von der DINA geführte Medienfabrikation der
      Diktatur beschreibt, einschließlich eigens geschaffener ausländischer Publikationen, der 119 Gefangenen, der Verstärkung
      durch die chilenische Presse und der Zurückweisung durch die Wahrheits- und Versöhnungskommission.
  - id: colombo-bcn-correction
    note: >-
      Amtlicher Parlamentsnachweis unter Bezug auf den Rettig-Bericht; beschreibt die DINA-Operation als fabrizierte Darstellung,
      wonach 119 in Chile festgenommene Menschen im Ausland bei Zusammenstößen oder durch eigene politische Genossen getötet worden seien.
  - id: colombo-mmdh-impact
  - id: colombo-mmdh-carrier
  - id: colombo-judiciary-mechanism
    note: >-
      Historisches Programm der chilenischen Justiz, das die Operation als von der DINA ausgeführte Kommunikationsfabrikation
      zur Verschleierung gewaltsamer Festnahmen beschreibt; die Presse meldete fälschlich, die politischen Gefangenen seien im Untergrund und hätten einander getötet.
  - id: colombo-judiciary-consequences
  - id: colombo-bcn-institutional-correction
