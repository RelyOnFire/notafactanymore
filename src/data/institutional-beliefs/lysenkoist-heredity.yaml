schemaVersion: 2
title: Lysenkoist heredity
proposition:
  summary: >-
    Environmental treatment can reliably reshape heredity across generations, making Mendelian genetics unnecessary or false.
correction:
  summary: >-
    Heredity is transmitted primarily through genetic information. Environmental effects can influence development and
    sometimes persist across generations, but they do not support the broad Lysenkoist claim that directed environmental
    treatment routinely rewrites inherited traits.
category: Genetics
entryId: acquired-traits-drive-evolution
reviewedAt: '2026-08-23'
impact:
  summary: >-
    Lysenkoism's best-supported direct consequences were institutional: genetics was suppressed, scientists were dismissed
    or demoted, teaching and research were reorganized around a politically protected doctrine, and agricultural science
    lost decades of normal scientific correction. In China, Lysenko-influenced agronomic ideas also entered the Great Leap
    Forward, but the famine that followed was produced by several interacting policies and failures rather than by
    Lysenkoism alone.
  highlights:
    - value: '127'
      label: University teachers dismissed in autumn 1948 in one historical accounting
      note: The same historical review reports that 66 of the 127 were professors; subsequent dismissals, demotions and removals from leadership were much broader.
    - value: Several thousand
      label: Scientists and teachers described as dismissed, demoted or removed from leadership after the 1948 Soviet campaign
      note: This is an institutional-repression estimate reported in the historical literature, not a death toll.
    - value: 15–30 million
      label: Estimated excess deaths in China's 1959–1961 Great Leap Forward famine
      note: Overall famine mortality, not deaths attributable specifically to Lysenkoism. Production losses, procurement, exports, collectivization and other political-economic mechanisms interacted.
  context:
    - >-
      In the Soviet Union, the turning point was the 1948 VASKhNIL session, organized under Lysenko and approved by Stalin.
      The session did more than endorse a theory: it ended open institutional competition with Mendelian genetics. An
      August 1948 Ministry of Higher Education order directed universities to revise biological teaching and staffing
      around Michurinist biology. Geneticists lost posts, departments were reorganized, textbooks and research materials
      were withdrawn, and the normal mechanisms by which a scientific claim could be challenged were deliberately weakened.
    - >-
      An earlier phase overlaps chronologically with the Holodomor. Soviet authorities ordered immediate implementation
      of Lysenko's vernalization program in 1931 and the treated acreage expanded rapidly, so his agricultural methods were
      already being promoted when the 1932–1933 Ukrainian famine occurred. But the evidence does not support presenting
      Lysenkoism as an important established cause of the Holodomor. Historical work instead places collectivization and
      grain seizure or procurement at the center, while recent quantitative work finds that migration restrictions and
      anti-Ukrainian bias in Soviet procurement and grain-retention policy contributed to mortality. The famine also
      strengthened rather than discredited Lysenko: afterward, the People's Commissar for Agriculture instructed Vavilov
      to assist his work.
    - >-
      China imported Lysenkoist biology after 1949, and Great Leap Forward agriculture later included ideas associated
      with that intellectual lineage, most visibly extreme close planting and deep plowing. Those practices could damage
      yields, but they were only one part of the disaster. Communalization altered incentives and household food access;
      large numbers of workers were diverted from farming; officials under political pressure reported inflated harvests;
      procurement targets were then imposed on a shrinking and badly measured crop; grain exports and increasingly rigid
      procurement reduced what remained for rural consumption; and political repression made reporting failure dangerous.
    - >-
      That distinction matters for attribution. Economic studies find that falling agricultural production, higher and
      more inflexible procurement, and grain exports all raised excess mortality, with no single mechanism accounting for
      the whole famine. The often-cited 15–30 million figure therefore describes the scale of the 1959–1961 famine as a
      whole. It is useful context for understanding the stakes of failed agricultural doctrine, but it is not a defensible
      count of people killed specifically by Lysenkoism.
episodes:
  - id: ussr-1948-1964
    polity: Soviet Union
    region: Eurasia
    startYear: 1948
    endYear: 1964
    strength: enforced-doctrine
    institutionTypes:
      - government
      - academy
      - education
    institutions:
      - Lenin All-Union Academy of Agricultural Sciences (VASKhNIL)
      - USSR Ministry of Higher Education
      - USSR Academy of Sciences
      - Moscow State University
      - Leningrad State University
    institutionalContext: >-
      The 1948 VASKhNIL session and subsequent Ministry of Higher Education order converted Lysenko's position into an
      administrative scientific orthodoxy: university staffing, curricula, departments, textbooks and research were
      reorganized around Michurinist biology while Mendelian genetics was suppressed.
    consequences:
      - Geneticists were dismissed, demoted, or removed from scientific leadership
      - Genetics laboratories and departments were closed or reorganized
      - Mendelian genetics was removed from teaching and textbooks
      - Agricultural and biological research lost normal mechanisms of scientific correction
    summary: >-
      After the 1948 VASKhNIL session, Lysenko's anti-Mendelian biology received state backing while orthodox geneticists
      were dismissed, laboratories were closed, and genetics teaching and research were restricted. The national
      prohibition unraveled only after Khrushchev's removal in 1964.
    mechanism:
      kind: suppression
      summary: >-
        State-backed academy and education authorities imposed Michurinist biology through staffing, curriculum and
        research controls while suppressing Mendelian genetics and scientists who defended it.
    institutionalCorrection:
      status: corrected
      periodLabel: 1964 onward
      action: Soviet scientific institutions restored genetics after Khrushchev's removal and dismantled Lysenko's protected institutional monopoly.
      summary: >-
        The post-Khrushchev scientific system reversed the administrative suppression of genetics and restored the field
        to research and teaching, ending Lysenkoism's status as a protected national orthodoxy.
  - id: china-1949-1956
    polity: People's Republic of China
    region: East Asia
    startYear: 1949
    endYear: 1956
    strength: officially-endorsed
    institutionTypes:
      - government
      - academy
      - university
    institutions:
      - Chinese Academy of Sciences
      - Ministry of Higher Education of the People’s Republic of China
    consequences:
      - Classical genetics was displaced in research and higher education
      - Scientific careers and curricula were shaped by political orthodoxy
      - Lysenko-influenced agronomic ideas later entered Great Leap Forward agricultural campaigns
    summary: >-
      In the early People's Republic, Soviet scientific organization was copied and classical genetics was displaced by
      Lysenkoist biology. The 1956 Qingdao genetics meeting marked official rehabilitation of Mendelian genetics, although
      political pressure on scientists did not disappear.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Academy and higher-education institutions copied the Soviet scientific model and displaced classical genetics in
        research and university teaching in favor of Lysenkoist biology.
    institutionalCorrection:
      status: corrected
      periodLabel: '1956'
      action: The Qingdao genetics meeting marked the official rehabilitation of Mendelian genetics in China.
      summary: >-
        Chinese scientific institutions formally reopened space for Mendelian genetics in 1956, reversing the earlier
        official displacement of classical genetics even though broader political pressures on researchers persisted.
  - id: poland-1949-1956
    polity: Poland
    region: Eastern Europe
    startYear: 1949
    endYear: 1956
    strength: enforced-doctrine
    institutionTypes:
      - government
      - academy
      - university
      - education
    institutions:
      - Koło Przyrodników Marksistów (Association of Marxist Naturalists)
      - Polska Akademia Nauk (from 1952)
    consequences:
      - Removal of genetics from teaching
      - Suppression of competing biological research
      - Political pressure on scientists
      - Attempts to reshape agricultural science
    summary: >-
      A Warsaw conference in March 1949 proclaimed the Lysenkoist “New Biology” an official paradigm in Polish science.
      Genetics and criticism of the doctrine were actively confronted, genetics courses disappeared from universities,
      school curricula were rewritten, and scientists who used politically unacceptable concepts could be silenced or
      publicly stigmatized. The system unraveled with the political thaw of 1956.
    mechanism:
      kind: education
      summary: >-
        Scientific and educational institutions made the “New Biology” an official paradigm, rewrote curricula and
        marginalized or suppressed genetics and researchers who used politically unacceptable concepts.
    institutionalCorrection:
      status: undocumented
      summary: >-
        The existing v1 evidence shows the official system unraveling during the 1956 political thaw and Lysenkoism
        disappearing from official mass discourse, but it does not identify a dated Polish institutional act explicitly
        repudiating the doctrine.
