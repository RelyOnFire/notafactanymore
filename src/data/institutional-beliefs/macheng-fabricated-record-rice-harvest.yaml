schemaVersion: 2
title: "Macheng's fabricated record rice harvest (1958)"
proposition:
  summary: >-
    In August 1958, a rice field at the Jianguo agricultural cooperative in Macheng, Hubei, genuinely
    produced 36,956 jin (about 18.5 metric tonnes) of dry rice per mu (about 667 square metres).
    Provincial, prefectural and county inspectors verified the record, which was hailed as an
    extraordinary production breakthrough.
correction:
  summary: >-
    The reported yield was not rice grown on that single field. A later investigation published by the
    Hubei Provincial CPPCC recounts how mature rice from seven or eight mu was brought into a 1.016-mu
    plot, additional grain was added and baskets were counted more than once. This produced an inflated
    figure accepted and publicized as an authentic harvest.
category: "Agriculture"
reviewedAt: "2026-11-13"
impact:
  summary: >-
    Official inspections, a front-page Xinhua report and an approving People's Daily editorial made the
    false record a celebrated model. Local retrospective accounts describe official rewards, pressure on
    skeptics and excessive grain deliveries assessed against exaggerated production, followed by severe
    food shortages. At national scale, inflated harvest reports and inflexible procurement contributed to
    the Great Chinese Famine; no defensible national death toll or precise local mortality contribution
    can be assigned to this one claim.
  highlights:
    -
      value: "36,956 jin/mu"
      label: "claimed dry-rice yield on the 13 August 1958 People's Daily front page"
    -
      value: "1.016 mu"
      label: "area of the purported record field, approximately 677 square metres"
    -
      value: "7–8 mu"
      label: "area from which mature rice was reportedly moved into the display field"
  context:
    - >-
      The original 1958 claim was an asserted measured yield, not merely an optimistic production target.
      The paper specifically cited a three-level official inspection and published an editorial celebrating
      it.
    - >-
      The 2014 Hubei CPPCC publication is a later historical investigation reproduced from Hubei Historical
      Materials, not a contemporaneous laboratory measurement. The precise method of falsification is
      attributed to that investigation and separately contextualized by other Chinese scholars and
      eyewitness reporting.
    - >-
      Jianguo was an agricultural cooperative in August 1958; descriptions that call it a fully formed
      people's commune at that date are anachronistic. Here, jin is the Chinese unit of 500 grams and mu is
      about 667 square metres.
    - >-
      Neither the 1958 field report nor its later correction supplies a reliable estimate of deaths caused
      by this particular false report. The nationwide famine resulted from interacting production failures,
      procurement policies, political decisions and environmental conditions.
episodes:
  -
    id: "china-macheng-1958-1960"
    polity: "People's Republic of China"
    region: "East Asia"
    startYear: 1958
    endYear: 1960
    periodLabel: "August 1958–1960"
    strength: "officially-endorsed"
    institutionTypes:
      - "government"
    institutions:
      - "Hubei provincial, Huanggang prefectural and Macheng county harvest-inspection authorities"
      - "Macheng County and Huanggang Prefecture Party committees"
      - "Xinhua News Agency"
      - "People's Daily"
    institutionalContext: >-
      In August 1958 the Jianguo agricultural cooperative reported an extraordinary early-rice harvest. The
      original Xinhua account named provincial, prefectural and county officials and agricultural
      specialists as inspectors. The Party's national newspaper printed the claim on its front page and
      praised it in an editorial; provincial leaders later treated the field as a model. This is a
      documented officially endorsed agricultural claim, not an assertion that every participant knew the
      claim was false.
    consequences:
      - >-
        A fabricated harvest figure was presented as a verified production record in national Party and state
        news.
      - >-
        Officials praised and rewarded the cooperative; its supposed methods were displayed to visiting
        groups.
      - "Retrospective local sources describe inflated grain-delivery obligations and worsening food shortages."
      - "Local officials and residents faced pressures to repeat or avoid challenging production claims."
      - >-
        One part of a broader nationwide system of exaggerated reporting that interacted with compulsory
        procurement; no specific famine-death total is attributed to this field.
    summary: >-
      During the Great Leap Forward, officials at several levels appeared to certify an extraordinary rice
      harvest at the Jianguo cooperative. Xinhua and People's Daily circulated the result as a verified
      production record and celebrated its alleged agronomic lessons. A later investigation published by the
      Hubei CPPCC concluded that plants and grain from other fields were used and that counting was
      manipulated. Retrospective local reports describe official incentives and grain procurement
      consequences.
    mechanism:
      kind: "endorsement"
      summary: >-
        A local demonstration plot, inspection by officials and agricultural experts, awards and nationwide
        newspaper coverage converted an artificially assembled crop into an authoritative 'record' that
        influenced local expectations and grain deliveries.
    institutionalCorrection:
      status: "partial"
      periodLabel: "2006–2014 retrospective acknowledgments"
      action: >-
        Chinese historical accounts, including a Central Party School historian's analysis and a Hubei CPPCC
        publication, identified the supposed record as fabricated.
      summary: >-
        The record was subsequently identified as fabricated in Chinese historical and institutional
        publications. The Hubei CPPCC's published retrospective describes the mechanics of the fraud and its
        local costs. The sources reviewed do not establish that the original 1958 People's Daily report
        received a formal contemporaneous retraction, or that the resulting harms were fully remedied.
