locale: de
entryId: molotov-ribbentrop-secret-protocol-denial
sourceReviewedAt: '2026-08-25'
title: Das geheime Zusatzprotokoll zum Molotow-Ribbentrop-Pakt als westliche Fälschung
claim: >-
  Sowjetische Institutionen hielten nach dem Krieg an einer offiziellen Geschichtsdarstellung fest, in der die im Westen
  veröffentlichten Belege für ein geheimes Zusatzprotokoll zum deutsch-sowjetischen Nichtangriffspakt von 1939 als
  gefälscht oder nicht authentisch behandelt wurden. Damit wurde ein tatsächlich bestehendes Abkommen bestritten, das
  Osteuropa in deutsche und sowjetische Interessensphären aufteilte.
currentUnderstanding: >-
  Die Sowjetunion und NS-Deutschland unterzeichneten am 23. August 1939 neben dem öffentlichen Nichtangriffsvertrag ein
  geheimes Zusatzprotokoll. Darin wurden Gebiete vom Baltikum bis zum Schwarzen Meer deutschen und sowjetischen
  Interessensphären zugeordnet. Am 24. Dezember 1989 bestätigte der Kongress der Volksdeputierten der UdSSR förmlich,
  dass das Protokoll unterzeichnet worden war und existierte, verurteilte die geheimen Absprachen und erklärte sie vom
  Zeitpunkt ihrer Unterzeichnung an für rechtlich unwirksam. Das sowjetische Original wurde später im Archivbestand
  aufgefunden und befindet sich heute im Archiv für Außenpolitik der Russischen Föderation.
impact:
  summary: >-
    Das geheime Protokoll wurde bereits beim Abschluss des Pakts verschwiegen. Nachdem deutsche Diplomatenakten im Westen
    veröffentlicht worden waren, entstand daraus eine langjährige sowjetische staatliche Gegendarstellung. 1948
    beantwortete das Sowjetische Informationsbüro die US-Dokumentensammlung „Nazi-Soviet Relations“ mit den
    „Geschichtsfälschern“ und stellte die Veröffentlichung als Fälschungskampagne dar, während es den Pakt von 1939 und
    die folgenden sowjetischen Schritte defensiv deutete. Das Protokoll selbst blieb außerhalb der autorisierten
    Darstellung. Unter Glasnost brach diese Linie auf: Im August 1988 erklärte APN-Vorsitzender Walentin Falin öffentlich,
    es gebe keinen Grund, die geheimen Protokolle für Fälschungen zu halten. Im Dezember 1989 erkannte der Kongress der
    Volksdeputierten ihre Existenz förmlich an und verurteilte ihre Unterzeichnung.
  highlights:
  - value: 41 Jahre
    label: von der sowjetischen staatlichen Gegenschrift 1948 bis zur förmlichen Anerkennung des geheimen Protokolls 1989
  - value: 23. August 1939
    label: Unterzeichnung des geheimen Zusatzprotokolls zusammen mit dem öffentlichen Nichtangriffsvertrag
  - value: 24. Dezember 1989
    label: förmliche Bestätigung und Verurteilung des geheimen Protokolls durch den Kongress der Volksdeputierten der UdSSR
  context:
  - >-
    Die Schrift „Geschichtsfälscher“ des Sowjetischen Informationsbüros von 1948 ist ein wichtiger Beleg für die
    institutionelle Gegendarstellung, weil sie ausdrücklich als Antwort auf die westliche Veröffentlichung erbeuteter
    deutscher Diplomatenakten erschien. Das geheime Zusatzprotokoll wird darin jedoch nicht ausdrücklich beim Namen
    behandelt. Die Karte legt der Broschüre deshalb keinen wörtlichen Satz in den Mund, wonach das Protokoll nicht existiere.
  - >-
    Die offizielle sowjetische Linie begann sich bereits vor dem Beschluss vom Dezember 1989 zu verändern. Am
    16. August 1988 erklärte APN-Vorsitzender Walentin Falin, trotz der damals öffentlich nicht verfügbaren Originale
    gebe es keinen Grund, die geheimen Protokolle für eine Fälschung zu halten. Russische Archivhistoriker bezeichnen
    dies als ernsthaften Wandel der offiziellen sowjetischen Position.
  - >-
    Der Kongress stellte 1989 fest, dass die Originale damals weder in sowjetischen noch in ausländischen Archiven
    gefunden worden seien, und stützte sich auf Untersuchungen von Kopien, Karten, weiteren Dokumenten und den Abgleich
    mit späteren Ereignissen. Das sowjetische Original wurde erst später aufgefunden. Die russische Präsidentenbibliothek
    weist es heute als Originalbestand des Archivs für Außenpolitik der Russischen Föderation aus.
episodes:
- id: soviet-union-1948-1989
  polity: Sowjetunion
  institutions:
  - Sowjetisches Informationsbüro
  - Kommunistische Partei der Sowjetunion
  institutionalContext: >-
    Im Januar 1948 veröffentlichte das US-Außenministerium unter dem Titel „Nazi-Soviet Relations“ erbeutete deutsche
    Diplomatenakten, darunter Belege für geheime deutsch-sowjetische Absprachen. Das Sowjetische Informationsbüro
    antwortete als amtliches Informationsorgan mit „Geschichtsfälscher“ und bezeichnete die westliche
    Dokumentenveröffentlichung als Fälschungskampagne, während es die sowjetische Politik von 1939 defensiv darstellte.
    In den folgenden Jahrzehnten wurde ein authentisches geheimes Protokoll zur Abgrenzung von Interessensphären in der
    öffentlichen sowjetischen Geschichtsdarstellung bestritten oder ausgeblendet. Unter Glasnost wurde diese Position
    unhaltbar. Im August 1988 durchbrach Falin auf einer APN-Pressekonferenz öffentlich die bisherige Linie; am
    24. Dezember 1989 bestätigte der Kongress der Volksdeputierten förmlich, dass das geheime Zusatzprotokoll
    unterzeichnet worden war und existierte.
  consequences:
  - Jahrzehntelange staatliche Geschichtsdarstellung ohne ein authentisches geheimes Abkommen als Bestandteil der Diplomatie von 1939
  - Fortgesetzte archivische Geheimhaltung des sowjetischen Dokumentenbestands zum Protokoll
  - Verzerrung der öffentlich autorisierten Erklärung sowjetischer Politik gegenüber Polen, den baltischen Staaten, Finnland und Bessarabien
  - Große spät-sowjetische Geschichtskontroverse, die sich mit der politischen Mobilisierung in den baltischen Republiken verband
  - Förmliche Feststellung des Kongresses 1989, dass die geheimen Absprachen der Souveränität und Unabhängigkeit dritter Staaten widersprachen
  summary: >-
    Die sowjetische Reaktion auf die westliche Veröffentlichung deutscher Diplomatenakten verteidigte nicht nur die
    Zweckmäßigkeit des Nichtangriffspakts von 1939. Sie trug zu einer offiziellen Geschichtsdarstellung bei, in der das
    geheime Protokoll zur Aufteilung von Interessensphären bestritten oder als westliche Fälschung behandelt wurde.
    Unter Glasnost wurde die Dokumentenfrage politisch brisant. 1988 erklärte APN-Vorsitzender Walentin Falin erstmals
    öffentlich, es gebe keinen Grund, die Protokolle für gefälscht zu halten. Im Dezember 1989 vollzog der Kongress der
    Volksdeputierten die formelle Kehrtwende, bestätigte die Existenz des Protokolls, verurteilte seine Unterzeichnung
    und erklärte die geheimen Absprachen rückwirkend für rechtlich unwirksam.
