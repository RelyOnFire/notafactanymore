  - id: sparrow-nber-mechanism
    sourceId: sparrow-nber-2025
    relation: contextualizes
    target: {scope: episode, episodeId: china-1955-1960, aspect: mechanism}
    locator: pp. 7–10; pp. 17–19
    note: >-
      Synthesizes evidence on local special teams, mass mobilization, nest and egg destruction, shooting and noise used to
      exhaust birds, while explicitly warning that bureaucratic incentives could inflate reported kill totals.
  - id: sparrow-outline-context
    sourceId: sparrow-outline-1957
    relation: contextualizes
    target: {scope: episode, episodeId: china-1955-1960, aspect: context}
    locator: Article 27, final sentence
    note: >-
      Shows that the central text had already recognized a spatial distinction in 1957: crop protection was the stated
      object, and sparrows in cities and forests could be spared. The 1958 urban drives exceeded that qualification.
  - id: sparrow-cornell-context
    sourceId: sparrow-cornell-diet
    relation: contextualizes
    target: {scope: episode, episodeId: china-1955-1960, aspect: context}
    locator: “Food” section
    note: >-
      Supplies modern species-level context for why neither “pure grain thief” nor “pure insect predator” is adequate:
      Eurasian tree sparrows consume both crops and invertebrates, with marked seasonal and reproductive variation.
  - id: sparrow-biodiversity-consequences
    sourceId: sparrow-biodiversity-review
    relation: supports
    target: {scope: episode, episodeId: china-1955-1960, aspect: consequences}
    locator: >-
      section “Unintended Consequences of Centralized Conservation Planning,” subsection “Internal Risks,” first two
      paragraphs and Fig. 2
    note: >-
      Connects the centralized campaign and participation by officials, police, soldiers and the public with severe bird
      depletion and loss of insect control.
  - id: sparrow-guangzhou-consequences
    sourceId: sparrow-guangzhou-history
    relation: supports
    target: {scope: episode, episodeId: china-1955-1960, aspect: consequences}
    locator: abstract; PMID 31137157
    note: >-
      Uses Guangzhou newspaper coverage to distinguish the broader campaign's sanitation benefits from ecological and
      harvest damage caused by radical excesses including sparrow eradication.
  - id: sparrow-policy-consequences
    sourceId: sparrow-policy-science-2
    relation: contextualizes
    target: {scope: episode, episodeId: china-1955-1960, aspect: consequences}
    locator: section III, opening three paragraphs
    note: >-
      Records widespread insect outbreaks and poor harvests in 1959, scientists' concern about a link to sparrow removal,
      and Zheng Zuoxin's warning that weather and other causes prevented a single-factor explanation.
  - id: sparrow-nber-consequences
    sourceId: sparrow-nber-2025
    relation: supports
    target: {scope: episode, episodeId: china-1955-1960, aspect: consequences}
    locator: abstract; pp. 27–40 and 45–49
    note: >-
      Provides a modern quantitative estimate of the campaign's contribution to crop decline and mortality while
      analyzing procurement as an amplifying institution. The findings are working-paper estimates, not proof that the
      sparrow campaign alone caused the famine.
  - id: sparrow-policy-correction-process
    sourceId: sparrow-policy-science-2
    relation: documents
    target: {scope: episode, episodeId: china-1955-1960, aspect: institutional-correction}
    locator: section III, paragraphs on 27–29 November 1959, 15–16 March 1960 and 6–10 April 1960
    note: >-
      Reconstructs the Academy report and meetings, Mao's circulation of the evidence, the mid-March central stop order,
      Tan Zhenlin's 6 April report and the National People's Congress vote on 10 April.
  - id: sparrow-npc-correction
    sourceId: sparrow-npc-gazette-1960
    relation: documents
    target: {scope: episode, episodeId: china-1955-1960, aspect: institutional-correction}
    locator: PDF pp. 53–54 and 72 (gazette pp. 75–76 and 94)
    note: >-
      The official gazette records Tan Zhenlin's instruction that sparrows no longer be killed and reproduces enacted
      Article 27 naming rats, bedbugs, flies and mosquitoes, with sparrows absent.
  - id: sparrow-forestry-date-dispute
    sourceId: sparrow-1958-directive
    relation: disputes
    target: {scope: episode, episodeId: china-1955-1960, aspect: institutional-correction}
    locator: single substantive paragraph, final sentence
    note: >-
      This short retrospective dates removal of sparrows to June 1959. It gives no underlying act, and its date conflicts
      with the detailed Academy chronology, the March 1960 central directive and the enacted 10 April 1960 outline.
