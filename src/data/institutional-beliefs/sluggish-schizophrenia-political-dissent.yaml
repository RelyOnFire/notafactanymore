      Reviews systematic Soviet political abuse of psychiatry, explains the Moscow School and Snezhnevsky's
      broad concept of sluggish schizophrenia, and describes “reform delusions,” “struggle for the truth,” and “perseverance”
      as symptoms that could be used against dissenters; it also discusses KGB involvement while distinguishing
      deliberate abuse from psychiatrists who accepted the diagnostic framework.
