schemaVersion: 2
title: Ainu as a “primitive” race
proposition:
  summary: >-
    Ainu were treated as a primitive, backward, or vanishing people whose survival and modernization required assimilation
    into settled Japanese agricultural life.
correction:
  summary: >-
    The Ainu are an Indigenous people with their own histories, languages, cultural traditions, and political communities.
    Differences between Ainu and Japanese lifeways were not evidence of biological backwardness. Colonial dispossession,
    restrictions on land and subsistence, and assimilation policies contributed substantially to Ainu impoverishment and
    demographic decline. Forced relocation and disease also caused severe losses: Sakhalin Ainu moved to Japan in 1875
    were subsequently forcibly resettled at Tsuishikari, where many died in epidemics aggravated by crowded and unfamiliar
    living conditions.
category: Race and colonial anthropology
reviewedAt: '2026-09-07'
episodes:
  - id: japan-1899-1937
    polity: Japan
    region: East Asia
    startYear: 1899
    endYear: 1937
    periodLabel: documented 1899–1937
    strength: policy-basis
    institutionTypes:
      - government
    institutions:
      - 内務省 (Ministry of Home Affairs)
      - 北海道庁 (Hokkaido Government)
    institutionalContext: >-
      The 1899 Hokkaido Former Aborigines Protection Act gave the Home Minister rule-making authority and the Hokkaido
      Government’s governor direct powers over Ainu land, communal property and policing. The 1937 amendment broadened
      livelihood assistance and removed the separate-school provision, while allowing existing schools to continue
      temporarily. Earlier colonial dispossession,
      restrictions on hunting and fishing, and forced relocation form the background to this episode. Hokkaido Government
      histories published in 1918 and 1937 presented Ainu society through a racial hierarchy that justified assimilation.
      Tokyo Imperial University and the Anthropological Society of Tokyo were major centers of physical-anthropological
      research on the Ainu within this wider intellectual setting; their research provides context for the racial framing.
    consequences:
      - Pressure to adopt farming through conditional land grants and restrictions on traditional subsistence
      - Suppression of Indigenous hunting, fishing and customs
      - Loss of land and access to resources under the wider colonial policies
      - Cultural assimilation through Japanese-language schooling
    summary: >-
      The Ministry of Home Affairs and Hokkaido Government treated assimilation into Japanese society as the answer to
      supposed Ainu backwardness. The 1899 law promoted farming through conditional land grants, alongside restrictions
      on traditional subsistence under wider colonial policies. Japanese-language schooling also served assimilation.
      In the parliamentary debate of 6 March 1937, Home Affairs officials explicitly defended the move from hunting and
      fishing to farming and continued assimilation. The documented period ends at this reaffirmation and the statutory
      revision that followed; assimilation did not end in 1937, and the law remained until its repeal in 1997.
    mechanism:
      kind: administrative-adoption
      summary: >-
        The law coupled agricultural land grants with forfeiture of uncultivated portions after fifteen years,
        restrictions on disposal, and public funding for Ainu schooling. Home Affairs officials defended this framework
        as a means of assimilation, while Hokkaido’s governor administered land and communal property. These measures
        pressured Ainu toward farming without imposing a universal statutory duty to become farmers.
    institutionalCorrection:
      status: corrected
      periodLabel: 1997–2019
      action: Replacement of the 1899 statutory framework and official recognition of the Ainu as an Indigenous people
      summary: >-
        The correction concerns Japan’s later statutory and national-policy framework. The 1997 Ainu Culture Promotion
        Act repealed the 1899 law and established cultural protection as a policy objective. On 14 March 2008 the Cabinet
        acknowledged that restrictions on livelihoods, culture and language had harmed Ainu society and that earlier
        measures had failed to improve conditions sufficiently. On 6 June 2008 the House of Representatives adopted a
        resolution calling for Indigenous recognition, which the government affirmed in its response. The 2019 Ainu
        policy act explicitly recognizes the Ainu as an Indigenous people, requires respect for their voluntary intent,
        and prohibits discrimination. These measures replace the assimilationist statutory framing; they do not establish
        that all historical losses have been remedied.
