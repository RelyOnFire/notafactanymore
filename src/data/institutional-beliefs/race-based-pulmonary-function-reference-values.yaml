title: Race-based pulmonary-function reference values
claim: Race or ethnicity was treated as a patient characteristic that should determine which reference equations or adjustment factors were used to define expected normal pulmonary-function values.
currentUnderstanding: Race and ethnicity are social classifications rather than fixed biological variables suitable for blanket physiological correction. Current ATS guidance, endorsed by the ERS, recommends race-neutral average reference equations for pulmonary-function-test interpretation while calling for continued study of the effects of the transition.
category: Pulmonary medicine and clinical standards
reviewedAt: '2026-08-26'
episodes:
- id: ats-ers-2005-2023
  polity: United States and Europe
  region: Cross-regional
  startYear: 2005
  endYear: 2023
  periodLabel: 2005–2023
  strength: officially-endorsed
  institutionTypes:
  - medical
  - professional
  institutions:
  - American Thoracic Society (ATS)
  - European Respiratory Society (ERS)
  institutionalContext: The joint ATS/ERS 2005 interpretive standard instructed patients to identify their race or ethnic group and recommended race/ethnic-specific reference equations whenever possible, with adjustment factors as a fallback. Such reference values affected whether measured lung function was classified as normal or abnormal. Race-specific interpretation remained part of professional guidance into the early 2020s. In 2023 an official ATS statement, endorsed by the ERS, recommended replacing race- and ethnicity-specific equations with race-neutral average reference equations and urged a wider reassessment of how PFT thresholds are used in clinical, employment and insurance decisions.
  consequences:
  - Race-dependent thresholds for classifying pulmonary-function results as normal or abnormal
  - Potential delayed recognition or lower assessed severity of respiratory impairment for people assigned to groups with lower predicted reference values
  - Race-dependent effects on decisions involving treatment, disability, employment, insurance and transplant prioritization
  - Need to revise laboratory reporting systems and clinical interpretation after the 2023 recommendation
  summary: ATS/ERS standards did not merely note population differences; they operationalized race and ethnicity in the reference values used to interpret pulmonary-function tests. The 2005 standard explicitly preferred race/ethnic-specific equations and allowed numerical adjustment factors when such equations were unavailable. In 2023 the ATS, with ERS endorsement, reversed that approach and recommended race-neutral average equations, citing evidence that race-specific interpretation did not provide the assumed clinical advantage and could contribute to inequitable decisions.
