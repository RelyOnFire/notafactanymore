<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1760" viewBox="0 0 760 1760" role="img" aria-labelledby="title desc">
<title id="title">A different balance</title><desc id="desc">Vertical comparison of an older upright tail-dragging dinosaur reconstruction, trackway and skeletal evidence, and a modern horizontal balanced posture.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}</style>
<rect width="760" height="1760" fill="#f5f0e6"/>
<rect x="30" y="30" width="700" height="535" rx="20" fill="#fbf8f1" stroke="#d6cec0" stroke-width="2"/><rect x="30" y="590" width="700" height="440" rx="20" fill="#fbf8f1" stroke="#d6cec0" stroke-width="2"/><rect x="30" y="1055" width="700" height="675" rx="20" fill="#fbf8f1" stroke="#d6cec0" stroke-width="2"/><text x="58" y="78" font-size="18" font-weight="700" fill="#4f776e" text-anchor="start" letter-spacing="2">OLDER RECONSTRUCTION</text><text x="58" y="124" font-size="40" font-weight="700" fill="#2f302d" text-anchor="start">A different balance</text><line x1="70" y1="470" x2="690" y2="470" stroke="#9d9487" stroke-width="3"/><ellipse cx="385" cy="335.0" rx="72.0" ry="58.5" fill="#6f796a"/><path d="M434.5 303.5 Q457.0 258.5 452.5 213.5" fill="none" stroke="#6f796a" stroke-width="25.2" stroke-linecap="round"/><ellipse cx="454.3" cy="200.0" rx="31.5" ry="21.6" fill="#6f796a"/><path d="M322.0 330.5 Q245.5 362.0 205.0 429.5 Q191.5 456.5 178.0 470" fill="none" stroke="#6f796a" stroke-width="21.6" stroke-linecap="round"/><path d="M362.5 371.0 L371.5 456.5 L344.5 470" fill="none" stroke="#6f796a" stroke-width="21.6" stroke-linecap="round"/><path d="M407.5 371.0 L421.0 453.8 L449.8 470" fill="none" stroke="#6f796a" stroke-width="19.8" stroke-linecap="round"/><text x="90" y="510" font-size="20" font-weight="700" fill="#6d6b64" text-anchor="start">Upright torso</text><text x="670" y="510" font-size="20" font-weight="700" fill="#6d6b64" text-anchor="end">Tail used as support</text><text x="58" y="638" font-size="18" font-weight="700" fill="#4f776e" text-anchor="start" letter-spacing="2">WHAT THE EVIDENCE SUGGESTED</text><text x="58" y="684" font-size="35" font-weight="700" fill="#2f302d" text-anchor="start">What the evidence suggested</text><text x="95" y="755" font-size="16" font-weight="700" fill="#6d6b64" text-anchor="start">TRACKWAY</text><path d="M110 805 q15 -15 30 0 q-15 15 -30 0 M175 835 q15 -15 30 0 q-15 15 -30 0 M240 805 q15 -15 30 0 q-15 15 -30 0 M305 835 q15 -15 30 0 q-15 15 -30 0" fill="#8a7663"/><line x1="90" y1="865" x2="345" y2="865" stroke="#d1c8b9" stroke-width="3" stroke-dasharray="8 10"/><text x="385" y="785" font-size="20" font-weight="600" fill="#2f302d" text-anchor="start"><tspan x="385" dy="0">Trackways rarely show</tspan><tspan x="385" dy="27">continuous tail grooves</tspan></text><path d="M105 955 C170 900 250 895 320 920" fill="none" stroke="#665f55" stroke-width="5" stroke-linecap="round"/><line x1="190" y1="932" x2="190" y2="995" stroke="#665f55" stroke-width="4"/><line x1="255" y1="916" x2="255" y2="985" stroke="#665f55" stroke-width="4"/><text x="385" y="925" font-size="20" font-weight="600" fill="#2f302d" text-anchor="start"><tspan x="385" dy="0">Skeletons permit a more</tspan><tspan x="385" dy="27">horizontal posture</tspan></text><text x="58" y="1103" font-size="18" font-weight="700" fill="#4f776e" text-anchor="start" letter-spacing="2">MODERN RECONSTRUCTION</text><text x="58" y="1149" font-size="36" font-weight="700" fill="#2f302d" text-anchor="start">Modern reconstruction</text><line x1="70" y1="1485" x2="690" y2="1485" stroke="#9d9487" stroke-width="3"/><ellipse cx="390" cy="1366.1" rx="77.89999999999999" ry="39.36" fill="#55766c"/><path d="M451.5 1349.7 Q484.3 1333.3 508.9 1349.7" fill="none" stroke="#55766c" stroke-width="19.68" stroke-linecap="round"/><ellipse cx="525.3" cy="1353.8" rx="31.159999999999997" ry="19.68" fill="#55766c"/><path d="M320.3 1362.0 Q242.4 1357.9 168.60000000000002 1345.6" fill="none" stroke="#55766c" stroke-width="16.4" stroke-linecap="round"/><path d="M361.3 1394.8 L373.6 1468.6 L344.9 1485" fill="none" stroke="#55766c" stroke-width="18.04" stroke-linecap="round"/><path d="M414.6 1394.8 L431.0 1470.24 L459.7 1485" fill="none" stroke="#55766c" stroke-width="18.04" stroke-linecap="round"/><line x1="390" y1="1325" x2="390" y2="1470" stroke="#c7a24d" stroke-width="3" stroke-dasharray="8 8"/><text x="390" y="1305" font-size="18" font-weight="700" fill="#c7a24d" text-anchor="middle">balance</text><text x="80" y="1526" font-size="17" font-weight="700" fill="#4f776e" text-anchor="start"><tspan x="80" dy="0">Torso balanced</tspan><tspan x="80" dy="22">over the hips</tspan></text><text x="680" y="1526" font-size="17" font-weight="700" fill="#4f776e" text-anchor="end"><tspan x="680" dy="0">Tail held clear</tspan><tspan x="680" dy="22">as a counterweight</tspan></text><rect x="54" y="1600" width="652" height="100" rx="12" fill="#ece7db"/><text x="72" y="1632" font-size="17" font-weight="400" fill="#6d6b64" text-anchor="start"><tspan x="72" dy="0">Occasional tail-drag traces exist; this is about normal</tspan><tspan x="72" dy="23">walking posture.</tspan></text></svg>