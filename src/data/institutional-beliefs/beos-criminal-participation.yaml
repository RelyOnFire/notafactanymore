  institutionalContext: 'By 2008 Maharashtra''s state forensic laboratory was administering BEOS in criminal investigations,
    and sessions courts considered expert testimony interpreting the resulting brain responses as evidence of experiential
    knowledge connected to alleged crimes. In 2010 the Supreme Court prohibited involuntary BEAP and related testing
    and held that even voluntarily obtained test results are not themselves admissible, while leaving room for voluntary
    investigative use under safeguards. The institutional proposition nevertheless remains active: Maharashtra''s
    current Directorate of Forensic Science Laboratories describes BEOS as revealing experiential knowledge acquired
    through participation in criminal activity, and NFSU''s Delhi forensic-psychology laboratory continues to maintain
    BEOS equipment for training and research.'
  consequences:
  - Criminal suspects and witnesses subjected to brain-based forensic testing
  - Investigative conclusions about whether a person participated in a crime
  - BEOS findings used to guide interrogation, corroboration and evidentiary development
  - Early courtroom reliance on claimed experiential-memory signatures
  - Risk of false implication when remembered, learned, suggested or contaminated information is misclassified as
    participation
  summary: 'Indian forensic institutions adopted BEOS as a way to infer whether crime-related information in a person''s
    brain came from direct experience. In 2008 Maharashtra courts considered BEOS findings in murder prosecutions,
    while a state laboratory had already tested dozens of suspects and witnesses. Scientific reviewers challenged
    the method''s ability to distinguish first-person participation from other sources of memory, and the Supreme
    Court subsequently imposed constitutional limits on involuntary brain-mapping-type tests and on direct evidentiary
    use. Yet the core factual proposition remains institutionally active: in 2026 Maharashtra''s forensic laboratory
    still describes BEOS as detecting experiential knowledge acquired through participation in criminal activity,
    and a national forensic university continues to train and research with the technology.'
