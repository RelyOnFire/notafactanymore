locale: de
entryId: super-resolution-microscopy
sourceReviewedAt: '2026-08-21'
term: Superauflösungsmikroskopie
aliases:
- Superauflösung
shortDefinition: Optische Mikroskopieverfahren, die räumliche Information feiner als die konventionelle beugungsbegrenzte
  Auflösung gewinnen.
longDefinition: Superauflösungsmikroskopie umfasst Verfahren, die die konventionelle beugungsbegrenzte Auflösung der
  Lichtmikroskopie überschreiten, indem Fluoreszenz gezielt gesteuert oder Information aus vielen Messungen kombiniert
  wird. Wichtige Ansätze sind STED, das Fluoreszenz räumlich unterdrückt, sowie Einzelmolekül-Lokalisationsverfahren
  wie PALM und STORM.
