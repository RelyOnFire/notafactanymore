term: Helicobacter pylori
aliases:
- H. pylori
shortDefinition: A spiral-shaped bacterium that can colonize the stomach lining and is a major cause of chronic gastritis
  and peptic ulcers.
longDefinition: Helicobacter pylori is a bacterium adapted to living in the human stomach. Persistent infection can cause
  chronic inflammation of the stomach lining and is one of the two most common causes of peptic-ulcer disease. Treating
  the infection with appropriate antibiotics and acid-suppressing therapy greatly reduces ulcer recurrence.
relatedTerms:
- nsaid
reviewedAt: '2026-08-21'
sources:
- title: Symptoms & Causes of Peptic Ulcers (Stomach or Duodenal Ulcers)
  url: https://www.niddk.nih.gov/health-information/digestive-diseases/peptic-ulcers-stomach-ulcers/symptoms-causes
  publisher: U.S. National Institute of Diabetes and Digestive and Kidney Diseases
  note: Identifies H. pylori infection as one of the two most common causes of peptic ulcers.
