term: Analgesia
aliases:
- pain relief
shortDefinition: Reduction or prevention of pain without necessarily causing loss of consciousness.
longDefinition: Analgesia means relieving or preventing pain. It can be produced by medicines or other interventions
  and does not by itself imply unconsciousness; a patient can be awake while receiving effective analgesia.
relatedTerms:
- anesthesia
reviewedAt: '2026-08-21'
sources:
- title: Neuro- and psychophysiology of pain in children
  url: https://pubmed.ncbi.nlm.nih.gov/18415362/
  publisher: PubMed
  note: Reviews pain perception and pain management in newborns and children.
