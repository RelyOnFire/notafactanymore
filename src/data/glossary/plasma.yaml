term: Plasma
aliases:
- ionized gas
shortDefinition: A gas in which enough atoms or molecules are electrically charged that the material behaves collectively
  as charged particles.
longDefinition: Plasma forms when a gas contains substantial numbers of free electrons and ions. Because those charged
  particles respond strongly to electric and magnetic fields, plasma can behave differently from an ordinary neutral
  gas. Much diffuse material in space is plasma.
relatedTerms: []
reviewedAt: '2026-08-21'
sources:
- title: Is Interstellar Space Really Empty?
  url: https://www.nasa.gov/space-science-and-astrobiology-at-ames/interesting-fact-of-the-month-current/interesting-fact-of-the-month-2022/
