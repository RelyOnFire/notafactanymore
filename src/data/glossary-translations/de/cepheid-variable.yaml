term: Cepheide
aliases: []
shortDefinition: Ein pulsierender Stern, dessen Helligkeit sich regelmäßig ändert und dessen Pulsationsdauer mit seiner tatsächlichen
  Leuchtkraft zusammenhängt. Dadurch eignet er sich zur Entfernungsmessung.
longDefinition: Cepheiden werden in einem regelmäßigen Rhythmus heller und dunkler; die Periodendauer hängt eng mit ihrer
  tatsächlichen Leuchtkraft zusammen. Vergleicht man diese mit der beobachteten Helligkeit, lässt sich ihre Entfernung abschätzen.
  Cepheiden wurden dadurch zu einer wichtigen Stufe der kosmischen Entfernungsleiter für Distanzen jenseits direkter geometrischer
  Messungen.
