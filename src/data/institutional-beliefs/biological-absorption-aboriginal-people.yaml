evidence:
  - id: absorption-conference-proposition
    sourceId: absorption-conference-1937
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: report pp. 3–4; proceedings pp. 10–11 and 20–21
    note: >-
      The primary record prints the adopted ultimate-absorption resolution, Neville's explanation that Western Australian
      legislation pursued absorption, his discussion of taking charge of children from age six and the later conference
      debate and resolution.
  - id: absorption-nhgri-correction
    sourceId: absorption-nhgri-populations
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: sections “Understanding genetic ancestry, race and ethnicity” and “The Big Picture”
    note: >-
      Current genomics guidance distinguishes socially created race from genetic ancestry and explains that race and
      ethnicity are not valid or reliable proxies for ancestry.
  - id: absorption-aiatsis-correction
    sourceId: absorption-aiatsis-identity
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: working criteria for confirmation of Aboriginal or Torres Strait Islander heritage
    note: >-
      AIATSIS identifies descent, self-identification and community acceptance as the usual working criteria and states
      that appearance and way of life are not requirements.
  - id: absorption-bringing-home-impact
    sourceId: absorption-bringing-home-ch2
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: sections “Merging and absorption” and “Merging becomes assimilation”
    note: >-
      The national inquiry connects the absorption theory to forced child separation, control of family bonds and the
      1937 resolution, then distinguishes Neville's biological model from the later sociocultural assimilation model.
  - id: absorption-hansard-carrier
    sourceId: absorption-wa-hansard-1933
    relation: documents
    target: {scope: episode, episodeId: australia-1933-1939, aspect: carrier}
    locator: Legislative Assembly, speech by Frank Wise, 30 August 1933
    note: >-
      The parliamentary debate reproduces Neville's June 1933 public statement advocating gradual absorption and reports
      that the Commonwealth was encouraging selected interracial marriages. It documents the policy's public articulation,
      not a statute or resolution enacted during that debate.
  - id: absorption-conference-carrier
    sourceId: absorption-conference-1937
    relation: documents
    target: {scope: episode, episodeId: australia-1933-1939, aspect: carrier}
    locator: report pp. 3–4; proceedings p. 21
    note: >-
      Identifies the Commonwealth and state representatives, records that the Commonwealth convened the meeting and prints
      the signed resolutions adopted by the conference.
  - id: absorption-neville-carrier
    sourceId: absorption-neville-court-paper
    relation: supports
    target: {scope: episode, episodeId: australia-1933-1939, aspect: carrier}
    locator: pp. 3–4 and 28–29
    note: >-
      Records Neville's tenure as Chief Protector from 1915 to 1936 and Commissioner from 1936 to 1940, as well as the
      Western Australian statutory powers over children and marriage. This is a conference address by the then Chief
      Justice, who states that it expresses his personal views and is not a court judgment.
  - id: absorption-naa-carrier
    sourceId: absorption-naa-nt-records
    relation: supports
    target: {scope: episode, episodeId: australia-1933-1939, aspect: carrier}
    locator: chapter 8, pp. 133–136, especially “John McEwen's New Deal, 1939”
    note: >-
      The National Archives guide attributes the Northern Territory biological-absorption policy to Chief Protector Cecil
      Cook and records the 1939 replacement of Cook and abolition of the Chief Protector office.
  - id: absorption-conference-mechanism
    sourceId: absorption-conference-1937
    relation: documents
    target: {scope: episode, episodeId: australia-1933-1939, aspect: mechanism}
    locator: report pp. 3–4; proceedings pp. 10–11 and 20–21
    note: >-
      Documents the intended use of child control, education, employment and state administration to pursue absorption,
      while leaving the details of administration to the individual jurisdictions.
  - id: absorption-neville-mechanism
    sourceId: absorption-neville-court-paper
    relation: supports
    target: {scope: episode, episodeId: australia-1933-1939, aspect: mechanism}
    locator: pp. 28–29
    note: >-
      Summarises the 1936 Western Australian extension of legal guardianship to every person classified as a Native child
      until age 21 despite a living parent or relative, alongside marriage and other administrative controls.
  - id: absorption-bringing-home-consequences
    sourceId: absorption-bringing-home-ch2
    relation: supports
    target: {scope: episode, episodeId: australia-1933-1939, aspect: consequences}
    locator: sections “Protection”, “Merging and absorption” and “Merging becomes assimilation”
    note: >-
      Documents extensive protection-board control, deliberate distancing of children from families and communities, and
      the harms and material conditions associated with institutions and missions.
  - id: absorption-naa-context
    sourceId: absorption-naa-nt-records
    relation: contextualizes
    target: {scope: episode, episodeId: australia-1933-1939, aspect: context}
    locator: chapter 8, pp. 133–136
    note: >-
      Shows that the 1939 shift was from biological absorption to economic and social assimilation, under which child
      removal and government control continued; it therefore supports the endpoint qualification rather than an end to
      coercion.
  - id: absorption-nhgri-context
    sourceId: absorption-nhgri-populations
    relation: contextualizes
    target: {scope: episode, episodeId: australia-1933-1939, aspect: context}
    locator: sections “Understanding genetic ancestry, race and ethnicity” and “The Big Picture”
    note: >-
      Provides the modern scientific context for evaluating the policy's conflation of race, skin colour, ancestry and
      identity.
  - id: absorption-aiatsis-context
    sourceId: absorption-aiatsis-identity
    relation: contextualizes
    target: {scope: episode, episodeId: australia-1933-1939, aspect: context}
    locator: working criteria for confirmation of Aboriginal or Torres Strait Islander heritage
    note: >-
      Provides current Australian institutional context showing why an imposed ancestry fraction or visual classification
      cannot define Aboriginal identity.
  - id: absorption-naa-policy-shift
    sourceId: absorption-naa-nt-records
    relation: documents
    target: {scope: episode, episodeId: australia-1933-1939, aspect: institutional-correction}
    locator: chapter 8, p. 135, “John McEwen's New Deal, 1939”
    note: >-
      Documents the 1939 Commonwealth transition away from Cook's biological absorption policy, while also recording that
      the successor assimilation policy retained removal and control.
  - id: absorption-apology-correction
    sourceId: absorption-national-apology
    relation: documents
    target: {scope: episode, episodeId: australia-1933-1939, aspect: institutional-correction}
    locator: House of Representatives speech and apology motion, 13 February 2008
    note: >-
      The national apology acknowledges the laws and policies of successive parliaments and governments, child removal and
      the breaking of families and communities; the accompanying speech expressly identifies the 1937 absorption policy.
  - id: absorption-wa-redress-correction
    sourceId: absorption-wa-redress-2025
    relation: documents
    target: {scope: episode, episodeId: australia-1933-1939, aspect: institutional-correction}
    locator: Premier's brief ministerial statement, 27 May 2025
    note: >-
      Records Western Australia's 1997 formal apology, renews the apology for separation from family, culture and Country,
      and announces a state redress scheme, demonstrating both repudiation and continuing remedial work.
