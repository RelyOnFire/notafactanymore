locale: de
entryId: beriberi-infectious-disease
sourceReviewedAt: '2026-08-25'
title: Beriberi als Infektionskrankheit statt als Mangelkrankheit
claim: Militärische und kolonialmedizinische Institutionen in Japan und Niederländisch-Indien behandelten Beriberi
  vorwiegend als Infektionskrankheit statt als ernährungsbedingte Erkrankung. In Japan hielt die medizinische Führung
  des Heeres an dieser Erklärung fest, obwohl die Marine Beriberi durch Ernährungsänderungen nahezu beseitigt hatte.
  In Niederländisch-Indien kam eine staatliche Untersuchungskommission zunächst zu dem Schluss, eine bakterielle
  Infektion mit Toxinwirkung verursache die Krankheit, bevor Labor- und Gefängnisdaten den Blick auf polierten Reis
  lenkten.
currentUnderstanding: Beriberi wird durch Thiaminmangel (Vitamin B1) verursacht. Eine stark von poliertem Reis geprägte
  Ernährung kann einen solchen Mangel hervorrufen, weil beim Polieren thiaminreiche Außenschichten entfernt werden.
  Infektionstheorien erklärten weder die Ergebnisse der japanischen Marine noch Eijkmans ernährungsabhängige Tierversuche,
  Vordermans Gefängnisstudie oder die spätere biochemische Identifizierung von Thiamin. Die Ursache war anfangs
  tatsächlich unsicher; der institutionelle Fehler lag im Festhalten an beziehungsweise in der amtlichen Bestätigung
  eines Infektionsmodells, nachdem starke Ernährungsbelege vorlagen.
impact:
  summary: 'Beriberi erzeugte in Asien zwei besonders aufschlussreiche institutionelle Episoden. Japans Marine änderte
    die Ernährung und beseitigte die Krankheit nahezu, während das Heer an Infektion und poliertem Reis festhielt.
    In Niederländisch-Indien entsandte die Regierung 1886 eine eigene Beriberi-Kommission, deren Leiter von einer
    bakteriellen Tropeninfektion mit Toxinwirkung überzeugt zurückkehrten. Dasselbe koloniale Medizinsystem erzeugte
    dann die Gegenbelege: Eijkmans Versuche verbanden polierten Reis mit einer beriberiähnlichen Neuropathie, und
    Regierungsarzt Adolphe Vorderman fand in Gefängnissen einen starken Zusammenhang zwischen Reissorte und menschlichem
    Beriberi.'
  highlights:
  - value: 1884–85
    label: Ernährungsexperimente und Rationsreform der japanischen Marine wurden vom Verschwinden von Beriberi in
      der Marine gefolgt
  - value: 34 von 63 vs. 1 von 27
    label: 'Gefängnisse mit endemischem oder gelegentlichem Beriberi in einer späteren Übersicht: polierter weißer
      Reis gegenüber unpoliertem rotem Reis'
    note: Die historische Übersicht nennt endemisches Beriberi in 34 von 63 Gefängnissen mit poliertem weißen Reis
      und gelegentliches Beriberi in nur einem von 27 Gefängnissen mit unpoliertem rotem Reis.
  - value: 1904–05
    label: das japanische Heer erlitt weiterhin massive Beriberi-Ausfälle, obwohl die Marine starke Ernährungsgegenbelege
      geliefert hatte
  context:
  - Als die ersten Kommissionen Beriberi untersuchten, existierte noch keine Vitamintheorie. Die Bakteriologie veränderte
    gerade die Medizin, weshalb eine infektiöse Hypothese zunächst plausibel war. Nicht die erste Hypothese selbst
    wird als Fehlverhalten behandelt.
  - 'In Japan geht es vor allem um institutionelles Festhalten: Das Heer behielt Infektionstheorie und Verpflegungspolitik
    trotz der Gegenbelege der Marine bei. Die niederländisch-indische Episode ist anders: Eine staatlich gestützte
    Infektionserklärung wurde durch Forschung innerhalb desselben kolonialen Medizin- und Gefängnissystems schrittweise
    widerlegt.'
  - 1897 bezeichnet Vordermans große amtliche Gefängnisuntersuchung und die daraus folgende Hinwendung zu unpoliertem
    Reis im Gefängniswesen. Es ist weder das Jahr einer weltweiten Einigung noch der Isolierung von Thiamin.
episodes:
- id: japan-army-1885-1905
  polity: Japan
  institutions:
  - Kaiserlich Japanisches Heer
  - Heeresmedizinalabteilung des Kaiserlich Japanischen Heeres
  institutionalContext: Marine und Heer verfolgten unterschiedliche medizinische Strategien. Nach Takakis Vergleichsfahrten
    und der Ernährungsreform brach Beriberi in der Marine ein. Die medizinische Führung des Heeres hielt einen infektiösen
    Ursprung weiterhin für plausibler und lehnte die Ernährungserklärung ab, während polierter Reis die Heeresverpflegung
    prägte. 1905 bezeichnet das Ende des Russisch-Japanischen Krieges, nicht die spätere Identifizierung von Thiamin.
  summary: Seit Mitte der 1880er-Jahre lieferten Ernährungsexperimente und Rationsreform der japanischen Marine
    starke Hinweise auf eine ernährungsbedingte Ursache von Beriberi und beseitigten die Krankheit unter Seeleuten
    nahezu. Die medizinische Führung des Heeres hielt dennoch an einem infektiösen Ursprung fest. Im Russisch-Japanischen
    Krieg erlitt das Heer massive Beriberi-Erkrankungen und -Todesfälle; spätere Vitaminforschung identifizierte
    Thiaminmangel als Ursache.
  consequences:
  - Fortführung einer stark auf poliertem Reis beruhenden Heeresverpflegung trotz starker Gegenbelege
  - Sehr hohe Zahl an Beriberi-Erkrankungen bei Soldaten im Krieg
  - Tausende vermeidbare Todesfälle und Verlust militärischer Einsatzfähigkeit
  - Verzögerte institutionelle Anerkennung eines Ernährungsmechanismus
- id: dutch-east-indies-1886-1897
  polity: Niederländisch-Indien
  institutions:
  - niederländische Regierungskommission zur Beriberi-Forschung
  - Medizinisches Laboratorium in Weltevreden
  - ziviler Medizinaldienst und Gefängnisgesundheitsverwaltung Niederländisch-Indiens
  institutionalContext: 1886 entsandte die niederländische Regierung Cornelis Pekelharing und Cornelis Winkler zur
    Untersuchung des schweren Beriberi-Problems in Niederländisch-Indien; Christiaan Eijkman wurde der Kommission
    für die bakteriologischen Arbeiten beigeordnet. Pekelharing und Winkler deuteten Beriberi als Erkrankung peripherer
    Nerven durch Bakterien und ein spezifisches Toxin und kehrten in der Überzeugung zurück, es handle sich um eine
    tropische Infektionskrankheit. Eijkman blieb im staatlichen Labor und gewann zunehmend Hinweise auf die Ernährung.
    Regierungsarzt und Gefängnisinspektor Adolphe Vorderman prüfte anschließend mit Gefängnisakten und verblindeter
    Reisbestimmung auf Java und Madura den Zusammenhang beim Menschen. Sein Bericht von 1897 zeigte Beriberi fast
    ausschließlich in Verbindung mit poliertem statt unpoliertem Reis.
  summary: 'Die niederländisch-indische Episode zeigt eine institutionelle Selbstkorrektur. Eine Regierungskommission
    kam zunächst zu einem Infektionsurteil, das gut zur neuen Bakteriologie der 1880er-Jahre passte. Die im kolonialen
    Medizinalsystem fortgesetzte Forschung untergrub dieses Urteil: Eijkmans Versuche belasteten polierten Reis,
    und Vordermans amtliche Gefängnisstudie zeigte einen starken Zusammenhang zwischen Reissorte und Beriberi. Die
    Evidenz lenkte die Praxis auf Ernährung, lange bevor Thiamin selbst isoliert wurde.'
  consequences:
  - Förmliches koloniales Forschungsprogramm, das zunächst um eine bakterielle und toxische Erklärung organisiert
    war
  - Fortgesetzte bakteriologische Forschung, während eine Ernährungsursache institutionell randständig blieb
  - Verzögerte Nutzung reisbasierter Prävention in Einrichtungen mit regelmäßig poliertem Reis
  - Groß angelegte amtliche Gefängnisuntersuchung, nachdem die Ernährungshinweise stärker wurden
  - Umstellung auf unpolierten Reis im Gefängniswesen, als der koloniale Gesundheitsdienst die neuen Befunde in
    Prävention übersetzte
