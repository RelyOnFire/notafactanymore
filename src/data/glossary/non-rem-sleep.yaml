term: Non-REM sleep
aliases:
- NREM
- non-REM
- non-rapid eye movement sleep
shortDefinition: The sleep stages outside REM, ranging from light sleep to deep slow-wave sleep.
longDefinition: Non-REM sleep includes several stages with progressively different brain activity, muscle tone, and ease
  of awakening. Deep non-REM sleep is associated with slow-wave activity. Dream experiences can occur during non-REM
  sleep as well as REM, although their reported qualities and frequency often differ.
relatedTerms:
- rem-sleep
reviewedAt: '2026-08-21'
sources:
- title: What happens during sleep?
  url: https://www.nichd.nih.gov/health/topics/sleep/conditioninfo/Pages/what-happens.aspx
  publisher: Eunice Kennedy Shriver National Institute of Child Health and Human Development
  note: Describes non-REM sleep stages and explains that dreaming can occur outside REM.
