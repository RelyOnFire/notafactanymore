      - Third Turkish Language Congress (Üçüncü Türk Dil Kurultayı)
    institutionalContext: >-
      The Turkish Language Association was the principal institutional carrier. Its Third Turkish Language Congress in 1936 made the Sun Language Theory a formal subject of institutional linguistic work, including a dedicated Güneş-Dil Teorisi ve Dil Karşılaştırmaları Komisyonu. The broader language-reform establishment and state sponsorship are described here rather than listed as if they were separate institutions.
    consequences:
      - State-sponsored linguistic research
      - Language policy
      - National historical narrative
    summary: The Sun Language Theory was promoted through the state-backed Turkish Language Association and became a central subject of the Third Turkish Language Congress in 1936. The congress proceedings treated it as a new linguistic school and organized a dedicated commission around the theory. It proposed a primordial role for Turkish in the origin of language and was supported for political and national-cultural purposes before being abandoned.
