schemaVersion: 2
locale: de
entryId: eugenic-sterilization
sourceReviewedAt: '2026-09-27'
title: Eugenische Sterilisation zur „Verbesserung“ der Bevölkerung
proposition:
  summary: >-
    Staatliche, gerichtliche, fürsorgerische und medizinische Institutionen behandelten Behinderung, psychiatrische
    Diagnosen und sozial definierte „Untauglichkeit“ als erbliche Mängel der Bevölkerung. Die Verhinderung der
    Fortpflanzung ausgewählter Menschen galt ihnen als legitimer Weg, die Bevölkerung zu verbessern. In der Praxis
    nahmen diese Klassifikationen auch Urteile über Armut, Sexualität, Ethnizität, Anstaltsunterbringung und Konformität auf.
correction:
  summary: >-
    Eugenische Sterilisationssysteme verbanden eine falsche wissenschaftliche Verallgemeinerung mit dem Missbrauch
    staatlicher und klinischer Macht. Sie fassten unterschiedliche Erkrankungen und soziale Etiketten zu einfachen
    Erbdefekten zusammen, überschätzten die Vorhersagekraft einer Diagnose oder Kategorie für die Gesundheit von
    Nachkommen und leiteten daraus Verfügungsmacht über die Fruchtbarkeit anderer Menschen ab. Manche Erkrankungen haben
    tatsächlich genetische Anteile; Vererbung reicht jedoch von monogenen Krankheiten bis zu komplexen und von der Umwelt
    mitbestimmten Risiken. Weder ein genetisches Risiko noch eine soziale Klassifikation ersetzt eine Einwilligung.
    Sterilisation setzt die volle, freie und informierte Entscheidung der betroffenen Person voraus und muss frei von
    Diskriminierung, Zwang und Gewalt sein.
impact:
  summary: >-
    Die fünf Episoden waren getrennte Rechts- und Verwaltungssysteme; ihre Zahlen dürfen daher nicht einfach addiert
    werden. US-Bundesstaaten sterilisierten mindestens 60.000 Menschen nach eugenischen Gesetzen, NS-Deutschland etwa
    400.000 Menschen unter Zwang. Schweden registrierte 62.888 Eingriffe nach den Gesetzen von 1935 bis 1975; die spätere
    Untersuchung unterschied freiwillige Fälle, Eingriffe ohne Einwilligung, zwangähnliche Umstände, Druck und nicht
    klassifizierbare Akten. Japan bezeichnet heute rund 25.000 Menschen als Opfer sterilisierender Eingriffe nach dem
    früheren Eugenic Protection Act. In der Tschechoslowakei wurden formal neutrale medizinische Regeln durch rassifizierte
    Fürsorge- und Klinikpraktiken angewandt, die besonders Romnja schädigten. Die späteren Reaktionen reichten von
    landesweiter Aufhebung, Untersuchung und Entschädigung bis zu engeren oder weiterhin mangelhaften Nachfolgestaatsprogrammen.
  highlights:
    - value: ≈60.000
      label: Menschen wurden bis in die 1970er-Jahre nach eugenischen Gesetzen von US-Bundesstaaten sterilisiert
    - value: ≈400.000
      label: Menschen wurden nach dem nationalsozialistischen Erbgesundheitsgesetz zwangssterilisiert
    - value: '62.888'
      label: Sterilisationen insgesamt nach den schwedischen Gesetzen von 1935–1975; nicht alle wurden als erzwungen eingestuft
    - value: ≈25.000
      label: Sterilisationsopfer erfasst Japan heute im Zusammenhang mit dem früheren Eugenic Protection Act
  context:
    - >-
      Die Zahlen hängen davon ab, was gezählt wird: erlassene Gesetze, genehmigte Anordnungen, ausgeführte Operationen,
      formal nicht einvernehmliche Fälle oder unter Druck akzeptierte Eingriffe. Die schwedische Untersuchung unterschied
      etwa 6.000 Eingriffe ohne Einwilligung, 15.000 unter zwangähnlichen Umständen und gut 6.000 weitere mit Anzeichen von
      Überredung oder Druck; eine spätere Forschungsübersicht verwendete die breitere Schätzung von ungefähr 32.000
      unfreiwilligen Eingriffen.
    - >-
      Die wissenschaftliche Korrektur behauptet nicht, Vererbung sei für jede erfasste Erkrankung bedeutungslos. Sie
      verwirft den institutionellen Sprung von einer breiten Diagnose oder sozialen Bewertung zu einer deterministischen
      Prognose über Nachkommen und anschließend zu unumkehrbarem Fortpflanzungszwang.
    - >-
      Formelle Aufhebungen beendeten die Rechtsgrundlagen zu unterschiedlichen Zeiten; Anerkennung und Abhilfe folgten oft
      erst Jahrzehnte später. Der Korrekturstatus beschreibt die dokumentierte institutionelle Reaktion auf das historische
      Programm. Er bedeutet weder, dass der Eingriff rückgängig gemacht werden kann, noch dass alle Betroffenen entschädigt wurden.
episodes:
  - id: united-states-1907-1974
    polity: Vereinigte Staaten
    periodLabel: 1907–Mitte der 1970er-Jahre
    institutions:
      - Virginia General Assembly
      - Virginia State Colony for Epileptics and Feeble-Minded
      - Supreme Court of the United States
    institutionalContext: >-
      In den Vereinigten Staaten gab es keine einheitliche Bundesbehörde für eugenische Sterilisation. Die Bundesstaaten
      schufen und verwalteten eigene Systeme über Krankenhäuser, Fürsorgeanstalten, Sozialbehörden und Gerichte. Virginia
      zeigt die Kette hinter dem landesweit einflussreichen Präzedenzfall: Das Parlament erließ 1924 das Gesetz, die
      staatliche Anstalt wählte Carrie Buck für einen Musterfall aus, und der Supreme Court bestätigte 1927 die Anordnung.
      Vergleichbare Systeme bestanden in zahlreichen Bundesstaaten.
    consequences:
      - Mindestens 60.000 Menschen wurden bis in die 1970er-Jahre nach eugenischen Gesetzen der Bundesstaaten sterilisiert
      - Anstaltsbewohner und als behindert, „schwachsinnig“ oder sozial untauglich etikettierte Menschen wurden gezielt erfasst
      - Buck v. Bell verlieh der Zwangssterilisation nach Virginias Verfahren verfassungsrechtliche Autorität
      - Die Programme trafen Frauen, behinderte und arme Menschen sowie rassifizierte Gruppen unverhältnismäßig
      - Entschuldigungen und Entschädigung erfolgten einzelstaatlich und erfassten nur definierte Gruppen Überlebender
    summary: >-
      Indiana erließ 1907 das erste eugenische Sterilisationsgesetz der USA; zwischen 1907 und 1937 verabschiedeten 32
      Bundesstaaten solche Gesetze. Staatliche Einrichtungen sterilisierten Zehntausende als untauglich klassifizierte
      Menschen. In Buck v. Bell bestätigte der Supreme Court Virginias Gesetz und Carrie Bucks Sterilisationsanordnung.
      Damit wurde ein medizinisches und soziales Urteil über angeblich erblichen „Schwachsinn“ durchsetzbare Verfassungspolitik.
    mechanism:
      summary: >-
        Gesetze der Bundesstaaten ermächtigten Behörden und Einrichtungen, Sterilisationen zu beantragen oder anzuordnen;
        medizinische Aussagen lieferten die Erbklassifikation, und gerichtliche Prüfung einschließlich Buck v. Bell
        legitimierte den Eingriff.
    institutionalCorrection:
      periodLabel: 2001–2015
      action: Virginia drückte offiziell tiefes Bedauern über seine Rolle aus und schuf später ein Entschädigungsprogramm über 25.000 US-Dollar je bestätigtem berechtigtem Antrag.
      summary: >-
        Die dokumentierten Maßnahmen betrafen einzelne Bundesstaaten. Virginia erkannte die falsche Wissenschaft und den
        Schaden an und finanzierte Entschädigung für eine definierte Gruppe bestätigter Überlebender; dies erfasste jedoch
        nur einen Teil eines landesweiten, einzelstaatlich verwalteten Musters.
  - id: germany-1933-1945
    polity: NS-Deutschland
    periodLabel: 1933–1945 (in Kraft ab 1934)
    institutions:
      - Reichsministerium des Innern
      - Erbgesundheitsgerichte
      - Erbgesundheitsobergerichte
      - Gesundheitsämter und Amtsärzte
    institutionalContext: >-
      Das Reichsministerium des Innern steuerte die Umsetzung des Gesetzes vom Juli 1933. Gesundheitsämter, Ärzte und
      Anstaltsleitungen meldeten Menschen und leiteten Verfahren ein; Erbgesundheitsgerichte aus einem Richter und Ärzten
      erließen Anordnungen, Erbgesundheitsobergerichte entschieden über Beschwerden, und Krankenhäuser führten die
      Operationen aus. Nach Rechtskraft erlaubte das Gesetz die Sterilisation gegen den Willen der Person mit Polizeihilfe.
    consequences:
      - Etwa 400.000 Menschen wurden nach dem Erbgesundheitsgesetz zwangssterilisiert
      - Neun Diagnosekategorien wurden zu gesetzlichen Gründen für reproduktive Eingriffe
      - Dehnbare Etiketten wie „angeborener Schwachsinn“ nahmen soziale Abweichung und umstrittene Testergebnisse auf
      - Sondergerichte und ärztliche Meldepflicht machten eugenische Prognosen zu einem routinemäßigen Verwaltungsverfahren
      - Betroffene warteten Jahrzehnte auf formelle Ächtung und Aufhebung der Gerichtsbeschlüsse
    summary: >-
      Das Gesetz zur Verhütung erbkranken Nachwuchses von 1933 machte ab Januar 1934 pauschale Erbprognosen durch Medizin,
      Verwaltung und Sondergerichte durchsetzbar. Breite psychiatrische, neurologische, sensorische und soziale Diagnosen
      galten als verlässlicher Beleg, dass Nachkommen schwere Erbschäden haben würden. Das System zwangssterilisierte bis
      zum Ende des NS-Regimes ungefähr 400.000 Menschen.
    mechanism:
      summary: >-
        Gesetzliche Diagnosekategorien, Meldepflicht, ärztliche Begutachtung und Sondergerichtsbeschlüsse überführten
        eugenische Erbbehauptungen in Operationen, die mit polizeilich unterstütztem körperlichem Zwang vollstreckt werden konnten.
    institutionalCorrection:
      periodLabel: '1998'
      action: Der Deutsche Bundestag hob die noch fortwirkenden Sterilisationsentscheidungen der früheren Erbgesundheitsgerichte gesetzlich auf.
      summary: >-
        Der Zwangsapparat endete 1945, die formelle Rehabilitierung folgte verspätet. Der Bundestag erkannte die
        Sterilisationen später als nationalsozialistisches Unrecht an und beseitigte 1998 die fortwirkende Rechtskraft der Beschlüsse.
  - id: sweden-1935-1975
    polity: Schweden
    periodLabel: 1935–1975
    institutions:
      - Medicinalstyrelsen
      - Socialstyrelsen (ab 1968)
    institutionalContext: >-
      Medicinalstyrelsen – ab 1968 Socialstyrelsen – war zentrale Genehmigungsbehörde und erließ Anweisungen. Anstaltsleitungen,
      Ärzte, Kinder- und Armenfürsorge konnten Anträge anstoßen oder prägen; Krankenhäuser führten genehmigte Eingriffe aus.
      Ein formeller Antrag oder eine Unterschrift belegte nicht zwingend freie Wahl: Sterilisation konnte zur Bedingung für
      Entlassung, Schwangerschaftsabbruch, Heiratserlaubnis oder staatliche Hilfe gemacht werden.
    consequences:
      - Schweden registrierte 62.888 Sterilisationen nach den von 1935 bis 1975 geltenden Gesetzen
      - Die amtliche Untersuchung ordnete etwa 6.000 Fälle als ohne Einwilligung und 15.000 als unter zwangähnlichen Umständen ein
      - Gut 6.000 weitere Akten zeigten Überredung oder Druck; mehr als 4.000 ließen sich nicht klassifizieren
      - 93 Prozent aller in diesem Zeitraum sterilisierten Menschen waren Frauen
      - Schutzbedürftige und in Anstalten untergebrachte Menschen waren amtlichem Druck besonders ausgesetzt
    summary: >-
      Schwedens Sterilisationsgesetze von 1934 und 1941 wirkten von 1935 bis 1975 über ein zentrales Genehmigungssystem
      sowie lokale medizinische und fürsorgerische Akteure. Eine spätere staatliche Untersuchung stellte einen deutlichen
      Wandel fest: von überwiegend zwanghafter, bevölkerungs- und rassenhygienischer Begründung hin zu überwiegend
      freiwilliger Familienplanung. Die Aktenanalyse dokumentierte dennoch Eingriffe ohne Einwilligung, zwangähnliche
      Umstände und amtlichen Druck.
    mechanism:
      summary: >-
        Das zentrale Genehmigungssystem verband medizinische Indikationen mit Anträgen lokaler Klinik-, Anstalts- und
        Fürsorgeakteure; Abhängigkeit von Entlassung, Schwangerschaftsabbruch oder Hilfe konnte nominelle Einwilligung in
        bedingten Zwang verwandeln.
    institutionalCorrection:
      periodLabel: 1975–2000
      action: Schweden ersetzte die früheren Gesetze 1975 durch eine einwilligungsbasierte Regelung, setzte eine amtliche Untersuchung ein und verabschiedete 1999 ein Entschädigungsgesetz für anspruchsberechtigte gegen ihren Willen oder auf Initiative anderer sterilisierte Menschen.
      summary: >-
        Der Zwangsrahmen endete; die spätere nationale Reaktion dokumentierte staatliche Verantwortung und schuf einen
        standardisierten Entschädigungsweg. Bis Oktober 2000 hatte der Ausschuss rund 1.500 Fälle entschieden und ungefähr
        82 Prozent der Anträge bewilligt.
  - id: japan-1948-1996
    polity: Japan
    periodLabel: 1948–1996
    institutions:
      - 厚生省 (Ministerium für Gesundheit und Wohlfahrt)
      - 都道府県優生保護審査会 (präfekturale Eugenikschutz-Prüfungsausschüsse)
      - 中央優生保護審査会 (Zentraler Eugenikschutz-Prüfungsausschuss)
    institutionalContext: >-
      Das Gesetz von 1948 erklärte die Verhinderung der Geburt „minderwertiger Nachkommen“ aus eugenischer Sicht zum Ziel.
      Das Ministerium sandte Durchführungserlasse an die Präfekturgouverneure; präfekturale Ausschüsse prüften Zwangsfälle,
      ein Zentralorgan übernahm Aufsichts- oder Überprüfungsaufgaben, und bestimmte Ärzte und Einrichtungen führten die
      Eingriffe aus. Für manche Kategorien verlangte das Gesetz Zustimmung in einem Kontext, der nach dem späteren Urteil
      des Supreme Court keine freiwillige eugenische Operation ermöglichen konnte.
    consequences:
      - Rund 25.000 Menschen wurden nach dem früheren Eugenic Protection Act sterilisierenden Eingriffen unterzogen
      - Menschen mit bestimmten Behinderungen oder Krankheiten sowie nach manchen Vorschriften ihre Ehepartner oder Verwandten wurden ausgesondert
      - Präfekturale Ausschüsse überführten gesetzliche Behindertenkategorien in Genehmigungen für Zwangseingriffe
      - Staatliche Durchführungshinweise erlaubten bei manchen genehmigten Operationen Fesselung oder Täuschung
      - Betroffene stießen jahrzehntelang auf Hindernisse, bevor der Supreme Court die Staatshaftung anerkannte
    summary: >-
      Japans Eugenic Protection Act galt von 1948 bis zur Entfernung seiner eugenischen Bestimmungen 1996. Er stufte
      Menschen mit bestimmten Krankheiten oder Behinderungen ausdrücklich als unerwünschte Fortpflanzungskategorie ein
      und erlaubte sterilisierende Eingriffe durch nationale Weisungen, präfekturale Prüfung und medizinische Umsetzung.
      Die Regierung bezeichnet heute etwa 25.000 Menschen als Opfer solcher Eingriffe nach dem früheren Gesetz.
    mechanism:
      summary: >-
        Gesetzliche Behindertenlisten, Ministerialerlasse, Entscheidungen präfekturaler Ausschüsse und bestimmte
        medizinische Anbieter machten aus einem eugenischen Bevölkerungsziel genehmigte und in festgelegten Fällen
        körperlich erzwungene Operationen.
    institutionalCorrection:
      periodLabel: 1996–2025
      action: Japan strich 1996 die eugenischen Bestimmungen; 2024 erklärte der Supreme Court sie für verfassungswidrig, und das Parlament verabschiedete ein neues Entschuldigungs- und Entschädigungsgesetz, das 2025 in Kraft trat.
      summary: >-
        Der Große Senat erklärte das eugenische Ziel für unvertretbar, bewertete sowohl Zwangs- als auch nominell
        einvernehmliche Vorschriften als Verletzung von Würde und Gleichheit und verweigerte dem Staat die Berufung auf die
        alte Ausschlussfrist. Das Gesetz von 2024 übernahm Verantwortung, bat um Entschuldigung und schuf Entschädigung für
        Betroffene, Ehepartner und bestimmte Hinterbliebene.
  - id: czechoslovakia-1972-1989
    polity: Tschechoslowakei
    periodLabel: 1972–1989
    institutions:
      - Ministerstvo zdravotnictví České socialistické republiky
      - Ministerstvo zdravotnictví Slovenské socialistické republiky
      - Sterilizační komise nach den Richtlinien von 1972
    institutionalContext: >-
      Parallele tschechische und slowakische Regeln übertrugen Entscheidungen an Sterilisationskommissionen in
      Krankenhäusern und enthielten genetische Indikationen. Schriftlich verlangten sie Antrag oder Zustimmung; medizinisches
      und sozialfürsorgerisches Personal prägte jedoch Zugang, Information und Anreize. Spätere Untersuchungen fanden
      Sterilisationen ohne wirksame informierte Einwilligung und einen breiteren staatlich gestützten Rahmen, in dem Romnja
      unverhältnismäßig betroffen waren. Rechtswidrige Praxis setzte sich auch nach dem Sozialismus auf dem Gebiet der
      späteren Tschechischen Republik fort.
    consequences:
      - Romnja wurden unverhältnismäßig häufig ohne volle und informierte Einwilligung sterilisiert
      - Fürsorgedruck und finanzielle Anreize konnten formal unterschriebene Anträge zu Zwang machen
      - Krankenhauskommissionen und Ärzte konnten soziale und ethnische Urteile in unumkehrbare Eingriffe überführen
      - Fehlende oder vernichtete Krankenakten erschwerten später Nachweis und Entschädigung
      - Die tschechische Abhilfe erfasst rechtswidrige Eingriffe auf heutigem tschechischem Gebiet, während die Episode einen früheren Bundesstaat betraf
    summary: >-
      Die Sterilisationsrichtlinien von 1972 waren formal ethnisch neutral und beschrieben Einwilligungsverfahren, doch
      ihre Verwaltung garantierte keine freie und informierte Entscheidung. Ärzte und Sozialarbeiter wandten Sterilisation
      unverhältnismäßig und unter Zwang gegen Romnja an. Historische Forschung führt die Praxis auf Kontinuitäten zwischen
      Eugenik, medizinischer Genetik sowie sozialistischer Bevölkerungs- und Sozialpolitik zurück; die Untersuchung des
      tschechischen Ombudsmanns dokumentierte rechtswidrige Eingriffe und systemische Mängel der Einwilligung.
    mechanism:
      summary: >-
        Richtlinien der Gesundheitsministerien schufen medizinische Indikationen und Krankenhauskommissionen; Ärzte und
        Fürsorgepersonal kontrollierten Information, Anträge und Leistungen in einer Weise, die nominelle Zustimmung in
        Zwang verwandeln konnte.
    institutionalCorrection:
      periodLabel: 2009–heute
      action: Die tschechische Regierung entschuldigte sich 2009; ein seit 2022 geltendes Gesetz schuf eine Pauschalentschädigung für rechtswidrige Sterilisationen von 1966 bis 2012 auf dem Gebiet der heutigen Tschechischen Republik.
      summary: >-
        Der tschechische Nachfolgestaat schuf Anerkennung und Abhilfe, doch die Antwort ist räumlich enger als das frühere
        tschechoslowakische System und ihre Verwaltung bleibt mangelhaft. Der Ombudsmann dokumentierte verspätete
        Entscheidungen, übermäßig formale Forderungen nach fehlenden Krankenakten und weitere Hürden im Entschädigungsverfahren.
evidence:
  - id: eugenics-nhgri-proposition
    note: >-
      Das staatliche Genomforschungsinstitut beschreibt das falsche Modell einfacher Vererbung von Intelligenz,
      Sozialverhalten und komplexen Krankheiten sowie seine Nutzung zur unfreiwilligen Sterilisation als untauglich etikettierter Menschen.
  - id: eugenics-nhgri-correction
    note: >-
      Erläutert, weshalb die eugenische Zuchtwahltheorie und ihre vereinfachende mendelsche Behandlung komplexer Merkmale wissenschaftlich falsch sind.
  - id: eugenics-who-correction
    note: >-
      Gemeinsamer UN-Standard: Sterilisation muss auf der vollen, freien und informierten Entscheidung der betroffenen
      Person beruhen und frei von Diskriminierung, Zwang und Gewalt sein.
  - id: eugenics-reilly-impact
    note: >-
      Länderübergreifende Übersicht zu Ausmaß und gemeinsamer eugenischer Erbbegründung der Programme in den USA und Deutschland.
  - id: eugenics-us-reilly-consequences
    note: >-
      Behandelt Indianas Gesetz von 1907, die Supreme-Court-Entscheidung von 1927, die institutionelle Zielgruppe und ungefähr 60.000 Sterilisationen in den USA.
  - id: eugenics-us-nih-context
    note: >-
      NIH-gefördertes Forschungsprojekt über einzelstaatliche Eugenikgesetze und die demografische Analyse ihrer diskriminierenden Umsetzung in fünf Bundesstaaten.
  - id: eugenics-us-lva-carrier
    note: >-
      Benennt Virginias Parlament, die staatliche Anstalt, die Musterfallstrategie und die Rolle des Supreme Court für die landesweite Wirkung des Systems.
  - id: eugenics-us-buck-mechanism
    note: >-
      Primärurteil, das Virginias Anhörungs- und Anordnungsverfahren bestätigte und Carrie Bucks Zwangssterilisation zuließ.
  - id: eugenics-us-nhgri-context
    note: >-
      Verknüpft US-amerikanische Eugenikklassifikationen mit Rassismus, Ableismus und mindestens 60.000 unfreiwilligen Sterilisationen bis in die 1970er-Jahre.
  - id: eugenics-us-resolution-correction
    note: >-
      Amtliche Resolution über Virginias tiefes Bedauern; sie bezeichnet das Sterilisationsgesetz als falsche, diskreditierte Wissenschaft und Schadensquelle.
  - id: eugenics-us-compensation-correction
    note: >-
      Amtliche Regel über 25.000 US-Dollar Entschädigung je bestätigtem berechtigtem Antrag, vorbehaltlich verfügbarer Mittel.
  - id: eugenics-germany-ushmm-carrier
    note: >-
      Dokumentiert das Gesetz vom Juli 1933 und die staatliche Einstufung bestimmter körperlicher und psychischer Zustände als Erbkrankheit.
  - id: eugenics-germany-ushmm-consequences
  - id: eugenics-germany-archive-carrier
    note: >-
      Amtliche Archivbeschreibung zu Gesundheitsämtern, Amtsärzten, Erbgesundheits- und Obergerichten sowie Weisungen des Innenministeriums in einem regionalen Aktenbestand.
  - id: eugenics-germany-archive-mechanism
  - id: eugenics-germany-reilly-consequences
    note: >-
      Forschungsübersicht mit der Schätzung, dass deutsche Erbgesundheitsgerichte mindestens 400.000 Sterilisationen genehmigten.
  - id: eugenics-germany-law-mechanism
    note: >-
      Primärtext zu Diagnosegründen, Gerichtsbesetzung, Beschwerdeverfahren und zwangsweiser Vollstreckung rechtskräftiger Anordnungen.
  - id: eugenics-germany-annulment-correction
    note: >-
      Gesetzgebungsunterlage, die die Sterilisationen als nationalsozialistisches Unrecht einordnet und die Aufhebung fortwirkender Gerichtsbeschlüsse vorsieht.
  - id: eugenics-sweden-sou-carrier
    note: >-
      Amtliche Untersuchung zur zentralen Genehmigungsbehörde und den klinischen, anstaltsbezogenen und fürsorgerischen Akteuren hinter Antrag und Umsetzung.
  - id: eugenics-sweden-sou-mechanism
    note: >-
      Zeigt, wie Anstaltsunterbringung und Bedingungen für Schwangerschaftsabbruch oder Entlassung trotz Unterschrift Zwang erzeugen konnten.
  - id: eugenics-sweden-sou-consequences
    note: >-
      Verzeichnet 62.888 Eingriffe und analysiert Zwang, Freiwilligkeit und Druck, statt alle Verfahren gleichzusetzen.
  - id: eugenics-sweden-europe-review-context
    note: >-
      Vergleichende Übersicht mit der breiteren Schätzung von rund 32.000 unfreiwilligen schwedischen Sterilisationen und späterer Anerkennung und Entschädigung.
  - id: eugenics-sweden-bioethics-context
    note: >-
      Zeitgenössische ethische Analyse, die Autonomie-, Vorsichts- und biologisch-skeptische Argumente zur Bewertung der schwedischen Politik unterscheidet.
  - id: eugenics-sweden-government-consequences
    note: >-
      Regierungsbericht mit etwa 31.000 freiwilligen Fällen, knapp 6.000 ohne Zustimmung, 15.000 unter zwangähnlichen Umständen, gut 6.000 mit Druck und gut 4.000 nicht klassifizierbaren Fällen.
  - id: eugenics-sweden-government-correction
    note: >-
      Beschreibt Entschädigungsgesetz von 1999, Anspruchskriterien, amtliche Untersuchung und frühe Entscheidungen des Entschädigungsausschusses.
  - id: eugenics-japan-reproductive-context
    note: >-
