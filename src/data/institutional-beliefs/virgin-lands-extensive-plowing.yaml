title: Extensive plowing of the Virgin Lands
claim: Rapidly plowing vast semi-arid steppe grasslands and maximizing the area under grain was treated as a sustainable route to large, continuing increases in Soviet food production.
currentUnderstanding: Semi-arid steppe farming is constrained by rainfall, wind erosion, soil fertility, and the need for locally adapted rotations and fallow. Expanding cultivation can raise output temporarily, but relentless plowing and reduced fallow on fragile dryland soils can deplete fertility and expose topsoil to severe erosion.
category: Agriculture and environmental management
reviewedAt: 2026-08-22
