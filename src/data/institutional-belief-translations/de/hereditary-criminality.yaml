locale: de
entryId: hereditary-criminality
sourceReviewedAt: 2026-08-23
title: Erbliche Kriminalität
claim: Die Zugehörigkeit zu bestimmten Kasten oder „Stämmen“ wurde als Hinweis auf eine erbliche Neigung zu Kriminalität
  behandelt.
currentUnderstanding: Kriminelles Verhalten ist keine erbliche Eigenschaft einer Kaste, eines „Stammes“ oder einer
  ethnischen Gemeinschaft. Es wird von individuellen Umständen, Institutionen, Gelegenheiten, sozialen Bedingungen
  und vielen weiteren Faktoren geprägt; Abstammung begründet keine kollektive kriminelle Veranlagung.
episodes:
- id: british-india-1871-1947
  polity: Britisch-Indien
  institutions:
  - Governor-General of India in Council
  - Punjab Criminal Tribes Department
  - District Magistrates
  - District Superintendents of Police
  summary: 'Die Criminal Tribes Acts ermöglichten es den Kolonialbehörden, ganze Gemeinschaften als Gruppen einzustufen,
    deren Kriminalität als erblich galt. Der Verwaltungsapparat war im Gesetz konkret benannt: Provinzregierungen
    beziehungsweise „Local Governments“ betrieben die Einstufung und Umsetzung, District Magistrates führten Register
    und Bewegungsauflagen, die Polizei setzte sie durch, und im Punjab überwachte ab 1917 ein eigenes Criminal Tribes
    Department das System. Menschen konnten allein aufgrund ihrer Gruppenzugehörigkeit registriert, überwacht, in
    ihrer Bewegungsfreiheit eingeschränkt und in Siedlungen gezwungen werden.'
  consequences:
  - Kollektive Registrierung und Überwachung
  - Einschränkung der Bewegungsfreiheit
  - Zwangsansiedlung und „Reform“
  institutionalContext: Die Criminal Tribes Acts übertrugen die Durchführung den provinziellen „Local Governments“
    und Distriktbeamten. Registrierung, Überwachung, Aufenthaltsbeschränkungen und Vollzug liefen daher über einen
    verteilten kolonialen Verwaltungs- und Polizeiapparat; im Punjab bestand später mit dem Punjab Criminal Tribes
    Department eine eigene Fachbehörde.
