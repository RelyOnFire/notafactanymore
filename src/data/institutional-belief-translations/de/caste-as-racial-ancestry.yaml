locale: de
entryId: caste-as-racial-ancestry
sourceReviewedAt: 2026-08-22
title: Kaste als rassische Abstammung
claim: Der Rang einer Kaste wurde als Ausdruck messbarer rassischer Abstammung behandelt; Körpermaße wie der Nasenindex dienten dazu, Menschen in Indien verschiedenen „Rassentypen“ zuzuordnen.
currentUnderstanding: Kaste ist ein historisches und soziales System, keine biologische Hierarchie von „Rassen“. Langjährige Endogamie hat zwar gewisse genetische Strukturen zwischen südasiatischen Bevölkerungsgruppen erzeugt, doch Schädel- oder Nasenmaße definieren keine diskreten menschlichen Rassen und bestätigen weder Kastenrang noch menschlichen Wert als biologisches Maß.
episodes:
  - id: british-india-1891-1903
    polity: Britisch-Indien
    summary: Herbert Risleys anthropometrische Arbeiten ordneten Bevölkerungen Indiens anhand von Messgrößen wie dem Nasenindex verschiedenen „Rassentypen“ zu. Als Census Commissioner übertrug Risley dieses Schema in den Zensus von 1901, dessen Kapitel zu Kaste und ethnografische Anhänge Körpermaße als Evidenz für Rasse und Kastenhierarchie behandelten.
    consequences:
      - Rassische Klassifizierung von Kastengruppen
      - Anthropometrische Datenerhebung
      - Amtliche ethnografische Kategorien
