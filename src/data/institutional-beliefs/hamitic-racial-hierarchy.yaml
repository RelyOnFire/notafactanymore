title: Hamitic racial hierarchy
claim: Tutsi were treated as a foreign “Hamitic” race naturally superior to Hutu in intelligence, political ability, and civilization.
currentUnderstanding: The colonial Hamitic hierarchy was scientific racism, not a valid account of human populations. Hutu and Tutsi share language, culture, and a deeply intertwined regional history; neither group constitutes a biologically superior or inferior race.
category: Race and anthropology
reviewedAt: 2026-08-22
episodes:
  - id: belgian-rwanda-1920-1959
    polity: Belgian Rwanda
    region: Africa
    startYear: 1920
    endYear: 1959
    periodLabel: 1920s–1959
    strength: policy-basis
    institutionTypes: [government, education]
    institutions:
      - Belgian colonial administration
      - Colonial education system
      - Catholic mission schools
    consequences:
      - Ethnic classification on identity cards
      - Unequal access to education and administration
      - Racialized political hierarchy
    summary: Belgian rule reinforced a racialized hierarchy that portrayed Tutsi as foreign, more intelligent, and naturally suited to rule. Colonial education and administration privileged Tutsi, while official identity cards made Hutu, Tutsi, and Twa categories increasingly rigid and permanent.
    sources:
      - title: Ethnicity and Genocide — The Case of Rwanda
        url: https://www.un.org/sites/un2.un.org/files/preventing_ethnic_genocide_nov2024.pdf
        publisher: United Nations
        note: Describes Belgian adoption of the fictitious Hamitic hypothesis, the claim of Tutsi superiority, discriminatory education and administration, and the fixing of ethnicity on identity cards.
      - title: UNAMIR — Historical Background
        url: https://peacekeeping.un.org/sites/default/files/past/unamirFT.htm
        publisher: United Nations Peacekeeping
        note: Explains how Belgian authorities rigidified ethnic categories through identity cards and systematically favored Tutsi in education and civil administration.
