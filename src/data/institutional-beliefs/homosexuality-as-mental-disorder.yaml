title: Homosexuality as a mental disorder
claim: Homosexuality was treated as a diagnosable mental or sexual disorder within the official medical classification system.
currentUnderstanding: Homosexuality is not a disease, mental disorder, sexual disorder, or perversion. Same-sex attraction is part of normal variation in human sexuality, and attempts to pathologize sexual orientation have no valid medical basis.
category: Psychiatry and sexuality
reviewedAt: 2026-08-23
episodes:
  - id: brazil-1979-1985
    polity: Brazil
    region: Latin America
    startYear: 1979
    endYear: 1985
