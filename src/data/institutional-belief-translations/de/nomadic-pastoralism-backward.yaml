entryId: nomadic-pastoralism-backward
sourceReviewedAt: 2026-08-22
title: Nomadische Viehwirtschaft als rückständige Wirtschaftsform
claim: Die nomadische Viehwirtschaft der Kasachen wurde als von Natur aus rückständig und ineffizient behandelt; erzwungene Sesshaftmachung und Kollektivierung sollten Produktivität und sozialistische Modernisierung steigern.
currentUnderstanding: Mobile Viehwirtschaft kann eine sehr gut angepasste Nutzung trockener und schwankender Graslandschaften sein, weil saisonale Wanderungen Viehbestände an wechselndes Wasser- und Futterangebot anpassen. Landwirtschaftliche Systeme müssen zur lokalen Ökologie passen; die erzwungene Sesshaftmachung mobiler Hirten in ungeeigneten Produktions- und Abgabesystemen kann Produktivität vernichten statt erhöhen.
episodes:
  - id: soviet-kazakhstan-1928-1933
    polity: Sowjetisches Kasachstan
    summary: Ab 1928 behandelte die sowjetische Politik die kasachische Weidenomadenwirtschaft zunehmend als unvereinbar mit schneller landwirtschaftlicher Modernisierung und sozialistischer Organisation. Pläne zur massenhaften Sesshaftmachung wurden trotz Warnungen vor den Bedingungen der Steppe mit Zwangskollektivierung und hohen Viehabgaben verbunden. Die folgende Katastrophe hatte mehrere Ursachen, doch diese Maßnahmen zerstörten große Teile der pastoralen Wirtschaft; die Hungersnot von 1930 bis 1933 tötete ungefähr ein Drittel der kasachischen Bevölkerung.
    consequences:
      - Erzwungene Sesshaftmachung
      - Beschlagnahmung und Zusammenbruch der Viehbestände
      - Zerstörung pastoraler Lebensgrundlagen
      - Massenhungersnot und Vertreibung
