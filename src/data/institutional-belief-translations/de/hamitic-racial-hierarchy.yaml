schemaVersion: 2
locale: de
entryId: hamitic-racial-hierarchy
sourceReviewedAt: '2026-08-23'
title: Hamitische Rassenhierarchie
proposition:
  summary: >-
    Tutsi wurden als fremde „hamitische Rasse“ behandelt, die Hutu von Natur aus an Intelligenz, politischer Befähigung
    und Zivilisationsgrad überlegen sei.
correction:
  summary: >-
    Die koloniale hamitische Hierarchie war wissenschaftlicher Rassismus und keine gültige Beschreibung menschlicher
    Populationen. Hutu und Tutsi teilen Sprache, Kultur und eine eng verflochtene regionale Geschichte; keine der beiden
    Gruppen bildet eine biologisch über- oder unterlegene „Rasse“.
episodes:
  - id: belgian-rwanda-1920-1959
    polity: Belgisch-Ruanda
    institutions:
      - Résidence du Ruanda
      - Vice-Gouvernement général du Ruanda-Urundi
      - Groupe Scolaire d'Astrida
      - Vicariat apostolique du Rwanda
    institutionalContext: >-
      Belgien verwaltete Ruanda über die Résidence du Ruanda innerhalb des Vice-Gouvernement général du Ruanda-Urundi.
      Katholische Missionen trugen einen großen Teil des formalen Bildungswesens; das Groupe Scolaire d'Astrida bildete
      künftige Verwaltungseliten aus. Apostolischer Vikar Léon Classe verteidigte die hamitische Hierarchie öffentlich
      und nahm Einfluss auf koloniale Personalentscheidungen. Hinter der Politik standen damit benennbare staatliche und
      kirchliche Institutionen – nicht bloß eine abstrakte „Kolonialverwaltung“.
    summary: >-
      Die belgische Kolonialherrschaft verstärkte eine rassifizierte Hierarchie, in der Tutsi als fremd, intelligenter
      und von Natur aus zum Herrschen geeignet dargestellt wurden. Über die Résidence du Ruanda, die Verwaltung
      Ruanda-Urundis, katholische Bildungseinrichtungen und die Elitenausbildung in Astrida wurde diese Vorstellung
      institutionell verankert; amtliche Ausweise und Verwaltungspraxis machten die Kategorien Hutu, Tutsi und Twa zunehmend starr.
    consequences:
      - Ethnische Klassifizierung in amtlichen Ausweisen
      - Bevorzugter Zugang von Tutsi zu Elitenbildung und Verwaltungsämtern
      - Administrative Neuordnung entlang einer rassifizierten Hutu-Tutsi-Hierarchie
    mechanism:
      summary: >-
        Koloniale und kirchliche Institutionen verankerten die hamitische Hierarchie durch Identitätsklassifikation,
        bevorzugte Bildung und administrative Auswahl und machten damit eine Rassentheorie zu Verwaltungspraxis und Elitenbildung.
    institutionalCorrection:
      summary: >-
        Politische Ausrichtung und Kolonialordnung änderten sich ab 1959 grundlegend. Ein datierter formeller Widerruf der
        hamitischen Rassentheorie selbst durch die belgische Kolonialverwaltung oder kirchliche Träger ist im vorhandenen Nachweis jedoch nicht belegt.
evidence:
  - id: hamitic-un-proposition
    note: >-
      Beschreibt die belgische Übernahme der fiktiven hamitischen Hypothese, die Behauptung einer Tutsi-Überlegenheit,
      diskriminierende Bildung und Verwaltung sowie die Fixierung ethnischer Zugehörigkeit in Ausweisdokumenten.
  - id: hamitic-un-correction
  - id: hamitic-belgian-archives-carrier
    note: >-
      Belegt das formelle Vice-Gouvernement général du Ruanda-Urundi und den erhaltenen belgischen kolonialen Verwaltungsbestand für 1916–1962.
  - id: hamitic-sciencespo-mechanism
    note: >-
      Identifiziert das Groupe Scolaire d'Astrida, die katholische Bildungsrolle, die Verteidigung der hamitischen
      Hypothese durch den Apostolischen Vikar Léon Classe und seinen Einfluss auf koloniale Personalpolitik.
  - id: hamitic-unamir-consequences
    note: >-
      Erklärt, wie belgische Behörden ethnische Kategorien durch Ausweise verhärteten und Tutsi systematisch in Bildung und Zivilverwaltung bevorzugten.
