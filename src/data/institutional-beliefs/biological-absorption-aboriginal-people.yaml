title: Biological absorption of Aboriginal people
claim: Aboriginal people of mixed descent were treated as a population that could be made to disappear through controlled intermarriage and assimilation into white Australia.
currentUnderstanding: Aboriginal and Torres Strait Islander peoples are not biologically inferior populations awaiting absorption into a superior race. Indigenous identity, kinship, culture, and political belonging cannot be reduced to skin colour or fractions of ancestry, and state control over marriage, children, and family life caused profound and lasting harm.
category: Race and colonial administration
reviewedAt: 2026-08-22
episodes:
  - id: australia-1933-1939
    polity: Australia
    region: Oceania
    startYear: 1933
    endYear: 1939
    periodLabel: 1933–late 1930s
    strength: policy-basis
    institutionTypes: [government]
    institutions:
      - Commonwealth Department of the Interior
      - Western Australian Native Affairs administration
      - Northern Territory Chief Protector of Aboriginals
      - Commonwealth-State Aboriginal Welfare Conference
    consequences:
      - State control over marriage and family life
      - Removal and institutionalization of children
      - Biological and cultural assimilation
      - Suppression of Indigenous identity
    summary: "In the 1930s, senior Commonwealth and state officials promoted “biological absorption”: people classified as being of mixed Aboriginal descent would be absorbed into the white population through intermarriage while Aboriginal distinctiveness was expected to disappear. The 1937 Commonwealth-State conference formally resolved that the destiny of people “not of the full blood” lay in their ultimate absorption and that government efforts should be directed toward that end."
    sources:
      - title: Aboriginal Welfare — Initial Conference of Commonwealth and State Aboriginal Authorities, 1937
        url: https://aiatsis.gov.au/sites/default/files/catalogue_resources/20663.pdf
        publisher: Commonwealth of Australia / AIATSIS
        note: Primary conference record containing the formal resolution that Aboriginal people classified as not “full blood” should ultimately be absorbed into the wider population.
      - title: Bringing Them Home — Chapter 2, National Overview
        url: https://humanrights.gov.au/bringing-them-home/the-report/part-2-tracing-the-history/chapter-2-national-overview.html
        publisher: Australian Human Rights Commission
        note: Describes Neville's biological model of absorption, the 1937 conference, and the relationship between assimilation policy and the removal of Indigenous children.
