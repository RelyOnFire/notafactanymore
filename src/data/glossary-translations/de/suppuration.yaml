entryId: suppuration
sourceReviewedAt: '2026-08-21'
term: Eiterung
aliases:
- Suppuration
- eitrig
shortDefinition: Die Bildung oder Absonderung von Eiter, meist als Teil einer Entzündungsreaktion auf Infektion oder
  Gewebeschädigung.
longDefinition: Eiterung oder Suppuration ist die Bildung von Eiter, einer Flüssigkeit aus Immunzellen, Gewebetrümmern,
  Mikroorganismen und Proteinen. Historisch galt bestimmter Eiter in manchen chirurgischen Traditionen als günstiger
  oder sogar notwendiger Teil der Wundheilung. Keimtheorie und Antisepsis deuteten Eiterung dagegen als etwas, das bei
  Infektionen möglichst verhindert oder kontrolliert werden sollte.
