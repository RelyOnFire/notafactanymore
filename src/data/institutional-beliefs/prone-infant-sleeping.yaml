evidence:
  - id: prone-review-proposition
    sourceId: prone-sleep-systematic-review
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: Abstract; pp. 875–877, Historical review and Table 1
    note: >-
      The review found that infant-care books and pamphlets recommended front sleeping between 1943 and 1988 on the basis
      of untested theory, including fear of choking on vomit. Its historical sample was drawn from UK library collections
      and included mixed recommendations, so it does not establish one universal practice.
  - id: prone-nhmrc-proposition
    sourceId: nhmrc-safer-infant-sleeping
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: Grants and Investment, paragraph 1
    note: >-
      NHMRC describes a rise in prone sleeping among healthy infants across many Western countries from the late 1960s
      into the 1980s, attributes it to nonscientifically tested advice and records delayed medical acceptance of the risk.
  - id: prone-east-germany-proposition
    sourceId: east-germany-sids-history
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: Results, historical-investigation paragraph and following 1971–1972 paragraph
    note: >-
      The archival and interview study states that pediatricians in the GDR followed the international prone-sleep
      recommendation and that seven infants died while sleeping in that position in day care in 1971.
  - id: prone-modern-review-correction
    sourceId: healthy-newborn-sleep-review
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Abstract; Results, SIDS subsection; Discussion; Conclusions
    note: >-
      The 2022 review pooled 26 observational studies with 59,332 infants. Supine sleep was associated with lower SIDS
      odds than nonsupine sleep (OR 0.51, 95% CI 0.42–0.61), but the authors rated the evidence very low certainty because
      most studies had serious risk of bias and substantial heterogeneity.
  - id: prone-aap-correction
    sourceId: aap-safe-sleep-2022
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: Recommendations to Reduce the Risk of Sleep-Related Infant Deaths, item 1 and its bullets
    note: >-
      The AAP recommends supine placement for every sleep until age one, says side sleep is unsafe, and states that a flat
      supine position does not increase choking or aspiration even with gastroesophageal reflux. It separately recommends
      supervised, awake tummy time.
  - id: prone-awmf-correction
    sourceId: awmf-sids-guideline-2022
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: pp. 5–6, Prävention, recommendations and notes
    note: >-
      The German multidisciplinary guideline recommends back sleep on a firm horizontal surface for all newborns and
      distinguishes this from short periods of observed prone positioning while awake.
  - id: prone-review-impact
    sourceId: prone-sleep-systematic-review
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: Abstract, Results and Conclusions; cumulative meta-analysis figures
    note: >-
      The retrospective cumulative analysis found a statistically significant association by 1970 for prone versus
      supine sleep (pooled OR 2.93, 95% CI 1.15–7.47). This dates pooled evidence in hindsight, not contemporary consensus.
