term: Cortical map
aliases:
- cortical maps
- sensory map
- motor map
shortDefinition: An organized representation in the cerebral cortex in which different regions correspond to different
  sensations, body areas, movements, or other information.
longDefinition: A cortical map describes the orderly way information is represented across the cerebral cortex.
  Sensory and motor maps, for example, associate neighboring cortical regions with particular parts of the body
  or sensory input. These maps are not perfectly fixed and can reorganize when inputs, behavior, or injury change.
relatedTerms:
- neuroplasticity
reviewedAt: '2026-08-21'
sources:
- title: 'Adult Neuroplasticity: More Than 40 Years of Research'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4026979/
  publisher: PubMed Central
  note: Reviews adult functional reorganization, including experience- and injury-related changes in sensory representations.
