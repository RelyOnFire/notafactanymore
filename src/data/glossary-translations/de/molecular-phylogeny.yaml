entryId: molecular-phylogeny
sourceReviewedAt: '2026-08-21'
term: Molekulare Phylogenie
aliases: []
shortDefinition: Die Rekonstruktion evolutionärer Verwandtschaft mithilfe molekularer Daten wie DNA-, RNA- oder Proteinsequenzen.
longDefinition: Die molekulare Phylogenie vergleicht vererbte Sequenzen, um abzuschätzen, wie Organismen miteinander verwandt sind und wo sich ihre Abstammungslinien getrennt haben.
