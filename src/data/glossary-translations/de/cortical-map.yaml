locale: de
entryId: cortical-map
sourceReviewedAt: '2026-08-21'
term: Kortikale Karte
aliases:
- kortikale Karten
- sensorische Karte
- motorische Karte
shortDefinition: Eine geordnete Repräsentation in der Großhirnrinde, bei der verschiedene Bereiche bestimmten Sinneseindrücken,
  Körperregionen, Bewegungen oder anderen Informationen entsprechen.
longDefinition: Eine kortikale Karte beschreibt, wie Informationen räumlich geordnet in der Großhirnrinde repräsentiert
  werden. Sensorische und motorische Karten verbinden etwa bestimmte Kortexbereiche mit Körperregionen oder Sinneseingängen.
  Solche Karten sind nicht vollständig starr und können sich bei veränderten Eingängen, Verhalten oder Verletzungen
  reorganisieren.
