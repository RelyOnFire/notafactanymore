    summary: The 1933 Law for the Prevention of Hereditarily Diseased Offspring made eugenic judgments part of state law. Hereditary Health Courts authorized hundreds of thousands of compulsory sterilizations, embedding racial-hygiene ideas in medicine and administration.
    sources:
      - title: Laws and Decrees — Sterilization Law
        url: https://www.ushmm.org/m/pdfs/2019Laws_and_Decrees.pdf
        publisher: United States Holocaust Memorial Museum
        note: Documents the July 1933 sterilization law and its use against people classified as having hereditary physical or mental conditions.
      - title: Eugenics and Involuntary Sterilization, 1907–2015
        url: https://pubmed.ncbi.nlm.nih.gov/26322647/
        publisher: Annual Review of Genomics and Human Genetics
        note: Summarizes the scale of compulsory sterilization under German Hereditary Health Courts.
