term: Procellarum KREEP Terrane
aliases:
- PKT
shortDefinition: A large region on the Moon's near side with unusually high concentrations of KREEP-associated elements,
  including thorium.
longDefinition: The Procellarum KREEP Terrane is a geochemically distinctive region covering much of the Moon's western
  near side. Remote sensing found high abundances of thorium and other KREEP-associated elements there, and many young
  mare basalts occur within the region. That geographic association helped motivate the idea that KREEP-related heat
  was important for prolonged lunar volcanism.
relatedTerms:
- kreep
- depleted-mantle-source
reviewedAt: '2026-08-21'
sources:
- title: Non-KREEP origin for Chang’e-5 basalts in the Procellarum KREEP Terrane
  url: https://doi.org/10.1038/s41586-021-04119-5
  publisher: Nature
  note: Places the Chang'e-5 landing region within the Procellarum KREEP Terrane and evaluates the connection between
    the terrane and young volcanism.
