term: Monotreme
aliases:
- monotremes
shortDefinition: An egg-laying mammal of the group that includes platypuses and echidnas.
longDefinition: Monotremes are mammals that reproduce by laying eggs rather than giving live birth. Living monotremes
  are the platypus and echidnas. They possess defining mammalian traits such as hair and milk production while retaining
  an ancestral reproductive mode that differs from marsupials and placental mammals.
