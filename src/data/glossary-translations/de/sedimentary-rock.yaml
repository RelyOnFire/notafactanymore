entryId: sedimentary-rock
sourceReviewedAt: '2026-08-21'
term: Sedimentgestein
aliases:
- Sedimentgesteine
shortDefinition: Gestein, das aus abgelagertem Sediment oder aus im Wasser ausgefälltem Material entsteht und anschließend
  verfestigt wird.
longDefinition: Sedimentgesteine entstehen an oder nahe der Erdoberfläche aus angesammeltem Material. Viele bilden sich,
  wenn Bruchstücke älterer Gesteine abgelagert, überdeckt, verdichtet und zementiert werden; andere entstehen durch Ausfällung
  gelöster Stoffe aus Wasser oder durch biologische Prozesse. Ihre Schichtung kann Hinweise auf frühere Umweltbedingungen
  bewahren.
