- id: virginity-iran-study-carrier
  note: >-
    Die Methodik verortet die Interviews von 2014 in Teheraner Forensikzentren und staatlichen Kliniken. Die Schilderungen
    gerichtlicher Anordnungen und Bescheinigungen liefern den praxisbezogenen institutionellen Beleg, den der
    allgemeine Abstract zur LMO nicht enthält.
- id: virginity-indonesia-police-correction
  note: >-
    Der Artikel von 2021 erklärt ausdrücklich, die Polizei habe Jungfräulichkeitstests eingestellt; der Artikel
    von 2022 wiederholt diese Darstellung. Das stützt eine berichtete Rücknahme der polizeilichen Rekrutierungspraxis,
    ohne eine Überprüfung der Befolgung an jedem Standort zu behaupten.
- id: virginity-indonesia-military-carrier
  note: >-
    Der Bericht nennt alle drei Teilstreitkräfte und beschreibt ihre frühere Rekrutierungspraxis sowie die streitkräfteweite
    Mitteilung. Er stützt die militärischen Träger unabhängig von der polizeispezifischen Untersuchung von 2014.
- id: virginity-indonesia-military-mechanism
  note: >-
    Die Heeresanweisung wird im Kontext früherer Untersuchungen weiblicher Rekrutinnen in den Sicherheitskräften
    erörtert. Das stützt den militärischen Rekrutierungsmechanismus und den beabsichtigten Änderungsumfang, statt
    militärische Verfahren einer Polizeiverordnung zuzuschreiben.
- id: virginity-bangladesh-blast-correction
  note: >-
    Die Chronologie der klagenden Organisation verzeichnet das ergänzende Gesundheitsprotokoll und den Rückzug
    der früheren Verteidigung durch das Ministerium am 10. April 2018. Am 12. April folgten acht Anordnungen des
    High Court, darunter das Verbot des Zwei-Finger-Tests und Einschränkungen von Aussagen über die Sexualgeschichte.
    Das dokumentiert eine formelle Reaktion im bezeichneten Untersuchungskontext.
- id: virginity-georgia-pdo-mechanism
  note: >-
    Die Abschnitte 3.5–3.6 dokumentieren Untersuchungsanordnungen und Versuche von Ermittlern oder Staatsanwälten,
    aus Hymenbefunden auf Penetration zu schließen, auch bei Anordnungen ohne entsprechenden Vorwurf. Sie belegen
    die ungültige beweisbezogene Schlussfolgerung getrennt von einer späteren Leistungsbeschreibung zu Verletzungsuntersuchungen.
- id: virginity-pakistan-lhc-carrier
  note: >-
    Das Primärurteil benennt Punjabs Gesundheits- und Gerichtsmedizinanweisungen einschließlich der Vorgaben des
    Surgeon Medico Legal von 2015 als operative Grundlage der Tests auf angebliche Jungfräulichkeit. Es unterscheidet
    die Nichtverwendung durch die Punjab Forensic Science Agency und die korrigierende Rolle des Gerichts. Die
    Schlussabsätze erklären die einschlägigen Vorgaben für unwirksam und trennen notwendige medizinische Beurteilung
    von der widerlegten Schlussfolgerung.
- id: virginity-pakistan-lhc-mechanism
  note: >-
    Die Absätze 6–7 beschreiben die gerichtsmedizinischen Anweisungen und Formulare für Untersuchungen; die spätere
    Analyse erläutert ihre Verwendung zur Beurteilung vermeintlicher Jungfräulichkeit. Der maßgebliche Verwaltungsmechanismus
    besteht in der Vorgabe und ihrem beweisbezogenen Rückschluss, nicht in jeder klinisch notwendigen Untersuchung
    einer betroffenen Person.
- id: virginity-pakistan-lhc-consequences
  note: >-
    Das Urteil erörtert invasive Tests, Aussagen zur Sexualgeschichte und ihre Unvereinbarkeit mit Würde, Privatsphäre
    und körperlicher Integrität. Es stützt das dokumentierte Verfahren und das Beweisrisiko, liefert aber keine
    gemessene Zahl von Urteilen oder anderen rechtlichen Folgen, die durch diese Tests verursacht wurden.
- id: virginity-pakistan-lhc-correction
  note: >-
    Die Schlussabsätze, insbesondere 32–33, erklären Jungfräulichkeitstests durch Zwei-Finger- oder Hymenuntersuchung
    für rechtswidrig und verfassungswidrig und beseitigen die einschlägigen Teile der gerichtsmedizinischen Anweisungen
    und Richtlinien. Die Entscheidung betrifft die Feststellung angeblicher Jungfräulichkeit; sie verbietet keine
    medizinisch notwendige Beurteilung.
- id: virginity-pakistan-act-correction
  note: >-
    Paragraf 13 Absatz 1 untersagt Zwei-Finger-Jungfräulichkeitstests bei gerichtsmedizinischen Untersuchungen
    von Opfern der erfassten Straftaten und entzieht ihnen Beweiswert. Paragraf 1 bestimmt die landesweite räumliche
    Geltung und einen gesonderten Mechanismus für das Inkrafttreten. Das Gesetz liefert die genaue Regel; daraus
    wird weder ein ungeprüftes Inkrafttretensdatum noch eine pauschale spätere Befolgung abgeleitet.
- id: virginity-tajikistan-cedaw-carrier
  note: >-
    Die Delegation nennt das National Centre of Forensic Medicine ausdrücklich unter den Behörden, die solche
    Untersuchungen in Strafverfahren durchführen dürfen. Das ist ein direkter Beleg für den benannten forensischen
    Träger, keine Schlussfolgerung, sämtliche Gesundheitsbehörden hätten die Praxis übernommen.
- id: virginity-tajikistan-cedaw-mechanism
  note: >-
    Die Erklärung benennt die Befugnis in strafrechtlichen Ermittlungen als fortbestehenden amtlichen Weg für
    die Untersuchungen trotz des Verbots in medizinischen Einrichtungen. Sie belegt die erklärte Ermächtigung,
    nicht deren Nutzungshäufigkeit oder die wissenschaftliche Aussagekraft der daraus gezogenen Schlussfolgerung.
- id: virginity-tajikistan-cedaw-consequences
  note: >-
    Stützt die eng formulierte Folge, dass nach der Delegationserklärung im Januar 2024 ein forensischer Weg weiterhin
    erlaubt war. Das Protokoll beschreibt keine einzelnen Verurteilungen, Bescheinigungen oder bezifferten Schäden
    infolge dieser Ausnahme.
