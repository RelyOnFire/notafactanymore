term: Neuroplasticity
aliases:
- neural plasticity
- brain plasticity
shortDefinition: The nervous system's capacity to change its structure, connections, or function in response to
  experience, learning, injury, or other conditions.
longDefinition: Neuroplasticity is the capacity of the nervous system to reorganize. It can involve changes in synaptic
  strength, connectivity, cortical representations, and measurable aspects of brain structure. Plasticity continues
  in adulthood, although its extent depends on age, brain region, experience, injury, disease, and training.
relatedTerms:
- cortical-map
reviewedAt: '2026-08-21'
sources:
- title: Neural Plasticity
  url: https://www.nidcd.nih.gov/glossary/neural-plasticity
  publisher: National Institute on Deafness and Other Communication Disorders
  note: Defines neural plasticity as the nervous system's capacity to adapt to new conditions such as injury.
