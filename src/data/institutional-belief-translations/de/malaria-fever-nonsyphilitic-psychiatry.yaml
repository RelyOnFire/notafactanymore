locale: de
entryId: malaria-fever-nonsyphilitic-psychiatry
sourceReviewedAt: '2026-08-24'
title: Malariafiebertherapie bei nichtsyphilitischen psychiatrischen Erkrankungen
claim: Die absichtliche Infektion psychiatrischer Patientinnen und Patienten mit Malaria und die Auslösung wiederholter
  hoher Fieberschübe wurden als therapeutische Methode bei Schizophrenie, intellektueller Beeinträchtigung, affektiven
  und psychopathischen Störungen sowie weiteren Erkrankungen ohne Neurosyphilis behandelt.
currentUnderstanding: 'Bei Neurosyphilis besaß die Malariafiebertherapie historisch eine andere Grundlage: Hohes
  Fieber konnte Treponema pallidum beeinträchtigen, bevor wirksame Antibiotika verfügbar waren. Daraus folgte jedoch
  keine Wirksamkeit bei Schizophrenie oder anderen nichtsyphilitischen psychiatrischen Erkrankungen. Die Ergebnisse
  solcher Erweiterungen waren historisch uneinheitlich und schlecht begründet; moderne Evidenz stützt eine absichtlich
  herbeigeführte Plasmodium-vivax-Infektion nicht als psychiatrische Therapie. Malaria ist selbst eine akute Infektionskrankheit
  mit potenziell schweren Komplikationen. Die Korrektur betrifft daher ausdrücklich die Ausweitung über Neurosyphilis
  hinaus.'
impact:
  summary: Die Wiener Universitätspsychiatrie hielt einen übertragbaren Plasmodium-vivax-Stamm vor und infizierte
    psychiatrische Patientinnen und Patienten noch bis in die späten 1960er Jahre absichtlich. Die Mehrheit der
    Malariatherapiefälle in den fünf untersuchten Hauptdiagnosegruppen betraf keine Neurosyphilis. Schizophrenie
    und andere Diagnosen wurden mit einer Methode behandelt, für deren nichtsyphilitische Indikationen die zeitgenössische
    Literatur kaum eine detaillierte Begründung lieferte.
  highlights:
  - value: 609 / 772
    label: Malariatherapiefälle in den fünf Wiener Hauptdiagnosegruppen betrafen andere Diagnosen als Neurosyphilis
  - value: '158'
    label: Schizophreniepatienten wurden im Archiv 1951–1969 als absichtlich mit P. vivax infiziert identifiziert
  - value: '1968'
    label: letzte dokumentierte Malariafiebertherapie an der Wiener Universitätspsychiatrie
  context:
  - Die klassische Anwendung bei progressiver Paralyse beziehungsweise Neurosyphilis war historisch davon zu
    unterscheiden. Vor Penicillin besaß das malariainduzierte Fieber dort eine biologisch plausible und historisch
    relevante antisyphilitische Wirkung, obwohl die Methode riskant war.
  - Die Archivlage beweist nicht, dass jeder nichtsyphilitische Patient ohne aufrichtig gemeinte therapeutische
    Indikation infiziert wurde. Sie zeigt jedoch die breite Ausweitung auf Diagnosen mit kaum detaillierter zeitgenössischer
    Begründung und dass einzelne Patienten zugleich als Träger des Malariastamms dienten.
episodes:
- id: austria-vienna-1951-1968
  polity: Österreich — Wien
  institutions:
  - Psychiatrisch-Neurologische Universitätsklinik Wien
  - Allgemeines Krankenhaus Wien
  - Medizinische Fakultät der Universität Wien
  institutionalContext: Unter Hans Hoff setzte die Wiener Universitätspsychiatrie die Malariafiebertherapie von
    1951 bis 1968 fort und weitete sie weit über Neurosyphilis hinaus aus. Menschen mit Schizophrenie, intellektueller
    Beeinträchtigung, affektiven und psychopathischen Störungen sowie weiteren Diagnosen wurden gezielt mit P. vivax
    infiziert, meist durch infiziertes Blut, und durchliefen wiederholte Fieberschübe, bevor Antimalariamittel gegeben
    wurden. Eine moderne Aktenstudie fand 772 Malariatherapiefälle in fünf Hauptdiagnosegruppen; 609 davon – fast
    79 % – betrafen keine Neurosyphilis. Für die vier nichtsyphilitischen Diagnosegruppen fand die Untersuchung
    keine ausführliche zeitgenössische Indikationsdiskussion. Der letzte dokumentierte Einsatz erfolgte im Dezember
    1968.
  summary: Die Wiener Universitätspsychiatrie infizierte noch bis in die späten 1960er Jahre zahlreiche Menschen
    ohne Neurosyphilis absichtlich mit Malaria. Im untersuchten Bestand betrafen 609 von 772 Malariatherapiefällen
    der fünf Hauptdiagnosegruppen andere Diagnosen als Neurosyphilis, darunter Schizophrenie, intellektuelle Beeinträchtigung
    sowie affektive und psychopathische Störungen. Eine separate infektiologische Aktenanalyse identifizierte 158
    Schizophreniepatienten, die meist mit 4–8 mL P.-vivax-infiziertem Blut inokuliert wurden und mehrere Fieberschübe
    durchliefen. Für diese nichtsyphilitischen Erweiterungen findet sich kaum eine detaillierte wissenschaftliche
    Begründung; die Praxis hielt bis Dezember 1968 an.
  consequences:
  - Absichtliche Infektion psychiatrischer Patientinnen und Patienten mit Plasmodium vivax
  - Wiederholte Fieberschübe vor Beendigung der Infektion durch Antimalariamittel
  - Einsatz bei Schizophrenie, intellektueller Beeinträchtigung sowie affektiven und psychopathischen Diagnosen
    ohne Neurosyphilis-Rationale
  - Fortgesetzte Exposition gegenüber einer Infektionskrankheit trotz verfügbarer nichtinfektiöser psychiatrischer
    Behandlungen
  - Einzelne Patienten dienten zugleich als Träger des institutionellen Malariastamms
