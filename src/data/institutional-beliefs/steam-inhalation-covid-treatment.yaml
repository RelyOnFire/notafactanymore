schemaVersion: 2
title: Herbal steam inhalation as a COVID-19 treatment or preventive
proposition:
  summary: >-
    Tanzania's presidency and, later, senior government ministries promoted herbal steam inhalation—kujifukiza or
    nyungu—as a scientifically effective way to reduce, treat or help prevent COVID-19. Presidential anecdotes,
    government campaign weeks and ministry claims about traditional-medicine use gave the practice official therapeutic
    legitimacy before controlled evidence had established an effect on SARS-CoV-2 infection or clinical outcomes.
correction:
  summary: >-
    Heating SARS-CoV-2 in a laboratory sample is not evidence that inhaled steam can safely heat virus inside infected
    human cells. Steam may feel soothing or moisten a dry upper airway, but a Cochrane review of common-cold trials found
    inconsistent symptom effects and no reduction in viral shedding. The COVID-19 literature consisted largely of small,
    uncontrolled or heterogeneous studies; a later systematic review found too little evidence to conclude that steam
    prevents or treats COVID-19. Steam hot enough to approach the president's claimed temperature would injure tissue,
    and bowls of hot water cause serious scalds. Herbal additives and commercial preparations require their own evidence
    of composition, dose, safety and efficacy; a safety or registration check is not proof of COVID-19 benefit.
category: Medicine and public health
reviewedAt: 2026-09-25
impact:
  summary: >-
    On 22 April 2020 President John Magufuli called steam inhalation a “scientific treatment,” said heat above 100°C would
    disintegrate the virus's fatty covering, and asked the Health Ministry to emphasize the practice. A 17 May State
    House release then publicized his account that his son recovered while eating lemon and ginger and steaming. On 31
    August the Health Ministry claimed major success for traditional remedies during the outbreak and
    reported approximately “more than 100,018” users, including nyungu users; it supplied no diagnosis, comparison group
    or outcome data, so the figure is not a treatment trial or a count of proven COVID-19 recoveries. In early 2021 the
    Health Minister presented steaming among preventive measures while saying the ministry had no current vaccine plan,
    a regional-government minister announced a third national week of nyungu, and health officials planned wider access
    to safety-screened traditional products. After the presidency changed, an expert committee recommended scientific
    proof for traditional medicines and vaccination; Tanzania began its COVID-19 vaccine rollout on 28 July 2021.
  highlights:
    - value: 22 April 2020
      label: Magufuli called steam inhalation a scientific treatment and asked the Health Ministry to promote it
    - value: '>100,018 claimed'
      label: Ministry estimate for traditional-remedy users, including nyungu—not verified COVID-19 cases or recoveries
    - value: 1–7 February 2021
      label: Dates announced for a third national week of nyungu, fruit consumption and prayer
  context:
    - >-
      Kujifukiza or nyungu covered related but non-identical practices: people inhaled vapour from hot water, often under
      a cloth, and sometimes added herbs or volatile oils. The physical claim that heat would destroy virus, the possible
      short-lived sensation of humidification and pharmacological claims about particular plant ingredients are separate
      questions and should not be treated as one intervention.
    - >-
      Government Chemist and traditional-medicine registration checks described in February 2021 addressed safety and
      suitability for human use. The ministry article did not report randomized efficacy trials, did not establish that
      every named product treated COVID-19, and inconsistently said four volatile-oil products were approved while naming
      only BUPIJI and UZIMA. Registration and access planning therefore cannot be read as clinical proof.
    - >-
      Tanzania's medical establishment was not unanimous. Before Magufuli's April speech, Deputy Health Minister Faustine
      Ndugulile publicly said steaming did not treat COVID-19 or kill the virus. The later presidential, ministerial and
      campaign messages nevertheless became the dominant official public line.
    - >-
      The May recovery story cannot establish causation. Lemon, ginger and steam were used together, no untreated
      comparison existed, and many COVID-19 infections resolve without a specific treatment.
    - >-
      Available sources document endorsement, campaigns, an uptake claim and product-access planning. They do not measure
      how many Tanzanian infections, hospitalizations, deaths, delayed consultations or scald injuries resulted from the
      policy. Burn evidence establishes a known hazard of the practice, not a Tanzania-specific injury count.
    - >-
      The 2021 change was broader than steam inhalation. The expert committee advised evidence-based use of traditional
      medicine, data reporting, internationally aligned prevention and vaccination. No steam-specific ban or full
      retraction of the earlier claims was located.
episodes:
  - id: tanzania-2020-2021
    polity: Tanzania
    region: East Africa
    startYear: 2020
    endYear: 2021
    periodLabel: 22 April 2020–28 July 2021
    strength: policy-basis
    institutionTypes:
      - government
      - medical
    institutions:
      - Office of the President of Tanzania
      - Ministry of Health, Community Development, Gender, Elderly and Children
      - President's Office – Regional Administration and Local Government (TAMISEMI)
      - Traditional and Alternative Health Practice Council
    institutionalContext: >-
      Magufuli supplied both an explicit causal mechanism and an instruction to the Health Ministry: in a nationally
      broadcast address he said steam above 100°C would break apart coronavirus because of its lipid covering, called the
      practice scientific treatment and asked officials to explain and promote it. State House then circulated his son's
      recovery anecdote. Health Ministry officials later attributed broad success to traditional remedies including
      nyungu, and the minister included steaming among COVID-19 precautions in February 2021. TAMISEMI minister Selemani
      Jafo announced a third one-week national nyungu campaign. A separate ministry access plan relied on safety screening
      and registration of oral and volatile-oil preparations, not demonstrated COVID-19 efficacy. These messages were
      institutionally contested: the deputy health minister had warned that steaming was not a treatment, while later
      officials promoted it alongside hygiene, nutrition and other advice.
    consequences:
      - Repeated presidential presentation of steam as a treatment with a simple but invalid heat-and-lipid mechanism
      - State House amplification of an uncontrolled family recovery anecdote as evidence for lemon, ginger and steaming
      - Health Ministry claims of major success based on an undifferentiated uptake figure rather than clinical outcomes
      - A third government campaign week directing the public to use nyungu while continuing ordinary work
      - Administrative support for distributing safety-screened traditional oral and steaming products through health facilities and pharmacies
      - Promotion to the general public of a practice with a documented risk of severe scalding from hot-water containers
      - A policy environment in which steaming was promoted while the ministry had no current vaccine-procurement plan; rollout began under the succeeding administration
    summary: >-
      A presidential assertion moved through State House communication, ministry messaging, regional-government
      mobilization and product-access planning. The result was more than a private home remedy: steam inhalation received
      a mechanistic explanation from the head of state, repeated claims of success, national campaign dates and support
      from senior health officials. The evidence offered for benefit remained anecdotes, reported use and administrative
      safety checks. None supplied a controlled estimate of prevention, viral clearance, hospitalization or mortality,
      and the available sources cannot quantify the policy's health effects within Tanzania.
    mechanism:
      kind: endorsement
      summary: >-
        The president framed steaming as settled science and instructed the Health Ministry to emphasize it. State House
        added a recovery story; ministries repeated preventive and therapeutic claims, organized a campaign week and
        planned retail and facility access for registered traditional preparations. This chain converted a familiar
        practice into official advice while blurring anecdote, popularity, safety screening and clinical efficacy.
    institutionalCorrection:
      status: partial
      periodLabel: 6 April–28 July 2021
      action: >-
        President Samia Suluhu Hassan commissioned an expert review, accepted an evidence requirement for traditional
        medicines and moved Tanzania into vaccination and internationally aligned COVID-19 control.
      summary: >-
        The expert committee formed on 6 April reported on 17 May and recommended that traditional medicines be used only
        when scientifically proven, that Tanzania share accurate data and that it join vaccination efforts. An official
        29 June account cautioned that committee recommendations had not yet all become policy. Tanzania received its
        first COVAX-facilitated vaccines on 24 July and launched vaccination on 28 July. This was a material reversal of
        the earlier policy environment, but no formal steam-specific ban or comprehensive retraction is documented.
