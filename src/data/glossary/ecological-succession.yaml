term: Ecological succession
aliases:
- succession
shortDefinition: Change in the species composition and structure of an ecological community over time, often after disturbance
  or the creation of new habitat.
longDefinition: Ecological succession describes directional change in communities through time as species arrive, disappear,
  compete, modify their environment, and respond to disturbance. Older theories often pictured succession as a predictable
  march toward a single climax community. Modern ecology allows for multiple trajectories, recurring disturbance, historical
  contingency, and alternative long-lasting states.
relatedTerms:
- climax-community
reviewedAt: '2026-08-21'
sources:
- title: Succession in wetlands
  url: https://www.usgs.gov/publications/succession-wetlands
  publisher: U.S. Geological Survey
  note: Defines succession as vegetation change through time and contrasts historical linear climax models with more
    individualistic modern views.
