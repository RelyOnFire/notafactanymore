term: RNA splicing
aliases: []
shortDefinition: The process that removes introns from a precursor RNA and joins the retained sections together.
longDefinition: During RNA splicing, cellular machinery cuts introns out of a precursor RNA and connects the retained exons.
  Alternative splicing can join exons in different combinations.
reviewedAt: '2026-08-21'
sources:
- title: The Nobel Prize in Physiology or Medicine 1993 – Press release
  url: https://www.nobelprize.org/prizes/medicine/1993/press-release/
  publisher: The Nobel Prize
  note: Describes how intervening sequences are removed from RNA made from split genes.
relatedTerms:
- intron
- exon
