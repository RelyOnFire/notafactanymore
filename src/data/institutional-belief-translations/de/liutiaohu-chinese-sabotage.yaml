locale: de
entryId: liutiaohu-chinese-sabotage
sourceReviewedAt: '2026-08-25'
title: Der Eisenbahnanschlag von Liutiaohu als chinesische Sabotage
claim: >-
  Die Kwantung-Armee und die japanische Regierung stellten die Explosion an der Südmandschurischen Eisenbahn bei Mukden
  am 18. September 1931 als Sabotage chinesischer Truppen mit anschließendem Angriff auf japanische Bahnwachen dar und
  nutzten die behauptete chinesische Aggression zur Rechtfertigung rascher japanischer Militäroperationen in der Mandschurei.
currentUnderstanding: >-
  Die Explosion bei Liutiaohu wurde von der japanischen Kwantung-Armee inszeniert und anschließend der chinesischen Seite
  zugeschrieben. Japans eigenes historisches Archiv erklärt heute ausdrücklich, die Kwantung-Armee habe die
  Südmandschurische Eisenbahn gesprengt und den Vorfall als chinesische Tat erscheinen lassen, um militärische Aktionen
  in den drei nordöstlichen Provinzen einzuleiten. Die zivile Regierung unter Wakatsuki hatte den Anschlag nicht geplant
  und verlangte zunächst eine Begrenzung des Konflikts; kurz darauf übernahm sie jedoch die falsche Darstellung von
  chinesischer Sabotage in amtlichen Erklärungen.
impact:
  summary: >-
    Die erfundene Sabotagebehauptung wurde zur unmittelbaren Selbstverteidigungsbegründung für die Offensive der
    Kwantung-Armee und anschließend von der japanischen Regierung in die internationale Diplomatie übernommen. Innerhalb
    weniger Tage gingen japanische Operationen weit über den Ort der Eisenbahnexplosion hinaus. Japans Archivdienst
    beschreibt das Vorgehen ausdrücklich als Versuch, den China zugeschriebenen Vorfall für Militäroperationen in
    Fengtian, Jilin und Heilongjiang zu nutzen. Der Mandschurei-Zwischenfall mündete im März 1932 in die Gründung
    Mandschukuos, das Japan im September desselben Jahres anerkannte.
  highlights:
  - value: 18. September 1931
    label: Datum der von der Kwantung-Armee inszenierten Eisenbahnexplosion bei Liutiaohu
  - value: '3'
    label: nordöstliche Provinzen, in die die Kwantung-Armee laut JACAR mit Hilfe des Zwischenfalls militärisch vorstoßen wollte
  - value: März 1932
    label: Gründung Mandschukuos nach der japanischen Besetzung der Mandschurei
  context:
  - >-
    Die Kwantung-Armee und das zivile Kabinett in Tokio waren unterschiedliche Akteure. Die
    Wakatsuki-Regierung verfolgte zunächst eine Politik der Nichtausweitung und plante die inszenierte Explosion nicht.
    Die falsche Darstellung erhielt breitere staatliche Trägerschaft, als die japanische Regierung selbst öffentlich behauptete,
    chinesische Truppen hätten die Eisenbahn zerstört und japanische Wachen angegriffen.
  - >-
    „Mukden-Zwischenfall“ bezeichnet häufig die gesamte Krise und militärische Expansion, die am 18. September 1931
    begann. Liutiaohu bei Mukden benennt präziser die Eisenbahnexplosion, und damit präziser die konkrete falsche Zuschreibung des Anschlags an chinesische Kräfte.
  - >-
    Die inszenierte Explosion diente als Vorwand und politische Grundlage für die Operationen der Kwantung-Armee.
    Dieser einzelne Vorfall verursachte jedoch nicht allein den gesamten Zweiten Japanisch-Chinesischen Krieg oder
    den Zweiten Weltkrieg; spätere Kriegsopferzahlen lassen sich der falschen Sabotagebehauptung nicht allein zurechnen.
episodes:
- id: japan-1931-1932
  polity: Japan
  institutions:
  - Kwantung-Armee
  - japanische Regierung
  institutionalContext: >-
    In der Nacht des 18. September 1931 inszenierte die Kwantung-Armee bei Liutiaohu eine Explosion an der
    Südmandschurischen Eisenbahn und gab chinesischen Kräften die Schuld. Die Behauptung diente unmittelbar als
    Rechtfertigung für Angriffe im Raum Mukden und die Ausweitung der Operationen in der Mandschurei. Obwohl das
    Wakatsuki-Kabinett zunächst anwies, den Konflikt nicht auszuweiten, erklärte die japanische Regierung nach einer
    außerordentlichen Kabinettssitzung am 24. September offiziell, eine Abteilung chinesischer Truppen habe die Gleise
    bei Mukden zerstört und japanische Bahnwachen angegriffen, weshalb die Armee schnell habe handeln müssen. Japan
    vertrat dieselbe Darstellung international, auch vor dem Völkerbund. Die militärische Expansion setzte sich fort;
    im März 1932 wurde Mandschukuo gegründet und im September von Japan anerkannt.
  consequences:
  - Unmittelbare japanische Angriffe und Besetzung im Raum Mukden unter Berufung auf Selbstverteidigung
  - Ausweitung der Operationen der Kwantung-Armee auf die drei nordöstlichen Provinzen Fengtian, Jilin und Heilongjiang
  - Amtliche diplomatische Darstellung des inszenierten Zwischenfalls als chinesische Aggression
  - Japanische Besetzung der Mandschurei und Gründung Mandschukuos im März 1932
  - Verwandlung eines militärischen Täuschungsmanövers in einen internationalen Konflikt über Japans Expansion in China
  summary: >-
    Liutiaohu ist ein besonders klarer Fall einer institutionell inszenierten Falschbehauptung, weil die erfundene
    Tatsachengrundlage nahezu unmittelbar in militärisches Handeln umgesetzt wurde. Die Kwantung-Armee erzeugte die
    Eisenbahnexplosion, beschuldigte chinesische Truppen und nutzte den angeblichen Angriff zur Ausweitung ihrer
    Operationen. Tokio hatte die Aktion nicht geplant und versuchte zunächst, den Konflikt zu begrenzen; innerhalb
    weniger Tage wiederholte jedoch auch die japanische Regierung die falsche Sabotagegeschichte offiziell als
    Rechtfertigung japanischen Handelns. Japans heutiger Archivdienst bezeichnet die Explosion ausdrücklich als Tat der
    Kwantung-Armee, die China zugeschrieben werden sollte.
