schemaVersion: 2
title: Listed “hereditary disease” categories as reliable grounds for compulsory sterilization
proposition:
  summary: >-
    Nazi Germany's 1933 sterilization law set out nine categories within a system aimed at people deemed
    “hereditarily diseased.” It authorized special courts to order sterilization when what the statute called the
    experience of medical science was said to show a high probability that their descendants would have serious
    hereditary physical or mental defects. Public-health physicians and institution directors supplied cases; courts
    and doctors turned that hereditary forecast into enforceable surgery.
correction:
  summary: >-
    The categories did not amount to one reliable hereditary forecast and could not justify surgery without consent.
    Huntington disease is caused by variants in one gene and inherited in an autosomal-dominant pattern, but
    schizophrenia and bipolar disorder reflect risk from many genes together with environmental or life factors.
    “Congenital feeblemindedness” was not a bounded genetic diagnosis and was applied to people judged socially
    deviant or unable to pass purported intelligence or conformity tests. The system thus converted heterogeneous
    conditions and social judgments into a coercive legal presumption. Forced sterilization is now recognized as a
    grave rights violation and may be prosecuted under international law as a war crime or crime against humanity.
category: Medicine, eugenics and compulsory sterilization
reviewedAt: '2026-09-24'
impact:
  summary: >-
    The law of 14 July 1933 took effect on 1 January 1934. State physicians and institution directors could initiate
    cases; Hereditary Health Courts combining a judge and two physicians issued orders that police could enforce, and
    approved doctors carried out the operations. Authoritative totals differ: a German Bundestag legislative history
    estimated about 350,000 sterilizations from 1934 through 1945, while the United States Holocaust Memorial Museum
    estimates about 400,000 people were forcibly sterilized under the law. The Bundestag condemned the sterilizations
    as National Socialist injustice in 1988, federal legislation annulled all still legally effective court orders in
    1998, and a 2007 Bundestag resolution extended the condemnation explicitly to the 1933 law itself.
  highlights:
    - value: ≈350,000–400,000
      label: range of authoritative estimates for people sterilized under the Nazi law
      note: Bundestag records give about 350,000–360,000; the USHMM gives an estimate of about 400,000.
    - value: '9'
      label: categories the law classified as grounds for hereditary-health sterilization proceedings
    - value: 1 September 1998
      label: federal law annulling all still effective Hereditary Health Court sterilization orders took effect
  context:
    - >-
      The correction is not that heredity was irrelevant to every condition on the list. The conditions differed
      radically in genetic architecture and predictive value. Even a real genetic risk did not make non-consensual
      sterilization medically or legally legitimate.
    - >-
      The category translated as “congenital feeblemindedness” was especially expansive. A 1998 Bundestag legislative
      history says it accounted for roughly two thirds of those sterilized and covered cases not shown to arise from
      external causes; the USHMM documents its use against people marked as socially deviant or unable to pass alleged
      intelligence or conformity tests.
    - >-
      The coercive programme ended with the Nazi regime in 1945, but repudiation was delayed. Remaining provisions of
      the law were repealed in 1974, the Bundestag condemned the sterilizations in 1988, the remaining court orders were
      annulled in 1998, and the Bundestag condemned the law itself in 2007. The corrected status refers to that later
      legal and parliamentary reversal, not to a wartime scientific self-correction.
episodes:
  - id: nazi-germany-1934-1945
    polity: Nazi Germany
    region: Europe
    startYear: 1934
    endYear: 1945
    strength: enforced-doctrine
    institutionTypes:
      - government
      - court
      - medical
    institutions:
      - Reich Ministry of the Interior and Nazi public-health administration
      - Hereditary Health Courts and Higher Hereditary Health Courts
      - State physicians and directors of hospitals, nursing homes and penal institutions
      - Medical institutions and approved physicians performing sterilizations
    institutionalContext: >-
      The July 1933 law, effective from January 1934, set out nine statutory categories and made a claimed high
      probability of serious hereditary defects in descendants the legal test. State physicians and heads of
      hospitals, nursing homes and penal institutions could apply for sterilization. The first implementing regulation
      expanded the machinery by requiring medical and care personnel to report people with listed conditions to the
      state physician. A Hereditary Health Court at a district court combined a judge, a public-health physician and a
      second physician trained in hereditary-health doctrine; a Higher Hereditary Health Court decided appeals. Final
      orders could be enforced by police, and doctors performed the operations.
    consequences:
      - Approximately 350,000 to 400,000 people were sterilized under the diagnosis-driven Nazi system
      - Irreversible surgery was ordered by special courts and could be enforced against the person's will
      - “Congenital feeblemindedness” converted social judgments and disputed testing into a purported hereditary diagnosis
      - Medical reporting, public-health administration, courts, police and medical institutions formed one enforcement chain
      - Hundreds of people, mostly women, died as a result of the forced operations
      - Legal condemnation and blanket annulment of the remaining court orders came only decades later
    summary: >-
      Nazi compulsory sterilization converted eugenic ideology and heterogeneous diagnoses into enforceable medical
      law. Public-health and institutional reporting fed cases to special courts, and police could compel the resulting
      surgery. Modern genetics shows why broad psychiatric labels did not provide the uniform predictive certainty the
      system claimed; the elastic “feeblemindedness” category also absorbed social judgments. The programme ended in
      1945, while formal German repudiation and annulment unfolded decades later.
    mechanism:
      kind: enforcement
      summary: >-
        Statute and implementing rules defined the categories, required or authorized medical reporting and
        applications, assigned decisions and appeals to special courts staffed by judges and physicians, and permitted
        police-backed surgery once an order became final.
    institutionalCorrection:
      status: corrected
      periodLabel: 1988–2007
      action: >-
        The Bundestag condemned the forced sterilizations in 1988; a federal law effective on 1 September 1998 annulled
        all still legally effective sterilization orders; and in 2007 the Bundestag condemned the 1933 law itself.
      summary: >-
        Coercive implementation ended with the Nazi regime, but formal correction was gradual. The corrected status
        refers to the Federal Republic's parliamentary condemnation, statutory annulment of the court orders and later
        express condemnation of the enabling law.
