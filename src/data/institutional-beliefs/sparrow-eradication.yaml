        url: https://pubmed.ncbi.nlm.nih.gov/31137157/
        publisher: Chinese Journal of Medical History / PubMed
        note: Historical review describing the 1958 radicalization of the campaign and ecological and harvest damage from excessive measures such as sparrow eradication.
