    note: >-
      The rule defines covered access categories, makes access contingent on testing and assigns unresolved
      results to interviews, possible retesting and further counterintelligence evaluation.
  - id: polygraph-doe-consequences
    sourceId: polygraph-nas
    relation: supports
    target: {scope: episode, episodeId: united-states-doe-1999-2006, aspect: consequences}
    locator: Executive Summary, pp. 5–7, Table S-1 and the DOE screening conclusion
    note: >-
      Scientific review finding that physiological responses measured by polygraphs are not unique to deception,
      that evidence for screening accuracy is extremely limited, and that employee screening creates serious
      false-positive and false-negative problems; it distinguishes these limitations from the above-chance
      performance sometimes seen in specific-incident testing. This edge supports the predicted false-suspicion
      and false-reassurance risks in the fourth consequence; the examples are hypothetical, not observed counts
      of DOE victims.
  - id: polygraph-doe-2006-correction
    sourceId: polygraph-doe-2006
    relation: documents
    target: {scope: episode, episodeId: united-states-doe-1999-2006, aspect: institutional-correction}
    note: >-
      Reconstructs DOE’s policy history and establishes the 2006 framework treating polygraph results as one
      component of a broader counterintelligence evaluation. Section III.A describes the end of automatic
      general screening and expressly retains pre-existing adverse-action safeguards; the rule keeps specified
      triggers and random testing.
    locator: '71 FR 57388–57389, history and section III.A; 57393–57394, § 709.3; 57396, § 709.25'
  - id: polygraph-doe-current-limit-correction
    sourceId: polygraph-doe-current-limit
    relation: documents
    target: {scope: episode, episodeId: united-states-doe-1999-2006, aspect: institutional-correction}
    note: >-
      Current codified rule prohibits DOE or its contractors from taking adverse personnel action or making
      adverse access recommendations solely on a significant-response or no-opinion polygraph result and bars
      substituting such a polygraph result for required investigation. The 2006 final rule establishes the
      historical date and continuity of these safeguards.
    locator: '10 CFR § 709.25(a)–(b)'
