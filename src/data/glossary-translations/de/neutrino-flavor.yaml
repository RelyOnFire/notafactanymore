term: Neutrino-Flavour
aliases:
- Flavour
- Neutrinoart
shortDefinition: 'Eine der drei Wechselwirkungsarten von Neutrinos: Elektron-, Myon- oder Tau-Neutrino.'
longDefinition: 'Neutrinos werden in drei Flavours beobachtet: Elektron, Myon und Tau, benannt nach den geladenen Leptonen,
  mit denen sie über die schwache Wechselwirkung verknüpft sind. Ein Flavour-Zustand ist nicht dasselbe wie ein Massenzustand;
  jeder Flavour ist eine quantenmechanische Mischung mehrerer Massenzustände. Diese Nichtübereinstimmung ermöglicht Neutrinooszillation.'
