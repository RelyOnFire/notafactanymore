title: Gleiwitz radio attack as Polish aggression
claim: >-
  Nazi German authorities staged the seizure and Polish-language broadcast at the Gleiwitz radio station and presented
  it within a broader narrative of genuine Polish aggression against German territory.
currentUnderstanding: >-
  The Gleiwitz incident of 31 August 1939 was a German security-service operation ordered by Reinhard Heydrich, not a
  Polish attack. Alfred Naujocks later stated under oath that Heydrich ordered him to simulate an attack, make the
  attackers appear Polish and provide practical evidence for the foreign press and German propaganda. Germany invaded
  Poland the following morning, but the invasion had already been planned; Gleiwitz was a manufactured pretext within
  the aggression narrative, not the event that caused the decision to invade.
category: War, fabricated incidents and state propaganda
reviewedAt: '2026-08-25'
impact:
  summary: >-
    Gleiwitz illustrates a deliberately manufactured factual episode being fed into state justification for military
    aggression. A small German security-service team seized the radio station, transmitted briefly in Polish and fired
    shots before leaving. On 1 September Hitler publicly portrayed Germany as responding to Polish attacks on German
    territory. The operation supplied staged evidence for a policy already chosen rather than triggering that policy.
  highlights:
  - value: 5–6
    label: additional SD men Naujocks said Heydrich ordered to accompany him to Gleiwitz
  - value: 3–4 minutes
    label: approximate duration of the Polish-language broadcast in Naujocks's sworn account
  - value: 1 day
    label: from the staged Gleiwitz incident to Germany's invasion of Poland the following morning
    note: The sequence does not imply that Gleiwitz caused the invasion; the attack on Poland had already been planned.
  context:
  - >-
    Hitler did not name Gleiwitz in his 1 September Reichstag speech. He made the broader claim that Polish regular
    soldiers had fired on German territory and that Germany was returning fire.
  - >-
    The Reich Security Main Office (RSHA) should not be named as the August 1939 carrier because it was formally created
    only on 27 September 1939. The strongest primary evidence identifies Heydrich as chief of the Security Police and SD.
  - >-
    Popular retellings often add details about Polish uniforms or identify the unconscious man delivered to Naujocks
    as a particular victim. Those details are not needed for this card and are not asserted here beyond what Naujocks's
    sworn statement directly establishes.
episodes:
- id: nazi-germany-1939
  polity: Nazi Germany
  region: Europe
  startYear: 1939
  endYear: 1939
  strength: officially-endorsed
  institutionTypes:
  - government
  institutions:
  - Office of the Chief of the Security Police and SD under Reinhard Heydrich
  - Reich government
  institutionalContext: >-
    Naujocks stated that around 10 August 1939 Heydrich personally ordered him to simulate an attack on the Gleiwitz
    radio station so that the attackers would appear Polish, explaining that practical proof was needed for the foreign
    press and German propaganda. Naujocks went to Gleiwitz with five or six other SD men and carried out the operation
    on the evening of 31 August. His team seized the station, used an emergency transmitter for a short Polish-language
    broadcast, fired pistol shots and left. On 1 September, as German forces invaded Poland, Hitler told the Reichstag
    that Polish regular soldiers had fired on German territory and presented German military action as a response.
    German Federal Archives material identifies Gleiwitz and other border incidents as Nazi fabrications used as
    ostensible justification for an invasion that had already been planned.
  consequences:
  - Creation of fabricated evidence intended for foreign press and German propaganda
  - Incorporation of staged border incidents into the official narrative that Poland had attacked German territory
  - Public presentation of German military action as defensive retaliation rather than planned aggression
  - Use of a manufactured incident as one element of the propaganda justification surrounding the invasion of Poland
  summary: >-
    Gleiwitz was not a mistaken border report. Heydrich ordered a German security-service team to create an apparent
    Polish attack and explicitly linked the operation to press and propaganda needs. The staged broadcast occurred on
    31 August 1939; the next day Hitler publicly claimed that Polish forces had fired on German territory while Germany
    invaded Poland. The incident therefore qualifies as institutionally adopted fabrication, but its causal role must
    remain narrow: it furnished apparent evidence for an aggression narrative rather than determining the invasion.
  sources:
  - title: Affidavit of Alfred Helmut Naujocks — PS-2751
    url: https://nuremberg.law.harvard.edu/documents/1202-affidavit-concerning-the-staging?mode=text&q=trial%3Aimt+type%3A%22document%22
    publisher: Harvard Law School Library Nuremberg Trials Project
    note: >-
      Sworn statement dated 20 November 1945. Naujocks says Heydrich personally ordered him to simulate a Polish attack
      at Gleiwitz for foreign-press and propaganda purposes and describes the team, broadcast and staged incident.
  - title: Hitler's Speech before the Reichstag — 1 September 1939
    url: https://nuremberg.law.harvard.edu/documents/989-speech-to-the-reichstag?mode=text
    publisher: Harvard Law School Library Nuremberg Trials Project
    note: >-
      Primary public statement in which Hitler described severe frontier incidents and asserted that regular Polish
      soldiers had fired on German territory before Germany began returning fire.
  - title: The German invasion of Poland in 1939
    url: https://www.bundesarchiv.de/im-archiv-recherchieren/archivgut-recherchieren/nach-themen/der-deutsche-ueberfall-auf-polen-1939/
    publisher: German Federal Archives
    note: >-
      Official archival guide stating that Hitler's claim of Polish fire on German territory was a lie, that incidents
      such as the attack on the Gleiwitz transmitter were fabricated by the Nazis and that the invasion had already
      been planned.
