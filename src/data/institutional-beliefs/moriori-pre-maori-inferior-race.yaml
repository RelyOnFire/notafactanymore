schemaVersion: 2
title: Moriori as an inferior pre-Māori race that became extinct
proposition:
  summary: >-
    Across three articles in 1916, the New Zealand Department of Education's School Journal assembled a racial origin
    story in which supposedly inferior pre-Māori inhabitants of mainland New Zealand were conquered by later Māori,
    their survivors became the Moriori of the Chatham Islands, and Moriori were "now extinct as a race." An April 1946
    article again described the supposed pre-Māori Moriori as lazy, shiftless and less skilled than Māori.
correction:
  summary: >-
    Moriori are a living Indigenous Polynesian people and the tchakat henu (tangata whenua) of Rēkohu and its surrounding
    islands. They share East Polynesian ancestry with Māori and developed their own language, culture and identity over
    centuries on Rēkohu. Evidence does not support a separate, inferior Melanesian people called Moriori occupying
    mainland New Zealand before Māori or being driven from there to the Chatham Islands. Nor did Moriori become extinct.
    The invasion of Rēkohu by Ngāti Mutunga and Ngāti Tama in 1835, followed by killing and enslavement, was real but was
    a different event from the fabricated prehistoric displacement story.
category: Education, race and Indigenous history
reviewedAt: '2026-09-24'
impact:
  summary: >-
    The School Journal was a Department of Education classroom publication circulated to every state school. Its February,
    March and July 1916 articles built the false narrative in stages; a 1946 article repeated its racial hierarchy after
    H. D. Skinner had challenged the mainland-Moriori theory in the 1920s. The agreed Moriori–Crown historical account says
    these ideas were transmitted in classrooms for much of the twentieth century, spread into media and political debate,
    and caused shame, confusion, concealment of identity and loss of knowledge of hokopapa among Moriori descendants. In
    2010 the Ministry of Education developed corrective School Journal material with Moriori. The Crown formally
    acknowledged the harm and apologised in the 2020 deed of settlement; the 2021 settlement Act records that apology in statute.
  highlights:
    - value: 3 articles
      label: February, March and July 1916 School Journal articles that assembled the false narrative
    - value: '1946'
      label: year the School Journal again described the supposed pre-Māori Moriori as inferior
    - value: 3 special issues
      label: corrective 2010 School Journals developed in collaboration with Moriori
  context:
    - >-
      The 1916 narrative was cumulative. The February article introduced allegedly non-Māori "lazy, stupid people"; the
      March article linked their descendants to Chatham Islands Moriori; and the July article called them an inferior
      Melanesian race displaced to the Chathams and "now extinct as a race." The claims should not all be attributed to
      every individual issue.
    - >-
      Shared Polynesian ancestry does not erase Moriori identity. Moriori are recognised as a distinct living people and
      as tchakat henu of Rēkohu, with their own hokopapa, language, culture and history.
    - >-
      Moriori traditions and archaeological reconstructions do not settle every detail of the first settlement route in
      the same way. The correction does not depend on choosing between them: neither supports the School Journal's racial
      hierarchy, mainland-exile narrative or extinction claim.
    - >-
      Correcting the myth does not deny the 1835 invasion of Rēkohu. Ngāti Mutunga and Ngāti Tama killed and enslaved
      Moriori after arriving by a European vessel; that documented nineteenth-century invasion was not a prehistoric Māori
      expulsion of a racially separate people from mainland New Zealand.
    - >-
      The episode ends with the Ministry's 2010 corrective issues. Education Minister Anne Tolley presented the material
      at Kopinga Marae in March 2011, and the broader Crown apology followed in the 2020 deed and 2021 settlement Act.
episodes:
  - id: new-zealand-1916-2010
    polity: New Zealand
    region: Oceania
    startYear: 1916
    endYear: 2010
    periodLabel: February 1916 – 2010
    strength: officially-endorsed
    institutionTypes:
      - government
      - education
    institutions:
      - New Zealand Department of Education
      - The School Journal
      - New Zealand Ministry of Education
    institutionalContext: >-
      The Department of Education produced the School Journal as a primary-school reader and circulated it to all state
      schools. Articles in February, March and July 1916 successively introduced an alleged pre-Māori population, linked
      that population to Moriori, and described Moriori as an inferior Melanesian race driven to the Chathams and extinct.
      The April 1946 journal again presented the supposed Moriori predecessors as lazy and inferior. The agreed settlement
      history records that the myths remained in classroom transmission for much of the twentieth century. In 2010 the
      Ministry of Education used the same publication series for material developed with Moriori to correct the record.
    consequences:
      - State-school transmission of a false racial history to generations of New Zealand children
      - Stigmatisation of Moriori as inferior, primitive or extinct
      - Shame, confusion and concealment of Moriori identity among some descendants
      - Rejection or loss of knowledge of Moriori hokopapa and reduced Moriori authority over their own identity
      - Spread of the narrative into media and political debate, including arguments used to justify Pākehā colonisation
      - Persistence of the myth after scholars had published contrary interpretations
    summary: >-
      A state classroom publication converted a speculative racial theory into school history. Its articles conflated an
      alleged mainland population with Chatham Islands Moriori, ranked that population below Māori and treated Moriori as
      extinct. The Crown now acknowledges that this teaching harmed generations of Moriori. In 2010 the Ministry issued
      Moriori-developed School Journal material intended in part to repair the earlier misrepresentation.
    mechanism:
      kind: education
      summary: >-
        The Department distributed the School Journal to every state school as classroom reading. Repetition in 1916 and
        1946, followed by wider use in teaching, gave the racial narrative official reach and longevity even after
        scholars had challenged it.
    institutionalCorrection:
      status: corrected
      periodLabel: '2010'
      action: The Ministry of Education published three School Journal special issues about Rēkohu and Moriori, developed in collaboration with Moriori in part to rectify the 1916 misrepresentation.
      summary: >-
        The corrective issues gave Moriori an authentic voice in the School Journal and taught Moriori history, culture
        and identity. They were followed by a ministerial presentation in 2011 and the Crown's formal 2020–2021
        acknowledgement and apology for the earlier state role.
