schemaVersion: 2
title: "Xiahe's wrongful suppression and anti-feudal cases of 1958"
proposition:
  summary: >-
    In 1958, officials in Xiahe County, home to Labrang Monastery, treated people accused or sanctioned
    during military suppression and anti-feudal political campaigns as legitimate targets of official
    action. The initial case decisions carried the authority of government and security institutions.
    Contemporary official accounts justified the campaign, although the later county chronicle
    acknowledges that its reach became excessive.
correction:
  summary: >-
    The authorities later overturned most of the specific cases examined in Xiahe's 1982 re-review of the
    1958 suppression and anti-feudal campaigns: 1,020 of 1,059 cases involving 1,059 people were formally
    rehabilitated, while 39 original dispositions were maintained. The Gannan prefectural judiciary
    separately reported extensive reversals and changes in cases from 1958–59. The records establish
    wrongful official case determinations, not that no armed conflict or actual offenses occurred.
category: "Political repression and wrongful accusations"
reviewedAt: "2026-11-25"
impact:
  summary: >-
    A 1958 armed campaign and Party-directed anti-feudal and religious-reform work reshaped Xiahe and its
    major monastery, Labrang. Later local histories acknowledge severe overextension, describe the
    closure of 192 of Gannan Prefecture's 196 monasteries, and document a large reversal of individual
    case decisions in 1982. Independent scholarship records detention, compelled departures and
    interruption of monastic life at Labrang. The 1,020 rehabilitated people were involved in Xiahe
    County's reviewed cases; they must not be described as 1,020 Labrang monks or as the entire
    population persecuted in 1958.
  highlights:
    -
      value: "1,059"
      label: "1958 suppression and anti-feudal cases involving one person each, reviewed in Xiahe in 1982"
    -
      value: "1,020"
      label: "cases and people formally rehabilitated in the 1982 Xiahe review"
    -
      value: "39"
      label: "original case dispositions upheld in that particular review"
  context:
    - >-
      The county gazetteer documents official reconsideration before the 1982 case review: corrective
      orders in 1972 for people wrongly sentenced or classified, a 1978 review of sentences from
      1959–1961, and a 1979 provincial report acknowledging wrongful convictions, overly broad
      confiscations, and deaths related to poor management of detainees. These were separate earlier
      measures; their totals must not be combined with the 1982 Xiahe review.
    - >-
      Xiahe County's official history describes an actual armed conflict in Gannan in 1958 and calls the
      military suppression justified but seriously overextended. The correction to wrongful case decisions
      does not erase documented fighting or prove that every allegation of abuse by older local authorities
      was false.
    - >-
      The 1982 figures cover the cases included in that specific official review, not every person
      arrested, accused, killed or punished in 1958. The records do not isolate how many of those 1,020
      people were Labrang monks, and they do not supply a reliable death count.
    - >-
      The Gannan prefectural court's separate review of 2,937 criminal cases involving 7,980 people is a
      different group with possible overlap and different case definitions. Its counts are contextual and
      must not be added to the Xiahe figures.
    - >-
      Labrang is in Xiahe County, but the campaigns and case reviews covered a wider population. Scholarly
      estimates of monks remaining after 1958 range from about 200 to 410; a contemporary internal Xinhua
      report gave 18 in April 1959. Different dates and categories prevent treating one number as a direct
      falsification of the other.
    - >-
      The original Xinhua internal report (issue 2757) is held in print at the Chinese University of Hong
      Kong and was transcribed for the project's research through Princeton. Its catalog link does not
      expose the article text. No complete licensed database transcript is reproduced in this entry.
    - >-
      Religious and political authority before 1958 was not an egalitarian or universally voluntary system.
      The existence of old inequalities does not validate subsequent wrongful prosecution or mass coercion.
episodes:
  -
    id: "prc-xiahe-1958-1982"
    polity: "People's Republic of China"
    region: "East Asia"
    startYear: 1958
    endYear: 1982
    periodLabel: "1958 suppression and political campaigns–1982 case rehabilitation"
    strength: "officially-endorsed"
    institutionTypes:
      - "government"
      - "court"
      - "military"
    institutions:
      - "Xiahe County Party and government authorities"
      - "Gannan Tibetan Autonomous Prefecture authorities and courts"
      - "Gansu Provincial Communist Party Committee"
      - "People's Liberation Army and local militia involved in the 1958 suppression"
    institutionalContext: >-
      The Xiahe County Gazetteer records armed conflict in March 1958, military and militia suppression,
      and the entry of Party and provincial work teams into local monasteries, including Labrang, to
      conduct anti-feudal and religious-reform campaigns. Individual cases arising from those campaigns
      were handled by government or judicial institutions. The same county history later describes the
      operation as seriously overextended. In 1982 a provincially initiated review of the old cases led
      Xiahe to rehabilitate 1,020 people in 1,020 cases. A separately reported prefecture-wide judicial
      review addressed other cases from 1958–59.
    consequences:
      - >-
        Official campaign case decisions subjected residents of Xiahe to sanctions later judged wrongful in
        many individual cases.
      - >-
        Armed suppression and Party-led political struggle extended into communities associated with Labrang
        Monastery.
      - >-
        During the 1958 reforms, 192 monasteries in the wider Gannan prefecture were closed, leaving four
        formally operating at the stated checkpoint.
      - >-
        Scholarly fieldwork documents detention, labor camps and forced displacement of monks, alongside
        interruption of ordinary religious life at Labrang.
      - >-
        The 1982 Xiahe review rehabilitated 1,020 individuals and left 39 dispositions intact; the separate
        Gannan court review also reversed or changed many cases.
    summary: >-
      Xiahe authorities carried out suppression and anti-feudal campaigns in 1958 in a district that
      included Labrang Monastery. Official sources justify the campaign but acknowledge serious
      overextension. When the 1958 case legacy was reviewed in 1982, 1,020 of 1,059 cases involving 1,059
      people were formally rehabilitated. The broader Gannan court record documents additional reversals
      and revisions. The case illustrates the correction of official classifications and sanctions, without
      conflating the county's case totals with the monastery's monk population.
    mechanism:
      kind: "enforcement"
      summary: >-
        Party-directed campaigns, security operations, case classification and judicial or administrative
        sanctions converted allegations of rebellion or feudal wrongdoing into official consequences.
        Provincial orders and court reviews later reopened and reversed many of those individual
        dispositions.
    institutionalCorrection:
      status: "partial"
      periodLabel: "1982 formal re-review and rehabilitation"
      action: >-
        Xiahe authorities reopened 1,059 outstanding cases from the 1958 suppression and anti-feudal
        campaigns, rehabilitated 1,020 people and maintained 39 original dispositions.
      summary: >-
        The correction is documented in the official Xiahe County Gazetteer. The Gannan prefectural judiciary
        also reported a separate 1982 review of 1958–59 cases. The original 1958 suppression was not
        repudiated in its entirety, and the record reviewed here does not show that everyone affected
        obtained restitution or that all related cases were examined.
