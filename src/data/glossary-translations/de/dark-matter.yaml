entryId: dark-matter
sourceReviewedAt: '2026-08-21'
term: Dunkle Materie
aliases: []
shortDefinition: Materie, deren Existenz aus ihren Gravitationswirkungen erschlossen wird und die nicht genügend Licht
  aussendet, absorbiert oder reflektiert, um direkt sichtbar zu sein.
longDefinition: Dunkle Materie bezeichnet Materie, deren Vorhandensein hauptsächlich durch Gravitation statt durch ausgesandtes
  Licht erschlossen wird. Zu den Belegen gehören Galaxienrotation, Bewegungen in Galaxienhaufen, Gravitationslinsen,
  die kosmische Mikrowellen-Hintergrundstrahlung und großräumige Strukturen. Ihre mikroskopische Natur ist weiterhin
  unbekannt; sie ist nicht dasselbe wie Dunkle Energie.
