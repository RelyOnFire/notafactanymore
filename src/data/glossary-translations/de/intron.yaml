entryId: intron
sourceReviewedAt: '2026-08-21'
term: Intron
aliases: []
shortDefinition: Ein dazwischenliegender Abschnitt, der zunächst in die RNA-Kopie eines Gens übernommen und beim RNA-Spleißen gewöhnlich vor der fertigen RNA wieder entfernt wird.
longDefinition: Introns unterbrechen bei vielen eukaryotischen Genen die später erhaltenen Abschnitte. Sie werden zunächst in eine Vorläufer-RNA transkribiert und vor der Nutzung der reifen Boten-RNA gewöhnlich entfernt.
