term: Coelacanth
aliases:
- coelacanths
shortDefinition: A lineage of lobe-finned fishes known from fossils and represented today by two living species in the
  genus Latimeria.
longDefinition: Coelacanths are lobe-finned fishes with a fossil record extending hundreds of millions of years. They
  were long known only from fossils and were thought to have disappeared tens of millions of years ago until a living
  specimen was recognized in 1938. Modern coelacanths are not unchanged fossil species; they are living members of an
  ancient lineage that has continued evolving.
