term: Intron
aliases: []
shortDefinition: An intervening section copied into a gene’s initial RNA transcript that is usually removed during RNA splicing before the mature RNA is produced.
longDefinition: Introns interrupt the retained parts of many eukaryotic genes. They are transcribed into precursor RNA but are normally removed before the mature messenger RNA is used for protein production.
reviewedAt: '2026-08-21'
sources:
- title: The Nobel Prize in Physiology or Medicine 1993 – Press release
  url: https://www.nobelprize.org/prizes/medicine/1993/press-release/
  publisher: The Nobel Prize
  note: Describes the discovery of split genes and intervening sequences.
