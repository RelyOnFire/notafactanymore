locale: de
entryId: resonance-locking
sourceReviewedAt: '2026-08-21'
term: Resonanzbindung
aliases:
- Resonanz-Locking
shortDefinition: Ein Mechanismus der Gezeitenentwicklung, bei dem die Umlauffrequenz eines Mondes an eine sich verändernde
  natürliche Schwingungsfrequenz im Inneren seines Planeten gekoppelt bleibt.
longDefinition: Bei der Resonanzbindung verändert sich die innere Struktur eines sich entwickelnden Riesenplaneten langsam,
  wodurch sich auch eine seiner natürlichen Schwingungsfrequenzen verschiebt. Ein Mond kann während seiner eigenen Bahnentwicklung
  nahe an dieser Resonanz bleiben. Dadurch kann über lange Zeit eine starke Gezeitenkopplung erhalten bleiben und die
  Bahn schneller wandern, als Modelle mit einer festen Gezeitenantwort vorhersagen.
