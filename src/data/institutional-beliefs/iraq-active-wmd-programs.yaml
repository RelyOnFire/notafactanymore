  institutions:
  - United States Intelligence Community
  - Central Intelligence Agency
  - Defense Intelligence Agency
  - Executive Office of the President
  - United States Congress
  institutionalContext: At Congress's request, the National Intelligence Council produced the October 2002 NIE Iraq's
    Continuing Programs for Weapons of Mass Destruction. Its central judgments included that Baghdad had chemical
    and biological weapons, that its biological capability was larger and more advanced than before the Gulf War,
    that it possessed mobile biological production facilities, that chemical-weapons production had resumed with
    a stockpile estimated at 100–500 metric tons, and that most agencies judged Iraq was reconstituting its nuclear-weapons
    program. Public Law 107-243 then incorporated continuing Iraqi chemical, biological and nuclear capability into
    its congressional findings and authorized the use of force. U.S.-led military operations began in March 2003.
    Postwar investigations contradicted the central WMD judgments, culminating in the 2005 presidential commission's
    official assessment of a major intelligence failure.
  consequences:
  - Incorporation of incorrect active-WMD judgments into the congressional findings supporting Public Law 107-243
  - Broad statutory authorization for the president to use U.S. armed forces against Iraq
  - Use of the WMD assessments in executive and diplomatic arguments for Iraqi disarmament
  - Public presentation by senior administration officials that sometimes overstated certainty or exceeded what
    intelligence reporting supported
  - Use in the intelligence process of fabricated or unreliable source reporting that analysts and managers failed
    to vet or qualify adequately
  - March 2003 U.S.-led invasion after the assessed active stockpiles and programs became part of the policy case
  - Major postwar intelligence reviews and reforms after the central assessments proved wrong
  - Long-term damage to the credibility of U.S. intelligence and public claims about weapons programs
  summary: Iraq's suspected WMD capabilities became an institutional belief with exceptionally high consequences.
    The 2002 NIE converted fragmentary and sometimes unreliable evidence into confident judgments about chemical
    and biological weapons and a renewed nuclear program. Congress wrote comparable WMD claims into the findings
    of the authorization for military force. The postwar search instead found that the main active-program and stockpile
    assessments were wrong. Official investigations found no evidence that Intelligence Community analysts had been
    ordered to falsify their judgments, but they documented major failures of sourcing, analysis and management;
    a later Senate review also found that some senior administration public statements overstated or exceeded what
    the intelligence supported.
  sources:
  - title: Iraq's Continuing Programs for Weapons of Mass Destruction — October 2002 National Intelligence Estimate
    url: https://www.cia.gov/readingroom/docs/DOC_0001075566.pdf
    publisher: Central Intelligence Agency
    note: Declassified National Intelligence Estimate containing the prewar Intelligence Community judgments about
      Iraqi chemical and biological weapons and, for most agencies, reconstitution of the nuclear-weapons program.
  - title: Authorization for Use of Military Force Against Iraq Resolution of 2002 — Public Law 107-243
    url: https://www.govinfo.gov/app/details/PLAW-107publ243
    publisher: U.S. Government Publishing Office
    note: Primary statutory record. Its findings state that Iraq continued to possess and develop significant chemical
      and biological weapons capability and was actively seeking a nuclear capability; section 3 authorized the
      president to use U.S. armed forces against Iraq.
  - title: Report of the Commission on the Intelligence Capabilities of the United States Regarding Weapons of Mass
      Destruction
    url: https://www.govinfo.gov/content/pkg/GPO-WMD/pdf/GPO-WMD.pdf
    publisher: U.S. Government Publishing Office
    note: Official 2005 presidential commission report. It calls the Intelligence Community's prewar Iraq WMD judgments
      a major intelligence failure, finds no indication analysts distorted the evidence, and details the incorrect
      nuclear, biological and chemical assessments and the Iraq Survey Group's contrary postwar findings.
  - title: Senate Roll Call Vote 237 — H.J.Res. 114
    url: https://www.senate.gov/legislative/LIS/roll_call_votes/vote1072/vote_107_2_00237.htm
    publisher: United States Senate
    note: Official roll call recording Senate passage of the Iraq authorization by 77 votes to 23 on 11 October
      2002.
  - title: House Roll Call 455 — H.J.Res. 114
    url: https://clerk.house.gov/Votes/2002455
    publisher: Office of the Clerk, U.S. House of Representatives
    note: Official roll call recording House passage of the Iraq authorization by 296 votes to 133 on 10 October
      2002.
  - title: Report on the U.S. Intelligence Community's Prewar Intelligence Assessments on Iraq — 2004
    url: https://www.intelligence.senate.gov/sites/default/files/publications/108301.pdf
    publisher: U.S. Senate Select Committee on Intelligence
    note: Bipartisan Phase I review concluding that many key prewar Iraq WMD judgments were overstated or unsupported
      by the underlying intelligence, documenting groupthink and tradecraft failures, while finding no evidence
      that administration officials pressured analysts to alter their judgments.
  - title: Whether Public Statements Regarding Iraq by U.S. Government Officials Were Substantiated by Intelligence
      Information — 2008
    url: https://www.intelligence.senate.gov/sites/default/files/publications/110345.pdf
    publisher: U.S. Senate Select Committee on Intelligence
    note: Phase II review comparing senior officials' public claims with the intelligence available to them. It
      found that several statements overstated certainty or were unsupported or contradicted by available intelligence,
      including some claims about Iraq's links to al-Qaeda and transfer of WMD to terrorists.
