locale: de
entryId: virgin-lands-extensive-plowing
sourceReviewedAt: 2026-08-22
title: Großflächiges Pflügen der Neulandgebiete
claim: Das rasche Umpflügen riesiger semiarider Steppengebiete und die Maximierung der Getreideanbaufläche wurden als nachhaltiger Weg zu dauerhaft stark höheren sowjetischen Nahrungsmittelerträgen behandelt.
currentUnderstanding: Landwirtschaft in semiariden Steppen wird durch Niederschlag, Winderosion, Bodenfruchtbarkeit sowie den Bedarf an lokal angepassten Fruchtfolgen und Brache begrenzt. Eine Ausweitung des Anbaus kann Erträge vorübergehend steigern; dauerhaftes Pflügen und zu wenig Brache auf empfindlichen Trockenböden können jedoch die Fruchtbarkeit abbauen und den Oberboden schwerer Erosion aussetzen.
episodes:
  - id: soviet-kazakhstan-1954-1963
    polity: Sowjetisches Kasachstan
    summary: Chruschtschows Neulandkampagne wandelte riesige Flächen der kasachischen Steppe in kurzer Zeit in Getreideland um. Frühe Ernteerfolge förderten die weitere Expansion, doch politischer Druck zur Maximierung der Anbaufläche verringerte die Brache und übertrug Landwirtschaftsmethoden auf trockene, empfindliche Böden, für die sie schlecht geeignet waren. Anfang der 1960er-Jahre sank die Bodenfruchtbarkeit, Winderosion nahm stark zu und der Ernteausfall von 1963 machte die Grenzen der Strategie sichtbar.
    consequences:
      - Großflächige Umwandlung von Steppe in Ackerland
      - Sinkende Bodenfruchtbarkeit
      - Winderosion und Staubstürme
      - Stark schwankende Getreideproduktion
