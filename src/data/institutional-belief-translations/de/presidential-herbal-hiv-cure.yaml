locale: de
entryId: presidential-herbal-hiv-cure
sourceReviewedAt: '2026-08-24'
title: Präsidentielle Kräuterbehandlung als Heilung von HIV/AIDS
claim: Ein präsidentielles Kräuterpräparat wurde als Mittel behandelt, das HIV/AIDS so zuverlässig heilen könne,
  dass bei Teilnehmern eines staatlichen Behandlungsprogramms die antiretrovirale Therapie ersetzt werden könne.
currentUnderstanding: Für das im gambischen President’s Alternative Treatment Programme eingesetzte Kräuterpräparat
  gibt es keinen Nachweis einer Heilung von HIV. Wirksame antiretrovirale Therapien unterdrücken die Virusvermehrung
  und dürfen nicht zugunsten unvalidierter Kräutermittel abgesetzt werden; eine Unterbrechung kann zu erneutem Virusanstieg
  und Krankheitsprogression führen.
impact:
  summary: Gambia machte aus einer persönlichen Heilungsbehauptung ein staatliches und teilweise zwangsgeprägtes
    Behandlungsprogramm. Präsidialamt, Gesundheitskräfte, Labore und staatliche Medien trugen die Umsetzung; Teilnehmer
    mussten ihre reguläre antiretrovirale Therapie absetzen. Eine spätere gambische Wahrheitskommission rekonstruierte
    das Programm und seine gesundheitlichen und menschenrechtlichen Folgen.
  highlights:
  - value: '2007'
    label: Präsident Yahya Jammeh verkündete eine HIV/AIDS-Heilung und richtete das staatliche Behandlungsprogramm
      ein
  - value: ART abgesetzt
    label: Teilnehmer wurden während der präsidentiellen Behandlung von der regulären antiretroviralen Therapie
      genommen
  - value: Spätere Aufarbeitung
    label: Die gambische Wahrheitskommission rekonstruierte Programm, Zwangselemente und Schäden
  context:
  - Die Karte betrifft die staatlich umgesetzte Behauptung, dieses konkrete Präparat heile HIV/AIDS. Sie besagt
    nicht, dass traditionelle oder pflanzliche Arzneien bei jeder Erkrankung unwirksam seien.
episodes:
- id: gambia-2007-2016
  polity: Gambia
  institutions:
  - Office of the President of The Gambia
  - President’s Alternative Treatment Programme (PATP)
  - Ministry of Health and Social Welfare
  institutionalContext: Die Heilungsbehauptung wurde über ein beim Präsidialamt angesiedeltes Programm praktisch
    umgesetzt. Menschen mit HIV wurden aufgenommen, staatliche Gesundheits- und Labordienste einbezogen und das
    Programm über staatliche Medien legitimiert. 2016 dient als operativer Endpunkt des Jammeh-Systems und nicht
    als Datum einer wissenschaftlichen Entdeckung.
  summary: Ab 2007 behauptete Präsident Yahya Jammeh, seine Kräuterbehandlung könne HIV/AIDS heilen, und ließ sie
    über das President’s Alternative Treatment Programme verabreichen. Die spätere gambische Wahrheitskommission
    stellte fest, dass staatliche Strukturen eingesetzt, Teilnehmer von ihrer antiretroviralen Therapie genommen
    und schwere gesundheitliche sowie menschenrechtliche Schäden verursacht wurden. Die WHO hatte bereits 2007 erklärt,
    dass es keine HIV-Heilung gebe und Kräutermittel antiretrovirale Therapie nicht ersetzen dürften.
  consequences:
  - Aufnahme von Menschen mit HIV in ein unvalidiertes staatliches Behandlungsprogramm
  - Absetzen regulärer antiretroviraler Therapie
  - Einsatz staatlicher medizinischer und labordiagnostischer Ressourcen
  - Institutionelle Legitimation der Heilungsbehauptung durch staatliche Medien
  - Von der späteren Wahrheitskommission dokumentierte gesundheitliche Verschlechterungen und Todesfälle
