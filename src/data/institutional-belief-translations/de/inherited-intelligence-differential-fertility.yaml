locale: de
entryId: inherited-intelligence-differential-fertility
sourceReviewedAt: 2026-08-23
title: Vererbte Intelligenz und unterschiedliche Geburtenraten
claim: Bildungsabschlüsse wurden als Ersatzmaß für vererbte Intelligenz behandelt; besser ausgebildete Frauen sollten daher mehr und schlechter ausgebildete Frauen weniger Kinder bekommen, um die künftige „Qualität“ der Bevölkerung zu sichern.
currentUnderstanding: Intelligenz und Bildungserfolg sind komplexe Merkmale, die von zahlreichen genetischen, entwicklungsbezogenen, familiären, schulischen, wirtschaftlichen und sozialen Einflüssen geprägt werden. Der Bildungsabschluss eines Elternteils bestimmt keinen erblichen menschlichen Wert und bietet keine wissenschaftliche Grundlage dafür, verschiedenen sozialen Gruppen unterschiedliche Anreize zur Fortpflanzung oder Sterilisation zu geben.
episodes:
  - id: singapore-1983-1985
    polity: Singapur
    institutions:
      - Kabinett von Singapur
      - Ministry of Education
      - Central Provident Fund Board
      - Housing & Development Board (HDB)
    institutionalContext: Das Maßnahmenpaket verlief durch mehrere Regierungsbereiche und gehörte nicht zu einer einzigen „Bevölkerungsbehörde“. Das Kabinett gab die politische Richtung vor; die Bildungspolitik trug das Graduate Mothers' Priority Scheme, während Steuer-, Wohnungs- und Sterilisationsanreize über die jeweils zuständigen Finanz-, Wohnungs- und Sozialstrukturen umgesetzt wurden.
    summary: Nachdem der Zensus von 1980 niedrigere Geburtenraten unter Akademikerinnen gezeigt hatte, argumentierte Premierminister Lee Kuan Yew, Intelligenz sei zu einem großen Teil erblich und die ungleiche Fortpflanzung gefährde Singapurs künftigen Talentpool. 1984 führte die Regierung Vorteile für besser ausgebildete Mütter ein und bot zugleich bestimmten einkommensschwachen Frauen ohne O-Level-Abschluss 10.000 Singapur-Dollar für eine Sterilisation nach dem ersten oder zweiten Kind. Die ausdrücklich eugenischen Maßnahmen wurden 1985 wieder aufgehoben oder deutlich verändert.
    consequences:
      - Graduate Mothers' Priority Scheme
      - Bevorzugung bei Schulaufnahme und Steuern
      - Geldanreize zur Sterilisation einkommensschwacher, geringer ausgebildeter Frauen
      - Reproduktive Diskriminierung nach Bildung und Einkommen
