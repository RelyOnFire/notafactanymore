term: Quastenflosser
aliases:
- Quastenflosser-Arten
shortDefinition: Eine Linie fleischflossiger Fische, die aus Fossilien bekannt ist und heute durch zwei lebende Arten
  der Gattung Latimeria vertreten wird.
longDefinition: Quastenflosser sind Fleischflosser mit einer Fossilgeschichte von mehreren hundert Millionen Jahren.
  Lange waren sie nur aus Fossilien bekannt und galten als seit vielen Millionen Jahren ausgestorben, bis 1938 ein lebendes
  Exemplar erkannt wurde. Heutige Quastenflosser sind keine unveränderten fossilen Arten, sondern lebende Vertreter einer
  alten Linie, die sich weiterentwickelt hat.
