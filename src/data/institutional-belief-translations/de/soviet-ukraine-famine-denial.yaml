entryId: soviet-ukraine-famine-denial
sourceReviewedAt: '2026-08-25'
title: Die Massenhungersnot in der Sowjetukraine als antisowjetische Propaganda
proposition:
  summary: >-
    Sowjetische Institutionen bestritten oder verharmlosten Berichte, wonach die Sowjetukraine 1932–1933 eine
    katastrophale Hungersnot mit massenhaftem Verhungern erlebt habe. Solche Darstellungen wurden als Lügen,
    Übertreibungen oder antisowjetische Propaganda behandelt, während offene Diskussion unterdrückt und die Krise später
    vor allem mit Dürre und gewöhnlichen landwirtschaftlichen Schwierigkeiten erklärt wurde.
correction:
  summary: >-
    In der Sowjetukraine ereignete sich 1932–1933 tatsächlich eine katastrophale Hungersnot, der Millionen Menschen zum
    Opfer fielen. Zeitgenössische interne sowjetische Akten dokumentierten Hunger, Verhungern, Sterblichkeit und den Bedarf
    an Lebensmittelhilfe, während die öffentliche Staatsdarstellung die Katastrophe bestritt oder verharmloste.
    Zwangskollektivierung, gewaltsame Getreidebeschaffung und Konfiskationspolitik gehörten zu den zentralen Ursachen; die
    Hungersnot lässt sich nicht angemessen als gewöhnliche Folge einer Dürre erklären. Die Genozidfrage ist von dieser Tatsachenkorrektur zu trennen.
impact:
  summary: >-
    Die Leugnung wirkte über Außenpolitik, Botschaftspropaganda, Pressekontrolle, Archivgeheimhaltung und ein
    geschichtspolitisches Tabu. Sowjetische Diplomaten bezeichneten Berichte als Lügen, während interne Partei- und
    Sicherheitsakten das Verhungern dokumentierten. Noch im April 1983 veröffentlichte die sowjetische Botschaft in
    Kanada eine Erklärung über die „sogenannte Hungersnot“, verharmloste die Lage und erklärte Dürre zum Hauptgrund. Am
    26. Januar 1990 erkannte das Zentralkomitee der Kommunistischen Partei der Ukraine die Hungersnot förmlich an und
    erklärte, das Thema sei in der sowjetischen Geschichtsschreibung mehr als ein halbes Jahrhundert verschwiegen worden.
  highlights:
    - value: 50+ Jahre
      label: Zeitraum, für den die KP der Ukraine 1990 das Verschweigen der Hungersnot in der sowjetischen Geschichtsschreibung einräumte
    - value: 28. April 1983
      label: Datum einer amtlichen Erklärung der sowjetischen Botschaft in Kanada über die „sogenannte Hungersnot“
    - value: 26. Januar 1990
      label: Datum der förmlichen Anerkennung der Hungersnot und Freigabe von Archivmaterial durch die KP der Ukraine
  context:
    - >-
      Die öffentliche sowjetische Linie veränderte ihre Form. Frühe diplomatische Antworten wiesen Berichte über
      Hungersnot und massenhaften Tod als Lügen zurück; 1983 räumte eine Botschaftserklärung ernste landwirtschaftliche
      Schwierigkeiten ein, bestritt aber die westliche Darstellung einer katastrophalen, politikbedingten Hungersnot.
    - >-
      Intern wussten sowjetische Institutionen, dass Hunger und Verhungern auftraten. Geheime GPU-, Partei- und
      Regierungsakten dokumentierten Nahrungsmangel, Hungersnot, Todesfälle und Hilfsmaßnahmen.
    - >-
      Die Bezeichnung Holodomor ist heute gebräuchlich; die Debatte über Vorsatz und rechtliche Genozid-Einordnung ist von
      der hier behandelten Tatsachenkorrektur zu unterscheiden.
episodes:
  - id: soviet-union-1933-1990
    polity: Sowjetunion
    institutions:
      - Volkskommissariat für Auswärtige Angelegenheiten der UdSSR
      - sowjetischer Diplomatie- und Presseapparat
      - Kommunistische Partei der Sowjetunion
      - Kommunistische Partei der Ukraine
    institutionalContext: >-
      Als Berichte über die Hungersnot ins Ausland gelangten, beschränkten Außenpolitik und Presseapparat den Zugang zu
      betroffenen Regionen und wiesen ausländische Darstellungen zurück. Überlieferte Korrespondenz von Anfang 1934 zeigt,
      wie Außenkommissar Maxim Litwinow eine ukrainische Broschüre als voller Lügen bezeichnete und Botschaftsrat Boris
      Skwirski Behauptungen über massenhaftes Sterben zurückwies. Noch am 28. April 1983 sprach eine sowjetische
      Botschaftsmitteilung in Kanada von der „sogenannten Hungersnot“. Am 26. Januar 1990 verabschiedete das ZK der KP der
      Ukraine einen Beschluss, der die Hungersnot offen anerkannte, das mehr als fünfzigjährige Verschweigen einräumte
      und die Veröffentlichung neu freigegebener Parteiakten anordnete.
    consequences:
      - Amtliche diplomatische Leugnung und Verharmlosung von Berichten über massenhaftes Verhungern in der Sowjetukraine
      - Einschränkungen, die unabhängige Berichterstattung ausländischer Korrespondenten aus den Hungergebieten behinderten
      - Langjährige Zensur und Ausschluss der Hungersnot aus der autorisierten sowjetischen Geschichtsdarstellung
      - Archivgeheimhaltung, die interne Dokumentation des Verhungerns von der öffentlichen Darstellung trennte
      - Fortgesetzte sowjetische diplomatische Propaganda zur Verharmlosung der Hungersnot bis in die 1980er Jahre
      - Verzögerter öffentlicher und wissenschaftlicher Zugang zu den dokumentarischen Belegen der Katastrophe
    summary: >-
      Der sowjetische Staat wusste intern von schwerem Hunger und hoher Sterblichkeit, während seine öffentlichen
      Institutionen eine katastrophale Hungersnot bestritten oder verharmlosten. Im Januar 1990 brach die Kommunistische
      Partei der Ukraine förmlich mit dieser Doktrin, erkannte die Hungersnot an und räumte das jahrzehntelange Verschweigen ein.
    mechanism:
      summary: >-
        Sowjetische Diplomatie-, Presse-, Partei- und Archivorgane bestritten oder verharmlosten die Hungersnot öffentlich,
        beschränkten Berichterstattung und hielten ein historisches Tabu aufrecht, während interne Akten Hunger und Sterblichkeit dokumentierten.
    institutionalCorrection:
      periodLabel: 26. Januar 1990
      action: Das Zentralkomitee der Kommunistischen Partei der Ukraine erkannte die Hungersnot förmlich an und genehmigte die Veröffentlichung freigegebener Archivakten.
      summary: >-
        Eine sowjetische republikanische Parteiinstitution erkannte die Katastrophe ausdrücklich an, räumte ihre
        jahrzehntelange Unterdrückung in der Historiografie ein und öffnete Dokumente, die der bisherigen öffentlichen Darstellung widersprachen.
