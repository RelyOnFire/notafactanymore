title: Virginity testing
claim: Examination of the hymen or vagina was treated as capable of determining whether a woman or girl had previously had vaginal intercourse.
currentUnderstanding: No physical examination can establish whether a woman or girl has previously had vaginal intercourse. Hymenal appearance varies normally and is not a reliable record of sexual activity; so-called virginity or two-finger tests have no scientific or clinical validity.
category: Forensic medicine and sexuality
reviewedAt: 2026-08-22
episodes:
  - id: turkey-1986-1998
    polity: Turkey
    region: Middle East
    startYear: 1986
    endYear: 1998
    periodLabel: 1986–1998
    strength: policy-basis
    institutionTypes: [government, medical, education]
    institutions:
      - Police and gendarmerie
      - State forensic-medicine services and hospitals
      - State schools and dormitories
    consequences:
      - Forced genital examinations
      - Use of supposed “virginity” as evidence in policing
      - Surveillance and punishment of women and girls
      - Psychological and physical harm
    summary: Turkish police, gendarmes, schools, dormitories, and other state institutions ordered or facilitated examinations intended to determine women's and girls' “virginity.” State forensic doctors performed such examinations in cases involving detainees, suspected prostitution, school discipline, and public morality. A government regulation in late 1998 prohibited virginity testing unless requested by the woman.
    sources:
      - title: A Matter of Power — State Control of Women's Virginity in Turkey
        url: https://www.hrw.org/report/1994/06/01/matter-power/state-control-womens-virginity-turkey
        publisher: Human Rights Watch
        note: Documents state-ordered virginity examinations from the 1980s and early 1990s involving police, forensic doctors, schools, dormitories, hospitals, and detainees.
      - title: 1999 Country Report on Human Rights Practices — Turkey
        url: https://2009-2017.state.gov/j/drl/rls/hrrpt/1999/365.htm
        publisher: U.S. Department of State
        note: Records that a late-1998 Turkish government regulation prohibited the traditional practice of virginity testing unless requested by a woman.
      - title: Eliminating virginity testing — an interagency statement
        url: https://www.who.int/publications/i/item/WHO-RHR-18.15
        publisher: World Health Organization
        note: States that hymen and two-finger examinations have no scientific merit and cannot establish a history of vaginal intercourse.
  - id: india-2005-2013
    polity: India
    region: South Asia
    startYear: 2005
    endYear: 2013
    periodLabel: 2005–2013
    strength: policy-basis
    institutionTypes: [government, court, medical, education]
    institutions:
      - Government hospitals and medico-legal services
      - Forensic-medicine training and textbooks
      - Criminal courts using medico-legal reports
    consequences:
      - Invasive examinations of rape survivors
      - Sexual-history judgments in medico-legal reports
      - Evidence used to challenge credibility or imply consent
      - Re-traumatization of survivors
    summary: Indian forensic-medicine teaching and public hospitals continued to use the two-finger test to judge whether rape survivors were “habituated to sexual intercourse.” Medical findings about hymenal condition and vaginal laxity entered medico-legal reports and could be used in court to attack a survivor's credibility or imply consent. The Supreme Court rejected the practice in 2013, and national health guidelines subsequently instructed examiners not to perform it or comment on past sexual experience.
    sources:
      - title: Dignity on Trial — India's Need for Sound Standards for Conducting and Interpreting Forensic Examinations of Rape Survivors
        url: https://www.hrw.org/report/2010/09/06/dignity-trial/indias-need-sound-standards-conducting-and-interpreting-forensic
        publisher: Human Rights Watch
        note: Documents widespread institutional use of the test, its prescription in 2005 and 2007 forensic-medicine textbooks, public-hospital examination forms, and court reliance on supposed signs of sexual habituation.
      - title: Guidelines & Protocols — Medico-legal care for survivors/victims of sexual violence
        url: https://mohfw.gov.in/sites/default/files/9535223249_1.pdf
        publisher: Ministry of Health and Family Welfare, Government of India
        note: National guidelines state that the two-finger test must not be conducted and that hymenal, vaginal, or anal findings cannot establish past sexual experience.
      - title: Supreme Court of India — Lillu @ Rajesh and Anr. v. State of Haryana
        url: https://api.sci.gov.in/jonew/judis/40308.pdf
        publisher: Supreme Court of India
        note: 2013 judgment rejecting the two-finger test as violating survivors' privacy, physical and mental integrity, and dignity.
  - id: indonesia-2014-2021
    polity: Indonesia
    region: Southeast Asia
    startYear: 2014
    endYear: 2021
    periodLabel: 2014–2021
    strength: policy-basis
    institutionTypes: [government, medical, military]
    institutions:
      - Indonesian National Police
      - Indonesian Armed Forces
      - Police and military medical services
    consequences:
      - Invasive examinations of female recruits
      - Sex discrimination in public employment
      - Psychological and physical harm
    summary: In 2014, Indonesia's police recruitment system still subjected female applicants to “virginity tests,” including the discredited two-finger examination; the police recruitment website explicitly listed virginity as a requirement. Human Rights Watch also documented the practice across the armed forces. In 2021, the Army chief directed that female recruits should undergo the same medically relevant checks as men, signaling the end of the Army's version of the practice.
    sources:
      - title: Indonesia — “Virginity Tests” for Female Police
        url: https://www.hrw.org/news/2014/11/17/indonesia-virginity-tests-female-police
        publisher: Human Rights Watch
        note: Documents the official recruitment context, the police website requirement, interviews with applicants, and the use of the two-finger examination in 2014.
      - title: Indonesia Army Chief to Terminate Unscientific “Virginity Test”
        url: https://www.hrw.org/news/2021/08/03/indonesia-army-chief-terminate-unscientific-virginity-test
        publisher: Human Rights Watch
        note: Documents the 2021 Army instruction ending medically irrelevant virginity testing for female recruits and notes decades of use across the security forces.
      - title: Eliminating virginity testing — an interagency statement
        url: https://www.who.int/publications/i/item/WHO-RHR-18.15
        publisher: World Health Organization
        note: Summarizes the scientific evidence that such examinations cannot establish prior vaginal intercourse.
