term: Holotyp
aliases:
- Holotypus
- Typusexemplar
shortDefinition: Das einzelne Exemplar, das bei der formalen Beschreibung einer neuen Art oder Unterart als namensgebende
  Referenz festgelegt wird.
longDefinition: In der zoologischen Nomenklatur ist der Holotyp das einzelne Exemplar, das bei der Aufstellung einer
  neuen nominellen Art oder Unterart als namenstragender Typus festgelegt wird. Es verankert die Anwendung des wissenschaftlichen
  Namens und muss nicht das vollständigste, typischste oder am besten erhaltene bekannte Exemplar sein.
