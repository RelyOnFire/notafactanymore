locale: de
entryId: terra-nullius-australia
sourceReviewedAt: '2026-08-25'
title: Australien als terra nullius ohne indigene Landrechte
claim: Das australische Common Law behandelte den Kontinent so, als hätten indigene Völker beim britischen Erwerb
  der Souveränität keine vom Common Law anerkennbaren Landrechte besessen. Der Titel der Krone konnte dadurch als
  vollständiges Eigentum statt als bloßer Radikaltitel mit fortbestehendem Native Title behandelt werden.
currentUnderstanding: 1992 verwarf der High Court of Australia in Mabo v Queensland (No 2) die mit terra nullius
  verbundenen Rechtsannahmen. Das Gericht erkannte an, dass Aboriginal und Torres Strait Islander Peoples eigene
  Gesetze und Bräuche besaßen und dass Native Title den Erwerb der Souveränität durch die Krone überdauern konnte.
  Die Krone erhielt Radikaltitel, nicht automatisch vollständiges wirtschaftliches Eigentum an jedem Grundstück.
  Native Title konnte allerdings durch gültige, mit seinem Fortbestand unvereinbare staatliche Akte erlöschen.
impact:
  summary: Die Doktrin war Bestandteil des australischen Bodenrechts. 1889 bezeichnete der Privy Council New South
    Wales in Cooper v Stuart als bei der Annexion praktisch unbewohnt und ohne sesshafte Einwohner oder festes Recht.
    Spätere australische Gerichte behandelten indigene Gewohnheitsrechte am Land als rechtlich nicht anerkannt.
    Mabo änderte diese Grundlage 1992; 1993 schuf das Parlament mit dem Native Title Act einen gesetzlichen Rahmen.
  highlights:
  - value: 103 Jahre
    label: von Cooper v Stuart 1889 bis zur Kehrtwende in Mabo 1992
  - value: 6–1
    label: Mehrheit des High Court für die Anerkennung von Native Title
  - value: '1993'
    label: Jahr des Native Title Act nach der Mabo-Entscheidung
  context:
  - Der Ausdruck terra nullius ist die übliche Kurzbezeichnung, doch die Karte behauptet nicht, britische Amtsträger
    hätten Australien 1788 ausdrücklich mit diesem lateinischen Begriff proklamiert.
  - 'Mabo stellte die britische Souveränität über Australien nicht infrage. Das Urteil trennte Souveränität von
    Eigentum: Die Krone erhielt Radikaltitel und die Macht, Rechte aufzuheben, nicht aber automatisch die Auslöschung
    sämtlicher zuvor bestehender indigener Eigentumsrechte.'
  - Nicht jede indigene Enteignung wird auf terra nullius allein zurückgeführt. Gewalt, Gesetzgebung, Pastoralexpansion,
    Reservatspolitik, Vertreibungen und weitere Institutionen wirkten ebenfalls.
episodes:
- id: australia-1889-1992
  polity: Australien
  institutions:
  - australische koloniale und staatliche Landverwaltungen
  - Judicial Committee of the Privy Council
  - australische Common-Law-Gerichte
  institutionalContext: Kolonialregierungen hatten große Flächen bereits als Kronland behandelt. Cooper v Stuart
    lieferte 1889 eine besonders klare gerichtliche Formulierung, New South Wales sei bei der Annexion praktisch
    unbewohnt und ohne festes Recht gewesen. 1971 scheiterte in Milirrpum v Nabalco ein Anspruch auf Native Title.
    Am 3. Juni 1992 erkannte der High Court in Mabo (No 2) an, dass Native Title den Erwerb der Souveränität überdauern
    konnte, wenn er nicht wirksam aufgehoben worden war.
  consequences:
  - Fehlen einer allgemeinen Common-Law-Anerkennung bereits bestehender indigener Eigentumsrechte
  - Landverwaltung, die indigene Gewohnheitsrechte gegenüber dem Kronanspruch zurückstellte
  - Scheitern des Gove-Landrechtsverfahrens von 1971 trotz umfangreicher Belege für Yolngu-Recht und Landbindung
  - Langjährige rechtliche Hürden für indigene Gemeinschaften bei der Anerkennung traditioneller Landrechte
  - Schaffung eines nationalen Native-Title-Systems nach Mabo durch den Native Title Act 1993
  summary: Der institutionelle Irrtum bestand nicht in der Behauptung, indigene Menschen seien buchstäblich nicht
    vorhanden gewesen. Das Recht behandelte ihre Landordnungen als unfähig, vom Common Law anerkannte Eigentumsrechte
    zu begründen. Mabo verwarf diese Rechtsfiktion und erkannte fortbestehenden Native Title an.
