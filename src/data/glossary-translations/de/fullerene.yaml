term: Fulleren
aliases:
- Fullerene
- C60
shortDefinition: Ein Kohlenstoffmolekül, dessen Atome einen geschlossenen Hohlkäfig bilden, etwa das annähernd kugelförmige
  C60.
longDefinition: Fullerene sind molekulare Allotrope, die ausschließlich aus Kohlenstoffatomen in geschlossenen Käfigstrukturen
  bestehen. Die Entdeckung von C60 im Jahr 1985 zeigte, dass Kohlenstoff stabile Strukturen jenseits der lange bekannten
  Formen Diamant und Graphit bilden kann.
