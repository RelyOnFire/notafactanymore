entryId: double-bind
sourceReviewedAt: '2026-08-21'
term: Double Bind
aliases:
- Double-Bind-Hypothese
- Doppelbindung
shortDefinition: Eine historische Kommunikationstheorie, nach der wiederholte widersprüchliche Botschaften in engen Beziehungen
  Schizophrenie mitverursachen könnten.
longDefinition: Die Double-Bind-Hypothese nahm an, eine Person – besonders ein Kind – könne durch wiederkehrende unvereinbare
  Botschaften gefangen werden, bei denen eine Reaktion auf eine Kommunikationsebene einer anderen widerspricht und der
  Widerspruch nicht sicher angesprochen werden kann. Das Modell wurde in Familientheorien der Schizophrenie einflussreich,
  konnte sich aber als kausale Erklärung nicht halten.
