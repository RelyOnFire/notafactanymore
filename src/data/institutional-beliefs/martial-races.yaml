schemaVersion: 2
title: “Martial races” as innate military types
proposition:
  summary: >-
    British Indian and later Pakistani military authorities treated selected South Asian ethnic, caste, religious and
    regional communities as possessing intrinsic, inherited or environmentally fixed soldierly qualities, and used
    those classifications to shape recruitment and force composition.
correction:
  summary: >-
    Broad racial, ethnic, caste and regional labels do not establish an individual’s or a population’s innate capacity
    for military service. The colonial categories did not map onto discrete biological divisions and repeatedly shifted
    with political judgments about loyalty, recruiting relationships and wartime demand. Training, health, nutrition,
    organization, experience, opportunity, incentives, technology and social conditions all affect military participation
    and performance; modern biological anthropology likewise finds that socially defined races do not accurately
    represent the continuous and overlapping pattern of human biological variation.
category: Military anthropology and racial classification
reviewedAt: '2026-09-30'
impact:
  summary: >-
    The doctrine operated through recruiting administration rather than remaining a free-floating stereotype. British
    Indian Army headquarters and recruiting handbooks sorted communities into preferred and excluded pools, helping
    raise the Punjab and North-West Frontier share of Indian infantry recruits from 28 percent in 1862 to 57 percent in
    1914. Both world wars forced officials to recruit beyond supposedly fixed “martial” groups, exposing how contingent
    the categories were without producing a clear institutional repudiation. Pakistan inherited this force structure
    and class-composition system in 1947. East Pakistan contained a majority of the country’s population, yet held only
    1.6 percent of Army officer posts in 1955–56; limited recruiting reforms did not remove the imbalance before 1971.
  highlights:
    - value: 28% → 57%
      label: Punjab and North-West Frontier share of Indian infantry recruits, 1862 to 1914
    - value: 1.6%
      label: East Pakistan share of Pakistan Army officer posts in 1955–56
    - value: below 8%
      label: reported maximum Bengali Army quota under the 1960 class-composition regulation
  context:
    - >-
      “Martial race” was not one internally consistent genetic theory. Officials combined claims about ancestry, caste,
      religion, region, climate, diet, occupation, masculinity and political loyalty, then adjusted the resulting
      classifications to administrative and military needs.
    - >-
      Recruitment shares document institutional selection and access to military employment. They do not by themselves
      measure the combat performance of individual soldiers or communities.
    - >-
      Wartime expansion beyond previously preferred groups was a practical correction to exclusive recruitment, not a
      documented scientific renunciation of the doctrine. Pakistan also made real but limited changes by raising East
      Bengal units and revising entry rules while Bengali representation remained severely constrained.
episodes:
  - id: british-india-1880-1947
    polity: British India
    region: South Asia
    startYear: 1880
    endYear: 1947
    periodLabel: 1880s–1947
    strength: policy-basis
    institutionTypes:
      - government
      - military
    institutions:
      - British Indian Army
      - Army Headquarters, India
      - Adjutant-General’s Branch, Recruiting Directorate
    institutionalContext: >-
      From the late nineteenth century, Army Headquarters and the Adjutant-General’s recruiting machinery increasingly
      concentrated enlistment among communities classified as “martial.” Official reports and a series of Indian Army
      recruiting handbooks turned the classification into administrative guidance for particular castes, religions and
      regions. The criteria were never stable: political loyalty after 1857, recruiting networks and perceived frontier
      utility mattered alongside racialized claims about inherited or environmentally fixed qualities.
    consequences:
      - Selective recruitment concentrated military employment in favored communities and regions
      - Communities classified as non-martial faced restricted access to Army service and advancement
      - Official handbooks and recruiting offices institutionalized racialized, caste-based and regional categories
      - Military employment and patronage reinforced unequal relationships between the colonial state and recruiting areas
    summary: >-
      British Indian Army policy increasingly favored Sikhs, Gurkhas, Punjabi Muslims, Pathans and other selected groups
      as “martial,” while excluding or limiting communities deemed unsuitable. The policy reflected an incoherent mix of
      racial theory, caste and religious ethnography, environmental claims, political loyalty and practical alliances.
      Its instability became visible in wartime: the Army admitted groups previously treated as non-martial when mass
      mobilization required more recruits, yet retained preferred recruiting regions and the language of martial types.
    mechanism:
      kind: classification
      summary: >-
        Army headquarters, recruiting directorates, regiments and regional recruiters classified communities through
        reports, handbooks and class-composition rules, converting the doctrine into decisions about who could enlist and
        which groups would supply particular units.
    institutionalCorrection:
      status: partial
      periodLabel: 1914–1945
      action: Wartime manpower demands expanded recruitment beyond communities previously classified as martial.
      summary: >-
        First World War expansion brought additional communities into the recruiting pool, and Second World War figures
        show substantial enlistment from regions marginalized by the older system, including Madras and Bengal. These
        changes weakened exclusive application in practice but did not amount to a documented institutional repudiation
        before British rule ended in 1947.
  - id: pakistan-1947-1971
    polity: Pakistan
    region: South Asia
    startYear: 1947
    endYear: 1971
    periodLabel: 1947–1971
    strength: policy-basis
    institutionTypes:
      - government
      - military
    institutions:
      - Pakistan Army
      - General Headquarters (GHQ), Pakistan Army
    institutionalContext: >-
      Pakistan inherited regiments, recruiting geography and a class-composition system dominated by Punjabi and
      Pashtun soldiers. A 1950 regimental account described a nominal post-partition change to equal shares of Punjabi
      Muslims and Pathans while omitting the Bengali majority and other populations. A later BIISS study reports that the
      Pakistan Army’s 1960 class-composition regulation capped the Bengali share below 8 percent. Entry standards,
      recruiting locations and officer selection reproduced the imbalance even as official policy was described as open
      to all Pakistanis.
    consequences:
      - Severe under-representation of Bengalis in Army officer and enlisted ranks
      - Concentration of military employment, senior command and institutional power in West Pakistan
      - Restricted access to military training, promotion and defense resources for East Pakistanis
      - A visible regional inequality that deepened political grievance and Bengali alienation
    summary: >-
      Pakistan did not merely inherit a demographically skewed army in 1947. Its class-composition and recruiting systems
      continued to privilege Punjabis and Pashtuns, while military authorities invoked Bengalis’ supposed lack of martial
      qualities and maintained entry rules and quotas that constrained participation. The East Bengal Regiment and later
      recruiting reforms expanded access, but Bengali Army representation remained far below the eastern wing’s share of
      the population through 1971.
    mechanism:
      kind: administrative-adoption
      summary: >-
        General Headquarters and the Army’s recruiting and class-composition rules carried inherited preferences into
        force structure, entry standards, quotas, unit organization and officer selection, producing durable regional
        exclusion without requiring a single public statute declaring Bengalis non-martial.
    institutionalCorrection:
      status: partial
      periodLabel: 1948–1965
      action: Pakistan established the East Bengal Regiment in 1948 and, after the 1965 war, reduced the height requirement and doubled the Bengali recruiting quota.
      summary: >-
        The East Bengal Regiment was established in 1948; two battalions were raised in the early post-independence
        period, and six more followed over the next two decades. After 1965 the Army announced lower height standards and
        a doubled Bengali quota. These measures acknowledged and modestly widened access, but available representation
        figures show no basic reversal of the imbalance before the eastern wing became Bangladesh in 1971.
