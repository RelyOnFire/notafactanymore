schemaVersion: 2
title: Lysenkoist heredity
proposition:
  summary: >-
    Environmental treatment can reliably reshape heredity across generations, making Mendelian genetics unnecessary
    or false.
correction:
  summary: Plants inherit DNA and can also inherit some changes in how genes are used. A winter wheat plant remembers
    cold long enough to flower. In its offspring that memory is reset, and the next generation ordinarily needs
    cold again. In thale cress (Arabidopsis), one study found that a response to stress could pass mainly through
    the maternal line and faded without further stress. These findings explain how an environmental effect can last
    while a breeder’s hoped-for permanent change fails to appear.
category: Genetics
entryId: acquired-traits-drive-evolution
reviewedAt: '2026-11-27'
impact:
  summary: In the Soviet Union, geneticists lost their posts, university departments lost teachers and experimental
    material, and a generation of students had little access to training in classical genetics. In China, the campaign
    also interrupted hybrid-breeding research that had already yielded results.
  highlights:
    - value: '127'
      label: University teachers dismissed in autumn 1948 in one historical accounting
      note: The same historical review reports that 66 of the 127 were professors; subsequent dismissals, demotions
        and removals from leadership were much broader.
    - value: Several thousand
      label: Scientists and teachers described as dismissed, demoted or removed from leadership after the 1948 Soviet
        campaign
      note: A retrospective estimate covering the wider post-session campaign, including personnel actions beyond
        outright dismissal.
  context:
    - In Ukraine, the 1932–1933 Holodomor coincided with the expansion of a vernalization campaign ordered in 1931.
      The documented mechanisms of famine mortality included discriminatory grain procurement and restrictions on
      migration. After the famine, the agriculture commissar instructed Vavilov to assist Lysenko. The chronology
      establishes official support for the program, but supplies no estimate of its contribution to mortality.
    - China’s 1959–1961 famine came after the Qingdao genetics meeting. Li and Yang trace the diversion of farm
      workers and excessive grain procurement against a background of exaggerated harvest reports. Kasahara and
      Li examine falling production, exports and inflexible procurement at county level. Chen and Zhou report a
      range of 15–30 million excess deaths for the famine as a whole. These studies provide no separate mortality
      estimate for Lysenkoist farming practices.
sections:
  - id: winter-wheat
    title: The promise of a spring sowing
    paragraphs:
      - text: Winter wheat ordinarily needs a spell of cold before it can flower. By chilling moist seed before
          spring sowing, a farmer could satisfy that requirement even after missing the autumn planting. Farmers
          and plant physiologists had studied this effect before Trofim Lysenko promoted it in the late 1920s under
          the name vernalization. The Soviet agronomist made two further promises. The treatment would raise harvests,
          and growers could change what future generations of wheat would inherit. A field of ripening grain could
          demonstrate the flowering response. The other claims required their own tests.
        evidenceIds:
          - lysenko-earliest-wheat
          - lysenko-report-doctrine
      - text: One such test concerned the harvest. In 1937 the Soviet breeder P. N. Konstantinov reported that the
          treatment required roughly twice as much seed, left it more susceptible to the fungal disease smut, and
          raised yield by at most 0.4% in his comparison. Soviet authorities had already ordered widespread use of vernalization in 1931.
        evidenceIds:
          - lysenko-konstantinov-trials
          - lysenko-history-early-impact
  - id: heredity-in-dispute
    title: What was at stake in heredity
    paragraphs:
      - text: Lysenko and the philosopher Isaak Prezent called their program Michurinism, invoking the Russian fruit
          breeder Ivan Michurin, who had crossed varieties to produce new apples and cherries. Lysenko argued that
          living tissue acquired hereditary properties through its surroundings and that breeders could direct this
          process. He acknowledged the physical existence of chromosomes and their part in sexual reproduction.
          What he rejected was the idea that discrete hereditary factors carried on chromosomes explain the transmission
          of traits.
        evidenceIds:
          - lysenko-michurin-names
          - lysenko-report-doctrine
      - text: What was a Mendelian breeder counting? In Brno, Gregor Mendel crossed peas that differed in seed colour.
          The hybrid seeds were yellow. When the hybrid plants self-pollinated, the green trait reappeared. Mendel
          counted 6,022 yellow seeds and 2,001 green ones, very close to three to one. A trait could pass through
          a generation in which no one could see it.
        evidenceIds:
          - lysenko-mendel-counts
      - text: 'In Thomas Hunt Morgan’s 1910 fruit-fly
          experiments, crossing a white-eyed female with a red-eyed male produced red-eyed daughters and white-eyed
          sons. Their eye colours followed the inheritance of the X chromosome: a son received his single X from
          his mother, while a daughter received an X from each parent. This was the experimental work behind the
          name “Morganism” that appeared so often in Lysenko’s attacks.'
        evidenceIds:
          - lysenko-morgan-cross
          - lysenko-report-doctrine
  - id: grafted-tomatoes
    title: Could two grafted tomatoes produce a hybrid?
    paragraphs:
      - text: A graft joins a shoot from one plant to the rooted part of another. At the 1948 session Lysenko described
          joining two tomato varieties differing in leaf shape and fruit colour. He reported that most seedlings
          from the rooted plant resembled their parent, but six grew a leaf shape characteristic of the other variety
          and some bore yellow fruit. The botanist Petr Zhukovsky suggested accidental cross-pollination. Lysenko
          replied that the first generation of such a cross should have borne red fruit. Those were competing readings
          of one reported result.
        evidenceIds:
          - lysenko-report-tomatoes
      - text: 'At Gatersleben in East Germany, Helmut Böhme set out expecting to confirm the Soviet work. His tomato
          experiments ran from 1951 to 1957. He observed unusual offspring, including changes he traced to mutations
          in the parent plant’s body cells. When he repeated the work with improved methods, the partners’ traits
          still failed to pass to offspring in the predicted pattern. The distinction mattered: finding an unusual
          seedling and showing how it acquired its trait were different achievements.'
        evidenceIds:
          - lysenko-boehme-grafts
  - id: winter-memory
    title: What wheat remembers, and what its seedlings inherit
    paragraphs:
      - text: In experiments from 1949 to 1952, Hans Stubbe tested the claim that repeated greenhouse cultivation
          without a cold period could convert winter wheat into a line of spring wheat. He could not reproduce the
          proposed hereditary conversion. Decades later researchers could follow the plant’s response inside the
          developing seed. De Niu and colleagues reported in 2024 that one cold-activated flowering gene in winter
          bread wheat remained active into the early embryo, then reset as the embryo grew. A second regulator switched
          back on at germination. Together these changes restored the seedlings’ need for cold.
        evidenceIds:
          - lysenko-boehme-grain
          - lysenko-niu-reset
      - text: 'Grafts have a similarly instructive modern counterpart. In 2009 Sandra Stegemann and Ralph Bock detected
          genetic material from adjoining tobacco plants together in cells at the graft junction. That result identifies
          a place and a physical route for exchange. Lysenko’s proposition went much further: any character could,
          in principle, pass through a graft into offspring as it could through sexual crossing. A cell at the join
          and a trait inherited by seedlings are different things to examine.'
        evidenceIds:
          - lysenko-stegemann-grafts
          - lysenko-report-doctrine
  - id: vavilov-and-the-academy
    title: Vavilov and the academy session he never saw
    paragraphs:
      - text: Nikolai Vavilov, the geneticist who led the agricultural academy from 1929 to 1935, had initially
          encouraged Lysenko. Vavilov collected seeds around the world to study the origins and diversity of crops.
          Their public break came by 1939. Soviet authorities arrested Vavilov on a collecting expedition to western
          Ukraine in 1940. His death sentence was commuted, but he died of malnutrition in prison in Saratov in
          January 1943. His death preceded the academy’s 1948 session by five years.
        evidenceIds:
          - lysenko-vavilov-career
          - lysenko-vavilov-arrest
      - text: Stalin personally reviewed Lysenko’s report before the agricultural academy met from 31 July to 7
          August 1948. Some speakers still defended genetics. The physiologist Boris Zavadovsky reminded delegates
          that farmers were already sowing wheat and rye varieties produced by geneticists on millions of hectares.
          In his closing remarks Lysenko announced that the Party’s Central Committee had approved his report. On
          23 August the higher-education minister ordered changes to university appointments and teaching. The exchange
          at the lectern had become a decision about who could train the next generation.
        evidenceIds:
          - lysenko-session-floor
          - lysenko-report-approval
          - lysenko-history-ussr-carrier
  - id: routes-back
    title: How genetics survived the prohibition
    paragraphs:
      - text: Physicists helped shelter genetic research within institutes whose work on radiation had official
          backing. In 1955 Leningrad biologists drafted the “Letter of Three Hundred” asking the Party leadership
          to end its support for Lysenko. Mathematicians joined the appeals and singled out his followers’ rejection
          of statistics. Even after that protest, the education ministry could still cancel a Leningrad genetics
          conference by telegram the day before it opened in 1961. Khrushchev’s removal in 1964 made possible the
          Academy of Sciences’ formal repudiation in 1965. Rebuilding courses and laboratories had begun earlier
          and continued afterward.
        evidenceIds:
          - lysenko-pushback-resistance
          - lysenko-pushback-ussr-correction
  - id: research-and-schooling
    title: What reached classrooms and laboratories?
    paragraphs:
      - text: Polish students had to learn the new biology. How much did botanists use it in print? Piotr Köhler
          examined the bibliography for 1948–1958 and identified about 140 Lysenkoist publications among 3,410 botanical
          works (4.1%). That count measures what reached the page. It cannot tell us what a botanist privately believed
          or felt safe saying in a lecture.
        evidenceIds:
          - lysenko-poland-mechanism
          - kohler-publication-count
      - text: In East Germany the divide ran between schools and research institutes. While schoolbooks presented
          Lysenko as an authority, Hans Stubbe persuaded Walter Ulbricht to let his crop research institute at Gatersleben
          continue its work. Stubbe could challenge Lysenko’s ideas while serving as president of the German Academy
          of Agricultural Sciences in Berlin from 1951 to 1967. A school syllabus and the research record of an
          academy thus give different answers to the question of who accepted Soviet biology.
        evidenceIds:
          - gdr-textbook-background
          - stubbe-institute-background
  - id: international-debate
    title: How the dispute travelled abroad
    paragraphs:
      - text: On 30 November 1948 the BBC’s Third Programme aired separately recorded contributions by R. A. Fisher,
          Cyril Darlington, Sydney Harland and J. B. S. Haldane. The first three criticized Lysenko. Haldane, a
          geneticist and a Communist, had told a correspondent that Lysenko went too far in attacking Soviet geneticists.
          He also resisted calls from sympathizers to organize a defence of Lysenko. Listeners sent Haldane letters
          of support after the broadcast.
        evidenceIds:
          - darlington-bbc-record
          - dejong-haldane-bbc
          - lysenko-global-dale
      - text: Readers can still see how that argument travelled. In 1949 the Society for Freedom in Science in Oxford
          published a pamphlet pairing an expanded version of Fisher’s broadcast with the resignation letter that
          the British physiologist Henry Dale sent to the Soviet Academy of Sciences. One document addressed radio
          listeners. The other ended a scientist’s formal association with the academy.
        evidenceIds:
          - wellcome-dale-response
          - lysenko-global-dale
      - text: Political loyalties also divided scientists on the European mainland. The French Marxist biologist
          Marcel Prenant voiced doubts while many other French Communists supported the doctrine. Within the Italian
          Communist Party, rival factions disputed whether to back Lysenko. By 1951 the party had largely stopped
          taking a public position.
        evidenceIds:
          - lysenko-western-parties
      - text: In Japan under American occupation, some geneticists took a scientific interest in the reports because
          they were already studying inheritance through the cytoplasm, the material outside the cell nucleus. Historian
          Kaori Iida recounts how criticism of Lysenko sharpened as the Cold War deepened. Willingness to investigate
          a claim had a different institutional meaning from making it a curriculum requirement.
        evidenceIds:
          - lysenko-japanese-reception
  - id: historical-interpretations
    title: Why historians explain his rise differently
    paragraphs:
      - text: 'David Joravsky emphasized the crisis of collectivized farming and a political culture that rewarded
          unilateral decisions. Nikolai Krementsov asked what happened when rival scientists depended on the same
          party-state for resources. Nils Roll-Hansen returned to the early experiments and the practical reasons
          breeders found vernalization plausible. These explanations address two different events, as historian
          Michael Gordin observes: an agronomist winning a hearing for his work and a government giving him authority
          over a discipline.'
        evidenceIds:
          - lysenko-gordin-interpretations
      - text: In 2014 and 2015, books appeared in Russia arguing that modern biology had vindicated Lysenko. Historian
          Loren Graham traced much of the new interest to epigenetics. Yet the wheat finding depends on identifying
          particular genes, following their activity in the embryo and observing when the effect disappears. Those
          measurements let a reader ask precisely which part of a parent’s experience a seedling inherits. They
          also show where Lysenko’s prediction of a new, persistent variety breaks down.
        evidenceIds:
          - lysenko-graham-revival
          - lysenko-niu-reset
      - text: Two sources let readers follow different parts of this history further. The published proceedings of the
          1948 academy session include the delegates’ own speeches alongside Lysenko’s address. For the international
          story, the second volume of The Lysenko Controversy as a Global Phenomenon has separate studies of Hungary,
          Italy and Japan.
        evidenceIds:
          - lysenko-read-proceedings
          - lysenko-read-global
