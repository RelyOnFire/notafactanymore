schemaVersion: 2
locale: de
entryId: liu-shaoqi-traitor-agent
sourceReviewedAt: '2026-08-25'
title: Liu Shaoqi als Verräter und feindlicher Agent
proposition:
  summary: >-
    Während der Kulturrevolution erklärte die Kommunistische Partei Chinas Liu Shaoqi förmlich zum Verräter, inneren
    Agenten und Arbeiterverräter, stellte ihn als Kopf einer konterrevolutionären revisionistischen beziehungsweise
    bürgerlichen Zentrale innerhalb der Partei dar und behandelte zahlreiche Funktionäre und Bürger als Mitglieder,
    Agenten oder Produkte seines angeblichen politischen Netzes.
correction:
  summary: >-
    1980 kehrte das Fünfte Plenum des Elften Zentralkomitees der Kommunistischen Partei Chinas den Fall förmlich um. Es
    erklärte die Theorie einer von Liu geführten „bürgerlichen Zentrale“ für vollständig falsch und unhaltbar, stellte
    fest, dass Material zu seiner Verleumdung und Verfolgung fabriziert worden war, und dass zahlreiche Partei-, Staats-
    und Militärfunktionäre fälschlich als seine Agenten bezeichnet worden waren. Die Anschuldigungen und der
    Untersuchungsbericht von 1968 wurden aufgehoben und Lius Ruf wiederhergestellt.
impact:
  summary: >-
    Die Anschuldigungen gegen Liu wurden zu einer förmlichen Partei- und Staatsdoktrin. Im Oktober 1968 billigte das
    erweiterte Zwölfte Plenum des Achten Zentralkomitees den Untersuchungsbericht, schloss den amtierenden
    Staatspräsidenten dauerhaft aus der Partei aus und entzog ihm sämtliche Partei- und Staatsämter. Liu blieb in Haft,
    wurde schwer verfolgt und starb im November 1969 in Kaifeng. Im Februar 1980 rehabilitierte ihn das Fünfte Plenum
    vollständig und ordnete die Korrektur verbundener Unrechtsfälle an.
  highlights:
    - value: 12 Jahre
      label: von der förmlichen Verurteilung 1968 bis zur Rehabilitierung 1980
    - value: '1969'
      label: Jahr, in dem Liu nach politischer Verfolgung in Haft starb
    - value: Größter
      label: Unrechtsfall der Parteigeschichte, so die eigene Beschreibung der KPCh von 1980
  context:
    - >-
      „Verräter, innerer Agent und Arbeiterverräter“ gibt die förmlichen chinesischen Bezeichnungen 叛徒、内奸、工贼
      sinngemäß wieder. Die Korrektur von 1980 bestritt nicht reale politische Meinungsverschiedenheiten mit Mao, sondern
      deren Umwandlung in eine erfundene konterrevolutionäre Identität und ein angebliches Netzwerk.
    - >-
      Die spätere Parteidarstellung weist Lin Biao, der Viererbande und weiteren Beteiligten große Verantwortung für
      fabrizierte Materialien zu, räumt aber zugleich ein, dass das Zentralkomitee selbst 1968 die falsche Schlussfolgerung förmlich angenommen hatte.
episodes:
  - id: china-1968-1980
    polity: Volksrepublik China
    institutions:
      - Zentralkomitee der Kommunistischen Partei Chinas
      - Zentrale Sonderfall-Prüfgruppe
      - Partei- und Staatsapparat der Kulturrevolution
    institutionalContext: >-
      Liu Shaoqi war Präsident der Volksrepublik China und stellvertretender Vorsitzender der Kommunistischen Partei. Am
      31. Oktober 1968 billigte das erweiterte Zwölfte Plenum des Achten Zentralkomitees einen Sonderfallbericht,
      erklärte ihn zum Verräter, inneren Agenten und Arbeiterverräter, schloss ihn dauerhaft aus der Partei aus und
      entzog ihm sämtliche Ämter. Am 29. Februar 1980 rehabilitierte ihn das Fünfte Plenum des Elften Zentralkomitees
      einstimmig, hob die Beschuldigungen und den Untersuchungsbericht von 1968 auf und ordnete die Korrektur verbundener Unrechtsfälle an.
    consequences:
      - Dauerhafter Parteiausschluss des amtierenden Staatspräsidenten und Entzug sämtlicher Ämter
      - Haft, politische Verfolgung und körperliche Misshandlung bis zu Lius Tod 1969
      - Verfolgung zahlreicher Partei-, Staats- und Militärfunktionäre als angebliche Agenten Lius
      - Ausweitung der Beschuldigung auf weitere gesellschaftliche Gruppen
      - Landesweite Propaganda über eine erfundene konterrevolutionäre Identität
      - Umfangreiche Rehabilitierungsarbeit nach 1980 für verbundene Unrechtsfälle
    summary: >-
      Lius Sturz wurde zu einem institutionellen Glaubenssatz, weil das Zentralkomitee die Anschuldigung förmlich
      ratifizierte und der Partei- und Staatsapparat sie landesweit durchsetzte. Die eigene Prüfung der KPCh von 1980
      kehrte den Tatsachenkern des Falles um.
    mechanism:
      summary: >-
        Das Zentralkomitee ratifizierte eine Sonderfall-Untersuchung als autoritatives Parteieurteil; der Apparat der
        Kulturrevolution nutzte die daraus abgeleiteten Etiketten zur Absetzung Lius und zur Verfolgung ihm zugerechneter Personen.
    institutionalCorrection:
      periodLabel: 29. Februar 1980
      action: Das Fünfte Plenum hob die Beschuldigungen und den Untersuchungsbericht von 1968 auf, rehabilitierte Liu und ordnete die Korrektur verbundener Unrechtsfälle an.
      summary: >-
        Dieselbe Regierungspartei kehrte ihre frühere Schlussfolgerung förmlich um und bezeichnete Kerntheorie und
        fabriziertes Belastungsmaterial ausdrücklich als falsch und unrechtmäßig.
evidence:
  - id: liu-1968-proposition
    note: >-
      Die offizielle Parteidatenbank reproduziert die Entscheidung von 1968, die förmlichen Etiketten sowie Lius dauerhaften Parteiausschluss und Amtsentzug.
  - id: liu-1980-correction
    note: >-
      Die Parteidarstellung von 1980 erklärt die Theorie der „bürgerlichen Zentrale“ für vollständig falsch und unhaltbar und spricht von fabriziertem Belastungsmaterial.
  - id: liu-biography-impact
  - id: liu-1968-carrier
  - id: liu-1968-mechanism
  - id: liu-biography-consequences
  - id: liu-1980-institutional-correction
  - id: liu-1980-context
    note: >-
      Die Parteizusammenfassung verzeichnet die Aufhebung der Beschuldigungen und des Untersuchungsberichts von 1968 sowie die Korrektur verbundener Unrechtsfälle.
