term: Dwarf planet
aliases:
- dwarf planets
shortDefinition: Under the IAU's Solar System definition, a body that orbits the Sun, is nearly round from its own gravity,
  but has not cleared its orbital neighbourhood.
longDefinition: The International Astronomical Union introduced the formal dwarf-planet category in 2006. A dwarf planet
  orbits the Sun and has enough self-gravity to become nearly round, but unlike a planet it has not cleared other comparable
  bodies from the neighbourhood of its orbit. Pluto, Eris, Haumea, Makemake, and Ceres are recognized examples.
relatedTerms:
- kuiper-belt
reviewedAt: '2026-08-21'
sources:
- title: 'Frequently Asked Questions: Why isn''t Pluto a planet?'
  url: https://www.iau.org/IAU/Iau/Science/What-we-do/FAQs.aspx
  publisher: International Astronomical Union
  note: Explains the IAU planet definition and why Pluto is classified as a dwarf planet.
