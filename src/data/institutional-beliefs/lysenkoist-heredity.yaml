title: Lysenkoist heredity
claim: Environmental treatment can reliably reshape heredity across generations, making Mendelian genetics unnecessary
  or false.
currentUnderstanding: Heredity is transmitted primarily through genetic information. Environmental effects can influence
  development and sometimes persist across generations, but they do not support the broad Lysenkoist claim that
  directed environmental treatment routinely rewrites inherited traits.
category: Genetics
entryId: acquired-traits-drive-evolution
reviewedAt: '2026-08-23'
impact:
  summary: 'Lysenkoism''s best-supported direct consequences were institutional: genetics was suppressed, scientists
    were dismissed or demoted, teaching and research were reorganized around a politically protected doctrine, and
    agricultural science lost decades of normal scientific correction. In China, Lysenko-influenced agronomic ideas
    also entered the Great Leap Forward, but the famine that followed was produced by several interacting policies
    and failures rather than by Lysenkoism alone.'
  highlights:
  - value: '127'
    label: University teachers dismissed in autumn 1948 in one historical accounting
    note: The same historical review reports that 66 of the 127 were professors; subsequent dismissals, demotions
      and removals from leadership were much broader.
  - value: Several thousand
    label: Scientists and teachers described as dismissed, demoted or removed from leadership after the 1948 Soviet
      campaign
    note: This is an institutional-repression estimate reported in the historical literature, not a death toll.
  - value: 15–30 million
    label: Estimated excess deaths in China's 1959–1961 Great Leap Forward famine
    note: Overall famine mortality, not deaths attributable specifically to Lysenkoism. Production losses, procurement,
      exports, collectivization and other political-economic mechanisms interacted.
  context:
  - 'In the Soviet Union, the turning point was the 1948 VASKhNIL session, organized under Lysenko and approved
    by Stalin. The session did more than endorse a theory: it ended open institutional competition with Mendelian
    genetics. An August 1948 Ministry of Higher Education order directed universities to revise biological teaching
    and staffing around Michurinist biology. Geneticists lost posts, departments were reorganized, textbooks and
    research materials were withdrawn, and the normal mechanisms by which a scientific claim could be challenged
    were deliberately weakened.'
  - 'An earlier phase overlaps chronologically with the Holodomor. Soviet authorities ordered immediate implementation
    of Lysenko''s vernalization program in 1931 and the treated acreage expanded rapidly, so his agricultural methods
    were already being promoted when the 1932–1933 Ukrainian famine occurred. But the evidence does not support
    presenting Lysenkoism as an important established cause of the Holodomor. Historical work instead places collectivization
    and grain seizure or procurement at the center, while recent quantitative work finds that migration restrictions
    and anti-Ukrainian bias in Soviet procurement and grain-retention policy contributed to mortality. The famine
    also strengthened rather than discredited Lysenko: afterward, the People''s Commissar for Agriculture instructed
    Vavilov to assist his work.'
  - China imported Lysenkoist biology after 1949, and Great Leap Forward agriculture later included ideas associated
    with that intellectual lineage, most visibly extreme close planting and deep plowing. Those practices could
    damage yields, but they were only one part of the disaster. Communalization altered incentives and household
    food access; large numbers of workers were diverted from farming; officials under political pressure reported
    inflated harvests; procurement targets were then imposed on a shrinking and badly measured crop; grain exports
    and increasingly rigid procurement reduced what remained for rural consumption; and political repression made
    reporting failure dangerous.
  - That distinction matters for attribution. Economic studies find that falling agricultural production, higher
    and more inflexible procurement, and grain exports all raised excess mortality, with no single mechanism accounting
    for the whole famine. The often-cited 15–30 million figure therefore describes the scale of the 1959–1961 famine
    as a whole. It is useful context for understanding the stakes of failed agricultural doctrine, but it is not
    a defensible count of people killed specifically by Lysenkoism.
