entryId: impetus
sourceReviewedAt: '2026-08-21'
term: Impetus
aliases:
- Impetustheorie
shortDefinition: Eine mittelalterliche Theorie, nach der ein Beweger einem Projektil eine fortwirkende Bewegungstendenz
  verleiht, sodass es sich nach dem Ende des Kontakts weiterbewegen kann.
longDefinition: In Jean Buridans einflussreicher Impetustheorie des 14. Jahrhunderts prägt der Werfer dem Projektil einen
  Impetus ein. Diese eingeprägte Eigenschaft hält die Bewegung aufrecht, bis Widerstände und andere Einflüsse sie abschwächen
  oder überwinden. Die Theorie war ein wichtiger Schritt weg von Erklärungen durch nachströmende Luft, aber noch keine
  newtonsche Trägheit, weil fortgesetzte Bewegung weiterhin einer positiven inneren Ursache zugeschrieben wurde.
