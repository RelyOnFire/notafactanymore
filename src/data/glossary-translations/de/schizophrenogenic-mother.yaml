locale: de
entryId: schizophrenogenic-mother
sourceReviewedAt: '2026-08-21'
term: Schizophrenogene Mutter
aliases:
- Theorie der schizophrenogenen Mutter
shortDefinition: Eine widerlegte Theorie des mittleren 20. Jahrhunderts, die angeblich kaltes, kontrollierendes oder
  widersprüchliches Verhalten von Müttern für die Entstehung von Schizophrenie verantwortlich machte.
longDefinition: Die Theorie der „schizophrenogenen Mutter“ war eine familienbeschuldigende Erklärung, die in Teilen der
  Psychiatrie des mittleren 20. Jahrhunderts einflussreich war. Bestimmte mütterliche Persönlichkeits- oder Kommunikationsmuster
  sollten Schizophrenie beim Kind verursachen. Spätere genetische, entwicklungsbiologische, epidemiologische und neurowissenschaftliche
  Forschung stützte dieses Modell nicht.
