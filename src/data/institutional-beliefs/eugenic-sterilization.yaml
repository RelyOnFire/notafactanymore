    summary: Japan's 1948 Eugenic Protection Act explicitly aimed to prevent births considered eugenically undesirable and authorized compulsory sterilization for specified conditions. The eugenic provisions remained until the law was revised in 1996.
    sources:
      - title: Japan turns pro-life — recent change in reproductive health policy and challenges by new technologies
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3952537/
        publisher: Reproductive Health
        note: Reviews the 1948 Eugenic Protection Act, its stated eugenic purpose, compulsory sterilizations, and the 1996 revision.
      - title: Measures concerning the implementation of amendments to the Eugenic Protection Act
        url: https://www.mhlw.go.jp/web/t_doc?dataId=00ta9683&dataType=1&pageNo=1
        publisher: Japan Ministry of Health, Labour and Welfare
        note: 1952 ministry circular documenting implementation and expansion of sterilization provisions under the law.
  - id: czechoslovakia-1972-1989
    polity: Czechoslovakia
    region: Eastern Europe
    startYear: 1972
    endYear: 1989
    periodLabel: 1972–1989
    strength: policy-basis
    institutionTypes: [government, medical]
    institutions:
      - Czechoslovak health administration
      - Local medical institutions
      - Social-welfare authorities
    consequences:
      - Coercive sterilization of Romani women
      - Reproductive discrimination
      - Racialized social policy
    summary: Czechoslovak sterilization rules were formally ethnicity-neutral, but doctors and social workers disproportionately and coercively applied them to Romani women. Dissidents documented administrative programs targeting Roma by the late 1970s, while later scholarship traces the practice to institutional continuities between eugenics, medical genetics, and state social policy.
    sources:
      - title: The Forced Sterilization of Roma Women between the 1970s and the 1980s — The Rise of Eugenic Socialism
        url: https://www.cambridge.org/core/services/aop-cambridge-core/content/view/FBBFB9B019376D944CFD499875342619/9789048544059c6_p177-202_CBO.pdf/the-forced-sterilization-of-roma-women-between-the-1970s-and-the-1980s-the-rise-of-eugenic-socialism.pdf
        publisher: Amsterdam University Press / Cambridge Core
        note: Examines the transfer from eugenics to medical genetics and the enforced sterilization of Roma women in socialist Czechoslovakia.
      - title: “We Won't Ban Castrating Pervs Despite What Europe Might Think!” — Czech Medical Sexology and the Practice of Therapeutic Castration
        url: https://www.cambridge.org/core/journals/medical-history/article/we-wont-ban-castrating-pervs-despite-what-europe-might-think-czech-medical-sexology-and-the-practice-of-therapeutic-castration/33F2D0706DFACCEB04DC35D11AEA9655
        publisher: Medical History
        note: Notes that sterilization was specified by a 1972 health directive and that ethnicity-neutral rules were coercively and disproportionately applied to Roma women.
