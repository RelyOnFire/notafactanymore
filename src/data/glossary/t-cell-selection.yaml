term: T-cell selection
aliases:
- thymic selection
- positive selection
- negative selection
shortDefinition: The developmental screening of immature T cells in the thymus that preserves useful cells while eliminating
  or restraining many cells likely to react dangerously against the body's own tissues.
longDefinition: During T-cell development in the thymus, immature cells are tested through several selection steps. Positive
  selection favors cells whose receptors can interact appropriately with the body's antigen-presenting machinery. Negative
  selection removes many cells that bind self molecules too strongly, while additional mechanisms generate regulatory
  cells. Together these processes help produce a useful T-cell repertoire while establishing central immune tolerance.
relatedTerms:
- t-cell
