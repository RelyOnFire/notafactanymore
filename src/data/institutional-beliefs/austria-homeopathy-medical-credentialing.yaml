title: Homeopathy as a certified medical therapy in Austria
claim: Austria's medical profession formally treated homeopathy as a physician therapy whose principles and clinical
  application could be taught, examined, credentialed, and used to treat acute and chronic disease.
currentUnderstanding: Homeopathy has not shown robust, reproducible therapeutic effects beyond placebo for any known
  disease. Its central claims, including therapeutic effects from extreme dilutions and the homeopathic similarity
  principle, are not supported by established chemistry, pharmacology, or reliable clinical evidence. Professional
  credentialing can standardize how a practice is taught without demonstrating that the practice itself is effective.
category: Medicine and public health
reviewedAt: '2026-08-24'
impact:
  summary: Since 1994 the Austrian Medical Chamber has maintained a formal homeopathy diploma for physicians. The
    current curriculum defines homeopathy as a medical therapy, requires three years and 350 teaching units, and
    says diploma holders may treat acute and chronic disease according to homeopathic rules. This professional endorsement
    exists alongside a contrary Austrian health-policy position that homeopathy is not a scientifically established
    healing method and is generally not eligible for public reimbursement.
  highlights:
  - value: '1994'
    label: Homeopathy received an Austrian Medical Chamber special diploma
  - value: 350 units
    label: Current ÖÄK diploma requires at least three years of physician training
  - value: '675'
    label: physicians held the ÖÄK homeopathy diploma at the end of 2024
  context:
  - This card concerns professional medical credentialing, not a claim that Austria's statutory health insurance
    generally reimburses homeopathy. Austrian social-insurance authorities have explicitly distinguished the two
    and stated that homeopathy is not recognized as a scientifically established healing method for general reimbursement.
  - 'The institutional contradiction is the point: one major Austrian medical institution continues to credential
    physicians in homeopathic diagnosis and treatment while other Austrian health authorities have explicitly cited
    insufficient therapeutic evidence.'
