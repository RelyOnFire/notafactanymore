locale: de
entryId: chlorella-algolization
sourceReviewedAt: 2026-08-23
title: Chlorella-„Algolisierung“ zur Sanierung von Gewässern
claim: >-
  Das Einbringen ausgewählter planktonischer Chlorella-Stämme in natürliche Gewässer wurde als verlässliche Methode
  behandelt, um Cyanobakterienblüten zu unterdrücken und die Wasserqualität über die behaupteten ökologischen Mechanismen
  zu verbessern.
currentUnderstanding: >-
  Chlorella hat legitime Anwendungen in Biotechnologie und Abwasserforschung. Die Evidenz belegt jedoch nicht, dass das
  Beimpfen natürlicher Stauseen mit ausgewählten Chlorella-Stämmen Cyanobakterienblüten zuverlässig unterdrückt oder die
  weitreichenden Sanierungseffekte der sogenannten Algolisierung erzielt. Russische staatliche Versuche von 2007 konnten
  die Wirksamkeit nicht nachweisen; 2009 kam ein wissenschaftlich-technischer Beirat der Föderalen Wasseragentur zu dem
  Schluss, dass der vorgeschlagene Einsatz von Chlorella gegen Algenblüten wissenschaftlich nicht begründet und durch die
  Praxis nicht bestätigt sei; 2014 bezeichnete die Hydrobiologische Gesellschaft bei der Russischen Akademie der Wissenschaften
  die sogenannte Algolisierung als falsche Methode, die der russischen Hydrobiologie erheblichen Schaden zufüge.
impact:
  summary: >-
    Das Bemerkenswerte an diesem Fall ist der institutionelle Widerspruch selbst. Russische Wasserbehörden erzeugten negative
    oder nicht eindeutige Evidenz, ein föderaler wissenschaftlicher Beirat verwarf die behauptete Methode zur Unterdrückung
    von Algenblüten als unbelegt, und 2014 lehnte ein Kongress der Hydrobiologischen Gesellschaft bei der Russischen Akademie
    der Wissenschaften das Verfahren ausdrücklich ab. Später erhielt die Algolisierung dennoch formalen Status und amtliche
    technische Legitimität in russischen nationalen Normen.
  highlights:
    - value: '2009'
      label: Ein föderaler wissenschaftlicher Beirat erklärte die Methode zur Blütenunterdrückung für wissenschaftlich unbegründet und praktisch nicht bestätigt
    - value: '2014'
      label: Die Hydrobiologische Gesellschaft bei der Russischen Akademie der Wissenschaften bezeichnete die sogenannte Algolisierung als falsche und schädliche Methode
    - value: '2022'
      label: Algolisierung wurde in einer russischen nationalen Norm festgeschrieben
    - value: '2025'
      label: Eine eigene nationale Norm für Chlorella-Algolisierung wurde eingeführt
  context:
    - >-
      Die zeitliche Abfolge ist entscheidend. Der erste großflächige Einsatz im Pensa-Stausee 1998 wird in der späteren Norm
      von 2025 selbst als wirkungslos beschrieben. Ein Versuch der Föderalen Wasseragentur am Zimljansker Stausee 2007 lieferte
      keine eindeutigen Wirksamkeitsnachweise; 2009 kam ihr wissenschaftlich-technischer Beirat zu dem Schluss, der vorgeschlagene
      Chlorella-Einsatz gegen Algenblüten sei wissenschaftlich nicht begründet und praktisch nicht bestätigt, und weitere
      Forschungs- und Entwicklungsarbeiten in diese Richtung seien nicht zweckmäßig.
    - >-
      2014 verschärfte sich der Widerspruch. Der XI. Kongress der Hydrobiologischen Gesellschaft bei der Russischen Akademie
      der Wissenschaften beschloss, die sogenannte Algolisierung als falsche Methode anzusehen, die der russischen Hydrobiologie
      erheblichen Schaden zufüge. Spätere russische Gewässerforschung berichtete ebenfalls, dass der behauptete Konkurrenzmechanismus
      nicht belegt sei, und bezeichnete die Methode als unwirksam und mit möglichen hygienischen Risiken verbunden.
    - >-
      Dennoch erhielt das Verfahren nationalen Normstatus. GOST R 59977-2022 nahm Algolisierung in eine Norm zur Gewässersanierung
      auf, und GOST R 71946-2025 schuf einen eigenen Standard für planktonische Chlorella-Stämme. Das ist eine formale technische
      Billigung, aber kein Beleg für eine allgemeine gesetzliche Pflicht: Artikel 26 des Föderalen Gesetzes 162-FZ sieht für
      Dokumente des nationalen Normungssystems grundsätzlich freiwillige Anwendung vor, sofern die Gesetzgebung nichts anderes
      bestimmt; zusätzliche Bindungswirkung entsteht unter anderem bei einer öffentlichen Konformitätserklärung.
episodes:
  - id: russia-2022-2026
    polity: Russland
    summary: >-
      Russland verlieh der Chlorella-basierten Algolisierung mit GOST R 59977-2022 und anschließend mit dem eigens dafür
      geschaffenen GOST R 71946-2025 formalen Status als nationale Norm. Die Standards legen die Durchführung des Verfahrens
      fest und schreiben ihm Verbesserungen der Wasserqualität zu. Diese amtliche technische Billigung erfolgte, nachdem ein
      Versuch der Föderalen Wasseragentur 2007 keine Wirksamkeit belegt hatte, ihr wissenschaftlich-technischer Beirat 2009
      den Einsatz gegen Algenblüten als wissenschaftlich unbegründet und praktisch nicht bestätigt bewertet hatte und die
      Hydrobiologische Gesellschaft bei der Russischen Akademie der Wissenschaften das Verfahren 2014 ausdrücklich abgelehnt
      hatte. Der Standard von 2025 gilt 2026 weiterhin; nationale Normen werden in Russland jedoch grundsätzlich freiwillig
      angewandt, sofern kein gesonderter rechtlicher oder konformitätsbezogener Mechanismus sie verbindlich macht.
    consequences:
      - Nationale Normen kodifizierten die Algolisierung formal als Verfahren zur Sanierung von Gewässern
      - Das normierte Verfahren legte Chlorella-Stämme, Einsatzmengen, wiederholte Behandlungen und Überwachungsanforderungen fest
      - Ein eigener Standard von 2025 erfasste Trinkwasserquellen, Freizeitgewässer, Fischereigewässer und Gewässer der biologischen Reinigung
    institutions:
      - Rosstandart (Föderale Agentur für technische Regulierung und Metrologie)
      - Russisches Institut für Standardisierung
      - Technisches Komitee 409 „Umweltschutz“
    institutionalContext: >-
      Die institutionelle Billigung erfolgte durch nationale technische Normung; eine pauschale gesetzliche Anordnung an alle
      russischen Gewässerbetreiber, Algolisierung einzusetzen, bestand nicht. Nach Artikel 26 des Föderalen Gesetzes 162-FZ werden nationale
      Normungsdokumente grundsätzlich freiwillig angewandt, sofern die Gesetzgebung nichts anderes bestimmt; für Hersteller
      oder Leistungserbringer wird eine Norm außerdem verbindlich, wenn sie ihre Konformität damit öffentlich erklären.
      GOST R 71946-2025 wurde vom privaten „Innovativen Umweltfonds“ (INEKO) entwickelt, über das Technische Komitee 409
      eingebracht und im Rosstandart-Normungssystem genehmigt. Damit bestand eine amtliche technische Billigung,
      nicht eine verpflichtende landesweite Anwendung.
