schemaVersion: 2
title: Homeopathy as effective treatment
proposition:
  summary: >-
    Homeopathy was treated as a medically effective therapy strongly enough to justify public provision, reimbursement,
    formal incorporation into health systems, or professional physician credentialing.
correction:
  summary: >-
    Homeopathy has not shown robust, reproducible therapeutic effects beyond placebo for any known disease. Its central
    claims, including effects from extreme dilutions that may contain none of the starting substance, are not compatible
    with established chemistry and pharmacology. Clinical attention and placebo effects can still influence how patients
    feel, but they do not establish a specific effect of the homeopathic preparation. An Australian evidence evaluation
    completed in 2024 found low-certainty evidence of possible benefits over placebo for reducing medication use in
    allergic rhinitis and disease severity in atopic dermatitis. Many other outcomes showed little to no benefit or
    remained uncertain or unknown.
category: Medicine and public health
reviewedAt: '2026-09-07'
episodes:
  - id: united-kingdom-1948-2017
    polity: United Kingdom
    region: Europe
    startYear: 1948
    endYear: 2017
    periodLabel: 1948–2017 (through prescribing guidance in England)
    strength: policy-basis
    institutionTypes:
      - government
      - medical
      - professional
    institutions:
      - National Health Service
      - Royal London Homoeopathic Hospital
      - Bristol Homeopathic Hospital
      - Liverpool Homeopathic Hospital
      - Glasgow Homoeopathic Hospital
    institutionalContext: >-
      Homeopathy was embedded in the NHS through a mixture of specialist hospitals, general-practice prescribing and local
      commissioning rather than through a single national homeopathy agency. The 2010 Commons report identified
      homeopathic hospital services in London, Bristol, Liverpool and Glasgow. In England, local Primary Care Trusts and
      later commissioning bodies determined much of the referral and funding machinery. NHS England issued prescribing
      guidance in 2017 for England's primary care.
    consequences:
      - Public funding of homeopathic treatment
      - NHS prescribing and referrals
      - Dedicated homeopathic hospital services
    summary: >-
      Homeopathy was funded and provided within the NHS from its creation in 1948, including through specialist homeopathic
      hospitals and primary-care prescribing. A 2010 House of Commons evidence review concluded that the evidence did not
      support efficacy beyond placebo and recommended that the NHS stop funding homeopathy. NHS England adopted guidance
      in 2017 advising against initiating homeopathic items in primary care and supporting deprescribing for existing
      patients because there was no clear or robust evidence of clinical effectiveness. This prescribing response applied
      to England.
    mechanism:
      kind: administrative-adoption
      summary: >-
        NHS institutions funded specialist homeopathic services, prescribing and referrals through hospital, primary-care
        and commissioning structures, giving the therapy a place within publicly provided health care.
    institutionalCorrection:
      status: partial
      periodLabel: '2017'
      action: NHS England advised commissioners that primary-care prescribers should not initiate homeopathic items for new patients and should be supported in deprescribing them for all existing patients, with supporting services where appropriate.
      summary: >-
        NHS England reduced institutional support through primary-care prescribing guidance because robust
        clinical-effectiveness evidence was lacking. The 2017 endpoint marks that policy response in England; the sources
        do not establish a simultaneous end to all NHS-linked hospital services or homeopathic use across the United Kingdom.
  - id: france-1984-2021
    polity: France
    region: Europe
    startYear: 1984
    endYear: 2021
    strength: policy-basis
    institutionTypes:
      - government
      - medical
    institutions:
      - Assurance Maladie
      - Ministère des Affaires sociales et de la Solidarité nationale
    institutionalContext: >-
      The 1984 reimbursement list was issued by the Ministère des Affaires sociales et de la Solidarité nationale and
      operated through compulsory health insurance, prescribing physicians and pharmacies. These distributed professional
      channels formed the reimbursement machinery rather than a single national prescribing and pharmacy system. The
      arrangement covered listed homeopathic medicines supplied on prescription; branded homeopathic products were not
      reimbursed under it. In 2019 the Haute Autorité de Santé performed the scientific reassessment that led to withdrawal
      of reimbursement.
    consequences:
      - Public reimbursement of listed homeopathic medicines
      - Routine prescribing within insured health care
      - Public coverage before a scientific assessment for reimbursement
    summary: >-
      Listed homeopathic medicines were reimbursable through France's compulsory health-insurance system under a framework
      dating from 1984. In 2019, the Haute Autorité de Santé carried out France's first scientific assessment specifically for
      reimbursement and found that efficacy had not been demonstrated sufficiently to justify public coverage.
      Reimbursement was reduced in 2020 and ended on 1 January 2021.
    mechanism:
      kind: administrative-adoption
      summary: >-
        A ministerial reimbursement list and compulsory health insurance made listed homeopathic medicines publicly
        reimbursable through ordinary prescribing and pharmacy channels.
    institutionalCorrection:
      status: corrected
      periodLabel: 2019–1 January 2021
      action: France's health authorities found efficacy insufficient for reimbursement, reduced reimbursement in 2020, and ended compulsory-insurance reimbursement on 1 January 2021.
      summary: >-
        The French public reimbursement system directly reversed its earlier support after a formal scientific assessment
        found the evidence of efficacy insufficient to justify continued coverage.
  - id: brazil-2006-2026
    polity: Brazil
    region: Latin America
    startYear: 2006
    endYear: 2026
    endOpen: true
    strength: policy-basis
    institutionTypes:
      - government
      - medical
      - education
    institutions:
      - Ministério da Saúde
      - Sistema Único de Saúde (SUS)
    institutionalContext: >-
      PNPIC is a federal Ministry of Health policy implemented through Brazil's decentralized SUS. State and municipal
      health secretariats and services carry local implementation responsibilities. These bodies vary by jurisdiction and
      together form decentralized implementation machinery rather than a single institution. Homeopathic care already
      existed in some public services before 2006; this episode concerns its inclusion in the national PNPIC framework.
      EASAC's assessment of therapeutic efficacy is an external scientific assessment, separate from Brazilian policy decisions.
    consequences:
      - National policy provision for public homeopathic care
      - Policy support for incorporation into primary and specialist care
      - Policy provision for expanding public access to prescribed homeopathic medicines
      - Policy support for training and dissemination within the health system
    summary: >-
      Brazil's 2006 National Policy on Integrative and Complementary Practices formally included homeopathy in its
      framework for the public SUS system and called on health authorities to expand homeopathic consultations, medicines,
      professional training, and services. The policy described homeopathy as contributing to prevention and recovery and
      to reduced demand for hospital and emergency interventions. These were the policy's therapeutic claims.
      Homeopathy remains listed within the national PNPIC framework as of 2026.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Federal health policy incorporated homeopathy into PNPIC/SUS and set out provisions for decentralized public-health
        institutions to expand consultations, medicines, training and service provision.
    institutionalCorrection:
      status: undocumented
      summary: >-
        The reviewed sources do not document a corrective withdrawal or efficacy-based restriction by the Ministry of
        Health or SUS. Official policy materials continue to include homeopathy. External scientific assessments do not
        establish a corrective response by these institutional carriers.
  - id: austria-1994-2026
    polity: Austria
    region: Europe
    startYear: 1994
    endYear: 2026
    endOpen: true
    strength: officially-endorsed
    institutionTypes:
      - professional
      - medical
    institutions:
      - Österreichische Ärztekammer (Austrian Medical Chamber)
      - Österreichische Akademie der Ärzte
    institutionalContext: >-
      The Austrian Medical Chamber introduced a special diploma in homeopathy in 1994 and continues to maintain it within
      its formal physician continuing-education system. The current curriculum calls homeopathy a medical therapy using
      remedies tested on healthy people, potentiation and the similarity principle; it states that graduates may treat
      acute and chronic illnesses according to homeopathic rules. The Austrian Academy of Physicians administers the
      diploma on behalf of the Medical Chamber. This is professional credentialing rather than national insurance coverage:
      in an April 2017 statement, the Hauptverband der österreichischen Sozialversicherungsträger reported that the Supreme
      Health Council had not recognized homeopathy as scientifically established and that homeopathic medicines generally
      lacked sufficient evidence for reimbursement. The external scientific assessments by EASAC and the Australian
      evidence reviewers concern therapeutic efficacy, separately from the Chamber's credentialing decisions.
    consequences:
      - Formal physician credential in homeopathic diagnosis and treatment
      - Training pathway of at least three years and 350 units recognized by the Austrian Medical Chamber
      - A curriculum presenting homeopathy as a way to treat acute and chronic disease
      - 675 homeopathy diploma holders recorded at 31 December 2024
    summary: >-
      Austria's Medical Chamber has formally credentialed physicians in homeopathy since 1994. Its current ÖÄK diploma
      curriculum defines homeopathy as a medical therapy, teaches potentiation and the similarity principle, and says
      qualified physicians can use the method to treat acute and chronic illnesses. Following a review, the Chamber's board
      decided in April 2018 to retain its existing complementary-medicine diplomas as qualifications for structured training.
      The credential remains active: the Chamber's 2025 training report counted 675 diploma holders at the end of 2024.
      This endorsement coexists with a separate Austrian health-policy judgment: the social-insurance umbrella body's
      April 2017 statement reported that homeopathy was not scientifically established and that homeopathic medicines
      generally did not meet the evidentiary threshold for reimbursement.
    mechanism:
      kind: credentialing
      summary: >-
        The Medical Chamber and Academy of Physicians maintain a formal postgraduate diploma that trains and credentials
        physicians to diagnose and treat acute and chronic illnesses according to homeopathic principles.
    institutionalCorrection:
      status: uncorrected
      periodLabel: April 2018 review decision
      action: Following a review, the Austrian Medical Chamber's board retained the existing complementary-medicine diplomas as qualifications for structured continuing education.
      summary: >-
        The Chamber's reported April 2018 decision maintained the diplomas, including homeopathy. Its homeopathy diploma
        and therapeutic curriculum remain active in the materials reviewed in 2026. The social-insurance body's separate
        criticism does not constitute a withdrawal of the credential by the Chamber or Academy.
