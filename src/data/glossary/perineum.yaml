term: Perineum
aliases:
- perineal
- perineal tissue
shortDefinition: The region of tissue at the bottom of the pelvis; in childbirth discussions, the term commonly refers
  to the tissue between the vaginal opening and anus.
longDefinition: Anatomically, the perineum is the diamond-shaped region below the pelvic floor between the thighs. In
  obstetric use, 'perineum' often refers more narrowly to the tissue between the vaginal opening and anus that stretches
  during vaginal birth and may tear or be incised during an episiotomy.
relatedTerms:
- episiotomy
reviewedAt: '2026-08-21'
sources:
- title: WHO recommendation on routine or liberal use of episiotomy
  url: https://www.ncbi.nlm.nih.gov/books/NBK615641/table/part1.tab76/
