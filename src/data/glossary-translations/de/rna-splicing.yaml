term: RNA-Spleißen
aliases: []
shortDefinition: Der Prozess, bei dem Introns aus einer Vorläufer-RNA entfernt und die erhaltenen Abschnitte miteinander verbunden werden.
longDefinition: Beim RNA-Spleißen schneidet die zelluläre Maschinerie Introns aus einer Vorläufer-RNA heraus und verbindet die erhaltenen Exons. Alternatives Spleißen kann Exons in unterschiedlichen Kombinationen zusammenfügen.
