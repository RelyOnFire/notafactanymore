schemaVersion: 2
locale: "de"
entryId: "xiahe-1958-suppression-wrongful-cases"
sourceReviewedAt: "2026-11-25"
title: "Die später aufgehobenen Fälle der Unterdrückungskampagnen in Xiahe (1958)"
proposition:
  summary: >-
    Im Jahr 1958 behandelten Behörden im Kreis Xiahe, zu dem das Kloster Labrang gehört, Menschen, die
    während der Niederschlagung bewaffneten Widerstands und antifeudaler politischer Kampagnen
    beschuldigt oder bestraft wurden, als rechtmäßige Ziele staatlicher Maßnahmen. Die ursprünglichen
    Einzelfallentscheidungen wurden von Regierungs- und Sicherheitsinstitutionen getragen. Amtliche
    Darstellungen rechtfertigten die Kampagne; die spätere Kreis-Chronik räumte jedoch eine erhebliche
    Ausweitung der Maßnahmen ein.
correction:
  summary: >-
    Bei einer erneuten Überprüfung im Jahr 1982 hoben die Behörden einen Großteil der untersuchten
    Einzelfälle der Xiahe-Kampagnen von 1958 auf: Von 1.059 Fällen mit 1.059 Betroffenen wurden 1.020
    Personen formell rehabilitiert; 39 ursprüngliche Entscheidungen blieben bestehen. Die Justiz der
    Präfektur Gannan dokumentierte getrennt davon zahlreiche Aufhebungen und Änderungen von
    Entscheidungen aus 1958–1959. Die Unterlagen belegen falsche amtliche Einzelfallentscheidungen, nicht
    dass es keinen bewaffneten Konflikt oder keine wirklichen Straftaten gab.
impact:
  summary: >-
    Ein bewaffneter Einsatz sowie von der Partei angeordnete antifeudale und religiöse Reformkampagnen
    veränderten Xiahe und das bedeutende Kloster Labrang. Spätere örtliche Chroniken räumten erhebliche
    Übergriffe ein, dokumentierten die Schließung von 192 der 196 Klöster in der Präfektur Gannan und die
    umfassende Korrektur von Einzelfällen 1982. Unabhängige Forschung belegt Haft, erzwungene Abgänge und
    die Unterbrechung des Klosterlebens in Labrang. Die 1.020 rehabilitierten Menschen stammen aus der
    Kreisprüfung von Xiahe; man darf sie weder sämtlich als Mönche von Labrang bezeichnen noch als die
    Gesamtzahl der 1958 Verfolgten.
  highlights:
    -
      value: "1.059"
      label: "1958 entstandene Fälle mit jeweils einer betroffenen Person, die Xiahe 1982 überprüfte"
    -
      value: "1.020"
      label: "in dieser Kreisprüfung von 1982 formell rehabilitierte Fälle und Personen"
    -
      value: "39"
      label: "in derselben Prüfung bestätigte ursprüngliche Entscheidungen"
  context:
    - >-
      Die Kreis-Chronik dokumentiert frühere amtliche Korrekturen: 1972 wurden falsche Urteile und
      Einstufungen berichtigt, 1978 Verurteilungen aus den Jahren 1959–1961 überprüft, und 1979
      räumte ein Provinzbericht Fehlurteile, übermäßig weitgehende Beschlagnahmungen und Todesfälle
      durch mangelhafte Haftführung ein. Diese Maßnahmen und Fallzahlen sind von der eigenständigen
      Kreisprüfung des Jahres 1982 zu unterscheiden und dürfen nicht addiert werden.
    - >-
      Die amtliche Kreis-Chronik berichtet von realen bewaffneten Auseinandersetzungen 1958 in Gannan. Sie
      bezeichnet deren Niederschlagung als grundsätzlich richtig, räumt aber eine schwere Ausweitung ein.
      Die Korrektur falscher Entscheidungen widerlegt weder die Kämpfe noch jede einzelne Anschuldigung
      gegen frühere örtliche Machthaber.
    - >-
      Die Zahlen von 1982 betreffen eine bestimmte amtliche Überprüfung, nicht alle 1958 festgenommenen,
      beschuldigten, getöteten oder bestraften Personen. Die Quellen isolieren nicht, wie viele der 1.020
      Rehabilitierten Mönche von Labrang waren, und nennen keine belastbare Todeszahl.
    - >-
      Die getrennte Gerichtsprüfung der Präfektur Gannan umfasste 2.937 Strafsachen mit 7.980 Menschen. Sie
      hatte andere Fallabgrenzungen und möglicherweise Überschneidungen mit Xiahe. Daher dürfen diese
      Zahlen nicht addiert werden.
    - >-
      Labrang liegt in Xiahe, aber Kampagnen und Fallprüfungen betrafen eine größere Bevölkerung. Für die
      Zahl der nach 1958 verbliebenen Mönche gibt es spätere Angaben zwischen etwa 200 und 410; ein
      interner Xinhua-Bericht nannte für April 1959 dagegen 18. Unterschiedliche Zeitpunkte und
      Zählkategorien verhindern einen direkten Schluss auf eine Fälschung.
    - >-
      Der gedruckte interne Xinhua-Bericht (Nr. 2757) wird in der Bibliothek der Chinese University of Hong
      Kong aufbewahrt. Eine Transkription wurde dem Projekt über Princeton bereitgestellt. Der Kataloglink
      enthält nicht den vollständigen Text; hier wird keine komplette lizenzierte Transkription
      veröffentlicht.
    - >-
      Die frühere religiöse und politische Ordnung war weder egalitär noch allgemein frei von Zwang.
      Bestehende soziale Ungleichheit rechtfertigt jedoch keine späteren unrechtmäßigen Strafverfahren oder
      Massenmaßnahmen.
episodes:
  -
    id: "prc-xiahe-1958-1982"
    polity: "Volksrepublik China"
    periodLabel: "Kampagnen von 1958 bis zur Rehabilitierung von 1982"
    institutions:
      - "Partei- und Regierungsbehörden des Kreises Xiahe"
      - "Behörden und Gerichte der Autonomen Tibetischen Präfektur Gannan"
      - "Provinzkomitee Gansu der Kommunistischen Partei Chinas"
      - "An der Niederschlagung von 1958 beteiligte Volksbefreiungsarmee und örtliche Milizen"
    institutionalContext: >-
      Die Kreis-Chronik dokumentiert bewaffnete Kämpfe im März 1958, Einsätze von Militär und Miliz sowie
      den Einsatz von Partei- und Provinz-Arbeitsteams in Klöstern, darunter Labrang. Die Teams führten
      antifeudale und religiöse Reformkampagnen durch. Einzelfälle wurden von Regierung und Justiz
      behandelt. Später bezeichnete dieselbe Geschichte das Vorgehen als erheblich ausgeweitet. Nach einer
      1982 eingeleiteten Neubewertung rehabilitierte Xiahe 1.020 Menschen in 1.020 Fällen. Eine separate
      Gerichtsprüfung erfasste weitere Fälle aus 1958–1959 auf Präfekturebene.
    summary: >-
      Die Behörden des Kreises Xiahe führten 1958 militärische und antifeudale Kampagnen in einem Gebiet
      durch, zu dem das Kloster Labrang gehört. Amtliche Quellen rechtfertigten die Kampagne, räumten
      später aber eine schwerwiegende Ausweitung ein. Bei der Prüfung der Fälle im Jahr 1982 wurden 1.020
      der 1.059 Einzelfälle mit jeweils einem Betroffenen formell rehabilitiert. Die Gerichtsakten der
      Präfektur belegen weitere Korrekturen. Dieser Fall dokumentiert eine amtliche Neubewertung von
      Beschuldigungen und Sanktionen, ohne die Kreisstatistik der Mönchsbevölkerung zuzuordnen.
    mechanism:
      summary: >-
        Von der Partei gelenkte Kampagnen, Sicherheitsoperationen, politische Fallklassifizierung sowie
        gerichtliche und administrative Sanktionen verwandelten Anschuldigungen wegen Rebellion oder feudal
        gefasster Vergehen in amtliche Folgen. Anordnungen der Provinz und spätere Gerichtsprüfungen führten
        zur erneuten Bearbeitung und Aufhebung zahlreicher Einzelfallentscheidungen.
    consequences:
      - >-
        Einzelfallentscheidungen aus den staatlichen Kampagnen führten zu Sanktionen gegen Bewohner Xiahes,
        die später in vielen Fällen als unrechtmäßig anerkannt wurden.
      - >-
        Die bewaffnete Niederschlagung und von der Partei gesteuerte politische Kampfsitzungen erfassten auch
        Gemeinschaften rund um das Kloster Labrang.
      - >-
        Im Zuge der Reformen von 1958 wurden in der gesamten Präfektur Gannan 192 Klöster geschlossen; vier
        blieben am angegebenen Stichtag formell bestehen.
      - >-
        Die Feldforschung dokumentiert Haft, Arbeitslager und erzwungene Entfernung von Mönchen sowie die
        Unterbrechung des gewöhnlichen religiösen Lebens in Labrang.
      - >-
        Die Kreisprüfung von 1982 rehabilitierte 1.020 Personen und bestätigte 39 Entscheidungen; die
        getrennte Gerichtsprüfung der Präfektur änderte oder hob ebenfalls zahlreiche Fälle auf.
    institutionalCorrection:
      periodLabel: "Erneute Prüfung und Rehabilitierung 1982"
      action: >-
        Die Behörden des Kreises Xiahe überprüften 1.059 aus den Kampagnen von 1958 stammende Fälle,
        rehabilitierten 1.020 Menschen und bestätigten 39 ursprüngliche Entscheidungen.
      summary: >-
        Die amtliche Kreis-Chronik dokumentiert diese Korrektur. Die Gerichte der Präfektur Gannan legten
        eine eigene Neubewertung von Fällen aus 1958–1959 vor. Die gesamte Niederschlagung von 1958 wurde
        nicht verworfen; die geprüften Quellen belegen auch nicht, dass alle Betroffenen Wiedergutmachung
        erhielten oder sämtliche damit verbundenen Fälle untersucht wurden.
evidence:
  -
    id: "xh-1958-campaign-official"
    note: >-
      Die Kreis-Chronik schildert den Militäreinsatz als Reaktion auf einen bewaffneten Aufstand und
      bezeichnet die Niederschlagung trotz erheblicher Ausweitung als grundsätzlich gerechtfertigt. Sie
      dokumentiert Parteikampagnen und Arbeitsteams, die auch im Kloster Labrang tätig waren.
  -
    id: "xh-1958-bureaucratic-process"
    note: >-
      Dieselbe Kreisgeschichte verknüpft Maßnahmen von 1958 mit später überprüften Einzelfällen aus der
      Niederschlagung und der antifeudalen Kampagne. Die ursprünglichen Anklageakten fehlen; nicht alle
      Betroffenen waren Mönche.
  -
    id: "xh-1982-primary-reversal"
    note: >-
      Die Kreisgeschichte nennt 1.059 im Jahr 1982 überprüfte Fälle mit jeweils einer betroffenen Person,
      davon 1.020 rehabilitierte Personen und Fälle. Die übrigen Entscheidungen blieben bestehen.
  -
    id: "xh-1982-index-count"
    note: >-
      Eine separat veröffentlichte digitale Wiedergabe derselben Primärquelle bestätigt 1.059 überprüfte
      und 1.020 rehabilitierte Fälle. Sie ist keine zweite unabhängige Untersuchung.
  -
    id: "gn-1982-prefecture-reversal"
    note: >-
      Die Präfekturgeschichte nennt eine gerichtliche Überprüfung von 2.937 Strafsachen mit 7.980 Personen
      aus 1958–1959: 1.811 Fälle wurden rehabilitiert, 173 geändert und 953 bestätigt. Diese Gruppe ist von
      der Kreisprüfung zu unterscheiden und kann sich mit ihr überschneiden.
  -
    id: "xh-impact-1982-count"
    note: >-
      Die offizielle Rehabilitierung von 1.020 Fällen belegt eine umfangreiche institutionelle Korrektur.
      Die Quelle liefert weder die Gesamtzahl aller 1958 Betroffenen noch eine gesicherte Todeszahl.
  -
    id: "xh-impact-1958-temples"
    note: >-
      Nach der Kreis-Chronik waren bis zum 20. November 1958 nur noch vier der 196 tibetisch-buddhistischen
      Klöster in der gesamten Präfektur Gannan geöffnet. Die 192 Schließungen sind keine Zahl für den Kreis
      Xiahe allein.
  -
    id: "xh-impact-scholar"
    note: >-
      Die Feldforschung dokumentiert Haft, Arbeitslager, erzwungene Entfernung von Mönchen und den
      weitgehenden Ausfall des religiösen Bildungsbetriebs. Das bedeutet nicht, dass sämtliche 1.020
      Rehabilitierten Mönche waren.
  -
    id: "xh-makley-memory"
    note: >-
      Die ethnografische Untersuchung beschreibt politische Lebensgeschichten und öffentliche
      Kampfsitzungen in Labrang sowie den bleibenden Einfluss auf die Erinnerung der örtlichen Bevölkerung;
      sie ist keine zweite Zählung der rehabilitierten Kreisfälle.
  -
    id: "xh-carrier-county"
    note: >-
      Die Kreisgeschichte nennt lokale Sicherheitskräfte, Miliz, Parteiarbeitsteams, einen provinziellen
      Einsatz im Kloster Labrang und später die von der Provinz geleitete Neubewertung.
  -
    id: "xh-carrier-prefecture-judiciary"
    note: >-
      Das Mittlere Volksgericht der Präfektur und die Kreisgerichte überprüften 1982 Fälle auf Grundlage
      zentraler und präfekturaler Weisungen. Die Präfektur- und Kreiszahlen werden nicht zusammengerechnet.
  -
    id: "xh-mechanism-1958"
    note: >-
      Die Kampagne verband bewaffnete Niederschlagung, politische Einstufung und Sanktionierung
      Beschuldigter sowie Parteiarbeitsteams für antifeudale Kampfsitzungen und religiöse Umstrukturierung.
  -
    id: "xh-mechanism-1959-internal"
    note: >-
      Eine über Princeton bereitgestellte Transkription des internen Xinhua-Berichts nennt mehr als 1.000
      verhaftete oder kontrollierte Mönche und etwa 2.000, die ins Laienleben zurückgekehrt seien. Der Link
      führt nur zum Katalog des gedruckten Bestands; die Zahlen sind amtliche Behauptungen, keine
      unabhängig geprüfte Zählung.
  -
    id: "xh-mechanism-reform-policy"
    note: >-
      Eine amtliche Darstellung der Religionsreform von 1958 beschreibt Schutz des Glaubens und Maßnahmen
      gegen Ausbeutung, zugleich aber Arbeitspflichten. Die formulierte Religionsfreiheit beweist nicht
      ihre tatsächliche Beachtung in Labrang.
  -
    id: "xh-consequences-labrang"
    note: >-
      Die Untersuchung beschreibt Haft, erzwungene Aufgabe des Mönchslebens und fast vollständigen
      Stillstand der gewöhnlichen religiösen Praxis. Befragte nannten etwa 200 verbliebene Mönche; eine von
      Slobodník zitierte chinesische Publikation nennt 410.
  -
    id: "xh-consequences-chinese-history"
    note: >-
      Die chinesische Rückschau nennt 205 nach 1958 verbliebene Mönche und etwa 1.200 im Jahr 1962. Die
      spätere Angabe widerlegt die interne Xinhua-Zahl von 18 für April 1959 nicht ohne zeitliche und
      begriffliche Klärung.
  -
    id: "xh-consequences-makley"
    note: >-
      Dokumentiert öffentlich-politische Kämpfe und die Verbreitung amtlicher Revolutionsdeutungen in der
      Bevölkerung als eigenständig untersuchte Folgen.
  -
    id: "xh-correction-county"
    note: >-
      Die Kreis-Chronik dokumentiert die Überprüfung und die formelle Rehabilitierung von 1.020 Personen
      und Fällen; 39 ursprüngliche Entscheidungen blieben bestehen.
  -
    id: "xh-correction-prefecture"
    note: >-
      Das Gericht der Präfektur dokumentiert eine eigene Überprüfung von Strafsachen aus 1958–1959 mit
      rehabilitierten, geänderten und bestätigten Entscheidungen.
  -
    id: "xh-correction-visibility"
    note: >-
      Der digital erfasste Eintrag zur Kreisgeschichte macht die amtliche Rehabilitierungsentscheidung des
      Jahres 1982 samt Ort und Fallzahlen nachvollziehbar.
  -
    id: "xh-1972-1979-earlier-corrections"
    note: >-
      Die Kreis-Chronik hält Berichtigungen aus 1972, eine separate Prüfung von Verurteilungen aus
      1959–1961 im Jahr 1978 und einen Provinzbericht von 1979 fest. Dieser räumte Fehlurteile,
      weitgehende Beschlagnahmungen und schwere Todesfolgen durch mangelhafte Haftführung ein.
      Diese Schritte gingen der eigenständigen Fallprüfung von 1982 voraus.
