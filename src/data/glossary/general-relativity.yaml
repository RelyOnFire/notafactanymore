term: General relativity
aliases:
- relativistic
shortDefinition: Einstein's theory of gravity, in which matter and energy curve spacetime and that curvature governs how objects
  and light move.
longDefinition: General relativity is Einstein's theory of gravitation. Instead of treating gravity simply as a force acting
  across space, it describes mass, energy, and pressure as shaping spacetime, with objects and light following paths through
  that curved geometry. Black-hole solutions arise from the theory under sufficiently extreme gravitational conditions.
relatedTerms:
