schemaVersion: 2
locale: de
entryId: hereditary-diagnoses-compulsory-sterilization
sourceReviewedAt: '2026-09-24'
title: Im Gesetz gelistete „Erbkrankheiten“ als verlässliche Grundlage für Zwangssterilisationen
proposition:
  summary: >-
    Das NS-Sterilisationsgesetz von 1933 führte neun Kategorien in einem gegen angeblich „erbkranke“ Menschen
    gerichteten System auf. Es ermächtigte besondere Gerichte zur Anordnung einer Sterilisation, wenn nach den
    angeblichen „Erfahrungen der ärztlichen Wissenschaft“ mit großer Wahrscheinlichkeit schwere körperliche oder
    geistige Erbschäden bei ihren Nachkommen zu erwarten seien. Amtsärzte und Anstaltsleiter brachten Fälle ein;
    Gerichte und Ärzte machten aus dieser Erbprognose einen zwangsweise durchsetzbaren Eingriff.
correction:
  summary: >-
    Die Kategorien ergaben keine einheitliche verlässliche Erbprognose und konnten Operationen ohne Einwilligung nicht
    rechtfertigen. Chorea Huntington wird durch Varianten eines Gens verursacht und autosomal-dominant vererbt;
    Schizophrenie und bipolare Störung beruhen dagegen auf Risiken durch viele Gene sowie Umwelt- oder Lebensfaktoren.
    „Angeborener Schwachsinn“ war keine klar abgegrenzte genetische Diagnose und wurde auch auf Menschen angewandt,
    die als sozial abweichend galten oder angebliche Intelligenz- oder Konformitätstests nicht bestanden. Das System
    verwandelte somit verschiedenartige Erkrankungen und soziale Werturteile in eine rechtliche Zwangsvermutung.
    Zwangssterilisation gilt heute als schwerer Menschenrechtsverstoß und kann völkerrechtlich als Kriegsverbrechen
    oder Verbrechen gegen die Menschlichkeit verfolgt werden.
impact:
  summary: >-
    Das Gesetz vom 14. Juli 1933 trat am 1. Januar 1934 in Kraft. Amtsärzte und Anstaltsleiter konnten Verfahren
    einleiten; Erbgesundheitsgerichte aus einem Richter und zwei Ärzten erließen Beschlüsse, die mit Polizeigewalt
    durchgesetzt werden konnten, und zugelassene Ärzte führten die Operationen durch. Maßgebliche Gesamtzahlen weichen
    voneinander ab: Eine Gesetzgebungsgeschichte des Bundestages schätzte etwa 350.000 Sterilisationen von 1934 bis
    1945, während das United States Holocaust Memorial Museum von rund 400.000 unter dem Gesetz zwangssterilisierten
    Menschen ausgeht. Der Bundestag ächtete die Sterilisationen 1988 als nationalsozialistisches Unrecht; 1998 hob ein
    Bundesgesetz alle noch rechtskräftigen Gerichtsbeschlüsse auf, und 2007 erstreckte eine Bundestagsentschließung die
    Ächtung ausdrücklich auf das Gesetz von 1933 selbst.
  highlights:
    - value: ≈350.000–400.000
      label: Bandbreite maßgeblicher Schätzungen der unter dem NS-Gesetz sterilisierten Menschen
      note: Bundestagsunterlagen nennen etwa 350.000–360.000; das USHMM schätzt die Zahl auf rund 400.000.
    - value: '9'
      label: Kategorien, die das Gesetz als Grundlage erbgesundheitlicher Sterilisationsverfahren einstufte
    - value: 1. September 1998
      label: Inkrafttreten des Bundesgesetzes zur Aufhebung aller noch rechtskräftigen Sterilisationsbeschlüsse
  context:
    - >-
      Die Korrektur lautet nicht, dass Vererbung bei jeder aufgeführten Erkrankung bedeutungslos war. Die genetischen
      Mechanismen und der Vorhersagewert unterschieden sich grundlegend. Selbst ein tatsächliches genetisches Risiko
      machte eine Sterilisation ohne Einwilligung weder medizinisch noch rechtlich legitim.
    - >-
      Besonders weit wurde die Kategorie „angeborener Schwachsinn“ ausgelegt. Laut einer Gesetzgebungsgeschichte des
      Bundestages entfielen ungefähr zwei Drittel der Sterilisationen auf sie; erfasst wurden Fälle, für die keine äußere
      Ursache nachgewiesen war. Das USHMM dokumentiert die Anwendung auf als sozial abweichend eingestufte Menschen und
      auf Personen, die angebliche Intelligenz- oder Konformitätstests nicht bestanden.
    - >-
      Das Zwangsprogramm endete 1945 mit dem NS-Regime, seine Ächtung erfolgte aber verspätet. Verbliebene Vorschriften
      des Gesetzes wurden 1974 aufgehoben, der Bundestag ächtete die Sterilisationen 1988, die verbliebenen
      Gerichtsbeschlüsse wurden 1998 aufgehoben und 2007 verurteilte der Bundestag das Gesetz selbst. Der Status
      „korrigiert“ bezieht sich auf diese spätere rechtliche und parlamentarische Umkehr, nicht auf eine wissenschaftliche
      Selbstkorrektur im Krieg.
episodes:
  - id: nazi-germany-1934-1945
    polity: NS-Deutschland
    institutions:
      - Reichsministerium des Innern und nationalsozialistische Gesundheitsverwaltung
      - Erbgesundheitsgerichte und Erbgesundheitsobergerichte
      - Amtsärzte und Leiter von Kranken-, Heil-, Pflege- und Strafanstalten
      - Medizinische Einrichtungen und zugelassene Ärzte, die Sterilisationen durchführten
    institutionalContext: >-
      Das Gesetz vom Juli 1933, das im Januar 1934 in Kraft trat, führte neun gesetzliche Kategorien auf und machte die
      behauptete hohe Wahrscheinlichkeit schwerer Erbschäden bei Nachkommen zum gesetzlichen Prüfmaßstab.
      Amtsärzte und Leiter von Kranken-, Heil-, Pflege- und Strafanstalten konnten eine Sterilisation beantragen. Die
      erste Ausführungsverordnung weitete den Apparat aus, indem sie Personal in Medizin und Fürsorge verpflichtete,
      Menschen mit aufgeführten Zuständen dem Amtsarzt zu melden. Ein Erbgesundheitsgericht am Amtsgericht bestand aus
      einem Richter, einem Amtsarzt und einem zweiten in der Erbgesundheitslehre geschulten Arzt; über Beschwerden
      entschied ein Erbgesundheitsobergericht. Rechtskräftige Beschlüsse konnten mit Polizeigewalt durchgesetzt werden,
      und Ärzte führten die Operationen aus.
    consequences:
      - Etwa 350.000 bis 400.000 Menschen wurden im diagnosegestützten NS-System sterilisiert
      - Besondere Gerichte ordneten irreversible Operationen an, die gegen den Willen der Betroffenen vollzogen werden konnten
      - „Angeborener Schwachsinn“ machte soziale Werturteile und umstrittene Tests zu einer angeblichen Erbdiagnose
      - Medizinische Meldepflicht, Gesundheitsverwaltung, Gerichte, Polizei und medizinische Einrichtungen bildeten eine Vollzugskette
      - Hunderte Menschen, überwiegend Frauen, starben infolge der Zwangsoperationen
      - Rechtliche Ächtung und pauschale Aufhebung der verbliebenen Gerichtsbeschlüsse folgten erst Jahrzehnte später
    summary: >-
      Die NS-Zwangssterilisation verwandelte eugenische Ideologie und verschiedenartige Diagnosen in durchsetzbares
      Medizinrecht. Meldungen aus Gesundheitswesen und Einrichtungen führten Fälle besonderen Gerichten zu; die Polizei
      konnte die angeordnete Operation erzwingen. Moderne Genetik zeigt, weshalb breite psychiatrische Bezeichnungen
      nicht die vom System behauptete einheitliche Vorhersagesicherheit lieferten; die dehnbare Kategorie
      „Schwachsinn“ nahm zudem soziale Werturteile auf. Das Programm endete 1945, die formelle deutsche Ächtung und
      Aufhebung folgten jedoch erst Jahrzehnte später.
    mechanism:
      summary: >-
        Gesetz und Ausführungsbestimmungen definierten die Kategorien, verlangten oder erlaubten medizinische Meldungen
        und Anträge, übertrugen Entscheidungen und Beschwerden besonderen, mit Richtern und Ärzten besetzten Gerichten
        und gestatteten nach Rechtskraft die mit Polizeigewalt durchgesetzte Operation.
    institutionalCorrection:
      periodLabel: 1988–2007
      action: >-
        Der Bundestag ächtete die Zwangssterilisationen 1988; ein am 1. September 1998 in Kraft getretenes Bundesgesetz
        hob alle noch rechtskräftigen Sterilisationsbeschlüsse auf; 2007 ächtete der Bundestag auch das Gesetz von 1933.
      summary: >-
        Der Zwangsvollzug endete mit dem NS-Regime, die formelle Korrektur erfolgte jedoch schrittweise. Der Status
        „korrigiert“ bezieht sich auf die parlamentarische Ächtung der Bundesrepublik, die gesetzliche Aufhebung der
        Gerichtsbeschlüsse und die spätere ausdrückliche Verurteilung des zugrunde liegenden Gesetzes.
evidence:
  - id: sterilization-law-proposition
    note: >-
      Der Primärtext des Gesetzes legt acht benannte Zustände sowie schweren Alkoholismus als gesetzliche Kategorien
      fest und nennt den behaupteten Maßstab einer hohen Wahrscheinlichkeit schwerer Erbschäden bei Nachkommen.
  - id: sterilization-bundestag-proposition
    note: >-
      Die amtliche Gesetzgebungsgeschichte gibt die gesetzliche Erbprognose wieder, führt die Kategorien auf und
      erläutert, wie die weit gefassten Diagnosen in Sterilisationsentscheidungen verwendet wurden.
  - id: sterilization-schizophrenia-correction
    note: >-
      Erläutert, dass viele Gene das Schizophrenierisiko erhöhen können, kein einzelnes Gen die Erkrankung allein
      verursacht und auch Umwelt- und Lebenserfahrungsfaktoren beitragen können.
  - id: sterilization-bipolar-correction
    note: >-
      Erläutert, dass viele Gene beteiligt sind, kein einzelnes Gen die bipolare Störung verursacht und ein familiäres
      Risiko nicht bedeutet, dass jeder Angehörige erkrankt; auch Traumata und andere Belastungen können beitragen.
  - id: sterilization-huntington-context
    note: >-
      Belegt das notwendige Gegenbeispiel zu einer zu pauschalen Korrektur: Chorea Huntington betrifft das HTT-Gen und
      wird autosomal-dominant vererbt, wobei die Penetranz bei bestimmten Wiederholungszahlen variiert.
  - id: sterilization-ushmm-correction
    note: >-
      Dokumentiert die diskreditierte eugenische Annahme, die Ausweitung von „angeborenem Schwachsinn“ auf soziale
      Werturteile und angebliche Tests sowie die heutige völkerrechtliche Einordnung von Zwangssterilisationen.
  - id: sterilization-ushmm-impact
    note: >-
      Nennt die neun Kategorien, beschreibt den medizinischen und gerichtlichen Apparat, schätzt die Zahl der unter dem
      Gesetz Zwangssterilisierten auf rund 400.000 und berichtet von Hunderten Todesfällen, überwiegend unter Frauen.
  - id: sterilization-bundestag-impact
    note: >-
      Schätzt die Zahl der Sterilisationen von 1934 bis 1945 auf ungefähr 350.000, gibt die Ächtung des Bundestages von
      1988 wieder und beschreibt den diagnosegestützten Vollzug des Gesetzes.
  - id: sterilization-law-carrier
    note: >-
      Das Gesetz weist Anträge Amtsärzten und Anstaltsleitern, Entscheidungen besonderen Gerichten aus einem Richter
      und zwei Ärzten zu und trägt die Unterschriften der Reichsminister des Innern und der Justiz.
  - id: sterilization-ushmm-carrier
    note: >-
      Benennt Ärzte, Gesundheitsbeamte und Leitungen von Gesundheitseinrichtungen als Fallzulieferer, die richterliche
      und ärztliche Gerichtsbesetzung, zugelassene Ärzte als Operateure sowie die Polizei als Vollzugsorgan.
  - id: sterilization-bundestag-carrier
    note: >-
      Verfolgt die Meldepflicht durch den Gesundheitsapparat, Anträge von Amtsärzten und Anstaltsleitern sowie die
      Entscheidungen der Erbgesundheitsgerichte und Erbgesundheitsobergerichte.
  - id: sterilization-law-mechanism
    note: >-
      Schreibt Kategorien und Prognosemaßstab fest, richtet Antrags- und Gerichtsverfahren ein, erlaubt nach einem
      rechtskräftigen Beschluss unmittelbaren Zwang und Polizeieinsatz und bestimmt den 1. Januar 1934 als Inkrafttreten.
  - id: sterilization-bundestag-mechanism
    note: >-
      Beschreibt die medizinische Meldepflicht, die Besetzung von Gerichten und Beschwerdegerichten sowie mehrere
      Verfahrensstufen mit möglicher Polizeigewalt bis zum Transport in den Operationssaal.
  - id: sterilization-ushmm-consequences
    note: >-
      Dokumentiert Ausmaß, breite soziale Reichweite, Zwangsoperationen und Todesfälle und unterscheidet das gesetzliche
      Programm zugleich von weiteren außergesetzlichen Sterilisationen und Experimenten in Konzentrationslagern.
  - id: sterilization-bundestag-consequences
    note: >-
      Beziffert das Programm, zeigt die weite Auslegung der meistverwendeten Diagnose und beschreibt das integrierte
      medizinische, gerichtliche und polizeiliche Vollzugssystem.
  - id: sterilization-1998-enacted-correction
    note: >-
      Das verkündete Bundesgesetz hält sein Inkrafttreten am 1. September 1998 fest und hebt alle noch rechtskräftigen
      Gerichtsbeschlüsse zur Sterilisation nach dem Gesetz von 1933 auf.
  - id: sterilization-bundestag-correction-history
    note: >-
      Gibt die Ächtung des Bundestages von 1988 wieder, erläutert die verzögerte rechtliche Behandlung nach dem Krieg
      und begründet die pauschale gesetzliche Aufhebung der verbliebenen Beschlüsse.
  - id: sterilization-bundestag-2007-correction
    note: >-
      Protokolliert die Annahme des Antrags „Ächtung des Gesetzes zur Verhütung erbkranken Nachwuchses vom 14. Juli
      1933“ durch den Bundestag am 24. Mai 2007.
