term: Kuipergürtel
aliases: []
shortDefinition: Eine ausgedehnte Region jenseits des Neptun mit vielen eisigen Kleinkörpern, darunter Pluto und weitere
  Zwergplaneten.
longDefinition: Der Kuipergürtel ist eine Population eisiger Körper, die die Sonne jenseits des Neptun umkreisen, größtenteils
  in Entfernungen von ungefähr 30 bis 50 Astronomischen Einheiten. Entdeckungen seit den 1990er-Jahren zeigten, dass
  Pluto Teil einer großen Familie transneptunischer Objekte ist und kein isolierter Sonderfall, was die moderne Debatte
  über die Planetendefinition mit auslöste.
