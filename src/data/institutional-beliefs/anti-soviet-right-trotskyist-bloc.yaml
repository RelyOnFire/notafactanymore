title: The anti-Soviet Right-Trotskyist Bloc as an espionage-terror conspiracy
claim: Soviet party, security, prosecutorial and judicial institutions asserted in the 1938 Third Moscow Trial that Nikolai
  Bukharin, Alexei Rykov and their co-defendants formed an anti-Soviet Right-Trotskyist Bloc that committed espionage, sabotage,
  terrorism and treason in concert with foreign intelligence services and sought the overthrow and dismemberment of the Soviet
  state.
currentUnderstanding: Later Soviet judicial review found the central criminal-conspiracy case against the rehabilitated defendants
  unsupported. The USSR Supreme Court found no evidence of links between Bukharin, Rykov and foreign intelligence services,
  found no support for the alleged network of criminal groups, and determined that major sabotage allegations contradicted
  the factual record. Twenty of the 21 defendants in the 1938 trial were ultimately rehabilitated; former NKVD chief Genrikh
  Yagoda was the exception, so this card does not treat every defendant or every separate allegation against Yagoda as exonerated.
category: Political repression, show trials and state security
reviewedAt: '2026-08-25'
impact:
  summary: The Third Moscow Trial turned a constructed political conspiracy into a public judicial fact at the height of the
    Great Terror. Twenty-one defendants were tried before the Military Collegium of the USSR Supreme Court in March 1938.
    Eighteen received death sentences and three received long prison terms. The trial was accompanied by intensive state propaganda
    and presented former senior Bolshevik leaders as spies, saboteurs, terrorists and agents of foreign powers. Decades later
    the Soviet state reversed the legal findings for nearly the entire defendant group.
  highlights:
  - value: '21'
    label: defendants in the Third Moscow Trial
  - value: '18'
    label: defendants sentenced to death in March 1938
  - value: 20 of 21
    label: defendants ultimately rehabilitated; Genrikh Yagoda was the exception
  context:
  - The card concerns the conspiracy constructed and prosecuted in the Third Moscow Trial, not every allegation made in the
    three Moscow Trials of 1936–1938. The earlier Zinoviev-Kamenev and Pyatakov-Radek trials involved different defendant
    groups and should not be silently merged into this episode.
  - 'Genrikh Yagoda had headed the NKVD and was implicated in real state crimes independent of the fabricated Right-Trotskyist
    conspiracy. Soviet prosecutors did not seek his rehabilitation when the case was reviewed. The 20-of-21 figure therefore
    matters editorially: the card does not claim that every defendant was wholly innocent of every separate act ever attributed
    to him.'
  - The archival record also shows direct political management of the trial. The modern documentary edition of the proceedings,
    based on RGASPI, GARF and FSB Central Archive holdings, includes a complete trial transcript containing Stalin's editorial
    corrections. The factual correction here rests primarily on the later Supreme Court review of the criminal charges.
