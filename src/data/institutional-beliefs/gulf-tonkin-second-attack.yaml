      military policy, the real 2 August attack, the disputed second incident and the resolution's January 1971 repeal.
  - title: Skunks, Bogies, Silent Hounds, and the Flying Fish — The Gulf of Tonkin Mystery, 2–4 August 1964
    url: https://www.nsa.gov/portals/75/documents/news-features/declassified-documents/gulf-of-tonkin/articles/release-1/rel1_skunks_bogies.pdf
    publisher: National Security Agency, Center for Cryptologic History
    note: >-
      NSA historical reconstruction stating that the agency had officially maintained that the second incident occurred,
      while its expanded review of 122 relevant SIGINT products and other records concluded that no attack happened on
      the night of 4 August and that North Vietnamese naval activity concerned salvage of boats damaged on 2 August.
  - title: Chairman Fulbright and the Tonkin Gulf Resolution
    url: https://www.senate.gov/artandhistory/senate-stories/chairman-fulbright-and-the-tonkin-gulf-resolution.htm
    publisher: United States Senate
