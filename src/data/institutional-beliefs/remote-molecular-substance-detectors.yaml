schemaVersion: 2
title: Remote “molecular” detectors for explosives and drugs
proposition:
  summary: >-
    Hand-held passive-antenna devices such as the GT200 and ADE 651 were treated as able to remotely identify hidden
    explosives, drugs, weapons, or other substances through claimed molecular or electrostatic mechanisms, reliably
    enough to guide searches, checkpoints, arrests, and other security decisions.
correction:
  summary: >-
    These devices had no validated mechanism capable of remotely identifying the claimed substances. Controlled
    testing of the GT200 found performance compatible with chance, while a British criminal court found the ADE
    devices useless and their explosive-detection capability no better than random chance. Reliable explosive or drug
    detection requires validated physical, chemical, biological, canine, or imaging methods rather than the movement
    of an unpowered passive antenna.
category: Security technology and substance detection
reviewedAt: 2026-09-18
impact:
  summary: >-
    The institutional failure was not merely wasteful procurement. Unvalidated detector indications were converted
    into operational security signals: they influenced searches, home entries, detentions, checkpoint screening, and
    judgments about whether people or vehicles were dangerous, while creating confidence in devices that controlled
    testing and later criminal proceedings showed did not work as claimed.
  highlights:
    - value: '742'
      label: GT200 units acquired by Mexico's SEDENA according to congressional records
    - value: 17 of 20
      label: Failed GT200 attempts in a controlled test using certified operators
      note: >-
        The October 2011 test was designed to be double-blind. The authors disclose that operator swaps revealed
        interim results and compromised strict blinding; the searchers did not know the current sample location.
    - value: 7,000+
      label: ADE devices sold to the Iraqi government and other international agencies by James McCormick's company
  context:
    - >-
      Procurement totals and flawed detector results do not provide a defensible count of wrongful arrests, injuries,
      or deaths. In sentencing the ADE 651 seller, the English court explicitly said that a specific death or injury
      could not be proved to have resulted from a device, while finding that the false sense of security had in all
      probability materially contributed to death and injury.
    - >-
      Federal withdrawal was announced in 2013, and a March 2014 parliamentary proposal sought investigation of
      earlier procurement and use. These announcements do not establish completed withdrawal: the test authors
      describe conflicting official statements and later use in individual Mexican states through 2015. Those local
      reports do not establish continued use by the federal institutions listed here through 2014.
episodes:
  - id: mexico-2008-2014
    polity: Mexico
    region: Latin America
    startYear: 2008
    endYear: 2013
    periodLabel: 2008–at least 2013
    strength: policy-basis
    institutionTypes:
      - government
      - military
    institutions:
      - Secretaría de la Defensa Nacional (SEDENA)
      - Secretaría de Marina (SEMAR)
      - Procuraduría General de la República (PGR)
      - Petróleos Mexicanos (PEMEX)
    institutionalContext: >-
      Parliamentary records identify SEDENA, SEMAR, PGR, and PEMEX as federal purchasers of GT200 devices. SEDENA
      publicly described operational deployments, while the National Human Rights Commission documented armed-forces
      reliance on detector indications during organized-crime operations and home entries. The procurement list does
      not establish that PEMEX conducted detentions or home searches. The CNDH recommended against military use in
      2011; federal withdrawal announcements followed in 2013. The period covers documented federal adoption, without
      establishing when all federal use ended.
    consequences:
      - GT200 indications were used during military and organized-crime operations
      - Detector signals contributed to searches, home entries, detentions, and criminal proceedings
      - A March 2014 parliamentary proposal reported 1,112 devices purchased by federal, state, and municipal bodies together, not by federal agencies alone
      - Courts and human-rights bodies later confronted the scientific and constitutional consequences of relying on the device
    summary: >-
      Parliamentary accounts date federal GT200 procurement to 2008 and attribute 742 units to SEDENA, 102 to SEMAR,
      54 to PEMEX, and seven to the PGR. The devices were acquired for drugs, explosives, weapons, and related
      security work. SEDENA documented operational use, and the CNDH reported that armed forces used GT200 indications
      in organized-crime investigations and sometimes entered homes on that basis. In October 2011, certified
      operators failed in 17 of 20 attempts in a controlled test, a result compatible with chance, with the blinding
      limitation noted above. Courts and the CNDH challenged reliance on the device. A federal spokesman announced
      non-use in 2013; legislators sought further investigation in 2014. Neither the announcement nor those proposals
      establish complete withdrawal or a completed procurement investigation.
    mechanism:
      kind: administrative-adoption
      summary: >-
        Federal procurement gave the GT200 institutional authority. SEDENA used it in military operations, and the
        CNDH documented armed forces treating its indications as grounds for warrantless home entries. Detector-based
        allegations also reached criminal proceedings, including cases pursued by the PGR. PEMEX is documented here
        as a purchaser, without attributing those coercive practices to it.
    institutionalCorrection:
      status: partial
      periodLabel: 2011–2014
      action: The CNDH recommended against military use in 2011; courts challenged detector evidence, a federal spokesman announced non-use in 2013, and legislators proposed further investigation in 2014.
      summary: >-
        The CNDH's 2011 recommendation challenged warrantless searches independently of the device's efficacy. A
        court-ordered test informed a case that ended in release in May 2013; the PGR abandoned a separate case before
        the Supreme Court could establish a precedent. A security spokesman announced non-use in August 2013, and a
        March 2014 parliamentary proposal recorded an announced federal withdrawal. The test authors nevertheless
        found no subsequent official statement and reported contradictory statements and later local use. Parliamentary
        requests for investigation and case review were proposals, not proof of completed remedies. The documented
        responses support partial correction, without establishing complete federal or nationwide withdrawal.
  - id: iraq-2007-2016
    polity: Iraq
    region: Middle East
    startYear: 2007
    endYear: 2016
    periodLabel: 2007–at least July 2016
    strength: policy-basis
    institutionTypes:
      - government
    institutions:
      - Ministry of Interior of Iraq
      - Directorate for Combating Explosives, Ministry of Interior
    institutionalContext: >-
      Ministry of Interior procurement began with contract 2/2007 after a request tied to the directorate responsible
      for combating explosives. ADE-family devices were subsequently used at Iraqi checkpoints and remained in police
      use despite international warnings, corruption investigations, and the British seller's 2013 fraud conviction.
      Prime Minister Haider al-Abadi ordered security services to stop using the fake detectors on 3 July 2016.
      Subsequent reporting and the Interior Ministry's spokesman confirmed that withdrawal was still incomplete
      later that month.
    consequences:
      - ADE devices were used to screen vehicles and people at security checkpoints
      - Security personnel trusted detector indications when assessing explosive risk
      - Large public expenditures were committed to devices later found to be useless
      - Operational use continued for years after serious doubts, investigations, and foreign restrictions had emerged
      - The false sense of security created a continuing danger at high-risk checkpoints
    summary: >-
      Iraq's Ministry of Interior began procuring ADE-family bomb detectors in 2007 for its counter-explosives work,
      and the devices became a familiar part of police and security checkpoints. In 2013 the Central Criminal Court in
      London found seller James McCormick guilty of fraud; the sentencing judge described the ADE devices as useless,
      with explosive-detection capability no better than random chance, and found that the false sense of security had
      in all probability materially contributed to death and injury, while cautioning that no specific casualty could
      be attributed to a device. The detectors nevertheless remained in Iraqi police use when Prime Minister Haider
      al-Abadi ordered security services to stop using them on 3 July 2016. The Interior Ministry subsequently
      acknowledged that some use continued during withdrawal, so the order is not evidence of an immediate end to use.
    mechanism:
      kind: administrative-adoption
      summary: >-
        The Interior Ministry procured ADE-family devices for counter-explosives work and police incorporated them into
        routine checkpoint screening of vehicles and people.
    institutionalCorrection:
      status: partial
      periodLabel: July 2016
      action: Prime Minister Haider al-Abadi ordered security services to stop using the fake bomb detectors.
      summary: >-
        The 3 July 2016 stop-use order was an explicit policy reversal. Later that month, the Interior Ministry
        acknowledged that withdrawal was incomplete and some checkpoints still used the devices. This status
        describes the documented July 2016 implementation, without claiming either completed withdrawal or continued
        use to the present.
