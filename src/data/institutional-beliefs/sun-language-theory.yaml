schemaVersion: 2
title: Sun Language Theory
proposition:
  summary: >-
    Turkish was presented as humanity's primordial “mother tongue” and the source of words across all other languages;
    within the theory, established language families and comparative-historical linguistics were treated as scientifically
    obsolete.
correction:
  summary: >-
    Turkish is an Oghuz member of the Turkic language family. Similar-looking words or freely manipulated sound segments
    do not establish descent: comparative reconstruction requires recurring sound and grammatical correspondences.
    Nothing supports identifying Turkish as the source of every human language, and the theory's universal origin claim
    extends far beyond what the linguistic record can reconstruct.
category: Linguistics
reviewedAt: '2026-08-23'
impact:
  summary: >-
    For roughly three years, the state-backed language establishment turned the theory into an institutional programme.
    It was officially declared, placed at the centre of the 1936 language congress, assigned a dedicated congress
    commission and a dedicated higher-education professorship, and developed across 25 published volumes between 1935
    and 1938.
  highlights:
    - value: '25'
      label: volumes about the theory published from 1935 through 1938
    - value: '1'
      label: dedicated higher-education professorship created for the theory
  context:
    - >-
      The publication count and formal teaching structures show institutional reach. They do not measure how many
      officials, scholars, students or members of the public personally accepted the proposition.
    - >-
      The theory belonged to a broader language-reform and nation-building programme. Sources connect its appeal to a
      response to European hierarchies of languages and civilizations, but that political setting does not show that every
      participant shared one motive.
episodes:
  - id: turkey-1935-1938
    polity: Turkey
    region: Middle East
    startYear: 1935
    endYear: 1938
    periodLabel: 1935–1938
    strength: officially-endorsed
    institutionTypes:
      - government
      - academy
      - education
    institutions:
      - Turkish Language Research Society / Turkish Language Association (Türk Dili Tetkik Cemiyeti / Türk Dil Kurumu)
      - Third Turkish Language Congress and its Sun Language Theory and Language Comparisons Commission
      - Faculty of Language, History and Geography, Ankara (then under the Ministry of National Education)
    institutionalContext: >-
      Mustafa Kemal Atatürk asked language reformers to develop Hermann Kvergić's 1935 manuscript and followed the work
      closely. The state-backed Turkish Language Society was the principal carrier: it officially declared the theory in
      autumn 1935 and made it a central programme of its Third Congress in 1936. The congress created a dedicated
      Güneş-Dil Teorisi ve Dil Karşılaştırmaları Komisyonu, while the newly founded Ankara faculty created a professorship
      and courses for the theory. These named bodies define the institutional episode; presidential patronage is described
      as sponsorship rather than turning Atatürk himself into an institution.
    consequences:
      - Official linguistic research and publication were redirected toward unrestricted Turkish derivations of words in other languages
      - A dedicated faculty professorship and courses taught the theory
      - The theory dismissed established language-family classification and comparative etymology as obsolete
      - The 1936 language congress gave the theory a dedicated commission and a central place in its programme
      - The theory reinforced a national narrative that placed Turkish at the origin of language and civilization
    summary: >-
      From autumn 1935 through 1938, presidential patronage and the Turkish Language Society elevated the Sun Language
      Theory into official linguistic work. Its claim that all languages ultimately derived from Turkish shaped congress
      proceedings, publications and university teaching. This was a short, intensive institutional episode; participation
      in those structures does not establish that every scholar involved privately accepted the theory.
    mechanism:
      kind: endorsement
      summary: >-
        Presidential sponsorship and official adoption by the Turkish Language Society moved the proposition from an
        submitted manuscript into a research, publication and teaching programme. A dedicated congress commission,
        official proceedings and a higher-education professorship then supplied channels for its dissemination.
    institutionalCorrection:
      status: partial
      periodLabel: 1938 onward
      action: After Atatürk's death in November 1938, the Ankara course ended and institutional publication and promotion of the theory ceased.
      summary: >-
        The theory underwent a quiet institutional abandonment, and at least one prominent former advocate later opposed
        it. The available record does not document a formal retraction by all of its institutional carriers or an official
        account acknowledging why its linguistic method failed, so practical withdrawal is classified as a partial
        institutional correction.
