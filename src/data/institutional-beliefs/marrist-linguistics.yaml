schemaVersion: 2
title: Marrist linguistics
proposition:
  summary: >-
    Languages were treated as products of universal class-driven stages rather than primarily as members of historically
    descended language families, making conventional comparative linguistics “bourgeois” or scientifically obsolete.
correction:
  summary: >-
    Languages change through historically traceable descent, contact, borrowing, innovation, and social use. Comparative
    linguistics can reconstruct genealogical relationships among related languages; languages do not pass through a
    universal sequence of class-defined developmental stages.
category: Linguistics
reviewedAt: '2026-09-15'
episodes:
  - id: soviet-union-1930-1950
    polity: Soviet Union
    region: Eurasia
    startYear: 1930
    endYear: 1950
    periodLabel: c. 1930–1950
    strength: enforced-doctrine
    institutionTypes:
      - government
      - academy
      - education
    institutions:
      - Institute of Language and Thought of the Academy of Sciences of the USSR
      - Academy of Sciences of the USSR
    institutionalContext: >-
      The Institute of Language and Thought, renamed from the Japhetic Institute in 1931, was the principal institutional
      centre of Marrism within the Academy of Sciences. Its departments included research, education and propaganda, and
      it published Proceedings in 1932–1949. The Academy's 21 July 1949 resolution criticized comparative and proto-language
      research and named linguists accused of bourgeois influence. The doctrine's authority operated through Academy
      research, teaching and publication structures. Soviet approaches to language and society were more diverse than
      Marrism alone.
    consequences:
      - Competing comparative-historical linguistic schools were suppressed or marginalized
      - Academy research directives and recommended teaching texts promoted Marrism
      - Scholars who departed substantially from Marrist foundations could be institutionally marginalized or suppressed
    summary: >-
      From about 1930, Nikolai Marr's “New Theory of Language” became the officially recognized framework dominating
      Soviet linguistics. Traditional comparative and Indo-European linguistics were attacked as bourgeois, and substantial
      deviations from Marrist foundations were severely suppressed. On 20 June 1950 Stalin publicly repudiated Marrism.
      The Academy subsequently removed the institute's leadership and merged it with the Institute of the Russian Language
      into the Institute of Linguistics. The doctrine's official standing was reversed through political and administrative
      intervention.
    mechanism:
      kind: suppression
      summary: >-
        Academy resolutions gave Marrist positions institutional authority over research while marginalizing competing
        comparative-historical work. Research leadership, appointments and recommended teaching texts helped sustain the
        doctrine; the Academy's own 1950 reversal described suppression of criticism and removal of critics from posts.
    institutionalCorrection:
      status: corrected
      periodLabel: June–October 1950
      action: >-
        After Stalin's public repudiation on 20 June, the Academy Presidium removed the institute's leaders and requested
        a merger on 1 July. The government authorized the reorganization on 3 July; on 6 October the Presidium confirmed
        that the Institute of Linguistics had been formed from the merged institutes.
      summary: >-
        The same Academy that had attacked comparative and proto-language research in 1949 removed Marrist leaders and
        reorganized its linguistics institutes in 1950. This ended Marrism's privileged institutional position through a
        change of official doctrine.
