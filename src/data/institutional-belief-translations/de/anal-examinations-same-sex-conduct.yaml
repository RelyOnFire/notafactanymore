locale: de
entryId: anal-examinations-same-sex-conduct
sourceReviewedAt: 2026-08-22
title: Analuntersuchungen als „Beweis“ gleichgeschlechtlichen Verkehrs
claim: Form, Spannung oder Zustand von Anus und Schließmuskel wurden als körperlicher Nachweis dafür behandelt, dass eine Person rezeptiven Analverkehr gehabt habe.
currentUnderstanding: Analuntersuchungen können nicht zuverlässig feststellen, ob jemand zuvor einvernehmlichen rezeptiven Analverkehr hatte. Die vermeintlichen forensischen Merkmale gehen auf widerlegte Theorien des 19. Jahrhunderts zurück und besitzen keine wissenschaftlich tragfähige Beweiskraft.
episodes:
  - id: egypt-2001-2017
    polity: Ägypten
    summary: Ägyptische Staatsanwälte überwiesen Männer und trans Frauen, denen „Ausschweifung“ vorgeworfen wurde, wiederholt an die dem Justizministerium unterstehende Forensic Medicine Authority. Dort sollten Analuntersuchungen vermeintliche Beweise für rezeptiven Analverkehr liefern. Die Praxis ist von den Queen-Boat-Verfahren 2001 bis in die 2010er-Jahre dokumentiert; medizinische Berichte wurden trotz fehlender wissenschaftlicher Aussagekraft vor Gericht verwendet.
    consequences:
      - Erzwungene Analuntersuchungen
      - Medizinische Berichte als Beweismittel in Strafverfahren
      - Verurteilung und Haft wegen einvernehmlicher gleichgeschlechtlicher Handlungen
      - Grausame, erniedrigende und potenziell folterähnliche Behandlung
  - id: lebanon-2012
    polity: Libanon
    summary: 2012 ordneten libanesische Staatsanwälte bei Männern, die wegen des Verdachts auf homosexuelle Handlungen festgenommen worden waren, forensische Analuntersuchungen an; Untersuchungsergebnisse flossen in Strafverfahren ein. Der libanesische Ärzteorden untersagte Ärzten daraufhin die Durchführung solcher Tests und bezeichnete sie als medizinisch und wissenschaftlich nutzlos sowie als Form von Folter.
    consequences:
      - Erzwungene Analuntersuchungen
      - Medizinische Befunde als Grundlage strafrechtlicher Vorwürfe
      - Grausame und erniedrigende Behandlung
