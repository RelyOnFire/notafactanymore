title: Leprosy as requiring prolonged compulsory segregation
claim: People with leprosy were treated as dangerous enough to require prolonged compulsory segregation even after
  effective chemotherapy had made a blanket isolation policy medically unnecessary.
currentUnderstanding: 'Leprosy is transmissible, but transmission generally requires prolonged close contact with
  an untreated case. Effective multidrug treatment rapidly ends infectiousness: WHO states that a patient stops
  transmitting the disease once treatment begins. Medical care and follow-up may be necessary, but prolonged blanket
  segregation of treated patients is not required for infection control.'
category: Medicine, infectious disease and public health
reviewedAt: '2026-08-24'
impact:
  summary: Japan maintained a segregation system long after its medical rationale had collapsed. The government’s
    own Hansen’s disease verification process concluded that chemotherapy had made segregation unnecessary and that
    by 1960 the Health Minister had enough knowledge to recognize this. Nevertheless, the legal segregation framework
    persisted until 1996.
  highlights:
  - value: '1960'
    label: Later official review found that the medical basis for segregation was no longer defensible by this point
  - value: 36 years
    label: The segregation framework persisted from the representative 1960 correction point until repeal in 1996
  - value: '1996'
    label: Japan finally repealed the Leprosy Prevention Law and ended the legal segregation regime
  context:
  - Untreated leprosy can transmit. The corrected proposition is not “leprosy is never contagious,” but that prolonged
    compulsory segregation remained necessary after effective treatment had made routine isolation medically unjustified.
episodes:
- id: japan-1960-1996
  polity: Japan
  region: East Asia
  startYear: 1960
  endYear: 1996
  strength: enforced-doctrine
  institutionTypes:
  - government
  - medical
  institutions:
  - Ministry of Health and Welfare of Japan
  institutionalContext: Japan’s segregation policy had much earlier origins, but 1960 is used as the defensible
    start of the institutional-error period because the later government verification process found that, by then,
    the Health Minister either possessed or could readily obtain the medical knowledge necessary to conclude that
    segregation was unnecessary. The policy and Leprosy Prevention Law nevertheless remained in force until 1996.
  consequences:
  - Continued confinement and segregation of people with Hansen’s disease
  - Severe restrictions on family life, residence and social participation
  - State reinforcement of public stigma that treated patients as continuing dangers
  - Decades of rights violations after the medical justification for blanket segregation had disappeared
  summary: Japan continued a legal segregation regime for people with Hansen’s disease after effective chemotherapy
    had made blanket isolation medically unnecessary. The government’s later verification committee concluded that
    the need for segregation was already medically indefensible by about 1960 and that official policy reinforced
    the belief that patients remained dangerous. The Leprosy Prevention Law was not repealed until 1996.
  sources:
  - title: Verification Committee Concerning Hansen’s Disease — Final Report
    url: https://www.mhlw.go.jp/english/policy/health/01/pdf/01.pdf
    publisher: Ministry of Health, Labour and Welfare of Japan
    note: Official government verification report concluding that chemotherapy had made segregation unnecessary,
      that by 1960 the Health Minister had sufficient medical information to judge the necessity of segregation,
      and that the segregation framework persisted until repeal in 1996.
  - title: Leprosy — Fact sheet
    url: https://www.who.int/news-room/fact-sheets/detail/leprosy
    publisher: World Health Organization
    note: Current WHO evidence says transmission follows prolonged close contact with an untreated case rather than
      casual contact, and that a patient stops transmitting the disease upon initiation of treatment.
