locale: de
entryId: phrenology
sourceReviewedAt: 2026-08-23
title: Phrenologie
claim: Geistige Fähigkeiten und Charakter lassen sich aus der Schädelform ableiten, weil verschiedene „Organe“ des Gehirns den darüberliegenden Schädel unterschiedlich ausformen.
currentUnderstanding: Hirnfunktionen beruhen auf Nervengewebe und verteilten Netzwerken. Unebenheiten des Schädels liefern keine gültige Karte von Persönlichkeit, Intelligenz, Moral oder geistigen Fähigkeiten.
episodes:
  - id: britain-1820-1850
    polity: Vereinigtes Königreich
    institutions:
      - Edinburgh Phrenological Society
      - London Phrenological Society
    institutionalContext: Phrenologische Vorstellungen zirkulierten darüber hinaus unter Ärzten, Psychiatern, Pädagogen und Sozialreformern. Diese verteilten Fachnetzwerke werden hier jedoch nicht so behandelt, als seien sie eine einzelne Institution. Die beiden genannten Gesellschaften sind die klarsten identifizierbaren institutionellen Träger dieser Episode.
    summary: Die Phrenologie bildete organisierte wissenschaftliche Gesellschaften und beeinflusste einige britische Ärzte, Psychiater, Pädagogen und Sozialreformer. Ihre institutionellen Ambitionen gingen um die Mitte des Jahrhunderts zurück, auch wenn populäre Praxis wesentlich länger fortbestand.
    consequences:
      - Phrenologische Vorstellungen flossen in psychiatrische und neurologische Deutungen ein
      - Bildungs- und Sozialreformargumente wurden mit vermeintlich schädelbasierten Fähigkeiten begründet
      - Organisierte Gesellschaften verliehen der Lehre wissenschaftliche und fachliche Legitimität
