title: Cardiazol-induced seizures as a treatment for schizophrenia
claim: Schizophrenia and epilepsy were treated as biologically antagonistic disorders, so chemically inducing epileptiform
  seizures with Cardiazol (pentylenetetrazol/Metrazol) was expected to produce remission in schizophrenia.
currentUnderstanding: 'Schizophrenia and epilepsy are not biologically opposing disease states whose coexistence
  can be therapeutically reversed by provoking seizures. Early Cardiazol results were distorted by uncontrolled
  comparisons, changing diagnostic definitions and outcome measures that sometimes equated quieter or more manageable
  behavior with recovery. Convulsive treatment itself should not be dismissed wholesale: modern electroconvulsive
  therapy has evidence-based indications, including severe depression, catatonia and selected treatment-resistant
  conditions. The historical error was the specific antagonism theory and the resulting use of an intensely distressing,
  poorly controlled chemical convulsant as a routine schizophrenia treatment.'
category: Medicine and public health
reviewedAt: '2026-08-24'
impact:
  summary: Cardiazol therapy spread through British public mental hospitals within roughly two years of its introduction.
    Patients received intravenous convulsant injections that could produce overwhelming pre-seizure terror and violent
    generalized convulsions. The Board of Control investigated and reported on the method as hospitals adopted it,
    but the original theory that induced epilepsy would counteract schizophrenia collapsed quickly.
  highlights:
  - value: 89 / 92
    label: British institutions using shock treatments in the 1938 Board of Control survey were using Cardiazol
  - value: '1938'
    label: Board of Control issued a national report on Cardiazol treatment in schizophrenia
  - value: '1941'
    label: British clinicians were acknowledging that the original schizophrenia indication had been abandoned
  context:
  - Cardiazol is also known as pentylenetetrazol or Metrazol. This card is about chemically induced convulsions
    for schizophrenia, not modern ECT. ECT replaced Cardiazol partly because an electrical stimulus allowed a more
    controllable seizure with less pre-convulsive terror and fewer traumatic injuries.
  - Some later evidence suggested convulsive treatment could benefit affective illness. That does not rescue Meduna's
    original claim that schizophrenia could be treated because epilepsy and schizophrenia were biologically antagonistic.
