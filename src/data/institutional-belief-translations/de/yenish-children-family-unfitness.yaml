schemaVersion: 2
locale: de
entryId: yenish-children-family-unfitness
sourceReviewedAt: '2026-09-27'
title: Jenische Herkunft als pauschale Vermutung einer Kindesgefährdung
proposition:
  summary: >-
    Das Pro-Juventute-Programm Kinder der Landstrasse und mitwirkende Schweizer Behörden behandelten eine zugeschriebene
    jenische Herkunft oder reisende Lebensweise als pauschalen Hinweis auf eine vermeintliche Kindesgefährdung. Das Programm erfasste
    ganze Familien und sammelte sowie selektierte anschliessend Fallmaterial, um Vormundschaften, Kindswegnahmen und eine
    Umerziehung fern von Verwandten und jenischer Kultur zu begründen.
correction:
  summary: >-
    Jenische Identität, ein Familienname oder eine reisende Erwerbs- und Lebensweise belegen weder elterliche Untauglichkeit
    noch eine Gefahr für ein Kind. Kindesschutzentscheide erfordern konkrete Befunde zur Lage des einzelnen Kindes und müssen familiäre
    sowie kulturelle Bindungen achten. Die Forschung zeigt, dass Kinder der Landstrasse diese Logik umkehrte: Die
    Gruppenzuordnung bestimmte, wer untersucht wurde, und die Fallarbeit war auf Trennung und Assimilation ausgerichtet.
    2025 anerkannte der Bundesrat die Verfolgung im Rahmen des Programms nach heutigem Völkerrecht als Verbrechen gegen
    die Menschlichkeit; das beauftragte Rechtsgutachten stufte sie nicht als Genozid ein.
impact:
  summary: >-
    Kinder der Landstrasse bestand von 1926 bis zur Auflösung 1973. Aktuelle Bundesdarstellungen sprechen von rund 600
    direkt durch das Programm weggenommenen Kindern; eine spätere vollständige Aktenstudie zählte 586, die ältere
    historische Studie des Bundes 619. Das Bundesamt für Kultur schätzt, dass vergleichbare Kindswegnahmen durch weitere
    Behörden, Kirchen und Organisationen insgesamt bis zu 2.000 Kinder aus jenischen Familien betroffen haben könnten.
    Die Kinder wurden auf Pflegefamilien, Heime, Arbeits- und Erziehungsanstalten, psychiatrische Kliniken und teils
    Gefängnisse verteilt; Kontakte zu Verwandten wurden behindert.
  highlights:
    - value: rund 600
      label: durch das zentrale Pro-Juventute-Programm weggenommene Kinder
    - value: bis zu 2.000
      label: geschätzte Gesamtzahl einschliesslich Wegnahmen durch weitere Organisationen und Behörden
    - value: 47 Jahre
      label: von der Gründung 1926 bis zur Auflösung 1973
  context:
    - >-
      Gruppenzugehörigkeit bestimmte Auswahl, Überwachung und Deutung, erfüllte aber nicht allein die formalen rechtlichen
      Anforderungen jeder Wegnahme. Laut Rechtsgutachten von 2024 suchten die Verantwortlichen vermeintliche Belege für eine
      Kindesgefährdung, und Vormundschaftsbehörden erliessen Einzelverfügungen. Die Forschung zeigt jedoch, dass die
      vorangehende Annahme untauglicher Familien die Suche und Auswahl des Materials strukturierte.
    - >-
      Die Zahlen rund 600 und bis zu 2.000 bezeichnen nicht zwei Zählungen desselben Registers. Die erste betrifft das
      dokumentierte Pro-Juventute-Programm und variiert leicht je nach Aktenmethode; die zweite ist eine Schätzung unter
      Einschluss ähnlicher Wegnahmen durch weitere staatliche, private und kirchliche Akteure.
    - >-
      Pro Juventute war eine private Stiftung; die operativen Kindesschutzbefugnisse lagen bei kommunalen oder kantonalen
      Behörden. Eidgenössische, kantonale und kommunale Stellen finanzierten und legitimierten das Programm jedoch,
      lieferten Informationen und wirkten routinemässig mit. Das Gutachten von 2024 bezeichnet den Staat nach heutigen
      Zurechnungsregeln als unverzichtbaren Mitakteur.
    - >-
      Die Einstufung von 2025 gilt ausdrücklich nach heutigem Völkerrecht. Das Gutachten hält fest, dass der damalige
      Tatbestand des Verbrechens gegen die Menschlichkeit einen hier fehlenden Kriegsbezug voraussetzte. Eine für Genozid
      erforderliche Absicht physischer oder biologischer Vernichtung sei nicht erwiesen; Zwangsassimilation und kulturelle
      Zerstörung waren gleichwohl zentrale Ziele.
    - >-
      Wiedergutmachung und Anerkennung entwickelten sich über Jahrzehnte und sind nicht abgeschlossen. Ein 2026 im
      eidgenössischen Dialogprozess erstellter externer Bericht empfiehlt eine unabhängige Kommission; als Vorstudie
      belegt er nicht, dass Bundesrat oder Parlament eine solche Kommission bereits eingesetzt hätten.
episodes:
  - id: switzerland-1926-1973
    polity: Schweiz
    institutions:
      - Pro Juventute — Hilfswerk für die Kinder der Landstrasse
      - kantonale und kommunale Vormundschafts-, Fürsorge-, Polizei- und Justizbehörden
      - Schweizerische Eidgenossenschaft — finanzielle und institutionelle Unterstützung
      - Pflegefamilien, Kinder- und Erziehungsheime, Arbeitsanstalten und psychiatrische Kliniken
    institutionalContext: >-
      Pro Juventute gründete Kinder der Landstrasse 1926 und suchte systematisch nach Familien, die sie als jenisch oder
      als sogenannte Fahrende einordnete. Mitarbeitende legten Familienakten und Stammbäume an, nutzten kommunale Beamte,
      Lehrpersonen, Geistliche, Polizei und Gerichte als Informationsquellen und suchten Material für Kindesschutzanträge.
      Kommunale und kantonale Vormundschaftsbehörden lieferten die Rechtsakte, entzogen teils die elterliche Gewalt und
      setzten Programmpersonal als Vormund ein. Der Bund hatte keine primäre Zuständigkeit für Jugendfürsorge, subventionierte
      das Programm aber und war personell sowie institutionell eng mit Pro Juventute verflochten. Die operative Tätigkeit
      endete 1972; die öffentliche Aufdeckung führte 1973 zur formellen Auflösung.
    consequences:
      - Wegnahme von rund 600 Kindern durch Kinder der Landstrasse und eine geschätzte Gesamtzahl von bis zu 2.000 jenischen Kindern in vergleichbaren Praktiken
      - Verteilung auf Pflegefamilien, Kinderheime, Erziehungs- und Arbeitsanstalten, psychiatrische Kliniken und teils Gefängnisse
      - Systematische Behinderung des Kontakts zwischen Kindern, Eltern, Geschwistern und weiteren Verwandten
      - Körperliche und seelische Misshandlung, unterbrochene Schulbildung und Einsatz vieler Kinder und Jugendlicher als gering oder gar nicht entlohnte Arbeitskräfte
      - Verlust von Sprache, Familienwissen und kultureller Identität mit generationenübergreifenden Folgen
      - Langwierige Kämpfe Betroffener und jenischer Organisationen um Akten, Wiedergutmachung, Anerkennung und Garantien der Nichtwiederholung
    summary: >-
      Das Programm verwandelte eine rassifizierte Gruppenzuordnung in eine fürsorgerische Vorannahme. Ein jenischer
      Familienname oder die Abstammung konnte auch sesshafte Familien unter Beobachtung bringen; anschliessend suchten
      und selektierten Mitarbeitende Material, um die Wegnahme als individuell begründet erscheinen zu lassen. Behörden
      machten aus diesen Akten und Anträgen Vormundschaftsentscheide, während ein Netz von Einrichtungen die Platzierungen
      und die Trennung von der Familie vollzog. Ziel war nicht bloss die Reaktion auf konkrete unsichere Haushalte, sondern
      die Auflösung von Familienverbänden, die Unterdrückung der reisenden Lebensweise und die Assimilation der Kinder.
      Rund 600 Wegnahmen sind im zentralen Programm dokumentiert; die Gesamtzahl wird auf bis zu 2.000 geschätzt.
    mechanism:
      summary: >-
        Programmmitarbeitende erfassten und überwachten ausgewählte Familien, stellten selektive Fallakten zusammen und
        drängten auf vormundschaftliche Eingriffe. Behörden nutzten Kindesschutz- und Vormundschaftsrecht, um Wegnahmen zu
        verfügen, Vormünder einzusetzen und Kinder fern von Verwandten zu platzieren; Einrichtungen vollzogen Trennung und Umerziehung.
    institutionalCorrection:
      periodLabel: 1973–2026 und fortdauernd
      action: Das Programm wurde 1973 aufgelöst; später folgten Entschuldigung, Aktenzugang, Entschädigung, Forschung und die Anerkennung von 2025 nach heutigem Völkerrecht sowie ein laufender Dialog über weitere Wiedergutmachung.
      summary: >-
        Bundespräsident Alphons Egli entschuldigte sich 1986 für die Unterstützung durch den Bund; spätere Massnahmen
        betrafen Akten, Entschädigung, Forschung und das breitere System fürsorgerischer Zwangsmassnahmen. 2025 anerkannte
        der Bundesrat die Verfolgung durch das Programm nach heutigem Recht als Verbrechen gegen die Menschlichkeit und
        bekräftigte die allgemeine Entschuldigung von 2013; Pro Juventute erneuerte separat ihre eigene Entschuldigung.
        Die Eidgenössische Kommission gegen Rassismus kritisierte, dass eine ausdrückliche Anerkennung und Entschuldigung
        für die spezifisch rassistische Verfolgung fehlte. Aus einem Dialog von 2025 ging 2026 der externe Vorschlag einer
        unabhängigen Kommission hervor; die institutionelle Korrektur bleibt daher ein laufender, umstrittener Prozess.
evidence:
  - id: yenish-galle-proposition
    note: >-
      Die Aktenstudie unterscheidet zwischen Zielauswahl und formellem Nachweis: Abstammung und Familiennamen erfassten
      auch sesshafte Familien; danach überwachte das Programm sie, suchte vermeintliche Belege und übermittelte
      Informationen selektiv, um einzelne Wegnahmeentscheide zu erwirken.
  - id: yenish-federal-council-correction
    note: >-
      Offizielle Anerkennung von 2025, dass die Verfolgung im Rahmen des Programms nach heutigem Völkerrecht als
      Verbrechen gegen die Menschlichkeit gilt; zugleich wurden die Entschuldigung von 2013 bekräftigt und ein weiterer Dialog angekündigt.
  - id: yenish-bak-impact
    note: >-
      Aktuelle Bundesübersicht zu rund 600 direkten Wegnahmen, zur geschätzten Gesamtzahl von bis zu 2.000 Kindern aus
      jenischen Familien in vergleichbaren Praktiken, zu Platzierungen und Kontaktunterbindung sowie zur Auflösung 1973.
  - id: yenish-federal-archives-carrier
    note: >-
      Bundesarchivische Darstellung von Pro Juventute als privater Trägerin und der Unterstützung durch Bund, Kantone,
      Gemeinden, Fürsorgeeinrichtungen, Heime und Privatpersonen.
  - id: yenish-galle-carrier
    note: >-
      Detaillierte Untersuchung der Arbeitsteilung zwischen Pro Juventute und Behörden, darunter Anträge der Stiftung,
      amtliche Vormundschaftsentscheide und das für den Programmbetrieb nötige Informationsnetz.
  - id: yenish-galle-mechanism
    note: >-
      Zeigt, wie Familienname und Abstammung die Erfassung bestimmten, Ermittlungen auf Wegnahmebelege ausgerichtet waren
      und günstige Informationen gegenüber Behörden ausgesondert werden konnten.
  - id: yenish-ekr-dossier-mechanism
    note: >-
      Bundesdossier gegen Rassismus: Familien wurden ungeachtet ihrer tatsächlichen Lebensweise verfolgt, ein jenischer
      Name konnte zur Erfassung genügen, rassenbiologische Theorien stützten das Projekt, und Trennung diente der kulturellen Auflösung.
  - id: yenish-diggelmann-state-role
    note: >-
      Rekonstruiert die privat-staatliche Arbeitsteilung und sieht nach heutigen Zurechnungsregeln sehr starke Gründe,
      den Staat als unverzichtbaren Mitakteur der Verfolgung zu behandeln.
  - id: yenish-bak-consequences
  - id: yenish-galle-consequences
    note: >-
      Zählt in der späteren Vollauswertung 586 Programmkinder und dokumentiert Anstaltsunterbringungen, psychiatrische
      Begutachtung, Schulabbrüche, Arbeitseinsätze und die langfristige Entfremdung von Eltern und Geschwistern.
  - id: yenish-inherited-ekr-context
    note: >-
      Die übernommene URL führt heute zu Isabella Husers Betroffenenessay in TANGRAM 49 und nicht zum Dossier von 2024,
      das der beibehaltene Quellentitel nennt. Sie wird hier nur für die zeitgenössische jenische Kritik an der Reaktion
      des Bundes von 2025 verwendet; das korrekte Dossier-PDF ist separat verlinkt.
  - id: yenish-diggelmann-legal-context
    note: >-
      Erläutert, dass die Einstufung als Verbrechen gegen die Menschlichkeit nach heutigen Massstäben gilt, nicht nach dem
      damaligen Recht, und verneint Genozid, weil die Absicht physischer oder biologischer Vernichtung nicht erwiesen ist.
  - id: yenish-bak-institutional-correction
    note: >-
      Bundeschronologie zur Entschuldigung von 1986 für die Mitwirkung des Bundes, zu Aktenzugang, Entschädigung,
      Forschung, Minderheitenanerkennung, völkerrechtlicher Einstufung 2025 und fortdauernder Aufarbeitung.
  - id: yenish-federal-council-institutional-correction
  - id: yenish-pro-juventute-institutional-correction
    note: >-
      Die institutionelle Trägerin anerkennt diskriminierende Annahmen hinter den Kindswegnahmen, übernimmt die
      Einstufung als Verbrechen gegen die Menschlichkeit und erneuert ihre Entschuldigung bei Betroffenen und Familien.
  - id: yenish-ekr-statement-partial-correction
    note: >-
      Die Eidgenössische Kommission gegen Rassismus begrüsste das Gutachten, kritisierte aber, dass der Bundesrat nur eine
      allgemeine Entschuldigung von 2013 bekräftigte und die spezifisch rassistische Verfolgung nicht ausdrücklich benannte und entschuldigte.
  - id: yenish-dialogue-report-partial-correction
    note: >-
      Ein externer Vorbereitungsbericht aus dem eidgenössischen Dialog empfiehlt eine unabhängige Kommission, öffentliche
      Anhörungen und weitere Forschung. Er weist die Ansichten den Autoren zu und ist ein Vorschlag, keine eingesetzte Kommission.
