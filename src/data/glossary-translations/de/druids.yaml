term: Druiden
aliases: []
shortDefinition: Religiöse und gelehrte Spezialisten, die griechische und römische Autoren bei eisenzeitlichen Gesellschaften in Gallien und Britannien beschrieben.
longDefinition: Die historisch beschriebenen Druiden gehören zu eisenzeitlichen Gesellschaften, die aus antiken Schriftquellen bekannt sind. Die wichtigsten Steinsetzungen von Stonehenge sind Jahrtausende älter; diese historisch dokumentierte Gruppe kann daher nicht als Erbauer identifiziert werden.
