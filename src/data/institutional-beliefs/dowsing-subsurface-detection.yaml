title: Dowsing as a reliable subsurface detection method
claim: A trained operator using a rod, pendulum, or related radiesthetic technique was treated as able to detect hidden
  groundwater or geological features reliably enough to guide technical decisions.
currentUnderstanding: Controlled evidence has not shown dowsing to provide reliable information about hidden groundwater
  or geological targets beyond ordinary environmental cues and chance. Apparent success in water finding is especially easy
  to overinterpret because groundwater occurs beneath much of the landscape; determining its depth, yield, and quality requires
  hydrogeological, geological, and geophysical evidence.
category: Geology and natural resources
reviewedAt: 2026-08-23
episodes:
- id: soviet-union-1967-1991
  polity: Soviet Union
  region: Europe and Asia
  startYear: 1967
  endYear: 1991
  strength: officially-endorsed
  institutionTypes:
  - government
  - academy
  - education
  institutions:
  - USSR Ministry of Geology
  - All-Union Institute of Mineral Raw Materials (VIMS)
  - Interdepartmental Commission on the Biophysical Effect
  - USSR Academy of Sciences
  consequences:
  - A coordinated research program on the so-called biophysical method was created across multiple institutes
  - All-Union seminars and an interdepartmental commission institutionalized research and professional exchange
  - Methodological guidance was prepared for use of the method in geological mapping
  - The method was investigated for locating ore, groundwater, oil, faults, and other subsurface targets
  summary: In 1967 the USSR Ministry of Geology convened a meeting at VIMS with eight institutes to formalize investigation
    of dowsing under the terms “biophysical effect” and “biophysical method.” An All-Union research program and interdepartmental
    commission followed, with repeated seminars, published work, methodological guidance for geological mapping, and links
    to operators around the USSR. A 1984 account by participants stated that the method's effectiveness was accepted within
    this institutional program and cited support from a vice-president of the USSR Academy of Sciences, even though an unsuccessful
    controlled experiment at the Kursk Magnetic Anomaly had already slowed the program's development.
  sources:
  - title: Use of the biolocation method in mineral prospecting and geological mapping
    url: https://zolotodb.ru/article/10471/?page=all
    publisher: Zolotodobicha, reprinting a 1984 Soviet technical account
    note: Reproduces the late-Soviet institutional history of the program, including the 1967 Ministry of Geology meeting,
      participating institutes, seminars, interdepartmental commission, methodological guidance, the failed Kursk experiment,
      and Academy-level endorsement claimed by the authors.
  - title: Biophysical method — history of research in the USSR
    url: https://search.rsl.ru/ru/record/01004050034
    publisher: Russian State Library
    note: Catalogues a 2008 collection of articles and reports drawn from the archive of the Interdepartmental Commission
      on the Biophysical Effect and identifies the collection as marking forty years of scientific research on dowsing in
      the USSR.
  - title: Water Dowsing
    url: https://www.usgs.gov/water-science-school/science/water-dowsing
    publisher: U.S. Geological Survey
    note: Explains why apparent groundwater-finding success is not evidence that dowsing works and states that accurate
      determination of groundwater depth, quantity, and quality requires hydrologic, geologic, and geophysical methods.
- id: germany-1991-1995
  polity: Germany
  region: Europe
