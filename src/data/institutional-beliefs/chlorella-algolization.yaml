title: Chlorella algolization for water-body rehabilitation
claim: Introducing selected planktonic Chlorella strains into natural water bodies was treated as a reliable way to suppress
  cyanobacterial blooms and improve water quality through the claimed ecological mechanisms.
currentUnderstanding: Chlorella has legitimate uses in biotechnology and wastewater research, but evidence does not establish
  that inoculating natural reservoirs with selected Chlorella strains reliably suppresses cyanobacterial blooms or produces
  the broad rehabilitation effects claimed for algolization. Russian state testing in 2007 did not establish efficacy, and
  a 2009 scientific council of the Federal Water Resources Agency concluded that the proposed use of Chlorella to suppress
  blooms was not scientifically substantiated or confirmed by practice.
category: Environment
reviewedAt: 2026-08-23
impact:
  summary: The significance of this episode is the institutional contradiction itself. Russian water authorities generated
    negative or inconclusive evidence and a federal scientific council rejected the claimed bloom-suppression method as
    unsubstantiated, yet algolization later acquired the force and legitimacy of national technical standards.
  highlights:
  - value: '2009'
    label: Federal scientific council rejected the claimed bloom-suppression method as scientifically unsubstantiated and
      unconfirmed in practice
  - value: '2022'
    label: Algolization was codified in a Russian national standard
  - value: '2025'
    label: A dedicated national Chlorella-algolization standard entered the standards system
  context:
  - The sequence matters. The first large Penza Reservoir application in 1998 was recorded as ineffective. A Federal Water
    Resources Agency trial at the Tsimlyansk Reservoir in 2007 produced results too ambiguous to establish effectiveness,
    and in 2009 the agency’s scientific-technical council concluded that the proposed use of Chlorella against blooms was
    not scientifically substantiated or confirmed by practice.
  - The technique nevertheless persisted outside that negative evaluation. Russian water researchers reported further laboratory
    and field work in 2012–2013 that did not confirm the advertised mechanism. Yet GOST R 59977-2022 prescribed algolization
    within a national water-rehabilitation standard, and GOST R 71946-2025 created a dedicated standard for applying planktonic
    Chlorella strains. The institutional error is therefore not simply that an experiment failed; it is that a contested
    method acquired formal technical authority after the state’s own scientific system had already produced contrary findings.
