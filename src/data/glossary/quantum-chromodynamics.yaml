term: Quantum chromodynamics
aliases:
- QCD
- quantum chromodynamics
shortDefinition: The quantum theory of the strong interaction, describing how quarks interact through gluons.
longDefinition: Quantum chromodynamics, usually abbreviated QCD, is the part of the Standard Model that describes the
  strong interaction. Quarks carry a property called color charge and interact by exchanging gluons. QCD explains why
  quarks are confined inside hadrons such as protons and neutrons and why much of a nucleon's mass arises from strong-interaction
  energy rather than from the bare masses of its quarks.
