    summary: The Turkish History Thesis became an official framework of early Republican historiography and school history. It presented Turks as an ancient civilization-building people of Central Asian origin and sought to establish them as members of the white “Alpine” race. State-sponsored congresses and a 1937 anthropometric survey of tens of thousands of people were used to support the thesis.
