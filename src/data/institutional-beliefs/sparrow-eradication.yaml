schemaVersion: 2
title: Sparrow eradication as an agricultural remedy
proposition:
  summary: >-
    China's party-state treated Eurasian tree sparrows as harmful birds whose elimination across every feasible area
    would prevent grain losses and support higher agricultural production. A central agricultural program made
    eradication an official target, and the Great Leap Forward converted it into a nationwide mass campaign.
correction:
  summary: >-
    Eurasian tree sparrows do consume grain, so limited crop protection can be warranted in particular places and
    seasons. Their net effect cannot be inferred from grain consumption alone: their diet varies by habitat, season and
    life stage, and they consume many insects, especially while feeding young. Blanket eradication removed biological
    pest control. Contemporary researchers linked sparrow depletion to the insect outbreaks of 1959 while cautioning
    that weather and other factors also mattered. A 2025 NBER working paper supplies new quantitative evidence that
    sparrow eradication contributed to crop losses and famine mortality; it does not make the campaign the sole cause of
    the Great Famine.
category: Ecology and agriculture
reviewedAt: '2026-09-25'
impact:
  summary: >-
    The policy began in late 1955, entered the national agricultural outline in January 1956 and was qualified in 1957
    to exempt sparrows in cities and forests. That qualification had little practical effect when the campaign escalated
    in 1958. Local party-government bodies organized special teams and mobilized workers, officials, soldiers, students
    and residents to destroy nests, eggs and chicks and to kill adult birds. Sparrow populations were severely depleted
    and locally extirpated. Insect outbreaks and harvest damage followed, although their causes were not singular. The
    central leadership reversed course in March 1960, and the National People's Congress formally replaced sparrows with
    bedbugs in the Four Pests list on 10 April.
  highlights:
    - value: 1955–1960
      label: span from adoption of the central anti-sparrow policy to its formal reversal
    - value: 5.3% / 8.7%
      label: >-
        larger rice and wheat declines per one-standard-deviation increase in sparrow habitat suitability, estimated by
        a 2025 NBER working paper
    - value: nearly 2 million
      label: >-
        excess deaths attributed to sparrow eradication by the same working paper; an author estimate, not a total famine
        death count
  context:
    - >-
      The Four Pests program combined unlike targets. Flies, mosquitoes and rats were targeted chiefly as disease
      vectors; sparrows were included chiefly because they ate grain. The failure of sparrow eradication does not by
      itself negate the public-health value of every sanitation or vector-control measure carried out under the broader
      patriotic-health campaign.
    - >-
      Scientific opinion was more complex than a simple conflict between rulers and a unanimous expert community. Some
      ornithologists initially supported control, while other biologists urged delay; continued research showed strong
      seasonal and geographic variation. By November 1959, the Chinese Academy of Sciences reported a broad preference
      for controlling specific crop damage rather than eliminating the species.
    - >-
      Published national kill totals differ by roughly an order of magnitude, and campaign reporting rewarded inflated
      achievements. This entry therefore describes severe depletion and local extirpation without adopting a precise
      nationwide bird-death total.
    - >-
      Reports of insect outbreaks in 1959 were real, but researchers at the time warned that infestation had multiple
      causes. The 2025 NBER study uses habitat suitability and county records to estimate a causal contribution; it is a
      discussion paper that has not undergone peer review, so its yield and mortality figures are presented as the
      authors' estimates.
    - >-
      A short official forestry-history page says sparrows had left the Four Pests list by June 1959. The detailed
      archival chronology instead records scientific reports in September and November 1959, a central stop order in
      March 1960 and formal replacement by the National People's Congress on 10 April 1960. This entry follows the dated
      directive and enacted text while preserving the conflicting official page in the evidence record.
episodes:
  - id: china-1955-1960
    polity: People's Republic of China
    region: East Asia
    startYear: 1955
    endYear: 1960
    periodLabel: Late 1955–10 April 1960
    strength: policy-basis
    institutionTypes:
      - government
      - academy
      - education
    institutions:
      - Mao Zedong and the Central Committee of the Communist Party of China
      - State Council of the People's Republic of China
      - Supreme State Conference and Second National People's Congress
      - Chinese Academy of Sciences and its Party Group
      - People's Daily and provincial and municipal party-state media
    institutionalContext: >-
      Mao placed sparrows among four pests in agricultural proposals drafted in November 1955. After Politburo and
      Supreme State Conference review, Article 27 of the January 1956 national agricultural outline draft called for
      rats, sparrows, flies and mosquitoes to be basically eliminated wherever possible. Research and objections led the
      October 1957 revision to say that sparrows in cities and forests need not be killed, but a joint Central Committee–
      State Council directive of 12 February 1958 again called rats and sparrows major enemies that damaged grain and
      obstructed production. Repeated leadership exhortations, party-state media, local command organizations, schools
      and work units turned the proposition into mass killing during 1958. In 1959 the Chinese Academy of Sciences
      assembled evidence on the birds' mixed ecological role. The central leadership ordered sparrow killing stopped in
      March 1960, and the legislature formalized the substitution of bedbugs on 10 April.
    consequences:
      - Organized destruction of adult sparrows, nests, eggs and chicks across urban and rural China
      - Severe population depletion and local extirpation in heavily mobilized areas
      - Loss of insect predation followed by reported outbreaks that damaged urban trees and agricultural crops
      - A measurable contribution to rice and wheat losses and famine mortality in a 2025 working-paper estimate
      - Displacement of qualified scientific warnings and context-specific pest-management advice during the 1958 peak
      - Reversal of the target in 1960 after renewed scientific review and evidence of ecological harm
    summary: >-
      A crop-loss complaint became central policy before the Great Leap Forward and then a nationwide mobilization.
      Administrative targets and campaign media compressed a variable ecological relationship into the category of a
      species-wide enemy. The killing badly depleted sparrows, reduced natural insect control and contributed to crop
      losses amid the wider Great Leap Forward crisis. Scientific review helped produce a central reversal in March 1960
      and a formal legislative change in April.
    mechanism:
      kind: administrative-adoption
      summary: >-
        The party leadership embedded eradication in a national agricultural program, the Central Committee and State
        Council issued a joint directive, and provincial and local bodies translated it into command organizations,
        publicity, collective drives and reported performance totals. Schools, work units, officials and residents were
        mobilized to destroy birds and nests. The same centralized chain later transmitted the stop order.
    institutionalCorrection:
      status: corrected
      periodLabel: September 1959–10 April 1960
      action: >-
        The Central Committee ordered that sparrows no longer be killed, and the National People's Congress replaced
        sparrows with bedbugs in Article 27 of the national agricultural outline.
      summary: >-
        Chinese Academy of Sciences reports in September and November 1959 emphasized context-dependent benefits and
        harms and urged control of damage rather than elimination of the species. Mao circulated the November report,
        the Academy organized further review, and a Central Committee health directive drafted on 16 March and issued
        on 18 March 1960 said to stop killing sparrows. On 10 April the Second National People's Congress adopted the
        revised Four Pests list of rats, bedbugs, flies and mosquitoes.
