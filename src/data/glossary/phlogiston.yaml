term: Phlogiston
aliases:
- phlogiston theory
- phlogisticated
- dephlogisticated
shortDefinition: A hypothetical fire-like substance once thought to be contained in combustible materials and released
  during burning.
longDefinition: Phlogiston theory gave seventeenth- and eighteenth-century chemists a common framework for combustion,
  calcination, smelting, and respiration. Combustible substances were supposed to contain phlogiston and lose it when
  burned. Quantitative mass measurements and the oxygen theory of combustion eventually made the hypothetical substance
  unnecessary.
