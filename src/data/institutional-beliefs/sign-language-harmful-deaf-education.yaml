schemaVersion: 2
title: Sign language as harmful to deaf education
proposition:
  summary: >-
    In 1880 the Milan congress of deaf educators treated speech as superior to signs and asserted that using speech
    and signs together injured speech, lip-reading and the “precision of ideas.” On that basis it preferred the oral
    method, and then pure oral instruction, over sign-based education.
correction:
  summary: >-
    Natural sign languages are full, rule-governed human languages. With fluent input from birth, children acquire
    them on the same overall time scale as spoken languages; delayed access to any fully accessible first language
    risks language deprivation. A 2023 cross-sectional study of 56 deaf and hard-of-hearing children with hearing
    parents found ASL vocabulary positively associated with spoken-English vocabulary, a pattern inconsistent with
    inherent harm, but it could not establish causality. A 2016 systematic review found insufficient high-quality
    evidence to decide whether sign-plus-oral intervention produces better spoken-language outcomes than oral-only
    intervention. The evidence therefore rejects categorical exclusion of sign language without establishing one
    single best educational method for every child. Services should secure direct access to one or more fully
    accessible natural languages and respond to the individual child's needs.
category: Education and language
reviewedAt: '2026-09-25'
impact:
  summary: >-
    At the Milan congress of 6–11 September 1880, the first resolution preferred speech to signs by about 160 votes
    to 4 and the second preferred the pure oral method by about 150 to 16. An eighth resolution recommended a staged
    conversion of schools: teach new pupils through speech, separate them from pupils completing their education with
    signs, and add a new speaking class each year. The congress did not legislate a worldwide ban. Oralism predated
    Milan, and signing and Deaf resistance continued after it. Its resolutions nevertheless gave oralism a powerful
    international professional reference point; UNESCO records negative effects on language and education in many countries,
    exclusion of deaf teachers and wider devaluation of signed languages. On 19 July 2010, the Vancouver congress's
    organizing committee and the British Columbia Deaf Community presented a statement rejecting the 1880 resolutions
    that denied sign languages a place in education.
  highlights:
    - value: about 160–4
      label: Recorded vote preferring speech to signs in the first 1880 resolution
    - value: about 150–16
      label: Recorded vote preferring pure oralism to simultaneous speech and signs
    - value: 130 years
      label: Time from the Milan resolutions to the Vancouver statement rejecting their sign-excluding provisions
  context:
    - >-
      The Milan congress was an international professional meeting, not a legislature. Its resolutions did not enact
      a worldwide legal ban, and their adoption and enforcement differed among countries and schools.
    - >-
      Oralist organizing predated Milan. Recent historiography also cautions against making the congress the sole cause
      of a uniform 80-year disappearance of sign language: the votes were not unanimous, sign use continued and Deaf
      people resisted oralist policies.
    - >-
      The 1880 documents used terms such as “signs,” “simultaneous use” and “pure oral.” Natural sign languages,
      manually coded forms of spoken languages, home-sign systems and simultaneous communication are not
      linguistically interchangeable, so modern studies must be read according to what they actually measured.
    - >-
      The 2010 statement was a professional and symbolic reversal presented by the ICED Vancouver 2010 Organizing
      Committee with the British Columbia Deaf Community. It did not itself change national law, end oral-only
      practice everywhere or guarantee universal access to sign language.
    - >-
      Rejecting the inherent-harm claim does not make speech, hearing technology or oral instruction inherently
      harmful. Nor does it prove that one combined method has superior spoken-language outcomes for every child.
      The defensible requirement is timely access to language the child can fully perceive, with services responsive
      to the child's circumstances.
episodes:
  - id: international-1880-2010
    polity: International — Milan 1880 and Vancouver 2010 congresses
    region: Global
    startYear: 1880
    endYear: 2010
    strength: officially-endorsed
    institutionTypes:
      - professional
      - education
    institutions:
      - Second International Congress on the Education of the Deaf (Milan, 1880)
      - ICED Vancouver 2010 Organizing Committee
      - British Columbia Deaf Community
    institutionalContext: >-
      The international congress meeting in Milan from 6 to 11 September 1880 adopted a first resolution declaring
      speech superior to signs and a second saying simultaneous speech and signs injured speech, lip-reading and the
      precision of ideas. The official English report described the votes as about 160–4 and about 150–16. Its eighth
      resolution recommended gradual institutional conversion through speech-only entry classes, separation from older
      sign-taught pupils and one new speaking class each year. These were nonbinding professional resolutions, but they
      furnished an international reference point for an oralist movement already under way. On 19 July 2010, the
      Vancouver organizing committee and the British Columbia Deaf Community presented “A New Era: Deaf Participation
      and Collaboration,” rejecting the sign-excluding Milan resolutions, regretting their effects and calling for
      educational programs to respect all languages and forms of communication.
    consequences:
      - International professional endorsement of oral instruction over sign-based education
      - A proposed school-by-school phase-out of sign instruction through separate entry classes and annual expansion of speech teaching
      - Use of the Milan resolutions as an institutional reference for oralist policy in multiple countries
      - Reduced access to signed language in education and exclusion or marginalization of deaf teachers
      - Wider devaluation of signed languages, while signing and Deaf resistance continued rather than disappearing uniformly
      - A nonbinding 2010 professional reversal that acknowledged harm and endorsed linguistic and communicative plurality
    summary: >-
      Milan's delegates endorsed speech over signs, characterized simultaneous speech and signs as harmful and recommended a
      gradual conversion of schools to pure oral instruction. The resolutions carried professional rather than
      legislative authority, but became an influential international reference within a broader oralist movement.
      In 2010, organizers of the Vancouver congress and the British Columbia Deaf Community rejected the provisions
      that had excluded sign languages and acknowledged their detrimental effects.
    mechanism:
      kind: endorsement
      summary: >-
        Recorded congress votes converted oralist claims into formal professional resolutions. The first two supplied
        the hierarchy and harm rationale; the eighth translated them into a staged school policy for replacing
        sign-taught cohorts with speech-only entry classes.
    institutionalCorrection:
      status: corrected
      periodLabel: 19 July 2010
      action: >-
        The ICED Vancouver 2010 Organizing Committee and British Columbia Deaf Community rejected the 1880 resolutions
        that denied inclusion of sign languages in deaf education.
      summary: >-
        Their “A New Era” statement acknowledged and sincerely regretted the Milan conference's detrimental effects
        and called on educational programs to accept and respect all languages and forms of communication. This was a
        formal reversal within the congress tradition, though it was not binding legislation.
