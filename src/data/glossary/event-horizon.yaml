term: Event horizon
aliases: []
shortDefinition: A boundary around a black hole beyond which light and other signals cannot escape to distant observers.
longDefinition: An event horizon is a causal boundary in spacetime. Crossing it does not require hitting a material surface, but after crossing it no future-directed signal can reach the distant exterior universe.
reviewedAt: '2026-08-21'
sources:
- title: Black Holes
  url: https://science.nasa.gov/universe/black-holes/
  publisher: NASA Science
  note: Explains the event horizon as the boundary beyond which escape from a black hole is impossible.
