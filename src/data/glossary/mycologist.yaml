term: Mycologist
aliases:
- mycology
shortDefinition: A scientist who studies fungi.
longDefinition: Mycology is the branch of biology concerned with fungi; a researcher working in that field is a mycologist.
reviewedAt: '2026-08-21'
sources:
- title: Renewing Linnaean taxonomy
  url: https://onlinelibrary.wiley.com/doi/full/10.1111/brv.12920
  publisher: Biological Reviews
  note: Provides taxonomic context for organisms historically studied within mycology.
