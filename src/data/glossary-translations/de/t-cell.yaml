term: T-Zelle
aliases:
- T-Zellen
- T-Lymphozyt
- T-Lymphozyten
shortDefinition: Eine Lymphozytenart mit zentraler Rolle in der adaptiven Immunabwehr; verschiedene T-Zell-Typen koordinieren
  Abwehrreaktionen, töten infizierte Zellen oder regulieren andere Immunzellen.
longDefinition: T-Zellen sind Lymphozyten, deren Vorläufer im Knochenmark entstehen, aber im Thymus reifen. Ihre Antigenrezeptoren
  ermöglichen hochspezifische Erkennung. Zu den T-Zell-Gruppen gehören unter anderem Helfer-, zytotoxische, regulatorische
  und Gedächtnis-T-Zellen. Bevor sie in das reife Immunsystem gelangen, durchlaufen sich entwickelnde T-Zellen im Thymus
  einen Auswahlprozess.
