evidence:
  - id: terra-library-proposition
    sourceId: terra-parliament-library
    relation: supports
    target: {scope: belief, aspect: proposition}
    locator: sections “Historical Background,” “The Colonial Era,” “The Gove Land Rights Case” and “The Mabo No. 2 Decision and the Native Title Act”
    note: >-
      Traces how Australia departed from common-law colonial precedents that preserved pre-existing private rights, how
      governments treated land as Crown land, and how Cooper, Milirrpum and Mabo successively expressed, applied and
      rejected the exclusion of Indigenous title.
  - id: terra-bourke-proposition
    sourceId: terra-bourke-proclamation
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: “Significance” and “History”; transcript, recital and operative declaration
    note: >-
      The official archive explains the proclamation's terra-nullius significance. The transcript itself calls the land
      “vacant Lands of the Crown,” voids private agreements with Aboriginal people against Crown rights and treats
      possession without government authority as trespass; it does not use the Latin phrase.
  - id: terra-cooper-proposition
    sourceId: terra-cooper-judgment
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: paragraph 11; paragraphs 14–16 for the rule-against-perpetuities issue
    note: >-
      The Privy Council classified New South Wales as a territory that had been practically unoccupied and without settled
      inhabitants or law when annexed, then used that classification to state how English law entered the colony.
  - id: terra-mabo-correction
    sourceId: terra-mabo-judgment
    relation: documents
    target: {scope: belief, aspect: correction}
    locator: Brennan J, CLR pp. 29–30, 45–48, 51 and 57–63; Mason CJ and McHugh J, CLR p. 15; final orders
    note: >-
      The leading reasons reject the enlarged terra-nullius premise for property law, distinguish radical from beneficial
      title, recognise native title as a burden on radical title and state the rules for continuity and extinguishment.
      Mason CJ and McHugh J agreed with Brennan J; Dawson J dissented from recognition.
  - id: terra-aiatsis-correction
    sourceId: terra-aiatsis-summary
    relation: supports
    target: {scope: belief, aspect: correction}
    locator: “Background,” “Legal issues” and “The decision in Mabo,” especially paragraphs on the 6–1 result, connection and extinguishment
    note: >-
      The AIATSIS case summary records the six-justice majority, the Meriam people's title to most of the islands, survival
      through colonisation where connection remains and the qualification that inconsistent legislative or executive acts
      can extinguish title.
  - id: terra-library-impact
    sourceId: terra-parliament-library
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: “The Colonial Era,” “The Gove Land Rights Case” and “The Mabo No. 2 Decision and the Native Title Act”
    note: >-
      Connects the colonial land policy, Cooper's settled-colony classification, the failed Gove claim, the 1992 reversal
      and the 1993 statutory response while distinguishing sovereignty from beneficial ownership.
  - id: terra-alrc-impact
    sourceId: terra-alrc-126
    relation: contextualizes
    target: {scope: belief, aspect: impact}
    locator: paragraphs 2.26–2.29, 2.39–2.48 and 4.1–4.10; pp. 65–73 and 120–124
    note: >-
      Documents Milirrpum's mixed factual and legal findings, Mabo's radical-title framework and the later proof rules. The
      Commission says interpretation of the statutory definition can impose an onerous burden and recommends reform; this
      qualifies any claim that recognition automatically restored land rights.
  - id: terra-nta-impact
    sourceId: terra-native-title-act
    relation: documents
    target: {scope: belief, aspect: impact}
    locator: preamble, pp. 1–3; ss 3, 10–15, pp. 3 and 8–10 of the authorised version
    note: >-
      The Act's original text records both sides of the legislative response: recognition and protection, claims and
      future-dealing procedures, alongside validation of past acts, rules for extinguishment or suspension and compensation.
  - id: terra-bourke-carrier
    sourceId: terra-bourke-proclamation
    relation: documents
    target: {scope: episode, episodeId: australia-1835-1992, aspect: carrier}
    locator: “History”; transcript, heading, recital, operative declaration and date
    note: >-
      Identifies Governor Bourke, acting under colonial authority, as the official who quashed Batman's purported purchase
      and publicly reserved legally effective control of land to the government on 26 August 1835.
  - id: terra-cooper-carrier
    sourceId: terra-cooper-judgment
    relation: documents
    target: {scope: episode, episodeId: australia-1835-1992, aspect: carrier}
    locator: heading and paragraph 11
    note: >-
      Identifies the Judicial Committee of the Privy Council and its unanimous reasons delivered by Lord Watson as the
      high imperial court carrying the settled-colony classification into reported Australian law in 1889.
  - id: terra-alrc-milirrpum-carrier
    sourceId: terra-alrc-126
    relation: supports
    target: {scope: episode, episodeId: australia-1835-1992, aspect: carrier}
    locator: paragraphs 2.26–2.30, pp. 65–66
    note: >-
      Identifies the Northern Territory Supreme Court as the forum for Australia's first customary land-rights claim and
      records Blackburn J's finding of an elaborate Yolngu legal system alongside his refusal to recognise communal native title.
  - id: terra-inquiry-context
    sourceId: terra-parliament-inquiry
    relation: contextualizes
    target: {scope: episode, episodeId: australia-1835-1992, aspect: context}
    locator: Chapter 3, paragraphs 3.18–3.26, “The doctrine of terra nullius”
    note: >-
      The inquiry gives the institutional sequence from Bourke through Mabo and the Native Title Act, and expressly notes
      extinguishment and later claims-process problems. Its statement that Bourke used the term terra nullius is checked
      against the proclamation transcript, which uses “vacant Lands of the Crown” rather than the Latin phrase.
  - id: terra-aiatsis-mabo-context
    sourceId: terra-aiatsis-mabo
    relation: supports
    target: {scope: episode, episodeId: australia-1835-1992, aspect: context}
    locator: “Key points,” “Running the case” and “The decision”
    note: >-
      Describes the two assumptions challenged by the Meriam plaintiffs—no pre-colonial ownership and complete Crown
      ownership through sovereignty—and explains how the case proved a living system of Meriam law and landholding.
  - id: terra-bourke-mechanism
    sourceId: terra-bourke-proclamation
    relation: documents
    target: {scope: episode, episodeId: australia-1835-1992, aspect: mechanism}
    locator: transcript, recital and operative declaration
    note: >-
      Shows the administrative mechanism directly: agreements with Aboriginal people could not create title effective
      against Crown rights, and the government could treat possession lacking its licence as trespass.
  - id: terra-cooper-mechanism
    sourceId: terra-cooper-judgment
    relation: documents
    target: {scope: episode, episodeId: australia-1835-1992, aspect: mechanism}
    locator: paragraph 11 and paragraphs 14–16
    note: >-
      Shows how a broad factual classification of the colony became a choice-of-law rule: reasonably applicable English
      law entered from the outset because the territory was placed in the supposedly unoccupied, settled-colony class.
  - id: terra-library-consequences
    sourceId: terra-parliament-library
    relation: supports
    target: {scope: episode, episodeId: australia-1835-1992, aspect: consequences}
    locator: “The Gove Land Rights Case” and “The Mabo No. 2 Decision and the Native Title Act”
    note: >-
      Explains why the Yolngu claim failed despite the finding of a settled system of law and how Mabo later recognised
      native title while allowing grants such as freehold to extinguish it to the extent of inconsistency.
  - id: terra-alrc-consequences
    sourceId: terra-alrc-126
    relation: contextualizes
    target: {scope: episode, episodeId: australia-1835-1992, aspect: consequences}
    locator: paragraphs 2.41–2.48 and 4.4–4.10, pp. 68–73 and 123–124
    note: >-
      Separates recognition from recovery: native title must derive from traditional laws and customs, connection must be
      substantially maintained, valid sovereign acts may extinguish it, and later interpretation makes continuity pivotal to proof.
  - id: terra-mabo-institutional-correction
    sourceId: terra-mabo-judgment
    relation: documents
    target: {scope: episode, episodeId: australia-1835-1992, aspect: institutional-correction}
    locator: Brennan J, CLR pp. 29–30, 45–48, 51 and 57–63; Mason CJ and McHugh J, CLR p. 15; final orders
    note: >-
      The primary judgment records the institutional reversal and its limits: native title can burden Crown radical title,
      but depends on Indigenous law and custom, can lapse with loss of continuity and can be extinguished by inconsistent acts.
  - id: terra-aiatsis-institutional-correction
    sourceId: terra-aiatsis-summary
    relation: documents
    target: {scope: episode, episodeId: australia-1835-1992, aspect: institutional-correction}
    locator: “Legal issues,” paragraphs on the 6–1 holding, connection and extinguishment
    note: >-
      Confirms the date, majority, operative recognition and qualifications in an institutional native-title case summary.
  - id: terra-nta-institutional-correction
    sourceId: terra-native-title-act
    relation: documents
    target: {scope: episode, episodeId: australia-1835-1992, aspect: institutional-correction}
    locator: preamble, pp. 1–3; s 3 and ss 10–15, pp. 3 and 8–10 of the authorised version
    note: >-
      Parliament expressly recorded Mabo's rejection of terra nullius and enacted recognition and protection, while also
      preserving the decision's limits through extinguishment, validation and compensation provisions.
