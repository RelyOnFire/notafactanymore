locale: de
entryId: soviet-ukraine-famine-denial
sourceReviewedAt: '2026-08-25'
title: Die Massenhungersnot in der Sowjetukraine als antisowjetische Propaganda
claim: >-
  Sowjetische Institutionen bestritten oder verharmlosten Berichte, wonach die Sowjetukraine 1932–1933 eine
  katastrophale Hungersnot mit massenhaftem Verhungern erlebt habe. Solche Darstellungen wurden als Lügen,
  Übertreibungen oder antisowjetische Propaganda behandelt, während eine offene Diskussion unterdrückt und die Krise
  später vor allem mit Dürre und gewöhnlichen landwirtschaftlichen Schwierigkeiten erklärt wurde.
currentUnderstanding: >-
  In der Sowjetukraine ereignete sich 1932–1933 tatsächlich eine katastrophale Hungersnot, der Millionen Menschen zum
  Opfer fielen. Zeitgenössische interne sowjetische Akten dokumentierten Hunger, Verhungern, Sterblichkeit und den Bedarf
  an Lebensmittelhilfe, während die öffentliche Staatsdarstellung die Katastrophe bestritt oder verharmloste.
  Zwangskollektivierung, gewaltsame Getreidebeschaffung und Konfiskationspolitik gehörten zu den zentralen Ursachen; die
  Hungersnot lässt sich nicht angemessen als gewöhnliche Folge einer Dürre erklären. Die Leugnung der Hungersnot als Tatsachenereignis ist von der getrennten juristischen und historischen Debatte
  über einen Genozidvorsatz zu unterscheiden.
impact:
  summary: >-
    Die Leugnung wirkte über Außenpolitik, Botschaftspropaganda, Pressekontrolle, Archivgeheimhaltung und ein
    jahrzehntelanges geschichtspolitisches Tabu. Sowjetische Diplomaten bezeichneten Berichte ukrainischer Organisationen
    als Lügen und Darstellungen von Massentod als grotesk. Ausländische Korrespondenten wurden bei Reisen in betroffene
    Regionen eingeschränkt, während interne Partei- und Sicherheitsakten das Verhungern dokumentierten. Die Linie hielt
    jahrzehntelang: Noch im April 1983 veröffentlichte die sowjetische Botschaft in Kanada eine Erklärung über die
    „sogenannte Hungersnot“, stellte die Lage als weniger schwer als westliche Berichte dar und erklärte Dürre zum
    Hauptgrund. Im Januar 1990 erkannte das Zentralkomitee der Kommunistischen Partei der Ukraine die Hungersnot förmlich
    an und erklärte selbst, das Thema sei in der sowjetischen Geschichtsschreibung mehr als ein halbes Jahrhundert
    verschwiegen worden.
  highlights:
  - value: 50+ Jahre
    label: Zeitraum, für den die KP der Ukraine 1990 das Verschweigen der Hungersnot in der sowjetischen Geschichtsschreibung einräumte
  - value: 28. April 1983
    label: Datum einer amtlichen Erklärung der sowjetischen Botschaft in Kanada über die „sogenannte Hungersnot“
  - value: 26. Januar 1990
    label: Datum der förmlichen Anerkennung der Hungersnot und Freigabe von Archivmaterial durch die KP der Ukraine
  context:
  - >-
    Die öffentliche sowjetische Linie veränderte ihre Form. Frühe diplomatische Antworten wiesen Berichte über
    Hungersnot und massenhaften Tod unmittelbar als Lügen zurück. 1983 räumte eine Botschaftserklärung ernste
    landwirtschaftliche Schwierigkeiten ein, bestritt aber die westliche Darstellung einer katastrophalen,
    politikbedingten Hungersnot und schrieb der Dürre die Hauptrolle zu. Die sowjetische Wortwahl blieb also nicht sechs Jahrzehnte lang unverändert.
  - >-
    Intern wussten sowjetische Institutionen, dass Hunger und Verhungern auftraten. Geheime GPU-, Partei- und
    Regierungsakten dokumentierten Nahrungsmangel, Hungersnot, Todesfälle und Hilfsmaßnahmen. Der Widerspruch zwischen
    diesem internen Wissen und der öffentlichen Darstellung ist ein Kern des institutionellen Vorgangs.
  - >-
    Für die ukrainische Hungersnot ist heute die Bezeichnung Holodomor gebräuchlich; zahlreiche Staaten und
    Wissenschaftler stufen sie als Genozid ein, während Aspekte von Vorsatz und rechtlicher Einordnung weiterhin
    diskutiert werden. Diese Kontroverse ist von der Tatsachenkorrektur zu trennen: Die sowjetische Leugnung beziehungsweise
    Verharmlosung des tatsächlichen Ausmaßes einer katastrophalen Hungersnot widerspricht der Quellenlage.
