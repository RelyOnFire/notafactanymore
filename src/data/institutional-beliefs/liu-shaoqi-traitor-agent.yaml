evidence:
  - id: liu-1968-proposition
    sourceId: liu-1968-plenum
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: Paragraph beginning “全会批准中央专案审查小组” in the communiqué adopted 31 October 1968
    note: >-
      The contemporary communiqué records approval of the case-group report, the labels 叛徒、内奸、工贼, permanent
      expulsion and dismissal from all posts. It documents the institution's assertion and sanction; it does not prove the
      accusations true.
  - id: liu-1969-proposition
    sourceId: liu-1969-ninth-congress
    relation: documents
    target: {scope: belief, aspect: proposition}
    locator: Page 3, paragraphs beginning “Now it has been proved” and “It is precisely with the participation”
    note: >-
      The official English political report repeats the treachery labels, describes a supposed gang occupying important
      party and government posts and endorses the Twelfth Plenum's dismissal and expulsion decision.
  - id: liu-1980-correction-chinese
    sourceId: liu-1980-rehabilitation
    relation: documents
    target: {scope: belief, aspect: correction}
    locator: Paragraph beginning “为刘少奇同志平反昭雪” in the communiqué adopted 29 February 1980
    note: >-
      The Chinese communiqué calls the bourgeois-headquarters inference wrong and untenable, says materials were
      fabricated and many cadres falsely labelled agents, and records cancellation of the labels, resolution and report.
  - id: liu-1980-correction-english
    sourceId: liu-1980-english-communique
    relation: documents
    target: {scope: belief, aspect: correction}
    locator: Page 5, paragraphs beginning “Another major item” through “The fifth plenary session solemnly proclaims”; Peking Review no. 10, 10 March 1980
    note: >-
      The official English version supplies the translated labels, the “wrong and groundless” finding, the account of
      false evidence and false agent accusations, and the operative terms of the rehabilitation resolution.
  - id: liu-1981-correction
    sourceId: liu-1981-history-resolution
    relation: documents
    target: {scope: belief, aspect: correction}
    locator: Sections 19–20, page 8, especially the paragraph beginning “The ‘capitalist-roaders’ overthrown”
    note: >-
      The later Party history resolution says the alleged Liu-Deng bourgeois headquarters did not exist, calls the three
      labels a frame-up and declares the 1968 political conclusion and disciplinary measure utterly wrong.
  - id: liu-dittmer-context
    sourceId: liu-dittmer-rehabilitation
    relation: contextualizes
    target: {scope: episode, episodeId: china-1968-1980, aspect: context}
    locator: Abstract; Journal of Asian Studies 40(3), May 1981, pp. 455–479
    note: >-
      The peer-reviewed article independently identifies Liu as the highest-ranking Chinese Communist leader to fall
      victim to the Cultural Revolution and records his posthumous rehabilitation in spring 1980. It is used for scale and
      correction chronology, not for the Party's detailed factual claims.
  - id: liu-biography-impact
    sourceId: liu-biography
    relation: supports
    target: {scope: belief, aspect: impact}
    locator: Paragraph beginning “1966年‘文化大革命’开始后”
    note: >-
      The Party-history biography records Liu's persecution, transfer while seriously ill to confined quarters in
      Kaifeng on 17 October 1969, death there on 12 November and rehabilitation in 1980. It is a retrospective official
      account and is identified as such.
  - id: liu-1968-carrier
    sourceId: liu-1968-plenum
    relation: documents
    target: {scope: episode, episodeId: china-1968-1980, aspect: carrier}
    locator: Heading and paragraphs beginning “中国共产党第八届扩大的第十二次中央委员会全会” and “全会批准中央专案审查小组”
    note: >-
      The communiqué names the enlarged Central Committee plenum as the adopting body and the Central Case Examination
      Group as author of the report, supporting both institutional carriers without relying on later attribution.
  - id: liu-1969-carrier
    sourceId: liu-1969-ninth-congress
    relation: documents
    target: {scope: episode, episodeId: china-1968-1980, aspect: carrier}
    locator: Page 3, paragraphs beginning “Now it has been proved” through “On the basis of the theory”
    note: >-
      The political report shows that the CCP's Ninth National Congress repeated and celebrated the case after the 1968
      plenum, establishing continued endorsement at the Party's national congress rather than a one-day resolution alone.
  - id: liu-1980-case-mechanism
    sourceId: liu-1980-case-review
    relation: supports
    target: {scope: episode, episodeId: china-1968-1980, aspect: mechanism}
    locator: Paragraphs beginning “The so-called ‘investigation report’” and “All the false confessions”; Peking Review no. 12, 24 March 1980
    note: >-
      The official review describes fabricated materials, forged evidence, compelled confessions, suppressed testimony
      and a recanted statement withheld by the investigation group. It supports the stated evidentiary mechanism as the
      correcting Party presented it.
  - id: liu-walder-mechanism
    sourceId: liu-walder-cultural-revolution
    relation: contextualizes
    target: {scope: episode, episodeId: china-1968-1980, aspect: mechanism}
    locator: Chapter 9, printed pp. 229–230
    note: >-
      Walder's academic synthesis describes the Central Case Examination Group's place in the Cultural Revolution purges,
      its nationwide case-group network and the use of coercive interrogation. It corroborates the institutional setting,
      while the Liu-specific findings come from the cited case review.
  - id: liu-1968-consequences
    sourceId: liu-1968-plenum
    relation: documents
    target: {scope: episode, episodeId: china-1968-1980, aspect: consequences}
    locator: Paragraph beginning “全会批准中央专案审查小组”
    note: >-
      The communiqué directly supports the expulsion and dismissal consequence. Its call to continue criticism also
      documents intended enforcement, but is not used here to infer an unsourced number of additional victims.
  - id: liu-biography-consequences
    sourceId: liu-biography
    relation: supports
    target: {scope: episode, episodeId: china-1968-1980, aspect: consequences}
    locator: Paragraph beginning “1966年‘文化大革命’开始后”
    note: >-
      The official retrospective account supports confinement, physical persecution, the Kaifeng transfer and the date
      and place of death. The entry does not make a more specific claim about the immediate medical cause.
  - id: liu-1980-related-cases
    sourceId: liu-1980-english-communique
    relation: supports
    target: {scope: episode, episodeId: china-1968-1980, aspect: consequences}
    locator: Page 5, paragraphs beginning “Seizing upon this” and “This plenary session, after serious and earnest discussion”
    note: >-
      The communiqué says many leading party, government and army cadres were overthrown as alleged agents and directs
      responsible departments to redress the related framed-up, false and wrongful cases. It does not quantify them or
      extend that finding to every social group affected by the wider Cultural Revolution.
  - id: liu-1980-institutional-correction
    sourceId: liu-1980-rehabilitation
    relation: documents
    target: {scope: episode, episodeId: china-1968-1980, aspect: institutional-correction}
    locator: Paragraphs beginning “为刘少奇同志平反昭雪” and “五中全会庄严地向全党和全国人民宣告”
    note: >-
      The adopted communiqué records the Fifth Plenum's unanimous resolution, the precise measures cancelled and the
      instruction to correct cases arising from Liu's case.
  - id: liu-1980-introduction-context
    sourceId: liu-1980-introduction
    relation: contextualizes
    target: {scope: episode, episodeId: china-1968-1980, aspect: context}
    locator: Single summary paragraph beginning “1980年2月23～29日在北京举行”
    note: >-
      The Party historical database independently summarizes the plenum dates, removal of the three labels, cancellation
      of the 1968 resolution and report, restoration of Liu's reputation and redress of connected cases.
  - id: liu-1981-context
    sourceId: liu-1981-history-resolution
    relation: contextualizes
    target: {scope: episode, episodeId: china-1968-1980, aspect: context}
    locator: Sections 19–20, page 8
    note: >-
      The 1981 resolution says Mao initiated and led the Cultural Revolution, rejects the alleged headquarters and also
      attributes the frame-up to Lin Biao, Jiang Qing and followers. This preserves the later Party account's allocation
      of responsibility without treating it as an independent judicial finding.
