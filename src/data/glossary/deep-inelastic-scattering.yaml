term: Deep-inelastic scattering
aliases:
- deep inelastic scattering
- DIS
shortDefinition: High-energy scattering in which a probe penetrates a proton or neutron deeply enough to reveal point-like
  constituents inside it.
longDefinition: In deep-inelastic scattering, high-energy electrons, muons, neutrinos, or other probes transfer enough
  energy and momentum to a nucleon that its internal structure becomes visible in the scattering pattern. Experiments
  beginning in the late 1960s found behavior consistent with compact constituents inside protons, helping establish the
  quark picture.
relatedTerms:
- nucleon
- quantum-chromodynamics
reviewedAt: '2026-08-21'
sources:
- title: The Nobel Prize in Physics 1990 – Press release
  url: https://www.nobelprize.org/prizes/physics/1990/press-release/
  publisher: The Nobel Prize
  note: Describes deep-inelastic scattering experiments that revealed point-like constituents inside protons and neutrons.
