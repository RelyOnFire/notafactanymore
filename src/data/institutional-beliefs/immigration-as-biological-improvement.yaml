title: Immigration as biological improvement
claim: Immigrants were classified by racial, hereditary, and national-origin traits as either improving or threatening the nation's biological and “ethnic” condition.
currentUnderstanding: National origin, ethnicity, and socially defined race do not determine a person's hereditary worth or whether their descendants biologically improve a country. Human genetic variation does not divide populations into superior and inferior national stocks, and social, intellectual, or moral traits cannot be ranked through the eugenic categories used by these immigration policies.
category: Eugenics and immigration
reviewedAt: 2026-08-22
episodes:
