  - id: belgian-anthropology-debont-mechanism
    sourceId: belgian-anthropology-debont
    relation: supports
    target: {scope: episode, episodeId: belgium-1907-1952, aspect: mechanism}
    locator: Printed pp. 77, 79 and 89–91
    note: >-
      De Bont documents the heredity-and-environment classification, broad examination and national laboratory network.
      The later discussion explains that dossiers were designed for diagnosis, individualised classification and treatment,
      and that assigning diagnosis to physicians strengthened their role in prison affairs.
  - id: belgian-anthropology-external-mechanism
    sourceId: belgian-anthropology-external-services
    relation: documents
    target: {scope: episode, episodeId: belgium-1907-1952, aspect: mechanism}
    locator: 'PDF pp. 15–16, “B. Dossiers anthropologiques”'
    note: >-
      The official survey documents the dossier fields and diagnosis, the later report sent to prison management, and the
      examination's eligibility rules. It supports record creation and intended administrative use, not proof that every
      dossier controlled an individual decision.
  - id: belgian-anthropology-debont-consequences
