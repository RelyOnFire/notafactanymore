term: Paleoclimate
aliases:
- palaeoclimate
- past climate
shortDefinition: The climate of Earth in the geological past, reconstructed from physical, chemical, and biological evidence.
longDefinition: Paleoclimate research reconstructs climates that existed before modern instrumental records. Evidence
  can come from ice cores, sediments, fossils, pollen, tree rings, soils, isotopes, and other proxies. Such records show
  that Earth's climate has varied greatly through time and allow scientists to test how climate responds to greenhouse
  gases, continental geography, ocean circulation, and orbital changes.
relatedTerms:
- fossil-flora
reviewedAt: '2026-08-21'
sources:
- title: Traces of rainforests found in West Antarctica
  url: https://www.bas.ac.uk/news/traces-of-rainforests-found-in-west-antarctica/
  publisher: British Antarctic Survey
  note: Uses fossil soils, roots, pollen, and spores to reconstruct a much warmer Antarctic climate in the geological
    past.
