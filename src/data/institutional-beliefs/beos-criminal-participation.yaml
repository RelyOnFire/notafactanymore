schemaVersion: 2
title: BEOS brain profiling as evidence of criminal participation
proposition:
  summary: >-
    Brain Electrical Oscillation Signature (BEOS) profiling was treated as capable of distinguishing experiential
    memory acquired through personal participation in a crime from knowledge acquired by learning about, witnessing
    or otherwise becoming familiar with the event, and therefore as indicating whether a suspect participated.
correction:
  summary: >-
    EEG research can detect some forms of recognition and memory under controlled conditions, but that does not
    validate BEOS's stronger case-level inference from a brain response to personal participation in a particular
    crime. Innocent people can know crime details, memories can be suggested, distorted or assigned to the wrong
    source, and a remembered event does not by itself establish that the subject performed it. Publicly available
    evidence does not establish a known real-world error rate or robust independent validation for BEOS participation
    determinations; a recent scholarly review says the method has not undergone sufficiently rigorous peer review for
    its claims to be independently evaluated.
category: Forensic psychology and criminal evidence
reviewedAt: '2026-09-27'
impact:
  summary: >-
    Maharashtra's forensic laboratory administered BEOS to criminal suspects and witnesses, and in 2008 a Pune
    Sessions Court relied in part on a BEOS opinion in a murder conviction. By then, one laboratory reportedly had
    tested more than 75 people in less than two years. The Supreme Court later barred involuntary BEAP and related
    tests and direct admission of voluntarily obtained test results, but it did not specifically decide BEOS. The
    Maharashtra laboratory still presents BEOS as an available investigative technique and still describes it as
    detecting experiential knowledge gained by participating in a crime.
  highlights:
    - value: '2008'
      label: Pune Sessions Court relied in part on BEOS in the Sharma murder conviction
    - value: 75+
      label: suspects and witnesses reportedly tested at one Maharashtra laboratory in less than two years
    - value: '2026'
      label: Maharashtra's state forensic laboratory still presents BEOS as an available technique
  context:
    - >-
      The disputed claim is the inference from a measured response to personal participation in a crime. EEG can
      measure brain activity, and some research can distinguish recognition or types of memory under constrained
      conditions; neither point establishes that BEOS can reliably determine who committed a real-world act.
    - >-
      Selvi v. State of Karnataka concerned narcoanalysis, polygraph examination and the Brain Electrical Activation
      Profile (BEAP), not BEOS by name. A peer-reviewed legal and scientific analysis concludes that the Court's
      description and reasoning would likely apply to BEOS, but that is the authors' inference rather than an express
      Supreme Court holding about this method.
    - >-
      NFSU Delhi's listing of BEOS equipment documents teaching and research infrastructure. It does not itself claim
      that BEOS reliably determines criminal participation, so the university is treated as context rather than as a
      carrier of the proposition.
episodes:
  - id: india-2008-2026
    polity: India
    region: South Asia
    startYear: 2008
    endYear: 2026
    endOpen: true
    periodLabel: 2008–present
    strength: policy-basis
    institutionTypes:
      - government
      - court
    institutions:
      - Directorate of Forensic Science Laboratories, Maharashtra
      - Pune Sessions Court
    institutionalContext: >-
      By 2008 Maharashtra's state forensic laboratory was administering BEOS in criminal investigations and reporting
      whether subjects showed experiential knowledge of crime details. A Pune Sessions Court relied in part on such an
      opinion in Aditi Sharma's murder conviction. A government peer-review committee criticized BEOS, but the
      Directorate of Forensic Science dissolved it before a final report and rejected the interim findings. The Supreme
      Court then restricted compulsory brain-based testing and evidentiary use through a judgment about BEAP and other
      named techniques. Maharashtra's current laboratory page nevertheless continues to offer BEOS and repeats the
      disputed participation inference, while describing consent and admissibility limits.
    consequences:
      - Criminal suspects and witnesses underwent brain-based forensic examinations
      - Investigators received opinions about whether subjects possessed experiential knowledge of crime details
      - A trial court relied in part on a BEOS opinion when convicting Aditi Sharma of murder
      - BEOS findings could direct questioning, corroboration efforts and the search for further evidence
      - Consent, self-incrimination and admissibility disputes prompted later judicial safeguards
    summary: >-
      Indian forensic practice converted patterns in EEG data into opinions about the source of a person's knowledge.
      Maharashtra's laboratory used those opinions in investigations, and a trial court treated one as incriminating
      evidence. Scientific criticism and constitutional litigation produced meaningful limits, but neither process
      resulted in a completed institutional scientific repudiation of BEOS. The laboratory still describes the method
      as detecting experiential knowledge acquired through participation, so the proposition remains institutionally
      active under tighter legal constraints.
    mechanism:
      kind: administrative-adoption
      summary: >-
        A state forensic laboratory administered a proprietary EEG protocol, interpreted its computed signatures as
        experiential knowledge of a crime and supplied those opinions to investigators and courts; a Sessions Court
        then used the expert result alongside other evidence.
    institutionalCorrection:
      status: partial
      periodLabel: 2007–2010 and continuing
      action: >-
        A scientific review committee issued critical interim findings but was dissolved before a final report; in 2010
        the Supreme Court barred compelled narcoanalysis, polygraph and BEAP testing and direct admission of voluntarily
        obtained test results.
      summary: >-
        The two corrective processes stopped short of an institutional scientific withdrawal of BEOS. The government
        did not adopt the review committee's criticism as a final report, and Selvi did not specifically analyze BEOS.
        Later scholarship considers the judgment's reasoning applicable, while the current Maharashtra laboratory
        requires consent and frames BEOS as complementary to conventional investigation but continues to offer it and
        endorse the participation inference.
