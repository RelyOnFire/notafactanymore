term: Cardiomyocyte
aliases:
- cardiomyocytes
- cardiac muscle cell
- heart-muscle cell
shortDefinition: A specialized muscle cell of the heart that generates force for the heartbeat.
longDefinition: Cardiomyocytes are the contractile muscle cells that make up much of the heart's working muscle.
  Adult human cardiomyocytes can be replaced, but only slowly, which is why normal turnover does not provide enough
  regeneration to rebuild a large area destroyed by a major heart attack.
relatedTerms: []
reviewedAt: '2026-08-21'
sources:
