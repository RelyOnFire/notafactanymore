schemaVersion: 2
title: Chlorella algolization for water-body rehabilitation
proposition:
  summary: >-
    Russian national standards treated inoculating water bodies with cultivated planktonic Chlorella strains—a method
    called algolization—as a way to suppress cyanobacterial blooms and produce broad chemical, microbiological and
    ecological improvements.
correction:
  summary: >-
    The field evidence reviewed by Russian water researchers does not establish that seeding open reservoirs with
    selected Chlorella strains reliably suppresses cyanobacterial blooms or causes the broad improvements attributed to
    algolization. A federal trial was inconclusive, repeated applications lacked suitable controls or consistent effects,
    and later experimental work did not support the proposed competitive mechanism. Research on microalgae in engineered
    wastewater systems does not validate this open-water method: performance depends on the organism, culture mode,
    reactor design, wastewater and operating conditions.
category: Environment
reviewedAt: '2026-09-27'
impact:
  summary: >-
    Russian standards bodies gave a scientifically contested intervention official technical form after federal water
    authorities and a national hydrobiological society had rejected its evidentiary basis. The standards specify strains,
    doses, repeated inoculation and monitoring, and attribute effects ranging from bloom suppression and higher dissolved
    oxygen to fewer pathogens and improved water clarity. The dedicated 2025 standard covers drinking-water sources,
    recreational waters, fisheries waters and biological-treatment waters. That is consequential official endorsement,
    although Russian law generally makes national standards voluntary unless legislation or a public conformity claim
    gives them binding effect.
  highlights:
    - value: '2009'
      label: federal scientific council found the bloom-suppression proposal unsubstantiated and unconfirmed in practice
    - value: '2014'
      label: Hydrobiological Society congress called the method false and damaging to Russian hydrobiology
    - value: '2022'
      label: first Russian national standard codified algolization as water-body rehabilitation
    - value: 1 June 2025
      label: dedicated national Chlorella-algolization standard entered into force
  context:
    - >-
      The 2023 Water Resources review quotes a 2014 Federal Water Resources Agency letter reporting that its 2007 trial at
      the Tsimlyansk Reservoir produced ambiguous results and could not establish efficacy. The same letter reported that
      the agency's 2009 scientific-technical council found the proposal to use Chlorella against blooms scientifically
      unsubstantiated and unconfirmed by practice, and judged further research and development in that direction
      inadvisable.
    - >-
      The XI Congress of the Hydrobiological Society at the Russian Academy of Sciences adopted a 2014 decision calling
      the so-called algolization method false and damaging to Russian hydrobiology. The 2023 review also found no regular
      effect on phytoplankton across repeated reservoir applications, criticized the absence of suitable comparison
      waters, and reported later research that did not support the claimed mechanism.
    - >-
      GOST R 59977-2022 nevertheless prescribed algolization within a section on water-body rehabilitation and listed
      wide expected effects. GOST R 71946-2025 then created a dedicated 16-page standard. Its introduction acknowledges
      that the first large Penza Reservoir attempt in 1998 was ineffective, while section 4 still states that Chlorella
      inoculation reduces cyanobacteria, raises oxygen, removes odors, increases clarity and produces other benefits.
    - >-
      The correction is method-specific. Chlorella and other microalgae are studied in engineered wastewater systems,
      including ponds and photobioreactors, where performance varies with treatment design and operating conditions.
      Those systems are not evidence that small inoculations into complex natural reservoirs will establish themselves,
      outcompete cyanobacteria or deliver the standards' full set of claimed effects.
episodes:
  - id: russia-2022-2026
    polity: Russia
    region: Europe and Asia
    startYear: 2022
    endYear: 2026
    endOpen: true
    periodLabel: 2022–2026
    strength: officially-endorsed
    institutionTypes:
      - government
      - professional
    institutions:
      - Rosstandart (Federal Agency for Technical Regulation and Metrology)
      - Russian Institute for Standardization
      - Technical Committee 409 — Environmental Protection
    institutionalContext: >-
      National technical standardization supplied the endorsement. Rosstandart approved GOST R 59977-2022, whose section
      5 codified algolization within water-body rehabilitation. The private Innovative Environmental Fund (INEKO)
      developed the dedicated GOST R 71946-2025; Technical Committee 409 submitted it, and Rosstandart approved it by
      Order 59-st. The Russian Institute for Standardization published and catalogued the standard as active. Under
      Article 26 of Federal Law 162-FZ, this status does not by itself require every water manager to use the method.
    consequences:
      - A national standard formally defined algolization as water-body rehabilitation and bloom prevention
      - The 2022 standard specified a Chlorella strain, application rates, repeated seasonal inoculation and monitoring
      - The standards attributed broad chemical, microbiological and ecological benefits to the method
      - The dedicated 2025 standard covered drinking-water, recreational, fisheries and biological-treatment waters
      - The standards system retained and expanded the method after documented scientific and agency rejection
    summary: >-
      Russia gave Chlorella-based algolization national-standard status in GOST R 59977-2022 and then issued the dedicated
      GOST R 71946-2025. The documents specify how cultivated strains are to be introduced and describe the method as
      suppressing cyanobacteria and improving multiple water-quality measures. This endorsement followed an inconclusive
      federal trial, a negative federal scientific-council assessment and the Hydrobiological Society's formal rejection.
      The 2025 standard remained active at review, but national standards are generally voluntary unless another legal or
      conformity mechanism makes their application binding.
    mechanism:
      kind: standard-setting
      summary: >-
        Rosstandart's standards process converted a disputed commercial and technical practice into national
        specifications: approved organisms, production and safety requirements, application schedules, doses, monitoring
        and asserted outcomes.
    institutionalCorrection:
      status: uncorrected
      periodLabel: 2022–2026
      summary: >-
        No withdrawal or scientific correction by the issuing standards system is documented. Instead, the dedicated
        2025 standard reaffirmed and broadened the method after the earlier adverse assessments, and the official catalogue
        still listed it as active at review. Rejection by federal water scientists and the Hydrobiological Society shows
        institutional conflict, not correction by the standard-setting institutions in this episode.
